apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: compact-03

spec:
  hardware:
    providerRef: lab-libvirt
    profileRef: compact

    nics:
      - name: enp1s0

  os:
    clusterInstalled: {}

  network:
    configRef: lab-guests
    installAddressRef: ip

    addresses:
      - name: fqdn
        address: compact-03.{{ .Values.host.domain }}

      - name: ip
        address: {{ index .Values.guest.addresses 2 }}
        interface: enp1s0
