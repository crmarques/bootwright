{{- if not .Values.single }}
apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: nv-vlan

spec:
  substrate:
    providerRef: lab-libvirt
    libvirt:
      profileRef: rhel

      nics:
        - nicRef: nic0
          segmentRef: nv-trunk

  hardware:
    nics:
      - name: nic0

    rootDevice:
      deviceName: /dev/vda

  os:
    provided: false
    installProfileRef: rhel

    install:
      ntp:
        - serverRef: lab-ntp
          endpointRef: ip

  network:
    configRef: nv-vlan
    installAddressRef: ip

    addresses:
      - name: fqdn
        address: nv-vlan.{{ .Values.host.domain }}

      - name: ip
        address: {{ .Values.vlan.address }}
        interface: nic0.{{ .Values.vlan.id }}

      - name: guest
        address: {{ .Values.converge.vlanAddress }}
        interface: nic0.{{ .Values.converge.vlanId }}

    overrides:
      interfaces:
        - name: nic0.{{ .Values.converge.vlanId }}
          mtu: {{ .Values.converge.mtu }}
{{- end }}
