{{- if not .Values.single }}
apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: nv-vlan-bond

spec:
  hardware:
    providerRef: lab-libvirt
    profileRef: rhel

    nics:
      - name: nic0
        segmentRef: nv-trunk

      - name: nic1
        segmentRef: nv-trunk

  os:
    install:
      profileRef: rhel

      ntp:
        - serverRef: lab-ntp
          endpointRef: ip

  network:
    configRef: nv-vlan-bond
    installAddressRef: ip

    addresses:
      - name: fqdn
        address: nv-vlan-bond.{{ .Values.host.domain }}

      - name: ip
        address: {{ .Values.vlanBond.address }}
        interface: bond0.{{ .Values.vlanBond.id }}

      - name: guest
        address: {{ .Values.converge.vlanBondAddress }}
        interface: bond0.{{ .Values.converge.vlanId }}

    overrides:
      interfaces:
        - name: bond0.{{ .Values.converge.vlanId }}
          mtu: {{ .Values.converge.mtu }}
{{- end }}
