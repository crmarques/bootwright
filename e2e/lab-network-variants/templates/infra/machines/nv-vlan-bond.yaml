{{- if not .Values.single }}
apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: nv-vlan-bond

spec:
  substrate:
    providerRef: lab-libvirt
    libvirt:
      profileRef: rhel

  hardware:
    rootDevice:
      deviceName: /dev/vda

  os:
    provided: false
    installProfileRef: rhel

    install:
      ntp:
        - serverRef: lab-ntp
          endpointRef: ip

  network:
    configRef: nv-vlan-bond
    attachmentRef: nv-trunk
    installAddressRef: ip

    addresses:
      - name: fqdn
        address: nv-vlan-bond.{{ .Values.host.domain }}

      - name: ip
        address: {{ .Values.vlanBond.address }}/{{ .Values.host.prefix }}
        interface: bond0.{{ .Values.vlanBond.id }}

      - name: guest
        address: {{ .Values.converge.vlanBondAddress }}/{{ .Values.converge.prefix }}
        interface: bond0.{{ .Values.converge.vlanId }}

    overrides:
      interfaces:
        - name: bond0.{{ .Values.converge.vlanId }}
          mtu: {{ .Values.converge.mtu }}
{{- end }}
