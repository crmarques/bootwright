apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: nv-bond

spec:
  substrate:
    providerRef: lab-libvirt
    libvirt:
      profileRef: rhel

      nics:
        - nicRef: nic0
          attachmentRef: nv-lab

        - nicRef: nic1
          attachmentRef: nv-lab

  hardware:
    nics:
      - name: nic0
      - name: nic1

    rootDevice:
      deviceName: /dev/vda

  os:
    provided: false
    installProfileRef: rhel

    install:
      ntp:
        - serverRef: lab-ntp
          endpointRef: ip

  network:
    configRef: nv-bond
    installAddressRef: ip

    addresses:
      - name: fqdn
        address: nv-bond.{{ .Values.host.domain }}

      - name: ip
        address: {{ .Values.bond.address }}/{{ .Values.host.prefix }}
        interface: bond0

      - name: guest
        address: {{ .Values.converge.bondAddress }}/{{ .Values.converge.prefix }}
        interface: bond0.{{ .Values.converge.vlanId }}

    overrides:
      interfaces:
        - name: bond0.{{ .Values.converge.vlanId }}
          mtu: {{ .Values.converge.mtu }}
