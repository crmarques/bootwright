apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: nv-bond

spec:
  hardware:
    providerRef: lab-libvirt
    profileRef: rhel

    nics:
      - name: nic0
        segmentRef: nv-lab

      - name: nic1
        segmentRef: nv-lab

  os:
    install:
      profileRef: rhel

      ntp:
        - serverRef: lab-ntp
          endpointRef: ip

  network:
    configRef: nv-bond
    installAddressRef: ip

    addresses:
      - name: fqdn
        address: nv-bond.{{ .Values.host.domain }}

      - name: ip
        address: {{ .Values.bond.address }}
        interface: bond0

      - name: guest
        address: {{ .Values.converge.bondAddress }}
        interface: bond0.{{ .Values.converge.vlanId }}

    overrides:
      interfaces:
        - name: bond0.{{ .Values.converge.vlanId }}
          mtu: {{ .Values.converge.mtu }}
