apiVersion: bootwright.io/v1alpha1
kind: InfraProvider
metadata:
  name: lab-libvirt

spec:
  libvirt:
    capacityReserve:
      cpu: 1
      memoryMiB: 2048
      diskGiB: 10

    machineRef: controller

    bmcEmulation:
      bindAddress: 127.0.0.1
      port: 8000
      certificateRef: lab-bmc-tls

      auth:
        credentialsRef: lab-bmc-credentials

    machineProfiles:
      - name: rhel
        cpu: {{ .Values.guest.cpu }}
        memoryMiB: {{ .Values.guest.memoryMiB }}
        diskGiB: {{ .Values.guest.diskGiB }}
        tpm: {}
{{- if not .Values.single }}

  networkAttachments:
    - name: nv-trunk

      libvirt:
        bridge: {{ .Values.externalBridge }}
{{- end }}
