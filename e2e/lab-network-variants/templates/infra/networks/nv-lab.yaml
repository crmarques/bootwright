apiVersion: bootwright.io/v1alpha1
kind: Network
metadata:
  name: nv-lab

spec:
  provided: false
  description: The untagged network lab-libvirt defines on its host.

  ipv4:
    cidr: {{ .Values.host.cidr }}
    gateway: {{ .Values.host.gateway }}

  libvirt:
    providerRef: lab-libvirt
    bridge: {{ .Values.host.bridge }}

    taggedNetworkRefs:
      - nv-guest
