{{/*
Five RHEL guests simulating three sites (dc1: ceph-01 ceph-02, dc2: ceph-03
ceph-04, dc3: arbiter-01) under one Ceph cluster.

Case stretch installs all five in one context (e2e-stretch).

Cases stretch-arbiter and stretch-ceph split them over two contexts that share
one libvirt bridge on this host. Core Ceph refuses a provided-OS host until
B882, so stretch-ceph does not apply yet.

stretch-arbiter (context e2e-stretch-arbiter) installs only arbiter-01 and
owns the managed libvirt network. Its DNS, NTP and proxy are the ones the
stretch-ceph context manages, so they are external here; its artifact server
and emulated BMC use 8444, 8081 and 8001 beside the other context's 8443,
8080 and 8000.

stretch-ceph (context e2e-stretch-ceph) manages the services, installs
ceph-01..04, attaches to the arbiter context's bridge as an external bridge
and declares arbiter-01 as a provided Machine it logs in to with the
arbiter-access-key Secret (e2e/README.md has the handoff). Guest n is
firstGuest + n: ceph-01..04 are guests 51..54, arbiter-01 is guest 55.
*/}}
{{- if has .Values.case (list "stretch" "stretch-arbiter" "stretch-ceph") }}
{{- $single := eq .Values.case "stretch" }}
{{- $v := .Values }}
{{- $c := $v.ceph }}
{{- $size := $v.sizes.stretch }}
{{- $cluster := "ceph-stretch" }}
{{- $packages := list "podman" "lvm2" "python3" }}
{{- $repositories := list (dict "id" "ibm-storage-ceph-9" "displayName" "IBM Storage Ceph 9 packages" "baseURL" "https://public.dhe.ibm.com/ibmdl/export/pub/storage/ceph/9/rhel9/x86_64/" "gpgCheck" true "gpgKeyURL" "https://public.dhe.ibm.com/ibmdl/export/pub/storage/ceph/RPM-GPG-KEY-IBM-CEPH") }}
{{- if eq .Values.case "stretch-arbiter" }}
{{- $profile := dict "name" "stretch-arbiter" "cpu" (int $size.cpu) "memoryMiB" (int $size.memoryMiB) "diskGiB" (int $size.diskGiB) }}
{{ include "e2e.environment" (dict "root" $ "sites" (list (dict "name" "dc3"))) }}
{{ include "e2e.controller" $ }}
{{ include "e2e.services" (dict "root" $ "external" true "httpsPort" 8444 "httpPort" 8081) }}
{{ include "e2e.provider" (dict "root" $ "profiles" (list $profile) "bmcPort" 8001) }}
{{ include "e2e.networkConfig" (dict "root" $ "external" true) }}
{{ include "e2e.rhelProfile" (dict "root" $ "packages" $packages "repositories" $repositories "externalServices" true) }}
{{ include "e2e.rhelMachine" (dict "root" $ "name" "arbiter-01" "n" 55 "profile" "stretch-arbiter" "site" "dc3") }}
{{ include "e2e.secrets" (dict "root" $) }}
{{- else }}
{{- $disks := list (dict "name" "ceph-data" "sizeGiB" (int $size.osdDiskGiB) "media" "ssd") }}
{{- $profile := dict "name" "stretch-data" "cpu" (int $size.cpu) "memoryMiB" (int $size.memoryMiB) "diskGiB" (int $size.diskGiB) "dataDisks" $disks }}
{{- $profiles := list $profile }}
{{- if $single }}
{{- $profiles = append $profiles (dict "name" "stretch-arbiter" "cpu" (int $size.cpu) "memoryMiB" (int $size.memoryMiB) "diskGiB" (int $size.diskGiB)) }}
{{- end }}
{{- $data := list (dict "name" "ceph-01" "n" 51 "site" "dc1") (dict "name" "ceph-02" "n" 52 "site" "dc1") (dict "name" "ceph-03" "n" 53 "site" "dc2") (dict "name" "ceph-04" "n" 54 "site" "dc2") }}
{{ include "e2e.environment" (dict "root" $ "sites" (list (dict "name" "dc1") (dict "name" "dc2") (dict "name" "dc3"))) }}
{{ include "e2e.controller" $ }}
{{ include "e2e.services" (dict "root" $) }}
{{ include "e2e.provider" (dict "root" $ "profiles" $profiles "bridge" (ternary "managed" "external" $single)) }}
{{ include "e2e.networkConfig" $ }}
{{ include "e2e.rhelProfile" (dict "root" $ "packages" $packages "repositories" $repositories) }}
{{- range $data }}
{{ include "e2e.rhelMachine" (dict "root" $ "name" .name "n" .n "profile" "stretch-data" "site" .site) }}
{{- end }}
{{- if $single }}
{{ include "e2e.rhelMachine" (dict "root" $ "name" "arbiter-01" "n" 55 "profile" "stretch-arbiter" "site" "dc3") }}
{{- else }}
{{ include "e2e.rhelMachine" (dict "root" $ "name" "arbiter-01" "n" 55 "site" "dc3" "os" "provided" "accessKeyRef" "arbiter-access-key") }}
{{- end }}
{{ include "e2e.secrets" (dict "root" $) }}
{{- if not $single }}
---
# bw-path: secret-descriptors/arbiter-access-key.yaml
apiVersion: bootwright.io/v1alpha1
kind: Secret
metadata:
  name: arbiter-access-key

spec:
  type: sshKeyPair

  source:
    contextStore: {}
{{- end }}
---
# bw-path: secret-descriptors/ceph-cluster-key.yaml
apiVersion: bootwright.io/v1alpha1
kind: Secret
metadata:
  name: ceph-cluster-key

spec:
  type: sshKeyPair

  source:
    generated:
      keyType: {{ if $v.security.fips }}ecdsaP256{{ else }}ed25519{{ end }}
      comment: ceph-cluster-key
---
# bw-path: secret-descriptors/ibm-registry.yaml
apiVersion: bootwright.io/v1alpha1
kind: Secret
metadata:
  name: ibm-registry

spec:
  type: usernamePassword

  source:
    contextStore: {}
---
# bw-path: storage/entitlement.yaml
apiVersion: bootwright.io/v1alpha1
kind: Entitlement
metadata:
  name: ibm-ceph

spec:
  type: ibmStorageCeph

  registry:
    url: cp.icr.io
    credentialsRef: ibm-registry

  license:
    accept: true
---
# bw-path: storage/cluster.yaml
# Native stretch mode (topology.stretch) is deferred to B486, so the sites
# are only placement and the arbiter is a mon-only node, not a tiebreaker.
apiVersion: bootwright.io/v1alpha1
kind: CephCluster
metadata:
  name: {{ $cluster }}

spec:
  management: managed

  distribution:
    ibm:
      callHome: enabled

      packages:
        source: vendor

  release: {{ $c.release }}
  packageVersion: {{ $c.packageVersion }}

  image:
    base: {{ $c.image.base }}
    version: {{ $c.image.version }}

  entitlementRef: ibm-ceph

  cephadm:
    addressRef: ip

    ansible:
      packageVersion: {{ $c.ansiblePackageVersion }}

    clusterSSH:
      user: bootwright
      keyRef: ceph-cluster-key
      transport: verifiedTunnel

    bootstrap:
      nodeRef: ceph-01
      addressRef: ip

  networks:
    publicCIDRs:
      - {{ $v.host.network.cidr }}

  config:
    global:
      osd_pool_default_size: '2'
      osd_pool_default_min_size: '2'

    osd:
      osd_memory_target_autotune: 'false'
      osd_memory_target: '2147483648'

  services:
    - service_type: mon

      placement:
        count: 5
        label: ceph-mon

    - service_type: mgr

      placement:
        count: 2
        label: ceph-data

    - service_type: osd
      service_id: data

      placement:
        label: ceph-data

      spec:
        data_devices:
          paths:
            - /dev/sda

  topology:
    nodes:
{{- range $data }}
      - name: {{ .name }}
        fqdn: {{ .name }}.{{ $v.host.domain }}
        machineRef: {{ .name }}
        site: {{ .site }}

        labels:
          - ceph-mon
          - ceph-data
{{ end }}
      - name: arbiter-01
        fqdn: arbiter-01.{{ $v.host.domain }}
        machineRef: arbiter-01
        site: dc3

        labels:
          - ceph-mon
---
# bw-path: storage/pool-rbd-data.yaml
apiVersion: bootwright.io/v1alpha1
kind: CephPool
metadata:
  name: rbd-data

spec:
  clusterRef: {{ $cluster }}
  role: rbd

  replicated:
    size: 2
    minSize: 2

  autoscale:
    mode: 'on'
---
# bw-path: storage/rbd-image.yaml
apiVersion: bootwright.io/v1alpha1
kind: CephRBDImage
metadata:
  name: rbd-disk

spec:
  clusterRef: {{ $cluster }}
  poolRef: rbd-data
  sizeBytes: 1073741824
---
# bw-path: storage/client-rbd-canary.yaml
apiVersion: bootwright.io/v1alpha1
kind: CephClient
metadata:
  name: rbd-canary

spec:
  clusterRef: {{ $cluster }}
  poolRef: rbd-data
  access: readWrite
{{- end }}
{{- end }}
