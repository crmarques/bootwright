{{- if eq .Values.case "sno" }}
{{- $size := .Values.sizes.sno }}
{{- $packages := list }}
{{- if .Values.addons.sno.nmstate }}{{- $packages = append $packages "nmstate" }}{{- end }}
{{- if .Values.addons.sno.metallb }}{{- $packages = append $packages "metallb" }}{{- end }}
{{ include "e2e.environment" (dict "root" $) }}
{{ include "e2e.controller" $ }}
{{ include "e2e.services" (dict "root" $) }}
{{ include "e2e.provider" (dict "root" $ "profiles" (list (merge (dict "name" "sno") $size))) }}
{{ include "e2e.networkConfig" $ }}
{{ include "e2e.ocpMachine" (dict "root" $ "name" "sno-01" "n" 21 "profile" "sno") }}
{{ include "e2e.ocpCluster" (dict "root" $ "name" "sno" "nodes" (list "sno-01")) }}
{{ include "e2e.ocpSecrets" (dict "root" $ "cluster" "sno") }}
{{ include "e2e.secrets" (dict "root" $) }}
{{- if $packages }}
{{ include "e2e.ocpAddons" (dict "root" $ "cluster" "sno" "packages" $packages) }}
{{- end }}
{{- end }}
