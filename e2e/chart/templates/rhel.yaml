{{- if eq .Values.case "rhel" }}
{{- $size := .Values.sizes.rhel }}
{{ include "e2e.environment" (dict "root" $) }}
{{ include "e2e.controller" $ }}
{{ include "e2e.services" (dict "root" $) }}
{{ include "e2e.provider" (dict "root" $ "profiles" (list (merge (dict "name" "rhel") $size))) }}
{{ include "e2e.networkConfig" $ }}
{{ include "e2e.rhelProfile" (dict "root" $ "security" true "registration" true) }}
{{ include "e2e.rhelMachine" (dict "root" $ "name" "rhel-01" "n" 1 "profile" "rhel") }}
{{ include "e2e.secrets" (dict "root" $) }}
{{- end }}
