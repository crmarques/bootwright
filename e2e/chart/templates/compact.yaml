{{- if eq .Values.case "compact" }}
{{- $size := .Values.sizes.compact }}
{{- $packages := list }}
{{- if .Values.addons.compact.metallb }}{{- $packages = append $packages "metallb" }}{{- end }}
{{ include "e2e.environment" (dict "root" $) }}
{{ include "e2e.controller" $ }}
{{ include "e2e.services" (dict "root" $) }}
{{ include "e2e.provider" (dict "root" $ "profiles" (list (merge (dict "name" "compact") $size))) }}
{{ include "e2e.networkConfig" $ }}
{{ include "e2e.ocpMachine" (dict "root" $ "name" "compact-01" "n" 31 "profile" "compact") }}
{{ include "e2e.ocpMachine" (dict "root" $ "name" "compact-02" "n" 32 "profile" "compact") }}
{{ include "e2e.ocpMachine" (dict "root" $ "name" "compact-03" "n" 33 "profile" "compact") }}
{{ include "e2e.ocpCluster" (dict "root" $ "name" "compact" "vip" true "apiGuest" 40 "ingressGuest" 41 "nodes" (list "compact-01" "compact-02" "compact-03")) }}
{{ include "e2e.ocpSecrets" (dict "root" $ "cluster" "compact") }}
{{ include "e2e.secrets" (dict "root" $) }}
{{- if $packages }}
{{ include "e2e.ocpAddons" (dict "root" $ "cluster" "compact" "packages" $packages) }}
{{- end }}
{{- end }}
