# Default input of the lab-baremetal-rehearsal case. Override keys with
# e2e/render.sh --set or a --values file.

host:
  # The controller address the managed services bind and the guest reaches;
  # "auto" takes this host's default-route source address at render time.
  address: auto
  domain: e2e.example.test

  upstreamDNS:
    - 1.1.1.1

  upstreamNTP:
    - 162.159.200.1

  # The NAT network the substrate context creates for the guest.
  bridge: virbr-e2e
  cidr: 198.51.100.0/24
  gateway: 198.51.100.1
  prefix: 24

# Media names as added with `bootwright media add --name`.
rhel:
  version: "9.8"
  bootMedia: rhel-9.8-x86_64-boot.iso
  dvdMedia: rhel-9.8-x86_64-dvd.iso

# The emulated server the substrate context creates: one installer-provisioned
# guest of 4 vCPU and 8 GiB, behind an emulated Redfish BMC on loopback.
guest:
  cpu: 4
  memoryMiB: 8192
  diskGiB: 60
  bmcPort: 8000

# What the install context declares about that server. The defaults only
# validate: after the substrate context realizes the guest, render again with
# the guest's real Redfish system URL and NIC MAC address from `machine info`
# and the BMC's Systems collection (see the runbook).
install:
  address: 198.51.100.11
  nicName: eno1
  nicMAC: 52:54:00:00:00:01
  systemURL: https://127.0.0.1:8000/redfish/v1/Systems/00000000-0000-0000-0000-000000000001
