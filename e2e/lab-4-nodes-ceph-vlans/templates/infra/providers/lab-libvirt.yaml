{{- $ceph := .Values.guest.ceph -}}
{{- $app := .Values.guest.app -}}
apiVersion: bootwright.io/v1alpha1
kind: InfraProvider
metadata:
  name: lab-libvirt

spec:
  libvirt:
    capacityReserve:
      cpu: 1
      memoryMiB: 2048
      diskGiB: 10

    machineRef: controller

    bmcEmulation:
      bindAddress: 127.0.0.1
      port: 8000
      certificateRef: lab-bmc-tls

      auth:
        credentialsRef: lab-bmc-credentials

    machineProfiles:
      - name: ceph
        cpu: {{ $ceph.cpu }}
        memoryMiB: {{ $ceph.memoryMiB }}
        diskGiB: {{ $ceph.diskGiB }}
        tpm: {}

        dataDisks:
          - name: ceph-data-1
            sizeGiB: {{ $ceph.osdDiskGiB }}
            media: ssd

      - name: app
        cpu: {{ $app.cpu }}
        memoryMiB: {{ $app.memoryMiB }}
        diskGiB: {{ $app.diskGiB }}
        tpm: {}

  segments:
    - name: ceph-trunk
      mtu: {{ .Values.fabric.cephTrunkMTU }}

      taggedNetworkRefs:
        - ceph-public
        - ceph-cluster

      libvirt:
        bridge: {{ .Values.fabric.cephBridge }}

    - name: user-lan
      untaggedNetworkRef: app-users

      libvirt:
        bridge: {{ .Values.fabric.userBridge }}
