{{- $pub := .Values.networks.cephPublic -}}
apiVersion: bootwright.io/v1alpha1
kind: NetworkConfig
metadata:
  name: app

spec:
  dns:
    - serverRef: lab-dns
      endpointRef: ip

  nmstate:
    interfaces:
      - name: nic0
        type: ethernet
        state: up
        mtu: 1500

        ipv4:
          enabled: false

        ipv6:
          enabled: false

      - name: nic0.{{ $pub.vlan }}
        type: vlan
        state: up
        mtu: 1500

        vlan:
          base-iface: nic0
          id: {{ $pub.vlan }}

        ipv4:
          enabled: true
          dhcp: false

        ipv6:
          enabled: false

      - name: nic1
        type: ethernet
        state: up
        mtu: 1500

        ipv4:
          enabled: true
          dhcp: false

        ipv6:
          enabled: false

    dns-resolver:
      config:
        search:
          - {{ .Values.host.domain }}

    routes:
      config:
        - destination: 0.0.0.0/0
          next-hop-address: {{ $pub.gateway }}
          next-hop-interface: nic0.{{ $pub.vlan }}
          table-id: 254
          metric: 100
