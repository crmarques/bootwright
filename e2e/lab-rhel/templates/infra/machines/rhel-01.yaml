apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: rhel-01

spec:
  hardware:
    providerRef: lab-libvirt
    profileRef: rhel

    nics:
      - name: enp1s0

  os:
    install:
      profileRef: rhel

  network:
    configRef: lab-guests
    installAddressRef: ip

    addresses:
      - name: fqdn
        address: rhel-01.{{ .Values.host.domain }}

      - name: ip
        address: {{ .Values.guest.address }}
        interface: enp1s0
