{{- $net := ternary .Values.networks.ipv6 .Values.networks.ipv4 .Values.ipv6 }}
apiVersion: bootwright.io/v1alpha1
kind: Network
metadata:
  name: lab-guests

spec:
  provided: false
  description: The guest network lab-libvirt defines on its host, NAT for IPv4 and isolated for IPv6.
{{- if .Values.ipv6 }}

  ipv6:
    cidr: {{ $net.cidr }}
    gateway: {{ $net.gateway }}
{{- else }}

  ipv4:
    cidr: {{ $net.cidr }}
    gateway: {{ $net.gateway }}
{{- end }}

  libvirt:
    providerRef: lab-libvirt
    bridge: {{ .Values.host.bridge }}
    forward: {{ if .Values.ipv6 }}none{{ else }}nat{{ end }}
