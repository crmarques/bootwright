{{- $net := ternary .Values.networks.ipv6 .Values.networks.ipv4 .Values.ipv6 }}
apiVersion: bootwright.io/v1alpha1
kind: InfraProvider
metadata:
  name: lab-libvirt

spec:
  libvirt:
    capacityReserve:
      cpu: 4
      memoryMiB: 8192
      diskGiB: 40

    machineRef: controller

    bmcEmulation:
      bindAddress: 127.0.0.1
      port: 8000
      certificateRef: lab-bmc-tls

      auth:
        credentialsRef: lab-bmc-credentials

    machineProfiles:
      - name: master
        cpu: {{ .Values.guest.cpu }}
        memoryMiB: {{ .Values.guest.memoryMiB }}
        diskGiB: {{ .Values.guest.diskGiB }}
        tpm: {}

  networkAttachments:
    - name: lab-guests

      libvirt:
        bridge: {{ .Values.host.bridge }}
        management: managed
        address: {{ $net.gateway }}/{{ $net.prefix }}
        forward: {{ if .Values.ipv6 }}none{{ else }}nat{{ end }}
