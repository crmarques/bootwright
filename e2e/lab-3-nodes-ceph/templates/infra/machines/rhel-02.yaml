apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: rhel-02

spec:
  substrate:
    providerRef: lab-libvirt
    libvirt:
      profileRef: ceph

  hardware:
    rootDevice:
      deviceName: /dev/vda

  os:
    provided: false
    installProfileRef: rhel

  network:
    configRef: lab-guests
    installAddressRef: ip

    addresses:
      - name: fqdn
        address: rhel-02.{{ .Values.host.domain }}

      - name: ip
        address: {{ index .Values.guest.addresses 1 }}/{{ .Values.host.prefix }}
        interface: enp1s0
