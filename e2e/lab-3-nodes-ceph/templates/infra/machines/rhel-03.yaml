apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: rhel-03

spec:
  hardware:
    providerRef: lab-libvirt
    profileRef: ceph

    nics:
      - name: enp1s0

  os:
    install:
      profileRef: rhel

  firewall:
    ssh:
      allowedSources:
        - machine:
            machineRef: controller
            addressRef: guest-ssh
        - machine:
            machineRef: rhel-01
            addressRef: ip
        - machine:
            machineRef: rhel-02
            addressRef: ip
        - machine:
            machineRef: rhel-03
            addressRef: ip

  network:
    configRef: lab-guests
    installAddressRef: ip

    addresses:
      - name: fqdn
        address: rhel-03.{{ .Values.host.domain }}

      - name: ip
        address: {{ index .Values.guest.addresses 2 }}
        interface: enp1s0
