{{- if .Values.ceph.services.file }}
apiVersion: bootwright.io/v1alpha1
kind: CephFilesystem
metadata:
  name: files

spec:
  clusterRef: ceph-e2e
  metadataPoolRef: cephfs-metadata

  dataPoolRefs:
    - cephfs-data

  mds:
    activeCount: 1
    standbyCountWanted: 1
    standbyReplay: false

  subvolumeGroups:
    - name: apps
      mode: '750'
{{- end }}
