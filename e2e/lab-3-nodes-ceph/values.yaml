# Default input of the lab-3-nodes-ceph case. Override keys with e2e/render.sh
# --set or a --values file.

host:
  # The controller address the managed services bind and the guests reach;
  # "auto" takes this host's default-route source address at render time.
  address: auto
  domain: e2e.example.test

  upstreamDNS:
    - 1.1.1.1

  upstreamNTP:
    - 162.159.200.1

  # The NAT network Bootwright creates for the guests.
  bridge: virbr-e2e
  cidr: 198.51.100.0/24
  gateway: 198.51.100.1
  prefix: 24

# Media names as added with `bootwright media add --name`.
rhel:
  version: "9.8"
  bootMedia: rhel-9.8-x86_64-boot.iso
  dvdMedia: rhel-9.8-x86_64-dvd.iso

# rhel-01 to rhel-03, in this order. Each guest gets osdDisks virtual SSDs of
# osdDiskGiB GiB (at most 7), one OSD each.
guest:
  addresses:
    - 198.51.100.11
    - 198.51.100.12
    - 198.51.100.13

  cpu: 4
  memoryMiB: 8192
  diskGiB: 40
  osdDisks: 1
  osdDiskGiB: 30

# IBM Storage Ceph. A release moves these together: release, packageVersion,
# ansiblePackageVersion, image, callHome and the auxiliary images below.
ceph:
  release: 9.9.2.0
  packageVersion: 20.2.2-349.el9cp
  ansiblePackageVersion: 5.0.3-1.el9cp

  # enabled for 20.2.x builds (9.9.1.2, 9.9.2.0); disabled for 20.1.0-221
  # (9.9.0.3), whose Call Home is opt-in.
  callHome: enabled

  image:
    base: cp.icr.io/cp/ibm-ceph/ceph-9-rhel10
    version: v9.9.2-26947

  # The guests' package repository for the release's RPMs.
  repository:
    id: ibm-storage-ceph-9
    displayName: IBM Storage Ceph 9 packages
    baseURL: https://public.dhe.ibm.com/ibmdl/export/pub/storage/ceph/9/rhel9/x86_64/
    gpgKeyURL: https://public.dhe.ibm.com/ibmdl/export/pub/storage/ceph/RPM-GPG-KEY-IBM-CEPH

  # Each service group may be switched off to save memory. nfs and smb export
  # CephFS subvolumes, so they render only with file. nvmeof needs AVX-512 on
  # the host CPU.
  services:
    block: true
    file: true
    object: true
    nfs: true
    smb: true
    observability: true
    nvmeof: false

  # The object ingress and the management gateway VIPs, inside host.cidr and
  # outside every guest. Neither has a DNS record.
  objectVIP: 198.51.100.60
  managementVIP: 198.51.100.62

  # Auxiliary images, authored as digests of the build above (D171). Move them
  # together with ceph.image. Each digest must identify the linux/amd64
  # platform manifest. `skopeo inspect` reports the digest of the reference's
  # top-level manifest, which for a multi-platform image is the image index; an
  # index digest is refused as image-digest-mismatch. Read the index with
  # `skopeo inspect --raw docker://BASE@DIGEST`, take the digest of its
  # linux/amd64 entry, and confirm that manifest's sha256 over its raw bytes.
  images:
    haproxy:
      base: cp.icr.io/cp/ibm-ceph/haproxy-rhel10
      version: sha256:90a29584b593eac133a844ec4f94c7f7d83d127936c91cab0b088e765ed5dad9

    keepalived:
      base: cp.icr.io/cp/ibm-ceph/keepalived-rhel10
      version: sha256:ed18865b7c22051db1166e3df3de38effe225244b0bab32dcee429bb7b43f5db

    samba:
      base: cp.icr.io/cp/ibm-ceph/samba-server-rhel10
      version: sha256:e91653798ca356348b4b60deac6a8683da885fed583753948cb5a7028527c407

    samba_metrics:
      base: cp.icr.io/cp/ibm-ceph/samba-metrics-rhel10
      version: sha256:57f54c5a21fe98dba6fd4904a4fe1fe6a78e1d6ddbd241050c9e6313ac2f3944

    prometheus:
      base: cp.icr.io/cp/ibm-ceph/prometheus
      version: sha256:6483d0ca844408e25a0477bf8f0b2ba46105202a080fcf550ee9933189741bf2

    alertmanager:
      base: cp.icr.io/cp/ibm-ceph/prometheus-alertmanager
      version: sha256:f5e59e1d0b66178b76afddbd02b75aabe89e2571fd4f642444587fd1dfa6b1ed

    grafana:
      base: cp.icr.io/cp/ibm-ceph/grafana-rhel10
      version: sha256:05b7009e0a5d794d035ab2d3fd06df767de62c2b57626f2f543885ee24664476

    node_exporter:
      base: cp.icr.io/cp/ibm-ceph/prometheus-node-exporter
      version: sha256:7ff1de3e3c05df351d86f9b3f1ed143442999602a3668ad513dfcb5436ebb756

    nginx:
      base: cp.icr.io/cp/ibm-ceph/nginx-126-rhel10
      version: sha256:36372e03d80249571aeaf0bcca29cc9ae0abc8ae1dd82511dee41b9faee39415

    loki:
      base: cp.icr.io/cp/ibm-ceph/logging-loki-rhel8
      version: sha256:3a7aa2e879bed7384485c16ac51d788fd3e60bf06e2c927e8cde4401be46e443

    alloy:
      base: cp.icr.io/cp/ibm-ceph/alloy-rhel10
      version: sha256:639f6c719715f4c2b2ddfa467adbe41518a32f155739bb4ba1b70fd8992e521a

    nvmeof:
      base: cp.icr.io/cp/ibm-ceph/nvmeof-rhel10
      version: sha256:fe193a06ca2e76140a991deb9236edd8c1c49e5b9df1539daeac9ba035c29052
