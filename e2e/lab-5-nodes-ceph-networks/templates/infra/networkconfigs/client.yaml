{{- $user := .Values.networks.user -}}
apiVersion: bootwright.io/v1alpha1
kind: NetworkConfig
metadata:
  name: client

spec:
  dns:
    - serverRef: lab-dns
      endpointRef: ip

  nmstate:
    interfaces:
      - name: nic0
        type: ethernet
        state: up
        mtu: 1500

        ipv4:
          enabled: true
          dhcp: false

        ipv6:
          enabled: false

    dns-resolver:
      config:
        search:
          - {{ .Values.host.domain }}

    routes:
      config:
        - destination: 0.0.0.0/0
          next-hop-address: {{ $user.gateway }}
          next-hop-interface: nic0
          table-id: 254
          metric: 100
