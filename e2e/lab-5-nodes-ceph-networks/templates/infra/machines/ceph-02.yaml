{{- $node := index .Values.guest.ceph.nodes 1 -}}
apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: ceph-02

spec:
  hardware:
    providerRef: lab-libvirt
    profileRef: ceph

    nics:
      - name: nic0
        segmentRef: ceph-public

  os:
    install:
      profileRef: rhel

  network:
    configRef: ceph-node
    installAddressRef: ip

    addresses:
      - name: fqdn
        address: ceph-02.{{ .Values.host.domain }}

      - name: ip
        address: {{ $node.public }}
        interface: nic0

      - name: cluster
        address: {{ $node.cluster }}
        interface: nic0.{{ .Values.networks.cephCluster.vlan }}
