apiVersion: bootwright.io/v1alpha1
kind: InfraProvider
metadata:
  name: lab-libvirt

spec:
  libvirt:
    machineRef: controller

    capacityReserve:
      cpu: 1
      memoryMiB: 4096
      diskGiB: 10

    bmcEmulation:
      bindAddress: 127.0.0.1
      port: 8000
      certificateRef: lab-bmc-tls

      auth:
        credentialsRef: lab-bmc-credentials

    machineProfiles:
{{- range $i, $node := .Values.guest.nodes }}
      - name: rhel-0{{ add $i 1 }}
        cpu: {{ $.Values.guest.cpu }}
        memoryMiB: {{ $node.memoryMiB }}
        diskGiB: {{ $.Values.guest.diskGiB }}
        tpm: {}

        dataDisks:
          - name: ceph-data
            sizeGiB: {{ $.Values.guest.osdDiskGiB }}
            media: ssd
{{ end }}
  networkAttachments:
    - name: lab-guests

      libvirt:
        bridge: {{ .Values.host.bridge }}
        management: managed
        address: {{ .Values.host.gateway }}/{{ .Values.host.prefix }}
        forward: nat
