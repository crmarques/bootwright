apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: rhel-01

spec:
  substrate:
    providerRef: lab-libvirt
    libvirt:
      profileRef: rhel-01

  hardware:
    rootDevice:
      deviceName: /dev/vda

  os:
    provided: false
    installProfileRef: rhel

    install:
      ntp:
        - serverRef: lab-ntp
          endpointRef: ip

  network:
    configRef: lab-guests
    attachmentRef: lab-guests
    installAddressRef: ip

    addresses:
      - name: fqdn
        address: rhel-01.{{ .Values.host.domain }}

      - name: ip
        address: {{ (index .Values.guest.nodes 0).address }}/{{ .Values.host.prefix }}
        interface: bond0

      - name: cluster
        address: {{ (index .Values.guest.nodes 0).clusterAddress }}/{{ .Values.clusterNetwork.prefix }}
        interface: bond0.{{ .Values.clusterNetwork.vlan }}
