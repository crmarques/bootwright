apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: rhel-02

spec:
  hardware:
    providerRef: lab-libvirt
    profileRef: rhel-02

    nics:
      - name: nic0
      - name: nic1

  os:
    install:
      profileRef: rhel

      ntp:
        - serverRef: lab-ntp
          endpointRef: ip

  network:
    configRef: lab-guests
    installAddressRef: ip

    addresses:
      - name: fqdn
        address: rhel-02.{{ .Values.host.domain }}

      - name: ip
        address: {{ (index .Values.guest.nodes 1).address }}
        interface: bond0

      - name: cluster
        address: {{ (index .Values.guest.nodes 1).clusterAddress }}
        interface: bond0.{{ .Values.clusterNetwork.vlan }}
