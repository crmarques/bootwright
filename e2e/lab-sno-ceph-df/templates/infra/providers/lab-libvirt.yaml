apiVersion: bootwright.io/v1alpha1
kind: InfraProvider
metadata:
  name: lab-libvirt

spec:
  libvirt:
    capacityReserve:
      cpu: 1
      memoryMiB: 2048
      diskGiB: 10

    machineRef: controller

    bmcEmulation:
      bindAddress: 127.0.0.1
      port: 8000
      certificateRef: lab-bmc-tls

      auth:
        credentialsRef: lab-bmc-credentials

    machineProfiles:
      - name: sno
        cpu: {{ .Values.sno.cpu }}
        memoryMiB: {{ .Values.sno.memoryMiB }}
        diskGiB: {{ .Values.sno.diskGiB }}
        tpm: {}

      - name: ceph
        cpu: {{ .Values.cephNodes.cpu }}
        memoryMiB: {{ .Values.cephNodes.memoryMiB }}
        diskGiB: {{ .Values.cephNodes.diskGiB }}
        tpm: {}

        dataDisks:
          - name: ceph-data-1
            sizeGiB: {{ .Values.cephNodes.osdDiskGiB }}
            media: ssd

  networkAttachments:
    - name: lab-guests

      libvirt:
        bridge: {{ .Values.host.bridge }}
        management: managed
        address: {{ .Values.host.gateway }}/{{ .Values.host.prefix }}
        forward: nat
