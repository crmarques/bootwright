# Default input of the lab-sno-fips-controller case. Override keys with
# e2e/render.sh --set or a --values file. The case renders two inputs:
# <out>/bootstrap for context lab-sno-fips-controller-bootstrap, applied on
# this host, and <out>/fips for context lab-sno-fips-controller, applied on
# the FIPS-mode guest the bootstrap context installs.

host:
  # This host's address the bootstrap services bind and the guests reach;
  # "auto" takes this host's default-route source address at render time.
  address: auto
  domain: e2e.example.test

  upstreamDNS:
    - 1.1.1.1

  upstreamNTP:
    - 162.159.200.1

  # The NAT network the bootstrap context creates; the fips context attaches.
  # The fips context reaches this host over SSH at the gateway address, which
  # its emulated BMC binds.
  bridge: virbr-e2e
  cidr: 198.51.100.0/24
  gateway: 198.51.100.1
  prefix: 24

# Media names as added with `bootwright media add --name`.
rhel:
  version: "9.8"
  bootMedia: rhel-9.8-x86_64-boot.iso
  dvdMedia: rhel-9.8-x86_64-dvd.iso

# The FIPS-mode RHEL guest that becomes the fips context's controller. It
# builds the agent image and serves it and the cluster's DNS; libvirt and the
# emulated BMC stay on this host, whose BMC verifies the image's server.
controller:
  name: fips-controller
  address: 198.51.100.10
  cpu: 4
  memoryMiB: 4096
  diskGiB: 60

# Each context's emulated BMC on this host: the bootstrap one on loopback, the
# fips one on the gateway address the FIPS controller dials.
ports:
  bootstrapBMC: 8000
  fipsBMC: 8010

openshift:
  version: 4.22.21

guest:
  address: 198.51.100.31
  cpu: 8
  memoryMiB: 16384
  diskGiB: 120

# The cluster is always FIPS; tpm2 also encrypts the node's installation
# disk, unlocked by the guest TPM2.
security:
  tpm2: true

# Two isolated environments on one VLAN trunk (D231). The case builds the
# trunk bridge, one VLAN interface per environment and one app container per
# environment on this host (runbook.md, step 6); Bootwright names the bridge
# as an external attachment and gives sno-01 a second NIC on it. On the node,
# each VLAN interface is the uplink of its environment's Localnet bridge, which
# carries the node's address there, so that environment's MetalLB pool
# announces on it and its IngressController takes its address from it. Pods
# draw from podSubnet, which holds neither the pool nor the host app. The
# workload manifests under workloads/ assume these defaults.
environments:
  enabled: true

  trunk:
    bridge: br-e2e-trunk
    interface: enp2s0

  staging:
    vlan: 10
    bridge: br-stg
    prefix: 24
    cidr: 192.0.2.0/24
    gatewayAddress: 192.0.2.1
    nodeAddress: 192.0.2.31
    appAddress: 192.0.2.50
    podSubnet: 192.0.2.0/25
    pool: 192.0.2.200-192.0.2.207

  production:
    vlan: 20
    bridge: br-prd
    prefix: 24
    cidr: 203.0.113.0/24
    gatewayAddress: 203.0.113.1
    nodeAddress: 203.0.113.31
    appAddress: 203.0.113.50
    podSubnet: 203.0.113.0/25
    pool: 203.0.113.200-203.0.113.207

# The operators' OLM channel and exact CSV, read from the release's operator
# catalog before rendering (runbook.md, step 2). The render fails until both
# are set while environments are enabled.
addons:
  subscriptions:
    nmstate:
      channel: ""
      startingCSV: ""

    metallb:
      channel: ""
      startingCSV: ""
