# Applied by the runbook with oc, not by Bootwright: workloads, their
# isolation and the per-environment ingress are the case's own (D231). The
# addresses and names follow values.yaml's defaults.
# With routingViaHost, a pod's cluster-network egress leaves through the
# node's routing table, which reaches both environments; this denies the
# other one.
apiVersion: k8s.ovn.org/v1
kind: EgressFirewall
metadata:
  name: default
  namespace: production

spec:
  egress:
    - type: Deny
      to:
        cidrSelector: 192.0.2.0/24
