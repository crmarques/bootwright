{{- $base := eq (include "isolation.profile" .) "base" }}
{{- range $name := list "staging" "production" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app
  namespace: {{ $name }}

data:
{{- if $base }}
  index.html: |
    {{ $name }}-openshift
{{- else }}
  server.py: |
    """Return the environment and the peer address observed by the server."""

    import json
    import os
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer


    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            body = json.dumps({
                "environment": os.environ["CASE_ENVIRONMENT"],
                "source": self.client_address[0],
            }).encode() + b"\n"
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)


    ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
{{- end }}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: {{ $name }}

spec:
  replicas: 1

  selector:
    matchLabels:
      app: app

  template:
    metadata:
      labels:
        app: app
{{- if $base }}

      annotations:
        k8s.v1.cni.cncf.io/networks: {{ $name }}
{{- end }}

    spec:
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true

        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: app
          image: {{ $.Values.isolation.image | quote }}
          imagePullPolicy: IfNotPresent

          command:
            - python3
            - -I
            - -u
{{- if $base }}
            - -m
            - http.server
            - "8080"
            - --directory
            - /opt/app
{{- else }}
            - /opt/app/server.py

          env:
            - name: CASE_ENVIRONMENT
              value: {{ $name }}
{{- end }}

          ports:
            - name: http
              containerPort: 8080

          readinessProbe:
            httpGet:
              path: /
              port: http

            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /
              port: http

            initialDelaySeconds: 10
            periodSeconds: 10

          resources:
            requests:
              cpu: 10m
              memory: 32Mi

            limits:
              cpu: 100m
              memory: 64Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true

            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: app
              mountPath: /opt/app
              readOnly: true

      volumes:
        - name: app

          configMap:
            name: app

---
apiVersion: v1
kind: Pod
metadata:
  name: probe
  namespace: {{ $name }}

  labels:
    app: probe
{{- if $base }}

  annotations:
    k8s.v1.cni.cncf.io/networks: {{ $name }}
{{- end }}

spec:
  automountServiceAccountToken: false

  securityContext:
    runAsNonRoot: true

    seccompProfile:
      type: RuntimeDefault

  containers:
    - name: probe
      image: {{ $.Values.isolation.image | quote }}
      imagePullPolicy: IfNotPresent

      command:
        - python3
        - -I
        - -c
        - import time; time.sleep(86400)

      resources:
        requests:
          cpu: 10m
          memory: 16Mi

        limits:
          cpu: 100m
          memory: 64Mi

      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true

        capabilities:
          drop:
            - ALL

---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: {{ $name }}

spec:
  selector:
    app: app

  ports:
    - name: http
      port: 8080
      targetPort: http

---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: app
  namespace: {{ $name }}

spec:
  host: app.{{ $name }}.apps.sno.{{ $.Values.host.domain }}

  to:
    kind: Service
    name: app

  port:
    targetPort: http
{{ end }}
