{{- if eq (include "isolation.profile" .) "hardened" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: e2e-isolation-config
  namespace: staging

data:
  config.json: |
    {{ dict "nodeName" "master-0" "nodeAddress" .Values.guest.address "domain" .Values.host.domain "environments" (dict "staging" .Values.environments.staging "production" .Values.environments.production) "trunk" .Values.environments.trunk "image" .Values.isolation.image | toJson }}
{{- end }}
