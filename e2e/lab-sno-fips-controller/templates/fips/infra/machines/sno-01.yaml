apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: sno-01

spec:
  substrate:
    providerRef: lab-libvirt
    libvirt:
      profileRef: sno
{{- if .Values.environments.enabled }}

      interfaceAttachments:
        - interface: enp1s0
          attachmentRef: lab-guests

        - interface: {{ .Values.environments.trunk.interface }}
          attachmentRef: trunk
{{- end }}

  hardware:
    rootDevice:
      deviceName: /dev/vda

  os:
    provided: false

  network:
    configRef: lab-guests
{{- if not .Values.environments.enabled }}
    attachmentRef: lab-guests
{{- end }}
    installAddressRef: ip

    addresses:
      - name: fqdn
        address: sno-01.{{ .Values.host.domain }}

      - name: ip
        address: {{ .Values.guest.address }}/{{ .Values.host.prefix }}
        interface: enp1s0
{{- if .Values.environments.enabled }}
{{- $trunk := .Values.environments.trunk.interface }}
{{- with .Values.environments.staging }}

      - name: staging
        address: {{ .nodeAddress }}/{{ .prefix }}
        interface: {{ $trunk }}.{{ .vlan }}
{{- end }}
{{- with .Values.environments.production }}

      - name: production
        address: {{ .nodeAddress }}/{{ .prefix }}
        interface: {{ $trunk }}.{{ .vlan }}
{{- end }}
{{- end }}
