apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: sno-01

spec:
  hardware:
    providerRef: lab-libvirt
    profileRef: sno

    nics:
      - name: enp1s0
{{- if .Values.environments.enabled }}
        segmentRef: lab-guests

      - name: {{ .Values.environments.trunk.interface }}
        segmentRef: staging
{{- end }}

  os:
    clusterInstalled: {}

  network:
    configRef: lab-guests
    installAddressRef: ip

    addresses:
      - name: fqdn
        address: sno-01.{{ .Values.host.domain }}

      - name: ip
        address: {{ .Values.guest.address }}
        interface: enp1s0
{{- if .Values.environments.enabled }}
{{- $trunk := .Values.environments.trunk.interface }}
{{- with .Values.environments.staging }}

      - name: staging
        address: {{ .nodeAddress }}
        interface: {{ $trunk }}.{{ .vlan }}
{{- end }}
{{- with .Values.environments.production }}

      - name: production
        address: {{ .nodeAddress }}
        interface: {{ $trunk }}.{{ .vlan }}
{{- end }}
{{- end }}
