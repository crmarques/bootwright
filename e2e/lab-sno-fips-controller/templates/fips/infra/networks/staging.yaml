{{- if .Values.environments.enabled }}
{{- with .Values.environments.staging }}
apiVersion: bootwright.io/v1alpha1
kind: Network
metadata:
  name: staging

spec:
  provided: true
  description: The staging environment, a VLAN on the trunk bridge the case builds, with no gateway because the host routes nothing between the VLANs.
  vlan: {{ .vlan }}

  ipv4:
    cidr: {{ .cidr }}
{{- end }}
{{- end }}
