# The emulated BMC listens on libvirt-host's guest-network address.
apiVersion: bootwright.io/v1alpha1
kind: Secret
metadata:
  name: lab-bmc-tls

spec:
  type: tlsCertificate

  source:
    generated:
      commonName: {{ .Values.host.gateway }}

      ipAddresses:
        - {{ .Values.host.gateway }}

      validityDays: 3650
