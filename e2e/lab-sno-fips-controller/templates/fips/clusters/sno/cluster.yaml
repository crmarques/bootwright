apiVersion: bootwright.io/v1alpha1
kind: OpenShiftCluster
metadata:
  name: sno

spec:
  distribution:
    type: openshift

    release:
      version: {{ .Values.openshift.version }}

  install:
    mode: connected

    endpoints:
      api:
        source:
          type: node

      ingress:
        source:
          type: node

    agent:
      redfishVirtualMedia:
        artifactServerEndpoint:
          serverRef: lab-artifacts
          endpointRef: ip-https

    ntp:
      - serverRef: lab-ntp

  nodes:
    - name: master-0
      role: controlPlane
      machineRef: sno-01
{{- if .Values.environments.enabled }}
{{- $trunk := .Values.environments.trunk.interface }}

  # MetalLB announces each environment's pool on its bridge, which needs host
  # routing and forwarding on the node (package metallb).
  networking:
    ovnKubernetesConfig:
      gatewayConfig:
        routingViaHost: true
        ipForwarding: Global

    secondaryNetworks:
{{- range $name, $env := dict "staging" .Values.environments.staging "production" .Values.environments.production }}
      - name: {{ $name }}
        topology: Localnet

        bridgeMapping:
          bridge: {{ $env.bridge }}
          interface: {{ $trunk }}.{{ $env.vlan }}
          hostAddresses: bridge

        ipam:
          mode: Enabled

          subnets:
            - {{ $env.cidr }}

          # .1 is the host containers' unused gateway; the pool is MetalLB's.
          excludeSubnets:
            - {{ $env.gatewayAddress }}/32
            - {{ $env.nodeAddress }}/32
            - {{ $env.appAddress }}/32
            - {{ $env.pool }}

        namespaceSelector:
          matchLabels:
            lab.example.test/environment: {{ $name }}
{{- end }}
{{- end }}

  security:
    fips:
      enabled: true
{{- if .Values.security.tpm2 }}

    diskEncryption:
      unlock:
        tpm2: {}
{{- end }}
