apiVersion: bootwright.io/v1alpha1
kind: DNSServer
metadata:
  name: lab-dns

spec:
  management: managed
  machineRef: controller
  implementation: dnsmasq
  port: 53

  endpoints:
    - name: ip
      addressRef: ip

  forwarders:
{{- range .Values.host.upstreamDNS }}
    - {{ . }}
{{- end }}

  # The controller keeps this resolver after installation. The SNO zone is
  # answered by the managed DNS service the second context starts there.
  forwardZones:
    - domain: sno.{{ .Values.host.domain }}

      forwarders:
        - {{ .Values.controller.address }}
