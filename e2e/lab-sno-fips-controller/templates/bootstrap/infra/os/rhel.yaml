# RHEL in FIPS mode for the fips context's controller, with the tools the
# runbook's checks use there. The hosted DVD tree stays its package
# repository while this context lives.
apiVersion: bootwright.io/v1alpha1
kind: MachineInstallProfile
metadata:
  name: rhel

spec:
  os:
    family: rhel
    version: {{ .Values.rhel.version | quote }}
    architecture: x86_64

  updates:
    policy: none

  installer:
    anaconda:
      imageRef: rhel-boot

      redfishVirtualMedia:
        artifactServerEndpoint:
          serverRef: lab-artifacts
          endpointRef: ip-https

      packageSource:
        hostedTree:
          fromMedia: local-media:{{ .Values.rhel.dvdMedia }}

          artifactServerEndpoint:
            serverRef: lab-artifacts
            endpointRef: ip-http

  ntp:
    - serverRef: lab-ntp
      endpointRef: ip

  customizations:
    localization:
      language: en_US.UTF-8
      formats: en_US.UTF-8
      keyboard: us
      timezone: Etc/UTC

    ssh:
      passwordAuthentication: false

    packages:
      installWeakDeps: false
      excludeDocs: true

      install:
        - bind-utils
        - chrony
        - firewalld
        - jq
        - qemu-guest-agent
        - tar

    services:
      enabled:
        - chronyd
        - firewalld
        - qemu-guest-agent
        - sshd

    security:
      selinux:
        mode: enforcing

      fips:
        enabled: true
