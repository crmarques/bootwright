{{- $n := .Values.networks.user -}}
apiVersion: bootwright.io/v1alpha1
kind: Network
metadata:
  name: app-users

spec:
  provided: true
  description: The user network, a VLAN on the operator trunk whose host leg holds its gateway and shares the uplink by NAT; app-01 and client-01 install over it.
  vlan: {{ $n.vlan }}

  ipv4:
    cidr: {{ $n.cidr }}
    gateway: {{ $n.gateway }}
