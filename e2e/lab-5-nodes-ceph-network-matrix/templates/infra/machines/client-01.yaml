{{- $client := .Values.guest.client -}}
{{- $net := .Values.networks -}}
apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: client-01

spec:
  substrate:
    providerRef: lab-libvirt
    libvirt:
      profileRef: client

      nics:
        - nicRef: nic0
          segmentRef: app-trunk

        - nicRef: nic1
          segmentRef: app-trunk

  hardware:
    nics:
      - name: nic0
      - name: nic1

    rootDevice:
      deviceName: /dev/vda

  os:
    provided: false
    installProfileRef: rhel

  network:
    configRef: client
    installAddressRef: ip

    addresses:
      - name: fqdn
        address: client-01.{{ .Values.host.domain }}

      - name: ip
        address: {{ $client.user }}
        interface: bond0.{{ $net.user.vlan }}

      - name: guest
        address: {{ $client.guestOnly }}
        interface: bond0.{{ $net.guestOnly.vlan }}

    overrides:
      interfaces:
        - name: bond0.{{ $net.guestOnly.vlan }}
          mtu: {{ $net.guestOnly.mtu }}
