# The cluster resolver answers its derived records locally. Other names go
# directly upstream, so the bootstrap resolver can forward this zone here
# without creating a DNS forwarding loop.
apiVersion: bootwright.io/v1alpha1
kind: DNSServer
metadata:
  name: ceph-dns

spec:
  management: managed
  machineRef: controller
  implementation: dnsmasq
  port: 53

  endpoints:
    - name: ip
      addressRef: ceph-client

  forwarders:
{{- range .Values.host.upstreamDNS }}
    - {{ . }}
{{- end }}
