apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: sno-01

spec:
  substrate:
    providerRef: lab-libvirt
    libvirt:
      profileRef: sno
{{- if .Values.environments.enabled }}

      nics:
        - nicRef: enp1s0
          segmentRef: openshift-infra

        - nicRef: {{ .Values.environments.trunk.interface }}
          segmentRef: staging

        - nicRef: enp3s0
          segmentRef: ceph-client
{{- end }}

  hardware:
    nics:
      - name: enp1s0
{{- if .Values.environments.enabled }}
      - name: {{ .Values.environments.trunk.interface }}
      - name: enp3s0
{{- end }}

    rootDevice:
      deviceName: /dev/vda

  os:
    provided: false

  network:
    configRef: openshift-infra
    installAddressRef: ip

    addresses:
      - name: fqdn
        address: sno-01.{{ .Values.host.domain }}

      - name: ip
        address: {{ .Values.guest.address }}
        interface: enp1s0
{{- if .Values.environments.enabled }}
{{- $trunk := .Values.environments.trunk.interface }}
{{- with .Values.environments.staging }}

      - name: staging
        address: {{ .nodeAddress }}
        interface: {{ $trunk }}.{{ .vlan }}
{{- end }}
{{- with .Values.environments.production }}

      - name: production
        address: {{ .nodeAddress }}
        interface: {{ $trunk }}.{{ .vlan }}
{{- end }}
{{- end }}

      - name: ceph-client
        address: {{ .Values.storageNetworks.client.snoAddress }}
        interface: enp3s0
