# The FIPS-mode guest lab-sno-single-ceph-fdf-bootstrap installed; this
# context runs on it.
apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: controller

spec:
  os:
    provided: {}

  proxy:
    direct: {}

  firewall:
    management: managed

  network:
    addresses:
      - name: fqdn
        address: {{ .Values.controller.name }}.{{ .Values.host.domain }}

      - name: ip
        address: {{ .Values.controller.address }}

      - name: ceph-client
        address: {{ .Values.storageNetworks.client.controllerAddress }}

  access:
    local: {}
