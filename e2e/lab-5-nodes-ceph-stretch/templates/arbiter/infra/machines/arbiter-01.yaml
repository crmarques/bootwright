# Installed here and handed, with its RHEL, to lab-5-nodes-ceph-stretch as the
# provided stretch tiebreaker.
apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: arbiter-01

spec:
  hardware:
    providerRef: lab-libvirt
    profileRef: arbiter

    nics:
      - name: enp1s0

  os:
    install:
      profileRef: rhel

  firewall:
    ssh:
      allowedSources:
        - machine:
            machineRef: controller
            addressRef: guest-ssh
{{- range $index, $name := concat .Values.sites.dc1 .Values.sites.dc2 }}
{{- if eq (mod $index 2) 0 }}
        - ip: {{ index $.Values.addresses $name }}
{{- end }}
{{- end }}

  network:
    configRef: lab-guests
    installAddressRef: ip

    addresses:
      - name: fqdn
        address: arbiter-01.{{ .Values.host.domain }}

      - name: ip
        address: {{ index .Values.addresses "arbiter-01" }}
        interface: enp1s0
