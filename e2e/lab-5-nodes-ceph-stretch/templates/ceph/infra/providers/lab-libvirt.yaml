# The guest network belongs to lab-5-nodes-ceph-stretch-arbiter; this
# context attaches to it.
apiVersion: bootwright.io/v1alpha1
kind: InfraProvider
metadata:
  name: lab-libvirt

spec:
  libvirt:
    capacityReserve:
      cpu: 1
      memoryMiB: 2048
      diskGiB: 10

    machineRef: controller

    bmcEmulation:
      bindAddress: 127.0.0.1
      port: {{ .Values.ports.ceph.bmc }}
      certificateRef: lab-bmc-tls

      auth:
        credentialsRef: lab-bmc-credentials

    machineProfiles:
      - name: data
        cpu: {{ .Values.size.data.cpu }}
        memoryMiB: {{ .Values.size.data.memoryMiB }}
        diskGiB: {{ .Values.size.data.diskGiB }}
        tpm: {}

        dataDisks:
          - name: ceph-data
            sizeGiB: {{ .Values.size.data.osdDiskGiB }}
            media: ssd

  networkAttachments:
    - name: lab-guests

      libvirt:
        bridge: {{ .Values.host.bridge }}
        management: external
