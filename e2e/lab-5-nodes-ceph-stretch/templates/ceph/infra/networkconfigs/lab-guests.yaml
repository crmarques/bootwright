apiVersion: bootwright.io/v1alpha1
kind: NetworkConfig
metadata:
  name: lab-guests

spec:
  machineNetwork:
    - cidr: {{ .Values.host.cidr }}

  dns:
    - serverRef: lab-dns

  nmstate:
    interfaces:
      - name: enp1s0
        type: ethernet
        state: up
        mtu: 1500

        ipv4:
          enabled: true
          dhcp: false

        ipv6:
          enabled: false

    dns-resolver:
      config:
        search:
          - {{ .Values.host.domain }}

    routes:
      config:
        - destination: 0.0.0.0/0
          next-hop-address: {{ .Values.host.gateway }}
          next-hop-interface: enp1s0
          table-id: 254
          metric: 100
