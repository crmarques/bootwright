{{- if .Values.ceph.services.object }}
apiVersion: bootwright.io/v1alpha1
kind: CephObjectGateway
metadata:
  name: objects

spec:
  clusterRef: ceph-stretch
  serviceRef: rgw.objects
  realm: objects
  zoneGroup: objects
  zone: objects

  endpoint:
    fqdn: s3.{{ .Values.host.domain }}
{{- end }}
