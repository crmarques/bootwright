{{- $n := .Values.networks.cephCluster -}}
apiVersion: bootwright.io/v1alpha1
kind: Network
metadata:
  name: ceph-cluster

spec:
  provided: true
  description: The unrouted Ceph replication network of the three data hosts, carried tagged on the trunk of ceph-public; the host holds no address in it and refuses its subnet.
  vlan: {{ $n.vlan }}

  ipv4:
    cidr: {{ $n.cidr }}
