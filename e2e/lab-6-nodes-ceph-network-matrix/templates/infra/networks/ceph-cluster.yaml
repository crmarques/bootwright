{{- $n := .Values.networks.cephCluster -}}
apiVersion: bootwright.io/v1alpha1
kind: Network
metadata:
  name: ceph-cluster

spec:
  provided: true
  description: The unrouted Ceph replication network of the three data hosts, a VLAN on the operator trunk with no host leg.
  vlan: {{ $n.vlan }}

  ipv4:
    cidr: {{ $n.cidr }}
