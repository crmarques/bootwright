{{- $n := .Values.networks.cephArbiter -}}
apiVersion: bootwright.io/v1alpha1
kind: Network
metadata:
  name: ceph-arbiter

spec:
  provided: false
  description: The MON-only arbiter's subnet, a second VLAN leg on the same trunk, routed to the Ceph public subnet and NAT to the internet.
  vlan: {{ $n.vlan }}

  ipv4:
    cidr: {{ $n.cidr }}
    gateway: {{ $n.gateway }}

  libvirt:
    providerRef: lab-libvirt
    bridge: {{ .Values.networks.trunkBridge }}
    forward: nat
