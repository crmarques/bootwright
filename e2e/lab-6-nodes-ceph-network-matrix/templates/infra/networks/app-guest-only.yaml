{{- $n := .Values.networks.guestOnly -}}
apiVersion: bootwright.io/v1alpha1
kind: Network
metadata:
  name: app-guest-only

spec:
  provided: true
  description: A guest-only VLAN on the user network's bridge that app-01 and client-01 reach only by convergence after the install; no host address.
  vlan: {{ $n.vlan }}

  ipv4:
    cidr: {{ $n.cidr }}
