{{- $n := .Values.networks.cephPublic -}}
apiVersion: bootwright.io/v1alpha1
kind: Network
metadata:
  name: ceph-public

spec:
  provided: true
  description: The Ceph public subnet of the data hosts and the sample server, a VLAN on the operator trunk whose host leg is its gateway.
  vlan: {{ $n.vlan }}

  ipv4:
    cidr: {{ $n.cidr }}
    gateway: {{ $n.gateway }}
