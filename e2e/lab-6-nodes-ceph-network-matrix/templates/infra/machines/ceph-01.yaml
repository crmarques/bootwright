{{- $node := index .Values.guest.ceph.nodes 0 -}}
{{- $net := .Values.networks -}}
apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: ceph-01

spec:
  hardware:
    providerRef: lab-libvirt
    profileRef: ceph

    nics:
      - name: nic0
        segmentRef: ceph-public

  os:
    install:
      profileRef: rhel

  network:
    configRef: ceph-vlan
    installAddressRef: ip

    addresses:
      - name: fqdn
        address: ceph-01.{{ .Values.host.domain }}

      - name: ip
        address: {{ $node.public }}
        interface: nic0.{{ $net.cephPublic.vlan }}

      - name: cluster
        address: {{ $node.cluster }}
        interface: nic0.{{ $net.cephCluster.vlan }}
