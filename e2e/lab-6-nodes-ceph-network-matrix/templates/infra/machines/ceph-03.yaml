{{- $net := .Values.networks -}}
apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: ceph-03

spec:
  hardware:
    providerRef: lab-libvirt
    profileRef: arbiter

    nics:
      - name: nic0
        segmentRef: ceph-arbiter

  os:
    install:
      profileRef: rhel

  network:
    configRef: ceph-arbiter
    installAddressRef: ip

    addresses:
      - name: fqdn
        address: ceph-03.{{ .Values.host.domain }}

      - name: ip
        address: {{ .Values.guest.arbiter.address }}
        interface: nic0.{{ $net.cephArbiter.vlan }}
