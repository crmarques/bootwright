{{- $client := .Values.guest.client -}}
{{- $net := .Values.networks -}}
apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: client-01

spec:
  hardware:
    providerRef: lab-libvirt
    profileRef: client

    nics:
      - name: nic0
        segmentRef: app-users

      - name: nic1
        segmentRef: app-users

  os:
    install:
      profileRef: rhel

  network:
    configRef: client
    installAddressRef: ip

    addresses:
      - name: fqdn
        address: client-01.{{ .Values.host.domain }}

      - name: ip
        address: {{ $client.user }}
        interface: bond0

      - name: guest
        address: {{ $client.guestOnly }}
        interface: bond0.{{ $net.guestOnly.vlan }}

    overrides:
      interfaces:
        - name: bond0.{{ $net.guestOnly.vlan }}
          mtu: {{ $net.guestOnly.mtu }}
