{{- $node := index .Values.guest.ceph.nodes 1 -}}
{{- $net := .Values.networks -}}
apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: ceph-02

spec:
  hardware:
    providerRef: lab-libvirt
    profileRef: ceph

    nics:
      - name: nic0
        segmentRef: ceph-public

      - name: nic1
        segmentRef: ceph-public

  os:
    install:
      profileRef: rhel

  network:
    configRef: ceph-vlan-bond
    installAddressRef: ip

    addresses:
      - name: fqdn
        address: ceph-02.{{ .Values.host.domain }}

      - name: ip
        address: {{ $node.public }}
        interface: bond0.{{ $net.cephPublic.vlan }}

      - name: cluster
        address: {{ $node.cluster }}
        interface: bond0.{{ $net.cephCluster.vlan }}
