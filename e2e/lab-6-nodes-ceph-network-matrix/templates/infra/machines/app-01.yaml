{{- $app := .Values.guest.app -}}
{{- $net := .Values.networks -}}
apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: app-01

spec:
  hardware:
    providerRef: lab-libvirt
    profileRef: app

    nics:
      - name: nic0
        segmentRef: ceph-public

      - name: nic1
        segmentRef: app-users

  os:
    install:
      profileRef: rhel

  network:
    configRef: app
    installAddressRef: ip

    addresses:
      - name: fqdn
        address: app-01.{{ .Values.host.domain }}

      - name: ip
        address: {{ $app.public }}
        interface: nic0.{{ $net.cephPublic.vlan }}

      - name: user
        address: {{ $app.user }}
        interface: nic1

      - name: guest
        address: {{ $app.guestOnly }}
        interface: nic1.{{ $net.guestOnly.vlan }}

    overrides:
      interfaces:
        - name: nic1.{{ $net.guestOnly.vlan }}
          mtu: {{ $net.guestOnly.mtu }}
