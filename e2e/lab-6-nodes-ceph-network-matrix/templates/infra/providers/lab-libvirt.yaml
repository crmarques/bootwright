{{- $ceph := .Values.guest.ceph -}}
{{- $arb := .Values.guest.arbiter -}}
{{- $app := .Values.guest.app -}}
{{- $client := .Values.guest.client -}}
apiVersion: bootwright.io/v1alpha1
kind: InfraProvider
metadata:
  name: lab-libvirt

spec:
  libvirt:
    capacityReserve:
      cpu: 1
      memoryMiB: 2048
      diskGiB: 10

    machineRef: controller

    bmcEmulation:
      bindAddress: 127.0.0.1
      port: 8000
      certificateRef: lab-bmc-tls

      auth:
        credentialsRef: lab-bmc-credentials

    machineProfiles:
      - name: ceph
        cpu: {{ $ceph.cpu }}
        memoryMiB: {{ $ceph.memoryMiB }}
        diskGiB: {{ $ceph.diskGiB }}
        tpm: {}

        dataDisks:
          - name: ceph-data-1
            sizeGiB: {{ $ceph.osdDiskGiB }}
            media: ssd

      - name: arbiter
        cpu: {{ $arb.cpu }}
        memoryMiB: {{ $arb.memoryMiB }}
        diskGiB: {{ $arb.diskGiB }}
        tpm: {}

      - name: app
        cpu: {{ $app.cpu }}
        memoryMiB: {{ $app.memoryMiB }}
        diskGiB: {{ $app.diskGiB }}
        tpm: {}

      - name: client
        cpu: {{ $client.cpu }}
        memoryMiB: {{ $client.memoryMiB }}
        diskGiB: {{ $client.diskGiB }}
        tpm: {}

  segments:
    - name: ceph-trunk

      taggedNetworkRefs:
        - ceph-public
        - ceph-cluster
        - ceph-arbiter

      libvirt:
        bridge: {{ .Values.networks.trunkBridge }}
