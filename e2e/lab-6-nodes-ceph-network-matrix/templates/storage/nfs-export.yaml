{{- if .Values.ceph.services.nfs }}
apiVersion: bootwright.io/v1alpha1
kind: CephNFSExport
metadata:
  name: docs

spec:
  clusterRef: ceph-e2e
  serviceID: shares
  subvolumeRef: docs

  native:
    pseudo: /docs
    access_type: NONE
    squash: root_squash

    protocols:
      - 4

    fsal:
      name: CEPH

    clients:
      - access_type: RW
        squash: root_squash

        addresses:
          - {{ .Values.networks.cephPublic.cidr }}
{{- end }}
