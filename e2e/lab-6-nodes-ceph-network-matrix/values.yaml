# Default input of the lab-6-nodes-ceph-network-matrix case. Override keys
# with e2e/render.sh --set or a --values file.

host:
  # The controller address the managed services bind and the guests reach;
  # "auto" takes this host's default-route source address at render time.
  address: auto
  domain: e2e.example.test

  upstreamDNS:
    - 1.1.1.1

  upstreamNTP:
    - 162.159.200.1

networks:
  # The trunk bridge lab-libvirt creates for the two Ceph VLAN legs below.
  # Bootwright holds each leg's gateway, routes between the two legs, NATs both
  # to the uplink and refuses every other path into them; destroy removes it.
  trunkBridge: br-nm

  # Ceph public subnet of the three data hosts and app-01: VLAN 110 on the trunk,
  # host leg br-nm.110, managed. Install, SSH, MON, OSD front and RGW ingress traffic.
  cephPublic:
    vlan: 110
    cidr: 198.51.100.0/26
    gateway: 198.51.100.1
    prefix: 26

  # Ceph cluster (replication) network: OSD back traffic of the three data
  # hosts only, VLAN 120 on the trunk, no host leg: the host refuses its subnet.
  cephCluster:
    vlan: 120
    cidr: 203.0.113.0/26

  # The MON-only arbiter's subnet: VLAN 150 on the trunk, host leg br-nm.150,
  # managed, routed by the host to the Ceph public subnet; the cluster's second
  # public CIDR.
  cephArbiter:
    vlan: 150
    cidr: 198.51.100.128/26
    gateway: 198.51.100.129
    prefix: 26

  # User network, managed: Bootwright creates its bridge, host address and
  # NAT and removes them at destroy. The sample server's clients.
  user:
    bridge: virbr-user
    cidr: 198.51.100.64/26
    gateway: 198.51.100.65
    prefix: 26

  # Guest-only VLAN 140, tagged on virbr-user, reached only by convergence
  # after the install: app-01 and client-01 only, MTU 1400, no host address,
  # so the provider host refuses its subnet.
  guestOnly:
    vlan: 140
    cidr: 203.0.113.64/26
    mtu: 1400

  # A route each user-network guest adds through the user gateway.
  extraRoute: 192.0.2.0/24

# Media names as added with `bootwright media add --name`.
rhel:
  version: "9.8"
  bootMedia: rhel-9.8-x86_64-boot.iso
  dvdMedia: rhel-9.8-x86_64-dvd.iso

# The bonds of ceph-02 and client-01. A libvirt Machine admits only
# active-backup; the refusal drill renders 802.3ad.
bond:
  mode: active-backup

guest:
  # ceph-01, ceph-02 and ceph-04, the data hosts, in this order: public and
  # cluster address.
  ceph:
    nodes:
      - public: 198.51.100.11
        cluster: 203.0.113.11

      - public: 198.51.100.12
        cluster: 203.0.113.12

      - public: 198.51.100.14
        cluster: 203.0.113.14

    cpu: 3
    memoryMiB: 8192
    diskGiB: 40
    osdDiskGiB: 15

  # ceph-03: a MON only, on the arbiter subnet alone.
  arbiter:
    address: 198.51.100.130
    cpu: 2
    memoryMiB: 2048
    diskGiB: 15

  # app-01: the sample server, installed on the Ceph public VLAN, with a
  # second NIC on the user network.
  app:
    public: 198.51.100.21
    user: 198.51.100.70
    guestOnly: 203.0.113.70
    cpu: 2
    memoryMiB: 2048
    diskGiB: 15

  # client-01: the client container, installed on the user network over a
  # bond.
  client:
    user: 198.51.100.80
    guestOnly: 203.0.113.80
    cpu: 1
    memoryMiB: 1536
    diskGiB: 15

# IBM Storage Ceph. A release moves these together: release, packageVersion,
# ansiblePackageVersion, image, callHome and the auxiliary images below; the
# lab-3-nodes-ceph runbook's release table lists the known sets.
ceph:
  release: 9.9.2.0
  packageVersion: 20.2.2-349.el9cp
  ansiblePackageVersion: 5.0.3-1.el9cp
  callHome: enabled

  image:
    base: cp.icr.io/cp/ibm-ceph/ceph-9-rhel10
    version: v9.9.2-26947

  # The guests' package repository for the release's RPMs.
  repository:
    id: ibm-storage-ceph-9
    displayName: IBM Storage Ceph 9 packages
    baseURL: https://public.dhe.ibm.com/ibmdl/export/pub/storage/ceph/9/rhel9/x86_64/
    gpgKeyURL: https://public.dhe.ibm.com/ibmdl/export/pub/storage/ceph/RPM-GPG-KEY-IBM-CEPH

  # Core block, file and object resources remain enabled for the network
  # workload. These additional groups are independently selectable.
  services:
    nfs: true
    smb: true
    observability: true
    rbdMirror: true
    # Requires compatible gateway CPUs and additional CPU/memory headroom;
    # see the runbook before enabling it.
    nvmeof: false

  osdMemoryTarget: "2147483648"

  # Service VIPs, inside networks.cephPublic and outside every guest.
  # They have no DNS records.
  objectVIP: 198.51.100.60
  nfsVIP: 198.51.100.61
  managementVIP: 198.51.100.62

  # Auxiliary images, authored as linux/amd64 platform manifest digests
  # of the build above (D171); see the lab-3-nodes-ceph values for how
  # to read them. Move these with the Ceph release coordinates.
  images:
    haproxy:
      base: cp.icr.io/cp/ibm-ceph/haproxy-rhel10
      version: sha256:90a29584b593eac133a844ec4f94c7f7d83d127936c91cab0b088e765ed5dad9

    keepalived:
      base: cp.icr.io/cp/ibm-ceph/keepalived-rhel10
      version: sha256:ed18865b7c22051db1166e3df3de38effe225244b0bab32dcee429bb7b43f5db

    samba:
      base: cp.icr.io/cp/ibm-ceph/samba-server-rhel10
      version: sha256:e91653798ca356348b4b60deac6a8683da885fed583753948cb5a7028527c407

    samba_metrics:
      base: cp.icr.io/cp/ibm-ceph/samba-metrics-rhel10
      version: sha256:57f54c5a21fe98dba6fd4904a4fe1fe6a78e1d6ddbd241050c9e6313ac2f3944

    prometheus:
      base: cp.icr.io/cp/ibm-ceph/prometheus
      version: sha256:6483d0ca844408e25a0477bf8f0b2ba46105202a080fcf550ee9933189741bf2

    alertmanager:
      base: cp.icr.io/cp/ibm-ceph/prometheus-alertmanager
      version: sha256:f5e59e1d0b66178b76afddbd02b75aabe89e2571fd4f642444587fd1dfa6b1ed

    grafana:
      base: cp.icr.io/cp/ibm-ceph/grafana-rhel10
      version: sha256:05b7009e0a5d794d035ab2d3fd06df767de62c2b57626f2f543885ee24664476

    node_exporter:
      base: cp.icr.io/cp/ibm-ceph/prometheus-node-exporter
      version: sha256:7ff1de3e3c05df351d86f9b3f1ed143442999602a3668ad513dfcb5436ebb756

    nginx:
      base: cp.icr.io/cp/ibm-ceph/nginx-126-rhel10
      version: sha256:36372e03d80249571aeaf0bcca29cc9ae0abc8ae1dd82511dee41b9faee39415

    loki:
