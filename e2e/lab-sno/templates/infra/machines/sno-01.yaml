apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: sno-01

spec:
  substrate:
    providerRef: lab-libvirt
    libvirt:
      profileRef: sno

  hardware:
    nics:
      - name: enp1s0

    rootDevice:
      deviceName: /dev/vda

  os:
    provided: false

  network:
    configRef: lab-guests
    installAddressRef: ip

    addresses:
      - name: fqdn
        address: sno-01.{{ .Values.host.domain }}

      - name: ip
        address: {{ .Values.guest.address }}
        interface: enp1s0
