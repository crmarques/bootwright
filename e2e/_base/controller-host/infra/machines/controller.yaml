apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: controller

spec:
  os:
    provided: {}

  proxy:
    direct: {}

  firewall:
    management: managed

  network:
    addresses:
      - name: ip
        address: {{ include "address" . }}

{{- if .Values.host.guestSSHSource }}
      - name: guest-ssh
        address: {{ .Values.host.gateway }}

{{- end }}
  access:
    local: {}
