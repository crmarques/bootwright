site_name: Bootwright
site_description: Desired-state orchestrator that provisions OpenShift, OKD, and Ceph clusters across bare metal, vSphere, KubeVirt, and libvirt — the whole platform from scratch or a single component
site_url: https://crmarques.github.io/bootwright/
repo_url: https://github.com/crmarques/bootwright
repo_name: crmarques/bootwright
edit_uri: edit/main/docs/

docs_dir: docs

theme:
  name: material
  logo: assets/images/logo-simple.png
  favicon: assets/images/favicon-32.png
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.tabs.link

plugins:
  - search

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/crmarques/bootwright

nav:
  - Home: index.md
  - Getting Started:
      - getting-started/index.md
      - Installation and Setup: getting-started/installation.md
      - Provisioning an OpenShift cluster: getting-started/openshift.md
      - Provisioning a Ceph cluster: getting-started/ceph.md
  - Concepts and APIs:
      - concepts/index.md
      - Environment & fleet defaults: concepts/environment.md
      - Machines & operating systems: concepts/machines.md
      - "Infrastructure: providers, components & networking": concepts/infrastructure.md
      - Container clusters (OpenShift / OKD): concepts/container-clusters.md
      - Storage (Ceph): concepts/storage.md
      - Post-install add-ons: concepts/add-ons.md
      - Custom playbooks: concepts/custom-playbooks.md
      - Secrets & entitlements: concepts/secrets.md
  - Advanced Scenarios:
      - advanced/index.md
      - Multi-cluster fleets & shared services: advanced/fleets.md
      - Disconnected & proxied installs: advanced/disconnected-proxy.md
      - Corporate TLS certificates & trusted CAs: advanced/corporate-certificates.md
      - Managed OS installs: advanced/managed-os.md
      - Ceph topologies: advanced/ceph-topologies.md
      - KubeVirt nested clusters: advanced/kubevirt.md
      - Networking & load balancing: advanced/networking.md
      - Ownership, idempotency & safety: advanced/ownership-and-safety.md
      - Operations, recovery & teardown: advanced/operations.md
      - Reference examples: advanced/examples.md
  - Troubleshooting: troubleshooting.md
  - Contributing:
      - contributing/index.md
      - Building and testing: contributing/building-and-testing.md
      - API: contributing/api.md
      - Architecture: contributing/architecture.md

copyright: >-
  Bootwright is a desired-state cloud-platform orchestrator released under the
