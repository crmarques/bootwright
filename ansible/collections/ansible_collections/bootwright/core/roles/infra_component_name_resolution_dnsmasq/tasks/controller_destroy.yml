---
- name: Validate controller resolver destroy invocation
  ansible.builtin.assert:
    that:
      - bootwright_mutating_invocation | default('') | length > 0
    fail_msg: >-
      Controller name-resolution teardown has no exact controller-built destroy
      invocation. Refusing to remove resolver state or ownership evidence.
  delegate_to: localhost
  become: true

- name: Remove controller resolver state before evidence
  block:
    - name: Prove controller resolver ownership before destroy
      ansible.builtin.include_tasks: controller_ownership_gate.yml
      vars:
        bootwright_controller_resolver_gate_action: remove

    - name: Probe remote name-resolution teardown evidence
      ansible.builtin.stat:
        path: >-
          {{ bootwright_ownership_dir }}/resources/infra-component/{{
             bootwright_component.infraComponentRecordName }}.json
        follow: false
      register: bootwright_controller_resolver_remote_owner
      delegate_to: localhost
      become: true

    - name: Refuse controller cleanup before remote teardown is proved
      ansible.builtin.assert:
        that:
          - not bootwright_controller_resolver_remote_owner.stat.exists
        fail_msg: >-
          The infra-component ownership record
          {{ bootwright_component.infraComponentRecordName }} still exists, so
          removal of the remote managed DNS service was not proved. This can
          happen when --authorize unreachable-nodes skipped its host. The
          controller route and resolver ownership evidence are retained. Repair
          host access or the reported remote teardown failure, then re-run
          `{{ bootwright_mutating_invocation }}`.

    - name: Probe whether systemd-resolved is active before removal
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - --quiet
          - systemd-resolved
      register: bootwright_controller_resolver_destroy_resolved_active
      changed_when: false
      failed_when: bootwright_controller_resolver_destroy_resolved_active.rc not in [0, 3, 4]

    - name: Remove controller resolver drop-in
      ansible.builtin.file:
        path: "{{ bootwright_controller_resolver_dropin_path }}"
        state: absent
      register: bootwright_controller_resolver_removed
      delegate_to: localhost
      become: true

    - name: Restart systemd-resolved after removing controller routing
      ansible.builtin.systemd_service:
        name: systemd-resolved
        state: restarted
      when: >-
        bootwright_controller_resolver_destroy_resolved_active.rc == 0
        and (bootwright_controller_resolver_removed.changed
             or bootwright_controller_resolver_owned.stat.exists)
      delegate_to: localhost
      become: true

    - name: Remove controller resolver ownership record
      ansible.builtin.include_role:
        name: bootwright.core.ownership_record
        tasks_from: remove_resource.yml
        apply:
          delegate_to: localhost
          become: true
      vars:
        bootwright_ownership_kind: controller-name-resolver
        bootwright_ownership_name: "{{ bootwright_controller_resolver_ownership_name }}"
  rescue:
    - name: Refuse to discard resolver evidence after teardown failed
      ansible.builtin.fail:
        msg: >-
          Controller split-DNS teardown failed for
          {{ bootwright_component.providerName }}/{{ bootwright_component.name }}:
          {{ ansible_failed_result.msg | default(ansible_failed_result | string) }}.
          Any existing controller resolver ownership evidence was retained; the
          remote service teardown may already have completed. Repair
          systemd-resolved or the reported ownership state, then re-run
          `{{ bootwright_mutating_invocation }}`.
      delegate_to: localhost
      become: true
  throttle: 1
