---
- name: Remove dnsmasq container and reap orphans
  ansible.builtin.include_role:
    name: bootwright.core.support_component_teardown
    tasks_from: container.yml
  vars:
    bootwright_component_teardown_container: "{{ bootwright_dnsmasq_container_name }}"
    bootwright_component_teardown_kind: nameResolution

- name: Close DNS ports on host firewall
  ansible.posix.firewalld:
    port: "{{ item }}"
    state: disabled
    permanent: true
    immediate: true
  loop:
    - 53/tcp
    - 53/udp
  loop_control:
    label: "{{ item }}"
  when: bootwright_firewalld_available | default(false)

- name: Remove dnsmasq state and ownership record
  ansible.builtin.include_role:
    name: bootwright.core.support_component_teardown
    tasks_from: state.yml
  vars:
    bootwright_component_teardown_state_dir: "{{ bootwright_dnsmasq_root }}"
