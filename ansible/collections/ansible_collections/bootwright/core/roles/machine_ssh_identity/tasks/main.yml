---
# The identity operation for a machine with no out-of-band channel: connect to
# it over SSH pinned to exactly the key this installation delivered. A machine
# presenting any other key is not this installation, and one that does not
# answer has not answered yet; neither is ever read as absence.
#
# The inputs are this entry point's argument spec, passed explicitly by the
# consuming role and never inherited from a shared fact, and the answers are
# published under this role's own names.
- name: Read the effective crypto policy on this connection's placement host
  bootwright.core.ssh_key_policy:
  register: machine_ssh_identity_policy

- name: Pin the delivered host key for this one connection
  ansible.builtin.copy:
    content: >-
      {{ bootwright_machine_identity.address }} {{ bootwright_machine_identity.key }}
    dest: '{{ bootwright_machine_identity.work }}/known_hosts'
    owner: root
    group: root
    mode: '0600'
  changed_when: false
  no_log: true

# ssh reads this file in place of the system and personal configuration, so no
# ambient known hosts, proxy, control socket, agent or identity reaches the
# connection; only the validated host crypto policy is kept. An absent backend
# uses native defaults. The keepalives end a connection whose peer stopped answering.
- name: Write the one-connection client configuration
  ansible.builtin.copy:
    content: '{{ machine_ssh_identity_policy.configuration }}'
    dest: '{{ bootwright_machine_identity.work }}/ssh_config'
    owner: root
    group: root
    mode: '0600'
  changed_when: false

# Pinning may narrow the effective policy but must never re-enable an excluded
# algorithm. RSA pins use only their policy-permitted SHA-2 signatures.
- name: Name the algorithms the delivered key is accepted under
  ansible.builtin.set_fact:
    machine_ssh_identity_algorithms: >-
      {{ bootwright_machine_identity.key
         | bootwright.core.host_key_algorithms(machine_ssh_identity_policy.hostKeyAlgorithms) }}
  changed_when: false

- name: Read the install marker over that pinned connection
  ansible.builtin.command:
    argv:
      - /usr/bin/ssh
      - -F
      - '{{ bootwright_machine_identity.work }}/ssh_config'
      - -o
      - 'UserKnownHostsFile={{ bootwright_machine_identity.work }}/known_hosts'
      - -o
      - GlobalKnownHostsFile=none
      - -o
      - KnownHostsCommand=none
      - -o
      - VerifyHostKeyDNS=no
      - -o
      - UpdateHostKeys=no
      - -o
      - CheckHostIP=no
      - -o
      - StrictHostKeyChecking=yes
      - -o
      - 'HostKeyAlgorithms={{ machine_ssh_identity_algorithms }}'
      - -o
      - IdentitiesOnly=yes
      - -o
      - IdentityAgent=none
      - -o
      - PasswordAuthentication=no
      - -o
      - KbdInteractiveAuthentication=no
      - -o
      - GSSAPIAuthentication=no
      - -o
      - HostbasedAuthentication=no
      - -o
      - ForwardAgent=no
      - -o
      - ProxyCommand=none
      - -o
      - ProxyJump=none
      - -o
      - ControlMaster=no
      - -o
      - ControlPath=none
      - -o
      - BatchMode=yes
      - -o
      - ConnectTimeout=10
      - -o
      - ServerAliveInterval=15
      - -o
      - ServerAliveCountMax=3
      - -i
      - '{{ bootwright_machine_identity.file }}'
      - >-
        {{ bootwright_machine_identity.user }}@{{ bootwright_machine_identity.address }}
      - /usr/bin/cat
      - '{{ bootwright_machine_identity.marker_path }}'
  register: machine_ssh_identity_marker_read
  retries: '{{ bootwright_machine_identity.retries | int }}'
  delay: '{{ bootwright_machine_identity.delay | int }}'
  until: ((machine_ssh_identity_marker_read.rc | default(1)) == 0
          and ((machine_ssh_identity_marker_read.stdout | default('') | string | trim | length) > 0))
         or ((machine_ssh_identity_marker_read.attempts | default(1) | int)
             > (bootwright_machine_identity.retries | int))
  failed_when: false
  changed_when: false
  no_log: true

- name: Publish what the connection answered
  ansible.builtin.set_fact:
    machine_ssh_identity_answered: >-
      {{ machine_ssh_identity_marker_read.rc == 0 }}
    machine_ssh_identity_marker: >-
      {{ machine_ssh_identity_marker_read.stdout | default('') | trim
         if machine_ssh_identity_marker_read.rc == 0 else '' }}
    # A connection that succeeded proves the machine presented the delivered
    # key, because nothing else was accepted.
    machine_ssh_identity_host_key: >-
      {{ bootwright_machine_identity.key
         if machine_ssh_identity_marker_read.rc == 0 else '' }}
  changed_when: false

- name: Remove the one-connection known-hosts file
  ansible.builtin.file:
    path: '{{ bootwright_machine_identity.work }}/known_hosts'
    state: absent
  changed_when: false

- name: Remove the one-connection client configuration
  ansible.builtin.file:
    path: '{{ bootwright_machine_identity.work }}/ssh_config'
    state: absent
  changed_when: false
