---
# The identity operation for a machine with no out-of-band channel: connect to
# it over SSH pinned to exactly the key this installation delivered. A machine
# presenting any other key is not this installation, and one that does not
# answer has not answered yet; neither is ever read as absence. The session is
# the one the collection's guest session builder opens for every pinned
# connection, so no option is written here.
#
# The inputs are this entry point's argument spec, passed explicitly by the
# consuming role and never inherited from a shared fact, and the answers are
# published under this role's own names.
- name: Open the pinned connection to the machine
  bootwright.core.managedos_guest_session:
    state: present
    directory: '{{ bootwright_machine_identity.work }}'
    address: '{{ bootwright_machine_identity.address }}'
    host_key: '{{ bootwright_machine_identity.key }}'
  register: machine_ssh_identity_session

# One read of a file is bounded by the 55 seconds ssh itself takes to give up
# a peer that stopped answering, and a few more, so a machine whose read hangs
# ends this attempt rather than the identity budget.
- name: Read the install marker over that pinned connection
  bootwright.core.managedos_guest_command:
    address: '{{ bootwright_machine_identity.address }}'
    user: '{{ bootwright_machine_identity.user }}'
    identity: '{{ bootwright_machine_identity.file }}'
    ssh_config: '{{ machine_ssh_identity_session.ssh_config }}'
    known_hosts: '{{ machine_ssh_identity_session.known_hosts }}'
    host_key_algorithms: '{{ machine_ssh_identity_session.host_key_algorithms }}'
    policy_host_key_algorithms: '{{ machine_ssh_identity_session.policy_host_key_algorithms }}'
    argv:
      - /usr/bin/cat
      - '{{ bootwright_machine_identity.marker_path }}'
    timeout: 60
  register: machine_ssh_identity_marker_read
  retries: '{{ bootwright_machine_identity.retries | int }}'
  delay: '{{ bootwright_machine_identity.delay | int }}'
  until: ((machine_ssh_identity_marker_read.rc | default(1)) == 0
          and ((machine_ssh_identity_marker_read.stdout | default('') | string | trim | length) > 0))
         or ((machine_ssh_identity_marker_read.attempts | default(1) | int)
             > (bootwright_machine_identity.retries | int))
  failed_when: false
  changed_when: false
  no_log: true

- name: Publish what the connection answered
  ansible.builtin.set_fact:
    machine_ssh_identity_answered: >-
      {{ machine_ssh_identity_marker_read.rc | default(1) == 0 }}
    machine_ssh_identity_marker: >-
      {{ machine_ssh_identity_marker_read.stdout | default('') | trim
         if machine_ssh_identity_marker_read.rc | default(1) == 0 else '' }}
    # A connection that succeeded proves the machine presented the delivered
    # key, because nothing else was accepted.
    machine_ssh_identity_host_key: >-
      {{ bootwright_machine_identity.key
         if machine_ssh_identity_marker_read.rc | default(1) == 0 else '' }}
  changed_when: false

- name: Close the pinned connection to the machine
  bootwright.core.managedos_guest_session:
    state: absent
    directory: '{{ bootwright_machine_identity.work }}'
