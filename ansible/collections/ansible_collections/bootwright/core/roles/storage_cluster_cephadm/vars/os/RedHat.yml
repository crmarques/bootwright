---
bootwright_ceph_node_services:
  - chronyd
  - firewalld
bootwright_ceph_default_prerequisite_packages:
  - firewalld
  - lvm2
  - podman
  - chrony
  - sos
bootwright_ceph_managed_packages:
  - cephadm
  - cephadm-ansible
  - ceph-common
  - firewalld
  - lvm2
  - podman
  - chrony
  - sos
  - gdisk
bootwright_ceph_ca_trust_anchor_path: /etc/pki/ca-trust/source/anchors/bootwright-cephadm-registry.pem
bootwright_ceph_rhsm_satellite_ca_anchor_path: /etc/pki/ca-trust/source/anchors/bootwright-satellite-ca.pem
bootwright_ceph_proxy_ca_anchor_path: /etc/pki/ca-trust/source/anchors/bootwright-proxy-ca.pem
bootwright_ceph_community_default_mirror: https://download.ceph.com
bootwright_ceph_community_bootstrap_cephadm: /var/tmp/bootwright-cephadm-bootstrap
bootwright_ceph_community_repo_file: /etc/yum.repos.d/ceph.repo
bootwright_ceph_community_release_key_path: keys/release.asc
bootwright_ceph_community_release_gpg_fingerprint: 08B73419AC32B4E966C1A330E84AC2C0460F3994
bootwright_ceph_community_epel_release_url: "https://dl.fedoraproject.org/pub/epel/epel-release-latest-{{ ansible_distribution_major_version }}.noarch.rpm"
bootwright_ceph_community_obsolete_dependency_repo_file: /etc/yum.repos.d/bootwright-ceph-dependencies.repo
