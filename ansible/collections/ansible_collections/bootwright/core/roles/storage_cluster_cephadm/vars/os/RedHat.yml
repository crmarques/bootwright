---
bootwright_ceph_node_services:
  - chronyd
  - firewalld
bootwright_ceph_default_prerequisite_packages:
  - firewalld
  - lvm2
  - podman
  - chrony
bootwright_ceph_managed_packages:
  - cephadm
  - firewalld
  - lvm2
  - podman
  - chrony
  # Installed on demand by the destroy device zap (sgdisk); listed here so its
  # ownership record is removed and the package uninstalled at teardown.
  - gdisk
bootwright_ceph_ca_trust_anchor_path: /etc/pki/ca-trust/source/anchors/bootwright-cephadm-registry.pem
# Distinct anchor for the corporate Satellite CA so it never collides with the
# cephadm-registry CA above. Matches the managed-OS Kickstart anchor filename.
bootwright_ceph_rhsm_satellite_ca_anchor_path: /etc/pki/ca-trust/source/anchors/bootwright-satellite-ca.pem
# Distinct anchor for the egress proxy's TLS-inspection CA (proxy
# connection.trustBundleRef), so a proxied node trusts the certificates the
# proxy re-signs when dnf reaches the Red Hat CDN through it.
bootwright_ceph_proxy_ca_anchor_path: /etc/pki/ca-trust/source/anchors/bootwright-proxy-ca.pem
bootwright_ceph_ca_trust_update_argv:
  - update-ca-trust
bootwright_ceph_community_default_mirror: https://download.ceph.com
bootwright_ceph_community_bootstrap_cephadm: /var/tmp/bootwright-cephadm-bootstrap
bootwright_ceph_community_repo_file: /etc/yum.repos.d/ceph.repo
# cephadm add-repo unconditionally enables EPEL via "dnf install -y epel-release"
# on EL nodes; on an unregistered RHEL node no enabled repo provides that package,
# so Bootwright pre-installs epel-release from Fedora's canonical RPM. Override
# this URL to an internal EPEL mirror for disconnected sites.
bootwright_ceph_community_epel_release_url: "https://dl.fedoraproject.org/pub/epel/epel-release-latest-{{ ansible_distribution_major_version }}.noarch.rpm"
# Community ceph-common pulls dependencies from the distribution base repositories
# that cephadm add-repo never configures: librabbitmq, librdkafka and
# python3-prettytable live in AppStream, libbabeltrace lives in CodeReady Builder
# (CRB). An unregistered RHEL node exposes none of those RHSM-gated repositories,
# so depsolve fails. Following the documented community install procedure,
# Bootwright adds the matching CentOS Stream community repositories and trusts the
# CentOS Official signing key (fingerprint pinned). Override the mirror to an
# internal CentOS Stream mirror for disconnected sites, or set
# spec.ceph.community.enableDependencyRepos=false on hosts that already entitle
# BaseOS/AppStream/CRB another way (e.g. RHSM or a MachineInstallProfile mirror).
bootwright_ceph_community_dependency_default_mirror: https://mirror.stream.centos.org
bootwright_ceph_community_dependency_gpgkey: https://www.centos.org/keys/RPM-GPG-KEY-CentOS-Official-SHA256
bootwright_ceph_community_dependency_gpg_fingerprint: 99DB70FAE1D7CE227FB6488205B555B38483C65D
bootwright_ceph_community_dependency_repos:
  - id: bootwright-centos-stream-baseos
    name: Bootwright CentOS Stream BaseOS (community Ceph dependencies)
    path: BaseOS
  - id: bootwright-centos-stream-appstream
    name: Bootwright CentOS Stream AppStream (community Ceph dependencies)
    path: AppStream
  - id: bootwright-centos-stream-crb
    name: Bootwright CentOS Stream CRB (community Ceph dependencies)
    path: CRB
