---
- name: Validate Ceph storage node OS for the rendered distribution
  ansible.builtin.assert:
    that:
      - ansible_os_family == 'RedHat'
      - >-
        (bootwright_ceph_provider.runtimeOS.majorVersions | default([]) | length == 0)
        or ansible_distribution_major_version in bootwright_ceph_provider.runtimeOS.majorVersions
    fail_msg: >-
      {{ bootwright_ceph_provider.runtimeOS.message | default('selected Ceph distribution is incompatible with this storage node OS') }};
      {{ bootwright_current_storage_host.hostname }} reported
      {{ ansible_distribution | default('<unknown>') }} {{ ansible_distribution_version | default('<unknown>') }}
      (os_family {{ ansible_os_family | default('<unknown>') }}).
    quiet: true

- name: Report storage node OS outside the recorded Ceph release matrix
  ansible.builtin.debug:
    msg: >-
      {{ bootwright_current_storage_host.hostname }} runs
      {{ ansible_distribution | default('<unknown>') }} {{ ansible_distribution_version | default('<unknown>') }},
      outside the versions recorded for this Ceph release
      ({{ bootwright_ceph_provider.runtimeOS.exactVersions | default([]) | join(', ') }}).
      The install proceeds because that matrix is a snapshot; confirm the combination
      against the vendor compatibility guide.
  when:
    - bootwright_ceph_provider.runtimeOS.exactVersions | default([]) | length > 0
    - ansible_distribution_version not in bootwright_ceph_provider.runtimeOS.exactVersions

- name: Load Ceph storage node OS variables
  ansible.builtin.include_vars: "os/{{ ansible_facts['os_family'] }}.yml"

- name: Trust corporate proxy CA on storage node
  ansible.builtin.include_role:
    name: bootwright.core.support_ca_trust
  vars:
    bootwright_ca_trust_source: "{{ bootwright_proxy_trust_bundle_ref }}"
    bootwright_ca_trust_anchor: "{{ bootwright_ceph_proxy_ca_anchor_path }}"
  when: bootwright_proxy_trust_bundle_ref | default('') | length > 0

- name: Ensure containers.conf.d directory on storage node
  ansible.builtin.file:
    path: /etc/containers/containers.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: bootwright_proxy_has_url | default(false) | bool

- name: Configure podman proxy for cephadm image pulls on storage node
  ansible.builtin.copy:
    dest: /etc/containers/containers.conf.d/10-bootwright-ceph-proxy.conf
    owner: root
    group: root
    mode: "{{ '0600' if bootwright_proxy_credentialed_url | default(false) else '0644' }}"
    content: |
      [engine]
      env = ["HTTP_PROXY={{ bootwright_proxy_http_effective }}", "HTTPS_PROXY={{ bootwright_proxy_https_effective }}", "NO_PROXY={{ bootwright_proxy_no }}", "http_proxy={{ bootwright_proxy_http_effective }}", "https_proxy={{ bootwright_proxy_https_effective }}", "no_proxy={{ bootwright_proxy_no }}"]
  no_log: "{{ (bootwright_no_log | default(true) | bool) and (bootwright_proxy_credentialed_url | default(false)) }}"
  when: bootwright_proxy_has_url | default(false) | bool

- name: Remove podman proxy drop-in on storage node when no proxy is configured
  ansible.builtin.file:
    path: /etc/containers/containers.conf.d/10-bootwright-ceph-proxy.conf
    state: absent
  when: not (bootwright_proxy_has_url | default(false) | bool)

- name: Configure Ceph package repository for the rendered distribution
  ansible.builtin.include_tasks: "../providers/{{ bootwright_ceph_provider_name }}.yml"
