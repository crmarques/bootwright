---
- name: Install Ceph prerequisites on storage node
  ansible.builtin.include_role:
    name: bootwright.core.ownership_record
    tasks_from: package_apply.yml
  vars:
    bootwright_ownership_packages: "{{ bootwright_ceph_provider.prerequisitePackages | default(bootwright_ceph_default_prerequisite_packages) }}"
    bootwright_ownership_required_by: "storage-cluster:{{ bootwright_selected_storage_cluster.name }}"

- name: Start storage node services
  ansible.builtin.service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop: "{{ bootwright_ceph_node_services }}"
  loop_control:
    label: "{{ bootwright_current_storage_host.hostname }} {{ item }}"

# IBM Storage Ceph requires time synchronization before bootstrap: unsynchronized
# monitor clocks raise clock-skew health warnings and can disrupt quorum. chronyd
# is started above; give it a bounded chance to converge (up to 6 checks, 10s
# apart) so the first monitor bootstraps against a synced clock. Non-fatal by
# design — a node that cannot reach an NTP source (a disconnected site) still
# proceeds, and cephadm surfaces any residual skew as a health warning rather
# than the install hanging here. Gated on chronyd actually being a managed
# service so a host that synchronizes time another way is left alone.
- name: Wait for storage node time synchronization
  ansible.builtin.command:
    argv:
      - chronyc
      - waitsync
      - "6"
      - "0"
      - "0"
      - "10"
  register: bootwright_ceph_chrony_waitsync
  changed_when: false
  failed_when: false
  when: "'chronyd' in bootwright_ceph_node_services"
