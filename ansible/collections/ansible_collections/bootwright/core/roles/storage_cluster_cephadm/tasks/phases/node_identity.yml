---
- name: Gather storage node platform facts
  ansible.builtin.setup:
    gather_subset:
      - "!all"
      - "!min"
      - platform

- name: Resolve current storage node
  ansible.builtin.set_fact:
    bootwright_current_storage_host_matches: >-
      {{
        bootwright_selected_storage_cluster.hosts
        | default([])
        | selectattr('inventoryHost', 'equalto', inventory_hostname)
        | list
      }}
  changed_when: false

- name: Validate current storage node context
  ansible.builtin.assert:
    that:
      - bootwright_current_storage_host_matches | length == 1
    fail_msg: >-
      Storage node {{ inventory_hostname }} is not declared exactly once in
      {{ bootwright_selected_storage_cluster.name | default('<storage-cluster>') }}.

- name: Set current storage node
  ansible.builtin.set_fact:
    bootwright_current_storage_host: "{{ bootwright_current_storage_host_matches | first }}"
  changed_when: false

- name: Write the OS hostname cephadm will register
  ansible.builtin.hostname:
    name: "{{ bootwright_current_storage_host.cephHostname }}"
  become: true

- name: Re-read storage node platform facts after writing the hostname
  ansible.builtin.setup:
    gather_subset:
      - "!all"
      - "!min"
      - platform

- name: Refuse a storage node whose OS hostname is not the name cephadm will register
  ansible.builtin.assert:
    that:
      - ansible_facts['nodename'] == bootwright_current_storage_host.cephHostname
    fail_msg: >-
      Storage node {{ bootwright_current_storage_host.cephHostname }} still reports OS
      hostname {{ ansible_facts['nodename'] }} after Bootwright wrote it. cephadm
      identifies a host by its real OS hostname: the mgr runs `cephadm check-host
      --expect-hostname` against every host document and compares that string literally,
      so a mismatch is refused no matter how the name resolves in DNS — a CNAME from the
      node name to the machine does not satisfy it. Refusing here, before any cluster
      mutation, because cephadm rejects the host document while `ceph orch apply -i`
      still exits zero: the run would bootstrap a cluster, leave the rejected node out of
      the orchestrator inventory, keep the bootstrap default mon placement
      (`count: <n>`) in force, and only surface much later as a monmap readiness failure.
      The write reached the machine and did not hold, so something on it owns the name —
      cloud-init without `preserve_hostname: true`, or a configuration management agent
      that stamps hostnames. Settle that, or author spec.ceph.topology.nodes[].fqdn to
      pin the hostname the machine already has.
    success_msg: >-
      Storage node OS hostname is the name cephadm will register.
