---
- name: Validate IBM Storage Ceph entitlement paths
  ansible.builtin.assert:
    that:
      - bootwright_ceph_rhsm_organization_path | length > 0
      - bootwright_ceph_rhsm_activation_key_path | length > 0
      - bootwright_ceph_registry_url | length > 0
      - bootwright_ceph_registry_credentials_path | length > 0
      - bootwright_ceph_provider.license.accepted | default(false) | bool
    fail_msg: "IBM Storage Ceph distribution requires RHSM refs, registry credentialsRef, and license.accept=true entitlement material."

- name: Register storage node with RHSM for IBM Storage Ceph
  ansible.builtin.command:
    argv:
      - subscription-manager
      - register
      - --org
      - "{{ lookup('ansible.builtin.file', bootwright_ceph_rhsm_organization_path) | trim }}"
      - --activationkey
      - "{{ lookup('ansible.builtin.file', bootwright_ceph_rhsm_activation_key_path) | trim }}"
      - --force
  register: bootwright_ceph_rhsm_register
  changed_when: false
  no_log: true

- name: Refresh RHSM subscription metadata for IBM Storage Ceph
  ansible.builtin.command:
    argv:
      - subscription-manager
      - refresh
  changed_when: false

- name: Disable unrelated RHSM repositories for IBM Storage Ceph
  ansible.builtin.command:
    argv:
      - subscription-manager
      - repos
      - --disable=*
  changed_when: false

- name: Enable RHEL repositories for IBM Storage Ceph
  ansible.builtin.command:
    argv:
      - subscription-manager
      - repos
      - "--enable={{ item }}"
  loop: "{{ bootwright_ceph_provider.repository.redhatRepos }}"
  loop_control:
    label: "{{ item }}"
  changed_when: false

- name: Install IBM Storage Ceph repository file
  ansible.builtin.get_url:
    url: "{{ bootwright_ceph_provider.repository.ibmRepoURL }}"
    dest: /etc/yum.repos.d/ibm-storage-ceph.repo
    owner: root
    group: root
    mode: "0644"

- name: Install IBM Storage Ceph license package
  ansible.builtin.package:
    name: ibm-storage-ceph-license
    state: present

- name: Accept IBM Storage Ceph license provisions
  ansible.builtin.file:
    path: /usr/share/ibm-storage-ceph-license/accept
    state: touch
    owner: root
    group: root
    mode: "0644"

- name: Install IBM cephadm-ansible package
  ansible.builtin.package:
    name: cephadm-ansible
    state: present
