---
- name: Require accepted license for licensed Ceph distribution
  ansible.builtin.assert:
    that:
      - bootwright_ceph_provider.license.accepted | default(false) | bool
    fail_msg: >-
      Ceph distribution {{ bootwright_ceph_provider_name }} requires license acceptance;
      set the Environment entitlement license.accept=true.
  when: bootwright_ceph_provider.requiresLicense | default(false) | bool

- name: Configure subscription-backed Ceph package repositories
  ansible.builtin.include_tasks: subscription.yml

- name: Remove vendor Ceph repository definition under subscription package source
  ansible.builtin.file:
    path: /etc/yum.repos.d/ibm-storage-ceph.repo
    state: absent
  when: bootwright_ceph_provider.repository.ibmRepoURL | default('') | length == 0

- name: Resolve the declared IBM Ceph package repository probe
  ansible.builtin.set_fact:
    bootwright_ceph_subscription_probe_packages: >-
      {{ (bootwright_ceph_provider.packageArtifacts | default([])
          | map(attribute='name') | list)
         + (['ibm-storage-ceph-license']
            if (bootwright_ceph_provider.requiresLicense | default(false) | bool) else []) }}
    bootwright_ceph_subscription_pinned_packages: >-
      {{ bootwright_ceph_provider.packageArtifacts | default([]) }}
    bootwright_ceph_subscription_probe_repo_args: >-
      {{ (bootwright_ceph_provider.repository.redhatRepos | default([])
          | map('regex_replace', '^', '--enablerepo=') | list)
         + (bootwright_ceph_provider.repository.redhatRepos | default([])
            | map('regex_replace', '^', '--setopt=')
            | map('regex_replace', '$', '.skip_if_unavailable=False') | list) }}
  changed_when: false
  when:
    - bootwright_ceph_provider.repository.ibmRepoURL | default('') | length == 0
    - bootwright_ceph_provider.rhsmManagement | default('managed') != 'external'

- name: Probe only the declared subscription repositories for all IBM Ceph packages
  ansible.builtin.command:
    argv: >-
      {{ ['dnf', '-q', '--setopt=skip_if_unavailable=False', '--disablerepo=*']
         + (bootwright_ceph_subscription_probe_repo_args | default([]))
         + ['repoquery', '--qf',
            'build %{name} %{name}-%{epoch}:%{version}-%{release}.%{arch}\npin %{name} %{version}-%{release}\nspec %{name} %{name}-%{version}\nspec %{name} %{name}-%{version}-%{release}\nspec %{name} %{name}-%{version}-%{release}.%{arch}\nspec %{name} %{name}-%{epoch}:%{version}\nspec %{name} %{name}-%{epoch}:%{version}-%{release}\nspec %{name} %{name}-%{epoch}:%{version}-%{release}.%{arch}\n']
         + (bootwright_ceph_subscription_probe_packages | default([])) }}
  register: bootwright_ceph_subscription_preflight
  changed_when: false
  failed_when: false
  check_mode: false
  retries: "{{ bootwright_ceph_subscription_probe_retries | default(3) | int }}"
  delay: "{{ bootwright_ceph_subscription_probe_delay | default(10) | int }}"
  until: >-
    ((bootwright_ceph_subscription_preflight.rc | default(1) | int) == 0)
    or
    ((bootwright_ceph_subscription_preflight.attempts | default(1) | int)
     >= (bootwright_ceph_subscription_probe_retries | default(3) | int))
  when:
    - bootwright_ceph_provider.repository.ibmRepoURL | default('') | length == 0
    - bootwright_ceph_provider.rhsmManagement | default('managed') != 'external'

- name: Require every declared IBM Ceph subscription repository to be readable
  ansible.builtin.assert:
    that:
      - bootwright_ceph_subscription_preflight.rc | default(1) == 0
    fail_msg: >-
      Storage node {{ bootwright_current_storage_host.hostname }}:
      dnf could not query only the declared repositories
      ({{ bootwright_ceph_provider.repository.redhatRepos | default([]) | join(', ') }})
      for {{ bootwright_ceph_subscription_probe_packages | default([]) | join(', ') }} on
      any of {{ bootwright_ceph_subscription_preflight.attempts | default(1) }} attempts
      {{ bootwright_ceph_subscription_probe_delay | default(10) | int }}s apart (the last
      exited {{ bootwright_ceph_subscription_preflight.rc | default('?') }}:
      {{ bootwright_ceph_subscription_preflight.stderr | default('') | trim }}). Every
      undeclared repository was disabled and skip_if_unavailable was forced off for each
      declared repository, so the repository named by this error is one the desired state
      requires and this says nothing yet about which builds it publishes. Run
      `{{ bootwright_ceph_subscription_preflight.cmd | default([]) | map('quote') | join(' ') }}`
      on that node. Check its subscription attachment, Satellite/CDN reachability through
      the declared proxy, GPG keys, and CA; after it succeeds, retry with
      {{ bootwright_mutating_invocation }}.
    quiet: true
  when:
    - bootwright_ceph_provider.repository.ibmRepoURL | default('') | length == 0
    - bootwright_ceph_provider.rhsmManagement | default('managed') != 'external'

- name: Require the declared subscription repositories to serve every IBM Ceph package
  ansible.builtin.assert:
    that:
      - >-
        bootwright_ceph_subscription_preflight.stdout_lines | default([])
        | select('match', '^build ' ~ (item | regex_escape) ~ ' ')
        | list | length > 0
    fail_msg: >-
      Storage node {{ bootwright_current_storage_host.hostname }}: the declared repositories
      ({{ bootwright_ceph_provider.repository.redhatRepos | default([]) | join(', ') }})
      were read successfully but publish no build of {{ item }}.
      spec.ceph.ibm.packages.source=subscription requires those repositories to publish
      every rendered native Ceph tooling package and the ibm-storage-ceph-license package
      for this release.
      Check that the Satellite content view includes the IBM Storage Ceph repository, that
      a version carrying it is promoted to this host's lifecycle environment, and that the
      host's activation key subscribes it. A republished content view may require
      `dnf clean metadata` on the node; then retry with {{ bootwright_mutating_invocation }}.
    quiet: true
  loop: "{{ bootwright_ceph_subscription_probe_packages | default([]) }}"
  loop_control:
    label: "{{ bootwright_current_storage_host.hostname }} {{ item }}"
  when:
    - bootwright_ceph_provider.repository.ibmRepoURL | default('') | length == 0
    - bootwright_ceph_provider.rhsmManagement | default('managed') != 'external'
    - bootwright_ceph_subscription_preflight.rc | default(1) == 0

- name: Require the declared subscription repositories to serve each pinned native tooling build
  ansible.builtin.assert:
    that:
      - >-
        item.spec in
        (bootwright_ceph_subscription_package_lines
         | select('match', '^spec ' ~ (item.name | regex_escape) ~ ' ')
         | map('regex_replace', '^spec [^ ]+ ', '') | unique | list)
    fail_msg: >-
      Storage node {{ bootwright_current_storage_host.hostname }}: the declared repositories
      ({{ bootwright_ceph_provider.repository.redhatRepos | default([]) | join(', ') }})
      serve {{ item.name }}, but not the build {{ item.desiredStatePath }} pins. They publish
      {{ bootwright_ceph_subscription_package_builds | join(', ') }}, and
      `dnf install {{ item.spec }}` resolves against none of them, so this is a pin/content
      mismatch and not a missing repository. Either set {{ item.desiredStatePath }} to a build these
      repositories publish
      ({{ bootwright_ceph_subscription_package_pins | join(' or ') }}), or
      promote a Satellite content view version that publishes
      {{ item.spec }} to this host's lifecycle
      environment; then retry with {{ bootwright_mutating_invocation }}. The pin is matched
      against every name-[epoch:]version[-release][.arch]
      form dnf itself accepts, so an omitted epoch is never the cause; when the pin does
      carry an explicit epoch, compare it against the published builds above, because an
      epoch that differs from the one the vendor ships makes dnf reject the spec. A content
      view republished since the node's last metadata refresh needs `dnf clean metadata` on
      the node. This fails the apply even where the pinned install would have succeeded as
      a no-op on a node that already carries that build: the repositories, not this node's
      disk, are what the next fresh or rebuilt node installs from.
    quiet: true
  vars:
    bootwright_ceph_subscription_package_lines: >-
      {{ bootwright_ceph_subscription_preflight.stdout_lines | default([])
         | map('trim') | list }}
    bootwright_ceph_subscription_package_builds: >-
      {{ bootwright_ceph_subscription_package_lines
         | select('match', '^build ' ~ (item.name | regex_escape) ~ ' ')
         | map('regex_replace', '^build [^ ]+ ', '') | unique | sort | list }}
    bootwright_ceph_subscription_package_pins: >-
      {{ bootwright_ceph_subscription_package_lines
         | select('match', '^pin ' ~ (item.name | regex_escape) ~ ' ')
         | map('regex_replace', '^pin [^ ]+ ', '') | unique | sort | list }}
  loop: "{{ bootwright_ceph_subscription_pinned_packages | default([]) }}"
  loop_control:
    label: "{{ bootwright_current_storage_host.hostname }} {{ item.name }}"
  when:
    - bootwright_ceph_provider.repository.ibmRepoURL | default('') | length == 0
    - bootwright_ceph_provider.rhsmManagement | default('managed') != 'external'
    - item.spec | default('') | length > 0

- name: Install vendor Ceph repository definition
  ansible.builtin.get_url:
    url: "{{ bootwright_ceph_provider.repository.ibmRepoURL }}"
    dest: /etc/yum.repos.d/ibm-storage-ceph.repo
    owner: root
    group: root
    mode: "0644"
  when: bootwright_ceph_provider.repository.ibmRepoURL | default('') | length > 0

- name: Install vendor Ceph license package
  ansible.builtin.package:
    name: ibm-storage-ceph-license
    state: present
  when: bootwright_ceph_provider.requiresLicense | default(false) | bool

- name: Accept vendor Ceph license provisions
  ansible.builtin.file:
    path: /usr/share/ibm-storage-ceph-license/accept
    state: touch
    owner: root
    group: root
    mode: "0644"
    modification_time: preserve
    access_time: preserve
  when: bootwright_ceph_provider.requiresLicense | default(false) | bool
