- name: Assemble the Grafana service spec carrying its administrator credential
  ansible.builtin.set_fact:
    bootwright_ceph_grafana_spec:
      service_type: grafana
      placement: >-
        {{ {'hosts': bootwright_ceph_grafana.hosts}
           | combine({'count_per_host': bootwright_ceph_grafana.countPerHost}
                     if (bootwright_ceph_grafana.countPerHost | default(0) | int) > 0 else {}) }}
      networks: "{{ bootwright_ceph_grafana.networks | default([]) }}"
      spec: >-
        {{ {'initial_admin_password': lookup('ansible.builtin.file', bootwright_ceph_grafana.initialAdminPassPath) | trim}
           | combine({'port': bootwright_ceph_grafana.port}
                     if (bootwright_ceph_grafana.port | default(0) | int) > 0 else {}) }}
  no_log: "{{ bootwright_no_log | default(true) | bool }}"
  when: bootwright_ceph_grafana.hosts is defined

- name: Write the Grafana service spec
  ansible.builtin.copy:
    dest: "{{ bootwright_ceph_remote_work_dir }}/grafana-service.yaml"
    content: "{{ bootwright_ceph_grafana_spec | to_nice_yaml }}"
    mode: "0600"
  no_log: "{{ bootwright_no_log | default(true) | bool }}"
  when: bootwright_ceph_grafana.hosts is defined

- name: Read the Grafana spec the cephadm store already holds
  ansible.builtin.command:
    argv:
      - cephadm
      - shell
      - --
      - ceph
      - config-key
      - get
      - mgr/cephadm/spec.grafana
  register: bootwright_ceph_grafana_stored
  changed_when: false
  failed_when: false
  no_log: "{{ bootwright_no_log | default(true) | bool }}"
  when: bootwright_ceph_grafana.hosts is defined

- name: Decide whether the stored Grafana credential already matches
  ansible.builtin.set_fact:
    bootwright_ceph_grafana_credential_settled: >-
      {{ bootwright_ceph_grafana_stored_spec.initial_admin_password | default('')
         == bootwright_ceph_grafana_spec.spec.initial_admin_password }}
  vars:
    bootwright_ceph_grafana_stored_envelope: >-
      {{ bootwright_ceph_grafana_stored.stdout | default('') | trim | default('{}', true) | from_json }}
    bootwright_ceph_grafana_stored_spec: >-
      {{ (bootwright_ceph_grafana_stored_envelope.spec | default({})).spec | default({}) }}
  no_log: "{{ bootwright_no_log | default(true) | bool }}"
  when: bootwright_ceph_grafana.hosts is defined

- name: Apply the Grafana service spec
  ansible.builtin.command:
    argv:
      - cephadm
      - shell
      - --mount
      - "{{ bootwright_ceph_remote_work_dir }}:/mnt"
      - --
      - ceph
      - orch
      - apply
      - --in-file
      - /mnt/grafana-service.yaml
  register: bootwright_ceph_grafana_apply
  changed_when: true
  failed_when: false
  when: bootwright_ceph_grafana.hosts is defined

- name: Refuse a Grafana service spec cephadm reported an error for
  ansible.builtin.assert:
    that:
      - (bootwright_ceph_grafana_apply.rc | default(1) | int) == 0
    fail_msg: >-
      cephadm refused the Grafana service spec for
      {{ bootwright_selected_storage_cluster.name }}:
      {{ ((bootwright_ceph_grafana_apply.stdout | default('') ~ ' '
           ~ (bootwright_ceph_grafana_apply.stderr | default('')))
          | regex_replace('initial_admin_password[\s\S]*', '<redacted>')) }}
    success_msg: >-
      cephadm accepted the Grafana service spec.
  when: bootwright_ceph_grafana.hosts is defined

- name: Recreate the Grafana daemons so the credential reaches grafana.ini
  ansible.builtin.command:
    argv:
      - cephadm
      - shell
      - --
      - ceph
      - orch
      - redeploy
      - grafana
  changed_when: true
  when: >-
    bootwright_ceph_grafana.hosts is defined
    and not (bootwright_ceph_grafana_credential_settled | default(false) | bool)
