---
- name: Resolve captured Ceph auth key
  ansible.builtin.set_fact:
    bootwright_ceph_op_capture_cluster: "{{ bootwright_ceph_op_capture.cluster | default('') }}"
    bootwright_ceph_op_capture_field: "{{ bootwright_ceph_op_capture.field | default('') }}"
    bootwright_ceph_op_key_line: "{{ (bootwright_ceph_op_output.split('\n') | select('match', '^\\s*key\\s*=') | list | first | default('')) }}"
  no_log: true
  when:
    - bootwright_ceph_op_capture | length > 0
    - bootwright_ceph_op_capture.type | default('') == 'ceph-auth-key'

- name: Add captured Ceph auth key to Data Foundation result
  ansible.builtin.set_fact:
    bootwright_data_foundation_result: >-
      {{
        bootwright_data_foundation_result
        | combine(
            dict([(bootwright_ceph_op_capture_cluster, dict([(bootwright_ceph_op_capture_field, bootwright_ceph_op_key)]))]),
            recursive=True
          )
      }}
  vars:
    bootwright_ceph_op_key: "{{ bootwright_ceph_op_key_line | regex_replace('^\\s*key\\s*=\\s*', '') | trim }}"
  no_log: true
  when:
    - bootwright_ceph_op_capture_cluster | default('') | length > 0
    - bootwright_ceph_op_capture_field | default('') | length > 0
    - bootwright_ceph_op_key | length > 0

- name: Classify RGW capture operation
  ansible.builtin.set_fact:
    bootwright_ceph_op_capture_rgw: true
  no_log: true
  when:
    - bootwright_ceph_op_capture | length > 0
    - bootwright_ceph_op_capture.type | default('') == 'rgw-user'
    - bootwright_ceph_op_output | length > 0

- name: Parse RGW user credentials
  ansible.builtin.set_fact:
    bootwright_ceph_op_capture_cluster: "{{ bootwright_ceph_op_capture.cluster | default('') }}"
    bootwright_ceph_op_rgw_payload: "{{ bootwright_ceph_op_output | from_json }}"
  no_log: true
  when: bootwright_ceph_op_capture_rgw | bool

- name: Add captured RGW user to Data Foundation result
  ansible.builtin.set_fact:
    bootwright_data_foundation_result: >-
      {{
        bootwright_data_foundation_result
        | combine(
            dict([(bootwright_ceph_op_capture_cluster, {
              'rgwAccessKey': bootwright_ceph_op_rgw_first_key.access_key | default(''),
              'rgwSecretKey': bootwright_ceph_op_rgw_first_key.secret_key | default('')
            })]),
            recursive=True
          )
      }}
  vars:
    bootwright_ceph_op_rgw_first_key: "{{ bootwright_ceph_op_rgw_payload['keys'] | default([]) | first | default({}) }}"
  no_log: true
  when:
    - bootwright_ceph_op_capture_rgw | bool
    - bootwright_ceph_op_capture_cluster | default('') | length > 0
    - bootwright_ceph_op_rgw_first_key.access_key | default('') | length > 0
    - bootwright_ceph_op_rgw_first_key.secret_key | default('') | length > 0
