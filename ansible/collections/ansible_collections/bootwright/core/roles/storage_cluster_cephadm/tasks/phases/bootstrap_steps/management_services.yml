---
- name: Assemble secret-bearing management service specs
  ansible.builtin.set_fact:
    bootwright_ceph_management_specs: >-
      {{
        [
          {
            'service_type': 'mgmt-gateway',
            'placement': {'hosts': bootwright_ceph_management.hosts},
            'spec': (
              {
                'port': bootwright_ceph_management.port,
                'virtual_ip': bootwright_ceph_management.virtualIP,
                'enable_auth': bootwright_ceph_management.enableAuth
              }
              | combine(
                  {
                    'ssl_certificate': lookup('ansible.builtin.file', bootwright_ceph_management.tls.certificatePath),
                    'ssl_certificate_key': lookup('ansible.builtin.file', bootwright_ceph_management.tls.keyPath)
                  } if (bootwright_ceph_management.tls is defined) else {}
                )
            )
          }
        ]
        + (
          [
            {
              'service_type': 'oauth2-proxy',
              'placement': {'hosts': bootwright_ceph_management.hosts},
              'spec': (
                {
                  'provider_display_name': bootwright_ceph_management.oauth2Proxy.providerDisplayName,
                  'client_id': bootwright_ceph_management.oauth2Proxy.clientId,
                  'client_secret': lookup('ansible.builtin.file', bootwright_ceph_management.oauth2Proxy.clientSecretPath),
                  'oidc_issuer_url': bootwright_ceph_management.oauth2Proxy.oidcIssuerURL
                }
                | combine({'redirect_url': bootwright_ceph_management.oauth2Proxy.redirectURL} if (bootwright_ceph_management.oauth2Proxy.redirectURL | default('') | length > 0) else {})
                | combine({'https_address': bootwright_ceph_management.oauth2Proxy.httpsAddress} if (bootwright_ceph_management.oauth2Proxy.httpsAddress | default('') | length > 0) else {})
                | combine({'allowlist_domains': bootwright_ceph_management.oauth2Proxy.allowlistDomains} if (bootwright_ceph_management.oauth2Proxy.allowlistDomains | default([]) | length > 0) else {})
                | combine({'cookie_secret': lookup('ansible.builtin.file', bootwright_ceph_management.oauth2Proxy.cookieSecretPath)} if (bootwright_ceph_management.oauth2Proxy.cookieSecretPath | default('') | length > 0) else {})
                | combine({'ssl_certificate': lookup('ansible.builtin.file', bootwright_ceph_management.tls.certificatePath), 'ssl_certificate_key': lookup('ansible.builtin.file', bootwright_ceph_management.tls.keyPath)} if (bootwright_ceph_management.tls is defined) else {})
              )
            }
          ] if (bootwright_ceph_management.oauth2Proxy is defined) else []
        )
      }}
  no_log: "{{ bootwright_no_log | default(true) | bool }}"
  when: bootwright_ceph_management.hosts is defined

- name: Write management service spec
  ansible.builtin.copy:
    dest: "{{ bootwright_ceph_remote_work_dir }}/management-services.yaml"
    content: "{{ bootwright_ceph_management_specs | map('to_nice_yaml') | join('---\n') }}"
    mode: "0600"
  no_log: "{{ bootwright_no_log | default(true) | bool }}"
  when: bootwright_ceph_management.hosts is defined

- name: Read the Ceph configuration database for the dashboard settings
  ansible.builtin.command:
    argv:
      - cephadm
      - shell
      - --
      - ceph
      - config
      - dump
      - --format
      - json
  register: bootwright_ceph_config_dump
  changed_when: false
  failed_when: false
  when: bootwright_ceph_management.hosts is defined

- name: Resolve the live Ceph dashboard SSL and HTTP port settings
  ansible.builtin.set_fact:
    bootwright_ceph_dashboard_ssl_current: >-
      {{
        bootwright_ceph_config_options
        | selectattr('name', 'equalto', 'mgr/dashboard/ssl')
        | map(attribute='value') | list | first | default('') | string | trim
      }}
    bootwright_ceph_dashboard_port_current: >-
      {{
        bootwright_ceph_config_options
        | selectattr('name', 'equalto', 'mgr/dashboard/server_port')
        | map(attribute='value') | list | first | default('') | string | trim
      }}
  vars:
    bootwright_ceph_config_options: >-
      {{
        (bootwright_ceph_config_dump.stdout | default('') | trim | default('[]', true) | from_json)
        | selectattr('section', 'defined')
        | selectattr('name', 'defined')
        | selectattr('section', 'in', ['mgr', 'global'])
        | sort(attribute='section', reverse=True)
      }}
  when: bootwright_ceph_management.hosts is defined

- name: Disable Ceph dashboard SSL so it stops occupying the mgmt-gateway port
  ansible.builtin.command:
    argv:
      - cephadm
      - shell
      - --
      - ceph
      - config
      - set
      - mgr
      - mgr/dashboard/ssl
      - "false"
  register: bootwright_ceph_dashboard_ssl_disable
  changed_when: true
  when: >-
    bootwright_ceph_management.hosts is defined
    and (bootwright_ceph_dashboard_ssl_current | default('')) != 'false'

- name: Move the Ceph dashboard off its default HTTP port to avoid colliding with RGW or other daemons
  ansible.builtin.command:
    argv:
      - cephadm
      - shell
      - --
      - ceph
      - config
      - set
      - mgr
      - mgr/dashboard/server_port
      - "{{ bootwright_ceph_dashboard_http_port | default(8081) | int }}"
  register: bootwright_ceph_dashboard_port_set
  changed_when: true
  when: >-
    bootwright_ceph_management.hosts is defined
    and (bootwright_ceph_dashboard_port_current | default(''))
        != (bootwright_ceph_dashboard_http_port | default(8081) | string)

- name: Record whether the Ceph dashboard's SSL/port settings changed
  ansible.builtin.set_fact:
    bootwright_ceph_dashboard_reconfigured: >-
      {{
        (bootwright_ceph_dashboard_ssl_disable is changed)
        or (bootwright_ceph_dashboard_port_set is changed)
      }}
  when: bootwright_ceph_management.hosts is defined

- name: Check which endpoint the Ceph dashboard currently serves
  ansible.builtin.command:
    argv:
      - cephadm
      - shell
      - --
      - ceph
      - mgr
      - services
      - --format
      - json
  register: bootwright_ceph_mgr_services_current
  changed_when: false
  failed_when: false
  when: bootwright_ceph_management.hosts is defined

- name: Record the dashboard endpoint the managers currently serve
  ansible.builtin.set_fact:
    bootwright_ceph_dashboard_live_url: >-
      {{
        (bootwright_ceph_mgr_services_current.stdout | default('') | trim | default('{}', true) | from_json).dashboard
        | default('')
      }}
  when: bootwright_ceph_management.hosts is defined

- name: Decide whether manager daemons still hold the management gateway port
  ansible.builtin.set_fact:
    bootwright_ceph_mgr_restart_required: >-
      {{
        (bootwright_ceph_dashboard_reconfigured | default(false) | bool)
        or (
          (bootwright_ceph_dashboard_live_url | default('') | length > 0)
          and not (
            (bootwright_ceph_dashboard_live_url is match('http://'))
            and (bootwright_ceph_dashboard_live_url
                 is search(':' ~ (bootwright_ceph_dashboard_http_port | default(8081) | string)))
          )
        )
      }}
  when: bootwright_ceph_management.hosts is defined

- name: Capture the Ceph fsid that scopes the manager systemd units
  ansible.builtin.command:
    argv:
      - cephadm
      - shell
      - --
      - ceph
      - fsid
  register: bootwright_ceph_mgr_restart_fsid
  changed_when: false
  when: >-
    bootwright_ceph_management.hosts is defined
    and (bootwright_ceph_mgr_restart_required | default(false) | bool)

- name: Capture Ceph manager daemon identities before restart
  ansible.builtin.command:
    argv:
      - cephadm
      - shell
      - --
      - ceph
      - orch
      - ps
      - --daemon-type
      - mgr
      - --format
      - json
  register: bootwright_ceph_mgr_before_restart
  changed_when: false
  when: >-
    bootwright_ceph_management.hosts is defined
    and (bootwright_ceph_mgr_restart_required | default(false) | bool)

- name: Resolve the storage nodes that actually run a Ceph manager daemon
  ansible.builtin.set_fact:
    bootwright_ceph_mgr_restart_hosts: >-
      {{
        dict((bootwright_selected_storage_cluster.hosts | default([])
              | map(attribute='cephHostname') | map('split', '.') | map('first') | list)
             | zip(bootwright_selected_storage_cluster.hosts | default([])
                   | map(attribute='inventoryHost') | list))
        | dict2items
        | selectattr('key', 'in', bootwright_ceph_mgr_daemon_hosts)
        | map(attribute='value') | list
      }}
  vars:
    bootwright_ceph_mgr_daemon_hosts: >-
      {{
        (bootwright_ceph_mgr_before_restart.stdout | default('') | trim | default('[]', true) | from_json)
        | selectattr('hostname', 'defined')
        | map(attribute='hostname') | map('split', '.') | map('first') | list
      }}
  changed_when: false
  when: >-
    bootwright_ceph_management.hosts is defined
    and (bootwright_ceph_mgr_restart_required | default(false) | bool)

- name: Restart the Ceph manager systemd units so every dashboard releases its ports
  ansible.builtin.command:
    argv:
      - systemctl
      - restart
      - "ceph-{{ bootwright_ceph_mgr_restart_fsid.stdout | default('') | trim }}@mgr.*"
  changed_when: true
  delegate_to: "{{ bootwright_ceph_mgr_restart_host }}"
  loop: "{{ bootwright_ceph_mgr_restart_hosts | default([]) }}"
  loop_control:
    loop_var: bootwright_ceph_mgr_restart_host
  when: >-
    bootwright_ceph_management.hosts is defined
    and (bootwright_ceph_mgr_restart_required | default(false) | bool)

- name: Wait for every Ceph manager daemon to finish restarting
  ansible.builtin.command:
    argv:
      - cephadm
      - shell
      - --
      - ceph
      - orch
      - ps
      - --daemon-type
      - mgr
      - --format
      - json
  register: bootwright_ceph_mgr_after_restart
  changed_when: false
  failed_when: false
  retries: "{{ bootwright_ceph_mgr_restart_retries | default(30) | int }}"
  delay: "{{ bootwright_ceph_mgr_restart_delay | default(10) | int }}"
  until: >-
    (
      bootwright_ceph_mgr_after_restart.rc == 0
      and (
        (bootwright_ceph_mgr_after_restart.stdout | default('') | trim | default('[]', true) | from_json)
        | map(attribute='container_id', default='')
        | list
        | length
      ) == (
        (bootwright_ceph_mgr_before_restart.stdout | default('') | trim | default('[]', true) | from_json)
        | map(attribute='container_id', default='')
        | list
        | length
      )
      and (
        (
          (bootwright_ceph_mgr_after_restart.stdout | default('') | trim | default('[]', true) | from_json)
          | map(attribute='container_id', default='')
          | list
        )
        | intersect(
            (bootwright_ceph_mgr_before_restart.stdout | default('') | trim | default('[]', true) | from_json)
            | map(attribute='container_id', default='')
            | list
          )
        | length
      ) == 0
    )
    or
    ((bootwright_ceph_mgr_after_restart.attempts | default(1) | int)
     >= (bootwright_ceph_mgr_restart_retries | default(30) | int))
  when: >-
    bootwright_ceph_management.hosts is defined
    and (bootwright_ceph_mgr_restart_required | default(false) | bool)

- name: Evaluate whether every Ceph manager daemon restarted
  ansible.builtin.set_fact:
    bootwright_ceph_mgr_restart_complete: >-
      {{
        (bootwright_ceph_mgr_after_restart.rc | default(1) | int) == 0
        and (
          (bootwright_ceph_mgr_after_restart.stdout | default('') | trim | default('[]', true) | from_json)
          | map(attribute='container_id', default='')
          | list
          | length
        ) == (
          (bootwright_ceph_mgr_before_restart.stdout | default('') | trim | default('[]', true) | from_json)
          | map(attribute='container_id', default='')
          | list
          | length
        )
        and (
          (
            (bootwright_ceph_mgr_after_restart.stdout | default('') | trim | default('[]', true) | from_json)
            | map(attribute='container_id', default='')
            | list
          )
          | intersect(
              (bootwright_ceph_mgr_before_restart.stdout | default('') | trim | default('[]', true) | from_json)
              | map(attribute='container_id', default='')
              | list
            )
          | length
        ) == 0
      }}
  when: >-
    bootwright_ceph_management.hosts is defined
    and (bootwright_ceph_mgr_restart_required | default(false) | bool)

- name: Assert every Ceph manager daemon restarted onto the new dashboard settings
  ansible.builtin.assert:
    that:
      - bootwright_ceph_mgr_restart_complete | default(false) | bool
    fail_msg: >-
      Ceph cluster {{ bootwright_selected_storage_cluster.name }} still runs manager
      daemons that predate the dashboard SSL/port change, so their dashboards keep the
      management gateway port bound and cephadm silently fails to place mgmt-gateway
      daemons on the mgr hosts (CEPHADM_DAEMON_PLACE_FAIL; the service readiness gate
      would later report mgmt-gateway stuck below its declared count). Manager
      containers before restart:
      {{ (bootwright_ceph_mgr_before_restart.stdout | default('') | trim | default('[]', true) | from_json)
      | map(attribute='container_id', default='') | list }},
      after:
      {{ (bootwright_ceph_mgr_after_restart.stdout | default('') | trim | default('[]', true) | from_json)
      | map(attribute='container_id', default='') | list }}.
      The manager systemd units were restarted on
      {{ bootwright_ceph_mgr_restart_hosts | default([]) | join(', ')
         | default('(no declared storage node matched a live manager daemon hostname)', true) }}.
      Restart the ceph-<fsid>@mgr.* systemd units on the manager hosts, confirm
      `ceph mgr services` reports the dashboard on
      http://<mgr>:{{ bootwright_ceph_dashboard_http_port | default(8081) }}/, and
      re-run this apply.
  when: >-
    bootwright_ceph_management.hosts is defined
    and (bootwright_ceph_mgr_restart_required | default(false) | bool)

- name: Apply management service spec
  ansible.builtin.command:
    argv:
      - cephadm
      - shell
      - --mount
      - "{{ bootwright_ceph_remote_work_dir }}:/mnt"
      - --
      - ceph
      - orch
      - apply
      - -i
      - /mnt/management-services.yaml
  register: bootwright_ceph_management_apply
  changed_when: true
  failed_when: false
  no_log: "{{ bootwright_no_log | default(true) | bool }}"
  retries: "{{ bootwright_ceph_mgr_restart_retries | default(30) | int }}"
  delay: "{{ bootwright_ceph_mgr_restart_delay | default(10) | int }}"
  until: >-
    bootwright_ceph_management_apply.rc == 0
    or ((bootwright_ceph_management_apply.attempts | default(1) | int)
        >= (bootwright_ceph_mgr_restart_retries | default(30) | int))
  when: bootwright_ceph_management.hosts is defined

- name: Refuse a management service spec cephadm reported an error for
  ansible.builtin.assert:
    that:
      - bootwright_ceph_management_apply.rc | default(1) | int == 0
      - not (bootwright_ceph_management_apply.stdout | default('') | lower is search('error|failed|invalid'))
      - not (bootwright_ceph_management_apply.stderr | default('') | lower is search('error|failed|invalid'))
    fail_msg: >-
      cephadm reported an error while applying the management service spec for
      {{ bootwright_selected_storage_cluster.name }}. The file carries one document per
      management service ({{ bootwright_ceph_management_specs | map(attribute='service_type') | join(', ') }}),
      and `ceph orch apply -i` can reject one document while accepting the rest, exiting
      zero — a rejected oauth2-proxy document, for instance, leaves a mgmt-gateway that
      demands authentication with nothing to authenticate against, and the service
      readiness gate cannot see it because the rejected service is never created.
      rc: {{ bootwright_ceph_management_apply.rc | default('<none>') }}
      cephadm said: {{ bootwright_ceph_management_apply_output }}
    success_msg: >-
      cephadm accepted every management service document.
  vars:
    bootwright_ceph_management_apply_output: >-
      {{ ((bootwright_ceph_management_apply.stdout | default('')) ~ ' '
          ~ (bootwright_ceph_management_apply.stderr | default('')))
         | regex_replace('got "[\s\S]*', 'got <spec redacted>')
         | regex_replace('-----BEGIN[\s\S]*', '<redacted>') }}
  when: bootwright_ceph_management.hosts is defined
