---
- name: Configure cephadm SSH trust
  ansible.builtin.command:
    argv:
      - timeout
      - "--kill-after={{ bootwright_ceph_timeout_kill_after_seconds }}"
      - "{{ bootwright_ceph_config_timeout_seconds }}"
      - cephadm
      - shell
      - --mount
      - "{{ bootwright_ceph_remote_work_dir }}:/mnt"
      - --
      - ceph
      - cephadm
      - set-ssh-config
      - -i
      - /mnt/ssh_config
  register: bootwright_ceph_ssh_config
  changed_when: true
  when:
    - bootwright_selected_storage_cluster.clusterSSH.privateKeyPath | default('') | length > 0
    - bootwright_selected_storage_cluster.clusterSSH.knownHostsPath | default('') | length > 0

- name: Apply Ceph host, mon, and mgr specs
  ansible.builtin.command:
    argv:
      - timeout
      - "--kill-after={{ bootwright_ceph_timeout_kill_after_seconds }}"
      - "{{ bootwright_ceph_orchestration_timeout_seconds }}"
      - cephadm
      - shell
      - --mount
      - "{{ bootwright_ceph_remote_work_dir }}:/mnt"
      - --
      - ceph
      - orch
      - apply
      - -i
      - /mnt/bootstrap-spec.yaml
  register: bootwright_ceph_host_spec_apply
  changed_when: true
  failed_when: bootwright_ceph_host_spec_apply.rc | default(0) | int in [124, 137]

- name: Refuse a bootstrap spec cephadm reported an error for
  ansible.builtin.assert:
    that:
      - bootwright_ceph_host_spec_apply.rc | default(1) | int == 0
      - not (bootwright_ceph_host_spec_apply.stdout | default('') | lower is search('error|failed|invalid|unknown host'))
      - not (bootwright_ceph_host_spec_apply.stderr | default('') | lower is search('error|failed|invalid|unknown host'))
    fail_msg: >-
      cephadm reported an error while applying the host/mon/mgr spec for
      {{ bootwright_selected_storage_cluster.name }}. `ceph orch apply -i` takes a
      multi-document spec and can reject one document while accepting the rest, exiting
      zero, so the run must read what it said rather than trust the exit code: a rejected
      mon document leaves the bootstrap default placement (`count: <n>`) in force, and
      cephadm then picks mon hosts by its own scheduler instead of the declared set —
      which surfaces much later, and misleadingly, as a monmap readiness failure. A
      non-zero exit fails this assert on its own, so a cephadm invocation that dies
      without printing any of those words is refused here rather than carried into the
      OSD spec apply and the monmap poll.
      rc: {{ bootwright_ceph_host_spec_apply.rc | default('<none>') }}
      stdout: {{ bootwright_ceph_host_spec_apply.stdout | default('') }}
      stderr: {{ bootwright_ceph_host_spec_apply.stderr | default('') }}

- name: Read back the orchestrator hosts cephadm accepted
  ansible.builtin.command:
    argv:
      - timeout
      - "--kill-after={{ bootwright_ceph_timeout_kill_after_seconds }}"
      - "{{ bootwright_ceph_probe_timeout_seconds }}"
      - cephadm
      - shell
      - --
      - ceph
      - orch
      - host
      - ls
      - --format
      - json
  register: bootwright_ceph_orch_hosts
  changed_when: false
  failed_when: bootwright_ceph_orch_hosts.rc | default(0) | int in [124, 137]

- name: Refuse a declared mon host cephadm does not know
  ansible.builtin.assert:
    that:
      - bootwright_ceph_declared_mon_hosts | difference(bootwright_ceph_known_orch_hosts) | length == 0
    fail_msg: >-
      Ceph cluster {{ bootwright_selected_storage_cluster.name }} declares mon(s) on
      {{ bootwright_ceph_declared_mon_hosts | difference(bootwright_ceph_known_orch_hosts) | join(', ') }},
      which cephadm does not list as orchestrator host(s)
      ({{ bootwright_ceph_known_orch_hosts | join(', ') }}). A mon placement naming an
      unknown host is rejected as a whole, leaving the bootstrap default placement in
      force and letting cephadm choose mon hosts itself. Add the host to the cluster —
      or, if it is an arbiter outside the mon public_network, place it in a network the
      cluster serves — before re-applying.
    success_msg: >-
      Every declared mon host is a known orchestrator host.
  vars:
    bootwright_ceph_declared_mon_hosts: >-
      {{ (bootwright_selected_storage_cluster.monReadiness | default({})).mons | default([])
         | selectattr('name', 'defined') | map(attribute='name')
         | reject('equalto', '') | list }}
    bootwright_ceph_known_orch_hosts: >-
      {{ (bootwright_ceph_orch_hosts.stdout | default('[]', true) | from_json)
         | selectattr('hostname', 'defined') | map(attribute='hostname') | list }}
  when: bootwright_ceph_orch_hosts.rc | default(1) | int == 0

- name: Resolve the declared OSD hosts the device scan must reach
  ansible.builtin.set_fact:
    bootwright_ceph_declared_osd_hosts: >-
      {{ ((bootwright_selected_storage_cluster.hosts | default([])
           | selectattr('cephHostname', 'defined')
           | rejectattr('cephHostname', 'equalto', '')
           | selectattr('devices', 'defined')
           | rejectattr('devices', 'equalto', none)
           | rejectattr('devices', 'equalto', [])
           | map(attribute='cephHostname') | list)
          + (bootwright_selected_storage_cluster.hosts | default([])
             | selectattr('osdReclaimAll', 'defined')
             | selectattr('cephHostname', 'defined')
             | rejectattr('cephHostname', 'equalto', '')
             | map(attribute='cephHostname') | list)
          + (bootwright_selected_storage_cluster.hosts | default([])
             | selectattr('osdDeviceFilters', 'defined')
             | selectattr('cephHostname', 'defined')
             | rejectattr('cephHostname', 'equalto', '')
             | map(attribute='cephHostname') | list))
         | unique | list }}
    bootwright_ceph_osd_scan_mode: >-
      {{ (bootwright_selected_storage_cluster.osdReadiness | default({})).mode | default('atLeastOne') }}
    bootwright_ceph_osd_scan_attempts: >-
      {{ bootwright_ceph_osd_scan_retries
         | default([90, (((bootwright_selected_storage_cluster.osdReadiness | default({})).expectedCount
                          | default(0) | int) * 6)] | max)
         | int }}

- name: Set the device-scan wall-clock deadline
  ansible.builtin.set_fact:
    bootwright_ceph_osd_scan_budget_seconds: "{{ bootwright_ceph_osd_scan_wall_budget | int }}"
    bootwright_ceph_osd_scan_deadline: >-
      {{ (now(utc=true).timestamp() | int)
         + (bootwright_ceph_osd_scan_wall_budget | int) }}
  vars:
    bootwright_ceph_osd_scan_wall_budget: >-
      {{ bootwright_ceph_osd_scan_wall_seconds
         | default((bootwright_ceph_osd_scan_attempts | int)
                   * (bootwright_ceph_osd_scan_delay | default(10) | int))
         | int }}

- name: Wait for cephadm to inventory every declared OSD host before the OSD apply
  ansible.builtin.command:
    argv:
      - timeout
      - "--kill-after={{ bootwright_ceph_timeout_kill_after_seconds }}"
      - "{{ bootwright_ceph_inventory_probe_timeout_seconds }}"
      - cephadm
      - shell
      - --
      - ceph
      - orch
      - device
      - ls
      - --format
      - json
      - --refresh
  register: bootwright_ceph_osd_scan_device_ls
  changed_when: false
  failed_when: bootwright_ceph_osd_scan_device_ls.rc | default(0) | int in [124, 137]
  retries: "{{ bootwright_ceph_osd_scan_attempts | int }}"
  delay: "{{ bootwright_ceph_osd_scan_delay | default(10) | int }}"
  until: >-
    (bootwright_ceph_osd_scan_device_ls.rc | default(0) | int in [124, 137]) or (
      bootwright_ceph_osd_scan_device_ls.rc == 0
      and (bootwright_ceph_osd_scan_device_ls.stdout | default('')
           | bootwright.core.bootwright_json_list_probe).valid
      and (bootwright_ceph_declared_osd_hosts
           | difference(
               (bootwright_ceph_osd_scan_device_ls.stdout | default('')
                | bootwright.core.bootwright_json_list_probe).value
               | selectattr('devices', 'defined')
               | rejectattr('devices', 'equalto', [])
               | map(attribute='name') | list)) | length == 0
    )
    or
    ((bootwright_ceph_osd_scan_device_ls.attempts | default(1) | int)
     >= (bootwright_ceph_osd_scan_attempts | int))
    or
    ((now(utc=true).timestamp() | int)
     >= (bootwright_ceph_osd_scan_deadline | int))
  when:
    - bootwright_ceph_declared_osd_hosts | length > 0
    - bootwright_ceph_osd_scan_mode != 'skip'

- name: Resolve the declared OSD hosts cephadm has not inventoried
  ansible.builtin.set_fact:
    bootwright_ceph_osd_scan_missing_hosts: >-
      {{ bootwright_ceph_declared_osd_hosts
         | reject('in',
                  (bootwright_ceph_osd_scan_device_ls.stdout | default('')
                   | bootwright.core.bootwright_json_list_probe).value
                  | selectattr('devices', 'defined')
                  | rejectattr('devices', 'equalto', [])
                  | map(attribute='name') | list) | list }}
  when:
    - bootwright_ceph_declared_osd_hosts | length > 0
    - bootwright_ceph_osd_scan_mode != 'skip'

- name: Report declared OSD hosts whose device inventory never appeared
  ansible.builtin.debug:
    msg: >-
      Ceph cluster {{ bootwright_selected_storage_cluster.name }}: cephadm holds no
      device inventory for
      {{ bootwright_ceph_osd_scan_missing_hosts | join(', ') }} —
      {{ bootwright_ceph_osd_scan_missing_hosts | length }} of
      {{ bootwright_ceph_declared_osd_hosts | length }} declared OSD host(s) — within
      {{ bootwright_ceph_osd_scan_attempts }} attempts or
      {{ bootwright_ceph_osd_scan_budget_seconds }}s, whichever came first. Being listed
      by `ceph orch host ls` is bookkeeping cephadm records the moment it accepts the host
      document; it says nothing about whether cephadm has ever connected to the host and
      run ceph-volume inventory on it. Applying the OSD spec anyway: it is a declaration
      cephadm keeps reconciling as inventory arrives, so it consumes no disk here and
      lands the OSDs by itself if the scan completes during the readiness wait — waiting
      longer at this step only delays that. The OSD readiness gate that follows is the
      single fail-closed point for this cluster; it names a host cephadm never scanned as
      unexamined rather than as dirty, dates the orchestrator cache, and refuses to
      recommend a wipe on this evidence. The usual causes are a host cephadm cannot reach
      over its cephadm SSH identity, a container-image pull failure on that host
      (registry, mirror or proxy), or a cephadm mgr module that restarted and is no longer
      refreshing — check `ceph orch host ls --detail`, `ceph log last 200 cephadm`, and
      force a re-scan with `ceph mgr fail`.
      Device inventory read back (ceph orch device ls --format json):
      {{ (bootwright_ceph_osd_scan_device_ls.stdout | default('') | trim)
      or ('(ceph orch device ls failed, rc=' ~ (bootwright_ceph_osd_scan_device_ls.rc | default('unknown')) ~ ')') }}
  when: bootwright_ceph_osd_scan_missing_hosts | default([]) | length > 0

- name: Refuse dirty OSD devices selected through dynamic filters
  ansible.builtin.include_tasks: osd_filter_gate.yml

- name: Auto-reclaim dirty filter-selected OSD devices
  ansible.builtin.include_tasks: osd_reclaim.yml

- name: Apply Ceph OSD service spec
  ansible.builtin.command:
    argv:
      - timeout
      - "--kill-after={{ bootwright_ceph_timeout_kill_after_seconds }}"
      - "{{ bootwright_ceph_orchestration_timeout_seconds }}"
      - cephadm
      - shell
      - --mount
      - "{{ bootwright_ceph_remote_work_dir }}:/mnt"
      - --
      - ceph
      - orch
      - apply
      - -i
      - /mnt/core-services.yaml
  register: bootwright_ceph_core_services_apply
  changed_when: true
  failed_when: bootwright_ceph_core_services_apply.rc | default(0) | int in [124, 137]

- name: Refuse a core service spec cephadm reported an error for
  ansible.builtin.assert:
    that:
      - bootwright_ceph_core_services_apply.rc | default(1) | int == 0
      - not (bootwright_ceph_core_services_apply.stdout | default('') | lower is search('error|failed|invalid|specvalidationerror|unexpected keyword'))
      - not (bootwright_ceph_core_services_apply.stderr | default('') | lower is search('error|failed|invalid|specvalidationerror|unexpected keyword'))
    fail_msg: >-
      cephadm reported an error while applying the core service spec (the OSD drivegroups) for
      {{ bootwright_selected_storage_cluster.name }}. `ceph orch apply -i` takes a
      multi-document spec and can reject ONE document while accepting the rest and still
      exiting zero, so the run must read what it said rather than trust the exit code.
      A rejected document here is never created, and the service-readiness gate cannot
      catch it: that gate compares running against size for the services `ceph orch ls`
      reports, and a service cephadm refused is simply absent from that list. The apply
      would then go green with a declared OSD drivegroup missing, and the failure would
      surface days later as a consumer that cannot attach.
      rc: {{ bootwright_ceph_core_services_apply.rc | default('<none>') }}
      stdout: {{ bootwright_ceph_core_services_apply.stdout | default('') }}
      stderr: {{ bootwright_ceph_core_services_apply.stderr | default('') }}
