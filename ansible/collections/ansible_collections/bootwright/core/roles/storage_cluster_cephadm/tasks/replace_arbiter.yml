---
- name: Validate the Ceph command timeout contract
  ansible.builtin.import_tasks: timeout_contract.yml

- name: Refuse replacement without controller-rendered continuation commands
  ansible.builtin.assert:
    that:
      - (bootwright_mutating_invocation | default('') | trim | length) > 0
      - (bootwright_arbiter_degraded_invocation | default('') | trim | length) > 0
      - (bootwright_arbiter_same_site_invocation | default('') | trim | length) > 0
      - (bootwright_arbiter_unreachable_invocation | default('') | trim | length) > 0
    fail_msg: >-
      The controller did not provide every resolved replacement continuation.
      This role cannot reconstruct operator context, identity, selection,
      authorization, confirmation, or output intent, so it refuses before reading
      or changing cluster state. Invoke it through the owning Bootwright CLI.
    quiet: true

- name: Read the live monmap before touching the stretch tiebreaker
  ansible.builtin.include_tasks: replace_arbiter_steps/probe.yml

- name: Report an arbiter that already answers as the tiebreaker
  ansible.builtin.debug:
    msg: >-
      Storage cluster {{ bootwright_arbiter_cluster_name }} already carries
      mon.{{ bootwright_arbiter_desired_mon }} as its stretch tiebreaker; nothing to
      replace.
  when: bootwright_arbiter_settled | bool

- name: Stop once the desired arbiter is already the tiebreaker
  ansible.builtin.meta: end_host
  when: bootwright_arbiter_settled | bool

- name: Refuse a tiebreaker swap on a cluster whose mons are not all in quorum
  ansible.builtin.assert:
    that:
      - (bootwright_arbiter_absent_mons | length) == 0 or (bootwright_arbiter_allow_degraded | default(false) | bool)
    fail_msg: >-
      Storage cluster {{ bootwright_arbiter_cluster_name }} has mon(s)
      {{ bootwright_arbiter_absent_mons | join(', ') }} outside quorum, so the monmap is
      already degraded. `ceph mon set_new_tiebreaker` needs a quorum to commit, and
      swapping the arbiter while a data site is down removes the very vote that is
      holding the remaining quorum together — if the swap stalls part-way the cluster
      can lose quorum outright and stop serving I/O. Bring those mons back, or proceed
      deliberately with `{{ bootwright_arbiter_degraded_invocation }}`. Live monmap:
      {{ bootwright_arbiter_mon_dump_raw | default('(unavailable)') }}
    quiet: true

- name: Enrol and deploy the replacement arbiter mon
  ansible.builtin.include_tasks: replace_arbiter_steps/add_new_mon.yml

- name: Switch the stretch tiebreaker onto the replacement mon
  ansible.builtin.include_tasks: replace_arbiter_steps/switch_tiebreaker.yml

- name: Retire the mon and host of the arbiter that was replaced
  ansible.builtin.include_tasks: replace_arbiter_steps/retire_old.yml

- name: Verify the replacement arbiter holds the tiebreaker alone
  ansible.builtin.include_tasks: replace_arbiter_steps/verify.yml
