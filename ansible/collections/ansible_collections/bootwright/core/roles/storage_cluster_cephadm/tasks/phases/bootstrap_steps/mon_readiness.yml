---
- name: Resolve the Ceph mons the topology operations address
  ansible.builtin.set_fact:
    bootwright_ceph_declared_mons: >-
      {{ (bootwright_selected_storage_cluster.monReadiness | default({})).mons | default([]) | list }}
    bootwright_ceph_declared_mon_daemons: >-
      {{ (bootwright_selected_storage_cluster.monReadiness | default({})).mons | default([])
         | map(attribute='daemon') | reject('equalto', '') | list }}
  changed_when: false

- name: Wait for every declared Ceph mon to join the monmap
  ansible.builtin.command:
    argv:
      - timeout
      - "--kill-after={{ bootwright_ceph_timeout_kill_after_seconds }}"
      - "{{ bootwright_ceph_probe_timeout_seconds }}"
      - cephadm
      - shell
      - --
      - ceph
      - mon
      - dump
      - --format
      - json
  register: bootwright_ceph_mon_dump
  changed_when: false
  failed_when: bootwright_ceph_mon_dump.rc | default(0) | int in [124, 137]
  retries: "{{ bootwright_ceph_mon_readiness_retries | default(60) | int }}"
  delay: "{{ bootwright_ceph_mon_readiness_delay | default(10) | int }}"
  until: >-
    (bootwright_ceph_mon_dump.rc | default(0) | int in [124, 137]) or (
      (((bootwright_ceph_mon_dump.rc | default(1) | int) == 0
           or ((bootwright_ceph_mon_dump.stdout | default('', true) | regex_search('[\}\]]\\s*$')) is not none))
           or ((bootwright_ceph_mon_dump.stdout | default('', true) | regex_search('[\}\]]\\s*$')) is not none))
      and (
        bootwright_ceph_declared_mon_daemons
        | difference((bootwright_ceph_mon_dump.stdout | default('{}', true) | from_json).mons
                     | default([]) | map(attribute='name') | list)
        | length
      ) == 0
    )
    or
    ((bootwright_ceph_mon_dump.attempts | default(1) | int)
     >= (bootwright_ceph_mon_readiness_retries | default(60) | int))
  when: bootwright_ceph_declared_mon_daemons | length > 0

- name: Resolve the declared Ceph mons still absent from the monmap
  ansible.builtin.set_fact:
    bootwright_ceph_missing_mon_daemons: >-
      {{ bootwright_ceph_declared_mon_daemons
         | difference((bootwright_ceph_mon_dump.stdout | default('{}', true) | from_json).mons
                      | default([]) | map(attribute='name') | list)
         | list }}
    bootwright_ceph_mons_ready: >-
      {{
        ((bootwright_ceph_mon_dump.rc | default(1) | int) == 0
           or ((bootwright_ceph_mon_dump.stdout | default('', true) | regex_search('[\}\]]\\s*$')) is not none))
        and (
          bootwright_ceph_declared_mon_daemons
          | difference((bootwright_ceph_mon_dump.stdout | default('{}', true) | from_json).mons
                       | default([]) | map(attribute='name') | list)
          | length
        ) == 0
      }}
  changed_when: false
  when: bootwright_ceph_declared_mon_daemons | length > 0

- name: Collect the declared Ceph mon service when mons did not join the monmap
  ansible.builtin.command:
    argv:
      - timeout
      - "--kill-after={{ bootwright_ceph_timeout_kill_after_seconds }}"
      - "{{ bootwright_ceph_probe_timeout_seconds }}"
      - cephadm
      - shell
      - --
      - ceph
      - orch
      - ls
      - --service_type
      - mon
      - --format
      - yaml
  register: bootwright_ceph_mon_service_ls
  changed_when: false
  failed_when: bootwright_ceph_mon_service_ls.rc | default(0) | int in [124, 137]
  when:
    - bootwright_ceph_declared_mon_daemons | length > 0
    - not (bootwright_ceph_mons_ready | default(false) | bool)

- name: Collect Ceph mon daemon placement when mons did not join the monmap
  ansible.builtin.command:
    argv:
      - timeout
      - "--kill-after={{ bootwright_ceph_timeout_kill_after_seconds }}"
      - "{{ bootwright_ceph_probe_timeout_seconds }}"
      - cephadm
      - shell
      - --
      - ceph
      - orch
      - ps
      - --daemon-type
      - mon
      - --format
      - yaml
  register: bootwright_ceph_mon_daemon_ps
  changed_when: false
  failed_when: bootwright_ceph_mon_daemon_ps.rc | default(0) | int in [124, 137]
  when:
    - bootwright_ceph_declared_mon_daemons | length > 0
    - not (bootwright_ceph_mons_ready | default(false) | bool)

- name: Collect Ceph orchestrator host status when mons did not join the monmap
  ansible.builtin.command:
    argv:
      - timeout
      - "--kill-after={{ bootwright_ceph_timeout_kill_after_seconds }}"
      - "{{ bootwright_ceph_probe_timeout_seconds }}"
      - cephadm
      - shell
      - --
      - ceph
      - orch
      - host
      - ls
      - --format
      - yaml
  register: bootwright_ceph_mon_host_ls
  changed_when: false
  failed_when: bootwright_ceph_mon_host_ls.rc | default(0) | int in [124, 137]
  when:
    - bootwright_ceph_declared_mon_daemons | length > 0
    - not (bootwright_ceph_mons_ready | default(false) | bool)

- name: Collect the configured Ceph public network when mons did not join the monmap
  ansible.builtin.command:
    argv:
      - timeout
      - "--kill-after={{ bootwright_ceph_timeout_kill_after_seconds }}"
      - "{{ bootwright_ceph_probe_timeout_seconds }}"
      - cephadm
      - shell
      - --
      - ceph
      - config
      - dump
      - --format
      - json
  register: bootwright_ceph_mon_config_dump
  changed_when: false
  failed_when: bootwright_ceph_mon_config_dump.rc | default(0) | int in [124, 137]
  when:
    - bootwright_ceph_declared_mon_daemons | length > 0
    - not (bootwright_ceph_mons_ready | default(false) | bool)

- name: Collect recent cephadm events when mons did not join the monmap
  ansible.builtin.command:
    argv:
      - timeout
      - "--kill-after={{ bootwright_ceph_timeout_kill_after_seconds }}"
      - "{{ bootwright_ceph_probe_timeout_seconds }}"
      - cephadm
      - shell
      - --
      - ceph
      - log
      - last
      - "100"
      - cephadm
  register: bootwright_ceph_mon_cephadm_log
  changed_when: false
  failed_when: bootwright_ceph_mon_cephadm_log.rc | default(0) | int in [124, 137]
  when:
    - bootwright_ceph_declared_mon_daemons | length > 0
    - not (bootwright_ceph_mons_ready | default(false) | bool)

- name: Assert every declared Ceph mon joined the monmap
  vars:
    bootwright_ceph_mon_public_networks: >-
      {{ (bootwright_ceph_mon_config_dump.stdout | default('[]', true) | from_json)
         | selectattr('name', 'defined')
         | selectattr('name', 'equalto', 'public_network')
         | map(attribute='value') | list }}
    bootwright_ceph_missing_mon_hosts: >-
      {{ bootwright_ceph_declared_mons | default([])
         | selectattr('daemon', 'in', bootwright_ceph_missing_mon_daemons | default([]))
         | map(attribute='name') | list }}
    bootwright_ceph_mon_placement_filters: >-
      {{ bootwright_ceph_mon_cephadm_log.stdout | default('')
         | regex_findall('.*Filtered out host.*') }}
    bootwright_ceph_mon_runtime_uid_gid_failures: >-
      {{ ((bootwright_ceph_mon_service_ls.stdout | default('')) ~ ' '
          ~ (bootwright_ceph_mon_cephadm_log.stdout | default('')))
         | regex_findall('Failed to extract uid/gid') }}
    bootwright_ceph_mon_runtime_ebpf_failures: >-
      {{ ((bootwright_ceph_mon_service_ls.stdout | default('')) ~ ' '
          ~ (bootwright_ceph_mon_cephadm_log.stdout | default('')))
         | regex_findall('failed to install eBPF device filter') }}
  ansible.builtin.assert:
    that:
      - bootwright_ceph_mons_ready | default(false) | bool
    fail_msg: >-
      Ceph cluster {{ bootwright_selected_storage_cluster.name }} did not bring every
      declared mon into the monmap after
      {{ bootwright_ceph_mon_readiness_retries | default(60) }} attempts. Absent:
      {{ bootwright_ceph_missing_mon_daemons | default([]) | join(', ') or 'unknown (ceph mon dump failed, rc=' ~ (bootwright_ceph_mon_dump.rc | default('unknown')) ~ ')' }}
      (orchestrator host{{ 's' if (bootwright_ceph_missing_mon_hosts | length) != 1 else '' }}
      {{ bootwright_ceph_missing_mon_hosts | join(', ') or 'unknown' }});
      declared: {{ bootwright_ceph_declared_mon_daemons | join(', ') }}.
      {% if bootwright_ceph_mon_runtime_uid_gid_failures | length > 0 %}
      READ THIS FIRST — cephadm could not start a container on a host at all, so no
      cause below applies. It logged `Failed to extract uid/gid for path /var/lib/ceph`
      while preparing a daemon: cephadm runs
      `podman run --entrypoint stat <image> -c '%u %g' /var/lib/ceph` before EVERY
      deployment to resolve the ceph uid/gid, so a host that fails it places no daemon
      of any kind — mon, crash and ceph-exporter alike — and its mon simply never
      appears in the monmap. This is a host container-runtime fault, not a mon, network
      or placement fault. The mon service events below name the affected host and carry
      the runtime's own error; read those rather than the mon evidence.
      {% if bootwright_ceph_mon_runtime_ebpf_failures | length > 0 %}
      The runtime reported `systemd failed to install eBPF device filter on cgroup`,
      which is the kernel refusing the cgroup-device BPF program that crun installs
      through the systemd cgroup manager. Lockdown is what refuses it, and EFI Secure
      Boot switches lockdown on automatically — confirm on the affected host with
      `mokutil --sb-state` and `cat /sys/kernel/security/lockdown`. Bootwright gates
      this before bootstrap and remediates it by selecting the cgroupfs cgroup manager
      in /etc/containers/containers.conf.d/20-bootwright-ceph-cgroup-manager.conf, so
      reaching it here means that gate did not run for the affected host this apply —
      check whether that file is present on it.
      {% endif %}
      {% endif %}
      {% if bootwright_ceph_mon_placement_filters | length > 0 %}
      READ THIS FIRST — cephadm logged that it dropped host(s) from a placement because
      they hold no address inside the mon public_network
      ({{ bootwright_ceph_mon_public_networks | join(', ') or 'unset' }}), which is by
      itself the whole explanation for any absent mon named in it:
      {{ bootwright_ceph_mon_placement_filters | join(' | ') }}.
      public_network accepts a comma-separated list, so admit such a host by adding its
      own subnet to spec.ceph.networks.publicCIDRs — that is how a stretch arbiter
      standing on a network of its own is placed — or move the host onto a network the
      cluster already serves. cephadm keeps the host in `placement:` either way, so the
      mon service below still lists it and reports `size:` above `running:`.
      {% endif %}
      The topology
      operations that follow address mons by name (`ceph mon set_location`, and for a
      stretch cluster `ceph mon enable_stretch_mode`), and Ceph answers
      `ENOENT: mon.<name> does not exist` for a mon that is not in the monmap, so this
      apply is failing closed here rather than part-way through the topology
      reconciliation.
      {% if bootwright_ceph_mon_runtime_uid_gid_failures | length == 0 %}
      A mon the orchestrator never placed is usually a mon-only condition rather than
      a broken host — OSDs on the same host deploy regardless.
      {% endif %}
      Read the declared mon service below FIRST: if its `placement:` shows a bare
      `count:` rather than the declared `hosts:` list, the mon document of the
      bootstrap spec was rejected and cephadm's bootstrap default is still in force,
      so cephadm picked the mon hosts by its own scheduler and the declared set was
      never requested at all — none of the causes below apply, and the usual reason is
      a declared mon host cephadm does not know (check it against the orchestrator
      host list below). Otherwise, the three usual causes: cephadm filtered the host
      out of the mon placement because it holds no address inside public_network
      ({{ bootwright_ceph_mon_public_networks | join(', ') or 'unset — cephadm normally sets it from the bootstrap --mon-ip subnet' }}),
      which it logs as `does not belong to mon public_network(s)`; the mon container
      never started, either because the image would not pull (registry, mirror or
      proxy) or because the host's container runtime cannot start a container at all,
      which cephadm reports as `Failed to extract uid/gid for path /var/lib/ceph`
      against that host; or the daemon
      is running but cannot join quorum because the mon ports (3300 and 6789) are
      blocked between the nodes — an OSD only needs to reach the existing mon
      outbound, so OSD health does not clear this. Declared mon service
      (ceph orch ls --service_type mon):
      {{ (bootwright_ceph_mon_service_ls.stdout | default('') | trim)
      or ('(ceph orch ls failed, rc=' ~ (bootwright_ceph_mon_service_ls.rc | default('unknown')) ~ ')'
      if (bootwright_ceph_mon_service_ls.rc | default(1) | int) != 0
      else '(cephadm carries NO mon service — the declared mon placement never landed)') }}
      Ceph mon daemon placement (ceph orch ps --daemon-type mon):
      {{ (bootwright_ceph_mon_daemon_ps.stdout | default('') | trim)
      or ('(ceph orch ps failed, rc=' ~ (bootwright_ceph_mon_daemon_ps.rc | default('unknown')) ~ ')'
      if (bootwright_ceph_mon_daemon_ps.rc | default(1) | int) != 0
      else '(no mon daemon is deployed beyond the bootstrap mon)') }}
      Ceph orchestrator hosts (ceph orch host ls):
      {{ (bootwright_ceph_mon_host_ls.stdout | default('') | trim)
      or ('(ceph orch host ls failed, rc=' ~ (bootwright_ceph_mon_host_ls.rc | default('unknown')) ~ ')'
      if (bootwright_ceph_mon_host_ls.rc | default(1) | int) != 0
      else '(no hosts are managed by the orchestrator)') }}
      Live monmap (ceph mon dump):
      {{ (bootwright_ceph_mon_dump.stdout | default('') | trim)
      or ('(ceph mon dump failed, rc=' ~ (bootwright_ceph_mon_dump.rc | default('unknown')) ~ ')') }}
      Recent cephadm events (ceph log last 100 cephadm):
      {{ (bootwright_ceph_mon_cephadm_log.stdout | default('') | trim)
      or '(cephadm event log unavailable)' }}
    quiet: true
  when: bootwright_ceph_declared_mon_daemons | length > 0
