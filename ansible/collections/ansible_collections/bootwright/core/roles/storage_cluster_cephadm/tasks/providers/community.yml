---
- name: Validate community Ceph provider has no vendor entitlement
  ansible.builtin.assert:
    that:
      - not (bootwright_ceph_provider.requiresRHSM | default(false) | bool)
      - not (bootwright_ceph_provider.requiresLicense | default(false) | bool)
    fail_msg: >-
      Ceph distribution {{ bootwright_ceph_provider_name }} uses the upstream community
      package source and must not require Red Hat or IBM entitlement material.

- name: Inspect obsolete Bootwright community dependency repository
  ansible.builtin.stat:
    path: "{{ bootwright_ceph_community_obsolete_dependency_repo_file }}"
    follow: false
  register: bootwright_ceph_community_obsolete_dependency_repo_stat
  changed_when: false

- name: Read obsolete Bootwright community dependency repository
  ansible.builtin.slurp:
    src: "{{ bootwright_ceph_community_obsolete_dependency_repo_file }}"
  register: bootwright_ceph_community_obsolete_dependency_repo
  changed_when: false
  failed_when: false
  when:
    - bootwright_ceph_community_obsolete_dependency_repo_stat.stat.isreg | default(false) | bool
    - not (bootwright_ceph_community_obsolete_dependency_repo_stat.stat.islnk | default(false) | bool)

- name: Refuse to remove an unrecognized community dependency repository
  ansible.builtin.assert:
    that:
      - >-
        not (bootwright_ceph_community_obsolete_dependency_repo_stat.stat.exists | default(false) | bool)
        or (
          bootwright_ceph_community_obsolete_dependency_repo_stat.stat.isreg | default(false) | bool
          and not (bootwright_ceph_community_obsolete_dependency_repo_stat.stat.islnk | default(false) | bool)
          and (bootwright_ceph_community_obsolete_dependency_repo.content | default('') | length > 0)
          and bootwright_ceph_community_obsolete_dependency_repo_sections | length > 0
          and (bootwright_ceph_community_obsolete_dependency_repo_sections
               | difference(bootwright_ceph_community_obsolete_dependency_repo_allowed_sections)
               | length == 0)
        )
    fail_msg: >-
      Refusing to remove {{ bootwright_ceph_community_obsolete_dependency_repo_file }}:
      it does not contain the three repository sections previously managed by Bootwright.
      Remove or disable that cross-distribution repository file after verifying its owner,
      then retry.
  vars:
    bootwright_ceph_community_obsolete_dependency_repo_sections: >-
      {{ (bootwright_ceph_community_obsolete_dependency_repo.content | default('') | b64decode)
         | regex_findall('(?m)^\[([^]]+)\]$') }}
    bootwright_ceph_community_obsolete_dependency_repo_allowed_sections:
      - bootwright-centos-stream-baseos
      - bootwright-centos-stream-appstream
      - bootwright-centos-stream-crb

- name: Remove obsolete Bootwright community dependency repository
  ansible.builtin.file:
    path: "{{ bootwright_ceph_community_obsolete_dependency_repo_file }}"
    state: absent
  when: bootwright_ceph_community_obsolete_dependency_repo.content | default('') | length > 0

- name: Resolve community Ceph package source
  ansible.builtin.set_fact:
    bootwright_ceph_community_version: "{{ bootwright_ceph_provider.community.version | default('') }}"
    bootwright_ceph_community_release: "{{ bootwright_ceph_provider.community.release | default('') }}"
    bootwright_ceph_community_mirror: "{{ (bootwright_ceph_provider.community.mirror | default(bootwright_ceph_community_default_mirror, true)) | regex_replace('/$', '') }}"
  changed_when: false

- name: Resolve community Ceph repository path segment
  ansible.builtin.set_fact:
    bootwright_ceph_community_repo_path: "rpm-{{ bootwright_ceph_community_version if bootwright_ceph_community_version | length > 0 else bootwright_ceph_community_release }}"
    bootwright_ceph_community_gpgkey: "{{ bootwright_ceph_community_mirror }}/{{ bootwright_ceph_community_release_key_path }}"
  changed_when: false

- name: Require an https community Ceph mirror
  ansible.builtin.assert:
    that:
      - bootwright_ceph_community_mirror is match('^https://')
    fail_msg: >-
      Refusing to fetch and execute cephadm over an insecure transport: set
      spec.ceph.community.mirror to an https:// URL (got
      {{ bootwright_ceph_community_mirror }}).

- name: Download cephadm utility to configure community Ceph repository
  ansible.builtin.get_url:
    url: "{{ bootwright_ceph_community_mirror }}/{{ bootwright_ceph_community_repo_path }}/el{{ ansible_distribution_major_version }}/noarch/cephadm"
    dest: "{{ bootwright_ceph_community_bootstrap_cephadm }}"
    checksum: "{{ ('sha256:' ~ bootwright_ceph_provider.community.checksum) if (bootwright_ceph_provider.community.checksum | default('') | length) > 0 else omit }}"
    owner: root
    group: root
    mode: "0755"

- name: Resolve EPEL bootstrap package source
  ansible.builtin.set_fact:
    bootwright_ceph_community_epel_url: "{{ bootwright_ceph_community_epel_release_url }}"
  changed_when: false

- name: Require an https EPEL bootstrap package source
  ansible.builtin.assert:
    that:
      - bootwright_ceph_community_epel_url is match('^https://')
    fail_msg: >-
      Refusing to install the EPEL bootstrap package over an insecure transport:
      set bootwright_ceph_community_epel_release_url to an https:// URL (got
      {{ bootwright_ceph_community_epel_url }}).

- name: Enable EPEL before cephadm configures the community Ceph repository
  ansible.builtin.dnf:
    name: "{{ bootwright_ceph_community_epel_url }}"
    state: present
    disable_gpg_check: true

- name: Trust the Ceph community release signing key
  ansible.builtin.rpm_key:
    key: "{{ bootwright_ceph_community_gpgkey }}"
    fingerprint: "{{ bootwright_ceph_community_release_gpg_fingerprint }}"
    state: present

- name: Configure community Ceph package repository through cephadm
  ansible.builtin.command:
    argv: >-
      {{
        [bootwright_ceph_community_bootstrap_cephadm, 'add-repo']
        + (['--version', bootwright_ceph_community_version] if bootwright_ceph_community_version | length > 0 else ['--release', bootwright_ceph_community_release])
        + ['--gpg-url', bootwright_ceph_community_gpgkey]
        + (['--repo-url', bootwright_ceph_community_mirror] if bootwright_ceph_community_mirror != bootwright_ceph_community_default_mirror else [])
      }}
    creates: "{{ bootwright_ceph_community_repo_file }}"

- name: Point existing community Ceph repository at the release signing key
  ansible.builtin.replace:
    path: "{{ bootwright_ceph_community_repo_file }}"
    regexp: '^gpgkey=.*$'
    replace: "gpgkey={{ bootwright_ceph_community_gpgkey }}"
