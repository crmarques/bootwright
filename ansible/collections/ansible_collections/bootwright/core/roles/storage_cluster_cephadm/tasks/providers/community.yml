---
- name: Validate community Ceph provider has no vendor entitlement
  ansible.builtin.assert:
    that:
      - not (bootwright_ceph_provider.requiresRHSM | default(false) | bool)
      - not (bootwright_ceph_provider.requiresLicense | default(false) | bool)
    fail_msg: >-
      Ceph distribution {{ bootwright_ceph_provider_name }} uses the upstream community
      package source and must not require Red Hat or IBM entitlement material.

- name: Resolve community Ceph package source
  ansible.builtin.set_fact:
    bootwright_ceph_community_version: "{{ bootwright_ceph_provider.community.version | default('') }}"
    bootwright_ceph_community_release: "{{ bootwright_ceph_provider.community.release | default('') }}"
    bootwright_ceph_community_mirror: "{{ (bootwright_ceph_provider.community.mirror | default(bootwright_ceph_community_default_mirror, true)) | regex_replace('/$', '') }}"
  changed_when: false

- name: Resolve community Ceph repository path segment
  ansible.builtin.set_fact:
    bootwright_ceph_community_repo_path: "rpm-{{ bootwright_ceph_community_version if bootwright_ceph_community_version | length > 0 else bootwright_ceph_community_release }}"
  changed_when: false

- name: Require an https community Ceph mirror
  ansible.builtin.assert:
    that:
      - bootwright_ceph_community_mirror is match('^https://')
    fail_msg: >-
      Refusing to fetch and execute cephadm over an insecure transport: set
      spec.ceph.community.mirror to an https:// URL (got
      {{ bootwright_ceph_community_mirror }}).

- name: Download cephadm utility to configure community Ceph repository
  ansible.builtin.get_url:
    url: "{{ bootwright_ceph_community_mirror }}/{{ bootwright_ceph_community_repo_path }}/el{{ ansible_distribution_major_version }}/noarch/cephadm"
    dest: "{{ bootwright_ceph_community_bootstrap_cephadm }}"
    checksum: "{{ ('sha256:' ~ bootwright_ceph_provider.community.checksum) if (bootwright_ceph_provider.community.checksum | default('') | length) > 0 else omit }}"
    owner: root
    group: root
    mode: "0755"

- name: Resolve EPEL bootstrap package source
  ansible.builtin.set_fact:
    bootwright_ceph_community_epel_url: "{{ bootwright_ceph_community_epel_release_url }}"
  changed_when: false

- name: Require an https EPEL bootstrap package source
  ansible.builtin.assert:
    that:
      - bootwright_ceph_community_epel_url is match('^https://')
    fail_msg: >-
      Refusing to install the EPEL bootstrap package over an insecure transport:
      set bootwright_ceph_community_epel_release_url to an https:// URL (got
      {{ bootwright_ceph_community_epel_url }}).

- name: Enable EPEL before cephadm configures the community Ceph repository
  ansible.builtin.dnf:
    name: "{{ bootwright_ceph_community_epel_url }}"
    state: present
    disable_gpg_check: true

- name: Resolve community Ceph dependency repository source
  ansible.builtin.set_fact:
    bootwright_ceph_community_dependency_enabled: "{{ bootwright_ceph_community_dependency_repos_enabled | default(true) | bool }}"
    bootwright_ceph_community_dependency_mirror: "{{ bootwright_ceph_community_dependency_default_mirror | regex_replace('/$', '') }}"
  changed_when: false

- name: Require an https community Ceph dependency mirror and signing key
  ansible.builtin.assert:
    that:
      - bootwright_ceph_community_dependency_mirror is match('^https://')
      - bootwright_ceph_community_dependency_gpgkey is match('^https://')
    fail_msg: >-
      Refusing to fetch community Ceph dependency packages or their signing key
      over an insecure transport: set bootwright_ceph_community_dependency_default_mirror
      and bootwright_ceph_community_dependency_gpgkey to https:// URLs (got
      {{ bootwright_ceph_community_dependency_mirror }} and
      {{ bootwright_ceph_community_dependency_gpgkey }}).
  when: bootwright_ceph_community_dependency_enabled

- name: Trust the CentOS community signing key for Ceph dependency repositories
  ansible.builtin.rpm_key:
    key: "{{ bootwright_ceph_community_dependency_gpgkey }}"
    fingerprint: "{{ bootwright_ceph_community_dependency_gpg_fingerprint }}"
    state: present
  when: bootwright_ceph_community_dependency_enabled

- name: Add CentOS Stream community repositories for Ceph dependencies
  ansible.builtin.yum_repository:
    name: "{{ item.id }}"
    description: "{{ item.name }}"
    baseurl: "{{ bootwright_ceph_community_dependency_mirror }}/{{ ansible_distribution_major_version }}-stream/{{ item.path }}/$basearch/os/"
    gpgcheck: true
    gpgkey: "{{ bootwright_ceph_community_dependency_gpgkey }}"
    enabled: true
    file: bootwright-ceph-dependencies
  loop: "{{ bootwright_ceph_community_dependency_repos }}"
  loop_control:
    label: "{{ item.id }}"
  when: bootwright_ceph_community_dependency_enabled

- name: Configure community Ceph package repository through cephadm
  ansible.builtin.command:
    argv: >-
      {{
        [bootwright_ceph_community_bootstrap_cephadm, 'add-repo']
        + (['--version', bootwright_ceph_community_version] if bootwright_ceph_community_version | length > 0 else ['--release', bootwright_ceph_community_release])
        + (['--mirror', bootwright_ceph_community_mirror] if bootwright_ceph_community_mirror != bootwright_ceph_community_default_mirror else [])
      }}
    creates: "{{ bootwright_ceph_community_repo_file }}"
