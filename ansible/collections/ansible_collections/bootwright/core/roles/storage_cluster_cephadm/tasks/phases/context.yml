---
- name: Load rendered Ceph operations
  ansible.builtin.set_fact:
    bootwright_ceph_operations: >-
      {{
        (lookup('ansible.builtin.file', bootwright_selected_storage_cluster.ceph.operationsPath)
        | from_yaml).operations | default([])
      }}
  delegate_to: localhost
  become: false

# Gather distribution facts before the provider is materialized below.
# Subscription-backed (redhat, ibm) providers carry repos that embed
# {{ ansible_distribution_major_version }}; ansible-core finalizes that template
# when bootwright_ceph_provider is set, so without facts here the set_fact fails
# with "ansible_distribution_major_version is undefined". context.yml runs before
# repository.yml, so gathering here also serves the later repo and OS steps.
- name: Gather storage node OS facts
  ansible.builtin.setup:
    gather_subset:
      - "!all"
      - "!min"
      - distribution

- name: Resolve managed Ceph work paths
  ansible.builtin.set_fact:
    bootwright_ceph_provider: "{{ bootwright_selected_storage_cluster.provider | default({}) }}"
    bootwright_ceph_provider_name: "{{ bootwright_selected_storage_cluster.provider.name | default('oss') }}"
    bootwright_ceph_remote_work_dir: "{{ bootwright_selected_storage_cluster.remoteWorkDir }}"
    bootwright_ceph_remote_bootstrap_conf: "{{ bootwright_selected_storage_cluster.remoteWorkDir }}/bootstrap-ceph.conf"
    bootwright_ceph_remote_bootstrap_spec: "{{ bootwright_selected_storage_cluster.remoteWorkDir }}/bootstrap-spec.yaml"
    bootwright_ceph_remote_core_services_spec: "{{ bootwright_selected_storage_cluster.remoteWorkDir }}/core-services.yaml"
    bootwright_ceph_remote_late_services_spec: "{{ bootwright_selected_storage_cluster.remoteWorkDir }}/late-services.yaml"
    bootwright_ceph_remote_operations: "{{ bootwright_selected_storage_cluster.remoteWorkDir }}/operations.yaml"
    bootwright_ceph_remote_private_key: "{{ bootwright_selected_storage_cluster.remoteWorkDir }}/cluster-ssh-key"
    bootwright_ceph_remote_public_key: "{{ bootwright_selected_storage_cluster.remoteWorkDir }}/cluster-ssh-key.pub"
    bootwright_ceph_remote_known_hosts: "{{ bootwright_selected_storage_cluster.remoteWorkDir }}/known_hosts"
    bootwright_ceph_remote_ssh_config: "{{ bootwright_selected_storage_cluster.remoteWorkDir }}/ssh_config"
    bootwright_ceph_remote_registry_json: "{{ bootwright_selected_storage_cluster.remoteWorkDir }}/registry-login.json"
    bootwright_ceph_ownership_marker_path: /etc/ceph/.bootwright-owned
    bootwright_ceph_osd_marker_path: /etc/bootwright/ceph-osd-devices.json
    bootwright_ceph_bootstrap_image: "{{ bootwright_selected_storage_cluster.provider.image | default('') }}"
    bootwright_ceph_image_base: "{{ bootwright_selected_storage_cluster.provider.imageBase | default('') }}"
    bootwright_ceph_registry_url: "{{ bootwright_selected_storage_cluster.provider.registry.url | default('') }}"
    bootwright_ceph_registry_credentials_path: "{{ bootwright_selected_storage_cluster.provider.registry.credentialsPath | default('') }}"
    bootwright_ceph_registry_trust_path: "{{ bootwright_selected_storage_cluster.provider.registry.trustBundlePath | default('') }}"
    bootwright_ceph_rhsm_organization_path: "{{ bootwright_selected_storage_cluster.provider.rhsm.organizationPath | default('') }}"
    bootwright_ceph_rhsm_activation_key_path: "{{ bootwright_selected_storage_cluster.provider.rhsm.activationKeyPath | default('') }}"
    bootwright_ceph_rhsm_satellite_hostname: "{{ bootwright_selected_storage_cluster.provider.rhsm.satellite.hostname | default('') }}"
    bootwright_ceph_rhsm_satellite_content_base_url: "{{ bootwright_selected_storage_cluster.provider.rhsm.satellite.contentBaseURL | default('') }}"
    bootwright_ceph_rhsm_satellite_ca_path: "{{ bootwright_selected_storage_cluster.provider.rhsm.satellite.caPath | default('') }}"

- name: Load cephadm registry credentials
  ansible.builtin.include_role:
    name: bootwright.core.support_credentials
    tasks_from: load
  vars:
    bootwright_creds_path: "{{ bootwright_ceph_registry_credentials_path }}"
    bootwright_creds_var: bootwright_ceph_registry_credentials
    bootwright_creds_label: "cephadm registry credentialsRef {{ bootwright_ceph_registry_credentials_path }}"
  when: bootwright_ceph_registry_credentials_path | length > 0

- name: Resolve current storage node
  ansible.builtin.set_fact:
    bootwright_current_storage_host_matches: >-
      {{
        bootwright_selected_storage_cluster.hosts
        | default([])
        | selectattr('inventoryHost', 'equalto', inventory_hostname)
        | list
      }}
  changed_when: false
  when: not bootwright_task_storage_skip_prereqs | default(false) | bool

- name: Validate current storage node context
  ansible.builtin.assert:
    that:
      - bootwright_current_storage_host_matches | length == 1
    fail_msg: >-
      Storage node {{ inventory_hostname }} is not declared exactly once in
      {{ bootwright_selected_storage_cluster.name | default('<storage-cluster>') }}.
  when: not bootwright_task_storage_skip_prereqs | default(false) | bool

- name: Set current storage node
  ansible.builtin.set_fact:
    bootwright_current_storage_host: "{{ bootwright_current_storage_host_matches | first }}"
  changed_when: false
  when: not bootwright_task_storage_skip_prereqs | default(false) | bool
