---
- name: Install cephadm registry trust on storage node
  ansible.builtin.include_role:
    name: bootwright.core.support_ca_trust
  vars:
    bootwright_ca_trust_source: "{{ bootwright_ceph_registry_trust_path }}"
    bootwright_ca_trust_anchor: "{{ bootwright_ceph_ca_trust_anchor_path }}"
  when: bootwright_ceph_registry_trust_path | length > 0

- name: Log storage node into cephadm registry
  containers.podman.podman_login:
    registry: "{{ bootwright_ceph_registry_url }}"
    username: "{{ bootwright_ceph_registry_credentials.username }}"
    password: "{{ bootwright_ceph_registry_credentials.password }}"
  no_log: "{{ bootwright_no_log | default(true) | bool }}"
  when:
    - bootwright_ceph_registry_url | length > 0
    - bootwright_ceph_registry_credentials is defined
