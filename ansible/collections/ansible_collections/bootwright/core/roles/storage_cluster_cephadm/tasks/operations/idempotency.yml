---
- name: Check existing Ceph pool
  ansible.builtin.command:
    argv:
      - timeout
      - "--kill-after={{ bootwright_ceph_timeout_kill_after_seconds }}"
      - "{{ bootwright_ceph_probe_timeout_seconds }}"
      - cephadm
      - shell
      - --
      - ceph
      - osd
      - pool
      - ls
      - --format
      - json
  register: bootwright_ceph_pool_list
  changed_when: false
  failed_when: bootwright_ceph_pool_list.rc | default(0) | int in [124, 137]
  when: bootwright_ceph_op_idempotency_kind == 'ceph-pool'

- name: Skip existing Ceph pool operation
  ansible.builtin.set_fact:
    bootwright_ceph_op_skip: true
  when:
    - bootwright_ceph_op_idempotency_kind == 'ceph-pool'
    - bootwright_ceph_op_idempotency_name in ((bootwright_ceph_pool_list.stdout | default('') | trim | default('[]', true)) | from_json)

- name: Check existing CephFS
  ansible.builtin.command:
    argv:
      - timeout
      - "--kill-after={{ bootwright_ceph_timeout_kill_after_seconds }}"
      - "{{ bootwright_ceph_probe_timeout_seconds }}"
      - cephadm
      - shell
      - --
      - ceph
      - fs
      - ls
      - --format
      - json
  register: bootwright_ceph_fs_list
  changed_when: false
  failed_when: bootwright_ceph_fs_list.rc | default(0) | int in [124, 137]
  when: bootwright_ceph_op_idempotency_kind == 'cephfs'

- name: Skip existing CephFS operation
  ansible.builtin.set_fact:
    bootwright_ceph_op_skip: true
  when:
    - bootwright_ceph_op_idempotency_kind == 'cephfs'
    - bootwright_ceph_op_idempotency_name in ((bootwright_ceph_fs_list.stdout | default('') | trim | default('[]', true)) | from_json | map(attribute='name') | list)

- name: Check existing CRUSH rule
  ansible.builtin.command:
    argv:
      - timeout
      - "--kill-after={{ bootwright_ceph_timeout_kill_after_seconds }}"
      - "{{ bootwright_ceph_probe_timeout_seconds }}"
      - cephadm
      - shell
      - --
      - ceph
      - osd
      - crush
      - rule
      - dump
      - --format
      - json
  register: bootwright_ceph_crush_rules
  changed_when: false
  failed_when: bootwright_ceph_crush_rules.rc | default(0) | int in [124, 137]
  when: bootwright_ceph_op_idempotency_kind in ['crush-rule', 'stretch-crush-rule']

- name: Skip existing CRUSH rule operation
  ansible.builtin.set_fact:
    bootwright_ceph_op_skip: true
  when:
    - bootwright_ceph_op_idempotency_kind in ['crush-rule', 'stretch-crush-rule']
    - bootwright_ceph_op_idempotency_name in ((bootwright_ceph_crush_rules.stdout | default('') | trim | default('[]', true)) | from_json | map(attribute='rule_name') | list)

- name: Create stretch CRUSH rule in CRUSH map
  when:
    - bootwright_ceph_op_idempotency_kind == 'stretch-crush-rule'
    - not bootwright_ceph_op_skip | bool
  block:
    - name: Resolve next free CRUSH rule id for stretch rule
      ansible.builtin.set_fact:
        bootwright_ceph_stretch_rule_id: >-
          {{
            ((((bootwright_ceph_crush_rules.stdout | default('') | trim | default('[]', true)) | from_json
               | map(attribute='rule_id') | list) + [0]) | max | int) + 1
          }}

    - name: Export current CRUSH map
      ansible.builtin.command:
        argv:
          - timeout
          - "--kill-after={{ bootwright_ceph_timeout_kill_after_seconds }}"
          - "{{ bootwright_ceph_probe_timeout_seconds }}"
          - cephadm
          - shell
          - --mount
          - "{{ bootwright_ceph_remote_work_dir }}:/mnt"
          - --
          - ceph
          - osd
          - getcrushmap
          - -o
          - /mnt/stretch-crushmap.bin
      changed_when: false

    - name: Decompile current CRUSH map
      ansible.builtin.command:
        argv:
          - timeout
          - "--kill-after={{ bootwright_ceph_timeout_kill_after_seconds }}"
          - "{{ bootwright_ceph_tool_timeout_seconds }}"
          - cephadm
          - shell
          - --mount
          - "{{ bootwright_ceph_remote_work_dir }}:/mnt"
          - --
          - crushtool
          - -d
          - /mnt/stretch-crushmap.bin
          - -o
          - /mnt/stretch-crushmap.txt
      changed_when: false

    - name: Append stretch rule to CRUSH map source
      ansible.builtin.blockinfile:
        path: "{{ bootwright_ceph_remote_work_dir }}/stretch-crushmap.txt"
        marker: "# {mark} BOOTWRIGHT STRETCH RULE {{ bootwright_ceph_op_idempotency_name }}"
        block: |
          rule {{ bootwright_ceph_op_idempotency_name }} {
              id {{ bootwright_ceph_stretch_rule_id }}
              type replicated
              step take default
              step choose firstn 0 type {{ bootwright_ceph_op.structural.failureDomain }}
              step chooseleaf firstn {{ bootwright_ceph_op.structural.replicasPerFailureDomain | default(2) }} type host
              step emit
          }
      changed_when: true

    - name: Compile CRUSH map with stretch rule
      ansible.builtin.command:
        argv:
          - timeout
          - "--kill-after={{ bootwright_ceph_timeout_kill_after_seconds }}"
          - "{{ bootwright_ceph_tool_timeout_seconds }}"
          - cephadm
          - shell
          - --mount
          - "{{ bootwright_ceph_remote_work_dir }}:/mnt"
          - --
          - crushtool
          - -c
          - /mnt/stretch-crushmap.txt
          - -o
          - /mnt/stretch-crushmap-new.bin
      changed_when: false

    - name: Install CRUSH map with stretch rule
      ansible.builtin.command:
        argv:
          - timeout
          - "--kill-after={{ bootwright_ceph_timeout_kill_after_seconds }}"
          - "{{ bootwright_ceph_config_timeout_seconds }}"
          - cephadm
          - shell
          - --mount
          - "{{ bootwright_ceph_remote_work_dir }}:/mnt"
          - --
          - ceph
          - osd
          - setcrushmap
          - -i
          - /mnt/stretch-crushmap-new.bin
      changed_when: true

    - name: Mark stretch CRUSH rule operation as handled
      ansible.builtin.set_fact:
        bootwright_ceph_op_skip: true

- name: List live Ceph pools for the stretch internal-pool reconcile
  ansible.builtin.command:
    argv:
      - timeout
      - "--kill-after={{ bootwright_ceph_timeout_kill_after_seconds }}"
      - "{{ bootwright_ceph_probe_timeout_seconds }}"
      - cephadm
      - shell
      - --
      - ceph
      - osd
      - pool
      - ls
      - detail
      - --format
      - json
  register: bootwright_ceph_stretch_pool_detail
  changed_when: false
  failed_when: bootwright_ceph_stretch_pool_detail.rc | default(0) | int in [124, 137]
  when: bootwright_ceph_op_idempotency_kind == 'stretch-internal-pools'

- name: Place Ceph internal pools on the stretch placement
  when:
    - bootwright_ceph_op_idempotency_kind == 'stretch-internal-pools'
    - not bootwright_ceph_op_skip | bool
  block:
    - name: Select the Ceph internal pools nobody declares
      ansible.builtin.set_fact:
        bootwright_ceph_stretch_internal_pools: >-
          {{
            (bootwright_ceph_stretch_pool_detail.stdout | default('') | trim | default('[]', true) | from_json)
            | selectattr('type', 'equalto', 1)
            | map(attribute='pool_name')
            | select('search', bootwright_ceph_op.structural.poolPattern)
            | list
          }}

    - name: Report the Ceph internal pools left off the stretch placement
      ansible.builtin.debug:
        msg: >-
          No Ceph internal pool matches {{ bootwright_ceph_op.structural.poolPattern }} yet on
          {{ bootwright_selected_storage_cluster.name }}: nothing to place on
          {{ bootwright_ceph_op.structural.ruleName }}.
      when: bootwright_ceph_stretch_internal_pools | length == 0

    - name: Set the stretch CRUSH rule on Ceph internal pools
      ansible.builtin.command:
        argv:
          - timeout
          - "--kill-after={{ bootwright_ceph_timeout_kill_after_seconds }}"
          - "{{ bootwright_ceph_config_timeout_seconds }}"
          - cephadm
          - shell
          - --
          - ceph
          - osd
          - pool
          - set
          - "{{ bootwright_ceph_stretch_internal_pool }}"
          - crush_rule
          - "{{ bootwright_ceph_op.structural.ruleName }}"
      register: bootwright_ceph_stretch_crush_rule_set
      loop: "{{ bootwright_ceph_stretch_internal_pools }}"
      loop_control:
        loop_var: bootwright_ceph_stretch_internal_pool
        break_when:
          - bootwright_ceph_stretch_crush_rule_set.rc | default(0) | int in [124, 137]
      changed_when: true

    - name: Set the stretch replica size on Ceph internal pools
      ansible.builtin.command:
        argv:
          - timeout
          - "--kill-after={{ bootwright_ceph_timeout_kill_after_seconds }}"
          - "{{ bootwright_ceph_config_timeout_seconds }}"
          - cephadm
          - shell
          - --
          - ceph
          - osd
          - pool
          - set
          - "{{ bootwright_ceph_stretch_internal_pool }}"
          - size
          - "{{ bootwright_ceph_op.structural.size }}"
      register: bootwright_ceph_stretch_size_set
      loop: "{{ bootwright_ceph_stretch_internal_pools }}"
      loop_control:
        loop_var: bootwright_ceph_stretch_internal_pool
        break_when:
          - bootwright_ceph_stretch_size_set.rc | default(0) | int in [124, 137]
      changed_when: true

    - name: Set the stretch minimum replica size on Ceph internal pools
      ansible.builtin.command:
        argv:
          - timeout
          - "--kill-after={{ bootwright_ceph_timeout_kill_after_seconds }}"
          - "{{ bootwright_ceph_config_timeout_seconds }}"
          - cephadm
          - shell
          - --
          - ceph
          - osd
          - pool
          - set
          - "{{ bootwright_ceph_stretch_internal_pool }}"
          - min_size
          - "{{ bootwright_ceph_op.structural.minSize }}"
      register: bootwright_ceph_stretch_min_size_set
      loop: "{{ bootwright_ceph_stretch_internal_pools }}"
      loop_control:
        loop_var: bootwright_ceph_stretch_internal_pool
        break_when:
          - bootwright_ceph_stretch_min_size_set.rc | default(0) | int in [124, 137]
      changed_when: true

    - name: Mark the stretch internal-pool operation as handled
      ansible.builtin.set_fact:
        bootwright_ceph_op_skip: true

- name: Check existing erasure-code profile
  ansible.builtin.command:
    argv:
      - timeout
      - "--kill-after={{ bootwright_ceph_timeout_kill_after_seconds }}"
      - "{{ bootwright_ceph_probe_timeout_seconds }}"
      - cephadm
      - shell
      - --
      - ceph
      - osd
      - erasure-code-profile
      - ls
      - --format
      - json
  register: bootwright_ceph_ec_profiles
  changed_when: false
  failed_when: bootwright_ceph_ec_profiles.rc | default(0) | int in [124, 137]
  when: bootwright_ceph_op_idempotency_kind == 'ec-profile'

- name: Skip existing erasure-code profile operation
  ansible.builtin.set_fact:
    bootwright_ceph_op_skip: true
  when:
    - bootwright_ceph_op_idempotency_kind == 'ec-profile'
    - bootwright_ceph_op_idempotency_name in ((bootwright_ceph_ec_profiles.stdout | default('') | trim | default('[]', true)) | from_json)

- name: Check current stretch mode
  ansible.builtin.command:
    argv:
      - timeout
      - "--kill-after={{ bootwright_ceph_timeout_kill_after_seconds }}"
      - "{{ bootwright_ceph_probe_timeout_seconds }}"
      - cephadm
      - shell
      - --
      - ceph
      - mon
      - dump
      - --format
      - json
  register: bootwright_ceph_mon_dump
  changed_when: false
  failed_when: bootwright_ceph_mon_dump.rc | default(0) | int in [124, 137]
  when: bootwright_ceph_op_idempotency_kind == 'stretch-mode'

- name: Skip enabled stretch mode operation
  ansible.builtin.set_fact:
    bootwright_ceph_op_skip: true
  when:
    - bootwright_ceph_op_idempotency_kind == 'stretch-mode'
    - ((bootwright_ceph_mon_dump.stdout | default('') | trim | default('{}', true)) | from_json).stretch_mode | default(false) | bool

- name: Check enabled mgr modules
  ansible.builtin.command:
    argv:
      - timeout
      - "--kill-after={{ bootwright_ceph_timeout_kill_after_seconds }}"
      - "{{ bootwright_ceph_probe_timeout_seconds }}"
      - cephadm
      - shell
      - --
      - ceph
      - mgr
      - module
      - ls
      - --format
      - json
  register: bootwright_ceph_mgr_modules
  changed_when: false
  failed_when: bootwright_ceph_mgr_modules.rc | default(0) | int in [124, 137]
  when: bootwright_ceph_op_idempotency_kind == 'mgr-module'

- name: Skip enabled mgr module operation
  ansible.builtin.set_fact:
    bootwright_ceph_op_skip: true
  vars:
    bootwright_ceph_mgr_module_doc: "{{ (bootwright_ceph_mgr_modules.stdout | default('') | trim | default('{}', true)) | from_json }}"
  when:
    - bootwright_ceph_op_idempotency_kind == 'mgr-module'
    - >-
      bootwright_ceph_op_idempotency_name in (
        (bootwright_ceph_mgr_module_doc.enabled_modules | default([]))
        + (bootwright_ceph_mgr_module_doc.always_on_modules | default([]))
      )

- name: Check existing RGW realm
  ansible.builtin.command:
    argv:
      - timeout
      - "--kill-after={{ bootwright_ceph_timeout_kill_after_seconds }}"
      - "{{ bootwright_ceph_probe_timeout_seconds }}"
      - cephadm
      - shell
      - --
      - radosgw-admin
      - realm
      - list
      - --format
      - json
  register: bootwright_ceph_rgw_realms
  changed_when: false
  failed_when: bootwright_ceph_rgw_realms.rc | default(0) | int in [124, 137]
  when: bootwright_ceph_op_idempotency_kind == 'rgw-realm'

- name: Skip existing RGW realm operation
  ansible.builtin.set_fact:
    bootwright_ceph_op_skip: true
  when:
    - bootwright_ceph_op_idempotency_kind == 'rgw-realm'
    - bootwright_ceph_op_idempotency_name in ((bootwright_ceph_rgw_realms.stdout | default('') | trim | default('{}', true)) | from_json).realms | default([])

- name: Check existing RGW zonegroup
  ansible.builtin.command:
    argv:
      - timeout
      - "--kill-after={{ bootwright_ceph_timeout_kill_after_seconds }}"
      - "{{ bootwright_ceph_probe_timeout_seconds }}"
      - cephadm
      - shell
      - --
      - radosgw-admin
      - zonegroup
      - list
      - --format
      - json
  register: bootwright_ceph_rgw_zonegroups
  changed_when: false
  failed_when: bootwright_ceph_rgw_zonegroups.rc | default(0) | int in [124, 137]
  when: bootwright_ceph_op_idempotency_kind == 'rgw-zonegroup'

- name: Skip existing RGW zonegroup operation
  ansible.builtin.set_fact:
    bootwright_ceph_op_skip: true
  when:
    - bootwright_ceph_op_idempotency_kind == 'rgw-zonegroup'
    - bootwright_ceph_op_idempotency_name in ((bootwright_ceph_rgw_zonegroups.stdout | default('') | trim | default('{}', true)) | from_json).zonegroups | default([])

- name: Check existing RGW zone
  ansible.builtin.command:
    argv:
      - timeout
      - "--kill-after={{ bootwright_ceph_timeout_kill_after_seconds }}"
      - "{{ bootwright_ceph_probe_timeout_seconds }}"
      - cephadm
      - shell
      - --
      - radosgw-admin
      - zone
      - list
      - --format
      - json
  register: bootwright_ceph_rgw_zones
  changed_when: false
  failed_when: bootwright_ceph_rgw_zones.rc | default(0) | int in [124, 137]
  when: bootwright_ceph_op_idempotency_kind == 'rgw-zone'

- name: Skip existing RGW zone operation
  ansible.builtin.set_fact:
    bootwright_ceph_op_skip: true
  when:
    - bootwright_ceph_op_idempotency_kind == 'rgw-zone'
    - bootwright_ceph_op_idempotency_name in ((bootwright_ceph_rgw_zones.stdout | default('') | trim | default('{}', true)) | from_json).zones | default([])

- name: Check existing RGW user
  block:
    - name: Probe the existing RGW user
      ansible.builtin.command:
        argv:
          - timeout
          - "--kill-after={{ bootwright_ceph_timeout_kill_after_seconds }}"
          - "{{ bootwright_ceph_probe_timeout_seconds }}"
          - cephadm
          - shell
          - --
          - radosgw-admin
          - user
          - info
          - --uid
          - "{{ bootwright_ceph_op_idempotency_name }}"
      register: bootwright_ceph_rgw_user_info
      changed_when: false
      failed_when: bootwright_ceph_rgw_user_info.rc | default(0) | int in [124, 137]
      no_log: "{{ (bootwright_no_log | default(true) | bool) and (bootwright_ceph_op_no_log | bool) }}"
  rescue:
    - name: Relay an RGW user probe timeout without exposing protected output
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/ceph_command_timeout.yml"
      vars:
        bootwright_ceph_timeout_task: Probe the existing RGW user
        bootwright_ceph_timeout_seconds: "{{ bootwright_ceph_probe_timeout_seconds }}"
        bootwright_ceph_timeout_exit_code: "{{ ansible_failed_result.rc }}"
        bootwright_ceph_timeout_state_changing: false
      when: ansible_failed_result.rc | default(0) | int in [124, 137]

    - name: Refuse to continue after the protected RGW user probe failed
      ansible.builtin.fail:
        msg: >-
          The protected RGW user probe failed unexpectedly with rc
          {{ ansible_failed_result.rc | default('<none>') }}.
  when:
    - bootwright_ceph_op_idempotency_kind == 'rgw-user'
    - bootwright_ceph_op_idempotency_name | length > 0

- name: Skip existing RGW user operation
  ansible.builtin.set_fact:
    bootwright_ceph_op_skip: true
  no_log: "{{ (bootwright_no_log | default(true) | bool) and (bootwright_ceph_op_no_log | bool) }}"
  when:
    - bootwright_ceph_op_idempotency_kind == 'rgw-user'
    - bootwright_ceph_rgw_user_info is defined
    - bootwright_ceph_rgw_user_info.rc | default(1) == 0
