---
- name: Check existing Ceph pool
  ansible.builtin.command:
    argv:
      - ceph
      - osd
      - pool
      - ls
      - --format
      - json
  register: bootwright_ceph_pool_list
  changed_when: false
  failed_when: false
  when: bootwright_ceph_op_idempotency_kind == 'ceph-pool'

- name: Skip existing Ceph pool operation
  ansible.builtin.set_fact:
    bootwright_ceph_op_skip: true
  when:
    - bootwright_ceph_op_idempotency_kind == 'ceph-pool'
    - bootwright_ceph_op_idempotency_name in ((bootwright_ceph_pool_list.stdout | default('[]')) | from_json)

- name: Check existing CephFS
  ansible.builtin.command:
    argv:
      - ceph
      - fs
      - ls
      - --format
      - json
  register: bootwright_ceph_fs_list
  changed_when: false
  failed_when: false
  when: bootwright_ceph_op_idempotency_kind == 'cephfs'

- name: Skip existing CephFS operation
  ansible.builtin.set_fact:
    bootwright_ceph_op_skip: true
  when:
    - bootwright_ceph_op_idempotency_kind == 'cephfs'
    - bootwright_ceph_op_idempotency_name in ((bootwright_ceph_fs_list.stdout | default('[]')) | from_json | map(attribute='name') | list)

- name: Check existing CRUSH rule
  ansible.builtin.command:
    argv:
      - ceph
      - osd
      - crush
      - rule
      - dump
      - --format
      - json
  register: bootwright_ceph_crush_rules
  changed_when: false
  failed_when: false
  when: bootwright_ceph_op_idempotency_kind in ['crush-rule', 'stretch-crush-rule']

- name: Skip existing CRUSH rule operation
  ansible.builtin.set_fact:
    bootwright_ceph_op_skip: true
  when:
    - bootwright_ceph_op_idempotency_kind in ['crush-rule', 'stretch-crush-rule']
    - bootwright_ceph_op_idempotency_name in ((bootwright_ceph_crush_rules.stdout | default('[]')) | from_json | map(attribute='rule_name') | list)

# The stretch CRUSH rule must place two replicas per data site:
#   step choose firstn 0 type <failureDomain>
#   step chooseleaf firstn 2 type host
# `ceph osd crush rule create-replicated` cannot express that two-step rule, so
# it is compiled into the CRUSH map directly. crushtool is not installed on the
# host (only cephadm + ceph-common), so the de/compile steps run inside the
# cephadm shell container with the work directory mounted.
- name: Create stretch CRUSH rule in CRUSH map
  when:
    - bootwright_ceph_op_idempotency_kind == 'stretch-crush-rule'
    - not bootwright_ceph_op_skip | bool
  block:
    - name: Resolve next free CRUSH rule id for stretch rule
      ansible.builtin.set_fact:
        bootwright_ceph_stretch_rule_id: >-
          {{
            ((((bootwright_ceph_crush_rules.stdout | default('[]')) | from_json
               | map(attribute='rule_id') | list) + [0]) | max | int) + 1
          }}

    - name: Export current CRUSH map
      ansible.builtin.command:
        argv:
          - ceph
          - osd
          - getcrushmap
          - -o
          - "{{ bootwright_ceph_remote_work_dir }}/stretch-crushmap.bin"
      changed_when: false

    - name: Decompile current CRUSH map
      ansible.builtin.command:
        argv:
          - cephadm
          - shell
          - --mount
          - "{{ bootwright_ceph_remote_work_dir }}:/mnt"
          - --
          - crushtool
          - -d
          - /mnt/stretch-crushmap.bin
          - -o
          - /mnt/stretch-crushmap.txt
      changed_when: false

    - name: Append stretch rule to CRUSH map source
      ansible.builtin.blockinfile:
        path: "{{ bootwright_ceph_remote_work_dir }}/stretch-crushmap.txt"
        marker: "# {mark} BOOTWRIGHT STRETCH RULE {{ bootwright_ceph_op_idempotency_name }}"
        block: |
          rule {{ bootwright_ceph_op_idempotency_name }} {
              id {{ bootwright_ceph_stretch_rule_id }}
              type replicated
              step take default
              step choose firstn 0 type {{ bootwright_ceph_op.structural.failureDomain }}
              step chooseleaf firstn {{ bootwright_ceph_op.structural.replicasPerFailureDomain | default(2) }} type host
              step emit
          }
      changed_when: true

    - name: Compile CRUSH map with stretch rule
      ansible.builtin.command:
        argv:
          - cephadm
          - shell
          - --mount
          - "{{ bootwright_ceph_remote_work_dir }}:/mnt"
          - --
          - crushtool
          - -c
          - /mnt/stretch-crushmap.txt
          - -o
          - /mnt/stretch-crushmap-new.bin
      changed_when: false

    - name: Install CRUSH map with stretch rule
      ansible.builtin.command:
        argv:
          - ceph
          - osd
          - setcrushmap
          - -i
          - "{{ bootwright_ceph_remote_work_dir }}/stretch-crushmap-new.bin"
      changed_when: true

    - name: Mark stretch CRUSH rule operation as handled
      ansible.builtin.set_fact:
        bootwright_ceph_op_skip: true

- name: Check existing erasure-code profile
  ansible.builtin.command:
    argv:
      - ceph
      - osd
      - erasure-code-profile
      - ls
      - --format
      - json
  register: bootwright_ceph_ec_profiles
  changed_when: false
  failed_when: false
  when: bootwright_ceph_op_idempotency_kind == 'ec-profile'

- name: Skip existing erasure-code profile operation
  ansible.builtin.set_fact:
    bootwright_ceph_op_skip: true
  when:
    - bootwright_ceph_op_idempotency_kind == 'ec-profile'
    - bootwright_ceph_op_idempotency_name in ((bootwright_ceph_ec_profiles.stdout | default('[]')) | from_json)

- name: Check current stretch mode
  ansible.builtin.command:
    argv:
      - ceph
      - mon
      - dump
      - --format
      - json
  register: bootwright_ceph_mon_dump
  changed_when: false
  failed_when: false
  when: bootwright_ceph_op_idempotency_kind == 'stretch-mode'

- name: Skip enabled stretch mode operation
  ansible.builtin.set_fact:
    bootwright_ceph_op_skip: true
  when:
    - bootwright_ceph_op_idempotency_kind == 'stretch-mode'
    - ((bootwright_ceph_mon_dump.stdout | default('{}')) | from_json).stretch_mode | default(false) | bool

- name: Check enabled mgr modules
  ansible.builtin.command:
    argv:
      - ceph
      - mgr
      - module
      - ls
      - --format
      - json
  register: bootwright_ceph_mgr_modules
  changed_when: false
  failed_when: false
  when: bootwright_ceph_op_idempotency_kind == 'mgr-module'

- name: Skip enabled mgr module operation
  ansible.builtin.set_fact:
    bootwright_ceph_op_skip: true
  vars:
    bootwright_ceph_mgr_module_doc: "{{ (bootwright_ceph_mgr_modules.stdout | default('{}')) | from_json }}"
  when:
    - bootwright_ceph_op_idempotency_kind == 'mgr-module'
    - >-
      bootwright_ceph_op_idempotency_name in (
        (bootwright_ceph_mgr_module_doc.enabled_modules | default([]))
        + (bootwright_ceph_mgr_module_doc.always_on_modules | default([]))
      )

- name: Check existing RGW realm
  ansible.builtin.command:
    argv:
      - radosgw-admin
      - realm
      - list
      - --format
      - json
  register: bootwright_ceph_rgw_realms
  changed_when: false
  failed_when: false
  when: bootwright_ceph_op_idempotency_kind == 'rgw-realm'

- name: Skip existing RGW realm operation
  ansible.builtin.set_fact:
    bootwright_ceph_op_skip: true
  when:
    - bootwright_ceph_op_idempotency_kind == 'rgw-realm'
    - bootwright_ceph_op_idempotency_name in ((bootwright_ceph_rgw_realms.stdout | default('{}')) | from_json).realms | default([])

- name: Check existing RGW zonegroup
  ansible.builtin.command:
    argv:
      - radosgw-admin
      - zonegroup
      - list
      - --format
      - json
  register: bootwright_ceph_rgw_zonegroups
  changed_when: false
  failed_when: false
  when: bootwright_ceph_op_idempotency_kind == 'rgw-zonegroup'

- name: Skip existing RGW zonegroup operation
  ansible.builtin.set_fact:
    bootwright_ceph_op_skip: true
  when:
    - bootwright_ceph_op_idempotency_kind == 'rgw-zonegroup'
    - bootwright_ceph_op_idempotency_name in ((bootwright_ceph_rgw_zonegroups.stdout | default('{}')) | from_json).zonegroups | default([])

- name: Check existing RGW zone
  ansible.builtin.command:
    argv:
      - radosgw-admin
      - zone
      - list
      - --format
      - json
  register: bootwright_ceph_rgw_zones
  changed_when: false
  failed_when: false
  when: bootwright_ceph_op_idempotency_kind == 'rgw-zone'

- name: Skip existing RGW zone operation
  ansible.builtin.set_fact:
    bootwright_ceph_op_skip: true
  when:
    - bootwright_ceph_op_idempotency_kind == 'rgw-zone'
    - bootwright_ceph_op_idempotency_name in ((bootwright_ceph_rgw_zones.stdout | default('{}')) | from_json).zones | default([])

- name: Check existing NFS export
  ansible.builtin.command:
    argv:
      - ceph
      - nfs
      - export
      - ls
      - "{{ bootwright_ceph_op_idempotency_name.split('|') | first }}"
      - --format
      - json
  register: bootwright_ceph_nfs_exports
  changed_when: false
  failed_when: false
  when: bootwright_ceph_op_idempotency_kind == 'nfs-export'

- name: Skip existing NFS export operation
  ansible.builtin.set_fact:
    bootwright_ceph_op_skip: true
  when:
    - bootwright_ceph_op_idempotency_kind == 'nfs-export'
    - (bootwright_ceph_op_idempotency_name.split('|') | last) in ((bootwright_ceph_nfs_exports.stdout | default('[]')) | from_json)

- name: Check existing RGW user
  ansible.builtin.command:
    argv:
      - radosgw-admin
      - user
      - info
      - --uid
      - "{{ bootwright_ceph_op_idempotency_name }}"
  register: bootwright_ceph_rgw_user_info
  changed_when: false
  failed_when: false
  no_log: "{{ bootwright_ceph_op_capture | length > 0 }}"
  when:
    - bootwright_ceph_op_idempotency_kind == 'rgw-user'
    - bootwright_ceph_op_idempotency_name | length > 0

- name: Reuse existing RGW user output
  ansible.builtin.set_fact:
    bootwright_ceph_op_skip: true
    bootwright_ceph_op_output: "{{ bootwright_ceph_rgw_user_info.stdout | default('') }}"
  no_log: "{{ bootwright_ceph_op_capture | length > 0 }}"
  when:
    - bootwright_ceph_rgw_user_info is defined
    - bootwright_ceph_rgw_user_info.rc | default(1) == 0

