---
- name: Run rendered Ceph topology and storage operations
  ansible.builtin.include_tasks: ../../operations/run.yml
  loop: "{{ bootwright_ceph_operations }}"
  loop_control:
    loop_var: bootwright_ceph_op
    label: "{{ bootwright_ceph_op.name | default('<unnamed>') }}"
  when:
    - >-
      (bootwright_ceph_op.command | default([]) | length > 0)
      or (bootwright_ceph_op.idempotency.kind | default('') == 'stretch-crush-rule')
    - bootwright_ceph_op.phase | default('storage') in ['topology', 'storage']
