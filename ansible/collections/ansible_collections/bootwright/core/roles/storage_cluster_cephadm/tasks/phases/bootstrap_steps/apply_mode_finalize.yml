---
- name: Inspect existing Ceph configuration before bootstrap
  ansible.builtin.stat:
    path: /etc/ceph/ceph.conf
  register: bootwright_ceph_conf_stat
  changed_when: false
  failed_when: false

- name: Read the existing Ceph configuration for the pre-record
  ansible.builtin.slurp:
    src: /etc/ceph/ceph.conf
  register: bootwright_ceph_prerecord_conf
  changed_when: false
  failed_when: false
  when:
    - bootwright_ceph_conf_stat.stat.exists | default(false) | bool
    - bootwright_ceph_conf_stat.stat.isreg | default(false) | bool
    - not (bootwright_ceph_conf_stat.stat.islnk | default(false) | bool)

- name: Refuse an ambiguous Ceph configuration before bootstrap
  ansible.builtin.assert:
    that:
      - bootwright_ceph_conf_stat.stat.exists is defined
      - >-
        not (bootwright_ceph_conf_stat.stat.exists | default(true) | bool)
        or (
          bootwright_ceph_conf_stat.stat.isreg | default(false) | bool
          and not (bootwright_ceph_conf_stat.stat.islnk | default(false) | bool)
          and (bootwright_ceph_prerecord_conf.content is defined)
        )
    fail_msg: >-
      Refusing storage cluster {{ bootwright_selected_storage_cluster.name }} before its
      ownership pre-record or bootstrap because /etc/ceph/ceph.conf on
      {{ inventory_hostname }} could not be proven absent or read as a regular non-symlink
      file. The probe reported
      {{ bootwright_ceph_conf_stat.msg
         | default(bootwright_ceph_prerecord_conf.msg
         | default('no diagnostic was recorded')) }}. No ownership evidence was written
      and cephadm bootstrap did not run. Repair access or the unsafe path, then re-run
      `{{ bootwright_mutating_invocation }}`. No apply mode or authorization converts a
      failed configuration probe into an absent cluster.

- name: Resolve the existing Ceph fsid for the pre-record
  ansible.builtin.set_fact:
    bootwright_ceph_prerecord_fsid: >-
      {{ (bootwright_ceph_prerecord_conf.content | b64decode
          | regex_search('fsid\s*=\s*([0-9a-fA-F-]+)', '\1')
          | default([], true) | first | default('')) | trim }}
  when: (bootwright_ceph_prerecord_conf | default({})).content is defined

- name: Refuse existing Ceph configuration without an exact fsid
  ansible.builtin.assert:
    that:
      - >-
        not (bootwright_ceph_conf_stat.stat.exists | default(false) | bool)
        or (bootwright_ceph_prerecord_fsid | default('')
            is match('^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'))
    fail_msg: >-
      Refusing storage cluster {{ bootwright_selected_storage_cluster.name }} because the
      existing /etc/ceph/ceph.conf on {{ inventory_hostname }} has no exact fsid UUID. No
      ownership evidence was written and cephadm bootstrap did not run. Restore the
      configuration from trusted cluster evidence or remove it only after independently
      proving that no cluster remains, then re-run `{{ bootwright_mutating_invocation }}`.
      No apply mode or authorization treats an unidentified configuration as absence.

- name: Resolve whether a proven Ceph configuration already exists
  ansible.builtin.set_fact:
    bootwright_ceph_conf_present: >-
      {{ bootwright_ceph_conf_stat.stat.exists | default(false) | bool }}
  changed_when: false

- name: Pre-record storage cluster ownership before bootstrap
  ansible.builtin.include_role:
    name: bootwright.core.ownership_record
    tasks_from: resource.yml
    apply:
      delegate_to: localhost
      become: false
  vars:
    bootwright_ownership_kind: storage-cluster
    bootwright_ownership_name: "{{ bootwright_selected_storage_cluster.name }}"
    bootwright_ownership_fields:
      cluster: "{{ bootwright_selected_storage_cluster.name }}"
      attributes:
        seedHost: "{{ bootwright_selected_storage_cluster.seedHost | default('') }}"
        fsid: "{{ bootwright_ceph_prerecord_fsid | default('') | trim }}"
