---
- name: Read the Ceph cluster configuration carrying the daemon container image
  ansible.builtin.command:
    argv:
      - timeout
      - "--kill-after={{ bootwright_ceph_timeout_kill_after_seconds }}"
      - "{{ bootwright_ceph_probe_timeout_seconds }}"
      - cephadm
      - shell
      - --
      - ceph
      - config
      - dump
      - --format
      - json
  register: bootwright_ceph_image_config_dump
  changed_when: false
  failed_when: bootwright_ceph_image_config_dump.rc | default(0) | int in [124, 137]
  when: bootwright_ceph_bootstrap_image | default('') | length > 0

- name: Resolve the current Ceph daemon container image
  ansible.builtin.set_fact:
    bootwright_ceph_daemon_image_current: >-
      {{ (bootwright_ceph_image_config_dump.stdout | default('[]', true) | from_json)
         | selectattr('section', 'defined') | selectattr('section', 'equalto', 'global')
         | selectattr('name', 'defined') | selectattr('name', 'equalto', 'container_image')
         | map(attribute='value') | first | default('') }}
  changed_when: false

- name: Pin the Ceph daemon container image
  ansible.builtin.command:
    argv:
      - timeout
      - "--kill-after={{ bootwright_ceph_timeout_kill_after_seconds }}"
      - "{{ bootwright_ceph_config_timeout_seconds }}"
      - cephadm
      - shell
      - --
      - ceph
      - config
      - set
      - global
      - container_image
      - "{{ bootwright_ceph_bootstrap_image }}"
  register: bootwright_ceph_daemon_image_set
  changed_when: true
  when:
    - bootwright_ceph_bootstrap_image | default('') | length > 0
    - bootwright_ceph_daemon_image_current != bootwright_ceph_bootstrap_image

- name: Read current cephadm container image base
  ansible.builtin.command:
    argv:
      - timeout
      - "--kill-after={{ bootwright_ceph_timeout_kill_after_seconds }}"
      - "{{ bootwright_ceph_probe_timeout_seconds }}"
      - cephadm
      - shell
      - --
      - ceph
      - config
      - get
      - mgr
      - mgr/cephadm/container_image_base
  register: bootwright_ceph_image_base_current
  changed_when: false
  failed_when: bootwright_ceph_image_base_current.rc | default(0) | int in [124, 137]
  when: bootwright_ceph_image_base | default('') | length > 0

- name: Pin cephadm container image base to the distribution registry
  ansible.builtin.command:
    argv:
      - timeout
      - "--kill-after={{ bootwright_ceph_timeout_kill_after_seconds }}"
      - "{{ bootwright_ceph_config_timeout_seconds }}"
      - cephadm
      - shell
      - --
      - ceph
      - config
      - set
      - mgr
      - mgr/cephadm/container_image_base
      - "{{ bootwright_ceph_image_base }}"
  register: bootwright_ceph_image_base_set
  changed_when: true
  when:
    - bootwright_ceph_image_base | default('') | length > 0
    - (bootwright_ceph_image_base_current.stdout | default('') | trim) != bootwright_ceph_image_base

- name: Read current cephadm sidecar container images
  ansible.builtin.command:
    argv:
      - timeout
      - "--kill-after={{ bootwright_ceph_timeout_kill_after_seconds }}"
      - "{{ bootwright_ceph_probe_timeout_seconds }}"
      - cephadm
      - shell
      - --
      - ceph
      - config
      - get
      - mgr
      - "{{ item.key }}"
  loop: "{{ bootwright_selected_storage_cluster.ceph.sidecarImagePins | default({}) | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
    break_when:
      - bootwright_ceph_sidecar_image_current.rc | default(0) | int in [124, 137]
  register: bootwright_ceph_sidecar_image_current
  changed_when: false
  failed_when: bootwright_ceph_sidecar_image_current.rc | default(0) | int in [124, 137]

- name: Pin cephadm sidecar container images before the monitoring stack deploys
  ansible.builtin.command:
    argv:
      - timeout
      - "--kill-after={{ bootwright_ceph_timeout_kill_after_seconds }}"
      - "{{ bootwright_ceph_config_timeout_seconds }}"
      - cephadm
      - shell
      - --
      - ceph
      - config
      - set
      - mgr
      - "{{ item.item.key }}"
      - "{{ item.item.value }}"
  register: bootwright_ceph_sidecar_image_set
  loop: "{{ bootwright_ceph_sidecar_image_current.results | default([]) }}"
  loop_control:
    label: "{{ item.item.key }}"
    break_when:
      - bootwright_ceph_sidecar_image_set.rc | default(0) | int in [124, 137]
  changed_when: true
  when: (item.stdout | default('') | trim) != item.item.value
