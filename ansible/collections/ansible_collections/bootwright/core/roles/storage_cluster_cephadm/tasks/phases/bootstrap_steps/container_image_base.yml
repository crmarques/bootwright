---
- name: Read current cephadm container image base
  ansible.builtin.command:
    argv:
      - cephadm
      - shell
      - --
      - ceph
      - config
      - get
      - mgr
      - mgr/cephadm/container_image_base
  register: bootwright_ceph_image_base_current
  changed_when: false
  failed_when: false
  when: bootwright_ceph_image_base | default('') | length > 0

- name: Pin cephadm container image base to the distribution registry
  ansible.builtin.command:
    argv:
      - cephadm
      - shell
      - --
      - ceph
      - config
      - set
      - mgr
      - mgr/cephadm/container_image_base
      - "{{ bootwright_ceph_image_base }}"
  register: bootwright_ceph_image_base_set
  changed_when: true
  when:
    - bootwright_ceph_image_base | default('') | length > 0
    - (bootwright_ceph_image_base_current.stdout | default('') | trim) != bootwright_ceph_image_base
