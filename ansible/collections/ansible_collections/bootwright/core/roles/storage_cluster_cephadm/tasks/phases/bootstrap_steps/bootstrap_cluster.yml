---
- name: Resolve cephadm bootstrap command
  ansible.builtin.set_fact:
    bootwright_ceph_bootstrap_argv: >-
      {{
        ['cephadm']
        + (
          ['--image', bootwright_ceph_bootstrap_image]
          if bootwright_ceph_bootstrap_image | default('') | length > 0
          else []
        )
        + [
          'bootstrap',
          '--mon-ip',
          bootwright_selected_storage_cluster.bootstrap.monIP,
          '--allow-fqdn-hostname',
          '--dashboard-password-noupdate'
        ]
        + (
          ['--single-host-defaults']
          if bootwright_selected_storage_cluster.bootstrap.singleHostDefaults | default(false) | bool
          else []
        )
        + (
          ['--automatically-accept-license']
          if (
            bootwright_ceph_provider.requiresLicense | default(false) | bool
            and bootwright_ceph_provider.license.accepted | default(false) | bool
          )
          else []
        )
        + (
          ['--cluster-network', (bootwright_selected_storage_cluster.clusterNetworkCIDRs | join(','))]
          if (bootwright_selected_storage_cluster.clusterNetworkCIDRs | default([]) | length) > 0
          else []
        )
        + (
          ['--ssh-private-key', bootwright_ceph_remote_private_key]
          if bootwright_selected_storage_cluster.clusterSSH.privateKeyPath | default('') | length > 0
          else []
        )
        + (
          ['--ssh-public-key', bootwright_ceph_remote_public_key]
          if bootwright_selected_storage_cluster.clusterSSH.publicKeyPath | default('') | length > 0
          else []
        )
        + (
          ['--ssh-user', bootwright_selected_storage_cluster.clusterSSH.user]
          if bootwright_selected_storage_cluster.clusterSSH.user | default('') | length > 0
          else []
        )
        + (
          ['--registry-json', bootwright_ceph_remote_registry_json]
          if bootwright_ceph_registry_credentials is defined
          else []
        )
        + (
          ['--config', bootwright_ceph_remote_bootstrap_conf]
          if bootwright_selected_storage_cluster.ceph.bootstrapConfPath | default('') | length > 0
          else []
        )
        + (
          ['--skip-monitoring-stack']
          if bootwright_selected_storage_cluster.skipMonitoringStack | default(false) | bool
          else []
        )
      }}
  no_log: "{{ (bootwright_no_log | default(true) | bool) and (bootwright_ceph_registry_credentials is defined) }}"

- name: Bootstrap Ceph cluster when absent
  ansible.builtin.command:
    argv: "{{ bootwright_ceph_bootstrap_argv }}"
  register: bootwright_ceph_bootstrap
  changed_when: bootwright_ceph_bootstrap.rc == 0
  failed_when: false
  no_log: "{{ bootwright_no_log | default(true) | bool }}"
  when: bootwright_ceph_conf_check.rc != 0

- name: Fail with cephadm bootstrap diagnostics
  ansible.builtin.fail:
    msg: >-
      cephadm bootstrap failed (rc={{ bootwright_ceph_bootstrap.rc | default('unknown') }}).
      stderr: {{ bootwright_ceph_bootstrap.stderr | default('') | regex_replace('(?i)(password:\s*)\S+', '\1[redacted]') }}
      stdout: {{ bootwright_ceph_bootstrap.stdout | default('') | regex_replace('(?i)(password:\s*)\S+', '\1[redacted]') }}
  when:
    - bootwright_ceph_conf_check.rc != 0
    - bootwright_ceph_bootstrap.rc | default(0) != 0
