---
- name: Stage the mon spec that drops the arbiter that was replaced
  ansible.builtin.copy:
    dest: "{{ bootwright_arbiter_work_dir.path }}/mon-after.yaml"
    mode: "0600"
    content: >-
      {{
        {
          'service_type': 'mon',
          'placement': {'hosts': bootwright_arbiter_mon_hosts_after},
          'spec': {'crush_locations': bootwright_arbiter_mon_locations_after}
        } | to_nice_yaml(indent=2)
      }}

- name: Apply the mon spec that drops the arbiter that was replaced
  ansible.builtin.command:
    argv:
      - timeout
      - "--kill-after={{ bootwright_ceph_timeout_kill_after_seconds }}"
      - "{{ bootwright_ceph_orchestration_timeout_seconds }}"
      - cephadm
      - shell
      - --mount
      - "{{ bootwright_arbiter_work_dir.path }}:/mnt"
      - --
      - ceph
      - orch
      - apply
      - -i
      - /mnt/mon-after.yaml
  register: bootwright_arbiter_mon_spec_after
  changed_when: true
  failed_when: bootwright_arbiter_mon_spec_after.rc | default(0) | int in [124, 137]

- name: Refuse a final mon spec cephadm reported an error for
  ansible.builtin.assert:
    that:
      - bootwright_arbiter_mon_spec_after.rc | default(1) | int == 0
      - not (bootwright_arbiter_mon_spec_after.stdout | default('') | lower is search('error|failed|invalid|unknown host'))
      - not (bootwright_arbiter_mon_spec_after.stderr | default('') | lower is search('error|failed|invalid|unknown host'))
    fail_msg: >-
      cephadm rejected the mon spec that retires mon.{{ bootwright_arbiter_live_mon }}.
      The tiebreaker has ALREADY moved to mon.{{ bootwright_arbiter_desired_mon }}, so the
      cluster is correct but still carries the extra mon; retry with
      `{{ bootwright_mutating_invocation }}` to finish the retirement.
      rc: {{ bootwright_arbiter_mon_spec_after.rc | default('<none>') }}
      stdout: {{ bootwright_arbiter_mon_spec_after.stdout | default('') }}
      stderr: {{ bootwright_arbiter_mon_spec_after.stderr | default('') }}
    quiet: true

- name: Remove a replaced arbiter mon daemon cephadm still runs
  ansible.builtin.command:
    argv:
      - timeout
      - "--kill-after={{ bootwright_ceph_timeout_kill_after_seconds }}"
      - "{{ bootwright_ceph_removal_timeout_seconds }}"
      - cephadm
      - shell
      - --
      - ceph
      - orch
      - daemon
      - rm
      - "mon.{{ bootwright_arbiter_live_mon }}"
      - --force
  register: bootwright_arbiter_daemon_rm
  changed_when: bootwright_arbiter_daemon_rm.rc | default(1) | int == 0
  failed_when: bootwright_arbiter_daemon_rm.rc | default(0) | int in [124, 137]
  retries: 12
  delay: 10
  until: >-
    bootwright_arbiter_daemon_rm.rc | default(1) | int == 0
    or (bootwright_arbiter_daemon_rm.rc | default(0) | int in [124, 137])
    or (bootwright_arbiter_daemon_rm.stderr | default('') is search('Unable to find|does not exist|not found'))
    or ((bootwright_arbiter_daemon_rm.attempts | default(1) | int) >= 12)
  when: (bootwright_arbiter_live_mon | default('') | length) > 0

- name: Read the monmap after retiring the replaced arbiter daemon
  ansible.builtin.command:
    argv:
      - timeout
      - "--kill-after={{ bootwright_ceph_timeout_kill_after_seconds }}"
      - "{{ bootwright_ceph_probe_timeout_seconds }}"
      - cephadm
      - shell
      - --
      - ceph
      - mon
      - dump
      - --format
      - json
  register: bootwright_arbiter_retire_dump
  changed_when: false
  failed_when: bootwright_arbiter_retire_dump.rc | default(0) | int in [124, 137]

- name: Remove a replaced arbiter mon the monmap still carries
  ansible.builtin.command:
    argv:
      - timeout
      - "--kill-after={{ bootwright_ceph_timeout_kill_after_seconds }}"
      - "{{ bootwright_ceph_removal_timeout_seconds }}"
      - cephadm
      - shell
      - --
      - ceph
      - mon
      - rm
      - "{{ bootwright_arbiter_live_mon }}"
  register: bootwright_arbiter_mon_rm
  changed_when: bootwright_arbiter_mon_rm.rc | default(1) | int == 0
  failed_when: bootwright_arbiter_mon_rm.rc | default(0) | int in [124, 137]
  when: >-
    bootwright_arbiter_live_mon in
    ((bootwright_arbiter_retire_dump.stdout | default('{}', true) | from_json).mons
     | default([]) | map(attribute='name') | list)

- name: Read the orchestrator's view of the replaced arbiter host
  ansible.builtin.command:
    argv:
      - timeout
      - "--kill-after={{ bootwright_ceph_timeout_kill_after_seconds }}"
      - "{{ bootwright_ceph_probe_timeout_seconds }}"
      - cephadm
      - shell
      - --
      - ceph
      - orch
      - host
      - ls
      - --format
      - json
  register: bootwright_arbiter_retire_hosts
  changed_when: false
  failed_when: bootwright_arbiter_retire_hosts.rc | default(0) | int in [124, 137]
  when: (bootwright_arbiter_live_node | default('') | length) > 0

- name: Resolve whether the orchestrator reports the replaced arbiter host offline
  ansible.builtin.set_fact:
    bootwright_arbiter_live_host_offline: >-
      {{ (bootwright_arbiter_retire_hosts.stdout | default('[]', true) | from_json)
         | selectattr('hostname', 'defined')
         | selectattr('hostname', 'equalto', bootwright_arbiter_live_node)
         | selectattr('status', 'defined')
         | map(attribute='status')
         | map('lower')
         | select('search', 'offline')
         | list | length > 0 }}
  changed_when: false
  when: (bootwright_arbiter_live_node | default('') | length) > 0

- name: Take the offline retirement path only where the orchestrator proves absence
  ansible.builtin.set_fact:
    bootwright_arbiter_retire_offline: >-
      {{ (bootwright_arbiter_old_host_offline | default(false) | bool)
         and (bootwright_arbiter_live_host_offline | default(false) | bool) }}
  changed_when: false

- name: Report an offline retirement the orchestrator does not corroborate
  ansible.builtin.debug:
    msg: >-
      --authorize unreachable-nodes was supplied, but `ceph orch host ls` reports host
      {{ bootwright_arbiter_live_node }} of storage cluster
      {{ bootwright_arbiter_cluster_name }} as reachable, so this run has no proof the
      host is absent and retires it normally. The offline path skips
      `ceph orch host drain` and removes the host with `--offline --force`, which would
      leave its mon container and /var/lib/ceph state running on a host cephadm no longer
      manages, so it is taken only against proved absence rather than an expectation.
  when:
    - (bootwright_arbiter_live_node | default('') | length) > 0
    - bootwright_arbiter_old_host_offline | default(false) | bool
    - not (bootwright_arbiter_live_host_offline | default(false) | bool)

- name: Create the arbiter replacement artifact directory
  ansible.builtin.file:
    path: "{{ bootwright_ansible_artifacts_dir }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false
  when: (bootwright_arbiter_live_node | default('') | length) > 0

- name: Record which retirement path the orchestrator's evidence selected
  ansible.builtin.copy:
    dest: "{{ bootwright_ansible_artifacts_dir }}/arbiter-retire-result.json"
    content: >-
      {{
        {
          'host': bootwright_arbiter_live_node,
          'authorized': (bootwright_arbiter_old_host_offline | default(false) | bool),
          'corroborated': (bootwright_arbiter_live_host_offline | default(false) | bool),
          'offline': (bootwright_arbiter_retire_offline | default(false) | bool)
        } | to_nice_json
      }}
    mode: "0600"
  delegate_to: localhost
  become: false
  when: (bootwright_arbiter_live_node | default('') | length) > 0

- name: Drain the remaining daemons of the replaced arbiter host
  ansible.builtin.command:
    argv:
      - timeout
      - "--kill-after={{ bootwright_ceph_timeout_kill_after_seconds }}"
      - "{{ bootwright_ceph_removal_timeout_seconds }}"
      - cephadm
      - shell
      - --
      - ceph
      - orch
      - host
      - drain
      - "{{ bootwright_arbiter_live_node }}"
  register: bootwright_arbiter_host_drain
  changed_when: bootwright_arbiter_host_drain.rc | default(1) | int == 0
  failed_when: bootwright_arbiter_host_drain.rc | default(0) | int in [124, 137]
  when:
    - (bootwright_arbiter_live_node | default('') | length) > 0
    - not (bootwright_arbiter_retire_offline | default(false) | bool)

- name: Remove the replaced arbiter host from the orchestrator
  ansible.builtin.command:
    argv: >-
      {{
        ['timeout',
         '--kill-after=' ~ (bootwright_ceph_timeout_kill_after_seconds | string),
         bootwright_ceph_removal_timeout_seconds | string,
         'cephadm', 'shell', '--', 'ceph', 'orch', 'host', 'rm', bootwright_arbiter_live_node]
        + (['--offline', '--force']
           if (bootwright_arbiter_retire_offline | default(false) | bool) else [])
      }}
  register: bootwright_arbiter_host_rm
  changed_when: bootwright_arbiter_host_rm.rc | default(1) | int == 0
  failed_when: bootwright_arbiter_host_rm.rc | default(0) | int in [124, 137]
  retries: 12
  delay: 10
  until: >-
    bootwright_arbiter_host_rm.rc | default(1) | int == 0
    or (bootwright_arbiter_host_rm.rc | default(0) | int in [124, 137])
    or (bootwright_arbiter_host_rm.stderr | default('') is search('Unknown host|does not exist|not found'))
    or ((bootwright_arbiter_host_rm.attempts | default(1) | int) >= 12)
  when: (bootwright_arbiter_live_node | default('') | length) > 0

- name: Refuse a replaced arbiter host the orchestrator still carries
  ansible.builtin.assert:
    that:
      - bootwright_arbiter_host_rm.rc | default(0) | int == 0
        or (bootwright_arbiter_host_rm.stderr | default('') is search('Unknown host|does not exist|not found'))
    fail_msg: >-
      `ceph orch host rm {{ bootwright_arbiter_live_node }}` on storage cluster
      {{ bootwright_arbiter_cluster_name }} did not remove the replaced arbiter host, so
      cephadm still manages it and can still place daemons on it. The tiebreaker has
      ALREADY moved to mon.{{ bootwright_arbiter_desired_mon }}, so the cluster is correct
      but still carries the retired host. Drain it by hand with
      `ceph orch host drain {{ bootwright_arbiter_live_node }}` and retry with
      `{{ bootwright_mutating_invocation }}` to finish the retirement; if the host is gone
      for good, power it down and retry with
      `{{ bootwright_arbiter_unreachable_invocation }}`, which takes the offline path once
      `ceph orch host ls` reports it offline.
      rc: {{ bootwright_arbiter_host_rm.rc | default('<none>') }}
      stdout: {{ bootwright_arbiter_host_rm.stdout | default('') }}
      stderr: {{ bootwright_arbiter_host_rm.stderr | default('') }}
    quiet: true
  when: (bootwright_arbiter_live_node | default('') | length) > 0

- name: Remove the arbiter replacement work directory from the seed
  ansible.builtin.file:
    path: "{{ bootwright_arbiter_work_dir.path }}"
    state: absent
  changed_when: false
