---
- name: Gather seed OS facts for provider rendering
  ansible.builtin.setup:
    gather_subset:
      - "!all"
      - "!min"
      - distribution
  when: ansible_distribution_major_version | default('') | length == 0

- name: Resolve managed Ceph provider context on the seed host
  ansible.builtin.include_tasks: context_provider.yml

- name: Load the rendered Ceph operation manifest
  ansible.builtin.set_fact:
    bootwright_ceph_operation_manifest: >-
      {{ lookup('ansible.builtin.file', bootwright_selected_storage_cluster.ceph.operationsPath) | from_yaml }}
  delegate_to: localhost
  become: false

- name: Resolve rendered Ceph operations, execution plan and batch scripts
  ansible.builtin.set_fact:
    bootwright_ceph_operations: "{{ bootwright_ceph_operation_manifest.operations | default([]) }}"
    bootwright_ceph_plan: "{{ bootwright_ceph_operation_manifest.plan | default([]) }}"
    bootwright_ceph_batch_files: "{{ bootwright_ceph_operation_manifest.batchFiles | default([]) }}"

- name: Load cephadm registry credentials on the seed host
  ansible.builtin.include_role:
    name: bootwright.core.support_credentials
    tasks_from: load
  vars:
    bootwright_creds_path: "{{ bootwright_ceph_registry_credentials_path }}"
    bootwright_creds_var: bootwright_ceph_registry_credentials
    bootwright_creds_label: "cephadm registry credentialsRef {{ bootwright_ceph_registry_credentials_path }}"
  when:
    - bootwright_ceph_registry_credentials_path | length > 0
    - bootwright_ceph_registry_credentials is not defined
