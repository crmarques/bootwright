---
- name: Resolve OSD readiness expectation
  ansible.builtin.set_fact:
    bootwright_ceph_osd_readiness_mode: >-
      {{ (bootwright_selected_storage_cluster.osdReadiness | default({})).mode | default('atLeastOne') }}
    bootwright_ceph_osd_expected_count: >-
      {{ (bootwright_selected_storage_cluster.osdReadiness | default({})).expectedCount | default(0) | int }}
    bootwright_ceph_osd_dynamic_hosts: >-
      {{ (bootwright_selected_storage_cluster.osdReadiness | default({})).dynamicHosts | default([]) | list }}

- name: Report skipped OSD readiness check
  ansible.builtin.debug:
    msg: >-
      Skipping OSD readiness check for {{ bootwright_selected_storage_cluster.name }}:
      no managed OSD service actively creates OSDs (no osd-role host, or every OSD
      service is unmanaged).
  when: bootwright_ceph_osd_readiness_mode == 'skip'

- name: Wait for declared Ceph OSDs to be created and in
  ansible.builtin.command:
    argv:
      - cephadm
      - shell
      - --
      - ceph
      - osd
      - stat
      - --format
      - json
  register: bootwright_ceph_osd_stat
  changed_when: false
  failed_when: false
  retries: "{{ bootwright_ceph_osd_readiness_retries | default(30) | int }}"
  delay: "{{ bootwright_ceph_osd_readiness_delay | default(10) | int }}"
  until: >-
    (
      bootwright_ceph_osd_stat.rc == 0
      and (
        (bootwright_ceph_osd_readiness_mode == 'exact'
         and ((bootwright_ceph_osd_stat.stdout | default('{}') | from_json).num_in_osds | default(0) | int)
             >= (bootwright_ceph_osd_expected_count | int))
        or
        (bootwright_ceph_osd_readiness_mode == 'atLeastOne'
         and ((bootwright_ceph_osd_stat.stdout | default('{}') | from_json).num_in_osds | default(0) | int)
             >= (bootwright_ceph_osd_expected_count | int))
      )
    )
    or
    ((bootwright_ceph_osd_stat.attempts | default(1) | int)
     >= (bootwright_ceph_osd_readiness_retries | default(30) | int))
  when: bootwright_ceph_osd_readiness_mode != 'skip'

- name: Evaluate whether declared Ceph OSDs became ready
  ansible.builtin.set_fact:
    bootwright_ceph_osd_ready: >-
      {{
        (bootwright_ceph_osd_stat.rc | default(1) | int) == 0
        and (
          (bootwright_ceph_osd_readiness_mode == 'exact'
           and ((bootwright_ceph_osd_stat.stdout | default('{}') | from_json).num_in_osds | default(0) | int)
               >= (bootwright_ceph_osd_expected_count | int))
          or
          (bootwright_ceph_osd_readiness_mode == 'atLeastOne'
           and ((bootwright_ceph_osd_stat.stdout | default('{}') | from_json).num_in_osds | default(0) | int)
               >= (bootwright_ceph_osd_expected_count | int))
        )
      }}
  when: bootwright_ceph_osd_readiness_mode != 'skip'

- name: Collect Ceph device inventory when OSDs did not become ready
  ansible.builtin.command:
    argv:
      - cephadm
      - shell
      - --
      - ceph
      - orch
      - device
      - ls
      - --wide
  register: bootwright_ceph_osd_device_ls
  changed_when: false
  failed_when: false
  when:
    - bootwright_ceph_osd_readiness_mode != 'skip'
    - not (bootwright_ceph_osd_ready | default(false) | bool)

- name: Collect declared OSD service status when OSDs did not become ready
  ansible.builtin.command:
    argv:
      - cephadm
      - shell
      - --
      - ceph
      - orch
      - ls
      - --service_type
      - osd
      - --format
      - yaml
  register: bootwright_ceph_osd_service_ls
  changed_when: false
  failed_when: false
  when:
    - bootwright_ceph_osd_readiness_mode != 'skip'
    - not (bootwright_ceph_osd_ready | default(false) | bool)

- name: Assert declared Ceph OSDs were created
  ansible.builtin.assert:
    that:
      - bootwright_ceph_osd_ready | default(false) | bool
    fail_msg: >-
      Ceph cluster {{ bootwright_selected_storage_cluster.name }} did not create the
      declared OSDs: expected
      {{ 'exactly ' ~ bootwright_ceph_osd_expected_count if bootwright_ceph_osd_readiness_mode == 'exact' else 'at least ' ~ bootwright_ceph_osd_expected_count }}
      OSD(s) 'in', observed
      {{ (bootwright_ceph_osd_stat.stdout | default('{}') | from_json).num_in_osds | default('unknown') }}
      (up {{ (bootwright_ceph_osd_stat.stdout | default('{}') | from_json).num_up_osds | default('unknown') }})
      after {{ bootwright_ceph_osd_readiness_retries | default(30) }} attempts. cephadm
      accepted the OSD spec but ceph-volume did not consume the declared devices. The
      device inventory below reports, per device, whether it is AVAILABLE and, if not,
      the REJECT REASONS (for example: locked, already carries a filesystem/LVM/bluestore
      signature, or is too small); the OSD service status shows the RUNNING count and any
      placement events. Devices declared only through an OSD filter (all/model/size/rotational)
      are not covered by the install-time emptiness guard, so a dirty or previously-used
      disk reaches ceph-volume unchecked — clean the offending device on its host (confirm
      it is disposable, then `wipefs --all` / `sgdisk --zap-all`) or exclude it from the OSD
      device selection, and re-apply. This apply is failing closed rather than reporting
      success against a short or zero-OSD cluster.
      Ceph device inventory (ceph orch device ls --wide):
      {{ (bootwright_ceph_osd_device_ls.stdout | default('') | trim) or '(device inventory unavailable — the cluster was unreachable)' }}
      Declared OSD services (ceph orch ls --service_type osd):
      {{ (bootwright_ceph_osd_service_ls.stdout | default('') | trim) or '(OSD service status unavailable — the cluster was unreachable)' }}
  when: bootwright_ceph_osd_readiness_mode != 'skip'

- name: Wait for an in OSD on every dynamic-selection host
  ansible.builtin.command:
    argv:
      - cephadm
      - shell
      - --
      - ceph
      - osd
      - tree
      - --format
      - json
  register: bootwright_ceph_osd_host_tree
  changed_when: false
  failed_when: false
  retries: "{{ bootwright_ceph_osd_readiness_retries | default(30) | int }}"
  delay: "{{ bootwright_ceph_osd_readiness_delay | default(10) | int }}"
  until: >-
    (
      bootwright_ceph_osd_host_tree.rc == 0
      and (
        (
          ((bootwright_ceph_osd_host_tree.stdout | default('{}') | from_json).nodes
           | default([])
           | selectattr('type', 'equalto', 'osd')
           | selectattr('reweight', 'gt', 0)
           | map(attribute='id')
           | list)
          | intersect(
              ((bootwright_ceph_osd_host_tree.stdout | default('{}') | from_json).nodes
               | default([])
               | selectattr('type', 'equalto', 'host')
               | selectattr('name', 'equalto', item)
               | map(attribute='children')
               | list
               | flatten)
            )
          | length
        ) >= 1
      )
    )
    or
    ((bootwright_ceph_osd_host_tree.attempts | default(1) | int)
     >= (bootwright_ceph_osd_readiness_retries | default(30) | int))
  loop: "{{ bootwright_ceph_osd_dynamic_hosts }}"
  loop_control:
    label: "{{ item }}"
  when: bootwright_ceph_osd_dynamic_hosts | length > 0

- name: Assert every dynamic-selection host was probed
  ansible.builtin.assert:
    that:
      - >-
        (bootwright_ceph_osd_host_tree.results | default([]) | length)
        == (bootwright_ceph_osd_dynamic_hosts | length)
  when: bootwright_ceph_osd_dynamic_hosts | length > 0

- name: Assert an in OSD exists on every dynamic-selection host
  ansible.builtin.assert:
    that:
      - >-
        (bootwright_ceph_osd_host_result.rc | default(1) | int) == 0
        and (
          (
            ((bootwright_ceph_osd_host_result.stdout | default('{}') | from_json).nodes
             | default([])
             | selectattr('type', 'equalto', 'osd')
             | selectattr('reweight', 'gt', 0)
             | map(attribute='id')
             | list)
            | intersect(
                ((bootwright_ceph_osd_host_result.stdout | default('{}') | from_json).nodes
                 | default([])
                 | selectattr('type', 'equalto', 'host')
                 | selectattr('name', 'equalto', bootwright_ceph_osd_host_result.item)
                 | map(attribute='children')
                 | list
                 | flatten)
              )
            | length
          ) >= 1
        )
    fail_msg: >-
      Ceph cluster {{ bootwright_selected_storage_cluster.name }} did not create
      an in OSD on dynamic-selection host
      {{ bootwright_ceph_osd_host_result.item | default('unknown') }} after
      {{ bootwright_ceph_osd_readiness_retries | default(30) }} attempts. Inspect
      `ceph orch device ls --wide`, the declared OSD service status, and the CRUSH
      tree below; clean or exclude rejected devices, then re-apply.
      {{ bootwright_ceph_osd_host_result.stdout | default('(CRUSH tree unavailable)') }}
  loop: "{{ bootwright_ceph_osd_host_tree.results | default([]) }}"
  loop_control:
    loop_var: bootwright_ceph_osd_host_result
    label: "{{ bootwright_ceph_osd_host_result.item | default('unknown') }}"
  when: bootwright_ceph_osd_dynamic_hosts | length > 0

- name: Capture observed Ceph health for the storage result
  ansible.builtin.command:
    argv:
      - cephadm
      - shell
      - --
      - ceph
      - health
      - --format
      - json
  register: bootwright_ceph_health_probe
  changed_when: false
  failed_when: false
  when: bootwright_ceph_osd_readiness_mode != 'skip'

- name: Record observed OSD readiness for the storage result
  ansible.builtin.set_fact:
    bootwright_ceph_osd_observed:
      mode: "{{ bootwright_ceph_osd_readiness_mode }}"
      expected: "{{ bootwright_ceph_osd_expected_count | int }}"
      inOSDs: >-
        {{ (bootwright_ceph_osd_stat.stdout | default('{}') | from_json).num_in_osds | default(0) | int }}
      upOSDs: >-
        {{ (bootwright_ceph_osd_stat.stdout | default('{}') | from_json).num_up_osds | default(0) | int }}
      health: >-
        {{ (bootwright_ceph_health_probe.stdout | default('{}') | from_json).status | default('UNKNOWN') }}
  when: bootwright_ceph_osd_readiness_mode != 'skip'
