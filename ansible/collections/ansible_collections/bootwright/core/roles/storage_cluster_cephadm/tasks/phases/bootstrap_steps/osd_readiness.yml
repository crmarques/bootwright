---
- name: Resolve OSD readiness expectation
  ansible.builtin.set_fact:
    bootwright_ceph_osd_readiness_mode: >-
      {{ (bootwright_selected_storage_cluster.osdReadiness | default({})).mode | default('atLeastOne') }}
    bootwright_ceph_osd_expected_count: >-
      {{ (bootwright_selected_storage_cluster.osdReadiness | default({})).expectedCount | default(0) | int }}

- name: Report skipped OSD readiness check
  ansible.builtin.debug:
    msg: >-
      Skipping OSD readiness check for {{ bootwright_selected_storage_cluster.name }}:
      no managed OSD service actively creates OSDs (no osd-role host, or every OSD
      service is unmanaged).
  when: bootwright_ceph_osd_readiness_mode == 'skip'

- name: Wait for declared Ceph OSDs to be created and in
  ansible.builtin.command:
    argv:
      - cephadm
      - shell
      - --
      - ceph
      - osd
      - stat
      - --format
      - json
  register: bootwright_ceph_osd_stat
  changed_when: false
  failed_when: false
  retries: "{{ bootwright_ceph_osd_readiness_retries | default(30) | int }}"
  delay: "{{ bootwright_ceph_osd_readiness_delay | default(10) | int }}"
  until: >-
    bootwright_ceph_osd_stat.rc == 0
    and (
      (bootwright_ceph_osd_readiness_mode == 'exact'
       and ((bootwright_ceph_osd_stat.stdout | default('{}') | from_json).num_in_osds | default(0) | int)
           >= (bootwright_ceph_osd_expected_count | int))
      or
      (bootwright_ceph_osd_readiness_mode == 'atLeastOne'
       and ((bootwright_ceph_osd_stat.stdout | default('{}') | from_json).num_in_osds | default(0) | int) >= 1)
    )
  when: bootwright_ceph_osd_readiness_mode != 'skip'

- name: Assert declared Ceph OSDs were created
  ansible.builtin.assert:
    that:
      - bootwright_ceph_osd_stat.rc | default(1) == 0
      - >-
        (bootwright_ceph_osd_readiness_mode == 'exact'
         and ((bootwright_ceph_osd_stat.stdout | default('{}') | from_json).num_in_osds | default(0) | int)
             >= (bootwright_ceph_osd_expected_count | int))
        or
        (bootwright_ceph_osd_readiness_mode == 'atLeastOne'
         and ((bootwright_ceph_osd_stat.stdout | default('{}') | from_json).num_in_osds | default(0) | int) >= 1)
    fail_msg: >-
      Ceph cluster {{ bootwright_selected_storage_cluster.name }} did not create the
      declared OSDs: expected
      {{ 'exactly ' ~ bootwright_ceph_osd_expected_count if bootwright_ceph_osd_readiness_mode == 'exact' else 'at least 1' }}
      OSD(s) 'in', observed
      {{ (bootwright_ceph_osd_stat.stdout | default('{}') | from_json).num_in_osds | default('unknown') }}
      after {{ bootwright_ceph_osd_readiness_retries | default(30) }} attempts. cephadm
      accepted the OSD spec but ceph-volume did not consume the declared devices —
      check the devices are empty and large enough, `cephadm ls`/`ceph orch device ls`
      on the OSD hosts, and the OSD daemon logs. This apply is failing closed rather
      than reporting success against a short or zero-OSD cluster.
  when: bootwright_ceph_osd_readiness_mode != 'skip'

- name: Capture observed Ceph health for the storage result
  ansible.builtin.command:
    argv:
      - cephadm
      - shell
      - --
      - ceph
      - health
      - --format
      - json
  register: bootwright_ceph_health_probe
  changed_when: false
  failed_when: false
  when: bootwright_ceph_osd_readiness_mode != 'skip'

- name: Record observed OSD readiness for the storage result
  ansible.builtin.set_fact:
    bootwright_ceph_osd_observed:
      mode: "{{ bootwright_ceph_osd_readiness_mode }}"
      expected: "{{ bootwright_ceph_osd_expected_count | int }}"
      inOSDs: >-
        {{ (bootwright_ceph_osd_stat.stdout | default('{}') | from_json).num_in_osds | default(0) | int }}
      upOSDs: >-
        {{ (bootwright_ceph_osd_stat.stdout | default('{}') | from_json).num_up_osds | default(0) | int }}
      health: >-
        {{ (bootwright_ceph_health_probe.stdout | default('{}') | from_json).status | default('UNKNOWN') }}
  when: bootwright_ceph_osd_readiness_mode != 'skip'
