---
- name: Resolve OSD readiness expectation
  ansible.builtin.set_fact:
    bootwright_ceph_osd_readiness_mode: >-
      {{ (bootwright_selected_storage_cluster.osdReadiness | default({})).mode | default('atLeastOne') }}
    bootwright_ceph_osd_expected_count: >-
      {{ (bootwright_selected_storage_cluster.osdReadiness | default({})).expectedCount | default(0) | int }}
    bootwright_ceph_osd_dynamic_hosts: >-
      {{ (bootwright_selected_storage_cluster.osdReadiness | default({})).dynamicHosts | default([]) | list }}
    bootwright_ceph_osd_dynamic_crush_names: >-
      {{ (bootwright_selected_storage_cluster.osdReadiness | default({})).dynamicHosts | default([])
         | map(attribute='crushNames') | flatten | list }}
    bootwright_ceph_osd_reclaim_all_hosts: >-
      {{ bootwright_selected_storage_cluster.hosts | default([])
         | selectattr('osdReclaimAll', 'defined') | list }}

- name: Resolve the OSD readiness attempt budget
  ansible.builtin.set_fact:
    bootwright_ceph_osd_readiness_attempts: >-
      {{ bootwright_ceph_osd_readiness_retries
         | default([90, ((bootwright_ceph_osd_expected_count | int) * 6)] | max)
         | int }}

- name: Set the OSD readiness wall-clock deadline
  ansible.builtin.set_fact:
    bootwright_ceph_osd_readiness_budget_seconds: "{{ bootwright_ceph_osd_readiness_wall_budget | int }}"
    bootwright_ceph_osd_readiness_deadline: >-
      {{ (now(utc=true).timestamp() | int)
         + (bootwright_ceph_osd_readiness_wall_budget | int) }}
  vars:
    bootwright_ceph_osd_readiness_wall_budget: >-
      {{ bootwright_ceph_osd_readiness_wall_seconds
         | default((bootwright_ceph_osd_readiness_attempts | int)
                   * (bootwright_ceph_osd_readiness_delay | default(10) | int) * 2)
         | int }}

- name: Report skipped OSD readiness check
  ansible.builtin.debug:
    msg: >-
      Skipping OSD readiness check for {{ bootwright_selected_storage_cluster.name }}:
      no managed OSD service actively creates OSDs (no osd-role host, or every OSD
      service is unmanaged).
  when: bootwright_ceph_osd_readiness_mode == 'skip'

- name: Wait for declared Ceph OSDs to be created and in
  ansible.builtin.command:
    argv:
      - timeout
      - --kill-after=10
      - "120"
      - cephadm
      - shell
      - --
      - ceph
      - osd
      - stat
      - --format
      - json
  register: bootwright_ceph_osd_stat
  changed_when: false
  failed_when: false
  retries: "{{ bootwright_ceph_osd_readiness_attempts | int }}"
  delay: "{{ bootwright_ceph_osd_readiness_delay | default(10) | int }}"
  until: >-
    (
      (bootwright_ceph_osd_readiness_mode == 'exact'
       and (bootwright_ceph_osd_stat.stdout | default('', true)
            | regex_search('"num_in_osds"\s*:\s*([0-9]+)', '\1')
            | default(['-1'], true) | first | int)
           >= (bootwright_ceph_osd_expected_count | int))
      or
      (bootwright_ceph_osd_readiness_mode == 'atLeastOne'
       and (bootwright_ceph_osd_stat.stdout | default('', true)
            | regex_search('"num_in_osds"\s*:\s*([0-9]+)', '\1')
            | default(['-1'], true) | first | int)
           >= (bootwright_ceph_osd_expected_count | int))
    )
    or
    ((bootwright_ceph_osd_stat.attempts | default(1) | int)
     >= (bootwright_ceph_osd_readiness_attempts | int))
    or
    ((now(utc=true).timestamp() | int)
     >= (bootwright_ceph_osd_readiness_deadline | int))
  when: bootwright_ceph_osd_readiness_mode != 'skip'

- name: Evaluate whether declared Ceph OSDs became ready
  ansible.builtin.set_fact:
    bootwright_ceph_osd_ready: >-
      {{
        (bootwright_ceph_osd_readiness_mode == 'exact'
         and (bootwright_ceph_osd_stat.stdout | default('', true)
              | regex_search('"num_in_osds"\s*:\s*([0-9]+)', '\1')
              | default(['-1'], true) | first | int)
             >= (bootwright_ceph_osd_expected_count | int))
        or
        (bootwright_ceph_osd_readiness_mode == 'atLeastOne'
         and (bootwright_ceph_osd_stat.stdout | default('', true)
              | regex_search('"num_in_osds"\s*:\s*([0-9]+)', '\1')
              | default(['-1'], true) | first | int)
             >= (bootwright_ceph_osd_expected_count | int))
      }}
  when: bootwright_ceph_osd_readiness_mode != 'skip'

- name: Grant the dynamic-host CRUSH poll its own share of the readiness deadline
  ansible.builtin.set_fact:
    bootwright_ceph_osd_readiness_deadline: >-
      {{ [(bootwright_ceph_osd_readiness_deadline | int),
          ((now(utc=true).timestamp() | int)
           + (bootwright_ceph_osd_tree_min_budget_seconds | default(600) | int))] | max }}
  when:
    - bootwright_ceph_osd_dynamic_hosts | length > 0
    - bootwright_ceph_osd_ready | default(false) | bool

- name: Wait for an in OSD on every dynamic-selection host
  ansible.builtin.command:
    argv:
      - timeout
      - --kill-after=10
      - "120"
      - cephadm
      - shell
      - --
      - ceph
      - osd
      - tree
      - --format
      - json
  register: bootwright_ceph_osd_host_tree
  changed_when: false
  failed_when: false
  retries: "{{ bootwright_ceph_osd_readiness_attempts | int }}"
  delay: "{{ bootwright_ceph_osd_readiness_delay | default(10) | int }}"
  until: >-
    (
      ((bootwright_ceph_osd_host_tree.rc | default(1) | int) == 0
       or ((bootwright_ceph_osd_host_tree.stdout | default('', true) | regex_search('\}\s*$')) is not none))
      and (
        (
          (bootwright_ceph_osd_host_tree.stdout | default('{}', true) | from_json).nodes
          | default([])
          | selectattr('type', 'equalto', 'host')
          | selectattr('name', 'in', bootwright_ceph_osd_dynamic_crush_names)
          | map(attribute='children')
          | map('intersect',
                ((bootwright_ceph_osd_host_tree.stdout | default('{}', true) | from_json).nodes
                 | default([])
                 | selectattr('type', 'equalto', 'osd')
                 | selectattr('reweight', 'gt', 0)
                 | map(attribute='id')
                 | list))
          | map('length')
          | select('gt', 0)
          | list
          | length
        ) >= (bootwright_ceph_osd_dynamic_hosts | length)
      )
    )
    or
    ((bootwright_ceph_osd_host_tree.attempts | default(1) | int)
     >= (bootwright_ceph_osd_readiness_attempts | int))
    or
    ((now(utc=true).timestamp() | int)
     >= (bootwright_ceph_osd_readiness_deadline | int))
  when:
    - bootwright_ceph_osd_dynamic_hosts | length > 0
    - bootwright_ceph_osd_ready | default(false) | bool

- name: Evaluate whether every dynamic-selection host has an in OSD
  ansible.builtin.set_fact:
    bootwright_ceph_osd_dynamic_ready: >-
      {{
        ((bootwright_ceph_osd_host_tree.rc | default(1) | int) == 0
         or ((bootwright_ceph_osd_host_tree.stdout | default('', true) | regex_search('\}\s*$')) is not none))
        and (
          (bootwright_ceph_osd_host_tree.stdout | default('{}', true) | from_json).nodes
          | default([])
          | selectattr('type', 'equalto', 'host')
          | selectattr('name', 'in', bootwright_ceph_osd_dynamic_crush_names)
          | map(attribute='children')
          | map('intersect',
                ((bootwright_ceph_osd_host_tree.stdout | default('{}', true) | from_json).nodes
                 | default([])
                 | selectattr('type', 'equalto', 'osd')
                 | selectattr('reweight', 'gt', 0)
                 | map(attribute='id')
                 | list))
          | map('length')
          | select('gt', 0)
          | list
          | length
        ) >= (bootwright_ceph_osd_dynamic_hosts | length)
      }}
  when:
    - bootwright_ceph_osd_dynamic_hosts | length > 0
    - bootwright_ceph_osd_ready | default(false) | bool

- name: Collect Ceph device inventory when OSDs did not become ready
  ansible.builtin.command:
    argv:
      - timeout
      - --kill-after=10
      - "300"
      - cephadm
      - shell
      - --
      - ceph
      - orch
      - device
      - ls
      - --wide
      - --refresh
  register: bootwright_ceph_osd_device_ls
  changed_when: false
  failed_when: false
  retries: "{{ bootwright_ceph_osd_device_ls_retries | default(6) | int }}"
  delay: "{{ bootwright_ceph_osd_device_ls_delay | default(5) | int }}"
  until: >-
    (
      bootwright_ceph_osd_device_ls.rc == 0
      and (bootwright_ceph_osd_device_ls.stdout | default('') | trim | length > 0)
    )
    or
    ((bootwright_ceph_osd_device_ls.attempts | default(1) | int)
     >= (bootwright_ceph_osd_device_ls_retries | default(6) | int))
  when:
    - bootwright_ceph_osd_readiness_mode != 'skip'
    - >-
      not (bootwright_ceph_osd_ready | default(false) | bool)
      or (
        bootwright_ceph_osd_dynamic_hosts | length > 0
        and not (bootwright_ceph_osd_dynamic_ready | default(true) | bool)
      )

- name: Collect machine-readable device availability when OSDs did not become ready
  ansible.builtin.command:
    argv:
      - timeout
      - --kill-after=10
      - "300"
      - cephadm
      - shell
      - --
      - ceph
      - orch
      - device
      - ls
      - --format
      - json
  register: bootwright_ceph_osd_device_json
  changed_when: false
  failed_when: false
  when:
    - bootwright_ceph_osd_readiness_mode != 'skip'
    - >-
      not (bootwright_ceph_osd_ready | default(false) | bool)
      or (
        bootwright_ceph_osd_dynamic_hosts | length > 0
        and not (bootwright_ceph_osd_dynamic_ready | default(true) | bool)
      )

- name: Collect declared OSD service status when OSDs did not become ready
  ansible.builtin.command:
    argv:
      - timeout
      - --kill-after=10
      - "300"
      - cephadm
      - shell
      - --
      - ceph
      - orch
      - ls
      - --service_type
      - osd
      - --format
      - yaml
  register: bootwright_ceph_osd_service_ls
  changed_when: false
  failed_when: false
  when:
    - bootwright_ceph_osd_readiness_mode != 'skip'
    - >-
      not (bootwright_ceph_osd_ready | default(false) | bool)
      or (
        bootwright_ceph_osd_dynamic_hosts | length > 0
        and not (bootwright_ceph_osd_dynamic_ready | default(true) | bool)
      )

- name: Collect Ceph orchestrator host status when OSDs did not become ready
  ansible.builtin.command:
    argv:
      - timeout
      - --kill-after=10
      - "300"
      - cephadm
      - shell
      - --
      - ceph
      - orch
      - host
      - ls
      - --format
      - yaml
  register: bootwright_ceph_osd_host_ls
  changed_when: false
  failed_when: false
  when:
    - bootwright_ceph_osd_readiness_mode != 'skip'
    - >-
      not (bootwright_ceph_osd_ready | default(false) | bool)
      or (
        bootwright_ceph_osd_dynamic_hosts | length > 0
        and not (bootwright_ceph_osd_dynamic_ready | default(true) | bool)
      )

- name: Collect Ceph daemon placement when OSDs did not become ready
  ansible.builtin.command:
    argv:
      - timeout
      - --kill-after=10
      - "300"
      - cephadm
      - shell
      - --
      - ceph
      - orch
      - ps
      - --format
      - yaml
  register: bootwright_ceph_osd_daemon_ps
  changed_when: false
  failed_when: false
  when:
    - bootwright_ceph_osd_readiness_mode != 'skip'
    - >-
      not (bootwright_ceph_osd_ready | default(false) | bool)
      or (
        bootwright_ceph_osd_dynamic_hosts | length > 0
        and not (bootwright_ceph_osd_dynamic_ready | default(true) | bool)
      )

- name: Resolve the age of the cephadm orchestrator cache when OSDs did not become ready
  ansible.builtin.set_fact:
    bootwright_ceph_osd_orch_refresh_newest: >-
      {{ (bootwright_ceph_osd_refresh_stamps | sort | last)
         if (bootwright_ceph_osd_refresh_stamps | length) > 0 else '' }}
    bootwright_ceph_osd_orch_refresh_oldest: >-
      {{ (bootwright_ceph_osd_refresh_stamps | sort | first)
         if (bootwright_ceph_osd_refresh_stamps | length) > 0 else '' }}
    bootwright_ceph_osd_orch_refresh_age: >-
      {{ ((now(utc=true) - ((bootwright_ceph_osd_refresh_stamps | sort | last)
                            | to_datetime('%Y-%m-%dT%H:%M:%S'))).total_seconds() | int)
         if (bootwright_ceph_osd_refresh_stamps | length) > 0 else -1 }}
  vars:
    bootwright_ceph_osd_refresh_stamps: >-
      {{ ((bootwright_ceph_osd_daemon_ps.stdout | default('')) ~ ' '
          ~ (bootwright_ceph_osd_service_ls.stdout | default('')))
         | regex_findall("last_refresh:\s*'?([0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2})") }}
  when:
    - bootwright_ceph_osd_readiness_mode != 'skip'
    - >-
      not (bootwright_ceph_osd_ready | default(false) | bool)
      or (
        bootwright_ceph_osd_dynamic_hosts | length > 0
        and not (bootwright_ceph_osd_dynamic_ready | default(true) | bool)
      )

- name: Summarise declared OSD device availability for the readiness failure
  ansible.builtin.set_fact:
    bootwright_ceph_osd_declared_osd_hosts: "{{ bootwright_ceph_osd_declared_host_names }}"
    bootwright_ceph_osd_uninventoried_hosts: "{{ bootwright_ceph_osd_missing_inventory_hosts }}"
    bootwright_ceph_osd_declared_device_total: "{{ bootwright_ceph_osd_declared_paths | length }}"
    bootwright_ceph_osd_declared_inventoried_total: "{{ bootwright_ceph_osd_declared_devices | length }}"
    bootwright_ceph_osd_declared_unavailable_total: "{{ bootwright_ceph_osd_unavailable_devices | length }}"
    bootwright_ceph_osd_reclaim_all_unavailable_total: "{{ bootwright_ceph_osd_reclaim_all_unavailable | length }}"
    bootwright_ceph_osd_device_evidence: >-
      {{ (bootwright_ceph_osd_declared_paths | length) > 0
         or (bootwright_ceph_osd_reclaim_all_host_names | length) > 0 }}
    bootwright_ceph_osd_declared_available_total: >-
      {{ (bootwright_ceph_osd_declared_devices | length)
         - (bootwright_ceph_osd_unavailable_devices | length) }}
    bootwright_ceph_osd_service_breakdown: >-
      {{ (bootwright_ceph_osd_service_names | zip(bootwright_ceph_osd_service_running)
          | map('join', ' running=') | list | join(', '))
         or '(no OSD service reported a running count)' }}
    bootwright_ceph_osd_orch_staleness: >-
      {{ bootwright_ceph_osd_staleness_dated
         if (bootwright_ceph_osd_orch_refresh_newest | default('') | length) > 0
         else bootwright_ceph_osd_staleness_unknown }}
    bootwright_ceph_osd_availability_summary: >-
      {{ bootwright_ceph_osd_availability_counted
         if (bootwright_ceph_osd_declared_host_names | length) > 0
         else bootwright_ceph_osd_availability_unknown }}
  vars:
    bootwright_ceph_osd_declared_osd_host_entries: >-
      {{ bootwright_selected_storage_cluster.hosts | default([])
         | selectattr('cephHostname', 'defined')
         | rejectattr('cephHostname', 'equalto', '')
         | selectattr('devices', 'defined')
         | rejectattr('devices', 'equalto', none)
         | rejectattr('devices', 'equalto', []) | list }}
    bootwright_ceph_osd_declared_host_names: >-
      {{ bootwright_ceph_osd_declared_osd_host_entries
         | map(attribute='cephHostname') | reject('equalto', '') | list }}
    bootwright_ceph_osd_declared_paths: >-
      {{ bootwright_ceph_osd_declared_osd_host_entries
         | map(attribute='devices') | flatten | list }}
    bootwright_ceph_osd_inventoried_host_names: >-
      {{ (bootwright_ceph_osd_device_json.stdout | default('[]', true) | from_json)
         | selectattr('name', 'defined')
         | selectattr('name', 'in', bootwright_ceph_osd_declared_host_names)
         | selectattr('devices', 'defined')
         | rejectattr('devices', 'equalto', [])
         | map(attribute='name') | list }}
    bootwright_ceph_osd_missing_inventory_hosts: >-
      {{ bootwright_ceph_osd_declared_host_names
         | reject('in', bootwright_ceph_osd_inventoried_host_names) | list }}
    bootwright_ceph_osd_declared_devices: >-
      {{ (bootwright_ceph_osd_device_json.stdout | default('[]', true) | from_json)
         | selectattr('name', 'defined')
         | selectattr('name', 'in', bootwright_ceph_osd_declared_host_names)
         | map(attribute='devices', default=[]) | flatten
         | selectattr('path', 'defined')
         | selectattr('path', 'in', bootwright_ceph_osd_declared_paths) | list }}
    bootwright_ceph_osd_unavailable_devices: >-
      {{ bootwright_ceph_osd_declared_devices
         | selectattr('available', 'defined')
         | selectattr('available', 'equalto', false) | list }}
    bootwright_ceph_osd_reclaim_all_host_names: >-
      {{ bootwright_ceph_osd_reclaim_all_hosts | default([])
         | selectattr('cephHostname', 'defined')
         | map(attribute='cephHostname') | reject('equalto', '') | list }}
    bootwright_ceph_osd_reclaim_all_unavailable: >-
      {{ (bootwright_ceph_osd_device_json.stdout | default('[]', true) | from_json)
         | selectattr('name', 'defined')
         | selectattr('name', 'in', bootwright_ceph_osd_reclaim_all_host_names)
         | map(attribute='devices', default=[]) | flatten
         | selectattr('available', 'defined')
         | selectattr('available', 'equalto', false) | list }}
    bootwright_ceph_osd_service_names: >-
      {{ bootwright_ceph_osd_service_ls.stdout | default('')
         | regex_findall('service_name:\s*(\S+)') }}
    bootwright_ceph_osd_service_running: >-
      {{ bootwright_ceph_osd_service_ls.stdout | default('')
         | regex_findall('running:\s*(\d+)') }}
    bootwright_ceph_osd_staleness_unknown: >-
      Orchestrator cache age: cephadm reported no last_refresh stamp, so the host,
      daemon and device lists below cannot be dated. They are served from the cephadm
      mgr module's cache, not read live, so treat a short list as undated rather than
      as proof the cluster is empty.
    bootwright_ceph_osd_orch_refresh_window: >-
      {{ (now(utc=true).timestamp() | int)
         - ((bootwright_ceph_osd_readiness_deadline | int)
            - (bootwright_ceph_osd_readiness_budget_seconds | int)) }}
    bootwright_ceph_osd_staleness_dated: >-
      Orchestrator cache age: cephadm last refreshed between
      {{ bootwright_ceph_osd_orch_refresh_oldest | default('unknown') }} and
      {{ bootwright_ceph_osd_orch_refresh_newest | default('unknown') }} UTC, which is
      {{ bootwright_ceph_osd_orch_refresh_age | default(-1) }}s
      ({{ ((bootwright_ceph_osd_orch_refresh_age | default(0) | int) / 60) | round(1) }} min)
      before this verdict, against a {{ bootwright_ceph_osd_orch_refresh_window }}s wait.
      `ceph orch ps`, `ceph orch ls` and `ceph orch device ls` are all served from the
      cephadm mgr module's cache, never read live, so every host, daemon and device list
      below is a snapshot of that moment.
      {{ 'THAT CACHE IS STALE: it did not advance once across the entire wait, so the cephadm mgr module is not refreshing — it restarts on its own during bootstrap, and while it is down it keeps serving the seed-only view it held before the restart, which reads exactly like a dead cluster with one host and no devices. Force a refresh with `ceph mgr fail` and re-read before concluding anything about the hosts, the daemons or the disks.'
         if (bootwright_ceph_osd_orch_refresh_age | default(0) | int)
            > (bootwright_ceph_osd_orch_refresh_window | int)
         else 'The cache did advance during the wait, so the orchestrator was refreshing and the lists below can be read as the recent cluster state.' }}
    bootwright_ceph_osd_availability_unknown: >-
      Declared OSD device availability could not be summarised: this cluster declares
      no statically named OSD device on any host, so there is no declared denominator
      to count against; read the inventory table below directly.
    bootwright_ceph_osd_availability_fleetwide: >-
      Every declared device cephadm did inventory was refused, so this is not one
      stray disk. Treat it as a fleet-wide condition — the disks carry a previous
      installation signature, or the OS install consumed them — and read one host
      directly (lsblk, pvs, vgs, findmnt /) before wiping anything.
    bootwright_ceph_osd_availability_counted: >-
      Declared OSD device availability:
      {{ ('cephadm returned no device inventory for '
          ~ (bootwright_ceph_osd_missing_inventory_hosts | length) ~ ' of '
          ~ (bootwright_ceph_osd_declared_host_names | length) ~ ' declared OSD hosts ('
          ~ (bootwright_ceph_osd_missing_inventory_hosts | join(', ')) ~ ')')
         if (bootwright_ceph_osd_missing_inventory_hosts | length) > 0
         else ('cephadm inventoried all '
               ~ (bootwright_ceph_osd_declared_host_names | length)
               ~ ' declared OSD host(s)') }};
      of the {{ bootwright_ceph_osd_declared_devices | length }} declared device(s) it
      did inventory, {{ bootwright_ceph_osd_unavailable_devices | length }} are
      unavailable to ceph-volume and
      {{ (bootwright_ceph_osd_declared_devices | length)
         - (bootwright_ceph_osd_unavailable_devices | length) }} are available.
      The declaration names {{ bootwright_ceph_osd_declared_paths | length }} device(s)
      in total, so
      {{ (bootwright_ceph_osd_declared_paths | length)
         - (bootwright_ceph_osd_declared_devices | length) }} declared device(s) were
      never inventoried at all — an uninventoried device is NOT a rejected device, and
      nothing below says anything about its contents.
      {{ bootwright_ceph_osd_availability_fleetwide
         if (bootwright_ceph_osd_declared_devices | length) > 0
            and (bootwright_ceph_osd_unavailable_devices | length)
                == (bootwright_ceph_osd_declared_devices | length)
         else '' }}
  when:
    - bootwright_ceph_osd_readiness_mode != 'skip'
    - >-
      not (bootwright_ceph_osd_ready | default(false) | bool)
      or (
        bootwright_ceph_osd_dynamic_hosts | length > 0
        and not (bootwright_ceph_osd_dynamic_ready | default(true) | bool)
      )

- name: Compose the OSD readiness remedy for the declared device selection
  ansible.builtin.set_fact:
    bootwright_ceph_osd_readiness_remedy: >-
      {{ bootwright_ceph_osd_remedy_orchestrator
         if (bootwright_ceph_osd_device_evidence | default(false) | bool
             and (bootwright_ceph_osd_declared_unavailable_total | default(0) | int) == 0
             and (bootwright_ceph_osd_reclaim_all_unavailable_total | default(0) | int) == 0)
         else (bootwright_ceph_osd_remedy_reclaim_all
               if bootwright_ceph_osd_reclaim_all_hosts | length > 0
               else bootwright_ceph_osd_remedy_manual) }}
  vars:
    bootwright_ceph_osd_remedy_orchestrator: >-
      Remedy: NOT a device remedy — cephadm refused none of the declared devices it
      inventoried, so no disk is known to be dirty and no reclaim can help. The
      automatic all-devices reclaim and `--reclaim-devices` both select only devices
      cephadm reports as available=false, so on this cluster their candidate set is
      empty and running either one would wipe nothing and change nothing. Treat this as
      an orchestrator condition: on the seed run `ceph health detail`,
      `ceph log last 200 cephadm`, and `ceph orch host ls --detail` to see which hosts
      cephadm has reached; if the hosts are online and the inventory or daemon lists are
      simply not advancing, restart the orchestrator with `ceph mgr fail` (the cephadm
      mgr module restarting mid-bootstrap is enough to freeze both), wait for
      `ceph orch device ls` to list every declared OSD host, and re-apply. Do NOT wipe
      disks on this evidence.
    bootwright_ceph_osd_remedy_reclaim_all: >-
      Remedy: {{ bootwright_ceph_osd_reclaim_all_hosts | length }} host(s) declare
      their OSD devices with data_devices.all=true, so Bootwright can reclaim those
      disks for you — re-run `bootwright apply --clusters
      {{ bootwright_selected_storage_cluster.name }} --mode rebuild --authorize
      data-loss`. That zaps every disk on those hosts which is unavailable to
      ceph-volume, carries no mounted filesystem, and does not already back an OSD of
      this cluster, BEFORE the OSD apply; it never touches a mounted or system disk or
      a live OSD, and it skips any device it cannot probe. It is IRREVERSIBLE and is
      not limited to disks that once held Ceph, so do not use it on a host that also
      carries data to keep or runs a second Ceph cluster. Two caveats: --mode rebuild
      also re-bootstraps this cluster if its identity (seedHost/monIP/network)
      drifted, and it fails closed on a protected context — either
      safety.destroyProtection=protected, which guards every kind, or
      safety.protectedKinds listing StorageCluster — but only when the rebuild is
      actually destructive, that is when a selected object carries structural drift.
      A freshly bootstrapped cluster whose identity still matches its declaration
      carries none, so the reclaim normally proceeds even under destroy protection;
      if it does refuse, it names the protected resource, and the way through is to
      tear the cluster down deliberately with destroy first.
    bootwright_ceph_osd_remedy_manual: >-
      Remedy: this cluster declares no data_devices.all=true host, so the automatic
      all-devices reclaim does not apply to it. For a statically named selection
      (paths/pathSpecs) re-run `bootwright apply --reclaim-devices <paths>`, or
      `bootwright apply --reclaim-devices all` to name every declared path; for a
      narrowing filter (model/size/rotational/vendor/limit) there is no automatic
      reclaim — confirm each disk is disposable, clean it on its host (`wipefs --all`
      / `sgdisk --zap-all`) or exclude it from the OSD device selection, then
      re-apply.
  when:
    - bootwright_ceph_osd_readiness_mode != 'skip'
    - >-
      not (bootwright_ceph_osd_ready | default(false) | bool)
      or (
        bootwright_ceph_osd_dynamic_hosts | length > 0
        and not (bootwright_ceph_osd_dynamic_ready | default(true) | bool)
      )

- name: Assert declared Ceph OSDs were created
  ansible.builtin.assert:
    that:
      - bootwright_ceph_osd_ready | default(false) | bool
    fail_msg: >-
      Ceph cluster {{ bootwright_selected_storage_cluster.name }} did not create the
      declared OSDs: expected
      {{ 'exactly ' ~ bootwright_ceph_osd_expected_count if bootwright_ceph_osd_readiness_mode == 'exact' else 'at least ' ~ bootwright_ceph_osd_expected_count }}
      OSD(s) 'in'{{ ' (a per-host floor — the declaration selects devices dynamically, so the exact OSD count is not knowable before the device scan)' if bootwright_ceph_osd_dynamic_hosts | length > 0 else '' }},
      observed
      {{ bootwright_ceph_osd_stat.stdout | default('', true)
         | regex_search('"num_in_osds"\s*:\s*([0-9]+)', '\1')
         | default(['unknown'], true) | first }}
      (up {{ bootwright_ceph_osd_stat.stdout | default('', true)
             | regex_search('"num_up_osds"\s*:\s*([0-9]+)', '\1')
             | default(['unknown'], true) | first }})
      after {{ bootwright_ceph_osd_stat.attempts | default('unknown') }} of
      {{ bootwright_ceph_osd_readiness_attempts | default('unknown') }} attempts.
      {{ 'The ' ~ (bootwright_ceph_osd_readiness_budget_seconds | default('unknown'))
         ~ 's wall-clock deadline is what ended this poll, not the attempt budget: every
         attempt also pays its own runtime (capped at 120s by `timeout`), so the attempt
         count is never the binding limit on a cluster answering slowly. Raise
         bootwright_ceph_osd_readiness_wall_seconds, not the retry count, to wait longer.'
         if (bootwright_ceph_osd_stat.attempts | default(0) | int)
            < (bootwright_ceph_osd_readiness_attempts | int)
         else ('The attempt budget is what ended this poll, inside its '
               ~ (bootwright_ceph_osd_readiness_budget_seconds | default('unknown'))
               ~ 's wall-clock deadline.') }}
      The verdict reads the sampled `ceph osd stat` output, not the sampler's exit status,
      so a cephadm shell that times out while tearing down its container cannot fail a
      cluster whose OSDs are all in.
      {% if ((bootwright_ceph_osd_declared_unavailable_total | default(0) | int)
             + (bootwright_ceph_osd_reclaim_all_unavailable_total | default(0) | int)) > 0
            or not (bootwright_ceph_osd_device_evidence | default(false) | bool) %}
      cephadm accepted the OSD spec but ceph-volume did not consume the declared
      devices.
      {% elif (bootwright_ceph_osd_uninventoried_hosts | default([]) | length) > 0 %}
      cephadm accepted the OSD spec, and it refused none of the declared devices it
      inventoried — so this is NOT a device condition. cephadm never scanned
      {{ bootwright_ceph_osd_uninventoried_hosts | length }} of
      {{ bootwright_ceph_osd_declared_osd_hosts | default([]) | length }} declared OSD
      host(s) ({{ bootwright_ceph_osd_uninventoried_hosts | join(', ') }}), so
      ceph-volume was never invoked on their disks at all; those disks are unexamined,
      not rejected. Read this as an orchestrator condition — cephadm has not reached or
      has not finished scanning those hosts — rather than a disk condition.
      {% else %}
      cephadm accepted the OSD spec, inventoried every declared OSD host, and refused
      none of their declared devices — so this is NOT a device condition either.
      ceph-volume either never ran or ran and failed for a reason the device inventory
      does not carry; read the OSD service events and `ceph log last cephadm` on the
      seed rather than the device table.
      {% endif %}
      Declared OSD services (running counts):
      {{ bootwright_ceph_osd_service_breakdown | default('(unavailable)') }} — a service
      sitting at running=0 was accepted but never deployed, which is the same
      orchestrator symptom seen from the service side.
      {{ bootwright_ceph_osd_availability_summary | default('') }}
      {{ bootwright_ceph_osd_orch_staleness | default('') }}
      The device inventory below reports, per device, whether it is AVAILABLE and, if not,
      the REJECT REASONS (for example: locked, already carries a filesystem/LVM/bluestore
      signature, or is too small); the OSD service status shows the RUNNING count and any
      placement events. Devices declared only through an OSD filter (all/model/size/rotational)
      are not covered by the install-time emptiness guard, so a dirty or previously-used
      disk reaches ceph-volume unchecked.
      {{ bootwright_ceph_osd_readiness_remedy | default('') }}
      {% if (bootwright_ceph_osd_uninventoried_hosts | default([]) | length) > 0 %}
      cephadm holds NO device inventory for
      {{ bootwright_ceph_osd_uninventoried_hosts | join(', ') }}, so the orchestrator has
      not scanned those hosts. Cross-check the host and daemon lists below: if they are
      online but carry few or no daemons, cephadm cannot run on them — commonly a
      container-image pull or registry/mirror/proxy failure; inspect
      `ceph log last cephadm` for `cephadm pull`/deploy errors. If they are fully online
      with clean disks and only the inventory is stalled, force a re-scan with
      `ceph mgr fail`, then re-apply.
      {% endif %}
      This apply is failing closed rather than reporting
      success against a short or zero-OSD cluster.
      Ceph orchestrator hosts (ceph orch host ls):
      {{ (bootwright_ceph_osd_host_ls.stdout | default('') | trim)
      or ('(ceph orch host ls failed, rc=' ~ (bootwright_ceph_osd_host_ls.rc | default('unknown')) ~ ' — the cluster/mgr was unreachable)'
      if (bootwright_ceph_osd_host_ls.rc | default(1) | int) != 0
      else '(no hosts are managed by the orchestrator)') }}
      Ceph daemon placement (ceph orch ps):
      {{ (bootwright_ceph_osd_daemon_ps.stdout | default('') | trim)
      or ('(ceph orch ps failed, rc=' ~ (bootwright_ceph_osd_daemon_ps.rc | default('unknown')) ~ ')'
      if (bootwright_ceph_osd_daemon_ps.rc | default(1) | int) != 0
      else '(no daemons are deployed)') }}
      Ceph device inventory (ceph orch device ls --wide):
      {{ (bootwright_ceph_osd_device_ls.stdout | default('') | trim)
      or ('(ceph orch device ls failed, rc=' ~ (bootwright_ceph_osd_device_ls.rc | default('unknown')) ~ ' — the cluster/mgr was unreachable or the command errored)'
      if (bootwright_ceph_osd_device_ls.rc | default(1) | int) != 0
      else '(the query succeeded but cephadm reported ZERO devices — the orchestrator has not scanned the hosts. Cross-check the host and daemon lists above: if declared hosts are online but carry few or no daemons, cephadm cannot run on them — commonly a container-image pull or registry/mirror/proxy failure; inspect `ceph log last cephadm` for `cephadm pull`/deploy errors. If the hosts are fully online with clean disks and only the inventory is stalled, force a re-scan with `ceph mgr fail`, then re-apply)') }}
      Declared OSD services (ceph orch ls --service_type osd):
      {{ (bootwright_ceph_osd_service_ls.stdout | default('') | trim) or '(OSD service status unavailable — the cluster was unreachable)' }}
  when: bootwright_ceph_osd_readiness_mode != 'skip'

- name: Assert an in OSD exists on every dynamic-selection host
  vars:
    bootwright_ceph_osd_tree_doc: >-
      {{ (bootwright_ceph_osd_host_tree.stdout | default('', true) | from_json)
         if ((bootwright_ceph_osd_host_tree.stdout | default('', true)
              | regex_search('\}\s*$')) is not none)
         else {} }}
    bootwright_ceph_osd_all_osds: >-
      {{ (bootwright_ceph_osd_tree_doc.nodes | default([])) + (bootwright_ceph_osd_tree_doc.stray | default([])) }}
    bootwright_ceph_osd_total_count: >-
      {{ bootwright_ceph_osd_all_osds | selectattr('type', 'equalto', 'osd') | list | length }}
    bootwright_ceph_osd_stray_count: >-
      {{ bootwright_ceph_osd_tree_doc.stray | default([]) | selectattr('type', 'equalto', 'osd') | list | length }}
    bootwright_ceph_osd_down_count: >-
      {{ bootwright_ceph_osd_all_osds | selectattr('type', 'equalto', 'osd') | selectattr('status', 'equalto', 'down') | list | length }}
  ansible.builtin.assert:
    that:
      - >-
        ((bootwright_ceph_osd_host_tree.rc | default(1) | int) == 0
         or ((bootwright_ceph_osd_host_tree.stdout | default('', true) | regex_search('\}\s*$')) is not none))
        and (
          (
            ((bootwright_ceph_osd_host_tree.stdout | default('{}', true) | from_json).nodes
             | default([])
             | selectattr('type', 'equalto', 'osd')
             | selectattr('reweight', 'gt', 0)
             | map(attribute='id')
             | list)
            | intersect(
                ((bootwright_ceph_osd_host_tree.stdout | default('{}', true) | from_json).nodes
                 | default([])
                 | selectattr('type', 'equalto', 'host')
                 | selectattr('name', 'in', bootwright_ceph_osd_dynamic_host.crushNames)
                 | map(attribute='children')
                 | list
                 | flatten)
              )
            | length
          ) >= 1
        )
    fail_msg: >-
      Ceph cluster {{ bootwright_selected_storage_cluster.name }} did not create an
      in OSD placed under dynamic-selection host
      {{ bootwright_ceph_osd_dynamic_host.name }} (CRUSH bucket
      {{ bootwright_ceph_osd_dynamic_host.crushNames | join(' or ') }}) in the CRUSH map after
      {{ bootwright_ceph_osd_host_tree.attempts | default('unknown') }} of
      {{ bootwright_ceph_osd_readiness_attempts | default('unknown') }} attempts, or its
      {{ bootwright_ceph_osd_readiness_budget_seconds | default('unknown') }}s wall-clock
      deadline, whichever came first.
      Cluster-wide, {{ bootwright_ceph_osd_total_count }} OSD daemon(s) exist
      ({{ bootwright_ceph_osd_stray_count }} stray / not yet in the CRUSH map,
      {{ bootwright_ceph_osd_down_count }} down). When OSDs exist but are stray or
      down, cephadm created them through ceph-volume but the OSD daemons did not
      boot and join the CRUSH map — this is NOT a rejected-device problem:
      investigate the OSD daemons with `ceph orch ps`, `ceph log last cephadm`, and
      the OSD systemd units / `journalctl -u ceph-*@osd.*` on the host (a stalled
      OSD is most often an OSD container-image pull failure or a public/cluster
      network mon-connectivity problem). When instead no OSD exists for this host,
      ceph-volume rejected or never consumed its devices — inspect the device
      inventory below and clean (confirm disposable, then `wipefs --all` /
      `sgdisk --zap-all`) or exclude the offending device, then re-apply. This
      apply is failing closed rather than recording success against a partial- or
      zero-OSD cluster.
      Ceph device inventory (ceph orch device ls --wide):
      {{ (bootwright_ceph_osd_device_ls.stdout | default('') | trim)
      or ('(ceph orch device ls failed, rc=' ~ (bootwright_ceph_osd_device_ls.rc | default('unknown')) ~ ' — the cluster/mgr was unreachable or the command errored)'
      if (bootwright_ceph_osd_device_ls.rc | default(1) | int) != 0
      else '(the query succeeded but cephadm reported ZERO devices — the orchestrator has not scanned the hosts; if the declared hosts are online but carry few or no daemons, cephadm cannot run on them — commonly a container-image pull or registry/mirror/proxy failure; inspect `ceph log last cephadm`)') }}
      Ceph daemon placement (ceph orch ps):
      {{ (bootwright_ceph_osd_daemon_ps.stdout | default('') | trim)
      or ('(ceph orch ps failed, rc=' ~ (bootwright_ceph_osd_daemon_ps.rc | default('unknown')) ~ ')'
      if (bootwright_ceph_osd_daemon_ps.rc | default(1) | int) != 0
      else '(no daemons are deployed)') }}
      CRUSH tree (ceph osd tree):
      {{ bootwright_ceph_osd_host_tree.stdout | default('(CRUSH tree unavailable)') }}
    quiet: true
  loop: "{{ bootwright_ceph_osd_dynamic_hosts }}"
  loop_control:
    loop_var: bootwright_ceph_osd_dynamic_host
    label: "{{ bootwright_ceph_osd_dynamic_host.name }}"
  when:
    - bootwright_ceph_osd_dynamic_hosts | length > 0
    - bootwright_ceph_osd_ready | default(false) | bool

- name: Capture observed Ceph health for the storage result
  ansible.builtin.command:
    argv:
      - timeout
      - --kill-after=10
      - "300"
      - cephadm
      - shell
      - --
      - ceph
      - health
      - --format
      - json
  register: bootwright_ceph_health_probe
  changed_when: false
  failed_when: false
  when: bootwright_ceph_osd_readiness_mode != 'skip'

- name: Record observed OSD readiness for the storage result
  ansible.builtin.set_fact:
    bootwright_ceph_osd_observed:
      mode: "{{ bootwright_ceph_osd_readiness_mode }}"
      expected: "{{ bootwright_ceph_osd_expected_count | int }}"
      inOSDs: >-
        {{ bootwright_ceph_osd_stat.stdout | default('', true)
           | regex_search('"num_in_osds"\s*:\s*([0-9]+)', '\1')
           | default(['0'], true) | first | int }}
      upOSDs: >-
        {{ bootwright_ceph_osd_stat.stdout | default('', true)
           | regex_search('"num_up_osds"\s*:\s*([0-9]+)', '\1')
           | default(['0'], true) | first | int }}
      health: >-
        {{ bootwright_ceph_health_probe.stdout | default('', true)
           | regex_search('"status"\s*:\s*"([A-Z_]+)"', '\1')
           | default(['UNKNOWN'], true) | first }}
  when: bootwright_ceph_osd_readiness_mode != 'skip'
