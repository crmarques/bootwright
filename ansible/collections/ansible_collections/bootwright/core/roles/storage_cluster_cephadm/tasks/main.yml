---
- name: Load rendered Ceph operations
  ansible.builtin.set_fact:
    bootwright_ceph_operations: >-
      {{
        (lookup('ansible.builtin.file', bootwright_selected_storage_cluster.ceph.operationsPath)
        | from_yaml).operations | default([])
      }}
  delegate_to: localhost
  become: false

- name: Resolve managed Ceph work paths
  ansible.builtin.set_fact:
    bootwright_ceph_remote_work_dir: "{{ bootwright_selected_storage_cluster.remoteWorkDir }}"
    bootwright_ceph_remote_bootstrap_spec: "{{ bootwright_selected_storage_cluster.remoteWorkDir }}/bootstrap-spec.yaml"
    bootwright_ceph_remote_core_services_spec: "{{ bootwright_selected_storage_cluster.remoteWorkDir }}/core-services.yaml"
    bootwright_ceph_remote_late_services_spec: "{{ bootwright_selected_storage_cluster.remoteWorkDir }}/late-services.yaml"
    bootwright_ceph_remote_operations: "{{ bootwright_selected_storage_cluster.remoteWorkDir }}/operations.yaml"
    bootwright_ceph_remote_private_key: "{{ bootwright_selected_storage_cluster.remoteWorkDir }}/cluster-ssh-key"
    bootwright_ceph_remote_public_key: "{{ bootwright_selected_storage_cluster.remoteWorkDir }}/cluster-ssh-key.pub"
    bootwright_ceph_remote_known_hosts: "{{ bootwright_selected_storage_cluster.remoteWorkDir }}/known_hosts"
    bootwright_ceph_remote_ssh_config: "{{ bootwright_selected_storage_cluster.remoteWorkDir }}/ssh_config"
    bootwright_ceph_registry_url: "{{ bootwright_selected_storage_cluster.registry.url | default('') }}"
    bootwright_ceph_registry_credentials_path: "{{ bootwright_selected_storage_cluster.registry.credentialsPath | default('') }}"
    bootwright_ceph_registry_trust_path: "{{ bootwright_selected_storage_cluster.registry.trustBundlePath | default('') }}"

- name: Load cephadm registry credentials
  ansible.builtin.include_role:
    name: bootwright.core.helper_credentials
    tasks_from: load
  vars:
    bootwright_creds_path: "{{ bootwright_ceph_registry_credentials_path }}"
    bootwright_creds_var: bootwright_ceph_registry_credentials
    bootwright_creds_label: "cephadm registry credentialsRef {{ bootwright_ceph_registry_credentials_path }}"
  when: bootwright_ceph_registry_credentials_path | length > 0

- name: Resolve current storage node
  ansible.builtin.set_fact:
    bootwright_current_storage_node_matches: >-
      {{
        bootwright_selected_storage_cluster.nodes
        | default([])
        | selectattr('inventoryHost', 'equalto', inventory_hostname)
        | list
      }}
  changed_when: false
  when: not bootwright_task_storage_skip_prereqs | default(false) | bool

- name: Validate current storage node context
  ansible.builtin.assert:
    that:
      - bootwright_current_storage_node_matches | length == 1
    fail_msg: >-
      Storage node {{ inventory_hostname }} is not declared exactly once in
      {{ bootwright_selected_storage_cluster.name | default('<storage-cluster>') }}.
  when: not bootwright_task_storage_skip_prereqs | default(false) | bool

- name: Set current storage node
  ansible.builtin.set_fact:
    bootwright_current_storage_node: "{{ bootwright_current_storage_node_matches | first }}"
  changed_when: false
  when: not bootwright_task_storage_skip_prereqs | default(false) | bool

- name: Install Ceph prerequisites on storage node
  ansible.builtin.include_role:
    name: bootwright.core.helper_ownership
    tasks_from: package_apply.yml
  vars:
    bootwright_ownership_packages:
      - firewalld
      - lvm2
      - podman
      - chrony
    bootwright_ownership_required_by: "storage-cluster:{{ bootwright_selected_storage_cluster.name }}"
  when: not bootwright_task_storage_skip_prereqs | default(false) | bool

- name: Probe cephadm CLI before package fallback
  ansible.builtin.command:
    argv:
      - cephadm
      - version
  register: bootwright_cephadm_initial_probe
  changed_when: false
  failed_when: false
  when: not bootwright_task_storage_skip_prereqs | default(false) | bool

- name: Install cephadm package on storage node when available
  ansible.builtin.package:
    name: cephadm
    state: present
  register: bootwright_cephadm_package_install
  failed_when: false
  when:
    - not bootwright_task_storage_skip_prereqs | default(false) | bool
    - bootwright_cephadm_initial_probe.rc | default(1) != 0

- name: Create cephadm package ownership directory
  ansible.builtin.file:
    path: "{{ bootwright_ownership_dir }}/packages/{{ inventory_hostname }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  when:
    - not bootwright_task_storage_skip_prereqs | default(false) | bool
    - bootwright_cephadm_package_install.changed | default(false)

- name: Write cephadm package ownership record
  ansible.builtin.include_role:
    name: bootwright.core.helper_ownership
    tasks_from: package_apply_one.yml
  vars:
    bootwright_ownership_package_name: cephadm
    bootwright_ownership_required_by: "storage-cluster:{{ bootwright_selected_storage_cluster.name }}"
  when:
    - not bootwright_task_storage_skip_prereqs | default(false) | bool
    - bootwright_cephadm_package_install.changed | default(false)

- name: Start storage node services
  ansible.builtin.service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - chronyd
    - firewalld
  loop_control:
    label: "{{ bootwright_current_storage_node.name }} {{ item }}"
  when: not bootwright_task_storage_skip_prereqs | default(false) | bool

- name: Verify cephadm CLI on storage node
  ansible.builtin.command:
    argv:
      - cephadm
      - version
  register: bootwright_cephadm_version
  changed_when: false
  failed_when: false
  when: not bootwright_task_storage_skip_prereqs | default(false) | bool

- name: Fail when cephadm CLI is unavailable
  ansible.builtin.assert:
    that:
      - bootwright_cephadm_version.rc == 0
    fail_msg: >-
      cephadm CLI is required on storage node {{ bootwright_current_storage_node.name }}.
      Install cephadm through the managed OS MachineInstallProfile repositories and
      customizations.packages, preinstall it on provided OS nodes, or enable a package
      repository that provides cephadm before applying managed storage.
      Package fallback result: {{ (bootwright_cephadm_package_install | default({})).msg | default('not attempted') }}
  when: not bootwright_task_storage_skip_prereqs | default(false) | bool

- name: Install cephadm registry trust on storage node
  ansible.builtin.copy:
    src: "{{ bootwright_ceph_registry_trust_path }}"
    dest: /etc/pki/ca-trust/source/anchors/bootwright-cephadm-registry.pem
    owner: root
    group: root
    mode: "0644"
  register: bootwright_ceph_registry_trust
  when:
    - bootwright_ceph_registry_trust_path | length > 0
    - not bootwright_task_storage_skip_prereqs | default(false) | bool

- name: Update storage node trust store
  ansible.builtin.command:
    argv:
      - update-ca-trust
  changed_when: bootwright_ceph_registry_trust.changed | default(false)
  when:
    - bootwright_ceph_registry_trust.changed | default(false)
    - not bootwright_task_storage_skip_prereqs | default(false) | bool

- name: Log storage node into cephadm registry
  containers.podman.podman_login:
    registry: "{{ bootwright_ceph_registry_url }}"
    username: "{{ bootwright_ceph_registry_credentials.username }}"
    password: "{{ bootwright_ceph_registry_credentials.password }}"
  no_log: true
  when:
    - bootwright_ceph_registry_url | length > 0
    - bootwright_ceph_registry_credentials is defined
    - not bootwright_task_storage_skip_prereqs | default(false) | bool

- name: Authorize cephadm cluster SSH key on storage node
  ansible.posix.authorized_key:
    user: "{{ bootwright_selected_storage_cluster.clusterSSH.user | default('root') }}"
    key: "{{ lookup('ansible.builtin.file', bootwright_selected_storage_cluster.clusterSSH.publicKeyPath) }}"
    state: present
    manage_dir: true
  no_log: true
  when:
    - bootwright_selected_storage_cluster.clusterSSH.publicKeyPath | default('') | length > 0
    - not bootwright_task_storage_skip_prereqs | default(false) | bool

- name: Check declared OSD devices are empty
  ansible.builtin.command:
    argv:
      - wipefs
      - --no-act
      - --noheadings
      - "{{ item }}"
  register: bootwright_ceph_device_check
  changed_when: false
  failed_when: bootwright_ceph_device_check.rc != 0 or (bootwright_ceph_device_check.stdout | regex_search('\\S'))
  loop: "{{ bootwright_current_storage_node.devices | default([]) }}"
  loop_control:
    label: "{{ bootwright_current_storage_node.name }} {{ item }}"
  when: not bootwright_task_storage_skip_prereqs | default(false) | bool

- name: Apply managed Ceph cluster through cephadm
  block:
    - name: Create managed Ceph work directory
      ansible.builtin.file:
        path: "{{ bootwright_ceph_remote_work_dir }}"
        state: directory
        mode: "0700"

    - name: Copy cephadm bootstrap spec
      ansible.builtin.copy:
        src: "{{ bootwright_selected_storage_cluster.ceph.bootstrapSpecPath }}"
        dest: "{{ bootwright_ceph_remote_bootstrap_spec }}"
        mode: "0600"

    - name: Copy cephadm core service spec
      ansible.builtin.copy:
        src: "{{ bootwright_selected_storage_cluster.ceph.coreServicesSpecPath }}"
        dest: "{{ bootwright_ceph_remote_core_services_spec }}"
        mode: "0600"

    - name: Copy cephadm late service spec
      ansible.builtin.copy:
        src: "{{ bootwright_selected_storage_cluster.ceph.lateServicesSpecPath }}"
        dest: "{{ bootwright_ceph_remote_late_services_spec }}"
        mode: "0600"

    - name: Copy rendered Ceph operation manifest
      ansible.builtin.copy:
        src: "{{ bootwright_selected_storage_cluster.ceph.operationsPath }}"
        dest: "{{ bootwright_ceph_remote_operations }}"
        mode: "0600"

    - name: Copy cephadm cluster private SSH key
      ansible.builtin.copy:
        src: "{{ bootwright_selected_storage_cluster.clusterSSH.privateKeyPath }}"
        dest: "{{ bootwright_ceph_remote_private_key }}"
        mode: "0600"
      no_log: true
      when: bootwright_selected_storage_cluster.clusterSSH.privateKeyPath | default('') | length > 0

    - name: Copy cephadm cluster public SSH key
      ansible.builtin.copy:
        src: "{{ bootwright_selected_storage_cluster.clusterSSH.publicKeyPath }}"
        dest: "{{ bootwright_ceph_remote_public_key }}"
        mode: "0644"
      no_log: true
      when: bootwright_selected_storage_cluster.clusterSSH.publicKeyPath | default('') | length > 0

    - name: Copy cephadm cluster known hosts
      ansible.builtin.copy:
        src: "{{ bootwright_selected_storage_cluster.clusterSSH.knownHostsPath }}"
        dest: "{{ bootwright_ceph_remote_known_hosts }}"
        mode: "0600"
      when: bootwright_selected_storage_cluster.clusterSSH.knownHostsPath | default('') | length > 0

    - name: Render cephadm SSH config
      ansible.builtin.copy:
        content: |
          Host *
            User {{ bootwright_selected_storage_cluster.clusterSSH.user | default('root') }}
            IdentityFile {{ bootwright_ceph_remote_private_key }}
            UserKnownHostsFile {{ bootwright_ceph_remote_known_hosts }}
            StrictHostKeyChecking yes
            BatchMode yes
        dest: "{{ bootwright_ceph_remote_ssh_config }}"
        mode: "0600"
      when:
        - bootwright_selected_storage_cluster.clusterSSH.privateKeyPath | default('') | length > 0
        - bootwright_selected_storage_cluster.clusterSSH.knownHostsPath | default('') | length > 0

    - name: Verify cephadm seed SSH access to storage nodes
      ansible.builtin.command:
        argv:
          - ssh
          - -F
          - "{{ bootwright_ceph_remote_ssh_config }}"
          - "{{ item.address }}"
          - "true"
      register: bootwright_ceph_seed_ssh_check
      changed_when: false
      no_log: true
      loop: "{{ bootwright_selected_storage_cluster.nodes | default([]) }}"
      loop_control:
        label: "{{ item.name }}"
      when:
        - bootwright_selected_storage_cluster.clusterSSH.privateKeyPath | default('') | length > 0
        - bootwright_selected_storage_cluster.clusterSSH.knownHostsPath | default('') | length > 0
        - item.address | default('') | length > 0

    - name: Check existing Ceph configuration
      ansible.builtin.command:
        argv:
          - test
          - -f
          - /etc/ceph/ceph.conf
      register: bootwright_ceph_conf_check
      changed_when: false
      failed_when: false

    - name: Check existing Ceph status
      ansible.builtin.command:
        argv:
          - ceph
          - status
      register: bootwright_ceph_status_check
      changed_when: false
      failed_when: false

    - name: Resolve cephadm bootstrap command
      ansible.builtin.set_fact:
        bootwright_ceph_bootstrap_argv: >-
          {{
            [
              'cephadm',
              'bootstrap',
              '--mon-ip',
              bootwright_selected_storage_cluster.bootstrap.monIP
            ]
            + (
              ['--cluster-network', (bootwright_selected_storage_cluster.clusterNetworkCIDRs | join(','))]
              if (bootwright_selected_storage_cluster.clusterNetworkCIDRs | default([]) | length) > 0
              else []
            )
            + (
              ['--ssh-private-key', bootwright_ceph_remote_private_key]
              if bootwright_selected_storage_cluster.clusterSSH.privateKeyPath | default('') | length > 0
              else []
            )
            + (
              ['--ssh-public-key', bootwright_ceph_remote_public_key]
              if bootwright_selected_storage_cluster.clusterSSH.publicKeyPath | default('') | length > 0
              else []
            )
            + (
              ['--ssh-user', bootwright_selected_storage_cluster.clusterSSH.user]
              if bootwright_selected_storage_cluster.clusterSSH.user | default('') | length > 0
              else []
            )
            + (
              ['--registry-url', bootwright_ceph_registry_url]
              if bootwright_ceph_registry_url | length > 0
              else []
            )
            + (
              ['--registry-username', bootwright_ceph_registry_credentials.username, '--registry-password', bootwright_ceph_registry_credentials.password]
              if bootwright_ceph_registry_credentials is defined
              else []
            )
          }}
      no_log: "{{ bootwright_ceph_registry_credentials is defined }}"

    - name: Bootstrap Ceph cluster when absent
      ansible.builtin.command:
        argv: "{{ bootwright_ceph_bootstrap_argv }}"
      register: bootwright_ceph_bootstrap
      changed_when: true
      no_log: "{{ bootwright_ceph_registry_credentials is defined }}"
      when: bootwright_ceph_conf_check.rc != 0 or bootwright_ceph_status_check.rc != 0

    - name: Configure cephadm SSH trust
      ansible.builtin.command:
        argv:
          - ceph
          - cephadm
          - set-ssh-config
          - -i
          - "{{ bootwright_ceph_remote_ssh_config }}"
      register: bootwright_ceph_ssh_config
      changed_when: true
      when:
        - bootwright_selected_storage_cluster.clusterSSH.privateKeyPath | default('') | length > 0
        - bootwright_selected_storage_cluster.clusterSSH.knownHostsPath | default('') | length > 0

    - name: Apply Ceph host spec
      ansible.builtin.command:
        argv:
          - ceph
          - orch
          - apply
          - -i
          - "{{ bootwright_ceph_remote_bootstrap_spec }}"
      register: bootwright_ceph_host_spec_apply
      changed_when: true

    - name: Apply Ceph core service spec
      ansible.builtin.command:
        argv:
          - ceph
          - orch
          - apply
          - -i
          - "{{ bootwright_ceph_remote_core_services_spec }}"
      register: bootwright_ceph_core_services_apply
      changed_when: true

    - name: Capture base Data Foundation external-cluster secrets
      ansible.builtin.command:
        argv: "{{ item.argv }}"
      loop:
        - name: fsid
          argv: [ceph, fsid]
        - name: adminSecret
          argv: [ceph, auth, get-key, client.admin]
        - name: monSecret
          argv: [ceph, auth, get-key, mon.]
      loop_control:
        label: "{{ item.name }}"
      register: bootwright_ceph_base_secret_commands
      changed_when: false
      no_log: true
      when: bootwright_selected_storage_cluster.dataFoundationBindings | default([]) | length > 0

    - name: Initialize Data Foundation result
      ansible.builtin.set_fact:
        bootwright_ceph_base_secrets: "{{ dict(bootwright_ceph_base_secret_commands.results | map(attribute='item.name') | zip(bootwright_ceph_base_secret_commands.results | map(attribute='stdout'))) }}"
        bootwright_data_foundation_result: {}
      no_log: true
      when: bootwright_selected_storage_cluster.dataFoundationBindings | default([]) | length > 0

    - name: Add base Data Foundation credentials for each binding
      ansible.builtin.set_fact:
        bootwright_data_foundation_result: >-
          {{
            bootwright_data_foundation_result
            | combine(
                dict([(item.cluster, {
                  'fsid': bootwright_ceph_base_secrets.fsid | default(''),
                  'adminSecret': bootwright_ceph_base_secrets.adminSecret | default(''),
                  'monSecret': bootwright_ceph_base_secrets.monSecret | default('')
                })]),
                recursive=True
              )
          }}
      loop: "{{ bootwright_selected_storage_cluster.dataFoundationBindings | default([]) }}"
      loop_control:
        label: "{{ item.cluster }}"
      no_log: true

    - name: Run rendered Ceph topology and storage operations
      ansible.builtin.include_tasks: operations/run.yml
      loop: "{{ bootwright_ceph_operations }}"
      loop_control:
        loop_var: bootwright_ceph_op
        label: "{{ bootwright_ceph_op.name | default('<unnamed>') }}"
      when:
        - bootwright_ceph_op.command | default([]) | length > 0
        - bootwright_ceph_op.phase | default('storage') in ['topology', 'storage']

    - name: Apply Ceph late service spec
      ansible.builtin.command:
        argv:
          - ceph
          - orch
          - apply
          - -i
          - "{{ bootwright_ceph_remote_late_services_spec }}"
      register: bootwright_ceph_late_services_apply
      changed_when: true

    - name: Run rendered Ceph late operations
      ansible.builtin.include_tasks: operations/run.yml
      loop: "{{ bootwright_ceph_operations }}"
      loop_control:
        loop_var: bootwright_ceph_op
        label: "{{ bootwright_ceph_op.name | default('<unnamed>') }}"
      when:
        - bootwright_ceph_op.command | default([]) | length > 0
        - bootwright_ceph_op.phase | default('storage') in ['object-gateway', 'data-foundation']

    - name: Create storage task artifact directory
      ansible.builtin.file:
        path: "{{ bootwright_ansible_artifacts_dir }}"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false
      when: bootwright_selected_storage_cluster.dataFoundationBindings | default([]) | length > 0

    - name: Write captured storage result
      ansible.builtin.copy:
        dest: "{{ bootwright_selected_storage_cluster.resultPath }}"
        content: "{{ {'dataFoundation': bootwright_data_foundation_result | default({})} | to_nice_json }}\n"
        mode: "0600"
      delegate_to: localhost
      become: false
      no_log: true
      when: bootwright_selected_storage_cluster.dataFoundationBindings | default([]) | length > 0

    - name: Record storage cluster ownership
      ansible.builtin.include_role:
        name: bootwright.core.helper_ownership
        tasks_from: resource.yml
      vars:
        bootwright_ownership_kind: storage-cluster
        bootwright_ownership_name: "{{ bootwright_selected_storage_cluster.name }}"
        bootwright_ownership_fields:
          cluster: "{{ bootwright_selected_storage_cluster.name }}"
          paths:
            - /etc/ceph
            - /var/lib/ceph
            - /var/log/ceph
          labels:
            bootwright.kind: storage-cluster
          attributes:
            seedHost: "{{ bootwright_selected_storage_cluster.seedHost | default('') }}"
            remoteWorkDir: "{{ bootwright_ceph_remote_work_dir }}"
  always:
    - name: Remove managed Ceph work directory
      ansible.builtin.file:
        path: "{{ bootwright_ceph_remote_work_dir }}"
        state: absent
      when: bootwright_ceph_remote_work_dir | default('') | length > 0
  when: not bootwright_task_storage_prereqs_only | default(false) | bool
