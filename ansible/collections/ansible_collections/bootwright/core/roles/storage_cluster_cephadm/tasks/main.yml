---
- name: Load rendered Ceph operations
  ansible.builtin.set_fact:
    bootwright_ceph_operations: >-
      {{
        (lookup('ansible.builtin.file', bootwright_selected_storage_cluster.ceph.operationsPath)
        | from_yaml).operations | default([])
      }}
  delegate_to: localhost
  become: false

- name: Resolve managed Ceph work paths
  ansible.builtin.set_fact:
    bootwright_ceph_remote_work_dir: "{{ bootwright_selected_storage_cluster.remoteWorkDir }}"
    bootwright_ceph_remote_bootstrap_spec: "{{ bootwright_selected_storage_cluster.remoteWorkDir }}/bootstrap-spec.yaml"
    bootwright_ceph_remote_services_spec: "{{ bootwright_selected_storage_cluster.remoteWorkDir }}/services.yaml"
    bootwright_ceph_remote_operations: "{{ bootwright_selected_storage_cluster.remoteWorkDir }}/operations.yaml"
    bootwright_ceph_remote_private_key: "{{ bootwright_selected_storage_cluster.remoteWorkDir }}/cluster-ssh-key"
    bootwright_ceph_remote_public_key: "{{ bootwright_selected_storage_cluster.remoteWorkDir }}/cluster-ssh-key.pub"

- name: Apply managed Ceph cluster through cephadm
  block:
    - name: Create managed Ceph work directory
      ansible.builtin.file:
        path: "{{ bootwright_ceph_remote_work_dir }}"
        state: directory
        mode: "0700"

    - name: Copy cephadm bootstrap spec
      ansible.builtin.copy:
        src: "{{ bootwright_selected_storage_cluster.ceph.bootstrapSpecPath }}"
        dest: "{{ bootwright_ceph_remote_bootstrap_spec }}"
        mode: "0600"

    - name: Copy cephadm service spec
      ansible.builtin.copy:
        src: "{{ bootwright_selected_storage_cluster.ceph.servicesSpecPath }}"
        dest: "{{ bootwright_ceph_remote_services_spec }}"
        mode: "0600"

    - name: Copy rendered Ceph operation manifest
      ansible.builtin.copy:
        src: "{{ bootwright_selected_storage_cluster.ceph.operationsPath }}"
        dest: "{{ bootwright_ceph_remote_operations }}"
        mode: "0600"

    - name: Copy cephadm cluster private SSH key
      ansible.builtin.copy:
        src: "{{ bootwright_selected_storage_cluster.clusterSSH.privateKeyPath }}"
        dest: "{{ bootwright_ceph_remote_private_key }}"
        mode: "0600"
      no_log: true
      when: bootwright_selected_storage_cluster.clusterSSH.privateKeyPath | default('') | length > 0

    - name: Copy cephadm cluster public SSH key
      ansible.builtin.copy:
        src: "{{ bootwright_selected_storage_cluster.clusterSSH.publicKeyPath }}"
        dest: "{{ bootwright_ceph_remote_public_key }}"
        mode: "0644"
      no_log: true
      when: bootwright_selected_storage_cluster.clusterSSH.publicKeyPath | default('') | length > 0

    - name: Check existing Ceph configuration
      ansible.builtin.command:
        argv:
          - test
          - -f
          - /etc/ceph/ceph.conf
      register: bootwright_ceph_conf_check
      changed_when: false
      failed_when: false

    - name: Check existing Ceph status
      ansible.builtin.command:
        argv:
          - ceph
          - status
      register: bootwright_ceph_status_check
      changed_when: false
      failed_when: false

    - name: Resolve cephadm bootstrap command
      ansible.builtin.set_fact:
        bootwright_ceph_bootstrap_argv: >-
          {{
            [
              'cephadm',
              'bootstrap',
              '--mon-ip',
              bootwright_selected_storage_cluster.bootstrap.monIP,
              '--apply-spec',
              bootwright_ceph_remote_bootstrap_spec
            ]
            + (
              ['--cluster-network', (bootwright_selected_storage_cluster.clusterNetworkCIDRs | join(','))]
              if (bootwright_selected_storage_cluster.clusterNetworkCIDRs | default([]) | length) > 0
              else []
            )
            + (
              ['--ssh-private-key', bootwright_ceph_remote_private_key]
              if bootwright_selected_storage_cluster.clusterSSH.privateKeyPath | default('') | length > 0
              else []
            )
            + (
              ['--ssh-public-key', bootwright_ceph_remote_public_key]
              if bootwright_selected_storage_cluster.clusterSSH.publicKeyPath | default('') | length > 0
              else []
            )
          }}

    - name: Bootstrap Ceph cluster when absent
      ansible.builtin.command:
        argv: "{{ bootwright_ceph_bootstrap_argv }}"
      register: bootwright_ceph_bootstrap
      changed_when: true
      when: bootwright_ceph_conf_check.rc != 0 or bootwright_ceph_status_check.rc != 0

    - name: Apply Ceph service spec
      ansible.builtin.command:
        argv:
          - ceph
          - orch
          - apply
          - -i
          - "{{ bootwright_ceph_remote_services_spec }}"
      register: bootwright_ceph_services_apply
      changed_when: true

    - name: Capture base Data Foundation external-cluster secrets
      ansible.builtin.command:
        argv: "{{ item.argv }}"
      loop:
        - name: fsid
          argv: [ceph, fsid]
        - name: adminSecret
          argv: [ceph, auth, get-key, client.admin]
        - name: monSecret
          argv: [ceph, auth, get-key, mon.]
      loop_control:
        label: "{{ item.name }}"
      register: bootwright_ceph_base_secret_commands
      changed_when: false
      no_log: true
      when: bootwright_selected_storage_cluster.dataFoundationBindings | default([]) | length > 0

    - name: Initialize Data Foundation result
      ansible.builtin.set_fact:
        bootwright_ceph_base_secrets: "{{ dict(bootwright_ceph_base_secret_commands.results | map(attribute='item.name') | zip(bootwright_ceph_base_secret_commands.results | map(attribute='stdout'))) }}"
        bootwright_data_foundation_result: {}
      no_log: true
      when: bootwright_selected_storage_cluster.dataFoundationBindings | default([]) | length > 0

    - name: Add base Data Foundation credentials for each binding
      ansible.builtin.set_fact:
        bootwright_data_foundation_result: >-
          {{
            bootwright_data_foundation_result
            | combine(
                dict([(item.cluster, {
                  'fsid': bootwright_ceph_base_secrets.fsid | default(''),
                  'adminSecret': bootwright_ceph_base_secrets.adminSecret | default(''),
                  'monSecret': bootwright_ceph_base_secrets.monSecret | default('')
                })]),
                recursive=True
              )
          }}
      loop: "{{ bootwright_selected_storage_cluster.dataFoundationBindings | default([]) }}"
      loop_control:
        label: "{{ item.cluster }}"
      no_log: true

    - name: Run rendered Ceph operation
      ansible.builtin.include_tasks: operations/run.yml
      loop: "{{ bootwright_ceph_operations }}"
      loop_control:
        loop_var: bootwright_ceph_op
        label: "{{ bootwright_ceph_op.name | default('<unnamed>') }}"
      when: bootwright_ceph_op.command | default([]) | length > 0

    - name: Create storage task artifact directory
      ansible.builtin.file:
        path: "{{ bootwright_ansible_artifacts_dir }}"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false
      when: bootwright_selected_storage_cluster.dataFoundationBindings | default([]) | length > 0

    - name: Write captured storage result
      ansible.builtin.copy:
        dest: "{{ bootwright_selected_storage_cluster.resultPath }}"
        content: "{{ {'dataFoundation': bootwright_data_foundation_result | default({})} | to_nice_json }}\n"
        mode: "0600"
      delegate_to: localhost
      become: false
      no_log: true
      when: bootwright_selected_storage_cluster.dataFoundationBindings | default([]) | length > 0
  always:
    - name: Remove managed Ceph work directory
      ansible.builtin.file:
        path: "{{ bootwright_ceph_remote_work_dir }}"
        state: absent
      when: bootwright_ceph_remote_work_dir | default('') | length > 0
