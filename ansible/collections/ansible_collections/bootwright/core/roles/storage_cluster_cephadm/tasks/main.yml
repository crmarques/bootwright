---
- name: Validate the Ceph command timeout contract
  ansible.builtin.import_tasks: timeout_contract.yml

- name: Resolve Ceph storage role variables
  ansible.builtin.include_tasks: phases/context_vars.yml

- name: Require a Ceph image for the container-runtime safety proof
  ansible.builtin.assert:
    that:
      - bootwright_ceph_bootstrap_image | default('') | length > 0
    fail_msg: >-
      StorageCluster/{{ bootwright_task_storage_cluster_name }} resolved no Ceph
      container image. Bootwright cannot prove that every selected storage node can
      start the image cephadm will use, so this apply refuses before rebuild,
      bootstrap, or disk mutation. Correct the StorageCluster provider/image inputs
      and re-run {{ bootwright_mutating_invocation | default('the same apply invocation') }}.
    quiet: true

- name: Check package-mode Ceph daemon residue before storage mutation
  ansible.builtin.include_role:
    name: bootwright.core.check_storage_preflight
    tasks_from: package_mode_daemons.yml

- name: Verify storage node FIPS mode before storage mutation
  ansible.builtin.include_role:
    name: bootwright.core.check_storage_preflight
    tasks_from: fips_mode.yml
  vars:
    bootwright_storage_fips_required: "{{ bootwright_selected_storage_cluster.fips | default(false) | bool }}"

- name: Resolve and gate Ceph storage node identity
  ansible.builtin.include_tasks: phases/node_identity.yml

- name: Prepare Ceph storage node context
  ansible.builtin.include_tasks: phases/context.yml
  when: not bootwright_task_storage_skip_prereqs | default(false) | bool

- name: Prepare Ceph repository and subscription
  ansible.builtin.include_tasks: phases/repository.yml
  when: not bootwright_task_storage_skip_prereqs | default(false) | bool

- name: Install Ceph host dependencies
  ansible.builtin.include_tasks: phases/dependencies.yml
  when: not bootwright_task_storage_skip_prereqs | default(false) | bool

- name: Configure Ceph container registry access
  ansible.builtin.include_tasks: phases/registry.yml
  when:
    - not bootwright_task_storage_skip_prereqs | default(false) | bool
    - bootwright_ceph_provider.requiresRegistry | default(false) | bool

- name: Install cephadm host tooling
  ansible.builtin.include_tasks: phases/install.yml
  when: not bootwright_task_storage_skip_prereqs | default(false) | bool

- name: Prove the Ceph storage node container runtime
  ansible.builtin.include_tasks: phases/container_runtime.yml

- name: Guard and clean an authorized Ceph cluster rebuild
  ansible.builtin.include_tasks: phases/rebuild.yml
  when: not bootwright_task_storage_prereqs_only | default(false) | bool

- name: Refuse storage nodes still running a cephadm cluster this apply does not own
  ansible.builtin.include_tasks: phases/foreign_cluster.yml
  when: not bootwright_task_storage_prereqs_only | default(false) | bool

- name: End non-seed hosts after the cluster-wide rebuild phase
  ansible.builtin.meta: end_host
  when:
    - not bootwright_task_storage_prereqs_only | default(false) | bool
    - inventory_hostname != bootwright_selected_storage_cluster.seedHost | default('')

- name: Prepare Ceph seed convergence context
  ansible.builtin.include_tasks: phases/context_seed.yml
  when: not bootwright_task_storage_prereqs_only | default(false) | bool

- name: Bootstrap and converge Ceph cluster
  ansible.builtin.include_tasks: phases/bootstrap.yml
  when:
    - not bootwright_task_storage_prereqs_only | default(false) | bool
    - inventory_hostname == bootwright_selected_storage_cluster.seedHost | default('')
