---
- name: Validate Red Hat Ceph entitlement paths
  ansible.builtin.assert:
    that:
      - bootwright_ceph_rhsm_organization_path | length > 0
      - bootwright_ceph_rhsm_activation_key_path | length > 0
      - bootwright_ceph_registry_url | length > 0
      - bootwright_ceph_registry_credentials_path | length > 0
    fail_msg: "Red Hat Ceph distribution requires RHSM organizationRef, activationKeyRef, and registry credentialsRef entitlement material."

- name: Register storage node with RHSM for Red Hat Ceph
  ansible.builtin.command:
    argv:
      - subscription-manager
      - register
      - --org
      - "{{ lookup('ansible.builtin.file', bootwright_ceph_rhsm_organization_path) | trim }}"
      - --activationkey
      - "{{ lookup('ansible.builtin.file', bootwright_ceph_rhsm_activation_key_path) | trim }}"
      - --force
  register: bootwright_ceph_rhsm_register
  changed_when: false
  no_log: true

- name: Refresh RHSM subscription metadata for Red Hat Ceph
  ansible.builtin.command:
    argv:
      - subscription-manager
      - refresh
  changed_when: false

- name: Disable unrelated RHSM repositories for Red Hat Ceph
  ansible.builtin.command:
    argv:
      - subscription-manager
      - repos
      - --disable=*
  changed_when: false

- name: Enable Red Hat Ceph Storage repositories
  ansible.builtin.command:
    argv:
      - subscription-manager
      - repos
      - "--enable={{ item }}"
  loop: "{{ bootwright_ceph_provider.repository.redhatRepos }}"
  loop_control:
    label: "{{ item }}"
  changed_when: false
