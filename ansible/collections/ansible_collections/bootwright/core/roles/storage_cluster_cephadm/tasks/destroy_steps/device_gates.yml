---
- name: Probe declared Ceph destroy devices for active mounts
  ansible.builtin.command:
    argv:
      - lsblk
      - --noheadings
      - --output
      - MOUNTPOINT
      - "{{ item }}"
  register: bootwright_ceph_device_mounts
  changed_when: false
  failed_when: false
  loop: "{{ bootwright_current_storage_host.devices | default([]) }}"
  loop_control:
    label: "{{ bootwright_current_storage_host.hostname }} {{ item }}"

- name: Classify declared Ceph destroy devices by presence
  ansible.builtin.set_fact:
    bootwright_ceph_present_probe: >-
      {{ bootwright_ceph_device_mounts.results | default([]) | selectattr('rc', 'equalto', 0) | list }}
    bootwright_ceph_present_devices: >-
      {{ bootwright_ceph_device_mounts.results | default([]) | selectattr('rc', 'equalto', 0)
         | map(attribute='item') | list }}
    bootwright_ceph_absent_devices: >-
      {{ bootwright_ceph_device_mounts.results | default([]) | rejectattr('rc', 'equalto', 0)
         | selectattr('stderr', 'defined')
         | selectattr('stderr', 'search', 'not a block device|No such file or directory')
         | map(attribute='item') | list }}
  changed_when: false

- name: Resolve Ceph destroy devices that could not be probed
  ansible.builtin.set_fact:
    bootwright_ceph_unprobeable_devices: >-
      {{ (bootwright_ceph_device_mounts.results | default([]) | rejectattr('rc', 'equalto', 0)
          | map(attribute='item') | list)
         | difference(bootwright_ceph_absent_devices | default([])) }}
  changed_when: false

- name: Refuse to wipe Ceph destroy devices that could not be probed
  ansible.builtin.assert:
    that:
      - (bootwright_ceph_unprobeable_devices | default([])) | length == 0
    fail_msg: >-
      Refusing to destroy {{ bootwright_selected_storage_cluster.name }}/{{ bootwright_current_storage_host.hostname }}:
      declared device(s) {{ bootwright_ceph_unprobeable_devices | default([]) | join(', ') }}
      could not be probed with lsblk (a non-zero exit other than "not a block device").
      Failing closed rather than risk wiping the wrong device.

- name: Skip absent declared Ceph destroy devices
  ansible.builtin.debug:
    msg: >-
      Skipping declared device(s) {{ bootwright_ceph_absent_devices | default([]) | join(', ') }}
      for {{ bootwright_selected_storage_cluster.name }}/{{ bootwright_current_storage_host.hostname }}:
      not present on this host, nothing to wipe.
  when: (bootwright_ceph_absent_devices | default([])) | length > 0

- name: Refuse to wipe mounted or in-use Ceph destroy devices
  ansible.builtin.assert:
    that:
      - (item.stdout_lines | default([]) | map('trim') | reject('equalto', '') | list | length) == 0
    fail_msg: >-
      Refusing to wipe storage device {{ item.item }} for
      {{ bootwright_selected_storage_cluster.name }}/{{ bootwright_current_storage_host.hostname }}:
      it is mounted or in use ({{ item.stdout_lines | default([]) | map('trim') | reject('equalto', '') | list | join(', ') }}),
      so it is not a wipeable Bootwright OSD device. Correct the declared devices list before destroying.
  loop: "{{ bootwright_ceph_present_probe | default([]) }}"
  loop_control:
    label: "{{ bootwright_current_storage_host.hostname }} {{ item.item }}"

- name: Read Bootwright OSD device ownership marker
  ansible.builtin.slurp:
    src: "{{ bootwright_ceph_osd_marker_path }}"
  register: bootwright_ceph_osd_device_marker
  changed_when: false
  failed_when: false

- name: Resolve recorded Bootwright OSD devices
  ansible.builtin.set_fact:
    bootwright_ceph_osd_marker_valid: >-
      {{ bootwright_ceph_osd_marker_doc.manager | default('') == 'bootwright'
         and bootwright_ceph_osd_marker_doc.cluster | default('') == bootwright_selected_storage_cluster.name
         and bootwright_ceph_osd_marker_doc.node | default('') == bootwright_current_storage_host.hostname }}
    bootwright_ceph_recorded_osd_devices: >-
      {{ bootwright_ceph_osd_marker_doc.devices | default([])
         if (bootwright_ceph_osd_marker_doc.manager | default('') == 'bootwright'
             and bootwright_ceph_osd_marker_doc.cluster | default('') == bootwright_selected_storage_cluster.name
             and bootwright_ceph_osd_marker_doc.node | default('') == bootwright_current_storage_host.hostname)
         else [] }}
  vars:
    bootwright_ceph_osd_marker_doc: "{{ bootwright_ceph_osd_device_marker.content | b64decode | from_json }}"
  when: (bootwright_ceph_osd_device_marker | default({})).content is defined

- name: Probe present Ceph destroy devices for data signatures
  ansible.builtin.command:
    argv:
      - wipefs
      - --no-act
      - --noheadings
      - "{{ item }}"
  register: bootwright_ceph_destroy_signatures
  changed_when: false
  failed_when: false
  loop: "{{ bootwright_ceph_present_devices | default([]) }}"
  loop_control:
    label: "{{ bootwright_current_storage_host.hostname }} {{ item }}"

- name: Refuse to wipe present Ceph devices without a valid Bootwright OSD record
  ansible.builtin.assert:
    that:
      - item.rc == 0
      - (item.stdout | trim | length == 0)
        or ((bootwright_ceph_osd_marker_valid | default(false) | bool)
            and (item.item in (bootwright_ceph_recorded_osd_devices | default([]))))
    fail_msg: >-
      {{
        ('Refusing to wipe storage device ' ~ item.item ~ ' for '
         ~ bootwright_selected_storage_cluster.name ~ '/' ~ bootwright_current_storage_host.hostname
         ~ ': it could not be probed with wipefs (rc=' ~ item.rc ~ '): '
         ~ (item.stderr | default('') | trim)
         ~ '. Failing closed rather than risk wiping the wrong device.')
        if item.rc != 0
        else
        ('Refusing to wipe storage device ' ~ item.item ~ ' for '
         ~ bootwright_selected_storage_cluster.name ~ '/' ~ bootwright_current_storage_host.hostname
         ~ ': it carries data signatures (' ~ (item.stdout | trim) ~ ') and is not recorded as a'
         ~ ' Bootwright OSD device on this node'
         ~ ((' (no valid Bootwright OSD ownership marker is present on this node, so it may be a'
             ~ ' foreign or co-resident Ceph cluster)')
            if not (bootwright_ceph_osd_marker_valid | default(false) | bool)
            else (' (recorded devices: '
                  ~ (bootwright_ceph_recorded_osd_devices | default([]) | join(', ')) ~ ')'))
         ~ '. Re-apply to re-record OSD devices, or verify and wipe it manually.'
         ~ ' (--include-unowned does not relax this device data-safety gate.)')
      }}
  loop: "{{ bootwright_ceph_destroy_signatures.results | default([]) }}"
  loop_control:
    label: "{{ bootwright_current_storage_host.hostname }} {{ item.item }}"
