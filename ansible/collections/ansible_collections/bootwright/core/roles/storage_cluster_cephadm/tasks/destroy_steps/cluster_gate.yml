---
- name: Read existing Ceph configuration on seed host
  ansible.builtin.slurp:
    src: /etc/ceph/ceph.conf
  register: bootwright_ceph_destroy_conf
  changed_when: false
  failed_when: false
  when: inventory_hostname == bootwright_selected_storage_cluster.seedHost | default('')

- name: Check existing Ceph configuration on seed host
  ansible.builtin.command:
    argv:
      - test
      - -f
      - /etc/ceph/ceph.conf
  register: bootwright_ceph_destroy_conf_check
  changed_when: false
  failed_when: false
  when: inventory_hostname == bootwright_selected_storage_cluster.seedHost | default('')

- name: Scan the seed host for Ceph cluster directories
  ansible.builtin.find:
    paths: /var/lib/ceph
    file_type: directory
  register: bootwright_ceph_destroy_state_dirs
  changed_when: false
  when: inventory_hostname == bootwright_selected_storage_cluster.seedHost | default('')

- name: Resolve whether the seed host still carries Ceph cluster state
  ansible.builtin.set_fact:
    bootwright_ceph_destroy_local_state: >-
      {{ (bootwright_ceph_destroy_conf_check.rc | default(1) | int == 0)
         or ((bootwright_ceph_destroy_state_dirs.files | default([])
              | map(attribute='path') | map('basename')
              | select('match', '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$')
              | list | length) > 0) }}
  changed_when: false
  when: inventory_hostname == bootwright_selected_storage_cluster.seedHost | default('')

- name: Check Ceph fsid on seed host
  ansible.builtin.command:
    argv:
      - timeout
      - "60"
      - cephadm
      - shell
      - --
      - ceph
      - fsid
  register: bootwright_ceph_fsid
  changed_when: false
  failed_when: false
  when:
    - inventory_hostname == bootwright_selected_storage_cluster.seedHost | default('')
    - bootwright_ceph_destroy_local_state | default(false) | bool

- name: Resolve existing Ceph configuration fsid on seed host
  ansible.builtin.set_fact:
    bootwright_ceph_destroy_conf_fsid: >-
      {{ (bootwright_ceph_destroy_conf.content | b64decode
          | regex_search('fsid\s*=\s*([0-9a-fA-F-]+)', '\1')
          | default([], true) | first | default('')) | trim }}
  when:
    - inventory_hostname == bootwright_selected_storage_cluster.seedHost | default('')
    - (bootwright_ceph_destroy_conf | default({})).content is defined

- name: Resolve confirmed Ceph ownership recovery fsid on seed host
  ansible.builtin.set_fact:
    bootwright_ceph_destroy_confirmed_fsid: >-
      {{ (bootwright_ceph_destroy_confirmed_fsids | default({}))
         .get(bootwright_selected_storage_cluster.name, '') | trim }}
  when: inventory_hostname == bootwright_selected_storage_cluster.seedHost | default('')

- name: Refuse Ceph ownership recovery without matching evidence
  ansible.builtin.assert:
    that:
      - bootwright_ceph_destroy_conf_fsid | default('') | length > 0
      - >-
        bootwright_ceph_destroy_conf_fsid | default('')
        == bootwright_ceph_destroy_confirmed_fsid | default('')
      - >-
        (bootwright_ceph_fsid.stdout | default('') | trim | length == 0)
        or (bootwright_ceph_fsid.stdout | default('') | trim
            == bootwright_ceph_destroy_conf_fsid | default(''))
      - bootwright_selected_storage_cluster.seedHost | default('') == inventory_hostname
    fail_msg: >-
      Refusing to recover the Ceph ownership marker for
      {{ bootwright_selected_storage_cluster.name }} on {{ inventory_hostname }}:
      --recover-ceph-ownership confirmed fsid
      {{ bootwright_ceph_destroy_confirmed_fsid | default('<missing>') }}, but
      /etc/ceph/ceph.conf carries fsid
      {{ bootwright_ceph_destroy_conf_fsid | default('<unreadable>') }}, and the
      reachable cluster reports fsid
      {{ bootwright_ceph_fsid.stdout | default('<unreachable>') | trim }}.
      No ownership marker was changed.
  when:
    - inventory_hostname == bootwright_selected_storage_cluster.seedHost | default('')
    - bootwright_ceph_destroy_confirmed_fsid | default('') | length > 0

- name: Recover Bootwright storage cluster ownership record on controller
  ansible.builtin.include_role:
    name: bootwright.core.ownership_record
    tasks_from: resource.yml
    apply:
      delegate_to: localhost
      become: false
  vars:
    bootwright_ownership_kind: storage-cluster
    bootwright_ownership_name: "{{ bootwright_selected_storage_cluster.name }}"
    bootwright_ownership_fields:
      cluster: "{{ bootwright_selected_storage_cluster.name }}"
      attributes:
        seedHost: "{{ bootwright_selected_storage_cluster.seedHost | default('') }}"
  when:
    - inventory_hostname == bootwright_selected_storage_cluster.seedHost | default('')
    - bootwright_ceph_destroy_confirmed_fsid | default('') | length > 0

- name: Recover Bootwright Ceph ownership marker on seed host
  ansible.builtin.copy:
    dest: "{{ bootwright_ceph_ownership_marker_path }}"
    content: >-
      {{
        {
          'manager': 'bootwright',
          'cluster': bootwright_selected_storage_cluster.name,
          'fsid': bootwright_ceph_destroy_confirmed_fsid
        } | to_nice_json
      }}
    owner: root
    group: root
    mode: "0600"
  when:
    - inventory_hostname == bootwright_selected_storage_cluster.seedHost | default('')
    - bootwright_ceph_destroy_confirmed_fsid | default('') | length > 0

- name: Stat Bootwright storage cluster ownership record on controller
  ansible.builtin.stat:
    path: "{{ bootwright_ownership_dir }}/resources/storage-cluster/{{ bootwright_selected_storage_cluster.name }}.json"
  register: bootwright_ceph_destroy_record
  changed_when: false
  delegate_to: localhost
  become: false
  when: inventory_hostname == bootwright_selected_storage_cluster.seedHost | default('')

- name: Read Bootwright Ceph ownership marker on seed host
  ansible.builtin.slurp:
    src: "{{ bootwright_ceph_ownership_marker_path }}"
  register: bootwright_ceph_destroy_marker
  changed_when: false
  failed_when: false
  when: inventory_hostname == bootwright_selected_storage_cluster.seedHost | default('')

- name: Resolve Bootwright ownership marker fsid on seed host
  ansible.builtin.set_fact:
    bootwright_ceph_destroy_owned_fsid: >-
      {{ (bootwright_ceph_destroy_marker.content | b64decode | from_json).fsid
         | default('', true) | trim }}
  when:
    - inventory_hostname == bootwright_selected_storage_cluster.seedHost | default('')
    - (bootwright_ceph_destroy_marker | default({})).content is defined

- name: Decide Ceph destroy ownership on seed host
  ansible.builtin.set_fact:
    bootwright_ceph_destroy_owned: >-
      {{
        (
          (bootwright_ceph_destroy_conf_check.rc is defined)
          and not (bootwright_ceph_destroy_local_state | default(true) | bool)
        )
        or (
          (bootwright_ceph_destroy_conf_fsid | default('') | length > 0)
          and (bootwright_ceph_destroy_record.stat.exists | default(false) | bool)
          and (bootwright_selected_storage_cluster.seedHost | default('') == inventory_hostname)
          and (bootwright_ceph_destroy_owned_fsid | default('') | length > 0)
          and (bootwright_ceph_destroy_owned_fsid | default('')
               == bootwright_ceph_destroy_conf_fsid | default(''))
          and (
            (bootwright_ceph_fsid.stdout | default('') | trim | length == 0)
            or (bootwright_ceph_fsid.stdout | default('') | trim
                == bootwright_ceph_destroy_conf_fsid | default(''))
          )
        )
      }}
  when: inventory_hostname == bootwright_selected_storage_cluster.seedHost | default('')

- name: Resolve the unproven Ceph destroy ownership evidence on seed host
  vars:
    bootwright_ceph_destroy_record_path: "{{ bootwright_ownership_dir }}/resources/storage-cluster/{{ bootwright_selected_storage_cluster.name }}.json"
    bootwright_ceph_destroy_live_fsid: "{{ bootwright_ceph_fsid.stdout | default('') | trim }}"
    bootwright_ceph_destroy_live_reading: >-
      {{ (bootwright_ceph_fsid.stdout | default('') | trim | default('<no answer>', true))
         if (bootwright_ceph_destroy_local_state | default(false) | bool)
         else '<not probed: this seed carries no Ceph cluster state>' }}
  ansible.builtin.set_fact:
    bootwright_ceph_destroy_unproven: >-
      {{
        (['this seed did not answer the probes this teardown reads its state from, so its'
          ~ ' silence cannot be read as an already-destroyed cluster: '
          ~ (bootwright_ceph_destroy_conf_check.msg
             | default(bootwright_ceph_fsid.msg | default('no diagnostic was recorded')))]
         if ((bootwright_ceph_destroy_conf_check.rc is not defined)
             or ((bootwright_ceph_destroy_local_state | default(true) | bool)
                 and (bootwright_ceph_fsid.rc is not defined)))
         else [])
        + (['/etc/ceph/ceph.conf is absent and `ceph fsid` named no cluster, but /var/lib/ceph'
            ~ ' still holds Ceph cluster state, which is what a teardown that removed'
            ~ ' /etc/ceph without removing the cluster leaves behind — its daemons are very'
            ~ ' likely still running and still holding their OSD devices']
           if ((bootwright_ceph_destroy_conf_check.rc | default(1) | int != 0)
               and (bootwright_ceph_destroy_live_fsid | length == 0)
               and (bootwright_ceph_destroy_local_state | default(true) | bool))
           else [])
        + (['/etc/ceph/ceph.conf is absent, but this node answered `ceph fsid` with '
          ~ bootwright_ceph_destroy_live_fsid]
         if ((bootwright_ceph_destroy_conf_check.rc | default(1) | int != 0)
             and (bootwright_ceph_destroy_live_fsid | length > 0))
         else [])
        + (['/etc/ceph/ceph.conf carries no fsid']
           if ((bootwright_ceph_destroy_conf_check.rc | default(1) | int == 0)
               and (bootwright_ceph_destroy_conf_fsid | default('') | length == 0))
           else [])
        + (['the controller holds no ownership record at '
            ~ bootwright_ceph_destroy_record_path]
           if ((bootwright_ceph_destroy_conf_fsid | default('') | length > 0)
               and not (bootwright_ceph_destroy_record.stat.exists | default(false) | bool))
           else [])
        + (['the on-host ownership marker ' ~ bootwright_ceph_ownership_marker_path
            ~ ' is missing or carries no fsid']
           if ((bootwright_ceph_destroy_conf_fsid | default('') | length > 0)
               and (bootwright_ceph_destroy_owned_fsid | default('') | length == 0))
           else [])
        + (['the on-host ownership marker fsid '
            ~ (bootwright_ceph_destroy_owned_fsid | default(''))
            ~ ' does not match the configuration fsid']
           if ((bootwright_ceph_destroy_owned_fsid | default('') | length > 0)
               and (bootwright_ceph_destroy_owned_fsid | default('')
                    != bootwright_ceph_destroy_conf_fsid | default('')))
           else [])
        + (['the reachable cluster fsid ' ~ bootwright_ceph_destroy_live_fsid
            ~ ' does not match the configuration fsid']
           if ((bootwright_ceph_destroy_conf_fsid | default('') | length > 0)
               and (bootwright_ceph_destroy_live_fsid | length > 0)
               and (bootwright_ceph_destroy_live_fsid
                    != bootwright_ceph_destroy_conf_fsid | default('')))
           else [])
      }}
    bootwright_ceph_destroy_evidence: >-
      configuration fsid
      {{ bootwright_ceph_destroy_conf_fsid | default('') | trim | default('<none>', true) }};
      on-host marker fsid
      {{ bootwright_ceph_destroy_owned_fsid | default('') | trim | default('<missing>', true) }};
      controller record
      {{ 'present' if (bootwright_ceph_destroy_record.stat.exists | default(false) | bool) else 'absent' }}
      at {{ bootwright_ceph_destroy_record_path }};
      reachable cluster fsid
      {{ bootwright_ceph_destroy_live_reading }}
  changed_when: false
  when: inventory_hostname == bootwright_selected_storage_cluster.seedHost | default('')

- name: Refuse to destroy a non-Bootwright Ceph cluster on seed host
  ansible.builtin.assert:
    that:
      - bootwright_ceph_destroy_owned | default(false) | bool
    fail_msg: >-
      Refusing to tear down the cephadm cluster on {{ inventory_hostname }}
      (fsid {{ bootwright_ceph_destroy_conf_fsid | default('<unreadable>') | trim }}):
      this seed carries a Ceph cluster whose fsid is not proven to be Bootwright's, so it
      may be a foreign or co-resident cluster. Unproven because
      {{ bootwright_ceph_destroy_unproven | default([]) | join('; and ') }}.
      Evidence read on this seed: {{ bootwright_ceph_destroy_evidence | default('none') }}.
      A missing controller record or host marker is the residue of a teardown that already
      began, or of an install whose ownership stamping never completed; a fsid that
      disagrees is a different cluster. If you independently verified this cluster and
      fsid, retry with
      --recover-ceph-ownership
      {{ bootwright_selected_storage_cluster.name }}={{
      bootwright_ceph_destroy_conf_fsid | default('<fsid>') }} to reconstruct the
      controller record and host marker before teardown. Contradictory controller ownership
      evidence is never overwritten. (--authorize unowned-vms relaxes the machine VM ownership
      markers only; it does not relax this Ceph cluster ownership gate.)
  when: inventory_hostname == bootwright_selected_storage_cluster.seedHost | default('')

- name: Resolve Ceph cluster fsid for teardown on seed host
  ansible.builtin.set_fact:
    bootwright_ceph_destroy_fsid: >-
      {{ bootwright_ceph_fsid.stdout | default('') | trim
         if (bootwright_ceph_fsid.stdout | default('') | trim | length > 0)
         else bootwright_ceph_destroy_conf_fsid | default('') }}
  when: inventory_hostname == bootwright_selected_storage_cluster.seedHost | default('')

- name: Resolve the cephadm command for the seed host cluster removal
  ansible.builtin.include_tasks: cephadm_command.yml
  vars:
    bootwright_ceph_destroy_host_fsid: "{{ bootwright_ceph_destroy_fsid | default('') }}"
    bootwright_ceph_destroy_host_state: true
  when:
    - inventory_hostname == bootwright_selected_storage_cluster.seedHost | default('')
    - bootwright_ceph_destroy_owned | default(false) | bool
    - bootwright_ceph_destroy_fsid | default('') | length > 0

- name: Remove cephadm cluster on seed host
  ansible.builtin.command:
    argv:
      - "{{ bootwright_ceph_destroy_cephadm }}"
      - rm-cluster
      - --force
      - --zap-osds
      - --fsid
      - "{{ bootwright_ceph_destroy_fsid }}"
  register: bootwright_cephadm_rm_cluster
  changed_when: bootwright_cephadm_rm_cluster.rc == 0
  failed_when: bootwright_cephadm_rm_cluster.rc != 0
  when:
    - inventory_hostname == bootwright_selected_storage_cluster.seedHost | default('')
    - bootwright_ceph_destroy_owned | default(false) | bool
    - bootwright_ceph_destroy_fsid | default('') | length > 0

- name: Probe non-seed hosts for local Ceph cluster state
  ansible.builtin.stat:
    path: "/var/lib/ceph/{{ hostvars[bootwright_selected_storage_cluster.seedHost].bootwright_ceph_destroy_fsid | default('') }}"
  register: bootwright_ceph_nonseed_state_probe
  changed_when: false
  failed_when: false
  when:
    - inventory_hostname != bootwright_selected_storage_cluster.seedHost | default('')
    - hostvars[bootwright_selected_storage_cluster.seedHost].bootwright_ceph_destroy_owned | default(false) | bool
    - hostvars[bootwright_selected_storage_cluster.seedHost].bootwright_ceph_destroy_fsid | default('') | length > 0

- name: Resolve the cephadm command for the non-seed host cluster removal
  ansible.builtin.include_tasks: cephadm_command.yml
  vars:
    bootwright_ceph_destroy_host_fsid: >-
      {{ hostvars[bootwright_selected_storage_cluster.seedHost].bootwright_ceph_destroy_fsid | default('') }}
    bootwright_ceph_destroy_host_state: >-
      {{ (bootwright_ceph_nonseed_state_probe.stat | default({})).exists | default(true) }}
  when:
    - inventory_hostname != bootwright_selected_storage_cluster.seedHost | default('')
    - hostvars[bootwright_selected_storage_cluster.seedHost].bootwright_ceph_destroy_owned | default(false) | bool
    - hostvars[bootwright_selected_storage_cluster.seedHost].bootwright_ceph_destroy_fsid | default('') | length > 0

- name: Report non-seed hosts that hold no Ceph cluster state to remove
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }} carries neither
      /var/lib/ceph/{{ hostvars[bootwright_selected_storage_cluster.seedHost].bootwright_ceph_destroy_fsid | default('') }}
      nor any cephadm that could remove a cluster from it,
      so it never joined storage cluster {{ bootwright_selected_storage_cluster.name }} or was already
      removed from it: treating its cluster removal as already done. Its declared OSD devices are still
      wiped by the device steps, which fail closed on their own gates.
  when:
    - inventory_hostname != bootwright_selected_storage_cluster.seedHost | default('')
    - hostvars[bootwright_selected_storage_cluster.seedHost].bootwright_ceph_destroy_owned | default(false) | bool
    - hostvars[bootwright_selected_storage_cluster.seedHost].bootwright_ceph_destroy_fsid | default('') | length > 0
    - bootwright_ceph_destroy_cephadm | default('') | length == 0

- name: Remove cephadm cluster on non-seed hosts
  ansible.builtin.command:
    argv:
      - "{{ bootwright_ceph_destroy_cephadm }}"
      - rm-cluster
      - --force
      - --zap-osds
      - --fsid
      - "{{ hostvars[bootwright_selected_storage_cluster.seedHost].bootwright_ceph_destroy_fsid | default('') }}"
  register: bootwright_cephadm_rm_cluster_nonseed
  changed_when: bootwright_cephadm_rm_cluster_nonseed.rc == 0
  failed_when: bootwright_cephadm_rm_cluster_nonseed.rc != 0
  when:
    - inventory_hostname != bootwright_selected_storage_cluster.seedHost | default('')
    - hostvars[bootwright_selected_storage_cluster.seedHost].bootwright_ceph_destroy_owned | default(false) | bool
    - hostvars[bootwright_selected_storage_cluster.seedHost].bootwright_ceph_destroy_fsid | default('') | length > 0
    - bootwright_ceph_destroy_cephadm | default('') | length > 0
