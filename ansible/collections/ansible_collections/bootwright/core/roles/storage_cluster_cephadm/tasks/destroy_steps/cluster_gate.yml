---
- name: Read existing Ceph configuration on seed host
  ansible.builtin.slurp:
    src: /etc/ceph/ceph.conf
  register: bootwright_ceph_destroy_conf
  changed_when: false
  failed_when: false
  when: inventory_hostname == bootwright_selected_storage_cluster.seedHost | default('')

- name: Check existing Ceph configuration on seed host
  ansible.builtin.command:
    argv:
      - test
      - -f
      - /etc/ceph/ceph.conf
  register: bootwright_ceph_destroy_conf_check
  changed_when: false
  failed_when: false
  when: inventory_hostname == bootwright_selected_storage_cluster.seedHost | default('')

- name: Scan the seed host for Ceph cluster directories
  ansible.builtin.find:
    paths: /var/lib/ceph
    file_type: directory
  register: bootwright_ceph_destroy_state_dirs
  changed_when: false
  when: inventory_hostname == bootwright_selected_storage_cluster.seedHost | default('')

- name: Resolve whether the seed host still carries Ceph cluster state
  ansible.builtin.set_fact:
    bootwright_ceph_destroy_local_state: >-
      {{ (bootwright_ceph_destroy_conf_check.rc | default(1) | int == 0)
         or ((bootwright_ceph_destroy_state_dirs.files | default([])
              | map(attribute='path') | map('basename')
              | select('match', '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$')
              | list | length) > 0) }}
  changed_when: false
  when: inventory_hostname == bootwright_selected_storage_cluster.seedHost | default('')

- name: Check Ceph fsid on seed host
  ansible.builtin.command:
    argv:
      - timeout
      - --kill-after=15
      - "60"
      - cephadm
      - shell
      - --
      - ceph
      - fsid
  register: bootwright_ceph_fsid
  changed_when: false
  failed_when: false
  when:
    - inventory_hostname == bootwright_selected_storage_cluster.seedHost | default('')
    - bootwright_ceph_destroy_local_state | default(false) | bool

- name: Resolve existing Ceph configuration fsid on seed host
  ansible.builtin.set_fact:
    bootwright_ceph_destroy_conf_fsid: >-
      {{ (bootwright_ceph_destroy_conf.content | b64decode
          | regex_search('fsid\s*=\s*([0-9a-fA-F-]+)', '\1')
          | default([], true) | first | default('')) | trim }}
  when:
    - inventory_hostname == bootwright_selected_storage_cluster.seedHost | default('')
    - (bootwright_ceph_destroy_conf | default({})).content is defined

- name: Resolve confirmed Ceph ownership recovery fsid on seed host
  ansible.builtin.set_fact:
    bootwright_ceph_destroy_confirmed_fsid: >-
      {{ (bootwright_ceph_destroy_confirmed_fsids | default({}))
         .get(bootwright_selected_storage_cluster.name, '') | trim }}
  when: inventory_hostname == bootwright_selected_storage_cluster.seedHost | default('')

- name: Refuse Ceph ownership recovery without matching evidence
  ansible.builtin.assert:
    that:
      - bootwright_ceph_destroy_conf_fsid | default('') | length > 0
      - >-
        bootwright_ceph_destroy_conf_fsid | default('')
        == bootwright_ceph_destroy_confirmed_fsid | default('')
      - >-
        (bootwright_ceph_fsid.stdout | default('') | trim | length == 0)
        or (bootwright_ceph_fsid.stdout | default('') | trim
            == bootwright_ceph_destroy_conf_fsid | default(''))
      - bootwright_selected_storage_cluster.seedHost | default('') == inventory_hostname
    fail_msg: >-
      Refusing to recover the Ceph ownership marker for
      {{ bootwright_selected_storage_cluster.name }} on {{ inventory_hostname }}:
      --recover-ceph-ownership confirmed fsid
      {{ bootwright_ceph_destroy_confirmed_fsid | default('<missing>') }}, but
      /etc/ceph/ceph.conf carries fsid
      {{ bootwright_ceph_destroy_conf_fsid | default('<unreadable>') }}, and the
      reachable cluster reports fsid
      {{ bootwright_ceph_fsid.stdout | default('<unreachable>') | trim }}.
      No ownership marker was changed.
  when:
    - inventory_hostname == bootwright_selected_storage_cluster.seedHost | default('')
    - bootwright_ceph_destroy_confirmed_fsid | default('') | length > 0

- name: Recover Bootwright storage cluster ownership record on controller
  ansible.builtin.include_role:
    name: bootwright.core.ownership_record
    tasks_from: resource.yml
    apply:
      delegate_to: localhost
      become: false
  vars:
    bootwright_ownership_kind: storage-cluster
    bootwright_ownership_name: "{{ bootwright_selected_storage_cluster.name }}"
    bootwright_ownership_fields:
      cluster: "{{ bootwright_selected_storage_cluster.name }}"
      attributes:
        seedHost: "{{ bootwright_selected_storage_cluster.seedHost | default('') }}"
        fsid: "{{ bootwright_ceph_destroy_confirmed_fsid }}"
  when:
    - inventory_hostname == bootwright_selected_storage_cluster.seedHost | default('')
    - bootwright_ceph_destroy_confirmed_fsid | default('') | length > 0

- name: Recover Bootwright Ceph ownership marker on seed host
  ansible.builtin.copy:
    dest: "{{ bootwright_ceph_ownership_marker_path }}"
    content: >-
      {{
        {
          'manager': 'bootwright',
          'cluster': bootwright_selected_storage_cluster.name,
          'fsid': bootwright_ceph_destroy_confirmed_fsid
        } | to_nice_json
      }}
    owner: root
    group: root
    mode: "0600"
  when:
    - inventory_hostname == bootwright_selected_storage_cluster.seedHost | default('')
    - bootwright_ceph_destroy_confirmed_fsid | default('') | length > 0

- name: Stat Bootwright storage cluster ownership record on controller
  ansible.builtin.stat:
    path: "{{ bootwright_ownership_dir }}/resources/storage-cluster/{{ bootwright_selected_storage_cluster.name }}.json"
  register: bootwright_ceph_destroy_record
  changed_when: false
  delegate_to: localhost
  become: false
  when: inventory_hostname == bootwright_selected_storage_cluster.seedHost | default('')

- name: Read Bootwright Ceph ownership marker on seed host
  ansible.builtin.slurp:
    src: "{{ bootwright_ceph_ownership_marker_path }}"
  register: bootwright_ceph_destroy_marker
  changed_when: false
  failed_when: false
  when: inventory_hostname == bootwright_selected_storage_cluster.seedHost | default('')

- name: Resolve Bootwright ownership marker fsid on seed host
  ansible.builtin.set_fact:
    bootwright_ceph_destroy_owned_fsid: >-
      {{ (bootwright_ceph_destroy_marker.content | b64decode | from_json).fsid
         | default('', true) | trim }}
  when:
    - inventory_hostname == bootwright_selected_storage_cluster.seedHost | default('')
    - (bootwright_ceph_destroy_marker | default({})).content is defined

- name: Decide Ceph destroy ownership on seed host
  ansible.builtin.set_fact:
    bootwright_ceph_destroy_owned: >-
      {{
        (
          (bootwright_ceph_destroy_conf_check.rc is defined)
          and not (bootwright_ceph_destroy_local_state | default(true) | bool)
        )
        or (
          (bootwright_ceph_destroy_conf_fsid | default('') | length > 0)
          and (bootwright_ceph_destroy_record.stat.exists | default(false) | bool)
          and (bootwright_selected_storage_cluster.seedHost | default('') == inventory_hostname)
          and (bootwright_ceph_destroy_owned_fsid | default('') | length > 0)
          and (bootwright_ceph_destroy_owned_fsid | default('')
               == bootwright_ceph_destroy_conf_fsid | default(''))
          and (
            (bootwright_ceph_fsid.stdout | default('') | trim | length == 0)
            or (bootwright_ceph_fsid.stdout | default('') | trim
                == bootwright_ceph_destroy_conf_fsid | default(''))
          )
        )
      }}
  when: inventory_hostname == bootwright_selected_storage_cluster.seedHost | default('')

- name: Resolve the unproven Ceph destroy ownership evidence on seed host
  vars:
    bootwright_ceph_destroy_record_path: "{{ bootwright_ownership_dir }}/resources/storage-cluster/{{ bootwright_selected_storage_cluster.name }}.json"
    bootwright_ceph_destroy_live_fsid: "{{ bootwright_ceph_fsid.stdout | default('') | trim }}"
    bootwright_ceph_destroy_live_reading: >-
      {{ (bootwright_ceph_fsid.stdout | default('') | trim | default('<no answer>', true))
         if (bootwright_ceph_destroy_local_state | default(false) | bool)
         else '<not probed: this seed carries no Ceph cluster state>' }}
  ansible.builtin.set_fact:
    bootwright_ceph_destroy_unproven: >-
      {{
        (['this seed did not answer the probes this teardown reads its state from, so its'
          ~ ' silence cannot be read as an already-destroyed cluster: '
          ~ (bootwright_ceph_destroy_conf_check.msg
             | default(bootwright_ceph_fsid.msg | default('no diagnostic was recorded')))]
         if ((bootwright_ceph_destroy_conf_check.rc is not defined)
             or ((bootwright_ceph_destroy_local_state | default(true) | bool)
                 and (bootwright_ceph_fsid.rc is not defined)))
         else [])
        + (['/etc/ceph/ceph.conf is absent and `ceph fsid` named no cluster, but /var/lib/ceph'
            ~ ' still holds Ceph cluster state, which is what a teardown that removed'
            ~ ' /etc/ceph without removing the cluster leaves behind — its daemons are very'
            ~ ' likely still running and still holding their OSD devices']
           if ((bootwright_ceph_destroy_conf_check.rc | default(1) | int != 0)
               and (bootwright_ceph_destroy_live_fsid | length == 0)
               and (bootwright_ceph_destroy_local_state | default(true) | bool))
           else [])
        + (['/etc/ceph/ceph.conf is absent, but this node answered `ceph fsid` with '
          ~ bootwright_ceph_destroy_live_fsid]
         if ((bootwright_ceph_destroy_conf_check.rc | default(1) | int != 0)
             and (bootwright_ceph_destroy_live_fsid | length > 0))
         else [])
        + (['/etc/ceph/ceph.conf carries no fsid']
           if ((bootwright_ceph_destroy_conf_check.rc | default(1) | int == 0)
               and (bootwright_ceph_destroy_conf_fsid | default('') | length == 0))
           else [])
        + (['the controller holds no ownership record at '
            ~ bootwright_ceph_destroy_record_path]
           if ((bootwright_ceph_destroy_conf_fsid | default('') | length > 0)
               and not (bootwright_ceph_destroy_record.stat.exists | default(false) | bool))
           else [])
        + (['the on-host ownership marker ' ~ bootwright_ceph_ownership_marker_path
            ~ ' is missing or carries no fsid']
           if ((bootwright_ceph_destroy_conf_fsid | default('') | length > 0)
               and (bootwright_ceph_destroy_owned_fsid | default('') | length == 0))
           else [])
        + (['the on-host ownership marker fsid '
            ~ (bootwright_ceph_destroy_owned_fsid | default(''))
            ~ ' does not match the configuration fsid']
           if ((bootwright_ceph_destroy_owned_fsid | default('') | length > 0)
               and (bootwright_ceph_destroy_owned_fsid | default('')
                    != bootwright_ceph_destroy_conf_fsid | default('')))
           else [])
        + (['the reachable cluster fsid ' ~ bootwright_ceph_destroy_live_fsid
            ~ ' does not match the configuration fsid']
           if ((bootwright_ceph_destroy_conf_fsid | default('') | length > 0)
               and (bootwright_ceph_destroy_live_fsid | length > 0)
               and (bootwright_ceph_destroy_live_fsid
                    != bootwright_ceph_destroy_conf_fsid | default('')))
           else [])
      }}
    bootwright_ceph_destroy_evidence: >-
      configuration fsid
      {{ bootwright_ceph_destroy_conf_fsid | default('') | trim | default('<none>', true) }};
      on-host marker fsid
      {{ bootwright_ceph_destroy_owned_fsid | default('') | trim | default('<missing>', true) }};
      controller record
      {{ 'present' if (bootwright_ceph_destroy_record.stat.exists | default(false) | bool) else 'absent' }}
      at {{ bootwright_ceph_destroy_record_path }};
      reachable cluster fsid
      {{ bootwright_ceph_destroy_live_reading }}
  changed_when: false
  when: inventory_hostname == bootwright_selected_storage_cluster.seedHost | default('')

- name: Refuse to destroy a non-Bootwright Ceph cluster on seed host
  ansible.builtin.assert:
    that:
      - bootwright_ceph_destroy_owned | default(false) | bool
    fail_msg: >-
      Refusing to tear down the cephadm cluster on {{ inventory_hostname }}
      (fsid {{ bootwright_ceph_destroy_conf_fsid | default('<unreadable>') | trim }}):
      this seed carries a Ceph cluster whose fsid is not proven to be Bootwright's, so it
      may be a foreign or co-resident cluster. Unproven because
      {{ bootwright_ceph_destroy_unproven | default([]) | join('; and ') }}.
      Evidence read on this seed: {{ bootwright_ceph_destroy_evidence | default('none') }}.
      A missing controller record or host marker is the residue of a teardown that already
      began, or of an install whose ownership stamping never completed; a fsid that
      disagrees is a different cluster. If you independently verified this cluster and
      fsid, retry with
      --recover-ceph-ownership
      {{ bootwright_selected_storage_cluster.name }}={{
      bootwright_ceph_destroy_conf_fsid | default('<fsid>') }} to reconstruct the
      controller record and host marker before teardown. Contradictory controller ownership
      evidence is never overwritten. (--authorize unowned-vms relaxes the machine VM ownership
      markers only; it does not relax this Ceph cluster ownership gate.)
  when: inventory_hostname == bootwright_selected_storage_cluster.seedHost | default('')

- name: Resolve Ceph cluster fsid for teardown on seed host
  ansible.builtin.set_fact:
    bootwright_ceph_destroy_fsid: >-
      {{ bootwright_ceph_fsid.stdout | default('') | trim
         if (bootwright_ceph_fsid.stdout | default('') | trim | length > 0)
         else bootwright_ceph_destroy_conf_fsid | default('') }}
  when: inventory_hostname == bootwright_selected_storage_cluster.seedHost | default('')

- name: Stop the Ceph orchestrator before any host removes the cluster
  ansible.builtin.command:
    argv:
      - timeout
      - --kill-after=15
      - "120"
      - cephadm
      - shell
      - --
      - ceph
      - mgr
      - module
      - disable
      - cephadm
  register: bootwright_ceph_destroy_orch_disable
  changed_when: bootwright_ceph_destroy_orch_disable.rc == 0
  failed_when: false
  when:
    - inventory_hostname == bootwright_selected_storage_cluster.seedHost | default('')
    - bootwright_ceph_destroy_owned | default(false) | bool
    - bootwright_ceph_destroy_fsid | default('') | length > 0

- name: Refuse to remove a cluster whose orchestrator can still redeploy it
  ansible.builtin.assert:
    that:
      - (bootwright_ceph_destroy_orch_disable.rc | default(1) | int) == 0
    fail_msg: >-
      Refusing to tear down storage cluster {{ bootwright_selected_storage_cluster.name }}
      (fsid {{ bootwright_ceph_destroy_fsid | default('<unresolved>') }}): disabling the
      cephadm manager module exited
      {{ bootwright_ceph_destroy_orch_disable.rc | default('without running') }}
      ({{ bootwright_ceph_destroy_orch_disable.stderr | default('no diagnostic was recorded') | trim }}).
      This teardown removes the cluster one host at a time, starting with this seed, so every
      host it purges stays registered with managers still running on the hosts it has not
      reached yet. A cephadm module that is still enabled reconciles those hosts straight
      back: it redeploys the daemons the purge removed and, because the purge freed their OSD
      devices, runs ceph-volume over them again — the node ends this teardown carrying fresh
      volume groups on disks this run reported wiped, and the next apply refuses them as
      unowned data. Disabling the module is the first step of the cephadm purge procedure for
      exactly that reason. Fix what the diagnostic names (a manager that is down, a mon
      quorum that cannot be reached) and re-run destroy, or run
      `cephadm shell -- ceph mgr module disable cephadm` on {{ inventory_hostname }} by hand
      first. No --authorize token relaxes this: the alternative is a teardown that races the
      orchestrator it is tearing down.
  when:
    - inventory_hostname == bootwright_selected_storage_cluster.seedHost | default('')
    - bootwright_ceph_destroy_owned | default(false) | bool
    - bootwright_ceph_destroy_fsid | default('') | length > 0
    - bootwright_ceph_fsid.stdout | default('') | trim | length > 0

- name: Report an orchestrator this teardown could not disable on an unanswering cluster
  ansible.builtin.debug:
    msg: >-
      Could not disable the cephadm manager module of
      {{ bootwright_selected_storage_cluster.name }}
      (fsid {{ bootwright_ceph_destroy_fsid | default('<unresolved>') }}) on
      {{ inventory_hostname }}: the disable exited
      {{ bootwright_ceph_destroy_orch_disable.rc | default('without running') }}
      ({{ bootwright_ceph_destroy_orch_disable.stderr | default('no diagnostic was recorded') | trim }}),
      and `ceph fsid` did not answer on this seed either. Continuing: a cluster that answers
      neither probe is very likely already down, and refusing here would strand every teardown
      of a half-removed cluster. It is not proof that no manager is running — the seed's own
      mons may be gone while a manager survives on another host, and `cephadm shell` also fails
      when it cannot pull its image. The teardown therefore proves the outcome instead of the
      precondition: the settle gate re-reads every wiped device and refuses any Ceph daemon
      still running once every host has finished, before this run releases any ownership
      evidence.
  when:
    - inventory_hostname == bootwright_selected_storage_cluster.seedHost | default('')
    - bootwright_ceph_destroy_owned | default(false) | bool
    - bootwright_ceph_destroy_fsid | default('') | length > 0
    - bootwright_ceph_fsid.stdout | default('') | trim | length == 0
    - (bootwright_ceph_destroy_orch_disable.rc | default(0) | int) != 0

- name: Resolve the cephadm command for the seed host cluster removal
  ansible.builtin.include_tasks: cephadm_command.yml
  vars:
    bootwright_ceph_destroy_host_fsid: "{{ bootwright_ceph_destroy_fsid | default('') }}"
    bootwright_ceph_destroy_host_state: true
  when:
    - inventory_hostname == bootwright_selected_storage_cluster.seedHost | default('')
    - bootwright_ceph_destroy_owned | default(false) | bool
    - bootwright_ceph_destroy_fsid | default('') | length > 0

- name: Remove cephadm cluster on seed host
  ansible.builtin.command:
    argv:
      - timeout
      - --kill-after=30
      - "1800"
      - "{{ bootwright_ceph_destroy_cephadm }}"
      - rm-cluster
      - --force
      - --zap-osds
      - --fsid
      - "{{ bootwright_ceph_destroy_fsid }}"
  register: bootwright_cephadm_rm_cluster
  changed_when: bootwright_cephadm_rm_cluster.rc == 0
  failed_when: bootwright_cephadm_rm_cluster.rc != 0
  when:
    - inventory_hostname == bootwright_selected_storage_cluster.seedHost | default('')
    - bootwright_ceph_destroy_owned | default(false) | bool
    - bootwright_ceph_destroy_fsid | default('') | length > 0

- name: Scan a non-seed storage host for Ceph state the seed named no cluster for
  ansible.builtin.find:
    paths: /var/lib/ceph
    file_type: directory
  register: bootwright_ceph_nonseed_unnamed_state
  changed_when: false
  when:
    - inventory_hostname != bootwright_selected_storage_cluster.seedHost | default('')
    - hostvars[bootwright_selected_storage_cluster.seedHost].bootwright_ceph_destroy_owned | default(false) | bool
    - hostvars[bootwright_selected_storage_cluster.seedHost].bootwright_ceph_destroy_fsid | default('') | length == 0

- name: Resolve the Ceph clusters a non-seed storage host carries under no resolved fsid
  ansible.builtin.set_fact:
    bootwright_ceph_nonseed_unnamed_fsids: >-
      {{ bootwright_ceph_nonseed_unnamed_state.files | default([])
         | map(attribute='path') | map('basename')
         | select('match', '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$')
         | list }}
  changed_when: false
  when:
    - inventory_hostname != bootwright_selected_storage_cluster.seedHost | default('')
    - hostvars[bootwright_selected_storage_cluster.seedHost].bootwright_ceph_destroy_owned | default(false) | bool
    - hostvars[bootwright_selected_storage_cluster.seedHost].bootwright_ceph_destroy_fsid | default('') | length == 0

- name: Read the Ceph configuration a surviving storage host still carries
  ansible.builtin.slurp:
    src: /etc/ceph/ceph.conf
  register: bootwright_ceph_nonseed_conf
  changed_when: false
  failed_when: false
  when:
    - inventory_hostname != bootwright_selected_storage_cluster.seedHost | default('')
    - hostvars[bootwright_selected_storage_cluster.seedHost].bootwright_ceph_destroy_owned | default(false) | bool
    - hostvars[bootwright_selected_storage_cluster.seedHost].bootwright_ceph_destroy_fsid | default('') | length == 0
    - (bootwright_ceph_nonseed_unnamed_fsids | default([])) | length > 0

- name: Resolve the configuration fsid a surviving storage host still carries
  ansible.builtin.set_fact:
    bootwright_ceph_nonseed_conf_fsid: >-
      {{ (bootwright_ceph_nonseed_conf.content | b64decode
          | regex_search('fsid\s*=\s*([0-9a-fA-F-]+)', '\1')
          | default([], true) | first | default('')) | trim }}
  changed_when: false
  when:
    - inventory_hostname != bootwright_selected_storage_cluster.seedHost | default('')
    - (bootwright_ceph_nonseed_unnamed_fsids | default([])) | length > 0
    - (bootwright_ceph_nonseed_conf | default({})).content is defined

- name: Read the Bootwright ownership marker a surviving storage host still carries
  ansible.builtin.slurp:
    src: "{{ bootwright_ceph_ownership_marker_path }}"
  register: bootwright_ceph_nonseed_marker
  changed_when: false
  failed_when: false
  when:
    - inventory_hostname != bootwright_selected_storage_cluster.seedHost | default('')
    - hostvars[bootwright_selected_storage_cluster.seedHost].bootwright_ceph_destroy_owned | default(false) | bool
    - hostvars[bootwright_selected_storage_cluster.seedHost].bootwright_ceph_destroy_fsid | default('') | length == 0
    - (bootwright_ceph_nonseed_unnamed_fsids | default([])) | length > 0

- name: Resolve the ownership marker evidence a surviving storage host still carries
  ansible.builtin.set_fact:
    bootwright_ceph_nonseed_marker_fsid: >-
      {{ ((bootwright_ceph_nonseed_marker.content | b64decode | from_json).fsid
          | default('', true)) | trim }}
    bootwright_ceph_nonseed_marker_cluster: >-
      {{ ((bootwright_ceph_nonseed_marker.content | b64decode | from_json).cluster
          | default('', true)) | trim }}
  changed_when: false
  when:
    - inventory_hostname != bootwright_selected_storage_cluster.seedHost | default('')
    - (bootwright_ceph_nonseed_unnamed_fsids | default([])) | length > 0
    - (bootwright_ceph_nonseed_marker | default({})).content is defined

- name: Read the storage cluster ownership record fsid on the controller
  ansible.builtin.slurp:
    src: "{{ bootwright_ownership_dir }}/resources/storage-cluster/{{ bootwright_selected_storage_cluster.name }}.json"
  register: bootwright_ceph_destroy_record_slurp
  changed_when: false
  failed_when: false
  delegate_to: localhost
  become: false
  when:
    - inventory_hostname == bootwright_selected_storage_cluster.seedHost | default('')
    - bootwright_ceph_destroy_owned | default(false) | bool
    - bootwright_ceph_destroy_fsid | default('') | length == 0

- name: Resolve the fsid the storage cluster ownership record names
  ansible.builtin.set_fact:
    bootwright_ceph_destroy_record_fsid: >-
      {{ (((bootwright_ceph_destroy_record_slurp.content | b64decode | from_json).attributes
           | default({})).fsid | default('', true)) | trim }}
  changed_when: false
  when:
    - inventory_hostname == bootwright_selected_storage_cluster.seedHost | default('')
    - bootwright_ceph_destroy_owned | default(false) | bool
    - bootwright_ceph_destroy_fsid | default('') | length == 0
    - (bootwright_ceph_destroy_record_slurp | default({})).content is defined

- name: Resolve the cluster evidence the surviving storage hosts still carry
  vars:
    bootwright_ceph_destroy_surviving_hosts: >-
      {{ ansible_play_hosts_all
         | map('extract', hostvars)
         | selectattr('bootwright_storage_cluster_name', 'defined')
         | selectattr('bootwright_storage_cluster_name', 'equalto', bootwright_selected_storage_cluster.name)
         | selectattr('bootwright_ceph_nonseed_unnamed_fsids', 'defined')
         | rejectattr('bootwright_ceph_nonseed_unnamed_fsids', 'equalto', [])
         | list }}
  ansible.builtin.set_fact:
    bootwright_ceph_destroy_surviving_fsids: >-
      {{ bootwright_ceph_destroy_surviving_hosts
         | map(attribute='bootwright_ceph_nonseed_unnamed_fsids')
         | flatten | unique | list }}
    bootwright_ceph_destroy_surviving_conf_fsids: >-
      {{ bootwright_ceph_destroy_surviving_hosts
         | map(attribute='bootwright_ceph_nonseed_conf_fsid', default='')
         | reject('equalto', '') | unique | list }}
    bootwright_ceph_destroy_surviving_marker_fsids: >-
      {{ bootwright_ceph_destroy_surviving_hosts
         | map(attribute='bootwright_ceph_nonseed_marker_fsid', default='')
         | reject('equalto', '') | unique | list }}
    bootwright_ceph_destroy_surviving_marker_clusters: >-
      {{ bootwright_ceph_destroy_surviving_hosts
         | map(attribute='bootwright_ceph_nonseed_marker_cluster', default='')
         | reject('equalto', '') | unique | list }}
    bootwright_ceph_destroy_surviving_hostnames: >-
      {{ bootwright_ceph_destroy_surviving_hosts
         | map(attribute='inventory_hostname') | list }}
  changed_when: false
  when:
    - inventory_hostname == bootwright_selected_storage_cluster.seedHost | default('')
    - bootwright_ceph_destroy_owned | default(false) | bool
    - bootwright_ceph_destroy_fsid | default('') | length == 0

- name: Decide whether the surviving storage hosts prove the fsid this teardown resumes
  vars:
    bootwright_ceph_destroy_record_path: "{{ bootwright_ownership_dir }}/resources/storage-cluster/{{ bootwright_selected_storage_cluster.name }}.json"
    bootwright_ceph_destroy_surviving_fsid: "{{ bootwright_ceph_destroy_surviving_fsids | first | default('') }}"
  ansible.builtin.set_fact:
    bootwright_ceph_destroy_adoption_blockers: >-
      {{
        (['the surviving hosts carry ' ~ (bootwright_ceph_destroy_surviving_fsids | length | string)
          ~ ' different Ceph cluster fsids (' ~ (bootwright_ceph_destroy_surviving_fsids | join(', '))
          ~ '), so they do not agree on a single cluster to resume']
         if (bootwright_ceph_destroy_surviving_fsids | default([]) | length > 1) else [])
        + (['the controller holds no ownership record at ' ~ bootwright_ceph_destroy_record_path
            ~ ', so nothing ties the surviving state to a cluster this context installed']
           if not (bootwright_ceph_destroy_record.stat.exists | default(false) | bool) else [])
        + (['the controller ownership record names fsid ' ~ (bootwright_ceph_destroy_record_fsid | default(''))
            ~ ' but the surviving hosts carry ' ~ bootwright_ceph_destroy_surviving_fsid]
           if ((bootwright_ceph_destroy_record_fsid | default('') | length > 0)
               and (bootwright_ceph_destroy_surviving_fsids | default([]) | length == 1)
               and (bootwright_ceph_destroy_record_fsid != bootwright_ceph_destroy_surviving_fsid))
           else [])
        + (['/etc/ceph/ceph.conf on the surviving hosts names fsid(s) '
            ~ (bootwright_ceph_destroy_surviving_conf_fsids | default([])
               | reject('equalto', bootwright_ceph_destroy_surviving_fsid) | join(', '))
            ~ ' that do not match the carried cluster state']
           if (bootwright_ceph_destroy_surviving_conf_fsids | default([])
               | reject('equalto', bootwright_ceph_destroy_surviving_fsid) | list | length > 0)
           else [])
        + (['an on-host ownership marker on the surviving hosts names fsid(s) '
            ~ (bootwright_ceph_destroy_surviving_marker_fsids | default([])
               | reject('equalto', bootwright_ceph_destroy_surviving_fsid) | join(', '))
            ~ ' that do not match the carried cluster state']
           if (bootwright_ceph_destroy_surviving_marker_fsids | default([])
               | reject('equalto', bootwright_ceph_destroy_surviving_fsid) | list | length > 0)
           else [])
        + (['an on-host ownership marker on the surviving hosts names cluster '
            ~ (bootwright_ceph_destroy_surviving_marker_clusters | default([])
               | reject('equalto', bootwright_selected_storage_cluster.name) | join(', '))
            ~ ' instead of ' ~ bootwright_selected_storage_cluster.name]
           if (bootwright_ceph_destroy_surviving_marker_clusters | default([])
               | reject('equalto', bootwright_selected_storage_cluster.name) | list | length > 0)
           else [])
      }}
  changed_when: false
  when:
    - inventory_hostname == bootwright_selected_storage_cluster.seedHost | default('')
    - bootwright_ceph_destroy_owned | default(false) | bool
    - bootwright_ceph_destroy_fsid | default('') | length == 0
    - bootwright_ceph_destroy_surviving_fsids | default([]) | length > 0

- name: Adopt the fsid the surviving storage hosts prove for a resumed teardown
  ansible.builtin.set_fact:
    bootwright_ceph_destroy_fsid: "{{ bootwright_ceph_destroy_surviving_fsids | first }}"
    bootwright_ceph_destroy_fsid_adopted: true
    bootwright_ceph_destroy_resume_probe_host: "{{ bootwright_ceph_destroy_surviving_hostnames | first }}"
  when:
    - inventory_hostname == bootwright_selected_storage_cluster.seedHost | default('')
    - bootwright_ceph_destroy_owned | default(false) | bool
    - bootwright_ceph_destroy_fsid | default('') | length == 0
    - bootwright_ceph_destroy_surviving_fsids | default([]) | length == 1
    - (bootwright_ceph_destroy_adoption_blockers | default([])) | length == 0

- name: Report a teardown resumed from the state its surviving hosts carry
  ansible.builtin.debug:
    msg: >-
      Resuming the teardown of {{ bootwright_selected_storage_cluster.name }} from its
      surviving hosts: seed {{ inventory_hostname }} carries no Ceph cluster state — the
      shape an interrupted teardown leaves once the seed has removed its own cluster —
      while {{ bootwright_ceph_destroy_surviving_hostnames | join(', ') }} still carry
      /var/lib/ceph/{{ bootwright_ceph_destroy_fsid }}. Every surviving host agrees on that
      single fsid, no configuration or ownership marker they hold contradicts it, and the
      controller still holds this cluster's ownership record, so the removal continues
      fsid-scoped on the surviving hosts instead of refusing.
  when:
    - inventory_hostname == bootwright_selected_storage_cluster.seedHost | default('')
    - bootwright_ceph_destroy_fsid_adopted | default(false) | bool

- name: Refuse a non-seed storage host still carrying a cluster the seed resolved no fsid for
  ansible.builtin.assert:
    that:
      - (bootwright_ceph_nonseed_unnamed_fsids | default([])) | length == 0
    fail_msg: >-
      Refusing to tear down {{ bootwright_selected_storage_cluster.name }} on
      {{ bootwright_current_storage_host.hostname }}: this node still carries Ceph cluster
      state at /var/lib/ceph/{{ bootwright_ceph_nonseed_unnamed_fsids | join(', /var/lib/ceph/') }},
      but seed {{ bootwright_selected_storage_cluster.seedHost }} resolved no cluster fsid at
      all — it holds neither /etc/ceph/ceph.conf nor a /var/lib/ceph/<fsid> directory, so this
      teardown read it as a cluster that is already gone.
      Every per-host removal is scoped to the fsid the seed resolves, so with none resolved
      this node's cluster is never removed: `cephadm rm-cluster` does not run here, the
      refusal that would catch a host with no cephadm to remove it never runs either, and the
      local-state cleanup then reads this node's own cluster as a FOREIGN co-resident cluster
      and preserves /etc/ceph and /var/lib/ceph. The seed meanwhile removes its own state and
      this cluster's ownership record, and the run reports the cluster destroyed while these
      nodes still hold it — which is what leaves a node the next apply refuses as foreign data
      and the next destroy cannot prove ownership of.
      A seed that carries nothing is evidence about the seed, not about its peers, so this
      teardown tried to resume from the surviving hosts' own evidence and could not prove a
      single owned cluster:
      {{ hostvars[bootwright_selected_storage_cluster.seedHost].bootwright_ceph_destroy_adoption_blockers
         | default(['the surviving hosts answered no evidence probe at all'], true)
         | join('; and ') }}. It stops here instead.
      Read the fsid this node holds and re-run destroy with
      `--recover-ceph-ownership {{ bootwright_selected_storage_cluster.name }}=<fsid>`, which
      reconstructs the controller record and seed marker so the teardown resolves an fsid and
      removes the cluster from every node; or remove it by hand with
      `cephadm rm-cluster --force --fsid <fsid>` on each node that still carries it
      (fsid-scoped: it stops and removes only that cluster's daemons, units and /var/lib/ceph
      state, and zaps no disk) and re-run. No --authorize token relaxes this.
  when:
    - inventory_hostname != bootwright_selected_storage_cluster.seedHost | default('')
    - hostvars[bootwright_selected_storage_cluster.seedHost].bootwright_ceph_destroy_owned | default(false) | bool
    - hostvars[bootwright_selected_storage_cluster.seedHost].bootwright_ceph_destroy_fsid | default('') | length == 0

- name: Probe the resumed cluster for a live manager from a surviving host
  ansible.builtin.command:
    argv:
      - timeout
      - --kill-after=15
      - "60"
      - cephadm
      - shell
      - --fsid
      - "{{ hostvars[bootwright_selected_storage_cluster.seedHost].bootwright_ceph_destroy_fsid | default('') }}"
      - --
      - ceph
      - fsid
  register: bootwright_ceph_resumed_fsid
  changed_when: false
  failed_when: false
  when:
    - inventory_hostname != bootwright_selected_storage_cluster.seedHost | default('')
    - hostvars[bootwright_selected_storage_cluster.seedHost].bootwright_ceph_destroy_fsid_adopted | default(false) | bool
    - hostvars[bootwright_selected_storage_cluster.seedHost].bootwright_ceph_destroy_resume_probe_host | default('') == inventory_hostname

- name: Stop the Ceph orchestrator of a resumed teardown before any host removes the cluster
  ansible.builtin.command:
    argv:
      - timeout
      - --kill-after=15
      - "120"
      - cephadm
      - shell
      - --fsid
      - "{{ hostvars[bootwright_selected_storage_cluster.seedHost].bootwright_ceph_destroy_fsid | default('') }}"
      - --
      - ceph
      - mgr
      - module
      - disable
      - cephadm
  register: bootwright_ceph_resumed_orch_disable
  changed_when: bootwright_ceph_resumed_orch_disable.rc == 0
  failed_when: false
  when:
    - inventory_hostname != bootwright_selected_storage_cluster.seedHost | default('')
    - hostvars[bootwright_selected_storage_cluster.seedHost].bootwright_ceph_destroy_fsid_adopted | default(false) | bool
    - hostvars[bootwright_selected_storage_cluster.seedHost].bootwright_ceph_destroy_resume_probe_host | default('') == inventory_hostname

- name: Refuse a resumed removal whose orchestrator can still redeploy the cluster
  ansible.builtin.assert:
    that:
      - (bootwright_ceph_resumed_orch_disable.rc | default(1) | int) == 0
    fail_msg: >-
      Refusing to resume the teardown of {{ bootwright_selected_storage_cluster.name }}
      (fsid {{ hostvars[bootwright_selected_storage_cluster.seedHost].bootwright_ceph_destroy_fsid | default('<unresolved>') }}):
      the surviving cluster answered `ceph fsid` from {{ inventory_hostname }}, so a manager
      is still running, and disabling its cephadm module exited
      {{ bootwright_ceph_resumed_orch_disable.rc | default('without running') }}
      ({{ bootwright_ceph_resumed_orch_disable.stderr | default('no diagnostic was recorded') | trim }}).
      This teardown removes the cluster one host at a time, and a cephadm module that is
      still enabled reconciles every purged host straight back: it redeploys the daemons the
      purge removed and runs ceph-volume over the OSD devices the purge just freed. Fix what
      the diagnostic names, or run
      `cephadm shell --fsid <fsid> -- ceph mgr module disable cephadm` on a surviving host by
      hand, and re-run destroy. No --authorize token relaxes this: the alternative is a
      teardown that races the orchestrator it is tearing down.
  when:
    - inventory_hostname != bootwright_selected_storage_cluster.seedHost | default('')
    - hostvars[bootwright_selected_storage_cluster.seedHost].bootwright_ceph_destroy_fsid_adopted | default(false) | bool
    - hostvars[bootwright_selected_storage_cluster.seedHost].bootwright_ceph_destroy_resume_probe_host | default('') == inventory_hostname
    - bootwright_ceph_resumed_fsid.stdout | default('') | trim | length > 0

- name: Report an orchestrator a resumed teardown could not disable on an unanswering cluster
  ansible.builtin.debug:
    msg: >-
      Could not disable the cephadm manager module of
      {{ bootwright_selected_storage_cluster.name }}
      (fsid {{ hostvars[bootwright_selected_storage_cluster.seedHost].bootwright_ceph_destroy_fsid | default('<unresolved>') }})
      from {{ inventory_hostname }}: the disable exited
      {{ bootwright_ceph_resumed_orch_disable.rc | default('without running') }}
      ({{ bootwright_ceph_resumed_orch_disable.stderr | default('no diagnostic was recorded') | trim }}),
      and `ceph fsid` did not answer from this surviving host either. Continuing: a cluster
      that answers neither probe is very likely already down — an interrupted teardown
      disables the module before the seed removes its own cluster, and the seed's mon is
      already gone — and refusing here would strand every resumed teardown. The settle gate
      re-reads every wiped device and refuses any Ceph daemon still running once every host
      has finished, before this run releases any ownership evidence.
  when:
    - inventory_hostname != bootwright_selected_storage_cluster.seedHost | default('')
    - hostvars[bootwright_selected_storage_cluster.seedHost].bootwright_ceph_destroy_fsid_adopted | default(false) | bool
    - hostvars[bootwright_selected_storage_cluster.seedHost].bootwright_ceph_destroy_resume_probe_host | default('') == inventory_hostname
    - bootwright_ceph_resumed_fsid.stdout | default('') | trim | length == 0
    - (bootwright_ceph_resumed_orch_disable.rc | default(0) | int) != 0

- name: Probe non-seed hosts for local Ceph cluster state
  ansible.builtin.stat:
    path: "/var/lib/ceph/{{ hostvars[bootwright_selected_storage_cluster.seedHost].bootwright_ceph_destroy_fsid | default('') }}"
  register: bootwright_ceph_nonseed_state_probe
  changed_when: false
  failed_when: false
  when:
    - inventory_hostname != bootwright_selected_storage_cluster.seedHost | default('')
    - hostvars[bootwright_selected_storage_cluster.seedHost].bootwright_ceph_destroy_owned | default(false) | bool
    - hostvars[bootwright_selected_storage_cluster.seedHost].bootwright_ceph_destroy_fsid | default('') | length > 0

- name: Resolve the cephadm command for the non-seed host cluster removal
  ansible.builtin.include_tasks: cephadm_command.yml
  vars:
    bootwright_ceph_destroy_host_fsid: >-
      {{ hostvars[bootwright_selected_storage_cluster.seedHost].bootwright_ceph_destroy_fsid | default('') }}
    bootwright_ceph_destroy_host_state: >-
      {{ (bootwright_ceph_nonseed_state_probe.stat | default({})).exists | default(true) }}
  when:
    - inventory_hostname != bootwright_selected_storage_cluster.seedHost | default('')
    - hostvars[bootwright_selected_storage_cluster.seedHost].bootwright_ceph_destroy_owned | default(false) | bool
    - hostvars[bootwright_selected_storage_cluster.seedHost].bootwright_ceph_destroy_fsid | default('') | length > 0

- name: Report non-seed hosts that hold no Ceph cluster state to remove
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }} carries neither
      /var/lib/ceph/{{ hostvars[bootwright_selected_storage_cluster.seedHost].bootwright_ceph_destroy_fsid | default('') }}
      nor any cephadm that could remove a cluster from it,
      so it never joined storage cluster {{ bootwright_selected_storage_cluster.name }} or was already
      removed from it: treating its cluster removal as already done. Its declared OSD devices are still
      wiped by the device steps, which fail closed on their own gates.
  when:
    - inventory_hostname != bootwright_selected_storage_cluster.seedHost | default('')
    - hostvars[bootwright_selected_storage_cluster.seedHost].bootwright_ceph_destroy_owned | default(false) | bool
    - hostvars[bootwright_selected_storage_cluster.seedHost].bootwright_ceph_destroy_fsid | default('') | length > 0
    - bootwright_ceph_destroy_cephadm | default('') | length == 0

- name: Remove cephadm cluster on non-seed hosts
  ansible.builtin.command:
    argv:
      - timeout
      - --kill-after=30
      - "1800"
      - "{{ bootwright_ceph_destroy_cephadm }}"
      - rm-cluster
      - --force
      - --zap-osds
      - --fsid
      - "{{ hostvars[bootwright_selected_storage_cluster.seedHost].bootwright_ceph_destroy_fsid | default('') }}"
  register: bootwright_cephadm_rm_cluster_nonseed
  changed_when: bootwright_cephadm_rm_cluster_nonseed.rc == 0
  failed_when: bootwright_cephadm_rm_cluster_nonseed.rc != 0
  when:
    - inventory_hostname != bootwright_selected_storage_cluster.seedHost | default('')
    - hostvars[bootwright_selected_storage_cluster.seedHost].bootwright_ceph_destroy_owned | default(false) | bool
    - hostvars[bootwright_selected_storage_cluster.seedHost].bootwright_ceph_destroy_fsid | default('') | length > 0
    - bootwright_ceph_destroy_cephadm | default('') | length > 0
