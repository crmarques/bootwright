---
- name: Read the monmap once the replacement has settled
  ansible.builtin.command:
    argv:
      - timeout
      - "--kill-after={{ bootwright_ceph_timeout_kill_after_seconds }}"
      - "{{ bootwright_ceph_probe_timeout_seconds }}"
      - cephadm
      - shell
      - --
      - ceph
      - mon
      - dump
      - --format
      - json
  register: bootwright_arbiter_final_dump
  changed_when: false
  failed_when: bootwright_arbiter_final_dump.rc | default(0) | int in [124, 137]
  retries: 12
  delay: 10
  until: >-
    (bootwright_arbiter_final_dump.rc | default(0) | int in [124, 137]) or
    (((bootwright_arbiter_final_dump.rc | default(1) | int == 0)
      or ((bootwright_arbiter_final_dump.stdout | default('', true) | regex_search('\}\\s*$')) is not none))
     and bootwright_arbiter_live_mon not in
         ((bootwright_arbiter_final_dump.stdout | default('{}', true) | from_json).mons
          | default([]) | map(attribute='name') | list))
    or ((bootwright_arbiter_final_dump.attempts | default(1) | int) >= 12)

- name: Assert the replacement arbiter holds the tiebreaker and the replaced mon is gone
  vars:
    bootwright_arbiter_final: >-
      {{ bootwright_arbiter_final_dump.stdout | default('{}', true) | from_json }}
    bootwright_arbiter_final_names: >-
      {{ (bootwright_arbiter_final_dump.stdout | default('{}', true) | from_json).mons
         | default([]) | map(attribute='name') | list }}
  ansible.builtin.assert:
    that:
      - bootwright_arbiter_final.stretch_mode | default(false) | bool
      - bootwright_arbiter_final.tiebreaker_mon | default('') == bootwright_arbiter_desired_mon
      - bootwright_arbiter_live_mon not in bootwright_arbiter_final_names
      - bootwright_arbiter_desired_mon in bootwright_arbiter_final_names
    fail_msg: >-
      Storage cluster {{ bootwright_arbiter_cluster_name }} did not settle on
      mon.{{ bootwright_arbiter_desired_mon }} as its sole stretch tiebreaker. Expected the
      monmap to keep stretch mode, name mon.{{ bootwright_arbiter_desired_mon }} as
      tiebreaker_mon, and no longer carry mon.{{ bootwright_arbiter_live_mon }}. Live mons:
      {{ bootwright_arbiter_final_names | join(', ') }}; tiebreaker:
      {{ bootwright_arbiter_final.tiebreaker_mon | default('(none)') }}. Retry with
      `{{ bootwright_mutating_invocation }}` to resume from wherever the procedure stopped.
      Live monmap: {{ bootwright_arbiter_final_dump.stdout | default('') | trim }}
    quiet: true

- name: Read the orchestrator host list once the replacement has settled
  ansible.builtin.command:
    argv:
      - timeout
      - "--kill-after={{ bootwright_ceph_timeout_kill_after_seconds }}"
      - "{{ bootwright_ceph_probe_timeout_seconds }}"
      - cephadm
      - shell
      - --
      - ceph
      - orch
      - host
      - ls
      - --format
      - json
  register: bootwright_arbiter_final_hosts
  changed_when: false
  failed_when: bootwright_arbiter_final_hosts.rc | default(0) | int in [124, 137]

- name: Assert the orchestrator no longer manages the replaced arbiter host
  vars:
    bootwright_arbiter_final_host_names: >-
      {{ bootwright_arbiter_final_hosts.stdout | default('[]', true) | from_json
         | map(attribute='hostname') | list }}
  ansible.builtin.assert:
    that:
      - bootwright_arbiter_final_hosts.rc | default(1) | int == 0
      - bootwright_arbiter_live_node not in bootwright_arbiter_final_host_names
    fail_msg: >-
      Storage cluster {{ bootwright_arbiter_cluster_name }} still manages host
      {{ bootwright_arbiter_live_node }} in `ceph orch host ls`, so the replaced arbiter
      host remains eligible for daemon placement even though its mon is gone. The
      tiebreaker has ALREADY moved to mon.{{ bootwright_arbiter_desired_mon }}. Remove the
      host with `ceph orch host rm {{ bootwright_arbiter_live_node }}`, then retry with
      `{{ bootwright_mutating_invocation }}` to finish the retirement. Hosts:
      {{ bootwright_arbiter_final_host_names | join(', ') }}
    quiet: true
  when: (bootwright_arbiter_live_node | default('') | length) > 0

- name: Report the settled stretch tiebreaker
  ansible.builtin.debug:
    msg: >-
      Storage cluster {{ bootwright_arbiter_cluster_name }} now answers with stretch
      tiebreaker mon.{{ bootwright_arbiter_desired_mon }} at
      {{ bootwright_arbiter_failure_domain }}={{ bootwright_arbiter_desired_site }};
      mon.{{ bootwright_arbiter_live_mon }} and host
      {{ bootwright_arbiter_live_node }} left the cluster.
