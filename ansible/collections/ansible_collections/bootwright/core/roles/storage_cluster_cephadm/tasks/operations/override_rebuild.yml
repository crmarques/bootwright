---
# --override may rebuild a sub-object whose IMMUTABLE identity drifted from desired —
# a pool's type/erasure profile, a CephFS's metadata pool — because Ceph cannot
# change these in place. This is DATA-DESTROYING for that sub-object, so it runs only
# under override mode and only on a proven structural mismatch against the LIVE
# cluster (the explicit op.structural carried by the rendered create operation vs the
# probed live object). A sub-object whose only drift is replica size/min-size/crush/
# application is reconciled in place by the set-* operations and is NEVER destroyed
# here. create/continue never reach this branch. After a rebuild deletes the object,
# the skip-if-exists probe below sees it absent and the create operation recreates it.
- name: Inspect existing Ceph pools for structural override rebuild
  ansible.builtin.command:
    argv:
      - ceph
      - osd
      - pool
      - ls
      - detail
      - --format
      - json
  register: bootwright_ceph_pool_detail
  changed_when: false
  failed_when: false
  when:
    - bootwright_ceph_op_idempotency_kind == 'ceph-pool'
    - (bootwright_apply_mode | default('continue')) == 'override'

- name: Resolve live Ceph pool for structural override rebuild
  ansible.builtin.set_fact:
    bootwright_ceph_op_pool_live: >-
      {{ ((bootwright_ceph_pool_detail.stdout | default('[]')) | from_json
          | selectattr('pool_name', 'equalto', bootwright_ceph_op_idempotency_name)
          | list | first | default({})) }}
  when:
    - bootwright_ceph_op_idempotency_kind == 'ceph-pool'
    - (bootwright_apply_mode | default('continue')) == 'override'

# Recreate only when the pool exists AND its live type (1=replicated, 3=erasure) no
# longer matches the desired structural type. If the live type cannot be read we do
# NOT recreate (fail-safe: fall through to the in-place reconcile, never destroy).
- name: Decide Ceph pool structural override rebuild
  ansible.builtin.set_fact:
    bootwright_ceph_op_pool_recreate: >-
      {{
        (bootwright_ceph_op_pool_live.pool_name | default('') | length > 0)
        and (
          ('erasure' if (bootwright_ceph_op_pool_live.type | default(1)) == 3 else 'replicated')
          != (bootwright_ceph_op.structural.type | default('replicated'))
        )
      }}
  when:
    - bootwright_ceph_op_idempotency_kind == 'ceph-pool'
    - (bootwright_apply_mode | default('continue')) == 'override'

- name: Rebuild structurally drifted Ceph pool for override
  when:
    - bootwright_ceph_op_idempotency_kind == 'ceph-pool'
    - (bootwright_apply_mode | default('continue')) == 'override'
    - bootwright_ceph_op_pool_recreate | default(false) | bool
  block:
    - name: Allow Ceph pool deletion for override rebuild
      ansible.builtin.command:
        argv:
          - ceph
          - config
          - set
          - mon
          - mon_allow_pool_delete
          - "true"
      changed_when: true
    - name: Destroy structurally drifted Ceph pool for override rebuild
      ansible.builtin.command:
        argv:
          - ceph
          - osd
          - pool
          - rm
          - "{{ bootwright_ceph_op_idempotency_name }}"
          - "{{ bootwright_ceph_op_idempotency_name }}"
          - --yes-i-really-really-mean-it
      register: bootwright_ceph_op_pool_rm
      changed_when: true
      failed_when: false
  always:
    # Re-disable pool deletion even if the rm failed, so a half-finished rebuild never
    # leaves the cluster permissive. Failure is surfaced by the assert below.
    - name: Re-disable Ceph pool deletion after override rebuild
      ansible.builtin.command:
        argv:
          - ceph
          - config
          - set
          - mon
          - mon_allow_pool_delete
          - "false"
      changed_when: true

- name: Fail closed when override Ceph pool deletion failed
  ansible.builtin.assert:
    that:
      - bootwright_ceph_op_pool_rm.rc | default(1) == 0
    fail_msg: >-
      Failed to delete structurally drifted Ceph pool
      {{ bootwright_ceph_op_idempotency_name }} for an --override rebuild; refusing to
      continue with the pool partly removed.
  when:
    - bootwright_ceph_op_idempotency_kind == 'ceph-pool'
    - (bootwright_apply_mode | default('continue')) == 'override'
    - bootwright_ceph_op_pool_recreate | default(false) | bool

- name: Inspect existing CephFS for structural override rebuild
  ansible.builtin.command:
    argv:
      - ceph
      - fs
      - ls
      - --format
      - json
  register: bootwright_ceph_fs_detail
  changed_when: false
  failed_when: false
  when:
    - bootwright_ceph_op_idempotency_kind == 'cephfs'
    - (bootwright_apply_mode | default('continue')) == 'override'

- name: Resolve live CephFS for structural override rebuild
  ansible.builtin.set_fact:
    bootwright_ceph_op_fs_live: >-
      {{ ((bootwright_ceph_fs_detail.stdout | default('[]')) | from_json
          | selectattr('name', 'equalto', bootwright_ceph_op_idempotency_name)
          | list | first | default({})) }}
  when:
    - bootwright_ceph_op_idempotency_kind == 'cephfs'
    - (bootwright_apply_mode | default('continue')) == 'override'

# Recreate only when the filesystem exists AND its live metadata pool is readable AND
# differs from desired. An unreadable live metadata pool does NOT recreate (fail-safe).
- name: Decide CephFS structural override rebuild
  ansible.builtin.set_fact:
    bootwright_ceph_op_fs_recreate: >-
      {{
        (bootwright_ceph_op_fs_live.name | default('') | length > 0)
        and (bootwright_ceph_op_fs_live.metadata_pool | default('') | length > 0)
        and (bootwright_ceph_op_fs_live.metadata_pool | default('')
             != bootwright_ceph_op.structural.metadataPool | default(''))
      }}
  when:
    - bootwright_ceph_op_idempotency_kind == 'cephfs'
    - (bootwright_apply_mode | default('continue')) == 'override'

- name: Rebuild structurally drifted CephFS for override
  when:
    - bootwright_ceph_op_idempotency_kind == 'cephfs'
    - (bootwright_apply_mode | default('continue')) == 'override'
    - bootwright_ceph_op_fs_recreate | default(false) | bool
  block:
    - name: Fail drifted CephFS before override rebuild
      ansible.builtin.command:
        argv:
          - ceph
          - fs
          - fail
          - "{{ bootwright_ceph_op_idempotency_name }}"
      changed_when: true
      failed_when: false
    - name: Destroy structurally drifted CephFS for override rebuild
      ansible.builtin.command:
        argv:
          - ceph
          - fs
          - rm
          - "{{ bootwright_ceph_op_idempotency_name }}"
          - --yes-i-really-really-mean-it
      register: bootwright_ceph_op_fs_rm
      changed_when: true
      failed_when: bootwright_ceph_op_fs_rm.rc != 0

# --override may rebuild an erasure-coded pool whose IMMUTABLE EC profile drifted
# from desired (k/m/plugin/technique/crush-*/stripe_unit/opaque parameters). Ceph
# cannot change an EC profile in place, and the profile cannot be removed while a
# pool uses it, so the rebuild runs at THIS op (the profile create precedes the
# pool create): tear down the one pool that uses the profile (DATA-DESTROYING for
# that pool), delete the stale profile, and let this op's idempotency probe see the
# profile absent and recreate it (with its full topology-derived command), and the
# create-pool op recreate the pool against the new profile. A profile whose authored
# fields all match, or whose live state cannot be read, is left untouched (fail-safe:
# never destroy). create/continue never reach this branch.
- name: Inspect existing Ceph erasure-code profile for structural override rebuild
  ansible.builtin.command:
    argv:
      - ceph
      - osd
      - erasure-code-profile
      - get
      - "{{ bootwright_ceph_op.structural.profile }}"
      - --format
      - json
  register: bootwright_ceph_ec_profile_detail
  changed_when: false
  failed_when: false
  when:
    - bootwright_ceph_op_idempotency_kind == 'ec-profile'
    - (bootwright_apply_mode | default('continue')) == 'override'

- name: Resolve live Ceph erasure-code profile for structural override rebuild
  ansible.builtin.set_fact:
    bootwright_ceph_op_ec_live: >-
      {{ ((bootwright_ceph_ec_profile_detail.stdout | default('')) | trim
          | default('{}', true)) | from_json }}
  when:
    - bootwright_ceph_op_idempotency_kind == 'ec-profile'
    - (bootwright_apply_mode | default('continue')) == 'override'

# Recreate only when the profile exists (readable) AND at least one authored field
# differs from its live value. The live profile is narrowed to the authored keys
# before the compare, so Ceph's defaulted keys (w, packetsize, ...) never force a
# rebuild; an authored key missing from the live profile reads as a mismatch. An
# unreadable/absent profile does NOT recreate (fail-safe: a missing profile is just
# a create, never a destructive rebuild).
- name: Decide Ceph erasure-code profile structural override rebuild
  ansible.builtin.set_fact:
    bootwright_ceph_op_ec_recreate: >-
      {{
        (bootwright_ceph_op_ec_live | length > 0)
        and (
          (bootwright_ceph_op_ec_live | combine(bootwright_ceph_op.structural.fields))
          != bootwright_ceph_op_ec_live
        )
      }}
  when:
    - bootwright_ceph_op_idempotency_kind == 'ec-profile'
    - (bootwright_apply_mode | default('continue')) == 'override'

- name: Rebuild structurally drifted erasure-coded pool for override
  when:
    - bootwright_ceph_op_idempotency_kind == 'ec-profile'
    - (bootwright_apply_mode | default('continue')) == 'override'
    - bootwright_ceph_op_ec_recreate | default(false) | bool
  block:
    - name: Allow Ceph pool deletion for erasure-code profile override rebuild
      ansible.builtin.command:
        argv:
          - ceph
          - config
          - set
          - mon
          - mon_allow_pool_delete
          - "true"
      changed_when: true
    - name: Destroy pool using structurally drifted erasure-code profile
      ansible.builtin.command:
        argv:
          - ceph
          - osd
          - pool
          - rm
          - "{{ bootwright_ceph_op.structural.pool }}"
          - "{{ bootwright_ceph_op.structural.pool }}"
          - --yes-i-really-really-mean-it
      register: bootwright_ceph_op_ec_pool_rm
      changed_when: true
      failed_when: false
  always:
    # Re-disable pool deletion even if the rm failed, so a half-finished rebuild
    # never leaves the cluster permissive. Failure is surfaced by the assert below.
    - name: Re-disable Ceph pool deletion after erasure-code profile override rebuild
      ansible.builtin.command:
        argv:
          - ceph
          - config
          - set
          - mon
          - mon_allow_pool_delete
          - "false"
      changed_when: true

- name: Fail closed when erasure-code profile override pool deletion failed
  ansible.builtin.assert:
    that:
      - bootwright_ceph_op_ec_pool_rm.rc | default(1) == 0
    fail_msg: >-
      Failed to delete pool {{ bootwright_ceph_op.structural.pool }} that uses the
      structurally drifted erasure-code profile {{ bootwright_ceph_op.structural.profile }}
      for an --override rebuild; refusing to continue with the pool partly removed.
  when:
    - bootwright_ceph_op_idempotency_kind == 'ec-profile'
    - (bootwright_apply_mode | default('continue')) == 'override'
    - bootwright_ceph_op_ec_recreate | default(false) | bool

# With the pool gone the profile is unused and can be deleted; this op's idempotency
# probe then sees it absent and recreates it with the desired fields, and the
# create-pool op recreates the pool against the new profile.
- name: Delete structurally drifted erasure-code profile for override rebuild
  ansible.builtin.command:
    argv:
      - ceph
      - osd
      - erasure-code-profile
      - rm
      - "{{ bootwright_ceph_op.structural.profile }}"
  register: bootwright_ceph_op_ec_profile_rm
  changed_when: true
  failed_when: bootwright_ceph_op_ec_profile_rm.rc != 0
  when:
    - bootwright_ceph_op_idempotency_kind == 'ec-profile'
    - (bootwright_apply_mode | default('continue')) == 'override'
    - bootwright_ceph_op_ec_recreate | default(false) | bool
