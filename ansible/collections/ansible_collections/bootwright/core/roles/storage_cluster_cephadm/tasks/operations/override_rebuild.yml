---
- name: Inspect existing Ceph pools for structural override rebuild
  ansible.builtin.command:
    argv:
      - cephadm
      - shell
      - --
      - ceph
      - osd
      - pool
      - ls
      - detail
      - --format
      - json
  register: bootwright_ceph_pool_detail
  changed_when: false
  failed_when: false
  when:
    - bootwright_ceph_op_idempotency_kind == 'ceph-pool'
    - (bootwright_apply_mode | default('continue')) == 'override'

- name: Resolve live Ceph pool for structural override rebuild
  ansible.builtin.set_fact:
    bootwright_ceph_op_pool_live: >-
      {{ ((bootwright_ceph_pool_detail.stdout | default('[]')) | from_json
          | selectattr('pool_name', 'equalto', bootwright_ceph_op_idempotency_name)
          | list | first | default({})) }}
  when:
    - bootwright_ceph_op_idempotency_kind == 'ceph-pool'
    - (bootwright_apply_mode | default('continue')) == 'override'

- name: Decide Ceph pool structural override rebuild
  ansible.builtin.set_fact:
    bootwright_ceph_op_pool_recreate: >-
      {{
        (bootwright_ceph_op_pool_live.pool_name | default('') | length > 0)
        and (
          ('erasure' if (bootwright_ceph_op_pool_live.type | default(1)) == 3 else 'replicated')
          != (bootwright_ceph_op.structural.type | default('replicated'))
        )
      }}
  when:
    - bootwright_ceph_op_idempotency_kind == 'ceph-pool'
    - (bootwright_apply_mode | default('continue')) == 'override'

- name: Decide whether the controller acknowledged destroying this Ceph pool
  ansible.builtin.set_fact:
    bootwright_ceph_op_pool_rebuild_acked: >-
      {{
        (bootwright_ceph_op_idempotency_name | default('') | length > 0)
        and (
          (bootwright_selected_storage_cluster.name ~ '/' ~ bootwright_ceph_op_idempotency_name)
          in (bootwright_ceph_subobject_rebuild_authorized | default('') | split(','))
        )
      }}
  when:
    - bootwright_ceph_op_idempotency_kind == 'ceph-pool'
    - (bootwright_apply_mode | default('continue')) == 'override'

- name: Refuse unacknowledged Ceph pool destroy for override rebuild
  ansible.builtin.assert:
    that:
      - >-
        (not (bootwright_ceph_op_pool_recreate | default(false) | bool))
        or (bootwright_ceph_op_pool_rebuild_acked | default(false) | bool)
    fail_msg: >-
      Ceph pool {{ bootwright_ceph_op_idempotency_name }} on storage cluster
      {{ bootwright_selected_storage_cluster.name }} structurally drifted on the live
      cluster but its destructive rebuild was not acknowledged — --yes/--converge-drifted alone
      never authorize data loss (the live pool no longer matches the recorded state,
      e.g. it changed out-of-band or the converge records were lost). Re-run
      `bootwright apply --converge-drifted --confirm-data-loss --clusters
      {{ bootwright_selected_storage_cluster.name }}` to authorize destroying and
      recreating the pool, or align the desired spec with the live pool.
  when:
    - bootwright_ceph_op_idempotency_kind == 'ceph-pool'
    - (bootwright_apply_mode | default('continue')) == 'override'

- name: Rebuild structurally drifted Ceph pool for override
  when:
    - bootwright_ceph_op_idempotency_kind == 'ceph-pool'
    - (bootwright_apply_mode | default('continue')) == 'override'
    - bootwright_ceph_op_pool_recreate | default(false) | bool
    - bootwright_ceph_op_pool_rebuild_acked | default(false) | bool
  block:
    - name: Allow Ceph pool deletion for override rebuild
      ansible.builtin.command:
        argv:
          - cephadm
          - shell
          - --
          - ceph
          - config
          - set
          - mon
          - mon_allow_pool_delete
          - "true"
      changed_when: true
    - name: Destroy structurally drifted Ceph pool for override rebuild
      ansible.builtin.command:
        argv:
          - cephadm
          - shell
          - --
          - ceph
          - osd
          - pool
          - rm
          - "{{ bootwright_ceph_op_idempotency_name }}"
          - "{{ bootwright_ceph_op_idempotency_name }}"
          - --yes-i-really-really-mean-it
      register: bootwright_ceph_op_pool_rm
      changed_when: true
      failed_when: false
  always:
    - name: Re-disable Ceph pool deletion after override rebuild
      ansible.builtin.command:
        argv:
          - cephadm
          - shell
          - --
          - ceph
          - config
          - set
          - mon
          - mon_allow_pool_delete
          - "false"
      changed_when: true

- name: Fail closed when override Ceph pool deletion failed
  ansible.builtin.assert:
    that:
      - bootwright_ceph_op_pool_rm.rc | default(1) == 0
    fail_msg: >-
      Failed to delete structurally drifted Ceph pool
      {{ bootwright_ceph_op_idempotency_name }} for an --converge-drifted rebuild; refusing to
      continue with the pool partly removed.
  when:
    - bootwright_ceph_op_idempotency_kind == 'ceph-pool'
    - (bootwright_apply_mode | default('continue')) == 'override'
    - bootwright_ceph_op_pool_recreate | default(false) | bool
    - bootwright_ceph_op_pool_rebuild_acked | default(false) | bool

- name: Inspect existing CephFS for structural override rebuild
  ansible.builtin.command:
    argv:
      - cephadm
      - shell
      - --
      - ceph
      - fs
      - ls
      - --format
      - json
  register: bootwright_ceph_fs_detail
  changed_when: false
  failed_when: false
  when:
    - bootwright_ceph_op_idempotency_kind == 'cephfs'
    - (bootwright_apply_mode | default('continue')) == 'override'

- name: Resolve live CephFS for structural override rebuild
  ansible.builtin.set_fact:
    bootwright_ceph_op_fs_live: >-
      {{ ((bootwright_ceph_fs_detail.stdout | default('[]')) | from_json
          | selectattr('name', 'equalto', bootwright_ceph_op_idempotency_name)
          | list | first | default({})) }}
  when:
    - bootwright_ceph_op_idempotency_kind == 'cephfs'
    - (bootwright_apply_mode | default('continue')) == 'override'

- name: Inspect existing CephFS detail for default-data-pool override rebuild
  ansible.builtin.command:
    argv:
      - cephadm
      - shell
      - --
      - ceph
      - fs
      - get
      - "{{ bootwright_ceph_op_idempotency_name }}"
      - --format
      - json
  register: bootwright_ceph_fs_get_detail
  changed_when: false
  failed_when: false
  when:
    - bootwright_ceph_op_idempotency_kind == 'cephfs'
    - (bootwright_apply_mode | default('continue')) == 'override'

- name: Inspect Ceph pools for CephFS default-data-pool resolution
  ansible.builtin.command:
    argv:
      - cephadm
      - shell
      - --
      - ceph
      - osd
      - pool
      - ls
      - detail
      - --format
      - json
  register: bootwright_ceph_fs_pool_detail
  changed_when: false
  failed_when: false
  when:
    - bootwright_ceph_op_idempotency_kind == 'cephfs'
    - (bootwright_apply_mode | default('continue')) == 'override'

- name: Resolve live CephFS default data pool for structural override rebuild
  ansible.builtin.set_fact:
    bootwright_ceph_op_fs_default_pool_live: >-
      {{ ((bootwright_ceph_fs_pool_detail.stdout | default('[]')) | from_json)
         | selectattr('pool_id', 'equalto',
             (((((bootwright_ceph_fs_get_detail.stdout | default('{}')) | from_json).mdsmap
                | default({})).data_pools | default([])) | first | default(-1)))
         | map(attribute='pool_name') | list | first | default('') }}
  when:
    - bootwright_ceph_op_idempotency_kind == 'cephfs'
    - (bootwright_apply_mode | default('continue')) == 'override'

- name: Decide CephFS structural override rebuild
  ansible.builtin.set_fact:
    bootwright_ceph_op_fs_recreate: >-
      {{
        (bootwright_ceph_op_fs_live.name | default('') | length > 0)
        and (
          (
            (bootwright_ceph_op_fs_live.metadata_pool | default('') | length > 0)
            and (bootwright_ceph_op_fs_live.metadata_pool | default('')
                 != bootwright_ceph_op.structural.metadataPool | default(''))
          )
          or (
            (bootwright_ceph_op_fs_default_pool_live | default('') | length > 0)
            and (bootwright_ceph_op_fs_default_pool_live | default('')
                 != bootwright_ceph_op.structural.defaultDataPool | default(''))
          )
        )
      }}
  when:
    - bootwright_ceph_op_idempotency_kind == 'cephfs'
    - (bootwright_apply_mode | default('continue')) == 'override'

- name: Decide whether the controller acknowledged destroying this CephFS
  ansible.builtin.set_fact:
    bootwright_ceph_op_fs_rebuild_acked: >-
      {{
        (bootwright_ceph_op_idempotency_name | default('') | length > 0)
        and (
          (bootwright_selected_storage_cluster.name ~ '/' ~ bootwright_ceph_op_idempotency_name)
          in (bootwright_ceph_subobject_rebuild_authorized | default('') | split(','))
        )
      }}
  when:
    - bootwright_ceph_op_idempotency_kind == 'cephfs'
    - (bootwright_apply_mode | default('continue')) == 'override'

- name: Refuse unacknowledged CephFS destroy for override rebuild
  ansible.builtin.assert:
    that:
      - >-
        (not (bootwright_ceph_op_fs_recreate | default(false) | bool))
        or (bootwright_ceph_op_fs_rebuild_acked | default(false) | bool)
    fail_msg: >-
      CephFS {{ bootwright_ceph_op_idempotency_name }} on storage cluster
      {{ bootwright_selected_storage_cluster.name }} structurally drifted on the live
      cluster but its destructive rebuild was not acknowledged — --yes/--converge-drifted alone
      never authorize data loss (the live filesystem no longer matches the recorded
      state, e.g. it changed out-of-band or the converge records were lost). Re-run
      `bootwright apply --converge-drifted --confirm-data-loss --clusters
      {{ bootwright_selected_storage_cluster.name }}` to authorize destroying and
      recreating the filesystem, or align the desired spec with the live filesystem.
  when:
    - bootwright_ceph_op_idempotency_kind == 'cephfs'
    - (bootwright_apply_mode | default('continue')) == 'override'

- name: Rebuild structurally drifted CephFS for override
  when:
    - bootwright_ceph_op_idempotency_kind == 'cephfs'
    - (bootwright_apply_mode | default('continue')) == 'override'
    - bootwright_ceph_op_fs_recreate | default(false) | bool
    - bootwright_ceph_op_fs_rebuild_acked | default(false) | bool
  block:
    - name: Fail drifted CephFS before override rebuild
      ansible.builtin.command:
        argv:
          - cephadm
          - shell
          - --
          - ceph
          - fs
          - fail
          - "{{ bootwright_ceph_op_idempotency_name }}"
      changed_when: true
      failed_when: false
    - name: Destroy structurally drifted CephFS for override rebuild
      ansible.builtin.command:
        argv:
          - cephadm
          - shell
          - --
          - ceph
          - fs
          - rm
          - "{{ bootwright_ceph_op_idempotency_name }}"
          - --yes-i-really-really-mean-it
      register: bootwright_ceph_op_fs_rm
      changed_when: true
      failed_when: bootwright_ceph_op_fs_rm.rc != 0

- name: Inspect existing Ceph erasure-code profile for structural override rebuild
  ansible.builtin.command:
    argv:
      - cephadm
      - shell
      - --
      - ceph
      - osd
      - erasure-code-profile
      - get
      - "{{ bootwright_ceph_op.structural.profile }}"
      - --format
      - json
  register: bootwright_ceph_ec_profile_detail
  changed_when: false
  failed_when: false
  when:
    - bootwright_ceph_op_idempotency_kind == 'ec-profile'
    - (bootwright_apply_mode | default('continue')) == 'override'

- name: Resolve live Ceph erasure-code profile for structural override rebuild
  ansible.builtin.set_fact:
    bootwright_ceph_op_ec_live: >-
      {{ ((bootwright_ceph_ec_profile_detail.stdout | default('')) | trim
          | default('{}', true)) | from_json }}
  when:
    - bootwright_ceph_op_idempotency_kind == 'ec-profile'
    - (bootwright_apply_mode | default('continue')) == 'override'

- name: Decide Ceph erasure-code profile structural override rebuild
  ansible.builtin.set_fact:
    bootwright_ceph_op_ec_recreate: >-
      {{
        (bootwright_ceph_op_ec_live | length > 0)
        and (
          (bootwright_ceph_op_ec_live | combine(bootwright_ceph_op.structural.fields))
          != bootwright_ceph_op_ec_live
        )
      }}
  when:
    - bootwright_ceph_op_idempotency_kind == 'ec-profile'
    - (bootwright_apply_mode | default('continue')) == 'override'

- name: Decide whether the controller acknowledged destroying the erasure-coded pool
  ansible.builtin.set_fact:
    bootwright_ceph_op_ec_rebuild_acked: >-
      {{
        (bootwright_ceph_op.structural.pool | default('') | length > 0)
        and (
          (bootwright_selected_storage_cluster.name ~ '/' ~ bootwright_ceph_op.structural.pool)
          in (bootwright_ceph_subobject_rebuild_authorized | default('') | split(','))
        )
      }}
  when:
    - bootwright_ceph_op_idempotency_kind == 'ec-profile'
    - (bootwright_apply_mode | default('continue')) == 'override'

- name: Refuse unacknowledged erasure-coded pool destroy for override rebuild
  ansible.builtin.assert:
    that:
      - >-
        (not (bootwright_ceph_op_ec_recreate | default(false) | bool))
        or (bootwright_ceph_op_ec_rebuild_acked | default(false) | bool)
    fail_msg: >-
      Erasure-code profile {{ bootwright_ceph_op.structural.profile }} on storage cluster
      {{ bootwright_selected_storage_cluster.name }} structurally drifted on the live
      cluster but destroying its dependent pool {{ bootwright_ceph_op.structural.pool }}
      was not acknowledged — --yes/--converge-drifted alone never authorize data loss (the live
      profile no longer matches the recorded state, e.g. it changed out-of-band or the
      converge records were lost). Re-run `bootwright apply --converge-drifted --confirm-data-loss
      --clusters {{ bootwright_selected_storage_cluster.name }}` to authorize destroying
      and recreating the pool, or align the desired spec with the live profile.
  when:
    - bootwright_ceph_op_idempotency_kind == 'ec-profile'
    - (bootwright_apply_mode | default('continue')) == 'override'

- name: Rebuild structurally drifted erasure-coded pool for override
  when:
    - bootwright_ceph_op_idempotency_kind == 'ec-profile'
    - (bootwright_apply_mode | default('continue')) == 'override'
    - bootwright_ceph_op_ec_recreate | default(false) | bool
    - bootwright_ceph_op_ec_rebuild_acked | default(false) | bool
  block:
    - name: Allow Ceph pool deletion for erasure-code profile override rebuild
      ansible.builtin.command:
        argv:
          - cephadm
          - shell
          - --
          - ceph
          - config
          - set
          - mon
          - mon_allow_pool_delete
          - "true"
      changed_when: true
    - name: Destroy pool using structurally drifted erasure-code profile
      ansible.builtin.command:
        argv:
          - cephadm
          - shell
          - --
          - ceph
          - osd
          - pool
          - rm
          - "{{ bootwright_ceph_op.structural.pool }}"
          - "{{ bootwright_ceph_op.structural.pool }}"
          - --yes-i-really-really-mean-it
      register: bootwright_ceph_op_ec_pool_rm
      changed_when: true
      failed_when: false
  always:
    - name: Re-disable Ceph pool deletion after erasure-code profile override rebuild
      ansible.builtin.command:
        argv:
          - cephadm
          - shell
          - --
          - ceph
          - config
          - set
          - mon
          - mon_allow_pool_delete
          - "false"
      changed_when: true

- name: Fail closed when erasure-code profile override pool deletion failed
  ansible.builtin.assert:
    that:
      - bootwright_ceph_op_ec_pool_rm.rc | default(1) == 0
    fail_msg: >-
      Failed to delete pool {{ bootwright_ceph_op.structural.pool }} that uses the
      structurally drifted erasure-code profile {{ bootwright_ceph_op.structural.profile }}
      for an --converge-drifted rebuild; refusing to continue with the pool partly removed.
  when:
    - bootwright_ceph_op_idempotency_kind == 'ec-profile'
    - (bootwright_apply_mode | default('continue')) == 'override'
    - bootwright_ceph_op_ec_recreate | default(false) | bool
    - bootwright_ceph_op_ec_rebuild_acked | default(false) | bool

- name: Delete structurally drifted erasure-code profile for override rebuild
  ansible.builtin.command:
    argv:
      - cephadm
      - shell
      - --
      - ceph
      - osd
      - erasure-code-profile
      - rm
      - "{{ bootwright_ceph_op.structural.profile }}"
  register: bootwright_ceph_op_ec_profile_rm
  changed_when: true
  failed_when: bootwright_ceph_op_ec_profile_rm.rc != 0
  when:
    - bootwright_ceph_op_idempotency_kind == 'ec-profile'
    - (bootwright_apply_mode | default('continue')) == 'override'
    - bootwright_ceph_op_ec_recreate | default(false) | bool
    - bootwright_ceph_op_ec_rebuild_acked | default(false) | bool
