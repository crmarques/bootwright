---
- name: Probe cephadm CLI before package fallback
  ansible.builtin.command:
    argv:
      - cephadm
      - version
  register: bootwright_cephadm_initial_probe
  changed_when: false
  failed_when: false

- name: Gather installed package facts before pinning the cephadm build
  ansible.builtin.package_facts:
    manager: auto
  when: bootwright_ceph_provider.cephadmPackageSpec | default('') | length > 0

- name: Install cephadm package on storage node when not preinstalled
  ansible.builtin.package:
    name: "{{ bootwright_ceph_provider.cephadmPackage | default('cephadm') }}"
    state: present
  register: bootwright_cephadm_package_install
  failed_when: false
  when:
    - bootwright_ceph_provider.cephadmPackageSpec | default('') | length == 0
    - bootwright_cephadm_initial_probe.rc | default(1) != 0

- name: Install the pinned cephadm build on storage node
  ansible.builtin.dnf:
    name: "{{ bootwright_ceph_provider.cephadmPackageSpec }}"
    state: present
    allow_downgrade: false
  register: bootwright_cephadm_pinned_install
  when: bootwright_ceph_provider.cephadmPackageSpec | default('') | length > 0

- name: Read installed cephadm package coordinates after pinning
  ansible.builtin.command:
    argv:
      - rpm
      - -q
      - --qf
      - "%{VERSION}\n%{VERSION}-%{RELEASE}\n%{EPOCHNUM}:%{VERSION}\n%{EPOCHNUM}:%{VERSION}-%{RELEASE}\n"
      - "{{ bootwright_ceph_provider.cephadmPackage | default('cephadm') }}"
  register: bootwright_cephadm_installed_coordinates
  changed_when: false
  failed_when: false
  when: bootwright_ceph_provider.cephadmPackageSpec | default('') | length > 0

- name: Require the installed cephadm package to equal the declared build
  ansible.builtin.assert:
    that:
      - bootwright_cephadm_installed_coordinates.rc | default(1) | int == 0
      - >-
        bootwright_ceph_provider.cephadmPackageSpec
        | regex_replace('^' ~ (bootwright_ceph_provider.cephadmPackage | default('cephadm') | regex_escape) ~ '-', '')
        in (bootwright_cephadm_installed_coordinates.stdout_lines | default([]))
    fail_msg: >-
      Storage node {{ bootwright_current_storage_host.hostname }} does not run the
      cephadm build declared by spec.ceph.packageVersion. The declaration resolves to
      {{ bootwright_ceph_provider.cephadmPackageSpec }}, while rpm reports
      {{ bootwright_cephadm_installed_coordinates.stdout_lines | default([]) | join(', ') }}.
      Bootwright refuses to downgrade Ceph software because the vendor supports upgrades,
      not in-place downgrades. Use this release only on a new cluster, or declare the
      installed/newer supported release and follow the vendor's upgrade procedure.
    quiet: true
  when: bootwright_ceph_provider.cephadmPackageSpec | default('') | length > 0

- name: Create cephadm package ownership directory
  ansible.builtin.file:
    path: "{{ bootwright_ownership_dir }}/packages/{{ inventory_hostname }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: (bootwright_cephadm_package_install.changed | default(false)) or (bootwright_cephadm_pinned_install.changed | default(false))

- name: Write cephadm package ownership record
  ansible.builtin.include_role:
    name: bootwright.core.ownership_record
    tasks_from: package_apply_one.yml
  vars:
    bootwright_ownership_package_name: "{{ bootwright_ceph_provider.cephadmPackage | default('cephadm') }}"
    bootwright_ownership_required_by: "storage-cluster:{{ bootwright_selected_storage_cluster.name }}"
  when: (bootwright_cephadm_package_install.changed | default(false)) or (bootwright_cephadm_pinned_install.changed | default(false))

- name: Verify cephadm CLI on storage node
  ansible.builtin.command:
    argv:
      - cephadm
      - version
  register: bootwright_cephadm_version
  changed_when: false
  failed_when: false

- name: Fail when cephadm CLI is unavailable
  ansible.builtin.assert:
    that:
      - bootwright_cephadm_version.rc == 0
    fail_msg: >-
      cephadm CLI is required on storage node {{ bootwright_current_storage_host.hostname }} for Ceph
      distribution {{ bootwright_ceph_provider_name }}. Check the referenced Environment entitlement,
      provider repositories, spec.ceph.ibm.packages.subscriptionRepos when the IBM package source is
      subscription, managed OS MachineInstallProfile repositories, preinstalled host packages,
      or — with rhsm management external — that your registration provisioning playbook enabled
      repositories providing the Ceph packages.
      Package fallback result: {{ (bootwright_cephadm_package_install | default({})).msg | default('not attempted') }}

- name: Authorize cephadm cluster SSH key on storage node
  ansible.posix.authorized_key:
    user: "{{ bootwright_selected_storage_cluster.clusterSSH.user }}"
    key: "{{ lookup('ansible.builtin.file', bootwright_selected_storage_cluster.clusterSSH.publicKeyPath) }}"
    state: present
    manage_dir: true
  no_log: "{{ bootwright_no_log | default(true) | bool }}"
  when:
    - bootwright_selected_storage_cluster.clusterSSH.publicKeyPath | default('') | length > 0

- name: Read Bootwright OSD device ownership marker
  ansible.builtin.slurp:
    src: "{{ bootwright_ceph_osd_marker_path }}"
  register: bootwright_ceph_osd_marker_probe
  changed_when: false
  failed_when: false

- name: Resolve devices recorded as Bootwright OSDs for this cluster
  ansible.builtin.set_fact:
    bootwright_ceph_owned_osd_devices: >-
      {{ bootwright_ceph_osd_marker_doc.devices | default([])
         if (bootwright_ceph_osd_marker_doc.manager | default('') == 'bootwright'
             and bootwright_ceph_osd_marker_doc.cluster | default('') == bootwright_selected_storage_cluster.name
             and bootwright_ceph_osd_marker_doc.node | default('') == bootwright_current_storage_host.hostname)
         else [] }}
  vars:
    bootwright_ceph_osd_marker_doc: "{{ bootwright_ceph_osd_marker_probe.content | b64decode | from_json }}"
  when: (bootwright_ceph_osd_marker_probe | default({})).content is defined

- name: Resolve OSD devices to reclaim on this host
  ansible.builtin.set_fact:
    bootwright_ceph_reclaim_here: >-
      {{ (bootwright_current_storage_host.devices | default([]))
         | intersect(bootwright_ceph_reclaim_devices | default('') | split(',')
                     | map('trim') | reject('equalto', '') | list)
         | difference(bootwright_ceph_owned_osd_devices | default([])) }}
  when:
    - bootwright_current_storage_host.devices | default([]) | length > 0
    - >-
      bootwright_selected_storage_cluster.name
      in (bootwright_ceph_reclaim_clusters | default('') | split(',') | map('trim') | reject('equalto', '') | list)

- name: Probe reclaim devices for active mounts
  ansible.builtin.command:
    argv:
      - lsblk
      - --noheadings
      - --output
      - MOUNTPOINT
      - "{{ item }}"
  register: bootwright_ceph_reclaim_mounts
  changed_when: false
  failed_when: false
  loop: "{{ bootwright_ceph_reclaim_here | default([]) }}"
  loop_control:
    label: "{{ bootwright_current_storage_host.hostname }} {{ item }}"

- name: Classify reclaim devices by presence
  ansible.builtin.set_fact:
    bootwright_ceph_reclaim_present_probe: >-
      {{ bootwright_ceph_reclaim_mounts.results | default([]) | selectattr('rc', 'equalto', 0) | list }}
    bootwright_ceph_reclaim_present: >-
      {{ bootwright_ceph_reclaim_mounts.results | default([]) | selectattr('rc', 'equalto', 0)
         | map(attribute='item') | list }}
    bootwright_ceph_reclaim_absent: >-
      {{ bootwright_ceph_reclaim_mounts.results | default([]) | rejectattr('rc', 'equalto', 0)
         | selectattr('stderr', 'defined')
         | selectattr('stderr', 'search', 'not a block device|No such file or directory')
         | map(attribute='item') | list }}
  changed_when: false

- name: Resolve reclaim devices that could not be probed
  ansible.builtin.set_fact:
    bootwright_ceph_reclaim_unprobeable: >-
      {{ (bootwright_ceph_reclaim_mounts.results | default([]) | rejectattr('rc', 'equalto', 0)
          | map(attribute='item') | list)
         | difference(bootwright_ceph_reclaim_absent | default([])) }}
  changed_when: false

- name: Refuse to reclaim a device that could not be probed
  ansible.builtin.assert:
    that:
      - (bootwright_ceph_reclaim_unprobeable | default([])) | length == 0
    fail_msg: >-
      Refusing to reclaim device(s)
      {{ bootwright_ceph_reclaim_unprobeable | default([]) | join(', ') }}
      on {{ bootwright_current_storage_host.hostname }}: lsblk could not probe them
      (a non-zero exit other than "not a block device"). Failing closed rather than risk
      wiping the wrong device. No --authorize token relaxes this.
    quiet: true

- name: Report reclaim devices absent from this host
  ansible.builtin.debug:
    msg: >-
      Skipping declared OSD device(s)
      {{ bootwright_ceph_reclaim_absent | default([]) | join(', ') }}
      on {{ bootwright_current_storage_host.hostname }}: --reclaim-devices named them but
      they are not block devices on this host, so there is nothing to wipe. A declared
      device that is absent everywhere is a declaration that does not match the hardware —
      the OSD readiness gate fails later with fewer OSDs than declared. Confirm the real
      device names on the node (`lsblk -dno NAME,SIZE,TYPE`) and correct
      spec.ceph.topology.nodes[].devices.
  when: (bootwright_ceph_reclaim_absent | default([])) | length > 0

- name: Refuse to reclaim a mounted or in-use device
  ansible.builtin.assert:
    that:
      - (item.stdout_lines | default([]) | map('trim') | reject('equalto', '') | list | length) == 0
    fail_msg: >-
      Refusing to reclaim {{ item.item }} on {{ bootwright_current_storage_host.hostname }}:
      it is mounted or in use
      ({{ item.stdout_lines | default([]) | map('trim') | reject('equalto', '') | list | join(', ') }}),
      so it is not a wipeable OSD data disk. --reclaim-devices only wipes an unmounted,
      non-system disk. No --authorize token relaxes this.
    quiet: true
  loop: "{{ bootwright_ceph_reclaim_present_probe | default([]) }}"
  loop_control:
    label: "{{ bootwright_current_storage_host.hostname }} {{ item.item }}"

- name: Probe reclaim devices for active LVM or crypt holders
  ansible.builtin.command:
    argv:
      - lsblk
      - --noheadings
      - --output
      - TYPE
      - "{{ item }}"
  register: bootwright_ceph_reclaim_holders
  changed_when: false
  failed_when: false
  loop: "{{ bootwright_ceph_reclaim_present | default([]) }}"
  loop_control:
    label: "{{ bootwright_current_storage_host.hostname }} {{ item }}"

- name: Probe this node for a live Ceph daemon tree
  ansible.builtin.stat:
    path: /var/lib/ceph
  register: bootwright_ceph_reclaim_daemon_root
  changed_when: false
  when: (bootwright_ceph_reclaim_present | default([])) | length > 0

- name: Refuse to reclaim a device that still backs a live OSD
  ansible.builtin.assert:
    that:
      - item.rc == 0
      - (item.stdout_lines | default([]) | map('trim') | select('in', ['lvm', 'crypt']) | list | length) == 0
        or (bootwright_ceph_authorize_unowned_devices | default(false) | bool)
    fail_msg: >-
      {{
        ('Refusing to reclaim ' ~ item.item ~ ' on ' ~ bootwright_current_storage_host.hostname
         ~ ': lsblk could not probe it (rc=' ~ item.rc ~ '): ' ~ (item.stderr | default('') | trim)
         ~ '. Failing closed rather than risk wiping the wrong device. No --authorize token'
         ~ ' relaxes this.')
        if item.rc != 0
        else
        ('Refusing to reclaim ' ~ item.item ~ ' on ' ~ bootwright_current_storage_host.hostname
         ~ ': it carries LVM or dm-crypt holders and no mountpoint — the bluestore OSD'
         ~ ' signature (an in-use OSD has no mountpoint, so the mount probe cannot catch it).'
         ~ ' A device already recorded in the OSD marker of this host is skipped'
         ~ ' automatically; reclaim only wipes a device that marker does not record. '
         ~ ((' This node carries a Ceph daemon tree (/var/lib/ceph), so the holders are most'
             ~ ' likely a LIVE OSD of a running cluster. Drain and remove it first — find its id'
             ~ ' with `cephadm shell -- ceph osd tree`, then'
             ~ ' `cephadm shell -- ceph orch osd rm <id>` — and re-apply once it is gone.'
             ~ ' If you are certain the OSD is dead, re-run the same apply with'
             ~ ' `--authorize data-loss,unowned-devices` to wipe it regardless (IRREVERSIBLE).')
            if (bootwright_ceph_reclaim_daemon_root.stat | default({})).exists | default(false)
            else (' This node carries NO Ceph daemon tree (/var/lib/ceph is absent), so the'
                  ~ ' holders are an ORPHAN left by a Ceph cluster that was destroyed or was'
                  ~ ' never managed by Bootwright. There is no cluster to drain it from —'
                  ~ ' `ceph orch osd rm` cannot reach it. Re-run the same apply with'
                  ~ ' `--authorize data-loss,unowned-devices` to wipe it (IRREVERSIBLE), after'
                  ~ ' confirming the volume group is prior-install residue and not data to keep'
                  ~ ' (`pvs -o pv_name,vg_name`, `lvs -o lv_name,vg_name,lv_tags`).')))
      }}
    quiet: true
  loop: "{{ bootwright_ceph_reclaim_holders.results | default([]) }}"
  loop_control:
    label: "{{ bootwright_current_storage_host.hostname }} {{ item.item }}"

- name: Resolve reclaimed OSD devices whose LVM stack must come down first
  ansible.builtin.set_fact:
    bootwright_ceph_reclaim_lvm: >-
      {{ bootwright_ceph_reclaim_holders.results | default([]) | selectattr('rc', 'equalto', 0)
         | selectattr('stdout', 'search', 'lvm') | map(attribute='item') | list }}
  changed_when: false

- name: Resolve the volume groups standing on the reclaimed OSD devices
  ansible.builtin.command:
    argv:
      - pvs
      - --noheadings
      - --readonly
      - --options
      - vg_name
      - "{{ item }}"
  register: bootwright_ceph_reclaim_pvs
  changed_when: false
  failed_when: false
  loop: "{{ bootwright_ceph_reclaim_lvm | default([]) }}"
  loop_control:
    label: "{{ bootwright_current_storage_host.hostname }} {{ item }}"

- name: Resolve the volume groups to remove with the reclaimed OSD devices
  ansible.builtin.set_fact:
    bootwright_ceph_reclaim_vgs: >-
      {{ bootwright_ceph_reclaim_pvs.results | default([]) | selectattr('rc', 'equalto', 0)
         | map(attribute='stdout_lines') | flatten | map('trim') | reject('equalto', '')
         | unique | list }}
  changed_when: false

- name: Deactivate the volume groups on the reclaimed OSD devices
  ansible.builtin.command:
    argv:
      - vgchange
      - --activate
      - "n"
      - "{{ item }}"
  register: bootwright_ceph_reclaim_vgchange
  changed_when: true
  failed_when: bootwright_ceph_reclaim_vgchange.rc != 0
  loop: "{{ bootwright_ceph_reclaim_vgs | default([]) }}"
  loop_control:
    label: "{{ bootwright_current_storage_host.hostname }} {{ item }}"

- name: Remove the volume groups on the reclaimed OSD devices
  ansible.builtin.command:
    argv:
      - vgremove
      - --force
      - --yes
      - "{{ item }}"
  register: bootwright_ceph_reclaim_vgremove
  changed_when: true
  failed_when: bootwright_ceph_reclaim_vgremove.rc != 0
  loop: "{{ bootwright_ceph_reclaim_vgs | default([]) }}"
  loop_control:
    label: "{{ bootwright_current_storage_host.hostname }} {{ item }}"

- name: Remove the physical volume labels from the reclaimed OSD devices
  ansible.builtin.command:
    argv:
      - pvremove
      - --force
      - --yes
      - "{{ item }}"
  register: bootwright_ceph_reclaim_pvremove
  changed_when: true
  failed_when: bootwright_ceph_reclaim_pvremove.rc != 0
  loop: "{{ bootwright_ceph_reclaim_lvm | default([]) }}"
  loop_control:
    label: "{{ bootwright_current_storage_host.hostname }} {{ item }}"

- name: Resolve whether the reclaim needs the Ceph device zap tool
  ansible.builtin.set_fact:
    bootwright_ceph_zap_tool_needed: "{{ bootwright_ceph_reclaim_present | default([]) | length > 0 }}"
  changed_when: false

- name: Ensure the Ceph device zap tool for the reclaim device zap
  ansible.builtin.include_tasks: ../ensure_zap_tool.yml

- name: Reclaim named OSD devices by wiping signatures
  ansible.builtin.command:
    argv:
      - wipefs
      - --all
      - --force
      - "{{ item }}"
  register: bootwright_ceph_reclaim_wipe
  changed_when: true
  failed_when: bootwright_ceph_reclaim_wipe.rc != 0
  loop: "{{ bootwright_ceph_reclaim_present | default([]) }}"
  loop_control:
    label: "{{ bootwright_current_storage_host.hostname }} {{ item }}"

- name: Zap partition tables of reclaimed OSD devices
  ansible.builtin.command:
    argv:
      - sgdisk
      - --zap-all
      - "{{ item }}"
  register: bootwright_ceph_reclaim_zap
  changed_when: true
  failed_when: bootwright_ceph_reclaim_zap.rc != 0
  loop: "{{ bootwright_ceph_reclaim_present | default([]) }}"
  loop_control:
    label: "{{ bootwright_current_storage_host.hostname }} {{ item }}"
  when: bootwright_ceph_zap_tool_present | default(false) | bool

- name: Probe declared OSD devices for existing signatures
  ansible.builtin.command:
    argv:
      - wipefs
      - --no-act
      - --noheadings
      - "{{ item }}"
  register: bootwright_ceph_device_check
  changed_when: false
  failed_when: false
  loop: "{{ bootwright_current_storage_host.devices | default([]) }}"
  loop_control:
    label: "{{ bootwright_current_storage_host.hostname }} {{ item }}"

- name: Check declared OSD devices are empty or Bootwright-owned
  ansible.builtin.assert:
    that:
      - item.rc == 0
      - >-
        (item.stdout | trim | length == 0)
        or item.item in bootwright_ceph_owned_osd_devices | default([])
    fail_msg: >-
      Declared OSD device {{ item.item }} on
      {{ bootwright_current_storage_host.hostname }}
      {% if item.rc != 0 %}could not be probed (wipefs exited {{ item.rc }}:
      {{ item.stderr | default('') | trim }}); verify the device path exists and
      is readable, then re-run apply.{% else %}already carries data
      ({{ item.stdout | trim }}) and is not recorded as a Bootwright-owned OSD
      device. Refusing to use it: after verifying the data is disposable, start
      from the exact invocation
      `{{ bootwright_apply_through_base_invocation | default('the same bootwright apply invocation through the base stage') }}`
      and add `--reclaim-devices {{ item.item }} --authorize
      data-loss,unowned-devices` (irreversible), retaining every existing flag; or
      verifying the data is disposable, or remove the device from the
      StorageCluster declaration. Both tokens are needed and neither implies the
      other: `data-loss` authorizes the wipe, `unowned-devices` authorizes
      wiping a device this node holds no ownership record for — without it the
      reclaim refuses again as soon as the signature turns out to be LVM or
      dm-crypt holders, which is what a live bluestore OSD looks like. The
      reclaim needs a scope that includes the deps phase. A cluster the
      controller no longer records as Bootwright-owned — the state every
      successful destroy leaves — is covered by the same pair:
      `unowned-devices` also lets the reclaim act without an ownership record,
      so that intentional retry works after a destroy.{% endif %}
    quiet: true
  loop: "{{ bootwright_ceph_device_check.results | default([]) }}"
  loop_control:
    label: "{{ bootwright_current_storage_host.hostname }} {{ item.item }}"

- name: Resolve declared-removed Bootwright OSD devices
  ansible.builtin.set_fact:
    bootwright_ceph_removed_osd_devices: >-
      {{ (bootwright_ceph_owned_osd_devices | default([]))
         | difference(bootwright_current_storage_host.devices | default([])) }}
  when: bootwright_ceph_owned_osd_devices | default([]) | length > 0

- name: Probe declared-removed OSD devices for a still-present OSD
  ansible.builtin.command:
    argv:
      - wipefs
      - --no-act
      - --noheadings
      - "{{ item }}"
  register: bootwright_ceph_removed_check
  changed_when: false
  failed_when: false
  loop: "{{ bootwright_ceph_removed_osd_devices | default([]) }}"
  loop_control:
    label: "{{ bootwright_current_storage_host.hostname }} {{ item }}"

- name: Refuse to drop an OSD device that still hosts an OSD
  ansible.builtin.assert:
    that:
      - item.rc != 0 or (item.stdout | trim | length == 0)
    fail_msg: >-
      Storage node {{ bootwright_current_storage_host.hostname }}: device {{ item.item }}
      was provisioned as a Bootwright OSD but is no longer in the declared devices
      list, and it still hosts an OSD (data signatures present). cephadm does not
      auto-remove an OSD, so dropping the device from the spec would orphan a running
      OSD. Drain and remove it first — find its id with `cephadm shell -- ceph osd tree`,
      then `cephadm shell -- ceph orch osd rm <id>` (this rebalances data off it) —
      and re-apply once it is gone, or re-add the device to keep it.
    quiet: true
  loop: "{{ bootwright_ceph_removed_check.results | default([]) }}"
  loop_control:
    label: "{{ bootwright_current_storage_host.hostname }} {{ item.item }}"

- name: Ensure Bootwright state directory for OSD device marker
  ansible.builtin.file:
    path: "{{ bootwright_ceph_osd_marker_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: bootwright_current_storage_host.devices | default([]) | length > 0

- name: Stamp Bootwright OSD device ownership marker
  ansible.builtin.copy:
    dest: "{{ bootwright_ceph_osd_marker_path }}"
    content: >-
      {{
        {
          'manager': 'bootwright',
          'cluster': bootwright_selected_storage_cluster.name,
          'node': bootwright_current_storage_host.hostname,
          'devices': bootwright_current_storage_host.devices | default([])
        } | to_nice_json
      }}
    owner: root
    group: root
    mode: "0600"
  when: bootwright_current_storage_host.devices | default([]) | length > 0
