---
- name: Probe cephadm CLI before package fallback
  ansible.builtin.command:
    argv:
      - cephadm
      - version
  register: bootwright_cephadm_initial_probe
  changed_when: false
  failed_when: false

- name: Install cephadm package on storage node when not preinstalled
  ansible.builtin.package:
    name: "{{ bootwright_ceph_provider.cephadmPackage | default('cephadm') }}"
    state: present
  register: bootwright_cephadm_package_install
  failed_when: false
  when: bootwright_cephadm_initial_probe.rc | default(1) != 0

- name: Create cephadm package ownership directory
  ansible.builtin.file:
    path: "{{ bootwright_ownership_dir }}/packages/{{ inventory_hostname }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: bootwright_cephadm_package_install.changed | default(false)

- name: Write cephadm package ownership record
  ansible.builtin.include_role:
    name: bootwright.core.ownership_record
    tasks_from: package_apply_one.yml
  vars:
    bootwright_ownership_package_name: "{{ bootwright_ceph_provider.cephadmPackage | default('cephadm') }}"
    bootwright_ownership_required_by: "storage-cluster:{{ bootwright_selected_storage_cluster.name }}"
  when: bootwright_cephadm_package_install.changed | default(false)

- name: Verify cephadm CLI on storage node
  ansible.builtin.command:
    argv:
      - cephadm
      - version
  register: bootwright_cephadm_version
  changed_when: false
  failed_when: false

- name: Fail when cephadm CLI is unavailable
  ansible.builtin.assert:
    that:
      - bootwright_cephadm_version.rc == 0
    fail_msg: >-
      cephadm CLI is required on storage node {{ bootwright_current_storage_host.hostname }} for Ceph
      distribution {{ bootwright_ceph_provider_name }}. Check the referenced Environment entitlement,
      provider repositories, managed OS MachineInstallProfile repositories, or preinstalled host packages.
      Package fallback result: {{ (bootwright_cephadm_package_install | default({})).msg | default('not attempted') }}

- name: Probe ceph CLI before package fallback
  ansible.builtin.command:
    argv:
      - ceph
      - --version
  register: bootwright_ceph_cli_initial_probe
  changed_when: false
  failed_when: false

- name: Install ceph-common package on storage node when not preinstalled
  ansible.builtin.package:
    name: "{{ bootwright_ceph_provider.cephCommonPackage | default('ceph-common') }}"
    state: present
  register: bootwright_ceph_common_package_install
  failed_when: false
  when: bootwright_ceph_cli_initial_probe.rc | default(1) != 0

- name: Create ceph-common package ownership directory
  ansible.builtin.file:
    path: "{{ bootwright_ownership_dir }}/packages/{{ inventory_hostname }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: bootwright_ceph_common_package_install.changed | default(false)

- name: Write ceph-common package ownership record
  ansible.builtin.include_role:
    name: bootwright.core.ownership_record
    tasks_from: package_apply_one.yml
  vars:
    bootwright_ownership_package_name: "{{ bootwright_ceph_provider.cephCommonPackage | default('ceph-common') }}"
    bootwright_ownership_required_by: "storage-cluster:{{ bootwright_selected_storage_cluster.name }}"
  when: bootwright_ceph_common_package_install.changed | default(false)

- name: Verify ceph CLI on storage node
  ansible.builtin.command:
    argv:
      - ceph
      - --version
  register: bootwright_ceph_cli_version
  changed_when: false
  failed_when: false

- name: Fail when ceph CLI is unavailable
  ansible.builtin.assert:
    that:
      - bootwright_ceph_cli_version.rc == 0
    fail_msg: >-
      ceph CLI (ceph-common) is required on storage node {{ bootwright_current_storage_host.hostname }} for Ceph
      distribution {{ bootwright_ceph_provider_name }}. Check the referenced Environment entitlement,
      provider repositories, managed OS MachineInstallProfile repositories, or preinstalled host packages.
      Package fallback result: {{ (bootwright_ceph_common_package_install | default({})).msg | default('not attempted') }}

# Registry trust and login are configured in phases/registry.yml, before this
# stage, so podman (installed in the dependencies stage) is present and every
# node can pull the Ceph container images cephadm orchestrates.

- name: Authorize cephadm cluster SSH key on storage node
  ansible.posix.authorized_key:
    user: "{{ bootwright_selected_storage_cluster.clusterSSH.user | default('root') }}"
    key: "{{ lookup('ansible.builtin.file', bootwright_selected_storage_cluster.clusterSSH.publicKeyPath) }}"
    state: present
    manage_dir: true
  no_log: "{{ bootwright_no_log | default(true) | bool }}"
  when:
    - bootwright_selected_storage_cluster.clusterSSH.publicKeyPath | default('') | length > 0

# A signature on a declared device normally means foreign data: fail before
# claiming it. The one exception is Bootwright's own previous provisioning —
# every apply stamps the marker below before bootstrap, so a marker recording
# this cluster/node/device proves the signatures are a prior apply's ceph-volume
# LVM, and cephadm reconciles those OSDs in place (this is how an owned,
# half-converged cluster stays recoverable by re-apply). No marker, another
# cluster's marker, or an unrecorded device still fails closed, mirroring the
# destroy device-ownership guard. A recorded device whose content was replaced
# out of band degrades to ceph-volume's own refusal to consume non-Ceph data.
- name: Read Bootwright OSD device ownership marker
  ansible.builtin.slurp:
    src: "{{ bootwright_ceph_osd_marker_path }}"
  register: bootwright_ceph_osd_marker_probe
  changed_when: false
  failed_when: false
  when: bootwright_current_storage_host.devices | default([]) | length > 0

- name: Resolve devices recorded as Bootwright OSDs for this cluster
  ansible.builtin.set_fact:
    bootwright_ceph_owned_osd_devices: >-
      {{ bootwright_ceph_osd_marker_doc.devices | default([])
         if (bootwright_ceph_osd_marker_doc.manager | default('') == 'bootwright'
             and bootwright_ceph_osd_marker_doc.cluster | default('') == bootwright_selected_storage_cluster.name
             and bootwright_ceph_osd_marker_doc.node | default('') == bootwright_current_storage_host.hostname)
         else [] }}
  vars:
    bootwright_ceph_osd_marker_doc: "{{ bootwright_ceph_osd_marker_probe.content | b64decode | from_json }}"
  when: (bootwright_ceph_osd_marker_probe | default({})).content is defined

# --reclaim-devices recovers owned OSD disks whose on-node marker a managed-OS
# reinstall erased: the data disks still carry this cluster's ceph LVM but the
# empty-device gate below would refuse them (the marker that would exempt them is
# gone). Wipe exactly the operator-named devices in-band — gated on the device being
# a declared OSD device of a controller-owned cluster and not mounted or in use — so
# the gate then sees them empty and cephadm re-creates the OSDs. Wiping is
# irreversible; the controller emitted the data-loss warning before this ran.
- name: Resolve OSD devices to reclaim on this host
  ansible.builtin.set_fact:
    bootwright_ceph_reclaim_here: >-
      {{ (bootwright_current_storage_host.devices | default([]))
         | intersect(bootwright_ceph_reclaim_devices | default('') | split(',')
                     | map('trim') | reject('equalto', '') | list) }}
  when:
    - bootwright_current_storage_host.devices | default([]) | length > 0
    - >-
      bootwright_selected_storage_cluster.name
      in (bootwright_ceph_owned_clusters | default('') | split(',') | map('trim') | list)

- name: Probe reclaim devices for active mounts
  ansible.builtin.command:
    argv:
      - lsblk
      - --noheadings
      - --output
      - MOUNTPOINT
      - "{{ item }}"
  register: bootwright_ceph_reclaim_mounts
  changed_when: false
  failed_when: false
  loop: "{{ bootwright_ceph_reclaim_here | default([]) }}"
  loop_control:
    label: "{{ bootwright_current_storage_host.hostname }} {{ item }}"

- name: Refuse to reclaim a mounted or in-use device
  ansible.builtin.assert:
    that:
      - item.rc == 0
      - (item.stdout_lines | default([]) | map('trim') | reject('equalto', '') | list | length) == 0
    fail_msg: >-
      Refusing to reclaim {{ item.item }} on {{ bootwright_current_storage_host.hostname }}:
      it could not be probed or is mounted/in use
      ({{ item.stdout_lines | default([]) | map('trim') | reject('equalto', '') | list | join(', ') }}),
      so it is not a wipeable OSD data disk. --reclaim-devices only wipes an unmounted,
      non-system disk.
    quiet: true
  loop: "{{ bootwright_ceph_reclaim_mounts.results | default([]) }}"
  loop_control:
    label: "{{ bootwright_current_storage_host.hostname }} {{ item.item }}"

- name: Ensure gdisk for the reclaim device zap
  ansible.builtin.package:
    name: gdisk
    state: present
  when: bootwright_ceph_reclaim_here | default([]) | length > 0

- name: Reclaim named OSD devices by wiping signatures
  ansible.builtin.command:
    argv:
      - wipefs
      - --all
      - --force
      - "{{ item }}"
  register: bootwright_ceph_reclaim_wipe
  changed_when: true
  failed_when: bootwright_ceph_reclaim_wipe.rc != 0
  loop: "{{ bootwright_ceph_reclaim_here | default([]) }}"
  loop_control:
    label: "{{ bootwright_current_storage_host.hostname }} {{ item }}"

- name: Zap partition tables of reclaimed OSD devices
  ansible.builtin.command:
    argv:
      - sgdisk
      - --zap-all
      - "{{ item }}"
  register: bootwright_ceph_reclaim_zap
  changed_when: true
  failed_when: bootwright_ceph_reclaim_zap.rc != 0
  loop: "{{ bootwright_ceph_reclaim_here | default([]) }}"
  loop_control:
    label: "{{ bootwright_current_storage_host.hostname }} {{ item }}"

- name: Check declared OSD devices are empty or Bootwright-owned
  ansible.builtin.command:
    argv:
      - wipefs
      - --no-act
      - --noheadings
      - "{{ item }}"
  register: bootwright_ceph_device_check
  changed_when: false
  failed_when: >-
    bootwright_ceph_device_check.rc != 0
    or (bootwright_ceph_device_check.stdout | trim | length > 0
        and item not in bootwright_ceph_owned_osd_devices | default([]))
  loop: "{{ bootwright_current_storage_host.devices | default([]) }}"
  loop_control:
    label: "{{ bootwright_current_storage_host.hostname }} {{ item }}"

# A device this node previously provisioned as an OSD (recorded in the marker) that
# is no longer in the declared devices list is a REMOVAL. cephadm never auto-removes
# an OSD — dropping it from the drivegroup spec would silently orphan a running OSD —
# so removing an OSD device is not an in-place reconcile. Refuse when the device is
# still present AND still carries data (its OSD is still there), directing the
# operator to drain it first. A removed device that is absent or already wiped
# (drained out of band) passes: the new marker below simply stops recording it.
- name: Resolve declared-removed Bootwright OSD devices
  ansible.builtin.set_fact:
    bootwright_ceph_removed_osd_devices: >-
      {{ (bootwright_ceph_owned_osd_devices | default([]))
         | difference(bootwright_current_storage_host.devices | default([])) }}
  when: bootwright_current_storage_host.devices | default([]) | length > 0

- name: Probe declared-removed OSD devices for a still-present OSD
  ansible.builtin.command:
    argv:
      - wipefs
      - --no-act
      - --noheadings
      - "{{ item }}"
  register: bootwright_ceph_removed_check
  changed_when: false
  failed_when: false
  loop: "{{ bootwright_ceph_removed_osd_devices | default([]) }}"
  loop_control:
    label: "{{ bootwright_current_storage_host.hostname }} {{ item }}"

- name: Refuse to drop an OSD device that still hosts an OSD
  ansible.builtin.assert:
    that:
      - item.rc != 0 or (item.stdout | trim | length == 0)
    fail_msg: >-
      Storage node {{ bootwright_current_storage_host.hostname }}: device {{ item.item }}
      was provisioned as a Bootwright OSD but is no longer in the declared devices
      list, and it still hosts an OSD (data signatures present). cephadm does not
      auto-remove an OSD, so dropping the device from the spec would orphan a running
      OSD. Drain and remove it first — find its id with `cephadm shell -- ceph osd tree`,
      then `cephadm shell -- ceph orch osd rm <id>` (this rebalances data off it) —
      and re-apply once it is gone, or re-add the device to keep it.
    quiet: true
  loop: "{{ bootwright_ceph_removed_check.results | default([]) }}"
  loop_control:
    label: "{{ bootwright_current_storage_host.hostname }} {{ item.item }}"

# Record the empty devices Bootwright is claiming as OSDs on this node so destroy
# can refuse to wipe a device later added to the declared list out of band. Stamped
# on every apply so it tracks legitimate device additions, and removed by the
# destroy flow. Consumed by the destroy device-ownership guard.
- name: Ensure Bootwright state directory for OSD device marker
  ansible.builtin.file:
    path: "{{ bootwright_ceph_osd_marker_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: bootwright_current_storage_host.devices | default([]) | length > 0

- name: Stamp Bootwright OSD device ownership marker
  ansible.builtin.copy:
    dest: "{{ bootwright_ceph_osd_marker_path }}"
    content: >-
      {{
        {
          'manager': 'bootwright',
          'cluster': bootwright_selected_storage_cluster.name,
          'node': bootwright_current_storage_host.hostname,
          'devices': bootwright_current_storage_host.devices | default([])
        } | to_nice_json
      }}
    owner: root
    group: root
    mode: "0600"
  when: bootwright_current_storage_host.devices | default([]) | length > 0
