---
- name: Validate OSS Ceph provider has no vendor entitlement
  ansible.builtin.assert:
    that:
      - not (bootwright_ceph_provider.requiresRHSM | default(false) | bool)
      - not (bootwright_ceph_provider.requiresLicense | default(false) | bool)
    fail_msg: "Ceph distribution oss must not require Red Hat or IBM entitlement material."

- name: Prepare community Ceph package repositories
  ansible.builtin.debug:
    msg: "Using OS/community repositories for cephadm and Ceph packages."
  changed_when: false
