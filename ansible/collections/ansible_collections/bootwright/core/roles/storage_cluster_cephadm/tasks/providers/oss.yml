---
- name: Validate OSS Ceph provider has no vendor entitlement
  ansible.builtin.assert:
    that:
      - not (bootwright_ceph_provider.requiresRHSM | default(false) | bool)
      - not (bootwright_ceph_provider.requiresLicense | default(false) | bool)
    fail_msg: "Ceph distribution oss must not require Red Hat or IBM entitlement material."

- name: Resolve community Ceph package source
  ansible.builtin.set_fact:
    bootwright_ceph_community_release: "{{ bootwright_ceph_provider.community.release | default('squid') }}"
    bootwright_ceph_community_mirror: "{{ (bootwright_ceph_provider.community.mirror | default(bootwright_ceph_community_default_mirror, true)) | regex_replace('/$', '') }}"
  changed_when: false

- name: Require an https community Ceph mirror
  ansible.builtin.assert:
    that:
      - bootwright_ceph_community_mirror is match('^https://')
    fail_msg: >-
      Refusing to fetch and execute cephadm over an insecure transport: set
      spec.ceph.community.mirror to an https:// URL (got
      {{ bootwright_ceph_community_mirror }}).

- name: Download cephadm utility to configure community Ceph repository
  ansible.builtin.get_url:
    url: "{{ bootwright_ceph_community_mirror }}/rpm-{{ bootwright_ceph_community_release }}/el{{ ansible_distribution_major_version }}/noarch/cephadm"
    dest: "{{ bootwright_ceph_community_bootstrap_cephadm }}"
    owner: root
    group: root
    mode: "0755"

- name: Resolve EPEL bootstrap package source
  ansible.builtin.set_fact:
    bootwright_ceph_community_epel_url: >-
      {{
        bootwright_ceph_provider.community.epelReleaseURL
        | default(bootwright_ceph_community_epel_release_url, true)
      }}
  changed_when: false

- name: Require an https EPEL bootstrap package source
  ansible.builtin.assert:
    that:
      - bootwright_ceph_community_epel_url is match('^https://')
    fail_msg: >-
      Refusing to install the EPEL bootstrap package over an insecure transport:
      set bootwright_ceph_community_epel_release_url to an https:// URL (got
      {{ bootwright_ceph_community_epel_url }}).

# cephadm add-repo enables EPEL with "dnf install -y epel-release" and has no flag
# to skip it; pre-installing epel-release makes that internal step an idempotent
# no-op on the unregistered managed RHEL node. disable_gpg_check covers hardened
# images that force local package verification: epel-release is the bootstrap
# package that itself ships the EPEL signing key, so no key is yet trusted.
- name: Enable EPEL before cephadm configures the community Ceph repository
  ansible.builtin.dnf:
    name: "{{ bootwright_ceph_community_epel_url }}"
    state: present
    disable_gpg_check: true

- name: Configure community Ceph package repository through cephadm
  ansible.builtin.command:
    argv: >-
      {{
        [bootwright_ceph_community_bootstrap_cephadm, 'add-repo', '--release', bootwright_ceph_community_release]
        + (['--mirror', bootwright_ceph_community_mirror] if bootwright_ceph_community_mirror != bootwright_ceph_community_default_mirror else [])
      }}
    creates: "{{ bootwright_ceph_community_repo_file }}"
