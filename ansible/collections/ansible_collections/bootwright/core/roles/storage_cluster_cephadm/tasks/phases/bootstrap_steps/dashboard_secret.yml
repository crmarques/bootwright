---
# cephadm bootstrap creates the Ceph dashboard with a one-time random admin
# password and prints it to stdout exactly once. Capture it from the bootstrap
# output and persist it controller-side under the cluster secrets directory,
# mirroring how the OCP installer's kubeadmin-password is saved. The register
# survives no_log (which only redacts display, not the captured value), so the
# parse works for both the oss and registry paths. Gated on the bootstrap
# having run, so the credential is captured only during the install — never
# re-read or re-synced on later applies. If the file is lost or the password is
# changed in-cluster, recover it per docs/advanced/storage-ceph.md.
- name: Extract Ceph dashboard admin password from bootstrap output
  ansible.builtin.set_fact:
    bootwright_ceph_dashboard_password: "{{ (bootwright_ceph_bootstrap.stdout | regex_search('Ceph Dashboard is now available[\\s\\S]*?Password:\\s*(\\S+)', '\\1')) | default('', true) }}"
  when: bootwright_ceph_bootstrap is changed
  no_log: true

- name: Create local storage cluster secrets directory
  ansible.builtin.file:
    path: "{{ bootwright_clusters_dir }}/{{ bootwright_selected_storage_cluster.name }}/secrets"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false
  when:
    - bootwright_ceph_bootstrap is changed
    - bootwright_ceph_dashboard_password | default('') | length > 0

- name: Store Ceph dashboard admin password in cluster secrets
  ansible.builtin.copy:
    dest: "{{ bootwright_clusters_dir }}/{{ bootwright_selected_storage_cluster.name }}/secrets/dashboard-password"
    content: "{{ bootwright_ceph_dashboard_password }}\n"
    mode: "0600"
  delegate_to: localhost
  become: false
  no_log: true
  when:
    - bootwright_ceph_bootstrap is changed
    - bootwright_ceph_dashboard_password | default('') | length > 0
