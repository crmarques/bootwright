---
- name: Load Ceph storage node OS variables
  ansible.builtin.include_vars: "os/{{ ansible_facts['os_family'] }}.yml"

- name: Resolve managed Ceph destroy paths
  ansible.builtin.set_fact:
    bootwright_ceph_remote_work_dir: "{{ bootwright_selected_storage_cluster.remoteWorkDir }}"
    bootwright_ceph_ownership_marker_path: /etc/ceph/.bootwright-owned
    bootwright_ceph_osd_marker_path: /etc/bootwright/ceph-osd-devices.json

- name: Resolve current storage node
  ansible.builtin.set_fact:
    bootwright_current_storage_node_matches: >-
      {{
        bootwright_selected_storage_cluster.nodes
        | default([])
        | selectattr('inventoryHost', 'equalto', inventory_hostname)
        | list
      }}
  changed_when: false

- name: Validate current storage node context
  ansible.builtin.assert:
    that:
      - bootwright_current_storage_node_matches | length == 1
    fail_msg: >-
      Storage node {{ inventory_hostname }} is not declared exactly once in
      {{ bootwright_selected_storage_cluster.name | default('<storage-cluster>') }}.

- name: Set current storage node
  ansible.builtin.set_fact:
    bootwright_current_storage_node: "{{ bootwright_current_storage_node_matches | first }}"
  changed_when: false

- name: Validate declared Ceph destroy devices
  ansible.builtin.assert:
    that:
      - item is match('^/dev/(disk/by-id/[^/]+|disk/by-path/[^/]+|mapper/[^/]+|nvme[0-9]+n[0-9]+|[svx]d[a-z]+)$')
    fail_msg: >-
      Refusing to wipe undeclared or unsupported storage device {{ item }}
      for {{ bootwright_selected_storage_cluster.name }}/{{ bootwright_current_storage_node.name }}.
      Declare stable /dev/disk/by-id, /dev/disk/by-path, /dev/mapper, NVMe, or /dev/sdX paths only.
  loop: "{{ bootwright_current_storage_node.devices | default([]) }}"
  loop_control:
    label: "{{ bootwright_current_storage_node.name }} {{ item }}"

# A declared device that is mounted, holds the root/boot filesystem, or is
# otherwise in use is not a Bootwright OSD device; wiping it would be irreversible
# data loss from a misdeclared or kernel-reordered /dev/sdX name. Probe live state
# and fail closed before any destructive wipe (the device-name regex only proves
# shape, not ownership or that the device is safe to zap).
- name: Probe declared Ceph destroy devices for active mounts
  ansible.builtin.command:
    argv:
      - lsblk
      - --noheadings
      - --output
      - MOUNTPOINT
      - "{{ item }}"
  register: bootwright_ceph_device_mounts
  changed_when: false
  failed_when: false
  loop: "{{ bootwright_current_storage_node.devices | default([]) }}"
  loop_control:
    label: "{{ bootwright_current_storage_node.name }} {{ item }}"

- name: Refuse to wipe mounted or in-use Ceph destroy devices
  ansible.builtin.assert:
    that:
      - item.rc | default(1) == 0
      - (item.stdout_lines | default([]) | map('trim') | reject('equalto', '') | list | length) == 0
    fail_msg: >-
      Refusing to wipe storage device {{ item.item }} for
      {{ bootwright_selected_storage_cluster.name }}/{{ bootwright_current_storage_node.name }}:
      it is mounted or in use ({{ item.stdout_lines | default([]) | map('trim') | reject('equalto', '') | list | join(', ') }}),
      so it is not a wipeable Bootwright OSD device. Correct the declared devices list before destroying.
  loop: "{{ bootwright_ceph_device_mounts.results | default([]) }}"
  loop_control:
    label: "{{ bootwright_current_storage_node.name }} {{ item.item }}"

# Each apply records the exact devices Bootwright provisioned as OSDs on this node.
# Refuse to wipe a declared device that is not in that recorded set: it was added
# to the node's devices list out of band (never an OSD here) and may hold foreign
# data. When no marker exists (a cluster provisioned before this guard), fall back
# to the shape and mount checks above rather than failing a legitimate destroy.
- name: Read Bootwright OSD device ownership marker
  ansible.builtin.slurp:
    src: "{{ bootwright_ceph_osd_marker_path }}"
  register: bootwright_ceph_osd_device_marker
  changed_when: false
  failed_when: false

- name: Resolve recorded Bootwright OSD devices
  ansible.builtin.set_fact:
    bootwright_ceph_recorded_osd_devices: >-
      {{ (bootwright_ceph_osd_device_marker.content | b64decode | from_json).devices | default([]) }}
  when: (bootwright_ceph_osd_device_marker | default({})).content is defined

- name: Refuse to wipe declared devices not recorded as Bootwright OSDs
  ansible.builtin.assert:
    that:
      - item in (bootwright_ceph_recorded_osd_devices | default([]))
    fail_msg: >-
      Refusing to wipe storage device {{ item }} for
      {{ bootwright_selected_storage_cluster.name }}/{{ bootwright_current_storage_node.name }}:
      it is not in this node's recorded Bootwright OSD device set
      ({{ bootwright_ceph_recorded_osd_devices | default([]) | join(', ') }}), so it was not
      provisioned by Bootwright as an OSD. It may have been added to the devices list after
      apply. Re-apply to re-record OSD devices, or verify and wipe it manually.
  loop: "{{ bootwright_current_storage_node.devices | default([]) }}"
  loop_control:
    label: "{{ bootwright_current_storage_node.name }} {{ item }}"
  when: (bootwright_ceph_osd_device_marker | default({})).content is defined

- name: Check Ceph fsid on seed host
  ansible.builtin.command:
    argv:
      - ceph
      - fsid
  register: bootwright_ceph_fsid
  changed_when: false
  failed_when: false
  when: inventory_hostname == bootwright_selected_storage_cluster.seedHost | default('')

# Before removing the cephadm cluster and wiping /etc/ceph on the seed, prove the
# live cluster is the one Bootwright created. A Bootwright bootstrap stamps an
# ownership marker (manager + fsid) under /etc/ceph; refuse to --zap-osds and tear
# down a cluster that carries no matching marker (a foreign or co-resident cluster)
# or whose fsid cannot be read. The destroy play runs any_errors_fatal, so a seed
# refusal aborts before any node wipes its OSD devices.
- name: Read Bootwright Ceph ownership marker on seed host
  ansible.builtin.slurp:
    src: "{{ bootwright_ceph_ownership_marker_path }}"
  register: bootwright_ceph_destroy_marker
  changed_when: false
  failed_when: false
  when: inventory_hostname == bootwright_selected_storage_cluster.seedHost | default('')

- name: Check existing Ceph configuration on seed host
  ansible.builtin.command:
    argv:
      - test
      - -f
      - /etc/ceph/ceph.conf
  register: bootwright_ceph_destroy_conf_check
  changed_when: false
  failed_when: false
  when: inventory_hostname == bootwright_selected_storage_cluster.seedHost | default('')

- name: Resolve Bootwright ownership marker fsid on seed host
  ansible.builtin.set_fact:
    bootwright_ceph_destroy_owned_fsid: >-
      {{ (bootwright_ceph_destroy_marker.content | b64decode | from_json).fsid
         | default('', true) | trim }}
  when:
    - inventory_hostname == bootwright_selected_storage_cluster.seedHost | default('')
    - (bootwright_ceph_destroy_marker | default({})).content is defined

- name: Decide Ceph destroy ownership on seed host
  ansible.builtin.set_fact:
    bootwright_ceph_destroy_owned: >-
      {{
        (bootwright_ceph_destroy_conf_check.rc | default(1) != 0)
        or (
          (bootwright_ceph_destroy_owned_fsid | default('') | length > 0)
          and (bootwright_ceph_fsid.stdout | default('') | trim | length > 0)
          and (bootwright_ceph_destroy_owned_fsid | default('')
               == bootwright_ceph_fsid.stdout | default('') | trim)
        )
      }}
  when: inventory_hostname == bootwright_selected_storage_cluster.seedHost | default('')

- name: Refuse to destroy a non-Bootwright Ceph cluster on seed host
  ansible.builtin.assert:
    that:
      - bootwright_ceph_destroy_owned | default(false) | bool
    fail_msg: >-
      Refusing to tear down the cephadm cluster on {{ inventory_hostname }}
      (fsid {{ bootwright_ceph_fsid.stdout | default('<unreadable>') | trim }}):
      /etc/ceph holds a Ceph cluster with no Bootwright ownership marker matching
      this cluster, so it may be a foreign or co-resident cluster, or its fsid could
      not be read. Re-run a normal apply to re-stamp ownership, or remove /etc/ceph
      manually after verifying the cluster is safe to destroy, then retry.
  when: inventory_hostname == bootwright_selected_storage_cluster.seedHost | default('')

- name: Remove cephadm cluster on seed host
  ansible.builtin.command:
    argv:
      - cephadm
      - rm-cluster
      - --force
      - --zap-osds
      - --fsid
      - "{{ bootwright_ceph_fsid.stdout | trim }}"
  register: bootwright_cephadm_rm_cluster
  changed_when: bootwright_cephadm_rm_cluster.rc == 0
  # Ownership is proven above; a real rm-cluster failure must not fall through to
  # wiping OSD devices with the cephadm cluster still partly present. Fail closed.
  failed_when: bootwright_cephadm_rm_cluster.rc != 0
  when:
    - inventory_hostname == bootwright_selected_storage_cluster.seedHost | default('')
    - bootwright_ceph_destroy_owned | default(false) | bool
    - bootwright_ceph_fsid.rc | default(1) == 0
    - bootwright_ceph_fsid.stdout | default('') | trim | length > 0

# The first mount probe runs before the cluster-ownership checks; re-probe each
# device immediately before the irreversible wipe to shrink the window in which a
# device could be mounted after that first check.
- name: Re-probe declared Ceph destroy devices for active mounts before wipe
  ansible.builtin.command:
    argv:
      - lsblk
      - --noheadings
      - --output
      - MOUNTPOINT
      - "{{ item }}"
  register: bootwright_ceph_device_mounts_final
  changed_when: false
  failed_when: false
  loop: "{{ bootwright_current_storage_node.devices | default([]) }}"
  loop_control:
    label: "{{ bootwright_current_storage_node.name }} {{ item }}"

- name: Refuse to wipe devices mounted since the first check
  ansible.builtin.assert:
    that:
      - item.rc | default(1) == 0
      - (item.stdout_lines | default([]) | map('trim') | reject('equalto', '') | list | length) == 0
    fail_msg: >-
      Refusing to wipe storage device {{ item.item }} for
      {{ bootwright_selected_storage_cluster.name }}/{{ bootwright_current_storage_node.name }}:
      it became mounted or in use after the initial check
      ({{ item.stdout_lines | default([]) | map('trim') | reject('equalto', '') | list | join(', ') }}).
  loop: "{{ bootwright_ceph_device_mounts_final.results | default([]) }}"
  loop_control:
    label: "{{ bootwright_current_storage_node.name }} {{ item.item }}"

- name: Wipe declared Ceph device signatures
  ansible.builtin.command:
    argv:
      - wipefs
      - --all
      - --force
      - "{{ item }}"
  register: bootwright_ceph_wipefs
  changed_when: true
  failed_when: bootwright_ceph_wipefs.rc != 0
  loop: "{{ bootwright_current_storage_node.devices | default([]) }}"
  loop_control:
    label: "{{ bootwright_current_storage_node.name }} {{ item }}"

- name: Zap declared Ceph device partition tables
  ansible.builtin.command:
    argv:
      - sgdisk
      - --zap-all
      - "{{ item }}"
  register: bootwright_ceph_sgdisk
  changed_when: true
  # A failed zap leaves a half-cleared partition table that can corrupt the next
  # provision or a later repurpose of the device. Fail closed instead of swallowing.
  failed_when: bootwright_ceph_sgdisk.rc != 0
  loop: "{{ bootwright_current_storage_node.devices | default([]) }}"
  loop_control:
    label: "{{ bootwright_current_storage_node.name }} {{ item }}"

- name: Remove managed Ceph local state
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ bootwright_ceph_remote_work_dir }}"
    - /etc/ceph
    - /var/lib/ceph
    - /var/log/ceph
    - "{{ bootwright_ceph_ca_trust_anchor_path }}"
    - "{{ bootwright_ceph_osd_marker_path }}"

- name: Remove storage cluster ownership record
  ansible.builtin.include_role:
    name: bootwright.core.helper_ownership
    tasks_from: remove_resource.yml
  vars:
    bootwright_ownership_kind: storage-cluster
    bootwright_ownership_name: "{{ bootwright_selected_storage_cluster.name }}"

- name: Remove Ceph package ownership records
  ansible.builtin.include_role:
    name: bootwright.core.helper_ownership
    tasks_from: package_remove.yml
  vars:
    bootwright_ownership_packages: "{{ bootwright_ceph_managed_packages }}"
    bootwright_ownership_required_by: "storage-cluster:{{ bootwright_selected_storage_cluster.name }}"
