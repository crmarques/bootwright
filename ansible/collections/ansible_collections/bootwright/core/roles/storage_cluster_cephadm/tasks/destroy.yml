---
- name: Resolve Ceph destroy context
  ansible.builtin.import_tasks: destroy_steps/context.yml

- name: Guard declared Ceph devices
  ansible.builtin.import_tasks: destroy_steps/device_gates.yml

- name: Guard and remove managed Ceph cluster
  ansible.builtin.import_tasks: destroy_steps/cluster_gate.yml

- name: Wipe Ceph devices and remove local state
  ansible.builtin.import_tasks: destroy_steps/wipe_and_cleanup.yml

- name: Reclaim Ceph-signed disks that no declared path covers
  ansible.builtin.import_tasks: destroy_steps/filter_device_reclaim.yml

- name: Confirm the storage node completed its teardown
  ansible.builtin.command:
    argv:
      - "true"
  register: bootwright_ceph_destroy_completion
  changed_when: false
