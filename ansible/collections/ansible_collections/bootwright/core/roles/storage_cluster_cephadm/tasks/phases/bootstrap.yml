---
- name: Apply managed Ceph cluster through cephadm
  block:
    - name: Stage cephadm inputs
      ansible.builtin.include_tasks: bootstrap_steps/stage_inputs.yml

    - name: Bootstrap Ceph cluster
      ansible.builtin.include_tasks: bootstrap_steps/bootstrap_cluster.yml

    - name: Stamp Ceph ownership marker
      ansible.builtin.include_tasks: bootstrap_steps/ownership_marker.yml

    - name: Reconcile IBM Call Home intent
      ansible.builtin.include_tasks: bootstrap_steps/ibm_call_home.yml
      when: bootwright_ceph_provider.name | default('') == 'ibm'

    - name: Pin cephadm container image base
      ansible.builtin.include_tasks: bootstrap_steps/container_image_base.yml

    - name: Reconcile cephadm registry login
      ansible.builtin.include_tasks: bootstrap_steps/registry_login.yml

    - name: Capture dashboard bootstrap secret
      ansible.builtin.include_tasks: bootstrap_steps/dashboard_secret.yml

    - name: Apply Ceph base service specs
      ansible.builtin.include_tasks: bootstrap_steps/service_specs.yml

    - name: Wait for declared Ceph OSDs to be created
      ansible.builtin.include_tasks: bootstrap_steps/osd_readiness.yml

    - name: Report all-devices OSD disks left unclaimed
      ansible.builtin.include_tasks: bootstrap_steps/osd_coverage_report.yml

    - name: Identify the stretch tiebreaker mon
      ansible.builtin.set_fact:
        bootwright_ceph_stretch_tiebreaker: >-
          {{
            ((bootwright_ceph_operations
              | selectattr('idempotency.kind', 'defined')
              | selectattr('idempotency.kind', 'equalto', 'stretch-mode')
              | map(attribute='command') | list | first) | default([]))[3] | default('')
          }}
      changed_when: false

    - name: Wait for the stretch tiebreaker mon to join the monmap
      ansible.builtin.command:
        argv:
          - cephadm
          - shell
          - --
          - ceph
          - mon
          - dump
          - --format
          - json
      register: bootwright_ceph_stretch_tiebreaker_dump
      changed_when: false
      failed_when: false
      retries: "{{ bootwright_ceph_mon_readiness_retries | default(30) | int }}"
      delay: "{{ bootwright_ceph_mon_readiness_delay | default(10) | int }}"
      until: >-
        bootwright_ceph_stretch_tiebreaker_dump.rc == 0
        and bootwright_ceph_stretch_tiebreaker in
            ((bootwright_ceph_stretch_tiebreaker_dump.stdout | default('{}') | from_json).mons
             | default([]) | map(attribute='name') | list)
      when: bootwright_ceph_stretch_tiebreaker | length > 0

    - name: Run Ceph topology and storage operations
      ansible.builtin.include_tasks: bootstrap_steps/topology_operations.yml

    - name: Apply Ceph late service specs
      ansible.builtin.include_tasks: bootstrap_steps/late_service_specs.yml

    - name: Apply secret-bearing management services
      ansible.builtin.include_tasks: bootstrap_steps/management_services.yml

    - name: Run Ceph late operations
      ansible.builtin.include_tasks: bootstrap_steps/late_operations.yml

    - name: Write storage result and ownership
      ansible.builtin.include_tasks: bootstrap_steps/result_and_ownership.yml
  always:
    - name: Remove managed Ceph work directory
      ansible.builtin.include_tasks: bootstrap_steps/cleanup.yml
