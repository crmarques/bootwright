---
- name: Apply managed Ceph cluster through cephadm
  block:
    - name: Create managed Ceph work directory
      ansible.builtin.file:
        path: "{{ bootwright_ceph_remote_work_dir }}"
        state: directory
        mode: "0700"

    - name: Copy cephadm bootstrap spec
      ansible.builtin.copy:
        src: "{{ bootwright_selected_storage_cluster.ceph.bootstrapSpecPath }}"
        dest: "{{ bootwright_ceph_remote_bootstrap_spec }}"
        mode: "0600"

    - name: Copy cephadm core service spec
      ansible.builtin.copy:
        src: "{{ bootwright_selected_storage_cluster.ceph.coreServicesSpecPath }}"
        dest: "{{ bootwright_ceph_remote_core_services_spec }}"
        mode: "0600"

    - name: Copy cephadm late service spec
      ansible.builtin.copy:
        src: "{{ bootwright_selected_storage_cluster.ceph.lateServicesSpecPath }}"
        dest: "{{ bootwright_ceph_remote_late_services_spec }}"
        mode: "0600"

    - name: Copy rendered Ceph operation manifest
      ansible.builtin.copy:
        src: "{{ bootwright_selected_storage_cluster.ceph.operationsPath }}"
        dest: "{{ bootwright_ceph_remote_operations }}"
        mode: "0600"

    - name: Copy cephadm registry JSON
      ansible.builtin.copy:
        dest: "{{ bootwright_ceph_remote_registry_json }}"
        content: >-
          {{
            {
              'url': bootwright_ceph_registry_url,
              'username': bootwright_ceph_registry_credentials.username,
              'password': bootwright_ceph_registry_credentials.password
            } | to_json
          }}
        mode: "0600"
      no_log: true
      when:
        - bootwright_ceph_registry_url | length > 0
        - bootwright_ceph_registry_credentials is defined

    - name: Copy cephadm cluster private SSH key
      ansible.builtin.copy:
        src: "{{ bootwright_selected_storage_cluster.clusterSSH.privateKeyPath }}"
        dest: "{{ bootwright_ceph_remote_private_key }}"
        mode: "0600"
      no_log: true
      when: bootwright_selected_storage_cluster.clusterSSH.privateKeyPath | default('') | length > 0

    - name: Copy cephadm cluster public SSH key
      ansible.builtin.copy:
        src: "{{ bootwright_selected_storage_cluster.clusterSSH.publicKeyPath }}"
        dest: "{{ bootwright_ceph_remote_public_key }}"
        mode: "0644"
      no_log: true
      when: bootwright_selected_storage_cluster.clusterSSH.publicKeyPath | default('') | length > 0

    - name: Copy cephadm cluster known hosts
      ansible.builtin.copy:
        src: "{{ bootwright_selected_storage_cluster.clusterSSH.knownHostsPath }}"
        dest: "{{ bootwright_ceph_remote_known_hosts }}"
        mode: "0600"
      when: bootwright_selected_storage_cluster.clusterSSH.knownHostsPath | default('') | length > 0

    - name: Render cephadm SSH config
      ansible.builtin.copy:
        content: |
          Host *
            User {{ bootwright_selected_storage_cluster.clusterSSH.user | default('root') }}
            IdentityFile {{ bootwright_ceph_remote_private_key }}
            UserKnownHostsFile {{ bootwright_ceph_remote_known_hosts }}
            StrictHostKeyChecking yes
            BatchMode yes
        dest: "{{ bootwright_ceph_remote_ssh_config }}"
        mode: "0600"
      when:
        - bootwright_selected_storage_cluster.clusterSSH.privateKeyPath | default('') | length > 0
        - bootwright_selected_storage_cluster.clusterSSH.knownHostsPath | default('') | length > 0

    - name: Verify cephadm seed SSH access to storage nodes
      ansible.builtin.command:
        argv:
          - ssh
          - -F
          - "{{ bootwright_ceph_remote_ssh_config }}"
          - "{{ item.address }}"
          - "true"
      register: bootwright_ceph_seed_ssh_check
      changed_when: false
      no_log: true
      loop: "{{ bootwright_selected_storage_cluster.nodes | default([]) }}"
      loop_control:
        label: "{{ item.name }}"
      when:
        - bootwright_selected_storage_cluster.clusterSSH.privateKeyPath | default('') | length > 0
        - bootwright_selected_storage_cluster.clusterSSH.knownHostsPath | default('') | length > 0
        - item.address | default('') | length > 0

    # The bootstrap (storage) stage runs with skip_prereqs and is the actual
    # consumer of the ceph CLI; guarantee it here so the orchestration steps
    # below work even when the prereq stage installed an older tooling set.
    - name: Ensure Ceph client tooling is present for cephadm orchestration
      ansible.builtin.package:
        name: "{{ bootwright_ceph_provider.cephCommonPackage | default('ceph-common') }}"
        state: present
      register: bootwright_ceph_common_bootstrap_install

    - name: Create ceph-common package ownership directory
      ansible.builtin.file:
        path: "{{ bootwright_ownership_dir }}/packages/{{ inventory_hostname }}"
        state: directory
        owner: root
        group: root
        mode: "0700"
      when: bootwright_ceph_common_bootstrap_install.changed | default(false)

    - name: Write ceph-common package ownership record
      ansible.builtin.include_role:
        name: bootwright.core.helper_ownership
        tasks_from: package_apply_one.yml
      vars:
        bootwright_ownership_package_name: "{{ bootwright_ceph_provider.cephCommonPackage | default('ceph-common') }}"
        bootwright_ownership_required_by: "storage-cluster:{{ bootwright_selected_storage_cluster.name }}"
      when: bootwright_ceph_common_bootstrap_install.changed | default(false)

    # --override (bootwright_install_override) asks for a clean rebuild: tear down
    # any existing cephadm cluster on the seed and clear the residual config so the
    # bootstrap below runs against a fresh host with no manual recovery. Without
    # override an already-bootstrapped node is left untouched (idempotent re-apply).
    # The zap is gated on the explicit override flag AND on a Bootwright ownership
    # marker whose fsid matches the live cluster: a clean rebuild must never
    # --zap-osds a cephadm cluster Bootwright did not create (a foreign or
    # co-resident cluster on the seed), so an existing-but-unowned cluster fails
    # closed instead of being destroyed.
    - name: Read existing Ceph configuration for override rebuild
      ansible.builtin.slurp:
        src: /etc/ceph/ceph.conf
      register: bootwright_ceph_override_conf
      changed_when: false
      failed_when: false
      when: (bootwright_apply_mode | default('continue')) == 'override'

    - name: Read Bootwright Ceph ownership marker for override rebuild
      ansible.builtin.slurp:
        src: "{{ bootwright_ceph_ownership_marker_path }}"
      register: bootwright_ceph_override_marker
      changed_when: false
      failed_when: false
      when: (bootwright_apply_mode | default('continue')) == 'override'

    - name: Resolve existing Ceph cluster fsid for override rebuild
      ansible.builtin.set_fact:
        bootwright_ceph_override_fsid: >-
          {{ (bootwright_ceph_override_conf.content | b64decode
              | regex_search('fsid\s*=\s*([0-9a-fA-F-]+)', '\1')
              | default([], true) | first | default('')) }}
      when:
        - (bootwright_apply_mode | default('continue')) == 'override'
        - (bootwright_ceph_override_conf | default({})).content is defined

    - name: Resolve Bootwright ownership marker fsid for override rebuild
      ansible.builtin.set_fact:
        bootwright_ceph_override_owned_fsid: >-
          {{ (bootwright_ceph_override_marker.content | b64decode | from_json).fsid
             | default('', true) | trim }}
      when:
        - (bootwright_apply_mode | default('continue')) == 'override'
        - (bootwright_ceph_override_marker | default({})).content is defined

    - name: Decide override rebuild ownership
      ansible.builtin.set_fact:
        bootwright_ceph_override_owned: >-
          {{
            (bootwright_ceph_override_owned_fsid | default('') | length > 0)
            and (bootwright_ceph_override_fsid | default('') | length > 0)
            and (bootwright_ceph_override_owned_fsid | default('')
                 == bootwright_ceph_override_fsid | default(''))
          }}
      when: (bootwright_apply_mode | default('continue')) == 'override'

    - name: Refuse override rebuild of a non-Bootwright Ceph cluster
      ansible.builtin.assert:
        that:
          - bootwright_ceph_override_owned | default(false) | bool
        fail_msg: >-
          Refusing --override clean rebuild of the cephadm cluster on
          {{ inventory_hostname }} (fsid {{ bootwright_ceph_override_fsid | default('<unknown>') }}):
          it carries no Bootwright ownership marker matching this cluster, so it may be a
          foreign or co-resident Ceph cluster. Re-run a normal apply to re-stamp ownership,
          or remove /etc/ceph manually after verifying the cluster is safe to destroy, then retry.
      when:
        - (bootwright_apply_mode | default('continue')) == 'override'
        - bootwright_ceph_override_fsid | default('') | length > 0

    - name: Remove existing cephadm cluster for override rebuild
      ansible.builtin.command:
        argv:
          - cephadm
          - rm-cluster
          - --force
          - --zap-osds
          - --fsid
          - "{{ bootwright_ceph_override_fsid }}"
      register: bootwright_ceph_override_rm
      changed_when: true
      # A failed rm-cluster must not silently fall through to clearing config and
      # re-bootstrapping: that would orphan the old cephadm daemons. Fail closed.
      failed_when: bootwright_ceph_override_rm.rc != 0
      when:
        - (bootwright_apply_mode | default('continue')) == 'override'
        - bootwright_ceph_override_owned | default(false) | bool
        - bootwright_ceph_override_fsid | default('') | length > 0

    - name: Clear residual Ceph configuration for override rebuild
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/ceph/ceph.conf
        - /etc/ceph/ceph.client.admin.keyring
        - /etc/ceph/ceph.pub
        - "{{ bootwright_ceph_ownership_marker_path }}"
      when:
        - (bootwright_apply_mode | default('continue')) == 'override'
        - bootwright_ceph_override_owned | default(false) | bool
        - (bootwright_ceph_override_conf | default({})).content is defined

    - name: Check existing Ceph configuration
      ansible.builtin.command:
        argv:
          - test
          - -f
          - /etc/ceph/ceph.conf
      register: bootwright_ceph_conf_check
      changed_when: false
      failed_when: false

    - name: Resolve cephadm bootstrap command
      ansible.builtin.set_fact:
        bootwright_ceph_bootstrap_argv: >-
          {{
            [
              'cephadm',
              'bootstrap',
              '--mon-ip',
              bootwright_selected_storage_cluster.bootstrap.monIP
            ]
            + (
              ['--cluster-network', (bootwright_selected_storage_cluster.clusterNetworkCIDRs | join(','))]
              if (bootwright_selected_storage_cluster.clusterNetworkCIDRs | default([]) | length) > 0
              else []
            )
            + (
              ['--ssh-private-key', bootwright_ceph_remote_private_key]
              if bootwright_selected_storage_cluster.clusterSSH.privateKeyPath | default('') | length > 0
              else []
            )
            + (
              ['--ssh-public-key', bootwright_ceph_remote_public_key]
              if bootwright_selected_storage_cluster.clusterSSH.publicKeyPath | default('') | length > 0
              else []
            )
            + (
              ['--ssh-user', bootwright_selected_storage_cluster.clusterSSH.user]
              if bootwright_selected_storage_cluster.clusterSSH.user | default('') | length > 0
              else []
            )
            + (
              ['--registry-json', bootwright_ceph_remote_registry_json]
              if bootwright_ceph_registry_credentials is defined
              else []
            )
            + (
              ['--image', bootwright_ceph_bootstrap_image]
              if bootwright_ceph_bootstrap_image | default('') | length > 0
              else []
            )
          }}
      no_log: "{{ bootwright_ceph_registry_credentials is defined }}"

    - name: Bootstrap Ceph cluster when absent
      ansible.builtin.command:
        argv: "{{ bootwright_ceph_bootstrap_argv }}"
      register: bootwright_ceph_bootstrap
      changed_when: true
      no_log: "{{ bootwright_ceph_registry_credentials is defined }}"
      # cephadm bootstrap is a one-time, non-idempotent operation that refuses to
      # run when /etc/ceph/ceph.conf already exists. Gate purely on that file, the
      # same marker cephadm itself checks: an already-bootstrapped node must never
      # be re-bootstrapped (a transiently unreachable cluster cannot be repaired by
      # re-running bootstrap). A stale conf from a prior cluster is cleared by the
      # destroy flow, which owns /etc/ceph, before a fresh apply re-bootstraps.
      when: bootwright_ceph_conf_check.rc != 0

    # Stamp a host-local ownership marker recording this cluster's fsid right after
    # bootstrap — before the host/service/operation steps that may fail — so a cephadm
    # cluster Bootwright created stays reclaimable by a later --override clean rebuild
    # (fsid match) even if a subsequent step aborts the apply. Gated on a readable
    # fsid, so it also re-stamps an existing cluster on every apply (refreshing
    # clusters bootstrapped before the marker existed). Removed by /etc/ceph teardown
    # in the destroy flow.
    - name: Capture Ceph fsid for ownership marker
      ansible.builtin.command:
        argv:
          - ceph
          - fsid
      register: bootwright_ceph_ownership_fsid
      changed_when: false
      failed_when: false

    - name: Stamp Bootwright Ceph ownership marker
      ansible.builtin.copy:
        dest: "{{ bootwright_ceph_ownership_marker_path }}"
        content: >-
          {{
            {
              'manager': 'bootwright',
              'cluster': bootwright_selected_storage_cluster.name,
              'fsid': bootwright_ceph_ownership_fsid.stdout | default('') | trim
            } | to_nice_json
          }}
        owner: root
        group: root
        mode: "0600"
      when: bootwright_ceph_ownership_fsid.stdout | default('') | trim | length > 0

    # cephadm bootstrap creates the Ceph dashboard with a one-time random admin
    # password and prints it to stdout exactly once. Capture it from the bootstrap
    # output and persist it controller-side under the cluster secrets directory,
    # mirroring how the OCP installer's kubeadmin-password is saved. The register
    # survives no_log (which only redacts display, not the captured value), so the
    # parse works for both the oss and registry paths. Gated on the bootstrap
    # having run, so the credential is captured only during the install — never
    # re-read or re-synced on later applies. If the file is lost or the password is
    # changed in-cluster, recover it per docs/advanced/storage-ceph.md.
    - name: Extract Ceph dashboard admin password from bootstrap output
      ansible.builtin.set_fact:
        bootwright_ceph_dashboard_password: "{{ (bootwright_ceph_bootstrap.stdout | regex_search('Ceph Dashboard is now available[\\s\\S]*?Password:\\s*(\\S+)', '\\1')) | default('', true) }}"
      when: bootwright_ceph_bootstrap is changed
      no_log: true

    - name: Create local storage cluster secrets directory
      ansible.builtin.file:
        path: "{{ bootwright_clusters_dir }}/{{ bootwright_selected_storage_cluster.name }}/secrets"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false
      when:
        - bootwright_ceph_bootstrap is changed
        - bootwright_ceph_dashboard_password | default('') | length > 0

    - name: Store Ceph dashboard admin password in cluster secrets
      ansible.builtin.copy:
        dest: "{{ bootwright_clusters_dir }}/{{ bootwright_selected_storage_cluster.name }}/secrets/dashboard-password"
        content: "{{ bootwright_ceph_dashboard_password }}\n"
        mode: "0600"
      delegate_to: localhost
      become: false
      no_log: true
      when:
        - bootwright_ceph_bootstrap is changed
        - bootwright_ceph_dashboard_password | default('') | length > 0

    - name: Configure cephadm SSH trust
      ansible.builtin.command:
        argv:
          - ceph
          - cephadm
          - set-ssh-config
          - -i
          - "{{ bootwright_ceph_remote_ssh_config }}"
      register: bootwright_ceph_ssh_config
      changed_when: true
      when:
        - bootwright_selected_storage_cluster.clusterSSH.privateKeyPath | default('') | length > 0
        - bootwright_selected_storage_cluster.clusterSSH.knownHostsPath | default('') | length > 0

    # ceph orch apply reconciles to the spec and exposes no stable changed/ok
    # signal, so these declarative steps set changed_when: true by design.
    # Convergence drift is computed in Go from desired-hash vs recorded reality,
    # not from this recap.
    - name: Apply Ceph host spec
      ansible.builtin.command:
        argv:
          - ceph
          - orch
          - apply
          - -i
          - "{{ bootwright_ceph_remote_bootstrap_spec }}"
      register: bootwright_ceph_host_spec_apply
      changed_when: true

    - name: Apply Ceph core service spec
      ansible.builtin.command:
        argv:
          - ceph
          - orch
          - apply
          - -i
          - "{{ bootwright_ceph_remote_core_services_spec }}"
      register: bootwright_ceph_core_services_apply
      changed_when: true

    - name: Capture base Data Foundation external-cluster secrets
      ansible.builtin.command:
        argv: "{{ item.argv }}"
      loop:
        - name: fsid
          argv: [ceph, fsid]
        - name: adminSecret
          argv: [ceph, auth, get-key, client.admin]
        - name: monSecret
          argv: [ceph, auth, get-key, mon.]
      loop_control:
        label: "{{ item.name }}"
      register: bootwright_ceph_base_secret_commands
      changed_when: false
      no_log: true
      when: bootwright_selected_storage_cluster.dataFoundationBindings | default([]) | length > 0

    - name: Initialize Data Foundation result
      ansible.builtin.set_fact:
        bootwright_ceph_base_secrets: "{{ dict(bootwright_ceph_base_secret_commands.results | map(attribute='item.name') | zip(bootwright_ceph_base_secret_commands.results | map(attribute='stdout'))) }}"
        bootwright_data_foundation_result: {}
      no_log: true
      when: bootwright_selected_storage_cluster.dataFoundationBindings | default([]) | length > 0

    - name: Add base Data Foundation credentials for each binding
      ansible.builtin.set_fact:
        bootwright_data_foundation_result: >-
          {{
            bootwright_data_foundation_result
            | combine(
                dict([(item.cluster, {
                  'fsid': bootwright_ceph_base_secrets.fsid | default(''),
                  'adminSecret': bootwright_ceph_base_secrets.adminSecret | default(''),
                  'monSecret': bootwright_ceph_base_secrets.monSecret | default('')
                })]),
                recursive=True
              )
          }}
      loop: "{{ bootwright_selected_storage_cluster.dataFoundationBindings | default([]) }}"
      loop_control:
        label: "{{ item.cluster }}"
      no_log: true

    - name: Run rendered Ceph topology and storage operations
      ansible.builtin.include_tasks: ../operations/run.yml
      loop: "{{ bootwright_ceph_operations }}"
      loop_control:
        loop_var: bootwright_ceph_op
        label: "{{ bootwright_ceph_op.name | default('<unnamed>') }}"
      when:
        - bootwright_ceph_op.command | default([]) | length > 0
        - bootwright_ceph_op.phase | default('storage') in ['topology', 'storage']

    - name: Apply Ceph late service spec
      ansible.builtin.command:
        argv:
          - ceph
          - orch
          - apply
          - -i
          - "{{ bootwright_ceph_remote_late_services_spec }}"
      register: bootwright_ceph_late_services_apply
      changed_when: true

    - name: Run rendered Ceph late operations
      ansible.builtin.include_tasks: ../operations/run.yml
      loop: "{{ bootwright_ceph_operations }}"
      loop_control:
        loop_var: bootwright_ceph_op
        label: "{{ bootwright_ceph_op.name | default('<unnamed>') }}"
      when:
        - bootwright_ceph_op.command | default([]) | length > 0
        - bootwright_ceph_op.phase | default('storage') in ['object-gateway', 'data-foundation']

    - name: Create storage task artifact directory
      ansible.builtin.file:
        path: "{{ bootwright_ansible_artifacts_dir }}"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false
      when: bootwright_selected_storage_cluster.dataFoundationBindings | default([]) | length > 0

    - name: Write captured storage result
      ansible.builtin.copy:
        dest: "{{ bootwright_selected_storage_cluster.resultPath }}"
        content: "{{ {'dataFoundation': bootwright_data_foundation_result | default({})} | to_nice_json }}\n"
        mode: "0600"
      delegate_to: localhost
      become: false
      no_log: true
      when: bootwright_selected_storage_cluster.dataFoundationBindings | default([]) | length > 0

    - name: Record storage cluster ownership
      ansible.builtin.include_role:
        name: bootwright.core.helper_ownership
        tasks_from: resource.yml
      vars:
        bootwright_ownership_kind: storage-cluster
        bootwright_ownership_name: "{{ bootwright_selected_storage_cluster.name }}"
        bootwright_ownership_fields:
          cluster: "{{ bootwright_selected_storage_cluster.name }}"
          paths:
            - /etc/ceph
            - /var/lib/ceph
            - /var/log/ceph
          labels:
            bootwright.kind: storage-cluster
          attributes:
            seedHost: "{{ bootwright_selected_storage_cluster.seedHost | default('') }}"
            remoteWorkDir: "{{ bootwright_ceph_remote_work_dir }}"
  always:
    - name: Remove managed Ceph work directory
      ansible.builtin.file:
        path: "{{ bootwright_ceph_remote_work_dir }}"
        state: absent
      when: bootwright_ceph_remote_work_dir | default('') | length > 0
