---
- name: Apply managed Ceph cluster through cephadm
  block:
    - name: Stage cephadm inputs
      ansible.builtin.include_tasks: bootstrap_steps/stage_inputs.yml

    - name: Enforce cephadm apply mode
      ansible.builtin.include_tasks: bootstrap_steps/apply_mode.yml

    - name: Bootstrap Ceph cluster
      ansible.builtin.include_tasks: bootstrap_steps/bootstrap_cluster.yml

    - name: Stamp Ceph ownership marker
      ansible.builtin.include_tasks: bootstrap_steps/ownership_marker.yml

    - name: Capture dashboard bootstrap secret
      ansible.builtin.include_tasks: bootstrap_steps/dashboard_secret.yml

    - name: Apply Ceph base service specs
      ansible.builtin.include_tasks: bootstrap_steps/service_specs.yml

    - name: Capture base Data Foundation secrets
      ansible.builtin.include_tasks: bootstrap_steps/data_foundation_base.yml

    - name: Run Ceph topology and storage operations
      ansible.builtin.include_tasks: bootstrap_steps/topology_operations.yml

    - name: Apply Ceph late service specs
      ansible.builtin.include_tasks: bootstrap_steps/late_service_specs.yml

    - name: Run Ceph late operations
      ansible.builtin.include_tasks: bootstrap_steps/late_operations.yml

    - name: Write storage result and ownership
      ansible.builtin.include_tasks: bootstrap_steps/result_and_ownership.yml
  always:
    - name: Remove managed Ceph work directory
      ansible.builtin.include_tasks: bootstrap_steps/cleanup.yml
