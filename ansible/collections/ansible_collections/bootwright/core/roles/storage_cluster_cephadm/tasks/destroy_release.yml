---
- name: Validate the Ceph command timeout contract for ownership release
  ansible.builtin.import_tasks: timeout_contract.yml

- name: Release validated Ceph host ownership evidence
  ansible.builtin.import_tasks: destroy_steps/release_evidence.yml

- name: Confirm the storage node released its ownership evidence
  ansible.builtin.command:
    argv:
      - "true"
  changed_when: false
