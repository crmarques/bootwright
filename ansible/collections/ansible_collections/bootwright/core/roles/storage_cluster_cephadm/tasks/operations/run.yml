---
- name: Classify rendered Ceph operation
  ansible.builtin.set_fact:
    bootwright_ceph_op_name: "{{ bootwright_ceph_op.name | default('') }}"
    bootwright_ceph_op_capture: "{{ bootwright_ceph_op.capture | default({}) }}"
    bootwright_ceph_op_idempotency: "{{ bootwright_ceph_op.idempotency | default({}) }}"
    bootwright_ceph_op_idempotency_kind: "{{ bootwright_ceph_op.idempotency.kind | default('none') }}"
    bootwright_ceph_op_idempotency_name: "{{ bootwright_ceph_op.idempotency.name | default('') }}"
    bootwright_ceph_op_command: "{{ bootwright_ceph_op.command | default([]) }}"
    bootwright_ceph_op_skip: false
    bootwright_ceph_op_output: ""
    bootwright_ceph_op_capture_cluster: ""
    bootwright_ceph_op_capture_field: ""
    bootwright_ceph_op_key_line: ""
    bootwright_ceph_op_capture_rgw: false
    bootwright_ceph_op_rgw_payload: {}
    bootwright_ceph_op_pool_live: {}
    bootwright_ceph_op_pool_recreate: false
    bootwright_ceph_op_fs_live: {}
    bootwright_ceph_op_fs_recreate: false
  no_log: "{{ bootwright_ceph_op.capture is defined }}"

# --override may rebuild a sub-object whose IMMUTABLE identity drifted from desired —
# a pool's type/erasure profile, a CephFS's metadata pool — because Ceph cannot
# change these in place. This is DATA-DESTROYING for that sub-object, so it runs only
# under override mode and only on a proven structural mismatch against the LIVE
# cluster (the explicit op.structural carried by the rendered create operation vs the
# probed live object). A sub-object whose only drift is replica size/min-size/crush/
# application is reconciled in place by the set-* operations and is NEVER destroyed
# here. create/continue never reach this branch. After a rebuild deletes the object,
# the skip-if-exists probe below sees it absent and the create operation recreates it.
- name: Inspect existing Ceph pools for structural override rebuild
  ansible.builtin.command:
    argv:
      - ceph
      - osd
      - pool
      - ls
      - detail
      - --format
      - json
  register: bootwright_ceph_pool_detail
  changed_when: false
  failed_when: false
  when:
    - bootwright_ceph_op_idempotency_kind == 'ceph-pool'
    - (bootwright_apply_mode | default('continue')) == 'override'

- name: Resolve live Ceph pool for structural override rebuild
  ansible.builtin.set_fact:
    bootwright_ceph_op_pool_live: >-
      {{ ((bootwright_ceph_pool_detail.stdout | default('[]')) | from_json
          | selectattr('pool_name', 'equalto', bootwright_ceph_op_idempotency_name)
          | list | first | default({})) }}
  when:
    - bootwright_ceph_op_idempotency_kind == 'ceph-pool'
    - (bootwright_apply_mode | default('continue')) == 'override'

# Recreate only when the pool exists AND its live type (1=replicated, 3=erasure) no
# longer matches the desired structural type. If the live type cannot be read we do
# NOT recreate (fail-safe: fall through to the in-place reconcile, never destroy).
- name: Decide Ceph pool structural override rebuild
  ansible.builtin.set_fact:
    bootwright_ceph_op_pool_recreate: >-
      {{
        (bootwright_ceph_op_pool_live.pool_name | default('') | length > 0)
        and (
          ('erasure-coded' if (bootwright_ceph_op_pool_live.type | default(1)) == 3 else 'replicated')
          != (bootwright_ceph_op.structural.type | default('replicated'))
        )
      }}
  when:
    - bootwright_ceph_op_idempotency_kind == 'ceph-pool'
    - (bootwright_apply_mode | default('continue')) == 'override'

- name: Rebuild structurally drifted Ceph pool for override
  when:
    - bootwright_ceph_op_idempotency_kind == 'ceph-pool'
    - (bootwright_apply_mode | default('continue')) == 'override'
    - bootwright_ceph_op_pool_recreate | default(false) | bool
  block:
    - name: Allow Ceph pool deletion for override rebuild
      ansible.builtin.command:
        argv:
          - ceph
          - config
          - set
          - mon
          - mon_allow_pool_delete
          - "true"
      changed_when: true
    - name: Destroy structurally drifted Ceph pool for override rebuild
      ansible.builtin.command:
        argv:
          - ceph
          - osd
          - pool
          - rm
          - "{{ bootwright_ceph_op_idempotency_name }}"
          - "{{ bootwright_ceph_op_idempotency_name }}"
          - --yes-i-really-really-mean-it
      register: bootwright_ceph_op_pool_rm
      changed_when: true
      failed_when: false
  always:
    # Re-disable pool deletion even if the rm failed, so a half-finished rebuild never
    # leaves the cluster permissive. Failure is surfaced by the assert below.
    - name: Re-disable Ceph pool deletion after override rebuild
      ansible.builtin.command:
        argv:
          - ceph
          - config
          - set
          - mon
          - mon_allow_pool_delete
          - "false"
      changed_when: true

- name: Fail closed when override Ceph pool deletion failed
  ansible.builtin.assert:
    that:
      - bootwright_ceph_op_pool_rm.rc | default(1) == 0
    fail_msg: >-
      Failed to delete structurally drifted Ceph pool
      {{ bootwright_ceph_op_idempotency_name }} for an --override rebuild; refusing to
      continue with the pool partly removed.
  when:
    - bootwright_ceph_op_idempotency_kind == 'ceph-pool'
    - (bootwright_apply_mode | default('continue')) == 'override'
    - bootwright_ceph_op_pool_recreate | default(false) | bool

- name: Inspect existing CephFS for structural override rebuild
  ansible.builtin.command:
    argv:
      - ceph
      - fs
      - ls
      - --format
      - json
  register: bootwright_ceph_fs_detail
  changed_when: false
  failed_when: false
  when:
    - bootwright_ceph_op_idempotency_kind == 'cephfs'
    - (bootwright_apply_mode | default('continue')) == 'override'

- name: Resolve live CephFS for structural override rebuild
  ansible.builtin.set_fact:
    bootwright_ceph_op_fs_live: >-
      {{ ((bootwright_ceph_fs_detail.stdout | default('[]')) | from_json
          | selectattr('name', 'equalto', bootwright_ceph_op_idempotency_name)
          | list | first | default({})) }}
  when:
    - bootwright_ceph_op_idempotency_kind == 'cephfs'
    - (bootwright_apply_mode | default('continue')) == 'override'

# Recreate only when the filesystem exists AND its live metadata pool is readable AND
# differs from desired. An unreadable live metadata pool does NOT recreate (fail-safe).
- name: Decide CephFS structural override rebuild
  ansible.builtin.set_fact:
    bootwright_ceph_op_fs_recreate: >-
      {{
        (bootwright_ceph_op_fs_live.name | default('') | length > 0)
        and (bootwright_ceph_op_fs_live.metadata_pool | default('') | length > 0)
        and (bootwright_ceph_op_fs_live.metadata_pool | default('')
             != bootwright_ceph_op.structural.metadataPool | default(''))
      }}
  when:
    - bootwright_ceph_op_idempotency_kind == 'cephfs'
    - (bootwright_apply_mode | default('continue')) == 'override'

- name: Rebuild structurally drifted CephFS for override
  when:
    - bootwright_ceph_op_idempotency_kind == 'cephfs'
    - (bootwright_apply_mode | default('continue')) == 'override'
    - bootwright_ceph_op_fs_recreate | default(false) | bool
  block:
    - name: Fail drifted CephFS before override rebuild
      ansible.builtin.command:
        argv:
          - ceph
          - fs
          - fail
          - "{{ bootwright_ceph_op_idempotency_name }}"
      changed_when: true
      failed_when: false
    - name: Destroy structurally drifted CephFS for override rebuild
      ansible.builtin.command:
        argv:
          - ceph
          - fs
          - rm
          - "{{ bootwright_ceph_op_idempotency_name }}"
          - --yes-i-really-really-mean-it
      register: bootwright_ceph_op_fs_rm
      changed_when: true
      failed_when: bootwright_ceph_op_fs_rm.rc != 0

- name: Check existing Ceph pool
  ansible.builtin.command:
    argv:
      - ceph
      - osd
      - pool
      - ls
      - --format
      - json
  register: bootwright_ceph_pool_list
  changed_when: false
  failed_when: false
  when: bootwright_ceph_op_idempotency_kind == 'ceph-pool'

- name: Skip existing Ceph pool operation
  ansible.builtin.set_fact:
    bootwright_ceph_op_skip: true
  when:
    - bootwright_ceph_op_idempotency_kind == 'ceph-pool'
    - bootwright_ceph_op_idempotency_name in ((bootwright_ceph_pool_list.stdout | default('[]')) | from_json)

- name: Check existing CephFS
  ansible.builtin.command:
    argv:
      - ceph
      - fs
      - ls
      - --format
      - json
  register: bootwright_ceph_fs_list
  changed_when: false
  failed_when: false
  when: bootwright_ceph_op_idempotency_kind == 'cephfs'

- name: Skip existing CephFS operation
  ansible.builtin.set_fact:
    bootwright_ceph_op_skip: true
  when:
    - bootwright_ceph_op_idempotency_kind == 'cephfs'
    - bootwright_ceph_op_idempotency_name in ((bootwright_ceph_fs_list.stdout | default('[]')) | from_json | map(attribute='name') | list)

- name: Check existing CRUSH rule
  ansible.builtin.command:
    argv:
      - ceph
      - osd
      - crush
      - rule
      - dump
      - --format
      - json
  register: bootwright_ceph_crush_rules
  changed_when: false
  failed_when: false
  when: bootwright_ceph_op_idempotency_kind in ['crush-rule', 'stretch-crush-rule']

- name: Skip existing CRUSH rule operation
  ansible.builtin.set_fact:
    bootwright_ceph_op_skip: true
  when:
    - bootwright_ceph_op_idempotency_kind in ['crush-rule', 'stretch-crush-rule']
    - bootwright_ceph_op_idempotency_name in ((bootwright_ceph_crush_rules.stdout | default('[]')) | from_json | map(attribute='rule_name') | list)

# The stretch CRUSH rule must place two replicas per data site:
#   step choose firstn 0 type <failureDomain>
#   step chooseleaf firstn 2 type host
# `ceph osd crush rule create-replicated` cannot express that two-step rule, so
# it is compiled into the CRUSH map directly. crushtool is not installed on the
# host (only cephadm + ceph-common), so the de/compile steps run inside the
# cephadm shell container with the work directory mounted.
- name: Create stretch CRUSH rule in CRUSH map
  when:
    - bootwright_ceph_op_idempotency_kind == 'stretch-crush-rule'
    - not bootwright_ceph_op_skip | bool
  block:
    - name: Resolve next free CRUSH rule id for stretch rule
      ansible.builtin.set_fact:
        bootwright_ceph_stretch_rule_id: >-
          {{
            ((((bootwright_ceph_crush_rules.stdout | default('[]')) | from_json
               | map(attribute='rule_id') | list) + [0]) | max | int) + 1
          }}

    - name: Export current CRUSH map
      ansible.builtin.command:
        argv:
          - ceph
          - osd
          - getcrushmap
          - -o
          - "{{ bootwright_ceph_remote_work_dir }}/stretch-crushmap.bin"
      changed_when: false

    - name: Decompile current CRUSH map
      ansible.builtin.command:
        argv:
          - cephadm
          - shell
          - --mount
          - "{{ bootwright_ceph_remote_work_dir }}:/mnt"
          - --
          - crushtool
          - -d
          - /mnt/stretch-crushmap.bin
          - -o
          - /mnt/stretch-crushmap.txt
      changed_when: false

    - name: Append stretch rule to CRUSH map source
      ansible.builtin.blockinfile:
        path: "{{ bootwright_ceph_remote_work_dir }}/stretch-crushmap.txt"
        marker: "# {mark} BOOTWRIGHT STRETCH RULE {{ bootwright_ceph_op_idempotency_name }}"
        block: |
          rule {{ bootwright_ceph_op_idempotency_name }} {
              id {{ bootwright_ceph_stretch_rule_id }}
              type replicated
              step take default
              step choose firstn 0 type {{ bootwright_ceph_op.structural.failureDomain }}
              step chooseleaf firstn {{ bootwright_ceph_op.structural.replicasPerFailureDomain | default(2) }} type host
              step emit
          }
      changed_when: true

    - name: Compile CRUSH map with stretch rule
      ansible.builtin.command:
        argv:
          - cephadm
          - shell
          - --mount
          - "{{ bootwright_ceph_remote_work_dir }}:/mnt"
          - --
          - crushtool
          - -c
          - /mnt/stretch-crushmap.txt
          - -o
          - /mnt/stretch-crushmap-new.bin
      changed_when: false

    - name: Install CRUSH map with stretch rule
      ansible.builtin.command:
        argv:
          - ceph
          - osd
          - setcrushmap
          - -i
          - "{{ bootwright_ceph_remote_work_dir }}/stretch-crushmap-new.bin"
      changed_when: true

    - name: Mark stretch CRUSH rule operation as handled
      ansible.builtin.set_fact:
        bootwright_ceph_op_skip: true

- name: Check existing erasure-code profile
  ansible.builtin.command:
    argv:
      - ceph
      - osd
      - erasure-code-profile
      - ls
      - --format
      - json
  register: bootwright_ceph_ec_profiles
  changed_when: false
  failed_when: false
  when: bootwright_ceph_op_idempotency_kind == 'ec-profile'

- name: Skip existing erasure-code profile operation
  ansible.builtin.set_fact:
    bootwright_ceph_op_skip: true
  when:
    - bootwright_ceph_op_idempotency_kind == 'ec-profile'
    - bootwright_ceph_op_idempotency_name in ((bootwright_ceph_ec_profiles.stdout | default('[]')) | from_json)

- name: Check current stretch mode
  ansible.builtin.command:
    argv:
      - ceph
      - mon
      - dump
      - --format
      - json
  register: bootwright_ceph_mon_dump
  changed_when: false
  failed_when: false
  when: bootwright_ceph_op_idempotency_kind == 'stretch-mode'

- name: Skip enabled stretch mode operation
  ansible.builtin.set_fact:
    bootwright_ceph_op_skip: true
  when:
    - bootwright_ceph_op_idempotency_kind == 'stretch-mode'
    - ((bootwright_ceph_mon_dump.stdout | default('{}')) | from_json).stretch_mode | default(false) | bool

- name: Check existing RGW user
  ansible.builtin.command:
    argv:
      - radosgw-admin
      - user
      - info
      - --uid
      - "{{ bootwright_ceph_op_idempotency_name }}"
  register: bootwright_ceph_rgw_user_info
  changed_when: false
  failed_when: false
  no_log: "{{ bootwright_ceph_op_capture | length > 0 }}"
  when:
    - bootwright_ceph_op_idempotency_kind == 'rgw-user'
    - bootwright_ceph_op_idempotency_name | length > 0

- name: Reuse existing RGW user output
  ansible.builtin.set_fact:
    bootwright_ceph_op_skip: true
    bootwright_ceph_op_output: "{{ bootwright_ceph_rgw_user_info.stdout | default('') }}"
  no_log: "{{ bootwright_ceph_op_capture | length > 0 }}"
  when:
    - bootwright_ceph_rgw_user_info is defined
    - bootwright_ceph_rgw_user_info.rc | default(1) == 0

- name: Run Ceph operation
  ansible.builtin.command:
    argv: "{{ bootwright_ceph_op_command }}"
  register: bootwright_ceph_op_run
  changed_when: true
  no_log: "{{ bootwright_ceph_op_capture | length > 0 }}"
  when:
    - not bootwright_ceph_op_skip | bool
    - bootwright_ceph_op_command | length > 0

- name: Capture Ceph operation output
  ansible.builtin.set_fact:
    bootwright_ceph_op_output: "{{ bootwright_ceph_op_run.stdout | default('') }}"
  no_log: true
  when:
    - bootwright_ceph_op_capture | length > 0
    - bootwright_ceph_op_run is defined

- name: Resolve captured Ceph auth key
  ansible.builtin.set_fact:
    bootwright_ceph_op_capture_cluster: "{{ bootwright_ceph_op_capture.cluster | default('') }}"
    bootwright_ceph_op_capture_field: "{{ bootwright_ceph_op_capture.field | default('') }}"
    bootwright_ceph_op_key_line: "{{ (bootwright_ceph_op_output.split('\n') | select('match', '^\\s*key\\s*=') | list | first | default('')) }}"
  no_log: true
  when:
    - bootwright_ceph_op_capture | length > 0
    - bootwright_ceph_op_capture.type | default('') == 'ceph-auth-key'

- name: Add captured Ceph auth key to Data Foundation result
  ansible.builtin.set_fact:
    bootwright_data_foundation_result: >-
      {{
        bootwright_data_foundation_result
        | combine(
            dict([(bootwright_ceph_op_capture_cluster, dict([(bootwright_ceph_op_capture_field, bootwright_ceph_op_key)]))]),
            recursive=True
          )
      }}
  vars:
    bootwright_ceph_op_key: "{{ bootwright_ceph_op_key_line | regex_replace('^\\s*key\\s*=\\s*', '') | trim }}"
  no_log: true
  when:
    - bootwright_ceph_op_capture_cluster | default('') | length > 0
    - bootwright_ceph_op_capture_field | default('') | length > 0
    - bootwright_ceph_op_key | length > 0

- name: Classify RGW capture operation
  ansible.builtin.set_fact:
    bootwright_ceph_op_capture_rgw: true
  no_log: true
  when:
    - bootwright_ceph_op_capture | length > 0
    - bootwright_ceph_op_capture.type | default('') == 'rgw-user'
    - bootwright_ceph_op_output | length > 0

- name: Parse RGW user credentials
  ansible.builtin.set_fact:
    bootwright_ceph_op_capture_cluster: "{{ bootwright_ceph_op_capture.cluster | default('') }}"
    bootwright_ceph_op_rgw_payload: "{{ bootwright_ceph_op_output | from_json }}"
  no_log: true
  when: bootwright_ceph_op_capture_rgw | bool

- name: Add captured RGW user to Data Foundation result
  ansible.builtin.set_fact:
    bootwright_data_foundation_result: >-
      {{
        bootwright_data_foundation_result
        | combine(
            dict([(bootwright_ceph_op_capture_cluster, {
              'rgwAccessKey': bootwright_ceph_op_rgw_first_key.access_key | default(''),
              'rgwSecretKey': bootwright_ceph_op_rgw_first_key.secret_key | default('')
            })]),
            recursive=True
          )
      }}
  vars:
    bootwright_ceph_op_rgw_first_key: "{{ bootwright_ceph_op_rgw_payload['keys'] | default([]) | first | default({}) }}"
  no_log: true
  when:
    - bootwright_ceph_op_capture_rgw | bool
    - bootwright_ceph_op_capture_cluster | default('') | length > 0
    - bootwright_ceph_op_rgw_first_key.access_key | default('') | length > 0
    - bootwright_ceph_op_rgw_first_key.secret_key | default('') | length > 0
