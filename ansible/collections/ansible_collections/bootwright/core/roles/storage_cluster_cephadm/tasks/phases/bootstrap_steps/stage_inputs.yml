---
- name: Create managed Ceph work directory
  ansible.builtin.file:
    path: "{{ bootwright_ceph_remote_work_dir }}"
    state: directory
    mode: "0700"

- name: Copy cephadm bootstrap config
  ansible.builtin.copy:
    src: "{{ bootwright_selected_storage_cluster.ceph.bootstrapConfPath }}"
    dest: "{{ bootwright_ceph_remote_bootstrap_conf }}"
    mode: "0600"
  when: bootwright_selected_storage_cluster.ceph.bootstrapConfPath | default('') | length > 0

- name: Copy cephadm bootstrap spec
  ansible.builtin.copy:
    src: "{{ bootwright_selected_storage_cluster.ceph.bootstrapSpecPath }}"
    dest: "{{ bootwright_ceph_remote_bootstrap_spec }}"
    mode: "0600"

- name: Copy cephadm core service spec
  ansible.builtin.copy:
    src: "{{ bootwright_selected_storage_cluster.ceph.coreServicesSpecPath }}"
    dest: "{{ bootwright_ceph_remote_core_services_spec }}"
    mode: "0600"

- name: Copy cephadm late service spec
  ansible.builtin.copy:
    src: "{{ bootwright_selected_storage_cluster.ceph.lateServicesSpecPath }}"
    dest: "{{ bootwright_ceph_remote_late_services_spec }}"
    mode: "0600"

- name: Copy rendered Ceph operation manifest
  ansible.builtin.copy:
    src: "{{ bootwright_selected_storage_cluster.ceph.operationsPath }}"
    dest: "{{ bootwright_ceph_remote_operations }}"
    mode: "0600"

- name: Copy cephadm registry JSON
  ansible.builtin.copy:
    dest: "{{ bootwright_ceph_remote_registry_json }}"
    content: >-
      {{
        {
          'url': bootwright_ceph_registry_url,
          'username': bootwright_ceph_registry_credentials.username,
          'password': bootwright_ceph_registry_credentials.password
        } | to_json
      }}
    mode: "0600"
  no_log: "{{ bootwright_no_log | default(true) | bool }}"
  when:
    - bootwright_ceph_registry_url | length > 0
    - bootwright_ceph_registry_credentials is defined

- name: Copy cephadm cluster private SSH key
  ansible.builtin.copy:
    src: "{{ bootwright_selected_storage_cluster.clusterSSH.privateKeyPath }}"
    dest: "{{ bootwright_ceph_remote_private_key }}"
    mode: "0600"
  no_log: "{{ bootwright_no_log | default(true) | bool }}"
  when: bootwright_selected_storage_cluster.clusterSSH.privateKeyPath | default('') | length > 0

- name: Copy cephadm cluster public SSH key
  ansible.builtin.copy:
    src: "{{ bootwright_selected_storage_cluster.clusterSSH.publicKeyPath }}"
    dest: "{{ bootwright_ceph_remote_public_key }}"
    mode: "0644"
  no_log: "{{ bootwright_no_log | default(true) | bool }}"
  when: bootwright_selected_storage_cluster.clusterSSH.publicKeyPath | default('') | length > 0

- name: Copy cephadm cluster known hosts
  ansible.builtin.copy:
    src: "{{ bootwright_selected_storage_cluster.clusterSSH.knownHostsPath }}"
    dest: "{{ bootwright_ceph_remote_known_hosts }}"
    mode: "0600"
  when: bootwright_selected_storage_cluster.clusterSSH.knownHostsPath | default('') | length > 0

- name: Render cephadm SSH config
  ansible.builtin.copy:
    content: |
      Host *
        User {{ bootwright_selected_storage_cluster.clusterSSH.user | default('root') }}
        IdentityFile {{ bootwright_ceph_remote_private_key }}
        UserKnownHostsFile {{ bootwright_ceph_remote_known_hosts }}
        StrictHostKeyChecking yes
        BatchMode yes
    dest: "{{ bootwright_ceph_remote_ssh_config }}"
    mode: "0600"
  when:
    - bootwright_selected_storage_cluster.clusterSSH.privateKeyPath | default('') | length > 0
    - bootwright_selected_storage_cluster.clusterSSH.knownHostsPath | default('') | length > 0

- name: Verify cephadm seed SSH access to storage nodes
  ansible.builtin.command:
    argv:
      - ssh
      - -F
      - "{{ bootwright_ceph_remote_ssh_config }}"
      - "{{ item.address }}"
      - "true"
  register: bootwright_ceph_seed_ssh_check
  changed_when: false
  no_log: "{{ bootwright_no_log | default(true) | bool }}"
  loop: "{{ bootwright_selected_storage_cluster.hosts | default([]) }}"
  loop_control:
    label: "{{ item.hostname }}"
  when:
    - bootwright_selected_storage_cluster.clusterSSH.privateKeyPath | default('') | length > 0
    - bootwright_selected_storage_cluster.clusterSSH.knownHostsPath | default('') | length > 0
    - item.address | default('') | length > 0
