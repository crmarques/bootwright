---
- name: Classify rendered Ceph operation
  ansible.builtin.set_fact:
    bootwright_ceph_op_no_log: "{{ bootwright_ceph_op.no_log | default(false) }}"
    bootwright_ceph_op_idempotency_kind: "{{ bootwright_ceph_op.idempotency.kind | default('none') }}"
    bootwright_ceph_op_idempotency_name: "{{ bootwright_ceph_op.idempotency.name | default('') }}"
    bootwright_ceph_op_command: "{{ bootwright_ceph_op.command | default([]) }}"
    bootwright_ceph_op_skip: false
    bootwright_ceph_op_pool_live: {}
    bootwright_ceph_op_pool_recreate: false
    bootwright_ceph_op_fs_live: {}
    bootwright_ceph_op_fs_recreate: false
    bootwright_ceph_op_fs_default_pool_live: ""
    bootwright_ceph_op_ec_live: {}
    bootwright_ceph_op_ec_recreate: false
    # Reset the per-kind idempotency probe register too: it is registered only
    # for rgw-user ops and would otherwise persist across the operations loop.
    bootwright_ceph_rgw_user_info: {}
  no_log: "{{ bootwright_no_log | default(true) | bool }}"
