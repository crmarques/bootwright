---
- name: Validate subscription-backed Ceph entitlement paths
  ansible.builtin.assert:
    that:
      - bootwright_ceph_registry_url | length > 0
      - bootwright_ceph_registry_credentials_path | length > 0
    fail_msg: >-
      Ceph distribution {{ bootwright_ceph_provider_name }} requires registry
      credentialsRef entitlement material.

- name: Require accepted license for licensed Ceph distribution
  ansible.builtin.assert:
    that:
      - bootwright_ceph_provider.license.accepted | default(false) | bool
    fail_msg: >-
      Ceph distribution {{ bootwright_ceph_provider_name }} requires license acceptance;
      set the Environment entitlement license.accept=true.
  when: bootwright_ceph_provider.requiresLicense | default(false) | bool

- name: Probe RHSM registration identity
  ansible.builtin.command:
    argv:
      - subscription-manager
      - identity
  register: bootwright_ceph_rhsm_identity
  changed_when: false
  failed_when: false
  when: bootwright_ceph_provider.rhsmManagement | default('managed') != 'external'

- name: Require RHSM registration before enabling subscription repositories
  ansible.builtin.assert:
    that:
      - bootwright_ceph_rhsm_identity.rc == 0
    fail_msg: >-
      Storage node {{ bootwright_current_storage_host.hostname }} is not registered with RHSM.
      Registration runs in the machines-phase registration task; run a full apply or
      `bootwright apply --stage infra --clusters {{ bootwright_selected_storage_cluster.name }}`
      before retrying the cluster stage.
  when: bootwright_ceph_provider.rhsmManagement | default('managed') != 'external'

- name: Enable subscription-backed Ceph repositories (and disable the rest)
  community.general.rhsm_repository:
    name: "{{ bootwright_ceph_provider.repository.redhatRepos | default([]) }}"
    purge: true
  when:
    - (bootwright_ceph_provider.repository.redhatRepos | default([]) | length) > 0
    - bootwright_ceph_provider.rhsmManagement | default('managed') != 'external'

- name: Install vendor Ceph repository definition
  ansible.builtin.get_url:
    url: "{{ bootwright_ceph_provider.repository.ibmRepoURL }}"
    dest: /etc/yum.repos.d/ibm-storage-ceph.repo
    owner: root
    group: root
    mode: "0644"
  when: bootwright_ceph_provider.repository.ibmRepoURL | default('') | length > 0

- name: Install vendor Ceph license package
  ansible.builtin.package:
    name: ibm-storage-ceph-license
    state: present
  when: bootwright_ceph_provider.requiresLicense | default(false) | bool

- name: Accept vendor Ceph license provisions
  ansible.builtin.file:
    path: /usr/share/ibm-storage-ceph-license/accept
    state: touch
    owner: root
    group: root
    mode: "0644"
    modification_time: preserve
    access_time: preserve
  when: bootwright_ceph_provider.requiresLicense | default(false) | bool
