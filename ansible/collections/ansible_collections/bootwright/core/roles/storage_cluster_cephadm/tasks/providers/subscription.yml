---
- name: Validate subscription-backed Ceph entitlement paths
  ansible.builtin.assert:
    that:
      - bootwright_ceph_registry_url | length > 0
      - bootwright_ceph_registry_credentials_path | length > 0
    fail_msg: >-
      Ceph distribution {{ bootwright_ceph_provider_name }} requires registry
      credentialsRef entitlement material.

- name: Probe RHSM registration identity
  ansible.builtin.command:
    argv:
      - subscription-manager
      - identity
  register: bootwright_ceph_rhsm_identity
  changed_when: false
  failed_when: false
  when: bootwright_ceph_provider.rhsmManagement | default('managed') != 'external'

- name: Require RHSM registration before enabling subscription repositories
  ansible.builtin.assert:
    that:
      - bootwright_ceph_rhsm_identity.rc == 0
    fail_msg: >-
      Storage node {{ bootwright_current_storage_host.hostname }} is not registered with RHSM.
      Registration runs in the machines-phase registration task; run the exact
      full-scope invocation
      `{{ bootwright_apply_full_invocation | default('the same bootwright apply invocation without stage narrowing') }}`
      before retrying the cluster stage.
  when: bootwright_ceph_provider.rhsmManagement | default('managed') != 'external'

- name: Enable subscription-backed Ceph repositories (and disable the rest)
  community.general.rhsm_repository:
    name: >-
      {{ ((bootwright_ceph_provider.repository.redhatRepos | default([]))
          + (bootwright_machine_repositories.subscription.enable | default([])))
         | unique }}
    purge: true
  when:
    - (bootwright_ceph_provider.repository.redhatRepos | default([]) | length) > 0
    - bootwright_ceph_provider.rhsmManagement | default('managed') != 'external'
