---
- name: Resolve whether this host needs the Ceph device zap tool
  ansible.builtin.set_fact:
    bootwright_ceph_zap_tool_needed: >-
      {{ (bootwright_ceph_present_devices | default([]) | length > 0)
         or (bootwright_current_storage_host.osdReclaimAll | default(false) | bool) }}
  changed_when: false

- name: Ensure the Ceph device zap tool for the declared-device wipe
  ansible.builtin.include_tasks: ../ensure_zap_tool.yml

- name: Re-probe declared Ceph destroy devices for active mounts before wipe
  ansible.builtin.command:
    argv:
      - lsblk
      - --noheadings
      - --output
      - MOUNTPOINT
      - "{{ item }}"
  register: bootwright_ceph_device_mounts_final
  changed_when: false
  failed_when: false
  loop: "{{ bootwright_ceph_present_devices | default([]) }}"
  loop_control:
    label: "{{ bootwright_current_storage_host.hostname }} {{ item }}"

- name: Refuse to wipe devices whose mount re-probe did not run
  ansible.builtin.assert:
    that:
      - (bootwright_ceph_device_mounts_final.results | default([]) | selectattr('rc', 'defined') | list | length)
        == (bootwright_ceph_present_devices | default([]) | length)
    fail_msg: >-
      Refusing to wipe the declared Ceph devices of
      {{ bootwright_selected_storage_cluster.name }}/{{ bootwright_current_storage_host.hostname }}:
      the mount re-probe ran on
      {{ bootwright_ceph_device_mounts_final.results | default([]) | selectattr('rc', 'defined') | list | length }}
      of {{ bootwright_ceph_present_devices | default([]) | length }} present device(s)
      ({{ bootwright_ceph_device_mounts_final.msg | default('no diagnostic was recorded') }}).
      The refusal below reads those results to catch a device that became mounted since the
      first check, and an incomplete re-probe would let a mounted device through it
      unexamined. Failing closed instead.

- name: Refuse to wipe devices mounted since the first check
  ansible.builtin.assert:
    that:
      - item.rc | default(1) == 0
      - (item.stdout_lines | default([]) | map('trim') | reject('equalto', '') | list | length) == 0
    fail_msg: >-
      Refusing to wipe storage device {{ item.item }} for
      {{ bootwright_selected_storage_cluster.name }}/{{ bootwright_current_storage_host.hostname }}:
      it became mounted or in use after the initial check
      ({{ item.stdout_lines | default([]) | map('trim') | reject('equalto', '') | list | join(', ') }}).
    quiet: true
  loop: "{{ bootwright_ceph_device_mounts_final.results | default([]) }}"
  loop_control:
    label: "{{ bootwright_current_storage_host.hostname }} {{ item.item }}"

- name: Take the LVM stack down on the declared Ceph devices before the wipe
  ansible.builtin.include_tasks: lvm_teardown.yml
  vars:
    bootwright_ceph_lvm_teardown_devices: "{{ bootwright_ceph_present_devices | default([]) }}"
    bootwright_ceph_lvm_teardown_owned_devices: >-
      {{ (bootwright_ceph_present_devices | default([])
          | intersect(bootwright_ceph_recorded_osd_devices | default([])))
         if (bootwright_ceph_osd_marker_valid | default(false) | bool)
         else [] }}

- name: Wipe declared Ceph device signatures
  ansible.builtin.command:
    argv:
      - wipefs
      - --all
      - --force
      - "{{ item }}"
  register: bootwright_ceph_wipefs
  changed_when: true
  failed_when: bootwright_ceph_wipefs.rc != 0
  loop: "{{ bootwright_ceph_present_devices | default([]) }}"
  loop_control:
    label: "{{ bootwright_current_storage_host.hostname }} {{ item }}"

- name: Zap declared Ceph device partition tables
  ansible.builtin.command:
    argv:
      - sgdisk
      - --zap-all
      - "{{ item }}"
  register: bootwright_ceph_sgdisk
  changed_when: true
  failed_when: bootwright_ceph_sgdisk.rc != 0
  loop: "{{ bootwright_ceph_present_devices | default([]) }}"
  loop_control:
    label: "{{ bootwright_current_storage_host.hostname }} {{ item }}"
  when: bootwright_ceph_zap_tool_present | default(false) | bool

- name: Re-read the declared Ceph device signatures after the wipe
  ansible.builtin.command:
    argv:
      - wipefs
      - --no-act
      - --noheadings
      - "{{ item }}"
  register: bootwright_ceph_wipe_verify
  changed_when: false
  failed_when: false
  loop: "{{ bootwright_ceph_present_devices | default([]) }}"
  loop_control:
    label: "{{ bootwright_current_storage_host.hostname }} {{ item }}"

- name: Refuse to release a storage node whose wipe verification did not run
  ansible.builtin.assert:
    that:
      - (bootwright_ceph_wipe_verify.results | default([]) | selectattr('rc', 'defined') | list | length)
        == (bootwright_ceph_present_devices | default([]) | length)
    fail_msg: >-
      Refusing to release the Ceph state of
      {{ bootwright_selected_storage_cluster.name }}/{{ bootwright_current_storage_host.hostname }}:
      the post-wipe signature probe ran on
      {{ bootwright_ceph_wipe_verify.results | default([]) | selectattr('rc', 'defined') | list | length }}
      of {{ bootwright_ceph_present_devices | default([]) | length }} wiped device(s)
      ({{ bootwright_ceph_wipe_verify.msg | default('no diagnostic was recorded') }}).
      That probe is what proves the wipe reached the disk, and the ownership marker and record
      this teardown removes next are what the next apply reads to tell its own OSD data from
      foreign data. Removing them over an unverified wipe is what leaves a node no run can
      claim and no apply will use. Failing closed instead.

- name: Refuse to release a storage node whose declared device is still signed
  ansible.builtin.assert:
    that:
      - (item.rc | default(1) | int) == 0
      - (item.stdout | trim | length == 0)
    fail_msg: >-
      Storage device {{ item.item }} of
      {{ bootwright_selected_storage_cluster.name }}/{{ bootwright_current_storage_host.hostname }}
      {% if (item.rc | default(1) | int) != 0 %}could not be re-read after this teardown wiped
      it (wipefs exited {{ item.rc | default('without running') }}:
      {{ item.stderr | default('') | trim }}){% else %}still carries data signatures
      ({{ item.stdout | trim }}) after this teardown wiped and zapped it{% endif %}.
      A signature that outlives the wipe means something wrote the device behind this run:
      on a cluster removed host by host that is a cephadm manager still running on a host this
      teardown has not reached, reprovisioning the OSDs it just freed. This node is therefore
      not released: its ownership marker and this cluster's ownership record are kept, so a
      re-run of destroy still recognizes the devices as Bootwright's and wipes them again
      rather than refusing them as foreign data. If no cluster is left to reprovision them,
      the device has a holder outside this teardown — name it with
      `lsblk {{ item.item }}` and `dmsetup ls --tree` before re-running.
    quiet: true
  loop: "{{ bootwright_ceph_wipe_verify.results | default([]) }}"
  loop_control:
    label: "{{ bootwright_current_storage_host.hostname }} {{ item.item }}"

- name: Resolve owned Ceph fsid for local state removal
  ansible.builtin.set_fact:
    bootwright_ceph_cleanup_owned_fsid: >-
      {{ bootwright_ceph_destroy_fsid | default('') | trim
         if inventory_hostname == bootwright_selected_storage_cluster.seedHost | default('')
         else hostvars[bootwright_selected_storage_cluster.seedHost].bootwright_ceph_destroy_fsid
              | default('') | trim }}
  changed_when: false

- name: Scan for co-resident Ceph cluster directories before local state removal
  ansible.builtin.find:
    paths: /var/lib/ceph
    file_type: directory
  register: bootwright_ceph_cleanup_fsid_dirs

- name: Classify remaining Ceph fsid directories on this host
  ansible.builtin.set_fact:
    bootwright_ceph_cleanup_host_fsids: >-
      {{ bootwright_ceph_cleanup_fsid_dirs.files | default([])
         | map(attribute='path') | map('basename')
         | select('match', '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$')
         | list }}
  changed_when: false

- name: Resolve foreign Ceph fsids to preserve on this host
  ansible.builtin.set_fact:
    bootwright_ceph_cleanup_foreign_fsids: >-
      {{ bootwright_ceph_cleanup_host_fsids | default([])
         | reject('equalto', bootwright_ceph_cleanup_owned_fsid | default(''))
         | list }}
  changed_when: false

- name: Remove managed Ceph local state
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ bootwright_ceph_remote_work_dir }}"
    - /etc/ceph
    - /var/lib/ceph
    - /var/log/ceph
    - "{{ bootwright_ceph_ca_trust_anchor_path }}"
    - "{{ bootwright_ceph_rhsm_satellite_ca_anchor_path }}"
    - "{{ bootwright_ceph_proxy_ca_anchor_path }}"
    - "{{ bootwright_ceph_osd_marker_path }}"
  when: (bootwright_ceph_cleanup_foreign_fsids | default([])) | length == 0

- name: Read Ceph configuration before scoped local state removal
  ansible.builtin.slurp:
    src: /etc/ceph/ceph.conf
  register: bootwright_ceph_cleanup_conf
  changed_when: false
  failed_when: false
  when: (bootwright_ceph_cleanup_foreign_fsids | default([])) | length > 0

- name: Resolve Ceph configuration fsid for scoped local state removal
  ansible.builtin.set_fact:
    bootwright_ceph_cleanup_conf_fsid: >-
      {{ (bootwright_ceph_cleanup_conf.content | b64decode
          | regex_search('fsid\s*=\s*([0-9a-fA-F-]+)', '\1')
          | default([], true) | first | default('')) | trim }}
  changed_when: false
  when:
    - (bootwright_ceph_cleanup_foreign_fsids | default([])) | length > 0
    - (bootwright_ceph_cleanup_conf | default({})).content is defined

- name: Remove Bootwright-specific Ceph local state alongside a co-resident cluster
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ bootwright_ceph_remote_work_dir }}"
    - "{{ bootwright_ceph_ownership_marker_path }}"
    - "{{ bootwright_ceph_ca_trust_anchor_path }}"
    - "{{ bootwright_ceph_rhsm_satellite_ca_anchor_path }}"
    - "{{ bootwright_ceph_proxy_ca_anchor_path }}"
    - "{{ bootwright_ceph_osd_marker_path }}"
  when: (bootwright_ceph_cleanup_foreign_fsids | default([])) | length > 0

- name: Remove owned Ceph fsid directories alongside a co-resident cluster
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "/var/lib/ceph/{{ bootwright_ceph_cleanup_owned_fsid }}"
    - "/var/log/ceph/{{ bootwright_ceph_cleanup_owned_fsid }}"
  when:
    - (bootwright_ceph_cleanup_foreign_fsids | default([])) | length > 0
    - bootwright_ceph_cleanup_owned_fsid | default('') | length > 0

- name: Remove owned Ceph admin configuration alongside a co-resident cluster
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/ceph/ceph.conf
    - /etc/ceph/ceph.client.admin.keyring
    - /etc/ceph/ceph.pub
  when:
    - (bootwright_ceph_cleanup_foreign_fsids | default([])) | length > 0
    - bootwright_ceph_cleanup_owned_fsid | default('') | length > 0
    - bootwright_ceph_cleanup_conf_fsid | default('') == bootwright_ceph_cleanup_owned_fsid

- name: Preserve co-resident Ceph cluster state on this host
  ansible.builtin.debug:
    msg: >-
      Preserving /etc/ceph, /var/lib/ceph and /var/log/ceph on
      {{ bootwright_current_storage_host.hostname }}: foreign Ceph cluster fsid(s)
      {{ bootwright_ceph_cleanup_foreign_fsids | join(', ') }} not owned by
      {{ bootwright_selected_storage_cluster.name }} remain on this host after teardown,
      so only Bootwright's fsid-scoped state was removed and shared Ceph directories
      were kept intact.
  when: (bootwright_ceph_cleanup_foreign_fsids | default([])) | length > 0

- name: Resolve storage nodes whose device wipe did not run
  ansible.builtin.set_fact:
    bootwright_ceph_destroy_unwiped_hosts: >-
      {{ (bootwright_ceph_destroy_cluster_live_hosts
          | rejectattr('bootwright_ceph_wipefs', 'defined')
          | map(attribute='inventory_hostname') | list)
         + (bootwright_ceph_destroy_cluster_live_hosts
            | selectattr('bootwright_ceph_wipefs', 'defined')
            | selectattr('bootwright_ceph_wipefs.unreachable', 'defined')
            | selectattr('bootwright_ceph_wipefs.unreachable')
            | map(attribute='inventory_hostname') | list) }}
  vars:
    bootwright_ceph_destroy_cluster_live_hosts: >-
      {{ ansible_play_hosts_all
         | map('extract', hostvars)
         | selectattr('bootwright_storage_cluster_name', 'defined')
         | selectattr('bootwright_storage_cluster_name', 'equalto', bootwright_selected_storage_cluster.name)
         | selectattr('bootwright_storage_reachable_probe', 'defined')
         | rejectattr('bootwright_storage_reachable_probe.unreachable', 'defined')
         | list }}
  changed_when: false
  when: inventory_hostname == bootwright_selected_storage_cluster.seedHost | default('')

- name: Remove storage cluster ownership record
  ansible.builtin.include_role:
    name: bootwright.core.ownership_record
    tasks_from: remove_resource.yml
    apply:
      delegate_to: localhost
      become: false
  vars:
    bootwright_ownership_kind: storage-cluster
    bootwright_ownership_name: "{{ bootwright_selected_storage_cluster.name }}"
  when:
    - inventory_hostname == bootwright_selected_storage_cluster.seedHost | default('')
    - not (bootwright_storage_cluster_partial | default(false) | bool)
    - (bootwright_ceph_destroy_unwiped_hosts | default([])) | length == 0

- name: Keep the storage cluster ownership record for nodes lost mid-teardown
  ansible.builtin.debug:
    msg: >-
      Keeping the Bootwright ownership record for
      {{ bootwright_selected_storage_cluster.name }}: storage node(s)
      {{ bootwright_ceph_destroy_unwiped_hosts | join(', ') }} were reachable when this
      teardown began but stopped answering before their declared OSD devices were wiped,
      so their disks may still carry this cluster's data. The record preserves the
      partial-destroy marker; re-run destroy once the node(s) answer again, or wipe them
      manually, before reusing the hardware.
  when:
    - inventory_hostname == bootwright_selected_storage_cluster.seedHost | default('')
    - (bootwright_ceph_destroy_unwiped_hosts | default([])) | length > 0

- name: Remove Ceph package ownership records
  ansible.builtin.include_role:
    name: bootwright.core.ownership_record
    tasks_from: package_remove.yml
  vars:
    bootwright_ownership_packages: "{{ bootwright_ceph_managed_packages }}"
    bootwright_ownership_required_by: "storage-cluster:{{ bootwright_selected_storage_cluster.name }}"
