---
- name: Validate ownership destroy record
  ansible.builtin.assert:
    that:
      - bootwright_ownership_record.kind | default('') | length > 0
      - bootwright_ownership_record.name | default('') | length > 0
      - bootwright_mutating_invocation | default('') | length > 0
    fail_msg: >-
      Ownership resource destroy needs a record with kind and name and the exact
      controller-built retry invocation. Repair the task inputs and re-run
      `{{ bootwright_mutating_invocation | default('the same bootwright destroy') }}`.

- name: Refuse generic recorded infra-component teardown
  ansible.builtin.assert:
    quiet: true
    that:
      - bootwright_ownership_record.kind | default('') != 'infra-component'
    fail_msg: >-
      Refusing generic infra-component teardown because only the six fixed
      hardened component roles may interpret and mutate their exact recorded
      composites. No container, service, firewall endpoint, shared host setting,
      path, state marker, or ownership record was changed. Re-run the exact
      command `{{ bootwright_mutating_invocation }}` so the infra-component
      playbook can preflight every candidate and survivor before fixed-role
      dispatch.

- name: Resolve ownership destroy fields
  ansible.builtin.set_fact:
    bootwright_ownership_kind: "{{ bootwright_ownership_record.kind }}"
    bootwright_ownership_name: "{{ bootwright_ownership_record.name }}"
    bootwright_ownership_role: "{{ bootwright_ownership_record.role | default('owner', true) }}"
  changed_when: false

- name: Validate live ownership evidence before recorded resource mutation
  ansible.builtin.include_tasks: validate_resource.yml

- name: Require claimed partial BMC evidence to remain record-free
  ansible.builtin.assert:
    quiet: true
    that:
      - not (bootwright_ownership_validated_stat.stat.exists | bool)
    fail_msg: >-
      Refusing claimed partial BMC teardown because an ownership record appeared
      after the exact no-record durable-claim gate. No live member or evidence
      was changed. Re-read the current ownership state and re-run
      `{{ bootwright_mutating_invocation }}`; this recovery path never races or
      replaces a newly recorded provider service.
  when: bootwright_bmc_claimed_partial_destroy_verified | default(false) | bool

- name: Prefer validated live ownership evidence
  ansible.builtin.set_fact:
    bootwright_ownership_record: >-
      {{ bootwright_ownership_validated_record
         if (bootwright_ownership_validated_stat.stat.exists | bool)
         else bootwright_ownership_record }}
  changed_when: false

- name: Resolve ownership destroy fields
  ansible.builtin.set_fact:
    bootwright_ownership_destroy_kind: "{{ bootwright_ownership_record.kind }}"
    bootwright_ownership_destroy_name: "{{ bootwright_ownership_record.name }}"
    bootwright_ownership_destroy_attrs: "{{ bootwright_ownership_record.attributes | default({}) }}"
    bootwright_ownership_destroy_paths: "{{ bootwright_ownership_record.paths | default([]) }}"
  changed_when: false

- name: Revalidate recorded resource before teardown
  ansible.builtin.include_tasks: destroy_record_gate.yml

- name: Require live record or positive all-members-absent replay
  ansible.builtin.assert:
    quiet: true
    that:
      - >-
        bootwright_ownership_validated_stat.stat.exists | bool
        or (bootwright_ownership_destroy_kind == 'bmc-emulator'
            and bootwright_bmc_claimed_partial_destroy_verified | default(false) | bool)
        or (bootwright_ownership_destroy_kind == 'bmc-emulator'
            and bootwright_ownership_bmc_replay_absent | default(false) | bool)
        or (bootwright_ownership_destroy_kind == 'infra-component'
            and bootwright_ownership_infra_replay_absent | default(false) | bool)
    fail_msg: >-
      Refusing recorded resource teardown because its live ownership record is
      absent and not every destructive member has positive absence proof from a
      completed desired teardown. Restore exact evidence and re-run
      {{ bootwright_mutating_invocation }}.

- name: Resolve no-mutation recorded teardown replay
  ansible.builtin.set_fact:
    bootwright_ownership_destroy_replay_absent: >-
      {{
        (bootwright_ownership_destroy_kind == 'bmc-emulator'
         and bootwright_ownership_bmc_replay_absent | default(false) | bool)
        or (bootwright_ownership_destroy_kind == 'infra-component'
            and bootwright_ownership_infra_replay_absent | default(false) | bool)
      }}
  changed_when: false

- name: Acquire exact BMC endpoint authority for recorded or claim-backed teardown
  ansible.builtin.include_tasks: ../../provider_service_bmc_emulated/tasks/destroy_endpoint_claims.yml
  when:
    - bootwright_ownership_destroy_kind == 'bmc-emulator'
    - not (bootwright_ownership_bmc_replay_absent | default(false) | bool)

- name: Destroy exact BMC provider-global composite
  ansible.builtin.include_tasks: ../../provider_service_bmc_emulated/tasks/destroy_owned.yml
  when:
    - bootwright_ownership_destroy_kind == 'bmc-emulator'
    - not (bootwright_ownership_bmc_replay_absent | default(false) | bool)

- name: Stop recorded libvirt domain
  ansible.builtin.command:
    argv:
      - virsh
      - -c
      - "{{ bootwright_ownership_destroy_attrs.uri | default('qemu:///system', true) }}"
      - destroy
      - "{{ bootwright_ownership_destroy_attrs.domain }}"
  register: bootwright_ownership_libvirt_domain_stop
  changed_when: bootwright_ownership_libvirt_domain_stop.rc == 0
  failed_when:
    - bootwright_ownership_libvirt_domain_stop.rc != 0
    - >-
      not (((bootwright_ownership_libvirt_domain_stop.stderr | default(''))
            | bootwright.core.bootwright_libvirt_explicit_absence('libvirt-domain'))
           or ((bootwright_ownership_libvirt_domain_stop.stderr | default(''))
               is search('(?i)domain is not running')))
  when:
    - bootwright_ownership_destroy_kind == 'libvirt-domain'
    - bootwright_ownership_destroy_attrs.domain | default('') | length > 0

- name: Undefine recorded libvirt domain
  ansible.builtin.command:
    argv:
      - virsh
      - -c
      - "{{ bootwright_ownership_destroy_attrs.uri | default('qemu:///system', true) }}"
      - undefine
      - "{{ bootwright_ownership_destroy_attrs.domain }}"
  register: bootwright_ownership_libvirt_domain_undefine
  changed_when: bootwright_ownership_libvirt_domain_undefine.rc == 0
  failed_when:
    - bootwright_ownership_libvirt_domain_undefine.rc != 0
    - >-
      not ((bootwright_ownership_libvirt_domain_undefine.stderr | default(''))
           | bootwright.core.bootwright_libvirt_explicit_absence('libvirt-domain'))
  when:
    - bootwright_ownership_destroy_kind == 'libvirt-domain'
    - bootwright_ownership_destroy_attrs.domain | default('') | length > 0

- name: Stop recorded libvirt network
  ansible.builtin.command:
    argv:
      - virsh
      - -c
      - "{{ bootwright_ownership_destroy_attrs.uri | default('qemu:///system', true) }}"
      - net-destroy
      - "{{ bootwright_ownership_destroy_attrs.network }}"
  register: bootwright_ownership_libvirt_network_stop
  changed_when: bootwright_ownership_libvirt_network_stop.rc == 0
  failed_when:
    - bootwright_ownership_libvirt_network_stop.rc != 0
    - >-
      not (((bootwright_ownership_libvirt_network_stop.stderr | default(''))
            | bootwright.core.bootwright_libvirt_explicit_absence('libvirt-network'))
           or ((bootwright_ownership_libvirt_network_stop.stderr | default(''))
               is search('(?i)network is not active')))
  when:
    - bootwright_ownership_destroy_kind == 'libvirt-network'
    - bootwright_ownership_destroy_attrs.network | default('') | length > 0

- name: Undefine recorded libvirt network
  ansible.builtin.command:
    argv:
      - virsh
      - -c
      - "{{ bootwright_ownership_destroy_attrs.uri | default('qemu:///system', true) }}"
      - net-undefine
      - "{{ bootwright_ownership_destroy_attrs.network }}"
  register: bootwright_ownership_libvirt_network_undefine
  changed_when: bootwright_ownership_libvirt_network_undefine.rc == 0
  failed_when:
    - bootwright_ownership_libvirt_network_undefine.rc != 0
    - >-
      not ((bootwright_ownership_libvirt_network_undefine.stderr | default(''))
           | bootwright.core.bootwright_libvirt_explicit_absence('libvirt-network'))
  when:
    - bootwright_ownership_destroy_kind == 'libvirt-network'
    - bootwright_ownership_destroy_attrs.network | default('') | length > 0

- name: Remove recorded podman container
  containers.podman.podman_container:
    name: "{{ bootwright_ownership_destroy_attrs.container }}"
    state: absent
  when:
    - bootwright_ownership_destroy_attrs.container | default('') | length > 0
    - not (bootwright_ownership_destroy_replay_absent | default(false) | bool)

- name: Close recorded firewalld ports
  ansible.posix.firewalld:
    port: "{{ item }}"
    state: disabled
    permanent: true
    immediate: true
  loop: >-
    {{
      [
          bootwright_ownership_destroy_attrs.port | default(''),
          bootwright_ownership_destroy_attrs.udpPort | default(''),
          ((bootwright_ownership_destroy_attrs.redfishPort | default('') | string) ~ '/tcp')
          if (bootwright_ownership_destroy_attrs.redfishPort | default('') | string | length) > 0
          else ''
      ]
    }}
  loop_control:
    label: "{{ item }}"
  when:
    - bootwright_ownership_destroy_kind != 'bmc-emulator'
    - item | length > 0
    - not (bootwright_ownership_destroy_replay_absent | default(false) | bool)

- name: Resolve mount-safe recorded owned paths
  ansible.builtin.set_fact:
    bootwright_ownership_destroy_mount_paths: >-
      {{
        bootwright_ownership_destroy_paths | select() | reject('search', '[.][.]')
        | select('match', bootwright_ownership_owned_path_re) | list
      }}
  vars:
    bootwright_ownership_owned_path_prefixes: >-
      {{
        ['/var/lib/', '/var/log/', '/etc/systemd/system/', '/etc/sysctl.d/',
         '/etc/pki/ca-trust/source/anchors/', '/tmp/bootwright-']
        + ([bootwright_provider_state_dir | default(''), bootwright_managed_services_dir | default(''),
            bootwright_clusters_dir | default(''), bootwright_ownership_dir | default('')]
           | select() | map('regex_replace', '/$', '') | map('regex_replace', '$', '/'))
      }}
    bootwright_ownership_owned_path_re: "^({{ bootwright_ownership_owned_path_prefixes | map('regex_escape') | join('|') }})"
  changed_when: false

- name: List active mounts before removing owned paths
  ansible.builtin.command:
    argv:
      - findmnt
      - -rn
      - -o
      - TARGET
  register: bootwright_ownership_destroy_mounts
  changed_when: false
  when:
    - bootwright_ownership_destroy_kind != 'bmc-emulator'
    - bootwright_ownership_destroy_mount_paths | default([]) | length > 0
    - not (bootwright_ownership_destroy_replay_absent | default(false) | bool)

- name: Unmount active mounts under recorded owned paths
  ansible.posix.mount:
    path: "{{ item }}"
    state: unmounted
  vars:
    bootwright_ownership_destroy_mount_pattern: >-
      ^({{ bootwright_ownership_destroy_mount_paths | map('regex_escape') | join('|') }})(/|$)
  loop: >-
    {{
      (bootwright_ownership_destroy_mounts.stdout_lines | default([]))
      | select('match', bootwright_ownership_destroy_mount_pattern)
      | list | sort(reverse=true)
    }}
  loop_control:
    label: "{{ item }}"
  when:
    - bootwright_ownership_destroy_kind != 'bmc-emulator'
    - bootwright_ownership_destroy_mount_paths | default([]) | length > 0
    - not (bootwright_ownership_destroy_replay_absent | default(false) | bool)

- name: Remove recorded owned paths
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ bootwright_ownership_destroy_paths }}"
  loop_control:
    label: "{{ item }}"
  when:
    - bootwright_ownership_destroy_kind != 'bmc-emulator'
    - item | length > 0
    - "'..' not in item"
    - >-
      item is match('^/(var/lib/|var/log/|etc/systemd/system/|etc/sysctl.d/|etc/pki/ca-trust/source/anchors/|tmp/bootwright-)')
      or (bootwright_provider_state_dir | default('') | length > 0 and item.startswith(bootwright_provider_state_dir ~ '/'))
      or (bootwright_managed_services_dir | default('') | length > 0 and item.startswith(bootwright_managed_services_dir ~ '/'))
      or (bootwright_clusters_dir | default('') | length > 0 and item.startswith(bootwright_clusters_dir ~ '/'))
      or (bootwright_ownership_dir | default('') | length > 0 and item.startswith(bootwright_ownership_dir ~ '/'))
    - not (bootwright_ownership_destroy_replay_absent | default(false) | bool)

- name: Revalidate host operation before BMC owner record removal
  ansible.builtin.include_tasks: require_host_shared_service_operation.yml
  when:
    - bootwright_ownership_destroy_kind == 'bmc-emulator'
    - not (bootwright_bmc_claimed_partial_destroy_verified | default(false) | bool)

- name: Remove destroyed ownership resource record
  ansible.builtin.include_role:
    name: bootwright.core.ownership_record
    tasks_from: remove_resource.yml
  vars:
    bootwright_ownership_kind: "{{ bootwright_ownership_destroy_kind }}"
    bootwright_ownership_name: "{{ bootwright_ownership_destroy_name }}"
    bootwright_ownership_expected_record: "{{ bootwright_ownership_record }}"
  when: not (bootwright_bmc_claimed_partial_destroy_verified | default(false) | bool)
