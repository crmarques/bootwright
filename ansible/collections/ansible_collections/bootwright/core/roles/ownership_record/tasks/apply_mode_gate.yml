---
- name: "Refuse greenfield apply over existing {{ bootwright_gate_object }}"
  ansible.builtin.fail:
    msg: >-
      {{ bootwright_gate_object }} already exists on {{ inventory_hostname }};
      apply --expect-new requires a greenfield environment. Re-run without
      --expect-new to reconcile it, or with --override to rebuild it.
  when:
    - (bootwright_apply_mode | default('continue')) == 'create'
    - bootwright_gate_exists | default(false) | bool

- name: "Refuse to modify foreign {{ bootwright_gate_object }}"
  ansible.builtin.fail:
    msg: >-
      {{ bootwright_gate_object }} exists on {{ inventory_hostname }} but is not
      recognized as Bootwright-managed; refusing to modify a component Bootwright did
      not create. Remove it manually after verifying it is safe, then re-apply.
  when:
    - (bootwright_apply_mode | default('continue')) in ['continue', 'override']
    - bootwright_gate_exists | default(false) | bool
    - not (bootwright_gate_owned | default(false) | bool)
