---
- name: "Probe host-global claim for {{ bootwright_component.name }}"
  ansible.builtin.include_tasks: probe_infra_component_global_claim.yml

- name: "Probe Bootwright-owned container for {{ bootwright_component.name }}"
  ansible.builtin.command:
    argv:
      - podman
      - ps
      - --all
      - --quiet
      - --filter
      - "label=bootwright.provider={{ bootwright_component.providerName }}"
      - --filter
      - "label=bootwright.name={{ bootwright_component.name }}"
  register: bootwright_infra_component_owned_probe
  changed_when: false
  failed_when: false

- name: "Probe any same-named container for {{ bootwright_component.name }}"
  ansible.builtin.command:
    argv:
      - podman
      - ps
      - --all
      - --quiet
      - --filter
      - "name=^{{ bootwright_gate_container_name }}$"
  register: bootwright_infra_component_name_probe
  changed_when: false
  failed_when: false
  when: (bootwright_gate_container_name | default('') | trim) | length > 0

- name: "Probe service claim directory for {{ bootwright_component.name }}"
  ansible.builtin.stat:
    path: "{{ bootwright_managed_services_dir }}/{{ bootwright_component.name }}"
  register: bootwright_infra_component_claim_root
  changed_when: false
  failed_when: false

- name: "Probe service context marker for {{ bootwright_component.name }}"
  ansible.builtin.stat:
    path: "{{ bootwright_managed_services_dir }}/{{ bootwright_component.name }}/.bootwright-context"
  register: bootwright_infra_component_claim_marker
  changed_when: false
  failed_when: false

- name: "Read service context marker for {{ bootwright_component.name }}"
  ansible.builtin.slurp:
    src: "{{ bootwright_managed_services_dir }}/{{ bootwright_component.name }}/.bootwright-context"
  register: bootwright_infra_component_claim_content
  changed_when: false
  failed_when: false
  when: bootwright_infra_component_claim_marker.stat.exists | default(false) | bool

- name: "Refuse unreadable container ownership probes for {{ bootwright_component.name }}"
  ansible.builtin.assert:
    quiet: true
    that:
      - >-
        bootwright_gate_owned_probe_missing_binary | bool
        or (
          bootwright_infra_component_owned_probe.rc is defined
          and bootwright_infra_component_owned_probe.stdout is defined
          and bootwright_infra_component_owned_probe.stderr is defined
          and bootwright_infra_component_owned_probe.rc | int == 0
        )
      - >-
        bootwright_gate_name_probe_missing_binary | bool
        or (
          bootwright_infra_component_name_probe.rc is defined
          and bootwright_infra_component_name_probe.stdout is defined
          and bootwright_infra_component_name_probe.stderr is defined
          and bootwright_infra_component_name_probe.rc | int == 0
        )
    fail_msg: >-
      Cannot prove whether {{ bootwright_component.providerName }}/{{ bootwright_component.name }}
      already exists because its Podman ownership probes failed on {{ inventory_hostname }}.
      Repair Podman access, then re-run `{{ bootwright_mutating_invocation }}`.
  vars:
    bootwright_gate_owned_probe_missing_binary: >-
      {{ (bootwright_infra_component_owned_probe.msg | default('')) is search('(?i)(No such file or directory|not found)') }}
    bootwright_gate_name_probe_missing_binary: >-
      {{ (bootwright_infra_component_name_probe.msg | default('')) is search('(?i)(No such file or directory|not found)') }}

- name: "Refuse unreadable service context claim for {{ bootwright_component.name }}"
  ansible.builtin.assert:
    quiet: true
    that:
      - bootwright_infra_component_claim_root.stat.exists is defined
      - bootwright_infra_component_claim_marker.stat.exists is defined
      - >-
        not (bootwright_infra_component_claim_root.stat.exists | bool)
        or (
          bootwright_infra_component_claim_root.stat.isdir | default(false) | bool
          and not (bootwright_infra_component_claim_root.stat.islnk | default(false) | bool)
        )
      - >-
        not (bootwright_infra_component_claim_marker.stat.exists | bool)
        or (
          bootwright_infra_component_claim_marker.stat.isreg | default(false) | bool
          and not (bootwright_infra_component_claim_marker.stat.islnk | default(false) | bool)
          and bootwright_infra_component_claim_content.content is defined
        )
    fail_msg: >-
      Cannot prove which context owns {{ bootwright_component.providerName }}/{{ bootwright_component.name }}
      because its service claim on {{ inventory_hostname }} is unreadable.
      Repair access to {{ bootwright_managed_services_dir }}/{{ bootwright_component.name }},
      then re-run `{{ bootwright_mutating_invocation }}`.

- name: "Read owning context from existing {{ bootwright_component.name }} container"
  ansible.builtin.command:
    argv:
      - podman
      - container
      - inspect
      - --format
      - json
      - "{{ bootwright_gate_container_name }}"
  register: bootwright_infra_component_context_probe
  changed_when: false
  failed_when: false
  when: (bootwright_infra_component_name_probe.stdout | default('') | trim) | length > 0

- name: "Refuse unreadable owning context for {{ bootwright_component.name }}"
  ansible.builtin.assert:
    quiet: true
    that:
      - bootwright_infra_component_context_probe.rc is defined
      - bootwright_infra_component_context_probe.stdout is defined
      - bootwright_infra_component_context_probe.stderr is defined
      - bootwright_infra_component_context_probe.rc | int == 0
    fail_msg: >-
      Cannot prove which context owns the existing {{ bootwright_component.providerName }}/{{ bootwright_component.name }}
      container on {{ inventory_hostname }} because Podman inspect failed.
      Repair Podman access, then re-run `{{ bootwright_mutating_invocation }}`.
  when:
    - bootwright_infra_component_context_probe is not skipped

- name: "Classify existing container context for {{ bootwright_component.name }}"
  ansible.builtin.set_fact:
    bootwright_gate_container_context_decision: >-
      {{ (bootwright_infra_component_context_probe.stdout | default(''))
         | bootwright.core.bootwright_podman_container_context
         if (bootwright_infra_component_context_probe.stdout | default('') | trim) | length > 0
         else {'valid': true, 'context': ''} }}
  changed_when: false

- name: "Refuse malformed existing container identity for {{ bootwright_component.name }}"
  ansible.builtin.assert:
    quiet: true
    that:
      - bootwright_gate_container_context_decision.valid | default(false) | bool
    fail_msg: >-
      Cannot prove which context owns the existing
      {{ bootwright_component.providerName }}/{{ bootwright_component.name }}
      container because Podman returned malformed or ambiguous inspect JSON.
      No transition, claim, or role state was changed. Repair Podman state and
      re-run `{{ bootwright_mutating_invocation }}`.

- name: "Resolve apply-mode gate facts for {{ bootwright_component.name }}"
  ansible.builtin.set_fact:
    bootwright_gate_object: "infra-component {{ bootwright_component.providerName }}/{{ bootwright_component.name }}"
    bootwright_gate_owned: "{{ (bootwright_infra_component_owned_probe.stdout | default('') | trim) | length > 0 }}"
    bootwright_gate_exists: >-
      {{ ((bootwright_infra_component_owned_probe.stdout | default('') | trim) | length > 0)
         or ((bootwright_infra_component_name_probe.stdout | default('') | trim) | length > 0) }}
    bootwright_gate_existing_context: >-
      {{ bootwright_gate_container_context_decision.context | default('') }}
    bootwright_gate_claim_context: >-
      {{ bootwright_infra_component_claim_content.content | default('') | b64decode | trim }}
    bootwright_gate_current_context: "{{ bootwright_clusters_dir | dirname | basename }}"
  changed_when: false

- name: "Refuse malformed service context claim for {{ bootwright_component.name }}"
  ansible.builtin.assert:
    quiet: true
    that:
      - >-
        not (bootwright_infra_component_claim_marker.stat.exists | default(false) | bool)
        or (
          bootwright_gate_claim_context is match('^[A-Za-z0-9_.-]+$')
          and (bootwright_infra_component_claim_content.content | b64decode)
              == bootwright_gate_claim_context ~ '\n'
        )
    fail_msg: >-
      Refusing infra-component apply because the existing service claim is not
      one exact canonical context line. No transition, service claim, or role
      state was changed. Restore the exact claim and re-run
      `{{ bootwright_mutating_invocation }}`.

- name: "Refuse unclaimed existing service state for {{ bootwright_component.name }}"
  ansible.builtin.fail:
    msg: >-
      Cannot prove which context owns the existing
      {{ bootwright_component.providerName }}/{{ bootwright_component.name }} service state on
      {{ inventory_hostname }}. Inspect and move or remove
      {{ bootwright_managed_services_dir }}/{{ bootwright_component.name }} only after proving it is safe,
      then re-run `{{ bootwright_mutating_invocation }}`; no apply authorization adopts unknown service state.
  when:
    - bootwright_infra_component_claim_root.stat.exists | default(false) | bool
    - (bootwright_gate_claim_context | trim) | length == 0
    - bootwright_gate_existing_context != bootwright_gate_current_context

- name: "Refuse unclaimed existing container for {{ bootwright_component.name }}"
  ansible.builtin.fail:
    msg: >-
      Cannot prove which context owns the existing
      {{ bootwright_component.providerName }}/{{ bootwright_component.name }} container on
      {{ inventory_hostname }} because it has no Bootwright context label. Inspect and remove or rename
      {{ bootwright_gate_container_name }} only after proving it is safe, then re-run
      `{{ bootwright_mutating_invocation }}`; no apply authorization adopts an unknown container.
  when:
    - (bootwright_infra_component_name_probe.stdout | default('') | trim) | length > 0
    - (bootwright_gate_existing_context | trim) | length == 0

- name: "Refuse cross-context overwrite of {{ bootwright_component.name }}"
  ansible.builtin.fail:
    msg: >-
      {{ bootwright_gate_object }} on {{ inventory_hostname }} is owned by context
      {{ bootwright_gate_existing_context }}, not {{ bootwright_gate_current_context }}.
      Inspect and reconcile or destroy it from its owning context, then re-run
      `{{ bootwright_mutating_invocation }}`; no apply authorization adopts another context's service.
  when:
    - (bootwright_gate_existing_context | default('') | trim) | length > 0
    - bootwright_gate_existing_context != bootwright_gate_current_context

- name: "Refuse cross-context service claim for {{ bootwright_component.name }}"
  ansible.builtin.fail:
    msg: >-
      {{ bootwright_gate_object }} service state on {{ inventory_hostname }} is claimed by context
      {{ bootwright_gate_claim_context }}, not {{ bootwright_gate_current_context }}.
      Inspect and reconcile or destroy it from its owning context, then re-run
      `{{ bootwright_mutating_invocation }}`; no apply authorization adopts another context's service.
  when:
    - (bootwright_gate_claim_context | default('') | trim) | length > 0
    - bootwright_gate_claim_context != bootwright_gate_current_context

- name: "Enforce apply mode for {{ bootwright_component.name }}"
  ansible.builtin.include_tasks: apply_mode_gate.yml

- name: "Publish exact transition before service claim for {{ bootwright_component.name }}"
  ansible.builtin.include_tasks: begin_infra_component_transition.yml

- name: "Revalidate host operation before service claim for {{ bootwright_component.name }}"
  ansible.builtin.include_tasks: require_host_shared_service_operation.yml

- name: "Acquire service claim atomically before mutation for {{ bootwright_component.name }}"
  bootwright.core.claim_cas:
    path: "{{ bootwright_managed_services_dir }}/{{ bootwright_component.name }}/.bootwright-context"
    state: present
    desired_content: "{{ bootwright_gate_current_context }}\n"
    expected_contents: >-
      {{ [bootwright_infra_component_claim_content.content | b64decode]
         if (bootwright_infra_component_claim_marker.stat.exists | default(false) | bool)
         else [] }}
    allow_absent: >-
      {{ not (bootwright_infra_component_claim_marker.stat.exists | default(false) | bool) }}
    create_parents: true
    trusted_root: /var/lib/bootwright
  register: bootwright_infra_component_context_claim_cas
  failed_when: false

- name: "Re-read atomic service claim winner for {{ bootwright_component.name }}"
  ansible.builtin.slurp:
    src: "{{ bootwright_managed_services_dir }}/{{ bootwright_component.name }}/.bootwright-context"
  register: bootwright_infra_component_claim_winner
  changed_when: false
  failed_when: false

- name: "Require exact atomic service claim winner for {{ bootwright_component.name }}"
  ansible.builtin.assert:
    quiet: true
    that:
      - bootwright_infra_component_context_claim_cas.current_sha256 is defined
      - bootwright_infra_component_claim_winner.content is defined
      - >-
        (bootwright_infra_component_claim_winner.content | b64decode)
        == bootwright_gate_current_context ~ '\n'
    fail_msg: >-
      Refusing infra-component apply because the atomic service-claim winner
      could not be re-read as this exact context before the first role mutation.
      The durable transition was retained. Inspect the competing claim and
      re-run `{{ bootwright_mutating_invocation }}`.

- name: "Normalize service claim directory after exact claim for {{ bootwright_component.name }}"
  ansible.builtin.file:
    path: "{{ bootwright_managed_services_dir }}/{{ bootwright_component.name }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
    follow: false
