---
# Apply-mode gate for a container-backed infra-component. Detects whether a
# container for this (provider, name) already exists by label (independent of the
# exact container name each role uses) and whether Bootwright recorded ownership of
# it, then enforces the apply-mode contract via apply_mode_gate.yml. Safe before the
# component is created: a missing podman binary or no matching container both read
# as "does not exist".
- name: "Probe existing container for {{ bootwright_component.name }}"
  ansible.builtin.command:
    argv:
      - podman
      - ps
      - --all
      - --quiet
      - --filter
      - "label=bootwright.provider={{ bootwright_component.providerName }}"
      - --filter
      - "label=bootwright.name={{ bootwright_component.name }}"
  register: bootwright_infra_component_probe
  changed_when: false
  failed_when: false

- name: "Stat ownership record for {{ bootwright_component.name }}"
  ansible.builtin.stat:
    path: "{{ bootwright_ownership_dir }}/resources/infra-component/{{ bootwright_component.providerName }}-{{ bootwright_component.name }}.json"
  register: bootwright_infra_component_owned_stat

- name: "Resolve apply-mode gate facts for {{ bootwright_component.name }}"
  ansible.builtin.set_fact:
    bootwright_gate_object: "infra-component {{ bootwright_component.providerName }}/{{ bootwright_component.name }}"
    bootwright_gate_exists: "{{ (bootwright_infra_component_probe.stdout | default('') | trim) | length > 0 }}"
    bootwright_gate_owned: "{{ bootwright_infra_component_owned_stat.stat.exists | default(false) }}"
  changed_when: false

- name: "Enforce apply mode for {{ bootwright_component.name }}"
  ansible.builtin.include_tasks: apply_mode_gate.yml
