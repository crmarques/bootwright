---
- name: Validate the frozen Ceph host request
  ansible.builtin.assert:
    that:
      - bootwright_ceph_host_request.version == 'ceph-host-v14'
      - bootwright_ceph_host_digest is match('^[0-9a-f]{64}$')
      - ansible_connection == 'local'
    quiet: true
  no_log: true

- name: Complete the host preparation handoff
  bootwright.core.ceph_cluster_protocol:
    phase: loaded
  no_log: true

- name: Start from no reported step
  ansible.builtin.set_fact:
    storage_ceph_host_changed: false
    storage_ceph_host_applied: []
    storage_ceph_host_plan_digest: ''
    storage_ceph_host_pull_seconds: 4285
  no_log: true

# Each step is one fixed module call that resumes from the host's own journals,
# reported as the group the Go plan froze under the same ID (hostGroups in
# internal/storage/ceph/host.go). The Ceph image, then each frozen batch of this
# host's auxiliary images (pulled at once within its call), is its own images
# step and group; the batches share what remains of the images budget. A
# refused step fails the play, so no later step runs.
- name: Prepare the host one reported step at a time
  ansible.builtin.include_tasks: step.yml
  loop: >-
    {{ [{'step': 'packages', 'group': 'install-packages'}, {'step': 'images', 'group': 'pull-ceph-image'}]
       + bootwright_ceph_host_request.pulls
       + [{'step': 'profile', 'group': 'prove-runtime'}, {'step': 'route', 'group': 'prove-route'},
          {'step': 'devices', 'group': 'identify-devices'}] }}
  loop_control:
    loop_var: storage_ceph_host_phase
    label: '{{ storage_ceph_host_phase.group }}'

- name: Prove the prepared host and collect its evidence
  bootwright.core.ceph_host:
    request: '{{ bootwright_ceph_host_request }}'
    operation: apply
    step: verify
    plan_digest: '{{ storage_ceph_host_plan_digest }}'
    applied: '{{ storage_ceph_host_applied }}'
    digest: '{{ bootwright_ceph_host_digest }}'
    material: '{{ bootwright_ceph_host_material }}'
  register: storage_ceph_host_result
  failed_when: false
  no_log: true
  diff: false

- name: Publish the fixed Ceph host refusal
  bootwright.core.ceph_cluster_protocol:
    phase: refused
    reason: '{{ storage_ceph_host_result.reason | default("adapter-exception") }}'
    native_error: '{{ storage_ceph_host_result.nativeError | default(omit) }}'
    detail: >-
      {{ storage_ceph_host_result.detail
        | default(omit if storage_ceph_host_result.reason is defined else "module-failure") }}
  when: storage_ceph_host_result.evidence is not defined
  no_log: true

- name: Refuse an unproved Ceph host operation
  ansible.builtin.fail:
    msg: The Ceph host operation was refused; the run names its reason
  when: storage_ceph_host_result.evidence is not defined

- name: Publish bounded Ceph host evidence
  bootwright.core.ceph_cluster_protocol:
    phase: completed
    digest: '{{ bootwright_ceph_host_digest }}'
    outcome: '{{ "changed" if storage_ceph_host_changed else "unchanged" }}'
    observed: false
    removed: false
    evidence: '{{ storage_ceph_host_result.evidence }}'
  no_log: true
