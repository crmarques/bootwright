---
- name: Resolve direct libvirt virtual media action
  ansible.builtin.set_fact:
    bootwright_libvirt_media_action: >-
      {{
        'cleanup'
        if (bootwright_vmedia_action_effective | default('boot')) == 'cleanup_media'
        else (bootwright_vmedia_action_effective | default('boot'))
      }}
  changed_when: false

- name: Validate direct libvirt virtual media action
  ansible.builtin.assert:
    that:
      - bootwright_libvirt_media_action in ['boot', 'cleanup', 'cleanup_persistent']
    fail_msg: "Unsupported direct libvirt virtual media action {{ bootwright_libvirt_media_action }}"

- name: Clean stale running virtual media before insert
  ansible.builtin.include_tasks: eject.yml
  vars:
    bootwright_libvirt_media_scope: running
    bootwright_libvirt_media_domblklist_args: []
    bootwright_libvirt_media_change_media_arg: --live
    bootwright_libvirt_media_detach_drive: "{{ bootwright_libvirt_media_action == 'cleanup' }}"
  when: bootwright_libvirt_media_action in ['boot', 'cleanup']

- name: Clean stale persistent virtual media before insert
  ansible.builtin.include_tasks: eject.yml
  vars:
    bootwright_libvirt_media_scope: persistent
    bootwright_libvirt_media_domblklist_args:
      - --inactive
    bootwright_libvirt_media_change_media_arg: --config
    bootwright_libvirt_media_detach_drive: "{{ bootwright_libvirt_media_action == 'cleanup' }}"
  when: bootwright_libvirt_media_action in ['boot', 'cleanup', 'cleanup_persistent']

- name: Resolve direct libvirt virtual media insert state
  ansible.builtin.set_fact:
    bootwright_libvirt_media_insert_requested: "{{ bootwright_libvirt_media_action == 'boot' }}"
    bootwright_libvirt_media_stage_dir: "{{ bootwright_component.boot.agentIso.stagePath | dirname }}"
    bootwright_libvirt_media_boot_order: "{{ bootwright_component.boot.media.libvirt.bootOrder | default('disk-first') }}"
    bootwright_libvirt_media_helper_path: "/var/tmp/bootwright-libvirt-media-insert-{{ lookup('ansible.builtin.file', role_path ~ '/files/insert_libvirt_media.py') | hash('sha1') }}.py"
  changed_when: false
  no_log: "{{ bootwright_no_log | default(true) | bool }}"

- name: Install virtual media insert helper
  ansible.builtin.copy:
    src: insert_libvirt_media.py
    dest: "{{ bootwright_libvirt_media_helper_path }}"
    owner: root
    group: root
    mode: "0700"
  delegate_to: "{{ bootwright_component.boot.media.libvirt.machineRef }}"
  become: true
  when: bootwright_libvirt_media_insert_requested | bool

- name: Insert staged virtual media directly into libvirt domain
  ansible.builtin.command:
    argv:
      - "{{ bootwright_libvirt_media_helper_path }}"
      - "{{ bootwright_component.boot.media.libvirt.uri }}"
      - "{{ bootwright_component.boot.media.libvirt.domain }}"
      - "{{ bootwright_component.boot.agentIso.stagePath }}"
      - "{{ bootwright_libvirt_media_boot_order }}"
  environment:
    TMPDIR: "{{ bootwright_libvirt_media_stage_dir }}"
    TMP: "{{ bootwright_libvirt_media_stage_dir }}"
    TEMP: "{{ bootwright_libvirt_media_stage_dir }}"
  register: bootwright_libvirt_media_insert
  changed_when: bootwright_libvirt_media_insert.stdout is search('(?m)^changed=true$')
  delegate_to: "{{ bootwright_component.boot.media.libvirt.machineRef }}"
  become: true
  no_log: "{{ bootwright_no_log | default(true) | bool }}"
  when: bootwright_libvirt_media_insert_requested | bool

- name: Record direct libvirt virtual media attachment
  ansible.builtin.set_fact:
    bootwright_vmedia_backend_attached: true
    bootwright_vmedia_backend: libvirt-direct
    bootwright_vmedia_backend_image: "{{ bootwright_component.boot.agentIso.fetchUrl }}"
    bootwright_vmedia_backend_image_name: "{{ bootwright_component.boot.agentIso.stagePath | basename }}"
  changed_when: false
  no_log: "{{ bootwright_no_log | default(true) | bool }}"
  when: bootwright_libvirt_media_insert_requested | bool
