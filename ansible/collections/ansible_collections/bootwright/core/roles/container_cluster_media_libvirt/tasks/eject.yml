---
- name: Install virtual media eject helper
  ansible.builtin.copy:
    src: eject_libvirt_media.sh
    dest: /tmp/bootwright-libvirt-media-eject.sh
    owner: root
    group: root
    mode: "0700"
  delegate_to: "{{ bootwright_component.boot.media.libvirt.machineRef }}"
  become: true

- name: Eject source-backed virtual media from {{ bootwright_libvirt_media_scope }} domain
  ansible.builtin.command:
    argv: "{{ ['/bin/bash', '/tmp/bootwright-libvirt-media-eject.sh', bootwright_component.boot.media.libvirt.uri, bootwright_component.boot.media.libvirt.domain, bootwright_libvirt_media_change_media_arg, (bootwright_libvirt_media_eject_retries | string), (bootwright_libvirt_media_eject_delay_seconds | string), bootwright_libvirt_media_scope] + bootwright_libvirt_media_domblklist_args }}"
  register: bootwright_libvirt_media_eject
  changed_when: bootwright_libvirt_media_eject.stdout is search('(?m)^changed=true$')
  delegate_to: "{{ bootwright_component.boot.media.libvirt.machineRef }}"
  become: true
