---
- name: Resolve content-hashed virtual media eject helper path
  ansible.builtin.set_fact:
    bootwright_libvirt_media_eject_helper_path: "/var/tmp/bootwright-libvirt-media-eject-{{ lookup('ansible.builtin.file', role_path ~ '/files/eject_libvirt_media.sh') | hash('sha1') }}.sh"
  changed_when: false

- name: Install virtual media eject helper
  ansible.builtin.copy:
    src: eject_libvirt_media.sh
    dest: "{{ bootwright_libvirt_media_eject_helper_path }}"
    owner: root
    group: root
    mode: "0700"
  delegate_to: "{{ bootwright_component.boot.media.libvirt.machineRef }}"
  become: true

- name: Clean libvirt virtual media from {{ bootwright_libvirt_media_scope }} domain
  ansible.builtin.command:
    argv: "{{ ['/bin/bash', bootwright_libvirt_media_eject_helper_path, bootwright_component.boot.media.libvirt.uri, bootwright_component.boot.media.libvirt.domain, bootwright_libvirt_media_change_media_arg, (bootwright_libvirt_media_eject_retries | string), (bootwright_libvirt_media_eject_delay_seconds | string), bootwright_libvirt_media_scope, ((bootwright_libvirt_media_detach_drive | default(false) | bool) | ternary('all', 'source'))] + bootwright_libvirt_media_domblklist_args }}"
  register: bootwright_libvirt_media_eject
  changed_when: bootwright_libvirt_media_eject.stdout is search('(?m)^changed=true$')
  delegate_to: "{{ bootwright_component.boot.media.libvirt.machineRef }}"
  become: true
