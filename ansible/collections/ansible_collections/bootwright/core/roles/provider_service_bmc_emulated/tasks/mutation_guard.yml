---
- name: Revalidate host-wide operation before BMC mutation
  ansible.builtin.include_role:
    name: bootwright.core.ownership_record
    tasks_from: require_host_shared_service_operation.yml

- name: Revalidate exact BMC endpoint claims before mutation
  ansible.builtin.include_role:
    name: bootwright.core.ownership_record
    tasks_from: require_host_endpoint_claims.yml
  vars:
    bootwright_host_endpoint_required_claims: >-
      {{ bootwright_bmc_endpoint_transition.retainedClaims }}

- name: Re-probe exact BMC claim transition before mutation
  ansible.builtin.import_tasks: claim_probe.yml

- name: Require unchanged exact BMC mutation authority
  ansible.builtin.assert:
    quiet: true
    that:
      - >-
        bootwright_bmc_claim_record
        in ([bootwright_bmc_desired_claim]
            if (bootwright_bmc_apply_transition_envelope | default({}) | length == 0)
            else [bootwright_bmc_apply_transition_envelope.active,
                  bootwright_bmc_apply_transition_envelope.pending])
      - >-
        (bootwright_bmc_apply_transition_envelope | default({}) | length == 0
         and bootwright_bmc_claim_transition | length == 0)
        or bootwright_bmc_claim_transition == bootwright_bmc_apply_transition_envelope
      - bootwright_bmc_claim_context == bootwright_bmc_current_context
    fail_msg: >-
      Refusing the next BMC mutation because the exact host operation, endpoint
      slots, full claim, transition, or legacy marker changed after admission.
      No later BMC side effect ran. Inspect the winning evidence and re-run
      `{{ bootwright_mutating_invocation }}`.
