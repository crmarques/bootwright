---
- name: Validate BMC emulator service inputs
  ansible.builtin.assert:
    that:
      - bootwright_component.bmcEmulated is mapping
      - bootwright_component.configConsistent | bool
      - (bootwright_component.bmcEmulated.libvirtURI | default('') | length) > 0
      - (bootwright_component.bmcEmulated.port | default(0) | int) > 0
      - (bootwright_component.bmcEmulated.vMediaPort | default(0) | int) > 0
    fail_msg: >-
      bmc_emulated requires one provider-level BMC configuration. Check that all
      machines grouped under provider {{ bootwright_component.providerName }}
      use matching libvirt URI, bind address, ports, auth, and sushy version.

- name: Resolve BMC emulator facts
  ansible.builtin.import_tasks: apply/facts.yml

- name: Prepare BMC emulator host
  ansible.builtin.import_tasks: apply/packages.yml

- name: Configure BMC emulator credentials
  ansible.builtin.import_tasks: apply/credentials.yml

- name: Configure sushy-emulator
  ansible.builtin.import_tasks: apply/sushy.yml

- name: Configure vmedia HTTP service
  ansible.builtin.import_tasks: apply/vmedia.yml

- name: Record BMC emulator ownership
  ansible.builtin.include_role:
    name: bootwright.core.ownership_record
    tasks_from: resource.yml
  vars:
    bootwright_ownership_kind: bmc-emulator
    bootwright_ownership_name: "{{ bootwright_component.providerName }}"
    bootwright_ownership_fields:
      provider: "{{ bootwright_component.providerName }}"
      paths:
        - "{{ bootwright_bmc_root }}"
        - "{{ bootwright_bmc_vmedia_root }}"
        - "/etc/systemd/system/bootwright-sushy-{{ bootwright_component.providerName }}.service"
        - "/etc/systemd/system/bootwright-vmedia-{{ bootwright_component.providerName }}.service"
      attributes:
        redfishUnit: "bootwright-sushy-{{ bootwright_component.providerName }}.service"
        vMediaUnit: "bootwright-vmedia-{{ bootwright_component.providerName }}.service"
        redfishPort: "{{ bootwright_component.bmcEmulated.port | string }}"
        vMediaPort: "{{ bootwright_component.bmcEmulated.vMediaPort | string }}"
