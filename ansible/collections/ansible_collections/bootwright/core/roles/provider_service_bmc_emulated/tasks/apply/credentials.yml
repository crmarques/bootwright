---
- name: Resolve BMC credentials file path
  ansible.builtin.set_fact:
    bootwright_bmc_cred_path: >-
      {{ (bootwright_secrets_dir ~ '/' ~ bootwright_bmc_cred_ref) if (bootwright_bmc_cred_ref | length) > 0 else '' }}
  changed_when: false

- name: Load BMC credentials
  ansible.builtin.include_role:
    name: bootwright.core.support_credentials
    tasks_from: load
  vars:
    bootwright_creds_path: "{{ bootwright_bmc_cred_path }}"
    bootwright_creds_var: bootwright_bmc_credentials
    bootwright_creds_label: "provider BMC credentialsRef {{ bootwright_bmc_cred_path }}"
  when: (bootwright_bmc_cred_path | length) > 0

- name: Converge BMC htpasswd
  ansible.builtin.include_role:
    name: bootwright.core.support_htpasswd
  vars:
    bootwright_htpasswd_path: "{{ bootwright_bmc_root }}/htpasswd"
    bootwright_htpasswd_credentials: "{{ bootwright_bmc_credentials }}"
  when: (bootwright_bmc_cred_path | length) > 0
