---
- name: Create BMC state directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ bootwright_bmc_root }}"
    - "{{ bootwright_bmc_root }}/state"
    - "{{ bootwright_bmc_vmedia_root }}"

- name: Create BMC emulator temp directory
  ansible.builtin.file:
    path: "{{ bootwright_bmc_temp_root }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Load BMC package list
  ansible.builtin.include_vars: "os/{{ ansible_facts['os_family'] }}.yml"

- name: Install BMC packages
  ansible.builtin.package:
    name: "{{ bootwright_bmc_packages }}"
    state: present

- name: Restore BMC vmedia storage labels
  ansible.builtin.command:
    argv:
      - restorecon
      - -RFv
      - "{{ bootwright_bmc_vmedia_root }}"
  register: bootwright_bmc_vmedia_restorecon
  changed_when: bootwright_bmc_vmedia_restorecon.stdout | length > 0
  when: ansible_selinux.status | default('disabled') == 'enabled'

- name: Create sushy-tools virtualenv
  ansible.builtin.command:
    argv:
      - python3
      - -m
      - venv
      - --system-site-packages
      - "{{ bootwright_bmc_root }}/venv"
    creates: "{{ bootwright_bmc_root }}/venv/bin/python"

- name: Install sushy-tools into virtualenv
  ansible.builtin.pip:
    name: sushy-tools
    version: "{{ bootwright_sushy_tools_version }}"
    virtualenv: "{{ bootwright_bmc_root }}/venv"
    extra_args: --no-deps
  register: bootwright_bmc_sushy_pip

- name: Ensure SELinux file context labels venv binaries as bin_t
  community.general.sefcontext:
    target: "{{ bootwright_bmc_root }}/venv/bin(/.*)?"
    setype: bin_t
    state: present
  register: bootwright_bmc_sushy_sefcontext
  when: ansible_selinux.status | default('disabled') == 'enabled'

- name: Apply SELinux labels to venv binaries
  ansible.builtin.command:
    argv:
      - restorecon
      - -RFv
      - "{{ bootwright_bmc_root }}/venv/bin"
  register: bootwright_bmc_sushy_restorecon
  changed_when: bootwright_bmc_sushy_restorecon.stdout | length > 0
  when: ansible_selinux.status | default('disabled') == 'enabled'
