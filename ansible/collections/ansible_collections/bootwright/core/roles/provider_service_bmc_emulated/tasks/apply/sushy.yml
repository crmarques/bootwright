---
- name: Probe existing libvirt vmedia storage pool
  ansible.builtin.command:
    argv:
      - virsh
      - -c
      - "{{ bootwright_bmc_libvirt_uri }}"
      - pool-dumpxml
      - "bootwright-{{ bootwright_bmc_provider_name }}-vmedia"
  register: bootwright_bmc_vmedia_pool_probe
  changed_when: false
  failed_when: false

- name: Determine whether libvirt vmedia storage pool must be redefined
  ansible.builtin.set_fact:
    bootwright_bmc_vmedia_pool_redefine: "{{ ((bootwright_bmc_vmedia_pool_probe.rc | default(1) | int) == 0) and (('<path>' ~ bootwright_bmc_vmedia_root ~ '</path>') not in (bootwright_bmc_vmedia_pool_probe.stdout | default(''))) }}"
  changed_when: false

- name: Stop sushy-emulator before redefining vmedia storage pool
  ansible.builtin.systemd_service:
    name: "bootwright-sushy-{{ bootwright_bmc_provider_name }}.service"
    state: stopped
  failed_when: false
  when: bootwright_bmc_vmedia_pool_redefine | bool

- name: Deactivate mismatched libvirt vmedia storage pool
  community.libvirt.virt_pool:
    name: "bootwright-{{ bootwright_bmc_provider_name }}-vmedia"
    uri: "{{ bootwright_bmc_libvirt_uri }}"
    state: inactive
  failed_when: false
  when: bootwright_bmc_vmedia_pool_redefine | bool

- name: Undefine mismatched libvirt vmedia storage pool
  community.libvirt.virt_pool:
    name: "bootwright-{{ bootwright_bmc_provider_name }}-vmedia"
    uri: "{{ bootwright_bmc_libvirt_uri }}"
    state: absent
  failed_when: false
  when: bootwright_bmc_vmedia_pool_redefine | bool

- name: Define libvirt vmedia storage pool
  community.libvirt.virt_pool:
    name: "bootwright-{{ bootwright_bmc_provider_name }}-vmedia"
    uri: "{{ bootwright_bmc_libvirt_uri }}"
    state: present
    xml: "{{ lookup('ansible.builtin.template', 'vmedia/pool.xml.j2') }}"
  register: bootwright_bmc_vmedia_pool_define

- name: Enable autostart on libvirt vmedia storage pool
  # community.libvirt.virt_pool returns from the `state` branch before it reaches
  # the autostart handling, so `state: present` + `autostart: true` in one call
  # silently drops autostart. Set autostart in its own call (no `state`) so the
  # pool auto-activates after a host reboot instead of coming up inactive and
  # leaving the emulated BMC unable to attach virtual media until a re-apply.
  community.libvirt.virt_pool:
    name: "bootwright-{{ bootwright_bmc_provider_name }}-vmedia"
    uri: "{{ bootwright_bmc_libvirt_uri }}"
    autostart: true

- name: Activate libvirt vmedia storage pool
  community.libvirt.virt_pool:
    name: "bootwright-{{ bootwright_bmc_provider_name }}-vmedia"
    uri: "{{ bootwright_bmc_libvirt_uri }}"
    state: active
  register: bootwright_bmc_vmedia_pool_activate

- name: Write sushy-emulator config
  ansible.builtin.template:
    src: sushy/config.py.j2
    dest: "{{ bootwright_bmc_root }}/sushy.conf"
    owner: root
    group: root
    mode: "0644"
  register: bootwright_bmc_sushy_conf

- name: Write sushy-emulator systemd unit
  ansible.builtin.template:
    src: sushy/systemd.service.j2
    dest: "/etc/systemd/system/bootwright-sushy-{{ bootwright_bmc_provider_name }}.service"
    owner: root
    group: root
    mode: "0644"
  register: bootwright_bmc_sushy_unit

- name: Reload systemd manager when sushy unit changed
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: bootwright_bmc_sushy_unit.changed

- name: Ensure sushy-emulator service is running
  ansible.builtin.systemd_service:
    name: "bootwright-sushy-{{ bootwright_bmc_provider_name }}.service"
    state: >-
      {{
        'restarted'
        if (bootwright_bmc_sushy_conf.changed
            or bootwright_bmc_sushy_unit.changed
            or bootwright_bmc_sushy_pip.changed | default(false)
            or bootwright_bmc_sushy_restorecon.changed | default(false)
            or bootwright_bmc_vmedia_pool_redefine | default(false) | bool
            or bootwright_bmc_vmedia_pool_define.changed | default(false)
            or bootwright_bmc_vmedia_pool_activate.changed | default(false))
        else 'started'
      }}
    enabled: true

- name: Wait for sushy-emulator Redfish endpoint
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ bootwright_bmc_port }}/redfish/v1/Systems"
    method: GET
    status_code: 200
    return_content: false
    url_username: "{{ bootwright_bmc_credentials.username | default(omit) }}"
    url_password: "{{ bootwright_bmc_credentials.password | default(omit) }}"
    force_basic_auth: "{{ (bootwright_bmc_cred_path | length) > 0 }}"
  register: bootwright_bmc_sushy_ready
  retries: 30
  delay: 2
  until: bootwright_bmc_sushy_ready.status == 200
  no_log: "{{ (bootwright_no_log | default(true) | bool) and ((bootwright_bmc_cred_path | length) > 0) }}"

- name: Open Redfish port on host firewall
  ansible.posix.firewalld:
    port: "{{ bootwright_bmc_port | int }}/tcp"
    state: enabled
    permanent: true
    immediate: true
  when: bootwright_firewalld_available | default(false)
