---
- name: Define libvirt vmedia storage pool
  community.libvirt.virt_pool:
    name: "bootwright-{{ bootwright_bmc_provider_name }}-vmedia"
    state: present
    autostart: true
    xml: "{{ lookup('template', 'vmedia-pool.xml.j2') }}"

- name: Activate libvirt vmedia storage pool
  community.libvirt.virt_pool:
    name: "bootwright-{{ bootwright_bmc_provider_name }}-vmedia"
    state: active

- name: Write sushy-emulator config
  ansible.builtin.template:
    src: sushy/config.py.j2
    dest: "{{ bootwright_bmc_root }}/sushy.conf"
    owner: root
    group: root
    mode: "0644"
  register: bootwright_bmc_sushy_conf

- name: Write sushy-emulator systemd unit
  ansible.builtin.template:
    src: sushy/systemd.service.j2
    dest: "/etc/systemd/system/bootwright-sushy-{{ bootwright_bmc_provider_name }}.service"
    owner: root
    group: root
    mode: "0644"
  register: bootwright_bmc_sushy_unit

- name: Reload systemd manager when sushy unit changed
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: bootwright_bmc_sushy_unit.changed

- name: Ensure sushy-emulator service is running
  ansible.builtin.systemd_service:
    name: "bootwright-sushy-{{ bootwright_bmc_provider_name }}.service"
    state: >-
      {{
        'restarted'
        if (bootwright_bmc_sushy_conf.changed
            or bootwright_bmc_sushy_unit.changed
            or bootwright_bmc_sushy_restorecon.changed | default(false))
        else 'started'
      }}
    enabled: true

- name: Wait for sushy-emulator Redfish endpoint
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ bootwright_bmc_port }}/redfish/v1/Systems"
    method: GET
    status_code: 200
    return_content: false
    url_username: "{{ bootwright_bmc_credentials.username | default(omit) }}"
    url_password: "{{ bootwright_bmc_credentials.password | default(omit) }}"
    force_basic_auth: "{{ (bootwright_bmc_cred_path | length) > 0 }}"
  register: bootwright_bmc_sushy_ready
  retries: 30
  delay: 2
  until: bootwright_bmc_sushy_ready.status == 200
  no_log: "{{ (bootwright_bmc_cred_path | length) > 0 }}"

- name: Open Redfish port on host firewall
  ansible.posix.firewalld:
    port: "{{ bootwright_bmc_port | int }}/tcp"
    state: enabled
    permanent: true
    immediate: true
  when: bootwright_firewalld_available | default(false)
