---
- name: Validate the frozen artifact-server request
  ansible.builtin.assert:
    that:
      - bootwright_artifact_server_request.version == 'artifact-server-nginx-v2'
      - bootwright_artifact_server_request.unit is string
      - bootwright_artifact_server_request.contentRoot.startswith('/var/lib/bootwright-hosted/')
      - bootwright_artifact_server_request.contentRoot.split('/') | length == 8
      - bootwright_artifact_server_request.contentRoot.split('/')[3] == 'bootwright-hosted'
      - bootwright_artifact_server_request.contentRoot.split('/')[5] == 'services'
      - >-
        bootwright_artifact_server_request.contentRoot.split('/')[1:]
        | select('in', ['', '.', '..']) | list | length == 0
      - >-
        (bootwright_artifact_server_request.contentRoot | dirname | dirname | dirname)
        == '/var/lib/bootwright-hosted/' ~ bootwright_artifact_server_request.identity.context
      - bootwright_artifact_server_request.image is search('@sha256:[0-9a-f]{64}$')
      - bootwright_artifact_server_request.listeners | length > 0
      - bootwright_artifact_server_digest is match('[0-9a-f]{64}')
    quiet: true
  no_log: true

- name: Complete the qualified execution handoff
  bootwright.core.artifact_server_protocol:
    phase: loaded
  no_log: true

- name: Prove the context's hosted service directories before any effect
  bootwright.core.hosted_area:
    context: '{{ bootwright_artifact_server_request.identity.context }}'
    path: '{{ infra_artifact_server_nginx_area }}'
    state: proved

# A host reservation compares only the contexts Bootwright coordinates, so a
# socket another daemon holds is proved here, before anything is pulled,
# published or started. The runner reports the refusal named first as the
# service's own diagnostic; the failure that follows names every socket in the
# retained run output.
- name: Observe the sockets the service binds before any effect
  bootwright.core.artifact_server_inspect:
    request: '{{ bootwright_artifact_server_request }}'
    bind_address: true
    foreign: true
  register: infra_artifact_server_nginx_sockets

- name: Name a bind address the placement host does not hold to the runner
  bootwright.core.artifact_server_protocol:
    phase: refused
    reason: unassigned-bind-address
    port: '{{ bootwright_artifact_server_request.listeners[0].port }}'
  when: not infra_artifact_server_nginx_sockets.bindAddressAssigned
  no_log: true

- name: Refuse an unassigned bind address
  ansible.builtin.fail:
    msg: >-
      the placement host has no usable local address {{ bootwright_artifact_server_request.bindAddress }};
      nothing was pulled, published or started
  when: not infra_artifact_server_nginx_sockets.bindAddressAssigned

- name: Name a listener the service does not own to the runner
  bootwright.core.artifact_server_protocol:
    phase: refused
    reason: foreign-listener
    port: '{{ infra_artifact_server_nginx_sockets.foreign[0].port }}'
  when: infra_artifact_server_nginx_sockets.foreign | length > 0
  no_log: true

- name: Refuse a listener the service does not own
  ansible.builtin.fail:
    msg: >-
      something other than this service already listens where it binds;
      nothing was pulled, published or started:
      {% for socket in infra_artifact_server_nginx_sockets.foreign %}{{ socket.transport }}
      {{ ('[' ~ socket.address ~ ']') if ':' in socket.address else socket.address }}:{{ socket.port
      }}{{ '' if loop.last else '; ' }}{% endfor %}
  when: infra_artifact_server_nginx_sockets.foreign | length > 0

- name: Report image acquisition
  bootwright.core.artifact_server_protocol:
    phase: group
    group: pull-image
    status: running
  no_log: true

# The pull is pinned by digest and takes the frozen egress route alone; under
# a declared image mirror it binds that mirror's credential and trust anchor,
# lent for this one pull. A host already holding the reference pulls nothing.
# The pull's own output stays hidden, and its failure, from which the module
# has already masked every secret argument, is reported by the task after it.
- name: Acquire the pinned server image
  bootwright.core.image_acquire:
    image: '{{ bootwright_artifact_server_request.image }}'
    egress: '{{ bootwright_artifact_server_request.egress }}'
    host: '{{ bootwright_artifact_server_request.imageSource.host | default("") }}'
    username: "{{ lookup('ansible.builtin.file', material.imageUsername, rstrip=false) if material.imageUsername is defined else '' }}"
    password: "{{ lookup('ansible.builtin.file', material.imagePassword, rstrip=false) if material.imagePassword is defined else '' }}"
    auth: "{{ lookup('ansible.builtin.file', material.imageAuth, rstrip=false) if material.imageAuth is defined else '' }}"
    trust: "{{ lookup('ansible.builtin.file', material.imageTrust, rstrip=false) if material.imageTrust is defined else '' }}"
  vars:
    material: '{{ bootwright_artifact_server_material }}'
  register: infra_artifact_server_nginx_pull
  failed_when: false
  no_log: true

- name: Report why the pinned server image could not be acquired
  ansible.builtin.fail:
    msg: '{{ infra_artifact_server_nginx_pull.msg | default("the image pull failed") }}'
  when: infra_artifact_server_nginx_pull.image is not defined

- name: Report image acquisition completion
  bootwright.core.artifact_server_protocol:
    phase: group
    group: pull-image
    status: ok
  no_log: true

- name: Report configuration publication
  bootwright.core.artifact_server_protocol:
    phase: group
    group: publish-configuration
    status: running
  no_log: true

- name: Create the context's private hosted service directories top-down
  bootwright.core.hosted_area:
    context: '{{ bootwright_artifact_server_request.identity.context }}'
    path: '{{ infra_artifact_server_nginx_area }}'
    state: present

- name: Create the owned service directories
  ansible.builtin.file:
    path: '{{ item.path }}'
    state: directory
    owner: root
    group: root
    mode: '{{ item.mode }}'
  loop:
    - path: '{{ bootwright_artifact_server_request.contentRoot }}'
      mode: '0755'
    - path: '{{ infra_artifact_server_nginx_config_dir }}'
      mode: '0755'
    - path: '{{ infra_artifact_server_nginx_served_dir }}'
      mode: '0755'
  loop_control:
    label: '{{ item.path }}'
  register: infra_artifact_server_nginx_directories

- name: Create the private serving material directory
  ansible.builtin.file:
    path: '{{ infra_artifact_server_nginx_tls_dir }}'
    state: directory
    owner: root
    group: root
    mode: '0700'
  when: bootwright_artifact_server_material.certificate | default('') | length > 0
  register: infra_artifact_server_nginx_tls_directory

# The serving material reaches the execution host inside the module's own
# argument, so it crosses a remote connection only in the pipelined module
# payload and never in a file transfer.
- name: Publish the serving certificate
  bootwright.core.private_file:
    content: "{{ lookup('ansible.builtin.file', bootwright_artifact_server_material.certificate, rstrip=false) }}"
    path: '{{ infra_artifact_server_nginx_tls_dir }}/server.crt'
    mode: '0644'
  when: bootwright_artifact_server_material.certificate | default('') | length > 0
  register: infra_artifact_server_nginx_certificate
  no_log: true
  diff: false

- name: Publish the serving private key
  bootwright.core.private_file:
    content: "{{ lookup('ansible.builtin.file', bootwright_artifact_server_material.privateKey, rstrip=false) }}"
    path: '{{ infra_artifact_server_nginx_tls_dir }}/server.key'
  when: bootwright_artifact_server_material.privateKey | default('') | length > 0
  register: infra_artifact_server_nginx_key
  no_log: true
  diff: false

- name: Publish the server configuration
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: '{{ infra_artifact_server_nginx_config_dir }}/nginx.conf'
    owner: root
    group: root
    mode: '0644'
  register: infra_artifact_server_nginx_configuration

- name: Publish the container unit definition
  ansible.builtin.template:
    src: unit.container.j2
    dest: '{{ infra_artifact_server_nginx_unit_path }}'
    owner: root
    group: root
    mode: '0644'
  register: infra_artifact_server_nginx_unit

- name: Reload the host service manager so the unit generator runs
  ansible.builtin.command:
    argv:
      - /usr/bin/systemctl
      - daemon-reload
  changed_when: false

- name: Report configuration publication completion
  bootwright.core.artifact_server_protocol:
    phase: group
    group: publish-configuration
    status: ok
  no_log: true

- name: Report service start
  bootwright.core.artifact_server_protocol:
    phase: group
    group: start-service
    status: running
  no_log: true

- name: Observe the service before starting it
  bootwright.core.artifact_server_inspect:
    request: '{{ bootwright_artifact_server_request }}'
  register: infra_artifact_server_nginx_before

# A running server keeps what it started with: its unit takes effect at a start,
# its configuration is mounted on its own and it reads its serving material once,
# so publishing one replaces the host's file while nginx keeps the one it read.
# An attempt stopped between publishing and restarting leaves the server on the
# earlier files while the next attempt finds the published ones unchanged, so a
# running server restarts whenever a file it runs from is newer than its start.
- name: Observe the files the server runs from
  ansible.builtin.stat:
    path: '{{ item }}'
    get_checksum: false
  loop: >-
    {{ [infra_artifact_server_nginx_config_dir ~ '/nginx.conf', infra_artifact_server_nginx_unit_path]
       + ([infra_artifact_server_nginx_tls_dir ~ '/server.crt']
          if bootwright_artifact_server_material.certificate | default('') | length > 0 else [])
       + ([infra_artifact_server_nginx_tls_dir ~ '/server.key']
          if bootwright_artifact_server_material.privateKey | default('') | length > 0 else []) }}
  register: infra_artifact_server_nginx_runs_from
  when: infra_artifact_server_nginx_before.observation.unit == 'active'

# A start that cannot be read proves nothing, so the server then restarts.
# The format is podman's own template, handed to it as a literal.
- name: Observe when the running server started
  ansible.builtin.command:
    argv:
      - /usr/bin/podman
      - inspect
      - --type
      - container
      - --format
      - "{{ '{{.State.StartedAt.UnixNano}}' }}"
      - '{{ bootwright_artifact_server_request.unit }}'
  register: infra_artifact_server_nginx_started
  when: infra_artifact_server_nginx_before.observation.unit == 'active'
  changed_when: false
  failed_when: false

- name: Start the managed service
  ansible.builtin.command:
    argv:
      - /usr/bin/systemctl
      - start
      - '{{ infra_artifact_server_nginx_service }}'
  when: infra_artifact_server_nginx_before.observation.unit != 'active'
  changed_when: infra_artifact_server_nginx_before.observation.unit != 'active'

- name: Restart the managed service when a file it runs from changed since it started
  ansible.builtin.command:
    argv:
      - /usr/bin/systemctl
      - restart
      - '{{ infra_artifact_server_nginx_service }}'
  register: infra_artifact_server_nginx_restart
  when:
    - infra_artifact_server_nginx_before.observation.unit == 'active'
    - infra_artifact_server_nginx_configuration is changed or infra_artifact_server_nginx_unit is changed
      or infra_artifact_server_nginx_certificate is changed or infra_artifact_server_nginx_key is changed
      or (infra_artifact_server_nginx_started.stdout | default('') | trim | int)
      < (infra_artifact_server_nginx_runs_from.results | map(attribute='stat.mtime') | max) * 1000000000
  changed_when: true

- name: Report service start completion
  bootwright.core.artifact_server_protocol:
    phase: group
    group: start-service
    status: ok
  no_log: true

- name: Report readiness verification
  bootwright.core.artifact_server_protocol:
    phase: group
    group: verify-readiness
    status: running
  no_log: true

- name: Prove every declared listener answers
  bootwright.core.artifact_server_inspect:
    request: '{{ bootwright_artifact_server_request }}'
    readiness: true
    fingerprint: '{{ bootwright_artifact_server_material.fingerprint | default("") }}'
  register: infra_artifact_server_nginx_after

- name: Report the classified readiness refusal
  bootwright.core.artifact_server_protocol:
    phase: refused
    reason: '{{ infra_artifact_server_nginx_after.failures[0].reason }}'
    port: '{{ infra_artifact_server_nginx_after.failures[0].port }}'
  when: infra_artifact_server_nginx_after.failures | length > 0
  no_log: true

- name: Refuse an unproved listener
  ansible.builtin.assert:
    that:
      - infra_artifact_server_nginx_after.unproved | length == 0
    fail_msg: >-
      a declared artifact-server listener did not answer within its readiness
      window: {{ infra_artifact_server_nginx_after.unproved | join("; ") }}
    quiet: true

- name: Report readiness completion
  bootwright.core.artifact_server_protocol:
    phase: group
    group: verify-readiness
    status: ok
  no_log: true

- name: Publish bounded artifact-server completion evidence
  bootwright.core.artifact_server_protocol:
    phase: completed
    outcome: >-
      {{ 'changed'
         if (infra_artifact_server_nginx_directories is changed
             or infra_artifact_server_nginx_tls_directory is changed
             or infra_artifact_server_nginx_certificate is changed
             or infra_artifact_server_nginx_key is changed
             or infra_artifact_server_nginx_configuration is changed
             or infra_artifact_server_nginx_unit is changed
             or infra_artifact_server_nginx_restart is changed
             or infra_artifact_server_nginx_pull is changed
             or infra_artifact_server_nginx_before.observation.unit != 'active')
         else 'unchanged' }}
    digest: '{{ bootwright_artifact_server_digest }}'
    request: '{{ bootwright_artifact_server_request }}'
    observation: '{{ infra_artifact_server_nginx_after.observation }}'
    listeners: '{{ infra_artifact_server_nginx_after.listeners }}'
  no_log: true
