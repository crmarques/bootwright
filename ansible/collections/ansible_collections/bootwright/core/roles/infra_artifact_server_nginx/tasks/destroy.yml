---
- name: Validate the frozen artifact-server request
  ansible.builtin.assert:
    that:
      - bootwright_artifact_server_request.version == 'artifact-server-nginx-v1'
      - bootwright_artifact_server_request.unit is string
      - bootwright_artifact_server_request.unit is match('^bootwright-[a-z0-9-]*[a-z0-9]$(?!\n)')
      - bootwright_artifact_server_request.unit.startswith('bootwright-' ~ bootwright_artifact_server_request.identity.context ~ '-')
      - bootwright_artifact_server_request.contentRoot.startswith('/var/lib/bootwright-hosted/')
      - bootwright_artifact_server_request.contentRoot.split('/') | length == 8
      - bootwright_artifact_server_request.contentRoot.split('/')[3] == 'bootwright-hosted'
      - bootwright_artifact_server_request.contentRoot.split('/')[5] == 'services'
      - >-
        bootwright_artifact_server_request.contentRoot.split('/')[1:]
        | select('in', ['', '.', '..']) | list | length == 0
      - >-
        (bootwright_artifact_server_request.contentRoot | dirname | dirname | dirname)
        == '/var/lib/bootwright-hosted/' ~ bootwright_artifact_server_request.identity.context
      - bootwright_artifact_server_digest is match('^[0-9a-f]{64}$(?!\n)')
    quiet: true
  no_log: true

- name: Complete the qualified execution handoff
  bootwright.core.artifact_server_protocol:
    phase: loaded
  no_log: true

- name: Prove the context's hosted service directories before any effect
  bootwright.core.hosted_area:
    context: '{{ bootwright_artifact_server_request.identity.context }}'
    path: '{{ infra_artifact_server_nginx_area }}'
    state: proved

- name: Report service stop
  bootwright.core.artifact_server_protocol:
    phase: group
    group: stop-service
    status: running
  no_log: true

- name: Observe the managed artifact server before removal
  bootwright.core.artifact_server_inspect:
    request: '{{ bootwright_artifact_server_request }}'
  register: infra_artifact_server_nginx_before

- name: Stop the managed service
  ansible.builtin.command:
    argv:
      - /usr/bin/systemctl
      - stop
      - '{{ infra_artifact_server_nginx_service }}'
  when: infra_artifact_server_nginx_before.observation.unit | length > 0
  changed_when: infra_artifact_server_nginx_before.observation.unit | length > 0

- name: Report service stop completion
  bootwright.core.artifact_server_protocol:
    phase: group
    group: stop-service
    status: ok
  no_log: true

- name: Report configuration removal
  bootwright.core.artifact_server_protocol:
    phase: group
    group: remove-configuration
    status: running
  no_log: true

- name: Take back the unit, its container and its content root
  ansible.builtin.include_role:
    name: bootwright.core.infra_managed_service
    tasks_from: unit_removal
  vars:
    infra_managed_service_owned:
      unit: '{{ bootwright_artifact_server_request.unit }}'
      service: '{{ infra_artifact_server_nginx_service }}'
      unit_path: '{{ infra_artifact_server_nginx_unit_path }}'
      content_root: '{{ bootwright_artifact_server_request.contentRoot }}'
      context: '{{ bootwright_artifact_server_request.identity.context }}'
      area: '{{ infra_artifact_server_nginx_area }}'
      container_present: '{{ infra_artifact_server_nginx_before.observation.containerPresent }}'

- name: Report configuration removal completion
  bootwright.core.artifact_server_protocol:
    phase: group
    group: remove-configuration
    status: ok
  no_log: true

- name: Report absence verification
  bootwright.core.artifact_server_protocol:
    phase: group
    group: verify-absence
    status: running
  no_log: true

- name: Prove every owned resource is gone
  bootwright.core.artifact_server_inspect:
    request: '{{ bootwright_artifact_server_request }}'
  register: infra_artifact_server_nginx_after

- name: Report absence verification completion
  bootwright.core.artifact_server_protocol:
    phase: group
    group: verify-absence
    status: ok
  no_log: true

- name: Publish bounded artifact-server removal evidence
  bootwright.core.artifact_server_protocol:
    phase: completed
    outcome: >-
      {{ 'changed'
         if (infra_managed_service_unit_removed is changed
             or infra_managed_service_root_removed is changed
             or infra_managed_service_parents is changed
             or infra_managed_service_reset is changed
             or infra_artifact_server_nginx_before.observation.unit | length > 0)
         else 'unchanged' }}
    digest: '{{ bootwright_artifact_server_digest }}'
    request: '{{ bootwright_artifact_server_request }}'
    observation: '{{ infra_artifact_server_nginx_after.observation }}'
    removed: true
  no_log: true
