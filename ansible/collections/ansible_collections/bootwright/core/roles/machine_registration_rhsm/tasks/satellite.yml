---
- name: Trust corporate Satellite CA on node
  ansible.builtin.include_role:
    name: bootwright.core.support_ca_trust
  vars:
    bootwright_ca_trust_source: "{{ bootwright_registration_satellite_ca_path }}"
    bootwright_ca_trust_anchor: "{{ bootwright_registration_satellite_ca_anchor_path }}"
  when:
    - bootwright_registration_satellite_hostname | length > 0
    - bootwright_registration_satellite_ca_path | length > 0

- name: Bind node subscription-manager to corporate Satellite
  ansible.builtin.dnf:
    name: "http://{{ bootwright_registration_satellite_hostname }}/pub/katello-ca-consumer-latest.noarch.rpm"
    state: present
    disable_gpg_check: true
  when: bootwright_registration_satellite_hostname | length > 0
