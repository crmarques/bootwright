---
- name: Check whether node is already registered with RHSM
  ansible.builtin.command:
    argv:
      - subscription-manager
      - identity
  register: bootwright_registration_identity
  changed_when: false
  failed_when: false

- name: Register node with RHSM
  community.general.redhat_subscription:
    state: present
    org_id: "{{ lookup('ansible.builtin.file', bootwright_registration_organization_path) | trim }}"
    activationkey: "{{ lookup('ansible.builtin.file', bootwright_registration_activation_key_path) | trim }}"
    force_register: true
  when: bootwright_registration_identity.rc != 0
  register: bootwright_registration_register
  no_log: "{{ bootwright_no_log | default(true) | bool }}"

- name: Refresh RHSM subscription metadata
  ansible.builtin.command:
    argv:
      - subscription-manager
      - refresh
  changed_when: bootwright_registration_register is changed or bootwright_registration_proxy is changed or bootwright_registration_repo_ca is changed
  when: bootwright_registration_register is changed or bootwright_registration_proxy is changed or bootwright_registration_repo_ca is changed

- name: Connect node to Red Hat Insights
  ansible.builtin.command:
    argv:
      - insights-client
      - --register
  register: bootwright_registration_insights_register
  changed_when: bootwright_registration_insights_register.rc == 0
  when: bootwright_registration_connect_to_insights | default(false) | bool
