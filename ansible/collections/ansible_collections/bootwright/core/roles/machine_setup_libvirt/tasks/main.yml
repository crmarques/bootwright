---
- name: Load libvirt package list
  ansible.builtin.include_vars: "os/{{ ansible_facts['os_family'] }}.yml"

- name: Install libvirt host packages
  ansible.builtin.include_role:
    name: bootwright.core.ownership_record
    tasks_from: package_apply.yml
  vars:
    bootwright_ownership_packages: "{{ bootwright_machine_setup_libvirt_packages }}"
    bootwright_ownership_required_by: libvirt

- name: Start libvirt service
  ansible.builtin.service:
    name: "{{ bootwright_machine_setup_libvirt_libvirt_service }}"
    state: started
    enabled: true
