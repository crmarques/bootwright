---
bootwright_install_local_work_dir: "{{ bootwright_clusters_dir }}/{{ bootwright_current_cluster.name }}/runtime/installer"
bootwright_install_work_dir: "{{ bootwright_clusters_dir }}/{{ bootwright_current_cluster.name }}/runtime/installer"
bootwright_cluster_secrets_dir: "{{ bootwright_clusters_dir }}/{{ bootwright_current_cluster.name }}/secrets"
bootwright_openshift_install: "{{ 'openshift-install-fips' if (bootwright_current_cluster.fips | default(false) | bool) else 'openshift-install' }}"
bootwright_install_timeout_seconds: 5400
bootwright_install_bootstrap_timeout_seconds: "{{ bootwright_install_timeout_seconds }}"
bootwright_install_wait_poll_seconds: 15
bootwright_install_wait_target: install
bootwright_install_stalled_wait_retries: 20
bootwright_install_stalled_wait_delay_seconds: 30
bootwright_install_stalled_wait_pattern: "failed to progress after all hosts available|failed to prepare cluster installation"
bootwright_install_timed_out_wait_pattern: "bootstrap process timed out"
bootwright_install_cluster_init_wait_pattern: "failed to initialize the cluster|timed out waiting for the condition"
bootwright_install_host_error_pattern: "has hosts in error|updated status from [a-z-]+ to error(?![-a-z])"
bootwright_install_installer_wait_window_seconds: 3600
bootwright_install_cluster_init_wait_window_seconds: 2400
bootwright_install_resumable_wait_pattern: "{{ bootwright_install_stalled_wait_pattern }}|{{ bootwright_install_timed_out_wait_pattern }}|{{ bootwright_install_cluster_init_wait_pattern }}"
bootwright_install_wait_budget_seconds: >-
  {{ bootwright_install_bootstrap_timeout_seconds
     if bootwright_install_wait_target == 'bootstrap'
     else bootwright_install_timeout_seconds }}
bootwright_install_wait_budget_var: >-
  {{ 'bootwright_install_bootstrap_timeout_seconds'
     if bootwright_install_wait_target == 'bootstrap'
     else 'bootwright_install_timeout_seconds' }}
bootwright_install_host_error_hint: >-
  assisted-service moved a declared host to status "error" and stopped
  installing this cluster, so bootwright did not re-run the wait: another
  {{ bootwright_install_installer_wait_window_seconds }}-second window would
  watch the same state. A cluster that has diverted into recovery is never
  pivoted out of bootstrap, so an install left short of a declared node does
  not finish on its own — rebuild it with bootwright apply --stage clusters
  --clusters {{ bootwright_current_cluster.name }} --mode rebuild --authorize
  data-loss --yes. Bootstrap can still complete from the remaining
  control-plane hosts, so when every declared node is present re-run the apply
  to resume watching instead.
bootwright_install_timed_out_wait_hint: >-
  openshift-install caps one `agent wait-for` invocation at
  {{ bootwright_install_installer_wait_window_seconds }} seconds and exposes no
  flag to raise it, so it stops watching a cluster that is still converging.
  The rendezvous node keeps installing across that give-up, so bootwright
  re-ran the wait until its own
  {{ bootwright_install_wait_budget_seconds | trim }}-second budget was spent.
  The ClusterOperator conditions below are the cluster's state at the last
  give-up, not proof of a failed install: a control plane still pulling release
  images — several clusters installing at once compete for one registry path —
  can converge past this budget. Confirm the nodes are idle before treating
  this as a failed install; raise
  {{ bootwright_install_wait_budget_var | trim }} to buy another window, or
  re-run the apply to resume watching where this run stopped.
bootwright_install_stalled_wait_hint: >-
  The cluster reached assisted-service status "ready", but the rendezvous node
  never started the install. It starts the install only once exactly
  {{ bootwright_current_cluster.nodes | default({}) | length }} hosts report
  status "known", one for every declared node
  ({{ bootwright_current_cluster.nodes | default({}) | list | sort | join(', ') }}).
  A node that never booted the agent ISO, whose declared NIC MAC address does
  not match the one it registers with, or whose install disk was rejected never
  reaches "known", and holds the cluster in "ready" for as long as the install
  is allowed to run.
bootwright_install_cluster_init_wait_hint: >-
  openshift-install stopped watching in its cluster-initialization phase, which
  it caps at {{ bootwright_install_cluster_init_wait_window_seconds }} seconds
  separately from the bootstrap cap and exposes no flag to raise, so bootwright
  re-ran the wait until its own
  {{ bootwright_install_wait_budget_seconds | trim }}-second budget was spent.
  Every declared host has been handed its ignition by this phase, so a host the
  installer moved to status "error", or a declared node that never appeared as a
  Node, is a real failure that will not resolve on its own. Read the installer
  log lines and the missing declared nodes below before re-running: a declared
  node that never became a Node points at its boot media, its declared NIC MAC
  address or its install disk, while a cluster holding every declared node points
  at a cluster operator instead.
bootwright_install_unclassified_wait_hint: >-
  bootwright does not recognise this give-up as one it can resume, so it ran the
  wait once and stopped. Read the installer log lines and the missing declared
  nodes below: a declared node that never became a Node never finished the agent
  install, while a cluster holding every declared node points at a cluster
  operator instead. Re-run the apply once the cause is repaired; the wait resumes
  from where this run stopped.
bootwright_install_missing_nodes_hint: >-
  Declared nodes with no Node object in the cluster:
  {{ bootwright_install_missing_declared_nodes | default([]) | join(', ') }}.
  A declared node that never registers as a Node never finished the agent
  install: check that it booted the agent ISO, that the NIC MAC address it
  registers with is the one declared for it, that its install disk was accepted,
  and that the rendezvous node rebooted out of bootstrap into its own role
  instead of holding the cluster short of its declared control plane.
bootwright_install_rendezvous_node: >-
  {{ ((bootwright_current_cluster.nodes | default({}) | dict2items
       | selectattr('value.role', 'equalto', 'master')
       | map(attribute='key') | sort | first) | default('', true))
     | regex_replace('\..*$', '') }}
bootwright_install_rendezvous_missing_hint: >-
  The absent node {{ bootwright_install_rendezvous_node | trim }} is this
  cluster's rendezvous host: it runs assisted-service and the bootstrap control
  plane, and the agent flow reboots it into its own role last, once every other
  declared node has joined. A cluster that loses a host to status "error"
  before that pivot never performs it, so the rendezvous host keeps serving the
  bootstrap control plane and the cluster stays a node short indefinitely.
  Confirm it on the host itself: /etc/kubernetes/manifests holds
  etcd-pod.yaml and kube-apiserver-pod.yaml on a real master, and
  etcd-member-pod.yaml and keepalived.yaml on a host still in bootstrap.
bootwright_install_log_diagnostic_hint: >-
  Installer log ({{ bootwright_install_work_dir }}/.openshift_install.log):
  {{ bootwright_install_log_diagnostics | default([]) | join(' | ') }}
bootwright_install_log_tail_lines: 200
bootwright_install_log_diagnostic_pattern: "status from|error|Degraded|failed"
bootwright_install_log_diagnostic_max_lines: 12
bootwright_install_node_probe_request_timeout: "10s"
bootwright_install_bootstrap_marker_path: "{{ bootwright_install_work_dir }}/bootstrap-complete"
bootwright_install_publish_probe_timeout: 60
bootwright_agent_iso_publish_token_placeholder: "__BOOTWRIGHT_AGENT_ISO_PUBLISH_TOKEN__"
bootwright_controller_resolver_dropin_path: "/etc/systemd/resolved.conf.d/bootwright-{{ bootwright_current_cluster.name }}.conf"
