---
# Wire the controller's own resolver to this cluster's managed name resolution
# BEFORE the DNS gate. openshift-install polls the API from the controller, so
# the controller must resolve api/api-int/*.apps. The renderer projects
# bootwright_current_cluster.controllerNameResolvers = [{bindAddress, domain}]
# for every managed nameResolution component the cluster's node networks
# reference; external/operator-owned resolution yields no entries and this
# stage is a no-op.
#
# A systemd-resolved routing-domain drop-in is used rather than per-link DNS:
# the gate runs before nodes boot, when the cluster bridge has no carrier, so a
# DNS server bound to that bridge link would not be consulted. The bind address
# is controller-reachable (a local address in the single-host lab), so it
# answers regardless of link state.

- name: Wire controller resolver to managed name resolution
  when: bootwright_current_cluster.controllerNameResolvers | default([]) | length > 0
  block:
    - name: Detect systemd-resolved on the controller
      ansible.builtin.stat:
        path: /run/systemd/resolve/stub-resolv.conf
      register: bootwright_controller_resolved_stub

    - name: Warn when the controller resolver cannot be auto-wired
      ansible.builtin.debug:
        msg: >-
          systemd-resolved is not active on this controller, so bootwright cannot
          auto-wire DNS for cluster {{ bootwright_current_cluster.name }}. Point
          this host's resolver at
          {{ bootwright_current_cluster.controllerNameResolvers | map(attribute='bindAddress') | join(', ') }}
          for the
          {{ bootwright_current_cluster.controllerNameResolvers | map(attribute='domain') | join(', ') }}
          domain(s) before re-running. See the example README.
      when: not bootwright_controller_resolved_stub.stat.exists

    - name: Configure systemd-resolved split-DNS for the cluster domain
      when: bootwright_controller_resolved_stub.stat.exists
      block:
        - name: Ensure systemd-resolved drop-in directory
          ansible.builtin.file:
            path: /etc/systemd/resolved.conf.d
            state: directory
            owner: root
            group: root
            mode: "0755"

        - name: Render controller split-DNS drop-in
          ansible.builtin.template:
            src: controller_resolver.conf.j2
            dest: "{{ bootwright_controller_resolver_dropin_path }}"
            owner: root
            group: root
            mode: "0644"
          register: bootwright_controller_resolver_dropin

        - name: Restart systemd-resolved when the drop-in changed
          ansible.builtin.systemd_service:
            name: systemd-resolved
            state: restarted
          when: bootwright_controller_resolver_dropin.changed

        - name: Record controller resolver ownership
          ansible.builtin.include_role:
            name: bootwright.core.ownership_record
            tasks_from: resource.yml
          vars:
            bootwright_ownership_kind: controller-name-resolver
            bootwright_ownership_name: "{{ bootwright_current_cluster.name }}"
            bootwright_ownership_fields:
              cluster: "{{ bootwright_current_cluster.name }}"
              paths:
                - "{{ bootwright_controller_resolver_dropin_path }}"
              attributes:
                resolver: systemd-resolved
