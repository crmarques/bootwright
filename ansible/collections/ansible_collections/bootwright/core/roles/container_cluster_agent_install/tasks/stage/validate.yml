---
- name: Validate install method is agent
  ansible.builtin.assert:
    that:
      - bootwright_current_cluster.installMethod == 'agent'
    fail_msg: "install_agent only supports installMethod=agent (got {{ bootwright_current_cluster.installMethod | default('<unset>') }})"

- name: Resolve openshift-install binary
  ansible.builtin.shell: "command -v {{ bootwright_openshift_install | quote }}"
  args:
    executable: /bin/sh
  register: bootwright_install_lookup
  changed_when: false
  failed_when: false
  when: bootwright_install_agent_action_effective in ['run', 'create_iso', 'wait_install']

- name: Fail when openshift-install binary is missing
  ansible.builtin.assert:
    that:
      - bootwright_install_lookup.rc == 0
    fail_msg: >-
      Required installer binary '{{ bootwright_openshift_install }}' was not
      found on the controller PATH for cluster
      {{ bootwright_current_cluster.name }}. It is installed by
      `bootwright bastion setup`; FIPS OpenShift clusters need the
      openshift-install-fips build in particular, which is only laid down when
      the bastion was set up with FIPS in scope. Re-run
      `bootwright bastion setup` (with the FIPS cluster in scope for a FIPS
      install) and retry.
  when: bootwright_install_agent_action_effective in ['run', 'create_iso', 'wait_install']

- name: Set openshift-install path
  ansible.builtin.set_fact:
    bootwright_openshift_install_path: "{{ bootwright_install_lookup.stdout | trim }}"
  changed_when: false
  when: bootwright_install_agent_action_effective in ['run', 'create_iso', 'wait_install']

- name: Resolve declared release version
  ansible.builtin.set_fact:
    bootwright_declared_release_version: >-
      {{ ((bootwright_current_cluster.distribution | default({}, true)).get('release', {}).get('version', '') | default('', true)) | trim }}
    bootwright_declared_release_image: >-
      {{ ((bootwright_current_cluster.distribution | default({}, true)).get('release', {}).get('image', '') | default('', true)) | trim }}
  changed_when: false

- name: Read installed openshift-install version
  ansible.builtin.command:
    argv:
      - "{{ bootwright_openshift_install_path }}"
      - version
  register: bootwright_install_version_probe
  changed_when: false
  failed_when: false
  when: bootwright_install_agent_action_effective in ['run', 'create_iso', 'wait_install']

- name: Resolve installed openshift-install version
  ansible.builtin.set_fact:
    bootwright_openshift_install_version: >-
      {{
        (bootwright_install_version_probe.stdout | default(''))
        | regex_search('[0-9]+\.[0-9]+\.[0-9]+') | default('', true)
      }}
  changed_when: false
  when: bootwright_install_agent_action_effective in ['run', 'create_iso', 'wait_install']

- name: Fail when the declared release version cannot be determined
  ansible.builtin.fail:
    msg: >-
      Cluster {{ bootwright_current_cluster.name }} exposes no readable
      distribution.release.version, so bootwright cannot tell which OpenShift
      release the agent ISO it is about to build would install. The ISO embeds
      the release payload compiled into
      '{{ bootwright_openshift_install_path | default(bootwright_openshift_install, true) }}'
      and no later stage reports which release was used, so an undeclared
      release installs whatever `bootwright bastion setup` last laid down.
      Declare spec.distribution.release.version on this cluster and retry.
  when:
    - bootwright_install_agent_action_effective in ['run', 'create_iso']
    - (bootwright_declared_release_version | default('', true) | length) == 0
    - >-
      (bootwright_declared_release_image | default('', true) | length) == 0
      or (bootwright_declared_release_version | default('', true) | length) > 0

- name: Fail when the installed openshift-install version cannot be determined
  ansible.builtin.fail:
    msg: >-
      '{{ bootwright_openshift_install_path | default(bootwright_openshift_install, true) }} version'
      returned no readable version for cluster
      {{ bootwright_current_cluster.name }} (exit
      {{ bootwright_install_version_probe.rc | default('<unrun>') }}), so the
      release the agent ISO would embed cannot be compared against the declared
      {{ bootwright_declared_release_version }}. Re-run
      `bootwright bastion setup` with this cluster in scope to reinstall the
      installer binary, then retry.
  when:
    - bootwright_install_agent_action_effective in ['run', 'create_iso']
    - >-
      (bootwright_declared_release_image | default('', true) | length) == 0
      or (bootwright_declared_release_version | default('', true) | length) > 0
    - (bootwright_openshift_install_version | default('', true) | length) == 0

- name: Fail when the installer binary does not match the declared release
  ansible.builtin.assert:
    that:
      - bootwright_openshift_install_version == bootwright_declared_release_version
    fail_msg: >-
      Installer binary '{{ bootwright_openshift_install_path }}' reports version
      {{ bootwright_openshift_install_version | default('<unreadable>', true) }},
      but cluster {{ bootwright_current_cluster.name }} declares release
      {{ bootwright_declared_release_version }}. The agent ISO embeds the release
      payload compiled into that binary, so the cluster would silently install
      {{ bootwright_openshift_install_version | default('<unreadable>', true) }}
      and no later stage would report the difference. One installer serves every
      context on this controller and only `bootwright bastion setup` refreshes
      it, so a release bump that was never followed by a bastion setup leaves the
      previous version in place. Re-run `bootwright bastion setup` with this
      cluster in scope, then retry.
  when:
    - bootwright_install_agent_action_effective in ['run', 'create_iso']
    - >-
      (bootwright_declared_release_image | default('', true) | length) == 0
      or (bootwright_declared_release_version | default('', true) | length) > 0

- name: Warn when the waited install was built by a mismatched installer binary
  ansible.builtin.debug:
    msg: >-
      WARNING: installer binary
      '{{ bootwright_openshift_install_path }}' reports version
      {{ bootwright_openshift_install_version | default('<unreadable>', true) }}
      while cluster {{ bootwright_current_cluster.name }} declares release
      {{ bootwright_declared_release_version | default('<undeclared>', true) }}.
      This action only waits on an install that is already running, so bootwright
      will not refuse it and strand the cluster mid-install, but the cluster is
      being built from the binary's release and no later stage reports the
      difference. Re-run `bootwright bastion setup` with this cluster in scope,
      then reinstall the cluster if the declared release is the one you need.
  when:
    - bootwright_install_agent_action_effective == 'wait_install'
    - >-
      (bootwright_declared_release_image | default('', true) | length) == 0
      or (bootwright_declared_release_version | default('', true) | length) > 0
    - >-
      (bootwright_openshift_install_version | default('', true))
      != (bootwright_declared_release_version | default('', true))
      or (bootwright_declared_release_version | default('', true) | length) == 0

- name: Warn that a pinned release image is not honoured on the install path
  ansible.builtin.debug:
    msg: >-
      WARNING: cluster {{ bootwright_current_cluster.name }} pins
      spec.distribution.release.image
      {{ bootwright_declared_release_image }} and declares no
      spec.distribution.release.version. No install task honours that pin: the
      agent ISO embeds the release payload compiled into the installer binary
      '{{ bootwright_openshift_install_path | default(bootwright_openshift_install, true) }}',
      which reports version
      {{ bootwright_openshift_install_version | default('<unreadable>', true) }},
      so the binary's own release is the one this cluster installs. The pinned
      image only reaches the install-config imageDigestSources of a
      disconnected install. Declare spec.distribution.release.version as well
      to have bootwright refuse an installer binary that does not match it.
  when:
    - bootwright_install_agent_action_effective in ['run', 'create_iso', 'wait_install']
    - (bootwright_declared_release_image | default('', true) | length) > 0
    - (bootwright_declared_release_version | default('', true) | length) == 0

- name: Verify rendered install-config exists
  ansible.builtin.stat:
    path: "{{ bootwright_install_work_dir }}/install-config.yaml"
  register: bootwright_install_config_stat
  when: bootwright_install_agent_action_effective in ['run', 'create_iso']

- name: Fail when install-config is missing
  ansible.builtin.fail:
    msg: >-
      Missing install-config.yaml at {{ bootwright_install_work_dir }}/install-config.yaml.
      The bootwright CLI is expected to inline secrets via ResolveInstaller before
      handing off to Ansible; re-run
      `{{ bootwright_mutating_invocation | default('the same bootwright apply invocation') }}` (or
      `bootwright render installer --sensitive`) to regenerate it.
  when: bootwright_install_agent_action_effective in ['run', 'create_iso'] and not bootwright_install_config_stat.stat.exists

- name: Verify generated agent ISO publish token exists
  ansible.builtin.stat:
    path: "{{ bootwright_install_local_work_dir }}/agent-iso-publish-token"
  register: bootwright_agent_iso_publish_token_stat
  delegate_to: localhost
  become: false
  when:
    - bootwright_install_agent_action_effective == 'boot_machine'
    - not bootwright_install_already_complete

- name: Fail when generated agent ISO publish token is missing
  ansible.builtin.fail:
    msg: >-
      Missing agent-iso-publish-token at
      {{ bootwright_install_local_work_dir }}/agent-iso-publish-token.
      The create-agent-iso task must complete before boot-machine tasks can
      boot nodes.
  when:
    - bootwright_install_agent_action_effective == 'boot_machine'
    - not bootwright_install_already_complete
    - not bootwright_agent_iso_publish_token_stat.stat.exists

- name: Verify agent install state exists for wait
  ansible.builtin.stat:
    path: "{{ bootwright_install_work_dir }}/.openshift_install_state.json"
  register: bootwright_install_state_stat
  when:
    - bootwright_install_agent_action_effective == 'wait_install'
    - not bootwright_install_already_complete

- name: Fail when agent install state is missing for wait
  ansible.builtin.fail:
    msg: >-
      Missing agent install state at
      {{ bootwright_install_work_dir }}/.openshift_install_state.json for
      cluster {{ bootwright_current_cluster.name }}. The agent ISO build runs
      in the deps phase and must complete before waiting for install. Re-run
      `{{ bootwright_apply_through_base_invocation | default('the same bootwright apply invocation through the base stage') }}`.
  when:
    - bootwright_install_agent_action_effective == 'wait_install'
    - not bootwright_install_already_complete
    - not bootwright_install_state_stat.stat.exists
