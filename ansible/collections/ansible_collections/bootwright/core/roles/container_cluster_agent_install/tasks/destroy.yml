---
- name: Resolve cluster installer runtime dirs
  ansible.builtin.set_fact:
    bootwright_cluster_runtime_dir: "{{ bootwright_clusters_dir }}/{{ bootwright_current_cluster.name }}/runtime"
    bootwright_cluster_installer_runtime_dir: "{{ bootwright_clusters_dir }}/{{ bootwright_current_cluster.name }}/runtime/installer"
    bootwright_cluster_addon_runtime_dir: "{{ bootwright_clusters_dir }}/{{ bootwright_current_cluster.name }}/runtime/addons"
    bootwright_cluster_generated_addon_secrets_dir: "{{ bootwright_clusters_dir }}/{{ bootwright_current_cluster.name }}/secrets/addons"
    bootwright_cluster_install_record_path: "{{ bootwright_clusters_dir }}/{{ bootwright_current_cluster.name }}/runtime/install-record.json"
    bootwright_cluster_connection_record_path: "{{ bootwright_clusters_dir }}/{{ bootwright_current_cluster.name }}/runtime/connection.json"
  changed_when: false

- name: Stop stale installer processes
  ansible.builtin.include_role:
    name: bootwright.core.support_process_cleanup
  vars:
    bootwright_process_cleanup_allow_pattern: true
    bootwright_process_cleanup_pattern: "clusters/{{ bootwright_current_cluster.name }}/runtime/installer/"

- name: Remove local cluster installer runtime dir
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ bootwright_cluster_installer_runtime_dir }}"
    - "{{ bootwright_cluster_addon_runtime_dir }}"
    - "{{ bootwright_cluster_generated_addon_secrets_dir }}"
    - "{{ bootwright_cluster_install_record_path }}"
    - "{{ bootwright_cluster_connection_record_path }}"
    - "{{ bootwright_cluster_secrets_dir }}/kubeconfig"
    - "{{ bootwright_cluster_secrets_dir }}/kubeadmin-password"
  loop_control:
    label: "{{ item }}"

- name: Remove controller resolver drop-in
  ansible.builtin.file:
    path: "{{ bootwright_controller_resolver_dropin_path }}"
    state: absent
  register: bootwright_controller_resolver_removed

- name: Restart systemd-resolved after removing controller resolver drop-in
  ansible.builtin.systemd_service:
    name: systemd-resolved
    state: restarted
  when: bootwright_controller_resolver_removed.changed
  failed_when: false

- name: Remove controller resolver ownership record
  ansible.builtin.include_role:
    name: bootwright.core.ownership_record
    tasks_from: remove_resource.yml
  vars:
    bootwright_ownership_kind: controller-name-resolver
    bootwright_ownership_name: "{{ bootwright_current_cluster.name }}"
