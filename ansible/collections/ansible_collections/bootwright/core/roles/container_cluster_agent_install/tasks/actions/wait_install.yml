---
- name: Validate selected agent wait target
  ansible.builtin.assert:
    that:
      - bootwright_install_wait_target in ['bootstrap', 'install']
    fail_msg: "Unsupported install wait target {{ bootwright_install_wait_target }}"

- name: Wait for agent install completion when install is not already complete
  when: not bootwright_install_already_complete
  block:
    - name: Show agent install log path
      ansible.builtin.debug:
        msg: "Follow agent install progress with: sudo tail -f {{ bootwright_install_work_dir }}/.openshift_install.log"

    - name: Set the agent wait budget deadline
      ansible.builtin.set_fact:
        bootwright_install_wait_deadline: >-
          {{ (now(utc=true).timestamp() | int)
             + (bootwright_install_wait_budget_seconds | int) }}
      changed_when: false

    - name: Check recorded agent bootstrap completion
      ansible.builtin.stat:
        path: "{{ bootwright_install_bootstrap_marker_path }}"
      register: bootwright_install_bootstrap_marker_stat

    - name: Wait for agent bootstrap completion
      ansible.builtin.command:
        argv:
          - "{{ bootwright_openshift_install_path }}"
          - agent
          - wait-for
          - bootstrap-complete
          - --dir
          - "{{ bootwright_install_work_dir }}"
          - --log-level
          - info
      async: "{{ bootwright_install_bootstrap_timeout_seconds }}"
      poll: "{{ bootwright_install_wait_poll_seconds }}"
      register: bootwright_install_bootstrap_wait
      until: >-
        (bootwright_install_bootstrap_wait.rc | default(1) | int) == 0
        or (bootwright_install_bootstrap_wait.stderr | default('')
            is search(bootwright_install_host_error_pattern))
        or not (bootwright_install_bootstrap_wait.stderr | default('')
                is search(bootwright_install_resumable_wait_pattern))
        or (now(utc=true).timestamp() | int)
           >= (bootwright_install_wait_deadline | int)
      retries: "{{ bootwright_install_stalled_wait_retries }}"
      delay: "{{ bootwright_install_stalled_wait_delay_seconds }}"
      changed_when: (bootwright_install_bootstrap_wait.rc | default(1) | int) == 0
      failed_when: false
      when:
        - bootwright_install_wait_target == 'bootstrap'
        - not bootwright_install_bootstrap_marker_stat.stat.exists

    - name: Record agent bootstrap completion
      ansible.builtin.copy:
        dest: "{{ bootwright_install_bootstrap_marker_path }}"
        mode: "0600"
        content: "bootstrap-complete\n"
      when:
        - bootwright_install_wait_target == 'bootstrap'
        - (bootwright_install_bootstrap_wait.rc | default(1) | int) == 0

    - name: Wait for agent install completion
      ansible.builtin.command:
        argv:
          - "{{ bootwright_openshift_install_path }}"
          - agent
          - wait-for
          - install-complete
          - --dir
          - "{{ bootwright_install_work_dir }}"
          - --log-level
          - info
      async: "{{ bootwright_install_timeout_seconds }}"
      poll: "{{ bootwright_install_wait_poll_seconds }}"
      register: bootwright_install_wait
      until: >-
        (bootwright_install_wait.rc | default(1) | int) == 0
        or (bootwright_install_wait.stderr | default('')
            is search(bootwright_install_host_error_pattern))
        or not (bootwright_install_wait.stderr | default('')
                is search(bootwright_install_resumable_wait_pattern))
        or (now(utc=true).timestamp() | int)
           >= (bootwright_install_wait_deadline | int)
      retries: "{{ bootwright_install_stalled_wait_retries }}"
      delay: "{{ bootwright_install_stalled_wait_delay_seconds }}"
      changed_when: (bootwright_install_wait.rc | default(1) | int) == 0
      failed_when: false
      when: bootwright_install_wait_target == 'install'

    - name: Determine agent wait outcome
      ansible.builtin.set_fact:
        bootwright_install_wait_succeeded: >-
          {{
            (
              (bootwright_install_bootstrap_marker_stat.stat.exists | default(false) | bool)
              or ((bootwright_install_bootstrap_wait.rc | default(1) | int) == 0)
            )
            if bootwright_install_wait_target == 'bootstrap'
            else ((bootwright_install_wait.rc | default(1) | int) == 0)
          }}
      changed_when: false

    - name: Read the tail of the agent install log after a failed wait
      ansible.builtin.command:
        argv:
          - tail
          - -n
          - "{{ bootwright_install_log_tail_lines }}"
          - "{{ bootwright_install_work_dir }}/.openshift_install.log"
      register: bootwright_install_log_tail
      changed_when: false
      failed_when: false
      when: not (bootwright_install_wait_succeeded | bool)

    - name: Resolve agent install log diagnostics
      ansible.builtin.set_fact:
        bootwright_install_log_diagnostics: >-
          {{ (((bootwright_install_log_tail.stdout_lines | default([]))
                | select('search', bootwright_install_host_error_pattern) | list)
              + ((bootwright_install_log_tail.stdout_lines | default([]))
                 | select('search', bootwright_install_log_diagnostic_pattern)
                 | reject('search', bootwright_install_host_error_pattern) | list)
             )[:(bootwright_install_log_diagnostic_max_lines | int)] }}
      changed_when: false
      when: not (bootwright_install_wait_succeeded | bool)

    - name: Resolve whether a declared host reached assisted-service status error
      ansible.builtin.set_fact:
        bootwright_install_host_error_observed: >-
          {{ ((bootwright_install_bootstrap_wait.stderr | default(''))
              is search(bootwright_install_host_error_pattern))
             or ((bootwright_install_wait.stderr | default(''))
                 is search(bootwright_install_host_error_pattern))
             or ((bootwright_install_log_tail.stdout | default(''))
                 is search(bootwright_install_host_error_pattern)) }}
      changed_when: false
      when: not (bootwright_install_wait_succeeded | bool)

    - name: Stat installer kubeconfig after a failed wait
      ansible.builtin.stat:
        path: "{{ bootwright_install_work_dir }}/auth/kubeconfig"
      register: bootwright_install_diagnostic_kubeconfig_stat
      when: not (bootwright_install_wait_succeeded | bool)

    - name: Probe cluster nodes after a failed wait
      ansible.builtin.command:
        argv:
          - oc
          - --kubeconfig
          - "{{ bootwright_install_work_dir }}/auth/kubeconfig"
          - "--request-timeout={{ bootwright_install_node_probe_request_timeout }}"
          - get
          - nodes
          - -o
          - 'jsonpath={.items[*].metadata.name}'
      register: bootwright_install_node_probe
      changed_when: false
      failed_when: false
      when:
        - not (bootwright_install_wait_succeeded | bool)
        - bootwright_install_diagnostic_kubeconfig_stat.stat.exists | default(false)

    - name: Resolve declared nodes absent from the cluster
      ansible.builtin.set_fact:
        bootwright_install_missing_declared_nodes: >-
          {{ (bootwright_current_cluster.nodes | default({}) | list)
             | map('regex_replace', '\..*$', '')
             | reject('in', (bootwright_install_node_probe.stdout | default('')).split()
                            | map('regex_replace', '\..*$', '') | list)
             | list | sort }}
      changed_when: false
      when:
        - not (bootwright_install_wait_succeeded | bool)
        - (bootwright_install_node_probe.rc | default(1) | int) == 0

    - name: Fail when the agent bootstrap wait did not complete
      ansible.builtin.fail:
        msg: >-
          {{ bootwright_install_host_error_hint
             if (bootwright_install_host_error_observed | default(false) | bool)
             else (bootwright_install_stalled_wait_hint
                   if (bootwright_install_bootstrap_wait.stderr | default('')
                       is search(bootwright_install_stalled_wait_pattern))
                   else (bootwright_install_timed_out_wait_hint
                         if (bootwright_install_bootstrap_wait.stderr | default('')
                             is search(bootwright_install_timed_out_wait_pattern))
                         else (bootwright_install_cluster_init_wait_hint
                               if (bootwright_install_bootstrap_wait.stderr | default('')
                                   is search(bootwright_install_cluster_init_wait_pattern))
                               else bootwright_install_unclassified_wait_hint))) }}
          {{ bootwright_install_missing_nodes_hint
             if (bootwright_install_missing_declared_nodes | default([]) | length) > 0
             else '' }}
          {{ bootwright_install_rendezvous_missing_hint
             if (bootwright_install_rendezvous_node | trim)
                in (bootwright_install_missing_declared_nodes | default([]))
             else '' }}
          {{ bootwright_openshift_install }} agent wait-for bootstrap-complete
          did not complete for {{ bootwright_current_cluster.name }} after
          {{ bootwright_install_bootstrap_wait.attempts | default(1) }} attempt(s).
          {{ bootwright_install_log_diagnostic_hint
             if (bootwright_install_log_diagnostics | default([]) | length) > 0
             else '' }}
          Installer reported: {{ bootwright_install_bootstrap_wait.msg | default('') }}
          {{ ((bootwright_install_bootstrap_wait.stderr_lines | default([])
               | select('search', bootwright_install_host_error_pattern) | list)
              + (bootwright_install_bootstrap_wait.stderr_lines | default([])
                 | select('search', 'level=error')
                 | reject('search', bootwright_install_host_error_pattern) | list)
             )[:(bootwright_install_log_diagnostic_max_lines | int)] | join(' | ') }}
          Follow the install with: sudo tail -f {{ bootwright_install_work_dir }}/.openshift_install.log
      when:
        - bootwright_install_wait_target == 'bootstrap'
        - not bootwright_install_bootstrap_marker_stat.stat.exists
        - (bootwright_install_bootstrap_wait.rc | default(1) | int) != 0

    - name: Fail when the agent install wait did not complete
      ansible.builtin.fail:
        msg: >-
          {{ bootwright_install_host_error_hint
             if (bootwright_install_host_error_observed | default(false) | bool)
             else (bootwright_install_stalled_wait_hint
                   if (bootwright_install_wait.stderr | default('')
                       is search(bootwright_install_stalled_wait_pattern))
                   else (bootwright_install_timed_out_wait_hint
                         if (bootwright_install_wait.stderr | default('')
                             is search(bootwright_install_timed_out_wait_pattern))
                         else (bootwright_install_cluster_init_wait_hint
                               if (bootwright_install_wait.stderr | default('')
                                   is search(bootwright_install_cluster_init_wait_pattern))
                               else bootwright_install_unclassified_wait_hint))) }}
          {{ bootwright_install_missing_nodes_hint
             if (bootwright_install_missing_declared_nodes | default([]) | length) > 0
             else '' }}
          {{ bootwright_install_rendezvous_missing_hint
             if (bootwright_install_rendezvous_node | trim)
                in (bootwright_install_missing_declared_nodes | default([]))
             else '' }}
          {{ bootwright_openshift_install }} agent wait-for install-complete
          did not complete for {{ bootwright_current_cluster.name }} after
          {{ bootwright_install_wait.attempts | default(1) }} attempt(s).
          {{ bootwright_install_log_diagnostic_hint
             if (bootwright_install_log_diagnostics | default([]) | length) > 0
             else '' }}
          Installer reported: {{ bootwright_install_wait.msg | default('') }}
          {{ ((bootwright_install_wait.stderr_lines | default([])
               | select('search', bootwright_install_host_error_pattern) | list)
              + (bootwright_install_wait.stderr_lines | default([])
                 | select('search', 'level=error')
                 | reject('search', bootwright_install_host_error_pattern) | list)
             )[:(bootwright_install_log_diagnostic_max_lines | int)] | join(' | ') }}
          Follow the install with: sudo tail -f {{ bootwright_install_work_dir }}/.openshift_install.log
      when:
        - bootwright_install_wait_target == 'install'
        - (bootwright_install_wait.rc | default(1) | int) != 0

    - name: Record kubeconfig path
      ansible.builtin.copy:
        dest: "{{ bootwright_install_work_dir }}/kubeconfig.path"
        mode: "0600"
        content: "{{ bootwright_install_work_dir }}/auth/kubeconfig\n"
      when: bootwright_install_wait_succeeded | bool

    - name: Create local installer auth directory
      ansible.builtin.file:
        path: "{{ bootwright_install_local_work_dir }}/auth"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false
      when: bootwright_install_wait_succeeded | bool

    - name: Fetch kubeconfig to local runtime state
      ansible.builtin.fetch:
        src: "{{ bootwright_install_work_dir }}/auth/kubeconfig"
        dest: "{{ bootwright_install_local_work_dir }}/auth/kubeconfig"
        flat: true
      when: bootwright_install_wait_succeeded | bool

    - name: Restrict local kubeconfig permissions
      ansible.builtin.file:
        path: "{{ bootwright_install_local_work_dir }}/auth/kubeconfig"
        mode: "0600"
      delegate_to: localhost
      become: false
      when: bootwright_install_wait_succeeded | bool

    - name: Fetch kubeadmin password to local runtime state
      ansible.builtin.fetch:
        src: "{{ bootwright_install_work_dir }}/auth/kubeadmin-password"
        dest: "{{ bootwright_install_local_work_dir }}/auth/kubeadmin-password"
        flat: true
      when: bootwright_install_wait_succeeded | bool

    - name: Restrict local kubeadmin password permissions
      ansible.builtin.file:
        path: "{{ bootwright_install_local_work_dir }}/auth/kubeadmin-password"
        mode: "0600"
      delegate_to: localhost
      become: false
      when: bootwright_install_wait_succeeded | bool

    - name: Create local cluster secrets directory
      ansible.builtin.file:
        path: "{{ bootwright_cluster_secrets_dir }}"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false
      when: bootwright_install_wait_succeeded | bool

    - name: Store kubeconfig in cluster secrets
      ansible.builtin.copy:
        src: "{{ bootwright_install_local_work_dir }}/auth/kubeconfig"
        dest: "{{ bootwright_cluster_secrets_dir }}/kubeconfig"
        mode: "0600"
      delegate_to: localhost
      become: false
      when: bootwright_install_wait_succeeded | bool

    - name: Store kubeadmin password in cluster secrets
      ansible.builtin.copy:
        src: "{{ bootwright_install_local_work_dir }}/auth/kubeadmin-password"
        dest: "{{ bootwright_cluster_secrets_dir }}/kubeadmin-password"
        mode: "0600"
      delegate_to: localhost
      become: false
      when: bootwright_install_wait_succeeded | bool

    - name: Record local kubeconfig path
      ansible.builtin.copy:
        dest: "{{ bootwright_install_local_work_dir }}/kubeconfig.path"
        mode: "0600"
        content: "{{ bootwright_cluster_secrets_dir }}/kubeconfig\n"
      delegate_to: localhost
      become: false
      when: bootwright_install_wait_succeeded | bool

    - name: Clean virtual media after successful install
      ansible.builtin.include_role:
        name: "{{ bootwright_cleanup_media_component.cleanupMediaRole }}"
      vars:
        bootwright_component: "{{ bootwright_cleanup_media_component }}"
        bootwright_vmedia_action: cleanup_media
      loop: "{{ bootwright_current_cluster.components | default([]) | selectattr('cleanupMediaRole', 'defined') | list }}"
      loop_control:
        loop_var: bootwright_cleanup_media_component
        label: "{{ bootwright_cleanup_media_component.name }} via {{ bootwright_cleanup_media_component.cleanupMediaRole }}"
      when:
        - bootwright_install_wait_succeeded | bool
        - bootwright_install_wait_target == 'install'

    - name: Find remote generated agent ISO files
      ansible.builtin.find:
        paths: "{{ bootwright_install_work_dir }}"
        patterns: "agent.*.iso"
        file_type: any
      register: bootwright_remote_agent_iso_cleanup_find
      when:
        - bootwright_install_wait_succeeded | bool
        - bootwright_install_wait_target == 'install'

    - name: Remove remote generated agent ISO files
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ bootwright_remote_agent_iso_cleanup_find.files | default([]) }}"
      loop_control:
        label: "{{ item.path }}"
      when:
        - bootwright_install_wait_succeeded | bool
        - bootwright_install_wait_target == 'install'

    - name: Remove remote generated boot artifacts
      ansible.builtin.file:
        path: "{{ bootwright_install_work_dir }}/boot-artifacts"
        state: absent
      when:
        - bootwright_install_wait_succeeded | bool
        - bootwright_install_wait_target == 'install'

    - name: Find local generated agent ISO files
      ansible.builtin.find:
        paths: "{{ bootwright_install_local_work_dir }}"
        patterns: "agent.*.iso"
        file_type: file
      register: bootwright_local_agent_iso_cleanup_find
      delegate_to: localhost
      become: false
      when:
        - bootwright_install_wait_succeeded | bool
        - bootwright_install_wait_target == 'install'

    - name: Remove local generated agent ISO files
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ bootwright_local_agent_iso_cleanup_find.files | default([]) }}"
      loop_control:
        label: "{{ item.path }}"
      delegate_to: localhost
      become: false
      when:
        - bootwright_install_wait_succeeded | bool
        - bootwright_install_wait_target == 'install'

    - name: Remove remote agent ISO path record
      ansible.builtin.file:
        path: "{{ bootwright_install_work_dir }}/agent-iso.path"
        state: absent
      when:
        - bootwright_install_wait_succeeded | bool
        - bootwright_install_wait_target == 'install'

    - name: Remove local agent ISO path record
      ansible.builtin.file:
        path: "{{ bootwright_install_local_work_dir }}/agent-iso.path"
        state: absent
      delegate_to: localhost
      become: false
      when:
        - bootwright_install_wait_succeeded | bool
        - bootwright_install_wait_target == 'install'
  always:
    - name: Read agent ISO publish token for cleanup
      ansible.builtin.slurp:
        src: "{{ bootwright_install_local_work_dir }}/agent-iso-publish-token"
      register: bootwright_agent_iso_publish_cleanup_token_file
      delegate_to: localhost
      become: false
      failed_when: false
      no_log: "{{ bootwright_no_log | default(true) | bool }}"
      when:
        - bootwright_install_wait_target == 'install'
        - (bootwright_current_cluster.agentIsoPublishTargets | default([]) | length) > 0

    - name: Set agent ISO publish cleanup token
      ansible.builtin.set_fact:
        bootwright_agent_iso_publish_token: "{{ bootwright_agent_iso_publish_cleanup_token_file.content | b64decode | trim }}"
      changed_when: false
      no_log: "{{ bootwright_no_log | default(true) | bool }}"
      when:
        - bootwright_install_wait_target == 'install'
        - bootwright_agent_iso_publish_cleanup_token_file is defined
        - (bootwright_agent_iso_publish_cleanup_token_file.content | default('') | length) > 0

    - name: Remove staged agent ISO publish directories
      ansible.builtin.include_tasks: ../iso/cleanup_target.yml
      loop: "{{ bootwright_current_cluster.agentIsoPublishTargets | default([]) }}"
      loop_control:
        loop_var: bootwright_agent_iso_publish_target
        label: "{{ bootwright_agent_iso_publish_target.stagePath }}"
      when:
        - bootwright_install_wait_target == 'install'
        - (bootwright_agent_iso_publish_token | default('') | length) > 0

    - name: Remove local agent ISO publish token
      ansible.builtin.file:
        path: "{{ bootwright_install_local_work_dir }}/agent-iso-publish-token"
        state: absent
      delegate_to: localhost
      become: false
      no_log: "{{ bootwright_no_log | default(true) | bool }}"
      when:
        - bootwright_install_wait_target == 'install'
        - bootwright_agent_iso_publish_cleanup_token_file is defined
        - (bootwright_agent_iso_publish_cleanup_token_file.content | default('') | length) > 0
