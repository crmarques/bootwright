---
- name: Resolve cluster installer runtime dirs
  ansible.builtin.include_tasks: destroy_paths.yml

- name: Remove local cluster install records and captured credentials
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ bootwright_cluster_install_record_path }}"
    - "{{ bootwright_cluster_connection_record_path }}"
    - "{{ bootwright_cluster_secrets_dir }}/kubeconfig"
    - "{{ bootwright_cluster_secrets_dir }}/kubeadmin-password"
  loop_control:
    label: "{{ item }}"

- name: Remove controller resolver drop-in
  ansible.builtin.file:
    path: "{{ bootwright_controller_resolver_dropin_path }}"
    state: absent
  register: bootwright_controller_resolver_removed

- name: Restart systemd-resolved after removing controller resolver drop-in
  ansible.builtin.systemd_service:
    name: systemd-resolved
    state: restarted
  when: bootwright_controller_resolver_removed.changed
  failed_when: false

- name: Remove controller resolver ownership record
  ansible.builtin.include_role:
    name: bootwright.core.ownership_record
    tasks_from: remove_resource.yml
  vars:
    bootwright_ownership_kind: controller-name-resolver
    bootwright_ownership_name: "{{ bootwright_current_cluster.name }}"
