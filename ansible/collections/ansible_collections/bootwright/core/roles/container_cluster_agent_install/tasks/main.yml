---
- name: Select agent install action
  ansible.builtin.set_fact:
    bootwright_install_agent_action_effective: "{{ bootwright_install_agent_action | default('run') }}"
  changed_when: false

- name: Validate selected agent install action
  ansible.builtin.assert:
    that:
      - bootwright_install_agent_action_effective in ['run', 'create_iso', 'boot_machine', 'wait_install']
    fail_msg: "Unsupported install_agent action {{ bootwright_install_agent_action_effective }}"

- name: Check existing install state
  ansible.builtin.import_tasks: stage/skip_guard.yml

- name: Stage installer inputs
  ansible.builtin.import_tasks: stage/inputs.yml

- name: Validate installer inputs
  ansible.builtin.import_tasks: stage/validate.yml

- name: Wire controller resolver to selected name resolution
  ansible.builtin.import_tasks: stage/controller_resolver.yml
  when: bootwright_install_agent_action_effective in ['run', 'create_iso']

- name: Prepare controller endpoint DNS
  ansible.builtin.import_tasks: stage/controller_dns.yml
  when: bootwright_install_agent_action_effective in ['run', 'create_iso']

- name: Run selected agent install action
  ansible.builtin.include_tasks: "actions/{{ bootwright_install_agent_action_effective }}.yml"
