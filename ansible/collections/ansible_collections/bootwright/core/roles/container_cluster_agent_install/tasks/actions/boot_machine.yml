---
- name: Boot selected machine when install is not already complete
  when: not bootwright_install_already_complete
  block:
    - name: Read agent ISO publish token
      ansible.builtin.slurp:
        src: "{{ bootwright_install_local_work_dir }}/agent-iso-publish-token"
      register: bootwright_agent_iso_publish_token_file
      delegate_to: localhost
      become: false
      no_log: "{{ bootwright_no_log | default(true) | bool }}"

    - name: Set agent ISO publish token
      ansible.builtin.set_fact:
        bootwright_agent_iso_publish_token: "{{ bootwright_agent_iso_publish_token_file.content | b64decode | trim }}"
      changed_when: false
      no_log: "{{ bootwright_no_log | default(true) | bool }}"

    - name: Resolve selected machine from agent node host variable
      ansible.builtin.set_fact:
        bootwright_boot_components: >-
          {{
            bootwright_current_cluster.components
            | selectattr('kind', 'equalto', 'machines')
            | selectattr('name', 'equalto', bootwright_agent_node_machine_name)
            | list
          }}
      when: bootwright_agent_node_machine_name is defined
      changed_when: false

    - name: Resolve selected machine from loop variable
      ansible.builtin.set_fact:
        bootwright_boot_components: "{{ [bootwright_component] }}"
      when: bootwright_component is defined
      changed_when: false

    - name: Assert selected machine exists
      ansible.builtin.assert:
        that:
          - bootwright_boot_components | default([]) | length == 1
        fail_msg: >-
          Could not resolve machine {{ bootwright_agent_node_machine_name | default('<unset>') }}
          for cluster {{ bootwright_current_cluster.name }}.

    - name: Set selected machine component
      ansible.builtin.set_fact:
        bootwright_selected_component: "{{ bootwright_boot_components | first }}"
      changed_when: false

    - name: Refuse installer boot for a provided-OS ContainerCluster node
      ansible.builtin.assert:
        that:
          - bootwright_selected_component.osManaged | default(false) | bool
          - not (bootwright_selected_component.osProvided | default(true) | bool)
        fail_msg: >-
          ContainerCluster/{{ bootwright_current_cluster.name }} spec.nodes references
          Machine/{{ bootwright_selected_component.name }} with spec.os.provided=true.
          The OpenShift agent installer writes RHCOS to the node disk; refusing
          before provider boot dispatch so Bootwright cannot overwrite an
          operator-provided OS. Set Machine/{{ bootwright_selected_component.name }}
          spec.os.provided=false or remove that Machine from
          ContainerCluster/{{ bootwright_current_cluster.name }} spec.nodes,
          validate desired state, then re-run `{{ bootwright_mutating_invocation }}`.

    - name: Resolve selected machine agent ISO target
      ansible.builtin.set_fact:
        bootwright_selected_component: >-
          {{
            bootwright_selected_component | combine({
              'boot': bootwright_selected_component.boot | combine({
                'agentIso': bootwright_selected_component.boot.agentIso | combine({
                  'stagePath': bootwright_selected_component.boot.agentIso.stagePath | default('') | replace(bootwright_agent_iso_publish_token_placeholder, bootwright_agent_iso_publish_token),
                  'fetchUrl': bootwright_selected_component.boot.agentIso.fetchUrl | default('') | replace(bootwright_agent_iso_publish_token_placeholder, bootwright_agent_iso_publish_token)
                })
              })
            }, recursive=true)
          }}
      changed_when: false
      no_log: "{{ bootwright_no_log | default(true) | bool }}"
      when:
        - bootwright_selected_component.boot is defined
        - bootwright_selected_component.boot.agentIso is defined

    - name: Boot selected machine via its substrate-specific driver
      ansible.builtin.include_role:
        name: "{{ bootwright_selected_component.bootApplyRole }}"
      vars:
        bootwright_component: "{{ bootwright_selected_component }}"
