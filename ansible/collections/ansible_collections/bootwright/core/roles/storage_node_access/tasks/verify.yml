---
- name: Verify passwordless sudo for the storage node orchestration account
  ansible.builtin.command:
    argv: "{{ bootwright_node_access_ssh_argv + [bootwright_node_access_target_endpoint, 'sudo -n true'] }}"
  delegate_to: localhost
  become: false
  register: bootwright_node_access_verify
  changed_when: false
  failed_when: false

- name: Require the storage node orchestration account before any root revocation
  ansible.builtin.assert:
    that:
      - (bootwright_node_access_verify.rc | default(1) | int) == 0
    fail_msg: >-
      Machine {{ bootwright_storage_node_name | default(inventory_hostname) }} did not
      accept {{ bootwright_node_access.user }}@{{ bootwright_node_access.address }} with
      passwordless sudo after the account was provisioned
      (rc={{ bootwright_node_access_verify.rc | default('unknown') }}:
      {{ bootwright_node_access_verify.stderr | default('') | trim }}). Root SSH was NOT
      revoked and the node is otherwise untouched, so it stays reachable. Check on the
      node that {{ bootwright_node_access.sudoersPath }} is present and 0440 root:root,
      that {{ bootwright_node_access.user }} owns a 0700 ~/.ssh with a 0600
      authorized_keys holding the Machine access public key, and that SELinux labels on
      that directory are correct (restorecon -R), then re-apply. Bootwright proves this
      without a controlling terminal on purpose, because cephadm's manager runs sudo that
      way; a node whose sudo policy reaches {{ bootwright_node_access.user }} only from an
      interactive session cannot be orchestrated. If
      {{ bootwright_node_access.sudoersPath }} is present and correct but has no effect,
      the node is not reading it: sudo applies Defaults in parse order and the last one
      wins whether it is generic or per-user, so any file in
      {{ bootwright_node_access.sudoersPath | dirname }} sorting after
      {{ bootwright_node_access.sudoersPath | basename }} overrides it; a Defaults
      requiretty placed after @includedir in /etc/sudoers cannot be overridden by any
      drop-in; and an LDAP or SSSD cn=defaults carrying ignore_local_sudoers skips
      /etc/sudoers and every drop-in outright, in which case the grant must come from
      the directory, not from this node. Run
      sudo -ll -U {{ bootwright_node_access.user }} on the node to see which policy wins.
  delegate_to: localhost
  become: false

- name: Switch to the storage node orchestration identity
  ansible.builtin.set_fact:
    bootwright_node_access_endpoint: "{{ bootwright_node_access_target_endpoint }}"
    bootwright_node_access_sudo: sudo -n
    bootwright_node_access_tty_required: false
    bootwright_node_access_privileged_argv: "{{ bootwright_node_access_ssh_argv }}"
  delegate_to: localhost
  become: false
  changed_when: false
