---
- name: Probe privileged execution on the storage node without a terminal
  ansible.builtin.command:
    argv: "{{ bootwright_node_access_ssh_argv + [bootwright_node_access_endpoint, bootwright_node_access_command] }}"
  vars:
    bootwright_node_access_command: "{{ bootwright_node_access_sudo }} true"
  delegate_to: localhost
  become: false
  register: bootwright_node_access_privilege_probe
  changed_when: false
  failed_when: false
  when:
    - (bootwright_node_access_sudo | default('') | length) > 0
    - not (bootwright_node_access_ready | bool)

- name: Probe privileged execution on the storage node with a terminal
  ansible.builtin.command:
    argv: "{{ bootwright_node_access_ssh_tty_argv + [bootwright_node_access_endpoint, bootwright_node_access_command] }}"
  vars:
    bootwright_node_access_command: "{{ bootwright_node_access_sudo }} true"
  delegate_to: localhost
  become: false
  register: bootwright_node_access_tty_probe
  changed_when: false
  failed_when: false
  when: (bootwright_node_access_privilege_probe.rc | default(0) | int) != 0

- name: Install the storage node sudo askpass helper for the borrowed identity
  ansible.builtin.command:
    argv: "{{ bootwright_node_access_ssh_argv + [bootwright_node_access_endpoint, bootwright_node_access_command] }}"
    stdin: "{{ lookup('ansible.builtin.env', bootwright_node_access.sudoPasswordEnv) }}"
  vars:
    bootwright_node_access_command: >-
      umask 077
      && d=""
      && for t in "${XDG_RUNTIME_DIR:-}" /dev/shm "$HOME" "${TMPDIR:-/tmp}"; do
      [ -n "$t" ] && [ -d "$t" ] && [ -w "$t" ] || continue;
      c=$(TMPDIR="$t" mktemp -d 2>/dev/null) || continue;
      printf '%s\n' '#!/bin/sh' 'exec cat "$(dirname "$0")/pw"' > "$c/ask" 2>/dev/null
      && chmod 0700 "$c/ask"
      && : > "$c/pw"
      && chmod 0600 "$c/pw"
      && "$c/ask" >/dev/null 2>&1
      && d="$c" && break;
      rm -rf "$c";
      done
      && [ -n "$d" ]
      && printf '{{ bootwright_node_access_askpass_marker }}<<<%s>>>\n' "$d"
      && { nohup sh -c 'sleep {{ bootwright_node_access_askpass_ttl }}; rm -rf "$0"' "$d"
      >/dev/null 2>&1 </dev/null & }
      && cat > "$d/pw"
      && "$d/ask" >/dev/null
  delegate_to: localhost
  become: false
  no_log: true
  register: bootwright_node_access_askpass_install
  changed_when: true
  failed_when: false
  when:
    - (bootwright_node_access_privilege_probe.rc | default(0) | int) != 0
    - (bootwright_node_access_tty_probe.rc | default(1) | int) != 0
    - (bootwright_node_access.sudoPasswordEnv | default('') | length) > 0

- name: Resolve the storage node sudo askpass helper the borrowed identity created
  ansible.builtin.set_fact:
    bootwright_node_access_askpass_dir: >-
      {{
        bootwright_node_access_askpass_install.stdout | default('', true)
        | regex_search(bootwright_node_access_askpass_marker ~ '<<<.*>>>')
        | default('', true)
        | regex_replace('^' ~ bootwright_node_access_askpass_marker ~ '<<<(.*)>>>$', '\1')
      }}
  delegate_to: localhost
  become: false
  changed_when: false
  when: not (bootwright_node_access_askpass_install.skipped | default(false) | bool)

- name: Resolve the storage node password-answering privilege prefix
  ansible.builtin.set_fact:
    bootwright_node_access_askpass_sudo: "SUDO_ASKPASS={{ (bootwright_node_access_askpass_dir ~ '/ask') | quote }} sudo -A"
  delegate_to: localhost
  become: false
  changed_when: false
  when: (bootwright_node_access_askpass_dir | default('') | length) > 0

- name: Probe privileged execution with a password on the storage node without a terminal
  ansible.builtin.command:
    argv: "{{ bootwright_node_access_ssh_argv + [bootwright_node_access_endpoint, bootwright_node_access_command] }}"
  vars:
    bootwright_node_access_command: "{{ bootwright_node_access_askpass_sudo }} true"
  delegate_to: localhost
  become: false
  register: bootwright_node_access_password_probe
  changed_when: false
  failed_when: false
  when:
    - (bootwright_node_access_askpass_install.rc | default(1) | int) == 0
    - (bootwright_node_access_askpass_dir | default('') | length) > 0

- name: Probe privileged execution with a password on the storage node with a terminal
  ansible.builtin.command:
    argv: "{{ bootwright_node_access_ssh_tty_argv + [bootwright_node_access_endpoint, bootwright_node_access_command] }}"
  vars:
    bootwright_node_access_command: "{{ bootwright_node_access_askpass_sudo }} true"
  delegate_to: localhost
  become: false
  register: bootwright_node_access_password_tty_probe
  changed_when: false
  failed_when: false
  when:
    - (bootwright_node_access_askpass_install.rc | default(1) | int) == 0
    - (bootwright_node_access_askpass_dir | default('') | length) > 0
    - (bootwright_node_access_password_probe.rc | default(1) | int) != 0

- name: Require privileged execution on the storage node before provisioning
  ansible.builtin.assert:
    that:
      - >-
        (bootwright_node_access_privilege_probe.rc | default(0) | int) == 0
        or (bootwright_node_access_tty_probe.rc | default(1) | int) == 0
        or (bootwright_node_access_password_probe.rc | default(1) | int) == 0
        or (bootwright_node_access_password_tty_probe.rc | default(1) | int) == 0
    fail_msg: >-
      Machine {{ bootwright_storage_node_name | default(inventory_hostname) }} answered as
      {{ bootwright_node_access_endpoint }}, but that account cannot run a privileged
      command: "{{ bootwright_node_access_sudo }} true" failed without a controlling
      terminal (rc={{ bootwright_node_access_privilege_probe.rc | default('unknown') }})
      and again with one (rc={{ bootwright_node_access_tty_probe.rc | default('unknown') }}:
      {{ bootwright_node_access_tty_diagnostic }}).
      {% if (bootwright_node_access_askpass_install.rc | default(1) | int) == 0 %}
      Answering sudo with the password --ssh-ask-sudo-password collected failed too
      (rc={{ bootwright_node_access_password_probe.rc | default('unknown') }} without a
      terminal, rc={{ bootwright_node_access_password_tty_probe.rc | default('unknown') }}
      with one: {{ bootwright_node_access_password_diagnostic }}), so either that password
      is wrong or {{ bootwright_node_access_install_account }} carries no sudo grant at
      all. Run sudo -l on the node as that account to see which.
      {% elif (bootwright_node_access.sudoPasswordEnv | default('') | length) > 0 %}
      Bootwright held the password --ssh-ask-sudo-password collected but never offered it:
      preparing the sudo askpass helper
      {{ 'under ' ~ bootwright_node_access_askpass_dir if (bootwright_node_access_askpass_dir | default('') | length) > 0 else 'on the node' }}
      exited rc={{ bootwright_node_access_askpass_install.rc | default('unknown') }}
      ({{ bootwright_node_access_askpass_diagnostic }}). Bootwright asks the node for a
      directory {{ bootwright_node_access_install_account }} may both write and execute,
      trying $XDG_RUNTIME_DIR, then /dev/shm, then that account's home, then its temporary
      directory, and it runs an empty helper from each candidate before choosing it — a
      noexec mount fails there with Permission denied.
      {% if (bootwright_node_access_askpass_dir | default('') | length) > 0 %}
      One did pass, so the password may have reached that directory: the node was already
      holding a timer to erase it, armed before the write, and Bootwright removed it on the
      way out of this node.
      {% else %}
      None passed, and the password is written only after one does, so it never left this
      machine.
      {% endif %}
      Give that account one directory it may write and execute, or grant it passwordless
      sudo out of band, and re-apply.
      {% elif bootwright_node_access.sudoPasswordOffered | default(false) | bool %}
      You did pass --ssh-ask-sudo-password, but it does not reach this machine: it answers
      for a login you already administer, which a Machine declares as
      spec.access.ssh.auth.operatorIdentity. This one declares a login of its own, so
      Bootwright connects with the credential that login's Secret names and holds no
      password for its sudo. Grant {{ bootwright_node_access_install_account }} passwordless
      sudo out of band, or declare that arm and name the account you administer with
      --ssh-user.
      {% else %}
      Bootwright offered no password: rerun with --ssh-ask-sudo-password to be prompted
      once for {{ bootwright_node_access_install_account }}'s sudo password, or grant that
      account passwordless sudo out of band.
      {% endif %}
      Bootwright refuses to start creating {{ bootwright_node_access.user }} with a
      privilege it has not proved, so no account was created, no sudoers file was written
      and root SSH is untouched. rc=255 with a failed PTY allocation means sshd sets
      PermitTTY no for that account; set PermitTTY yes in an sshd_config drop-in and reload
      sshd. A sudoers requiretty policy alone needs no change, Bootwright allocates the
      terminal itself. Then re-apply.
  vars:
    bootwright_node_access_tty_diagnostic: >-
      {{
        ((bootwright_node_access_tty_probe | default({}, true)).stdout | default('', true) | trim)
        | default(((bootwright_node_access_tty_probe | default({}, true)).stderr | default('', true) | trim), true)
        | default('no output', true)
      }}
    bootwright_node_access_password_diagnostic: >-
      {{
        ((bootwright_node_access_password_tty_probe | default({}, true)).stdout | default('', true) | trim)
        | default(((bootwright_node_access_password_tty_probe | default({}, true)).stderr | default('', true) | trim), true)
        | default('no output', true)
      }}
    bootwright_node_access_askpass_diagnostic: >-
      {{
        ((bootwright_node_access_askpass_install | default({}, true)).stderr | default('', true) | trim)
        | default(((bootwright_node_access_askpass_install | default({}, true)).msg | default('', true) | trim), true)
        | default('no output', true)
      }}
  delegate_to: localhost
  become: false

- name: Select the password-answering privilege prefix on the storage node
  ansible.builtin.set_fact:
    bootwright_node_access_sudo: "{{ bootwright_node_access_askpass_sudo }}"
  delegate_to: localhost
  become: false
  changed_when: false
  when: >-
    (bootwright_node_access_password_probe.rc | default(1) | int) == 0
    or (bootwright_node_access_password_tty_probe.rc | default(1) | int) == 0

- name: Resolve the storage node privileged SSH invocation
  ansible.builtin.set_fact:
    bootwright_node_access_tty_required: >-
      {{
        (bootwright_node_access_tty_probe.rc | default(1) | int) == 0
        or (bootwright_node_access_password_tty_probe.rc | default(1) | int) == 0
      }}
    bootwright_node_access_privileged_argv: >-
      {{
        bootwright_node_access_ssh_tty_argv
        if ((bootwright_node_access_tty_probe.rc | default(1) | int) == 0
            or (bootwright_node_access_password_tty_probe.rc | default(1) | int) == 0)
        else bootwright_node_access_ssh_argv
      }}
  delegate_to: localhost
  become: false
  changed_when: false

- name: Report that the storage node requires a terminal for sudo
  ansible.builtin.debug:
    msg: >-
      Machine {{ bootwright_storage_node_name | default(inventory_hostname) }} refuses sudo
      as {{ bootwright_node_access_install_account }} without a controlling terminal, so its
      sudoers sets requiretty. Bootwright allocates a terminal for its own connection while
      it provisions {{ bootwright_node_access.user }}, and changes nothing about that
      account's sudo policy. The account it creates carries
      "Defaults:{{ bootwright_node_access.user }} !requiretty" in
      {{ bootwright_node_access.sudoersPath }}, because cephadm's manager runs sudo without
      a terminal; that exemption is proved without one before root SSH is revoked.
  when: bootwright_node_access_tty_required | bool

- name: Report that the storage node escalates with a prompted sudo password
  ansible.builtin.debug:
    msg: >-
      Machine {{ bootwright_storage_node_name | default(inventory_hostname) }} refuses
      passwordless sudo as {{ bootwright_node_access_install_account }}, so Bootwright
      answers its sudo prompt with the password --ssh-ask-sudo-password collected, for the
      length of the provisioning window only. That password is held on the node in a 0600
      file inside {{ bootwright_node_access_askpass_dir }}, a directory the node itself
      created 0700 under an unguessable name, preferring memory-backed storage that no
      backup and no reboot carries forward. It is readable by that account and root alone,
      Bootwright removes it before the play leaves this node and confirms it is gone, and
      the node erases it unprompted {{ bootwright_node_access_askpass_ttl }} seconds after
      it was written — a timer armed before the password was, so no failure of this run can
      leave it there. The {{ bootwright_node_access.user }} account Bootwright creates is
      granted passwordless sudo instead, and is proved without a password and without a
      terminal before root SSH is revoked, because that is the channel cephadm's manager
      uses.
  when:
    - (bootwright_node_access_password_probe.rc | default(1) | int) == 0
      or (bootwright_node_access_password_tty_probe.rc | default(1) | int) == 0
