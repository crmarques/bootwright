---
- name: Resolve storage node access context for teardown
  ansible.builtin.include_tasks: context.yml

- name: Repair managed storage node connection trust for teardown
  ansible.builtin.include_tasks: repair_connection_alias.yml

- name: Resolve canonical storage node access endpoints for teardown
  ansible.builtin.set_fact:
    bootwright_node_access_target_endpoint: >-
      {{ bootwright_node_access.user }}@{{ bootwright_node_access.connectionAddress }}
    bootwright_node_access_install_endpoint: >-
      {{
        ((bootwright_node_access.installUser ~ '@') if (bootwright_node_access.installUser | default('') | length) > 0 else '')
        ~ bootwright_node_access.connectionAddress
      }}
  delegate_to: localhost
  become: false
  changed_when: false

- name: Probe storage node access identities for teardown
  ansible.builtin.include_tasks: probe.yml
  vars:
    bootwright_node_access_probe_fail_when_unreachable: false

- name: Record whether a storage node identity is reachable for teardown
  ansible.builtin.set_fact:
    bootwright_node_access_connection_available: >-
      {{
        (bootwright_node_access_target_probe.rc | default(1) | int) == 0
        or (bootwright_node_access_install_probe.rc | default(1) | int) == 0
      }}
  delegate_to: localhost
  become: false
  changed_when: false

- name: Record how the storage node answered its teardown identities
  ansible.builtin.set_fact:
    bootwright_node_access_node_refusal: >-
      {{ (bootwright_node_access_target_endpoint | default(inventory_hostname))
         ~ ' exited ' ~ (bootwright_node_access_target_probe.rc | default('unknown') | string)
         ~ ' for `sudo -n true` (' ~ (bootwright_node_access_target_probe.stderr | default('') | trim) ~ '); '
         ~ (bootwright_node_access_install_endpoint | default(inventory_hostname))
         ~ ' exited ' ~ (bootwright_node_access_install_probe.rc | default('unknown') | string)
         ~ ' for `true` (' ~ (bootwright_node_access_install_probe.stderr | default('') | trim) ~ ')' }}
    bootwright_node_access_node_absent: false
  delegate_to: localhost
  become: false
  changed_when: false

- name: Classify whether the storage node teardown refusal proves absence
  ansible.builtin.include_tasks: classify_absence.yml
  vars:
    bootwright_node_access_absence_diagnostic: "{{ bootwright_node_access_node_refusal }}"
    bootwright_node_access_absence_timed_out: >-
      {{ [(bootwright_node_access_target_probe.rc | default(0) | int),
           (bootwright_node_access_install_probe.rc | default(0) | int)]
         | select('in', [124, 137, 143]) | list | length > 0 }}
  when: not (bootwright_node_access_connection_available | bool)

- name: Select the reachable storage node identity for teardown
  ansible.builtin.set_fact:
    ansible_user: >-
      {{
        bootwright_node_access.installUser
        if (bootwright_node_access.connectionOverride | default(false) | bool)
        else (
          bootwright_node_access.user
          if (bootwright_node_access_ready | bool)
          else bootwright_node_access.installUser
        )
      }}
  delegate_to: localhost
  become: false
  changed_when: false
  when:
    - bootwright_node_access_connection_available | bool
    - (bootwright_node_access_ready | bool) or (bootwright_node_access.installUser | default('') | length) > 0

- name: Offer the storage node orchestration account credential for teardown
  ansible.builtin.set_fact:
    ansible_ssh_common_args: >-
      -o IdentityFile={{ bootwright_node_access.accountPrivateKeyPath | quote }}
      {{ ansible_ssh_common_args | default('') }}
  delegate_to: localhost
  become: false
  changed_when: false
  when:
    - bootwright_node_access_connection_available | bool
    - bootwright_node_access_ready | bool
    - not (bootwright_node_access.connectionOverride | default(false) | bool)
    - (bootwright_node_access.accountPrivateKeyPath | default('') | length) > 0
    - bootwright_node_access.accountPrivateKeyPath not in (ansible_ssh_common_args | default(''))

- name: Reset the storage node connection after teardown identity selection
  ansible.builtin.meta: reset_connection
  when: bootwright_node_access_connection_available | bool
