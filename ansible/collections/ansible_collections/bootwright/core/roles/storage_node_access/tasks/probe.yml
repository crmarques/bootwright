---
- name: Probe the storage node orchestration account
  ansible.builtin.command:
    argv: "{{ bootwright_node_access_ssh_argv + [bootwright_node_access_target_endpoint, 'sudo -n true'] }}"
  delegate_to: localhost
  become: false
  register: bootwright_node_access_target_probe
  changed_when: false
  failed_when: false

- name: Probe the storage node install account
  ansible.builtin.command:
    argv: "{{ bootwright_node_access_ssh_argv + [bootwright_node_access_install_endpoint, 'true'] }}"
  delegate_to: localhost
  become: false
  register: bootwright_node_access_install_probe
  changed_when: false
  failed_when: false

- name: Fail when no storage node identity answers
  ansible.builtin.fail:
    msg: >-
      Machine {{ bootwright_storage_node_name | default(inventory_hostname) }} at
      {{ bootwright_node_access.address }} did not answer as
      {{ bootwright_node_access_identities | join(' or ') }}, using
      {{ bootwright_node_access.installPrivateKeyPath | default('the identity of the account running bootwright', true) }}.
      Bootwright refuses to guess
      another identity, so the node is untouched. Power the node on and confirm sshd is
      running, then re-authorize that key for one of those accounts and confirm
      {{ bootwright_node_access.user }} still holds its NOPASSWD grant in
      {{ bootwright_node_access.sudoersPath }}.
      {% if bootwright_node_access.installIdentity | default(false) | bool %}
      This cluster orchestrates as its install-window identity
      ({{ bootwright_node_access.user }} is both spec.access.ssh.user and
      spec.ceph.cephadm.clusterSSH.user), so there is no second account to fall back to: on
      a Machine with spec.os.provided true that account is prepared out of band, and on a
      Bootwright-installed Machine the kickstart creates it.
      {% endif %}
      Re-apply after one identity answers; if the node was reinstalled out of band, destroy
      the storage cluster and re-apply instead.
  delegate_to: localhost
  become: false
  when:
    - (bootwright_node_access_target_probe.rc | default(1) | int) != 0
    - (bootwright_node_access_install_probe.rc | default(1) | int) != 0
    - bootwright_node_access_probe_fail_when_unreachable | default(true) | bool

- name: Select the storage node access identity
  ansible.builtin.set_fact:
    bootwright_node_access_ready: "{{ (bootwright_node_access_target_probe.rc | default(1) | int) == 0 }}"
  delegate_to: localhost
  become: false
  changed_when: false

- name: Resolve the storage node access endpoint and privilege prefix
  ansible.builtin.set_fact:
    bootwright_node_access_endpoint: >-
      {{
        bootwright_node_access_target_endpoint
        if (bootwright_node_access_ready | bool)
        else bootwright_node_access_install_endpoint
      }}
    bootwright_node_access_sudo: >-
      {{
        'sudo -n'
        if ((bootwright_node_access_ready | bool) or bootwright_node_access_install_account != 'root')
        else ''
      }}
  delegate_to: localhost
  become: false
  changed_when: false
