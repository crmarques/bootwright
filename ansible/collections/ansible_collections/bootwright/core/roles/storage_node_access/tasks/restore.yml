---
- name: Probe the storage node root login drop-in before restoring root SSH
  ansible.builtin.command:
    argv: "{{ bootwright_node_access_ssh_argv + [bootwright_node_access_endpoint, bootwright_node_access_command] }}"
  vars:
    bootwright_node_access_command: >-
      {{ bootwright_node_access_sudo }} test -f {{ bootwright_node_access.sshdDropInPath | quote }}
  delegate_to: localhost
  become: false
  register: bootwright_node_access_restore_probe
  changed_when: false
  failed_when: false

- name: Remove the storage node root login drop-in
  ansible.builtin.command:
    argv: "{{ bootwright_node_access_ssh_argv + [bootwright_node_access_endpoint, bootwright_node_access_command] }}"
  vars:
    bootwright_node_access_command: >-
      {{ bootwright_node_access_sudo }} rm -f {{ bootwright_node_access.sshdDropInPath | quote }}
  delegate_to: localhost
  become: false
  changed_when: true
  when: (bootwright_node_access_restore_probe.rc | default(1) | int) == 0

- name: Validate the storage node sshd configuration after restoring root SSH
  ansible.builtin.command:
    argv: "{{ bootwright_node_access_ssh_argv + [bootwright_node_access_endpoint, bootwright_node_access_command] }}"
  vars:
    bootwright_node_access_command: >-
      {{ bootwright_node_access_sudo }} sshd -t
  delegate_to: localhost
  become: false
  register: bootwright_node_access_restore_sshd_check
  changed_when: false
  failed_when: false
  when: (bootwright_node_access_restore_probe.rc | default(1) | int) == 0

- name: Require a valid storage node sshd configuration after restoring root SSH
  ansible.builtin.assert:
    that:
      - (bootwright_node_access_restore_sshd_check.rc | default(1) | int) == 0
    fail_msg: >-
      Machine {{ bootwright_storage_node_name | default(inventory_hostname) }} still
      rejects its sshd configuration after {{ bootwright_node_access.sshdDropInPath }} was
      removed to restore root login
      ({{ bootwright_node_access_restore_sshd_check.stderr | default('') | trim }}). sshd
      was not reloaded, so the running daemon keeps its current policy. Fix the sshd
      configuration the node already carried (sshd -t names the offending file and line),
      then re-apply.
  delegate_to: localhost
  become: false
  when: (bootwright_node_access_restore_probe.rc | default(1) | int) == 0

- name: Reload sshd on the storage node after restoring root SSH
  ansible.builtin.command:
    argv: "{{ bootwright_node_access_ssh_argv + [bootwright_node_access_endpoint, bootwright_node_access_command] }}"
  vars:
    bootwright_node_access_command: >-
      {{ bootwright_node_access_sudo }} systemctl reload sshd
  delegate_to: localhost
  become: false
  changed_when: true
  when: (bootwright_node_access_restore_probe.rc | default(1) | int) == 0

- name: Probe the storage node install account authorized key before restoring it
  ansible.builtin.command:
    argv: "{{ bootwright_node_access_ssh_argv + [bootwright_node_access_endpoint, bootwright_node_access_command] }}"
  vars:
    bootwright_node_access_command: >-
      {{ bootwright_node_access_sudo }} grep -qxF {{ bootwright_node_access_public_key | quote }}
      {{ (bootwright_node_access_install_home ~ '/.ssh/authorized_keys') | quote }}
  delegate_to: localhost
  become: false
  register: bootwright_node_access_restore_key_probe
  changed_when: false
  failed_when: false

- name: Reauthorize the machine access key for the storage node install account
  ansible.builtin.command:
    argv: "{{ bootwright_node_access_ssh_argv + [bootwright_node_access_endpoint, bootwright_node_access_command] }}"
  vars:
    bootwright_node_access_command: >-
      {{ bootwright_node_access_sudo }} install -d -m 0700
      -o {{ bootwright_node_access_install_account | quote }}
      -g {{ bootwright_node_access_install_group | quote }}
      {{ (bootwright_node_access_install_home ~ '/.ssh') | quote }}
      && printf '%s\n' {{ bootwright_node_access_public_key | quote }}
      | {{ bootwright_node_access_sudo }} tee -a
      {{ (bootwright_node_access_install_home ~ '/.ssh/authorized_keys') | quote }} >/dev/null
      && {{ bootwright_node_access_sudo }} chown
      {{ bootwright_node_access_install_account | quote }}:{{ bootwright_node_access_install_group | quote }}
      {{ (bootwright_node_access_install_home ~ '/.ssh/authorized_keys') | quote }}
      && {{ bootwright_node_access_sudo }} chmod 0600
      {{ (bootwright_node_access_install_home ~ '/.ssh/authorized_keys') | quote }}
  delegate_to: localhost
  become: false
  changed_when: true
  when: (bootwright_node_access_restore_key_probe.rc | default(1) | int) != 0

- name: Restore SELinux labels on the storage node install account SSH directory
  ansible.builtin.command:
    argv: "{{ bootwright_node_access_ssh_argv + [bootwright_node_access_endpoint, bootwright_node_access_command] }}"
  vars:
    bootwright_node_access_command: >-
      command -v restorecon >/dev/null 2>&1
      && {{ bootwright_node_access_sudo }} restorecon -R
      {{ (bootwright_node_access_install_home ~ '/.ssh') | quote }}
  delegate_to: localhost
  become: false
  changed_when: false
  failed_when: false
  when: (bootwright_node_access_restore_key_probe.rc | default(1) | int) != 0
