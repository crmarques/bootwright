argument_specs:
  apply:
    short_description: Update a provided RHEL host and prove its reboot.
    options: &request
      bootwright_provided_update_request:
        type: dict
        required: true
        options:
          version:
            type: str
            required: true
            choices:
              - provided-os-update-request-v1
          identity:
            type: dict
            required: true
          placement:
            type: dict
            required: true
          release:
            type: str
            required: true
      bootwright_provided_update_digest:
        type: str
        required: true
      bootwright_provided_update_material:
        type: dict
        required: true
        options:
          identity:
            type: str
            required: true
          knownHosts:
            type: str
            required: true
          owner:
            type: str
            required: true

  observe:
    short_description: Read a provided RHEL host's update receipt.
    options: *request
