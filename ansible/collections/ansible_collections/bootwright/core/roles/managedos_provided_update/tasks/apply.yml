---
- name: Validate the frozen provided update request
  ansible.builtin.assert:
    that:
      - bootwright_provided_update_request.version == 'provided-os-update-request-v1'
      - bootwright_provided_update_request.placement.connection == 'ssh'
      - bootwright_provided_update_request.release is string
      - bootwright_provided_update_request.release | length <= 64
      - bootwright_provided_update_request.release is match('^(0|[1-9][0-9]*)[.](0|[1-9][0-9]*)$(?!\n)')
      - bootwright_provided_update_digest is match('^[0-9a-f]{64}$(?!\n)')
      - bootwright_provided_update_material.owner is match('^[0-9a-f]{64}$(?!\n)')
    quiet: true
  no_log: true

- name: Complete the qualified execution handoff
  bootwright.core.managedos_provided_update_protocol:
    phase: loaded

- name: Apply the inspected operating system update transaction
  bootwright.core.managedos_provided_update:
    operation: apply
    request: '{{ bootwright_provided_update_digest }}'
    owner: '{{ bootwright_provided_update_material.owner }}'
    release: '{{ bootwright_provided_update_request.release }}'
  register: managedos_provided_update_initial
  failed_when: false
  timeout: 1800
  no_log: true

- name: Resolve a bounded update refusal
  ansible.builtin.import_tasks: refused.yml
  vars:
    managedos_provided_update_answer: '{{ managedos_provided_update_initial }}'

- name: Reboot after a package transaction
  when: managedos_provided_update_initial.state == 'upgraded'
  block:
    - name: Reboot and reconnect to the pinned host
      ansible.builtin.reboot:
        reboot_timeout: 300
        post_reboot_delay: 5
        connect_timeout: 10
        search_paths:
          - /usr/sbin
          - /usr/bin
      no_log: true

    - name: Prove the original RHEL release and a new boot
      bootwright.core.managedos_provided_update:
        operation: complete
        request: '{{ bootwright_provided_update_digest }}'
        owner: '{{ bootwright_provided_update_material.owner }}'
        release: '{{ bootwright_provided_update_request.release }}'
      register: managedos_provided_update_rebooted
      failed_when: false
      timeout: 90
      no_log: true

    - name: Resolve a bounded reboot verification refusal
      ansible.builtin.import_tasks: refused.yml
      vars:
        managedos_provided_update_answer: '{{ managedos_provided_update_rebooted }}'

- name: Publish completed provided update evidence
  bootwright.core.managedos_provided_update_protocol:
    phase: completed
    digest: '{{ bootwright_provided_update_digest }}'
    release: '{{ bootwright_provided_update_request.release }}'
    answer: >-
      {{ managedos_provided_update_rebooted if managedos_provided_update_initial.state == 'upgraded'
         else managedos_provided_update_initial }}
    outcome: "{{ 'changed' if managedos_provided_update_initial.changed else 'unchanged' }}"
  no_log: true
