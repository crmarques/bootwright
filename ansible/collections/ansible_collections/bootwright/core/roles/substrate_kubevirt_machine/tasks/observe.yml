---
# Read-only: an observation reports what it found, nothing present, this
# block's own VirtualMachine whole or part way, a foreign one, or a host that
# did not answer, and the engine resolves the effect from that.
- name: Validate the frozen machine request
  ansible.builtin.assert:
    that:
      - bootwright_substrate_kubevirt_machine_request.version == 'machine-kubevirt-v1'
      - bootwright_substrate_kubevirt_machine_digest is match('^[0-9a-f]{64}$(?!\n)')
    quiet: true
  no_log: true

- name: Complete the qualified execution handoff
  bootwright.core.substrate_kubevirt_protocol:
    phase: loaded
  no_log: true

- name: Read the root disk a staged destroy blanks and its mark, changing nothing
  bootwright.core.substrate_kubevirt_api:
    operation: root_read
    kubeconfig: '{{ bootwright_substrate_kubevirt_machine_material.kubeconfig }}'
    scratch: '{{ bootwright_run_scratch }}'
    request: '{{ bootwright_substrate_kubevirt_machine_request }}'
    removal: '{{ bootwright_substrate_kubevirt_machine_material.rootReset }}'
    step: '{{ bootwright_substrate_kubevirt_machine_material.rootResetStep }}'
    pinned: '{{ bootwright_substrate_kubevirt_machine_material.pinned | from_json }}'
    seconds: '{{ substrate_kubevirt_machine_seconds }}'
  register: substrate_kubevirt_machine_root
  failed_when: false
  no_log: true
  when: bootwright_substrate_kubevirt_machine_material.rootReset is defined

- name: Stop at what the host refused of the root disk's reading
  ansible.builtin.assert:
    that:
      - substrate_kubevirt_machine_root.msg is not defined
    fail_msg: >-
      the root disk reading of Machine {{ bootwright_substrate_kubevirt_machine_request.identity.object }} on
      VirtualMachine {{ bootwright_substrate_kubevirt_machine_request.namespace }}/{{ bootwright_substrate_kubevirt_machine_request.name }}
      failed: {{ (substrate_kubevirt_machine_root.msg | default('') | string | bootwright.core.printable)[:512] }}
    quiet: true
  when: bootwright_substrate_kubevirt_machine_material.rootReset is defined

- name: Publish the root disk's bounded evidence
  bootwright.core.substrate_kubevirt_protocol:
    phase: completed
    subject: root-reset
    observed: true
    outcome: unchanged
    digest: '{{ bootwright_substrate_kubevirt_machine_digest }}'
    root_reset: '{{ bootwright_substrate_kubevirt_machine_material.rootReset }}/{{ bootwright_substrate_kubevirt_machine_material.rootResetStep }}'
    observation: '{{ substrate_kubevirt_machine_root.observation }}'
  no_log: true
  when: bootwright_substrate_kubevirt_machine_material.rootReset is defined

# A root disk's reading publishes only that evidence, so the machine's own
# observation does not run.
- name: End the root disk's reading
  ansible.builtin.meta: end_host
  when: bootwright_substrate_kubevirt_machine_material.rootReset is defined

- name: Run the observe operation through the host cluster's API
  bootwright.core.substrate_kubevirt_api:
    operation: observe
    power_only: '{{ bootwright_substrate_kubevirt_machine_material.startPower | default(false) | bool }}'
    kubeconfig: '{{ bootwright_substrate_kubevirt_machine_material.kubeconfig }}'
    scratch: '{{ bootwright_run_scratch }}'
    request: '{{ bootwright_substrate_kubevirt_machine_request }}'
    apply_operation: '{{ bootwright_substrate_kubevirt_machine_material.operation | default("") }}'
    block: '{{ bootwright_substrate_kubevirt_machine_material.block | default("") }}'
    registered: '{{ bootwright_substrate_kubevirt_machine_material.registered | default("") }}'
    pinned: '{{ bootwright_substrate_kubevirt_machine_material.pinned | default("{}") | from_json }}'
    seconds: '{{ substrate_kubevirt_machine_seconds }}'
  register: substrate_kubevirt_machine_result
  failed_when: false
  no_log: true

# ansible-core keeps nothing of a failure under no_log but that it failed, so
# the refusal is reported here, where no credential is.
- name: Stop at what the host refused
  ansible.builtin.assert:
    that:
      - substrate_kubevirt_machine_result.msg is not defined
    fail_msg: >-
      the observe of Machine {{ bootwright_substrate_kubevirt_machine_request.identity.object }} on
      VirtualMachine {{ bootwright_substrate_kubevirt_machine_request.namespace }}/{{ bootwright_substrate_kubevirt_machine_request.name }}
      failed: {{ (substrate_kubevirt_machine_result.msg | default('') | string | bootwright.core.printable)[:512] }}
    quiet: true

- name: Publish bounded machine evidence
  bootwright.core.substrate_kubevirt_protocol:
    phase: completed
    subject: machine
    observed: true
    outcome: unchanged
    digest: '{{ bootwright_substrate_kubevirt_machine_digest }}'
    observation: '{{ substrate_kubevirt_machine_result.observation }}'
  no_log: true
