---
# The root disk of a kept VirtualMachine whose installation a staged destroy
# takes back: only its root DataVolume is deleted, by UID, and created again
# blank by the VirtualMachine's own template at its frozen size and class, and
# the VirtualMachine is marked with the staged destroy and step through a
# UID-tested patch, so its UID, MACs, vTPM state and claim stay as the apply
# left them, and its boot order, root disk first and media second, sends the
# next boot to the installer media the restore inserts.
- name: Validate the frozen machine request
  ansible.builtin.assert:
    that:
      - bootwright_substrate_kubevirt_machine_request.version == 'machine-kubevirt-v1'
      - bootwright_substrate_kubevirt_machine_digest is match('^[0-9a-f]{64}$(?!\n)')
      - bootwright_substrate_kubevirt_machine_material.rootReset is match('^op-[0-9a-f]{32}$(?!\n)')
    quiet: true
  no_log: true

- name: Complete the qualified execution handoff
  bootwright.core.substrate_kubevirt_protocol:
    phase: loaded
  no_log: true

- name: Blank the root disk under the staged destroy's mark
  bootwright.core.substrate_kubevirt_api:
    operation: root_reset
    kubeconfig: '{{ bootwright_substrate_kubevirt_machine_material.kubeconfig }}'
    scratch: '{{ bootwright_run_scratch }}'
    request: '{{ bootwright_substrate_kubevirt_machine_request }}'
    removal: '{{ bootwright_substrate_kubevirt_machine_material.rootReset }}'
    step: '{{ bootwright_substrate_kubevirt_machine_material.rootResetStep }}'
    pinned: '{{ bootwright_substrate_kubevirt_machine_material.pinned | from_json }}'
    seconds: '{{ substrate_kubevirt_machine_seconds }}'
  register: substrate_kubevirt_machine_root
  failed_when: false
  no_log: true

# ansible-core keeps nothing of a failure under no_log but that it failed, so
# the refusal is reported here, where no credential is.
- name: Stop at what the host refused
  ansible.builtin.assert:
    that:
      - substrate_kubevirt_machine_root.msg is not defined
    fail_msg: >-
      the root disk reset of Machine {{ bootwright_substrate_kubevirt_machine_request.identity.object }} on
      VirtualMachine {{ bootwright_substrate_kubevirt_machine_request.namespace }}/{{ bootwright_substrate_kubevirt_machine_request.name }}
      failed: {{ (substrate_kubevirt_machine_root.msg | default('') | string | bootwright.core.printable)[:512] }}
    quiet: true

- name: Publish the root disk's bounded evidence
  bootwright.core.substrate_kubevirt_protocol:
    phase: completed
    subject: root-reset
    outcome: "{{ 'changed' if substrate_kubevirt_machine_root.changed else 'unchanged' }}"
    digest: '{{ bootwright_substrate_kubevirt_machine_digest }}'
    root_reset: '{{ bootwright_substrate_kubevirt_machine_material.rootReset }}/{{ bootwright_substrate_kubevirt_machine_material.rootResetStep }}'
    observation: '{{ substrate_kubevirt_machine_root.observation }}'
  no_log: true
