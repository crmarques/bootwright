---
# The power state is the VirtualMachineInstance's: absent or finished is Off,
# any other phase On, and a host that does not answer leaves both unknown.
- name: Clear the refusal an earlier entry point named
  ansible.builtin.set_fact:
    substrate_kubevirt_machine_refusal: ''
  no_log: true

# A KubeVirt host authenticates with the one kubeconfig the port's user input
# names; a password or a separate trust bundle would be a second credential.
- name: Refuse port access this arm does not read
  ansible.builtin.assert:
    that:
      - bootwright_machine_port.verify | bool
      - (bootwright_machine_port.password | default('', true)) | length == 0
      - (bootwright_machine_port.ca | default('', true)) | length == 0
    fail_msg: a KubeVirt machine port takes one verified kubeconfig as its user input and no password or trust bundle
    quiet: true

- name: Run state_read through the host cluster's API
  bootwright.core.substrate_kubevirt_api:
    operation: state_read
    kubeconfig: '{{ bootwright_machine_port.user }}'
    scratch: '{{ bootwright_run_scratch }}'
    endpoint: '{{ bootwright_machine_port.endpoint }}'
    media_identity: '{{ bootwright_machine_port.media_identity | default("") }}'
    media: '{{ bootwright_machine_port.media | default(true) }}'
  retries: '{{ bootwright_machine_port.retries | default(1) }}'
  delay: '{{ bootwright_machine_port.delay | default(0) }}'
  until: >-
    bootwright_machine_port.expected_power | default('') | length == 0
    or (substrate_kubevirt_machine_port_result.power | default('')) == bootwright_machine_port.expected_power
  register: substrate_kubevirt_machine_port_result
  failed_when: false
  no_log: true

- name: Normalize an unanswered read as unknown
  ansible.builtin.set_fact:
    substrate_kubevirt_machine_port_result: >-
      {{ substrate_kubevirt_machine_port_result | combine({'power_state': 'unknown', 'media_state': 'unknown'})
         if substrate_kubevirt_machine_port_result.msg is defined else substrate_kubevirt_machine_port_result }}
  no_log: true
