---
# Derived from the frozen request only. Nothing here is authored by desired
# state, and no value selects an executable, a role or a task file.
substrate_libvirt_machine_definitions: '{{ bootwright_run_scratch }}/libvirt-machine'
substrate_libvirt_machine_domain_xml: >-
  {{ substrate_libvirt_machine_definitions }}/{{ bootwright_substrate_machine_request.domain }}.xml
substrate_libvirt_machine_unit_path: >-
  /etc/containers/systemd/{{ bootwright_substrate_machine_request.controller.unit }}.container
substrate_libvirt_machine_service: >-
  {{ bootwright_substrate_machine_request.controller.unit }}.service
substrate_libvirt_machine_state: >-
  /var/lib/bootwright-substrate/{{ bootwright_substrate_machine_request.identity.context }}/{{ bootwright_substrate_machine_request.identity.object }}
# The disks the frozen profile declares that are not already present at their
# frozen size. Their count is what makes an apply changed rather than a replay.
substrate_libvirt_machine_missing_disks: >-
  {{ substrate_libvirt_machine_before.observation.disks | rejectattr('present') | list }}

# How long an identity read waits for a machine that has not answered yet.
# Zero is one attempt: only an installation waiting for a machine it just
# booted sets a budget.
substrate_libvirt_machine_identity_retries: 0
substrate_libvirt_machine_identity_delay: 0

# Generic machine-port inputs; the native task implementation owns its aliases.
substrate_libvirt_machine_target_endpoint: "{{ bootwright_machine_port.endpoint }}"
substrate_libvirt_machine_target_ca: "{{ bootwright_machine_port.ca }}"
substrate_libvirt_machine_target_user: "{{ bootwright_machine_port.user }}"
substrate_libvirt_machine_target_password: "{{ bootwright_machine_port.password }}"
substrate_libvirt_machine_target_verify: "{{ bootwright_machine_port.verify }}"

substrate_libvirt_machine_boot_endpoint: "{{ bootwright_machine_port.endpoint }}"
substrate_libvirt_machine_boot_ca: "{{ bootwright_machine_port.ca }}"
substrate_libvirt_machine_boot_user: "{{ bootwright_machine_port.user }}"
substrate_libvirt_machine_boot_password: "{{ bootwright_machine_port.password }}"
substrate_libvirt_machine_boot_verify: "{{ bootwright_machine_port.verify }}"
substrate_libvirt_machine_boot_installer_powers_off: "{{ bootwright_machine_port.installer_powers_off }}"

substrate_libvirt_machine_disk_endpoint: "{{ bootwright_machine_port.endpoint }}"
substrate_libvirt_machine_disk_ca: "{{ bootwright_machine_port.ca }}"
substrate_libvirt_machine_disk_user: "{{ bootwright_machine_port.user }}"
substrate_libvirt_machine_disk_password: "{{ bootwright_machine_port.password }}"
substrate_libvirt_machine_disk_verify: "{{ bootwright_machine_port.verify }}"
substrate_libvirt_machine_disk_power_on: "{{ bootwright_machine_port.power_on }}"
