argument_specs:
  apply:
    short_description: Realize one frozen virtual machine and its management controller.
    options: &request
      bootwright_substrate_machine_request:
        type: dict
        required: true
        options:
          controller:
            type: dict
            required: true
          directory:
            type: str
            required: true
          disks:
            type: list
            elements: dict
            required: true
          domain:
            type: str
            required: true
          egress:
            type: dict
            required: true
          identity:
            type: dict
            required: true
          interfaces:
            type: list
            elements: dict
            required: true
          memoryMiB:
            type: int
            required: true
          placement:
            type: dict
            required: true
          poolName:
            type: str
            required: true
          poolPath:
            type: str
            required: true
          tpm:
            type: bool
            required: true
          uri:
            type: str
            required: true
          uuid:
            type: str
            required: true
          vcpu:
            type: int
            required: true
          version:
            type: str
            required: true
            choices: [machine-libvirt-v8]
      bootwright_substrate_machine_material:
        type: dict
        required: true

  observe:
    short_description: Observe one frozen virtual machine without changing it.
    options: *request

  destroy:
    short_description: Remove one frozen virtual machine and prove its absence.
    options: *request

  # The machine port other domains compose, each entry point included by
  # exactly this key. ansible-core validates these inputs before the entry
  # point's first task. That validation is not hidden from output and echoes a
  # value it refuses, so a credential is passed as the path of its material
  # file, never as its bytes, and no required input has a role default that
  # could stand in for one a consumer forgot.
  pre_boot:
    short_description: Prove a machine this substrate created is off before media is inserted.
    options:
      bootwright_machine_port:
        type: dict
        options:
          endpoint:
            type: str
            required: true
          ca:
            type: path
            required: true
          user:
            type: path
            required: true
          password:
            type: path
            required: true
          verify:
            type: bool
            required: true
          expected:
            type: list
            elements: str
          pinned_uuid_base64:
            type: str
          pinned_serial_base64:
            type: str
          require_tpm:
            type: bool
          # Admitted for the port's parity and refused when not empty: this
          # substrate applies no firmware settings.
          firmware:
            type: dict
      substrate_libvirt_machine_target_endpoint:
        type: str
        required: true
      substrate_libvirt_machine_target_ca:
        type: str
        required: true
      substrate_libvirt_machine_target_verify:
        type: bool
        required: true
      substrate_libvirt_machine_target_user:
        type: str
        required: true
      substrate_libvirt_machine_target_password:
        type: str
        required: true

  boot_media:
    short_description: Boot a machine this substrate created from the media inserted in its controller.
    options:
      bootwright_machine_port:
        type: dict
        options:
          endpoint:
            type: str
            required: true
          ca:
            type: path
            required: true
          user:
            type: path
            required: true
          password:
            type: path
            required: true
          verify:
            type: bool
            required: true
          installer_powers_off:
            type: bool
            required: true
      substrate_libvirt_machine_boot_endpoint:
        type: str
        required: true
      substrate_libvirt_machine_boot_ca:
        type: str
        required: true
      substrate_libvirt_machine_boot_verify:
        type: bool
        required: true
      substrate_libvirt_machine_boot_user:
        type: str
        required: true
      substrate_libvirt_machine_boot_password:
        type: str
        required: true
      # Whether the installer ends by powering the machine off, rather than by
      # rebooting it into what it installed.
      substrate_libvirt_machine_boot_installer_powers_off:
        type: bool
        required: true

  boot_disk:
    short_description: Point a machine this substrate created at its installed disk.
    options:
      bootwright_machine_port:
        type: dict
        options:
          endpoint:
            type: str
            required: true
          ca:
            type: path
            required: true
          user:
            type: path
            required: true
          password:
            type: path
            required: true
          verify:
            type: bool
            required: true
          power_on:
            type: bool
            required: true
      substrate_libvirt_machine_disk_endpoint:
        type: str
        required: true
      substrate_libvirt_machine_disk_ca:
        type: str
        required: true
      substrate_libvirt_machine_disk_verify:
        type: bool
        required: true
      substrate_libvirt_machine_disk_user:
        type: str
        required: true
      substrate_libvirt_machine_disk_password:
        type: str
        required: true
      substrate_libvirt_machine_disk_power_on:
        type: bool
        required: true

  identity_read:
    short_description: Read the install marker and host key through the hypervisor's guest channel.
    options:
      bootwright_machine_identity:
        type: dict
      substrate_libvirt_machine_identity_uri:
        type: str
        required: true
      substrate_libvirt_machine_identity_domain:
        type: str
        required: true
      substrate_libvirt_machine_identity_marker_path:
        type: str
        required: true
      substrate_libvirt_machine_identity_host_key_path:
        type: str
        required: true
      substrate_libvirt_machine_identity_retries:
        type: int
      substrate_libvirt_machine_identity_delay:
        type: int

  state_read:
    short_description: Execute the bounded machine state read port.
    options:
      bootwright_machine_port:
        type: dict
        required: true
        options:
          endpoint:
            type: str
            required: true
          user:
            type: path
            required: true
          password:
            type: path
            required: true
          ca:
            type: path
          verify:
            type: bool
            required: true
          media_identity:
            type: str
          media:
            type: bool
          image_url_file:
            type: path
          retries:
            type: int
          delay:
            type: int
          inspect:
            type: bool
          expected_power:
            type: str
            choices: ['On', 'Off']

  media_insert:
    short_description: Execute the bounded machine media insert port.
    options:
      bootwright_machine_port:
        type: dict
        required: true
        options:
          endpoint:
            type: str
            required: true
          user:
            type: path
            required: true
          password:
            type: path
            required: true
          ca:
            type: path
          verify:
            type: bool
            required: true
          media_identity:
            type: str
          image_url_file:
            type: path
            required: true
          image_path:
            type: path
          private:
            type: bool
            required: true
          trust:
            type: str
            required: true
            choices: [established, importCertificate, disableVerification]
          certificate:
            type: path

  media_eject:
    short_description: Execute the bounded machine media eject port.
    options:
      bootwright_machine_port:
        type: dict
        required: true
        options:
          endpoint:
            type: str
            required: true
          user:
            type: path
            required: true
          password:
            type: path
            required: true
          ca:
            type: path
          verify:
            type: bool
            required: true
          media_identity:
            type: str
          restore_verification:
            type: bool
            required: true
          remove_certificate:
            type: bool
            required: true
          certificate:
            type: path

  power:
    short_description: Execute the bounded machine power port.
    options:
      bootwright_machine_port:
        type: dict
        required: true
        options:
          endpoint:
            type: str
            required: true
          user:
            type: path
            required: true
          password:
            type: path
            required: true
          ca:
            type: path
          verify:
            type: bool
            required: true
          media_identity:
            type: str
          power:
            type: str
            required: true
            choices: ['on', 'off', restart]
          force:
            type: bool
          attempts:
            type: int
