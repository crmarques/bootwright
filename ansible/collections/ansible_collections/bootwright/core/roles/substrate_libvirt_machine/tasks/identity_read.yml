---
- name: Read the machine through its hypervisor channel
  ansible.builtin.include_tasks: identity_agent.yml
  when: (bootwright_machine_identity.key | default('') | length) == 0

- name: Read the installed machine through its delivered SSH host key
  ansible.builtin.include_role:
    name: bootwright.core.machine_ssh_identity
    tasks_from: main
  when: (bootwright_machine_identity.key | default('') | length) > 0

- name: Publish the delivered-key channel answer
  ansible.builtin.set_fact:
    substrate_libvirt_machine_identity_answered: '{{ machine_ssh_identity_answered }}'
    substrate_libvirt_machine_identity_marker: '{{ machine_ssh_identity_marker }}'
    substrate_libvirt_machine_identity_host_key: '{{ machine_ssh_identity_host_key }}'
  changed_when: false
  when: (bootwright_machine_identity.key | default('') | length) > 0
