---
- name: Validate the frozen machine request
  ansible.builtin.assert:
    that:
      - bootwright_substrate_machine_request.version == 'machine-libvirt-v2'
      - bootwright_substrate_machine_request.directory.startswith('/var/lib/libvirt/images/bootwright/')
      - bootwright_substrate_machine_digest is match('[0-9a-f]{64}')
    quiet: true
  no_log: true

- name: Complete the qualified execution handoff
  bootwright.core.substrate_machine_protocol:
    phase: loaded
  no_log: true

- name: Report controller removal
  bootwright.core.substrate_machine_protocol:
    phase: group
    group: stop-controller
    status: running
  no_log: true

- name: Observe the machine before removal
  bootwright.core.libvirt_domain_inspect:
    request: '{{ bootwright_substrate_machine_request }}'
  register: substrate_libvirt_machine_before

# A hypervisor that did not answer reports no domain too, and every guard below
# reads an empty domain as one that is not defined. Nothing then proves the
# machine is not running, so the removal refuses before it stops anything.
- name: Refuse to remove a machine its hypervisor did not answer for
  ansible.builtin.assert:
    that:
      - substrate_libvirt_machine_before.observation.answered
    fail_msg: >-
      the hypervisor at {{ bootwright_substrate_machine_request.uri }} did not
      answer for the machine's domain, so nothing proves it is not in use;
      restore that connection and repeat the removal
    quiet: true

- name: Refuse to remove a same-named domain this context does not own
  ansible.builtin.assert:
    that:
      - substrate_libvirt_machine_before.observation.domain | length == 0
        or substrate_libvirt_machine_before.observation.owned
    fail_msg: a libvirt domain of the same name exists without this context's ownership
    quiet: true

# Removing a running machine takes its memory and disks out from under whatever
# is using them, so the operator stops it first and the removal proves that
# rather than doing it. The engine proves the same thing before it registers;
# this is the guard against a machine started in between.
- name: Refuse to remove a machine that is not shut off
  ansible.builtin.assert:
    that:
      - substrate_libvirt_machine_before.observation.domain | length == 0
        or substrate_libvirt_machine_before.observation.state == 'shut off'
    fail_msg: >-
      the machine is not shut off; stop it with bootwright machine stop --name
      {{ bootwright_substrate_machine_request.identity.object }} and repeat the removal
    quiet: true

- name: Stop the machine's management controller
  ansible.builtin.command:
    argv:
      - /usr/bin/systemctl
      - stop
      - '{{ substrate_libvirt_machine_service }}'
  when: substrate_libvirt_machine_before.observation.unit | length > 0
  changed_when: substrate_libvirt_machine_before.observation.unit | length > 0

- name: Remove the controller unit definition
  ansible.builtin.file:
    path: '{{ substrate_libvirt_machine_unit_path }}'
    state: absent
  register: substrate_libvirt_machine_unit_removed

- name: Reload the host service manager so the unit generator runs
  ansible.builtin.command:
    argv:
      - /usr/bin/systemctl
      - daemon-reload
  changed_when: false

- name: Remove a container the stopped unit left behind
  ansible.builtin.command:
    argv:
      - /usr/bin/podman
      - rm
      - --force
      - --ignore
      - '{{ bootwright_substrate_machine_request.controller.unit }}'
  changed_when: false

- name: Remove the controller's private state
  ansible.builtin.file:
    path: '{{ substrate_libvirt_machine_state }}'
    state: absent
  register: substrate_libvirt_machine_state_removed

- name: Report controller removal completion
  bootwright.core.substrate_machine_protocol:
    phase: group
    group: stop-controller
    status: ok
  no_log: true

- name: Report domain removal
  bootwright.core.substrate_machine_protocol:
    phase: group
    group: remove-domain
    status: running
  no_log: true

- name: Undefine the machine and its firmware state
  ansible.builtin.command:
    argv:
      - /usr/bin/virsh
      - --connect
      - '{{ bootwright_substrate_machine_request.uri }}'
      - undefine
      - --nvram
      - --tpm
      - '{{ bootwright_substrate_machine_request.domain }}'
  register: substrate_libvirt_machine_undefined
  failed_when:
    - substrate_libvirt_machine_undefined.rc != 0
    - '"failed to get domain" not in substrate_libvirt_machine_undefined.stderr'
  changed_when: substrate_libvirt_machine_undefined.rc == 0

- name: Report domain removal completion
  bootwright.core.substrate_machine_protocol:
    phase: group
    group: remove-domain
    status: ok
  no_log: true

- name: Report disk removal
  bootwright.core.substrate_machine_protocol:
    phase: group
    group: remove-disks
    status: running
  no_log: true

- name: Delete every owned disk
  ansible.builtin.file:
    path: '{{ bootwright_substrate_machine_request.directory }}'
    state: absent
  register: substrate_libvirt_machine_disks_removed

- name: Report disk removal completion
  bootwright.core.substrate_machine_protocol:
    phase: group
    group: remove-disks
    status: ok
  no_log: true

- name: Report absence verification
  bootwright.core.substrate_machine_protocol:
    phase: group
    group: verify-absence
    status: running
  no_log: true

- name: Prove every owned resource is gone
  bootwright.core.libvirt_domain_inspect:
    request: '{{ bootwright_substrate_machine_request }}'
  register: substrate_libvirt_machine_after

- name: Report absence verification completion
  bootwright.core.substrate_machine_protocol:
    phase: group
    group: verify-absence
    status: ok
  no_log: true

- name: Publish bounded machine removal evidence
  bootwright.core.substrate_machine_protocol:
    phase: completed
    outcome: >-
      {{ 'changed'
         if (substrate_libvirt_machine_unit_removed is changed
             or substrate_libvirt_machine_state_removed is changed
             or substrate_libvirt_machine_disks_removed is changed
             or substrate_libvirt_machine_before.observation.domain | length > 0)
         else 'unchanged' }}
    digest: '{{ bootwright_substrate_machine_digest }}'
    observation: '{{ substrate_libvirt_machine_after.observation }}'
    removed: true
  no_log: true
