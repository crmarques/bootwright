---
- name: Validate the frozen machine request
  ansible.builtin.assert:
    that:
      - bootwright_substrate_machine_request.version == 'machine-libvirt-v1'
      - bootwright_substrate_machine_digest is match('^[0-9a-f]{64}$(?!\n)')
    quiet: true
  no_log: true

- name: Complete the qualified execution handoff
  bootwright.core.substrate_libvirt_machine_protocol:
    phase: loaded
  no_log: true

- name: Read the root disk a staged destroy blanks and its mark, changing nothing
  bootwright.core.libvirt_root_reset:
    request: '{{ bootwright_substrate_machine_request }}'
    removal: '{{ bootwright_substrate_machine_material.rootReset }}'
    step: '{{ bootwright_substrate_machine_material.rootResetStep }}'
    reset: false
  register: substrate_libvirt_machine_root
  when: bootwright_substrate_machine_material.rootReset is defined

- name: Publish the root disk's bounded evidence
  bootwright.core.substrate_libvirt_machine_protocol:
    phase: completed
    observed: true
    outcome: unchanged
    digest: '{{ bootwright_substrate_machine_digest }}'
    root_reset: '{{ bootwright_substrate_machine_material.rootReset }}/{{ bootwright_substrate_machine_material.rootResetStep }}'
    root_size: '{{ bootwright_substrate_machine_request.disks[0].sizeGiB | int }}'
    observation: '{{ substrate_libvirt_machine_root.observation }}'
  no_log: true
  when: bootwright_substrate_machine_material.rootReset is defined

# A root disk's reading publishes only that evidence, so the machine's own
# observation does not run.
- name: End the root disk's reading
  ansible.builtin.meta: end_host
  when: bootwright_substrate_machine_material.rootReset is defined

- name: Observe the machine without changing any of it
  bootwright.core.libvirt_domain_inspect:
    bootstrap: '{{ bootwright_substrate_machine_material.bootstrap | default(false) | bool }}'
    power_only: '{{ bootwright_substrate_machine_material.startPower | default(false) | bool }}'
    request: '{{ bootwright_substrate_machine_request }}'
  register: substrate_libvirt_machine_observed

- name: Read the power state its controller reports, when it answers
  bootwright.core.redfish_system_read:
    endpoint: '{{ bootwright_substrate_machine_request.controller.endpoint }}'
    user: '{{ lookup("ansible.builtin.file", bootwright_substrate_machine_material.controllerUser, rstrip=false) }}'
    password: '{{ lookup("ansible.builtin.file", bootwright_substrate_machine_material.controllerPassword, rstrip=false) }}'
    verify: true
    ca_data: '{{ lookup("ansible.builtin.file", bootwright_substrate_machine_material.controllerCertificate, rstrip=false) }}'
    media: false
  when: not (bootwright_substrate_machine_material.startPower | default(false) | bool)
  register: substrate_libvirt_machine_controller
  failed_when: false
  no_log: true

- name: Publish bounded machine observation evidence
  bootwright.core.substrate_libvirt_machine_protocol:
    phase: completed
    observed: true
    power_only: '{{ bootwright_substrate_machine_material.startPower | default(false) | bool }}'
    outcome: unchanged
    digest: '{{ bootwright_substrate_machine_digest }}'
    observation: '{{ substrate_libvirt_machine_observed.observation }}'
    power: '{{ substrate_libvirt_machine_controller.power | default("") }}'
    system: '{{ substrate_libvirt_machine_observed.observation.uuid }}'
  no_log: true
