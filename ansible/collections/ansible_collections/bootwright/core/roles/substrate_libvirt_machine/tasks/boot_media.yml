---
# Boot one machine this substrate created from media already inserted in its
# controller.
#
# The emulated controller has no one-time boot override: selecting a device
# rewrites the domain's persistent boot order, which then survives the reboot
# the installer performs and boots the installer again. This arm therefore
# selects nothing and relies on the boot order the domain already declares —
# its own disk first and optical media second, so an empty disk falls through
# to the inserted image and a disk the installer has written takes precedence
# at the next boot.
#
# Inputs are passed explicitly by the consuming role, never inherited from a
# shared fact.
- name: Power the machine on and poll it to running
  bootwright.core.redfish_boot:
    endpoint: '{{ substrate_libvirt_machine_boot_endpoint }}'
    user: '{{ lookup("ansible.builtin.file", substrate_libvirt_machine_boot_user) }}'
    password: '{{ lookup("ansible.builtin.file", substrate_libvirt_machine_boot_password) }}'
    verify: '{{ substrate_libvirt_machine_boot_verify }}'
    operation: power-on
  no_log: true
