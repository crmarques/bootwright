---
# Boot one machine this substrate created from media already inserted in its
# controller.
#
# The machine is Bootwright's own, so it is powered off first, which narrows
# the window in which it was started after the pre-boot proof; a machine that
# proof found off is sent no reset.
#
# The emulated controller has no one-time boot override: selecting a device
# rewrites the domain's persistent boot order, which survives every reboot. An
# installer that ends by powering the machine off (the managed OS) has the
# media selected, and the disk-boot entry point selects the disk before the
# machine is powered on again. An installer that reboots into what it wrote
# (the agent installer) would boot the media again, so for it nothing is
# selected: the boot order the domain declares, its own disk first and optical
# media second, lets an empty disk fall through to the media and a written disk
# take precedence at the next boot.
#
# The inputs are this entry point's argument spec, passed explicitly by the
# consuming role and never inherited from a shared fact.
- name: Power the machine off before it is booted
  bootwright.core.redfish_boot:
    endpoint: '{{ substrate_libvirt_machine_boot_endpoint }}'
    user: '{{ lookup("ansible.builtin.file", substrate_libvirt_machine_boot_user) }}'
    password: '{{ lookup("ansible.builtin.file", substrate_libvirt_machine_boot_password) }}'
    verify: '{{ substrate_libvirt_machine_boot_verify }}'
    operation: power-off
  no_log: true

- name: Select the inserted media for an installer that powers the machine off
  bootwright.core.redfish_boot:
    endpoint: '{{ substrate_libvirt_machine_boot_endpoint }}'
    user: '{{ lookup("ansible.builtin.file", substrate_libvirt_machine_boot_user) }}'
    password: '{{ lookup("ansible.builtin.file", substrate_libvirt_machine_boot_password) }}'
    verify: '{{ substrate_libvirt_machine_boot_verify }}'
    operation: boot
    target: Cd
  no_log: true
  when: substrate_libvirt_machine_boot_installer_powers_off | bool

- name: Power the machine on and poll it to running
  bootwright.core.redfish_boot:
    endpoint: '{{ substrate_libvirt_machine_boot_endpoint }}'
    user: '{{ lookup("ansible.builtin.file", substrate_libvirt_machine_boot_user) }}'
    password: '{{ lookup("ansible.builtin.file", substrate_libvirt_machine_boot_password) }}'
    verify: '{{ substrate_libvirt_machine_boot_verify }}'
    operation: power-on
  no_log: true
