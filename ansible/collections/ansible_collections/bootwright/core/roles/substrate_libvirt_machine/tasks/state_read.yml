---
- name: Drive state read through the shared Redfish adapter
  ansible.builtin.include_role:
    name: bootwright.core.substrate_machine
    tasks_from: redfish_state_read

- name: Publish the Redfish answer through this substrate
  ansible.builtin.set_fact:
    substrate_libvirt_machine_port_result: '{{ substrate_machine_redfish_port_result }}'
    substrate_libvirt_machine_port_refusal: '{{ substrate_machine_redfish_port_refusal }}'
  no_log: true
