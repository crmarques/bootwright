---
- name: Insert vSphere virtual media
  when: bootwright_vsphere_media_action == 'boot'
  block:
    - name: Resolve vSphere datastore upload target
      ansible.builtin.set_fact:
        bootwright_vsphere_media_datastore: "{{ bootwright_vsphere_media_fetch | regex_replace('^\\[(.+)\\] .*$', '\\1') }}"
        bootwright_vsphere_media_datastore_path: "{{ bootwright_vsphere_media_fetch | regex_replace('^\\[.+\\] ', '') }}"
      changed_when: false

    - name: Validate vSphere datastore upload target
      ansible.builtin.assert:
        that:
          - bootwright_vsphere_media_stage_path | length > 0
          - bootwright_vsphere_media_datastore | length > 0
          - bootwright_vsphere_media_datastore_path | length > 0
          - bootwright_vsphere_media_datastore != bootwright_vsphere_media_fetch
        fail_msg: >-
          vSphere virtual media fetchUrl must carry a "[datastore] path"
          target, got {{ bootwright_vsphere_media_fetch }}.

    - name: Confirm staged vSphere media exists
      ansible.builtin.stat:
        path: "{{ bootwright_vsphere_media_stage_path }}"
      register: bootwright_vsphere_media_stage_stat

    - name: Assert staged vSphere media exists
      ansible.builtin.assert:
        that:
          - bootwright_vsphere_media_stage_stat.stat.exists | default(false)
        fail_msg: >-
          Staged install media {{ bootwright_vsphere_media_stage_path }} is
          missing; the boot driver or OS installer must stage it before the
          vSphere media role uploads it.

    - name: Probe previously recorded vSphere virtual media
      ansible.builtin.stat:
        path: "{{ bootwright_ownership_dir }}/resources/vsphere-vmedia/{{ bootwright_vsphere_media_record_name }}.json"
      register: bootwright_vsphere_media_previous_record_stat
      failed_when: false

    - name: Require a safe vSphere virtual media ownership record path before replacement
      ansible.builtin.assert:
        that:
          - bootwright_vsphere_media_previous_record_stat.stat.exists is defined
          - >-
            not (bootwright_vsphere_media_previous_record_stat.stat.exists | default(false) | bool)
            or (
              bootwright_vsphere_media_previous_record_stat.stat.isreg is defined
              and bootwright_vsphere_media_previous_record_stat.stat.isreg | bool
              and bootwright_vsphere_media_previous_record_stat.stat.islnk is defined
              and not (bootwright_vsphere_media_previous_record_stat.stat.islnk | bool)
            )
          - >-
            (bootwright_vsphere_media_previous_record_stat.stat.exists | default(false) | bool)
            or not (bootwright_vsphere_media_previous_record_stat.stat.islnk | default(false) | bool)
        fail_msg: >-
          Refusing to inspect or replace vSphere virtual media for
          {{ bootwright_vsphere_media_record_name }} because its ownership-record
          path could not be proven absent or a regular non-symlink file. Restore
          safe record-store access and exact trusted evidence, then retry the
          exact invocation `{{ bootwright_mutating_invocation }}`. No apply mode
          or authorization permits an unproven record path.

    - name: Read previously recorded vSphere virtual media
      ansible.builtin.slurp:
        src: "{{ bootwright_ownership_dir }}/resources/vsphere-vmedia/{{ bootwright_vsphere_media_record_name }}.json"
      register: bootwright_vsphere_media_previous_record_raw
      failed_when: false
      when: bootwright_vsphere_media_previous_record_stat.stat.exists | default(false)

    - name: Require readable vSphere virtual media ownership evidence before replacement
      ansible.builtin.assert:
        that:
          - bootwright_vsphere_media_previous_record_raw.content is defined
        fail_msg: >-
          Refusing to replace vSphere virtual media for
          {{ bootwright_vsphere_media_record_name }} because its regular ownership
          record could not be read. Restore record-store access or the exact
          record from trusted evidence, then retry the exact invocation
          `{{ bootwright_mutating_invocation }}`. No apply mode or authorization
          treats an unreadable record as absent.
      when: bootwright_vsphere_media_previous_record_stat.stat.exists | default(false)

    - name: Decode previously recorded vSphere virtual media
      block:
        - name: Parse previously recorded vSphere virtual media
          ansible.builtin.set_fact:
            bootwright_vsphere_media_previous_record: "{{ bootwright_vsphere_media_previous_record_raw.content | b64decode | from_json }}"
          changed_when: false
      rescue:
        - name: Refuse malformed vSphere virtual media ownership evidence
          ansible.builtin.fail:
            msg: >-
              Refusing to replace vSphere virtual media for
              {{ bootwright_vsphere_media_record_name }} because its ownership
              record is not readable JSON. Restore the exact record from trusted
              evidence or prove and remove it manually, then retry the exact
              invocation `{{ bootwright_mutating_invocation }}`.
      when: bootwright_vsphere_media_previous_record_stat.stat.exists | default(false)

    - name: Require exact vSphere virtual media ownership before replacement
      ansible.builtin.assert:
        that:
          - >-
            bootwright_vsphere_media_previous_record
            | bootwright.core.bootwright_vsphere_vmedia_record_authorized(
                bootwright_clusters_dir | dirname | basename,
                bootwright_current_cluster.name,
                bootwright_component.name,
                bootwright_vsphere_media_record_name,
                bootwright_component.providerName,
                bootwright_vsphere_media.server,
                bootwright_vsphere_media.topology.datacenter,
                bootwright_vsphere_media_datastore,
                bootwright_vsphere_media_datastore_path,
                bootwright_vsphere_media_stage_path
              )
        fail_msg: >-
          Refusing to replace vSphere virtual media for
          {{ bootwright_vsphere_media_record_name }} because its ownership record
          does not exactly match the current ownership API, owner, context,
          provider, cluster, machine, vCenter placement, and authorized staging
          paths. Restore the exact record from trusted evidence or clean the old
          media under its original desired state, then retry the exact invocation
          `{{ bootwright_mutating_invocation }}`. No apply mode or authorization
          permits a foreign or path-ambiguous record.
      when: bootwright_vsphere_media_previous_record_stat.stat.exists | default(false)

    - name: Resolve superseded vSphere virtual media
      ansible.builtin.set_fact:
        bootwright_vsphere_media_superseded: >-
          {{
            (bootwright_vsphere_media_previous_record_stat.stat.exists | default(false))
            and ((bootwright_vsphere_media_previous_record.attributes.path | default('')) | length > 0)
            and ((bootwright_vsphere_media_previous_record.attributes.path | default('')) != bootwright_vsphere_media_datastore_path)
          }}
      changed_when: false

    - name: Delete superseded vSphere virtual media before releasing evidence
      when: bootwright_vsphere_media_superseded | bool
      block:
        - name: Delete superseded vSphere virtual media from the datastore
          community.vmware.vsphere_file:
            hostname: "{{ bootwright_vsphere_media.server }}"
            username: "{{ bootwright_vsphere_media_credentials.username }}"
            password: "{{ bootwright_vsphere_media_credentials.password }}"
            validate_certs: "{{ not (bootwright_vsphere_media.disableCertificateVerification | default(false) | bool) }}"
            datacenter: "{{ bootwright_vsphere_media_previous_record.attributes.datacenter }}"
            datastore: "{{ bootwright_vsphere_media_previous_record.attributes.datastore }}"
            path: "{{ bootwright_vsphere_media_previous_record.attributes.path }}"
            state: absent
          vars:
            ansible_python_interpreter: "{{ bootwright_vsphere_python }}"
          no_log: "{{ bootwright_no_log | default(true) | bool }}"
      rescue:
        - name: Refuse superseded vSphere virtual media evidence cleanup after datastore failure
          ansible.builtin.fail:
            msg: >-
              Refusing to delete local staging state or ownership for vSphere
              virtual media {{ bootwright_vsphere_media_record_name }} because
              vCenter did not remove its recorded datastore file. Restore vCenter
              access and permissions or remove the file safely, then retry the
              exact invocation `{{ bootwright_mutating_invocation }}`.

    - name: Remove superseded vSphere virtual media staging paths and record
      ansible.builtin.include_role:
        name: bootwright.core.ownership_record
        tasks_from: destroy_resource.yml
      vars:
        bootwright_ownership_record: "{{ bootwright_vsphere_media_previous_record }}"
        bootwright_vsphere_vmedia_teardown_verified: true
      when: bootwright_vsphere_media_superseded | bool

    - name: Resolve vSphere upload marker path
      ansible.builtin.set_fact:
        bootwright_vsphere_media_uploaded_marker_path: "{{ bootwright_vsphere_media_stage_path }}.uploaded-{{ (bootwright_vsphere_media.server ~ '|' ~ bootwright_vsphere_media_datastore) | hash('sha1') }}"
      changed_when: false

    - name: Probe uploaded vSphere virtual media marker
      ansible.builtin.stat:
        path: "{{ bootwright_vsphere_media_uploaded_marker_path }}"
      register: bootwright_vsphere_media_uploaded_marker
      when: bootwright_vsphere_media_upload_elected | bool

    - name: Resolve vSphere virtual media upload requirement
      ansible.builtin.set_fact:
        bootwright_vsphere_media_upload_required: >-
          {{
            (bootwright_vsphere_media_upload_elected | bool)
            and (
              not (bootwright_vsphere_media_uploaded_marker.stat.exists | default(false))
              or ((bootwright_vsphere_media_stage_stat.stat.mtime | default(0)) > (bootwright_vsphere_media_uploaded_marker.stat.mtime | default(0)))
            )
          }}
      changed_when: false

    - name: Upload vSphere virtual media to the datastore
      community.vmware.vsphere_copy:
        hostname: "{{ bootwright_vsphere_media.server }}"
        port: "{{ bootwright_vsphere_media.port | default(443) }}"
        username: "{{ bootwright_vsphere_media_credentials.username }}"
        password: "{{ bootwright_vsphere_media_credentials.password }}"
        validate_certs: "{{ not (bootwright_vsphere_media.disableCertificateVerification | default(false) | bool) }}"
        datacenter: "{{ bootwright_vsphere_media.topology.datacenter }}"
        datastore: "{{ bootwright_vsphere_media_datastore }}"
        src: "{{ bootwright_vsphere_media_stage_path }}"
        path: "{{ bootwright_vsphere_media_datastore_path }}"
        timeout: "{{ bootwright_vsphere_media_upload_timeout }}"
      vars:
        ansible_python_interpreter: "{{ bootwright_vsphere_python }}"
      throttle: 1
      no_log: "{{ bootwright_no_log | default(true) | bool }}"
      when: bootwright_vsphere_media_upload_required | bool

    - name: Mark vSphere virtual media uploaded
      ansible.builtin.copy:
        dest: "{{ bootwright_vsphere_media_uploaded_marker_path }}"
        content: "[{{ bootwright_vsphere_media_datastore }}] {{ bootwright_vsphere_media_datastore_path }}\n"
        owner: root
        group: root
        mode: "0600"
      when: bootwright_vsphere_media_upload_required | bool

    - name: Wait for the elected uploader to publish the vSphere datastore media
      ansible.builtin.wait_for:
        path: "{{ bootwright_vsphere_media_uploaded_marker_path }}"
        state: present
        timeout: "{{ bootwright_vsphere_media_upload_wait_timeout }}"
        sleep: "{{ bootwright_vsphere_media_upload_wait_interval_seconds }}"
      when: not (bootwright_vsphere_media_upload_elected | bool)

    - name: Probe the published vSphere datastore media marker
      ansible.builtin.stat:
        path: "{{ bootwright_vsphere_media_uploaded_marker_path }}"
      register: bootwright_vsphere_media_published_marker
      when: not (bootwright_vsphere_media_upload_elected | bool)

    - name: Assert the published vSphere datastore media is not older than the staged media
      ansible.builtin.assert:
        that:
          - bootwright_vsphere_media_published_marker.stat.exists | default(false)
          - (bootwright_vsphere_media_published_marker.stat.mtime | default(0)) >= (bootwright_vsphere_media_stage_stat.stat.mtime | default(0))
        fail_msg: >-
          The upload marker {{ bootwright_vsphere_media_uploaded_marker_path }} for
          [{{ bootwright_vsphere_media_datastore }}] {{ bootwright_vsphere_media_datastore_path }}
          is older than the staged media {{ bootwright_vsphere_media_stage_path }}, so the
          datastore copy this machine would boot is stale. The machine elected to upload
          for this datastore is re-uploading or failed; re-run the boot stage once it
          finishes instead of attaching superseded media.
      when: not (bootwright_vsphere_media_upload_elected | bool)

    - name: Record vSphere virtual media ownership
      ansible.builtin.include_role:
        name: bootwright.core.ownership_record
        tasks_from: resource.yml
      vars:
        bootwright_ownership_kind: vsphere-vmedia
        bootwright_ownership_name: "{{ bootwright_vsphere_media_record_name }}"
        bootwright_ownership_fields:
          provider: "{{ bootwright_component.providerName }}"
          cluster: "{{ bootwright_current_cluster.name }}"
          machine: "{{ bootwright_component.name }}"
          paths:
            - "{{ bootwright_vsphere_media_stage_path | dirname }}"
          attributes:
            server: "{{ bootwright_vsphere_media.server }}"
            datacenter: "{{ bootwright_vsphere_media.topology.datacenter }}"
            datastore: "{{ bootwright_vsphere_media_datastore }}"
            path: "{{ bootwright_vsphere_media_datastore_path }}"

    - name: Attach vSphere virtual media to the machine CD-ROM
      community.vmware.vmware_guest:
        hostname: "{{ bootwright_vsphere_media.server }}"
        port: "{{ bootwright_vsphere_media.port | default(443) }}"
        username: "{{ bootwright_vsphere_media_credentials.username }}"
        password: "{{ bootwright_vsphere_media_credentials.password }}"
        validate_certs: "{{ not (bootwright_vsphere_media.disableCertificateVerification | default(false) | bool) }}"
        datacenter: "{{ bootwright_vsphere_media.topology.datacenter }}"
        folder: "{{ bootwright_vsphere_media.topology.folder | default(omit, true) }}"
        name: "{{ bootwright_vsphere_media_vm_name }}"
        cdrom:
          - controller_type: sata
            controller_number: 0
            unit_number: 0
            type: iso
            iso_path: "[{{ bootwright_vsphere_media_datastore }}] {{ bootwright_vsphere_media_datastore_path }}"
      vars:
        ansible_python_interpreter: "{{ bootwright_vsphere_python }}"
      no_log: "{{ bootwright_no_log | default(true) | bool }}"

    - name: Record vSphere virtual media attachment
      ansible.builtin.set_fact:
        bootwright_vmedia_backend_attached: true
        bootwright_vmedia_backend: vsphere-datastore
        bootwright_vmedia_backend_image: "{{ bootwright_vsphere_media_fetch }}"
        bootwright_vmedia_backend_image_name: "{{ bootwright_vsphere_media_stage_path | basename }}"
      changed_when: false
      no_log: "{{ bootwright_no_log | default(true) | bool }}"
