---
- name: Resolve vSphere virtual media action
  ansible.builtin.set_fact:
    bootwright_vsphere_media_action: "{{ bootwright_redfish_action_effective | default('boot') }}"
  changed_when: false

- name: Validate vSphere virtual media action
  ansible.builtin.assert:
    that:
      - bootwright_vsphere_media_action in ['boot', 'cleanup', 'cleanup_persistent']
    fail_msg: "Unsupported vSphere virtual media action {{ bootwright_vsphere_media_action }}"

- name: Resolve vSphere virtual media inputs
  ansible.builtin.set_fact:
    bootwright_vsphere_media: "{{ bootwright_component.vsphere | default({}) }}"
    bootwright_vsphere_media_vm_name: "{{ bootwright_current_cluster.name }}-{{ bootwright_component.name }}"
    bootwright_vsphere_media_record_name: "{{ bootwright_current_cluster.name }}-{{ bootwright_component.name }}"
    bootwright_vsphere_media_stage_path: "{{ bootwright_component.boot.agentIso.stagePath | default('') }}"
    bootwright_vsphere_media_fetch: "{{ bootwright_component.boot.agentIso.fetchUrl | default('') }}"
  changed_when: false

- name: Validate vSphere virtual media inputs
  ansible.builtin.assert:
    that:
      - bootwright_vsphere_media is mapping
      - bootwright_vsphere_media.server | default('') | length > 0
      - bootwright_vsphere_media.credentialsPath | default('') | length > 0
      - bootwright_vsphere_media.topology.datacenter | default('') | length > 0
    fail_msg: >-
      vSphere virtual media for {{ bootwright_current_cluster.name }}/{{ bootwright_component.name }}
      is missing vCenter placement or credentials on bootwright_component.vsphere.

- name: Load vCenter credentials
  ansible.builtin.include_role:
    name: bootwright.core.helper_credentials
    tasks_from: load.yml
  vars:
    bootwright_creds_path: "{{ bootwright_vsphere_media.credentialsPath }}"
    bootwright_creds_var: bootwright_vsphere_media_credentials
    bootwright_creds_label: "vCenter credentials for {{ bootwright_vsphere_media.server }}"

- name: Insert vSphere virtual media
  when: bootwright_vsphere_media_action == 'boot'
  block:
    - name: Resolve vSphere datastore upload target
      ansible.builtin.set_fact:
        bootwright_vsphere_media_datastore: "{{ bootwright_vsphere_media_fetch | regex_replace('^\\[(.+)\\] .*$', '\\1') }}"
        bootwright_vsphere_media_datastore_path: "{{ bootwright_vsphere_media_fetch | regex_replace('^\\[.+\\] ', '') }}"
      changed_when: false

    - name: Validate vSphere datastore upload target
      ansible.builtin.assert:
        that:
          - bootwright_vsphere_media_stage_path | length > 0
          - bootwright_vsphere_media_datastore | length > 0
          - bootwright_vsphere_media_datastore_path | length > 0
          - bootwright_vsphere_media_datastore != bootwright_vsphere_media_fetch
        fail_msg: >-
          vSphere virtual media fetchUrl must carry a "[datastore] path"
          target, got {{ bootwright_vsphere_media_fetch }}.

    - name: Confirm staged vSphere media exists
      ansible.builtin.stat:
        path: "{{ bootwright_vsphere_media_stage_path }}"
      register: bootwright_vsphere_media_stage_stat

    - name: Assert staged vSphere media exists
      ansible.builtin.assert:
        that:
          - bootwright_vsphere_media_stage_stat.stat.exists | default(false)
        fail_msg: >-
          Staged install media {{ bootwright_vsphere_media_stage_path }} is
          missing; the boot driver or OS installer must stage it before the
          vSphere media role uploads it.

    - name: Upload vSphere virtual media to the datastore
      community.vmware.vsphere_copy:
        hostname: "{{ bootwright_vsphere_media.server }}"
        port: "{{ bootwright_vsphere_media.port | default(443) }}"
        username: "{{ bootwright_vsphere_media_credentials.username }}"
        password: "{{ bootwright_vsphere_media_credentials.password }}"
        validate_certs: "{{ not (bootwright_vsphere_media.disableCertificateVerification | default(false) | bool) }}"
        datacenter: "{{ bootwright_vsphere_media.topology.datacenter }}"
        datastore: "{{ bootwright_vsphere_media_datastore }}"
        src: "{{ bootwright_vsphere_media_stage_path }}"
        path: "{{ bootwright_vsphere_media_datastore_path }}"
        timeout: "{{ bootwright_vsphere_media_upload_timeout }}"
      vars:
        ansible_python_interpreter: "{{ bootwright_vsphere_python }}"
      no_log: true

    # The uploaded path is recorded before the attach so cleanup and machine
    # destroy can always read it back — datastore media must never outlive
    # the machine even when a later step renames or loses the live handle.
    - name: Record vSphere virtual media ownership
      ansible.builtin.include_role:
        name: bootwright.core.ownership_record
        tasks_from: resource.yml
      vars:
        bootwright_ownership_kind: vsphere-vmedia
        bootwright_ownership_name: "{{ bootwright_vsphere_media_record_name }}"
        bootwright_ownership_fields:
          provider: "{{ bootwright_component.providerName }}"
          cluster: "{{ bootwright_current_cluster.name }}"
          machine: "{{ bootwright_component.name }}"
          paths:
            - "{{ bootwright_vsphere_media_stage_path | dirname }}"
          attributes:
            server: "{{ bootwright_vsphere_media.server }}"
            datacenter: "{{ bootwright_vsphere_media.topology.datacenter }}"
            datastore: "{{ bootwright_vsphere_media_datastore }}"
            path: "{{ bootwright_vsphere_media_datastore_path }}"

    - name: Attach vSphere virtual media to the machine CD-ROM
      community.vmware.vmware_guest:
        hostname: "{{ bootwright_vsphere_media.server }}"
        port: "{{ bootwright_vsphere_media.port | default(443) }}"
        username: "{{ bootwright_vsphere_media_credentials.username }}"
        password: "{{ bootwright_vsphere_media_credentials.password }}"
        validate_certs: "{{ not (bootwright_vsphere_media.disableCertificateVerification | default(false) | bool) }}"
        datacenter: "{{ bootwright_vsphere_media.topology.datacenter }}"
        folder: "{{ bootwright_vsphere_media.topology.folder | default(omit, true) }}"
        name: "{{ bootwright_vsphere_media_vm_name }}"
        cdrom:
          - controller_type: sata
            controller_number: 0
            unit_number: 0
            type: iso
            iso_path: "[{{ bootwright_vsphere_media_datastore }}] {{ bootwright_vsphere_media_datastore_path }}"
      vars:
        ansible_python_interpreter: "{{ bootwright_vsphere_python }}"
      no_log: true

    - name: Record vSphere virtual media attachment
      ansible.builtin.set_fact:
        bootwright_redfish_vmedia_backend_attached: true
        bootwright_redfish_vmedia_backend: vsphere-datastore
        bootwright_redfish_vmedia_backend_image: "{{ bootwright_vsphere_media_fetch }}"
        bootwright_redfish_vmedia_backend_image_name: "{{ bootwright_vsphere_media_stage_path | basename }}"
      changed_when: false
      no_log: true

# vSphere device config has no separate persistent layer and the substrate
# enforces disk-first boot order, so an attached ISO cannot re-enter the
# installer after the disk becomes bootable: cleanup_persistent is a no-op
# and full cleanup ejects the CD and removes the uploaded media.
- name: Clean up vSphere virtual media
  when: bootwright_vsphere_media_action == 'cleanup'
  block:
    - name: Eject vSphere virtual media
      community.vmware.vmware_guest:
        hostname: "{{ bootwright_vsphere_media.server }}"
        port: "{{ bootwright_vsphere_media.port | default(443) }}"
        username: "{{ bootwright_vsphere_media_credentials.username }}"
        password: "{{ bootwright_vsphere_media_credentials.password }}"
        validate_certs: "{{ not (bootwright_vsphere_media.disableCertificateVerification | default(false) | bool) }}"
        datacenter: "{{ bootwright_vsphere_media.topology.datacenter }}"
        folder: "{{ bootwright_vsphere_media.topology.folder | default(omit, true) }}"
        name: "{{ bootwright_vsphere_media_vm_name }}"
        cdrom:
          - controller_type: sata
            controller_number: 0
            unit_number: 0
            type: none
      vars:
        ansible_python_interpreter: "{{ bootwright_vsphere_python }}"
      no_log: true

    - name: Probe recorded vSphere virtual media
      ansible.builtin.stat:
        path: "{{ bootwright_ownership_dir }}/resources/vsphere-vmedia/{{ bootwright_vsphere_media_record_name }}.json"
      register: bootwright_vsphere_media_record_stat

    - name: Read recorded vSphere virtual media
      ansible.builtin.slurp:
        src: "{{ bootwright_ownership_dir }}/resources/vsphere-vmedia/{{ bootwright_vsphere_media_record_name }}.json"
      register: bootwright_vsphere_media_record_raw
      when: bootwright_vsphere_media_record_stat.stat.exists | default(false)

    - name: Parse recorded vSphere virtual media
      ansible.builtin.set_fact:
        bootwright_vsphere_media_record: "{{ bootwright_vsphere_media_record_raw.content | b64decode | from_json }}"
      changed_when: false
      when: bootwright_vsphere_media_record_stat.stat.exists | default(false)

    - name: Delete uploaded vSphere virtual media from the datastore
      community.vmware.vsphere_file:
        host: "{{ bootwright_vsphere_media.server }}"
        username: "{{ bootwright_vsphere_media_credentials.username }}"
        password: "{{ bootwright_vsphere_media_credentials.password }}"
        validate_certs: "{{ not (bootwright_vsphere_media.disableCertificateVerification | default(false) | bool) }}"
        datacenter: "{{ bootwright_vsphere_media_record.attributes.datacenter | default(bootwright_vsphere_media.topology.datacenter) }}"
        datastore: "{{ bootwright_vsphere_media_record.attributes.datastore | default('') }}"
        path: "{{ bootwright_vsphere_media_record.attributes.path | default('') }}"
        state: absent
      vars:
        ansible_python_interpreter: "{{ bootwright_vsphere_python }}"
      failed_when: false
      no_log: true
      when:
        - bootwright_vsphere_media_record_stat.stat.exists | default(false)
        - bootwright_vsphere_media_record.attributes.datastore | default('') | length > 0
        - bootwright_vsphere_media_record.attributes.path | default('') | length > 0

    - name: Remove recorded vSphere virtual media staging paths and record
      ansible.builtin.include_role:
        name: bootwright.core.ownership_record
        tasks_from: destroy_resource.yml
      vars:
        bootwright_ownership_record: "{{ bootwright_vsphere_media_record }}"
      when: bootwright_vsphere_media_record_stat.stat.exists | default(false)
