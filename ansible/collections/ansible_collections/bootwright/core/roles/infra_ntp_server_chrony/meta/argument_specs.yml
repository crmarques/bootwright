argument_specs:
  apply:
    short_description: Realize one frozen managed time service.
    options: &request
      bootwright_ntp_server_request:
        type: dict
        required: true
        options:
          bindAddress:
            type: str
            required: true
          clients:
            type: list
            elements: str
            required: false
          contentRoot:
            type: str
            required: true
          egress:
            type: dict
            required: true
          endpoints:
            type: list
            elements: dict
            required: true
          forwarders:
            type: list
            elements: str
            required: false
          identity:
            type: dict
            required: true
          image:
            type: str
            required: true
          ingressHosts:
            type: list
            elements: str
            required: false
          kind:
            type: str
            required: true
          placement:
            type: dict
            required: true
          port:
            type: int
            required: true
          records:
            type: list
            elements: dict
            required: false
          sources:
            type: list
            elements: str
            required: false
          unit:
            type: str
            required: true
          version:
            type: str
            required: true
            choices: [ntp-server-chrony-v2]
      bootwright_ntp_server_material:
        type: dict
        required: true

  observe:
    short_description: Observe one frozen managed time service without changing it.
    options: *request

  destroy:
    short_description: Remove one frozen managed time service and prove its absence.
    options: *request
