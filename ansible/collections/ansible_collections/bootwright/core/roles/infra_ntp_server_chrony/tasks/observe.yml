---
- name: Complete the qualified execution handoff
  bootwright.core.infra_service_protocol:
    phase: loaded
  no_log: true

- name: Observe the managed service without changing it
  bootwright.core.infra_service_inspect:
    request: '{{ bootwright_ntp_server_request }}'
    readiness: true
    attempts: 1
  register: infra_ntp_server_chrony_observation

- name: Publish bounded managed service observation evidence
  bootwright.core.infra_service_protocol:
    phase: completed
    observed: true
    outcome: unchanged
    digest: '{{ bootwright_ntp_server_digest }}'
    observation: '{{ infra_ntp_server_chrony_observation.observation }}'
    answers: '{{ infra_ntp_server_chrony_observation.answers }}'
    removed: >-
      {{ not infra_ntp_server_chrony_observation.observation.unit
         and not infra_ntp_server_chrony_observation.observation.containerPresent
         and not infra_ntp_server_chrony_observation.observation.contentRoot }}
  no_log: true
