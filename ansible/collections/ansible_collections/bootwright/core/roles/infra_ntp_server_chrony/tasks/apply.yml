---
- name: Validate the frozen managed service request
  ansible.builtin.assert:
    that:
      - bootwright_ntp_server_request.version == 'ntp-server-chrony-v1'
      - bootwright_ntp_server_request.unit is string
      - bootwright_ntp_server_request.contentRoot.startswith('/var/lib/bootwright-services/')
      - bootwright_ntp_server_request.image is search('@sha256:[0-9a-f]{64}$')
      - bootwright_ntp_server_request.port | int > 0
      - bootwright_ntp_server_digest is match('[0-9a-f]{64}')
    quiet: true
  no_log: true

- name: Complete the qualified execution handoff
  bootwright.core.infra_service_protocol:
    phase: loaded
  no_log: true

- name: Report image acquisition
  bootwright.core.infra_service_protocol:
    phase: group
    group: pull-image
    status: running
  no_log: true

- name: Check whether the pinned service image is already present
  ansible.builtin.command:
    argv:
      - /usr/bin/podman
      - image
      - exists
      - '{{ bootwright_ntp_server_request.image }}'
  register: infra_ntp_server_chrony_image_present
  failed_when: false
  changed_when: false

- name: Acquire the pinned service image
  ansible.builtin.command:
    argv:
      - /usr/bin/podman
      - pull
      - '{{ bootwright_ntp_server_request.image }}'
  environment:
    HTTP_PROXY: '{{ bootwright_ntp_server_request.egress.httpProxy | default("") }}'
    HTTPS_PROXY: '{{ bootwright_ntp_server_request.egress.httpsProxy | default("") }}'
    NO_PROXY: '{{ bootwright_ntp_server_request.egress.noProxy | default([]) | join(",") }}'
  register: infra_ntp_server_chrony_pull
  when: infra_ntp_server_chrony_image_present.rc != 0
  changed_when: infra_ntp_server_chrony_image_present.rc != 0

- name: Report image acquisition completion
  bootwright.core.infra_service_protocol:
    phase: group
    group: pull-image
    status: ok
  no_log: true

- name: Report configuration publication
  bootwright.core.infra_service_protocol:
    phase: group
    group: publish-configuration
    status: running
  no_log: true

- name: Create the owned service directories
  ansible.builtin.file:
    path: '{{ item }}'
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - '{{ bootwright_ntp_server_request.contentRoot }}'
    - '{{ infra_ntp_server_chrony_config_dir }}'
  register: infra_ntp_server_chrony_directories

- name: Publish the service configuration
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: '{{ infra_ntp_server_chrony_config_dir }}/chrony.conf'
    owner: root
    group: root
    mode: '0644'
  register: infra_ntp_server_chrony_configuration

- name: Publish the container unit definition
  ansible.builtin.template:
    src: unit.container.j2
    dest: '{{ infra_ntp_server_chrony_unit_path }}'
    owner: root
    group: root
    mode: '0644'
  register: infra_ntp_server_chrony_unit

- name: Reload the host service manager so the unit generator runs
  ansible.builtin.command:
    argv:
      - /usr/bin/systemctl
      - daemon-reload
  changed_when: false

- name: Report configuration publication completion
  bootwright.core.infra_service_protocol:
    phase: group
    group: publish-configuration
    status: ok
  no_log: true

- name: Report service start
  bootwright.core.infra_service_protocol:
    phase: group
    group: start-service
    status: running
  no_log: true

- name: Observe the service before starting it
  bootwright.core.infra_service_inspect:
    request: '{{ bootwright_ntp_server_request }}'
  register: infra_ntp_server_chrony_before

- name: Start the managed service
  ansible.builtin.command:
    argv:
      - /usr/bin/systemctl
      - start
      - '{{ infra_ntp_server_chrony_service }}'
  when: infra_ntp_server_chrony_before.observation.unit != 'active'
  changed_when: infra_ntp_server_chrony_before.observation.unit != 'active'

- name: Restart the managed service after a configuration change
  ansible.builtin.command:
    argv:
      - /usr/bin/systemctl
      - restart
      - '{{ infra_ntp_server_chrony_service }}'
  when:
    - infra_ntp_server_chrony_before.observation.unit == 'active'
    - infra_ntp_server_chrony_configuration is changed or infra_ntp_server_chrony_unit is changed
  changed_when: true

- name: Report service start completion
  bootwright.core.infra_service_protocol:
    phase: group
    group: start-service
    status: ok
  no_log: true

- name: Report readiness verification
  bootwright.core.infra_service_protocol:
    phase: group
    group: verify-readiness
    status: running
  no_log: true

- name: Prove the managed service answers on every declared address
  bootwright.core.infra_service_inspect:
    request: '{{ bootwright_ntp_server_request }}'
    readiness: true
  register: infra_ntp_server_chrony_after

- name: Refuse an unproved address
  ansible.builtin.assert:
    that:
      - infra_ntp_server_chrony_after.unproved | length == 0
    fail_msg: a declared managed service address did not answer within its readiness window
    quiet: true

- name: Report readiness completion
  bootwright.core.infra_service_protocol:
    phase: group
    group: verify-readiness
    status: ok
  no_log: true

- name: Publish bounded managed service completion evidence
  bootwright.core.infra_service_protocol:
    phase: completed
    outcome: >-
      {{ 'changed'
         if (infra_ntp_server_chrony_directories is changed
             or infra_ntp_server_chrony_configuration is changed
             or infra_ntp_server_chrony_unit is changed
             or infra_ntp_server_chrony_pull is changed
             or infra_ntp_server_chrony_before.observation.unit != 'active')
         else 'unchanged' }}
    digest: '{{ bootwright_ntp_server_digest }}'
    observation: '{{ infra_ntp_server_chrony_after.observation }}'
    answers: '{{ infra_ntp_server_chrony_after.answers }}'
  no_log: true
