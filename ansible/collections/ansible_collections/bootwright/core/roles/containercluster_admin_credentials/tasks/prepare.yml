---
- name: Validate the original credential target request
  ansible.builtin.assert:
    that:
      - bootwright_cluster_admin_request.version == 'cluster-install-agent-v1'
    quiet: true
  no_log: true

- name: Complete the qualified execution handoff
  bootwright.core.containercluster_admin_protocol:
    phase: loaded
  no_log: true

- name: Prove the console administrator credential
  bootwright.core.containercluster_admin_credentials:
    operation: prepare
    client: '{{ bootwright_cluster_admin_material.client }}'
    kubeconfig: '{{ bootwright_cluster_admin_material.kubeconfig }}'
    output: "{{ bootwright_cluster_admin_output.guard }}"
  register: containercluster_admin_credentials_result
  no_log: true
  diff: false

- name: Publish bounded credential proof
  bootwright.core.containercluster_admin_protocol:
    phase: completed
    digest: '{{ bootwright_cluster_admin_digest }}'
    outcome: unchanged
    proved: '{{ containercluster_admin_credentials_result.proved }}'
  no_log: true
