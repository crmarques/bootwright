    options:
      bootwright_cluster_admin_request:
        type: dict
        required: true
        options:
          version:
            type: str
            required: true
            choices:
              - cluster-install-agent-v1
      bootwright_cluster_admin_material:
        type: dict
        required: true
      bootwright_cluster_admin_digest:
        type: str
        required: true
