---
# Derived from the frozen request only. Nothing here is authored by desired
# state, and no value selects an executable, a role or a task file.
containercluster_install_agent_work: '{{ bootwright_cluster_install_request.workRoot }}'
containercluster_install_agent_area: "{{ ['clusters', bootwright_cluster_install_request.identity.cluster] }}"
# The copy of the installer's kubeconfig this installation keeps while that file
# is whole (the inspection's KEPT): every read of the cluster and the access
# offered for custody go through it, never through the file the installer
# rewrites in place.
containercluster_install_agent_kubeconfig: '{{ containercluster_install_agent_work }}/.bootwright-kubeconfig'
containercluster_install_agent_installer: '{{ bootwright_cluster_install_material.openshiftinstall }}'
containercluster_install_agent_client: '{{ bootwright_cluster_install_material.oc }}'
# An observation the capability makes for a removal's resolution, which reads
# only the media each node presents: the cluster the removal leaves running is
# not read.
containercluster_install_agent_observes_removal: >-
  {{ bootwright_cluster_install_material.observes | default('') == 'removal' }}
# A removal whose node Machines stay: it ejects only the image this cluster
# published, which a node's read proved its own, and restores nothing
# controller-wide, because a kept controller's other media and settings are
# not this removal's to change.
containercluster_install_agent_keeps_hosts: >-
  {{ bootwright_cluster_install_material.keeps | default('') == 'hosts' }}
containercluster_install_agent_node_ejects: >-
  {{ not (containercluster_install_agent_keeps_hosts | bool)
     or (containercluster_install_agent_node_identity | default({})).own | default(false) | bool }}
# The nodes whose frozen request declares labels or taints, which the request
# omits on a node that declares neither, and what a placement read that did
# not run proves of them: nothing.
containercluster_install_agent_placed_nodes: >-
  {{ (bootwright_cluster_install_request.nodes | selectattr('labels', 'defined') | map(attribute='name') | list)
     | union(bootwright_cluster_install_request.nodes | selectattr('taints', 'defined') | map(attribute='name') | list) }}
containercluster_install_agent_placement_read: >-
  {{ containercluster_install_agent_placement
     if (containercluster_install_agent_placement | default({})).unplaced is defined
     else {'placement': [], 'unplaced': containercluster_install_agent_placed_nodes} }}
# A cluster already answering with the identity this operation's own installer
# recorded, at the declared release and holding every declared node, is
# installed. The decision is taken once, before anything is booted, and kept in
# its own fact: reading the cluster again afterwards would report an
# installation this attempt had just performed as one it found.

containercluster_install_agent_boot_spent_hint: >-
  the boot phase's budget of
  {{ bootwright_cluster_install_request.budgets.bootSeconds }} seconds was spent
  before every node was booted, so the boot was stopped there. A node already
  booted keeps running from this cluster's image, and a repeated apply leaves it
  as it is and boots the others; a budget spent again points at a management
  controller slow to insert the image or to power its machine on.
containercluster_install_agent_reach_hint: >-
  the boot phase's budget of
  {{ bootwright_cluster_install_request.budgets.bootSeconds }} seconds was spent
  after every node was booted, before each machine named here answered: it did
  not boot this cluster's image, or the image found no network configuration
  for the hardware address it booted with. A repeated apply leaves a node that
  is powered on with this cluster's image inserted as it is rather than booting
  it again, so it fails here the same way until that cause is corrected.
