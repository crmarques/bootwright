argument_specs:
  apply:
    short_description: Boot one cluster's nodes and wait for it to install.
    options: &request
      bootwright_cluster_install_request:
        type: dict
        required: true
        options:
          budgets:
            type: dict
            required: true
            options:
              bootSeconds:
                type: int
                required: true
              bootstrapSeconds:
                type: int
                required: true
              installSeconds:
                type: int
                required: true
          endpoints:
            type: list
            elements: dict
            required: true
          identity:
            type: dict
            required: true
          image:
            type: dict
            required: true
          nodes:
            type: list
            elements: dict
            required: true
          placement:
            type: dict
            required: true
          release:
            type: dict
            required: true
          tool:
            type: dict
            required: true
          version:
            type: str
            required: true
            choices: [cluster-install-agent-v3]
          workRoot:
            type: str
            required: true
      bootwright_cluster_install_material:
        type: dict
        required: true
      bootwright_cluster_install_output:
        type: dict
        required: false

  observe:
    short_description: Observe one frozen cluster installation without changing it.
    options: *request

  destroy:
    short_description: Release the boot media one cluster installed from.
    options: *request
