---
# One installer wait, bounded by its phase's budget in wall-clock time. The
# inspection runs every attempt under timeout with what that budget has left,
# re-invokes the installer after each give-up it can resume from, puts the kept
# copy of the installer's kubeconfig back before each attempt when the
# installer's own file no longer parses, and classifies the last result
# (plugins/module_utils/containercluster_install_wait.py). After a failed
# bootstrap stall, native timeout or spent budget it reads once which declared
# nodes registered, with the watcher token it keeps private. A later wait of
# the same apply reads whether an earlier one restored the kubeconfig from
# this task's own last result.
- name: Wait for the installer to report this milestone while the budget lasts
  bootwright.core.containercluster_install_inspect:
    request: '{{ bootwright_cluster_install_request }}'
    wait: '{{ containercluster_install_agent_milestone }}'
    budget: '{{ containercluster_install_agent_budget }}'
    installer: '{{ containercluster_install_agent_installer }}'
    identity: '{{ containercluster_install_agent_before.observation.identity }}'
    restored: '{{ (containercluster_install_agent_wait | default({})).restored | default(false) }}'
  register: containercluster_install_agent_wait
  no_log: true

- name: Report why this milestone was never reached
  ansible.builtin.fail:
    msg: '{{ containercluster_install_agent_wait.message }}'
  when: containercluster_install_agent_wait.outcome != 'reached'
