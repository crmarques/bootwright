---
# The media stays inserted while the installation runs, because a live agent
# image is still read after a node answers on the network. It is released only
# once the installation has completed, and the node's controller is then
# pointed at its installed disk through the substrate that realized it, which
# powers nothing on: the node is running the cluster. That dispatch ends in a
# terminal fail for a substrate with neither entry point.
- name: Eject through the selected substrate machine port
  ansible.builtin.include_tasks: port.yml
  vars:
    containercluster_install_agent_port_operation: media_eject

- name: Retain the media release answer
  ansible.builtin.set_fact:
    containercluster_install_agent_released: '{{ containercluster_install_agent_port_result }}'
  no_log: true

# ansible-core keeps nothing of a failure under no_log but that it failed, so
# the controller's own refusal is reported here, where no credential is.
- name: Stop at an eject the management controller did not complete
  ansible.builtin.assert:
    that:
      - containercluster_install_agent_released.msg is not defined
    fail_msg: >-
      ejecting the media Machine {{ containercluster_install_agent_node.machine }} installed from
      failed:
      {{ (containercluster_install_agent_released.msg | default('') | string | bootwright.core.printable)[:512] }}
    quiet: true

- name: Retire the private token after its node released the image
  bootwright.core.containercluster_media_token:
    request: '{{ bootwright_cluster_install_request }}'
    source: '{{ containercluster_install_agent_before.observation.url }}'
    image: >-
      {{ (containercluster_install_agent_insert_tokens | default({})).get(containercluster_install_agent_node.machine,
         containercluster_install_agent_controllers.results[containercluster_install_agent_index].media | default('')) }}
    operation: remove
  when: containercluster_install_agent_before.observation.url | default('') | length > 0
  no_log: true

- name: Point the node at its installed disk through its substrate
  ansible.builtin.include_role:
    name: bootwright.core.substrate_machine
    tasks_from: boot_disk
  vars:
    bootwright_machine_arm: '{{ containercluster_install_agent_node.substrate }}'
    bootwright_machine_port:
      endpoint: '{{ containercluster_install_agent_node.controller.endpoint }}'
      verify: '{{ containercluster_install_agent_node.controller.tlsVerify }}'
      ca: '{{ containercluster_install_agent_ca }}'
      user: '{{ containercluster_install_agent_user }}'
      password: '{{ containercluster_install_agent_password }}'
      power_on: false
