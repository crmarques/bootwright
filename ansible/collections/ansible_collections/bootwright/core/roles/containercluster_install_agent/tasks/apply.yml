---
- name: Validate the frozen installation request
  ansible.builtin.assert:
    that:
      - bootwright_cluster_install_request.version == 'cluster-install-agent-v2'
      - bootwright_cluster_install_request.workRoot.startswith('/var/lib/bootwright-clusters/')
      - bootwright_cluster_install_digest is match('[0-9a-f]{64}')
    quiet: true
  no_log: true

- name: Complete the qualified execution handoff
  bootwright.core.containercluster_install_protocol:
    phase: loaded
  no_log: true

# The boot task file binds each node's substrate only inside the boot loop,
# after the nodes before it were booted. A node no task file binds refuses
# here, before any node is touched, and the boot file keeps its own refusal as
# well.
- name: Refuse a node substrate this installation has no boot binding for
  ansible.builtin.assert:
    that:
      - containercluster_install_agent_node.substrate in ['libvirt', 'baremetal']
    fail_msg: >-
      node {{ containercluster_install_agent_node.name }} names substrate
      {{ containercluster_install_agent_node.substrate }}, which this cluster
      installation has no boot binding for, so no node's Machine was booted;
      plan the installation again with this release
    quiet: true
  loop: '{{ bootwright_cluster_install_request.nodes }}'
  loop_control:
    loop_var: containercluster_install_agent_node
    label: '{{ containercluster_install_agent_node.machine }}'

- name: Report name resolution
  bootwright.core.containercluster_install_protocol:
    phase: group
    group: verify-resolution
    status: running
  no_log: true

- name: Prove this host resolves every name the cluster answers at
  ansible.builtin.import_tasks: resolve.yml

- name: Report name resolution completion
  bootwright.core.containercluster_install_protocol:
    phase: group
    group: verify-resolution
    status: ok
  no_log: true

- name: Observe what this installation already recorded
  bootwright.core.containercluster_install_inspect:
    request: '{{ bootwright_cluster_install_request }}'
  register: containercluster_install_agent_before
  no_log: true

- name: Read the cluster and its nodes back
  ansible.builtin.import_tasks: state.yml

# Decided once, before any effect. Every later guard reads this fact rather
# than the live state, which this attempt is about to change. A cluster that
# answers with this build's identity, at the declared release and whole, may
# still be installing: an attempt interrupted during the installation wait
# leaves exactly that. Only the cluster's own report that its installation
# completed lets a retry skip the waits and release the media.
- name: Decide whether this cluster is already installed
  ansible.builtin.set_fact:
    containercluster_install_agent_settled: >-
      {{ (containercluster_install_agent_before.observation.identity | default('')) | length > 0
         and containercluster_install_agent_state.cluster == containercluster_install_agent_before.observation.identity
         and containercluster_install_agent_state.release == bootwright_cluster_install_request.release.version
         and containercluster_install_agent_state.missing | length == 0
         and containercluster_install_agent_state.completed is sameas true }}
  changed_when: false

- name: Report node boot
  bootwright.core.containercluster_install_protocol:
    phase: group
    group: boot-machines
    status: running
  no_log: true

# The work area the image was built in holds the state these nodes install from
# and the only administrator access to the cluster they install, and the media
# block's rebuild starts by discarding it. It is marked before any node is
# handed the image, and whether or not this attempt boots one, so a rebuild
# refuses from then on. The mark leaves only with the area itself, in the media
# block's inverse, which the removal plan starts after this block's own.
- name: Mark the work area as one this cluster's nodes boot from
  ansible.builtin.copy:
    content: ''
    dest: '{{ containercluster_install_agent_work }}/.bootwright-booted'
    owner: root
    group: root
    mode: '0600'

# One budget bounds booting every node, so its deadline is set once, here, and
# each node boots within what is left of it (boot.yml).
- name: Set the moment the boot phase's budget is spent
  ansible.builtin.set_fact:
    containercluster_install_agent_boot_deadline: >-
      {{ (((now(utc=true) - ('1970-01-01 00:00:00' | to_datetime)).total_seconds() | int)) + (bootwright_cluster_install_request.budgets.bootSeconds | int) }}
  changed_when: false
  when: not (containercluster_install_agent_settled | bool)

- name: Boot each node from the image its cluster published
  ansible.builtin.include_tasks: boot.yml
  loop: '{{ bootwright_cluster_install_request.nodes }}'
  loop_control:
    loop_var: containercluster_install_agent_node
    label: '{{ containercluster_install_agent_node.machine }}'
    index_var: containercluster_install_agent_index
  vars:
    containercluster_install_agent_url: >-
      {{ containercluster_install_agent_before.observation.url }}
    containercluster_install_agent_user: >-
      {{ bootwright_cluster_install_material['controllerUserNode' ~ containercluster_install_agent_index] }}
    containercluster_install_agent_password: >-
      {{ bootwright_cluster_install_material['controllerPasswordNode' ~ containercluster_install_agent_index] }}
  when: not (containercluster_install_agent_settled | bool)

- name: Report node boot completion
  bootwright.core.containercluster_install_protocol:
    phase: group
    group: boot-machines
    status: ok
  no_log: true

- name: Report the bootstrap wait
  bootwright.core.containercluster_install_protocol:
    phase: group
    group: wait-bootstrap
    status: running
  no_log: true

- name: Wait for the bootstrap control plane to hand over
  ansible.builtin.include_tasks: wait.yml
  vars:
    containercluster_install_agent_milestone: bootstrap-complete
    containercluster_install_agent_budget: >-
      {{ bootwright_cluster_install_request.budgets.bootstrapSeconds }}
  when: not (containercluster_install_agent_settled | bool)

- name: Report the bootstrap wait completion
  bootwright.core.containercluster_install_protocol:
    phase: group
    group: wait-bootstrap
    status: ok
  no_log: true

- name: Report the installation wait
  bootwright.core.containercluster_install_protocol:
    phase: group
    group: wait-install
    status: running
  no_log: true

- name: Wait for the cluster to finish installing
  ansible.builtin.include_tasks: wait.yml
  vars:
    containercluster_install_agent_milestone: install-complete
    containercluster_install_agent_budget: >-
      {{ bootwright_cluster_install_request.budgets.installSeconds }}
  when: not (containercluster_install_agent_settled | bool)

- name: Report the installation wait completion
  bootwright.core.containercluster_install_protocol:
    phase: group
    group: wait-install
    status: ok
  no_log: true

- name: Report media release
  bootwright.core.containercluster_install_protocol:
    phase: group
    group: release-media
    status: running
  no_log: true

- name: Release the media each node installed from
  ansible.builtin.include_tasks: release.yml
  loop: '{{ bootwright_cluster_install_request.nodes }}'
  loop_control:
    loop_var: containercluster_install_agent_node
    label: '{{ containercluster_install_agent_node.machine }}'
    index_var: containercluster_install_agent_index
  vars:
    containercluster_install_agent_user: >-
      {{ bootwright_cluster_install_material['controllerUserNode' ~ containercluster_install_agent_index] }}
    containercluster_install_agent_password: >-
      {{ bootwright_cluster_install_material['controllerPasswordNode' ~ containercluster_install_agent_index] }}

- name: Report media release completion
  bootwright.core.containercluster_install_protocol:
    phase: group
    group: release-media
    status: ok
  no_log: true

# The identity is the admin client certificate the image was built with, so
# the observation taken before any effect already names it, and the read back
# below answers with it only when the installed cluster accepts that
# certificate.
- name: Read the installed cluster and its nodes back
  ansible.builtin.import_tasks: state.yml

- name: Publish bounded installation completion evidence
  bootwright.core.containercluster_install_protocol:
    phase: completed
    outcome: >-
      {{ 'unchanged' if containercluster_install_agent_settled | bool else 'changed' }}
    digest: '{{ bootwright_cluster_install_digest }}'
    identity: '{{ containercluster_install_agent_before.observation.identity }}'
    state: '{{ containercluster_install_agent_state }}'
  no_log: true
