---
- name: Validate the frozen installation request
  ansible.builtin.assert:
    that:
      - bootwright_cluster_install_request.version == 'cluster-install-agent-v12'
      - bootwright_cluster_install_request.workRoot.startswith('/var/lib/bootwright-clusters/')
      - bootwright_cluster_install_digest is match('[0-9a-f]{64}')
    quiet: true
  no_log: true

- name: Complete the qualified execution handoff
  bootwright.core.containercluster_install_protocol:
    phase: loaded
  no_log: true

# The boot and release task files reach each node's substrate only inside
# their loops, after the nodes before it were booted or released. A node whose
# arm the substrate has no machine port for refuses here, before any node is
# touched; the substrate's own dispatch refuses it again at each entry point.
- name: Refuse a node substrate the substrate has no machine port for
  ansible.builtin.include_role:
    name: bootwright.core.substrate_machine
    tasks_from: admit
  vars:
    bootwright_machine_arm: '{{ containercluster_install_agent_node.substrate }}'
  loop: '{{ bootwright_cluster_install_request.nodes }}'
  loop_control:
    loop_var: containercluster_install_agent_node
    label: '{{ containercluster_install_agent_node.machine }}'

- name: Report name resolution
  bootwright.core.containercluster_install_protocol:
    phase: group
    group: verify-resolution
    status: running
  no_log: true

- name: Prove this host resolves every name the cluster answers at
  ansible.builtin.import_tasks: resolve.yml

- name: Report name resolution completion
  bootwright.core.containercluster_install_protocol:
    phase: group
    group: verify-resolution
    status: ok
  no_log: true

# Every read of the cluster goes through the copy of the installer's
# kubeconfig this installation keeps, which follows the installer's file only
# while that file is whole, within the inspection's bound and names the same
# identity. It is taken here, before any effect, so every later read of this
# attempt and of any resolution after it has one to go through.
- name: Keep the installer's kubeconfig while it is whole and observe what this installation already recorded
  bootwright.core.containercluster_install_inspect:
    request: '{{ bootwright_cluster_install_request }}'
    keep: true
  register: containercluster_install_agent_before
  no_log: true

# Without a kept copy naming this build's identity no read of the cluster can
# prove it, so booting a node would start an installation nothing could ever
# prove complete. This refuses before the first effect instead.
- name: Refuse an installation with no whole kubeconfig to read its cluster through
  ansible.builtin.fail:
    msg: >-
      the work area of cluster {{ bootwright_cluster_install_request.identity.cluster }}
      holds no whole administrator kubeconfig naming this installation's
      identity to read the cluster through: either the copy an earlier attempt
      kept names none, or none was kept and the installer's own file is
      missing, cut short by an interrupted write, larger than the 64 KiB the
      inspection reads, or not in the form the installer writes. Nothing was
      changed. Destroy the
      cluster's installation first: bootwright destroy --context
      {{ bootwright_cluster_install_request.identity.context }} ejects its
      media and discards the work area, and the apply after it builds the image
      afresh
  when: (containercluster_install_agent_before.observation.identity | default('')) | length == 0

- name: Read cluster state before the node phase
  ansible.builtin.import_tasks: cluster_state.yml
