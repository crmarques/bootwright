---
# Insert the image its own cluster published and boot the machine through the
# substrate that realized it. How a machine is proved and booted is that
# substrate's answer, so this composes its pre-boot and boot entry points and
# carries no rule that is true of only one of them. The boot entry point is
# told that this installer reboots into what it wrote rather than powering the
# machine off, so a substrate whose selection outlives a reboot selects
# nothing. The substrate's dispatch ends in a terminal fail for an arm it has
# no machine port for, and the proof's refusal comes before the media is
# inserted, rather than inserting it and booting nothing.
- name: Retain a missing boot image as a typed node refusal
  ansible.builtin.set_fact:
    containercluster_install_agent_lifecycle_refusal: media-missing
  when: containercluster_install_agent_url | length == 0

- name: Refuse to boot a node whose cluster published no image
  ansible.builtin.assert:
    that:
      - containercluster_install_agent_url | length > 0
    fail_msg: >-
      this cluster has published no boot image, so there is nothing for its
      nodes to boot; repeat the apply so its media block publishes one
    quiet: true

# A node already running and presenting the image this cluster published was
# booted from it by an earlier attempt, and may be installing now: an attempt
# stopped during boot or the bootstrap wait, before the API answers, leaves its
# nodes exactly so. The retry neither inserts media into it, which would swap
# the image a live installer is still reading, nor boots it, which on a
# controller that takes a one-time override would send the installer's own
# reboot back to the image; it only waits for it. The state read this decides
# from was taken before the first node was booted, in the same attempt.
- name: Boot a node not already running from this cluster's image
  when: >-
    not (containercluster_install_agent_node.machine in containercluster_install_agent_state.powered
         and containercluster_install_agent_node.machine in containercluster_install_agent_state.ownMedia)
  block:
    # The boot phase's deadline was set once, before the first node
    # (apply.yml), so each node boots within what is left of one budget rather
    # than a budget of its own, and a node skipped above takes none of it.
    - name: Refuse to boot a node once the boot phase's budget is spent
      ansible.builtin.fail:
        msg: >-
          {{ containercluster_install_agent_boot_spent_hint }} Machine
          {{ containercluster_install_agent_node.machine }} was not booted.
      when: (containercluster_install_agent_boot_deadline | int) <= (((now(utc=true) - ('1970-01-01 00:00:00' | to_datetime)).total_seconds() | int))

    # ansible-core's timeout keyword is templated as each task starts and is
    # inherited by the substrate's own tasks through this block, so every boot
    # step gets only what the phase has left, and the step still running at the
    # deadline fails there (playbook/base.py timeout, executor/task_executor.py).
    # The timeout ends the task, not its module's process: a Redfish request
    # already in flight finishes on its own, and the supervisor waits for it
    # before the run ends, so no retry overlaps it. A value of 0 would mean no
    # timeout at all, so the floor is one second. The clock is the epoch taken
    # from naive UTC, never now().timestamp(), which reads a naive value as
    # local time and jumps at a daylight-saving change.
    - name: Boot the node within what the boot phase's budget has left
      timeout: >-
        {{ [(containercluster_install_agent_boot_deadline | int)
            - (((now(utc=true) - ('1970-01-01 00:00:00' | to_datetime)).total_seconds() | int)), 1] | max }}
      block:
        # Each node is proved through its own substrate immediately before
        # anything is inserted into it: a machine the substrate created by its
        # controller answering with the machine off, and a physical one by its
        # declared NICs, the identity its Machine block pinned in this
        # operation, and its power off. A node that fails its proof is given
        # no media and is not booted.
        - name: Prove the exact node through its substrate before inserting media
          ansible.builtin.include_role:
            name: bootwright.core.substrate_machine
            tasks_from: pre_boot
          vars:
            bootwright_machine_arm: '{{ containercluster_install_agent_node.substrate }}'
            bootwright_machine_port:
              endpoint: '{{ containercluster_install_agent_node.controller.endpoint }}'
              verify: '{{ containercluster_install_agent_node.controller.tlsVerify }}'
              ca: '{{ containercluster_install_agent_ca }}'
              user: '{{ containercluster_install_agent_user }}'
              password: '{{ containercluster_install_agent_password }}'
              require_tpm: '{{ containercluster_install_agent_node.requireTPM | default(false) }}'
              firmware: '{{ containercluster_install_agent_node.firmware | default({}) }}'
              expected: "{{ containercluster_install_agent_node.hardware.interfaces | default([]) | map(attribute='macAddress') | list }}"
              pinned_uuid_base64: >-
                {{ bootwright_cluster_install_material['pinnedUUIDBase64Node' ~ containercluster_install_agent_index] | default('') }}
              pinned_serial_base64: >-
                {{ bootwright_cluster_install_material['pinnedSerialBase64Node' ~ containercluster_install_agent_index] | default('') }}

        - name: Publish a fresh private link for this insert
          bootwright.core.containercluster_media_token:
            request: '{{ bootwright_cluster_install_request }}'
            source: '{{ containercluster_install_agent_url }}'
            operation: publish
          register: containercluster_install_agent_token
          no_log: true

        - name: Keep this attempt's private insert token for release
          ansible.builtin.set_fact:
            containercluster_install_agent_insert_tokens: >-
              {{ containercluster_install_agent_insert_tokens | default({})
                 | combine({containercluster_install_agent_node.machine: containercluster_install_agent_token.url}) }}
          no_log: true

        - name: Prove the insert image through the verified serving listener
          ansible.builtin.uri:
            url: '{{ containercluster_install_agent_token.url }}'
            method: GET
            headers:
              Range: bytes=0-0
            ca_path: '{{ bootwright_cluster_install_material.artifactCertificate }}'
            validate_certs: true
            use_proxy: false
            follow_redirects: none
            status_code: [200, 206]
            timeout: 30
          register: containercluster_install_agent_token_probe
          failed_when: false
          changed_when: false
          no_log: true

        - name: Retire a link the serving listener did not prove
          bootwright.core.containercluster_media_token:
            request: '{{ bootwright_cluster_install_request }}'
            source: '{{ containercluster_install_agent_url }}'
            image: '{{ containercluster_install_agent_token.url }}'
            operation: remove
          when: containercluster_install_agent_token_probe.status | default(-1) | int not in [200, 206]
          no_log: true

        - name: Retain an unproved private listener as a typed node refusal
          ansible.builtin.set_fact:
            containercluster_install_agent_lifecycle_refusal: private-delivery
          when: containercluster_install_agent_token_probe.status | default(-1) | int not in [200, 206]

        - name: Refuse an insert whose private image cannot be fetched
          ansible.builtin.assert:
            that: containercluster_install_agent_token_probe.status | default(-1) | int in [200, 206]
            fail_msg: >-
              the private insert image could not be fetched through the artifact listener:
              {{ 'serving certificate verification against Secret ' ~ bootwright_cluster_install_request.tlsCertificateRef ~ ' failed'
                 if (containercluster_install_agent_token_probe.msg | default('')) is search('CERTIFICATE_VERIFY_FAILED|certificate verify failed')
                 else ('listener status ' ~ (containercluster_install_agent_token_probe.status | default(-1) | string))
                 if containercluster_install_agent_token_probe.status | default(-1) | int != -1
                 else 'the connection failed before a status line was received' }}
            quiet: true

        - name: Keep this node's private insert URL in invocation scratch
          ansible.builtin.copy:
            content: '{{ containercluster_install_agent_token.url }}'
            dest: '{{ bootwright_run_scratch }}/cluster-insert-{{ containercluster_install_agent_index }}'
            mode: '0600'
          no_log: true

        - name: Insert through the selected substrate machine port
          ansible.builtin.include_tasks: port.yml
          vars:
            containercluster_install_agent_port_operation: media_insert

        - name: Retain the insertion answer
          ansible.builtin.set_fact:
            containercluster_install_agent_insertion: '{{ containercluster_install_agent_port_result }}'
          no_log: true

        # ansible-core keeps nothing of a failure under no_log but that it
        # failed, so the controller's own refusal is reported here, where no
        # credential is.
        - name: Retain a refused insert as a typed node refusal
          ansible.builtin.set_fact:
            containercluster_install_agent_lifecycle_refusal: media-insert
          when: containercluster_install_agent_insertion.msg is defined

        - name: Stop at an insert the management controller did not complete
          ansible.builtin.assert:
            that:
              - containercluster_install_agent_insertion.msg is not defined
            fail_msg: >-
              inserting this cluster's image into Machine {{ containercluster_install_agent_node.machine }}
              failed:
              {{ (containercluster_install_agent_insertion.msg | default('') | string | bootwright.core.printable)[:512] }}
            quiet: true

        - name: Boot the node through its selected substrate
          ansible.builtin.include_role:
            name: bootwright.core.substrate_machine
            tasks_from: boot_media
          vars:
            bootwright_machine_arm: '{{ containercluster_install_agent_node.substrate }}'
            bootwright_machine_port:
              endpoint: '{{ containercluster_install_agent_node.controller.endpoint }}'
              verify: '{{ containercluster_install_agent_node.controller.tlsVerify }}'
              ca: '{{ containercluster_install_agent_ca }}'
              user: '{{ containercluster_install_agent_user }}'
              password: '{{ containercluster_install_agent_password }}'
              installer_powers_off: false

      # A step the timeout stopped fails with ansible-core's own message, so the
      # budget is named here; any other failure stays a failure, and its own
      # step above, not this one, says what refused. A refusal of the node's
      # pre-boot proof is left in the substrate's refusal fact, because this role
      # holds the result channel, and is named to the runner under the node's
      # position, so the operator's diagnostic is the installation's own for
      # that Machine. The rescue therefore ends in a fail with no condition,
      # which is what keeps each refusal above terminal.
      rescue:
        - name: Report the boot the boot phase's budget stopped
          ansible.builtin.fail:
            msg: >-
              {{ containercluster_install_agent_boot_spent_hint }} Machine
              {{ containercluster_install_agent_node.machine }} was being booted when it was spent.
          when: ansible_failed_result.timedout is defined

        # A failed insert may still have left its link attached, so the
        # controller is read, changing nothing, and the link this attempt just
        # published is retired only when the controller answers presenting
        # something else. A read that fails retires nothing and is named
        # here; the next apply's sweep reads every controller again before it
        # boots anything. A step the budget stopped ended the rescue above.
        # A rescue inherits its block's timeout, which near the deadline is the
        # one-second floor, and a task timeout raises past failed_when
        # (executor/task_executor.py), so the read would end the rescue with a
        # censored timeout. Its own timeout keyword is found before any parent
        # is consulted (playbook/task.py _get_parent_attribute), so it reads
        # under the media read's 2-minute bound plus 30 seconds, whatever the
        # boot budget has left. The rescue ends in a fail, so the media read of
        # the state read after boot, which the installation's deadline allows
        # for each node, does not run in this attempt.
        - name: Read the substrate after a failed insert
          ansible.builtin.include_tasks:
            file: port.yml
            apply:
              timeout: '{{ (containercluster_install_agent_node.stateReadSeconds | int) + 30 }}'
          vars:
            containercluster_install_agent_port_operation: state_read
          when: containercluster_install_agent_insertion.msg is defined

        - name: Retain the read after insertion
          ansible.builtin.set_fact:
            containercluster_install_agent_after_insert: '{{ containercluster_install_agent_port_result }}'
          when: containercluster_install_agent_insertion.msg is defined
          no_log: true

        - name: Stop at a read after a failed insert the management controller did not answer
          ansible.builtin.fail:
            msg: >-
              inserting this cluster's image into Machine {{ containercluster_install_agent_node.machine }}
              failed:
              {{ (containercluster_install_agent_insertion.msg | default('') | string | bootwright.core.printable)[:384] }};
              reading what its management controller presents afterwards failed:
              {{ (containercluster_install_agent_after_insert.msg | string | bootwright.core.printable)[:384] }};
              the private link of that insert is left in place until the next apply retires it
          when: containercluster_install_agent_after_insert.msg is defined

        - name: Retire the link of a failed insert the controller does not present
          bootwright.core.containercluster_media_token:
            request: '{{ bootwright_cluster_install_request }}'
            source: '{{ containercluster_install_agent_url }}'
            image: '{{ containercluster_install_agent_token.url }}'
            operation: remove
          when:
            - containercluster_install_agent_insertion.msg is defined
            - containercluster_install_agent_after_insert.media is defined
            - containercluster_install_agent_token.url.split('/')[-2] not in (containercluster_install_agent_after_insert.media | string)
          no_log: true

        - name: Retain the substrate refusal until every sibling finishes
          ansible.builtin.set_fact:
            containercluster_install_agent_lifecycle_refusal: '{{ containercluster_install_agent_refusal }}'
          vars:
            containercluster_install_agent_refusal: "{{ substrate_machine_refusal | default('') }}"
          when: containercluster_install_agent_refusal | length > 0
          no_log: true

        - name: Keep any other boot failure a failure
          ansible.builtin.fail:
            msg: >-
              Machine {{ containercluster_install_agent_node.machine }} was not booted from
              this cluster's image; the failed step above names what refused.
