---
# Read the cluster back through its own API, and each node through its own
# controller. Every answer here is an observation: nothing is echoed from the
# request, so the evidence says what is true rather than what was asked for.
# The inspection reads the cluster through the copy this installation keeps of
# the kubeconfig the installer wrote with the image, the file it names the
# identity from, in one read of ClusterVersion and one of the nodes through
# the bounded oc runner, whose --request-timeout ends each request oc makes.
# The installer's own file, which it rewrites in place, is never read here.
# An observation for a removal's resolution reads none of the cluster, which
# the removal leaves running: only the media each node presents decides it.
- name: Read the cluster's version and nodes through this build's own trust anchor
  bootwright.core.containercluster_install_inspect:
    request: '{{ bootwright_cluster_install_request }}'
    cluster: true
    client: '{{ containercluster_install_agent_client }}'
    identity: '{{ containercluster_install_agent_before.observation.identity | default("") }}'
  register: containercluster_install_agent_cluster_read
  changed_when: false
  when: not (containercluster_install_agent_observes_removal | bool)

- name: Resolve what the cluster answered
  ansible.builtin.set_fact:
    containercluster_install_agent_state: >-
      {{ containercluster_install_agent_cluster_read.state
         if containercluster_install_agent_cluster_read.state is defined
         else {'cluster': '', 'release': '', 'completed': false,
               'missing': bootwright_cluster_install_request.nodes | map(attribute='name') | sort}
      }}
  changed_when: false
