---
- name: Validate the frozen installation request
  ansible.builtin.assert:
    that:
      - bootwright_cluster_install_request.version == 'cluster-install-agent-v3'
      - bootwright_cluster_install_digest is match('[0-9a-f]{64}')
    quiet: true
  no_log: true

- name: Complete the qualified execution handoff
  bootwright.core.containercluster_install_protocol:
    phase: loaded
  no_log: true

- name: Report media release
  bootwright.core.containercluster_install_protocol:
    phase: group
    group: release-media
    status: running
  no_log: true

- name: Observe what this installation recorded
  bootwright.core.containercluster_install_inspect:
    request: '{{ bootwright_cluster_install_request }}'
  register: containercluster_install_agent_before
  no_log: true

- name: Read what each node still presents
  ansible.builtin.import_tasks: state.yml

# A removal that finds nothing inserted took nothing back, which is what an
# already-removed block reports rather than a change it did not make.
- name: Decide whether this removal has anything to take back
  ansible.builtin.set_fact:
    containercluster_install_agent_inserted: >-
      {{ containercluster_install_agent_state.media | length > 0 }}
  changed_when: false

# The installed cluster leaves with its nodes' own disks. What this block
# opened is the media each node presents, so that is all it takes back: a
# removal selects no boot device and composes no substrate entry point.
- name: Eject the media every node still presents
  bootwright.core.redfish_boot:
    endpoint: '{{ containercluster_install_agent_node.controller.endpoint }}'
    user: '{{ lookup("ansible.builtin.file", containercluster_install_agent_user) }}'
    password: '{{ lookup("ansible.builtin.file", containercluster_install_agent_password) }}'
    verify: '{{ containercluster_install_agent_node.controller.tlsVerify }}'
    operation: eject
  loop: '{{ bootwright_cluster_install_request.nodes }}'
  loop_control:
    loop_var: containercluster_install_agent_node
    label: '{{ containercluster_install_agent_node.machine }}'
    index_var: containercluster_install_agent_index
  vars:
    containercluster_install_agent_user: >-
      {{ bootwright_cluster_install_material['controllerUserNode' ~ containercluster_install_agent_index] }}
    containercluster_install_agent_password: >-
      {{ bootwright_cluster_install_material['controllerPasswordNode' ~ containercluster_install_agent_index] }}
  register: containercluster_install_agent_ejected
  failed_when: false
  no_log: true

# ansible-core keeps nothing of a failure under no_log but that it failed, so
# each controller's own refusal is reported here, where no credential is.
- name: Stop at an eject a management controller did not complete
  ansible.builtin.fail:
    msg: >-
      {% for result in containercluster_install_agent_ejected.results | default([]) if result.msg is defined -%}
      ejecting the media of Machine {{ result.containercluster_install_agent_node.machine }}
      failed: {{ (result.msg | string | bootwright.core.printable)[:512] }}{{ '' if loop.last else '; ' }}
      {%- endfor %}
  when: containercluster_install_agent_ejected.results | default([]) | selectattr('msg', 'defined') | list | length > 0

- name: Report media release completion
  bootwright.core.containercluster_install_protocol:
    phase: group
    group: release-media
    status: ok
  no_log: true

- name: Report absence verification
  bootwright.core.containercluster_install_protocol:
    phase: group
    group: verify-absence
    status: running
  no_log: true

- name: Prove no node presents this cluster's media
  ansible.builtin.import_tasks: state.yml

- name: Report absence verification completion
  bootwright.core.containercluster_install_protocol:
    phase: group
    group: verify-absence
    status: ok
  no_log: true

- name: Publish bounded installation removal evidence
  bootwright.core.containercluster_install_protocol:
    phase: completed
    outcome: >-
      {{ 'changed' if containercluster_install_agent_inserted | bool else 'unchanged' }}
    digest: '{{ bootwright_cluster_install_digest }}'
    identity: '{{ containercluster_install_agent_before.observation.identity }}'
    state: '{{ containercluster_install_agent_state }}'
    removed: true
  no_log: true
