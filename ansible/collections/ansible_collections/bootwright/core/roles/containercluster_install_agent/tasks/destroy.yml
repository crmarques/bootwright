---
- name: Validate the frozen installation request
  ansible.builtin.assert:
    that:
      - bootwright_cluster_install_request.version == 'cluster-install-agent-v1'
      - bootwright_cluster_install_digest is match('^[0-9a-f]{64}$(?!\n)')
    quiet: true
  no_log: true

- name: Complete the qualified execution handoff
  bootwright.core.containercluster_install_protocol:
    phase: loaded
  no_log: true

- name: Report media release
  bootwright.core.containercluster_install_protocol:
    phase: group
    group: release-media
    status: running
  no_log: true

- name: Observe what this installation recorded
  bootwright.core.containercluster_install_inspect:
    request: '{{ bootwright_cluster_install_request }}'
  register: containercluster_install_agent_before
  no_log: true

# The node plays after this one read what each node still presents.
- name: Read the cluster back before the release
  ansible.builtin.import_tasks: cluster_state.yml
