---
- name: Validate the frozen installation request
  ansible.builtin.assert:
    that:
      - bootwright_cluster_install_request.version == 'cluster-install-agent-v12'
      - bootwright_cluster_install_digest is match('[0-9a-f]{64}')
    quiet: true
  no_log: true

- name: Complete the qualified execution handoff
  bootwright.core.containercluster_install_protocol:
    phase: loaded
  no_log: true

- name: Report media release
  bootwright.core.containercluster_install_protocol:
    phase: group
    group: release-media
    status: running
  no_log: true

- name: Observe what this installation recorded
  bootwright.core.containercluster_install_inspect:
    request: '{{ bootwright_cluster_install_request }}'
  register: containercluster_install_agent_before
  no_log: true

- name: Read what each node still presents
  ansible.builtin.import_tasks: state.yml

# A removal that finds nothing inserted took nothing back, which is what an
# already-removed block reports rather than a change it did not make.
- name: Decide whether this removal has anything to take back
  ansible.builtin.set_fact:
    containercluster_install_agent_inserted: >-
      {{ containercluster_install_agent_state.media | length > 0 }}
  changed_when: false

# The installed cluster leaves with its nodes' own disks. What this block
# opened is the media each node presents, so that is all it takes back: a
# removal selects no boot device and composes no substrate entry point.
- name: Release media and retire every token whose eject succeeded
  block:
    - name: Start the ordered eject answers
      ansible.builtin.set_fact:
        containercluster_install_agent_ejected:
          results: []
      no_log: true

    - name: Eject the media every node still presents
      ansible.builtin.include_tasks: eject_node_serial.yml
      loop: '{{ bootwright_cluster_install_request.nodes }}'
      loop_control:
        loop_var: containercluster_install_agent_node
        label: '{{ containercluster_install_agent_node.machine }}'
        index_var: containercluster_install_agent_index
      vars:
        containercluster_install_agent_user: >-
          {{ bootwright_cluster_install_material['controllerUserNode' ~ containercluster_install_agent_index] }}
        containercluster_install_agent_password: >-
          {{ '' if containercluster_install_agent_node.portPinned | default(false)
             else bootwright_cluster_install_material['controllerPasswordNode' ~ containercluster_install_agent_index] }}
        containercluster_install_agent_ca: >-
          {{ bootwright_cluster_install_material['controllerCANode' ~ containercluster_install_agent_index] | default('') }}

    # ansible-core keeps nothing of a failure under no_log but that it failed, so
    # each controller's own refusal is reported here, where no credential is.
    - name: Stop at an eject a management controller did not complete
      ansible.builtin.fail:
        msg: >-
          {% for result in containercluster_install_agent_ejected.results | default([]) if result.msg is defined -%}
          ejecting the media of Machine {{ result.containercluster_install_agent_node.machine }}
          failed: {{ (result.msg | string | bootwright.core.printable)[:512] }}{{ '' if loop.last else '; ' }}
          {%- endfor %}
      when: containercluster_install_agent_ejected.results | default([]) | selectattr('msg', 'defined') | list | length > 0

  always:
    - name: Retire each private token after eject
      bootwright.core.containercluster_media_token:
        request: '{{ bootwright_cluster_install_request }}'
        source: '{{ containercluster_install_agent_before.observation.url }}'
        image: '{{ item.media | default("") }}'
        operation: remove
      loop: '{{ containercluster_install_agent_controllers.results | default([]) }}'
      loop_control:
        index_var: containercluster_install_agent_cleanup_index
      when:
        - containercluster_install_agent_before.observation.url | default('') | length > 0
        - containercluster_install_agent_ejected.results | default([]) | length > containercluster_install_agent_cleanup_index
        - containercluster_install_agent_ejected.results[containercluster_install_agent_cleanup_index].msg is not defined
      no_log: true

    # A link a failed or replaced insert left is presented by no controller,
    # so only the media of a node whose eject was not proved is kept.
    - name: Retire every insert link no node whose eject failed presents
      bootwright.core.containercluster_media_token:
        request: '{{ bootwright_cluster_install_request }}'
        source: '{{ containercluster_install_agent_before.observation.url }}'
        presented: >-
          {{ containercluster_install_agent_controllers.results | default([])
             | rejectattr('item.machine', 'in', containercluster_install_agent_released_machines)
             | map(attribute='media', default='') | list }}
        operation: sweep
      vars:
        containercluster_install_agent_released_machines: >-
          {{ containercluster_install_agent_ejected.results | default([])
             | rejectattr('msg', 'defined')
             | map(attribute='containercluster_install_agent_node.machine') | list }}
      when: containercluster_install_agent_before.observation.url | default('') | length > 0
      register: containercluster_install_agent_swept
      failed_when: false
      no_log: true

    # ansible-core keeps nothing of a failure under no_log but that it failed,
    # so the sweep's own refusal, which carries counts and never a URL or
    # token, is reported here.
    - name: Stop at a refusal of the sweep after the ejects
      ansible.builtin.fail:
        msg: >-
          retiring the insert links no management controller presents failed:
          {{ (containercluster_install_agent_swept.msg | string | bootwright.core.printable)[:512] }}
      when: containercluster_install_agent_swept.msg is defined

- name: Report media release completion
  bootwright.core.containercluster_install_protocol:
    phase: group
    group: release-media
    status: ok
  no_log: true

- name: Report absence verification
  bootwright.core.containercluster_install_protocol:
    phase: group
    group: verify-absence
    status: running
  no_log: true

- name: Prove no node presents this cluster's media
  ansible.builtin.import_tasks: state.yml

- name: Report absence verification completion
  bootwright.core.containercluster_install_protocol:
    phase: group
    group: verify-absence
    status: ok
  no_log: true

- name: Publish bounded installation removal evidence
  bootwright.core.containercluster_install_protocol:
    phase: completed
    outcome: >-
      {{ 'changed' if containercluster_install_agent_inserted | bool else 'unchanged' }}
    digest: '{{ bootwright_cluster_install_digest }}'
    identity: '{{ containercluster_install_agent_before.observation.identity }}'
    state: '{{ containercluster_install_agent_state }}'
    removed: true
  no_log: true
