---
# The installed cluster leaves with its nodes' own disks. What this block
# opened is the media each node presents, so that is all it takes back: a
# removal selects no boot device and composes no substrate entry point. Every
# node ejects at once within the frozen fan-out; the controller's play reports
# each refusal together.
- name: Eject through the node's substrate
  ansible.builtin.include_tasks: port.yml
  vars:
    containercluster_install_agent_port_operation: media_eject

- name: Keep this node's eject answer
  ansible.builtin.set_fact:
    containercluster_install_agent_node_ejected: >-
      {{ containercluster_install_agent_port_result
         | combine({'containercluster_install_agent_node': containercluster_install_agent_node}) }}
  no_log: true

- name: Retire the private token after its node's eject succeeded
  bootwright.core.containercluster_media_token:
    request: '{{ bootwright_cluster_install_request }}'
    source: '{{ containercluster_install_agent_before.observation.url }}'
    image: '{{ containercluster_install_agent_node_read.media | default("") }}'
    operation: remove
  when:
    - containercluster_install_agent_before.observation.url | default('') | length > 0
    - containercluster_install_agent_node_ejected.msg is not defined
  no_log: true
