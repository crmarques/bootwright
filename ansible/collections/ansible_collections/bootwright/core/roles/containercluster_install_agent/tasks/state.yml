---
# Read the cluster back through its own API, and each node through its own
# controller. Every answer here is an observation: nothing is echoed from the
# request, so the evidence says what is true rather than what was asked for.
# The cluster is read through the kubeconfig the installer wrote with the
# image, so a read that succeeds has verified the serving certificate against
# that build's authority and been authenticated by its client certificate.
- name: Read ClusterVersion through this build's own trust anchor
  ansible.builtin.command:
    argv:
      - '{{ containercluster_install_agent_client }}'
      - --kubeconfig
      - '{{ containercluster_install_agent_kubeconfig }}'
      - get
      - clusterversion
      - version
      - --output
      - name
  register: containercluster_install_agent_cluster
  changed_when: false
  failed_when: false

- name: Read the release the cluster reports
  ansible.builtin.command:
    argv:
      - '{{ containercluster_install_agent_client }}'
      - --kubeconfig
      - '{{ containercluster_install_agent_kubeconfig }}'
      - get
      - clusterversion
      - version
      - --output
      - jsonpath={.status.desired.version}
  register: containercluster_install_agent_release
  changed_when: false
  failed_when: false

# ClusterVersion's own report that the installation finished, one field per
# line: the status of its Available condition, then the state and version of
# the newest entry of its update history. The cluster version operator opens
# that entry Partial at the desired release when the cluster starts, and marks
# it Completed once the whole release has been applied. A history that is
# absent or empty answers no state: oc's JSONPath prints nothing for an absent
# key and refuses the first entry of an empty list as out of bounds.
- name: Read whether the cluster reports its installation completed
  ansible.builtin.command:
    argv:
      - '{{ containercluster_install_agent_client }}'
      - --kubeconfig
      - '{{ containercluster_install_agent_kubeconfig }}'
      - get
      - clusterversion
      - version
      - --output
      - 'jsonpath={.status.conditions[?(@.type=="Available")].status}{"\n"}{.status.history[0].state}{"\n"}{.status.history[0].version}'
  register: containercluster_install_agent_completion
  changed_when: false
  failed_when: false

- name: Read the nodes the cluster holds
  ansible.builtin.command:
    argv:
      - '{{ containercluster_install_agent_client }}'
      - --kubeconfig
      - '{{ containercluster_install_agent_kubeconfig }}'
      - get
      - nodes
      - --output
      - jsonpath={.items[*].metadata.name}
  register: containercluster_install_agent_nodes
  changed_when: false
  failed_when: false

- name: Read each node through its own management controller
  bootwright.core.redfish_boot:
    endpoint: '{{ item.controller.endpoint }}'
    user: >-
      {{ lookup("ansible.builtin.file",
         bootwright_cluster_install_material['controllerUserNode' ~ loop_index]) }}
    password: >-
      {{ lookup("ansible.builtin.file",
         bootwright_cluster_install_material['controllerPasswordNode' ~ loop_index]) }}
    verify: '{{ item.controller.tlsVerify }}'
    operation: read
  loop: '{{ bootwright_cluster_install_request.nodes }}'
  loop_control:
    label: '{{ item.machine }}'
    index_var: loop_index
  register: containercluster_install_agent_controllers
  no_log: true

# The cluster answers with this build's identity only when the read above
# succeeded, and with the foreign marker when an API answered but refused the
# anchor: a serving certificate the authority does not verify, or a client
# certificate it rejects (401 or 403). Anything else is nothing answering. A
# success through a kubeconfig whose anchor the inspection could not name is
# foreign too, because it proves no cluster of this build. The rejections are
# matched in the form oc prints them, through kubectl's StandardErrorMessage,
# and the marker is no SHA-256, so it never equals an identity. The
# installation is completed only when the completion read succeeded and
# answered exactly Available True and a newest history entry Completed at the
# declared release; any other answer, or none, is an installation not yet done.
- name: Resolve what the cluster and its nodes answered
  ansible.builtin.set_fact:
    containercluster_install_agent_state:
      cluster: >-
        {{ (containercluster_install_agent_identity or containercluster_install_agent_foreign)
           if (containercluster_install_agent_cluster.rc | default(1)) == 0
           else (containercluster_install_agent_foreign
                 if (containercluster_install_agent_cluster.stderr | default(''))
                    is search(containercluster_install_agent_rejected)
                 else '') }}
      release: '{{ containercluster_install_agent_release.stdout | default("") | trim }}'
      completed: >-
        {{ (containercluster_install_agent_completion.rc | default(1)) == 0
           and (containercluster_install_agent_completion.stdout | default('')).splitlines()
               == ['True', 'Completed', bootwright_cluster_install_request.release.version] }}
      missing: >-
        {{ bootwright_cluster_install_request.nodes | map(attribute='name') | list
           | difference((containercluster_install_agent_nodes.stdout | default('')).split()) }}
      media: >-
        {{ containercluster_install_agent_controllers.results | default([])
           | selectattr('media', 'defined') | selectattr('media', 'ne', '')
           | map(attribute='item.machine') | list }}
      powered: >-
        {{ containercluster_install_agent_controllers.results | default([])
           | selectattr('power', 'defined') | selectattr('power', 'equalto', 'On')
           | map(attribute='item.machine') | list }}
  vars:
    containercluster_install_agent_identity: >-
      {{ containercluster_install_agent_before.observation.identity | default('') }}
    containercluster_install_agent_foreign: foreign
    containercluster_install_agent_rejected: >-
      x509: |You must be logged in to the server|Error from server \(Forbidden\)
  changed_when: false
