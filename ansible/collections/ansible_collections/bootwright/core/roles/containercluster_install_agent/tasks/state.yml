---
- name: Read the cluster completion state
  ansible.builtin.import_tasks: cluster_state.yml

- name: Start the controller observations
  ansible.builtin.set_fact:
    containercluster_install_agent_controllers:
      results: []
  no_log: true

- name: Read every node through its substrate port
  ansible.builtin.include_tasks: state_node_serial.yml
  loop: '{{ bootwright_cluster_install_request.nodes }}'
  loop_control:
    loop_var: containercluster_install_agent_node
    index_var: containercluster_install_agent_index
  vars:
    containercluster_install_agent_user: "{{ bootwright_cluster_install_material['controllerUserNode' ~ containercluster_install_agent_index] }}"
    containercluster_install_agent_password: "{{ bootwright_cluster_install_material['controllerPasswordNode' ~ containercluster_install_agent_index] }}"
    containercluster_install_agent_ca: "{{ bootwright_cluster_install_material['controllerCANode' ~ containercluster_install_agent_index] | default('') }}"

# ansible-core keeps nothing of a failure under no_log but that it failed, so
# each controller's own refusal is reported here, where no credential is.
- name: Stop at a read a management controller did not answer
  ansible.builtin.fail:
    msg: >-
      {% for result in containercluster_install_agent_controllers.results | default([]) if result.msg is defined -%}
      reading Machine {{ result.item.machine }} through its management controller failed:
      {{ (result.msg | string | bootwright.core.printable)[:512] }}{{ '' if loop.last else '; ' }}
      {%- endfor %}
  when: containercluster_install_agent_controllers.results | default([]) | selectattr('msg', 'defined') | list | length > 0

- name: Prove the inode of each image a controller presents
  bootwright.core.containercluster_media_token:
    request: '{{ bootwright_cluster_install_request }}'
    source: '{{ containercluster_install_agent_before.observation.url }}'
    image: '{{ item.media | default("") }}'
    operation: inspect
  loop: '{{ containercluster_install_agent_controllers.results | default([]) }}'
  register: containercluster_install_agent_media_identity
  when: containercluster_install_agent_before.observation.url | default('') | length > 0
  no_log: true

- name: Resolve what the cluster and its nodes answered
  ansible.builtin.set_fact:
    containercluster_install_agent_state:
      cluster: '{{ containercluster_install_agent_state.cluster }}'
      release: '{{ containercluster_install_agent_state.release }}'
      completed: '{{ containercluster_install_agent_state.completed }}'
      missing: '{{ containercluster_install_agent_state.missing }}'
      media: >-
        {{ containercluster_install_agent_presenting | map(attribute='item.machine') | list }}
      ownMedia: >-
        {{ containercluster_install_agent_media_identity.results | default([])
           | selectattr('own', 'defined') | selectattr('own', 'equalto', true)
           | map(attribute='item.item.machine') | list }}
      powered: >-
        {{ containercluster_install_agent_controllers.results | default([])
           | selectattr('power', 'defined') | selectattr('power', 'equalto', 'On')
           | map(attribute='item.machine') | list }}
  vars:
    containercluster_install_agent_presenting: >-
      {{ containercluster_install_agent_controllers.results | default([])
         | selectattr('media', 'defined') | selectattr('media', 'ne', '') | list }}
  changed_when: false
