---
- name: Refuse an operation the substrate machine port does not offer
  ansible.builtin.assert:
    that:
      - containercluster_install_agent_port_operation in ['state_read', 'media_insert', 'media_eject', 'power']
    quiet: true
    fail_msg: The node's operation is no substrate machine port entry point; plan again with this release.

# A pinned port is handed the identity its Machine's own block recorded at
# every entry point, and a pushed image's file, the controller's client that
# transfers it and the media identity it is recognized by in place of a link.
- name: Invoke the selected substrate machine port
  ansible.builtin.include_role:
    name: bootwright.core.substrate_machine
    tasks_from: '{{ containercluster_install_agent_port_operation }}'
  vars:
    bootwright_machine_arm: '{{ containercluster_install_agent_node.substrate }}'
    bootwright_machine_port: >-
      {{ containercluster_install_agent_port_access
         | combine(containercluster_install_agent_node_pin if containercluster_install_agent_node.portPinned | default(false) else {})
         | combine(containercluster_install_agent_port_arguments[containercluster_install_agent_port_operation]) }}
    containercluster_install_agent_port_access:
      endpoint: '{{ containercluster_install_agent_node.controller.endpoint }}'
      user: '{{ containercluster_install_agent_user }}'
      password: '{{ containercluster_install_agent_password }}'
      ca: '{{ containercluster_install_agent_ca }}'
      verify: '{{ containercluster_install_agent_node.controller.tlsVerify }}'

    containercluster_install_agent_port_arguments:
      state_read: >-
        {{ {'media': true, 'media_identity': bootwright_cluster_install_request.imageIdentity}
           if (bootwright_cluster_install_request.deliveryKind | default('fetch')) == 'push' else {'media': true} }}

      media_insert: >-
        {{ containercluster_install_agent_pushed_insert if (bootwright_cluster_install_request.deliveryKind | default('fetch')) == 'push'
           else containercluster_install_agent_fetched_insert }}

      media_eject:
        certificate: '{{ bootwright_cluster_install_material.artifactCertificate | default("") }}'
        restore_verification: '{{ containercluster_install_agent_node.controller.virtualMedia.restoreVerification }}'
        remove_certificate: '{{ containercluster_install_agent_node.controller.virtualMedia.removeCertificate }}'

      power:
        power: 'off'

    containercluster_install_agent_node_pin:
      pinned_uuid_base64: "{{ bootwright_cluster_install_material['pinnedUUIDBase64Node' ~ containercluster_install_agent_index] | default('') }}"
      pinned_serial_base64: "{{ bootwright_cluster_install_material['pinnedSerialBase64Node' ~ containercluster_install_agent_index] | default('') }}"

    containercluster_install_agent_fetched_insert:
      image_url_file: '{{ bootwright_run_scratch }}/cluster-insert-{{ containercluster_install_agent_index }}'
      private: '{{ containercluster_install_agent_node.physical }}'
      trust: '{{ containercluster_install_agent_node.controller.virtualMedia.trust }}'
      certificate: '{{ bootwright_cluster_install_material.artifactCertificate | default("") }}'

    containercluster_install_agent_pushed_insert:
      image_path: '{{ bootwright_cluster_install_request.image.path }}'
      virtctl: '{{ bootwright_cluster_install_material.virtctl }}'
      media_identity: '{{ bootwright_cluster_install_request.imageIdentity }}'

- name: Retain the substrate port answer for this node
  ansible.builtin.set_fact:
    containercluster_install_agent_port_result: '{{ substrate_machine_port_result }}'
  no_log: true
