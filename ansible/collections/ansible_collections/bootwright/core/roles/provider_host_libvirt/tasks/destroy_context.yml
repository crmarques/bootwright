---
- name: Resolve current-context libvirt cleanup paths
  ansible.builtin.set_fact:
    bootwright_libvirt_context_storage_root: "/var/lib/libvirt/images/bootwright/{{ bootwright_clusters_dir | dirname | basename }}/clusters"
    bootwright_libvirt_context_uri: "{{ bootwright_libvirt_provider.capabilities.libvirt.uri | default('qemu:///system', true) }}"
  changed_when: false

- name: List libvirt domains for current-context sweep
  ansible.builtin.command:
    argv:
      - virsh
      - -c
      - "{{ bootwright_libvirt_context_uri }}"
      - list
      - --all
      - --name
  register: bootwright_libvirt_domain_list
  changed_when: false

- name: Inspect libvirt domain block devices
  ansible.builtin.command:
    argv:
      - virsh
      - -c
      - "{{ bootwright_libvirt_context_uri }}"
      - domblklist
      - "{{ bootwright_libvirt_domain_name }}"
      - --details
  loop: "{{ bootwright_libvirt_domain_list.stdout_lines | default([]) | reject('equalto', '') | list }}"
  loop_control:
    loop_var: bootwright_libvirt_domain_name
    label: "{{ bootwright_libvirt_domain_name }}"
  register: bootwright_libvirt_domain_blocklists
  changed_when: false
  failed_when: false

- name: Inspect libvirt domain ownership metadata
  ansible.builtin.command:
    argv:
      - virsh
      - -c
      - "{{ bootwright_libvirt_context_uri }}"
      - dumpxml
      - "{{ bootwright_libvirt_domain_name }}"
  loop: "{{ bootwright_libvirt_domain_list.stdout_lines | default([]) | reject('equalto', '') | list }}"
  loop_control:
    loop_var: bootwright_libvirt_domain_name
    label: "{{ bootwright_libvirt_domain_name }}"
  register: bootwright_libvirt_domain_metadata
  changed_when: false
  failed_when: false

- name: Require conclusive libvirt block-device probes before context sweep
  ansible.builtin.assert:
    quiet: true
    that:
      - >-
        item.rc | default(1) == 0
        or (item.stderr | default(''))
           is search('(?i)(Domain not found|failed to get domain|no domain with matching name)')
    fail_msg: >-
      Refusing the current-context libvirt sweep because block devices for domain
      {{ item.bootwright_libvirt_domain_name | default('<unknown>') }} could not
      be read conclusively. rc {{ item.rc | default('<unknown>') }}, stderr
      {{ item.stderr | default('') }}. The domain may still use storage below
      {{ bootwright_libvirt_context_storage_root }}, so Bootwright will not stop
      domains, delete disks, or release ownership. Restore libvirt access and
      re-run the same `bootwright destroy` command.
  loop: "{{ bootwright_libvirt_domain_blocklists.results | default([]) }}"
  loop_control:
    label: "{{ item.bootwright_libvirt_domain_name | default('<unknown>') }}"

- name: Require conclusive libvirt ownership probes before context sweep
  ansible.builtin.assert:
    quiet: true
    that:
      - >-
        item.rc | default(1) == 0
        or (item.stderr | default(''))
           is search('(?i)(Domain not found|failed to get domain|no domain with matching name)')
    fail_msg: >-
      Refusing the current-context libvirt sweep because ownership metadata for
      domain {{ item.bootwright_libvirt_domain_name | default('<unknown>') }}
      could not be read conclusively. rc {{ item.rc | default('<unknown>') }},
      stderr {{ item.stderr | default('') }}. Bootwright cannot prove whether
      this domain belongs to the current context, so it will not stop domains,
      delete disks, or release ownership. Restore libvirt access and re-run the
      same `bootwright destroy` command.
  loop: "{{ bootwright_libvirt_domain_metadata.results | default([]) }}"
  loop_control:
    label: "{{ item.bootwright_libvirt_domain_name | default('<unknown>') }}"

- name: Require consistent libvirt probe results before context sweep
  ansible.builtin.assert:
    quiet: true
    that:
      - >-
        (bootwright_libvirt_domain_blocklists.results | default([])
         | selectattr('bootwright_libvirt_domain_name', 'equalto', item.bootwright_libvirt_domain_name)
         | list | length) == 1
      - >-
        ((bootwright_libvirt_domain_blocklists.results | default([])
          | selectattr('bootwright_libvirt_domain_name', 'equalto', item.bootwright_libvirt_domain_name)
          | map(attribute='rc') | first | default(1)) == 0)
        == (item.rc | default(1) == 0)
    fail_msg: >-
      Refusing the current-context libvirt sweep because domain
      {{ item.bootwright_libvirt_domain_name | default('<unknown>') }} changed
      while Bootwright inspected its block devices and ownership metadata.
      Bootwright will not infer ownership from inconsistent observations or
      delete storage. Re-run the same `bootwright destroy` command after the
      domain state is stable.
  loop: "{{ bootwright_libvirt_domain_metadata.results | default([]) }}"
  loop_control:
    label: "{{ item.bootwright_libvirt_domain_name | default('<unknown>') }}"

- name: Initialize Bootwright-owned current-context libvirt domains
  ansible.builtin.set_fact:
    bootwright_libvirt_context_owned_domains: []
  changed_when: false

- name: Select Bootwright-owned libvirt domains by ownership marker
  ansible.builtin.set_fact:
    bootwright_libvirt_context_owned_domains: "{{ bootwright_libvirt_context_owned_domains + [item.bootwright_libvirt_domain_name] }}"
  loop: "{{ bootwright_libvirt_domain_metadata.results | default([]) }}"
  loop_control:
    label: "{{ item.bootwright_libvirt_domain_name | default('') }}"
  when:
    - item.rc | default(1) == 0
    - (item.stdout | default('')) is search('<([A-Za-z0-9_]+:)?context>' ~ (bootwright_clusters_dir | dirname | basename | regex_escape) ~ '</([A-Za-z0-9_]+:)?context>')
  changed_when: false

- name: Initialize current-context libvirt domains
  ansible.builtin.set_fact:
    bootwright_libvirt_context_domains: []
  changed_when: false

- name: Select libvirt domains using current-context storage
  ansible.builtin.set_fact:
    bootwright_libvirt_context_domains: "{{ bootwright_libvirt_context_domains + [item.bootwright_libvirt_domain_name] }}"
  loop: "{{ bootwright_libvirt_domain_blocklists.results | default([]) }}"
  loop_control:
    label: "{{ item.bootwright_libvirt_domain_name | default('') }}"
  when:
    - item.rc | default(1) == 0
    - (bootwright_libvirt_context_storage_root ~ '/') in (item.stdout | default(''))
    - item.bootwright_libvirt_domain_name in bootwright_libvirt_context_owned_domains
  changed_when: false

- name: Detect foreign libvirt domains using current-context storage
  ansible.builtin.set_fact:
    bootwright_libvirt_context_foreign_storage: >-
      {{
        (bootwright_libvirt_domain_blocklists.results | default([]))
        | selectattr('rc', 'defined')
        | selectattr('rc', 'equalto', 0)
        | selectattr('stdout', 'search', (bootwright_libvirt_context_storage_root ~ '/') | regex_escape)
        | map(attribute='bootwright_libvirt_domain_name')
        | reject('in', bootwright_libvirt_context_owned_domains)
        | list
      }}
  changed_when: false

- name: Initialize owned current-context libvirt machine directories
  ansible.builtin.set_fact:
    bootwright_libvirt_context_owned_machine_dirs: []
  changed_when: false

- name: Collect owned current-context libvirt machine directories
  ansible.builtin.set_fact:
    bootwright_libvirt_context_owned_machine_dirs: >-
      {{
        (bootwright_libvirt_context_owned_machine_dirs | default([]))
        + (
            (item.stdout_lines | default([]))
            | map('regex_replace', '^.*[ \t]+', '')
            | select('match', '^' ~ (bootwright_libvirt_context_storage_root | regex_escape) ~ '/')
            | map('dirname')
            | list
          )
      }}
  loop: "{{ bootwright_libvirt_domain_blocklists.results | default([]) }}"
  loop_control:
    label: "{{ item.bootwright_libvirt_domain_name | default('') }}"
  when:
    - item.rc | default(1) == 0
    - item.bootwright_libvirt_domain_name in bootwright_libvirt_context_owned_domains
  changed_when: false

- name: Stop current-context libvirt domains
  ansible.builtin.command:
    argv:
      - virsh
      - -c
      - "{{ bootwright_libvirt_context_uri }}"
      - destroy
      - "{{ item }}"
  loop: "{{ bootwright_libvirt_context_domains }}"
  register: bootwright_libvirt_context_domain_stop
  changed_when: bootwright_libvirt_context_domain_stop.rc == 0
  failed_when:
    - bootwright_libvirt_context_domain_stop.rc != 0
    - >-
      not ((bootwright_libvirt_context_domain_stop.stderr | default(''))
           is search('(?i)(Domain not found|failed to get domain|no domain with matching name|domain is not running)'))

- name: Undefine current-context libvirt domains
  ansible.builtin.command:
    argv:
      - virsh
      - -c
      - "{{ bootwright_libvirt_context_uri }}"
      - undefine
      - "{{ item }}"
  loop: "{{ bootwright_libvirt_context_domains }}"
  register: bootwright_libvirt_context_domain_undefine
  changed_when: bootwright_libvirt_context_domain_undefine.rc == 0
  failed_when:
    - bootwright_libvirt_context_domain_undefine.rc != 0
    - >-
      not ((bootwright_libvirt_context_domain_undefine.stderr | default(''))
           is search('(?i)(Domain not found|failed to get domain|no domain with matching name)'))

- name: Verify swept current-context libvirt domains are absent
  ansible.builtin.command:
    argv:
      - virsh
      - -c
      - "{{ bootwright_libvirt_context_uri }}"
      - dumpxml
      - "{{ item }}"
  loop: "{{ bootwright_libvirt_context_domains }}"
  register: bootwright_libvirt_context_domain_absence
  changed_when: false
  failed_when: false

- name: Require swept libvirt domain absence before context storage deletion
  ansible.builtin.assert:
    quiet: true
    that:
      - item.rc | default(0) != 0
      - >-
        (item.stderr | default(''))
        is search('(?i)(Domain not found|failed to get domain|no domain with matching name)')
    fail_msg: >-
      Refusing to delete current-context libvirt storage or ownership because
      domain {{ item.item | default('<unknown>') }} was not proven absent after
      teardown. rc {{ item.rc | default('<unknown>') }}, stderr
      {{ item.stderr | default('') }}. Inspect the domain, restore libvirt
      access, and re-run the same `bootwright destroy` command.
  loop: "{{ bootwright_libvirt_context_domain_absence.results | default([]) }}"
  loop_control:
    label: "{{ item.item | default('<unknown>') }}"

- name: Remove current-context libvirt storage directory
  ansible.builtin.file:
    path: "{{ bootwright_libvirt_context_storage_root }}"
    state: absent
  when: bootwright_libvirt_context_foreign_storage | default([]) | length == 0

- name: Remove owned current-context libvirt machine directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ bootwright_libvirt_context_owned_machine_dirs | default([]) | unique | list }}"
  when: bootwright_libvirt_context_foreign_storage | default([]) | length > 0

- name: Warn that a foreign libvirt domain preserved the current-context storage root
  ansible.builtin.debug:
    msg: >-
      A non-Bootwright libvirt domain ({{ bootwright_libvirt_context_foreign_storage | join(', ') }})
      stores a disk under {{ bootwright_libvirt_context_storage_root }}; removed only the
      Bootwright-owned machine subtrees and left the foreign disk and any orphaned
      subtrees in place. Remove orphaned subtrees manually.
  when: bootwright_libvirt_context_foreign_storage | default([]) | length > 0

- name: Remove current-context libvirt ownership records
  ansible.builtin.file:
    path: "{{ bootwright_ownership_dir }}/resources/{{ item }}"
    state: absent
  loop:
    - libvirt-domain
    - libvirt-network

- name: Remove libvirt host packages introduced by Bootwright
  ansible.builtin.import_role:
    name: bootwright.core.provider_host_libvirt
    tasks_from: destroy.yml
