argument_specs:
  apply:
    short_description: Realize one frozen managed network service.
    options: &request
      bootwright_managed_service_request:
        type: dict
        required: true
        options:
          bindAddress:
            type: str
            required: true
          clients:
            type: list
            elements: str
            required: false
          contentRoot:
            type: str
            required: true
          credentialsRef:
            type: str
            required: false
          destinations:
            type: list
            elements: dict
            required: false
          egress:
            type: dict
            required: true
          endpoints:
            type: list
            elements: dict
            required: true
          forwarders:
            type: list
            elements: str
            required: false
          forwardZones:
            type: list
            elements: dict
            required: false
            options:
              domain:
                type: str
                required: true
              forwarders:
                type: list
                elements: str
                required: true
          identity:
            type: dict
            required: true
          image:
            type: str
            required: true
          imageSource:
            type: dict
            required: false
          implementation:
            type: str
            required: true
            choices:
              - dns-server-dnsmasq-v1
              - ntp-server-chrony-v1
              - proxy-squid-v1
              - registry-distribution-v1
          ingressHosts:
            type: list
            elements: str
            required: false
          kind:
            type: str
            required: true
            choices:
              - DNSServer
              - NTPServer
              - Proxy
              - Registry
          labelLevel:
            type: str
            required: false
          localZones:
            type: list
            elements: str
            required: false
          placement:
            type: dict
            required: true
          port:
            type: int
            required: true
          records:
            type: list
            elements: dict
            required: false
          sources:
            type: list
            elements: str
            required: false
          tls:
            type: dict
            required: false
            options:
              minVersion:
                type: str
                required: true
                choices:
                  - TLSv1.2
                  - TLSv1.3
              secret:
                type: str
                required: true
          unit:
            type: str
            required: true
          version:
            type: str
            required: true
            choices:
              - managed-service-v1
      bootwright_managed_service_digest:
        type: str
        required: true
      bootwright_managed_service_material:
        type: dict
        required: true

  observe:
    short_description: Observe one frozen managed network service without changing it.
    options: *request

  destroy:
    short_description: Remove one frozen managed network service and prove its absence.
    options: *request

  artifact_server_apply:
    short_description: Realize one frozen managed artifact server.
    options: &artifact_server_request
      bootwright_artifact_server_request:
        type: dict
        required: true
        options:
          bindAddress:
            type: str
            required: true
          contentRoot:
            type: str
            required: true
          egress:
            type: dict
            required: true
          endpoints:
            type: list
            elements: dict
            required: true
          identity:
            type: dict
            required: true
          image:
            type: str
            required: true
          imageSource:
            type: dict
            required: false
          listeners:
            type: list
            elements: dict
            required: true
          placement:
            type: dict
            required: true
          tls:
            type: dict
            required: false
          unit:
            type: str
            required: true
          version:
            type: str
            required: true
            choices:
              - artifact-server-nginx-v1
      bootwright_artifact_server_digest:
        type: str
        required: true
      bootwright_artifact_server_material:
        type: dict
        required: true
        options:
          certificate:
            type: str
            required: false
          privateKey:
            type: str
            required: false
          fingerprint:
            type: str
            required: false
          identity:
            type: str
            required: false
          knownHosts:
            type: str
            required: false

  artifact_server_observe:
    short_description: Observe one frozen managed artifact server without changing it.
    options: *artifact_server_request

  artifact_server_destroy:
    short_description: Remove one frozen managed artifact server and prove its absence.
    options: *artifact_server_request
