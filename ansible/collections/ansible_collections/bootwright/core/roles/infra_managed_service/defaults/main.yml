---
# Derived from the frozen request only. Nothing here is authored by desired
# state, and no value selects an executable, a role or a task file. The kind
# table in vars selects only templates, keyed by the validated frozen kind.
infra_managed_service_area: "{{ bootwright_managed_service_request.contentRoot.split('/')[5:7] }}"
infra_managed_service_config_dir: '{{ bootwright_managed_service_request.contentRoot }}/config'
infra_managed_service_unit_path: /etc/containers/systemd/{{ bootwright_managed_service_request.unit }}.container
infra_managed_service_configuration_path: '{{ infra_managed_service_config_dir }}/{{ infra_managed_service_implementation.configuration }}'
infra_managed_service_service: '{{ bootwright_managed_service_request.unit }}.service'
# A registry serves from its certificate and password file, each in a private
# directory of its own, and stores what it is pushed under its content root.
infra_managed_service_tls_dir: '{{ bootwright_managed_service_request.contentRoot }}/tls'
infra_managed_service_auth_dir: '{{ bootwright_managed_service_request.contentRoot }}/auth'
infra_managed_service_data_dir: '{{ bootwright_managed_service_request.contentRoot }}/data'
# A registry's container runs at one SELinux level derived from its unit, so
# the storage it writes stays readable across every start.
infra_managed_service_label_level: >-
  {%- set digest = bootwright_managed_service_request.unit | hash('sha256') -%}
  {%- set first = (digest[0:4] | int(base=16)) % 1024 -%}
  {%- set second = (digest[4:8] | int(base=16)) % 1023 -%}
  {%- set second = second + 1 if second >= first else second -%}
  s0:c{{ [first, second] | min }},c{{ [first, second] | max }}
# Whether the running registry answered every probe target with the bound
# credential while presenting the bound certificate.
infra_managed_service_credential_accepted: >-
  {{ (infra_managed_service_accepted.observation.unit | default('')) == 'active'
     and (infra_managed_service_accepted.failures | default(['unproved'])) | length == 0
     and (infra_managed_service_accepted.answers | default([])) | length > 0
     and (infra_managed_service_accepted.answers | default([]) | selectattr('answer', 'equalto', 'certificate-mismatch') | list | length) == 0 }}
infra_managed_service_runs_from: >-
  {{ [infra_managed_service_configuration_path]
     + ([infra_managed_service_tls_dir ~ '/tls.crt', infra_managed_service_tls_dir ~ '/tls.key']
        if bootwright_managed_service_request.tls is defined else [])
     + ([infra_managed_service_auth_dir ~ '/htpasswd']
        if bootwright_managed_service_request.credentialsRef is defined else []) }}
infra_managed_service_listen: >-
  {{ '[' ~ bootwright_managed_service_request.bindAddress ~ ']'
     if ':' in bootwright_managed_service_request.bindAddress
     else bootwright_managed_service_request.bindAddress }}
