---
- name: Validate the frozen managed service request
  ansible.builtin.assert:
    that:
      - >-
        (infra_managed_service_selected | default(bootwright_managed_service_request.implementation))
        in infra_managed_service_implementations
      - >-
        (infra_managed_service_artifact_server and bootwright_managed_service_request.version == 'artifact-server-nginx-v1')
        or (not infra_managed_service_artifact_server and bootwright_managed_service_request.version == 'managed-service-v1')
      - bootwright_managed_service_request.unit is string
      - bootwright_managed_service_request.unit is match('^bootwright-[a-z0-9-]*[a-z0-9]$(?!\n)')
      - bootwright_managed_service_request.unit.startswith('bootwright-' ~ bootwright_managed_service_request.identity.context ~ '-')
      - bootwright_managed_service_request.contentRoot.startswith('/var/lib/bootwright-hosted/')
      - bootwright_managed_service_request.contentRoot.split('/') | length == 8
      - bootwright_managed_service_request.contentRoot.split('/')[3] == 'bootwright-hosted'
      - bootwright_managed_service_request.contentRoot.split('/')[5] == 'services'
      - >-
        bootwright_managed_service_request.contentRoot.split('/')[1:]
        | select('in', ['', '.', '..']) | list | length == 0
      - >-
        (bootwright_managed_service_request.contentRoot | dirname | dirname | dirname)
        == '/var/lib/bootwright-hosted/' ~ bootwright_managed_service_request.identity.context
      - bootwright_managed_service_digest is match('^[0-9a-f]{64}$(?!\n)')
    quiet: true
  no_log: true

- name: Complete the qualified execution handoff
  bootwright.core.infra_service_protocol:
    kind: '{{ infra_managed_service_implementation.protocol }}'
    phase: loaded
  no_log: true

- name: Prove the context's hosted service directories before any effect
  bootwright.core.hosted_area:
    context: '{{ bootwright_managed_service_request.identity.context }}'
    path: '{{ infra_managed_service_area }}'
    state: proved

- name: Report service stop
  bootwright.core.infra_service_protocol:
    kind: '{{ infra_managed_service_implementation.protocol }}'
    phase: group
    group: stop-service
    status: running
  no_log: true

- name: Observe the managed service before removal
  bootwright.core.infra_service_inspect:
    request: '{{ bootwright_managed_service_request }}'
  register: infra_managed_service_before

- name: Stop the managed service
  ansible.builtin.command:
    argv:
      - /usr/bin/systemctl
      - stop
      - '{{ infra_managed_service_service }}'
  when: infra_managed_service_before.observation.unit | length > 0
  changed_when: infra_managed_service_before.observation.unit | length > 0

- name: Report service stop completion
  bootwright.core.infra_service_protocol:
    kind: '{{ infra_managed_service_implementation.protocol }}'
    phase: group
    group: stop-service
    status: ok
  no_log: true

- name: Report configuration removal
  bootwright.core.infra_service_protocol:
    kind: '{{ infra_managed_service_implementation.protocol }}'
    phase: group
    group: remove-configuration
    status: running
  no_log: true

- name: Take back the unit, its container and its content root
  ansible.builtin.include_tasks: unit_removal.yml
  vars:
    infra_managed_service_owned:
      unit: '{{ bootwright_managed_service_request.unit }}'
      service: '{{ infra_managed_service_service }}'
      unit_path: '{{ infra_managed_service_unit_path }}'
      content_root: '{{ bootwright_managed_service_request.contentRoot }}'
      context: '{{ bootwright_managed_service_request.identity.context }}'
      area: '{{ infra_managed_service_area }}'
      container_present: '{{ infra_managed_service_before.observation.containerPresent }}'

- name: Report configuration removal completion
  bootwright.core.infra_service_protocol:
    kind: '{{ infra_managed_service_implementation.protocol }}'
    phase: group
    group: remove-configuration
    status: ok
  no_log: true

- name: Report absence verification
  bootwright.core.infra_service_protocol:
    kind: '{{ infra_managed_service_implementation.protocol }}'
    phase: group
    group: verify-absence
    status: running
  no_log: true

- name: Prove every owned resource is gone
  bootwright.core.infra_service_inspect:
    request: '{{ bootwright_managed_service_request }}'
  register: infra_managed_service_after

- name: Report absence verification completion
  bootwright.core.infra_service_protocol:
    kind: '{{ infra_managed_service_implementation.protocol }}'
    phase: group
    group: verify-absence
    status: ok
  no_log: true

- name: Publish bounded managed service removal evidence
  bootwright.core.infra_service_protocol:
    kind: '{{ infra_managed_service_implementation.protocol }}'
    phase: completed
    outcome: >-
      {{ 'changed'
         if (infra_managed_service_unit_removed is changed
             or infra_managed_service_root_removed is changed
             or infra_managed_service_parents is changed
             or infra_managed_service_reset is changed
             or infra_managed_service_before.observation.unit | length > 0)
         else 'unchanged' }}
    digest: '{{ bootwright_managed_service_digest }}'
    observation: '{{ infra_managed_service_after.observation }}'
    removed: true
  no_log: true
