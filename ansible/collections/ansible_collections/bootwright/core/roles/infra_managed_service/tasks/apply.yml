---
- name: Validate the frozen managed service request
  ansible.builtin.assert:
    that:
      - >-
        (infra_managed_service_selected | default(bootwright_managed_service_request.implementation))
        in infra_managed_service_implementations
      - >-
        (infra_managed_service_artifact_server and bootwright_managed_service_request.version == 'artifact-server-nginx-v1')
        or (not infra_managed_service_artifact_server and bootwright_managed_service_request.version == 'managed-service-v1')
      - bootwright_managed_service_request.unit is string
      - bootwright_managed_service_request.unit is match('^bootwright-[a-z0-9-]*[a-z0-9]$(?!\n)')
      - bootwright_managed_service_request.unit.startswith('bootwright-' ~ bootwright_managed_service_request.identity.context ~ '-')
      - bootwright_managed_service_request.contentRoot.startswith('/var/lib/bootwright-hosted/')
      - bootwright_managed_service_request.contentRoot.split('/') | length == 8
      - bootwright_managed_service_request.contentRoot.split('/')[3] == 'bootwright-hosted'
      - bootwright_managed_service_request.contentRoot.split('/')[5] == 'services'
      - >-
        bootwright_managed_service_request.contentRoot.split('/')[1:]
        | select('in', ['', '.', '..']) | list | length == 0
      - >-
        bootwright_managed_service_request.kind | default('') != 'Registry'
        or bootwright_managed_service_request.labelLevel | default('') is match('^s0:c[0-9]{1,4},c[0-9]{1,4}$(?!\n)')
      - >-
        (bootwright_managed_service_request.contentRoot | dirname | dirname | dirname)
        == '/var/lib/bootwright-hosted/' ~ bootwright_managed_service_request.identity.context
      - bootwright_managed_service_request.image is search('@sha256:[0-9a-f]{64}$(?!\n)')
      - infra_managed_service_artifact_server or bootwright_managed_service_request.port | int > 0
      - not infra_managed_service_artifact_server or bootwright_managed_service_request.listeners | length > 0
      - >-
        bootwright_managed_service_request.destinations | default([]) | to_json(separators=[',', ':'])
        is match('^[][{}a-z0-9.:,"-]*$(?!\n)')
      - >-
        bootwright_managed_service_request.destinations | default([]) | map('dict2items') | map('map', attribute='key')
        | map('sort') | map('join', ',') | reject('in', ['address', 'address,port', 'domain', 'domain,port']) | list | length == 0
      - >-
        bootwright_managed_service_request.destinations | default([]) | selectattr('address', 'defined') | map(attribute='address')
        | reject('match', '^(([0-9]{1,3}[.]){3}[0-9]{1,3}|[0-9a-f.]*:[0-9a-f:.]*)$(?!\n)') | list | length == 0
      - >-
        bootwright_managed_service_request.destinations | default([]) | selectattr('domain', 'defined') | map(attribute='domain')
        | reject('match', '^[.]?[a-z0-9]([a-z0-9-]*[a-z0-9])?([.][a-z0-9]([a-z0-9-]*[a-z0-9])?)*$(?!\n)') | list | length == 0
      - >-
        bootwright_managed_service_request.destinations | default([]) | selectattr('port', 'defined') | map(attribute='port')
        | reject('integer') | list | length == 0
      - >-
        bootwright_managed_service_request.destinations | default([]) | selectattr('port', 'defined') | map(attribute='port')
        | select('integer') | reject('ge', 1) | list | length == 0
      - >-
        bootwright_managed_service_request.destinations | default([]) | selectattr('port', 'defined') | map(attribute='port')
        | select('integer') | reject('le', 65535) | list | length == 0
      - bootwright_managed_service_request | bootwright.core.dns_forward_zones_valid
      - bootwright_managed_service_digest is match('^[0-9a-f]{64}$(?!\n)')
      - >-
        bootwright_managed_service_request.tls is not defined
        or (bootwright_managed_service_material.certificate is defined
            and bootwright_managed_service_material.privateKey is defined)
      - >-
        bootwright_managed_service_request.credentialsRef is not defined
        or (bootwright_managed_service_material.clientUsername is defined
            and bootwright_managed_service_material.clientPassword is defined
            and bootwright_managed_service_material.passwordFile is defined)
    quiet: true
  no_log: true

- name: Complete the qualified execution handoff
  bootwright.core.infra_service_protocol:
    kind: '{{ infra_managed_service_implementation.protocol }}'
    phase: loaded
  no_log: true

- name: Prove the context's hosted service directories before any effect
  bootwright.core.hosted_area:
    context: '{{ bootwright_managed_service_request.identity.context }}'
    path: '{{ infra_managed_service_area }}'
    state: proved

# Nothing installs podman on a Machine reached over SSH, so the service's own
# host proves the executable it runs its container with before any pull,
# publication or start. The runner reports the refusal named first as the
# service's own diagnostic.
- name: Prove the container runtime the service runs under
  ansible.builtin.command:
    argv:
      - /usr/bin/podman
      - --version
  register: infra_managed_service_runtime
  changed_when: false
  failed_when: false

- name: Name a missing container runtime to the runner
  bootwright.core.infra_service_protocol:
    kind: '{{ infra_managed_service_implementation.protocol }}'
    phase: refused
    reason: container-runtime
    port: '{{ infra_managed_service_port }}'
  when: (infra_managed_service_runtime.rc | default(127)) != 0
  no_log: true

- name: Refuse a placement host that cannot run podman
  ansible.builtin.fail:
    msg: >-
      the placement host has no working /usr/bin/podman; install the podman package there;
      nothing was pulled, published or started
  when: (infra_managed_service_runtime.rc | default(127)) != 0

# A host reservation compares only the contexts Bootwright coordinates, so a
# socket another daemon holds is proved here, before anything is pulled,
# published or started. The runner reports the refusal named first as the
# service's own diagnostic; the failure that follows names every socket in the
# retained run output.
- name: Observe the sockets the service binds before any effect
  bootwright.core.infra_service_inspect:
    request: '{{ bootwright_managed_service_request }}'
    bind_address: true
    foreign: true
  register: infra_managed_service_sockets

- name: Name a bind address the placement host does not hold to the runner
  bootwright.core.infra_service_protocol:
    kind: '{{ infra_managed_service_implementation.protocol }}'
    phase: refused
    reason: unassigned-bind-address
    port: '{{ infra_managed_service_port }}'
  when: not infra_managed_service_sockets.bindAddressAssigned
  no_log: true

- name: Refuse an unassigned bind address
  ansible.builtin.fail:
    msg: >-
      the placement host has no usable local address {{ bootwright_managed_service_request.bindAddress }};
      nothing was pulled, published or started
  when: not infra_managed_service_sockets.bindAddressAssigned

- name: Name a listener the service does not own to the runner
  bootwright.core.infra_service_protocol:
    kind: '{{ infra_managed_service_implementation.protocol }}'
    phase: refused
    reason: foreign-listener
    port: '{{ infra_managed_service_sockets.foreign[0].port }}'
  when: infra_managed_service_sockets.foreign | length > 0
  no_log: true

- name: Refuse a listener the service does not own
  ansible.builtin.fail:
    msg: >-
      something other than this service already listens where it binds;
      nothing was pulled, published or started:
      {% for socket in infra_managed_service_sockets.foreign %}{{ socket.transport }}
      {{ ('[' ~ socket.address ~ ']') if ':' in socket.address else socket.address }}:{{ socket.port
      }}{{ '' if loop.last else '; ' }}{% endfor %}
  when: infra_managed_service_sockets.foreign | length > 0

- name: Report image acquisition
  bootwright.core.infra_service_protocol:
    kind: '{{ infra_managed_service_implementation.protocol }}'
    phase: group
    group: pull-image
    status: running
  no_log: true

- name: Acquire the pinned image
  ansible.builtin.include_tasks: image_pull.yml
  vars:
    infra_managed_service_image:
      image: '{{ bootwright_managed_service_request.image }}'
      egress: '{{ bootwright_managed_service_request.egress }}'
      host: '{{ bootwright_managed_service_request.imageSource.host | default("") }}'
      material: '{{ bootwright_managed_service_material }}'

- name: Report image acquisition completion
  bootwright.core.infra_service_protocol:
    kind: '{{ infra_managed_service_implementation.protocol }}'
    phase: group
    group: pull-image
    status: ok
  no_log: true

- name: Report configuration publication
  bootwright.core.infra_service_protocol:
    kind: '{{ infra_managed_service_implementation.protocol }}'
    phase: group
    group: publish-configuration
    status: running
  no_log: true

- name: Create the context's private hosted service directories top-down
  bootwright.core.hosted_area:
    context: '{{ bootwright_managed_service_request.identity.context }}'
    path: '{{ infra_managed_service_area }}'
    state: present

- name: Create the owned service directories
  ansible.builtin.file:
    path: '{{ item }}'
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop: >-
    {{ [bootwright_managed_service_request.contentRoot, infra_managed_service_config_dir]
       + ([infra_managed_service_served_dir] if infra_managed_service_artifact_server else []) }}
  register: infra_managed_service_directories

- name: Create the implementation's private directories
  ansible.builtin.file:
    path: '{{ bootwright_managed_service_request.contentRoot }}/{{ item }}'
    state: directory
    owner: root
    group: root
    mode: '0700'
  loop: '{{ infra_managed_service_private_directories }}'
  register: infra_managed_service_private_directories

# A registry's storage keeps one SELinux label for its whole life: the unit
# pins its level and mounts the directory without relabeling, so a start never
# walks a store that may be large. The apply relabels it, recursively, only when
# something in it carries another label, as a forced relabel of the host leaves
# every blob it held.
- name: Observe whether the placement host labels files for SELinux
  ansible.builtin.stat:
    path: /sys/fs/selinux/enforce
    get_checksum: false
  register: infra_managed_service_selinux
  when: "'data' in (infra_managed_service_implementation.private_directories | default([]))"

- name: Find the first storage entry another label holds
  ansible.builtin.command:
    argv:
      - /usr/bin/find
      - '{{ infra_managed_service_data_dir }}'
      - '!'
      - -context
      - '*:container_file_t:{{ infra_managed_service_label_level }}'
      - -print
      - -quit
  register: infra_managed_service_data_mislabeled
  when: infra_managed_service_selinux.stat.exists | default(false)
  changed_when: false

- name: Label the storage at the level its unit pins
  ansible.builtin.command:
    argv:
      - /usr/bin/chcon
      - --recursive
      - --type=container_file_t
      - --range={{ infra_managed_service_label_level }}
      - '{{ infra_managed_service_data_dir }}'
  register: infra_managed_service_data_labeled
  when:
    - infra_managed_service_selinux.stat.exists | default(false)
    - (infra_managed_service_data_mislabeled.stdout | default('')) | length > 0
  changed_when: true

# The serving material and the client credential reach the placement host
# inside the module's own argument, so they cross a remote connection only in
# the pipelined module payload and never in a file transfer. The artifact
# server's workers read its certificate, so only its key is kept private.
- name: Publish the serving certificate
  bootwright.core.private_file:
    content: "{{ lookup('ansible.builtin.file', bootwright_managed_service_material.certificate, rstrip=false) }}"
    path: '{{ infra_managed_service_certificate_path }}'
    mode: "{{ infra_managed_service_implementation.certificate_mode | default(omit) }}"
  register: infra_managed_service_certificate
  when: bootwright_managed_service_request.tls is defined
  no_log: true
  diff: false

- name: Publish the serving private key
  bootwright.core.private_file:
    content: "{{ lookup('ansible.builtin.file', bootwright_managed_service_material.privateKey, rstrip=false) }}"
    path: '{{ infra_managed_service_key_path }}'
  register: infra_managed_service_key
  when: bootwright_managed_service_request.tls is defined
  no_log: true
  diff: false

# bcrypt salts every derivation afresh, so the file the controller lends never
# equals the published one, and this host does no cryptography. The running
# registry is its own verifier: when it already answers the bound credential,
# presenting the bound certificate, its file is kept and nothing restarts.
- name: Ask the running registry whether it already accepts the bound credential
  bootwright.core.infra_service_inspect:
    request: '{{ bootwright_managed_service_request }}'
    readiness: true
    attempts: 1
    authorization: >-
      {{ (lookup('ansible.builtin.file', material.clientUsername, rstrip=false) ~ ':'
          ~ lookup('ansible.builtin.file', material.clientPassword, rstrip=false)) | b64encode }}
    fingerprint: '{{ material.fingerprint | default("") }}'
  vars:
    material: '{{ bootwright_managed_service_material }}'
  register: infra_managed_service_accepted
  when: bootwright_managed_service_request.credentialsRef is defined
  no_log: true

- name: Publish the registry's password file
  bootwright.core.private_file:
    content: "{{ lookup('ansible.builtin.file', bootwright_managed_service_material.passwordFile, rstrip=false) }}"
    path: '{{ infra_managed_service_auth_dir }}/htpasswd'
  register: infra_managed_service_password_publication
  when:
    - bootwright_managed_service_request.credentialsRef is defined
    - not infra_managed_service_credential_accepted
  no_log: true
  diff: false

- name: Publish the service configuration
  ansible.builtin.template:
    src: '{{ infra_managed_service_implementation.configuration_template }}'
    dest: '{{ infra_managed_service_configuration_path }}'
    owner: root
    group: root
    mode: '0644'
  register: infra_managed_service_configuration

- name: Publish the container unit definition
  ansible.builtin.template:
    src: '{{ infra_managed_service_implementation.unit_template }}'
    dest: '{{ infra_managed_service_unit_path }}'
    owner: root
    group: root
    mode: '0644'
  register: infra_managed_service_unit

- name: Reload the host service manager so the unit generator runs
  ansible.builtin.command:
    argv:
      - /usr/bin/systemctl
      - daemon-reload
  changed_when: false

- name: Report configuration publication completion
  bootwright.core.infra_service_protocol:
    kind: '{{ infra_managed_service_implementation.protocol }}'
    phase: group
    group: publish-configuration
    status: ok
  no_log: true

- name: Report service start
  bootwright.core.infra_service_protocol:
    kind: '{{ infra_managed_service_implementation.protocol }}'
    phase: group
    group: start-service
    status: running
  no_log: true

- name: Observe the service before starting it
  bootwright.core.infra_service_inspect:
    request: '{{ bootwright_managed_service_request }}'
  register: infra_managed_service_before

- name: Start the service, or restart it on a file newer than its start
  ansible.builtin.include_tasks: unit_start.yml
  vars:
    infra_managed_service_start:
      unit: '{{ bootwright_managed_service_request.unit }}'
      service: '{{ infra_managed_service_service }}'
      active: "{{ infra_managed_service_before.observation.unit == 'active' }}"
      runs_from: >-
        {{ infra_managed_service_runs_from + [infra_managed_service_unit_path] }}
      published: >-
        {{ infra_managed_service_configuration is changed or infra_managed_service_unit is changed
           or infra_managed_service_certificate is changed or infra_managed_service_key is changed
           or infra_managed_service_password_publication is changed }}

- name: Report service start completion
  bootwright.core.infra_service_protocol:
    kind: '{{ infra_managed_service_implementation.protocol }}'
    phase: group
    group: start-service
    status: ok
  no_log: true

- name: Report readiness verification
  bootwright.core.infra_service_protocol:
    kind: '{{ infra_managed_service_implementation.protocol }}'
    phase: group
    group: verify-readiness
    status: running
  no_log: true

# A service with a client credential is probed under no_log, which would also
# hide every other service's readiness failures, so only it is.
- name: Prove the managed service answers on every declared address
  bootwright.core.infra_service_inspect:
    request: '{{ bootwright_managed_service_request }}'
    runs_from: '{{ omit if infra_managed_service_artifact_server else infra_managed_service_runs_from }}'
    readiness: true
    fingerprint: '{{ infra_managed_service_bound_fingerprint if infra_managed_service_artifact_server else omit }}'
  register: infra_managed_service_after_open
  when: bootwright_managed_service_request.credentialsRef is not defined

- name: Prove the managed service answers on every declared address with its client credential
  bootwright.core.infra_service_inspect:
    request: '{{ bootwright_managed_service_request }}'
    runs_from: '{{ infra_managed_service_runs_from }}'
    readiness: true
    authorization: >-
      {{ (lookup('ansible.builtin.file', material.clientUsername, rstrip=false) ~ ':'
          ~ lookup('ansible.builtin.file', material.clientPassword, rstrip=false)) | b64encode }}
    fingerprint: '{{ material.fingerprint | default("") }}'
  vars:
    material: '{{ bootwright_managed_service_material }}'
  register: infra_managed_service_after_hidden
  when: bootwright_managed_service_request.credentialsRef is defined
  no_log: true

- name: Keep the inspection this service ran
  ansible.builtin.set_fact:
    infra_managed_service_after: >-
      {{ infra_managed_service_after_hidden if bootwright_managed_service_request.credentialsRef is defined
         else infra_managed_service_after_open }}

- name: Report the classified readiness refusal
  bootwright.core.infra_service_protocol:
    kind: '{{ infra_managed_service_implementation.protocol }}'
    phase: refused
    reason: '{{ infra_managed_service_after.failures[0].reason }}'
    port: '{{ infra_managed_service_after.failures[0].port }}'
  when: infra_managed_service_after.failures | length > 0
  no_log: true

- name: Refuse an unproved address
  ansible.builtin.assert:
    that:
      - infra_managed_service_after.unproved | length == 0
    fail_msg: >-
      a declared {{ 'artifact-server listener' if infra_managed_service_artifact_server else 'managed service address' }}
      did not answer within its readiness window: {{ infra_managed_service_after.unproved | join("; ") }}
    quiet: true

- name: Report readiness completion
  bootwright.core.infra_service_protocol:
    kind: '{{ infra_managed_service_implementation.protocol }}'
    phase: group
    group: verify-readiness
    status: ok
  no_log: true

- name: Publish bounded managed service completion evidence
  bootwright.core.infra_service_protocol:
    kind: '{{ infra_managed_service_implementation.protocol }}'
    phase: completed
    outcome: >-
      {{ 'changed'
         if (infra_managed_service_directories is changed
             or infra_managed_service_private_directories is changed
             or infra_managed_service_data_labeled is changed
             or infra_managed_service_certificate is changed
             or infra_managed_service_key is changed
             or infra_managed_service_password_publication is changed
             or infra_managed_service_configuration is changed
             or infra_managed_service_unit is changed
             or infra_managed_service_restart is changed
             or infra_managed_service_pull is changed
             or infra_managed_service_before.observation.unit != 'active')
         else 'unchanged' }}
    digest: '{{ bootwright_managed_service_digest }}'
    observation: '{{ infra_managed_service_after.observation }}'
    answers: '{{ infra_managed_service_after.answers | default(omit) }}'
    listeners: '{{ infra_managed_service_after.listeners | default(omit) }}'
  no_log: true
