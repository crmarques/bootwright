---
- name: Complete the qualified execution handoff
  bootwright.core.infra_service_protocol:
    phase: loaded
  no_log: true

- name: Observe the managed service without changing it
  bootwright.core.infra_service_inspect:
    request: '{{ bootwright_managed_service_request }}'
    runs_from:
      - '{{ infra_managed_service_configuration_path }}'
    readiness: true
    attempts: 1
  register: infra_managed_service_observation

- name: Publish bounded managed service observation evidence
  bootwright.core.infra_service_protocol:
    phase: completed
    observed: true
    outcome: unchanged
    digest: '{{ bootwright_managed_service_digest }}'
    observation: '{{ infra_managed_service_observation.observation }}'
    answers: '{{ infra_managed_service_observation.answers }}'
    removed: >-
      {{ not infra_managed_service_observation.observation.unit
         and not infra_managed_service_observation.observation.containerPresent
         and not infra_managed_service_observation.observation.contentRoot }}
  no_log: true
