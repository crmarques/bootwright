---
# Takes back one managed unit's definition, failed state, container and
# content root, and then its kind's, the services' and the context's
# directories once empty. Every role running a managed container unit removes
# it through this file, keyed by infra_managed_service_owned (unit, service,
# unit_path, content_root, context, area, container_present) alone.
- name: Remove the container unit definition
  ansible.builtin.file:
    path: '{{ infra_managed_service_owned.unit_path }}'
    state: absent
  register: infra_managed_service_unit_removed

- name: Reload the host service manager so the unit generator runs
  ansible.builtin.command:
    argv:
      - /usr/bin/systemctl
      - daemon-reload
  changed_when: false

# As systemd documents, a unit whose daemon exited at every start until its
# start limit stays listed failed after its stop and its definition's removal,
# until it is reset. `systemctl show` prints ActiveState=inactive for a unit
# that is not loaded, so such a unit is never reset, and a reset that finds the
# unit unloaded meanwhile ("Unit ... not loaded.") is tolerated.
- name: Observe whether systemd still lists the removed unit failed
  ansible.builtin.command:
    argv:
      - /usr/bin/systemctl
      - show
      - --property=ActiveState
      - --value
      - '{{ infra_managed_service_owned.service }}'
  environment:
    LC_ALL: C
  register: infra_managed_service_listed
  changed_when: false

- name: Reset the failed state the removed unit is still listed in
  ansible.builtin.command:
    argv:
      - /usr/bin/systemctl
      - reset-failed
      - '{{ infra_managed_service_owned.service }}'
  environment:
    LC_ALL: C
  when: infra_managed_service_listed.stdout == 'failed'
  register: infra_managed_service_reset
  changed_when: infra_managed_service_reset.rc == 0
  failed_when:
    - infra_managed_service_reset.rc != 0
    - '"not loaded" not in infra_managed_service_reset.stderr'

- name: Remove a container the stopped unit left behind
  ansible.builtin.command:
    argv:
      - /usr/bin/podman
      - rm
      - --force
      - --ignore
      - '{{ infra_managed_service_owned.unit }}'
  when: infra_managed_service_owned.container_present
  changed_when: infra_managed_service_owned.container_present

- name: Remove the owned content root
  ansible.builtin.file:
    path: '{{ infra_managed_service_owned.content_root }}'
    state: absent
  register: infra_managed_service_root_removed

# The content root is <hosted root>/<context>/services/<kind>/<name>, as the
# entry point's validation requires, so these are the kind's, the services'
# and the context's directories, each removed only once empty and never
# recursively; the hosted root itself is never reached.
- name: Remove the service's and the context's directories once empty
  bootwright.core.hosted_area:
    context: '{{ infra_managed_service_owned.context }}'
    path: '{{ infra_managed_service_owned.area }}'
    state: absent
  register: infra_managed_service_parents
