---
# Fixed by the role, never authored. Each managed network service
# implementation selects only its daemon configuration and unit templates;
# every task is shared.
infra_managed_service_implementations:
  dns-server-dnsmasq-v1:
    configuration: dnsmasq.conf
    configuration_template: dnsmasq.conf.j2
    unit_template: dnsmasq.container.j2
  ntp-server-chrony-v1:
    configuration: chrony.conf
    configuration_template: chrony.conf.j2
    unit_template: chrony.container.j2
  proxy-squid-v1:
    configuration: squid.conf
    configuration_template: squid.conf.j2
    unit_template: squid.container.j2
infra_managed_service_implementation: >-
  {{ infra_managed_service_implementations[bootwright_managed_service_request.implementation] }}
