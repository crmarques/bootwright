---
# Shared post-boot SSH readiness probe: waits for the node's SSH TCP port,
# then verifies the configured private key authenticates. Read-only — every
# probe is changed_when: false and no host state is mutated.
#
# Driven by the rendered boot.readiness block plus explicit caller vars:
#   bootwright_ssh_ready_readiness                rendered readiness mapping ({} tolerated)
#   bootwright_ssh_ready_node_name                node name for failure reporting
#   bootwright_ssh_ready_address                  probe address ('' skips all probes)
#   bootwright_ssh_ready_default_port             port when readiness.ssh.port is unset
#   bootwright_ssh_ready_key_path                 private key path ('' skips auth verification)
#   bootwright_ssh_ready_known_hosts_path         throwaway known_hosts for the auth probe
#   bootwright_ssh_ready_port_timeout_seconds     TCP port wait timeout
#   bootwright_ssh_ready_connect_timeout_seconds  per-attempt SSH connect timeout
#   bootwright_ssh_ready_auth_retries             auth probe retries
#   bootwright_ssh_ready_auth_delay_seconds       delay between auth probe retries
#   bootwright_ssh_ready_reject_hint              substrate-specific guidance appended
#                                                 to the key-rejection failure message

- name: Resolve post-boot readiness behavior
  ansible.builtin.set_fact:
    bootwright_ssh_ready_type: "{{ bootwright_ssh_ready_readiness.type | default('ssh') }}"
  changed_when: false

- name: Validate post-boot readiness behavior
  ansible.builtin.assert:
    that:
      - bootwright_ssh_ready_readiness is mapping
      - bootwright_ssh_ready_type in ['none', 'ssh']
    fail_msg: "Unsupported boot readiness type {{ bootwright_ssh_ready_type }}"

- name: Probe node readiness over SSH
  when: bootwright_ssh_ready_type == 'ssh'
  block:
    - name: Resolve node readiness probe inputs
      ansible.builtin.set_fact:
        bootwright_ssh_ready_port_effective: "{{ (bootwright_ssh_ready_readiness.ssh | default({})).port | default(bootwright_ssh_ready_default_port) }}"
        bootwright_ssh_ready_user: "{{ (bootwright_ssh_ready_readiness.ssh | default({})).user | default('core') }}"
      changed_when: false

    # During internal local-root runs the key probe must execute as the
    # invoking user — file-backed keys live in the caller's home, which
    # root may not read on every filesystem.
    - name: Resolve node SSH auth probe key execution context
      ansible.builtin.set_fact:
        bootwright_ssh_ready_key_exec_user: >-
          {{
            ('#' ~ lookup('env', 'SUDO_UID'))
            if ((lookup('env', 'BOOTWRIGHT_INTERNAL_LOCAL_ROOT') | default('', true)) == '1'
                and ((lookup('env', 'SUDO_UID') | default('', true)) | length) > 0)
            else ''
          }}
        bootwright_ssh_ready_key_command_prefix: []
      changed_when: false

    - name: Resolve node SSH auth probe key caller command prefix
      ansible.builtin.set_fact:
        bootwright_ssh_ready_key_command_prefix:
          - sudo
          - -n
          - -u
          - "{{ bootwright_ssh_ready_key_exec_user }}"
          - --
      changed_when: false
      when: (bootwright_ssh_ready_key_exec_user | length) > 0

    - name: Wait for node SSH to confirm live ISO boot complete
      ansible.builtin.wait_for:
        host: "{{ bootwright_ssh_ready_address }}"
        port: "{{ bootwright_ssh_ready_port_effective | int }}"
        timeout: "{{ bootwright_ssh_ready_port_timeout_seconds | int }}"
      when: (bootwright_ssh_ready_address | length) > 0

    - name: Check node SSH auth probe key
      ansible.builtin.command:
        argv: "{{ bootwright_ssh_ready_key_command_prefix + ['test', '-f', bootwright_ssh_ready_key_path] }}"
      register: bootwright_ssh_ready_key_check
      changed_when: false
      failed_when: false
      when:
        - (bootwright_ssh_ready_address | length) > 0
        - (bootwright_ssh_ready_key_path | length) > 0

    - name: Wait for node SSH to accept configured key
      ansible.builtin.command:
        argv: >-
          {{
            bootwright_ssh_ready_key_command_prefix
            + [
              'ssh',
              '-i',
              bootwright_ssh_ready_key_path,
              '-o',
              'BatchMode=yes',
              '-o',
              'StrictHostKeyChecking=accept-new',
              '-o',
              'UserKnownHostsFile=' ~ bootwright_ssh_ready_known_hosts_path,
              '-o',
              'ConnectTimeout=' ~ (bootwright_ssh_ready_connect_timeout_seconds | int),
              '-o',
              'ConnectionAttempts=1',
              '-p',
              bootwright_ssh_ready_port_effective | string,
              bootwright_ssh_ready_user ~ '@' ~ bootwright_ssh_ready_address,
              'true'
            ]
          }}
      register: bootwright_ssh_ready_auth
      changed_when: false
      failed_when: false
      until: (bootwright_ssh_ready_auth.rc | default(1) | int) == 0
      retries: "{{ bootwright_ssh_ready_auth_retries | int }}"
      delay: "{{ bootwright_ssh_ready_auth_delay_seconds | int }}"
      when:
        - (bootwright_ssh_ready_address | length) > 0
        - (bootwright_ssh_ready_key_check.rc | default(1) | int) == 0

    - name: Confirm node SSH accepted configured key
      ansible.builtin.assert:
        that:
          - (bootwright_ssh_ready_auth.rc | default(1) | int) == 0
        fail_msg: >-
          Node {{ bootwright_ssh_ready_node_name }} at {{ bootwright_ssh_ready_address }}
          answered TCP/{{ bootwright_ssh_ready_port_effective | int }} but rejected the
          {{ bootwright_ssh_ready_user }} SSH key {{ bootwright_ssh_ready_key_path }}.
          {{ bootwright_ssh_ready_reject_hint }}
      when:
        - (bootwright_ssh_ready_address | length) > 0
        - (bootwright_ssh_ready_key_check.rc | default(1) | int) == 0
