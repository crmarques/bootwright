---
- name: Validate the frozen provider host request
  ansible.builtin.assert:
    that:
      - bootwright_substrate_host_request.version == 'substrate-host-libvirt-v2'
      - bootwright_substrate_host_request.uri is string
      - bootwright_substrate_host_request.poolPath.startswith('/var/lib/libvirt/images/bootwright/')
      - bootwright_substrate_host_digest is match('[0-9a-f]{64}')
    quiet: true
  no_log: true

- name: Complete the qualified execution handoff
  bootwright.core.substrate_host_protocol:
    phase: loaded
  no_log: true

- name: Report hypervisor preparation
  bootwright.core.substrate_host_protocol:
    phase: group
    group: install-hypervisor
    status: running
  no_log: true

- name: Observe the provider host before changing it
  bootwright.core.libvirt_host_inspect:
    request: '{{ bootwright_substrate_host_request }}'
  register: substrate_libvirt_host_before

- name: Install the hypervisor closure this provider runs
  ansible.builtin.command:
    argv:
      - /usr/bin/dnf
      - --assumeyes
      - --setopt=install_weak_deps=False
      - install
      - '{{ item }}'
  loop: '{{ bootwright_substrate_host_request.packages }}'
  register: substrate_libvirt_host_packages
  when:
    - bootwright_substrate_host_request.provisioned
    - not substrate_libvirt_host_before.observation.hypervisor
  changed_when: not substrate_libvirt_host_before.observation.hypervisor

# On the controller the closure is a context prerequisite the controller stage
# installs, so this block proves it and installs nothing. Failing here names the
# command that supplies it rather than letting the daemon fail obscurely.
- name: Prove the hypervisor closure a controller-hosted provider was given
  ansible.builtin.fail:
    msg: >-
      the hypervisor closure is not installed on this controller; run
      bootwright apply --stage controller before realizing this provider host
  when:
    - not bootwright_substrate_host_request.provisioned
    - not substrate_libvirt_host_before.observation.hypervisor

- name: Enable and start each libvirt driver daemon this provider depends on
  ansible.builtin.command:
    argv:
      - /usr/bin/systemctl
      - enable
      - --now
      - '{{ item.name }}'
  loop: '{{ substrate_libvirt_host_before.observation.services }}'
  loop_control:
    label: '{{ item.name }}'
  register: substrate_libvirt_host_daemon
  when: item.state != 'active' or not item.enabled
  changed_when: item.state != 'active' or not item.enabled

- name: Prove the declared connection answers before defining anything
  ansible.builtin.command:
    argv:
      - /usr/bin/virsh
      - --connect
      - '{{ bootwright_substrate_host_request.uri }}'
      - version
  register: substrate_libvirt_host_connection
  retries: 30
  delay: 2
  until: substrate_libvirt_host_connection.rc == 0
  changed_when: false

# The first observation was taken before the driver daemons ran, and a driver
# that was stopped then answered for none of its networks or its pool, which
# reads exactly as nothing defined: the foreign-network guard would pass, a
# definition would drop the identity libvirt holds, and a pool the host carries
# would be defined again. Every network and pool decision below reads this one.
- name: Observe the provider host once its drivers run
  bootwright.core.libvirt_host_inspect:
    request: '{{ bootwright_substrate_host_request }}'
  register: substrate_libvirt_host_running

# A driver that still does not answer proves neither presence nor absence, so
# the apply refuses before it defines anything and names that driver.
- name: Refuse to define a network its driver did not answer for
  ansible.builtin.assert:
    that:
      - item.answered
    fail_msg: >-
      the libvirt network driver (virtnetworkd) behind
      {{ bootwright_substrate_host_request.uri }} did not answer for network
      {{ item.name }}, so nothing proves whether it exists; restore that
      driver and repeat the apply
    quiet: true
  loop: '{{ substrate_libvirt_host_running.observation.networks }}'
  loop_control:
    label: '{{ item.name }}'
  when: item.managed

- name: Refuse to define a pool its driver did not answer for
  ansible.builtin.assert:
    that:
      - substrate_libvirt_host_running.observation.poolAnswered
    fail_msg: >-
      the libvirt storage driver (virtstoraged) behind
      {{ bootwright_substrate_host_request.uri }} did not answer for pool
      {{ bootwright_substrate_host_request.poolName }}, so nothing proves
      whether it exists; restore that driver and repeat the apply
    quiet: true

- name: Report hypervisor preparation completion
  bootwright.core.substrate_host_protocol:
    phase: group
    group: install-hypervisor
    status: ok
  no_log: true

- name: Report network definition
  bootwright.core.substrate_host_protocol:
    phase: group
    group: define-networks
    status: running
  no_log: true

- name: Refuse a same-named network this context does not own
  ansible.builtin.assert:
    that:
      - item.state | length == 0 or item.owned
    fail_msg: a libvirt network of the same name exists without this context's ownership
    quiet: true
  loop: '{{ substrate_libvirt_host_running.observation.networks }}'
  loop_control:
    label: '{{ item.name }}'
  when: item.managed

- name: Prove every external bridge this provider requires is present
  ansible.builtin.assert:
    that:
      - item.bridge
    fail_msg: an external attachment names a bridge this host does not carry
    quiet: true
  loop: '{{ substrate_libvirt_host_running.observation.networks }}'
  loop_control:
    label: '{{ item.name }}'
  when: not item.managed

- name: Create the private definition directory
  ansible.builtin.file:
    path: '{{ substrate_libvirt_host_definitions }}'
    state: directory
    owner: root
    group: root
    mode: '0700'
  changed_when: false

- name: Publish each managed network definition
  ansible.builtin.template:
    src: network.xml.j2
    dest: '{{ substrate_libvirt_host_definitions }}/{{ item.name }}.xml'
    owner: root
    group: root
    mode: '0600'
  loop: '{{ substrate_libvirt_host_managed }}'
  loop_control:
    label: '{{ item.name }}'
  changed_when: false

- name: Define each managed network from its frozen definition
  ansible.builtin.command:
    argv:
      - /usr/bin/virsh
      - --connect
      - '{{ bootwright_substrate_host_request.uri }}'
      - net-define
      - '{{ substrate_libvirt_host_definitions }}/{{ item.name }}.xml'
  loop: '{{ substrate_libvirt_host_managed }}'
  loop_control:
    label: '{{ item.name }}'
  changed_when: false

- name: Autostart each managed network
  ansible.builtin.command:
    argv:
      - /usr/bin/virsh
      - --connect
      - '{{ bootwright_substrate_host_request.uri }}'
      - net-autostart
      - '{{ item.name }}'
  loop: '{{ substrate_libvirt_host_managed }}'
  loop_control:
    label: '{{ item.name }}'
  changed_when: false

- name: Start each managed network
  ansible.builtin.command:
    argv:
      - /usr/bin/virsh
      - --connect
      - '{{ bootwright_substrate_host_request.uri }}'
      - net-start
      - '{{ item.name }}'
  loop: '{{ substrate_libvirt_host_managed }}'
  loop_control:
    label: '{{ item.name }}'
  register: substrate_libvirt_host_started
  failed_when:
    - substrate_libvirt_host_started.rc != 0
    - '"already active" not in substrate_libvirt_host_started.stderr'
  changed_when: substrate_libvirt_host_started.rc == 0

- name: Remove the private definition directory
  ansible.builtin.file:
    path: '{{ substrate_libvirt_host_definitions }}'
    state: absent
  changed_when: false

- name: Report network definition completion
  bootwright.core.substrate_host_protocol:
    phase: group
    group: define-networks
    status: ok
  no_log: true

- name: Report pool definition
  bootwright.core.substrate_host_protocol:
    phase: group
    group: define-pool
    status: running
  no_log: true

- name: Create the virtual-media pool directory
  ansible.builtin.file:
    path: '{{ bootwright_substrate_host_request.poolPath }}'
    state: directory
    owner: root
    group: root
    mode: '0755'
  register: substrate_libvirt_host_pool_directory

- name: Define the virtual-media pool
  ansible.builtin.command:
    argv:
      - /usr/bin/virsh
      - --connect
      - '{{ bootwright_substrate_host_request.uri }}'
      - pool-define-as
      - '{{ bootwright_substrate_host_request.poolName }}'
      - dir
      - --target
      - '{{ bootwright_substrate_host_request.poolPath }}'
  when: substrate_libvirt_host_running.observation.pool | length == 0
  changed_when: substrate_libvirt_host_running.observation.pool | length == 0

- name: Autostart the virtual-media pool
  ansible.builtin.command:
    argv:
      - /usr/bin/virsh
      - --connect
      - '{{ bootwright_substrate_host_request.uri }}'
      - pool-autostart
      - '{{ bootwright_substrate_host_request.poolName }}'
  changed_when: false

- name: Start the virtual-media pool
  ansible.builtin.command:
    argv:
      - /usr/bin/virsh
      - --connect
      - '{{ bootwright_substrate_host_request.uri }}'
      - pool-start
      - '{{ bootwright_substrate_host_request.poolName }}'
  register: substrate_libvirt_host_pool_started
  failed_when:
    - substrate_libvirt_host_pool_started.rc != 0
    - '"already active" not in substrate_libvirt_host_pool_started.stderr'
  changed_when: substrate_libvirt_host_pool_started.rc == 0

- name: Report pool definition completion
  bootwright.core.substrate_host_protocol:
    phase: group
    group: define-pool
    status: ok
  no_log: true

- name: Prove the provider host carries everything the request froze
  bootwright.core.libvirt_host_inspect:
    request: '{{ bootwright_substrate_host_request }}'
  register: substrate_libvirt_host_after

- name: Publish bounded provider host completion evidence
  bootwright.core.substrate_host_protocol:
    phase: completed
    outcome: >-
      {{ 'changed'
         if (substrate_libvirt_host_packages is changed
             or substrate_libvirt_host_daemon is changed
             or substrate_libvirt_host_pool_directory is changed
             or substrate_libvirt_host_running.observation.pool != 'active'
             or substrate_libvirt_host_incomplete_networks | length > 0)
         else 'unchanged' }}
    digest: '{{ bootwright_substrate_host_digest }}'
    observation: '{{ substrate_libvirt_host_after.observation }}'
  no_log: true
