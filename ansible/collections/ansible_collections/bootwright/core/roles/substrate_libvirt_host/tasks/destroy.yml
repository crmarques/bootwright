---
- name: Validate the frozen provider host request
  ansible.builtin.assert:
    that:
      - bootwright_substrate_host_request.version == 'substrate-host-libvirt-v2'
      - bootwright_substrate_host_request.identity.context is match('^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$(?!\n)')
      - bootwright_substrate_host_request.identity.object is match('^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$(?!\n)')
      - bootwright_substrate_host_request.poolPath == '/var/lib/libvirt/images/bootwright/'
        ~ bootwright_substrate_host_request.identity.context ~ '/providers/' ~ bootwright_substrate_host_request.identity.object ~ '/vmedia'
      - bootwright_substrate_host_digest is match('^[0-9a-f]{64}$(?!\n)')
    quiet: true
  no_log: true

- name: Complete the qualified execution handoff
  bootwright.core.substrate_host_protocol:
    phase: loaded
  no_log: true

- name: Report network removal
  bootwright.core.substrate_host_protocol:
    phase: group
    group: remove-networks
    status: running
  no_log: true

- name: Observe the provider host before removal
  bootwright.core.libvirt_host_inspect:
    request: '{{ bootwright_substrate_host_request }}'
  register: substrate_libvirt_host_before

# A connection that does not answer reports no network and no pool either, which
# the guard and the owned-network list below read as nothing this context owns.
# Nothing then proves which of them remain, so the removal refuses before its
# first effect and names the connection.
- name: Refuse to remove a provider host its hypervisor did not answer for
  ansible.builtin.assert:
    that:
      - substrate_libvirt_host_before.observation.uri
    fail_msg: >-
      the hypervisor at {{ bootwright_substrate_host_request.uri }} did not
      answer, so nothing proves which of its networks and pool remain; restore
      that connection and repeat the removal
    quiet: true

# The uri answering proves only that the hypervisor driver did. Each network
# and the pool are read through the driver that owns it, a daemon of its own
# that may be silent meanwhile, and a lookup it never answered reads exactly as
# one that found nothing. The removal refuses before its first effect and names
# the driver rather than reading that silence as nothing left to remove.
- name: Refuse to remove a network its driver did not answer for
  ansible.builtin.assert:
    that:
      - item.answered
    fail_msg: >-
      the libvirt network driver (virtnetworkd) behind
      {{ bootwright_substrate_host_request.uri }} did not answer for network
      {{ item.name }}, so nothing proves whether it remains; restore that
      driver and repeat the removal
    quiet: true
  loop: '{{ substrate_libvirt_host_before.observation.networks }}'
  loop_control:
    label: '{{ item.name }}'
  when: item.managed

- name: Refuse to remove a pool its driver did not answer for
  ansible.builtin.assert:
    that:
      - substrate_libvirt_host_before.observation.poolAnswered
    fail_msg: >-
      the libvirt storage driver (virtstoraged) behind
      {{ bootwright_substrate_host_request.uri }} did not answer for pool
      {{ bootwright_substrate_host_request.poolName }}, so nothing proves
      whether it remains; restore that driver and repeat the removal
    quiet: true

- name: Refuse to remove a same-named network this context does not own
  ansible.builtin.assert:
    that:
      - item.state | length == 0 or item.owned
    fail_msg: >-
      a libvirt network named {{ item.name }} exists without this context's
      ownership; remove or rename it, then repeat the removal
    quiet: true
  loop: '{{ substrate_libvirt_host_before.observation.networks }}'
  loop_control:
    label: '{{ item.name }}'
  when: item.managed

# A same-named pool targeting another directory is not this provider's, and
# the removal refuses before its first effect rather than stop or undefine it.
- name: Refuse to remove a same-named pool that targets another directory
  ansible.builtin.assert:
    that:
      - substrate_libvirt_host_before.observation.pool | length == 0 or substrate_libvirt_host_before.observation.poolOwned
    fail_msg: >-
      a libvirt storage pool named {{ bootwright_substrate_host_request.poolName }}
      exists and does not target {{ bootwright_substrate_host_request.poolPath }},
      so it is not this provider's; remove or rename it, then repeat the removal
    quiet: true

- name: Refuse to remove a foreign or unknown firewall readiness barrier
  ansible.builtin.assert:
    that:
      - substrate_libvirt_host_before.observation.firewallReady.answered
      - not substrate_libvirt_host_before.observation.firewallReady.present or substrate_libvirt_host_before.observation.firewallReady.owned
    fail_msg: >-
      The provider firewall readiness barrier is unknown or belongs to another owner; restore it before removal{% if
      substrate_libvirt_host_barrier.state == 'failed' and not substrate_libvirt_host_barrier.enabled %};
      systemctl reset-failed {{ substrate_libvirt_host_barrier.name }} clears a failed
      readiness unit whose files are gone; then repeat{% endif %}
    quiet: true
  vars:
    substrate_libvirt_host_barrier: '{{ substrate_libvirt_host_before.observation.firewallReady }}'

- name: Refuse to remove a foreign or unknown VLAN refusal unit
  ansible.builtin.assert:
    that:
      - substrate_libvirt_host_before.observation.vlanRefusal.answered
      - not substrate_libvirt_host_before.observation.vlanRefusal.present or substrate_libvirt_host_before.observation.vlanRefusal.owned
    fail_msg: >-
      The provider VLAN refusal unit {{ bootwright_substrate_host_request.vlanRefusalUnit | default('') }}
      is unknown or belongs to another owner, or another VLAN refusal unit's
      name hashes to its route metric while refusing routes are held under
      it; restore it or remove the other unit before removal
    quiet: true

# A connection read that did not answer proves nothing removed, and a profile
# holding a frozen UUID that is not this provider's is never deleted. The
# removal also takes every owned connection the request no longer freezes.
- name: Refuse to remove a trunk or VLAN leg that is unknown or foreign
  ansible.builtin.assert:
    that:
      - substrate_libvirt_host_before.observation.connectionsAnswered
      - substrate_libvirt_host_before.observation.connections | rejectattr('answered') | list | length == 0
      - substrate_libvirt_host_before.observation.connections | selectattr('present') | rejectattr('owned') | list | length == 0
    fail_msg: >-
      NetworkManager did not answer for a trunk or VLAN leg of this provider,
      or a profile holding its frozen UUID is not this provider's; restore
      NetworkManager or remove that profile, then repeat the removal
    quiet: true

- name: Refuse to remove a routing table that is not this provider's
  ansible.builtin.assert:
    that:
      - substrate_libvirt_host_before.observation.routingRefusals | length == 0
    fail_msg: >-
      the routing table refuses removal:
      {{ substrate_libvirt_host_before.observation.routingRefusals | join('; ') }}
    quiet: true

# Removing a trunk takes its bridge from under every domain plugged into it,
# so the removal refuses before its first effect while one runs there or while
# the hypervisor does not answer which do.
- name: Refuse to remove a trunk nothing proves idle
  ansible.builtin.assert:
    that:
      - item.guestsAnswered
      - item.guests | length == 0
    fail_msg: >-
      trunk {{ item.bridge }} still carries
      {{ item.guests | join(', ') if item.guests else 'domains the hypervisor did not answer for' }};
      stop each Machine with bootwright machine stop --context
      {{ bootwright_substrate_host_request.identity.context }} --name <machine>,
      and any other domain named, then repeat the removal
    quiet: true
  loop: '{{ substrate_libvirt_host_before.observation.trunks | selectattr("present") | list }}'
  loop_control:
    label: '{{ item.bridge }}'

# The legs go first and the trunks after them, before the libvirt networks;
# the routing table that isolates the legs goes only once no leg exists.
- name: Remove each VLAN leg and then each trunk this provider owns
  bootwright.core.libvirt_nm_connections:
    request: '{{ bootwright_substrate_host_request }}'
    state: absent
  register: substrate_libvirt_host_connections

- name: Destroy each owned network
  ansible.builtin.command:
    argv:
      - /usr/bin/virsh
      - --connect
      - '{{ bootwright_substrate_host_request.uri }}'
      - net-destroy
      - '{{ item.name }}'
  loop: '{{ substrate_libvirt_host_owned_networks }}'
  loop_control:
    label: '{{ item.name }}'
  register: substrate_libvirt_host_destroyed
  failed_when:
    - substrate_libvirt_host_destroyed.rc != 0
    - '"not active" not in substrate_libvirt_host_destroyed.stderr'
    - '"not found" not in substrate_libvirt_host_destroyed.stderr'
  changed_when: substrate_libvirt_host_destroyed.rc == 0

- name: Undefine each owned network
  ansible.builtin.command:
    argv:
      - /usr/bin/virsh
      - --connect
      - '{{ bootwright_substrate_host_request.uri }}'
      - net-undefine
      - '{{ item.name }}'
  loop: '{{ substrate_libvirt_host_owned_networks }}'
  loop_control:
    label: '{{ item.name }}'
  register: substrate_libvirt_host_undefined
  failed_when:
    - substrate_libvirt_host_undefined.rc != 0
    - '"not found" not in substrate_libvirt_host_undefined.stderr'
  changed_when: substrate_libvirt_host_undefined.rc == 0

- name: Report network removal completion
  bootwright.core.substrate_host_protocol:
    phase: group
    group: remove-networks
    status: ok
  no_log: true

- name: Report pool removal
  bootwright.core.substrate_host_protocol:
    phase: group
    group: remove-pool
    status: running
  no_log: true

- name: Destroy the virtual-media pool
  ansible.builtin.command:
    argv:
      - /usr/bin/virsh
      - --connect
      - '{{ bootwright_substrate_host_request.uri }}'
      - pool-destroy
      - '{{ bootwright_substrate_host_request.poolName }}'
  register: substrate_libvirt_host_pool_destroyed
  failed_when:
    - substrate_libvirt_host_pool_destroyed.rc != 0
    - '"not active" not in substrate_libvirt_host_pool_destroyed.stderr'
    - '"no storage pool" not in substrate_libvirt_host_pool_destroyed.stderr'
  changed_when: substrate_libvirt_host_pool_destroyed.rc == 0

- name: Undefine the virtual-media pool
  ansible.builtin.command:
    argv:
      - /usr/bin/virsh
      - --connect
      - '{{ bootwright_substrate_host_request.uri }}'
      - pool-undefine
      - '{{ bootwright_substrate_host_request.poolName }}'
  register: substrate_libvirt_host_pool_undefined
  failed_when:
    - substrate_libvirt_host_pool_undefined.rc != 0
    - '"no storage pool" not in substrate_libvirt_host_pool_undefined.stderr'
  changed_when: substrate_libvirt_host_pool_undefined.rc == 0

- name: Remove the owned pool directory
  ansible.builtin.file:
    path: '{{ bootwright_substrate_host_request.poolPath }}'
    state: absent
  register: substrate_libvirt_host_pool_directory

# Empty ancestors stop at the context; the shared prefix stays.
- name: Remove the provider's and the context's image directories once empty
  ansible.builtin.command:
    argv:
      - /usr/bin/rmdir
      - '{{ item }}'
  loop:
    - '{{ bootwright_substrate_host_request.poolPath | dirname }}'
    - '{{ bootwright_substrate_host_request.poolPath | dirname | dirname }}'
    - '{{ bootwright_substrate_host_request.poolPath | dirname | dirname | dirname }}'
  environment:
    LC_ALL: C
  register: substrate_libvirt_host_parents
  failed_when:
    - substrate_libvirt_host_parents.rc != 0
    - '"Directory not empty" not in substrate_libvirt_host_parents.stderr'
    - '"No such file or directory" not in substrate_libvirt_host_parents.stderr'
  changed_when: substrate_libvirt_host_parents.rc == 0

- name: Report pool removal completion
  bootwright.core.substrate_host_protocol:
    phase: group
    group: remove-pool
    status: ok
  no_log: true

- name: Remove only this provider's firewall readiness barrier
  bootwright.core.libvirt_firewall_ready:
    request: '{{ bootwright_substrate_host_request }}'
    state: absent
  register: substrate_libvirt_host_firewall_ready

- name: Remove only this provider's routing table and its unit
  bootwright.core.libvirt_routing:
    request: '{{ bootwright_substrate_host_request }}'
    state: absent
  register: substrate_libvirt_host_routing

- name: Remove only this provider's unreachable routes and their unit
  bootwright.core.libvirt_vlan_refusal:
    request: '{{ bootwright_substrate_host_request }}'
    state: absent
  register: substrate_libvirt_host_vlan_refusal

- name: Report absence verification
  bootwright.core.substrate_host_protocol:
    phase: group
    group: verify-absence
    status: running
  no_log: true

- name: Prove every owned resource is gone
  bootwright.core.libvirt_host_inspect:
    request: '{{ bootwright_substrate_host_request }}'
  register: substrate_libvirt_host_after

- name: Report absence verification completion
  bootwright.core.substrate_host_protocol:
    phase: group
    group: verify-absence
    status: ok
  no_log: true

- name: Publish bounded provider host removal evidence
  bootwright.core.substrate_host_protocol:
    phase: completed
    outcome: >-
      {{ 'changed'
         if (substrate_libvirt_host_pool_directory is changed
             or substrate_libvirt_host_before.observation.pool | length > 0
             or substrate_libvirt_host_owned_networks | length > 0
             or substrate_libvirt_host_parents is changed
             or substrate_libvirt_host_firewall_ready is changed
             or substrate_libvirt_host_connections is changed
             or substrate_libvirt_host_routing is changed
             or substrate_libvirt_host_vlan_refusal is changed)
         else 'unchanged' }}
    digest: '{{ bootwright_substrate_host_digest }}'
    observation: '{{ substrate_libvirt_host_after.observation }}'
    removed: true
  no_log: true
