argument_specs:
  apply:
    short_description: Realize one frozen libvirt provider host.
    options: &request
      bootwright_substrate_host_request:
        type: dict
        required: true
        options:
          firewallReadyUnit:
            type: str
            required: true

          identity:
            type: dict
            required: true
          legs:
            type: list
            elements: dict
            required: false
          networks:
            type: list
            elements: dict
            required: true
          packages:
            type: list
            elements: str
            required: true
          placement:
            type: dict
            required: true
          poolName:
            type: str
            required: true
          poolPath:
            type: str
            required: true
          provisioned:
            type: bool
            required: true
          refusedPrefixes:
            type: list
            elements: str
            required: false
          routing:
            type: dict
            required: false
          services:
            type: list
            elements: str
            required: true
          trunks:
            type: list
            elements: dict
            required: false
          uri:
            type: str
            required: true
          version:
            type: str
            required: true
            choices:
              - substrate-host-libvirt-v2
          vlanRefusalUnit:
            type: str
            required: false
      bootwright_substrate_host_digest:
        type: str
        required: true
      bootwright_run_scratch:
        type: path
        required: true
      bootwright_substrate_host_material:
        type: dict
        required: true

  observe:
    short_description: Observe one frozen libvirt provider host without changing it.
    options: *request

  destroy:
    short_description: Remove what one frozen libvirt provider host owns and prove its absence.
    options: *request
