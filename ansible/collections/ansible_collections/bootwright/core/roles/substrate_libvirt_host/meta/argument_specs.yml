argument_specs:
  apply:
    short_description: Realize one frozen libvirt provider host.
    options: &request
      bootwright_substrate_host_request:
        type: dict
        required: true
        options:
          identity:
            type: dict
            required: true
          networks:
            type: list
            elements: dict
            required: true
          packages:
            type: list
            elements: str
            required: true
          placement:
            type: dict
            required: true
          poolName:
            type: str
            required: true
          poolPath:
            type: str
            required: true
          provisioned:
            type: bool
            required: true
          service:
            type: str
            required: true
          uri:
            type: str
            required: true
          version:
            type: str
            required: true
            choices: [substrate-host-libvirt-v1]
      bootwright_substrate_host_material:
        type: dict
        required: true

  observe:
    short_description: Observe one frozen libvirt provider host without changing it.
    options: *request

  destroy:
    short_description: Remove what one frozen libvirt provider host owns and prove its absence.
    options: *request
