---
- name: Resolve vSphere staging marker path
  ansible.builtin.set_fact:
    bootwright_vsphere_boot_stage_marker_path: "{{ bootwright_vsphere_boot_stage_path }}.staged"
  changed_when: false

- name: Probe staged vSphere boot media
  ansible.builtin.stat:
    path: "{{ bootwright_vsphere_boot_stage_path }}"
  register: bootwright_vsphere_boot_stage_stat

- name: Stage generated agent ISO for vSphere upload
  when:
    - bootwright_vsphere_boot_stage_elected | bool
    - not (bootwright_vsphere_boot_stage_stat.stat.exists | default(false))
  block:
    - name: Read generated agent ISO path
      ansible.builtin.slurp:
        src: "{{ bootwright_install_local_work_dir }}/agent-iso.path"
      register: bootwright_vsphere_boot_agent_iso_path_file
      delegate_to: localhost
      become: false
      no_log: "{{ bootwright_no_log | default(true) | bool }}"

    - name: Resolve generated agent ISO path
      ansible.builtin.set_fact:
        bootwright_vsphere_boot_agent_iso_path: "{{ bootwright_vsphere_boot_agent_iso_path_file.content | b64decode | trim }}"
      changed_when: false
      no_log: "{{ bootwright_no_log | default(true) | bool }}"

    - name: Create vSphere media staging directory
      ansible.builtin.file:
        path: "{{ bootwright_vsphere_boot_stage_path | dirname }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Stage generated agent ISO
      ansible.builtin.copy:
        src: "{{ bootwright_vsphere_boot_agent_iso_path }}"
        dest: "{{ bootwright_vsphere_boot_stage_path }}"
        remote_src: true
        owner: root
        group: root
        mode: "0600"

    - name: Mark generated agent ISO staged
      ansible.builtin.copy:
        dest: "{{ bootwright_vsphere_boot_stage_marker_path }}"
        content: "{{ bootwright_vsphere_boot_stage_path | basename }}\n"
        owner: root
        group: root
        mode: "0600"

- name: Wait for the elected machine to stage the agent ISO
  ansible.builtin.wait_for:
    path: "{{ bootwright_vsphere_boot_stage_marker_path }}"
    state: present
    timeout: "{{ bootwright_vsphere_boot_stage_wait_timeout }}"
    sleep: "{{ bootwright_vsphere_boot_stage_wait_interval_seconds }}"
  when:
    - not (bootwright_vsphere_boot_stage_elected | bool)
    - not (bootwright_vsphere_boot_stage_stat.stat.exists | default(false))

- name: Confirm the shared staged agent ISO is present
  ansible.builtin.stat:
    path: "{{ bootwright_vsphere_boot_stage_path }}"
  register: bootwright_vsphere_boot_shared_stage_stat
  when: not (bootwright_vsphere_boot_stage_elected | bool)

- name: Assert the shared staged agent ISO is present
  ansible.builtin.assert:
    that:
      - bootwright_vsphere_boot_shared_stage_stat.stat.exists | default(false)
    fail_msg: >-
      The machine elected to stage {{ bootwright_vsphere_boot_stage_path }} reported the
      staging marker {{ bootwright_vsphere_boot_stage_marker_path }} but the staged agent
      ISO is missing, so this machine has nothing to upload to the datastore.
  when: not (bootwright_vsphere_boot_stage_elected | bool)
