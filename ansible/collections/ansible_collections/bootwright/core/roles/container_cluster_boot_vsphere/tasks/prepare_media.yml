---
- name: Prepare vSphere virtual media
  ansible.builtin.include_role:
    name: "{{ bootwright_component.mediaPrepareRole }}"
  when: not (bootwright_vmedia_backend_attached | default(false) | bool)

- name: Load vCenter credentials
  ansible.builtin.include_role:
    name: bootwright.core.support_credentials
    tasks_from: load.yml
  vars:
    bootwright_creds_path: "{{ bootwright_vsphere_boot.credentialsPath }}"
    bootwright_creds_var: bootwright_vsphere_boot_credentials
    bootwright_creds_label: "vCenter credentials for {{ bootwright_vsphere_boot.server }}"
