---
- name: Resolve vSphere boot context
  ansible.builtin.import_tasks: context.yml

- name: Clean vSphere virtual media
  ansible.builtin.import_tasks: cleanup_media.yml

- name: Boot machine from vSphere virtual media
  when: bootwright_vsphere_boot_action == 'boot'
  block:
    - name: Stage generated agent ISO
      ansible.builtin.import_tasks: stage_agent_iso.yml

    - name: Prepare vSphere virtual media
      ansible.builtin.import_tasks: prepare_media.yml

    - name: Power on vSphere machine
      ansible.builtin.import_tasks: power.yml

    - name: Wait for vSphere node readiness
      ansible.builtin.import_tasks: readiness.yml
