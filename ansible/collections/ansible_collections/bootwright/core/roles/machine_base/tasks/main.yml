---
- name: Load base package list
  ansible.builtin.include_vars: "os/{{ ansible_facts['os_family'] }}.yml"

- name: Stat dnf.conf
  ansible.builtin.stat:
    path: /etc/dnf/dnf.conf
  register: bootwright_machine_base_dnf_conf
  changed_when: false
  when: ansible_facts['os_family'] == 'RedHat'

- name: Allow unavailable DNF repositories
  ansible.builtin.lineinfile:
    path: /etc/dnf/dnf.conf
    regexp: '^skip_if_unavailable\s*='
    line: skip_if_unavailable=True
    insertafter: '^\[main\]'
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - bootwright_machine_base_dnf_conf.stat.exists | bool

- name: Stat yum.conf
  ansible.builtin.stat:
    path: /etc/yum.conf
  register: bootwright_machine_base_yum_conf
  changed_when: false
  when: ansible_facts['os_family'] == 'RedHat'

- name: Allow unavailable YUM repositories
  ansible.builtin.lineinfile:
    path: /etc/yum.conf
    regexp: '^skip_if_unavailable\s*='
    line: skip_if_unavailable=True
    insertafter: '^\[main\]'
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - bootwright_machine_base_yum_conf.stat.exists | bool

- name: Install base host packages
  ansible.builtin.package:
    name: "{{ bootwright_machine_base_packages }}"
    state: present

- name: Detect firewall-cmd binary
  ansible.builtin.stat:
    path: /usr/bin/firewall-cmd
  register: bootwright_firewalld_probe
  changed_when: false

- name: Detect running firewalld daemon
  ansible.builtin.command: /usr/bin/firewall-cmd --state
  register: bootwright_firewalld_state
  changed_when: false
  failed_when: false
  when: bootwright_firewalld_probe.stat.exists | bool

- name: Set firewalld availability fact
  ansible.builtin.set_fact:
    bootwright_firewalld_available: >-
      {{
        (bootwright_firewalld_state.rc | default(1) | int) == 0
        and (bootwright_firewalld_state.stdout | default('') | trim) == 'running'
      }}
  changed_when: false
