---
- name: Validate the frozen Ceph image request
  ansible.builtin.assert:
    that:
      - bootwright_ceph_image_request.version == 'ceph-image-v2'
      - bootwright_ceph_image_digest is match('^[0-9a-f]{64}$')
      - ansible_connection == 'local'
    quiet: true
  no_log: true

- name: Complete the image resolution handoff
  bootwright.core.ceph_image_protocol:
    phase: loaded
  no_log: true

- name: Resolve the pinned tag to its linux/amd64 manifest
  bootwright.core.ceph_image_resolve:
    operation: apply
    request: '{{ bootwright_ceph_image_request }}'
    digest: '{{ bootwright_ceph_image_digest }}'
    material: '{{ bootwright_ceph_image_material }}'
  register: storage_ceph_image_result
  failed_when: false
  no_log: true
  diff: false

- name: Publish the fixed image resolution refusal
  bootwright.core.ceph_image_protocol:
    phase: refused
    reason: '{{ storage_ceph_image_result.reason | default("adapter-exception") }}'
    native_error: '{{ storage_ceph_image_result.nativeError | default(omit) }}'
    detail: >-
      {{ storage_ceph_image_result.detail
        | default(omit if storage_ceph_image_result.reason is defined else "module-failure") }}
  when: storage_ceph_image_result.evidence is not defined
  no_log: true

- name: Refuse an unproved image resolution
  ansible.builtin.fail:
    msg: The pinned IBM Ceph image could not be resolved
  when: storage_ceph_image_result.evidence is not defined

- name: Publish the bounded image resolution evidence
  bootwright.core.ceph_image_protocol:
    phase: completed
    outcome: unchanged
    digest: '{{ bootwright_ceph_image_digest }}'
    evidence: '{{ storage_ceph_image_result.evidence }}'
  no_log: true
