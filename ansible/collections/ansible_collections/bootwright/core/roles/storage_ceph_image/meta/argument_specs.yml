argument_specs:
  resolve:
    short_description: Resolve the selected IBM Ceph tag or direct digest.
    options: &request
      bootwright_ceph_image_request:
        type: dict
        required: true
        options:
          base:
            type: str
            required: true
          cluster:
            type: str
            required: true
          controller:
            type: str
            required: true
          image:
            type: str
            required: true
          registry:
            type: str
            required: true
          registryRef:
            type: str
            required: true
          release:
            type: str
            required: true
          tag:
            type: str
            required: true
          version:
            type: str
            required: true
            choices: [ceph-image-v2]
      bootwright_ceph_image_digest:
        type: str
        required: true
      bootwright_ceph_image_material:
        type: dict
        required: true

  observe:
    short_description: Re-validate a frozen image resolution request offline.
    options: *request

  destroy:
    short_description: Release an image resolution, which retains nothing.
    options: *request
