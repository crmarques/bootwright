---
- name: Ensure libvirt host packages and service
  ansible.builtin.import_role:
    name: bootwright.core.provider_host_libvirt

- name: Resolve cluster libvirt network from the machine network config
  ansible.builtin.set_fact:
    bootwright_libvirt_network: >-
      {{
        (bootwright_current_cluster.networks
         | selectattr('name', 'equalto', bootwright_component.networkConfig.ref)
         | first)
      }}
  changed_when: false

- name: Resolve libvirt network identifiers
  ansible.builtin.set_fact:
    bootwright_libvirt_bridge: "{{ bootwright_component.networkAttachment.libvirt.bridge }}"
    bootwright_libvirt_network_name: "bw-{{ bootwright_current_cluster.name }}"
    bootwright_libvirt_network_uuid: "{{ (bootwright_current_cluster.name ~ '-net') | to_uuid }}"
    bootwright_libvirt_network_uri: "{{ bootwright_component.libvirt.uri | default('qemu:///system', true) }}"
    bootwright_libvirt_root: "{{ bootwright_clusters_dir }}/{{ bootwright_current_cluster.name }}/runtime/provider-state/libvirt"
  changed_when: false

- name: Read live libvirt network definition before apply
  ansible.builtin.command:
    argv:
      - virsh
      - -c
      - "{{ bootwright_libvirt_network_uri }}"
      - net-dumpxml
      - "{{ bootwright_libvirt_network_name }}"
  register: bootwright_libvirt_apply_network_xml
  changed_when: false
  failed_when: false

- name: Require a conclusive libvirt network probe before apply
  ansible.builtin.assert:
    that:
      - bootwright_libvirt_apply_network_xml.rc is defined
      - >-
        (
          bootwright_libvirt_apply_network_xml.rc | default(1) == 0
          and bootwright_libvirt_apply_network_xml.stdout is defined
        )
        or (
          bootwright_libvirt_apply_network_xml.rc | default(1) != 0
          and bootwright_libvirt_apply_network_xml.stderr is defined
          and (bootwright_libvirt_apply_network_xml.stderr
               | bootwright.core.bootwright_libvirt_explicit_absence('libvirt-network'))
        )
    fail_msg: >-
      Could not determine whether libvirt network {{ bootwright_libvirt_network_name }}
      exists on {{ bootwright_libvirt_network_uri }}:
      {{ bootwright_libvirt_apply_network_xml.stderr | default('virsh net-dumpxml returned incomplete evidence') }}.
      Refusing to define or activate a network whose live identity could not be
      proven. Restore libvirt access, then retry the exact invocation
      `{{ bootwright_mutating_invocation }}`.

- name: Resolve live libvirt network identity before apply
  ansible.builtin.set_fact:
    bootwright_libvirt_apply_network_present: "{{ bootwright_libvirt_apply_network_xml.rc == 0 }}"
    bootwright_libvirt_apply_network_identity: >-
      {{
        bootwright_libvirt_apply_network_xml.stdout | default('')
        | bootwright.core.bootwright_libvirt_resource_identity
      }}
  changed_when: false

- name: Refuse to redefine a foreign libvirt network
  ansible.builtin.assert:
    that:
      - >-
        bootwright_libvirt_apply_network_identity
        == {
          'context': bootwright_clusters_dir | dirname | basename,
          'cluster': bootwright_current_cluster.name
        }
    fail_msg: >-
      Refusing to apply over libvirt network {{ bootwright_libvirt_network_name }}:
      it exists on {{ bootwright_libvirt_network_uri }} but its live XML does not
      carry exactly one Bootwright identity for this context and cluster. It may
      belong to another context or a foreign owner. Verify its provenance and
      remove it outside Bootwright only after establishing that is safe, then
      retry the exact invocation `{{ bootwright_mutating_invocation }}`. No apply
      mode or authorization token adopts a foreign or unprovable network.
  when: bootwright_libvirt_apply_network_present | bool

- name: Resolve libvirt network machines
  ansible.builtin.set_fact:
    bootwright_libvirt_network_machines: >-
      {{
        bootwright_current_machines
        | default(bootwright_prepare_components | default([bootwright_component]))
      }}
  changed_when: false

- name: Create per-cluster libvirt state directory
  ansible.builtin.file:
    path: "{{ bootwright_libvirt_root }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Render libvirt network XML
  ansible.builtin.template:
    src: network.xml.j2
    dest: "{{ bootwright_libvirt_root }}/network.xml"
    owner: root
    group: root
    mode: "0644"
  register: bootwright_libvirt_net_xml

- name: Slurp libvirt network XML
  ansible.builtin.slurp:
    src: "{{ bootwright_libvirt_root }}/network.xml"
  register: bootwright_libvirt_net_xml_slurp

- name: Define libvirt network
  community.libvirt.virt_net:
    name: "{{ bootwright_libvirt_network_name }}"
    state: present
    uri: "{{ bootwright_libvirt_network_uri }}"
    xml: "{{ bootwright_libvirt_net_xml_slurp.content | b64decode }}"

- name: Activate libvirt network
  community.libvirt.virt_net:
    name: "{{ bootwright_libvirt_network_name }}"
    state: active
    autostart: true
    uri: "{{ bootwright_libvirt_network_uri }}"

- name: Record libvirt network ownership
  ansible.builtin.include_role:
    name: bootwright.core.ownership_record
    tasks_from: resource.yml
  vars:
    bootwright_ownership_kind: libvirt-network
    bootwright_ownership_name: "{{ bootwright_current_cluster.name }}"
    bootwright_ownership_fields:
      provider: "{{ bootwright_component.providerName }}"
      cluster: "{{ bootwright_current_cluster.name }}"
      attributes:
        network: "{{ bootwright_libvirt_network_name }}"
        uri: "{{ bootwright_libvirt_network_uri }}"
