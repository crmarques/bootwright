---
# Converges one libvirt machine substrate for `bootwright_component`,
# called once per machine by the machine-infra layer playbook. The
# libvirt network setup is idempotent and re-runs cheaply for each
# machine in the same cluster.

- name: Ensure libvirt host packages and service
  ansible.builtin.import_role:
    name: bootwright.core.machine_setup_libvirt

- name: Resolve cluster libvirt network from the machine network config
  ansible.builtin.set_fact:
    bootwright_libvirt_network: >-
      {{
        (bootwright_current_cluster.networks
         | selectattr('name', 'equalto', bootwright_component.networkConfig.ref)
         | first)
      }}
  changed_when: false

- name: Resolve libvirt network identifiers
  ansible.builtin.set_fact:
    bootwright_libvirt_bridge: "{{ bootwright_component.networkAttachment.libvirt.bridge }}"
    bootwright_libvirt_network_name: "bw-{{ bootwright_current_cluster.name }}"
    bootwright_libvirt_network_uuid: "{{ (bootwright_current_cluster.name ~ '-net') | to_uuid }}"
    bootwright_libvirt_root: "{{ bootwright_clusters_dir }}/{{ bootwright_current_cluster.name }}/runtime/provider-state/libvirt"
    bootwright_libvirt_machine_root: "{{ bootwright_clusters_dir }}/{{ bootwright_current_cluster.name }}/runtime/provider-state/libvirt/machines/{{ bootwright_component.name }}"
    bootwright_libvirt_domain_uuid: "{{ (bootwright_current_cluster.name ~ '-' ~ bootwright_component.name) | to_uuid }}"
  changed_when: false

- name: Create per-cluster libvirt state directory
  ansible.builtin.file:
    path: "{{ bootwright_libvirt_machine_root }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Render libvirt network XML
  ansible.builtin.template:
    src: network.xml.j2
    dest: "{{ bootwright_libvirt_root }}/network.xml"
    owner: root
    group: root
    mode: "0644"
  register: bootwright_libvirt_net_xml

- name: Slurp libvirt network XML
  ansible.builtin.slurp:
    src: "{{ bootwright_libvirt_root }}/network.xml"
  register: bootwright_libvirt_net_xml_slurp

- name: Define libvirt network
  community.libvirt.virt_net:
    name: "{{ bootwright_libvirt_network_name }}"
    state: present
    xml: "{{ bootwright_libvirt_net_xml_slurp.content | b64decode }}"

- name: Activate libvirt network
  community.libvirt.virt_net:
    name: "{{ bootwright_libvirt_network_name }}"
    state: active
    autostart: true

- name: Locate QEMU emulator
  ansible.builtin.stat:
    path: "{{ item }}"
  register: bootwright_libvirt_qemu_candidates
  loop:
    - /usr/bin/qemu-kvm
    - /usr/libexec/qemu-kvm
    - /usr/bin/qemu-system-x86_64

- name: Select QEMU emulator
  ansible.builtin.set_fact:
    bootwright_libvirt_qemu_emulator: "{{ bootwright_libvirt_qemu_candidates.results | selectattr('stat.exists') | map(attribute='item') | first | default('') }}"
  changed_when: false

- name: Assert QEMU emulator
  ansible.builtin.fail:
    msg: "No QEMU emulator found; install qemu-kvm."
  when: bootwright_libvirt_qemu_emulator == ""

- name: Create machine disk
  ansible.builtin.command:
    argv:
      - qemu-img
      - create
      - -f
      - qcow2
      - "{{ bootwright_libvirt_machine_root }}/disk.qcow2"
      - "{{ bootwright_component.profile.diskGiB }}G"
  args:
    creates: "{{ bootwright_libvirt_machine_root }}/disk.qcow2"

- name: Create machine data disks
  ansible.builtin.command:
    argv:
      - qemu-img
      - create
      - -f
      - qcow2
      - "{{ bootwright_libvirt_machine_root }}/data-{{ item.name }}.qcow2"
      - "{{ item.sizeGiB }}G"
  args:
    creates: "{{ bootwright_libvirt_machine_root }}/data-{{ item.name }}.qcow2"
  loop: "{{ bootwright_component.profile.dataDisks | default([]) }}"
  loop_control:
    label: "{{ item.name }}"

- name: Render libvirt domain XML
  ansible.builtin.template:
    src: domain.xml.j2
    dest: "{{ bootwright_libvirt_machine_root }}/domain.xml"
    owner: root
    group: root
    mode: "0644"
  register: bootwright_libvirt_domain_xml

- name: Slurp libvirt domain XML
  ansible.builtin.slurp:
    src: "{{ bootwright_libvirt_machine_root }}/domain.xml"
  register: bootwright_libvirt_domain_xml_slurp

- name: Define libvirt domain
  community.libvirt.virt:
    command: define
    xml: "{{ bootwright_libvirt_domain_xml_slurp.content | b64decode }}"
