---
- name: Resolve libvirt machine identifiers
  ansible.builtin.set_fact:
    bootwright_libvirt_network_name: "bw-{{ bootwright_current_cluster.name }}"
    bootwright_libvirt_machine_root: "{{ bootwright_clusters_dir }}/{{ bootwright_current_cluster.name }}/runtime/provider-state/libvirt/machines/{{ bootwright_component.name }}"
    bootwright_libvirt_storage_root: "/var/lib/libvirt/images/bootwright/{{ bootwright_clusters_dir | dirname | basename }}/clusters/{{ bootwright_current_cluster.name }}/machines/{{ bootwright_component.name }}"
    bootwright_libvirt_domain_uuid: "{{ (bootwright_current_cluster.name ~ '-' ~ bootwright_component.name) | to_uuid }}"
  changed_when: false

- name: Probe libvirt runtime users
  ansible.builtin.command:
    argv:
      - getent
      - passwd
      - "{{ item }}"
  register: bootwright_libvirt_runtime_user_probe
  changed_when: false
  failed_when: false
  loop:
    - qemu
    - libvirt-qemu

- name: Resolve libvirt runtime storage access
  ansible.builtin.set_fact:
    bootwright_libvirt_runtime_users: "{{ bootwright_libvirt_runtime_user_probe.results | default([]) | selectattr('rc', 'eq', 0) | map(attribute='item') | list }}"
    bootwright_libvirt_domain_name: "{{ bootwright_current_cluster.name }}-{{ bootwright_component.name }}"
    bootwright_libvirt_managed_os_reset: >-
      {{ (bootwright_component.osManaged | default(false) | bool)
         and ((bootwright_apply_mode | default('reconcile')) == 'rebuild')
         and (bootwright_current_cluster.name
              in (bootwright_substrate_reset_clusters | default('') | split(',') | map('trim') | reject('equalto', '') | list))
         and ((bootwright_substrate_reset_machines | default('') | split(',') | map('trim') | reject('equalto', '') | list
               | map('split', '/') | map('first')
               | select('equalto', bootwright_current_cluster.name) | list | length == 0)
              or ((bootwright_current_cluster.name ~ '/' ~ bootwright_component.name)
                  in (bootwright_substrate_reset_machines | default('') | split(',') | map('trim') | reject('equalto', '') | list))) }}
    bootwright_libvirt_data_disks: "{{ bootwright_component.profile.dataDisks | default([]) }}"
    bootwright_libvirt_data_disk_names: "{{ bootwright_component.profile.dataDisks | default([]) | map(attribute='name') | list }}"
    bootwright_libvirt_disk_paths: >-
      {{
        [bootwright_libvirt_storage_root ~ '/disk.qcow2']
        + (
          bootwright_component.profile.dataDisks | default([])
          | map(attribute='name')
          | map('regex_replace', '^', bootwright_libvirt_storage_root ~ '/data-')
          | map('regex_replace', '$', '.qcow2')
          | list
        )
      }}
  changed_when: false

- name: Read libvirt domain ownership metadata for apply
  ansible.builtin.command:
    argv:
      - virsh
      - -c
      - "{{ bootwright_component.libvirt.uri | default('qemu:///system', true) }}"
      - dumpxml
      - "{{ bootwright_libvirt_domain_name }}"
  register: bootwright_libvirt_apply_domain_xml
  changed_when: false
  failed_when: false

- name: Require a conclusive libvirt domain probe
  ansible.builtin.assert:
    that:
      - bootwright_libvirt_apply_domain_xml.rc is defined
      - >-
        (
          bootwright_libvirt_apply_domain_xml.rc | int == 0
          and bootwright_libvirt_apply_domain_xml.stdout is defined
        )
        or (
          bootwright_libvirt_apply_domain_xml.rc | int != 0
          and bootwright_libvirt_apply_domain_xml.stderr is defined
          and (bootwright_libvirt_apply_domain_xml.stderr
               | bootwright.core.bootwright_libvirt_explicit_absence('libvirt-domain'))
        )
    fail_msg: >-
      Could not determine whether libvirt domain {{ bootwright_libvirt_domain_name }}
      exists on {{ bootwright_component.libvirt.uri | default('qemu:///system', true) }}:
      {{ bootwright_libvirt_apply_domain_xml.stderr | default('probe failed with no detail') }}.
      Refusing to continue — an existing foreign domain could not be detected.
      Fix libvirt connectivity, then retry the exact invocation
      `{{ bootwright_mutating_invocation }}`.

- name: Resolve libvirt domain ownership for apply
  ansible.builtin.set_fact:
    bootwright_libvirt_apply_owned: >-
      {{
        (bootwright_libvirt_apply_domain_xml.stdout
         | bootwright.core.bootwright_libvirt_resource_identity)
        == {
          'context': (bootwright_clusters_dir | dirname | basename),
          'cluster': bootwright_current_cluster.name,
          'machine': bootwright_component.name
        }
      }}
  changed_when: false
  when: bootwright_libvirt_apply_domain_xml.rc | int == 0

- name: Refuse to mutate a non-Bootwright libvirt domain on apply
  ansible.builtin.assert:
    that:
      - bootwright_libvirt_apply_owned | default(false) | bool
    fail_msg: >-
      Refusing to apply over libvirt domain {{ bootwright_libvirt_domain_name }}:
      it already exists on this hypervisor but carries no Bootwright ownership
      marker for this context/cluster/machine, so it may belong to another
      Bootwright context or a foreign owner. Verify its provenance and remove it
      outside Bootwright only after establishing that is safe. No Bootwright
      retry command, apply mode, or authorization token adopts a foreign domain.
  when:
    - bootwright_libvirt_apply_domain_xml.rc | int == 0
    - (bootwright_apply_mode | default('reconcile')) != 'create'

- name: Enforce libvirt domain apply mode against live state
  ansible.builtin.include_role:
    name: bootwright.core.ownership_record
    tasks_from: apply_mode_gate.yml
  vars:
    bootwright_gate_object: >-
      libvirt domain {{ bootwright_libvirt_domain_name }}
    bootwright_gate_exists: "{{ bootwright_libvirt_apply_domain_xml.rc | default(1) == 0 }}"
    bootwright_gate_owned: "{{ bootwright_libvirt_apply_owned | default(false) }}"

- name: Create per-machine libvirt state directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ bootwright_libvirt_machine_root }}", mode: "0755" }
    - { path: "{{ bootwright_libvirt_storage_root }}", mode: "0755" }

- name: Stop managed OS libvirt domain for override reinstall
  ansible.builtin.command:
    argv:
      - virsh
      - -c
      - "{{ bootwright_component.libvirt.uri | default('qemu:///system', true) }}"
      - destroy
      - "{{ bootwright_libvirt_domain_name }}"
  register: bootwright_libvirt_managed_os_reset_stop
  changed_when: bootwright_libvirt_managed_os_reset_stop.rc == 0
  failed_when: false
  when: bootwright_libvirt_managed_os_reset | bool

- name: Refuse managed OS disk reset when the libvirt domain could not be stopped
  ansible.builtin.assert:
    that:
      - bootwright_libvirt_managed_os_reset_stop.rc is defined
      - >-
        bootwright_libvirt_managed_os_reset_stop.rc | int == 0
        or (
          bootwright_libvirt_managed_os_reset_stop.rc | int != 0
          and (
            (bootwright_libvirt_managed_os_reset_stop.stderr | default(''))
            | bootwright.core.bootwright_libvirt_explicit_absence('libvirt-domain')
            or (bootwright_libvirt_managed_os_reset_stop.stderr | default(''))
               is search('(?i)domain is not running')
          )
        )
    fail_msg: >-
      Refusing to delete and recreate the disks of libvirt domain
      {{ bootwright_libvirt_domain_name }} because `virsh destroy` failed: rc
      {{ bootwright_libvirt_managed_os_reset_stop.rc | default('<unknown>') }},
      stderr {{ bootwright_libvirt_managed_os_reset_stop.stderr | default('') }}.
      Restore libvirt access or stop the domain safely, then retry with
      `{{ bootwright_apply_rebuild_invocation }}`.
  when: bootwright_libvirt_managed_os_reset | bool

- name: Undefine managed OS libvirt domain for override reinstall
  ansible.builtin.command:
    argv:
      - virsh
      - -c
      - "{{ bootwright_component.libvirt.uri | default('qemu:///system', true) }}"
      - undefine
      - "{{ bootwright_libvirt_domain_name }}"
      - --keep-nvram
  register: bootwright_libvirt_managed_os_reset_undefine
  changed_when: bootwright_libvirt_managed_os_reset_undefine.rc == 0
  failed_when: false
  when: bootwright_libvirt_managed_os_reset | bool

- name: Refuse managed OS disk reset when the libvirt domain could not be undefined
  ansible.builtin.assert:
    that:
      - bootwright_libvirt_managed_os_reset_undefine.rc is defined
      - >-
        bootwright_libvirt_managed_os_reset_undefine.rc | int == 0
        or (
          bootwright_libvirt_managed_os_reset_undefine.rc | int != 0
          and ((bootwright_libvirt_managed_os_reset_undefine.stderr | default(''))
               | bootwright.core.bootwright_libvirt_explicit_absence('libvirt-domain'))
        )
    fail_msg: >-
      Refusing to delete and recreate the disks of libvirt domain
      {{ bootwright_libvirt_domain_name }} because `virsh undefine --keep-nvram`
      failed: rc
      {{ bootwright_libvirt_managed_os_reset_undefine.rc | default('<unknown>') }},
      stderr {{ bootwright_libvirt_managed_os_reset_undefine.stderr | default('') }}.
      Restore libvirt access or remove the domain safely, then retry with
      `{{ bootwright_apply_rebuild_invocation }}`.
  when: bootwright_libvirt_managed_os_reset | bool

- name: Verify the reset libvirt domain is absent before disk deletion
  ansible.builtin.command:
    argv:
      - virsh
      - -c
      - "{{ bootwright_component.libvirt.uri | default('qemu:///system', true) }}"
      - dumpxml
      - "{{ bootwright_libvirt_domain_name }}"
  register: bootwright_libvirt_managed_os_reset_absence
  changed_when: false
  failed_when: false
  when: bootwright_libvirt_managed_os_reset | bool

- name: Require proven reset libvirt domain absence before disk deletion
  ansible.builtin.assert:
    that:
      - bootwright_libvirt_managed_os_reset_absence.rc is defined
      - bootwright_libvirt_managed_os_reset_absence.rc | int != 0
      - >-
        (bootwright_libvirt_managed_os_reset_absence.stderr | default(''))
        | bootwright.core.bootwright_libvirt_explicit_absence('libvirt-domain')
    fail_msg: >-
      Refusing to delete and recreate the disks of libvirt domain
      {{ bootwright_libvirt_domain_name }} because its absence was not proven
      after teardown. rc
      {{ bootwright_libvirt_managed_os_reset_absence.rc | default('<unknown>') }},
      stderr {{ bootwright_libvirt_managed_os_reset_absence.stderr | default('') }}.
      Inspect the domain, restore libvirt access, and retry with
      `{{ bootwright_apply_rebuild_invocation }}`.
  when: bootwright_libvirt_managed_os_reset | bool

- name: Remove managed OS libvirt machine state for override reinstall
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ bootwright_libvirt_machine_root }}"
    - "{{ bootwright_libvirt_storage_root }}"
  loop_control:
    label: "{{ item }}"
  when: bootwright_libvirt_managed_os_reset | bool

- name: Recreate managed OS libvirt machine directories after override reset
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ bootwright_libvirt_machine_root }}", mode: "0755" }
    - { path: "{{ bootwright_libvirt_storage_root }}", mode: "0755" }
  when: bootwright_libvirt_managed_os_reset | bool

- name: Select libvirt runtime user
  ansible.builtin.set_fact:
    bootwright_libvirt_runtime_user: "{{ bootwright_libvirt_runtime_users | first | default('') }}"
  changed_when: false

- name: Assert libvirt runtime user
  ansible.builtin.fail:
    msg: "No libvirt QEMU runtime user found; expected qemu or libvirt-qemu."
  when: bootwright_libvirt_runtime_user == ""

- name: Locate QEMU emulator
  ansible.builtin.stat:
    path: "{{ item }}"
  register: bootwright_libvirt_qemu_candidates
  loop:
    - /usr/bin/qemu-kvm
    - /usr/libexec/qemu-kvm
    - /usr/bin/qemu-system-x86_64

- name: Select QEMU emulator
  ansible.builtin.set_fact:
    bootwright_libvirt_qemu_emulator: "{{ bootwright_libvirt_qemu_candidates.results | selectattr('stat.exists') | map(attribute='item') | first | default('') }}"
  changed_when: false

- name: Assert QEMU emulator
  ansible.builtin.fail:
    msg: "No QEMU emulator found; install qemu-kvm."
  when: bootwright_libvirt_qemu_emulator == ""

- name: Check existing machine disk locations
  ansible.builtin.stat:
    path: "{{ item }}"
  register: bootwright_libvirt_machine_disk_locations
  loop:
    - "{{ bootwright_libvirt_machine_root }}/disk.qcow2"
    - "{{ bootwright_libvirt_storage_root }}/disk.qcow2"

- name: Migrate machine disk to libvirt storage
  ansible.builtin.command:
    argv:
      - mv
      - "{{ bootwright_libvirt_machine_root }}/disk.qcow2"
      - "{{ bootwright_libvirt_storage_root }}/disk.qcow2"
  changed_when: true
  when:
    - bootwright_libvirt_machine_disk_locations.results[0].stat.exists | default(false)
    - not (bootwright_libvirt_machine_disk_locations.results[1].stat.exists | default(false))

- name: Find existing machine data disks
  ansible.builtin.find:
    paths:
      - "{{ bootwright_libvirt_machine_root }}"
      - "{{ bootwright_libvirt_storage_root }}"
    patterns: "data-*.qcow2"
    file_type: file
  register: bootwright_libvirt_existing_data_disks
  changed_when: false

- name: Resolve undeclared machine data disks
  ansible.builtin.set_fact:
    bootwright_libvirt_undeclared_data_disks: >-
      {{
        (
          bootwright_libvirt_existing_data_disks.files | default([])
          | map(attribute='path')
          | map('basename')
          | map('regex_replace', '^data-', '')
          | map('regex_replace', '\\.qcow2$', '')
          | list
        )
        | difference(bootwright_libvirt_data_disk_names)
        | sort
      }}
  changed_when: false

- name: Refuse undeclared machine data disks
  ansible.builtin.fail:
    msg: >-
      Libvirt storage for {{ bootwright_current_cluster.name }}/{{ bootwright_component.name }}
      contains undeclared data disk(s) {{ bootwright_libvirt_undeclared_data_disks | join(', ') }}.
      Rebuild exactly this selected work set with
      `{{ bootwright_apply_rebuild_invocation }}`
      before changing or removing machine data disks.
  when: bootwright_libvirt_undeclared_data_disks | length > 0

- name: Check existing machine data disk source locations ({{ bootwright_libvirt_data_disks | length }} configured)
  ansible.builtin.stat:
    path: "{{ bootwright_libvirt_machine_root }}/data-{{ item.name }}.qcow2"
  register: bootwright_libvirt_machine_data_disk_source_locations
  loop: "{{ bootwright_libvirt_data_disks }}"
  loop_control:
    label: "{{ item.name }}"

- name: Check existing machine data disk storage locations ({{ bootwright_libvirt_data_disks | length }} configured)
  ansible.builtin.stat:
    path: "{{ bootwright_libvirt_storage_root }}/data-{{ item.name }}.qcow2"
  register: bootwright_libvirt_machine_data_disk_storage_locations
  loop: "{{ bootwright_libvirt_data_disks }}"
  loop_control:
    label: "{{ item.name }}"

- name: Migrate machine data disks to libvirt storage ({{ bootwright_libvirt_data_disks | length }} configured)
  ansible.builtin.command:
    argv:
      - mv
      - "{{ bootwright_libvirt_machine_root }}/data-{{ item.name }}.qcow2"
      - "{{ bootwright_libvirt_storage_root }}/data-{{ item.name }}.qcow2"
  loop: "{{ bootwright_libvirt_data_disks }}"
  loop_control:
    label: "{{ item.name }}"
    extended: true
  changed_when: true
  when:
    - bootwright_libvirt_machine_data_disk_source_locations.results[ansible_loop.index0].stat.exists | default(false)
    - not (bootwright_libvirt_machine_data_disk_storage_locations.results[ansible_loop.index0].stat.exists | default(false))

- name: Probe existing libvirt root disk size
  ansible.builtin.command:
    argv:
      - qemu-img
      - info
      - --output=json
      - "{{ bootwright_libvirt_storage_root }}/disk.qcow2"
  register: bootwright_libvirt_root_disk_info
  changed_when: false
  failed_when: false

- name: Resolve existing libvirt root disk probe evidence
  ansible.builtin.set_fact:
    bootwright_libvirt_root_disk_present: >-
      {{
        (bootwright_libvirt_machine_disk_locations.results[0].stat.exists | default(false))
        or (bootwright_libvirt_machine_disk_locations.results[1].stat.exists | default(false))
      }}
    bootwright_libvirt_root_disk_virtual_size: >-
      {{
        bootwright_libvirt_root_disk_info.stdout | default('')
        | bootwright.core.bootwright_qemu_image_virtual_size
      }}
  changed_when: false

- name: Require a conclusive existing libvirt root disk probe
  ansible.builtin.assert:
    that:
      - >-
        not (bootwright_libvirt_root_disk_present | bool)
        or (
          bootwright_libvirt_root_disk_info.rc is defined
          and bootwright_libvirt_root_disk_info.rc == 0
          and bootwright_libvirt_root_disk_info.stdout is defined
          and (bootwright_libvirt_root_disk_virtual_size | int) >= 0
        )
    fail_msg: >-
      Could not read valid qemu-img metadata for the existing root disk of
      {{ bootwright_current_cluster.name }}/{{ bootwright_component.name }}.
      Refusing to change its ownership or redefine its domain while the disk's
      identity and size are unproven. Restore access to the image and qemu-img,
      then retry the exact invocation `{{ bootwright_mutating_invocation }}`.

- name: Refuse an in-place libvirt root disk resize
  ansible.builtin.assert:
    that:
      - (bootwright_libvirt_root_disk_virtual_size | int) == ((bootwright_component.profile.diskGiB | int) * 1073741824)
    fail_msg: >-
      Machine {{ bootwright_component.name }} declares profile diskGiB={{ bootwright_component.profile.diskGiB }}
      ({{ (bootwright_component.profile.diskGiB | int) * 1073741824 }} bytes) but its provisioned root disk is
      {{ bootwright_libvirt_root_disk_virtual_size }} bytes. Bootwright does not
      resize a provisioned root disk in place — the guest partitions would not follow.
      Rebuild exactly this selected work set with
      `{{ bootwright_apply_rebuild_invocation }}`
      to change its root disk size.
  when:
    - bootwright_libvirt_root_disk_present | bool
    - not (bootwright_libvirt_managed_os_reset | bool)

- name: Create machine disk
  ansible.builtin.command:
    argv:
      - qemu-img
      - create
      - -f
      - qcow2
      - "{{ bootwright_libvirt_storage_root }}/disk.qcow2"
      - "{{ bootwright_component.profile.diskGiB }}G"
  args:
    creates: "{{ bootwright_libvirt_storage_root }}/disk.qcow2"

- name: Create machine data disks ({{ bootwright_libvirt_data_disks | length }} configured)
  ansible.builtin.command:
    argv:
      - qemu-img
      - create
      - -f
      - qcow2
      - "{{ bootwright_libvirt_storage_root }}/data-{{ item.name }}.qcow2"
      - "{{ item.sizeGiB }}G"
  args:
    creates: "{{ bootwright_libvirt_storage_root }}/data-{{ item.name }}.qcow2"
  loop: "{{ bootwright_libvirt_data_disks }}"
  loop_control:
    label: "{{ item.name }}"

- name: Align libvirt disk image ownership
  ansible.builtin.file:
    path: "{{ item }}"
    owner: "{{ bootwright_libvirt_runtime_user }}"
    group: root
    mode: "0600"
  loop: "{{ bootwright_libvirt_disk_paths }}"
  loop_control:
    label: "{{ item }}"

- name: Restore libvirt storage labels
  ansible.builtin.command:
    argv:
      - restorecon
      - -RFv
      - "{{ bootwright_libvirt_storage_root }}"
  register: bootwright_libvirt_storage_restorecon
  changed_when: bootwright_libvirt_storage_restorecon.stdout | length > 0
  when: ansible_selinux.status | default('disabled') == 'enabled'

- name: Render libvirt domain XML
  ansible.builtin.template:
    src: domain.xml.j2
    dest: "{{ bootwright_libvirt_machine_root }}/domain.xml"
    owner: root
    group: root
    mode: "0644"
  register: bootwright_libvirt_domain_xml

- name: Slurp libvirt domain XML
  ansible.builtin.slurp:
    src: "{{ bootwright_libvirt_machine_root }}/domain.xml"
  register: bootwright_libvirt_domain_xml_slurp

- name: Define libvirt domain
  community.libvirt.virt:
    command: define
    uri: "{{ bootwright_component.libvirt.uri | default('qemu:///system', true) }}"
    xml: "{{ bootwright_libvirt_domain_xml_slurp.content | b64decode }}"

- name: Record libvirt domain ownership
  ansible.builtin.include_role:
    name: bootwright.core.ownership_record
    tasks_from: resource.yml
  vars:
    bootwright_ownership_kind: libvirt-domain
    bootwright_ownership_name: "{{ bootwright_current_cluster.name }}-{{ bootwright_component.name }}"
    bootwright_ownership_fields:
      provider: "{{ bootwright_component.providerName }}"
      cluster: "{{ bootwright_current_cluster.name }}"
      machine: "{{ bootwright_component.name }}"
      paths:
        - "{{ bootwright_libvirt_machine_root }}"
        - "{{ bootwright_libvirt_storage_root }}"
      attributes:
        domain: "{{ bootwright_current_cluster.name }}-{{ bootwright_component.name }}"
        network: "{{ bootwright_libvirt_network_name }}"
        uri: "{{ bootwright_component.libvirt.uri | default('qemu:///system', true) }}"
