---
- name: Resolve libvirt destroy identifiers
  ansible.builtin.set_fact:
    bootwright_libvirt_network_name: "bw-{{ bootwright_current_cluster.name }}"
    bootwright_libvirt_machine_root: "{{ bootwright_clusters_dir }}/{{ bootwright_current_cluster.name }}/runtime/provider-state/libvirt/machines/{{ bootwright_component.name }}"
    bootwright_libvirt_storage_root: "/var/lib/libvirt/images/bootwright/{{ bootwright_clusters_dir | dirname | basename }}/clusters/{{ bootwright_current_cluster.name }}/machines/{{ bootwright_component.name }}"
  changed_when: false

# A foreign domain that happens to match the <cluster>-<machine> naming on this
# hypervisor must not be destroyed/undefined. Read the domain XML and require the
# Bootwright ownership marker for this context, cluster, and machine before
# touching it (mirrors the context-sweep ownership check). When the domain is
# absent the probe fails and the assert is skipped, so destroy stays idempotent.
- name: Read libvirt domain ownership metadata
  ansible.builtin.command:
    argv:
      - virsh
      - -c
      - "{{ bootwright_component.libvirt.uri | default('qemu:///system', true) }}"
      - dumpxml
      - "{{ bootwright_current_cluster.name }}-{{ bootwright_component.name }}"
  register: bootwright_libvirt_destroy_domain_xml
  changed_when: false
  failed_when: false

- name: Resolve libvirt domain ownership for destroy
  ansible.builtin.set_fact:
    # Match the marker regardless of the XML namespace prefix: the managed-OS
    # media insert round-trips the domain through ElementTree, which re-emits the
    # bootwright namespace with a generated prefix (e.g. ns0:). The marker stays
    # semantically intact, so key on the element's local name, not the literal
    # prefix, otherwise a genuinely Bootwright-owned VM fails the ownership check.
    bootwright_libvirt_destroy_owned: >-
      {{
        (bootwright_libvirt_destroy_domain_xml.stdout | default('')) is search('<([A-Za-z0-9_]+:)?context>' ~ (bootwright_clusters_dir | dirname | basename | regex_escape) ~ '</([A-Za-z0-9_]+:)?context>')
        and (bootwright_libvirt_destroy_domain_xml.stdout | default('')) is search('<([A-Za-z0-9_]+:)?cluster>' ~ (bootwright_current_cluster.name | regex_escape) ~ '</([A-Za-z0-9_]+:)?cluster>')
        and (bootwright_libvirt_destroy_domain_xml.stdout | default('')) is search('<([A-Za-z0-9_]+:)?machine>' ~ (bootwright_component.name | regex_escape) ~ '</([A-Za-z0-9_]+:)?machine>')
      }}
  changed_when: false
  when: bootwright_libvirt_destroy_domain_xml.rc | default(1) == 0

# --force-unowned (bootwright_destroy_force_unowned) relaxes this refusal so a
# domain that matches the <cluster>-<machine> naming but carries a missing or
# mismatched marker — e.g. after the desired-state names changed post-apply — is
# still torn down. Without it, the marker mismatch fails closed as before.
- name: Refuse to destroy a non-Bootwright libvirt domain
  ansible.builtin.assert:
    that:
      - bootwright_libvirt_destroy_owned | default(false) | bool
    fail_msg: >-
      Refusing to destroy libvirt domain
      {{ bootwright_current_cluster.name }}-{{ bootwright_component.name }}:
      it carries no Bootwright ownership marker for this context/cluster/machine,
      so it may be a foreign domain that happens to match the naming. Verify the
      domain before removing it manually, then retry, or pass --force-unowned to
      tear it down anyway.
  when:
    - bootwright_libvirt_destroy_domain_xml.rc | default(1) == 0
    - not (bootwright_destroy_force_unowned | default(false) | bool)

- name: Warn before force-destroying an unowned libvirt domain
  ansible.builtin.debug:
    msg: >-
      --force-unowned: destroying libvirt domain
      {{ bootwright_current_cluster.name }}-{{ bootwright_component.name }}
      despite a missing or mismatched Bootwright ownership marker for this
      context/cluster/machine.
  when:
    - bootwright_libvirt_destroy_domain_xml.rc | default(1) == 0
    - bootwright_destroy_force_unowned | default(false) | bool
    - not (bootwright_libvirt_destroy_owned | default(false) | bool)

- name: Stop libvirt domain
  community.libvirt.virt:
    name: "{{ bootwright_current_cluster.name }}-{{ bootwright_component.name }}"
    state: destroyed
  failed_when: false

- name: Undefine libvirt domain
  community.libvirt.virt:
    command: undefine
    name: "{{ bootwright_current_cluster.name }}-{{ bootwright_component.name }}"
    flags:
      - keep_nvram
  failed_when: false

- name: Remove machine state directory
  ansible.builtin.file:
    path: "{{ bootwright_libvirt_machine_root }}"
    state: absent

- name: Remove machine storage directory
  ansible.builtin.file:
    path: "{{ bootwright_libvirt_storage_root }}"
    state: absent

- name: Remove libvirt domain ownership record
  ansible.builtin.include_role:
    name: bootwright.core.ownership_record
    tasks_from: remove_resource.yml
  vars:
    bootwright_ownership_kind: libvirt-domain
    bootwright_ownership_name: "{{ bootwright_current_cluster.name }}-{{ bootwright_component.name }}"

- name: Remove managed OS install artifacts
  ansible.builtin.include_role:
    name: bootwright.core.ownership_record
    tasks_from: destroy_resource.yml
  vars:
    bootwright_ownership_record:
      kind: managed-os-install
      name: "{{ bootwright_current_cluster.name }}-{{ bootwright_component.name }}"
      paths:
        - "{{ bootwright_provider_state_dir }}/os-install/{{ bootwright_current_cluster.name }}/{{ bootwright_component.name }}"
      attributes: {}
  when: bootwright_component.osManaged | default(false) | bool

- name: Remove libvirt network (idempotent across machines)
  community.libvirt.virt_net:
    name: "{{ bootwright_libvirt_network_name }}"
    state: absent
  failed_when: false

- name: Remove libvirt network ownership record
  ansible.builtin.include_role:
    name: bootwright.core.ownership_record
    tasks_from: remove_resource.yml
  vars:
    bootwright_ownership_kind: libvirt-network
    bootwright_ownership_name: "{{ bootwright_current_cluster.name }}"
