---

- name: "[bmc credentialsRef {{ bootwright_validate_cred_ref }}] Load BMC credentials"
  ansible.builtin.include_role:
    name: bootwright.core.support_credentials
    tasks_from: load
  vars:
    bootwright_creds_path: "{{ bootwright_secrets_dir }}/{{ bootwright_validate_cred_ref }}"
    bootwright_creds_var: bootwright_validate_bmc_credential_loaded
    bootwright_creds_label: "BMC credentialsRef {{ bootwright_secrets_dir }}/{{ bootwright_validate_cred_ref }}"

- name: "[bmc credentialsRef {{ bootwright_validate_cred_ref }}] Record BMC credentials"
  ansible.builtin.set_fact:
    bootwright_validate_bmc_credentials: >-
      {{
        bootwright_validate_bmc_credentials | default({})
        | combine({bootwright_validate_cred_ref: bootwright_validate_bmc_credential_loaded})
      }}
  no_log: "{{ bootwright_no_log | default(true) | bool }}"
  changed_when: false
