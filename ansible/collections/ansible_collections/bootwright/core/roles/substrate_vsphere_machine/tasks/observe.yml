---
- name: Validate the frozen vSphere Machine request
  ansible.builtin.assert:
    that:
      - bootwright_substrate_vsphere_request.version == 'machine-vsphere-v1'
      - bootwright_substrate_vsphere_request.tlsVerify is sameas true
      - bootwright_substrate_vsphere_digest is match('^[0-9a-f]{64}$(?!\n)')
    quiet: true
  no_log: true

- name: Complete the qualified execution handoff
  bootwright.core.substrate_vsphere_protocol:
    phase: loaded
  no_log: true

- name: Run the observe operation through vCenter
  bootwright.core.substrate_vsphere_api:
    operation: observe
    request: '{{ bootwright_substrate_vsphere_request }}'
    material: '{{ bootwright_substrate_vsphere_material }}'
  register: substrate_vsphere_machine_result
  failed_when: false
  no_log: true
  diff: false

- name: Report the sanitized vCenter refusal
  ansible.builtin.assert:
    that:
      - substrate_vsphere_machine_result.msg is not defined
    fail_msg: '{{ substrate_vsphere_machine_result.msg | default("vCenter operation failed") }}'
    quiet: true

- name: Publish bounded Machine evidence
  bootwright.core.substrate_vsphere_protocol:
    phase: completed
    observed: true
    outcome: '{{ "changed" if substrate_vsphere_machine_result.changed else "unchanged" }}'
    digest: '{{ bootwright_substrate_vsphere_digest }}'
    observation: '{{ substrate_vsphere_machine_result.observation }}'
  no_log: true
