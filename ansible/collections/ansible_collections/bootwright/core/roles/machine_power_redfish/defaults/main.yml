---
# Derived from the frozen request only. Nothing here is authored by desired
# state, and no value selects an executable, a role or a task file.
#
# A graceful shutdown waits for the operating system rather than for a
# hypervisor, so the poll bound is the one an ordinary shutdown needs and
# never becomes an unbounded wait.
machine_power_redfish_attempts: 150

# The identity refusal prints what a management controller reported, and a
# controller promises neither printable text nor a length. Each identity it
# names loses these characters, the C0 and C1 controls and DEL, and is then cut
# to the 128 characters the evidence path bounds an identity to, so the run's
# retained output carries no terminal escape and no unbounded value.
machine_power_redfish_control_characters: '[\x00-\x1f\x7f-\x9f]'
