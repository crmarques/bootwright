---
# Derived from the frozen request only. Nothing here is authored by desired
# state, and no value selects an executable, a role or a task file.
#
# A graceful shutdown waits for the operating system rather than for a
# hypervisor, so the poll bound is the one an ordinary shutdown needs and
# never becomes an unbounded wait.
machine_power_redfish_attempts: 150

# The controller's trust bundle as PEM, the one anchor its transport is
# verified against, or empty when the controller declares none and the system
# trust store anchors it.
machine_power_redfish_ca_data: >-
  {{ lookup('ansible.builtin.file', bootwright_machine_power_material.controllerCA)
     if bootwright_machine_power_material.controllerCA | default('') | length > 0 else '' }}

# Whether the machine answers as the system this context's current apply
# proved: each identity the pin records is the one its controller reports now.
# It is read only once that identity has been read (tasks/power.yml), and both
# the refusal the runner is told of and the refusal the run prints decide from
# this one comparison.
machine_power_redfish_answers_as_pinned: >-
  {{ ((bootwright_machine_power_material.pinnedUUIDBase64 | default('') | length == 0)
      or ((machine_power_redfish_identity.observation.uuid | default('') | trim | lower)
          == (bootwright_machine_power_material.pinnedUUIDBase64 | b64decode | trim | lower)))
     and ((bootwright_machine_power_material.pinnedSerialBase64 | default('') | length == 0)
      or ((machine_power_redfish_identity.observation.serial | default('') | trim)
          == (bootwright_machine_power_material.pinnedSerialBase64 | b64decode | trim))) }}

machine_power_redfish_state_read:
  libvirt: bootwright.core.substrate_libvirt_machine
  baremetal: bootwright.core.substrate_baremetal_machine

machine_power_redfish_power:
  libvirt: bootwright.core.substrate_libvirt_machine
  baremetal: bootwright.core.substrate_baremetal_machine

machine_power_redfish_port_result:
  libvirt: substrate_libvirt_machine_port_result
  baremetal: substrate_baremetal_machine_port_result

machine_power_redfish_access:
  endpoint: '{{ bootwright_machine_power_request.controller.endpoint }}'
  user: '{{ bootwright_machine_power_material.controllerUser }}'
  password: '{{ bootwright_machine_power_material.controllerPassword }}'
  ca: "{{ bootwright_machine_power_material.controllerCA | default('') }}"
  verify: '{{ bootwright_machine_power_request.controller.tlsVerify }}'
