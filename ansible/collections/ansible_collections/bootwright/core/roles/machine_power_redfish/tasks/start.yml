---
- name: Report the power-on
  bootwright.core.machine_power_protocol:
    phase: group
    group: power-on
    status: running
  no_log: true

- name: Bring the machine to on through its management controller
  bootwright.core.redfish_boot:
    endpoint: '{{ bootwright_machine_power_request.controller.endpoint }}'
    user: '{{ lookup("ansible.builtin.file", bootwright_machine_power_material.controllerUser) }}'
    password: '{{ lookup("ansible.builtin.file", bootwright_machine_power_material.controllerPassword) }}'
    verify: '{{ bootwright_machine_power_request.controller.tlsVerify }}'
    ca_data: '{{ machine_power_redfish_ca_data }}'
    operation: power-on
    attempts: '{{ machine_power_redfish_attempts }}'
  register: machine_power_redfish_started
  failed_when: false
  no_log: true

# ansible-core keeps nothing of a failure under no_log but that it failed, so
# the controller's own refusal is reported here, where no credential is.
- name: Stop at a power-on the management controller did not complete
  ansible.builtin.assert:
    that:
      - machine_power_redfish_started.msg is not defined
    fail_msg: >-
      bringing Machine/{{ bootwright_machine_power_request.identity.object }} to on
      failed:
      {{ (machine_power_redfish_started.msg | default('') | string | bootwright.core.printable)[:512] }}
    quiet: true

- name: Publish the proved power-on
  bootwright.core.machine_power_protocol:
    phase: group
    group: power-on
    status: ok
  no_log: true
