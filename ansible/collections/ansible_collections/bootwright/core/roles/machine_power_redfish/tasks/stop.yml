---
# A graceful request asks the operating system to stop and is polled to off.
# Cutting the power is a separate, explicitly requested operation, because a
# running system loses whatever it had not written.
- name: Report the power-off
  bootwright.core.machine_power_protocol:
    phase: group
    group: power-off
    status: running
  no_log: true

- name: Bring the machine to off through its management controller
  ansible.builtin.include_role:
    name: "{{ machine_power_redfish_power[bootwright_machine_power_material.substrate] }}"
    tasks_from: power
  vars:
    bootwright_machine_port: >-
      {{ machine_power_redfish_access | combine({'power': 'off', 'force': bootwright_machine_power_request.force,
         'attempts': machine_power_redfish_attempts}) }}

- name: Retain the machine port answer
  ansible.builtin.set_fact:
    machine_power_redfish_stopped: "{{ vars[machine_power_redfish_port_result[bootwright_machine_power_material.substrate]] }}"
  no_log: true

# ansible-core keeps nothing of a failure under no_log but that it failed, so
# the controller's own refusal is reported here, where no credential is.
- name: Stop at a power-off the management controller did not complete
  ansible.builtin.assert:
    that:
      - machine_power_redfish_stopped.msg is not defined
    fail_msg: >-
      bringing Machine/{{ bootwright_machine_power_request.identity.object }} to off
      failed:
      {{ (machine_power_redfish_stopped.msg | default('') | string | bootwright.core.printable)[:512] }}
    quiet: true

- name: Publish the proved power-off
  bootwright.core.machine_power_protocol:
    phase: group
    group: power-off
    status: ok
  no_log: true
