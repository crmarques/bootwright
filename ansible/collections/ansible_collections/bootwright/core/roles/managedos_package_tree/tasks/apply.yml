---
- name: Validate the frozen package tree request
  ansible.builtin.assert:
    that:
      - bootwright_os_tree_request.version == 'os-package-tree-v1'
      - bootwright_os_tree_request.identity.context is match('^[a-zA-Z0-9][a-zA-Z0-9_.-]*$(?!\n)')
      - bootwright_os_tree_request.identity.profile is match('^[a-zA-Z0-9][a-zA-Z0-9_.-]*$(?!\n)')
      - bootwright_os_tree_request.publication.path is string
      - bootwright_os_tree_request.area | length > 0
      - bootwright_os_tree_request.area | reject('match', '^[a-zA-Z0-9][a-zA-Z0-9_.-]*$(?!\n)') | list | length == 0
      - bootwright_os_tree_request.server is string
      - bootwright_os_tree_request.servedRoot is string
      - >-
        bootwright_os_tree_request.server | dirname
        == (['/var/lib/bootwright-hosted', bootwright_os_tree_request.identity.context] + bootwright_os_tree_request.area) | join('/')
      - bootwright_os_tree_request.server | basename is match('^[a-zA-Z0-9][a-zA-Z0-9_.-]*$(?!\n)')
      - bootwright_os_tree_request.servedRoot | dirname == bootwright_os_tree_request.server
      - bootwright_os_tree_request.servedRoot | basename is match('^[a-zA-Z0-9][a-zA-Z0-9_.-]*$(?!\n)')
      - >-
        bootwright_os_tree_request.publication.path
        == bootwright_os_tree_request.servedRoot ~ '/os/' ~ bootwright_os_tree_request.identity.profile ~ '/tree'
      - >-
        bootwright_os_tree_request.publication.path.split('/')[1:]
        | select('in', ['', '.', '..']) | list | length == 0
      - bootwright_os_tree_request.media.name is match('^[a-zA-Z0-9][a-zA-Z0-9_.-]*$(?!\n)')
      - bootwright_os_tree_request.media.sha256 is match('^[0-9a-f]{64}$(?!\n)')
      - bootwright_os_tree_request.media.size | int > 0
      - bootwright_os_tree_digest is match('^[0-9a-f]{64}$(?!\n)')
    quiet: true
  no_log: true

- name: Complete the qualified execution handoff
  bootwright.core.managedos_tree_protocol:
    phase: loaded
  no_log: true

- name: Prove the artifact server's hosted directories before any effect
  bootwright.core.hosted_area:
    context: '{{ bootwright_os_tree_request.identity.context }}'
    path: '{{ managedos_package_tree_area }}'
    state: proved
  register: managedos_package_tree_hosted

- name: Read the artifact server's content root
  ansible.builtin.stat:
    path: '{{ managedos_package_tree_server }}'
    follow: false
  register: managedos_package_tree_server_root

- name: Name an artifact server that is not applied
  bootwright.core.managedos_tree_protocol:
    phase: refused
    reason: artifact-server-not-applied
  when: not (managedos_package_tree_server_applied | bool)
  no_log: true

- name: Refuse an artifact server that is not applied before any effect
  ansible.builtin.assert:
    that:
      - managedos_package_tree_server_applied | bool
    fail_msg: >-
      {{ managedos_package_tree_server }} is not the content root of an applied
      artifact server: apply the artifact server (the infrastructure-services
      stage) first, then this tree
    quiet: true

- name: Read the frozen source media
  ansible.builtin.stat:
    path: '{{ managedos_package_tree_media }}'
    follow: false
    get_checksum: true
    checksum_algorithm: sha256
  register: managedos_package_tree_source

- name: Name source media that changed after planning
  bootwright.core.managedos_tree_protocol:
    phase: refused
    reason: media-changed-tree
  when: not (managedos_package_tree_media_unchanged | bool)
  no_log: true

- name: Refuse source media that changed after planning
  ansible.builtin.assert:
    that:
      - managedos_package_tree_media_unchanged | bool
    quiet: true

- name: Read the shared tree before publication
  bootwright.core.managedos_tree_inspect:
    request: '{{ bootwright_os_tree_request }}'
  register: managedos_package_tree_observed

- name: Name an existing tree from another source
  bootwright.core.managedos_tree_protocol:
    phase: refused
    reason: tree-source-drift
  when: not (managedos_package_tree_source_matches | bool)
  no_log: true

- name: Refuse an existing tree from another source
  ansible.builtin.assert:
    that:
      - managedos_package_tree_source_matches | bool
    quiet: true

- name: Publish the frozen tree when incomplete
  when: not (managedos_package_tree_observed.observation.tree | bool)
  block:
    - name: Create the package tree parent
      ansible.builtin.file:
        path: '{{ bootwright_os_tree_request.publication.path | dirname }}'
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Clear incomplete publication and staging content
      ansible.builtin.file:
        path: '{{ item }}'
        state: absent
      loop:
        - '{{ bootwright_os_tree_request.publication.path }}/.treeinfo'
        - '{{ bootwright_os_tree_request.publication.path }}'
        - '{{ managedos_package_tree_staging }}'

    - name: Extract the frozen media into staging
      ansible.builtin.command:
        argv:
          - /usr/bin/xorriso
          - -osirrox
          - 'on'
          - -indev
          - '{{ managedos_package_tree_media }}'
          - -extract
          - /
          - '{{ managedos_package_tree_staging }}'
        expand_argument_vars: false
      changed_when: true

    - name: Verify the extracted tree has its complete marker
      ansible.builtin.stat:
        path: '{{ managedos_package_tree_staging }}/.treeinfo'
        follow: false
      register: managedos_package_tree_marker

    - name: Refuse source media without an installation tree
      ansible.builtin.assert:
        that:
          - managedos_package_tree_marker.stat.isreg | default(false)
          - not (managedos_package_tree_marker.stat.islnk | default(true))
        quiet: true

    - name: Record the frozen source in the staged tree
      ansible.builtin.copy:
        content: "{{ bootwright_os_tree_request.media.sha256 }}\n"
        dest: '{{ managedos_package_tree_staging }}/.bootwright-tree-identity'
        owner: root
        group: root
        mode: '0640'

    - name: Label the tree for its serving process
      ansible.builtin.command:
        argv:
          - /usr/bin/chcon
          - --recursive
          - --reference
          - '{{ managedos_package_tree_served_root }}'
          - '{{ managedos_package_tree_staging }}'
        expand_argument_vars: false
      changed_when: true

    - name: Publish the complete tree by atomic rename
      ansible.builtin.command:
        argv:
          - /usr/bin/mv
          - --no-target-directory
          - '{{ managedos_package_tree_staging }}'
          - '{{ bootwright_os_tree_request.publication.path }}'
        expand_argument_vars: false
      changed_when: true
  always:
    - name: Remove this publication's staging area
      ansible.builtin.file:
        path: '{{ managedos_package_tree_staging }}'
        state: absent

- name: Clear stale staging beside an already complete tree
  ansible.builtin.file:
    path: '{{ managedos_package_tree_staging }}'
    state: absent
  register: managedos_package_tree_staging_removed

- name: Prove the published tree answers through its trusted listener
  ansible.builtin.include_role:
    name: bootwright.core.infrastructureservices_artifact_listener
    tasks_from: proof
  vars:
    infrastructureservices_artifact_listener_url: '{{ bootwright_os_tree_request.publication.url }}/.treeinfo'
    infrastructureservices_artifact_listener_ca: '{{ bootwright_os_tree_material.certificate | default("") }}'
    infrastructureservices_artifact_listener_subject: '{{ bootwright_os_tree_request.publication.url }}/.treeinfo'
    infrastructureservices_artifact_listener_consequence: so the tree was not reported published

- name: Read the published tree proof
  bootwright.core.managedos_tree_inspect:
    request: '{{ bootwright_os_tree_request }}'
  register: managedos_package_tree_after

- name: Publish bounded package tree completion evidence
  bootwright.core.managedos_tree_protocol:
    phase: completed
    outcome: "{{ 'unchanged' if managedos_package_tree_observed.observation.tree and not managedos_package_tree_staging_removed.changed else 'changed' }}"
    digest: '{{ bootwright_os_tree_digest }}'
    observation: '{{ managedos_package_tree_after.observation }}'
  no_log: true
