---
- name: Validate the frozen package tree request
  ansible.builtin.assert:
    that:
      - bootwright_os_tree_request.version == 'os-package-tree-v1'
      - bootwright_os_tree_request.identity.context is match('^[a-zA-Z0-9][a-zA-Z0-9_.-]*$')
      - bootwright_os_tree_request.identity.profile is match('^[a-zA-Z0-9][a-zA-Z0-9_.-]*$')
      - bootwright_os_tree_request.publication.path.startswith('/var/lib/bootwright-services/' ~ bootwright_os_tree_request.identity.context ~ '/')
      - bootwright_os_tree_request.publication.path.endswith('/public/os/' ~ bootwright_os_tree_request.identity.profile ~ '/tree')
      - "'/../' not in bootwright_os_tree_request.publication.path"
      - bootwright_os_tree_request.media.name is match('^[a-zA-Z0-9][a-zA-Z0-9_.-]*$')
      - bootwright_os_tree_request.media.sha256 is match('^[0-9a-f]{64}$')
      - bootwright_os_tree_request.media.size | int > 0
      - bootwright_os_tree_digest is match('^[0-9a-f]{64}$')
    quiet: true
  no_log: true

- name: Complete the qualified execution handoff
  bootwright.core.managedos_tree_protocol:
    phase: loaded
  no_log: true

- name: Prove the publication paths before removal
  bootwright.core.managedos_tree_inspect:
    request: '{{ bootwright_os_tree_request }}'

- name: Withdraw the complete marker before removing tree content
  ansible.builtin.file:
    path: '{{ bootwright_os_tree_request.publication.path }}/.treeinfo'
    state: absent
  register: managedos_package_tree_marker_removed

- name: Remove the shared package tree and its staging area
  ansible.builtin.file:
    path: '{{ item }}'
    state: absent
  loop:
    - '{{ bootwright_os_tree_request.publication.path }}'
    - '{{ managedos_package_tree_staging }}'
  register: managedos_package_tree_removed

- name: Read the profile directory before empty directory removal
  ansible.builtin.stat:
    path: '{{ bootwright_os_tree_request.publication.path | dirname }}'
    follow: false
  register: managedos_package_tree_parent_before

- name: Remove the profile directory only when empty
  ansible.builtin.command:
    argv:
      - /usr/bin/rmdir
      - --ignore-fail-on-non-empty
      - '{{ bootwright_os_tree_request.publication.path | dirname }}'
    expand_argument_vars: false
  when: managedos_package_tree_parent_before.stat.exists
  changed_when: false

- name: Read whether the profile directory remains
  ansible.builtin.stat:
    path: '{{ bootwright_os_tree_request.publication.path | dirname }}'
    follow: false
  register: managedos_package_tree_parent_after

- name: Read the shared tree after removal
  bootwright.core.managedos_tree_inspect:
    request: '{{ bootwright_os_tree_request }}'
  register: managedos_package_tree_observed

- name: Publish bounded package tree removal evidence
  bootwright.core.managedos_tree_protocol:
    phase: completed
    outcome: >-
      {{ 'changed' if managedos_package_tree_removed.changed or managedos_package_tree_marker_removed.changed
         or (managedos_package_tree_parent_before.stat.exists and not managedos_package_tree_parent_after.stat.exists)
         else 'unchanged' }}
    digest: '{{ bootwright_os_tree_digest }}'
    observation: '{{ managedos_package_tree_observed.observation }}'
    removed: true
  no_log: true
