---
- name: Validate the frozen Ceph request
  ansible.builtin.assert:
    that:
      - bootwright_ceph_request.version == 'ceph-core-v22'
      - bootwright_ceph_digest is match('^[0-9a-f]{64}$')
      - ansible_connection == 'local'
    quiet: true
  no_log: true

- name: Complete the qualified execution handoff
  bootwright.core.ceph_cluster_protocol:
    phase: loaded
  no_log: true

- name: Execute the fixed Ceph destroy operation
  bootwright.core.ceph_cluster:
    request: '{{ bootwright_ceph_request }}'
    operation: destroy
    digest: '{{ bootwright_ceph_digest }}'
    material: '{{ bootwright_ceph_material }}'
    outputs: '{{ bootwright_ceph_output | default({}) }}'
  register: storage_ceph_core_result
  failed_when: false
  no_log: true
  diff: false

- name: Publish the fixed Ceph refusal
  bootwright.core.ceph_cluster_protocol:
    phase: refused
    reason: '{{ storage_ceph_core_result.reason | default("adapter-exception") }}'
    native_error: '{{ storage_ceph_core_result.nativeError | default(omit) }}'
    detail: >-
      {{ storage_ceph_core_result.detail
        | default(omit if storage_ceph_core_result.reason is defined else "module-failure") }}
  when: storage_ceph_core_result.evidence is not defined
  no_log: true

- name: Refuse an unproved Ceph operation
  ansible.builtin.fail:
    msg: The Ceph operation was refused; the run names its reason
  when: storage_ceph_core_result.evidence is not defined

- name: Publish bounded Ceph capability evidence
  bootwright.core.ceph_cluster_protocol:
    phase: completed
    digest: '{{ bootwright_ceph_digest }}'
    outcome: '{{ "changed" if storage_ceph_core_result.changed else "unchanged" }}'
    observed: false
    removed: true
    evidence: '{{ storage_ceph_core_result.evidence }}'
  no_log: true
