---
- name: Write managed OS install marker
  ansible.builtin.command:
    argv:
      - ssh
      - -i
      - "{{ bootwright_component.osInstall.ssh.privateKeyPath }}"
      - -o
      - BatchMode=yes
      - -o
      - StrictHostKeyChecking=yes
      - -o
      - UserKnownHostsFile={{ bootwright_component.osInstall.ssh.knownHostsPath }}
      - "{{ bootwright_component.osInstall.ssh.user }}@{{ bootwright_component.osInstall.ssh.address }}"
      - >-
        sudo install -d -m 0755 {{ bootwright_os_marker_path | dirname | quote }}
        && printf '%s\n' {{ bootwright_os_marker_payload | quote }}
        | sudo tee {{ bootwright_os_marker_path | quote }} >/dev/null
        && sudo chmod 0644 {{ bootwright_os_marker_path | quote }}
  delegate_to: localhost
  # The kickstart %post already writes this marker on a fresh install, and
  # probe_existing.yml records whether the on-host marker already matches the
  # desired payload. Skip the redundant SSH rewrite on a converged host, and
  # report changed honestly when a real (re)write happens instead of hiding the
  # remote mutation behind changed_when:false.
  changed_when: true
  when: not (bootwright_os_pre_marker_matches | default(false) | bool)
