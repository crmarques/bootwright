---
- name: Validate managed Anaconda install inputs
  ansible.builtin.assert:
    that:
      - bootwright_component.osInstall is mapping
      - bootwright_component.osInstall.image is mapping
      - (bootwright_component.osInstall.image.kind | default('') | length) > 0
      - (bootwright_component.osInstall.kickstart.hostname | default('') | length) > 0
      - (bootwright_component.osInstall.ssh.address | default('') | length) > 0
      - (bootwright_component.osInstall.ssh.user | default('') | length) > 0
      - (bootwright_component.osInstall.ssh.privateKeyPath | default('') | length) > 0
      - bootwright_component.boot is mapping
      - bootwright_component.boot.agentIso is mapping
    fail_msg: "managed Anaconda OS install needs image, kickstart, SSH, and boot virtual-media vars"

- name: Validate managed Anaconda install source
  ansible.builtin.assert:
    that:
      - >-
        not (
          ((bootwright_component.osInstall.image.mediaType | default('dvd')) == 'boot')
          and ((bootwright_component.osInstall.installer.sourceURL | default('') | length) == 0)
          and not (bootwright_component.osInstall.installer.rhsm.enabled | default(false) | bool)
        )
    fail_msg: >-
      Managed Anaconda OS install image {{ bootwright_component.osInstall.image.original | default('') }}
      is marked as mediaType=boot, but no installer source was
      rendered. Configure MachineImage spec.installSource with an install
      source, or use mediaType=dvd for full install media that can be installed
      from CD-ROM.

- name: Validate managed Anaconda RHSM install source
  ansible.builtin.assert:
    that:
      - (bootwright_component.osInstall.installer.rhsm.organizationPath | default('') | length) > 0
      - (bootwright_component.osInstall.installer.rhsm.activationKeyPath | default('') | length) > 0
    fail_msg: "managed Anaconda RHSM install source needs organizationRef and activationKeyRef secret paths"
  when: bootwright_component.osInstall.installer.rhsm.enabled | default(false) | bool

- name: Resolve managed OS install paths
  ansible.builtin.set_fact:
    bootwright_os_install_root: "{{ bootwright_provider_state_dir }}/os-install/{{ bootwright_current_os_group.name }}/{{ bootwright_component.name }}"
    bootwright_os_install_token: "{{ (bootwright_current_os_group.name ~ '-' ~ bootwright_component.name ~ '-osinstall') | to_uuid }}"
  changed_when: false

- name: Resolve managed OS install files
  ansible.builtin.set_fact:
    bootwright_os_source_iso: "{{ bootwright_os_install_root }}/source.iso"
    bootwright_os_source_id_path: "{{ bootwright_os_install_root }}/source.id"
    bootwright_os_kickstart_path: "{{ bootwright_os_install_root }}/ks.cfg"
    bootwright_os_install_iso: "{{ bootwright_os_install_root }}/install.iso"
    bootwright_os_install_tmpdir: "{{ bootwright_os_install_root }}/tmp"
    bootwright_os_stage_path: "{{ bootwright_component.boot.agentIso.stagePath | replace('__BOOTWRIGHT_AGENT_ISO_PUBLISH_TOKEN__', bootwright_os_install_token) }}"
    bootwright_os_fetch_url: "{{ bootwright_component.boot.agentIso.fetchUrl | replace('__BOOTWRIGHT_AGENT_ISO_PUBLISH_TOKEN__', bootwright_os_install_token) }}"
  changed_when: false

- name: Resolve managed OS install source path
  ansible.builtin.set_fact:
    bootwright_os_source_iso_effective: >-
      {{
        bootwright_component.osInstall.image.path
        if (
          (bootwright_component.osInstall.image.kind in ['media', 'file'])
          and (bootwright_component.osInstall.image.sourceOnTarget | default(false) | bool)
        )
        else bootwright_os_source_iso
      }}
  changed_when: false

- name: Probe managed OS SSH before install
  ansible.builtin.wait_for:
    host: "{{ bootwright_component.osInstall.ssh.address }}"
    port: 22
    state: started
    timeout: 5
  delegate_to: localhost
  register: bootwright_os_pre_ssh_port
  failed_when: false
  changed_when: false

- name: Record managed OS SSH host key before install when reachable
  ansible.builtin.include_tasks: ssh_trust.yml
  vars:
    bootwright_os_ssh_keyscan_required: false
    bootwright_os_ssh_keyscan_retries: 1
    bootwright_os_ssh_keyscan_delay: 1
  when:
    - not (bootwright_os_pre_ssh_port.failed | default(false))
    - (bootwright_component.osInstall.ssh.knownHostsPath | default('') | length) > 0

- name: Probe managed OS SSH authentication before install
  ansible.builtin.command:
    argv:
      - ssh
      - -i
      - "{{ bootwright_component.osInstall.ssh.privateKeyPath }}"
      - -o
      - BatchMode=yes
      - -o
      - StrictHostKeyChecking=yes
      - -o
      - UserKnownHostsFile={{ bootwright_component.osInstall.ssh.knownHostsPath }}
      - "{{ bootwright_component.osInstall.ssh.user }}@{{ bootwright_component.osInstall.ssh.address }}"
      - "true"
  delegate_to: localhost
  register: bootwright_os_pre_ssh_auth
  failed_when: false
  changed_when: false
  when:
    - not (bootwright_os_pre_ssh_port.failed | default(false))
    - (bootwright_component.osInstall.ssh.knownHostsPath | default('') | length) > 0

- name: Resolve managed OS readiness before install
  ansible.builtin.set_fact:
    bootwright_managed_os_already_ready: "{{ (bootwright_os_pre_ssh_auth.rc | default(1) | int) == 0 }}"
  changed_when: false

- name: Install managed OS from virtual media
  when: not (bootwright_managed_os_already_ready | bool)
  block:
    - name: Create managed OS install work directory
      ansible.builtin.file:
        path: "{{ bootwright_os_install_root }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Load Anaconda package list
      ansible.builtin.include_vars: "os/{{ ansible_facts['os_family'] }}.yml"

    - name: Install Anaconda ISO tooling packages
      ansible.builtin.package:
        name: "{{ bootwright_machine_os_install_anaconda_packages }}"
        state: present
      when: bootwright_machine_os_install_anaconda_packages | length > 0

    - name: Verify mkksiso is available
      ansible.builtin.command:
        argv:
          - which
          - mkksiso
      register: bootwright_mkksiso_path
      changed_when: false
      failed_when: bootwright_mkksiso_path.rc != 0

    - name: Copy managed ISO source to provider host
      ansible.builtin.copy:
        src: "{{ bootwright_component.osInstall.image.path }}"
        dest: "{{ bootwright_os_source_iso }}"
        remote_src: false
        owner: root
        group: root
        mode: "0644"
      register: bootwright_os_source_copy
      when:
        - bootwright_component.osInstall.image.kind in ['media', 'file']
        - not (bootwright_component.osInstall.image.sourceOnTarget | default(false) | bool)

    - name: Download managed ISO source on provider host
      ansible.builtin.get_url:
        url: "{{ bootwright_component.osInstall.image.url }}"
        dest: "{{ bootwright_os_source_iso }}"
        checksum: "{{ ('sha256:' ~ bootwright_component.osInstall.image.checksum) if (bootwright_component.osInstall.image.checksum | default('') | length) > 0 else omit }}"
        owner: root
        group: root
        mode: "0644"
      register: bootwright_os_source_download
      when: bootwright_component.osInstall.image.kind == 'url'

    - name: Stat managed ISO source
      ansible.builtin.stat:
        path: "{{ bootwright_os_source_iso_effective }}"
        get_checksum: false
      register: bootwright_os_source_stat

    - name: Record managed ISO source identity
      ansible.builtin.copy:
        dest: "{{ bootwright_os_source_id_path }}"
        content: |
          kind={{ bootwright_component.osInstall.image.kind | default('') }}
          original={{ bootwright_component.osInstall.image.original | default('') }}
          path={{ bootwright_os_source_iso_effective }}
          url={{ bootwright_component.osInstall.image.url | default('') }}
          checksum={{ bootwright_component.osInstall.image.checksum | default('') | regex_replace('^sha256:', '') }}
          exists={{ bootwright_os_source_stat.stat.exists | default(false) }}
          size={{ bootwright_os_source_stat.stat.size | default('') }}
          mtime={{ bootwright_os_source_stat.stat.mtime | default('') }}
          inode={{ bootwright_os_source_stat.stat.inode | default('') }}
          dev={{ bootwright_os_source_stat.stat.dev | default('') }}
        owner: root
        group: root
        mode: "0644"
      register: bootwright_os_source_identity

    - name: Verify managed ISO checksum
      ansible.builtin.command:
        argv:
          - sha256sum
          - "{{ bootwright_os_source_iso_effective }}"
      register: bootwright_os_source_sha256
      changed_when: false
      when: (bootwright_component.osInstall.image.checksum | default('') | length) > 0

    - name: Assert managed ISO checksum
      ansible.builtin.assert:
        that:
          - (bootwright_os_source_sha256.stdout.split()[0] | lower) == (bootwright_component.osInstall.image.checksum | lower | regex_replace('^sha256:', ''))
        fail_msg: "managed ISO checksum mismatch for {{ bootwright_component.osInstall.image.original }}"
      when: (bootwright_component.osInstall.image.checksum | default('') | length) > 0

    - name: Render managed OS Kickstart
      ansible.builtin.template:
        src: ks.cfg.j2
        dest: "{{ bootwright_os_kickstart_path }}"
        owner: root
        group: root
        mode: "0600"
      register: bootwright_os_kickstart
      no_log: "{{ bootwright_component.osInstall.installer.rhsm.enabled | default(false) | bool }}"

    - name: Stat managed OS install ISO
      ansible.builtin.stat:
        path: "{{ bootwright_os_install_iso }}"
        get_checksum: false
      register: bootwright_os_install_iso_stat

    - name: Resolve managed OS install ISO rebuild state
      ansible.builtin.set_fact:
        bootwright_os_install_iso_rebuild_needed: >-
          {{
            bootwright_os_source_copy.changed | default(false)
            or bootwright_os_source_download.changed | default(false)
            or bootwright_os_source_identity.changed | default(false)
            or bootwright_os_kickstart.changed | default(false)
            or not (bootwright_os_install_iso_stat.stat.exists | default(false))
          }}
      changed_when: false

    - name: Remove stale managed OS install ISO before rebuild
      ansible.builtin.file:
        path: "{{ bootwright_os_install_iso }}"
        state: absent
      when:
        - bootwright_os_install_iso_rebuild_needed | bool
        - bootwright_os_install_iso_stat.stat.exists | default(false)

    - name: Reset managed OS install ISO temp directory before rebuild
      ansible.builtin.file:
        path: "{{ bootwright_os_install_tmpdir }}"
        state: absent
      when: bootwright_os_install_iso_rebuild_needed | bool

    - name: Create managed OS install ISO temp directory
      ansible.builtin.file:
        path: "{{ bootwright_os_install_tmpdir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"
      when: bootwright_os_install_iso_rebuild_needed | bool

    - name: Build managed OS install ISO
      ansible.builtin.command:
        argv:
          - mkksiso
          - --ks
          - "{{ bootwright_os_kickstart_path }}"
          - "{{ bootwright_os_source_iso_effective }}"
          - "{{ bootwright_os_install_iso }}"
      environment:
        TMPDIR: "{{ bootwright_os_install_tmpdir }}"
        TMP: "{{ bootwright_os_install_tmpdir }}"
        TEMP: "{{ bootwright_os_install_tmpdir }}"
      when: bootwright_os_install_iso_rebuild_needed | bool

    - name: Create managed OS virtual media stage directory
      ansible.builtin.file:
        path: "{{ bootwright_os_stage_path | dirname }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Stat managed OS install ISO for virtual media stage
      ansible.builtin.stat:
        path: "{{ bootwright_os_install_iso }}"
        get_checksum: false
      register: bootwright_os_install_iso_stage_source

    - name: Stat managed OS staged virtual media ISO
      ansible.builtin.stat:
        path: "{{ bootwright_os_stage_path }}"
        get_checksum: false
      register: bootwright_os_stage_iso_stat

    - name: Resolve managed OS virtual media stage state
      ansible.builtin.set_fact:
        bootwright_os_stage_iso_linked: >-
          {{
            (bootwright_os_install_iso_stage_source.stat.exists | default(false))
            and (bootwright_os_stage_iso_stat.stat.exists | default(false))
            and ((bootwright_os_install_iso_stage_source.stat.dev | default('source')) == (bootwright_os_stage_iso_stat.stat.dev | default('stage')))
            and ((bootwright_os_install_iso_stage_source.stat.inode | default('source')) == (bootwright_os_stage_iso_stat.stat.inode | default('stage')))
          }}
      changed_when: false

    - name: Link managed OS install ISO into virtual media stage
      ansible.builtin.command:
        argv:
          - ln
          - -f
          - "{{ bootwright_os_install_iso }}"
          - "{{ bootwright_os_stage_path }}"
      register: bootwright_os_stage_link
      failed_when: false
      changed_when: bootwright_os_stage_link.rc == 0
      when: not (bootwright_os_stage_iso_linked | bool)

    - name: Copy managed OS install ISO into virtual media stage when linking is unsupported
      ansible.builtin.command:
        argv:
          - cp
          - --reflink=auto
          - --remove-destination
          - "{{ bootwright_os_install_iso }}"
          - "{{ bootwright_os_stage_path }}"
      when:
        - not (bootwright_os_stage_iso_linked | bool)
        - (bootwright_os_stage_link.rc | default(1) | int) != 0

    - name: Set managed OS virtual media stage permissions
      ansible.builtin.file:
        path: "{{ bootwright_os_stage_path }}"
        state: file
        owner: root
        group: root
        mode: "0644"

    - name: Prepare provider virtual media before managed OS boot
      ansible.builtin.include_role:
        name: "{{ bootwright_component.mediaPrepareRole }}"
      when: (bootwright_component.mediaPrepareRole | default('') | length) > 0

    - name: Resolve managed OS Redfish boot component
      ansible.builtin.set_fact:
        bootwright_managed_os_boot_component: >-
          {{
            bootwright_component | combine({
              'boot': bootwright_component.boot | combine({
                'agentIso': bootwright_component.boot.agentIso | combine({
                  'stagePath': bootwright_os_stage_path,
                  'fetchUrl': bootwright_os_fetch_url
                })
              }, recursive=True)
            }, recursive=True)
          }}
      changed_when: false

    - name: Boot managed OS installer through Redfish virtual media
      ansible.builtin.include_role:
        name: "{{ bootwright_component.bootApplyRole }}"
      vars:
        bootwright_component: "{{ bootwright_managed_os_boot_component }}"
        bootwright_agent_iso_publish_token: "{{ bootwright_os_install_token }}"
        bootwright_redfish_action: boot

- name: Wait for managed OS SSH port
  ansible.builtin.wait_for:
    host: "{{ bootwright_component.osInstall.ssh.address }}"
    port: 22
    state: started
    timeout: 1800
  delegate_to: localhost
  changed_when: false

- name: Record managed OS SSH host key
  ansible.builtin.include_tasks: ssh_trust.yml
  vars:
    bootwright_os_ssh_keyscan_required: true
    bootwright_os_ssh_keyscan_retries: 60
    bootwright_os_ssh_keyscan_delay: 10
  when: (bootwright_component.osInstall.ssh.knownHostsPath | default('') | length) > 0

- name: Verify managed OS SSH authentication
  ansible.builtin.command:
    argv:
      - ssh
      - -i
      - "{{ bootwright_component.osInstall.ssh.privateKeyPath }}"
      - -o
      - BatchMode=yes
      - -o
      - StrictHostKeyChecking=yes
      - -o
      - UserKnownHostsFile={{ bootwright_component.osInstall.ssh.knownHostsPath }}
      - "{{ bootwright_component.osInstall.ssh.user }}@{{ bootwright_component.osInstall.ssh.address }}"
      - "true"
  delegate_to: localhost
  register: bootwright_os_ssh_auth
  retries: 60
  delay: 10
  until: bootwright_os_ssh_auth.rc == 0
  changed_when: false
