---
- name: Validate managed Anaconda inputs
  ansible.builtin.import_tasks: validate.yml

- name: Resolve managed OS paths
  ansible.builtin.import_tasks: resolve.yml

- name: Probe existing managed OS state
  ansible.builtin.import_tasks: probe_existing.yml

- name: Install managed OS media when needed
  ansible.builtin.import_tasks: install_media.yml

- name: Wait for managed OS access
  ansible.builtin.import_tasks: wait.yml

- name: Write managed OS marker
  ansible.builtin.import_tasks: marker.yml
  when: bootwright_managed_os_stamp_owned | default(true) | bool

- name: Record managed OS ownership
  ansible.builtin.import_tasks: ownership.yml
  when: bootwright_managed_os_stamp_owned | default(true) | bool
