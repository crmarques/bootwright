---
- name: Report managed OS installation in progress
  ansible.builtin.debug:
    msg: >-
      Installing the operating system on {{ bootwright_component.osInstall.ssh.address }}
      with the Anaconda installer. The next steps wait for the machine to reboot into
      the installer, partition its disks, install packages, and boot the new OS before
      its SSH port answers again. This can take up to 30 minutes with no output here;
      follow live progress on the machine console (for example its BMC or KVM virtual
      console).
  when:
    - bootwright_managed_os_install_required | default(not (bootwright_managed_os_already_ready | default(false) | bool)) | bool

- name: Wait for previous managed OS SSH port to stop
  ansible.builtin.wait_for:
    host: "{{ bootwright_component.osInstall.ssh.address }}"
    port: 22
    state: stopped
    timeout: 300
  delegate_to: localhost
  changed_when: false
  when:
    - bootwright_managed_os_boot_component is defined
    - not (bootwright_os_pre_ssh_port.failed | default(true))
    - bootwright_managed_os_install_required | default(not (bootwright_managed_os_already_ready | bool)) | bool

- name: Wait for managed OS SSH port
  ansible.builtin.wait_for:
    host: "{{ bootwright_component.osInstall.ssh.address }}"
    port: 22
    state: started
    timeout: 1800
  delegate_to: localhost
  changed_when: false

- name: Clean managed OS virtual media after SSH is ready
  ansible.builtin.include_role:
    name: "{{ bootwright_component.mediaPrepareRole }}"
  vars:
    bootwright_component: "{{ bootwright_managed_os_boot_component }}"
    bootwright_vmedia_action_effective: cleanup
  when:
    - (bootwright_component.mediaPrepareRole | default('') | length) > 0
    - bootwright_managed_os_boot_component is defined

- name: Eject boot virtual media after SSH is ready
  ansible.builtin.include_role:
    name: "{{ bootwright_component.cleanupMediaRole }}"
  vars:
    bootwright_component: "{{ bootwright_managed_os_boot_component }}"
    bootwright_vmedia_action: cleanup_media
  when:
    - bootwright_managed_os_boot_component is defined
    - (bootwright_component.mediaPrepareRole | default('') | length) == 0
    - (bootwright_component.cleanupMediaRole | default('') | length) > 0

- name: Record managed OS SSH host key
  ansible.builtin.include_role:
    name: bootwright.core.machine_os_identity
    tasks_from: ssh_trust.yml
  vars:
    bootwright_os_ssh_keyscan_required: true
    bootwright_os_ssh_keyscan_retries: 60
    bootwright_os_ssh_keyscan_delay: 10
    bootwright_os_ssh_keyscan_replace: >-
      {{ bootwright_managed_os_install_required | default(not (bootwright_managed_os_already_ready | default(false) | bool)) | bool }}
  when: (bootwright_component.osInstall.ssh.knownHostsPath | default('') | length) > 0

- name: Resolve managed OS post-install SSH identity
  ansible.builtin.set_fact:
    bootwright_os_effective_user: >-
      {{
        (bootwright_managed_os_install_required | default(not (bootwright_managed_os_already_ready | default(false) | bool)) | bool)
        | ternary(
          bootwright_component.osInstall.ssh.user,
          bootwright_os_probe_user | default(bootwright_component.osInstall.ssh.user)
        )
      }}
  changed_when: false

- name: Verify managed OS SSH authentication
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -uo pipefail
      kh={{ bootwright_component.osInstall.ssh.knownHostsPath | quote }}
      addr={{ bootwright_component.osInstall.ssh.address | quote }}
      exec ssh \
        -i {{ bootwright_component.osInstall.ssh.privateKeyPath | quote }} \
        -o BatchMode=yes \
        -o StrictHostKeyChecking=yes \
        -o UserKnownHostsFile="$kh" \
        {{ ((bootwright_os_effective_user | default(bootwright_component.osInstall.ssh.user)) ~ '@' ~ bootwright_component.osInstall.ssh.address) | quote }} \
        true
  delegate_to: localhost
  register: bootwright_os_ssh_auth
  retries: 60
  delay: 10
  until: bootwright_os_ssh_auth.rc == 0
  changed_when: false
  failed_when: bootwright_os_ssh_auth.rc != 0
