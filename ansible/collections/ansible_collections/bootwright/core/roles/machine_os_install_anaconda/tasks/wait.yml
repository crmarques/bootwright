---
- name: Wait for previous managed OS SSH port to stop
  ansible.builtin.wait_for:
    host: "{{ bootwright_component.osInstall.ssh.address }}"
    port: 22
    state: stopped
    timeout: 300
  delegate_to: localhost
  changed_when: false
  when:
    - bootwright_managed_os_boot_component is defined
    - not (bootwright_os_pre_ssh_port.failed | default(true))
    - not (bootwright_managed_os_already_ready | bool)

- name: Wait for managed OS SSH port
  ansible.builtin.wait_for:
    host: "{{ bootwright_component.osInstall.ssh.address }}"
    port: 22
    state: started
    timeout: 1800
  delegate_to: localhost
  changed_when: false

# The boot component fact exists only when this run actually installed the
# machine; an already-ready machine attached no media this run, so there is
# nothing to clean and the include must not template an undefined var.
- name: Clean managed OS virtual media after SSH is ready
  ansible.builtin.include_role:
    name: "{{ bootwright_component.mediaPrepareRole }}"
  vars:
    bootwright_component: "{{ bootwright_managed_os_boot_component }}"
    bootwright_redfish_action_effective: cleanup
  when:
    - (bootwright_component.mediaPrepareRole | default('') | length) > 0
    - bootwright_managed_os_boot_component is defined

# Bare metal carries no mediaPrepareRole, so the cleanup above is skipped and
# the BMC virtual media would stay mapped (a lingering /dev/sr0). Eject it
# through the rendered cleanupMediaRole, mirroring the agent-install
# post-install eject: the registry sets that role only for boot drivers that
# own a cleanup_media action, so no boot backend is enumerated here.
- name: Eject boot virtual media after SSH is ready
  ansible.builtin.include_role:
    name: "{{ bootwright_component.cleanupMediaRole }}"
  vars:
    bootwright_component: "{{ bootwright_managed_os_boot_component }}"
    bootwright_redfish_action: cleanup_media
  when:
    - bootwright_managed_os_boot_component is defined
    - (bootwright_component.mediaPrepareRole | default('') | length) == 0
    - (bootwright_component.cleanupMediaRole | default('') | length) > 0

- name: Record managed OS SSH host key
  ansible.builtin.include_tasks: ssh_trust.yml
  vars:
    bootwright_os_ssh_keyscan_required: true
    bootwright_os_ssh_keyscan_retries: 60
    bootwright_os_ssh_keyscan_delay: 10
  when: (bootwright_component.osInstall.ssh.knownHostsPath | default('') | length) > 0

- name: Verify managed OS SSH authentication
  # A freshly installed node regenerates its SSH host keys on first boot, and the
  # known_hosts trust store is durable across installs - so a key pinned once
  # before this point (here, or by a previous install of the same node) goes
  # stale and makes StrictHostKeyChecking deadlock forever. When this run
  # (re)installed the node, re-pin the live host key on every attempt and then
  # require a key-based login: a successful login proves we reached the node we
  # provisioned (it holds the key we injected), so the key it just presented is
  # the one to trust. A node that was already healthy keeps its durable pin
  # untouched - a genuine key change there must fail loudly, not be re-trusted.
  # flock serialises the shared known_hosts file across nodes converging in
  # parallel; the login runs unlocked because ssh-keygen -R removes only this
  # host, so each node's freshly recorded key survives other nodes' rewrites.
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -uo pipefail
      kh={{ bootwright_component.osInstall.ssh.knownHostsPath | quote }}
      addr={{ bootwright_component.osInstall.ssh.address | quote }}
      if {{ (not (bootwright_managed_os_already_ready | default(false) | bool)) | ternary('true', 'false') }}; then
        command -v flock >/dev/null 2>&1 || { echo 'flock (util-linux) is required on the provider host' >&2; exit 1; }
        command -v ssh-keyscan >/dev/null 2>&1 || { echo 'ssh-keyscan (openssh-clients) is required on the provider host' >&2; exit 1; }
        (
          flock 9 || exit 1
          scan=$(ssh-keyscan -T 30 -t ed25519,ecdsa,rsa "$addr" 2>/dev/null | grep -v '^#') || true
          if [ -n "$scan" ]; then
            ssh-keygen -R "$addr" -f "$kh" >/dev/null 2>&1 || true
            rm -f "$kh.old"
            printf '%s\n' "$scan" >> "$kh"
          fi
        ) 9>"$kh.lock"
      fi
      exec ssh \
        -i {{ bootwright_component.osInstall.ssh.privateKeyPath | quote }} \
        -o BatchMode=yes \
        -o StrictHostKeyChecking=yes \
        -o UserKnownHostsFile="$kh" \
        {{ (bootwright_component.osInstall.ssh.user ~ '@' ~ bootwright_component.osInstall.ssh.address) | quote }} \
        true
  delegate_to: localhost
  register: bootwright_os_ssh_auth
  retries: 60
  delay: 10
  until: bootwright_os_ssh_auth.rc == 0
  changed_when: false
  failed_when: bootwright_os_ssh_auth.rc != 0
