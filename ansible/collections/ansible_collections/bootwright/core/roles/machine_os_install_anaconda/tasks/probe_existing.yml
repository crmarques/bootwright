---
- name: Probe managed OS SSH before install
  ansible.builtin.wait_for:
    host: "{{ bootwright_component.osInstall.ssh.address }}"
    port: 22
    state: started
    timeout: 5
  delegate_to: localhost
  register: bootwright_os_pre_ssh_port
  failed_when: false
  changed_when: false

# wait_for with failed_when:false always registers failed=False (the failure is
# suppressed), so `.failed` is a dead signal — it cannot distinguish a reachable
# host from a timed-out one. The module only sets `msg` on a failure path (e.g.
# "Timeout when waiting..."), so absence of msg is the reliable "port is open"
# predicate. Everything below keys reachability off this fact, not off `.failed`.
- name: Resolve managed OS SSH reachability before install
  ansible.builtin.set_fact:
    bootwright_os_pre_ssh_reachable: "{{ (bootwright_os_pre_ssh_port.msg | default('')) | length == 0 }}"
  changed_when: false

# Fail closed on the one combination that would otherwise wipe a host blind: the
# SSH port is REACHABLE but no knownHostsPath is configured, so the ownership probe
# below is skipped, readiness defaults to false, and the install proceeds to wipe an
# occupied host that could be foreign or lost-record Bootwright production. A truly
# greenfield host is unreachable (port closed) and never trips this, so intentional
# fresh installs are unaffected; only a reachable-but-unverifiable host is refused.
- name: Refuse to wipe a reachable managed OS with no host-key trust to verify it
  ansible.builtin.fail:
    msg: >-
      managed OS at {{ bootwright_component.osInstall.ssh.address }} is reachable on
      SSH but osInstall.ssh.knownHostsPath is not set, so bootwright cannot
      authenticate the host to check whether it already runs an OS it does not own
      before wiping it. Set osInstall.ssh.knownHostsPath (or establish machine trust)
      so the pre-install ownership probe can run, then re-apply; if the host is truly
      unused, power it off before the first apply so it is not seen as occupied.
  when:
    - bootwright_os_pre_ssh_reachable | bool
    - (bootwright_component.osInstall.ssh.knownHostsPath | default('') | length) == 0

- name: Record managed OS SSH host key before install when reachable
  ansible.builtin.include_tasks: ssh_trust.yml
  vars:
    bootwright_os_ssh_keyscan_required: false
    bootwright_os_ssh_keyscan_retries: 1
    bootwright_os_ssh_keyscan_delay: 1
  when:
    - bootwright_os_pre_ssh_reachable | bool
    - (bootwright_component.osInstall.ssh.knownHostsPath | default('') | length) > 0

- name: Probe managed OS SSH authentication before install
  ansible.builtin.command:
    argv:
      - timeout
      - "15"
      - ssh
      - -i
      - "{{ bootwright_component.osInstall.ssh.privateKeyPath }}"
      - -o
      - BatchMode=yes
      - -o
      - ConnectTimeout=5
      - -o
      - GSSAPIAuthentication=no
      - -o
      - StrictHostKeyChecking=yes
      - -o
      - UserKnownHostsFile={{ bootwright_component.osInstall.ssh.knownHostsPath }}
      - "{{ bootwright_component.osInstall.ssh.user }}@{{ bootwright_component.osInstall.ssh.address }}"
      - "true"
  delegate_to: localhost
  register: bootwright_os_pre_ssh_auth
  failed_when: false
  changed_when: false
  when:
    - bootwright_os_pre_ssh_reachable | bool
    - (bootwright_component.osInstall.ssh.knownHostsPath | default('') | length) > 0

- name: Resolve managed OS readiness before install
  ansible.builtin.set_fact:
    bootwright_managed_os_already_ready: "{{ (bootwright_os_pre_ssh_auth.rc | default(1) | int) == 0 }}"
  changed_when: false

- name: Read managed OS install marker before install
  ansible.builtin.command:
    argv:
      - timeout
      - "15"
      - ssh
      - -i
      - "{{ bootwright_component.osInstall.ssh.privateKeyPath }}"
      - -o
      - BatchMode=yes
      - -o
      - ConnectTimeout=5
      - -o
      - GSSAPIAuthentication=no
      - -o
      - StrictHostKeyChecking=yes
      - -o
      - UserKnownHostsFile={{ bootwright_component.osInstall.ssh.knownHostsPath }}
      - "{{ bootwright_component.osInstall.ssh.user }}@{{ bootwright_component.osInstall.ssh.address }}"
      - "cat {{ bootwright_os_marker_path | quote }}"
  delegate_to: localhost
  register: bootwright_os_pre_marker
  failed_when: false
  changed_when: false
  when: bootwright_managed_os_already_ready | bool

# A Bootwright-owned marker is one written by bootwright (owner == bootwright),
# regardless of whether its hash still matches desired. Ownership is a stronger,
# separate predicate than match: --override may rebuild an OWNED host whose hash
# drifted, but must NEVER adopt or wipe a host Bootwright does not own.
- name: Resolve managed OS Bootwright ownership before install
  ansible.builtin.set_fact:
    bootwright_os_pre_marker_owned: >-
      {{
        (bootwright_os_pre_marker.rc | default(1) | int) == 0
        and (
          ('"owner": "bootwright"' in (bootwright_os_pre_marker.stdout | default('')))
          or ('"owner":"bootwright"' in (bootwright_os_pre_marker.stdout | default('')))
        )
      }}
  changed_when: false
  when: bootwright_managed_os_already_ready | bool

- name: Resolve managed OS install marker match
  ansible.builtin.set_fact:
    bootwright_os_pre_marker_matches: >-
      {{
        (bootwright_os_pre_marker_owned | default(false) | bool)
        and (bootwright_os_marker_desired_hash in (bootwright_os_pre_marker.stdout | default('')))
      }}
  changed_when: false
  when: bootwright_managed_os_already_ready | bool

# A reachable host that does NOT carry a Bootwright-owned marker is foreign (or was
# manually prepared): never adopt, reinstall, or wipe it — fail closed even under
# --override, which does not bypass foreign ownership.
- name: Refuse foreign or unmarked reachable managed OS
  ansible.builtin.fail:
    msg: >-
      managed OS at {{ bootwright_component.osInstall.ssh.address }} accepts SSH but
      {{ bootwright_os_marker_path }} is absent or not owned by bootwright; refusing to
      reinstall, wipe, or adopt a host Bootwright does not own (--override does not
      bypass foreign ownership).
  when:
    - bootwright_managed_os_already_ready | bool
    - not (bootwright_os_pre_marker_owned | default(false) | bool)

# A reachable Bootwright-owned host whose marker no longer matches the desired hash
# has drifted. The default reconcile fails closed; --override authorizes the
# data-destroying rebuild of an owned host.
- name: Refuse drifted Bootwright-owned managed OS without override
  ansible.builtin.fail:
    msg: >-
      managed OS at {{ bootwright_component.osInstall.ssh.address }} is Bootwright-owned
      but {{ bootwright_os_marker_path }} does not match desired hash
      {{ bootwright_os_marker_desired_hash }}; rerun with --override to rebuild it.
  when:
    - bootwright_managed_os_already_ready | bool
    - bootwright_os_pre_marker_owned | default(false) | bool
    - not (bootwright_os_pre_marker_matches | default(false) | bool)
    - (bootwright_apply_mode | default('continue')) != 'override'

# Stamp the marker/ownership only for a host Bootwright legitimately owns: one it
# freshly installs this run (was not already reachable) or one it already owns
# (matching, or override-rebuilt). A foreign host fails closed above and never
# reaches the stamp; gate it so a future reordering cannot launder a foreign host
# into an owned one.
- name: Resolve whether managed OS may be stamped as Bootwright-owned
  ansible.builtin.set_fact:
    bootwright_managed_os_stamp_owned: >-
      {{
        (not (bootwright_managed_os_already_ready | bool))
        or (bootwright_os_pre_marker_owned | default(false) | bool)
      }}
  changed_when: false

# A reachable, Bootwright-owned host whose marker drifted is refused by default
# (fail above) and authorized for a destructive rebuild under --override. The
# refusal only *suppresses the fail*; this fact drives the actual reinstall so an
# override-rebuild is carried out instead of the host being silently skipped as
# "already ready" (which also re-stamped its marker to the new desired hash
# without the OS ever changing). Mirror-image of the refuse-drifted predicate:
# owned+drifted+reachable is EITHER refused (no override) OR rebuilt (override).
- name: Resolve whether an owned drifted managed OS must be override-rebuilt
  ansible.builtin.set_fact:
    bootwright_managed_os_force_rebuild: >-
      {{
        (bootwright_managed_os_already_ready | bool)
        and (bootwright_os_pre_marker_owned | default(false) | bool)
        and (not (bootwright_os_pre_marker_matches | default(false) | bool))
        and ((bootwright_apply_mode | default('continue')) == 'override')
      }}
  changed_when: false

# The install runs when the node was not reachable/authenticated before this run
# (fresh, wiped, or lost node) OR when --override forces a rebuild of an owned host
# that drifted. A reachable owned host already matching desired is left untouched.
# Every downstream "did this run (re)install?" gate keys off this, not off
# not-already-ready, so a forced rebuild is treated exactly like a fresh install.
- name: Resolve whether managed OS install must run
  ansible.builtin.set_fact:
    bootwright_managed_os_install_required: >-
      {{
        (not (bootwright_managed_os_already_ready | bool))
        or (bootwright_managed_os_force_rebuild | bool)
      }}
  changed_when: false
