---
- name: Scan managed OS SSH host key
  ansible.builtin.command:
    argv:
      - ssh-keyscan
      - -T
      - "30"
      - -t
      - ed25519,ecdsa,rsa
      - "{{ bootwright_component.osInstall.ssh.address }}"
  delegate_to: localhost
  register: bootwright_os_ssh_keyscan
  retries: "{{ bootwright_os_ssh_keyscan_retries | default(1) }}"
  delay: "{{ bootwright_os_ssh_keyscan_delay | default(1) }}"
  until: >-
    not (bootwright_os_ssh_keyscan_required | default(true) | bool)
    or ((bootwright_os_ssh_keyscan.stdout_lines | default([]) | reject('match', '^#') | list | length) > 0)
  failed_when: (bootwright_os_ssh_keyscan.rc | int) not in [0, 1]
  changed_when: false

- name: Ensure managed OS SSH trust directory
  ansible.builtin.file:
    path: "{{ bootwright_component.osInstall.ssh.knownHostsPath | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  delegate_to: localhost

- name: Record managed OS SSH known_hosts entries
  ansible.builtin.known_hosts:
    path: "{{ bootwright_component.osInstall.ssh.knownHostsPath }}"
    name: "{{ bootwright_component.osInstall.ssh.address }}"
    key: "{{ item }}"
    state: present
  loop: "{{ bootwright_os_ssh_keyscan.stdout_lines | reject('match', '^#') | list }}"
  loop_control:
    label: "{{ bootwright_component.osInstall.ssh.address }}"
  delegate_to: localhost
  when: (bootwright_os_ssh_keyscan.stdout_lines | reject('match', '^#') | list | length) > 0

- name: Restrict managed OS SSH known_hosts file
  ansible.builtin.file:
    path: "{{ bootwright_component.osInstall.ssh.knownHostsPath }}"
    owner: root
    group: root
    mode: "0600"
  delegate_to: localhost
  when: (bootwright_os_ssh_keyscan.stdout_lines | reject('match', '^#') | list | length) > 0
