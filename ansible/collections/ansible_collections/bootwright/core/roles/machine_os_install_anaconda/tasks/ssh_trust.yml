---

- name: Ensure managed OS SSH trust directory
  ansible.builtin.file:
    path: "{{ bootwright_component.osInstall.ssh.knownHostsPath | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  delegate_to: localhost

- name: Scan managed OS SSH host key
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -uo pipefail
      kh={{ bootwright_component.osInstall.ssh.knownHostsPath | quote }}
      addr={{ bootwright_component.osInstall.ssh.address | quote }}
      conn={{ bootwright_component.osInstall.ssh.connectionAddress | default(bootwright_component.osInstall.ssh.address) | quote }}
      replace={{ (bootwright_os_ssh_keyscan_replace | default(false) | bool) | ternary('true', 'false') }}
      if [ "$replace" = "true" ] || ! ssh-keygen -F "$addr" -f "$kh" >/dev/null 2>&1; then
        ssh-keygen -R "$addr" -f "$kh" >/dev/null 2>&1 || true
        rm -f "$kh.old"
        ssh \
          -i {{ bootwright_component.osInstall.ssh.privateKeyPath | quote }} \
          -o StrictHostKeyChecking=accept-new \
          -o UserKnownHostsFile="$kh" \
          -o BatchMode=yes \
          -o ConnectTimeout=15 \
          -o GSSAPIAuthentication=no \
          {{ (bootwright_component.osInstall.ssh.user ~ '@' ~ bootwright_component.osInstall.ssh.address) | quote }} \
          true >/dev/null 2>&1 || true
        ssh-keygen -F "$addr" -f "$kh" >/dev/null 2>&1 || exit 1
      fi
      if [ "$conn" != "$addr" ]; then
        ssh-keygen -R "$conn" -f "$kh" >/dev/null 2>&1 || true
        rm -f "$kh.old"
        ssh-keygen -F "$addr" -f "$kh" | grep -v '^#' | sed "s/^[^ ]*/$conn/" >> "$kh"
        ssh-keygen -F "$conn" -f "$kh" >/dev/null 2>&1
      fi
  delegate_to: localhost
  register: bootwright_os_ssh_keyscan
  retries: "{{ bootwright_os_ssh_keyscan_retries | default(1) }}"
  delay: "{{ bootwright_os_ssh_keyscan_delay | default(1) }}"
  until: >-
    not (bootwright_os_ssh_keyscan_required | default(true) | bool)
    or ((bootwright_os_ssh_keyscan.rc | default(1) | int) == 0)
  changed_when: false
  failed_when: false

- name: Restrict managed OS SSH known_hosts file
  ansible.builtin.file:
    path: "{{ bootwright_component.osInstall.ssh.knownHostsPath }}"
    owner: root
    group: root
    mode: "0600"
  delegate_to: localhost
  when: (bootwright_os_ssh_keyscan.rc | default(1) | int) == 0
