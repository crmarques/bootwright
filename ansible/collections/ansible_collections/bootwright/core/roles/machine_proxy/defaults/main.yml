---
bootwright_proxy_http: "{{ (bootwright_proxy | default({})).http | default('') }}"
bootwright_proxy_https: "{{ (bootwright_proxy | default({})).https | default('') }}"
bootwright_proxy_no: "{{ (bootwright_proxy | default({})).noProxy | default([]) | join(',') }}"
bootwright_proxy_no_literal: "{{ (bootwright_proxy | default({})).noProxyLiteral | default((bootwright_proxy | default({})).noProxy | default([])) | join(',') }}"
bootwright_proxy_credentials_name: "{{ ((bootwright_proxy | default({})).auth | default({})).proxyAuthRef | default('') }}"
bootwright_proxy_credentials_ref: "{{ (bootwright_secrets_dir ~ '/' ~ bootwright_proxy_credentials_name) if (bootwright_proxy_credentials_name | length) > 0 else '' }}"
bootwright_proxy_trust_bundle_name: "{{ (bootwright_proxy | default({})).trustBundleRef | default('') }}"
bootwright_proxy_trust_bundle_ref: "{{ (bootwright_secrets_dir ~ '/' ~ bootwright_proxy_trust_bundle_name) if (bootwright_proxy_trust_bundle_name | length) > 0 else '' }}"
