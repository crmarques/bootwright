---
- name: Validate the frozen host firewall request
  ansible.builtin.assert:
    that:
      - bootwright_os_firewall_request.direct is boolean
      - bootwright_os_firewall_request.preparation is boolean
      - not bootwright_os_firewall_request.preparation or bootwright_os_firewall_request.direct
      - not bootwright_os_firewall_request.direct or bootwright_os_firewall_request.placement.connection in ['local', 'ssh']
      - bootwright_os_firewall_request.version == 'os-host-firewall-v2'
      - bootwright_os_firewall_request.identity.context is match('^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$(?!\n)')
      - bootwright_os_firewall_request.identity.object is match('^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$(?!\n)')
      - bootwright_os_firewall_digest is match('^[0-9a-f]{64}$(?!\n)')
      - bootwright_os_firewall_request.services is sequence
      - bootwright_os_firewall_request.services is not string
      - bootwright_os_firewall_request.services | length > 0 or bootwright_os_firewall_request.preparation
      - bootwright_os_firewall_material.mark is string
      - bootwright_os_firewall_request.direct or bootwright_os_firewall_material.fleetIdentity is string
      - bootwright_os_firewall_request.direct or bootwright_os_firewall_material.hostKey is string
      - managedos_host_firewall_services | map(attribute='name') | list
        == bootwright_os_firewall_request.services | map(attribute='name') | list
    quiet: true
  no_log: true

- name: Complete the qualified execution handoff
  bootwright.core.managedos_firewall_protocol:
    phase: loaded
  no_log: true

- name: Run the installed Machine firewall operation
  ansible.builtin.import_tasks: installed_apply.yml
  when: not bootwright_os_firewall_request.direct

- name: Run the explicitly managed provided host firewall operation
  ansible.builtin.import_tasks: provided_apply.yml
  when: bootwright_os_firewall_request.direct
