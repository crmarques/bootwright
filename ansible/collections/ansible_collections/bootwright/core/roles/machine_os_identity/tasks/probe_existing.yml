---
- name: Probe managed OS SSH before install
  ansible.builtin.wait_for:
    host: "{{ bootwright_component.osInstall.ssh.address }}"
    port: 22
    state: started
    timeout: 5
  delegate_to: localhost
  register: bootwright_os_pre_ssh_port
  failed_when: false
  changed_when: false

- name: Resolve managed OS SSH reachability before install
  ansible.builtin.set_fact:
    bootwright_os_pre_ssh_reachable: "{{ (bootwright_os_pre_ssh_port.msg | default('')) | length == 0 }}"
  changed_when: false

- name: Resolve substrate release membership before install
  ansible.builtin.set_fact:
    bootwright_os_reset_pairs: >-
      {{
        bootwright_substrate_reset_machines | default('')
        | split(',') | map('trim') | reject('equalto', '') | list
      }}
    bootwright_os_cluster_released: >-
      {{
        bootwright_current_cluster.name in (
          bootwright_substrate_reset_clusters | default('')
          | split(',') | map('trim') | reject('equalto', '') | list
        )
      }}
  changed_when: false

- name: Resolve substrate release machine scope before install
  ansible.builtin.set_fact:
    bootwright_os_machine_released: >-
      {{
        (bootwright_os_cluster_released | bool)
        and (
          (
            bootwright_os_reset_pairs | map('split', '/') | map('first')
            | select('equalto', bootwright_current_cluster.name) | list | length == 0
          )
          or (
            (bootwright_current_cluster.name ~ '/' ~ bootwright_component.osInstall.marker.machine)
            in bootwright_os_reset_pairs
          )
        )
      }}
  changed_when: false

- name: Refuse to wipe a reachable managed OS with no host-key trust to verify it
  ansible.builtin.fail:
    msg: >-
      managed OS at {{ bootwright_component.osInstall.ssh.address }} is reachable on
      SSH but osInstall.ssh.knownHostsPath is not set, so bootwright cannot
      authenticate the host to check whether it already runs an OS it does not own
      before wiping it. Set osInstall.ssh.knownHostsPath (or establish machine trust)
      so the pre-install ownership probe can run, then re-apply; if the host is truly
      unused, power it off before the first apply so it is not seen as occupied.
  when:
    - bootwright_os_pre_ssh_reachable | bool
    - (bootwright_component.osInstall.ssh.knownHostsPath | default('') | length) == 0

- name: Record managed OS SSH host key before install when reachable
  ansible.builtin.include_role:
    name: bootwright.core.machine_os_identity
    tasks_from: ssh_trust.yml
  vars:
    bootwright_os_ssh_keyscan_required: false
    bootwright_os_ssh_keyscan_retries: 1
    bootwright_os_ssh_keyscan_delay: 1
  when:
    - bootwright_os_pre_ssh_reachable | bool
    - (bootwright_component.osInstall.ssh.knownHostsPath | default('') | length) > 0

- name: Probe managed OS SSH authentication before install
  ansible.builtin.command:
    argv:
      - timeout
      - "15"
      - ssh
      - -i
      - "{{ bootwright_component.osInstall.ssh.privateKeyPath }}"
      - -o
      - BatchMode=yes
      - -o
      - ConnectTimeout=5
      - -o
      - GSSAPIAuthentication=no
      - -o
      - StrictHostKeyChecking=yes
      - -o
      - UserKnownHostsFile={{ bootwright_component.osInstall.ssh.knownHostsPath }}
      - "{{ bootwright_component.osInstall.ssh.user }}@{{ bootwright_component.osInstall.ssh.address }}"
      - "true"
  delegate_to: localhost
  register: bootwright_os_pre_ssh_auth
  failed_when: false
  changed_when: false
  when:
    - bootwright_os_pre_ssh_reachable | bool
    - (bootwright_component.osInstall.ssh.knownHostsPath | default('') | length) > 0

- name: Resolve managed OS readiness before install
  ansible.builtin.set_fact:
    bootwright_managed_os_already_ready: >-
      {{ (bootwright_os_pre_ssh_auth.rc | default(1) | int) == 0 }}
    bootwright_os_probe_user: "{{ bootwright_component.osInstall.ssh.user }}"
  changed_when: false

- name: Refuse to reinstall a reachable managed OS Bootwright cannot authenticate to
  ansible.builtin.fail:
    msg: >-
      managed OS at {{ bootwright_component.osInstall.ssh.address }} answers SSH but
      rejects Bootwright's install identity
      {{ bootwright_component.osInstall.ssh.user }}
      (ssh rc {{ bootwright_os_pre_ssh_auth.rc | default(1) }}). Bootwright cannot read
      {{ bootwright_os_marker_path }} to prove it owns this host, and a reinstall wipes
      its disks, so an unverifiable host fails closed like a foreign one. Restore
      key-based access for the machine's access.ssh identity; if the host key changed
      after an authorized out-of-band rebuild, re-record it with `bootwright machine
      trust --replace {{ bootwright_component.osInstall.marker.machine }}`; if this
      machine must be rebuilt from scratch, run
      `{{ bootwright_apply_rebuild_invocation | default('the same bootwright apply invocation in rebuild mode with data-loss authorization') }}`;
      if the host is
      truly unused, power it off so it is not seen as occupied.
  when:
    - bootwright_os_pre_ssh_reachable | bool
    - not (bootwright_managed_os_already_ready | bool)
    - not (bootwright_os_machine_released | default(false) | bool)

- name: Read managed OS install marker before install
  ansible.builtin.command:
    argv:
      - timeout
      - "15"
      - ssh
      - -i
      - "{{ bootwright_component.osInstall.ssh.privateKeyPath }}"
      - -o
      - BatchMode=yes
      - -o
      - ConnectTimeout=5
      - -o
      - GSSAPIAuthentication=no
      - -o
      - StrictHostKeyChecking=yes
      - -o
      - UserKnownHostsFile={{ bootwright_component.osInstall.ssh.knownHostsPath }}
      - "{{ bootwright_os_probe_user | default(bootwright_component.osInstall.ssh.user) }}@{{ bootwright_component.osInstall.ssh.address }}"
      - >-
        cat {{ bootwright_os_marker_path | quote }} 2>/dev/null
        || sudo -n cat {{ bootwright_os_marker_path | quote }}
  delegate_to: localhost
  register: bootwright_os_pre_marker
  failed_when: false
  changed_when: false
  when: bootwright_managed_os_already_ready | bool

- name: Resolve managed OS Bootwright ownership before install
  ansible.builtin.set_fact:
    bootwright_os_pre_marker_owned: >-
      {{
        (bootwright_os_pre_marker.rc | default(1) | int) == 0
        and (
          ('"owner": "bootwright"' in (bootwright_os_pre_marker.stdout | default('')))
          or ('"owner":"bootwright"' in (bootwright_os_pre_marker.stdout | default('')))
        )
      }}
  changed_when: false
  when: bootwright_managed_os_already_ready | bool

- name: Resolve managed OS install marker match
  ansible.builtin.set_fact:
    bootwright_os_pre_marker_matches: >-
      {{
        (bootwright_os_pre_marker_owned | default(false) | bool)
        and (bootwright_os_marker_desired_hash in (bootwright_os_pre_marker.stdout | default('')))
      }}
  changed_when: false
  when: bootwright_managed_os_already_ready | bool

- name: Refuse a pre-existing managed OS under --mode create
  ansible.builtin.fail:
    msg: >-
      managed OS at {{ bootwright_component.osInstall.ssh.address }} already runs an
      OS with a verified Bootwright ownership marker, but this apply ran with
      --mode create, which asserts a greenfield environment. Reconcile exactly the
      selected work instead with
      `{{ bootwright_apply_reconcile_invocation | default('the same bootwright apply invocation with --mode reconcile') }}`.
  when:
    - bootwright_managed_os_already_ready | bool
    - (bootwright_apply_mode | default('reconcile')) == 'create'
    - bootwright_os_pre_marker_owned | default(false) | bool
    - not (bootwright_os_machine_released | default(false) | bool)

- name: Refuse foreign or unmarked reachable managed OS
  ansible.builtin.fail:
    msg: >-
      managed OS at {{ bootwright_component.osInstall.ssh.address }} accepts SSH but
      {{ bootwright_os_marker_path }} is absent, unreadable, or not owned by bootwright;
      refusing to reinstall, wipe, or adopt a host Bootwright does not own. Restore
      the marker from a verified backup only if this exact machine is genuinely
      Bootwright-owned; otherwise decommission or remove the foreign host out of band.
      No bootwright retry command, --mode, or --authorize token bypasses foreign
      ownership. After the external ownership conflict is resolved, re-run
      `{{ bootwright_mutating_invocation | default('the same bootwright apply invocation') }}`.
  when:
    - bootwright_managed_os_already_ready | bool
    - not (bootwright_os_pre_marker_owned | default(false) | bool)

- name: Refuse drifted Bootwright-owned managed OS without override
  ansible.builtin.fail:
    msg: >-
      managed OS at {{ bootwright_component.osInstall.ssh.address }} is Bootwright-owned
      but {{ bootwright_os_marker_path }} does not match desired hash
      {{ bootwright_os_marker_desired_hash }}. Rebuild exactly the selected machine with
      `{{ bootwright_apply_rebuild_invocation | default('the same bootwright apply invocation in rebuild mode with data-loss authorization') }}`.
  when:
    - bootwright_managed_os_already_ready | bool
    - bootwright_os_pre_marker_owned | default(false) | bool
    - not (bootwright_os_pre_marker_matches | default(false) | bool)
    - (bootwright_apply_mode | default('reconcile')) != 'rebuild'
    - not (bootwright_os_machine_released | default(false) | bool)

- name: Resolve whether managed OS may be stamped as Bootwright-owned
  ansible.builtin.set_fact:
    bootwright_managed_os_stamp_owned: >-
      {{
        (not (bootwright_managed_os_already_ready | bool))
        or (bootwright_os_pre_marker_owned | default(false) | bool)
      }}
  changed_when: false

- name: Refuse an on-host drift the controller did not authorize for rebuild
  ansible.builtin.fail:
    msg: >-
      managed OS at {{ bootwright_component.osInstall.ssh.address }} is
      Bootwright-owned but {{ bootwright_os_marker_path }} does not match the
      desired hash, while the controller's records show no drift for cluster
      {{ bootwright_current_cluster.name }} — the host may have been reinstalled
      out-of-band. Investigate before rebuilding; to force it, run
      `{{ bootwright_apply_rebuild_invocation | default('the same bootwright apply invocation in rebuild mode with data-loss authorization') }}`.
  when:
    - bootwright_managed_os_already_ready | bool
    - bootwright_os_pre_marker_owned | default(false) | bool
    - not (bootwright_os_pre_marker_matches | default(false) | bool)
    - (bootwright_apply_mode | default('reconcile')) == 'rebuild'
    - not (bootwright_os_machine_released | default(false) | bool)

- name: Resolve whether an owned managed OS must be rebuilt because its substrate was released
  ansible.builtin.set_fact:
    bootwright_managed_os_force_rebuild: >-
      {{
        (bootwright_managed_os_already_ready | bool)
        and (bootwright_os_pre_marker_owned | default(false) | bool)
        and (bootwright_os_machine_released | default(false) | bool)
      }}
  changed_when: false

- name: Resolve whether managed OS install must run
  ansible.builtin.set_fact:
    bootwright_managed_os_install_required: >-
      {{
        (not (bootwright_managed_os_already_ready | bool))
        or (bootwright_managed_os_force_rebuild | bool)
      }}
  changed_when: false
