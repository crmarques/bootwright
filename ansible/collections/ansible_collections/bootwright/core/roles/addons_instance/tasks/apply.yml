---
- name: Validate the frozen add-on instance version
  ansible.builtin.assert:
    that:
      - bootwright_addon_instance_request.version == 'addon-instance-request-v3'
    quiet: true
    fail_msg: The frozen add-on instance request version is unsupported.

- name: Run the shared cluster object program
  ansible.builtin.include_role:
    name: bootwright.core.cluster_objects
    tasks_from: apply
  vars:
    cluster_objects_program: "{{ bootwright_addon_instance_request.program }}"
    cluster_objects_request: >-
      {{ bootwright_addon_instance_request | combine({'operation': bootwright_addon_instance_material.operation,
      'block': bootwright_addon_instance_material.block,
      'registered': bootwright_addon_instance_material.registered,
      'materials': bootwright_addon_instance_material,
      'secretSources': bootwright_addon_instance_material.secretSources | default('{}') | from_json}) }}
    cluster_objects_oc: "{{ bootwright_addon_instance_material.oc }}"
    cluster_objects_material: "{{ bootwright_addon_instance_material }}"
    cluster_objects_evidence: "{{ bootwright_addon_instance_material.evidence | default('{}') | from_json }}"
    cluster_objects_digest: "{{ bootwright_addon_instance_digest }}"
    cluster_objects_evidence_version: addon-instance-evidence-v3
