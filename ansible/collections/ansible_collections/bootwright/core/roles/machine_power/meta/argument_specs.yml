argument_specs:
  power:
    short_description: Drive one machine to a requested power state through its substrate machine port.
    options:
      bootwright_machine_power_request:
        type: dict
        required: true
        options:
          arm:
            type: str
            required: true
            choices:
              - baremetal
              - kubevirt
              - libvirt
          controller:
            type: dict
            required: true
            options:
              credentialsRef:
                type: str
                required: true
              endpoint:
                type: str
                required: true
              hostCluster:
                type: str
                required: false
              tlsVerify:
                type: bool
                required: true
              tlsVerification:
                type: str
                required: false
                choices:
                  - full
                  - certificate
                  - none
              trustBundleRef:
                type: str
                required: false
          force:
            type: bool
            required: true
          identity:
            type: dict
            required: true
          machinePort:
            type: dict
            required: true
            options:
              caVariable:
                type: str
                required: false
              endpoint:
                type: str
                required: true
              mediaVolume:
                type: str
                required: false
              passwordVariable:
                type: str
                required: false
              pinnedSerialVariable:
                type: str
                required: false
              pinnedUUIDVariable:
                type: str
                required: false
              userVariable:
                type: str
                required: true
              verification:
                type: str
                required: false
                choices:
                  - full
                  - certificate
                  - none
              verify:
                type: bool
                required: true
          placement:
            type: dict
            required: true
          verb:
            type: str
            required: true
            choices:
              - start
              - stop
              - restart
          version:
            type: str
            required: true
            choices:
              - machine-power-v1
      bootwright_machine_power_digest:
        type: str
        required: true
      bootwright_machine_power_material:
        type: dict
        required: true
