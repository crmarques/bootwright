---
# An eject releases whatever the virtual-media device Bootwright inserts
# through presents, whichever image it is and whoever attached it, and leaves
# the power as it was. It settles no media trust: an operator's eject restores
# no verification and removes no certificate a boot imported. What the
# device presented before is read only to say whether anything changed; the
# evidence is the read after it, in tasks/power.yml.
- name: Report the media read
  bootwright.core.machine_power_protocol:
    phase: group
    group: read-media
    status: running
  no_log: true

- name: Read the media the management controller presents
  ansible.builtin.include_role:
    name: bootwright.core.substrate_machine
    tasks_from: state_read
  vars:
    bootwright_machine_arm: '{{ bootwright_machine_power_request.arm }}'
    bootwright_machine_port: >-
      {{ machine_power_access | combine({'media': true}) }}

- name: Retain the machine port answer
  ansible.builtin.set_fact:
    machine_power_media_before: "{{ substrate_machine_port_result }}"
  no_log: true

- name: Stop at a media read the management controller did not answer
  ansible.builtin.assert:
    that:
      - machine_power_media_before.msg is not defined
    fail_msg: >-
      reading the media Machine/{{ bootwright_machine_power_request.identity.object }}
      presents failed, so no eject was sent:
      {{ (machine_power_media_before.msg | default('') | string | bootwright.core.printable)[:512] }}
    quiet: true

- name: Publish the media that was read
  bootwright.core.machine_power_protocol:
    phase: group
    group: read-media
    status: ok
  no_log: true

- name: Report the eject
  bootwright.core.machine_power_protocol:
    phase: group
    group: eject-media
    status: running
  no_log: true

- name: Eject whatever media the device presents
  ansible.builtin.include_role:
    name: bootwright.core.substrate_machine
    tasks_from: media_eject
  vars:
    bootwright_machine_arm: '{{ bootwright_machine_power_request.arm }}'
    bootwright_machine_port: >-
      {{ machine_power_access | combine({'restore_verification': false, 'remove_certificate': false}) }}

- name: Retain the machine port answer
  ansible.builtin.set_fact:
    machine_power_ejected: "{{ substrate_machine_port_result }}"
  no_log: true

# ansible-core keeps nothing of a failure under no_log but that it failed, so
# the controller's own refusal is reported here, where no credential is.
- name: Stop at an eject the management controller did not complete
  ansible.builtin.assert:
    that:
      - machine_power_ejected.msg is not defined
      - substrate_machine_refusal | default('') | length == 0
    fail_msg: >-
      ejecting the media of Machine/{{ bootwright_machine_power_request.identity.object }}
      failed:
      {{ ((machine_power_ejected.msg | default(substrate_machine_refusal | default(''), true)) | string
          | bootwright.core.printable)[:512] }}
    quiet: true

- name: Publish the eject
  bootwright.core.machine_power_protocol:
    phase: group
    group: eject-media
    status: ok
  no_log: true
