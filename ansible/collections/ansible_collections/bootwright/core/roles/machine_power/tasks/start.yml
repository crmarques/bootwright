---
- name: Report the power-on
  bootwright.core.machine_power_protocol:
    phase: group
    group: power-on
    status: running
  no_log: true

- name: Bring the machine to on through its management controller
  ansible.builtin.include_role:
    name: bootwright.core.substrate_machine
    tasks_from: power
  vars:
    bootwright_machine_arm: '{{ bootwright_machine_power_request.arm }}'
    bootwright_machine_port: >-
      {{ machine_power_access | combine({'power': 'on', 'force': bootwright_machine_power_request.force,
         'attempts': machine_power_attempts}) }}

- name: Retain the machine port answer
  ansible.builtin.set_fact:
    machine_power_started: "{{ substrate_machine_port_result }}"
  no_log: true

# ansible-core keeps nothing of a failure under no_log but that it failed, so
# the controller's own refusal is reported here, where no credential is.
- name: Stop at a power-on the management controller did not complete
  ansible.builtin.assert:
    that:
      - machine_power_started.msg is not defined
    fail_msg: >-
      bringing Machine/{{ bootwright_machine_power_request.identity.object }} to on
      failed:
      {{ (machine_power_started.msg | default('') | string | bootwright.core.printable)[:512] }}
    quiet: true

- name: Publish the proved power-on
  bootwright.core.machine_power_protocol:
    phase: group
    group: power-on
    status: ok
  no_log: true
