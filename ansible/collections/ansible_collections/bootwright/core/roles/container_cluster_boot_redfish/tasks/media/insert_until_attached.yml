---
- name: Run Redfish virtual media insertion attempt
  ansible.builtin.include_tasks: insert_attempt.yml

- name: Advance Redfish virtual media insert attempt
  ansible.builtin.set_fact:
    bootwright_redfish_insert_media_attempt: "{{ (bootwright_redfish_insert_media_attempt | int) + 1 }}"
  changed_when: false
  when: not (bootwright_redfish_vmedia_attached | bool)

- name: Retry Redfish virtual media insertion when not attached
  ansible.builtin.include_tasks: insert_until_attached.yml
  when:
    - not (bootwright_redfish_vmedia_attached | bool)
    - (bootwright_redfish_insert_media_attempt | int) <= (bootwright_redfish_insert_media_retries | int)
