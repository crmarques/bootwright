---
- name: Wait for node SSH readiness
  ansible.builtin.include_role:
    name: bootwright.core.support_ssh_readiness
  vars:
    bootwright_ssh_ready_readiness: "{{ bootwright_component.boot.readiness | default({}) }}"
    bootwright_ssh_ready_node_name: "{{ bootwright_component.name }}"
    bootwright_ssh_ready_address: "{{ bootwright_component.primaryIPAddress | default('') }}"
    bootwright_ssh_ready_default_port: "{{ bootwright_node_ready_probe_port }}"
    bootwright_ssh_ready_key_path: "{{ bootwright_current_cluster.nodeSSHPrivateKeyPath | default('') }}"
    bootwright_ssh_ready_known_hosts_path: >-
      /tmp/bootwright-node-ready-{{ bootwright_current_cluster.name | default('cluster') }}-{{ bootwright_component.name | default('node') }}-known-hosts
    bootwright_ssh_ready_port_timeout_seconds: "{{ bootwright_node_ready_timeout_seconds }}"
    bootwright_ssh_ready_connect_timeout_seconds: "{{ bootwright_node_ready_ssh_connect_timeout_seconds }}"
    bootwright_ssh_ready_auth_retries: "{{ bootwright_node_ready_ssh_auth_retries }}"
    bootwright_ssh_ready_auth_delay_seconds: "{{ bootwright_node_ready_ssh_auth_delay_seconds }}"
    bootwright_ssh_ready_reject_hint: >-
      This usually means the IP is an old or wrong boot, the BMC booted disk
      instead of the generated agent ISO, or the declared MAC/IP mapping points
      at another host. Check Redfish virtual media, boot order, and
      InfraProvider baremetal.interfaces for {{ bootwright_component.name }}.

- name: Refresh Redfish system metadata before disk boot override
  ansible.builtin.uri:
    url: "{{ ('/redfish/v1/Systems/' ~ bootwright_redfish_system_id) | bootwright.core.bootwright_redfish_url(bootwright_component.boot.redfish.baseUrl) }}"
    method: GET
    return_content: true
    status_code: [200, 404]
  register: bootwright_redfish_system_boot_probe
  failed_when: false
  changed_when: false
  no_log: "{{ (bootwright_no_log | default(true) | bool) and ((bootwright_redfish_cred_path | length) > 0) }}"

- name: Resolve Redfish system PATCH precondition
  ansible.builtin.set_fact:
    bootwright_redfish_system_if_match: >-
      {{
        (bootwright_redfish_system_boot_probe.json | default({})).get('@odata.etag', '')
        | default((bootwright_redfish_system_boot_probe.headers | default({})).ETag | default('', true), true)
        | default((bootwright_redfish_system_boot_probe.headers | default({})).etag | default('', true), true)
        | default('*', true)
      }}
  changed_when: false

- name: Set subsequent boots to disk after live ISO boot
  ansible.builtin.uri:
    url: "{{ ('/redfish/v1/Systems/' ~ bootwright_redfish_system_id) | bootwright.core.bootwright_redfish_url(bootwright_component.boot.redfish.baseUrl) }}"
    method: PATCH
    headers:
      If-Match: "{{ bootwright_redfish_system_if_match }}"
    body_format: json
    body:
      Boot:
        BootSourceOverrideEnabled: Continuous
        BootSourceOverrideTarget: Hdd
    status_code: [200, 202, 204, 400, 405, 501]
  register: bootwright_redfish_disk_boot_patch
  failed_when: false
  changed_when: (bootwright_redfish_disk_boot_patch.status | default(0) | int) in [200, 202, 204]
  no_log: "{{ (bootwright_no_log | default(true) | bool) and ((bootwright_redfish_cred_path | length) > 0) }}"

- name: Confirm subsequent disk boot override was accepted
  ansible.builtin.assert:
    that:
      - (bootwright_redfish_disk_boot_patch.status | default(0) | int) in [200, 202, 204]
    fail_msg: >-
      Redfish BMC rejected subsequent disk boot override for system
      {{ bootwright_redfish_system_id }} with HTTP status
      {{ bootwright_redfish_disk_boot_patch.status | default('unknown') }}.
      The node booted from the live ISO, but future reboots may keep using
      the virtual media boot path instead of disk.
    success_msg: >-
      Redfish subsequent disk boot override accepted for system
      {{ bootwright_redfish_system_id }}.
