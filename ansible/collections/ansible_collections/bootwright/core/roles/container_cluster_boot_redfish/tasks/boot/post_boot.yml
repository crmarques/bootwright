---
- name: Resolve post-boot readiness behavior
  ansible.builtin.set_fact:
    bootwright_boot_readiness_type: "{{ (bootwright_component.boot.readiness | default({})).type | default('ssh') }}"
  changed_when: false

- name: Validate post-boot readiness behavior
  ansible.builtin.assert:
    that:
      - bootwright_component.boot.readiness is not defined or bootwright_component.boot.readiness is mapping
      - bootwright_boot_readiness_type in ['none', 'ssh']
    fail_msg: "Unsupported boot readiness type {{ bootwright_boot_readiness_type }}"

- name: Resolve node readiness probe address
  ansible.builtin.set_fact:
    bootwright_node_probe_address: "{{ bootwright_component.primaryIPAddress | default('') }}"
    bootwright_node_ready_probe_port_effective: "{{ ((bootwright_component.boot.readiness | default({})).ssh | default({})).port | default(bootwright_node_ready_probe_port) }}"
    bootwright_node_ready_ssh_user: "{{ ((bootwright_component.boot.readiness | default({})).ssh | default({})).user | default('core') }}"
  changed_when: false
  when: bootwright_boot_readiness_type == 'ssh'

- name: Wait for node SSH to confirm live ISO boot complete
  ansible.builtin.wait_for:
    host: "{{ bootwright_node_probe_address }}"
    port: "{{ bootwright_node_ready_probe_port_effective | int }}"
    timeout: "{{ bootwright_node_ready_timeout_seconds | int }}"
  when:
    - bootwright_boot_readiness_type == 'ssh'
    - (bootwright_node_probe_address | length) > 0

- name: Resolve node SSH auth probe key path
  ansible.builtin.set_fact:
    bootwright_node_ready_ssh_key_path: "{{ bootwright_current_cluster.nodeSSHPrivateKeyPath | default('') }}"
    bootwright_node_ready_known_hosts_path: >-
      /tmp/bootwright-node-ready-{{ bootwright_current_cluster.name | default('cluster') }}-{{ bootwright_component.name | default('node') }}-known-hosts
  changed_when: false
  when: bootwright_boot_readiness_type == 'ssh'

- name: Resolve node SSH auth probe key execution context
  ansible.builtin.set_fact:
    bootwright_node_ready_ssh_key_exec_user: >-
      {{
        ('#' ~ lookup('env', 'SUDO_UID'))
        if ((lookup('env', 'BOOTWRIGHT_INTERNAL_LOCAL_ROOT') | default('', true)) == '1'
            and ((lookup('env', 'SUDO_UID') | default('', true)) | length) > 0)
        else ''
      }}
    bootwright_node_ready_ssh_key_command_prefix: []
  changed_when: false
  when: bootwright_boot_readiness_type == 'ssh'

- name: Resolve node SSH auth probe key caller command prefix
  ansible.builtin.set_fact:
    bootwright_node_ready_ssh_key_command_prefix:
      - sudo
      - -n
      - -u
      - "{{ bootwright_node_ready_ssh_key_exec_user }}"
      - --
  changed_when: false
  when:
    - bootwright_boot_readiness_type == 'ssh'
    - (bootwright_node_ready_ssh_key_exec_user | length) > 0

- name: Check node SSH auth probe key
  ansible.builtin.command:
    argv: "{{ bootwright_node_ready_ssh_key_command_prefix + ['test', '-f', bootwright_node_ready_ssh_key_path] }}"
  register: bootwright_node_ready_ssh_key_check
  changed_when: false
  failed_when: false
  when:
    - bootwright_boot_readiness_type == 'ssh'
    - (bootwright_node_probe_address | length) > 0
    - (bootwright_node_ready_ssh_key_path | length) > 0

- name: Wait for node SSH to accept configured key
  ansible.builtin.command:
    argv: >-
      {{
        bootwright_node_ready_ssh_key_command_prefix
        + [
          'ssh',
          '-i',
          bootwright_node_ready_ssh_key_path,
          '-o',
          'BatchMode=yes',
          '-o',
          'StrictHostKeyChecking=accept-new',
          '-o',
          'UserKnownHostsFile=' ~ bootwright_node_ready_known_hosts_path,
          '-o',
          'ConnectTimeout=' ~ (bootwright_node_ready_ssh_connect_timeout_seconds | int),
          '-o',
          'ConnectionAttempts=1',
          '-p',
          bootwright_node_ready_probe_port_effective | string,
          bootwright_node_ready_ssh_user ~ '@' ~ bootwright_node_probe_address,
          'true'
        ]
      }}
  register: bootwright_node_ready_ssh_auth
  changed_when: false
  failed_when: false
  until: (bootwright_node_ready_ssh_auth.rc | default(1) | int) == 0
  retries: "{{ bootwright_node_ready_ssh_auth_retries | int }}"
  delay: "{{ bootwright_node_ready_ssh_auth_delay_seconds | int }}"
  when:
    - bootwright_boot_readiness_type == 'ssh'
    - (bootwright_node_probe_address | length) > 0
    - (bootwright_node_ready_ssh_key_check.rc | default(1) | int) == 0

- name: Confirm node SSH accepted configured key
  ansible.builtin.assert:
    that:
      - (bootwright_node_ready_ssh_auth.rc | default(1) | int) == 0
    fail_msg: >-
      Node {{ bootwright_component.name }} at {{ bootwright_node_probe_address }}
      answered TCP/{{ bootwright_node_ready_probe_port_effective | int }} but rejected the
      {{ bootwright_node_ready_ssh_user }} SSH key {{ bootwright_node_ready_ssh_key_path }}.
      This usually means the IP is an old or wrong boot, the BMC booted disk
      instead of the generated agent ISO, or the declared MAC/IP mapping points
      at another host. Check Redfish virtual media, boot order, and
      InfraProvider baremetal.interfaces for {{ bootwright_component.name }}.
  when:
    - bootwright_boot_readiness_type == 'ssh'
    - (bootwright_node_probe_address | length) > 0
    - (bootwright_node_ready_ssh_key_check.rc | default(1) | int) == 0

- name: Refresh Redfish system metadata before disk boot override
  ansible.builtin.uri:
    url: "{{ ('/redfish/v1/Systems/' ~ bootwright_redfish_system_id) | bootwright.core.bootwright_redfish_url(bootwright_component.boot.redfish.baseUrl) }}"
    method: GET
    return_content: true
    status_code: [200, 404]
    validate_certs: "{{ bootwright_component.boot.redfish.validateCerts }}"
    force_basic_auth: "{{ (bootwright_redfish_cred_path | length) > 0 }}"
    url_username: "{{ bootwright_redfish_credentials.username | default(omit) }}"
    url_password: "{{ bootwright_redfish_credentials.password | default(omit) }}"
    timeout: "{{ bootwright_redfish_request_timeout }}"
  register: bootwright_redfish_system_boot_probe
  failed_when: false
  changed_when: false
  no_log: "{{ (bootwright_no_log | default(true) | bool) and ((bootwright_redfish_cred_path | length) > 0) }}"

- name: Resolve Redfish system PATCH precondition
  ansible.builtin.set_fact:
    bootwright_redfish_system_if_match: >-
      {{
        (bootwright_redfish_system_boot_probe.json | default({})).get('@odata.etag', '')
        | default((bootwright_redfish_system_boot_probe.headers | default({})).ETag | default('', true), true)
        | default((bootwright_redfish_system_boot_probe.headers | default({})).etag | default('', true), true)
        | default('*', true)
      }}
  changed_when: false

- name: Set subsequent boots to disk after live ISO boot
  ansible.builtin.uri:
    url: "{{ ('/redfish/v1/Systems/' ~ bootwright_redfish_system_id) | bootwright.core.bootwright_redfish_url(bootwright_component.boot.redfish.baseUrl) }}"
    method: PATCH
    headers:
      If-Match: "{{ bootwright_redfish_system_if_match }}"
    body_format: json
    body:
      Boot:
        BootSourceOverrideEnabled: Continuous
        BootSourceOverrideTarget: Hdd
    status_code: [200, 202, 204, 400, 405, 501]
    validate_certs: "{{ bootwright_component.boot.redfish.validateCerts }}"
    force_basic_auth: "{{ (bootwright_redfish_cred_path | length) > 0 }}"
    url_username: "{{ bootwright_redfish_credentials.username | default(omit) }}"
    url_password: "{{ bootwright_redfish_credentials.password | default(omit) }}"
    timeout: "{{ bootwright_redfish_request_timeout }}"
  register: bootwright_redfish_disk_boot_patch
  failed_when: false
  changed_when: (bootwright_redfish_disk_boot_patch.status | default(0) | int) in [200, 202, 204]
  no_log: "{{ (bootwright_no_log | default(true) | bool) and ((bootwright_redfish_cred_path | length) > 0) }}"

- name: Confirm subsequent disk boot override was accepted
  ansible.builtin.assert:
    that:
      - (bootwright_redfish_disk_boot_patch.status | default(0) | int) in [200, 202, 204]
    fail_msg: >-
      Redfish BMC rejected subsequent disk boot override for system
      {{ bootwright_redfish_system_id }} with HTTP status
      {{ bootwright_redfish_disk_boot_patch.status | default('unknown') }}.
      The node booted from the live ISO, but future reboots may keep using
      the virtual media boot path instead of disk.
    success_msg: >-
      Redfish subsequent disk boot override accepted for system
      {{ bootwright_redfish_system_id }}.
