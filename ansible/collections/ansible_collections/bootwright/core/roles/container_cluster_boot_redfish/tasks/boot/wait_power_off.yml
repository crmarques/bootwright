---
- name: Initialize Redfish power state wait for managed OS installer PowerState=Off
  ansible.builtin.set_fact:
    bootwright_redfish_power_state_expected: "Off"
    bootwright_redfish_power_state_wait_label: managed OS installer shutdown
    bootwright_redfish_power_state_reached: false
    bootwright_redfish_power_state_status:
      expected: "Off"
      systemID: "{{ bootwright_redfish_system_id }}"
      httpStatus: not attempted
      powerState: not attempted
      attempts: 0
      retries: "{{ bootwright_redfish_power_state_retries | int }}"
  changed_when: false

- name: Wait for managed OS installer to report PowerState=Off
  ansible.builtin.include_tasks:
    file: power_state_probe.yml
    apply:
      when: not (bootwright_redfish_power_state_reached | bool)
  loop: "{{ range(1, (bootwright_redfish_power_state_retries | int) + 1) | list }}"
  loop_control:
    loop_var: bootwright_redfish_power_state_attempt
  when: not (bootwright_redfish_power_state_reached | bool)

- name: Confirm managed OS installer powered off
  ansible.builtin.assert:
    that:
      - bootwright_redfish_power_state_reached | bool
    fail_msg: >-
      Redfish BMC did not report PowerState=Off for system
      {{ bootwright_redfish_power_state_status.systemID }} after the managed
      OS installer was booted.
      Last HTTP status={{ bootwright_redfish_power_state_status.httpStatus }},
      observed PowerState={{ bootwright_redfish_power_state_status.powerState }},
      attempts={{ bootwright_redfish_power_state_status.attempts }} of
      {{ bootwright_redfish_power_state_status.retries }}.
    success_msg: >-
      Redfish BMC reports PowerState=Off for system
      {{ bootwright_redfish_power_state_status.systemID }} after managed OS install.
