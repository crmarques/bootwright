---
# Make the BMC trust the artifact server's TLS certificate so it accepts the
# virtual-media HTTPS fetch. Two mechanisms, chosen by what the BMC exposes:
#   - DMTF: a Certificates collection on the VirtualMedia member (POST the cert).
#   - xFusion / Huawei iBMC: the SecurityService
#     #SecurityService.ImportRemoteHttpsServerRootCA action.
# The assert below fails clearly when the BMC exposes neither, so the operator can
# fall back to ignoreVerification or a BMC-trusted artifact server certificate.
- name: Resolve artifact server certificate source
  ansible.builtin.set_fact:
    bootwright_redfish_artifact_cert_host: "{{ bootwright_component.boot.agentIso.fetchUrl | ansible.builtin.urlsplit('hostname') }}"
    bootwright_redfish_artifact_cert_port: "{{ (bootwright_component.boot.agentIso.fetchUrl | ansible.builtin.urlsplit('port')) | default('443', true) }}"
  changed_when: false

# Read the artifact server's leaf TLS certificate straight off the live HTTPS
# endpoint with the openssl client, rather than community.crypto.get_certificate:
# that module needs the cryptography Python library on the host that executes it,
# and the bare-metal nodes are not yet provisioned, so these Redfish tasks run on
# the controller driving the BMCs -- a host that is not guaranteed to ship it.
# openssl is already a Bootwright dependency (the artifact server role installs it
# to mint this very certificate). Empty stdin makes s_client return as soon as it
# has presented the certificate; `timeout` bounds a TCP-open-but-unresponsive
# endpoint so a misconfigured artifact server fails fast instead of hanging the
# play (community.crypto.get_certificate defaulted to a 10s socket timeout).
- name: Retrieve the artifact server certificate
  ansible.builtin.command:
    argv:
      - timeout
      - "{{ bootwright_redfish_request_timeout }}"
      - openssl
      - s_client
      - -connect
      - "{{ bootwright_redfish_artifact_cert_host }}:{{ bootwright_redfish_artifact_cert_port | int }}"
      - -servername
      - "{{ bootwright_redfish_artifact_cert_host }}"
    stdin: ""
  register: bootwright_redfish_artifact_cert_probe
  changed_when: false
  # s_client exits non-zero on the artifact server's self-signed/untrusted cert
  # (and on a `timeout` kill), but it still prints the certificate it received.
  # Treat the run as successful whenever a complete certificate was captured, and
  # fail only when a non-zero exit left us with no certificate to import.
  failed_when: >-
    bootwright_redfish_artifact_cert_probe.rc != 0
    and ('END CERTIFICATE' not in (bootwright_redfish_artifact_cert_probe.stdout | default('')))

- name: Extract the artifact server certificate PEM
  ansible.builtin.set_fact:
    bootwright_redfish_artifact_cert_pem: >-
      {{
        bootwright_redfish_artifact_cert_probe.stdout
        | regex_search('(?s)-----BEGIN CERTIFICATE-----.*?-----END CERTIFICATE-----')
        | default('', true)
      }}
  changed_when: false

- name: Confirm the artifact server certificate was retrieved
  ansible.builtin.assert:
    that:
      - (bootwright_redfish_artifact_cert_pem | default('', true) | length) > 0
    fail_msg: >-
      Could not retrieve a TLS certificate from artifact server
      {{ bootwright_redfish_artifact_cert_host }}:{{ bootwright_redfish_artifact_cert_port }}
      with openssl s_client. Confirm the artifact server is reachable from this host
      and serving HTTPS, or use ignoreVerification or a BMC-trusted artifact server
      certificate instead.

- name: Refresh VirtualMedia member to locate a DMTF certificate store
  ansible.builtin.uri:
    url: "{{ bootwright_redfish_vmedia_member | bootwright.core.bootwright_redfish_url(bootwright_component.boot.redfish.baseUrl) }}"
    method: GET
    return_content: true
    status_code: [200, 404]
  register: bootwright_redfish_vmedia_cert_member_probe
  failed_when: false
  changed_when: false
  no_log: "{{ (bootwright_no_log | default(true) | bool) and ((bootwright_redfish_cred_path | length) > 0) }}"

- name: Probe Redfish SecurityService for an xFusion root-CA import action
  ansible.builtin.uri:
    url: "{{ bootwright_redfish_security_service_member | bootwright.core.bootwright_redfish_url(bootwright_component.boot.redfish.baseUrl) }}"
    method: GET
    return_content: true
    status_code: [200, 404]
  register: bootwright_redfish_security_service_actions_probe
  failed_when: false
  changed_when: false
  no_log: "{{ (bootwright_no_log | default(true) | bool) and ((bootwright_redfish_cred_path | length) > 0) }}"
  when: (bootwright_redfish_security_service_member | default('') | length) > 0

- name: Resolve certificate import targets
  ansible.builtin.set_fact:
    bootwright_redfish_vmedia_certificates_url: >-
      {{
        (((bootwright_redfish_vmedia_cert_member_probe.json | default({})).Certificates | default({})).get('@odata.id', ''))
        | bootwright.core.bootwright_redfish_url(bootwright_component.boot.redfish.baseUrl)
        if ((((bootwright_redfish_vmedia_cert_member_probe.json | default({})).Certificates | default({})).get('@odata.id', '')) | length) > 0
        else ''
      }}
    bootwright_redfish_xfusion_import_target: >-
      {{
        (((bootwright_redfish_security_service_actions_probe.json | default({})).Actions | default({})).get('#SecurityService.ImportRemoteHttpsServerRootCA', {}).get('target', ''))
        | bootwright.core.bootwright_redfish_url(bootwright_component.boot.redfish.baseUrl)
        if ((((bootwright_redfish_security_service_actions_probe.json | default({})).Actions | default({})).get('#SecurityService.ImportRemoteHttpsServerRootCA', {}).get('target', '')) | length) > 0
        else ''
      }}
    bootwright_redfish_xfusion_delete_target: >-
      {{
        (((bootwright_redfish_security_service_actions_probe.json | default({})).Actions | default({})).get('#SecurityService.DeleteRemoteHttpsServerRootCA', {}).get('target', ''))
        | bootwright.core.bootwright_redfish_url(bootwright_component.boot.redfish.baseUrl)
        if ((((bootwright_redfish_security_service_actions_probe.json | default({})).Actions | default({})).get('#SecurityService.DeleteRemoteHttpsServerRootCA', {}).get('target', '')) | length) > 0
        else ''
      }}
  changed_when: false

- name: Resolve effective certificate import method
  ansible.builtin.set_fact:
    bootwright_redfish_artifact_cert_method: >-
      {{
        'standard' if (bootwright_redfish_vmedia_certificates_url | length) > 0
        else 'xfusion' if (bootwright_redfish_xfusion_import_target | length) > 0
        else ''
      }}
  changed_when: false

- name: Confirm the BMC exposes a certificate trust store
  ansible.builtin.assert:
    that:
      - (bootwright_redfish_artifact_cert_method | length) > 0
    fail_msg: >-
      hardware.management.bmc.virtualMediaCertificate.importCertificate is set,
      but BMC VirtualMedia member {{ bootwright_redfish_vmedia_member }} exposes
      neither a Redfish Certificates collection nor an xFusion SecurityService
      ImportRemoteHttpsServerRootCA action to import the artifact server
      certificate into. Use ignoreVerification, or serve a BMC-trusted artifact
      server certificate, instead.

- name: Import the artifact certificate via the DMTF VirtualMedia store
  ansible.builtin.uri:
    url: "{{ bootwright_redfish_vmedia_certificates_url }}"
    method: POST
    body_format: json
    body:
      CertificateString: "{{ bootwright_redfish_artifact_cert_pem }}"
      CertificateType: PEM
    status_code: [200, 201, 202, 204]
  register: bootwright_redfish_artifact_cert_import_standard
  changed_when: (bootwright_redfish_artifact_cert_import_standard.status | default(0) | int) in [200, 201, 202, 204]
  no_log: "{{ (bootwright_no_log | default(true) | bool) and ((bootwright_redfish_cred_path | length) > 0) }}"
  when: bootwright_redfish_artifact_cert_method == 'standard'

- name: Record DMTF imported certificate reference for cleanup
  ansible.builtin.set_fact:
    bootwright_redfish_artifact_cert_ref: >-
      {{
        (bootwright_redfish_artifact_cert_import_standard.location | default('', true))
        | default(((bootwright_redfish_artifact_cert_import_standard.json | default({})).get('@odata.id', '')), true)
      }}
  changed_when: false
  when: bootwright_redfish_artifact_cert_method == 'standard'

# The iBMC import action takes RootCertId and Usage as mutually exclusive forms:
# RootCertId writes the cert to a specific slot (replacing any occupant), while
# Usage auto-allocates a slot tagged by purpose. Sending both is non-conformant
# and the iBMC rejects it (HTTP 403). We pin a fixed slot so remove_certificate.yml
# can delete it deterministically by RootCertId, so send RootCertId alone.
- name: Build xFusion remote-HTTPS-server root-CA import body
  ansible.builtin.set_fact:
    bootwright_redfish_xfusion_import_body: >-
      {{
        {
          'Type': 'text',
          'Content': bootwright_redfish_artifact_cert_pem,
          'RootCertId': (bootwright_redfish_artifact_root_cert_id | int)
        }
      }}
  changed_when: false
  no_log: "{{ bootwright_no_log | default(true) | bool }}"
  when: bootwright_redfish_artifact_cert_method == 'xfusion'

- name: Import the artifact certificate as a remote HTTPS server root CA (xFusion)
  ansible.builtin.uri:
    url: "{{ bootwright_redfish_xfusion_import_target }}"
    method: POST
    body_format: json
    body: "{{ bootwright_redfish_xfusion_import_body }}"
    return_content: true
    status_code: [200, 201, 202, 204]
  register: bootwright_redfish_artifact_cert_import_xfusion
  # Don't let the uri module's status_code mismatch raise the bare
  # "Status code was 403 ..." here: that message carries no iBMC detail, and the
  # task's no_log (which protects url_password) buries the response body that
  # explains the refusal. Tolerate any status, then surface the iBMC message in a
  # credential-safe assert below.
  failed_when: false
  changed_when: (bootwright_redfish_artifact_cert_import_xfusion.status | default(0) | int) in [200, 201, 202, 204]
  no_log: "{{ bootwright_no_log | default(true) | bool }}"
  when: bootwright_redfish_artifact_cert_method == 'xfusion'

# A non-2xx here is the iBMC refusing the action, not a malformed request: the
# body is a documented-valid form (Type/Content/RootCertId, RootCertId in the
# xFusion 5..8 range). The reason lives in the response body the import task's
# no_log hides, so re-surface it. Only status/json/content/msg are interpolated
# -- none of which carry url_password -- so the credential stays redacted.
- name: Confirm the xFusion root-CA import was accepted
  ansible.builtin.assert:
    that:
      - (bootwright_redfish_artifact_cert_import_xfusion.status | default(0) | int) in [200, 201, 202, 204]
    fail_msg: >-
      xFusion iBMC refused the remote-HTTPS-server root-CA import at
      {{ bootwright_redfish_xfusion_import_target }} with HTTP
      {{ bootwright_redfish_artifact_cert_import_xfusion.status | default('unknown') }}.
      iBMC response:
      {{
        bootwright_redfish_artifact_cert_import_xfusion.json
        | default(bootwright_redfish_artifact_cert_import_xfusion.content
                  | default(bootwright_redfish_artifact_cert_import_xfusion.msg | default('<no response body>', true), true), true)
      }}.
      MessageId Base.1.0.InsufficientPrivilege means the credentials authenticated
      but the account's iBMC role lacks the "Security Configuration" right this
      action requires. Redfish binds the privilege to the role, not to the auth
      transport, so basic-auth-vs-session makes no difference. The fixed Operator
      and Common User roles do not hold this right -- use an Administrator-role
      account, or grant a Custom Role the "Security Configuration" right, then
      re-run with the same credentials. ignoreVerification will not help such an
      account either: disabling the iBMC HttpsTransferCertVerification flag is the
      same SecurityService write and needs the same right. The privilege-free path
      is to serve a BMC-trusted artifact server certificate (CA-signed, or
      pre-loaded into the iBMC trust store) so no import is needed.
  when: bootwright_redfish_artifact_cert_method == 'xfusion'

- name: Record xFusion imported root-CA slot for cleanup
  ansible.builtin.set_fact:
    bootwright_redfish_artifact_root_cert_imported_id: "{{ bootwright_redfish_artifact_root_cert_id | int }}"
  changed_when: false
  when: bootwright_redfish_artifact_cert_method == 'xfusion'
