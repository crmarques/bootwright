---
- name: Build SecurityService remote-HTTPS-server root-CA import body
  ansible.builtin.set_fact:
    bootwright_redfish_security_service_import_body: >-
      {{
        {
          'Type': 'text',
          'Content': bootwright_redfish_artifact_cert_pem,
          'RootCertId': (bootwright_redfish_security_service_root_cert_id | int)
        }
      }}
  changed_when: false
  no_log: "{{ bootwright_no_log | default(true) | bool }}"

- name: Import the artifact certificate as a remote HTTPS server root CA (SecurityService)
  ansible.builtin.uri:
    url: "{{ bootwright_redfish_security_service_import_target }}"
    method: POST
    body_format: json
    body: "{{ bootwright_redfish_security_service_import_body }}"
    return_content: true
    status_code: [200, 201, 202, 204]
  register: bootwright_redfish_artifact_cert_import_security_service
  failed_when: false
  changed_when: (bootwright_redfish_artifact_cert_import_security_service.status | default(0) | int) in [200, 201, 202, 204]
  no_log: "{{ bootwright_no_log | default(true) | bool }}"

- name: Confirm the SecurityService root-CA import was accepted
  ansible.builtin.assert:
    that:
      - (bootwright_redfish_artifact_cert_import_security_service.status | default(0) | int) in [200, 201, 202, 204]
    fail_msg: >-
      The BMC manager SecurityService refused the remote-HTTPS-server root-CA import at
      {{ bootwright_redfish_security_service_import_target }} with HTTP
      {{ bootwright_redfish_artifact_cert_import_security_service.status | default('unknown') }}.
      BMC response:
      {{
        bootwright_redfish_artifact_cert_import_security_service.json
        | default(bootwright_redfish_artifact_cert_import_security_service.content
                  | default(bootwright_redfish_artifact_cert_import_security_service.msg | default('<no response body>', true), true), true)
      }}.
      MessageId Base.1.0.InsufficientPrivilege means the credentials authenticated
      but the account's BMC role lacks the "Security Configuration" right this
      action requires. Redfish binds the privilege to the role, not to the auth
      transport, so basic-auth-vs-session makes no difference. On Huawei/xFusion
      iBMC the fixed Operator and Common User roles do not hold this right -- use an
      Administrator-role account, or grant a Custom Role the "Security
      Configuration" right, then re-run with the same credentials. Switching to
      trust: disable-verification will not help such an account either: disabling
      the iBMC HttpsTransferCertVerification flag is the same SecurityService write
      and needs the same right. The privilege-free path is to serve a BMC-trusted
      artifact server certificate (CA-signed, or pre-loaded into the BMC trust
      store) and declare bmc.virtualMedia.tls.trust: established so bootwright
      performs no BMC security writes at all.

- name: Record SecurityService imported root-CA slot for cleanup
  ansible.builtin.set_fact:
    bootwright_redfish_artifact_root_cert_imported_id: "{{ bootwright_redfish_security_service_root_cert_id | int }}"
  changed_when: false
