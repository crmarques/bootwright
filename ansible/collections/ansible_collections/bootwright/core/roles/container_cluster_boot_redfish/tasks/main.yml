---
- name: Boot via Redfish with shared request defaults
  module_defaults:
    ansible.builtin.uri:
      validate_certs: "{{ bootwright_component.boot.redfish.validateCerts }}"
      force_basic_auth: "{{ (bootwright_redfish_cred_path | length) > 0 }}"
      url_username: "{{ bootwright_redfish_credentials.username | default(omit) }}"
      url_password: "{{ bootwright_redfish_credentials.password | default(omit) }}"
      timeout: "{{ bootwright_redfish_request_timeout }}"
  block:
    - name: Select Redfish boot action
      ansible.builtin.set_fact:
        bootwright_vmedia_action_effective: "{{ bootwright_vmedia_action | default('boot') }}"
      changed_when: false

    - name: Validate selected Redfish boot action
      ansible.builtin.assert:
        that:
          - bootwright_vmedia_action_effective in ['boot', 'cleanup_media']
        fail_msg: "Unsupported boot_redfish action {{ bootwright_vmedia_action_effective }}"

    - name: Validate Redfish boot inputs
      ansible.builtin.import_tasks: stage/validate.yml

    - name: Load Redfish credentials
      ansible.builtin.import_tasks: stage/credentials.yml

    - name: Resolve Redfish system
      ansible.builtin.import_tasks: stage/system.yml

    - name: Prove required TPM 2.0 before Redfish mutation
      ansible.builtin.import_tasks: validation/tpm2.yml
      when:
        - bootwright_vmedia_action_effective == 'boot'
        - bootwright_component.boot.redfish.requireTPM2 | default(false) | bool

    - name: Require a powered-off machine before installer boot
      ansible.builtin.import_tasks: validation/power.yml
      when:
        - bootwright_vmedia_action_effective == 'boot'
        - bootwright_component.osManaged | default(true) | bool

    - name: Prepare Redfish virtual media
      ansible.builtin.import_tasks: media/prepare.yml
      when: bootwright_vmedia_action_effective in ['boot', 'cleanup_media']

    - name: Validate declared MACs against Redfish inventory
      ansible.builtin.import_tasks: validation/macs.yml
      when:
        - bootwright_vmedia_action_effective == 'boot'
        - bootwright_component.boot.redfish.setBootSource | default(true) | bool
        - (bootwright_component.interfaces | default([]) | length) > 0

    - name: Boot node from Redfish virtual media
      when: bootwright_vmedia_action_effective == 'boot'
      block:
        - name: Power node from virtual media
          ansible.builtin.import_tasks: boot/power.yml

        - name: Set post-boot Redfish boot device
          ansible.builtin.import_tasks: boot/post_boot.yml
      always:
        - name: Restore Redfish certificate verification settings
          ansible.builtin.import_tasks: media/restore_certificate_verification.yml
