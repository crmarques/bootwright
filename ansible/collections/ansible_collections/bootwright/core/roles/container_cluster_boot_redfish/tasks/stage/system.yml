---
- name: Discover Redfish System ID
  ansible.builtin.uri:
    url: "{{ '/redfish/v1/Systems' | bootwright.core.bootwright_redfish_url(bootwright_component.boot.redfish.baseUrl) }}"
    method: GET
    return_content: true
  register: bootwright_redfish_systems_list
  when: (bootwright_component.boot.redfish.systemId | default('') | length) == 0
  no_log: "{{ (bootwright_no_log | default(true) | bool) and ((bootwright_redfish_cred_path | length) > 0) }}"

- name: Warn when the BMC exposes multiple systems and none was selected
  # A multi-system BMC (blade/chassis, some OpenBMC) exposes more than one
  # ComputerSystem; falling through to Members|first can target the wrong
  # system and boot it destructively. Surface it so the operator can pin
  # boot.redfish.systemId; first-member remains the conventional default.
  ansible.builtin.debug:
    msg: >-
      WARNING: Redfish BMC exposes
      {{ bootwright_redfish_systems_list.json.Members | length }} ComputerSystems
      but boot.redfish.systemId is unset; defaulting to the first member
      '{{ (bootwright_redfish_systems_list.json.Members | first)['@odata.id'] | basename }}'.
      Set boot.redfish.systemId explicitly to target the intended system.
  when:
    - (bootwright_component.boot.redfish.systemId | default('') | length) == 0
    - (bootwright_redfish_systems_list.json.Members | default([]) | length) > 1

- name: Resolve effective Redfish System ID
  ansible.builtin.set_fact:
    bootwright_redfish_system_id: >-
      {{
        bootwright_component.boot.redfish.systemId
        if (bootwright_component.boot.redfish.systemId | default('') | length) > 0
        else (bootwright_redfish_systems_list.json.Members | first)['@odata.id'] | basename
      }}
  changed_when: false
