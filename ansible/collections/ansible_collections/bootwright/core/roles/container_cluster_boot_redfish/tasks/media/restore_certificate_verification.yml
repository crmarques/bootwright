---
- name: Refresh virtual media metadata before restoring fetch certificate verification
  ansible.builtin.uri:
    url: "{{ bootwright_redfish_vmedia_member | bootwright.core.bootwright_redfish_url(bootwright_component.boot.redfish.baseUrl) }}"
    method: GET
    return_content: true
    status_code: [200, 404]
  register: bootwright_redfish_vmedia_restore_probe
  failed_when: false
  changed_when: false
  no_log: "{{ (bootwright_no_log | default(true) | bool) and ((bootwright_redfish_cred_path | length) > 0) }}"
  when:
    - not (bootwright_component.boot.redfish.artifactCertificate.ignoreVerification | default(false) | bool)
    - (bootwright_redfish_vmedia_transfer_protocol | default('')) == 'HTTPS'
    - bootwright_redfish_vmedia_verify_certificate_supported | default(false) | bool
    - bootwright_redfish_vmedia_verify_certificate_original | default(false) | bool
    - bootwright_redfish_vmedia_verify_certificate_patch is defined
    - (bootwright_redfish_vmedia_verify_certificate_patch.status | default(0) | int) in [200, 202, 204]

- name: Resolve virtual media restore PATCH precondition
  ansible.builtin.set_fact:
    bootwright_redfish_vmedia_restore_if_match: >-
      {{
        (bootwright_redfish_vmedia_restore_probe.json | default({})).get('@odata.etag', '')
        | default((bootwright_redfish_vmedia_restore_probe.headers | default({})).ETag | default('', true), true)
        | default((bootwright_redfish_vmedia_restore_probe.headers | default({})).etag | default('', true), true)
        | default('*', true)
      }}
  changed_when: false
  when:
    - bootwright_redfish_vmedia_restore_probe is defined
    - (bootwright_redfish_vmedia_restore_probe.status | default(0) | int) == 200

- name: Restore virtual media fetch certificate verification
  ansible.builtin.uri:
    url: "{{ bootwright_redfish_vmedia_member | bootwright.core.bootwright_redfish_url(bootwright_component.boot.redfish.baseUrl) }}"
    method: PATCH
    headers:
      If-Match: "{{ bootwright_redfish_vmedia_restore_if_match }}"
    body_format: json
    body:
      VerifyCertificate: true
    status_code: [200, 202, 204, 400, 405, 501]
  register: bootwright_redfish_vmedia_verify_certificate_restore
  failed_when: false
  changed_when: (bootwright_redfish_vmedia_verify_certificate_restore.status | default(0) | int) in [200, 202, 204]
  no_log: "{{ (bootwright_no_log | default(true) | bool) and ((bootwright_redfish_cred_path | length) > 0) }}"
  when:
    - bootwright_redfish_vmedia_restore_if_match is defined

# This file runs in the role's always-block, so a hard failure here could mask
# the original boot error. Surface a prominent warning instead when the restore
# actually ran (its If-Match gate was satisfied) but the BMC did not accept it,
# so the operator knows VerifyCertificate may still be OFF and how to re-enable
# it. No no_log: only the credential-free PATCH status and VirtualMedia resource
# path are interpolated (never url_password), and a no_log debug would censor the
# very warning this task exists to surface.
- name: Warn if virtual media fetch certificate verification was not restored
  ansible.builtin.debug:
    msg: >-
      WARNING: BMC virtual-media certificate verification may still be DISABLED on
      {{ bootwright_redfish_vmedia_member }}: the VerifyCertificate=true restore PATCH
      returned HTTP {{ bootwright_redfish_vmedia_verify_certificate_restore.status | default('unknown') }}
      instead of 200/202/204. Re-enable it manually by setting VerifyCertificate=true
      on that VirtualMedia resource before relying on the BMC to authenticate HTTPS
      fetches again.
  when:
    - bootwright_redfish_vmedia_restore_if_match is defined
    - (bootwright_redfish_vmedia_verify_certificate_restore.status | default(0) | int) not in [200, 202, 204]

- name: Refresh Redfish manager SecurityService before restoring HTTPS transfer certificate verification
  ansible.builtin.uri:
    url: "{{ bootwright_redfish_security_service_member | bootwright.core.bootwright_redfish_url(bootwright_component.boot.redfish.baseUrl) }}"
    method: GET
    return_content: true
    status_code: [200, 404]
  register: bootwright_redfish_security_service_restore_probe
  failed_when: false
  changed_when: false
  no_log: "{{ (bootwright_no_log | default(true) | bool) and ((bootwright_redfish_cred_path | length) > 0) }}"
  when:
    - not (bootwright_component.boot.redfish.artifactCertificate.ignoreVerification | default(false) | bool)
    - (bootwright_redfish_vmedia_transfer_protocol | default('')) == 'HTTPS'
    - (bootwright_redfish_security_service_member | default('') | length) > 0
    - bootwright_redfish_security_service_https_transfer_supported | default(false) | bool
    - bootwright_redfish_security_service_https_transfer_enabled | default(false) | bool
    - bootwright_redfish_security_service_https_transfer_patch is defined
    - (bootwright_redfish_security_service_https_transfer_patch.status | default(0) | int) in [200, 202, 204]

- name: Resolve Redfish manager SecurityService restore PATCH precondition
  ansible.builtin.set_fact:
    bootwright_redfish_security_service_restore_if_match: >-
      {{
        (bootwright_redfish_security_service_restore_probe.json | default({})).get('@odata.etag', '')
        | default((bootwright_redfish_security_service_restore_probe.headers | default({})).ETag | default('', true), true)
        | default((bootwright_redfish_security_service_restore_probe.headers | default({})).etag | default('', true), true)
        | default('*', true)
      }}
  changed_when: false
  when:
    - bootwright_redfish_security_service_restore_probe is defined
    - (bootwright_redfish_security_service_restore_probe.status | default(0) | int) == 200

- name: Restore Redfish HTTPS transfer certificate verification
  ansible.builtin.uri:
    url: "{{ bootwright_redfish_security_service_member | bootwright.core.bootwright_redfish_url(bootwright_component.boot.redfish.baseUrl) }}"
    method: PATCH
    headers:
      If-Match: "{{ bootwright_redfish_security_service_restore_if_match }}"
    body_format: json
    body:
      HttpsTransferCertVerification: true
    status_code: [200, 202, 204, 400, 405, 501]
  register: bootwright_redfish_security_service_https_transfer_restore
  failed_when: false
  changed_when: (bootwright_redfish_security_service_https_transfer_restore.status | default(0) | int) in [200, 202, 204]
  no_log: "{{ (bootwright_no_log | default(true) | bool) and ((bootwright_redfish_cred_path | length) > 0) }}"
  when:
    - bootwright_redfish_security_service_restore_if_match is defined

# Same always-block reasoning as the VerifyCertificate restore warning above:
# surface, don't fail, so the original error is preserved. Credential-free
# interpolation only; no no_log so the warning is actually visible.
- name: Warn if HTTPS transfer certificate verification was not restored
  ansible.builtin.debug:
    msg: >-
      WARNING: BMC manager HTTPS transfer certificate verification may still be
      DISABLED on {{ bootwright_redfish_security_service_member }}: the
      HttpsTransferCertVerification=true restore PATCH returned HTTP
      {{ bootwright_redfish_security_service_https_transfer_restore.status | default('unknown') }}
      instead of 200/202/204. Re-enable it manually by setting
      HttpsTransferCertVerification=true on the manager SecurityService before
      relying on the BMC to authenticate HTTPS fetches again.
  when:
    - bootwright_redfish_security_service_restore_if_match is defined
    - (bootwright_redfish_security_service_https_transfer_restore.status | default(0) | int) not in [200, 202, 204]

- name: Remove imported artifact server certificate from the BMC trust store
  ansible.builtin.import_tasks: remove_certificate.yml
  when: bootwright_component.boot.redfish.artifactCertificate.removeAfterBoot | default(false) | bool
