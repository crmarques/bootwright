---
- name: Probe Redfish system power state
  ansible.builtin.uri:
    url: "{{ ('/redfish/v1/Systems/' ~ bootwright_redfish_system_id) | bootwright.core.bootwright_redfish_url(bootwright_component.boot.redfish.baseUrl) }}"
    method: GET
    return_content: true
    validate_certs: "{{ bootwright_component.boot.redfish.validateCerts }}"
    force_basic_auth: "{{ (bootwright_redfish_cred_path | length) > 0 }}"
    url_username: "{{ bootwright_redfish_credentials.username | default(omit) }}"
    url_password: "{{ bootwright_redfish_credentials.password | default(omit) }}"
    timeout: "{{ bootwright_redfish_request_timeout }}"
  register: bootwright_redfish_power_state_probe
  failed_when: false
  changed_when: false
  no_log: "{{ (bootwright_redfish_cred_path | length) > 0 }}"

- name: Capture Redfish system power state status
  ansible.builtin.set_fact:
    bootwright_redfish_power_state_status:
      expected: "{{ bootwright_redfish_power_state_expected }}"
      systemID: "{{ bootwright_redfish_system_id }}"
      httpStatus: "{{ bootwright_redfish_power_state_probe.status | default('unknown') }}"
      powerState: "{{ (bootwright_redfish_power_state_probe.json | default({})).PowerState | default('<not reported>', true) }}"
      attempts: "{{ bootwright_redfish_power_state_attempt | int }}"
      retries: "{{ bootwright_redfish_power_state_retries | int }}"
  changed_when: false

- name: Resolve Redfish system power state result
  ansible.builtin.set_fact:
    bootwright_redfish_power_state_reached: "{{ (bootwright_redfish_power_state_status.powerState | default('')) == bootwright_redfish_power_state_expected }}"
  changed_when: false

- name: Report Redfish system power state wait status
  ansible.builtin.debug:
    msg: >-
      {{ bootwright_redfish_power_state_wait_label | default('Redfish power state wait') }}:
      system={{ bootwright_redfish_power_state_status.systemID }},
      expected={{ bootwright_redfish_power_state_status.expected }},
      observed={{ bootwright_redfish_power_state_status.powerState }},
      HTTP status={{ bootwright_redfish_power_state_status.httpStatus }},
      attempt={{ bootwright_redfish_power_state_status.attempts }}/{{ bootwright_redfish_power_state_status.retries }}.

- name: Wait before retrying Redfish power state probe
  ansible.builtin.command:
    argv:
      - sleep
      - "{{ bootwright_redfish_power_state_delay_seconds }}"
  changed_when: false
  when:
    - not (bootwright_redfish_power_state_reached | bool)
    - (bootwright_redfish_power_state_attempt | int) < (bootwright_redfish_power_state_retries | int)
