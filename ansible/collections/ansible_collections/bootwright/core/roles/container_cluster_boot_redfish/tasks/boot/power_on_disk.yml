---
- name: Refresh Redfish system metadata before managed OS disk power-on
  ansible.builtin.uri:
    url: "{{ ('/redfish/v1/Systems/' ~ bootwright_redfish_system_id) | bootwright.core.bootwright_redfish_url(bootwright_component.boot.redfish.baseUrl) }}"
    method: GET
    return_content: true
    status_code: [200, 404]
    validate_certs: "{{ bootwright_component.boot.redfish.validateCerts }}"
    force_basic_auth: "{{ (bootwright_redfish_cred_path | length) > 0 }}"
    url_username: "{{ bootwright_redfish_credentials.username | default(omit) }}"
    url_password: "{{ bootwright_redfish_credentials.password | default(omit) }}"
    timeout: "{{ bootwright_redfish_request_timeout }}"
  register: bootwright_redfish_system_boot_probe
  failed_when: false
  changed_when: false
  no_log: "{{ (bootwright_redfish_cred_path | length) > 0 }}"

- name: Resolve Redfish system PATCH precondition for managed OS disk power-on
  ansible.builtin.set_fact:
    bootwright_redfish_system_if_match: >-
      {{
        (bootwright_redfish_system_boot_probe.json | default({})).get('@odata.etag', '')
        | default((bootwright_redfish_system_boot_probe.headers | default({})).ETag | default('', true), true)
        | default((bootwright_redfish_system_boot_probe.headers | default({})).etag | default('', true), true)
        | default('*', true)
      }}
  changed_when: false

- name: Request managed OS disk boot before power-on
  ansible.builtin.uri:
    url: "{{ ('/redfish/v1/Systems/' ~ bootwright_redfish_system_id) | bootwright.core.bootwright_redfish_url(bootwright_component.boot.redfish.baseUrl) }}"
    method: PATCH
    headers:
      If-Match: "{{ bootwright_redfish_system_if_match }}"
    body_format: json
    body:
      Boot:
        BootSourceOverrideEnabled: Continuous
        BootSourceOverrideTarget: Hdd
    status_code: [200, 202, 204, 400, 405, 501]
    validate_certs: "{{ bootwright_component.boot.redfish.validateCerts }}"
    force_basic_auth: "{{ (bootwright_redfish_cred_path | length) > 0 }}"
    url_username: "{{ bootwright_redfish_credentials.username | default(omit) }}"
    url_password: "{{ bootwright_redfish_credentials.password | default(omit) }}"
    timeout: "{{ bootwright_redfish_request_timeout }}"
  register: bootwright_redfish_disk_boot_patch
  failed_when: false
  changed_when: (bootwright_redfish_disk_boot_patch.status | default(0) | int) in [200, 202, 204]
  no_log: "{{ (bootwright_redfish_cred_path | length) > 0 }}"

- name: Resolve Redfish reset action metadata for managed OS disk power-on
  ansible.builtin.set_fact:
    bootwright_redfish_system_reset_actions: "{{ (bootwright_redfish_system_boot_probe.json | default({})) | bootwright.core.bootwright_redfish_action_descriptors('#ComputerSystem.Reset') }}"
    bootwright_redfish_system_default_reset_target: "{{ '/redfish/v1/Systems/' ~ bootwright_redfish_system_id ~ '/Actions/ComputerSystem.Reset' }}"
  changed_when: false

- name: Resolve Redfish reset action target for managed OS disk power-on
  ansible.builtin.set_fact:
    bootwright_redfish_system_reset_target: >-
      {{
        (
          bootwright_redfish_system_reset_actions
          | selectattr('source', 'equalto', 'standard')
          | map(attribute='target')
          | list
          | first
        )
        | default(
          (
            bootwright_redfish_system_reset_actions
            | map(attribute='target')
            | list
            | first
          ),
          true
        )
        | default(bootwright_redfish_system_default_reset_target, true)
      }}
  changed_when: false

- name: Probe Redfish Reset ActionInfo for managed OS disk power-on
  ansible.builtin.uri:
    url: "{{ item.actionInfo | bootwright.core.bootwright_redfish_url(bootwright_component.boot.redfish.baseUrl) }}"
    method: GET
    return_content: true
    status_code: [200, 404]
    validate_certs: "{{ bootwright_component.boot.redfish.validateCerts }}"
    force_basic_auth: "{{ (bootwright_redfish_cred_path | length) > 0 }}"
    url_username: "{{ bootwright_redfish_credentials.username | default(omit) }}"
    url_password: "{{ bootwright_redfish_credentials.password | default(omit) }}"
    timeout: "{{ bootwright_redfish_request_timeout }}"
  register: bootwright_redfish_reset_action_info_probe
  failed_when: false
  changed_when: false
  no_log: "{{ (bootwright_redfish_cred_path | length) > 0 }}"
  loop: "{{ bootwright_redfish_system_reset_actions | selectattr('actionInfo', 'defined') | list }}"

- name: Resolve Redfish power-on reset type for managed OS disk power-on
  ansible.builtin.set_fact:
    bootwright_redfish_power_on_reset_type: "{{ (bootwright_redfish_system_boot_probe.json | default({})) | bootwright.core.bootwright_redfish_power_on_reset_type(bootwright_redfish_reset_action_info_probe | default({})) }}"
  changed_when: false

- name: Power on managed OS from disk
  ansible.builtin.uri:
    url: "{{ bootwright_redfish_system_reset_target | bootwright.core.bootwright_redfish_url(bootwright_component.boot.redfish.baseUrl) }}"
    method: POST
    body_format: json
    body:
      ResetType: "{{ bootwright_redfish_power_on_reset_type }}"
    status_code: [200, 202, 204, 409, 500]
    validate_certs: "{{ bootwright_component.boot.redfish.validateCerts }}"
    force_basic_auth: "{{ (bootwright_redfish_cred_path | length) > 0 }}"
    url_username: "{{ bootwright_redfish_credentials.username | default(omit) }}"
    url_password: "{{ bootwright_redfish_credentials.password | default(omit) }}"
    timeout: "{{ bootwright_redfish_request_timeout }}"
  register: bootwright_redfish_power_on_request
  failed_when: false
  changed_when: (bootwright_redfish_power_on_request.status | default(0) | int) in [200, 202, 204]
  no_log: "{{ (bootwright_redfish_cred_path | length) > 0 }}"

- name: Confirm managed OS disk power-on request can be verified
  ansible.builtin.assert:
    that:
      - (bootwright_redfish_power_on_request.status | default(0) | int) in [200, 202, 204, 409, 500]
    fail_msg: >-
      Redfish BMC returned unexpected managed OS disk power-on HTTP status for
      system {{ bootwright_redfish_system_id }}:
      {{ bootwright_redfish_power_on_request.status | default('unknown') }}
      using ResetType={{ bootwright_redfish_power_on_reset_type }}.
    success_msg: >-
      Redfish managed OS disk power-on request for system
      {{ bootwright_redfish_system_id }} returned HTTP status
      {{ bootwright_redfish_power_on_request.status | default('unknown') }}
      using ResetType={{ bootwright_redfish_power_on_reset_type }};
      verifying PowerState=On next.

- name: Initialize Redfish power state wait for managed OS PowerState=On
  ansible.builtin.set_fact:
    bootwright_redfish_power_state_expected: "On"
    bootwright_redfish_power_state_wait_label: managed OS disk power-on
    bootwright_redfish_power_state_reached: false
    bootwright_redfish_power_state_status:
      expected: "On"
      systemID: "{{ bootwright_redfish_system_id }}"
      httpStatus: not attempted
      powerState: not attempted
      attempts: 0
      retries: "{{ bootwright_redfish_power_state_retries | int }}"
  changed_when: false

- name: Wait for managed OS to report PowerState=On
  ansible.builtin.include_tasks:
    file: power_state_probe.yml
    apply:
      when: not (bootwright_redfish_power_state_reached | bool)
  loop: "{{ range(1, (bootwright_redfish_power_state_retries | int) + 1) | list }}"
  loop_control:
    loop_var: bootwright_redfish_power_state_attempt
  when: not (bootwright_redfish_power_state_reached | bool)

- name: Confirm managed OS reports PowerState=On
  ansible.builtin.assert:
    that:
      - bootwright_redfish_power_state_reached | bool
    fail_msg: >-
      Redfish BMC did not report PowerState=On for system
      {{ bootwright_redfish_power_state_status.systemID }} after managed OS
      disk power-on.
      ResetType={{ bootwright_redfish_power_on_reset_type }},
      Last HTTP status={{ bootwright_redfish_power_state_status.httpStatus }},
      observed PowerState={{ bootwright_redfish_power_state_status.powerState }},
      attempts={{ bootwright_redfish_power_state_status.attempts }} of
      {{ bootwright_redfish_power_state_status.retries }}.
    success_msg: >-
      Redfish BMC reports PowerState=On for managed OS system
      {{ bootwright_redfish_power_state_status.systemID }}.
