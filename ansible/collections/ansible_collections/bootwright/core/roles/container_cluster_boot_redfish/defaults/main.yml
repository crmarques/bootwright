---
bootwright_redfish_request_timeout: 60

bootwright_redfish_insert_media_retries: 3
bootwright_redfish_insert_media_retry_delay_seconds: 10
bootwright_redfish_insert_task_retries: 60
bootwright_redfish_insert_task_delay_seconds: 2
bootwright_redfish_task_terminal_states:
  - Completed
  - Exception
  - Killed
  - Cancelled
  - Interrupted

bootwright_redfish_vmedia_insert_retries: 24
bootwright_redfish_vmedia_insert_delay_seconds: 5
bootwright_redfish_vmedia_eject_retries: 24
bootwright_redfish_vmedia_eject_delay_seconds: 5

# Data for the manager SecurityService OEM certificate-import method
# (media/import_certificate/security_service.yml), used by Huawei/xFusion iBMC and
# compatible BMCs that expose #SecurityService.ImportRemoteHttpsServerRootCA. Slot
# the action writes the artifact server CA into: the remote-HTTPS-server root-CA
# store accepts RootCertId 5..8 (not 1..8); values outside that range are rejected.
# Fixed so removal is deterministic and re-import overwrites rather than
# accumulates; the top slot avoids colliding with operator-managed certificates.
# Adding another OEM import method is a data entry here plus a
# media/import_certificate/<method>.yml (and matching remove_certificate) file.
bootwright_redfish_security_service_root_cert_id: 8

bootwright_redfish_vmedia_probe_retries: 12
bootwright_redfish_vmedia_probe_delay_seconds: 2

bootwright_redfish_power_state_retries: 12
bootwright_redfish_power_state_delay_seconds: 5

bootwright_node_ready_probe_port: 22
bootwright_node_ready_timeout_seconds: 600
bootwright_node_ready_ssh_auth_retries: 60
bootwright_node_ready_ssh_auth_delay_seconds: 10
bootwright_node_ready_ssh_connect_timeout_seconds: 5
