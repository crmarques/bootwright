---
- name: Validate the frozen managed service request
  ansible.builtin.assert:
    that:
      - bootwright_dns_server_request.version == 'dns-server-dnsmasq-v1'
      - bootwright_dns_server_request.contentRoot.startswith('/var/lib/bootwright-services/')
      - bootwright_dns_server_digest is match('[0-9a-f]{64}')
    quiet: true
  no_log: true

- name: Complete the qualified execution handoff
  bootwright.core.infra_service_protocol:
    phase: loaded
  no_log: true

- name: Report service stop
  bootwright.core.infra_service_protocol:
    phase: group
    group: stop-service
    status: running
  no_log: true

- name: Observe the managed service before removal
  bootwright.core.infra_service_inspect:
    request: '{{ bootwright_dns_server_request }}'
  register: infra_dns_server_dnsmasq_before

- name: Stop the managed service
  ansible.builtin.command:
    argv:
      - /usr/bin/systemctl
      - stop
      - '{{ infra_dns_server_dnsmasq_service }}'
  when: infra_dns_server_dnsmasq_before.observation.unit | length > 0
  changed_when: infra_dns_server_dnsmasq_before.observation.unit | length > 0

- name: Report service stop completion
  bootwright.core.infra_service_protocol:
    phase: group
    group: stop-service
    status: ok
  no_log: true

- name: Report configuration removal
  bootwright.core.infra_service_protocol:
    phase: group
    group: remove-configuration
    status: running
  no_log: true

- name: Remove the container unit definition
  ansible.builtin.file:
    path: '{{ infra_dns_server_dnsmasq_unit_path }}'
    state: absent
  register: infra_dns_server_dnsmasq_unit_removed

- name: Reload the host service manager so the unit generator runs
  ansible.builtin.command:
    argv:
      - /usr/bin/systemctl
      - daemon-reload
  changed_when: false

- name: Remove a container the stopped unit left behind
  ansible.builtin.command:
    argv:
      - /usr/bin/podman
      - rm
      - --force
      - --ignore
      - '{{ bootwright_dns_server_request.unit }}'
  when: infra_dns_server_dnsmasq_before.observation.containerPresent
  changed_when: infra_dns_server_dnsmasq_before.observation.containerPresent

- name: Remove the owned content root
  ansible.builtin.file:
    path: '{{ bootwright_dns_server_request.contentRoot }}'
    state: absent
  register: infra_dns_server_dnsmasq_root_removed

- name: Report configuration removal completion
  bootwright.core.infra_service_protocol:
    phase: group
    group: remove-configuration
    status: ok
  no_log: true

- name: Report absence verification
  bootwright.core.infra_service_protocol:
    phase: group
    group: verify-absence
    status: running
  no_log: true

- name: Prove every owned resource is gone
  bootwright.core.infra_service_inspect:
    request: '{{ bootwright_dns_server_request }}'
  register: infra_dns_server_dnsmasq_after

- name: Report absence verification completion
  bootwright.core.infra_service_protocol:
    phase: group
    group: verify-absence
    status: ok
  no_log: true

- name: Publish bounded managed service removal evidence
  bootwright.core.infra_service_protocol:
    phase: completed
    outcome: >-
      {{ 'changed'
         if (infra_dns_server_dnsmasq_unit_removed is changed
             or infra_dns_server_dnsmasq_root_removed is changed
             or infra_dns_server_dnsmasq_before.observation.unit | length > 0)
         else 'unchanged' }}
    digest: '{{ bootwright_dns_server_digest }}'
    observation: '{{ infra_dns_server_dnsmasq_after.observation }}'
    removed: true
  no_log: true
