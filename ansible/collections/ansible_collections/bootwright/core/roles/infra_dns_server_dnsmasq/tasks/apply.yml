---
- name: Validate the frozen managed service request
  ansible.builtin.assert:
    that:
      - bootwright_dns_server_request.version == 'dns-server-dnsmasq-v2'
      - bootwright_dns_server_request.unit is string
      - bootwright_dns_server_request.contentRoot.startswith('/var/lib/bootwright-services/')
      - bootwright_dns_server_request.image is search('@sha256:[0-9a-f]{64}$')
      - bootwright_dns_server_request.port | int > 0
      - bootwright_dns_server_digest is match('[0-9a-f]{64}')
    quiet: true
  no_log: true

- name: Complete the qualified execution handoff
  bootwright.core.infra_service_protocol:
    phase: loaded
  no_log: true

- name: Report image acquisition
  bootwright.core.infra_service_protocol:
    phase: group
    group: pull-image
    status: running
  no_log: true

- name: Check whether the pinned service image is already present
  ansible.builtin.command:
    argv:
      - /usr/bin/podman
      - image
      - exists
      - '{{ bootwright_dns_server_request.image }}'
  register: infra_dns_server_dnsmasq_image_present
  failed_when: false
  changed_when: false

# The frozen egress route is the only one this pull may take. A native tool
# may read either spelling of a proxy variable, and an empty one lets the
# other win, so both spellings carry the same route and none is ambient.
- name: Acquire the pinned service image
  ansible.builtin.command:
    argv:
      - /usr/bin/podman
      - pull
      - '{{ bootwright_dns_server_request.image }}'
  environment:
    HTTP_PROXY: '{{ bootwright_dns_server_request.egress.httpProxy | default("") }}'
    HTTPS_PROXY: '{{ bootwright_dns_server_request.egress.httpsProxy | default("") }}'
    NO_PROXY: '{{ bootwright_dns_server_request.egress.noProxy | default([]) | join(",") }}'
    http_proxy: '{{ bootwright_dns_server_request.egress.httpProxy | default("") }}'
    https_proxy: '{{ bootwright_dns_server_request.egress.httpsProxy | default("") }}'
    no_proxy: '{{ bootwright_dns_server_request.egress.noProxy | default([]) | join(",") }}'
  register: infra_dns_server_dnsmasq_pull
  when: infra_dns_server_dnsmasq_image_present.rc != 0
  changed_when: infra_dns_server_dnsmasq_image_present.rc != 0

- name: Report image acquisition completion
  bootwright.core.infra_service_protocol:
    phase: group
    group: pull-image
    status: ok
  no_log: true

- name: Report configuration publication
  bootwright.core.infra_service_protocol:
    phase: group
    group: publish-configuration
    status: running
  no_log: true

- name: Create the owned service directories
  ansible.builtin.file:
    path: '{{ item }}'
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - '{{ bootwright_dns_server_request.contentRoot }}'
    - '{{ infra_dns_server_dnsmasq_config_dir }}'
  register: infra_dns_server_dnsmasq_directories

- name: Publish the service configuration
  ansible.builtin.template:
    src: dnsmasq.conf.j2
    dest: '{{ infra_dns_server_dnsmasq_config_dir }}/dnsmasq.conf'
    owner: root
    group: root
    mode: '0644'
  register: infra_dns_server_dnsmasq_configuration

- name: Publish the container unit definition
  ansible.builtin.template:
    src: unit.container.j2
    dest: '{{ infra_dns_server_dnsmasq_unit_path }}'
    owner: root
    group: root
    mode: '0644'
  register: infra_dns_server_dnsmasq_unit

- name: Reload the host service manager so the unit generator runs
  ansible.builtin.command:
    argv:
      - /usr/bin/systemctl
      - daemon-reload
  changed_when: false

- name: Report configuration publication completion
  bootwright.core.infra_service_protocol:
    phase: group
    group: publish-configuration
    status: ok
  no_log: true

- name: Report service start
  bootwright.core.infra_service_protocol:
    phase: group
    group: start-service
    status: running
  no_log: true

- name: Observe the service before starting it
  bootwright.core.infra_service_inspect:
    request: '{{ bootwright_dns_server_request }}'
  register: infra_dns_server_dnsmasq_before

# A running service keeps what it started with: its unit takes effect at a
# start and its configuration is mounted on its own, so publishing one replaces
# the host's file while the daemon keeps the one it read. An attempt stopped
# between publishing and restarting leaves the service on the earlier files
# while the next attempt finds the published ones unchanged, so a running
# service restarts whenever a file it runs from is newer than its start.
- name: Observe the files the service runs from
  ansible.builtin.stat:
    path: '{{ item }}'
    get_checksum: false
  loop:
    - '{{ infra_dns_server_dnsmasq_config_dir }}/dnsmasq.conf'
    - '{{ infra_dns_server_dnsmasq_unit_path }}'
  register: infra_dns_server_dnsmasq_runs_from
  when: infra_dns_server_dnsmasq_before.observation.unit == 'active'

# A start that cannot be read proves nothing, so the service then restarts.
# The format is podman's own template, handed to it as a literal.
- name: Observe when the running service started
  ansible.builtin.command:
    argv:
      - /usr/bin/podman
      - inspect
      - --type
      - container
      - --format
      - "{{ '{{.State.StartedAt.UnixNano}}' }}"
      - '{{ bootwright_dns_server_request.unit }}'
  register: infra_dns_server_dnsmasq_started
  when: infra_dns_server_dnsmasq_before.observation.unit == 'active'
  changed_when: false
  failed_when: false

- name: Start the managed service
  ansible.builtin.command:
    argv:
      - /usr/bin/systemctl
      - start
      - '{{ infra_dns_server_dnsmasq_service }}'
  when: infra_dns_server_dnsmasq_before.observation.unit != 'active'
  changed_when: infra_dns_server_dnsmasq_before.observation.unit != 'active'

- name: Restart the managed service when a file it runs from changed since it started
  ansible.builtin.command:
    argv:
      - /usr/bin/systemctl
      - restart
      - '{{ infra_dns_server_dnsmasq_service }}'
  register: infra_dns_server_dnsmasq_restart
  when:
    - infra_dns_server_dnsmasq_before.observation.unit == 'active'
    - infra_dns_server_dnsmasq_configuration is changed or infra_dns_server_dnsmasq_unit is changed
      or (infra_dns_server_dnsmasq_started.stdout | default('') | trim | int)
      < (infra_dns_server_dnsmasq_runs_from.results | map(attribute='stat.mtime') | max) * 1000000000
  changed_when: true

- name: Report service start completion
  bootwright.core.infra_service_protocol:
    phase: group
    group: start-service
    status: ok
  no_log: true

- name: Report readiness verification
  bootwright.core.infra_service_protocol:
    phase: group
    group: verify-readiness
    status: running
  no_log: true

- name: Prove the managed service answers on every declared address
  bootwright.core.infra_service_inspect:
    request: '{{ bootwright_dns_server_request }}'
    runs_from:
      - '{{ infra_dns_server_dnsmasq_config_dir }}/dnsmasq.conf'
    readiness: true
  register: infra_dns_server_dnsmasq_after

- name: Refuse an unproved address
  ansible.builtin.assert:
    that:
      - infra_dns_server_dnsmasq_after.unproved | length == 0
    fail_msg: >-
      a declared managed service address did not answer within its readiness
      window: {{ infra_dns_server_dnsmasq_after.unproved | join("; ") }}
    quiet: true

- name: Report readiness completion
  bootwright.core.infra_service_protocol:
    phase: group
    group: verify-readiness
    status: ok
  no_log: true

- name: Publish bounded managed service completion evidence
  bootwright.core.infra_service_protocol:
    phase: completed
    outcome: >-
      {{ 'changed'
         if (infra_dns_server_dnsmasq_directories is changed
             or infra_dns_server_dnsmasq_configuration is changed
             or infra_dns_server_dnsmasq_unit is changed
             or infra_dns_server_dnsmasq_restart is changed
             or infra_dns_server_dnsmasq_pull is changed
             or infra_dns_server_dnsmasq_before.observation.unit != 'active')
         else 'unchanged' }}
    digest: '{{ bootwright_dns_server_digest }}'
    observation: '{{ infra_dns_server_dnsmasq_after.observation }}'
    answers: '{{ infra_dns_server_dnsmasq_after.answers }}'
  no_log: true
