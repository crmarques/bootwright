---
# Derived from the frozen request only. Nothing here is authored by desired
# state, and no value selects an executable, a role or a task file.
containercluster_media_agent_work: '{{ bootwright_cluster_media_request.workRoot }}'
# Pushed delivery never enters a served root; its frozen image path is proved
# equal to this file before any build or removal.
containercluster_media_agent_push_image: '{{ containercluster_media_agent_work }}/agent.iso'
containercluster_media_agent_private: '{{ bootwright_cluster_media_request.image.path }}'
# The receipt records what the published image was built from, so a replay
# proves that building again would change nothing without reading the image.
containercluster_media_agent_receipt: '{{ containercluster_media_agent_work }}/bootwright-media.json'
# The administrator kubeconfig the cluster's installation keeps in this work
# area (containercluster_install_agent_kubeconfig), and the inspection's 64 KiB
# read bound on it.
containercluster_media_agent_kubeconfig: '{{ containercluster_media_agent_work }}/.bootwright-kubeconfig'
containercluster_media_agent_kubeconfig_bound: 65536
# The incarnation of the context that built the work area, as its receipt
# records it: the device and inode the registry holds for the context's
# directory with that directory's birth time, or its inode generation where the
# filesystem reports no birth time. A filesystem reuses a freed inode, so the
# birth time is what a recreated context of the same name never shares. A
# receipt that records none, or no receipt, names no other incarnation.
containercluster_media_agent_built_by: >-
  {{ ((containercluster_media_agent_built.content | b64decode | from_json).incarnation | default(''))
     if containercluster_media_agent_built.content is defined else '' }}
containercluster_media_agent_foreign: >-
  {{ containercluster_media_agent_built_by | length > 0
     and containercluster_media_agent_built_by != bootwright_cluster_media_material.incarnation | default('') }}
containercluster_media_agent_installer: '{{ bootwright_cluster_media_material.installer }}'
# The installer reads the release payload through `oc`, which it finds by name
# on its search path, so the build's path leads with the client the controller
# stage published for the same release. The build egress adds only its route.
containercluster_media_agent_environment: >-
  {{ bootwright_cluster_media_request.buildEgress | default({})
     | combine({'PATH': (bootwright_cluster_media_material.oc | dirname) ~ ':/usr/bin:/usr/sbin'}) }}
# The unguessable directory this attempt publishes in. The token is minted by
# the attempt, so it names a path that exists in no request and no log.
containercluster_media_agent_directory: >-
  {{ containercluster_media_agent_private }}/{{ containercluster_media_agent_token.stdout | default('') | trim }}
# The image is already this request's when the receipt names this exact digest
# and the published image is still there.
containercluster_media_agent_published: >-
  {{ containercluster_media_agent_before.observation.image | default(false)
     and containercluster_media_agent_before.observation.inputs | default('') == bootwright_cluster_media_digest
     and containercluster_media_agent_before.observation.installer | default('')
         == bootwright_cluster_media_request.release.version }}

# A listener self-fetch of the published agent image that failed before any
# status line, a timeout, a refused, reset or unreachable connection, is tried
# again this many times this many seconds apart, so one short network drop on
# the controller does not refuse it. A status, or a certificate that did not
# verify, refuses at once.
containercluster_media_agent_listener_retries: 2
containercluster_media_agent_listener_pause: 5
