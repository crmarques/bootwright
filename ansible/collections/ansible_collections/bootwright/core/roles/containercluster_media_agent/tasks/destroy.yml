---
- name: Validate the frozen boot-media request
  ansible.builtin.assert:
    that:
      - bootwright_cluster_media_request.version == 'cluster-media-agent-v3'
      - bootwright_cluster_media_request.image.path.startswith('/var/lib/bootwright-services/')
      - bootwright_cluster_media_request.workRoot.startswith('/var/lib/bootwright-clusters/')
      - bootwright_cluster_media_digest is match('[0-9a-f]{64}')
    quiet: true
  no_log: true

- name: Complete the qualified execution handoff
  bootwright.core.containercluster_media_protocol:
    phase: loaded
  no_log: true

- name: Report published content removal
  bootwright.core.containercluster_media_protocol:
    phase: group
    group: remove-published
    status: running
  no_log: true

- name: Remove the subtree this block owns beneath the served root
  ansible.builtin.file:
    path: '{{ containercluster_media_agent_private }}'
    state: absent
  register: containercluster_media_agent_image_removed

- name: Remove the work area this cluster's installer kept its state in
  ansible.builtin.file:
    path: '{{ containercluster_media_agent_work }}'
    state: absent
  register: containercluster_media_agent_work_removed

- name: Report published content removal completion
  bootwright.core.containercluster_media_protocol:
    phase: group
    group: remove-published
    status: ok
  no_log: true

- name: Report absence verification
  bootwright.core.containercluster_media_protocol:
    phase: group
    group: verify-absence
    status: running
  no_log: true

- name: Prove every published file is gone
  bootwright.core.containercluster_media_inspect:
    request: '{{ bootwright_cluster_media_request }}'
  register: containercluster_media_agent_after

- name: Report absence verification completion
  bootwright.core.containercluster_media_protocol:
    phase: group
    group: verify-absence
    status: ok
  no_log: true

- name: Publish bounded boot-media removal evidence
  bootwright.core.containercluster_media_protocol:
    phase: completed
    outcome: >-
      {{ 'changed'
         if (containercluster_media_agent_image_removed is changed
             or containercluster_media_agent_work_removed is changed)
         else 'unchanged' }}
    digest: '{{ bootwright_cluster_media_digest }}'
    observation: '{{ containercluster_media_agent_after.observation }}'
    removed: true
  no_log: true
