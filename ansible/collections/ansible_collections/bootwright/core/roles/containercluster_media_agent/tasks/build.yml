---
# The installer consumes its inputs into its own asset state, so a build always
# starts from the frozen bytes rather than from what a previous one left.
- name: Discard the installer work area a previous build left
  ansible.builtin.file:
    path: '{{ containercluster_media_agent_work }}'
    state: absent
  changed_when: false

- name: Create the work area this cluster's installer keeps its state in
  ansible.builtin.file:
    path: '{{ containercluster_media_agent_work }}'
    state: directory
    owner: root
    group: root
    mode: '0700'
  changed_when: false

# The bound material reaches the installer inputs here and nowhere else: the
# frozen request carries the declarations, never their values.
- name: Write the install configuration with its bound material
  ansible.builtin.copy:
    content: >-
      {{ bootwright_cluster_media_request.installConfig
         | combine({
             'pullSecret': lookup('ansible.builtin.file', bootwright_cluster_media_material.pullSecret),
             'sshKey': bootwright_cluster_media_material.sshKey,
           })
         | to_nice_yaml(indent=2) }}
    dest: '{{ containercluster_media_agent_work }}/install-config.yaml'
    owner: root
    group: root
    mode: '0600'
  changed_when: true
  no_log: true

- name: Write the agent configuration
  ansible.builtin.copy:
    content: '{{ bootwright_cluster_media_request.agentConfig | to_nice_yaml(indent=2) }}'
    dest: '{{ containercluster_media_agent_work }}/agent-config.yaml'
    owner: root
    group: root
    mode: '0600'
  changed_when: true

- name: Build the image this cluster's nodes boot
  ansible.builtin.command:
    argv:
      - '{{ containercluster_media_agent_installer }}'
      - agent
      - create
      - image
      - --dir
      - '{{ containercluster_media_agent_work }}'
      - --log-level
      - info
  register: containercluster_media_agent_built
  changed_when: true

- name: Find the image the installer produced
  ansible.builtin.find:
    paths: '{{ containercluster_media_agent_work }}'
    patterns: 'agent.*.iso'
    file_type: file
  register: containercluster_media_agent_products

- name: Refuse a build that produced no single image
  ansible.builtin.assert:
    that:
      - containercluster_media_agent_products.files | length == 1
    fail_msg: the installer produced no single agent image for this cluster
    quiet: true

# Every directory from the owned subtree down is 0711 and the image itself
# 0600, so nothing is listable and the unguessable segment is the only way to
# name what it contains.
- name: Create the private subtree this block owns
  ansible.builtin.file:
    path: '{{ containercluster_media_agent_private }}'
    state: directory
    owner: root
    group: root
    mode: '0711'

- name: Find the directory a previous attempt published in
  ansible.builtin.find:
    paths: '{{ containercluster_media_agent_private }}'
    file_type: directory
  register: containercluster_media_agent_previous

- name: Remove what a previous attempt published
  ansible.builtin.file:
    path: '{{ item.path }}'
    state: absent
  loop: '{{ containercluster_media_agent_previous.files }}'
  loop_control:
    label: a previous publication
  no_log: true

# The unguessable segment is minted here, by the attempt, so it exists in no
# frozen request and reaches no evidence, progress line or log.
- name: Mint the unguessable directory this attempt publishes the image in
  ansible.builtin.command:
    argv:
      - /usr/bin/openssl
      - rand
      - -hex
      - '32'
  register: containercluster_media_agent_token
  changed_when: false
  no_log: true

- name: Create the directory this attempt publishes in
  ansible.builtin.file:
    path: '{{ containercluster_media_agent_directory }}'
    state: directory
    owner: root
    group: root
    mode: '0711'
  changed_when: true
  no_log: true

- name: Publish the image by atomic rename
  ansible.builtin.command:
    argv:
      - /usr/bin/mv
      - --no-target-directory
      - '{{ containercluster_media_agent_products.files[0].path }}'
      - '{{ containercluster_media_agent_directory }}/agent.iso'
  changed_when: true
  no_log: true

- name: Keep the published image readable only by the serving process
  ansible.builtin.file:
    path: '{{ containercluster_media_agent_directory }}/agent.iso'
    owner: root
    group: root
    mode: '0600'
  changed_when: false
  no_log: true

- name: Label the published subtree so the serving process can read it
  ansible.builtin.command:
    argv:
      - /usr/bin/chcon
      - --recursive
      - --reference
      - '{{ containercluster_media_agent_private | dirname | dirname | dirname }}'
      - '{{ containercluster_media_agent_private }}'
  changed_when: true

- name: Record what this image was built from
  ansible.builtin.copy:
    content: >-
      {{ {'inputs': bootwright_cluster_media_digest,
          'installer': bootwright_cluster_media_request.release.version} | to_json }}
    dest: '{{ containercluster_media_agent_receipt }}'
    owner: root
    group: root
    mode: '0600'
  changed_when: true
