---
# Included by every apply. A replay, whose published image is already this
# request's, builds and publishes nothing, yet still re-applies the mode and
# label of what it serves and fetches it through the listener, so an image an
# earlier executable published is repaired and proved rather than replayed.

# The installer consumes its inputs into its own asset state, so a build always
# starts from the frozen bytes rather than from what a previous one left. The
# apply refused before this when the cluster's installation marked the area.
- name: Build the image from the frozen inputs
  when: not (containercluster_media_agent_published | bool)
  vars:
    # Once the build budget is spent, timeout sends the installer SIGTERM, and
    # SIGKILL to its process group this many seconds later if it is still
    # running.
    containercluster_media_agent_kill_grace: 30
    # How a build its budget stopped exits: 124 is timeout's own status once it
    # sent SIGTERM, and a kill after the grace reaches timeout's own process
    # group too, which a shell reports as 137 (128 + 9) and the command module,
    # reading the process's return code, as -9.
    containercluster_media_agent_budget_spent_codes: [124, 137, -9]
  block:
    - name: Discard the installer work area a previous build left
      ansible.builtin.file:
        path: '{{ containercluster_media_agent_work }}'
        state: absent
      changed_when: false

    - name: Create the work area this cluster's installer keeps its state in
      ansible.builtin.file:
        path: '{{ containercluster_media_agent_work }}'
        state: directory
        owner: root
        group: root
        mode: '0700'
      changed_when: false

    # The bound material reaches the installer inputs here and nowhere else: the
    # frozen request carries the declarations, never their values. The filter
    # quotes every string, because the installer's YAML reader would read a
    # plain cluster name 1e3 or y as 1000 or true.
    # Each additional trust bundle is bound as trustBundle<index>, in the order
    # the cluster selects them, and the installer takes them as one PEM bundle.
    # Each is trimmed, because the installer refuses a bundle that holds
    # anything after its last certificate, a blank line included.
    - name: Write the install configuration with its bound material
      vars:
        containercluster_media_agent_trust_bundles: >-
          {{ range(bootwright_cluster_media_request.trustBundleRefs | default([]) | length)
             | map('string') | map('regex_replace', '^', 'trustBundle')
             | map('extract', bootwright_cluster_media_material) | list }}
        # Ansible's templating keeps '\n' in a Jinja string literal as a
        # backslash and an n, so the line break the bundles are joined with is
        # spelled here.
        containercluster_media_agent_line_break: "\n"
      ansible.builtin.copy:
        content: >-
          {{ bootwright_cluster_media_request.installConfig
             | combine({
                 'pullSecret': lookup('ansible.builtin.file', bootwright_cluster_media_material.pullSecret)
                   | bootwright.core.registry_pull_secret(
                     bootwright_cluster_media_request.registryMirror | default({}),
                     lookup('ansible.builtin.file', bootwright_cluster_media_material.mirrorUsername)
                       if bootwright_cluster_media_material.mirrorUsername is defined else
                     lookup('ansible.builtin.file', bootwright_cluster_media_material.mirrorAuth)
                       if bootwright_cluster_media_material.mirrorAuth is defined else '',
                     lookup('ansible.builtin.file', bootwright_cluster_media_material.mirrorPassword, rstrip=false)
                       if bootwright_cluster_media_material.mirrorPassword is defined else ''),
                 'sshKey': bootwright_cluster_media_material.sshKey,
               })
             | combine({
                 'additionalTrustBundle': query('ansible.builtin.file', *containercluster_media_agent_trust_bundles)
                                          | map('trim') | join(containercluster_media_agent_line_break),
               } if containercluster_media_agent_trust_bundles | length > 0 else {})
             | bootwright.core.installer_proxy_credentials(
                 bootwright_cluster_media_request.installProxy | default({}),
                 lookup('ansible.builtin.file', bootwright_cluster_media_material.proxyUsername, rstrip=false)
                   if bootwright_cluster_media_material.proxyUsername is defined else '',
                 lookup('ansible.builtin.file', bootwright_cluster_media_material.proxyPassword, rstrip=false)
                   if bootwright_cluster_media_material.proxyPassword is defined else '')
             | bootwright.core.to_installer_yaml }}
        dest: '{{ containercluster_media_agent_work }}/install-config.yaml'
        owner: root
        group: root
        mode: '0600'
      changed_when: true
      no_log: true
      diff: false

    # The installer's YAML reader retypes a plain scalar and refuses JSON's
    # surrogate-pair escapes, and this filter writes neither.
    - name: Write the agent configuration
      ansible.builtin.copy:
        content: '{{ bootwright_cluster_media_request.agentConfig | bootwright.core.to_installer_yaml }}'
        dest: '{{ containercluster_media_agent_work }}/agent-config.yaml'
        owner: root
        group: root
        mode: '0600'
      changed_when: true

    - name: Create the install-time manifest directory
      ansible.builtin.file:
        path: '{{ containercluster_media_agent_work }}/openshift'
        state: directory
        owner: root
        group: root
        mode: '0700'
      when: bootwright_cluster_media_request.manifests | length > 0
      changed_when: false

    - name: Write the frozen install-time manifests
      ansible.builtin.copy:
        content: '{{ item.content | bootwright.core.to_installer_yaml }}'
        dest: '{{ containercluster_media_agent_work }}/openshift/{{ item.file }}'
        owner: root
        group: root
        mode: '0600'
      loop: '{{ bootwright_cluster_media_request.manifests }}'
      no_log: true
      changed_when: true

    - name: Read the start of the shared media build budget
      ansible.builtin.set_fact:
        containercluster_media_agent_started: >-
          {{ ((now(utc=true) - ('1970-01-01 00:00:00' | to_datetime)).total_seconds() | int) }}

    - name: Generate native cluster manifests for encrypted installation
      ansible.builtin.command:
        argv:
          - /usr/bin/timeout
          - --kill-after={{ containercluster_media_agent_kill_grace | int }}s
          - '{{ bootwright_cluster_media_request.budgets.buildSeconds | int }}s'
          - '{{ containercluster_media_agent_installer }}'
          - agent
          - create
          - cluster-manifests
          - --dir
          - '{{ containercluster_media_agent_work }}'
      environment: '{{ bootwright_cluster_media_request.buildEgress | default({}) }}'
      when: bootwright_cluster_media_request.diskEncryption is defined
      changed_when: true
      no_log: true

    - name: Set disk encryption in the generated AgentClusterInstall
      ansible.builtin.copy:
        content: >-
          {{ lookup('ansible.builtin.file', containercluster_media_agent_work ~ '/cluster-manifests/agent-cluster-install.yaml')
             | from_yaml
             | bootwright.core.agent_disk_encryption(bootwright_cluster_media_request.diskEncryption,
                 bootwright_cluster_media_request.identity.cluster)
             | bootwright.core.to_installer_yaml }}
        dest: '{{ containercluster_media_agent_work }}/cluster-manifests/agent-cluster-install.yaml'
        owner: root
        group: root
        mode: '0600'
      when: bootwright_cluster_media_request.diskEncryption is defined
      changed_when: true
      no_log: true
      diff: false

    - name: Read the time left after native manifest generation
      ansible.builtin.set_fact:
        containercluster_media_agent_build_now: >-
          {{ ((now(utc=true) - ('1970-01-01 00:00:00' | to_datetime)).total_seconds() | int) }}

    - name: Freeze the remaining shared build budget
      ansible.builtin.set_fact:
        containercluster_media_agent_build_remaining: >-
          {{ (bootwright_cluster_media_request.budgets.buildSeconds | int)
             - (containercluster_media_agent_build_now | int)
             + (containercluster_media_agent_started | int) }}

    - name: Refuse an exhausted media build budget before image creation
      ansible.builtin.assert:
        that:
          - containercluster_media_agent_build_remaining | int > 0
        fail_msg: native manifest generation exhausted the shared media build budget
        quiet: true

    # The build runs under timeout with the budget the request froze, so it
    # returns within that budget and one kill-after grace. Any other failure
    # is the installer's own and fails here as before.
    - name: Build the image this cluster's nodes boot
      ansible.builtin.command:
        argv:
          - /usr/bin/timeout
          - --kill-after={{ containercluster_media_agent_kill_grace | int }}s
          - '{{ containercluster_media_agent_build_remaining | int }}s'
          - '{{ containercluster_media_agent_installer }}'
          - agent
          - create
          - image
          - --dir
          - '{{ containercluster_media_agent_work }}'
          - --log-level
          - info
      environment: '{{ bootwright_cluster_media_request.buildEgress | default({}) }}'
      no_log: true
      register: containercluster_media_agent_built
      changed_when: true
      failed_when:
        - containercluster_media_agent_built.rc != 0
        - containercluster_media_agent_built.rc not in containercluster_media_agent_budget_spent_codes

    - name: Refuse a build its budget stopped
      ansible.builtin.fail:
        msg: >-
          the installer was still building the boot image of cluster
          {{ bootwright_cluster_media_request.identity.cluster }} when its build
          budget of {{ bootwright_cluster_media_request.budgets.buildSeconds }}
          seconds was spent, so timeout stopped it: the installer did not fail
          on its own. Nothing was published, and a repeated apply discards the
          work area and builds the image again.
      when: containercluster_media_agent_built.rc in containercluster_media_agent_budget_spent_codes

    - name: Find the image the installer produced
      ansible.builtin.find:
        paths: '{{ containercluster_media_agent_work }}'
        patterns: 'agent.*.iso'
        file_type: file
      register: containercluster_media_agent_products

    - name: Refuse a build that produced no single image
      ansible.builtin.assert:
        that:
          - containercluster_media_agent_products.files | length == 1
        fail_msg: the installer produced no single agent image for this cluster
        quiet: true

- name: Publish fetched media through its private listener
  ansible.builtin.include_tasks: publish.yml
  when: bootwright_cluster_media_request.deliveryKind == 'fetch'

- name: Keep pushed media in the controller work area
  ansible.builtin.include_tasks: stage_push.yml
  when: bootwright_cluster_media_request.deliveryKind == 'push'

- name: Record what this image was built from
  ansible.builtin.copy:
    content: >-
      {{ {'inputs': bootwright_cluster_media_digest,
          'incarnation': bootwright_cluster_media_material.incarnation,
          'installer': bootwright_cluster_media_request.release.version,
          'flow': 'cluster-manifests-image' if bootwright_cluster_media_request.diskEncryption is defined else 'image'} | to_json }}
    dest: '{{ containercluster_media_agent_receipt }}'
    owner: root
    group: root
    mode: '0600'
  when: not (containercluster_media_agent_published | bool)
  changed_when: true
