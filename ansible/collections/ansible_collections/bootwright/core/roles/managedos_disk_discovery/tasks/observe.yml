---
- name: Validate the frozen disk discovery request
  ansible.builtin.assert:
    that:
      - bootwright_disk_discovery_request.version == 'os-disk-discovery-v1'
    quiet: true

- name: Complete the disk discovery execution handoff
  bootwright.core.managedos_disk_discovery_protocol:
    phase: loaded
  no_log: true

- name: Reach the frozen disk discovery operation
  bootwright.core.disk_discovery:
    operation: observe
    request: '{{ bootwright_disk_discovery_request }}'
    digest: '{{ bootwright_disk_discovery_digest }}'
    material: '{{ bootwright_disk_discovery_material }}'
  register: managedos_disk_discovery_result
  failed_when: false
  no_log: true

- name: Validate the bounded discovery result
  ansible.builtin.include_tasks: result.yml

- name: Publish bounded disk inventory and cleanup evidence
  bootwright.core.managedos_disk_discovery_protocol:
    phase: completed
    digest: '{{ bootwright_disk_discovery_digest }}'
    evidence: '{{ managedos_disk_discovery_result.evidence }}'
    observed: true
    outcome: changed
  no_log: true
