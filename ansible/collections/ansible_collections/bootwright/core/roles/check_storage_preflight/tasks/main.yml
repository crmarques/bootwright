---
- name: Resolve storage nodes on this host
  ansible.builtin.set_fact:
    bootwright_host_storage_nodes: >-
      {{
        bootwright_storage_clusters | default([])
        | map(attribute='hosts') | flatten
        | selectattr('inventoryHost', 'defined')
        | selectattr('inventoryHost', 'equalto', bootwright_host_name)
        | list
      }}
  changed_when: false

- name: Assert storage node hostname matches the declared topology
  ansible.builtin.assert:
    that:
      - ansible_facts['hostname'] == item.hostname or ansible_facts['nodename'] == item.hostname
    fail_msg: >-
      Storage node {{ bootwright_host_name }} reports hostname
      {{ ansible_facts['nodename'] }} but the declared topology hostname
      is {{ item.hostname }}; cephadm registers hosts under their real OS
      hostname, so set the machine's hostname or author
      spec.ceph.topology.hosts[].hostname to match.
  loop: "{{ bootwright_host_storage_nodes }}"
  loop_control:
    label: "{{ item.hostname }}"
  when: bootwright_host_storage_nodes | length > 0

- name: Assert storage nodes run Red Hat family Linux
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] == 'RedHat'
    fail_msg: "Storage node {{ bootwright_host_name }} must already run RHEL or a Red Hat family OS before managed Ceph apply."
  when: bootwright_host_storage_nodes | length > 0

- name: Check storage node systemd
  ansible.builtin.command:
    argv:
      - systemctl
      - --version
  register: bootwright_preflight_storage_systemd
  changed_when: false
  when: bootwright_host_storage_nodes | length > 0

- name: Check storage package repositories
  ansible.builtin.command:
    argv:
      - sh
      - -c
      - "dnf -q repolist || yum -q repolist"
  register: bootwright_preflight_storage_repos
  changed_when: false
  when: bootwright_host_storage_nodes | length > 0

- name: Check storage container state path
  ansible.builtin.stat:
    path: /var/lib/containers
  register: bootwright_preflight_storage_containers
  when: bootwright_host_storage_nodes | length > 0

- name: Check storage container filesystem free space
  ansible.builtin.command:
    argv:
      - df
      - -Pk
      - "{{ '/var/lib/containers' if bootwright_preflight_storage_containers.stat.exists | default(false) else '/var/lib' }}"
  register: bootwright_preflight_storage_container_df
  changed_when: false
  become: true
  when: bootwright_host_storage_nodes | length > 0

- name: Assert storage container filesystem free space
  ansible.builtin.assert:
    that:
      - (bootwright_preflight_storage_container_df.stdout_lines[-1].split()[3] | int) >= 10485760
    fail_msg: "Storage node {{ bootwright_host_name }} needs at least 10 GiB free for /var/lib/containers or /var/lib."
  when: bootwright_host_storage_nodes | length > 0

- name: Read Bootwright OSD device ownership marker for preflight
  ansible.builtin.slurp:
    src: /etc/bootwright/ceph-osd-devices.json
  register: bootwright_preflight_osd_marker
  become: true
  changed_when: false
  failed_when: false
  when: bootwright_host_storage_nodes | length > 0

- name: Resolve devices recorded as Bootwright OSDs on this host
  ansible.builtin.set_fact:
    bootwright_preflight_owned_osd_devices: >-
      {{ bootwright_preflight_marker_doc.devices | default([])
         if (bootwright_preflight_marker_doc.manager | default('') == 'bootwright'
             and bootwright_preflight_marker_doc.node | default('')
                 in (bootwright_host_storage_nodes | map(attribute='hostname') | list))
         else [] }}
  vars:
    bootwright_preflight_marker_doc: "{{ bootwright_preflight_osd_marker.content | b64decode | from_json }}"
  when: (bootwright_preflight_osd_marker | default({})).content is defined

- name: Probe declared storage OSD devices for signatures
  ansible.builtin.command:
    argv:
      - wipefs
      - --no-act
      - --noheadings
      - "{{ item.1 }}"
  become: true
  register: bootwright_preflight_storage_device
  changed_when: false
  failed_when: false
  loop: "{{ bootwright_host_storage_nodes | subelements('devices', skip_missing=True) }}"
  loop_control:
    label: "{{ item.0.hostname }} {{ item.1 }}"
  when: bootwright_host_storage_nodes | length > 0

- name: Assert declared storage OSD devices are present, empty, or Bootwright-owned
  ansible.builtin.assert:
    that:
      - item.rc == 0
      - (item.stdout | trim | length == 0) or (item.item.1 in (bootwright_preflight_owned_osd_devices | default([])))
    fail_msg: >-
      {{
        ('Declared OSD device ' ~ item.item.1 ~ ' on ' ~ item.item.0.hostname
         ~ ' could not be probed (wipefs rc=' ~ item.rc ~ '): '
         ~ (item.stderr | default('') | trim)
         ~ '. It may not exist on this host or the storage SSH user lacks privilege.')
        if item.rc != 0
        else
        ('Declared OSD device ' ~ item.item.1 ~ ' on ' ~ item.item.0.hostname
         ~ ' carries data signatures (' ~ (item.stdout | trim) ~ ') and is not recorded as a'
         ~ ' Bootwright OSD device, so it holds foreign data. Wipe it, correct the declared'
         ~ ' devices, or destroy the owning cluster before apply.')
      }}
  loop: "{{ bootwright_preflight_storage_device.results | default([]) }}"
  loop_control:
    label: "{{ item.item.0.hostname }} {{ item.item.1 }}"
  when: bootwright_host_storage_nodes | length > 0
