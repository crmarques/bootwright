---
- name: Resolve storage nodes on this host
  ansible.builtin.set_fact:
    bootwright_host_storage_nodes: >-
      {{
        bootwright_storage_clusters | default([])
        | map(attribute='hosts') | flatten
        | selectattr('inventoryHost', 'defined')
        | selectattr('inventoryHost', 'equalto', bootwright_host_name)
        | list
      }}
  changed_when: false

- name: Assert storage node name matches the declared topology
  ansible.builtin.assert:
    that:
      - >-
        ansible_facts['nodename'] == item.cephHostname
        or ansible_facts['hostname'] == item.cephHostname
        or ansible_facts['hostname'] == item.cephHostname.split('.')[0]
    fail_msg: >-
      Storage node {{ bootwright_host_name }} reports hostname
      {{ ansible_facts['nodename'] }} but the name cephadm will register is
      {{ item.cephHostname }}; cephadm registers hosts under their real OS
      hostname, so set the machine's hostname (or, for a provided OS, author
      spec.ceph.topology.nodes[].name) to match {{ item.cephHostname }}.
    quiet: true
  loop: "{{ bootwright_host_storage_nodes }}"
  loop_control:
    label: "{{ item.hostname }}"
  when: bootwright_host_storage_nodes | length > 0

- name: Assert storage nodes run Red Hat family Linux
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] == 'RedHat'
    fail_msg: "Storage node {{ bootwright_host_name }} must already run RHEL or a Red Hat family OS before managed Ceph apply."
  when: bootwright_host_storage_nodes | length > 0

- name: Check storage node systemd
  ansible.builtin.command:
    argv:
      - systemctl
      - --version
  register: bootwright_preflight_storage_systemd
  changed_when: false
  when: bootwright_host_storage_nodes | length > 0

- name: Check storage package repositories
  ansible.builtin.command:
    argv:
      - sh
      - -c
      - "dnf -q repolist || yum -q repolist"
  register: bootwright_preflight_storage_repos
  changed_when: false
  when: bootwright_host_storage_nodes | length > 0

- name: Check storage container state path
  ansible.builtin.stat:
    path: /var/lib/containers
  register: bootwright_preflight_storage_containers
  when: bootwright_host_storage_nodes | length > 0

- name: Check storage container filesystem free space
  ansible.builtin.command:
    argv:
      - df
      - -Pk
      - "{{ '/var/lib/containers' if bootwright_preflight_storage_containers.stat.exists | default(false) else '/var/lib' }}"
  register: bootwright_preflight_storage_container_df
  changed_when: false
  become: true
  when: bootwright_host_storage_nodes | length > 0

- name: Resolve the storage state filesystem budget for this host
  ansible.builtin.set_fact:
    bootwright_preflight_storage_free_gib: >-
      {{ ((bootwright_preflight_storage_container_df.stdout_lines[-1].split()[3] | int) / 1048576) | round(1) }}
    bootwright_preflight_storage_required_gib: >-
      {{ bootwright_host_storage_nodes | map(attribute='rootFSGiB', default=20) | list | max }}
  changed_when: false
  when: bootwright_host_storage_nodes | length > 0

- name: Assert storage state filesystem clears the absolute floor
  ansible.builtin.assert:
    that:
      - (bootwright_preflight_storage_container_df.stdout_lines[-1].split()[3] | int) >= 20971520
    fail_msg: >-
      Storage node {{ bootwright_host_name }} has only
      {{ bootwright_preflight_storage_free_gib }} GiB free on the filesystem holding
      /var/lib/ceph and /var/lib/containers, below the 20 GiB floor a cephadm node
      needs for container images, the cephadm data directory, the crash spool and the
      systemd journal. Enlarge the node's root filesystem (spec.machineOSInstall
      kickstart storage.rootDisk selects the disk it grows into) before apply.
  when: bootwright_host_storage_nodes | length > 0

- name: Warn when the storage state filesystem is below the per-node budget
  ansible.builtin.debug:
    msg: >-
      Storage node {{ bootwright_host_name }} has
      {{ bootwright_preflight_storage_free_gib }} GiB free on the filesystem holding
      /var/lib/ceph, below the {{ bootwright_preflight_storage_required_gib }} GiB this
      node's declared roles need at steady state (mon RocksDB, the Prometheus TSDB,
      Grafana, Alertmanager and Loki all land there). The cluster will install, but the
      filesystem is expected to run short and Ceph's CephNodeDiskspaceWarning alert will
      fire on the trailing fill rate. Enlarge the root filesystem, move roles off this
      node, or lower spec.ceph.monitoring.prometheus.retentionSize.
  when:
    - bootwright_host_storage_nodes | length > 0
    - (bootwright_preflight_storage_free_gib | float)
      < (bootwright_preflight_storage_required_gib | float)

- name: Read Bootwright OSD device ownership marker for preflight
  ansible.builtin.slurp:
    src: /etc/bootwright/ceph-osd-devices.json
  register: bootwright_preflight_osd_marker
  become: true
  changed_when: false
  failed_when: false
  when: bootwright_host_storage_nodes | length > 0

- name: Resolve devices recorded as Bootwright OSDs on this host
  ansible.builtin.set_fact:
    bootwright_preflight_owned_osd_devices: >-
      {{ bootwright_preflight_marker_doc.devices | default([])
         if (bootwright_preflight_marker_doc.manager | default('') == 'bootwright'
             and bootwright_preflight_marker_doc.node | default('')
                 in (bootwright_host_storage_nodes | map(attribute='hostname') | list))
         else [] }}
  vars:
    bootwright_preflight_marker_doc: "{{ bootwright_preflight_osd_marker.content | b64decode | from_json }}"
  when: (bootwright_preflight_osd_marker | default({})).content is defined

- name: Probe declared storage OSD devices for signatures
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -uo pipefail
      devices=({{ bootwright_preflight_storage_devices | map('quote') | join(' ') }})
      errors="$(mktemp)"
      report="$(mktemp)"
      trap 'rm -f "$errors" "$report"' EXIT
      cat >"$report" <<'BOOTWRIGHT_REPORT'
      import json
      import sys

      print(json.dumps({
          "device": sys.argv[1],
          "rc": int(sys.argv[2]),
          "signatures": sys.argv[3].strip(),
          "stderr": sys.argv[4].strip(),
      }))
      BOOTWRIGHT_REPORT
      for device in "${devices[@]}"; do
        signatures="$(wipefs --no-act --noheadings "$device" 2>"$errors")"
        rc=$?
        python3 "$report" "$device" "$rc" "$signatures" "$(cat "$errors")"
      done
  vars:
    bootwright_preflight_storage_devices: >-
      {{ bootwright_host_storage_nodes | map(attribute='devices', default=[]) | flatten | unique | list }}
  become: true
  register: bootwright_preflight_storage_device_sweep
  changed_when: false
  failed_when: false
  when:
    - bootwright_host_storage_nodes | length > 0
    - bootwright_preflight_storage_devices | length > 0

- name: Classify the declared storage OSD device probes
  ansible.builtin.set_fact:
    bootwright_preflight_storage_device_probes: >-
      {{
        (bootwright_preflight_storage_device_sweep.stdout_lines | default([]))
        | map('trim') | reject('equalto', '')
        | map('from_json') | list
      }}
  changed_when: false
  when: bootwright_host_storage_nodes | length > 0

- name: Resolve declared storage OSD devices that could not be probed
  ansible.builtin.set_fact:
    bootwright_preflight_unprobeable_probes: >-
      {{
        bootwright_preflight_storage_device_probes | default([])
        | rejectattr('rc', 'equalto', 0) | list
      }}
  changed_when: false
  when: bootwright_host_storage_nodes | length > 0

- name: Refuse declared storage OSD devices that could not be probed
  ansible.builtin.assert:
    that:
      - (bootwright_preflight_unprobeable_probes | default([])) | length == 0
    fail_msg: >-
      Declared OSD device(s)
      {{ bootwright_preflight_unprobeable_probes | default([]) | map(attribute='device') | list | join(', ') }}
      on {{ bootwright_host_name }} could not be probed with wipefs:
      {{
        bootwright_preflight_unprobeable_probes | default([])
        | map(attribute='stderr') | list | join('; ')
      }}
      (exit status
      {{ bootwright_preflight_unprobeable_probes | default([]) | map(attribute='rc') | list | join(', ') }}).
      They may not exist on this host or the storage SSH user lacks privilege.
      Failing closed rather than treat an unprobeable device as clean.
    quiet: true
  when: bootwright_host_storage_nodes | length > 0

- name: Assert declared storage OSD devices are empty or Bootwright-owned
  ansible.builtin.assert:
    that:
      - >-
        ((item.signatures | default('') | trim | length) == 0)
        or (item.device in (bootwright_preflight_owned_osd_devices | default([])))
    fail_msg: >-
      Declared OSD device {{ item.device }} on {{ bootwright_host_name }} carries data
      signatures ({{ item.signatures | default('') | trim }}) and is not recorded as a
      Bootwright OSD device, so it holds foreign data. Wipe it, correct the declared
      devices, or destroy the owning cluster before apply.
    quiet: true
  loop: "{{ bootwright_preflight_storage_device_probes | default([]) }}"
  loop_control:
    label: "{{ item.device }}"
  when: bootwright_host_storage_nodes | length > 0
