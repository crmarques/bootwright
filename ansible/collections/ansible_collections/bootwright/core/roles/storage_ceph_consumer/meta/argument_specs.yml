argument_specs:
  apply:
    short_description: Realize one managed Ceph export.
    options: &request
      bootwright_ceph_export_request:
        type: dict
        required: true
        options:
          cluster:
            type: str
            required: true
          controller:
            type: str
            required: true
          defaultDataPool:
            type: str
            required: true
          filesystem:
            type: str
            required: true
          gateway:
            type: dict
          keyType:
            type: str
            required: true
          machines:
            type: list
            elements: str
            required: true
          monitoringHosts:
            type: list
            elements: str
            required: true
          monitoringPort:
            type: int
            required: true
          monitors:
            type: dict
            required: true
          name:
            type: str
            required: true
          physicalHosts:
            type: bool
            required: true
          pool:
            type: str
            required: true
          principals:
            type: dict
            required: true
          scope:
            type: dict
          version:
            type: str
            required: true
            choices: [ceph-export-request-v3]
      bootwright_ceph_export_digest:
        type: str
        required: true
      bootwright_ceph_export_material:
        type: dict
        required: true
      bootwright_ceph_export_outputs:
        type: dict
        required: true

  observe:
    short_description: Observe one managed Ceph export without mutation.
    options: *request
