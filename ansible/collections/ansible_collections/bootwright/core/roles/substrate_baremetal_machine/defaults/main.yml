---
# Derived from the frozen request only. Nothing here is authored by desired
# state, and no value selects an executable, a role or a task file.
#
# The addresses this machine must report for it to be the one the declaration
# names. The proof compares the complete reported inventory against these.
substrate_baremetal_machine_expected: >-
  {{ bootwright_substrate_physical_request.hardware | map(attribute='macAddress') | list }}

# The controller's trust bundle as PEM, the one anchor its transport is
# verified against, or empty when the controller declares none and the system
# trust store anchors it. Only the lifecycle entry points read this; each port
# entry point reads the path its consumer passes.
substrate_baremetal_machine_ca_data: >-
  {{ lookup('ansible.builtin.file', bootwright_substrate_physical_material.controllerCA)
     if bootwright_substrate_physical_material.controllerCA | default('') | length > 0 else '' }}

# How long an identity read waits for a machine that has not answered yet.
# Zero is one attempt: only an installation waiting for a machine it just
# booted sets a budget.
substrate_baremetal_machine_identity_address: "{{ bootwright_machine_identity.address }}"
substrate_baremetal_machine_identity_user: "{{ bootwright_machine_identity.user }}"
substrate_baremetal_machine_identity_file: "{{ bootwright_machine_identity.file }}"
substrate_baremetal_machine_identity_key: "{{ bootwright_machine_identity.key }}"
substrate_baremetal_machine_identity_marker_path: "{{ bootwright_machine_identity.marker_path }}"
substrate_baremetal_machine_identity_work: "{{ bootwright_machine_identity.work }}"
substrate_baremetal_machine_identity_retries: "{{ bootwright_machine_identity.retries | default(0) }}"
substrate_baremetal_machine_identity_delay: "{{ bootwright_machine_identity.delay | default(0) }}"

# Generic machine-port inputs; the native task implementation owns its aliases.
substrate_baremetal_machine_target_endpoint: "{{ bootwright_machine_port.endpoint }}"
substrate_baremetal_machine_target_ca: "{{ bootwright_machine_port.ca }}"
substrate_baremetal_machine_target_user: "{{ bootwright_machine_port.user }}"
substrate_baremetal_machine_target_password: "{{ bootwright_machine_port.password }}"
substrate_baremetal_machine_target_verify: "{{ bootwright_machine_port.verify }}"
substrate_baremetal_machine_target_expected: "{{ bootwright_machine_port.expected | default([]) }}"
substrate_baremetal_machine_target_pinned_uuid_base64: "{{ bootwright_machine_port.pinned_uuid_base64 | default('') }}"
substrate_baremetal_machine_target_pinned_serial_base64: "{{ bootwright_machine_port.pinned_serial_base64 | default('') }}"
substrate_baremetal_machine_target_require_tpm: "{{ bootwright_machine_port.require_tpm | default(false) }}"
substrate_baremetal_machine_target_firmware: "{{ bootwright_machine_port.firmware | default({}) }}"

substrate_baremetal_machine_boot_endpoint: "{{ bootwright_machine_port.endpoint }}"
substrate_baremetal_machine_boot_ca: "{{ bootwright_machine_port.ca }}"
substrate_baremetal_machine_boot_user: "{{ bootwright_machine_port.user }}"
substrate_baremetal_machine_boot_password: "{{ bootwright_machine_port.password }}"
substrate_baremetal_machine_boot_verify: "{{ bootwright_machine_port.verify }}"
substrate_baremetal_machine_boot_installer_powers_off: "{{ bootwright_machine_port.installer_powers_off }}"

substrate_baremetal_machine_disk_endpoint: "{{ bootwright_machine_port.endpoint }}"
substrate_baremetal_machine_disk_ca: "{{ bootwright_machine_port.ca }}"
substrate_baremetal_machine_disk_user: "{{ bootwright_machine_port.user }}"
substrate_baremetal_machine_disk_password: "{{ bootwright_machine_port.password }}"
substrate_baremetal_machine_disk_verify: "{{ bootwright_machine_port.verify }}"
substrate_baremetal_machine_disk_power_on: "{{ bootwright_machine_port.power_on }}"
