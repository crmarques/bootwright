argument_specs:
  apply:
    short_description: Claim one physical machine and prove it is the declared one.
    options: &request
      bootwright_substrate_physical_request:
        type: dict
        required: true
        options:
          controller:
            type: dict
            required: true
            options:
              credentialsRef:
                type: str
                required: true
              endpoint:
                type: str
                required: true
              tlsVerify:
                type: bool
                required: true
          hardware:
            type: list
            elements: dict
            required: true
          identity:
            type: dict
            required: true
          placement:
            type: dict
            required: true
          provider:
            type: str
            required: true
          version:
            type: str
            required: true
            choices: [machine-baremetal-v1]
      bootwright_substrate_physical_material:
        type: dict
        required: true

  observe:
    short_description: Observe one physical machine without changing it.
    options: *request

  destroy:
    short_description: Release the claim on one physical machine and retain it.
    options: *request

  # The machine port other domains compose, each entry point included by
  # exactly this key. ansible-core validates these inputs before the entry
  # point's first task. That validation is not hidden from output and echoes a
  # value it refuses, so a credential is passed as the path of its material
  # file, never as its bytes, and no required input has a role default that
  # could stand in for one a consumer forgot.
  pre_boot:
    short_description: Prove the exact physical machine is off before media is inserted.
    options:
      substrate_baremetal_machine_target_endpoint:
        type: str
        required: true
      substrate_baremetal_machine_target_verify:
        type: bool
        required: true
      substrate_baremetal_machine_target_user:
        type: str
        required: true
      substrate_baremetal_machine_target_password:
        type: str
        required: true
      substrate_baremetal_machine_target_expected:
        type: list
        elements: str
        required: true
      # The identity this operation proved, base64-encoded; empty when it
      # pinned none.
      substrate_baremetal_machine_target_pinned_uuid_base64:
        type: str
        required: true
      substrate_baremetal_machine_target_pinned_serial_base64:
        type: str
        required: true

  boot_media:
    short_description: Boot an operator-owned machine once from the media inserted in its controller.
    options:
      substrate_baremetal_machine_boot_endpoint:
        type: str
        required: true
      substrate_baremetal_machine_boot_verify:
        type: bool
        required: true
      substrate_baremetal_machine_boot_user:
        type: str
        required: true
      substrate_baremetal_machine_boot_password:
        type: str
        required: true

  boot_disk:
    short_description: Point an operator-owned machine at its installed disk.
    options:
      substrate_baremetal_machine_disk_endpoint:
        type: str
        required: true
      substrate_baremetal_machine_disk_verify:
        type: bool
        required: true
      substrate_baremetal_machine_disk_user:
        type: str
        required: true
      substrate_baremetal_machine_disk_password:
        type: str
        required: true
      substrate_baremetal_machine_disk_power_on:
        type: bool
        required: true

  identity_read:
    short_description: Read the install marker over SSH pinned to the host key this installation delivered.
    options:
      substrate_baremetal_machine_identity_address:
        type: str
        required: true
      substrate_baremetal_machine_identity_user:
        type: str
        required: true
      substrate_baremetal_machine_identity_file:
        type: str
        required: true
      substrate_baremetal_machine_identity_key:
        type: str
        required: true
      substrate_baremetal_machine_identity_marker_path:
        type: str
        required: true
      substrate_baremetal_machine_identity_work:
        type: str
        required: true
      substrate_baremetal_machine_identity_retries:
        type: int
      substrate_baremetal_machine_identity_delay:
        type: int
