argument_specs:
  apply:
    short_description: Claim one physical machine and prove it is the declared one.
    options: &request
      bootwright_substrate_physical_request:
        type: dict
        required: true
        options:
          controller:
            type: dict
            required: true
            options:
              credentialsRef:
                type: str
                required: true
              endpoint:
                type: str
                required: true
              tlsVerify:
                type: bool
                required: true
              trustBundleRef:
                type: str
                required: false
          hardware:
            type: list
            elements: dict
            required: true
          identity:
            type: dict
            required: true
          placement:
            type: dict
            required: true
          provider:
            type: str
            required: true
          version:
            type: str
            required: true
            choices: [machine-baremetal-v2]
      bootwright_substrate_physical_material:
        type: dict
        required: true

  observe:
    short_description: Observe one physical machine without changing it.
    options: *request

  destroy:
    short_description: Release the claim on one physical machine and retain it.
    options: *request

  # The machine port other domains compose, each entry point included by
  # exactly this key. ansible-core validates these inputs before the entry
  # point's first task. That validation is not hidden from output and echoes a
  # value it refuses, so a credential is passed as the path of its material
  # file, never as its bytes, and no required input has a role default that
  # could stand in for one a consumer forgot.
  pre_boot:
    short_description: Prove the exact physical machine is off before media is inserted.
    options:
      bootwright_machine_port:
        type: dict
        options:
          endpoint:
            type: str
            required: true
          ca:
            type: path
            required: true
          user:
            type: path
            required: true
          password:
            type: path
            required: true
          verify:
            type: bool
            required: true
          expected:
            type: list
            elements: str
          pinned_uuid_base64:
            type: str
          pinned_serial_base64:
            type: str
          require_tpm:
            type: bool
          # The Machine's frozen firmware declaration, handed to the firmware
          # step whole; empty when it declares none.
          firmware:
            type: dict
      substrate_baremetal_machine_target_require_tpm:
        type: bool
      substrate_baremetal_machine_target_firmware:
        type: dict
      substrate_baremetal_machine_target_endpoint:
        type: str
        required: true
      substrate_baremetal_machine_target_verify:
        type: bool
        required: true
      substrate_baremetal_machine_target_user:
        type: str
        required: true
      substrate_baremetal_machine_target_password:
        type: str
        required: true
      # The path of the controller's trust bundle material, or empty when the
      # controller declares none.
      substrate_baremetal_machine_target_ca:
        type: str
        required: true
      substrate_baremetal_machine_target_expected:
        type: list
        elements: str
        required: true
      # The identity this operation proved, base64-encoded; empty when it
      # pinned none.
      substrate_baremetal_machine_target_pinned_uuid_base64:
        type: str
        required: true
      substrate_baremetal_machine_target_pinned_serial_base64:
        type: str
        required: true

  boot_media:
    short_description: Boot an operator-owned machine once from the media inserted in its controller.
    options:
      bootwright_machine_port:
        type: dict
        options:
          endpoint:
            type: str
            required: true
          ca:
            type: path
            required: true
          user:
            type: path
            required: true
          password:
            type: path
            required: true
          verify:
            type: bool
            required: true
          installer_powers_off:
            type: bool
            required: true
      substrate_baremetal_machine_boot_endpoint:
        type: str
        required: true
      substrate_baremetal_machine_boot_verify:
        type: bool
        required: true
      substrate_baremetal_machine_boot_user:
        type: str
        required: true
      substrate_baremetal_machine_boot_password:
        type: str
        required: true
      # The path of the controller's trust bundle material, or empty when the
      # controller declares none.
      substrate_baremetal_machine_boot_ca:
        type: str
        required: true

  boot_disk:
    short_description: Point an operator-owned machine at its installed disk.
    options:
      bootwright_machine_port:
        type: dict
        options:
          endpoint:
            type: str
            required: true
          ca:
            type: path
            required: true
          user:
            type: path
            required: true
          password:
            type: path
            required: true
          verify:
            type: bool
            required: true
          power_on:
            type: bool
            required: true
      substrate_baremetal_machine_disk_endpoint:
        type: str
        required: true
      substrate_baremetal_machine_disk_verify:
        type: bool
        required: true
      substrate_baremetal_machine_disk_user:
        type: str
        required: true
      substrate_baremetal_machine_disk_password:
        type: str
        required: true
      # The path of the controller's trust bundle material, or empty when the
      # controller declares none.
      substrate_baremetal_machine_disk_ca:
        type: str
        required: true
      substrate_baremetal_machine_disk_power_on:
        type: bool
        required: true

  identity_read:
    short_description: Read the install marker over SSH pinned to the host key this installation delivered.
    options:
      bootwright_machine_identity:
        type: dict
      substrate_baremetal_machine_identity_address:
        type: str
        required: true
      substrate_baremetal_machine_identity_user:
        type: str
        required: true
      substrate_baremetal_machine_identity_file:
        type: str
        required: true
      substrate_baremetal_machine_identity_key:
        type: str
        required: true
      substrate_baremetal_machine_identity_marker_path:
        type: str
        required: true
      substrate_baremetal_machine_identity_work:
        type: str
        required: true
      substrate_baremetal_machine_identity_retries:
        type: int
      substrate_baremetal_machine_identity_delay:
        type: int

  state_read:
    short_description: Execute the bounded machine state read port.
    options:
      bootwright_machine_port:
        type: dict
        required: true
        options:
          endpoint:
            type: str
            required: true
          user:
            type: path
            required: true
          password:
            type: path
            required: true
          ca:
            type: path
          verify:
            type: bool
            required: true
          media_identity:
            type: str
          media:
            type: bool
          image_url_file:
            type: path
          retries:
            type: int
          delay:
            type: int
          inspect:
            type: bool
          expected_power:
            type: str
            choices: ['On', 'Off']

  media_insert:
    short_description: Execute the bounded machine media insert port.
    options:
      bootwright_machine_port:
        type: dict
        required: true
        options:
          endpoint:
            type: str
            required: true
          user:
            type: path
            required: true
          password:
            type: path
            required: true
          ca:
            type: path
          verify:
            type: bool
            required: true
          media_identity:
            type: str
          image_url_file:
            type: path
            required: true
          image_path:
            type: path
          private:
            type: bool
            required: true
          trust:
            type: str
            required: true
            choices: [established, importCertificate, disableVerification]
          certificate:
            type: path

  media_eject:
    short_description: Execute the bounded machine media eject port.
    options:
      bootwright_machine_port:
        type: dict
        required: true
        options:
          endpoint:
            type: str
            required: true
          user:
            type: path
            required: true
          password:
            type: path
            required: true
          ca:
            type: path
          verify:
            type: bool
            required: true
          media_identity:
            type: str
          restore_verification:
            type: bool
            required: true
          remove_certificate:
            type: bool
            required: true
          certificate:
            type: path

  power:
    short_description: Execute the bounded machine power port.
    options:
      bootwright_machine_port:
        type: dict
        required: true
        options:
          endpoint:
            type: str
            required: true
          user:
            type: path
            required: true
          password:
            type: path
            required: true
          ca:
            type: path
          verify:
            type: bool
            required: true
          media_identity:
            type: str
          power:
            type: str
            required: true
            choices: ['on', 'off', restart]
          force:
            type: bool
          attempts:
            type: int
