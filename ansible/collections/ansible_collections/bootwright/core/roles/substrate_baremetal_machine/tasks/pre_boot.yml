---
# Prove the exact target immediately before destructive media is inserted. The
# controller-side proof this repeats closed when the block that claimed the
# machine completed, and a machine can be re-cabled or re-addressed since, so
# the identity and the complete hardware inventory are read again here.
#
# The result channel is the consumer's, so each check names the refusal it
# makes before it runs, in substrate_baremetal_machine_refusal, which the
# consumer names to its runner when this proof fails, and the proof clears it
# once it holds. A read the controller did not answer names none: its own
# message, printed below, is the refusal.
- name: Clear the refusal an earlier proof named
  ansible.builtin.set_fact:
    substrate_baremetal_machine_refusal: ''

- name: Prove the machine before anything is read or written
  ansible.builtin.include_tasks: target_proof.yml

# A declared firmware block is applied or proved only on a machine proved off.
- name: Apply or prove the firmware settings this Machine declares
  ansible.builtin.include_tasks: firmware.yml
  when: substrate_baremetal_machine_target_firmware | length > 0

# A firmware step that wrote anything powered the machine through setup, so
# the whole proof is made again, and the TPM check below reads that fresh read:
# a declared attribute may be what enables the TPM.
- name: Prove the machine again after its firmware changed
  ansible.builtin.include_tasks: target_proof.yml
  when:
    - substrate_baremetal_machine_target_firmware | length > 0
    - substrate_baremetal_machine_firmware.changed | default(false) | bool

- name: Name the TPM check as the refusal this proof makes
  ansible.builtin.set_fact:
    substrate_baremetal_machine_refusal: tpm-absent
  when: substrate_baremetal_machine_target_require_tpm | default(false)

- name: Require a positively reported enabled TPM 2.0 before encrypted installation
  ansible.builtin.assert:
    that:
      - substrate_baremetal_machine_target.tpm_usable | default(false) | bool
    fail_msg: The controller did not positively report an enabled TPM 2.0; enable it before encrypted installation.
    quiet: true
  when: substrate_baremetal_machine_target_require_tpm | default(false)

- name: Clear the refusal now that the machine is proved
  ansible.builtin.set_fact:
    substrate_baremetal_machine_refusal: ''
