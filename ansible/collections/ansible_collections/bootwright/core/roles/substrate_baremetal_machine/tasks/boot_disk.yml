---
# Point one operator-owned machine at its installed disk, and power it on when
# the consumer asks. A consumer includes this only once the installer has
# proved it ran: the managed OS once the installer powered the machine off, a
# cluster once it reports its installation completed. A controller that reads
# its boot configuration live during POST obeys a disk selection written any
# earlier and boots the old disk instead of the installer
# (.agents/knowledge/redfish-physical-bmc.md). Nothing here powers the machine
# off or shuts it down.
#
# The inputs are this entry point's argument spec, passed explicitly by the
# consuming role and never inherited from a shared fact.
- name: Select the installed disk as the boot device
  bootwright.core.redfish_boot:
    endpoint: '{{ substrate_baremetal_machine_disk_endpoint }}'
    user: '{{ lookup("ansible.builtin.file", substrate_baremetal_machine_disk_user) }}'
    password: '{{ lookup("ansible.builtin.file", substrate_baremetal_machine_disk_password) }}'
    verify: '{{ substrate_baremetal_machine_disk_verify }}'
    ca_data: >-
      {{ lookup('ansible.builtin.file', substrate_baremetal_machine_disk_ca)
         if substrate_baremetal_machine_disk_ca | length > 0 else '' }}
    operation: boot
    target: Hdd
  no_log: true

- name: Power the installed system on and poll it to running
  bootwright.core.redfish_boot:
    endpoint: '{{ substrate_baremetal_machine_disk_endpoint }}'
    user: '{{ lookup("ansible.builtin.file", substrate_baremetal_machine_disk_user) }}'
    password: '{{ lookup("ansible.builtin.file", substrate_baremetal_machine_disk_password) }}'
    verify: '{{ substrate_baremetal_machine_disk_verify }}'
    ca_data: >-
      {{ lookup('ansible.builtin.file', substrate_baremetal_machine_disk_ca)
         if substrate_baremetal_machine_disk_ca | length > 0 else '' }}
    operation: power-on
  no_log: true
  when: substrate_baremetal_machine_disk_power_on | bool
