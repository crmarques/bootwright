---
# This block realizes nothing and writes nothing. A physical server exists
# before Bootwright is told about it, so what an apply does is prove that the
# machine answering at the declared controller is the machine the declaration
# names. Its claim is the operation's reservation, taken when the operation
# registers, so every proving apply, the first included, reports no change.
- name: Validate the frozen machine request
  ansible.builtin.assert:
    that:
      - bootwright_substrate_physical_request.version == 'machine-baremetal-v2'
      - bootwright_substrate_physical_request.controller.endpoint is search('/redfish/v1/Systems/')
      - bootwright_substrate_physical_request.hardware | length > 0
      - bootwright_substrate_physical_digest is match('[0-9a-f]{64}')
    quiet: true
  no_log: true

- name: Complete the qualified execution handoff
  bootwright.core.substrate_physical_protocol:
    phase: loaded
  no_log: true

- name: Report reaching the management controller
  bootwright.core.substrate_physical_protocol:
    phase: group
    group: reach-controller
    status: running
  no_log: true

- name: Read the machine through its own management controller
  bootwright.core.redfish_system_inspect:
    endpoint: '{{ bootwright_substrate_physical_request.controller.endpoint }}'
    user: '{{ lookup("ansible.builtin.file", bootwright_substrate_physical_material.controllerUser) }}'
    password: '{{ lookup("ansible.builtin.file", bootwright_substrate_physical_material.controllerPassword) }}'
    verify: '{{ bootwright_substrate_physical_request.controller.tlsVerify }}'
    ca_data: '{{ substrate_baremetal_machine_ca_data }}'
  register: substrate_baremetal_machine_observed
  failed_when: false
  no_log: true

# ansible-core keeps nothing of a failure under no_log but that it failed, so
# the controller's own refusal is reported here, where no credential is.
- name: Stop at a read the management controller did not answer
  ansible.builtin.assert:
    that:
      - substrate_baremetal_machine_observed.msg is not defined
    fail_msg: >-
      reading Machine {{ bootwright_substrate_physical_request.identity.object }} through the
      management controller at {{ bootwright_substrate_physical_request.controller.endpoint }} failed:
      {{ (substrate_baremetal_machine_observed.msg | default('') | string | bootwright.core.printable)[:512] }}
    quiet: true

- name: Report the controller answered
  bootwright.core.substrate_physical_protocol:
    phase: group
    group: reach-controller
    status: ok
  no_log: true

- name: Report proving the machine's identity
  bootwright.core.substrate_physical_protocol:
    phase: group
    group: prove-identity
    status: running
  no_log: true

- name: Report the proved machine
  bootwright.core.substrate_physical_protocol:
    phase: group
    group: prove-identity
    status: ok
  no_log: true

# The publication reads no bound material, and its refusal names fields, the
# declared NICs the inventory lacks, the positions of members that proved
# nothing and the controller, never a reported value, so it is not censored:
# that refusal is what the attempt's retained output tells the operator.
- name: Publish bounded machine proof
  bootwright.core.substrate_physical_protocol:
    phase: completed
    outcome: unchanged
    digest: '{{ bootwright_substrate_physical_digest }}'
    observation: '{{ substrate_baremetal_machine_observed.observation }}'
    endpoint: '{{ bootwright_substrate_physical_request.controller.endpoint }}'
    expected: '{{ substrate_baremetal_machine_expected }}'
    declared: '{{ bootwright_substrate_physical_request.hardware }}'
