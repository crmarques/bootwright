---
- name: Clear the previous machine port answer
  ansible.builtin.set_fact:
    substrate_baremetal_machine_port_refusal: ''
  no_log: true

- name: Stop the machine before a restart
  bootwright.core.redfish_boot:
    endpoint: '{{ bootwright_machine_port.endpoint }}'
    user: '{{ lookup("ansible.builtin.file", bootwright_machine_port.user) }}'
    password: '{{ lookup("ansible.builtin.file", bootwright_machine_port.password) }}'
    verify: '{{ bootwright_machine_port.verify }}'
    ca_data: >-
      {{ lookup('ansible.builtin.file', bootwright_machine_port.ca)
         if bootwright_machine_port.ca | default('') | length > 0 else '' }}
    operation: >-
      {{ 'power-off' if bootwright_machine_port.force | default(true) else 'shutdown' }}
    attempts: '{{ bootwright_machine_port.attempts | default(60) }}'
  register: substrate_baremetal_machine_port_stopped
  failed_when: false
  no_log: true
  when: bootwright_machine_port.power == 'restart'

- name: Publish a refused restart stop
  ansible.builtin.set_fact:
    substrate_baremetal_machine_port_refusal: '{{ substrate_baremetal_machine_port_stopped.msg | default("") }}'
  no_log: true

- name: Bring the machine to the requested power state
  bootwright.core.redfish_boot:
    endpoint: '{{ bootwright_machine_port.endpoint }}'
    user: '{{ lookup("ansible.builtin.file", bootwright_machine_port.user) }}'
    password: '{{ lookup("ansible.builtin.file", bootwright_machine_port.password) }}'
    verify: '{{ bootwright_machine_port.verify }}'
    ca_data: >-
      {{ lookup('ansible.builtin.file', bootwright_machine_port.ca)
         if bootwright_machine_port.ca | default('') | length > 0 else '' }}
    operation: >-
      {{ 'power-on' if bootwright_machine_port.power in ['on', 'restart'] else
         ('power-off' if bootwright_machine_port.force | default(true) else 'shutdown') }}
    attempts: '{{ bootwright_machine_port.attempts | default(60) }}'
  register: substrate_baremetal_machine_port_result
  failed_when: false
  no_log: true
  when: substrate_baremetal_machine_port_stopped.msg is not defined

- name: Preserve a restart stop refusal without sending a start
  ansible.builtin.set_fact:
    substrate_baremetal_machine_port_result: '{{ substrate_baremetal_machine_port_stopped }}'
  when: substrate_baremetal_machine_port_stopped.msg is defined
  no_log: true

- name: Publish the machine port refusal
  ansible.builtin.set_fact:
    substrate_baremetal_machine_port_refusal: '{{ substrate_baremetal_machine_port_result.msg | default("") }}'
  no_log: true
