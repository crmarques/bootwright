---
# The identity operation for a machine with no out-of-band channel: connect to
# it over SSH pinned to exactly the key this installation delivered. A machine
# presenting any other key is not this installation, and one that does not
# answer has not answered yet; neither is ever read as absence.
#
# The inputs are this entry point's argument spec, passed explicitly by the
# consuming role and never inherited from a shared fact, and the answers are
# published under this role's own names.
- name: Pin the delivered host key for this one connection
  ansible.builtin.copy:
    content: >-
      {{ substrate_baremetal_machine_identity_address }} {{ substrate_baremetal_machine_identity_key }}
    dest: '{{ substrate_baremetal_machine_identity_work }}/known_hosts'
    owner: root
    group: root
    mode: '0600'
  changed_when: false
  no_log: true

# ssh reads this file in place of the system and personal configuration, so no
# ambient known hosts, proxy, control socket, agent or identity reaches the
# connection; only the host crypto policy is kept, and an absent policy file
# is skipped. The keepalives end a connection whose peer stopped answering.
- name: Write the one-connection client configuration
  ansible.builtin.copy:
    content: "Include /etc/crypto-policies/back-ends/openssh.config\n"
    dest: '{{ substrate_baremetal_machine_identity_work }}/ssh_config'
    owner: root
    group: root
    mode: '0600'
  changed_when: false

# The connection negotiates only the pinned key's own algorithms, so a client
# whose policy prefers another type still proves the key it pinned; an rsa key
# is accepted under its SHA-2 signatures, which a FIPS controller permits.
- name: Name the algorithms the delivered key is accepted under
  ansible.builtin.set_fact:
    substrate_baremetal_machine_identity_algorithms: '{{ substrate_baremetal_machine_identity_key | bootwright.core.host_key_algorithms }}'
  changed_when: false

- name: Read the install marker over that pinned connection
  ansible.builtin.command:
    argv:
      - /usr/bin/ssh
      - -F
      - '{{ substrate_baremetal_machine_identity_work }}/ssh_config'
      - -o
      - 'UserKnownHostsFile={{ substrate_baremetal_machine_identity_work }}/known_hosts'
      - -o
      - GlobalKnownHostsFile=none
      - -o
      - KnownHostsCommand=none
      - -o
      - VerifyHostKeyDNS=no
      - -o
      - UpdateHostKeys=no
      - -o
      - CheckHostIP=no
      - -o
      - StrictHostKeyChecking=yes
      - -o
      - 'HostKeyAlgorithms={{ substrate_baremetal_machine_identity_algorithms }}'
      - -o
      - IdentitiesOnly=yes
      - -o
      - IdentityAgent=none
      - -o
      - PasswordAuthentication=no
      - -o
      - KbdInteractiveAuthentication=no
      - -o
      - GSSAPIAuthentication=no
      - -o
      - HostbasedAuthentication=no
      - -o
      - ForwardAgent=no
      - -o
      - ProxyCommand=none
      - -o
      - ProxyJump=none
      - -o
      - ControlMaster=no
      - -o
      - ControlPath=none
      - -o
      - BatchMode=yes
      - -o
      - ConnectTimeout=10
      - -o
      - ServerAliveInterval=15
      - -o
      - ServerAliveCountMax=3
      - -i
      - '{{ substrate_baremetal_machine_identity_file }}'
      - >-
        {{ substrate_baremetal_machine_identity_user }}@{{ substrate_baremetal_machine_identity_address }}
      - /usr/bin/cat
      - '{{ substrate_baremetal_machine_identity_marker_path }}'
  register: substrate_baremetal_machine_marker_read
  retries: '{{ substrate_baremetal_machine_identity_retries | int }}'
  delay: '{{ substrate_baremetal_machine_identity_delay | int }}'
  until: ((substrate_baremetal_machine_marker_read.rc | default(1)) == 0
          and ((substrate_baremetal_machine_marker_read.stdout | default('') | string | trim | length) > 0))
         or ((substrate_baremetal_machine_marker_read.attempts | default(1) | int)
             > (substrate_baremetal_machine_identity_retries | int))
  failed_when: false
  changed_when: false
  no_log: true

- name: Publish what the connection answered
  ansible.builtin.set_fact:
    substrate_baremetal_machine_identity_answered: >-
      {{ substrate_baremetal_machine_marker_read.rc == 0 }}
    substrate_baremetal_machine_identity_marker: >-
      {{ substrate_baremetal_machine_marker_read.stdout | default('') | trim
         if substrate_baremetal_machine_marker_read.rc == 0 else '' }}
    # A connection that succeeded proves the machine presented the delivered
    # key, because nothing else was accepted.
    substrate_baremetal_machine_identity_host_key: >-
      {{ substrate_baremetal_machine_identity_key
         if substrate_baremetal_machine_marker_read.rc == 0 else '' }}
  changed_when: false

- name: Remove the one-connection known-hosts file
  ansible.builtin.file:
    path: '{{ substrate_baremetal_machine_identity_work }}/known_hosts'
    state: absent
  changed_when: false

- name: Remove the one-connection client configuration
  ansible.builtin.file:
    path: '{{ substrate_baremetal_machine_identity_work }}/ssh_config'
    state: absent
  changed_when: false
