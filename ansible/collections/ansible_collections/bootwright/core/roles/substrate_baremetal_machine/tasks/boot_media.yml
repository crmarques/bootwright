---
# Boot one operator-owned machine from media already inserted in its own
# controller.
#
# A physical controller consumes a one-time override and forgets it, so this
# arm sets one: the machine boots the inserted image once and returns to its
# own disk by itself, without anything having to change the selection between
# the two boots. An operator-owned machine is never powered off here: the
# pre-boot proof refused it unless it was already off.
#
# The inputs are this entry point's argument spec, passed explicitly by the
# consuming role and never inherited from a shared fact.
- name: Select a one-time boot from the inserted media
  bootwright.core.redfish_boot:
    endpoint: '{{ substrate_baremetal_machine_boot_endpoint }}'
    user: '{{ lookup("ansible.builtin.file", substrate_baremetal_machine_boot_user) }}'
    password: '{{ lookup("ansible.builtin.file", substrate_baremetal_machine_boot_password) }}'
    verify: '{{ substrate_baremetal_machine_boot_verify }}'
    ca_data: >-
      {{ lookup('ansible.builtin.file', substrate_baremetal_machine_boot_ca)
         if substrate_baremetal_machine_boot_ca | length > 0 else '' }}
    operation: boot
    target: Cd
  register: substrate_baremetal_machine_boot_selected
  failed_when: false
  no_log: true

# ansible-core keeps nothing of a failure under no_log but that it failed, so
# each of the controller's own refusals is reported by a step of its own,
# where no credential is.
- name: Stop at a media selection the management controller did not complete
  ansible.builtin.assert:
    that:
      - substrate_baremetal_machine_boot_selected.msg is not defined
    fail_msg: >-
      selecting a one-time boot from the inserted media through the management controller at
      {{ substrate_baremetal_machine_boot_endpoint }} failed:
      {{ (substrate_baremetal_machine_boot_selected.msg | default('') | string | bootwright.core.printable)[:512] }}
    quiet: true

- name: Power the machine on and poll it to running
  bootwright.core.redfish_boot:
    endpoint: '{{ substrate_baremetal_machine_boot_endpoint }}'
    user: '{{ lookup("ansible.builtin.file", substrate_baremetal_machine_boot_user) }}'
    password: '{{ lookup("ansible.builtin.file", substrate_baremetal_machine_boot_password) }}'
    verify: '{{ substrate_baremetal_machine_boot_verify }}'
    ca_data: >-
      {{ lookup('ansible.builtin.file', substrate_baremetal_machine_boot_ca)
         if substrate_baremetal_machine_boot_ca | length > 0 else '' }}
    operation: power-on
  register: substrate_baremetal_machine_boot_started
  failed_when: false
  no_log: true

- name: Stop at a power-on the management controller did not complete
  ansible.builtin.assert:
    that:
      - substrate_baremetal_machine_boot_started.msg is not defined
    fail_msg: >-
      powering the machine on through the management controller at
      {{ substrate_baremetal_machine_boot_endpoint }} failed:
      {{ (substrate_baremetal_machine_boot_started.msg | default('') | string | bootwright.core.printable)[:512] }}
    quiet: true
