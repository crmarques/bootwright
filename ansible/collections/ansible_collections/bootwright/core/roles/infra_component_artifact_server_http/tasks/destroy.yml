---
- name: Remove boot artifact server container and reap orphans
  ansible.builtin.include_role:
    name: bootwright.core.support_component_teardown
    tasks_from: container.yml
  vars:
    bootwright_component_teardown_container: "{{ bootwright_artifacts_container_name }}"
    bootwright_component_teardown_kind: artifacts

- name: Close boot artifact ports on host firewall
  ansible.posix.firewalld:
    port: "{{ item.port | int }}/tcp"
    state: disabled
    permanent: true
    immediate: true
  failed_when: false
  loop: "{{ bootwright_component.listeners | default([]) }}"
  loop_control:
    label: "{{ item.protocol }}:{{ item.port }}"
  when:
    - bootwright_firewalld_available | default(false)

- name: Remove boot artifact state and ownership record
  ansible.builtin.include_role:
    name: bootwright.core.support_component_teardown
    tasks_from: state.yml
  vars:
    bootwright_component_teardown_state_dir: "{{ bootwright_artifacts_root }}"
