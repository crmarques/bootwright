---
- name: Enforce apply mode for this infra-component
  ansible.builtin.include_role:
    name: bootwright.core.ownership_record
    tasks_from: infra_component_container_gate.yml
  vars:
    bootwright_gate_container_name: "{{ bootwright_artifacts_container_name }}"

- name: Validate boot artifact server settings
  ansible.builtin.assert:
    that:
      - (bootwright_component.image | default('')) | length > 0
      - (bootwright_component.bindAddress | default('')) | length > 0
      - (bootwright_component.listeners | default([])) | length > 0
      - (bootwright_component.endpoints | default([])) | length > 0
    fail_msg: "artifacts_http requires component.{image,bindAddress,listeners,endpoints}"

- name: Resolve boot artifact HTTPS mode
  ansible.builtin.set_fact:
    bootwright_artifacts_https_enabled: "{{ (bootwright_component.listeners | selectattr('protocol', 'equalto', 'https') | list | length) > 0 }}"
  changed_when: false

- name: Install boot artifact server packages
  ansible.builtin.package:
    name:
      - openssl
      - podman
    state: present

- name: Create boot artifact directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ bootwright_artifacts_root }}"
      mode: "0755"
    - path: "{{ bootwright_artifacts_config_dir }}"
      mode: "0755"
    - path: "{{ bootwright_artifacts_public_dir }}"
      mode: "0755"
    - path: "{{ bootwright_artifacts_tls_dir }}"
      mode: "0700"

- name: Stat boot artifact TLS certificate
  ansible.builtin.stat:
    path: "{{ bootwright_artifacts_tls_cert_path }}"
  register: bootwright_artifacts_tls_cert
  changed_when: false
  when: bootwright_artifacts_https_enabled | bool

- name: Stat boot artifact TLS key
  ansible.builtin.stat:
    path: "{{ bootwright_artifacts_tls_key_path }}"
  register: bootwright_artifacts_tls_key
  changed_when: false
  when: bootwright_artifacts_https_enabled | bool

- name: Detect existing boot artifact TLS material
  ansible.builtin.set_fact:
    bootwright_artifacts_tls_material_present: >-
      {{
        (bootwright_artifacts_tls_cert.stat.exists | bool)
        and (bootwright_artifacts_tls_key.stat.exists | bool)
      }}
  changed_when: false
  when: bootwright_artifacts_https_enabled | bool

- name: Render boot artifact TLS OpenSSL config
  # Render unconditionally so a change to the desired SANs/CN (dnsNames,
  # commonName, ipAddresses) surfaces as a content change and drives a cert
  # regeneration below. Gating this on "material absent" left an edited SAN list
  # serving a stale certificate that fails client hostname verification.
  ansible.builtin.template:
    src: artifacts-openssl.cnf.j2
    dest: "{{ bootwright_artifacts_tls_dir }}/openssl.cnf"
    owner: root
    group: root
    mode: "0644"
  register: bootwright_artifacts_tls_openssl_cnf
  when: bootwright_artifacts_https_enabled | bool

- name: Generate boot artifact TLS certificate
  ansible.builtin.command:
    argv:
      - openssl
      - req
      - -x509
      - -nodes
      - -newkey
      - rsa:2048
      - -sha256
      - -days
      - "3650"
      - -keyout
      - "{{ bootwright_artifacts_tls_key_path }}"
      - -out
      - "{{ bootwright_artifacts_tls_cert_path }}"
      - -config
      - "{{ bootwright_artifacts_tls_dir }}/openssl.cnf"
      - -extensions
      - v3_req
  register: bootwright_artifacts_tls_generated
  changed_when: true
  when:
    - bootwright_artifacts_https_enabled | bool
    - (not (bootwright_artifacts_tls_material_present | default(false) | bool))
      or (bootwright_artifacts_tls_openssl_cnf is changed)

- name: Restrict boot artifact TLS key
  ansible.builtin.file:
    path: "{{ bootwright_artifacts_tls_key_path }}"
    owner: root
    group: root
    mode: "0600"
  when: bootwright_artifacts_https_enabled | bool

- name: Set boot artifact TLS certificate mode
  ansible.builtin.file:
    path: "{{ bootwright_artifacts_tls_cert_path }}"
    owner: root
    group: root
    mode: "0644"
  when: bootwright_artifacts_https_enabled | bool

- name: Render boot artifact nginx configuration
  ansible.builtin.template:
    src: artifacts-nginx.conf.j2
    dest: "{{ bootwright_artifacts_config_path }}"
    owner: root
    group: root
    mode: "0644"
  register: bootwright_artifacts_config

- name: Resolve boot artifact container volumes
  ansible.builtin.set_fact:
    bootwright_artifacts_volumes: >-
      {{
        [
          bootwright_artifacts_config_path ~ ':/etc/nginx/nginx.conf:ro,Z',
          bootwright_artifacts_public_dir ~ ':/usr/share/nginx/html:ro,Z'
        ]
        + (
          [
            bootwright_artifacts_tls_cert_path ~ ':/etc/bootwright-artifacts/server.crt:ro,Z',
            bootwright_artifacts_tls_key_path ~ ':/etc/bootwright-artifacts/server.key:ro,Z'
          ]
          if (bootwright_artifacts_https_enabled | bool)
          else []
        )
      }}
  changed_when: false

- name: Run boot artifact server container
  containers.podman.podman_container:
    name: "{{ bootwright_artifacts_container_name }}"
    image: "{{ bootwright_component.image }}"
    state: started
    recreate: "{{ bootwright_artifacts_config.changed or (bootwright_artifacts_tls_generated.changed | default(false)) }}"
    network: host
    user: "0:0"
    restart_policy: unless-stopped
    pull: missing
    labels:
      bootwright.kind: artifacts
      bootwright.provider: "{{ bootwright_component.providerName }}"
      bootwright.name: "{{ bootwright_component.name }}"
    volumes: "{{ bootwright_artifacts_volumes }}"

- name: Open boot artifact ports on host firewall
  ansible.posix.firewalld:
    port: "{{ item.port | int }}/tcp"
    state: enabled
    permanent: true
    immediate: true
  loop: "{{ bootwright_component.listeners }}"
  loop_control:
    label: "{{ item.protocol }}:{{ item.port }}"
  when: bootwright_firewalld_available | default(false)

- name: Wait for boot artifact endpoints
  ansible.builtin.uri:
    url: "{{ item.protocol }}://{{ '127.0.0.1' if bootwright_component.bindAddress == '0.0.0.0' else ('[' ~ bootwright_component.bindAddress ~ ']' if ':' in bootwright_component.bindAddress else bootwright_component.bindAddress) }}:{{ item.port | int }}/"
    method: GET
    status_code: 404
    validate_certs: false
    return_content: false
  register: bootwright_artifacts_ready
  retries: 30
  delay: 1
  until: bootwright_artifacts_ready.status == 404
  loop: "{{ bootwright_component.listeners }}"
  loop_control:
    label: "{{ item.protocol }}:{{ item.port }}"

- name: Record artifact server ownership
  ansible.builtin.include_role:
    name: bootwright.core.ownership_record
    tasks_from: resource.yml
  vars:
    bootwright_ownership_kind: infra-component
    bootwright_ownership_name: "{{ bootwright_component.providerName }}-{{ bootwright_component.name }}"
    bootwright_ownership_fields:
      provider: "{{ bootwright_component.providerName }}"
      paths:
        - "{{ bootwright_artifacts_root }}"
      labels:
        bootwright.kind: artifacts
        bootwright.provider: "{{ bootwright_component.providerName }}"
        bootwright.name: "{{ bootwright_component.name }}"
      attributes:
        componentKind: artifacts
        container: "{{ bootwright_artifacts_container_name }}"
