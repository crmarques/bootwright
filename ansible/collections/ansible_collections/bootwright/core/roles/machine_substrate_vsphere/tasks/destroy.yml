---
- name: Resolve vSphere destroy identifiers
  ansible.builtin.set_fact:
    bootwright_vsphere: "{{ bootwright_component.vsphere | default({}) }}"
    bootwright_vsphere_vm_name: "{{ bootwright_current_cluster.name }}-{{ bootwright_component.name }}"
    bootwright_vsphere_ownership_record_name: "{{ bootwright_current_cluster.name }}-{{ bootwright_component.name }}"
  changed_when: false

- name: Validate vSphere destroy inputs
  ansible.builtin.assert:
    that:
      - bootwright_vsphere is mapping
      - bootwright_vsphere.server | default('') | length > 0
      - bootwright_vsphere.credentialsPath | default('') | length > 0
      - bootwright_vsphere.topology.datacenter | default('') | length > 0
    fail_msg: >-
      vSphere destroy for {{ bootwright_current_cluster.name }}/{{ bootwright_component.name }}
      is missing vCenter placement or credentials.

- name: Load vCenter credentials
  ansible.builtin.include_role:
    name: bootwright.core.support_credentials
    tasks_from: load.yml
  vars:
    bootwright_creds_path: "{{ bootwright_vsphere.credentialsPath }}"
    bootwright_creds_var: bootwright_vsphere_credentials
    bootwright_creds_label: "vCenter credentials for {{ bootwright_vsphere.server }}"

- name: Resolve recorded vSphere virtual media authority for destroy
  ansible.builtin.set_fact:
    bootwright_vsphere_vmedia_records: >-
      {{
        bootwright_ownership_records | default([])
        | selectattr('kind', 'equalto', 'vsphere-vmedia')
        | selectattr('name', 'equalto', bootwright_vsphere_ownership_record_name)
        | list
      }}
    bootwright_vsphere_vmedia_expected_datastore: >-
      {{
        bootwright_component.boot.agentIso.fetchUrl | default('')
        | regex_replace('^\\[(.+)\\] .*$', '\\1')
      }}
    bootwright_vsphere_vmedia_expected_path: >-
      {{
        bootwright_component.boot.agentIso.fetchUrl | default('')
        | regex_replace('^\\[.+\\] ', '')
      }}
    bootwright_vsphere_vmedia_expected_stage_path: >-
      {{ bootwright_component.boot.agentIso.stagePath | default('') }}
  changed_when: false

- name: Require exact recorded vSphere virtual media ownership before destroy
  ansible.builtin.assert:
    quiet: true
    that:
      - >-
        bootwright_vsphere_vmedia_record
        | bootwright.core.bootwright_vsphere_vmedia_record_authorized(
            bootwright_clusters_dir | dirname | basename,
            bootwright_current_cluster.name,
            bootwright_component.name,
            bootwright_vsphere_ownership_record_name,
            bootwright_component.providerName,
            bootwright_vsphere.server,
            bootwright_vsphere.topology.datacenter,
            bootwright_vsphere_vmedia_expected_datastore,
            bootwright_vsphere_vmedia_expected_path,
            bootwright_vsphere_vmedia_expected_stage_path
          )
    fail_msg: >-
      Refusing vSphere destroy for
      {{ bootwright_current_cluster.name }}/{{ bootwright_component.name }} because
      a virtual-media ownership record does not exactly match the current
      ownership API, owner, context, provider, cluster, machine, vCenter
      placement, and authorized staging paths. Restore the exact record from
      trusted evidence or clean the media under its original desired state, then
      retry the exact invocation `{{ bootwright_mutating_invocation }}`. No
      destroy authorization permits a foreign or path-ambiguous media record.
  loop: "{{ bootwright_vsphere_vmedia_records }}"
  loop_control:
    loop_var: bootwright_vsphere_vmedia_record
    label: "{{ bootwright_vsphere_vmedia_record.name | default('<invalid>') }}"

- name: Read vSphere VM ownership annotation
  community.vmware.vmware_guest_info:
    hostname: "{{ bootwright_vsphere.server }}"
    port: "{{ bootwright_vsphere.port | default(443) }}"
    username: "{{ bootwright_vsphere_credentials.username }}"
    password: "{{ bootwright_vsphere_credentials.password }}"
    validate_certs: "{{ not (bootwright_vsphere.disableCertificateVerification | default(false) | bool) }}"
    datacenter: "{{ bootwright_vsphere.topology.datacenter }}"
    folder: "{{ bootwright_vsphere.topology.folder | default(omit, true) }}"
    name: "{{ bootwright_vsphere_vm_name }}"
  vars:
    ansible_python_interpreter: "{{ bootwright_vsphere_python }}"
  register: bootwright_vsphere_destroy_info
  failed_when: false
  no_log: "{{ bootwright_no_log | default(true) | bool }}"

- name: Require a conclusive vSphere VM probe before destroy
  ansible.builtin.assert:
    that:
      - >-
        bootwright_vsphere_destroy_info.instance is defined
        or 'non-existing VM' in (bootwright_vsphere_destroy_info.msg | default(''))
    fail_msg: >-
      Could not determine whether vSphere VM {{ bootwright_vsphere_vm_name }}
      exists on {{ bootwright_vsphere.server }}:
      {{ bootwright_vsphere_destroy_info.msg | default('probe failed with no detail') }}.
      Refusing to treat it as absent — that would drop its ownership record
      while the VM may still be running. Fix vCenter access/credentials and
      re-run destroy.

- name: Resolve vSphere VM presence
  ansible.builtin.set_fact:
    bootwright_vsphere_vm_present: "{{ bootwright_vsphere_destroy_info.instance is defined }}"
    bootwright_vsphere_vm_annotation: "{{ bootwright_vsphere_destroy_info.instance.annotation | default('') }}"
  changed_when: false

- name: Resolve vSphere VM ownership for destroy
  ansible.builtin.set_fact:
    bootwright_vsphere_destroy_owned: >-
      {{ ('bootwright:context=' ~ (bootwright_clusters_dir | dirname | basename)) in bootwright_vsphere_vm_annotation
         and ('bootwright:cluster=' ~ bootwright_current_cluster.name) in bootwright_vsphere_vm_annotation
         and ('bootwright:machine=' ~ bootwright_component.name) in bootwright_vsphere_vm_annotation }}
  changed_when: false
  when: bootwright_vsphere_vm_present | bool

- name: Refuse to delete a non-Bootwright vSphere VM
  ansible.builtin.assert:
    that:
      - bootwright_vsphere_destroy_owned | default(false) | bool
    fail_msg: >-
      Refusing to delete vSphere VM {{ bootwright_vsphere_vm_name }} on
      {{ bootwright_vsphere.server }}: it carries no Bootwright ownership
      marker for this context/cluster/machine, so it may be a foreign VM
      that happens to match the naming. Verify the VM before removing it
      manually, then retry, or pass --authorize unowned-vms to delete it anyway.
  when:
    - bootwright_vsphere_vm_present | bool
    - not (bootwright_destroy_authorize_unowned_vms | default(false) | bool)

- name: Warn before force-deleting an unowned vSphere VM
  ansible.builtin.debug:
    msg: >-
      --authorize unowned-vms: deleting vSphere VM {{ bootwright_vsphere_vm_name }} on
      {{ bootwright_vsphere.server }} despite a missing or mismatched Bootwright
      ownership marker for this context/cluster/machine.
  when:
    - bootwright_vsphere_vm_present | bool
    - bootwright_destroy_authorize_unowned_vms | default(false) | bool
    - not (bootwright_vsphere_destroy_owned | default(false) | bool)

- name: Delete vSphere VM
  community.vmware.vmware_guest:
    hostname: "{{ bootwright_vsphere.server }}"
    port: "{{ bootwright_vsphere.port | default(443) }}"
    username: "{{ bootwright_vsphere_credentials.username }}"
    password: "{{ bootwright_vsphere_credentials.password }}"
    validate_certs: "{{ not (bootwright_vsphere.disableCertificateVerification | default(false) | bool) }}"
    datacenter: "{{ bootwright_vsphere.topology.datacenter }}"
    folder: "{{ bootwright_vsphere.topology.folder | default(omit, true) }}"
    name: "{{ bootwright_vsphere_vm_name }}"
    state: absent
    force: true
  vars:
    ansible_python_interpreter: "{{ bootwright_vsphere_python }}"
  no_log: "{{ bootwright_no_log | default(true) | bool }}"
  when: bootwright_vsphere_vm_present | bool

- name: Delete recorded vSphere virtual media from the datastore
  ansible.builtin.include_tasks: destroy_vmedia.yml
  loop: "{{ bootwright_vsphere_vmedia_records }}"
  loop_control:
    loop_var: bootwright_vsphere_vmedia_destroy_record
    label: "{{ bootwright_vsphere_vmedia_destroy_record.attributes.path | default('') }}"

- name: Remove recorded vSphere virtual media staging paths and records
  ansible.builtin.include_role:
    name: bootwright.core.ownership_record
    tasks_from: destroy_resource.yml
  vars:
    bootwright_ownership_record: "{{ bootwright_vsphere_vmedia_record }}"
    bootwright_vsphere_vmedia_teardown_verified: true
  loop: "{{ bootwright_vsphere_vmedia_records }}"
  loop_control:
    loop_var: bootwright_vsphere_vmedia_record
    label: "{{ bootwright_vsphere_vmedia_record.name }}"

- name: Remove vSphere machine ownership record
  ansible.builtin.include_role:
    name: bootwright.core.ownership_record
    tasks_from: remove_resource.yml
  vars:
    bootwright_ownership_kind: vsphere-machine
    bootwright_ownership_name: "{{ bootwright_vsphere_ownership_record_name }}"

- name: Remove managed OS install artifacts
  ansible.builtin.include_role:
    name: bootwright.core.ownership_record
    tasks_from: destroy_declared_managed_os.yml
  vars:
    bootwright_declared_managed_os_cluster: "{{ bootwright_current_cluster.name }}"
    bootwright_declared_managed_os_machine: "{{ bootwright_component.name }}"
    bootwright_declared_managed_os_root: "{{ bootwright_provider_state_dir }}/os-install/{{ bootwright_current_cluster.name }}/{{ bootwright_component.name }}"
    bootwright_declared_managed_os_stage_path: "{{ bootwright_component.boot.agentIso.stagePath | default('') }}"
  when: bootwright_component.osManaged | default(false) | bool

- name: Probe remaining managed-OS install machines in this cluster
  ansible.builtin.find:
    paths: "{{ bootwright_provider_state_dir }}/os-install/{{ bootwright_current_cluster.name }}"
    file_type: directory
    recurse: false
    excludes:
      - _source
  register: bootwright_vsphere_os_install_remaining
  when: bootwright_component.osManaged | default(false) | bool

- name: Remove per-cluster OS-install state after the last machine
  ansible.builtin.file:
    path: "{{ bootwright_provider_state_dir }}/os-install/{{ bootwright_current_cluster.name }}"
    state: absent
  when:
    - bootwright_component.osManaged | default(false) | bool
    - (bootwright_vsphere_os_install_remaining.matched | default(0)) == 0
