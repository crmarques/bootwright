---
- name: Resolve vSphere VM layout
  ansible.builtin.set_fact:
    bootwright_vsphere_managed_os_reset: >-
      {{ (bootwright_component.osManaged | default(false) | bool)
         and ((bootwright_apply_mode | default('reconcile')) == 'rebuild')
         and (bootwright_current_cluster.name
              in (bootwright_substrate_reset_clusters | default('') | split(',') | map('trim') | reject('equalto', '') | list)) }}
    bootwright_vsphere_disks: >-
      {{
        [{'size_gb': bootwright_component.profile.diskGiB,
          'type': bootwright_vsphere_disk_type,
          'datastore': bootwright_vsphere.topology.datastore}]
        + (
          bootwright_component.profile.dataDisks | default([])
          | map(attribute='sizeGiB')
          | map('community.general.dict_kv', 'size_gb')
          | map('combine', {'type': bootwright_vsphere_disk_type,
                            'datastore': bootwright_vsphere.topology.datastore})
          | list
        )
      }}
    bootwright_vsphere_networks: >-
      {{
        bootwright_component.interfaces
        | map(attribute='macAddress')
        | map('community.general.dict_kv', 'mac')
        | map('combine', {'name': bootwright_vsphere_portgroup,
                          'device_type': bootwright_vsphere_nic_device,
                          'start_connected': true})
        | map('combine', {'dvswitch_name': bootwright_vsphere_dvswitch}
                         if (bootwright_vsphere_dvswitch | default('') | length > 0)
                         else {})
        | list
      }}
  changed_when: false

- name: Resolve the vSphere guest seed
  ansible.builtin.set_fact:
    bootwright_vsphere_cloud_init: "{{ (bootwright_machine_guest_seed | default({})).cloudInit | default({}) }}"
  changed_when: false

- name: Resolve vSphere guest seed advanced settings
  ansible.builtin.set_fact:
    bootwright_vsphere_advanced_settings: >-
      {{
        [
          {'key': 'guestinfo.metadata', 'value': (bootwright_vsphere_cloud_init.metadata | b64encode)},
          {'key': 'guestinfo.metadata.encoding', 'value': 'base64'},
          {'key': 'guestinfo.userdata', 'value': (bootwright_vsphere_cloud_init.userData | b64encode)},
          {'key': 'guestinfo.userdata.encoding', 'value': 'base64'}
        ]
        if ((bootwright_vsphere_cloud_init.userData | default('')) | length) > 0
        else []
      }}
  changed_when: false
