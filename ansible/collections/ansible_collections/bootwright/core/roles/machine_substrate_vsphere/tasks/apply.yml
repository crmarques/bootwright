---
- name: Apply vSphere virtual machine
  community.vmware.vmware_guest:
    hostname: "{{ bootwright_vsphere.server }}"
    port: "{{ bootwright_vsphere.port | default(443) }}"
    username: "{{ bootwright_vsphere_credentials.username }}"
    password: "{{ bootwright_vsphere_credentials.password }}"
    validate_certs: "{{ not (bootwright_vsphere.disableCertificateVerification | default(false) | bool) }}"
    datacenter: "{{ bootwright_vsphere.topology.datacenter }}"
    cluster: "{{ bootwright_vsphere.topology.computeCluster }}"
    folder: "{{ bootwright_vsphere.topology.folder | default(omit, true) }}"
    resource_pool: "{{ bootwright_vsphere.topology.resourcePool | default(omit, true) }}"
    datastore: "{{ bootwright_vsphere.topology.datastore }}"
    name: "{{ bootwright_vsphere_vm_name }}"
    template: "{{ bootwright_vsphere.template | default(omit, true) }}"
    guest_id: "{{ omit if (bootwright_vsphere.template | default('') | length > 0) else bootwright_vsphere_guest_id }}"
    annotation: "{{ bootwright_vsphere_ownership_marker }}"
    advanced_settings: "{{ bootwright_vsphere_advanced_settings | default([]) }}"
    hardware:
      num_cpus: "{{ bootwright_component.profile.cpu }}"
      memory_mb: "{{ bootwright_component.profile.memoryMiB }}"
      boot_firmware: "{{ bootwright_vsphere_boot_firmware }}"
      scsi: "{{ bootwright_vsphere_scsi_controller }}"
    disk: "{{ bootwright_vsphere_disks }}"
    cdrom: "{{ omit if (bootwright_vsphere_vm_exists | bool) else [{'controller_type': 'sata', 'controller_number': 0, 'unit_number': 0, 'type': 'none'}] }}"
    networks: "{{ bootwright_vsphere_networks }}"
    state: present
    wait_for_ip_address: false
  vars:
    ansible_python_interpreter: "{{ bootwright_vsphere_python }}"
  register: bootwright_vsphere_apply
  no_log: "{{ bootwright_no_log | default(true) | bool }}"

- name: Resolve vSphere virtual machine identity
  ansible.builtin.set_fact:
    bootwright_vsphere_vm_moid: "{{ bootwright_vsphere_apply.instance.moid | default(bootwright_vsphere_probe.instance.moid | default('')) }}"
    bootwright_vsphere_vm_uuid: "{{ bootwright_vsphere_apply.instance.hw_product_uuid | default(bootwright_vsphere_probe.instance.hw_product_uuid | default('')) }}"
  changed_when: false

- name: Enforce vSphere boot order
  community.vmware.vmware_guest_boot_manager:
    hostname: "{{ bootwright_vsphere.server }}"
    port: "{{ bootwright_vsphere.port | default(443) }}"
    username: "{{ bootwright_vsphere_credentials.username }}"
    password: "{{ bootwright_vsphere_credentials.password }}"
    validate_certs: "{{ not (bootwright_vsphere.disableCertificateVerification | default(false) | bool) }}"
    moid: "{{ bootwright_vsphere_vm_moid | default(omit, true) }}"
    name: "{{ omit if (bootwright_vsphere_vm_moid | length > 0) else bootwright_vsphere_vm_name }}"
    boot_firmware: "{{ bootwright_vsphere_boot_firmware }}"
    secure_boot_enabled: "{{ bootwright_vsphere_secure_boot }}"
    boot_order: "{{ ['disk'] if ((bootwright_vsphere.template | default('')) | length > 0) else ['disk', 'cdrom'] }}"
  vars:
    ansible_python_interpreter: "{{ bootwright_vsphere_python }}"
  no_log: "{{ bootwright_no_log | default(true) | bool }}"

- name: Power on the cloned vSphere machine
  community.vmware.vmware_guest_powerstate:
    hostname: "{{ bootwright_vsphere.server }}"
    port: "{{ bootwright_vsphere.port | default(443) }}"
    username: "{{ bootwright_vsphere_credentials.username }}"
    password: "{{ bootwright_vsphere_credentials.password }}"
    validate_certs: "{{ not (bootwright_vsphere.disableCertificateVerification | default(false) | bool) }}"
    datacenter: "{{ bootwright_vsphere.topology.datacenter }}"
    folder: "{{ bootwright_vsphere.topology.folder | default(omit, true) }}"
    name: "{{ bootwright_vsphere_vm_name }}"
    state: powered-on
  vars:
    ansible_python_interpreter: "{{ bootwright_vsphere_python }}"
  no_log: "{{ bootwright_no_log | default(true) | bool }}"
  when: (bootwright_vsphere.template | default('') | length) > 0
