---
- name: Resolve vSphere substrate context
  ansible.builtin.import_tasks: context.yml

- name: Resolve vSphere VM layout
  ansible.builtin.import_tasks: layout.yml

- name: Probe vSphere virtual machine
  ansible.builtin.import_tasks: probe.yml

- name: Gate vSphere virtual machine changes
  ansible.builtin.import_tasks: gate.yml

- name: Apply vSphere virtual machine
  ansible.builtin.import_tasks: apply.yml

- name: Record vSphere machine ownership
  ansible.builtin.import_tasks: ownership.yml
