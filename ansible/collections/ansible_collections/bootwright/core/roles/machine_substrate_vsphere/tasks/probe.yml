---
- name: Probe vSphere virtual machine
  community.vmware.vmware_guest_info:
    hostname: "{{ bootwright_vsphere.server }}"
    port: "{{ bootwright_vsphere.port | default(443) }}"
    username: "{{ bootwright_vsphere_credentials.username }}"
    password: "{{ bootwright_vsphere_credentials.password }}"
    validate_certs: "{{ not (bootwright_vsphere.disableCertificateVerification | default(false) | bool) }}"
    datacenter: "{{ bootwright_vsphere.topology.datacenter }}"
    folder: "{{ bootwright_vsphere.topology.folder | default(omit, true) }}"
    name: "{{ bootwright_vsphere_vm_name }}"
  vars:
    ansible_python_interpreter: "{{ bootwright_vsphere_python }}"
  register: bootwright_vsphere_probe
  failed_when: false
  no_log: "{{ bootwright_no_log | default(true) | bool }}"

- name: Require a conclusive vSphere VM probe
  ansible.builtin.assert:
    that:
      - >-
        bootwright_vsphere_probe.instance is defined
        or 'non-existing VM' in (bootwright_vsphere_probe.msg | default(''))
    fail_msg: >-
      Could not determine whether vSphere VM {{ bootwright_vsphere_vm_name }}
      exists on {{ bootwright_vsphere.server }}:
      {{ bootwright_vsphere_probe.msg | default('probe failed with no detail') }}.
      Refusing to continue — an existing foreign VM could not be detected.
      Fix vCenter access/credentials, then retry the exact invocation
      `{{ bootwright_mutating_invocation }}`.

- name: Resolve vSphere virtual machine presence
  ansible.builtin.set_fact:
    bootwright_vsphere_vm_exists: "{{ (bootwright_vsphere_probe.instance is defined) and not (bootwright_vsphere_managed_os_reset | bool) }}"
  changed_when: false

- name: Resolve vSphere VM ownership for apply
  ansible.builtin.set_fact:
    bootwright_vsphere_apply_owned: >-
      {{ ('bootwright:context=' ~ (bootwright_clusters_dir | dirname | basename)) in (bootwright_vsphere_probe.instance.annotation | default(''))
         and ('bootwright:cluster=' ~ bootwright_current_cluster.name) in (bootwright_vsphere_probe.instance.annotation | default(''))
         and ('bootwright:machine=' ~ bootwright_component.name) in (bootwright_vsphere_probe.instance.annotation | default('')) }}
  changed_when: false
  when: bootwright_vsphere_probe.instance is defined

- name: Refuse to mutate a non-Bootwright vSphere VM
  ansible.builtin.assert:
    that:
      - bootwright_vsphere_apply_owned | default(false) | bool
    fail_msg: >-
      Refusing to apply over vSphere VM {{ bootwright_vsphere_vm_name }} on
      {{ bootwright_vsphere.server }}: it already exists but carries no Bootwright
      ownership marker for this context/cluster/machine, so it may belong to another
      Bootwright context or a foreign owner. Verify its provenance and remove it
      outside Bootwright only after establishing that is safe. No Bootwright
      retry command, apply mode, or authorization token adopts a foreign VM.
  when:
    - bootwright_vsphere_probe.instance is defined
    - (bootwright_apply_mode | default('reconcile')) != 'create'

- name: Enforce vSphere VM apply mode against live state
  ansible.builtin.include_role:
    name: bootwright.core.ownership_record
    tasks_from: apply_mode_gate.yml
  vars:
    bootwright_gate_object: >-
      vSphere VM {{ bootwright_vsphere_vm_name }} on {{ bootwright_vsphere.server }}
    bootwright_gate_exists: "{{ bootwright_vsphere_probe.instance is defined }}"
    bootwright_gate_owned: "{{ bootwright_vsphere_apply_owned | default(false) }}"

- name: Stop managed OS vSphere VM for override reinstall
  community.vmware.vmware_guest_powerstate:
    hostname: "{{ bootwright_vsphere.server }}"
    port: "{{ bootwright_vsphere.port | default(443) }}"
    username: "{{ bootwright_vsphere_credentials.username }}"
    password: "{{ bootwright_vsphere_credentials.password }}"
    validate_certs: "{{ not (bootwright_vsphere.disableCertificateVerification | default(false) | bool) }}"
    datacenter: "{{ bootwright_vsphere.topology.datacenter }}"
    folder: "{{ bootwright_vsphere.topology.folder | default(omit, true) }}"
    name: "{{ bootwright_vsphere_vm_name }}"
    state: powered-off
    force: true
  vars:
    ansible_python_interpreter: "{{ bootwright_vsphere_python }}"
  failed_when: false
  no_log: "{{ bootwright_no_log | default(true) | bool }}"
  when: bootwright_vsphere_managed_os_reset | bool

- name: Remove managed OS vSphere VM for override reinstall
  community.vmware.vmware_guest:
    hostname: "{{ bootwright_vsphere.server }}"
    port: "{{ bootwright_vsphere.port | default(443) }}"
    username: "{{ bootwright_vsphere_credentials.username }}"
    password: "{{ bootwright_vsphere_credentials.password }}"
    validate_certs: "{{ not (bootwright_vsphere.disableCertificateVerification | default(false) | bool) }}"
    datacenter: "{{ bootwright_vsphere.topology.datacenter }}"
    folder: "{{ bootwright_vsphere.topology.folder | default(omit, true) }}"
    name: "{{ bootwright_vsphere_vm_name }}"
    state: absent
    force: true
  vars:
    ansible_python_interpreter: "{{ bootwright_vsphere_python }}"
  no_log: "{{ bootwright_no_log | default(true) | bool }}"
  when: bootwright_vsphere_managed_os_reset | bool
