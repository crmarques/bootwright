---
# The probe drives two decisions below: the apply only pre-creates the
# empty CD-ROM device on first create (touching cdrom on an existing VM
# would hot-eject mounted install media during a reconcile), and the
# ownership attributes fall back to the live moid/uuid on reconfigure.
- name: Probe vSphere virtual machine
  community.vmware.vmware_guest_info:
    hostname: "{{ bootwright_vsphere.server }}"
    port: "{{ bootwright_vsphere.port | default(443) }}"
    username: "{{ bootwright_vsphere_credentials.username }}"
    password: "{{ bootwright_vsphere_credentials.password }}"
    validate_certs: "{{ not (bootwright_vsphere.disableCertificateVerification | default(false) | bool) }}"
    datacenter: "{{ bootwright_vsphere.topology.datacenter }}"
    folder: "{{ bootwright_vsphere.topology.folder | default(omit, true) }}"
    name: "{{ bootwright_vsphere_vm_name }}"
  vars:
    ansible_python_interpreter: "{{ bootwright_vsphere_python }}"
  register: bootwright_vsphere_probe
  failed_when: false
  no_log: "{{ bootwright_no_log | default(true) | bool }}"

- name: Resolve vSphere virtual machine presence
  ansible.builtin.set_fact:
    bootwright_vsphere_vm_exists: "{{ (bootwright_vsphere_probe.instance is defined) and not (bootwright_vsphere_managed_os_reset | bool) }}"
  changed_when: false

# The override reset force-powers-off and deletes the VM addressed purely by
# datacenter+folder+name, so a foreign VM matching the <cluster>-<machine> naming
# would be destroyed. Require the Bootwright ownership annotation for THIS
# context/cluster/machine before the reset touches an existing VM — mirroring
# destroy.yml. Apply fails closed (no --force-unowned escape): it must never
# delete a VM it does not own. A missing VM skips the guard (first create).
- name: Resolve vSphere VM ownership for override reset
  ansible.builtin.set_fact:
    bootwright_vsphere_reset_owned: >-
      {{ ('bootwright:context=' ~ (bootwright_clusters_dir | dirname | basename)) in (bootwright_vsphere_probe.instance.annotation | default(''))
         and ('bootwright:cluster=' ~ bootwright_current_cluster.name) in (bootwright_vsphere_probe.instance.annotation | default(''))
         and ('bootwright:machine=' ~ bootwright_component.name) in (bootwright_vsphere_probe.instance.annotation | default('')) }}
  changed_when: false
  when:
    - bootwright_vsphere_managed_os_reset | bool
    - bootwright_vsphere_probe.instance is defined

- name: Refuse to reset a non-Bootwright vSphere VM
  ansible.builtin.assert:
    that:
      - bootwright_vsphere_reset_owned | default(false) | bool
    fail_msg: >-
      Refusing to reinstall over vSphere VM {{ bootwright_vsphere_vm_name }} on
      {{ bootwright_vsphere.server }}: it carries no Bootwright ownership marker
      for this context/cluster/machine, so it may belong to another Bootwright
      context or a foreign owner. Rename this cluster/machine or remove the
      existing VM manually, then retry.
  when:
    - bootwright_vsphere_managed_os_reset | bool
    - bootwright_vsphere_probe.instance is defined

- name: Stop managed OS vSphere VM for override reinstall
  community.vmware.vmware_guest_powerstate:
    hostname: "{{ bootwright_vsphere.server }}"
    port: "{{ bootwright_vsphere.port | default(443) }}"
    username: "{{ bootwright_vsphere_credentials.username }}"
    password: "{{ bootwright_vsphere_credentials.password }}"
    validate_certs: "{{ not (bootwright_vsphere.disableCertificateVerification | default(false) | bool) }}"
    datacenter: "{{ bootwright_vsphere.topology.datacenter }}"
    folder: "{{ bootwright_vsphere.topology.folder | default(omit, true) }}"
    name: "{{ bootwright_vsphere_vm_name }}"
    state: powered-off
    force: true
  vars:
    ansible_python_interpreter: "{{ bootwright_vsphere_python }}"
  failed_when: false
  no_log: "{{ bootwright_no_log | default(true) | bool }}"
  when: bootwright_vsphere_managed_os_reset | bool

- name: Remove managed OS vSphere VM for override reinstall
  community.vmware.vmware_guest:
    hostname: "{{ bootwright_vsphere.server }}"
    port: "{{ bootwright_vsphere.port | default(443) }}"
    username: "{{ bootwright_vsphere_credentials.username }}"
    password: "{{ bootwright_vsphere_credentials.password }}"
    validate_certs: "{{ not (bootwright_vsphere.disableCertificateVerification | default(false) | bool) }}"
    datacenter: "{{ bootwright_vsphere.topology.datacenter }}"
    folder: "{{ bootwright_vsphere.topology.folder | default(omit, true) }}"
    name: "{{ bootwright_vsphere_vm_name }}"
    state: absent
    force: true
  vars:
    ansible_python_interpreter: "{{ bootwright_vsphere_python }}"
  no_log: "{{ bootwright_no_log | default(true) | bool }}"
  when: bootwright_vsphere_managed_os_reset | bool
