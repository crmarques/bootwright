---
# Derived from the frozen request only. Nothing here is authored by desired
# state, and no value selects an executable, a role or a task file.
# Interrupted image builds stay private to their context and Machine.
managedos_install_anaconda_work_parent: /var/lib/bootwright-install
managedos_install_anaconda_work: >-
  {{ managedos_install_anaconda_work_parent }}/{{ bootwright_os_install_request.identity.context }}/{{ bootwright_os_install_request.identity.object }}/work
managedos_install_anaconda_scratch: '{{ bootwright_run_scratch }}/managedos-install'
managedos_install_anaconda_media: /var/lib/bootwright/media
# The executables this block needs, proved by path. The controller stage
# installs the packages that provide them.
managedos_install_anaconda_tooling:
  - /usr/bin/mkksiso
  - /usr/bin/xorriso
managedos_install_anaconda_boot_media: >-
  {{ managedos_install_anaconda_media }}/{{ bootwright_os_install_request.bootMedia.name }}
# The public image's directory, and nothing for a delivered-key Machine,
# whose image is published beneath its private subtree instead.
managedos_install_anaconda_image_dir: >-
  {{ (bootwright_os_install_request.image.path | dirname)
     if bootwright_os_install_request.image is defined else '' }}
# The server's served root, <content root>/public, which every publication of
# this block is beneath and whose label the serving process reads.
managedos_install_anaconda_served_root: >-
  {{ (bootwright_os_install_request.image.path | dirname | dirname | dirname)
     if bootwright_os_install_request.image is defined
     else (bootwright_os_install_request.private.path | dirname | dirname | dirname) }}
# Shared publication staging is observed, never changed by this role.
managedos_install_anaconda_staged_tree: >-
  {{ (bootwright_os_install_request.tree.path ~ '.staging')
     if bootwright_os_install_request.tree is defined else '' }}
# Every store entry this installation reads, with the size and SHA-256 the
# operation froze, so each attempt proves both before the entry's first use.
# Only the boot image: the shared package-tree publication proves the tree
# image it extracts, and this installation proves only that the published
# tree names it.
managedos_install_anaconda_required_media: >-
  {{ [{'path': managedos_install_anaconda_boot_media,
       'size': bootwright_os_install_request.bootMedia.size,
       'sha256': bootwright_os_install_request.bootMedia.sha256}] }}
# Whether the boot image still has the size and SHA-256 the operation froze,
# read from the stat of the required entry.
managedos_install_anaconda_boot_media_unchanged: >-
  {{ managedos_install_anaconda_media_present.results[0].stat.exists | default(false)
     and managedos_install_anaconda_media_present.results[0].stat.isreg | default(false)
     and managedos_install_anaconda_media_present.results[0].stat.size | default(-1) == managedos_install_anaconda_media_present.results[0].item.size
     and managedos_install_anaconda_media_present.results[0].stat.checksum | default('') == managedos_install_anaconda_media_present.results[0].item.sha256 }}
# A machine that already holds exactly the marker this operation froze is
# installed: the attempt boots nothing and reports the same evidence. This is
# read only by the apply's set_fact right after the first identity read, which
# freezes the answer; a later read would see the marker the installer wrote.
managedos_install_anaconda_installed: >-
  {{ managedos_install_anaconda_answered | default(false)
     and managedos_install_anaconda_marker | default('') == bootwright_os_install_material.marker }}
# An observation the capability makes for a removal's resolution, which reads
# only the content the removal takes back.
managedos_install_anaconda_observes_removal: >-
  {{ bootwright_os_install_material.observes | default('') == 'removal' }}
# Whether a registering removal reads and unregisters its Machine's guest. The
# capability decides it from the apply's own records: an installation that
# never recorded its marker proof never registered, and a Machine the operator
# unregistered outside Bootwright is not read. Anything else reads nothing.
managedos_install_anaconda_unregisters: >-
  {{ bootwright_os_install_material.unregister | default('') == 'guest' }}
# The realized target every substrate-composed task file reads. Each substrate
# proves its own target and reads its own identity channel; the installation
# supplies the terms and never learns which substrate answered.
managedos_install_anaconda_endpoint: '{{ bootwright_os_install_request.target.controller.endpoint }}'
managedos_install_anaconda_verify: '{{ bootwright_os_install_request.target.controller.tlsVerify }}'
# The controller's trust bundle, the one anchor its transport is verified
# against, as the path of its material file and as its PEM; both are empty
# when the controller declares none and the system trust store anchors it.
managedos_install_anaconda_controller_ca: "{{ bootwright_os_install_material.controllerCA | default('') }}"
managedos_install_anaconda_ca_data: >-
  {{ lookup('ansible.builtin.file', managedos_install_anaconda_controller_ca)
     if managedos_install_anaconda_controller_ca | length > 0 else '' }}
# How the controller is made to trust the artifact server it fetches the
# installer from, exactly as the request froze it.
managedos_install_anaconda_media_trust: '{{ bootwright_os_install_request.target.controller.virtualMedia }}'
managedos_install_anaconda_expected: >-
  {{ bootwright_os_install_request.target.hardware.interfaces | default([]) | map(attribute='macAddress') | list }}
# The subtree this block owns for material only the installing machine may read,
# and the unguessable directory beneath it this attempt mints. The token is
# generated here rather than frozen in the plan, so it appears in no request, no
# evidence and no log. The private material is a delivered host key pair or an
# encrypted root disk's recovery passphrase, and the installer image whose
# Kickstart names its URL travels with it.
managedos_install_anaconda_private_root: >-
  {{ bootwright_os_install_request.private.path | default('') }}
managedos_install_anaconda_delivers_private: >-
  {{ bootwright_os_install_request.private is defined }}
# The private files published before the image is proved; recovery is published
# later, inside the boot, by private_recovery.yml.
managedos_install_anaconda_private_files: >-
  {{ ['install.iso'] + (['identity', 'identity.pub']
     if bootwright_os_install_request.target.channel == 'delivered-key' else []) }}
managedos_install_anaconda_private_dir: >-
  {{ managedos_install_anaconda_private_root }}/{{ managedos_install_anaconda_token.stdout | default('') | trim }}
managedos_install_anaconda_private_url: >-
  {{ (bootwright_os_install_request.private.url ~ '/' ~ (managedos_install_anaconda_token.stdout | default('') | trim))
     if managedos_install_anaconda_delivers_private | bool else '' }}
# Where this attempt publishes its installer image and the URL its controller
# fetches it from: the public publication, or install.iso beneath the
# unguessable directory, whose URL carries the token and is never logged.
managedos_install_anaconda_image_path: >-
  {{ bootwright_os_install_request.image.path
     if bootwright_os_install_request.image is defined
     else managedos_install_anaconda_private_dir ~ '/install.iso' }}
managedos_install_anaconda_image_url: >-
  {{ bootwright_os_install_request.image.url
     if bootwright_os_install_request.image is defined
     else managedos_install_anaconda_private_url ~ '/install.iso' }}
# The artifact server's certificate: what the installing machine verifies its
# private fetch against, and what a controller importing it is given.
managedos_install_anaconda_certificate: >-
  {{ lookup('ansible.builtin.file', bootwright_os_install_material.artifactCertificate)
     if bootwright_os_install_material.artifactCertificate is defined else '' }}

# The installer's power-off, the identity answer and the fleet account's
# reachability, the waits an apply performs while the machine installs and
# starts, are budgets the request froze, never values of this role: the run's
# deadline is derived from those budgets, so a wait this role chose could
# outlast the deadline and be killed as a hang.

# The fixed commands of post-install network convergence, each a list of argv
# words run on the installed machine as the fleet account over the connection
# pinned to the key its identity channel reported. Every value reaches a script
# as a positional parameter after the name word, never inside the script text,
# and the document and the marker arrive only on standard input. Root comes
# from the kickstart's NOPASSWD sudoers entry for the fleet account. Nothing
# is written under /etc/nmstate, which nmstate.service applies at boot.
managedos_install_anaconda_network_unit: bootwright-network-apply.service
managedos_install_anaconda_network_run: /run/bootwright
managedos_install_anaconda_network_read:
  - /usr/bin/sudo
  - -n
  - /usr/bin/sh
  - -c
  - |-
    set -u
    if test -x /usr/bin/nmstatectl; then echo nmstatectl=yes; else echo nmstatectl=no; fi
    printf 'bootId=%s\n' "$(head -c 64 /proc/sys/kernel/random/boot_id)"
    printf 'unit=%s\n' "$(systemctl is-active "$1" 2>/dev/null | head -c 32)"
    printf 'rc=%s\n' "$(head -c 8 "$2/network-apply.rc" 2>/dev/null | tr -cd 0-9)"
    printf 'checkpoint=%s\n' "$(grep -o '/org/freedesktop/NetworkManager/Checkpoint/[0-9]*' "$2/network-apply.err" 2>/dev/null \
      | tail -n 1 | head -c 128 | tr -cd '[:graph:]')"
    printf 'listed=%s\n' "$(busctl --system get-property org.freedesktop.NetworkManager \
      /org/freedesktop/NetworkManager org.freedesktop.NetworkManager Checkpoints 2>/dev/null | head -c 4096 | tr -d '\n')"
    printf 'marker=%s\n' "$(head -c 512 "$3" 2>/dev/null | tr -d '\n')"
    printf 'error=%s\n' "$(tail -c 512 "$2/network-apply.err" 2>/dev/null | tr -c '[:print:]' ' ')"
  - bootwright-network
  - '{{ managedos_install_anaconda_network_unit }}'
  - '{{ managedos_install_anaconda_network_run }}'
  - '{{ bootwright_os_install_request.network.markerPath }}'
# Exits 3 while the apply unit still runs and 0 otherwise; ssh itself exits 255.
managedos_install_anaconda_network_wait:
  - /usr/bin/sudo
  - -n
  - /usr/bin/sh
  - -c
  - |-
    case "$(systemctl is-active "$1" 2>/dev/null)" in active|activating|deactivating|reloading|refreshing) exit 3;; esac
  - bootwright-network
  - '{{ managedos_install_anaconda_network_unit }}'
managedos_install_anaconda_network_prepare:
  - /usr/bin/sudo
  - -n
  - /usr/bin/sh
  - -c
  - |-
    set -eu
    umask 077
    install -d -m 0700 -o root -g root "$2"
    rm -f -- "$2/network-apply.log" "$2/network-apply.err" "$2/network-apply.rc"
    install -m 0600 -o root -g root /dev/stdin "$1"
  - bootwright-network
  - '{{ bootwright_os_install_request.network.documentPath }}'
  - '{{ managedos_install_anaconda_network_run }}'
# A unit of Type=exec started with --no-block returns as soon as it runs, and
# its wrapper keeps nmstatectl's output and exit status after it is collected.
managedos_install_anaconda_network_start:
  - /usr/bin/sudo
  - -n
  - /usr/bin/systemd-run
  - --no-block
  - --quiet
  - --collect
  - '--unit={{ managedos_install_anaconda_network_unit }}'
  - -p
  - Type=exec
  - /usr/bin/sh
  - -c
  - |-
    /usr/bin/nmstatectl apply --no-commit --timeout="$1" "$2" >"$3/network-apply.log" 2>"$3/network-apply.err"
    echo "$?" >"$3/network-apply.rc"
  - bootwright-network
  - '{{ bootwright_os_install_request.network.checkpointSeconds | int }}'
  - '{{ bootwright_os_install_request.network.documentPath }}'
  - '{{ managedos_install_anaconda_network_run }}'
managedos_install_anaconda_network_rollback:
  - /usr/bin/sudo
  - -n
  - /usr/bin/sh
  - -c
  - |-
    set -eu
    /usr/bin/nmstatectl rollback "$1"
    rm -f -- "$2/network-apply.log" "$2/network-apply.err" "$2/network-apply.rc"
  - bootwright-network
  - '{{ managedos_install_anaconda_network_state.checkpoint }}'
  - '{{ managedos_install_anaconda_network_run }}'
managedos_install_anaconda_network_commit:
  - /usr/bin/sudo
  - -n
  - /usr/bin/nmstatectl
  - commit
  - '{{ managedos_install_anaconda_network_applied.checkpoint }}'
managedos_install_anaconda_network_mark:
  - /usr/bin/sudo
  - -n
  - /usr/bin/sh
  - -c
  - |-
    set -eu
    umask 022
    cat >"$1.tmp"
    chmod 0644 "$1.tmp"
    mv -f -T "$1.tmp" "$1"
    sync
    rm -f -- "$2/network-apply.log" "$2/network-apply.err" "$2/network-apply.rc"
  - bootwright-network
  - '{{ bootwright_os_install_request.network.markerPath }}'
  - '{{ managedos_install_anaconda_network_run }}'
managedos_install_anaconda_network_poweroff:
  - /usr/bin/sudo
  - -n
  - /usr/bin/systemctl
  - --no-block
  - poweroff
managedos_install_anaconda_network_boot_id:
  - /usr/bin/cat
  - /proc/sys/kernel/random/boot_id
managedos_install_anaconda_network_show:
  - /usr/bin/sudo
  - -n
  - /usr/bin/nmstatectl
  - show
  - --json
# Recovery follows the frozen removal policy. Retaining physical Machines
# also need power-off so their existing install marker cannot answer.
managedos_install_anaconda_network_recovery: >-
  {{ ('run bootwright destroy --authorize data-loss, which overwrites the declared disks of Machine '
  ~ bootwright_os_install_request.identity.object ~ ' and removes its installed system before releasing it'
  if bootwright_os_install_request.eraseOnRemoval | default(false)
  else 'run bootwright destroy, which releases Machine ' ~ bootwright_os_install_request.identity.object
  ~ ' but keeps the system installed on it, then power ' ~ bootwright_os_install_request.identity.object
  ~ ' off from its management controller so the next apply installs it again')
  if bootwright_os_install_request.target.substrate == 'baremetal'
  else 'run bootwright destroy, which erases the Machines this context installed' }}
