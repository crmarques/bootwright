---
- name: Validate the frozen installation request
  ansible.builtin.assert:
    that:
      - bootwright_os_install_request.version == 'os-install-anaconda-v6'
      - bootwright_os_install_digest is match('[0-9a-f]{64}')
    quiet: true
  no_log: true

- name: Complete the qualified execution handoff
  bootwright.core.managedos_install_protocol:
    phase: loaded
  no_log: true

# Read before this observation creates the work area an identity read may need,
# so the work area it reports is one it found.
- name: Observe what this installation publishes
  bootwright.core.managedos_install_inspect:
    request: '{{ bootwright_os_install_request }}'
    staging: '{{ managedos_install_anaconda_staged_tree }}'
    work: '{{ managedos_install_anaconda_work }}'
  register: managedos_install_anaconda_observed

# A removal's resolution reads only the published content, which is all the
# removal takes back, so none of the machine reads below runs for it.
- name: Read the machine through a work area this observation leaves as it found it
  when: not (managedos_install_anaconda_observes_removal | bool)
  block:
    # The parent stays whatever the reads answer: a removal leaves it too.
    - name: Create the root-only parent of the work area
      ansible.builtin.file:
        path: '{{ managedos_install_anaconda_work_parent }}'
        state: directory
        owner: root
        group: root
        mode: '0700'
      changed_when: false

    - name: Read the parent of the work area
      ansible.builtin.stat:
        path: '{{ managedos_install_anaconda_work_parent }}'
        follow: false
      register: managedos_install_anaconda_work_parent_stat

    - name: Refuse a work area parent that is not a root-only directory
      ansible.builtin.assert:
        that:
          - managedos_install_anaconda_work_parent_stat.stat.isdir | default(false)
          - not (managedos_install_anaconda_work_parent_stat.stat.islnk | default(true))
          - managedos_install_anaconda_work_parent_stat.stat.uid | default(-1) == 0
          - managedos_install_anaconda_work_parent_stat.stat.mode | default('') == '0700'
        fail_msg: >-
          {{ managedos_install_anaconda_work_parent }} is not a directory only root
          may enter, so the machine was not read through it; remove it and observe again
        quiet: true

    - name: Create the work directory an identity read may need
      ansible.builtin.file:
        path: '{{ managedos_install_anaconda_work }}'
        state: directory
        owner: root
        group: root
        mode: '0700'
      changed_when: false

    - name: Read the machine through its own identity channel
      ansible.builtin.include_tasks: identity.yml

    # An observation resolves a completed apply, so it has to prove what the
    # apply proves. Reading the marker and the host key says the disk was
    # written; only this says the machine the plan promised is actually usable.
    # It takes the answer that is already true rather than waiting for one.
    - name: Try the fleet account the same way an apply proves it
      ansible.builtin.include_tasks: reachable.yml
      vars:
        managedos_install_anaconda_reachable_retries: 1
        managedos_install_anaconda_reachable_pause: 1
      when: managedos_install_anaconda_host_key | default('') | trim | length > 0

  # A work area this observation created is its own and goes whatever the reads
  # answered. One it found is what an interrupted attempt left, which the next
  # apply clears and a removal takes back, so it stays as it was.
  always:
    - name: Remove the work directory this observation created
      ansible.builtin.file:
        path: '{{ managedos_install_anaconda_work }}'
        state: absent
      changed_when: false
      when: not (managedos_install_anaconda_observed.observation.work | bool)

- name: Read the power state and media its controller reports
  bootwright.core.redfish_system_read:
    endpoint: '{{ managedos_install_anaconda_endpoint }}'
    user: '{{ lookup("ansible.builtin.file", bootwright_os_install_material.controllerUser) }}'
    password: '{{ lookup("ansible.builtin.file", bootwright_os_install_material.controllerPassword) }}'
    verify: '{{ managedos_install_anaconda_verify }}'
    ca_data: '{{ managedos_install_anaconda_ca_data }}'
    media: true
  register: managedos_install_anaconda_controller
  failed_when: false
  when: not (managedos_install_anaconda_observes_removal | bool)
  no_log: true

# Always the presence form, which carries the power the controller reported:
# a powered-off machine holding no marker with nothing published is how an
# apply stopped before it published anything proves it had no effect.
- name: Publish bounded installation observation evidence
  bootwright.core.managedos_install_protocol:
    phase: completed
    observed: true
    outcome: unchanged
    digest: '{{ bootwright_os_install_digest }}'
    observation: '{{ managedos_install_anaconda_observed.observation }}'
    marker: '{{ managedos_install_anaconda_marker | default("") }}'
    hostKey: '{{ managedos_install_anaconda_host_key | default("") }}'
    reachable: '{{ managedos_install_anaconda_reachable.rc | default(1) == 0 }}'
    address: '{{ bootwright_os_install_request.address }}'
    media: '{{ managedos_install_anaconda_controller.media | default("") }}'
    power: '{{ managedos_install_anaconda_controller.power | default("") }}'
  no_log: true
