---
- name: Validate the frozen installation request
  ansible.builtin.assert:
    that:
      - bootwright_os_install_request.version == 'os-install-anaconda-v12'
      - bootwright_os_install_request.identity.context is match('^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$')
      - bootwright_os_install_request.identity.object is match('^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$')
      - managedos_install_anaconda_work == '/var/lib/bootwright-install/'
        ~ bootwright_os_install_request.identity.context ~ '/' ~ bootwright_os_install_request.identity.object ~ '/work'
      - bootwright_os_install_digest is match('[0-9a-f]{64}')
      - bootwright_os_install_request.network.documentPath == '/etc/bootwright/network.yml'
      - bootwright_os_install_request.network.markerPath == '/etc/bootwright/network-marker.json'
      - bootwright_os_install_request.network.checkpointSeconds | int > 0
      - bootwright_os_install_request.network.document is mapping
    quiet: true
  no_log: true

- name: Complete the qualified execution handoff
  bootwright.core.managedos_install_protocol:
    phase: loaded
  no_log: true

- name: Prove each ancestor of this Machine's durable work area
  ansible.builtin.include_tasks: work.yml
  loop:
    - '{{ managedos_install_anaconda_work_parent }}'
    - '{{ managedos_install_anaconda_work | dirname | dirname }}'
    - '{{ managedos_install_anaconda_work | dirname }}'
  loop_control:
    loop_var: managedos_install_anaconda_work_ancestor
  vars:
    managedos_install_anaconda_work_create: false

- name: Observe what this installation publishes
  bootwright.core.managedos_install_inspect:
    request: '{{ bootwright_os_install_request }}'
    staging: '{{ managedos_install_anaconda_staged_tree }}'
    work: '{{ managedos_install_anaconda_work }}'
  register: managedos_install_anaconda_observed

# A removal's resolution reads only the published content, which is all the
# removal takes back, so none of the machine reads below runs for it.
- name: Read the machine through this invocation's private scratch
  when: not (managedos_install_anaconda_observes_removal | bool)
  block:
    - name: Prepare private connection files
      bootwright.core.lifecycle_scratch:
        root: '{{ bootwright_run_scratch }}'
        scope: managedos-install
      register: managedos_install_anaconda_scratch_ready

    - name: Read the machine through its own identity channel
      ansible.builtin.include_tasks: identity.yml

    # An observation resolves a completed apply, so it has to prove what the
    # apply proves. Reading the marker and the host key says the disk was
    # written; only this says the machine the plan promised is actually usable.
    # It takes the answer that is already true rather than waiting for one.
    - name: Try the fleet account the same way an apply proves it
      ansible.builtin.include_tasks: reachable.yml
      vars:
        managedos_install_anaconda_reachable_retries: 1
        managedos_install_anaconda_reachable_pause: 1
      when: managedos_install_anaconda_host_key | default('') | trim | length > 0

    - name: Read the installed machine's network the same way an apply proves it
      ansible.builtin.include_tasks: network_observe.yml
      when: managedos_install_anaconda_reachable.rc | default(1) == 0

    - name: Read the installed machine's FIPS state the same way an apply proves it
      ansible.builtin.include_tasks: host_security.yml
      when: managedos_install_anaconda_reachable.rc | default(1) == 0

  always:
    - name: Remove private connection files
      bootwright.core.lifecycle_scratch:
        root: '{{ bootwright_run_scratch }}'
        scope: managedos-install
        state: absent
        remove_root: "{{ bootwright_os_install_request.placement.connection == 'ssh' }}"
      when: managedos_install_anaconda_scratch_ready is succeeded

- name: Read the power state and media its controller reports
  bootwright.core.redfish_system_read:
    endpoint: '{{ managedos_install_anaconda_endpoint }}'
    user: '{{ lookup("ansible.builtin.file", bootwright_os_install_material.controllerUser) }}'
    password: '{{ lookup("ansible.builtin.file", bootwright_os_install_material.controllerPassword) }}'
    verify: '{{ managedos_install_anaconda_verify }}'
    ca_data: '{{ managedos_install_anaconda_ca_data }}'
    media: true
  register: managedos_install_anaconda_controller
  failed_when: false
  when: not (managedos_install_anaconda_observes_removal | bool)
  no_log: true

# Always the presence form, which carries the power the controller reported:
# a powered-off machine holding no marker with nothing published is how an
# apply stopped before it published anything proves it had no effect.
- name: Publish bounded installation observation evidence
  bootwright.core.managedos_install_protocol:
    phase: completed
    observed: true
    outcome: unchanged
    digest: '{{ bootwright_os_install_digest }}'
    observation: '{{ managedos_install_anaconda_observed.observation }}'
    marker: '{{ managedos_install_anaconda_marker | default("") }}'
    hostKey: '{{ managedos_install_anaconda_host_key | default("") }}'
    reachable: '{{ managedos_install_anaconda_reachable.rc | default(1) == 0 }}'
    address: '{{ bootwright_os_install_request.address }}'
    # A controller can echo the media URL with its host or port rewritten,
    # so any token-shaped run is redacted rather than a known prefix.
    media: "{{ managedos_install_anaconda_controller.media | default('') | regex_replace('[0-9a-f]{64}', '<token>') }}"
    power: '{{ managedos_install_anaconda_controller.power | default("") }}'
    privateDelivery: '{{ bootwright_os_install_request.private is defined }}'
    network: '{{ managedos_install_anaconda_network_result.network | default(false) }}'
    networkReboot: '{{ managedos_install_anaconda_network_result.networkReboot | default(false) }}'
    networkDifferences: '{{ managedos_install_anaconda_network_result.networkDifferences | default([]) }}'
    fips: '{{ managedos_install_anaconda_fips | default(false) }}'
    fipsRequired: "{{ 'fips=1' in (bootwright_os_install_request.installerArguments | default([])) }}"
  no_log: true
