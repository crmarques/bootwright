---
# An installer takes minutes to write a disk and a physical machine takes
# minutes more to complete its power-on self test, so completion is polled
# rather than waited for once. A machine that has not answered yet is not a
# machine that answered wrongly: the read itself distinguishes them.
#
# The wait belongs to the read, not to a loop around it. A looped dynamic
# include expands every item before the first one runs, so a fact one iteration
# publishes cannot gate the next: such a loop ran its whole budget on every
# installation and returned only once it was exhausted.
- name: Wait for the installed machine to answer with its marker
  ansible.builtin.include_tasks: identity.yml
  vars:
    managedos_install_anaconda_identity_retries: '{{ bootwright_os_install_request.budgets.identity.attempts | int }}'

- name: Refuse an installation the machine never proved
  ansible.builtin.assert:
    that:
      - managedos_install_anaconda_answered | default(false)
      - managedos_install_anaconda_marker | default('') | string | trim | length > 0
    fail_msg: >-
      the machine never answered with an install marker through its own
      identity channel within
      {{ bootwright_os_install_request.budgets.identity.attempts }} attempts over
      {{ (bootwright_os_install_request.budgets.identity.attempts | int)
         * (bootwright_os_install_request.budgets.identity.delaySeconds | int) }} seconds, so this
      installation is unproved
    quiet: true
