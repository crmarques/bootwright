---
- name: Wait for the fleet account to answer on the key the machine reported
  ansible.builtin.include_tasks: reachable.yml
  vars:
    managedos_install_anaconda_reachable_retries: '{{ bootwright_os_install_request.budgets.reachability.attempts | int }}'
    managedos_install_anaconda_reachable_pause: '{{ bootwright_os_install_request.budgets.reachability.delaySeconds | int }}'

# The attempt itself is censored, because its command line names the fleet
# identity and its output is the machine's own. The refusal is not: an exit
# status, an address and a budget name what failed without disclosing any of
# them, and without those an exhausted wait reports nothing to act on.
- name: Refuse an installation whose fleet account never answered
  ansible.builtin.fail:
    msg: >-
      {{ bootwright_os_install_request.user }}@{{ bootwright_os_install_request.address }}
      did not answer on the host key the machine reported, after
      {{ bootwright_os_install_request.budgets.reachability.attempts }} attempts over
      {{ (bootwright_os_install_request.budgets.reachability.attempts | int)
         * (bootwright_os_install_request.budgets.reachability.delaySeconds | int) }} seconds; the last
      ssh exit status was
      {{ managedos_install_anaconda_reachable.rc | default('none') }}
  when: managedos_install_anaconda_reachable.rc | default(1) != 0
