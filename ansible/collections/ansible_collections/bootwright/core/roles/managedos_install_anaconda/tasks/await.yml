---
# The installer owns the machine until it powers it off, which is the only
# signal that the disk is written. That wait is the longest in the whole
# lifecycle and it is reported under its own group, because an operator reading
# a progress row cannot otherwise tell a machine that is installing from one
# that is wedged. Its budget is the request's own, which the run's deadline
# covers. A read the controller does not answer is a machine not yet seen off,
# so it spends one attempt of that budget rather than ending the wait. The
# installed disk is then booted through the substrate's disk-boot entry point,
# selected by the frozen request's own substrate.
- name: Wait for the installer to power the machine off when it is done
  ansible.builtin.include_role:
    name: bootwright.core.substrate_machine
    tasks_from: state_read
  vars:
    bootwright_machine_arm: '{{ bootwright_os_install_request.target.substrate }}'
    bootwright_machine_port: >-
      {{ managedos_install_anaconda_port_access | combine({'media': false,
         'retries': bootwright_os_install_request.budgets.installer.attempts | int,
         'delay': bootwright_os_install_request.budgets.installer.delaySeconds | int,
         'expected_power': 'Off'}) }}

- name: Retain the machine port answer
  ansible.builtin.set_fact:
    managedos_install_anaconda_installer: "{{ substrate_machine_port_result }}"
  no_log: true

# ansible-core keeps nothing of a failure under no_log but that it failed, so
# what ended the wait is reported here, where no credential is: the power
# state the controller last reported, or its own refusal of the last read.
- name: Stop at an installer that did not finish within its budget
  ansible.builtin.assert:
    that:
      - (managedos_install_anaconda_installer.power | default('')) == 'Off'
    fail_msg: >-
      the installer did not power Machine {{ bootwright_os_install_request.identity.object }}
      off within its budget of {{ bootwright_os_install_request.budgets.installer.attempts | int }}
      attempts {{ bootwright_os_install_request.budgets.installer.delaySeconds | int }} seconds apart;
      its management controller last answered
      {{ ('power ' ~ (managedos_install_anaconda_installer.power | string | bootwright.core.printable)[:32])
         if managedos_install_anaconda_installer.power is defined
         else (managedos_install_anaconda_installer.msg | default('') | string | bootwright.core.printable)[:512] }}
    quiet: true

- name: Eject the installer image now that the installation is written
  ansible.builtin.include_role:
    name: bootwright.core.substrate_machine
    tasks_from: media_eject
  vars:
    bootwright_machine_arm: '{{ bootwright_os_install_request.target.substrate }}'
    bootwright_machine_port: >-
      {{ managedos_install_anaconda_port_access | combine({'restore_verification': managedos_install_anaconda_media_trust.restoreVerification,
         'remove_certificate': managedos_install_anaconda_media_trust.removeCertificate,
         'certificate': bootwright_os_install_material.artifactCertificate | default('')}) }}

- name: Retain the machine port answer
  ansible.builtin.set_fact:
    managedos_install_anaconda_released: "{{ substrate_machine_port_result }}"
  no_log: true

- name: Stop at an eject the management controller did not complete
  ansible.builtin.assert:
    that:
      - managedos_install_anaconda_released.msg is not defined
    fail_msg: >-
      ejecting the installer image from Machine {{ bootwright_os_install_request.identity.object }}
      failed:
      {{ (managedos_install_anaconda_released.msg | default('') | string | bootwright.core.printable)[:512] }}
    quiet: true

- name: Boot the installed disk of a machine this substrate created
  ansible.builtin.include_role:
    name: bootwright.core.substrate_machine
    tasks_from: boot_disk
  vars:
    bootwright_machine_arm: '{{ bootwright_os_install_request.target.substrate }}'
    bootwright_machine_port:
      endpoint: '{{ managedos_install_anaconda_endpoint }}'
      verify: '{{ managedos_install_anaconda_verify }}'
      ca: '{{ managedos_install_anaconda_controller_ca }}'
      user: '{{ bootwright_os_install_material.controllerUser }}'
      password: '{{ bootwright_os_install_material.controllerPassword }}'
      power_on: true
