---
# The installer owns the machine until it powers it off, which is the only
# signal that the disk is written. That wait is the longest in the whole
# lifecycle and it is reported under its own group, because an operator reading
# a progress row cannot otherwise tell a machine that is installing from one
# that is wedged. Its budget is the request's own, which the run's deadline
# covers.
- name: Wait for the installer to power the machine off when it is done
  bootwright.core.redfish_boot:
    endpoint: '{{ managedos_install_anaconda_endpoint }}'
    user: '{{ lookup("ansible.builtin.file", bootwright_os_install_material.controllerUser) }}'
    password: '{{ lookup("ansible.builtin.file", bootwright_os_install_material.controllerPassword) }}'
    verify: '{{ managedos_install_anaconda_verify }}'
    operation: read
  register: managedos_install_anaconda_installer
  retries: '{{ bootwright_os_install_request.budgets.installer.attempts | int }}'
  delay: '{{ bootwright_os_install_request.budgets.installer.delaySeconds | int }}'
  until: managedos_install_anaconda_installer.power == 'Off'
  no_log: true

- name: Eject the installer image now that the installation is written
  bootwright.core.redfish_boot:
    endpoint: '{{ managedos_install_anaconda_endpoint }}'
    user: '{{ lookup("ansible.builtin.file", bootwright_os_install_material.controllerUser) }}'
    password: '{{ lookup("ansible.builtin.file", bootwright_os_install_material.controllerPassword) }}'
    verify: '{{ managedos_install_anaconda_verify }}'
    operation: eject
  no_log: true

- name: Select the installed disk as the boot device
  bootwright.core.redfish_boot:
    endpoint: '{{ managedos_install_anaconda_endpoint }}'
    user: '{{ lookup("ansible.builtin.file", bootwright_os_install_material.controllerUser) }}'
    password: '{{ lookup("ansible.builtin.file", bootwright_os_install_material.controllerPassword) }}'
    verify: '{{ managedos_install_anaconda_verify }}'
    operation: boot
    target: Hdd
  no_log: true

- name: Power the installed system on and poll it to running
  bootwright.core.redfish_boot:
    endpoint: '{{ managedos_install_anaconda_endpoint }}'
    user: '{{ lookup("ansible.builtin.file", bootwright_os_install_material.controllerUser) }}'
    password: '{{ lookup("ansible.builtin.file", bootwright_os_install_material.controllerPassword) }}'
    verify: '{{ managedos_install_anaconda_verify }}'
    operation: power-on
  no_log: true
