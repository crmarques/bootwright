---
# The identity operation belongs to the substrate that realized the machine:
# its identity entry point, dispatched by the frozen request's own arm, so
# authored data can never choose which one runs, with every input passed
# explicitly rather than inherited from a shared fact. An arm the substrate has
# no machine port for refuses there, before any answer is taken: falling
# through would read as a machine that never answered, which is what lets an
# installation proceed.
- name: Read the machine through its substrate's identity channel
  ansible.builtin.include_role:
    name: bootwright.core.substrate_machine
    tasks_from: identity_read
  vars:
    bootwright_machine_arm: '{{ bootwright_os_install_request.target.substrate }}'
    bootwright_machine_identity:
      uri: '{{ bootwright_os_install_request.target.uri | default("") }}'
      domain: '{{ bootwright_os_install_request.target.domain | default("") }}'
      address: '{{ bootwright_os_install_request.address }}'
      user: '{{ bootwright_os_install_request.user }}'
      file: '{{ bootwright_os_install_material.fleetIdentity }}'
      key: '{{ bootwright_os_install_material.hostKey | default("") }}'
      marker_path: '{{ bootwright_os_install_request.markerPath }}'
      host_key_path: '{{ bootwright_os_install_request.hostKeyPath }}'
      work: '{{ managedos_install_anaconda_scratch }}'
      retries: '{{ managedos_install_anaconda_identity_retries | default(0) | int }}'
      delay: '{{ bootwright_os_install_request.budgets.identity.delaySeconds | int }}'

# Whichever channel answered, the installation reads one answer under its own
# names and never learns which mechanism produced it.
- name: Take the answer this machine's channel produced
  ansible.builtin.set_fact:
    managedos_install_anaconda_answered: '{{ substrate_machine_identity_answered | default(false) }}'
    managedos_install_anaconda_marker: "{{ substrate_machine_identity_marker | default('') }}"
    managedos_install_anaconda_host_key: "{{ substrate_machine_identity_host_key | default('') }}"
  changed_when: false
