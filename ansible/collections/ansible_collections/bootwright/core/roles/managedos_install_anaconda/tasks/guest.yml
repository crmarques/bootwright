---
# One fixed command on the installed machine as the fleet account, pinned to
# exactly the key its identity channel reported, over the session the
# collection's guest session builder opens for every pinned connection, so a
# command here never trusts a first-use answer and no task file writes an ssh
# option.
#
# The caller names the command as a list of argv words and may give it
# standard input, the only way a document or marker reaches the machine. The
# caller owns the budget, as templates of frozen budgets, and may name the
# seconds one attempt may take; a command that outruns them answers no exit
# status and names the timeout, so the caller's own step fails on it. Every
# attempt is a new connection; the result is censored and the caller names
# what failed.
- name: Open the pinned connection to the installed machine
  bootwright.core.managedos_guest_session:
    state: present
    directory: '{{ managedos_install_anaconda_scratch }}'
    address: '{{ bootwright_os_install_request.address }}'
    host_key: '{{ managedos_install_anaconda_host_key }}'
  register: managedos_install_anaconda_guest_session

- name: Run the fixed command as the fleet account on that exact key
  bootwright.core.managedos_guest_command:
    address: '{{ bootwright_os_install_request.address }}'
    user: '{{ bootwright_os_install_request.user }}'
    identity: '{{ bootwright_os_install_material.fleetIdentity }}'
    ssh_config: '{{ managedos_install_anaconda_guest_session.ssh_config }}'
    known_hosts: '{{ managedos_install_anaconda_guest_session.known_hosts }}'
    host_key_algorithms: '{{ managedos_install_anaconda_guest_session.host_key_algorithms }}'
    policy_host_key_algorithms: '{{ managedos_install_anaconda_guest_session.policy_host_key_algorithms }}'
    argv: '{{ managedos_install_anaconda_guest_command }}'
    stdin: '{{ managedos_install_anaconda_guest_stdin | default(omit) }}'
    timeout: '{{ managedos_install_anaconda_guest_timeout | default(managedos_install_anaconda_guest_seconds) | int }}'
  register: managedos_install_anaconda_guest
  retries: '{{ managedos_install_anaconda_guest_retries | default(0) | int }}'
  delay: '{{ managedos_install_anaconda_guest_pause | default(1) | int }}'
  until: managedos_install_anaconda_guest.rc | default(1) == 0
         or (managedos_install_anaconda_guest.attempts | default(1) | int)
            > (managedos_install_anaconda_guest_retries | default(0) | int)
  failed_when: false
  changed_when: false
  no_log: true

- name: Close the pinned connection to the installed machine
  bootwright.core.managedos_guest_session:
    state: absent
    directory: '{{ managedos_install_anaconda_scratch }}'
