---
- name: Validate the frozen installation request
  ansible.builtin.assert:
    that:
      - bootwright_os_install_request.version == 'os-install-anaconda-v3'
      - bootwright_os_install_request.image.path.startswith('/var/lib/bootwright-services/')
      - bootwright_os_install_request.markerPath == '/etc/bootwright/install-marker.json'
      - bootwright_os_install_request.hostKeyPath == '/etc/bootwright/host-key.pub'
      - bootwright_os_install_digest is match('[0-9a-f]{64}')
    quiet: true
  no_log: true

- name: Complete the qualified execution handoff
  bootwright.core.managedos_install_protocol:
    phase: loaded
  no_log: true

# The boot and identity task files bind the frozen substrate and identity
# channel only after the tree, the image and any private key are published. A
# target neither of them binds refuses here, before the first of those effects,
# and each of those files keeps its own refusal as well.
- name: Refuse a target this installation has no boot or identity binding for
  ansible.builtin.assert:
    that:
      - bootwright_os_install_request.target.substrate in ['libvirt', 'baremetal']
      - bootwright_os_install_request.target.channel in ['guest-agent', 'delivered-key']
    fail_msg: >-
      Machine {{ bootwright_os_install_request.identity.object }} names substrate
      {{ bootwright_os_install_request.target.substrate }} and identity channel
      {{ bootwright_os_install_request.target.channel }}, but this installation
      binds only the libvirt and baremetal substrates and the guest-agent and
      delivered-key channels, so nothing was published or booted; plan the
      installation again with this release
    quiet: true

- name: Report package tree publication
  bootwright.core.managedos_install_protocol:
    phase: group
    group: publish-tree
    status: running
  no_log: true

# The tooling is a context prerequisite the controller stage installs on the
# Machine this installation publishes through, so this block proves it and
# installs nothing. Failing here names the command that supplies it.
- name: Prove the tooling that builds an installer image and extracts a tree
  ansible.builtin.stat:
    path: '{{ item }}'
  loop: '{{ managedos_install_anaconda_tooling }}'
  register: managedos_install_anaconda_tooling_present

- name: Refuse an installation whose image-building tooling was never installed
  ansible.builtin.fail:
    msg: >-
      {{ item.item }} is not installed on the Machine this installation
      publishes through; run bootwright apply --stage controller before it
  loop: '{{ managedos_install_anaconda_tooling_present.results }}'
  loop_control:
    label: '{{ item.item }}'
  when: not item.stat.exists

- name: Prove every store entry this installation names is present
  ansible.builtin.stat:
    path: '{{ item }}'
  loop: '{{ managedos_install_anaconda_required_media }}'
  register: managedos_install_anaconda_media_present

- name: Refuse a store entry this installation cannot use
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg
    fail_msg: an installer image this operation froze is not in the host media store
    quiet: true
  loop: '{{ managedos_install_anaconda_media_present.results }}'
  loop_control:
    label: '{{ item.item }}'

- name: Observe what this installation has already published
  bootwright.core.managedos_install_inspect:
    request: '{{ bootwright_os_install_request }}'
  register: managedos_install_anaconda_before

- name: Create the work directory this attempt owns
  ansible.builtin.file:
    path: '{{ managedos_install_anaconda_work }}'
    state: directory
    owner: root
    group: root
    mode: '0700'
  changed_when: false

- name: Create the published tree's parent directory
  ansible.builtin.file:
    path: '{{ bootwright_os_install_request.tree.path | dirname }}'
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: managedos_install_anaconda_publish_tree | bool

- name: Extract the package tree beside its published location
  ansible.builtin.command:
    argv:
      - /usr/bin/xorriso
      - -osirrox
      - 'on'
      - -indev
      - '{{ managedos_install_anaconda_tree_media }}'
      - -extract
      - /
      - '{{ managedos_install_anaconda_staged_tree }}'
  when: managedos_install_anaconda_publish_tree | bool
  register: managedos_install_anaconda_extracted
  changed_when: true

- name: Label the staged tree so the serving process can read it
  ansible.builtin.command:
    argv:
      - /usr/bin/chcon
      - --recursive
      - --reference
      - '{{ bootwright_os_install_request.image.path | dirname | dirname }}'
      - '{{ managedos_install_anaconda_staged_tree }}'
  when: managedos_install_anaconda_publish_tree | bool
  changed_when: true

- name: Publish the package tree by atomic rename
  ansible.builtin.command:
    argv:
      - /usr/bin/mv
      - --no-target-directory
      - '{{ managedos_install_anaconda_staged_tree }}'
      - '{{ bootwright_os_install_request.tree.path }}'
  when: managedos_install_anaconda_publish_tree | bool
  changed_when: true

- name: Report package tree publication completion
  bootwright.core.managedos_install_protocol:
    phase: group
    group: publish-tree
    status: ok
  no_log: true

- name: Report installer image construction
  bootwright.core.managedos_install_protocol:
    phase: group
    group: build-image
    status: running
  no_log: true

# The unguessable segment is minted here, by the attempt, so it exists in no
# frozen request and reaches no evidence, progress line or log.
- name: Mint the unguessable directory this attempt publishes private material in
  ansible.builtin.command:
    argv:
      - /usr/bin/openssl
      - rand
      - -hex
      - '32'
  register: managedos_install_anaconda_token
  when: managedos_install_anaconda_delivers_key | bool
  changed_when: false
  no_log: true

- name: Publish the host key only this machine may read
  ansible.builtin.include_tasks: private.yml
  when: managedos_install_anaconda_delivers_key | bool

- name: Render the frozen kickstart with the values this attempt derived
  ansible.builtin.copy:
    content: >-
      {{ bootwright_os_install_request.kickstart
         | replace('@@BOOTWRIGHT_MARKER@@', bootwright_os_install_material.marker)
         | replace('@@BOOTWRIGHT_AUTHORIZED_KEY@@', bootwright_os_install_material.authorizedKey)
         | replace('@@BOOTWRIGHT_PRIVATE_URL@@', managedos_install_anaconda_private_url)
         | replace('@@BOOTWRIGHT_ARTIFACT_CERTIFICATE@@', managedos_install_anaconda_certificate) }}
    dest: '{{ managedos_install_anaconda_work }}/ks.cfg'
    owner: root
    group: root
    mode: '0600'
  changed_when: true
  no_log: true

- name: Create the published image directory
  ansible.builtin.file:
    path: '{{ managedos_install_anaconda_image_dir }}'
    state: directory
    owner: root
    group: root
    mode: '0755'
  register: managedos_install_anaconda_image_directory

- name: Build this machine's own installer image
  ansible.builtin.command:
    argv:
      - /usr/bin/mkksiso
      - --ks
      - '{{ managedos_install_anaconda_work }}/ks.cfg'
      - --rm-args
      - rd.live.check
      - '{{ managedos_install_anaconda_boot_media }}'
      - '{{ managedos_install_anaconda_work }}/install.iso'
  register: managedos_install_anaconda_built
  changed_when: true

- name: Label the built image so the serving process can read it
  ansible.builtin.command:
    argv:
      - /usr/bin/chcon
      - --reference
      - '{{ managedos_install_anaconda_image_dir | dirname }}'
      - '{{ managedos_install_anaconda_work }}/install.iso'
  changed_when: false

- name: Publish the installer image by atomic rename
  ansible.builtin.command:
    argv:
      - /usr/bin/mv
      - --no-target-directory
      - '{{ managedos_install_anaconda_work }}/install.iso'
      - '{{ bootwright_os_install_request.image.path }}'
  changed_when: true

- name: Report installer image completion
  bootwright.core.managedos_install_protocol:
    phase: group
    group: build-image
    status: ok
  no_log: true

- name: Report installer boot
  bootwright.core.managedos_install_protocol:
    phase: group
    group: boot-installer
    status: running
  no_log: true

- name: Read what the machine already holds, so a replay boots nothing
  ansible.builtin.include_tasks: identity.yml

- name: Refuse a machine that answers with another installation
  ansible.builtin.assert:
    that:
      - not (managedos_install_anaconda_answered | default(false))
        or managedos_install_anaconda_marker | default('') | length == 0
        or managedos_install_anaconda_marker == bootwright_os_install_material.marker
    fail_msg: the machine holds another installation, and there is no reinstall path
    quiet: true
  no_log: true

- name: Boot the machine from its own installer image
  ansible.builtin.include_tasks: boot.yml
  when: not (managedos_install_anaconda_installed | bool)

- name: Report installer boot completion
  bootwright.core.managedos_install_protocol:
    phase: group
    group: boot-installer
    status: ok
  no_log: true

- name: Report the installation the machine is writing
  bootwright.core.managedos_install_protocol:
    phase: group
    group: await-installation
    status: running
  no_log: true

- name: Wait for the installer to write the disk and boot what it installed
  ansible.builtin.include_tasks: await.yml
  when: not (managedos_install_anaconda_installed | bool)

- name: Report installation completion
  bootwright.core.managedos_install_protocol:
    phase: group
    group: await-installation
    status: ok
  no_log: true

- name: Report the wait for the installed machine to answer
  bootwright.core.managedos_install_protocol:
    phase: group
    group: await-machine
    status: running
  no_log: true

- name: Read the installation the machine now holds, through its own channel
  ansible.builtin.include_tasks: identity_until_answered.yml

- name: Report that the installed machine answered
  bootwright.core.managedos_install_protocol:
    phase: group
    group: await-machine
    status: ok
  no_log: true

- name: Report installation verification
  bootwright.core.managedos_install_protocol:
    phase: group
    group: verify-installation
    status: running
  no_log: true

- name: Eject any installer media still inserted and read the machine's power
  bootwright.core.redfish_boot:
    endpoint: '{{ managedos_install_anaconda_endpoint }}'
    user: '{{ lookup("ansible.builtin.file", bootwright_os_install_material.controllerUser) }}'
    password: '{{ lookup("ansible.builtin.file", bootwright_os_install_material.controllerPassword) }}'
    verify: '{{ managedos_install_anaconda_verify }}'
    operation: eject
  register: managedos_install_anaconda_ejected
  no_log: true

- name: Prove the installed machine answers on the exact key it reported
  ansible.builtin.include_tasks: verify.yml

- name: Report installation verification completion
  bootwright.core.managedos_install_protocol:
    phase: group
    group: verify-installation
    status: ok
  no_log: true

- name: Prove everything this installation publishes is in place
  bootwright.core.managedos_install_inspect:
    request: '{{ bootwright_os_install_request }}'
  register: managedos_install_anaconda_after

# Material that only needed to exist for one boot does not outlive it.
- name: Withdraw the private material now that the machine has it
  ansible.builtin.file:
    path: '{{ managedos_install_anaconda_private_root }}'
    state: absent
  when: managedos_install_anaconda_delivers_key | bool
  changed_when: managedos_install_anaconda_delivers_key | bool

- name: Remove the work directory and the rendered kickstart with it
  ansible.builtin.file:
    path: '{{ managedos_install_anaconda_work }}'
    state: absent
  changed_when: false

- name: Publish bounded installation completion evidence
  bootwright.core.managedos_install_protocol:
    phase: completed
    outcome: >-
      {{ 'unchanged' if managedos_install_anaconda_installed | bool else 'changed' }}
    digest: '{{ bootwright_os_install_digest }}'
    observation: '{{ managedos_install_anaconda_after.observation }}'
    marker: '{{ managedos_install_anaconda_marker }}'
    hostKey: '{{ managedos_install_anaconda_host_key }}'
    reachable: '{{ managedos_install_anaconda_reachable.rc | default(1) == 0 }}'
    address: '{{ bootwright_os_install_request.address }}'
    media: '{{ managedos_install_anaconda_ejected.media }}'
    power: '{{ managedos_install_anaconda_ejected.power }}'
  no_log: true
