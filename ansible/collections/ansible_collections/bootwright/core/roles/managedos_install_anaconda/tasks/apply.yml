---
- name: Validate the frozen installation request
  ansible.builtin.assert:
    that:
      - bootwright_os_install_request.version == 'os-install-anaconda-v21'
      - bootwright_os_install_request.identity.context is match('^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$')
      - bootwright_os_install_request.identity.object is match('^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$')
      - managedos_install_anaconda_work == '/var/lib/bootwright-install/'
        ~ bootwright_os_install_request.identity.context ~ '/' ~ bootwright_os_install_request.identity.object ~ '/work'
      - (bootwright_os_install_request.image is defined) != (bootwright_os_install_request.private is defined)
      - (bootwright_os_install_request.image.path if bootwright_os_install_request.image is defined
         else bootwright_os_install_request.private.path).startswith('/var/lib/bootwright-services/')
      - bootwright_os_install_request.markerPath == '/etc/bootwright/install-marker.json'
      - bootwright_os_install_request.hostKeyPath == '/etc/bootwright/host-key.pub'
      - bootwright_os_install_digest is match('[0-9a-f]{64}')
      - bootwright_os_install_request.network.documentPath == '/etc/bootwright/network.yml'
      - bootwright_os_install_request.network.markerPath == '/etc/bootwright/network-marker.json'
      - bootwright_os_install_request.network.checkpointSeconds | int > 0
      - bootwright_os_install_request.network.document is mapping
      - "'update' not in bootwright_os_install_request
        or (bootwright_os_install_request['update'].policy == 'withinRelease'
            and bootwright_os_install_request['update'].release is match('^(0|[1-9][0-9]*)[.](0|[1-9][0-9]*)$'))"
    quiet: true
  no_log: true

- name: Complete the qualified execution handoff
  bootwright.core.managedos_install_protocol:
    phase: loaded
  no_log: true

# The boot, await and identity task files reach the frozen substrate only after
# the tree, the image and any private key are published, and await.yml only
# after the installer wait and the eject. A target whose arm the substrate has
# no machine port for refuses here, before the first of those effects; the
# substrate's own dispatch refuses it again at each entry point.
- name: Refuse a target the substrate has no machine port for
  ansible.builtin.include_role:
    name: bootwright.core.substrate_machine
    tasks_from: admit
  vars:
    bootwright_machine_arm: '{{ bootwright_os_install_request.target.substrate }}'

- name: Refuse an identity channel this installation does not read
  ansible.builtin.assert:
    that:
      - bootwright_os_install_request.target.channel in ['guest-agent', 'delivered-key']
    fail_msg: >-
      Machine {{ bootwright_os_install_request.identity.object }} names identity
      channel {{ bootwright_os_install_request.target.channel }}, which this
      installation does not read, so nothing was published or booted; plan the
      installation again with this release
    quiet: true

- name: Refuse bound keys excluded by this placement host before installation effects
  block:
    - name: Check the actual bound key types on this SSH placement host
      bootwright.core.ssh_key_policy:
        keys: >-
          {{ [{'secret': bootwright_os_install_request.fleetKeyRef,
               'type': bootwright_os_install_material.fleetKeyType, 'usage': 'fleet'}]
             + ([{'secret': bootwright_os_install_request.target.hostKeyRef,
                  'type': bootwright_os_install_material.hostKeyType, 'usage': 'host'}]
                if bootwright_os_install_request.target.channel == 'delivered-key' else [])
             + ([{'machine': bootwright_os_install_request.identity.object,
                  'type': bootwright_os_install_material.generatedHostKeyType, 'usage': 'generated'}]
                if bootwright_os_install_request.target.channel == 'guest-agent' else []) }}
  rescue:
    - name: Name the bounded SSH policy refusal to the installation runner
      bootwright.core.managedos_install_protocol:
        phase: refused
        reason: '{{ ansible_failed_result.reason | default("ssh-policy-unavailable") }}'
      no_log: true

    - name: Refuse installation before publication or boot
      ansible.builtin.fail:
        msg: The placement host SSH policy did not admit this installation's bound keys

- name: Prove each ancestor of this Machine's durable work area
  ansible.builtin.include_tasks: work.yml
  loop:
    - '{{ managedos_install_anaconda_work_parent }}'
    - '{{ managedos_install_anaconda_work | dirname | dirname }}'
    - '{{ managedos_install_anaconda_work | dirname }}'
  loop_control:
    loop_var: managedos_install_anaconda_work_ancestor
  vars:
    managedos_install_anaconda_work_create: true

- name: Install through this invocation's private connection files
  block:
    - name: Prepare private connection files
      bootwright.core.lifecycle_scratch:
        root: '{{ bootwright_run_scratch }}'
        scope: managedos-install
      register: managedos_install_anaconda_scratch_ready

    - name: Report package tree publication
      bootwright.core.managedos_install_protocol:
        phase: group
        group: check-tree
        status: running
      no_log: true

    # The tooling is a context prerequisite the controller stage installs on the
    # Machine this installation publishes through, so this block proves it and
    # installs nothing. Failing here names the command that supplies it.
    - name: Prove the tooling that builds an installer image and extracts a tree
      ansible.builtin.stat:
        path: '{{ item }}'
      loop: '{{ managedos_install_anaconda_tooling }}'
      register: managedos_install_anaconda_tooling_present

    - name: Refuse an installation whose image-building tooling was never installed
      ansible.builtin.fail:
        msg: >-
          {{ item.item }} is not installed on the Machine this installation
          publishes through; run bootwright apply --stage controller before it
      loop: '{{ managedos_install_anaconda_tooling_present.results }}'
      loop_control:
        label: '{{ item.item }}'
      when: not item.stat.exists

    # The plan froze each store entry's size and SHA-256 from its record. An entry
    # deleted, replaced or damaged since is refused here, before the image build
    # first reads it.
    - name: Read the size and SHA-256 of every store entry this installation names
      ansible.builtin.stat:
        path: '{{ item.path }}'
        get_checksum: true
        checksum_algorithm: sha256
      loop: '{{ managedos_install_anaconda_required_media }}'
      loop_control:
        label: '{{ item.path }}'
      register: managedos_install_anaconda_media_present

    - name: Name a boot image that changed since this operation froze it
      bootwright.core.managedos_install_protocol:
        phase: refused
        reason: media-changed-boot
      when: not (managedos_install_anaconda_boot_media_unchanged | bool)
      no_log: true

    - name: Refuse a boot image that changed since this operation froze it
      ansible.builtin.fail:
        msg: >-
          {{ managedos_install_anaconda_boot_media }} differs from the size and
          SHA-256 this operation froze, so nothing was published or booted
      when: not (managedos_install_anaconda_boot_media_unchanged | bool)

    - name: Observe what this installation has already published
      bootwright.core.managedos_install_inspect:
        request: '{{ bootwright_os_install_request }}'
        staging: '{{ managedos_install_anaconda_staged_tree }}'
        work: '{{ managedos_install_anaconda_work }}'
      register: managedos_install_anaconda_before

    # An attempt killed part way leaves its work area, and mkksiso refuses to write
    # an image over one already there, so this attempt starts from none.
    - name: Clear the work area an interrupted attempt left
      ansible.builtin.file:
        path: '{{ managedos_install_anaconda_work }}'
        state: absent
      changed_when: false

    - name: Create the work directory this attempt owns
      ansible.builtin.file:
        path: '{{ managedos_install_anaconda_work }}'
        state: directory
        owner: root
        group: root
        mode: '0700'
      changed_when: false

    - name: Prove the shared package tree dependency before building or booting
      ansible.builtin.assert:
        that:
          - managedos_install_anaconda_before.observation.tree | bool
          - managedos_install_anaconda_before.observation.treeIdentity == bootwright_os_install_request.treeMedia.sha256
        quiet: true
      when: bootwright_os_install_request.tree is defined

    - name: Report package tree publication completion
      bootwright.core.managedos_install_protocol:
        phase: group
        group: check-tree
        status: ok
      no_log: true

    - name: Report installer image construction
      bootwright.core.managedos_install_protocol:
        phase: group
        group: build-image
        status: running
      no_log: true

    # An earlier attempt that failed leaves its private image and material beneath
    # a directory whose token this attempt does not know, so the whole subtree is
    # cleared before a new one is minted; private.yml creates it again.
    - name: Clear whatever an earlier attempt published privately
      ansible.builtin.file:
        path: '{{ managedos_install_anaconda_private_root }}'
        state: absent
      when: managedos_install_anaconda_delivers_private | bool

    # The unguessable segment is minted here, by the attempt, so it exists in no
    # frozen request and reaches no evidence, progress line or log.
    - name: Mint the unguessable directory this attempt publishes private material in
      ansible.builtin.command:
        argv:
          - /usr/bin/openssl
          - rand
          - -hex
          - '32'
      register: managedos_install_anaconda_token
      when: managedos_install_anaconda_delivers_private | bool
      changed_when: false
      no_log: true

    - name: Publish the private material only this machine may read
      ansible.builtin.include_tasks: private.yml
      when: managedos_install_anaconda_delivers_private | bool

    # The rendered kickstart reaches the execution host inside the module's own
    # argument, never in a file transfer.
    - name: Render the frozen kickstart with the values this attempt derived
      bootwright.core.private_file:
        content: >-
          {{ bootwright_os_install_request.kickstart
             | replace('@@BOOTWRIGHT_MARKER@@', bootwright_os_install_material.marker)
             | replace('@@BOOTWRIGHT_AUTHORIZED_KEY@@', bootwright_os_install_material.authorizedKey)
             | replace('@@BOOTWRIGHT_PRIVATE_URL@@', managedos_install_anaconda_private_url)
             | replace('@@BOOTWRIGHT_ARTIFACT_CERTIFICATE@@', managedos_install_anaconda_certificate) }}
        path: '{{ managedos_install_anaconda_work }}/ks.cfg'
      changed_when: true
      no_log: true
      diff: false

    - name: Create the published image directory
      ansible.builtin.file:
        path: '{{ managedos_install_anaconda_image_dir }}'
        state: directory
        owner: root
        group: root
        mode: '0755'
      when: not (managedos_install_anaconda_delivers_private | bool)
      register: managedos_install_anaconda_image_directory

    - name: Build this machine's own installer image
      ansible.builtin.command:
        argv:
          - /usr/bin/mkksiso
          - --ks
          - '{{ managedos_install_anaconda_work }}/ks.cfg'
          - --cmdline
          - '{{ bootwright_os_install_request.installerArguments | join(" ") }}'
          - --rm-args
          - rd.live.check
          - '{{ managedos_install_anaconda_boot_media }}'
          - '{{ managedos_install_anaconda_work }}/install.iso'
      register: managedos_install_anaconda_built
      changed_when: true

    # The server's workers run as the image's application user in group root
    # (infra_artifact_server_nginx/templates/nginx.conf.j2), so the group grants
    # them read and nothing is granted to any other account.
    - name: Keep the built installer image readable only by the serving process
      ansible.builtin.file:
        path: '{{ managedos_install_anaconda_work }}/install.iso'
        state: file
        owner: root
        group: root
        mode: '0640'
      no_log: true

    - name: Label the built image so the serving process can read it
      ansible.builtin.command:
        argv:
          - /usr/bin/chcon
          - --reference
          - '{{ managedos_install_anaconda_served_root }}'
          - '{{ managedos_install_anaconda_work }}/install.iso'
      changed_when: false

    # A private Machine's image is published into the unguessable directory
    # beside its material, because its Kickstart names that directory's URL.
    - name: Publish the installer image by atomic rename
      ansible.builtin.command:
        argv:
          - /usr/bin/mv
          - --no-target-directory
          - '{{ managedos_install_anaconda_work }}/install.iso'
          - '{{ managedos_install_anaconda_image_path }}'
      changed_when: true
      no_log: '{{ managedos_install_anaconda_delivers_private | bool }}'

    # Before any machine is given the image, the block fetches its first byte, and
    # the first byte of the tree's marker, through the listener a consumer uses:
    # never through a proxy, never following a redirect, and verifying an https
    # listener against the serving certificate bound to this operation. A public
    # image's URL carries no token.
    - name: Fetch the first byte of the installer image through its listener
      ansible.builtin.uri:
        url: '{{ bootwright_os_install_request.image.url }}'
        method: GET
        headers:
          Range: bytes=0-0
        ca_path: >-
          {{ bootwright_os_install_material.imageCertificate
             if bootwright_os_install_request.image.url is match('https://') else omit }}
        validate_certs: true
        use_proxy: false
        follow_redirects: none
        status_code: [200, 206]
        timeout: 30
      register: managedos_install_anaconda_image_fetch
      when: not (managedos_install_anaconda_delivers_private | bool)
      failed_when: false
      changed_when: false

    - name: Refuse an installer image its listener does not serve
      ansible.builtin.fail:
        msg: >-
          {{ bootwright_os_install_request.image.url }} could not be fetched through
          its artifact server listener, which answered
          {{ managedos_install_anaconda_image_fetch.status | default(-1) | int }}
          {{ ((managedos_install_anaconda_image_fetch.msg | default('') | string).splitlines() | first | default('')
              | bootwright.core.printable)[:512] }},
          so no machine was given media
      when:
        - not (managedos_install_anaconda_delivers_private | bool)
        - managedos_install_anaconda_image_fetch.status | default(-1) | int not in [200, 206]

    # A private Machine's controller is given the image and a delivered-key
    # installer fetches the key pair, all at URLs carrying the token, so each is
    # proved the same way before any media is inserted: a key the installer could
    # not fetch would otherwise fail %post after the disk was cleared. The
    # recovery passphrase is proved the same way when the boot publishes it. Each
    # result carries the token, so it is judged in a separate step that names
    # only the file and the cause.
    - name: Fetch the first byte of each private file through its listener
      ansible.builtin.uri:
        url: '{{ managedos_install_anaconda_private_url }}/{{ item }}'
        method: GET
        headers:
          Range: bytes=0-0
        ca_path: '{{ bootwright_os_install_material.artifactCertificate }}'
        validate_certs: true
        use_proxy: false
        follow_redirects: none
        status_code: [200, 206]
        timeout: 30
      loop: '{{ managedos_install_anaconda_private_files }}'
      register: managedos_install_anaconda_private_fetch
      when: managedos_install_anaconda_delivers_private | bool
      failed_when: false
      changed_when: false
      no_log: true

    - name: Refuse a private file the listener does not serve
      ansible.builtin.fail:
        msg: >-
          the private {{ managedos_install_anaconda_private_file }} could not be
          fetched through its artifact server listener, so no machine was given
          media:
          {{ 'the listener answered 403, so the worker it serves as cannot read it'
             if managedos_install_anaconda_private_status == 403 else
             'the listener answered 404, so the worker it serves as finds nothing at the path this attempt published'
             if managedos_install_anaconda_private_status == 404 else
             ('its certificate did not verify against the serving certificate Secret '
              ~ bootwright_os_install_request.tlsCertificateRef ~ ' holds: ' ~ managedos_install_anaconda_private_cause)
             if managedos_install_anaconda_private_cause is search('CERTIFICATE_VERIFY_FAILED|certificate verify failed') else
             ('the request failed before any status line: ' ~ managedos_install_anaconda_private_cause)
             if managedos_install_anaconda_private_status == -1 else
             ('the listener answered ' ~ managedos_install_anaconda_private_status ~ ' where 200 or 206 was expected') }}
      vars:
        managedos_install_anaconda_private_file: '{{ managedos_install_anaconda_private_files[managedos_install_anaconda_private_index] }}'
        managedos_install_anaconda_private_result: >-
          {{ managedos_install_anaconda_private_fetch.results[managedos_install_anaconda_private_index] }}
        managedos_install_anaconda_private_status: '{{ managedos_install_anaconda_private_result.status | default(-1) | int }}'
        managedos_install_anaconda_private_cause: >-
          {{ ((managedos_install_anaconda_private_result.msg | default('the request recorded no result') | string)
              | replace(managedos_install_anaconda_token.stdout | trim, '<token>')
              | bootwright.core.printable)[:512] }}
      loop: '{{ range(managedos_install_anaconda_private_files | length) | list }}'
      loop_control:
        loop_var: managedos_install_anaconda_private_index
      when:
        - managedos_install_anaconda_delivers_private | bool
        - managedos_install_anaconda_private_fetch.results[managedos_install_anaconda_private_index].status | default(-1) | int not in [200, 206]

    - name: Fetch the first byte of the package tree marker through its listener
      ansible.builtin.uri:
        url: "{{ bootwright_os_install_request.tree.url ~ '/.treeinfo' }}"
        method: GET
        headers:
          Range: bytes=0-0
        ca_path: >-
          {{ bootwright_os_install_material.treeCertificate
             if bootwright_os_install_request.tree.url is match('https://') else omit }}
        validate_certs: true
        use_proxy: false
        follow_redirects: none
        status_code: [200, 206]
        timeout: 30
      register: managedos_install_anaconda_tree_fetch
      when: bootwright_os_install_request.tree is defined
      failed_when: false
      changed_when: false

    - name: Refuse a package tree its listener does not serve
      ansible.builtin.fail:
        msg: >-
          {{ bootwright_os_install_request.tree.url }}/.treeinfo could not be fetched
          through its artifact server listener, which answered
          {{ managedos_install_anaconda_tree_fetch.status | default(-1) | int }}
          {{ ((managedos_install_anaconda_tree_fetch.msg | default('') | string).splitlines() | first | default('')
              | bootwright.core.printable)[:512] }},
          so no machine was given media
      when:
        - bootwright_os_install_request.tree is defined
        - managedos_install_anaconda_tree_fetch.status | default(-1) | int not in [200, 206]

    - name: Report installer image completion
      bootwright.core.managedos_install_protocol:
        phase: group
        group: build-image
        status: ok
      no_log: true

    - name: Report installer boot
      bootwright.core.managedos_install_protocol:
        phase: group
        group: boot-installer
        status: running
      no_log: true

    - name: Read what the machine already holds, so a replay boots nothing
      ansible.builtin.include_tasks: identity.yml

    - name: Classify a positively answered foreign installation marker
      ansible.builtin.set_fact:
        managedos_install_anaconda_foreign: >-
          {{ (managedos_install_anaconda_answered | default(false))
             and (managedos_install_anaconda_marker | default('') | length > 0)
             and managedos_install_anaconda_marker != bootwright_os_install_material.marker }}
      no_log: true

    - name: Name the foreign installation refusal to the runner
      bootwright.core.managedos_install_protocol:
        phase: refused
        reason: foreign-installation
      no_log: true
      when: managedos_install_anaconda_foreign | bool

    - name: Refuse a machine that answers with another installation
      ansible.builtin.assert:
        that:
          - not (managedos_install_anaconda_foreign | bool)
        fail_msg: The machine holds another installation, and there is no reinstall path.
        quiet: true

    # ansible-core finalizes a set_fact when it runs, so this freezes what the
    # first identity read answered. The default it reads is re-evaluated at every
    # use, and after the installer wrote the marker it would report an install
    # this apply performed as one it found.
    - name: Freeze whether the machine was already installed before this apply
      ansible.builtin.set_fact:
        managedos_install_anaconda_was_installed: '{{ managedos_install_anaconda_installed | bool }}'
      changed_when: false

    # An earlier attempt of this apply recorded this installation proved before
    # it powered the machine off (Q66), so a machine that no longer answers is
    # booted from its installed disk, never from the installer again.
    - name: Boot the installed disk of a machine this apply already proved
      ansible.builtin.include_tasks: proved_boot.yml
      when:
        - bootwright_os_install_material.installationProved | default('false') | bool
        - not (managedos_install_anaconda_was_installed | bool)

    # The substrate's pre-boot proof leaves the refusal it made in its own fact,
    # because this role, not the substrate's, holds the result channel. Naming it
    # to the runner makes the operator's diagnostic the installation's own for that
    # refusal, naming the Machine and the remedy; any other failure of the boot
    # stays the adapter's, with what refused in this run's output. The rescue ends
    # in a fail with no condition, so every failure it catches stays terminal.
    - name: Boot the machine from its own installer image
      when: not (managedos_install_anaconda_was_installed | bool)
      block:
        - name: Prove the machine, insert the image and boot it
          ansible.builtin.include_tasks: boot.yml
      rescue:
        - name: Name the substrate's refusal of the machine to the runner
          bootwright.core.managedos_install_protocol:
            phase: refused
            reason: '{{ managedos_install_anaconda_refusal }}'
          vars:
            managedos_install_anaconda_refusal: "{{ substrate_machine_refusal | default('') }}"
          when: managedos_install_anaconda_refusal | length > 0
          no_log: true

        - name: Keep any failure of the boot a failure
          ansible.builtin.fail:
            msg: >-
              Machine {{ bootwright_os_install_request.identity.object }} was not
              booted from its installer image; the failed step above names what
              refused.

    - name: Report installer boot completion
      bootwright.core.managedos_install_protocol:
        phase: group
        group: boot-installer
        status: ok
      no_log: true

    - name: Report the installation the machine is writing
      bootwright.core.managedos_install_protocol:
        phase: group
        group: await-installation
        status: running
      no_log: true

    - name: Wait for the installer to write the disk and boot what it installed
      ansible.builtin.include_tasks: await.yml
      when: not (managedos_install_anaconda_was_installed | bool)

    - name: Report installation completion
      bootwright.core.managedos_install_protocol:
        phase: group
        group: await-installation
        status: ok
      no_log: true

    - name: Report the wait for the installed machine to answer
      bootwright.core.managedos_install_protocol:
        phase: group
        group: await-machine
        status: running
      no_log: true

    - name: Read the installation the machine now holds, through its own channel
      ansible.builtin.include_tasks: identity_until_answered.yml

    - name: Report that the installed machine answered
      bootwright.core.managedos_install_protocol:
        phase: group
        group: await-machine
        status: ok
      no_log: true

    - name: Report installation verification
      bootwright.core.managedos_install_protocol:
        phase: group
        group: verify-installation
        status: running
      no_log: true

    - name: Eject any installer media still inserted and read the machine's power
      ansible.builtin.include_role:
        name: bootwright.core.substrate_machine
        tasks_from: media_eject
      vars:
        bootwright_machine_arm: '{{ bootwright_os_install_request.target.substrate }}'
        bootwright_machine_port: >-
          {{ managedos_install_anaconda_port_access | combine({'restore_verification': managedos_install_anaconda_media_trust.restoreVerification,
             'remove_certificate': managedos_install_anaconda_media_trust.removeCertificate,
             'certificate': bootwright_os_install_material.artifactCertificate | default('')}) }}

    - name: Retain the machine port answer
      ansible.builtin.set_fact:
        managedos_install_anaconda_ejected: "{{ substrate_machine_port_result }}"
      no_log: true

    # ansible-core keeps nothing of a failure under no_log but that it failed, so
    # the controller's own refusal is reported here, where no credential is.
    - name: Stop at an eject the management controller did not complete
      ansible.builtin.assert:
        that:
          - managedos_install_anaconda_ejected.msg is not defined
        fail_msg: >-
          ejecting any installer media from Machine {{ bootwright_os_install_request.identity.object }}
          and reading its power failed:
          {{ (managedos_install_anaconda_ejected.msg | default('') | string | bootwright.core.printable)[:512] }}
        quiet: true

    - name: Prove the installed machine answers on the exact key it reported
      ansible.builtin.include_tasks: verify.yml

    # The work area and the private material are removed before the proof below,
    # so the evidence it publishes reports neither: material that only needed to
    # exist for one boot does not outlive it, and a completion inspected before
    # the withdrawal would report it still published.
    - name: Remove the work directory and the rendered kickstart with it
      ansible.builtin.file:
        path: '{{ managedos_install_anaconda_work }}'
        state: absent
      changed_when: false

    - name: Withdraw the private material now that the machine has it
      ansible.builtin.file:
        path: '{{ managedos_install_anaconda_private_root }}'
        state: absent
      when: managedos_install_anaconda_delivers_private | bool
      changed_when: managedos_install_anaconda_delivers_private | bool

    - name: Report installation verification completion
      bootwright.core.managedos_install_protocol:
        phase: group
        group: verify-installation
        status: ok
      no_log: true

    - name: Report network convergence
      bootwright.core.managedos_install_protocol:
        phase: group
        group: converge-network
        status: running
      no_log: true

    # Converged on every installed Machine, after the work area and the private
    # material are withdrawn, so neither outlives the power cycle it needs.
    - name: Converge the installed machine to its declared network
      ansible.builtin.include_tasks: network.yml

    - name: Report network convergence completion
      bootwright.core.managedos_install_protocol:
        phase: group
        group: converge-network
        status: ok
      no_log: true

    - name: Report installed security verification
      bootwright.core.managedos_install_protocol:
        phase: group
        group: verify-security
        status: running
      when: >-
        bootwright_os_install_request.diskEncryption is defined
        or 'fips=1' in (bootwright_os_install_request.installerArguments | default([]))
      no_log: true

    - name: Read whether the root disk is encrypted after its network converged
      ansible.builtin.include_tasks: root_encryption.yml

    - name: Name a machine that does not prove the root-disk encryption it was installed with
      bootwright.core.managedos_install_protocol:
        phase: refused
        reason: root-encryption-unproved
      when:
        - managedos_install_anaconda_root_encryption_requested | bool
        - not (managedos_install_anaconda_root_encryption | bool)
      no_log: true

    - name: Refuse a machine that does not prove its root-disk encryption
      ansible.builtin.fail:
        msg: >-
          Machine {{ bootwright_os_install_request.identity.object }} does not
          report its root filesystem on a TPM2-bound LUKS device after its
          installation
      when:
        - managedos_install_anaconda_root_encryption_requested | bool
        - not (managedos_install_anaconda_root_encryption | bool)

    - name: Read the installed machine's FIPS state after its network converged
      ansible.builtin.include_tasks: host_security.yml

    - name: Name a machine that does not prove the FIPS mode it was installed with
      bootwright.core.managedos_install_protocol:
        phase: refused
        reason: fips-not-enabled
      when:
        - managedos_install_anaconda_fips_requested | bool
        - not (managedos_install_anaconda_fips | bool)
      no_log: true

    - name: Refuse a machine that does not prove FIPS mode
      ansible.builtin.fail:
        msg: >-
          Machine {{ bootwright_os_install_request.identity.object }} does not
          report FIPS mode after its installation
      when:
        - managedos_install_anaconda_fips_requested | bool
        - not (managedos_install_anaconda_fips | bool)

    - name: Report installed security verification completion
      bootwright.core.managedos_install_protocol:
        phase: group
        group: verify-security
        status: ok
      when: >-
        bootwright_os_install_request.diskEncryption is defined
        or 'fips=1' in (bootwright_os_install_request.installerArguments | default([]))
      no_log: true

    - name: Report subscription registration
      bootwright.core.managedos_install_protocol:
        phase: group
        group: register-subscription
        status: running
      when: bootwright_os_install_request.registration is defined
      no_log: true

    # A removal unregisters only an installation whose apply recorded this
    # proof, so the proof is recorded before the machine is registered.
    - name: Refuse to register a machine that does not hold this installation's marker
      ansible.builtin.assert:
        that:
          - managedos_install_anaconda_marker == bootwright_os_install_material.marker
        fail_msg: the machine does not hold this installation's marker, so it was not registered
        quiet: true
      when: bootwright_os_install_request.registration is defined
      no_log: true

    - name: Publish that this installation's marker is proved before it registers
      bootwright.core.managedos_install_protocol:
        phase: prepared
        marker: '{{ managedos_install_anaconda_marker }}'
      when:
        - bootwright_os_install_request.registration is defined
        - not (managedos_install_anaconda_prepared | default(false) | bool)
      no_log: true

    - name: Register the installed machine with its subscription service after its network converged
      ansible.builtin.include_tasks: register.yml
      when: bootwright_os_install_request.registration is defined

    - name: Name a registration the subscription service or the machine refused
      bootwright.core.managedos_install_protocol:
        phase: refused
        reason: '{{ managedos_install_anaconda_registration_result.reason }}'
      when:
        - bootwright_os_install_request.registration is defined
        - not (managedos_install_anaconda_registration_result.ok | default(false) | bool)
        - managedos_install_anaconda_registration_result.reason | default('') in managedos_install_anaconda_registration_refusals
      vars:
        managedos_install_anaconda_registration_refusals:
          - registration-input
          - registration-foreign
          - registration-refused
          - registration-identity-collision
          - registration-unavailable
          - registration-repositories
          - registration-trust
          - update-release-unavailable
      no_log: true

    # The message names the Machine and the worker's closed vocabulary only:
    # the worker's detail and any other module output never reach it.
    - name: Refuse a machine its registration did not complete on
      ansible.builtin.fail:
        msg: >-
          Machine {{ bootwright_os_install_request.identity.object }} was not
          registered with its subscription service:
          {{ managedos_install_anaconda_registration_reason }}{{ managedos_install_anaconda_registration_cause }}
      vars:
        managedos_install_anaconda_registration_reason: >-
          {{ managedos_install_anaconda_registration_result.reason | default('')
             if managedos_install_anaconda_registration_result.reason | default('') in
             ['registration-input', 'registration-foreign', 'registration-refused', 'registration-identity-collision',
              'registration-unavailable', 'registration-repositories', 'registration-trust', 'update-release-unavailable',
              'registration-unreachable', 'transport']
             else 'unexpected answer' }}
        managedos_install_anaconda_registration_cause: >-
          {{ ' (' ~ managedos_install_anaconda_registration_result.cause ~ ')'
             if managedos_install_anaconda_registration_result.cause | default('') in
             ['service', 'timeout', 'tooling', 'unregister', 'session', 'host-key', 'exit', 'answer']
             else '' }}
      when:
        - bootwright_os_install_request.registration is defined
        - not (managedos_install_anaconda_registration_result.ok | default(false) | bool)

    - name: Report subscription registration completion
      bootwright.core.managedos_install_protocol:
        phase: group
        group: register-subscription
        status: ok
      when: bootwright_os_install_request.registration is defined
      no_log: true

    - name: Report package update and verification
      bootwright.core.managedos_install_protocol:
        phase: group
        group: update-packages
        status: running
      when: "'update' in bootwright_os_install_request"
      no_log: true

    - name: Update the installed machine within its release after its registration
      ansible.builtin.include_tasks: update.yml
      when: "'update' in bootwright_os_install_request"

    - name: Report package update and verification completion
      bootwright.core.managedos_install_protocol:
        phase: group
        group: update-packages
        status: ok
      when: "'update' in bootwright_os_install_request"
      no_log: true

    - name: Report installation completion verification
      bootwright.core.managedos_install_protocol:
        phase: group
        group: verify-completion
        status: running
      no_log: true

    - name: Prove everything this installation publishes is in place
      bootwright.core.managedos_install_inspect:
        request: '{{ bootwright_os_install_request }}'
        staging: '{{ managedos_install_anaconda_staged_tree }}'
        work: '{{ managedos_install_anaconda_work }}'
      register: managedos_install_anaconda_after

  always:
    - name: Remove private connection files
      bootwright.core.lifecycle_scratch:
        root: '{{ bootwright_run_scratch }}'
        scope: managedos-install
        state: absent
        remove_root: "{{ bootwright_os_install_request.placement.connection == 'ssh' }}"
      when: managedos_install_anaconda_scratch_ready is succeeded

- name: Report installation completion verification completion
  bootwright.core.managedos_install_protocol:
    phase: group
    group: verify-completion
    status: ok
  no_log: true

- name: Publish bounded installation completion evidence
  bootwright.core.managedos_install_protocol:
    phase: completed
    outcome: >-
      {{ 'unchanged' if (managedos_install_anaconda_was_installed | bool)
      and not (managedos_install_anaconda_network_result.changed | default(true) | bool)
      and not (managedos_install_anaconda_registration_result.registration.changed | default(false) | bool)
      and not (managedos_install_anaconda_update_changed | default(false) | bool) else 'changed' }}
    digest: '{{ bootwright_os_install_digest }}'
    observation: '{{ managedos_install_anaconda_after.observation }}'
    marker: '{{ managedos_install_anaconda_marker }}'
    hostKey: '{{ managedos_install_anaconda_host_key }}'
    reachable: '{{ managedos_install_anaconda_reachable.rc | default(1) == 0 }}'
    address: '{{ bootwright_os_install_request.address }}'
    # A controller can echo the media URL with its host or port rewritten,
    # so any token-shaped run is redacted rather than a known prefix.
    media: "{{ managedos_install_anaconda_ejected.media | default('') | regex_replace('[0-9a-f]{64}', '<token>') }}"
    power: '{{ managedos_install_anaconda_ejected.power }}'
    privateDelivery: '{{ managedos_install_anaconda_delivers_private | bool }}'
    network: '{{ managedos_install_anaconda_network_result.network | default(false) }}'
    networkReboot: '{{ managedos_install_anaconda_network_result.networkReboot | default(false) }}'
    networkDifferences: '{{ managedos_install_anaconda_network_result.networkDifferences | default([]) }}'
    fips: '{{ managedos_install_anaconda_fips | default(false) }}'
    fipsRequired: "{{ 'fips=1' in (bootwright_os_install_request.installerArguments | default([])) }}"
    rootEncryption: '{{ managedos_install_anaconda_root_encryption | default(false) }}'
    rootEncryptionRequired: "{{ bootwright_os_install_request.diskEncryption is defined }}"
    registration: '{{ managedos_install_anaconda_registration | default({}) }}'
    registrationRequired: "{{ bootwright_os_install_request.registration is defined }}"
    update: '{{ managedos_install_anaconda_update | default({}) }}'
    updateRequired: "{{ 'update' in bootwright_os_install_request }}"
  no_log: true
