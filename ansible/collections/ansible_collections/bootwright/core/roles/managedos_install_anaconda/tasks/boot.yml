---
# The machine is booted through its own management controller over Redfish,
# never through the hypervisor, so this path is the same one a physical server
# takes. A request is not evidence: every step polls its own outcome.
- name: Prove the machine is powered off before inserting anything
  bootwright.core.redfish_boot:
    endpoint: '{{ bootwright_os_install_request.controller.endpoint }}'
    user: '{{ lookup("ansible.builtin.file", bootwright_os_install_material.controllerUser) }}'
    password: '{{ lookup("ansible.builtin.file", bootwright_os_install_material.controllerPassword) }}'
    operation: power-off
  no_log: true

- name: Insert the published installer image as virtual media
  bootwright.core.redfish_boot:
    endpoint: '{{ bootwright_os_install_request.controller.endpoint }}'
    user: '{{ lookup("ansible.builtin.file", bootwright_os_install_material.controllerUser) }}'
    password: '{{ lookup("ansible.builtin.file", bootwright_os_install_material.controllerPassword) }}'
    operation: insert
    image: '{{ bootwright_os_install_request.image.url }}'
  no_log: true

- name: Set a one-time boot from that media
  bootwright.core.redfish_boot:
    endpoint: '{{ bootwright_os_install_request.controller.endpoint }}'
    user: '{{ lookup("ansible.builtin.file", bootwright_os_install_material.controllerUser) }}'
    password: '{{ lookup("ansible.builtin.file", bootwright_os_install_material.controllerPassword) }}'
    operation: boot
  no_log: true

- name: Power the machine on and poll it to running
  bootwright.core.redfish_boot:
    endpoint: '{{ bootwright_os_install_request.controller.endpoint }}'
    user: '{{ lookup("ansible.builtin.file", bootwright_os_install_material.controllerUser) }}'
    password: '{{ lookup("ansible.builtin.file", bootwright_os_install_material.controllerPassword) }}'
    operation: power-on
  no_log: true

- name: Wait for the installer to power the machine off when it is done
  bootwright.core.redfish_boot:
    endpoint: '{{ bootwright_os_install_request.controller.endpoint }}'
    user: '{{ lookup("ansible.builtin.file", bootwright_os_install_material.controllerUser) }}'
    password: '{{ lookup("ansible.builtin.file", bootwright_os_install_material.controllerPassword) }}'
    operation: read
  register: managedos_install_anaconda_installer
  retries: 180
  delay: 20
  until: managedos_install_anaconda_installer.power == 'Off'
  no_log: true

- name: Eject the installer image now that the installation is written
  bootwright.core.redfish_boot:
    endpoint: '{{ bootwright_os_install_request.controller.endpoint }}'
    user: '{{ lookup("ansible.builtin.file", bootwright_os_install_material.controllerUser) }}'
    password: '{{ lookup("ansible.builtin.file", bootwright_os_install_material.controllerPassword) }}'
    operation: eject
  no_log: true

- name: Select the installed disk as the boot device
  bootwright.core.redfish_boot:
    endpoint: '{{ bootwright_os_install_request.controller.endpoint }}'
    user: '{{ lookup("ansible.builtin.file", bootwright_os_install_material.controllerUser) }}'
    password: '{{ lookup("ansible.builtin.file", bootwright_os_install_material.controllerPassword) }}'
    operation: boot
    target: Hdd
  no_log: true

- name: Power the installed system on and poll it to running
  bootwright.core.redfish_boot:
    endpoint: '{{ bootwright_os_install_request.controller.endpoint }}'
    user: '{{ lookup("ansible.builtin.file", bootwright_os_install_material.controllerUser) }}'
    password: '{{ lookup("ansible.builtin.file", bootwright_os_install_material.controllerPassword) }}'
    operation: power-on
  no_log: true
