---
# The machine is booted through its own management controller over Redfish,
# never through the hypervisor, so this path is the same one a physical server
# takes. A request is not evidence: every step polls its own outcome.
# The proof runs here rather than at planning time, because a plan proves
# intent and only an observation taken before the effect proves the target.
# How a machine is proved and booted is its substrate's answer, so this
# composes the substrate's pre-boot and boot entry points, each selected by the
# frozen request's own substrate so authored data can never choose which one
# runs. Each dispatch ends in a terminal fail for a substrate it has no entry
# point for, and the proof dispatch's fail comes before anything is inserted or
# booted. The boot entry point is told that this installer powers the machine
# off when it is done, so a substrate may select the media rather than rely on
# its machine's boot order.
- name: Prove the exact target through the substrate that realized it
  ansible.builtin.include_role:
    name: "{{ managedos_install_anaconda_pre_boot[bootwright_os_install_request.target.substrate] }}"
    tasks_from: pre_boot
  vars:
    bootwright_machine_port:
      endpoint: '{{ managedos_install_anaconda_endpoint }}'
      verify: '{{ managedos_install_anaconda_verify }}'
      ca: '{{ managedos_install_anaconda_controller_ca }}'
      user: '{{ bootwright_os_install_material.controllerUser }}'
      password: '{{ bootwright_os_install_material.controllerPassword }}'
      expected: '{{ managedos_install_anaconda_expected }}'
      pinned_uuid_base64: '{{ bootwright_os_install_material.pinnedUUIDBase64 | default("") }}'
      pinned_serial_base64: '{{ bootwright_os_install_material.pinnedSerialBase64 | default("") }}'
  when: bootwright_os_install_request.target.substrate in managedos_install_anaconda_pre_boot

- name: Refuse a substrate this installation has no pre-boot binding for
  ansible.builtin.fail:
    msg: >-
      Machine {{ bootwright_os_install_request.identity.object }} names substrate
      {{ bootwright_os_install_request.target.substrate }}, which this
      installation has no pre_boot binding for, so it was not proved and
      nothing was inserted or booted; plan the installation again with this
      release
  when: bootwright_os_install_request.target.substrate not in managedos_install_anaconda_pre_boot

# Published only here, after the substrate proved the target and before the
# media is inserted, so a replay or an apply that finds the machine installed
# never publishes it again; the withdrawal of the private subtree removes it.
- name: Publish the recovery passphrase this machine's installer fetches
  ansible.builtin.include_tasks: private_recovery.yml
  when: bootwright_os_install_request.diskEncryption is defined

# A physical controller proves it fetched private media with verification. An
# emulated controller fetches without verifying, a leg that never leaves the
# provider host the artifact server is placed on, so it is not asked to.
- name: Keep the private media URL in the invocation's protected scratch
  ansible.builtin.copy:
    content: '{{ managedos_install_anaconda_image_url }}'
    dest: '{{ bootwright_run_scratch }}/managedos-media-url'
    mode: '0600'
  delegate_to: localhost
  vars:
    ansible_python_interpreter: '{{ ansible_playbook_python }}'
  no_log: true
  diff: false

- name: Insert the published installer image as virtual media
  ansible.builtin.include_role:
    name: "{{ managedos_install_anaconda_media_insert[bootwright_os_install_request.target.substrate] }}"
    tasks_from: media_insert
  vars:
    bootwright_machine_port: >-
      {{ managedos_install_anaconda_port_access | combine({'image_url_file': bootwright_run_scratch ~ '/managedos-media-url',
         'private': bootwright_os_install_request.private is defined and (bootwright_os_install_request.target.physical | bool),
         'trust': managedos_install_anaconda_media_trust.trust,
         'certificate': bootwright_os_install_material.artifactCertificate | default('')}) }}

- name: Retain the machine port answer
  ansible.builtin.set_fact:
    managedos_install_anaconda_inserted: "{{ vars[managedos_install_anaconda_port_result[bootwright_os_install_request.target.substrate]] }}"
  no_log: true

# ansible-core keeps nothing of a failure under no_log but that it failed, so
# the controller's own refusal is reported here, where no credential is.
- name: Stop at an insert the management controller did not complete
  ansible.builtin.assert:
    that:
      - managedos_install_anaconda_inserted.msg is not defined
    fail_msg: >-
      inserting the installer image into Machine {{ bootwright_os_install_request.identity.object }}
      failed:
      {{ ((managedos_install_anaconda_inserted.msg | default('') | string
           | replace(managedos_install_anaconda_token.stdout | trim, '<token>')
           if bootwright_os_install_request.private is defined
           else managedos_install_anaconda_inserted.msg | default('') | string)
          | bootwright.core.printable)[:512] }}
    quiet: true

- name: Boot a machine this substrate created from that media
  ansible.builtin.include_role:
    name: "{{ managedos_install_anaconda_boot_media_bindings[bootwright_os_install_request.target.substrate] }}"
    tasks_from: boot_media
  vars:
    bootwright_machine_port:
      endpoint: '{{ managedos_install_anaconda_endpoint }}'
      verify: '{{ managedos_install_anaconda_verify }}'
      ca: '{{ managedos_install_anaconda_controller_ca }}'
      user: '{{ bootwright_os_install_material.controllerUser }}'
      password: '{{ bootwright_os_install_material.controllerPassword }}'
      installer_powers_off: true
  when: bootwright_os_install_request.target.substrate in managedos_install_anaconda_boot_media_bindings

- name: Refuse a substrate this installation has no media-boot binding for
  ansible.builtin.fail:
    msg: >-
      Machine {{ bootwright_os_install_request.identity.object }} names substrate
      {{ bootwright_os_install_request.target.substrate }}, which this
      installation has no boot_media binding for, so it was not booted from the
      inserted image; plan the installation again with this release
  when: bootwright_os_install_request.target.substrate not in managedos_install_anaconda_boot_media_bindings
