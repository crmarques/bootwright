---
# A root disk declared by serial number has the WWN it reported to the
# installer's %pre, the proof that matched its serial number and exact size,
# recorded at /etc/bootwright/root-wwn, empty when it reported none, so its
# physical erase can compare it. The read writes nothing; any other
# installation reads nothing.
- name: Name whether this installation records its root disk's WWN
  ansible.builtin.set_fact:
    managedos_install_anaconda_root_wwn_required: >-
      {{ (bootwright_os_install_request.target.physical | default(false) | bool)
         and (bootwright_os_install_request.target.hardware.serialNumber | default('') | length > 0)
         and (bootwright_os_install_request.target.hardware.rootDevice | default('') | length == 0)
         and bootwright_os_install_request.target.hardware.rootVolumeRef is not defined }}

- name: Read the WWN the root disk reported to the installer
  ansible.builtin.include_tasks: guest.yml
  vars:
    managedos_install_anaconda_guest_command:
      - /usr/bin/head
      - -c
      - '258'
      - --
      - /etc/bootwright/root-wwn
  when: managedos_install_anaconda_root_wwn_required | bool

- name: Name what the root disk WWN read returned
  ansible.builtin.set_fact:
    managedos_install_anaconda_root_wwn_read: >-
      {{ (managedos_install_anaconda_root_wwn_required | bool)
         and (managedos_install_anaconda_guest.rc | default(1) | int) == 0 }}
    managedos_install_anaconda_root_wwn: >-
      {{ managedos_install_anaconda_guest.stdout | default('')
         if (managedos_install_anaconda_root_wwn_required | bool) else '' }}
