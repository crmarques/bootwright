---
# The recovery passphrase an encrypting installer fetches in %pre and %post,
# published beside the installer image only while that installer runs: boot.yml
# includes this after the substrate proved the target and before the media is
# inserted, and the withdrawal of the private subtree removes it before the
# completion inspection. The material arrives as a file path, never as a value,
# and its first byte is fetched through the listener the installer uses, so a
# passphrase it could not fetch refuses before anything is booted.
- name: Publish the recovery passphrase only this machine may read
  ansible.builtin.copy:
    src: '{{ bootwright_os_install_material.recoveryPassphrase }}'
    dest: '{{ managedos_install_anaconda_private_dir }}/.stage/recovery'
    remote_src: true
    owner: root
    group: root
    mode: '0640'
  no_log: true

- name: Label the recovery passphrase so the serving process can read it
  ansible.builtin.command:
    chdir: '{{ managedos_install_anaconda_private_dir }}'
    argv:
      - /usr/bin/chcon
      - --reference
      - '{{ managedos_install_anaconda_served_root }}'
      - .stage/recovery
  changed_when: true
  no_log: true

- name: Atomically publish the protected recovery passphrase
  ansible.builtin.command:
    chdir: '{{ managedos_install_anaconda_private_dir }}'
    argv:
      - /usr/bin/mv
      - --no-target-directory
      - .stage/recovery
      - recovery
  changed_when: true
  no_log: true

- name: Fetch the first byte of the recovery passphrase through its listener
  ansible.builtin.include_role:
    name: bootwright.core.infrastructureservices_artifact_listener
    tasks_from: proof
  vars:
    infrastructureservices_artifact_listener_url: '{{ managedos_install_anaconda_private_url }}/recovery'
    infrastructureservices_artifact_listener_ca: '{{ bootwright_os_install_material.artifactCertificate }}'
    infrastructureservices_artifact_listener_token: '{{ managedos_install_anaconda_token.stdout | trim }}'
    infrastructureservices_artifact_listener_secret: '{{ bootwright_os_install_request.tlsCertificateRef | default("") }}'
    infrastructureservices_artifact_listener_subject: the private recovery
    infrastructureservices_artifact_listener_consequence: so no machine was given media
