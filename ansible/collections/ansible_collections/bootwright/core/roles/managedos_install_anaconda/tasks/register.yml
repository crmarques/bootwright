---
# Registration runs once the installed machine's network converged and its FIPS
# and root-encryption proofs passed, over the pinned fleet connection guest.yml
# opens. A request updating within its release also sets that release
# before the repositories, which its update bound allows 120 more seconds for.
# The organization and activation key are lent as files whose
# paths only the controller module reads: their values reach the machine only
# on the fixed worker's standard input, never a task variable. A registration
# with a Satellite also lends its CA bundle the same way, and its session has
# 60 more seconds for the worker's subscription-manager config call. Explicit
# content selection adds 60 seconds for its live identity proof.
- name: Open the pinned connection to the installed machine
  bootwright.core.managedos_guest_session:
    state: present
    directory: '{{ managedos_install_anaconda_scratch }}'
    address: '{{ bootwright_os_install_request.address }}'
    host_key: '{{ managedos_install_anaconda_host_key }}'
  register: managedos_install_anaconda_registration_session

- name: Register the installed machine through the fixed worker on that exact key
  bootwright.core.managedos_registration:
    operation: register
    address: '{{ bootwright_os_install_request.address }}'
    user: '{{ bootwright_os_install_request.user }}'
    identity: '{{ bootwright_os_install_material.fleetIdentity }}'
    ssh_config: '{{ managedos_install_anaconda_registration_session.ssh_config }}'
    known_hosts: '{{ managedos_install_anaconda_registration_session.known_hosts }}'
    host_key_algorithms: '{{ managedos_install_anaconda_registration_session.host_key_algorithms }}'
    policy_host_key_algorithms: '{{ managedos_install_anaconda_registration_session.policy_host_key_algorithms }}'
    request: '{{ bootwright_os_install_digest }}'
    organization_file: '{{ bootwright_os_install_material.rhsmOrganization }}'
    activation_key_file: '{{ bootwright_os_install_material.rhsmActivationKey }}'
    enable: '{{ bootwright_os_install_request.registration.repositories.enable }}'
    disable: '{{ bootwright_os_install_request.registration.repositories.disable }}'
    release: "{{ bootwright_os_install_request['update'].release if 'update' in bootwright_os_install_request else '' }}"
    satellite_content_view: "{{ bootwright_os_install_request.registration.satellite.contentView | default(omit) }}"
    satellite_lifecycle_environment: "{{ bootwright_os_install_request.registration.satellite.lifecycleEnvironment | default(omit) }}"
    satellite_hostname: "{{ bootwright_os_install_request.registration.satellite.hostname | default(omit) }}"
    satellite_content_base_url: "{{ bootwright_os_install_request.registration.satellite.contentBaseURL | default(omit) }}"
    satellite_ca_file: "{{ bootwright_os_install_material.rhsmSatelliteCA if 'satellite' in bootwright_os_install_request.registration else omit }}"
    timeout: >-
      {{ (750 if 'update' in bootwright_os_install_request else 630)
         + (60 if 'satellite' in bootwright_os_install_request.registration else 0)
         + (60 if bootwright_os_install_request.registration.satellite.contentView | default('') else 0) }}
  register: managedos_install_anaconda_registration_result
  failed_when: false
  changed_when: false
  no_log: true

- name: Close the pinned connection to the installed machine
  bootwright.core.managedos_guest_session:
    state: absent
    directory: '{{ managedos_install_anaconda_scratch }}'

- name: Name the registration the worker answered with
  ansible.builtin.set_fact:
    managedos_install_anaconda_registration:
      consumer: >-
        {{ managedos_install_anaconda_registration_result.registration.consumer
           if (managedos_install_anaconda_registration_result.ok | default(false) | bool) else '' }}
      state: >-
        {{ 'owned' if (managedos_install_anaconda_registration_result.ok | default(false) | bool)
           and (managedos_install_anaconda_registration_result.registration.owned | default(false) | bool) else '' }}
  changed_when: false
