---
- name: Validate the frozen installation request
  ansible.builtin.assert:
    that:
      - bootwright_os_install_request.version == 'os-install-anaconda-v16'
      - bootwright_os_install_request.identity.context is match('^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$')
      - bootwright_os_install_request.identity.object is match('^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$')
      - managedos_install_anaconda_work == '/var/lib/bootwright-install/'
        ~ bootwright_os_install_request.identity.context ~ '/' ~ bootwright_os_install_request.identity.object ~ '/work'
      - (bootwright_os_install_request.image is defined) != (bootwright_os_install_request.private is defined)
      - (bootwright_os_install_request.image.path if bootwright_os_install_request.image is defined
         else bootwright_os_install_request.private.path).startswith('/var/lib/bootwright-services/')
      - bootwright_os_install_digest is match('[0-9a-f]{64}')
      - bootwright_os_install_request.registration is not defined
        or bootwright_os_install_material.unregister | default('') in ['guest', 'skip']
    quiet: true
  no_log: true

- name: Complete the qualified execution handoff
  bootwright.core.managedos_install_protocol:
    phase: loaded
  no_log: true

- name: Prove each ancestor of this Machine's durable work area
  ansible.builtin.include_tasks: work.yml
  loop:
    - '{{ managedos_install_anaconda_work_parent }}'
    - '{{ managedos_install_anaconda_work | dirname | dirname }}'
    - '{{ managedos_install_anaconda_work | dirname }}'
  loop_control:
    loop_var: managedos_install_anaconda_work_ancestor
  vars:
    managedos_install_anaconda_work_create: false

# A registering installation unregisters while its Machine still runs, before
# anything it published is withdrawn: a Machine holding this installation's
# marker has its consumer removed by the worker, one answering with another
# marker or none holds nothing of this installation, and one that does not
# answer refuses, so a failed removal leaves the content to repeat it with. An
# installation the capability says never registered, or whose consumer the
# operator removed, is not read at all.
- name: Unregister the machine this installation registered
  when:
    - bootwright_os_install_request.registration is defined
    - managedos_install_anaconda_unregisters | bool
  vars:
    managedos_install_anaconda_ours: >-
      {{ managedos_install_anaconda_marker | default('') == bootwright_os_install_material.marker }}
  block:
    - name: Report subscription unregistration
      bootwright.core.managedos_install_protocol:
        phase: group
        group: unregister-subscription
        status: running
      no_log: true

    - name: Prepare private connection files
      bootwright.core.lifecycle_scratch:
        root: '{{ bootwright_run_scratch }}'
        scope: managedos-install
      register: managedos_install_anaconda_scratch_ready

    - name: Read the machine through its own identity channel
      ansible.builtin.include_tasks: identity.yml

    - name: Name a machine that did not answer
      bootwright.core.managedos_install_protocol:
        phase: refused
        reason: registration-unreachable
      when: >-
        not (managedos_install_anaconda_answered | bool)
        or (managedos_install_anaconda_ours | bool and managedos_install_anaconda_host_key | default('') | trim | length == 0)
      no_log: true

    - name: Refuse a machine that did not answer
      ansible.builtin.fail:
        msg: >-
          Machine {{ bootwright_os_install_request.identity.object }} did not
          answer through its identity channel, so its subscription
          registration was not removed
      when: >-
        not (managedos_install_anaconda_answered | bool)
        or (managedos_install_anaconda_ours | bool and managedos_install_anaconda_host_key | default('') | trim | length == 0)

    - name: Unregister the consumer this installation created
      ansible.builtin.include_tasks: unregister.yml
      when: managedos_install_anaconda_ours | bool

    - name: Name an unregistration the machine or the subscription service did not complete
      bootwright.core.managedos_install_protocol:
        phase: refused
        reason: '{{ managedos_install_anaconda_unregistration_result.reason }}'
      when:
        - managedos_install_anaconda_ours | bool
        - not (managedos_install_anaconda_unregistration_result.ok | default(false) | bool)
        - managedos_install_anaconda_unregistration_result.reason | default('') in ['registration-unreachable', 'registration-unavailable']
      no_log: true

    # The message names the Machine and the worker's closed vocabulary only:
    # the worker's detail and any other module output never reach it.
    - name: Refuse a machine its unregistration did not complete on
      ansible.builtin.fail:
        msg: >-
          Machine {{ bootwright_os_install_request.identity.object }} was not
          unregistered from its subscription service:
          {{ managedos_install_anaconda_unregistration_reason }}{{ managedos_install_anaconda_unregistration_cause }}
      vars:
        managedos_install_anaconda_unregistration_reason: >-
          {{ managedos_install_anaconda_unregistration_result.reason | default('')
             if managedos_install_anaconda_unregistration_result.reason | default('') in
             ['registration-input', 'registration-foreign', 'registration-refused', 'registration-identity-collision',
              'registration-unavailable', 'registration-repositories', 'registration-unreachable', 'transport']
             else 'unexpected answer' }}
        managedos_install_anaconda_unregistration_cause: >-
          {{ ' (' ~ managedos_install_anaconda_unregistration_result.cause ~ ')'
             if managedos_install_anaconda_unregistration_result.cause | default('') in
             ['service', 'timeout', 'tooling', 'unregister', 'session', 'host-key', 'exit', 'answer']
             else '' }}
      when:
        - managedos_install_anaconda_ours | bool
        - not (managedos_install_anaconda_unregistration_result.ok | default(false) | bool)

    - name: Name the registration the removal left
      ansible.builtin.set_fact:
        managedos_install_anaconda_registration:
          consumer: >-
            {{ managedos_install_anaconda_unregistration_result.registration.consumer
               if managedos_install_anaconda_ours | bool else '' }}
          state: >-
            {{ managedos_install_anaconda_unregistration_result.registration.state
               if managedos_install_anaconda_ours | bool else 'absent' }}
      changed_when: false

    - name: Report subscription unregistration completion
      bootwright.core.managedos_install_protocol:
        phase: group
        group: unregister-subscription
        status: ok
      no_log: true

  always:
    - name: Remove private connection files
      bootwright.core.lifecycle_scratch:
        root: '{{ bootwright_run_scratch }}'
        scope: managedos-install
        state: absent
        remove_root: "{{ bootwright_os_install_request.placement.connection == 'ssh' }}"
      when: managedos_install_anaconda_scratch_ready is succeeded

- name: Report published content removal
  bootwright.core.managedos_install_protocol:
    phase: group
    group: remove-published
    status: running
  no_log: true

- name: Observe what this installation published before removing it
  bootwright.core.managedos_install_inspect:
    request: '{{ bootwright_os_install_request }}'
    staging: '{{ managedos_install_anaconda_staged_tree }}'
    work: '{{ managedos_install_anaconda_work }}'
  register: managedos_install_anaconda_before

# A delivered-key Machine's image is beneath its private subtree, which the
# removal of that subtree below takes back with it.
- name: Remove the subtree this installation owns beneath the served root
  ansible.builtin.file:
    path: '{{ managedos_install_anaconda_image_dir }}'
    state: absent
  when: bootwright_os_install_request.image is defined
  register: managedos_install_anaconda_image_removed

- name: Remove the private subtree this block owns
  ansible.builtin.file:
    path: '{{ managedos_install_anaconda_private_root }}'
    state: absent
  when: managedos_install_anaconda_delivers_private | bool
  register: managedos_install_anaconda_private_removed

# An attempt killed part way leaves the area it built the image in, with the
# rendered Kickstart and any image it wrote.
- name: Remove the work area an interrupted attempt left
  ansible.builtin.file:
    path: '{{ managedos_install_anaconda_work }}'
    state: absent
  register: managedos_install_anaconda_work_removed

# The per-Machine and per-context directories an apply proved or created hold
# nothing once the work area is gone, unless a sibling Machine of this context
# still works beneath them. Each is removed only when empty, the Machine's
# first, and the shared root is never touched. A sibling apply that finds the
# context directory gone creates it again, because creating its own directory
# creates every missing parent with the same owner and mode. Sibling removals
# run concurrently, so a directory a sibling removed between the read and the
# rmdir is already the absence this removal wants: rmdir's "No such file or
# directory" is success, and any other failure still fails.
- name: Read this Machine's work directory before empty directory removal
  ansible.builtin.stat:
    path: '{{ managedos_install_anaconda_work | dirname }}'
    follow: false
  register: managedos_install_anaconda_machine_dir_before

- name: Remove this Machine's work directory only when empty
  ansible.builtin.command:
    argv:
      - /usr/bin/rmdir
      - --ignore-fail-on-non-empty
      - '{{ managedos_install_anaconda_work | dirname }}'
    expand_argument_vars: false
  environment:
    LC_ALL: C
  register: managedos_install_anaconda_machine_dir_removed
  failed_when:
    - managedos_install_anaconda_machine_dir_removed.rc != 0
    - '"No such file or directory" not in managedos_install_anaconda_machine_dir_removed.stderr'
  when: managedos_install_anaconda_machine_dir_before.stat.isdir | default(false)
  changed_when: false

- name: Read whether this Machine's work directory remains
  ansible.builtin.stat:
    path: '{{ managedos_install_anaconda_work | dirname }}'
    follow: false
  register: managedos_install_anaconda_machine_dir_after

- name: Read this context's work directory before empty directory removal
  ansible.builtin.stat:
    path: '{{ managedos_install_anaconda_work | dirname | dirname }}'
    follow: false
  register: managedos_install_anaconda_context_dir_before

- name: Remove this context's work directory only when empty
  ansible.builtin.command:
    argv:
      - /usr/bin/rmdir
      - --ignore-fail-on-non-empty
      - '{{ managedos_install_anaconda_work | dirname | dirname }}'
    expand_argument_vars: false
  environment:
    LC_ALL: C
  register: managedos_install_anaconda_context_dir_removed
  failed_when:
    - managedos_install_anaconda_context_dir_removed.rc != 0
    - '"No such file or directory" not in managedos_install_anaconda_context_dir_removed.stderr'
  when: managedos_install_anaconda_context_dir_before.stat.isdir | default(false)
  changed_when: false

- name: Read whether this context's work directory remains
  ansible.builtin.stat:
    path: '{{ managedos_install_anaconda_work | dirname | dirname }}'
    follow: false
  register: managedos_install_anaconda_context_dir_after

- name: Report published content removal completion
  bootwright.core.managedos_install_protocol:
    phase: group
    group: remove-published
    status: ok
  no_log: true

- name: Report absence verification
  bootwright.core.managedos_install_protocol:
    phase: group
    group: verify-absence
    status: running
  no_log: true

- name: Prove every published file is gone
  bootwright.core.managedos_install_inspect:
    request: '{{ bootwright_os_install_request }}'
    staging: '{{ managedos_install_anaconda_staged_tree }}'
    work: '{{ managedos_install_anaconda_work }}'
  register: managedos_install_anaconda_after

- name: Report absence verification completion
  bootwright.core.managedos_install_protocol:
    phase: group
    group: verify-absence
    status: ok
  no_log: true

- name: Publish bounded installation removal evidence
  bootwright.core.managedos_install_protocol:
    phase: completed
    outcome: >-
      {{ 'changed'
         if (managedos_install_anaconda_image_removed is changed
             or managedos_install_anaconda_private_removed is changed
             or managedos_install_anaconda_work_removed is changed
             or (managedos_install_anaconda_machine_dir_before.stat.exists
                 and not managedos_install_anaconda_machine_dir_after.stat.exists)
             or (managedos_install_anaconda_context_dir_before.stat.exists
                 and not managedos_install_anaconda_context_dir_after.stat.exists)
             or (managedos_install_anaconda_unregistration_result.registration.changed | default(false) | bool))
         else 'unchanged' }}
    digest: '{{ bootwright_os_install_digest }}'
    observation: '{{ managedos_install_anaconda_after.observation }}'
    removed: true
    registration: '{{ managedos_install_anaconda_registration | default({}) }}'
    registrationRequired: "{{ bootwright_os_install_request.registration is defined and managedos_install_anaconda_unregisters | bool }}"
  no_log: true
