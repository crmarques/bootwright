---
# An observation reads the update the way an apply proves it, over the same
# pinned fleet connection guest.yml opens. It only inspects:
# the worker reads the record, the release and the dnf history and changes
# nothing, which the observe walk (cmd/bootwright) holds by the literal
# operation below.
- name: Open the pinned connection to the installed machine
  bootwright.core.managedos_guest_session:
    state: present
    directory: '{{ managedos_install_anaconda_scratch }}'
    address: '{{ bootwright_os_install_request.address }}'
    host_key: '{{ managedos_install_anaconda_host_key }}'
  register: managedos_install_anaconda_update_observe_session

- name: Inspect the installed machine's update through the fixed worker on that exact key
  bootwright.core.managedos_update:
    operation: inspect
    address: '{{ bootwright_os_install_request.address }}'
    user: '{{ bootwright_os_install_request.user }}'
    identity: '{{ bootwright_os_install_material.fleetIdentity }}'
    ssh_config: '{{ managedos_install_anaconda_update_observe_session.ssh_config }}'
    known_hosts: '{{ managedos_install_anaconda_update_observe_session.known_hosts }}'
    host_key_algorithms: '{{ managedos_install_anaconda_update_observe_session.host_key_algorithms }}'
    policy_host_key_algorithms: '{{ managedos_install_anaconda_update_observe_session.policy_host_key_algorithms }}'
    request: '{{ bootwright_os_install_digest }}'
    release: "{{ bootwright_os_install_request['update'].release }}"
    timeout: '{{ bootwright_os_install_request.budgets.sessions.inspection | int }}'
  register: managedos_install_anaconda_update_read
  failed_when: false
  changed_when: false
  no_log: true

- name: Close the pinned connection to the installed machine
  bootwright.core.managedos_guest_session:
    state: absent
    directory: '{{ managedos_install_anaconda_scratch }}'

- name: Name the update the worker read
  ansible.builtin.set_fact:
    managedos_install_anaconda_update: >-
      {{ managedos_install_anaconda_update_read.evidence
         if (managedos_install_anaconda_update_read.ok | default(false) | bool) else {} }}
  changed_when: false
