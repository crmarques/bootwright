---
# The update within the release runs once the installed machine's network
# converged, its FIPS and root-encryption proofs passed and, when it registers,
# its registration and repositories converged. The worker's record decides each
# step: pending upgrades again, upgraded reboots when the transaction changed a
# package and proves, complete does nothing. The reboot is network
# convergence's own (reboot.yml), its power-off and return held together to
# the frozen reboot budget; the marker is then proved again through the
# identity channel, FIPS mode again when the profile enables it, and the
# release again by the worker, which records the update complete.
- name: Refuse to update a machine that does not hold this installation's marker
  ansible.builtin.assert:
    that:
      - managedos_install_anaconda_marker == bootwright_os_install_material.marker
    fail_msg: the machine does not hold this installation's marker, so it was not updated
    quiet: true
  no_log: true

- name: Update the installed machine within its release
  ansible.builtin.include_tasks: update_session.yml
  vars:
    managedos_install_anaconda_update_operation: apply

- name: Name the update the worker applied or resumed
  ansible.builtin.set_fact:
    managedos_install_anaconda_update: "{{ managedos_install_anaconda_update_answer.evidence }}"
    managedos_install_anaconda_update_changed: '{{ managedos_install_anaconda_update_answer.updated }}'
    managedos_install_anaconda_update_host_key: '{{ managedos_install_anaconda_host_key }}'
  changed_when: false

- name: Reboot the machine its update changed
  when:
    - managedos_install_anaconda_update.state != 'complete'
    - managedos_install_anaconda_update.transaction | int != 0
  block:
    - name: Read the boot the update's reboot must leave behind
      ansible.builtin.include_tasks: guest.yml
      vars:
        managedos_install_anaconda_guest_command: '{{ managedos_install_anaconda_network_boot_id }}'

    - name: Stop at a boot the machine did not report before its update's reboot
      ansible.builtin.fail:
        msg: >-
          the connection to Machine {{ bootwright_os_install_request.identity.object }}
          at {{ bootwright_os_install_request.address }} failed while its boot was read
          before the reboot of its update; repeat bootwright apply
      when: managedos_install_anaconda_guest.rc | default(1) != 0

    - name: Name the boot the update's reboot must leave behind
      ansible.builtin.set_fact:
        managedos_install_anaconda_update_boot_before: '{{ managedos_install_anaconda_guest.stdout | trim }}'
      changed_when: false

    - name: Restart the machine on what its update installed
      ansible.builtin.include_tasks: reboot.yml
      vars:
        managedos_install_anaconda_reboot_before: '{{ managedos_install_anaconda_update_boot_before }}'
        managedos_install_anaconda_reboot_poweroff_attempts: >-
          {{ [(bootwright_os_install_request.budgets.reboot.attempts | int) // 4, 1] | max }}
        managedos_install_anaconda_reboot_return_attempts: >-
          {{ [(bootwright_os_install_request.budgets.reboot.attempts | int)
              - [(bootwright_os_install_request.budgets.reboot.attempts | int) // 4, 1] | max, 1] | max }}

    - name: Read the restarted machine through its own identity channel
      ansible.builtin.include_tasks: identity.yml
      vars:
        managedos_install_anaconda_identity_retries: 1

    - name: Refuse a restarted machine that does not prove this installation's marker on its key
      ansible.builtin.assert:
        that:
          - managedos_install_anaconda_marker == bootwright_os_install_material.marker
          - managedos_install_anaconda_host_key == managedos_install_anaconda_update_host_key
        fail_msg: >-
          Machine {{ bootwright_os_install_request.identity.object }} did not answer with this
          installation's marker and host key through its identity channel after the reboot of
          its update; its state is unknown: repeat bootwright apply
        quiet: true
      no_log: true

    - name: Read the restarted machine's FIPS state
      ansible.builtin.include_tasks: host_security.yml

    - name: Name a restarted machine that does not prove the FIPS mode it was installed with
      bootwright.core.managedos_install_protocol:
        phase: refused
        reason: fips-not-enabled
      when:
        - managedos_install_anaconda_fips_requested | bool
        - not (managedos_install_anaconda_fips | bool)
      no_log: true

    - name: Refuse a restarted machine that does not prove FIPS mode
      ansible.builtin.fail:
        msg: >-
          Machine {{ bootwright_os_install_request.identity.object }} does not
          report FIPS mode after the reboot of its update
      when:
        - managedos_install_anaconda_fips_requested | bool
        - not (managedos_install_anaconda_fips | bool)

- name: Prove the release again and record the update complete
  ansible.builtin.include_tasks: update_session.yml
  vars:
    managedos_install_anaconda_update_operation: complete
  when: managedos_install_anaconda_update.state != 'complete'

- name: Name the update this installation completed
  ansible.builtin.set_fact:
    managedos_install_anaconda_update: "{{ managedos_install_anaconda_update_answer.evidence }}"
  when: managedos_install_anaconda_update.state != 'complete'
  changed_when: false
