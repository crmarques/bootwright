---
# The installed machine is contacted on exactly the key it reported through its
# own identity channel, never on a first-use answer from the network. The key
# is the string that channel published, not a file read: dereferencing it as
# one made this proof unrunnable, and only the observation path, which never
# runs it, could complete an installation. The session is the one guest.yml
# opens; the collection's guest session builder owns its options.
#
# The caller owns the budget. An apply waits for sshd to finish starting; an
# observation takes the answer that is already true, because it may not wait.
- name: Open the pinned connection to the installed machine
  bootwright.core.managedos_guest_session:
    state: present
    directory: '{{ managedos_install_anaconda_scratch }}'
    address: '{{ bootwright_os_install_request.address }}'
    host_key: '{{ managedos_install_anaconda_host_key }}'
  register: managedos_install_anaconda_reachable_session

- name: Try the fleet account on that exact key
  bootwright.core.managedos_guest_command:
    address: '{{ bootwright_os_install_request.address }}'
    user: '{{ bootwright_os_install_request.user }}'
    identity: '{{ bootwright_os_install_material.fleetIdentity }}'
    ssh_config: '{{ managedos_install_anaconda_reachable_session.ssh_config }}'
    known_hosts: '{{ managedos_install_anaconda_reachable_session.known_hosts }}'
    host_key_algorithms: '{{ managedos_install_anaconda_reachable_session.host_key_algorithms }}'
    policy_host_key_algorithms: '{{ managedos_install_anaconda_reachable_session.policy_host_key_algorithms }}'
    argv:
      - /usr/bin/true
    timeout: '{{ managedos_install_anaconda_reachable_seconds | int }}'
  register: managedos_install_anaconda_reachable
  retries: '{{ managedos_install_anaconda_reachable_retries | int }}'
  delay: '{{ managedos_install_anaconda_reachable_pause | int }}'
  until: managedos_install_anaconda_reachable.rc | default(1) == 0
         or (managedos_install_anaconda_reachable.attempts | default(1) | int)
            > (managedos_install_anaconda_reachable_retries | int)
  failed_when: false
  changed_when: false
  no_log: true

- name: Close the pinned connection to the installed machine
  bootwright.core.managedos_guest_session:
    state: absent
    directory: '{{ managedos_install_anaconda_scratch }}'
