---
# An observation reads the registration the way an apply proves it, over the
# same pinned fleet connection guest.yml opens. It only
# inspects: no material is lent to it and the worker changes nothing, which
# the observe walk (cmd/bootwright) holds by the literal operation below.
- name: Open the pinned connection to the installed machine
  bootwright.core.managedos_guest_session:
    state: present
    directory: '{{ managedos_install_anaconda_scratch }}'
    address: '{{ bootwright_os_install_request.address }}'
    host_key: '{{ managedos_install_anaconda_host_key }}'
  register: managedos_install_anaconda_registration_observe_session

- name: Inspect the installed machine's registration through the fixed worker on that exact key
  bootwright.core.managedos_registration:
    operation: inspect
    address: '{{ bootwright_os_install_request.address }}'
    user: '{{ bootwright_os_install_request.user }}'
    identity: '{{ bootwright_os_install_material.fleetIdentity }}'
    ssh_config: '{{ managedos_install_anaconda_registration_observe_session.ssh_config }}'
    known_hosts: '{{ managedos_install_anaconda_registration_observe_session.known_hosts }}'
    host_key_algorithms: '{{ managedos_install_anaconda_registration_observe_session.host_key_algorithms }}'
    policy_host_key_algorithms: '{{ managedos_install_anaconda_registration_observe_session.policy_host_key_algorithms }}'
    request: '{{ bootwright_os_install_digest }}'
    timeout: 120
  register: managedos_install_anaconda_registration_read
  failed_when: false
  changed_when: false
  no_log: true

- name: Close the pinned connection to the installed machine
  bootwright.core.managedos_guest_session:
    state: absent
    directory: '{{ managedos_install_anaconda_scratch }}'

- name: Name the registration the worker read
  ansible.builtin.set_fact:
    managedos_install_anaconda_registration:
      consumer: >-
        {{ managedos_install_anaconda_registration_read.registration.consumer
           if (managedos_install_anaconda_registration_read.ok | default(false) | bool) else '' }}
      state: >-
        {{ managedos_install_anaconda_registration_read.registration.state
           if (managedos_install_anaconda_registration_read.ok | default(false) | bool) else '' }}
  changed_when: false
