---
# An observation reads the registration the way an apply proves it, over the
# same pinned fleet connection guest.yml makes, option for option. It only
# inspects: no material is lent to it and the worker changes nothing, which
# the observe walk (cmd/bootwright) holds by the literal operation below.
- name: Read the effective crypto policy on this connection's placement host
  bootwright.core.ssh_key_policy:
  register: managedos_install_anaconda_registration_observe_ssh_policy

- name: Publish the guest's own host key for this one connection
  ansible.builtin.copy:
    content: '{{ bootwright_os_install_request.address }} {{ managedos_install_anaconda_host_key | trim }}'
    dest: '{{ managedos_install_anaconda_scratch }}/known_hosts'
    owner: root
    group: root
    mode: '0600'
  changed_when: false

- name: Write the one-connection client configuration
  ansible.builtin.copy:
    content: '{{ managedos_install_anaconda_registration_observe_ssh_policy.configuration }}'
    dest: '{{ managedos_install_anaconda_scratch }}/ssh_config'
    owner: root
    group: root
    mode: '0600'
  changed_when: false

- name: Name the algorithms the guest's key is accepted under
  ansible.builtin.set_fact:
    managedos_install_anaconda_registration_observe_host_key_algorithms: >-
      {{ managedos_install_anaconda_host_key
         | bootwright.core.host_key_algorithms(managedos_install_anaconda_registration_observe_ssh_policy.hostKeyAlgorithms) }}
  changed_when: false

- name: Inspect the installed machine's registration through the fixed worker on that exact key
  bootwright.core.managedos_registration:
    operation: inspect
    address: '{{ bootwright_os_install_request.address }}'
    user: '{{ bootwright_os_install_request.user }}'
    identity: '{{ bootwright_os_install_material.fleetIdentity }}'
    ssh_config: '{{ managedos_install_anaconda_scratch }}/ssh_config'
    known_hosts: '{{ managedos_install_anaconda_scratch }}/known_hosts'
    host_key_algorithms: '{{ managedos_install_anaconda_registration_observe_host_key_algorithms }}'
    policy_host_key_algorithms: '{{ managedos_install_anaconda_registration_observe_ssh_policy.hostKeyAlgorithms }}'
    request: '{{ bootwright_os_install_digest }}'
    timeout: 120
  register: managedos_install_anaconda_registration_read
  failed_when: false
  changed_when: false
  no_log: true

- name: Remove the one-connection known-hosts file
  ansible.builtin.file:
    path: '{{ managedos_install_anaconda_scratch }}/known_hosts'
    state: absent
  changed_when: false

- name: Remove the one-connection client configuration
  ansible.builtin.file:
    path: '{{ managedos_install_anaconda_scratch }}/ssh_config'
    state: absent
  changed_when: false

- name: Name the registration the worker read
  ansible.builtin.set_fact:
    managedos_install_anaconda_registration:
      consumer: >-
        {{ managedos_install_anaconda_registration_read.registration.consumer
           if (managedos_install_anaconda_registration_read.ok | default(false) | bool) else '' }}
      state: >-
        {{ managedos_install_anaconda_registration_read.registration.state
           if (managedos_install_anaconda_registration_read.ok | default(false) | bool) else '' }}
  changed_when: false
