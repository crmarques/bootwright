---
# A removal unregisters only the consumer this installation created, over the
# same pinned fleet connection guest.yml opens. No material
# is lent to it: the worker removes the consumer its own record names and
# keeps any other registration.
- name: Open the pinned connection to the installed machine
  bootwright.core.managedos_guest_session:
    state: present
    directory: '{{ managedos_install_anaconda_scratch }}'
    address: '{{ bootwright_os_install_request.address }}'
    host_key: '{{ managedos_install_anaconda_host_key }}'
  register: managedos_install_anaconda_unregistration_session

- name: Unregister the consumer this installation created through the fixed worker on that exact key
  bootwright.core.managedos_registration:
    operation: unregister
    address: '{{ bootwright_os_install_request.address }}'
    user: '{{ bootwright_os_install_request.user }}'
    identity: '{{ bootwright_os_install_material.fleetIdentity }}'
    ssh_config: '{{ managedos_install_anaconda_unregistration_session.ssh_config }}'
    known_hosts: '{{ managedos_install_anaconda_unregistration_session.known_hosts }}'
    host_key_algorithms: '{{ managedos_install_anaconda_unregistration_session.host_key_algorithms }}'
    policy_host_key_algorithms: '{{ managedos_install_anaconda_unregistration_session.policy_host_key_algorithms }}'
    request: '{{ bootwright_os_install_digest }}'
    timeout: 330
  register: managedos_install_anaconda_unregistration_result
  failed_when: false
  changed_when: false
  no_log: true

- name: Close the pinned connection to the installed machine
  bootwright.core.managedos_guest_session:
    state: absent
    directory: '{{ managedos_install_anaconda_scratch }}'
