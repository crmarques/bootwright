argument_specs:
  apply:
    short_description: Install one Bootwright-managed operating system and prove it completed.
    options: &request
      bootwright_os_install_request:
        type: dict
        required: true
        options:
          address:
            type: str
            required: true
          bootMedia:
            type: dict
            required: true
          # The waits an apply performs, which the run's deadline covers.
          budgets:
            type: dict
            required: true
            options:
              identity: &budget
                type: dict
                required: true
                options:
                  attempts:
                    type: int
                    required: true
                  delaySeconds:
                    type: int
                    required: true
              installer: *budget
              networkApply: *budget
              networkReconnect: *budget
              reachability: *budget
              reboot: *budget
          diskEncryption:
            type: dict
            required: false
            options:
              recoveryPassphraseRef:
                type: str
                required: true
          fleetKeyRef:
            type: str
            required: true
          hostKeyPath:
            type: str
            required: true
          hostname:
            type: str
            required: true
          identity:
            type: dict
            required: true
          image:
            type: dict
            required: false
          installerArguments:
            type: list
            elements: str
            required: true
          kickstart:
            type: str
            required: true
          markerPath:
            type: str
            required: true
          network:
            type: dict
            required: true
            options:
              checkpointSeconds:
                type: int
                required: true
              document:
                type: dict
                required: true
              documentPath:
                type: str
                required: true
              markerPath:
                type: str
                required: true
          placement:
            type: dict
            required: true
          private:
            type: dict
            required: false
          registration:
            type: dict
            required: false
            options:
              activationKeyRef:
                type: str
                required: true
              entitlementRef:
                type: str
                required: true
              organizationRef:
                type: str
                required: true
              repositories:
                type: dict
                required: true
                options:
                  disable:
                    type: list
                    elements: str
                    required: true
                  enable:
                    type: list
                    elements: str
                    required: true
              satellite:
                type: dict
                required: false
                options:
                  contentBaseURL:
                    type: str
                    required: true
                  hostname:
                    type: str
                    required: true
                  trustBundleRef:
                    type: str
                    required: true
          target:
            type: dict
            required: true
          eraseOnRemoval:
            type: bool
            required: false
          tlsCertificateRef:
            type: str
            required: false
          tree:
            type: dict
            required: false
          treeMedia:
            type: dict
            required: false
          update:
            type: dict
            required: false
            options:
              policy:
                type: str
                required: true
                choices: [withinRelease]
              release:
                type: str
                required: true
          user:
            type: str
            required: true
          version:
            type: str
            required: true
            choices: [os-install-anaconda-v21]
      bootwright_os_install_digest:
        type: str
        required: true
      bootwright_run_scratch:
        type: path
        required: true
      bootwright_os_install_material:
        type: dict
        required: true

  observe:
    short_description: Observe one frozen installation without changing it.
    options: *request

  destroy:
    short_description: Remove what one frozen installation published and prove its absence.
    options: *request
