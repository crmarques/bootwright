---
- name: Create the private erase publication directories
  ansible.builtin.file:
    path: '{{ item }}'
    state: directory
    owner: root
    group: root
    mode: '0711'
  loop:
    - '{{ bootwright_physical_erase_request.install.private.path }}'
    - '{{ physical_erase_prepared.private }}'
  no_log: true

- name: Remove only the interrupted image before rebuilding
  ansible.builtin.file:
    path: '{{ physical_erase_prepared.private }}/erase.iso'
    state: absent
  no_log: true

- name: Build and privately publish the erase-only image
  bootwright.core.physical_erase:
    phase: build
    request: '{{ bootwright_physical_erase_request }}'
    digest: '{{ bootwright_physical_erase_digest }}'
    material: '{{ bootwright_physical_erase_material }}'
  no_log: true

- name: Keep the private image readable only by its serving group
  ansible.builtin.file:
    path: '{{ physical_erase_prepared.private }}/erase.iso'
    owner: root
    group: root
    mode: '0640'
  no_log: true

- name: Label the private image for its existing artifact listener
  ansible.builtin.command:
    argv:
      - /usr/bin/chcon
      - --reference
      - '{{ bootwright_physical_erase_request.install.servedRoot }}'
      - --recursive
      - '{{ bootwright_physical_erase_request.install.private.path }}'
    expand_argument_vars: false
  changed_when: true
  no_log: true

# The image's URL carries the token, so the shared proof fetches it hidden and
# refuses outside no_log with the cause alone.
- name: Prove the private image is served over its verified listener
  ansible.builtin.include_role:
    name: bootwright.core.infrastructureservices_artifact_listener
    tasks_from: proof
  vars:
    infrastructureservices_artifact_listener_url: '{{ physical_erase_prepared.url }}'
    infrastructureservices_artifact_listener_ca: '{{ bootwright_physical_erase_material.artifactCertificate }}'
    infrastructureservices_artifact_listener_token: '{{ physical_erase_prepared.url | dirname | basename }}'
    infrastructureservices_artifact_listener_subject: the private erase image
    infrastructureservices_artifact_listener_consequence: so the machine was not booted to erase

- name: Reprove the stopped target and boot only its private erase worker
  bootwright.core.physical_erase:
    phase: start
    request: '{{ bootwright_physical_erase_request }}'
    digest: '{{ bootwright_physical_erase_digest }}'
    material: '{{ bootwright_physical_erase_material }}'
  register: physical_erase_started
  no_log: true

- name: Report a refused start phase outside no_log
  ansible.builtin.include_tasks: refused.yml
  vars:
    physical_erase_refused: '{{ physical_erase_started }}'
  when: physical_erase_started.refused is defined
