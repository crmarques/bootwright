---
- name: Complete the physical erase execution handoff
  bootwright.core.physical_erase_protocol:
    phase: loaded
  no_log: true

- name: Validate the frozen private physical erase boundary
  ansible.builtin.assert:
    that:
      - bootwright_physical_erase_request.version == 'physical-erase-v1'
      - bootwright_physical_erase_request.install.target.physical | bool
      - bootwright_physical_erase_request.install.target.substrate == 'baremetal'
      - bootwright_physical_erase_request.install.target.controller.tlsVerify | bool
      - bootwright_physical_erase_request.install.target.controller.endpoint.startswith('https://')
      - bootwright_physical_erase_request.install.target.controller.virtualMedia.trust in ['established', 'import-certificate']
      - bootwright_physical_erase_material.pinnedUUIDBase64 | length > 0
    quiet: true
  no_log: true

- name: Read a prior durable completion before preparing private material
  bootwright.core.physical_erase:
    phase: observe
    request: '{{ bootwright_physical_erase_request }}'
    digest: '{{ bootwright_physical_erase_digest }}'
    material: '{{ bootwright_physical_erase_material }}'
  register: physical_erase_before
  no_log: true

- name: Complete an unfinished offline erase
  when: not (physical_erase_before.evidence.removed | bool)
  block:
    - name: Complete acknowledgement and offline proof before final custody cleanup
      when: not (physical_erase_before.finalizing | bool)
      block:
        - name: Hold the original attempt and erase-only host key in private custody
          bootwright.core.physical_erase:
            phase: prepare
            request: '{{ bootwright_physical_erase_request }}'
            digest: '{{ bootwright_physical_erase_digest }}'
            material: '{{ bootwright_physical_erase_material }}'
          register: physical_erase_prepared
          no_log: true

        - name: Boot the offline worker when no completed receipt exists
          ansible.builtin.include_tasks: boot.yml
          when: physical_erase_prepared.receipt is none and not (physical_erase_prepared.running | bool)

        - name: Wait for every target byte to be overwritten and independently read back
          bootwright.core.physical_erase:
            phase: await
            request: '{{ bootwright_physical_erase_request }}'
            digest: '{{ bootwright_physical_erase_digest }}'
            material: '{{ bootwright_physical_erase_material }}'
          register: physical_erase_receipt
          no_log: true

        - name: Durably record the verified receipt before acknowledging shutdown
          bootwright.core.physical_erase_protocol:
            phase: prepared
            receipt: '{{ physical_erase_receipt.receipt }}'
          no_log: true

        - name: Acknowledge the recorded receipt to the pinned RAM worker
          bootwright.core.physical_erase:
            phase: ack
            request: '{{ bootwright_physical_erase_request }}'
            digest: '{{ bootwright_physical_erase_digest }}'
            material: '{{ bootwright_physical_erase_material }}'
          no_log: true

        - name: Prove the same machine powered off and eject only its erase media
          bootwright.core.physical_erase:
            phase: stop-proof
            request: '{{ bootwright_physical_erase_request }}'
            digest: '{{ bootwright_physical_erase_digest }}'
            material: '{{ bootwright_physical_erase_material }}'
          no_log: true

        - name: Withdraw the private erase publication
          ansible.builtin.file:
            path: '{{ physical_erase_prepared.private }}'
            state: absent
          no_log: true

    - name: Retain the receipt and remove boot-private custody
      bootwright.core.physical_erase:
        phase: finish
        request: '{{ bootwright_physical_erase_request }}'
        digest: '{{ bootwright_physical_erase_digest }}'
        material: '{{ bootwright_physical_erase_material }}'
      register: physical_erase_finished
      no_log: true

- name: Publish the verified physical erase completion
  bootwright.core.physical_erase_protocol:
    phase: completed
    outcome: '{{ "unchanged" if physical_erase_before.evidence.removed else "changed" }}'
    digest: '{{ bootwright_physical_erase_digest }}'
    evidence: '{{ physical_erase_before.evidence if physical_erase_before.evidence.removed else physical_erase_finished.evidence }}'
  no_log: true
