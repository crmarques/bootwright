---
argument_specs:
  destroy:
    short_description: Execute one frozen offline physical erase
    options: &erase_options
      bootwright_physical_erase_request:
        type: dict
        required: true
        options:
          version:
            type: str
            required: true
            choices: [physical-erase-v6]
          deadlineSeconds:
            type: int
            required: true
          install:
            type: dict
            required: true
          installDigest:
            type: str
            required: true
          network:
            type: str
            required: true
          # Go freezes only the logicalOverwrite method, so the request carries
          # no method to choose from. Go also bounds the targets: one to
          # sixteen, unique nonempty identities of at most 256, and a
          # sizeBytes of 4096 to 64 TiB in multiples of 4096. An argument
          # specification states no such bound; the worker's request
          # validation in physical_erase_worker.py alone checks them.
          targets:
            type: list
            elements: dict
            required: true
            options:
              deviceName:
                type: str
                required: true
              serialNumber:
                type: str
                required: true
              sizeBytes:
                type: int
                required: true
              wwn:
                type: str
                required: true
      bootwright_physical_erase_digest:
        type: str
        required: true
      bootwright_physical_erase_material:
        type: dict
        required: true
  observe:
    short_description: Read a durable physical erase receipt
    options: *erase_options
