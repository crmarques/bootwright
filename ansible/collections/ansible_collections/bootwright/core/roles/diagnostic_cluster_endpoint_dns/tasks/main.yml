---
# External-LB / external-DNS diagnostics. Runs when a cluster's endpoints use
# source.type=external — the operator owns the LB and DNS records. This reports
# hostname resolution from the provider-host vantage point without failing the
# apply.

- name: Resolve external endpoints for this cluster
  ansible.builtin.set_fact:
    bootwright_external_endpoints: >-
      {{
        bootwright_current_cluster.endpoints
        | selectattr('source', 'defined')
        | selectattr('source.type', 'equalto', 'external')
        | list
      }}
  changed_when: false

# No end_play here: this role runs inside a multi-host, strategy:free play, where
# meta:end_play would abort the play for ALL hosts, not just this one. The probe
# and report tasks below already no-op when bootwright_external_endpoints is empty
# (their loops iterate an empty list), so no short-circuit is needed.
- name: Validate external endpoint DNS
  ansible.builtin.command:
    argv:
      - getent
      - hosts
      - "{{ item.name }}.{{ bootwright_current_cluster.name }}.{{ bootwright_environment.baseDomain }}"
  loop: "{{ bootwright_external_endpoints }}"
  loop_control:
    label: "{{ item.name }} -> {{ item.address }}"
  changed_when: false
  failed_when: false
  register: bootwright_external_dns_probes

- name: Report DNS probe results
  ansible.builtin.debug:
    msg: >-
      {{ item.item.name }}.{{ bootwright_current_cluster.name }}.{{ bootwright_environment.baseDomain }}
      {{ '-> ' ~ item.stdout if item.rc == 0 else '(no resolution; operator must add DNS to ' ~ item.item.address ~ ')' }}
  loop: "{{ bootwright_external_dns_probes.results }}"
  loop_control:
    label: "{{ item.item.name }}"
