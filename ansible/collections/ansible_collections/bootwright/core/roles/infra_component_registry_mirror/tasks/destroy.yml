---
- name: Remove mirror registry container and reap orphans
  ansible.builtin.include_role:
    name: bootwright.core.support_component_teardown
    tasks_from: container.yml
  vars:
    bootwright_component_teardown_container: "{{ bootwright_registry_mirror_container_name }}"
    bootwright_component_teardown_kind: registry

- name: Remove mirror registry trust anchor
  ansible.builtin.include_role:
    name: bootwright.core.support_ca_trust
    tasks_from: remove.yml
  vars:
    bootwright_ca_trust_anchor: "{{ bootwright_registry_mirror_trust_anchor }}"

- name: Close mirror registry port on host firewall
  ansible.posix.firewalld:
    port: "{{ bootwright_component.port | int }}/tcp"
    state: disabled
    permanent: true
    immediate: true
  when:
    - bootwright_firewalld_available | default(false)
  failed_when: false

- name: Remove mirror registry state and ownership record
  ansible.builtin.include_role:
    name: bootwright.core.support_component_teardown
    tasks_from: state.yml
  vars:
    bootwright_component_teardown_state_dir: "{{ bootwright_registry_mirror_root }}"
