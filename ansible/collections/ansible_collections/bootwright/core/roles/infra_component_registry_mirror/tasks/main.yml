---
# Converges one mirror registry capability on this provider host. The
# renderer projects `bootwright_component` with:
#   { kind, providerName, name, hostRef, hostAddress, port,
#     realisation: 'mirrorRegistry', url }
# Image mirroring (`oc adm release mirror`) is not in scope of this
# role; the operator runs it once the registry is up. The role only
# stands up the Distribution container, htpasswd, and trust anchor.

- name: Load mirror registry package list
  ansible.builtin.include_vars: "os/{{ ansible_facts['os_family'] }}.yml"

- name: Install mirror registry packages
  ansible.builtin.package:
    name: "{{ bootwright_mr_packages }}"
    state: present

- name: Create mirror registry directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ bootwright_mr_root }}"
      mode: "0755"
    - path: "{{ bootwright_mr_data_dir }}"
      mode: "0755"
    - path: "{{ bootwright_mr_auth_dir }}"
      mode: "0700"
    - path: "{{ bootwright_mr_certs_dir }}"
      mode: "0755"

- name: Resolve mirror credentials path
  ansible.builtin.set_fact:
    bootwright_mr_credentials_path: >-
      {{
        (bootwright_secrets_dir ~ '/' ~ bootwright_environment.mirror.credentialsRef)
        if (bootwright_environment.mirror | default({})).credentialsRef | default('') | length > 0
        else ''
      }}
    bootwright_mr_trust_path: >-
      {{
        (bootwright_secrets_dir ~ '/' ~ bootwright_environment.mirror.trustBundleRef)
        if (bootwright_environment.mirror | default({})).trustBundleRef | default('') | length > 0
        else ''
      }}
  changed_when: false

- name: Load mirror credentials
  ansible.builtin.include_role:
    name: bootwright.core.helper_credentials
    tasks_from: load
  vars:
    bootwright_creds_path: "{{ bootwright_mr_credentials_path }}"
    bootwright_creds_var: bootwright_mr_credentials
    bootwright_creds_label: "registry mirror credentialsRef {{ bootwright_mr_credentials_path }}"
  when: (bootwright_mr_credentials_path | length) > 0

- name: Generate mirror htpasswd
  ansible.builtin.command:
    argv:
      - htpasswd
      - -niB
      - "{{ bootwright_mr_credentials.username }}"
    stdin: "{{ bootwright_mr_credentials.password }}"
  register: bootwright_mr_htpasswd
  changed_when: false
  no_log: true
  when: (bootwright_mr_credentials_path | length) > 0

- name: Write mirror htpasswd
  ansible.builtin.copy:
    dest: "{{ bootwright_mr_auth_dir }}/htpasswd"
    owner: root
    group: root
    mode: "0600"
    content: "{{ bootwright_mr_htpasswd.stdout }}\n"
  no_log: true
  when: (bootwright_mr_credentials_path | length) > 0

- name: Install registry trust bundle on host
  ansible.builtin.copy:
    src: "{{ bootwright_mr_trust_path }}"
    dest: "{{ bootwright_mr_trust_anchor }}"
    owner: root
    group: root
    mode: "0644"
    remote_src: false
  register: bootwright_mr_trust_installed
  when: (bootwright_mr_trust_path | length) > 0

- name: Update CA trust store
  ansible.builtin.command:
    argv:
      - update-ca-trust
  when: bootwright_mr_trust_installed.changed | default(false)
  changed_when: bootwright_mr_trust_installed.changed | default(false)

- name: Run mirror registry container
  containers.podman.podman_container:
    name: "{{ bootwright_mr_container_name }}"
    image: "{{ bootwright_component.image }}"
    state: started
    network: host
    user: "0:0"
    restart_policy: unless-stopped
    pull: missing
    env:
      REGISTRY_HTTP_ADDR: "0.0.0.0:{{ bootwright_component.port }}"
      REGISTRY_AUTH: "{{ 'htpasswd' if (bootwright_mr_credentials_path | length) > 0 else '' }}"
      REGISTRY_AUTH_HTPASSWD_PATH: "/auth/htpasswd"
      REGISTRY_AUTH_HTPASSWD_REALM: "Registry Realm"
    labels:
      bootwright.kind: registry
      bootwright.provider: "{{ bootwright_component.providerName }}"
      bootwright.name: "{{ bootwright_component.name }}"
    volumes:
      - "{{ bootwright_mr_data_dir }}:/var/lib/registry:Z"
      - "{{ bootwright_mr_auth_dir }}:/auth:ro,Z"

- name: Open mirror registry port on host firewall
  ansible.posix.firewalld:
    port: "{{ bootwright_component.port | int }}/tcp"
    state: enabled
    permanent: true
    immediate: true
  when: bootwright_firewalld_available | default(false)
