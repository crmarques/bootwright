---

- name: Enforce apply mode for this infra-component
  ansible.builtin.include_role:
    name: bootwright.core.ownership_record
    tasks_from: infra_component_container_gate.yml
  vars:
    bootwright_gate_container_name: "{{ bootwright_registry_mirror_container_name }}"

- name: Load mirror registry package list
  ansible.builtin.include_vars: "os/{{ ansible_facts['os_family'] }}.yml"

- name: Install mirror registry packages
  ansible.builtin.package:
    name: "{{ bootwright_registry_mirror_packages }}"
    state: present

- name: Create mirror registry directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ bootwright_registry_mirror_root }}"
      mode: "0755"
    - path: "{{ bootwright_registry_mirror_data_dir }}"
      mode: "0755"
    - path: "{{ bootwright_registry_mirror_auth_dir }}"
      mode: "0700"
    - path: "{{ bootwright_registry_mirror_certs_dir }}"
      mode: "0755"

- name: Resolve mirror credentials path
  ansible.builtin.set_fact:
    bootwright_registry_mirror_credentials_path: >-
      {{
        (bootwright_secrets_dir ~ '/' ~ bootwright_environment.mirror.credentialsRef)
        if (bootwright_environment.mirror | default({})).credentialsRef | default('') | length > 0
        else ''
      }}
    bootwright_registry_mirror_trust_path: >-
      {{
        (bootwright_secrets_dir ~ '/' ~ bootwright_environment.mirror.trustBundleRef)
        if (bootwright_environment.mirror | default({})).trustBundleRef | default('') | length > 0
        else ''
      }}
  changed_when: false

- name: Load mirror credentials
  ansible.builtin.include_role:
    name: bootwright.core.support_credentials
    tasks_from: load
  vars:
    bootwright_creds_path: "{{ bootwright_registry_mirror_credentials_path }}"
    bootwright_creds_var: bootwright_registry_mirror_credentials
    bootwright_creds_label: "registry mirror credentialsRef {{ bootwright_registry_mirror_credentials_path }}"
  when: (bootwright_registry_mirror_credentials_path | length) > 0

- name: Stat existing mirror htpasswd
  ansible.builtin.stat:
    path: "{{ bootwright_registry_mirror_auth_dir }}/htpasswd"
  register: bootwright_registry_mirror_htpasswd_stat
  when: (bootwright_registry_mirror_credentials_path | length) > 0

- name: Verify existing mirror htpasswd matches current credentials
  ansible.builtin.command:
    argv:
      - htpasswd
      - -vi
      - "{{ bootwright_registry_mirror_auth_dir }}/htpasswd"
      - "{{ bootwright_registry_mirror_credentials.username }}"
    stdin: "{{ bootwright_registry_mirror_credentials.password }}"
  register: bootwright_registry_mirror_htpasswd_verify
  no_log: "{{ bootwright_no_log | default(true) | bool }}"
  changed_when: false
  failed_when: false
  when:
    - (bootwright_registry_mirror_credentials_path | length) > 0
    - bootwright_registry_mirror_htpasswd_stat.stat.exists | default(false)

- name: Decide whether to rewrite mirror htpasswd
  ansible.builtin.set_fact:
    bootwright_registry_mirror_htpasswd_needs_write: >-
      {{
        not (bootwright_registry_mirror_htpasswd_stat.stat.exists | default(false))
        or (bootwright_registry_mirror_htpasswd_verify.rc | default(1)) != 0
      }}
  no_log: "{{ bootwright_no_log | default(true) | bool }}"
  changed_when: false
  when: (bootwright_registry_mirror_credentials_path | length) > 0

- name: Generate mirror htpasswd
  ansible.builtin.command:
    argv:
      - htpasswd
      - -niB
      - "{{ bootwright_registry_mirror_credentials.username }}"
    stdin: "{{ bootwright_registry_mirror_credentials.password }}"
  register: bootwright_registry_mirror_htpasswd
  changed_when: false
  no_log: "{{ bootwright_no_log | default(true) | bool }}"
  when:
    - (bootwright_registry_mirror_credentials_path | length) > 0
    - bootwright_registry_mirror_htpasswd_needs_write | default(false) | bool

- name: Write mirror htpasswd
  ansible.builtin.copy:
    dest: "{{ bootwright_registry_mirror_auth_dir }}/htpasswd"
    owner: root
    group: root
    mode: "0600"
    content: "{{ bootwright_registry_mirror_htpasswd.stdout }}\n"
  no_log: "{{ bootwright_no_log | default(true) | bool }}"
  when:
    - (bootwright_registry_mirror_credentials_path | length) > 0
    - bootwright_registry_mirror_htpasswd_needs_write | default(false) | bool

- name: Install registry trust bundle on host
  ansible.builtin.include_role:
    name: bootwright.core.support_ca_trust
  vars:
    bootwright_ca_trust_source: "{{ bootwright_registry_mirror_trust_path }}"
    bootwright_ca_trust_anchor: "{{ bootwright_registry_mirror_trust_anchor }}"
  when: (bootwright_registry_mirror_trust_path | length) > 0

- name: Run mirror registry container
  containers.podman.podman_container:
    name: "{{ bootwright_registry_mirror_container_name }}"
    image: "{{ bootwright_component.image }}"
    state: started
    network: host
    user: "0:0"
    restart_policy: unless-stopped
    pull: missing
    env:
      REGISTRY_HTTP_ADDR: "0.0.0.0:{{ bootwright_component.port }}"
      REGISTRY_AUTH: "{{ 'htpasswd' if (bootwright_registry_mirror_credentials_path | length) > 0 else omit }}"
      REGISTRY_AUTH_HTPASSWD_PATH: "{{ '/auth/htpasswd' if (bootwright_registry_mirror_credentials_path | length) > 0 else omit }}"
      REGISTRY_AUTH_HTPASSWD_REALM: "{{ 'Registry Realm' if (bootwright_registry_mirror_credentials_path | length) > 0 else omit }}"
    labels:
      bootwright.kind: registry
      bootwright.provider: "{{ bootwright_component.providerName }}"
      bootwright.name: "{{ bootwright_component.name }}"
    volumes:
      - "{{ bootwright_registry_mirror_data_dir }}:/var/lib/registry:Z"
      - "{{ bootwright_registry_mirror_auth_dir }}:/auth:ro,Z"

- name: Open mirror registry port on host firewall
  ansible.posix.firewalld:
    port: "{{ bootwright_component.port | int }}/tcp"
    state: enabled
    permanent: true
    immediate: true
  when: bootwright_firewalld_available | default(false)

- name: Record mirror registry ownership
  ansible.builtin.include_role:
    name: bootwright.core.ownership_record
    tasks_from: resource.yml
  vars:
    bootwright_ownership_kind: infra-component
    bootwright_ownership_name: "{{ bootwright_component.providerName }}-{{ bootwright_component.name }}"
    bootwright_ownership_fields:
      provider: "{{ bootwright_component.providerName }}"
      paths:
        - "{{ bootwright_registry_mirror_root }}"
      labels:
        bootwright.kind: registry
        bootwright.provider: "{{ bootwright_component.providerName }}"
        bootwright.name: "{{ bootwright_component.name }}"
      attributes:
        componentKind: registry
        container: "{{ bootwright_registry_mirror_container_name }}"
        port: "{{ bootwright_component.port | int }}/tcp"
