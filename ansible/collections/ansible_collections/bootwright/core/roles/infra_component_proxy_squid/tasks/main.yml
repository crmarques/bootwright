---
# Converges one Squid forward-proxy capability on this provider host.
# The renderer projects `bootwright_component` with:
#   { kind, providerName, name, machineRef, machineAddress, port,
#     realisation: 'squid', url }
# Credentials come from Environment.spec.infraComponents.proxies[].spec.auth.proxyAuthRef and
# are resolved into `bootwright_proxy_credentials_ref` (a path under
# the secrets dir) by machine_proxy/defaults.

- name: Enforce apply mode for this infra-component
  ansible.builtin.include_role:
    name: bootwright.core.ownership_record
    tasks_from: infra_component_container_gate.yml

- name: Load Squid package list
  ansible.builtin.include_vars: "os/{{ ansible_facts['os_family'] }}.yml"

- name: Install Squid packages
  ansible.builtin.package:
    name: "{{ bootwright_squid_packages }}"
    state: present

- name: Create Squid directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ bootwright_squid_root }}", mode: "0755" }
    - { path: "{{ bootwright_squid_config_dir }}", mode: "0755" }
    - { path: "{{ bootwright_squid_auth_dir }}", mode: "0700", owner: "{{ bootwright_squid_runtime_uid }}", group: "{{ bootwright_squid_runtime_gid }}" }
    - { path: "{{ bootwright_squid_cache_dir }}", mode: "0755", owner: "{{ bootwright_squid_runtime_uid }}", group: "{{ bootwright_squid_runtime_gid }}" }
    - { path: "{{ bootwright_squid_logs_dir }}", mode: "0755", owner: "{{ bootwright_squid_runtime_uid }}", group: "{{ bootwright_squid_runtime_gid }}" }

- name: Load Squid auth credentials
  ansible.builtin.include_role:
    name: bootwright.core.support_credentials
    tasks_from: load
  vars:
    bootwright_creds_path: "{{ bootwright_proxy_credentials_ref }}"
    bootwright_creds_var: bootwright_squid_credentials
    bootwright_creds_label: "proxy auth ref {{ bootwright_proxy_credentials_ref }}"
  when: (bootwright_proxy_credentials_ref | length) > 0

- name: Generate Squid htpasswd
  ansible.builtin.command:
    argv:
      - htpasswd
      - -niB
      - "{{ bootwright_squid_credentials.username }}"
    stdin: "{{ bootwright_squid_credentials.password }}"
  register: bootwright_squid_htpasswd
  changed_when: false
  no_log: true
  when: (bootwright_proxy_credentials_ref | length) > 0

- name: Write Squid htpasswd
  ansible.builtin.copy:
    dest: "{{ bootwright_squid_auth_dir }}/htpasswd"
    owner: "{{ bootwright_squid_runtime_uid }}"
    group: "{{ bootwright_squid_runtime_gid }}"
    mode: "0600"
    content: "{{ bootwright_squid_htpasswd.stdout }}\n"
  no_log: true
  when: (bootwright_proxy_credentials_ref | length) > 0

- name: Write Squid configuration
  ansible.builtin.template:
    src: squid.conf.j2
    dest: "{{ bootwright_squid_config_dir }}/squid.conf"
    owner: root
    group: root
    mode: "0644"
  register: bootwright_squid_config

- name: Run Squid container
  containers.podman.podman_container:
    name: "{{ bootwright_squid_container_name }}"
    image: "{{ bootwright_component.image }}"
    state: started
    recreate: "{{ bootwright_squid_config.changed }}"
    network: host
    user: "{{ bootwright_squid_runtime_uid }}:{{ bootwright_squid_runtime_gid }}"
    restart_policy: unless-stopped
    pull: missing
    command: "squid -N -f /etc/squid/squid.conf"
    labels:
      bootwright.kind: proxy
      bootwright.provider: "{{ bootwright_component.providerName }}"
      bootwright.name: "{{ bootwright_component.name }}"
    volumes:
      - "{{ bootwright_squid_config_dir }}/squid.conf:/etc/squid/squid.conf:ro,Z"
      - "{{ bootwright_squid_auth_dir }}:/etc/squid/auth:ro,Z"
      - "{{ bootwright_squid_cache_dir }}:/var/spool/squid:Z"
      - "{{ bootwright_squid_logs_dir }}:/var/log/squid:Z"

- name: Open Squid port on host firewall (firewalld)
  ansible.posix.firewalld:
    port: "{{ bootwright_component.port | int }}/tcp"
    state: enabled
    permanent: true
    immediate: true
  when: bootwright_firewalld_available | default(false)

- name: Record Squid proxy ownership
  ansible.builtin.include_role:
    name: bootwright.core.ownership_record
    tasks_from: resource.yml
  vars:
    bootwright_ownership_kind: infra-component
    bootwright_ownership_name: "{{ bootwright_component.providerName }}-{{ bootwright_component.name }}"
    bootwright_ownership_fields:
      provider: "{{ bootwright_component.providerName }}"
      paths:
        - "{{ bootwright_squid_root }}"
      labels:
        bootwright.kind: proxy
        bootwright.provider: "{{ bootwright_component.providerName }}"
        bootwright.name: "{{ bootwright_component.name }}"
      attributes:
        componentKind: proxy
        container: "{{ bootwright_squid_container_name }}"
        port: "{{ bootwright_component.port | int }}/tcp"
