---
# Self-contained shared bastion service: one Squid proxy container can be referenced by
# several Bootwright contexts. When another context still references it the Go destroy
# planner lists it in bootwright_infra_component_release_records; we then RELEASE it —
# skip every destructive step but still drop this context's ownership record — so the
# shared proxy survives for the other contexts.
- name: Resolve shared-service release decision for Squid proxy
  ansible.builtin.set_fact:
    bootwright_component_release: >-
      {{ bootwright_infra_component_release_records is defined
         and (bootwright_component.providerName ~ '-' ~ bootwright_component.name)
             in bootwright_infra_component_release_records.split(',') }}
  changed_when: false

- name: Remove Squid container
  containers.podman.podman_container:
    name: "{{ bootwright_squid_container_name }}"
    state: absent
  when: not bootwright_component_release

- name: Reap orphan Squid from a leaked container instance
  ansible.builtin.include_role:
    name: bootwright.core.support_process_cleanup
  vars:
    bootwright_process_cleanup_podman_filters:
      - "label=bootwright.kind=proxy"
      - "label=bootwright.provider={{ bootwright_component.providerName }}"
      - "label=bootwright.name={{ bootwright_component.name }}"
    bootwright_process_cleanup_mark_changed: false
  when: not bootwright_component_release

- name: Close Squid port on host firewall (firewalld)
  ansible.posix.firewalld:
    port: "{{ bootwright_component.port | int }}/tcp"
    state: disabled
    permanent: true
    immediate: true
  when:
    - not bootwright_component_release
    - bootwright_firewalld_available | default(false)
  failed_when: false

- name: Remove Squid state directory
  ansible.builtin.file:
    path: "{{ bootwright_squid_root }}"
    state: absent
  when: not bootwright_component_release

- name: Remove Squid ownership record
  ansible.builtin.include_role:
    name: bootwright.core.ownership_record
    tasks_from: remove_resource.yml
  vars:
    bootwright_ownership_kind: infra-component
    bootwright_ownership_name: "{{ bootwright_component.providerName }}-{{ bootwright_component.name }}"
