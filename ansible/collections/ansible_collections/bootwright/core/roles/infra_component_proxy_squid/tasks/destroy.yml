---
- name: Remove Squid container and reap orphans
  ansible.builtin.include_role:
    name: bootwright.core.support_component_teardown
    tasks_from: container.yml
  vars:
    bootwright_component_teardown_container: "{{ bootwright_squid_container_name }}"
    bootwright_component_teardown_kind: proxy

- name: Close Squid port on host firewall (firewalld)
  ansible.posix.firewalld:
    port: "{{ bootwright_component.port | int }}/tcp"
    state: disabled
    permanent: true
    immediate: true
  when:
    - bootwright_firewalld_available | default(false)
  failed_when: false

- name: Remove Squid state and ownership record
  ansible.builtin.include_role:
    name: bootwright.core.support_component_teardown
    tasks_from: state.yml
  vars:
    bootwright_component_teardown_state_dir: "{{ bootwright_squid_root }}"
