---
- name: Validate the frozen controller request
  ansible.builtin.assert:
    that:
      - bootwright_controller_request.version == 'controller-prerequisites-v1'
      - bootwright_controller_request.tools | length >= 1
      - bootwright_controller_request.tools | length <= 128
      - bootwright_controller_request.acquisition | length == bootwright_controller_request.tools | length
      - bootwright_controller_request.publicationBundle.path is string
      - bootwright_controller_request.publicationBundle.device | int > 0
      - bootwright_controller_request.publicationBundle.inode | int > 0
    quiet: true
  no_log: true

- name: Complete the qualified execution handoff
  bootwright.core.controller_protocol:
    phase: loaded
  no_log: true

- name: Record durable preparation before tool effects
  bootwright.core.controller_protocol:
    phase: prepared
    request: '{{ bootwright_controller_request }}'
  register: controller_prerequisites_plan
  no_log: true

- name: Authorize the target tool preparation
  bootwright.core.controller_protocol:
    phase: continue
  no_log: true

- name: Prepare every exact target tool at once
  bootwright.core.controller_tool:
    bundle: '{{ bootwright_controller_request.publicationBundle }}'
    tools: '{{ bootwright_controller_request.tools }}'
    egress: '{{ bootwright_controller_request.egress }}'
    trust: '{{ bootwright_controller_request.trust }}'
    inspect_only: false
    acquisition: '{{ bootwright_controller_request.acquisition }}'
  register: controller_prerequisites_tools
  no_log: true
  diff: false

- name: Publish bounded controller completion evidence
  bootwright.core.controller_protocol:
    phase: completed
    request: '{{ bootwright_controller_request }}'
    preparation: '{{ controller_prerequisites_plan.preparation }}'
    tools: '{{ controller_prerequisites_tools.evidence }}'
    tools_changed: '{{ controller_prerequisites_tools.changed }}'
  no_log: true
