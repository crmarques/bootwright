---
- name: Validate the frozen controller request
  ansible.builtin.assert:
    that:
      - bootwright_controller_request.version == 'controller-prerequisites-v6'
      - bootwright_controller_request.tools | length >= 1
      - bootwright_controller_request.tools | length <= 128
      - bootwright_controller_request.acquisition | length == bootwright_controller_request.tools | length
      - bootwright_controller_request.publicationBundle.path is string
      - bootwright_controller_request.publicationBundle.device | int > 0
      - bootwright_controller_request.publicationBundle.inode | int > 0
    quiet: true
  no_log: true

- name: Complete the qualified execution handoff
  bootwright.core.controller_protocol:
    phase: loaded
  no_log: true

- name: Record durable preparation before tool effects
  bootwright.core.controller_protocol:
    phase: prepared
    request: '{{ bootwright_controller_request }}'
  register: controller_prerequisites_plan
  no_log: true

- name: Prepare the exact target tool members
  ansible.builtin.include_tasks: tool.yml
  loop: '{{ bootwright_controller_request.tools }}'
  loop_control:
    label: '{{ item.kind }}'
  no_log: true

- name: Publish bounded controller completion evidence
  bootwright.core.controller_protocol:
    phase: completed
    request: '{{ bootwright_controller_request }}'
    preparation: '{{ controller_prerequisites_plan.preparation }}'
    tools: '{{ controller_prerequisites_tool_evidence | default([]) }}'
    tools_changed: '{{ controller_prerequisites_tools_changed | default(false) }}'
  no_log: true
