argument_specs:
  main:
    short_description: Publish the frozen target tools of one controller stage.
    options:
      bootwright_controller_request:
        type: dict
        required: true
        options:
          version:
            type: str
            required: true
            choices: [controller-prerequisites-v6]
          identity:
            type: str
            required: true
          publicationBundle:
            type: dict
            required: true
          tools:
            type: list
            elements: dict
            required: true
          acquisition:
            type: list
            elements: dict
            required: true
          egress:
            type: dict
            required: true
