---
- name: Resolve KubeVirt destroy inputs
  ansible.builtin.set_fact:
    bootwright_kubevirt_kubeconfig: "{{ bootwright_component.kubevirt.kubeconfig | default('') }}"
    bootwright_kubevirt_namespace: "{{ bootwright_component.kubevirt.namespace | default('') }}"
    bootwright_kubevirt_host_cluster: "{{ bootwright_component.kubevirt.hostClusterRef | default('') }}"
    bootwright_kubevirt_vm_name: "{{ bootwright_current_cluster.name }}-{{ bootwright_component.name }}"
    bootwright_kubevirt_root_dv_name: "{{ bootwright_current_cluster.name }}-{{ bootwright_component.name }}-root"
    bootwright_kubevirt_iso_dv_name: "{{ bootwright_current_cluster.name }}-{{ bootwright_component.name }}-agent-iso"
    bootwright_kubevirt_iso_source_dv_name: "{{ bootwright_current_cluster.name }}-agent-iso-source"
    bootwright_kubevirt_cluster_scope_teardown: "{{ bootwright_destroy_machine_scope is not defined }}"
  changed_when: false

- name: Validate KubeVirt destroy inputs
  ansible.builtin.assert:
    that:
      - bootwright_kubevirt_namespace | length > 0
    fail_msg: >-
      KubeVirt destroy for {{ bootwright_current_cluster.name }}/{{ bootwright_component.name }}
      is missing the host namespace.

- name: Resolve KubeVirt host cluster kubeconfig availability
  ansible.builtin.set_fact:
    bootwright_kubevirt_host_kubeconfig_available: "{{ bootwright_kubevirt_kubeconfig | length > 0 }}"
  changed_when: false

- name: Probe KubeVirt host cluster reachability
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ bootwright_kubevirt_kubeconfig }}"
      - --request-timeout=15s
      - get
      - --raw=/version
  register: bootwright_kubevirt_host_probe
  changed_when: false
  failed_when: false
  when: bootwright_kubevirt_host_kubeconfig_available | bool

- name: Resolve KubeVirt host cluster reachability
  ansible.builtin.set_fact:
    bootwright_kubevirt_host_reachable: >-
      {{
        (bootwright_kubevirt_host_kubeconfig_available | bool)
        and (bootwright_kubevirt_host_probe.rc | default(1)) == 0
      }}
  changed_when: false

- name: Resolve KubeVirt machine ownership record presence
  ansible.builtin.set_fact:
    bootwright_kubevirt_machine_recorded: >-
      {{
        (bootwright_ownership_records_by_kind | default({})).get('kubevirt-machine', [])
        | selectattr('name', 'equalto', bootwright_kubevirt_vm_name)
        | list | length > 0
      }}
  changed_when: false

- name: Require a captured kubeconfig for the recorded KubeVirt guest
  ansible.builtin.assert:
    that:
      - bootwright_kubevirt_host_kubeconfig_available | bool
    fail_msg: >-
      Cannot destroy recorded KubeVirt guest {{ bootwright_kubevirt_vm_name }}: host cluster
      {{ bootwright_kubevirt_host_cluster | default('<external>', true) }} has no captured
      kubeconfig in this context, so the guest cannot be deleted or proven absent. Restore
      the host cluster and retry.
  when: bootwright_kubevirt_machine_recorded | default(false) | bool

- name: Require the KubeVirt host cluster to be reachable
  ansible.builtin.assert:
    that:
      - bootwright_kubevirt_host_reachable | bool
    fail_msg: >-
      Cannot destroy recorded KubeVirt guest {{ bootwright_kubevirt_vm_name }}: host cluster
      {{ bootwright_kubevirt_host_cluster | default('<external>', true) }} is unreachable, and
      --authorize unreachable-nodes cannot prove the guest absent. Power the host on and retry.
  when:
    - bootwright_kubevirt_machine_recorded | default(false) | bool
    - bootwright_kubevirt_host_kubeconfig_available | bool

- name: Note never-provisioned KubeVirt guest on an unavailable host cluster
  ansible.builtin.debug:
    msg: >-
      {{ bootwright_current_cluster.name }}/{{ bootwright_component.name }}: no kubevirt-machine
      ownership record, and host cluster
      {{ bootwright_kubevirt_host_cluster | default('<external>', true) }}
      {{ 'has no captured kubeconfig' if not (bootwright_kubevirt_host_kubeconfig_available | bool) else 'is unreachable' }}
      — the guest was never provisioned, so substrate teardown is a no-op.
  when:
    - not (bootwright_kubevirt_machine_recorded | default(false) | bool)
    - not (bootwright_kubevirt_host_reachable | bool)

- name: Tear down KubeVirt guest on the reachable host cluster
  when: bootwright_kubevirt_host_reachable | bool
  block:
    - name: Read KubeVirt VirtualMachine ownership label
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig
          - "{{ bootwright_kubevirt_kubeconfig }}"
          - -n
          - "{{ bootwright_kubevirt_namespace }}"
          - get
          - virtualmachine
          - "{{ bootwright_kubevirt_vm_name }}"
          - -o
          - 'jsonpath={.metadata.labels.bootwright\.io/managed-by}'
      register: bootwright_kubevirt_vm_owner
      changed_when: false
      failed_when: false

    - name: Require a conclusive KubeVirt VirtualMachine probe
      ansible.builtin.assert:
        that:
          - >-
            (bootwright_kubevirt_vm_owner.rc | default(1)) == 0
            or 'NotFound' in (bootwright_kubevirt_vm_owner.stderr | default(''))
        fail_msg: >-
          Could not determine whether VirtualMachine {{ bootwright_kubevirt_vm_name }}
          in namespace {{ bootwright_kubevirt_namespace }} exists:
          {{ bootwright_kubevirt_vm_owner.stderr | default('kubectl get failed with no detail') }}.
          Refusing to treat it as absent — that would skip its teardown and drop
          its ownership record while the VM may still run. Fix host-cluster
          kubeconfig access and re-run destroy.

    - name: Resolve KubeVirt VirtualMachine ownership for destroy
      ansible.builtin.set_fact:
        bootwright_kubevirt_vm_present: "{{ (bootwright_kubevirt_vm_owner.rc | default(1)) == 0 }}"
        bootwright_kubevirt_destroy_owned: >-
          {{ (bootwright_kubevirt_vm_owner.rc | default(1)) != 0
             or (bootwright_kubevirt_vm_owner.stdout | default('') | trim) == 'bootwright' }}
      changed_when: false

    - name: Note already-absent KubeVirt VirtualMachine
      ansible.builtin.debug:
        msg: >-
          VirtualMachine {{ bootwright_kubevirt_vm_name }} in namespace
          {{ bootwright_kubevirt_namespace }} is not present on the host cluster;
          nothing to tear down.
      when: not (bootwright_kubevirt_vm_present | bool)

    - name: Refuse to delete a non-Bootwright KubeVirt VirtualMachine
      ansible.builtin.assert:
        that:
          - bootwright_kubevirt_destroy_owned | default(false) | bool
        fail_msg: >-
          Refusing to delete VirtualMachine {{ bootwright_kubevirt_vm_name }} in namespace
          {{ bootwright_kubevirt_namespace }}: it exists but is not labelled
          bootwright.io/managed-by=bootwright, so it is not a Bootwright-owned resource.
          Pass --authorize unowned-vms to delete it anyway.
      when: not (bootwright_destroy_authorize_unowned_vms | default(false) | bool)

    - name: Warn before force-deleting an unowned KubeVirt VirtualMachine
      ansible.builtin.debug:
        msg: >-
          --authorize unowned-vms: deleting VirtualMachine {{ bootwright_kubevirt_vm_name }} in
          namespace {{ bootwright_kubevirt_namespace }} despite a missing or mismatched
          bootwright.io/managed-by=bootwright ownership label.
      when:
        - bootwright_destroy_authorize_unowned_vms | default(false) | bool
        - not (bootwright_kubevirt_destroy_owned | default(false) | bool)

    - name: Delete KubeVirt VirtualMachine
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig
          - "{{ bootwright_kubevirt_kubeconfig }}"
          - -n
          - "{{ bootwright_kubevirt_namespace }}"
          - delete
          - virtualmachine
          - "{{ bootwright_kubevirt_vm_name }}"
          - --ignore-not-found=true
      register: bootwright_kubevirt_vm_delete
      changed_when: "'deleted' in (bootwright_kubevirt_vm_delete.stdout | default(''))"
      when: bootwright_kubevirt_vm_present | bool

    - name: Read KubeVirt DataVolume ownership labels
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig
          - "{{ bootwright_kubevirt_kubeconfig }}"
          - -n
          - "{{ bootwright_kubevirt_namespace }}"
          - get
          - datavolume
          - "{{ item }}"
          - -o
          - 'jsonpath={.metadata.labels.bootwright\.io/managed-by}'
      loop: >-
        {{
          [bootwright_kubevirt_root_dv_name, bootwright_kubevirt_iso_dv_name]
          + (
            [bootwright_kubevirt_iso_source_dv_name]
            if (bootwright_kubevirt_cluster_scope_teardown | bool)
            else []
          )
        }}
      register: bootwright_kubevirt_dv_owner
      changed_when: false
      failed_when: false

    - name: Read KubeVirt PersistentVolumeClaim ownership labels
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig
          - "{{ bootwright_kubevirt_kubeconfig }}"
          - -n
          - "{{ bootwright_kubevirt_namespace }}"
          - get
          - persistentvolumeclaim
          - "{{ item }}"
          - -o
          - 'jsonpath={.metadata.labels.bootwright\.io/managed-by}'
      loop: >-
        {{
          [bootwright_kubevirt_root_dv_name, bootwright_kubevirt_iso_dv_name]
          + (
            [bootwright_kubevirt_iso_source_dv_name]
            if (bootwright_kubevirt_cluster_scope_teardown | bool)
            else []
          )
        }}
      register: bootwright_kubevirt_pvc_probe
      changed_when: false
      failed_when: false

    - name: Require conclusive KubeVirt DataVolume probes
      ansible.builtin.assert:
        that:
          - >-
            (item.rc | default(1)) == 0
            or 'NotFound' in (item.stderr | default(''))
        fail_msg: >-
          Could not determine whether DataVolume {{ item.item }} in namespace
          {{ bootwright_kubevirt_namespace }} exists:
          {{ item.stderr | default('kubectl get failed with no detail') }}.
          Refusing to treat it as absent — its teardown would be silently
          skipped. Fix host-cluster kubeconfig access and re-run destroy.
        quiet: true
      loop: "{{ bootwright_kubevirt_dv_owner.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Refuse to delete a non-Bootwright KubeVirt DataVolume
      ansible.builtin.assert:
        that:
          - (item.rc | default(1)) != 0 or (item.stdout | default('') | trim) == 'bootwright'
        fail_msg: >-
          Refusing to delete DataVolume {{ item.item }} in namespace
          {{ bootwright_kubevirt_namespace }}: it exists but is not labelled
          bootwright.io/managed-by=bootwright, so it is not a Bootwright-owned resource.
          Pass --authorize unowned-networks to delete it anyway.
        quiet: true
      loop: "{{ bootwright_kubevirt_dv_owner.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: not (bootwright_destroy_authorize_unowned_networks | default(false) | bool)

    - name: Warn before force-deleting an unowned KubeVirt DataVolume
      ansible.builtin.debug:
        msg: >-
          --authorize unowned-networks: deleting DataVolume {{ item.item }} in namespace
          {{ bootwright_kubevirt_namespace }} despite a missing or mismatched
          bootwright.io/managed-by=bootwright ownership label.
      loop: "{{ bootwright_kubevirt_dv_owner.results }}"
      loop_control:
        label: "{{ item.item }}"
      when:
        - bootwright_destroy_authorize_unowned_networks | default(false) | bool
        - (item.rc | default(1)) == 0
        - (item.stdout | default('') | trim) != 'bootwright'

    - name: Refuse to delete a non-Bootwright KubeVirt PersistentVolumeClaim
      ansible.builtin.assert:
        that:
          - >-
            (item.rc | default(1)) != 0
            or (item.stdout | default('') | trim) | length == 0
            or (item.stdout | default('') | trim) == 'bootwright'
        fail_msg: >-
          Refusing to delete PersistentVolumeClaim {{ item.item }} in namespace
          {{ bootwright_kubevirt_namespace }}: it exists and is labelled
          bootwright.io/managed-by={{ item.stdout | default('') | trim }}, so it belongs to
          another owner. A claim orphaned by a Bootwright DataVolume carries no ownership
          label of its own and is purged without a token; this one names someone else.
          Pass --authorize unowned-networks to delete it anyway.
        quiet: true
      loop: "{{ bootwright_kubevirt_pvc_probe.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: not (bootwright_destroy_authorize_unowned_networks | default(false) | bool)

    - name: Warn before force-deleting an unowned KubeVirt PersistentVolumeClaim
      ansible.builtin.debug:
        msg: >-
          --authorize unowned-networks: deleting PersistentVolumeClaim {{ item.item }} in
          namespace {{ bootwright_kubevirt_namespace }} despite a
          bootwright.io/managed-by={{ item.stdout | default('') | trim }} ownership label
          naming another owner.
      loop: "{{ bootwright_kubevirt_pvc_probe.results }}"
      loop_control:
        label: "{{ item.item }}"
      when:
        - bootwright_destroy_authorize_unowned_networks | default(false) | bool
        - (item.rc | default(1)) == 0
        - (item.stdout | default('') | trim) | length > 0
        - (item.stdout | default('') | trim) != 'bootwright'

    - name: Delete KubeVirt DataVolumes
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig
          - "{{ bootwright_kubevirt_kubeconfig }}"
          - -n
          - "{{ bootwright_kubevirt_namespace }}"
          - delete
          - datavolume
          - "{{ bootwright_kubevirt_root_dv_name }}"
          - "{{ bootwright_kubevirt_iso_dv_name }}"
          - --ignore-not-found=true
      register: bootwright_kubevirt_dv_delete
      changed_when: "'deleted' in (bootwright_kubevirt_dv_delete.stdout | default(''))"
      when: >-
        bootwright_kubevirt_dv_owner.results
        | selectattr('rc', 'defined')
        | selectattr('rc', 'equalto', 0)
        | list | length > 0

    - name: Purge the KubeVirt root disk PersistentVolumeClaim
      ansible.builtin.include_role:
        name: bootwright.core.container_cluster_boot_kubevirt
        tasks_from: purge_media_pvc.yml
      vars:
        bootwright_kubevirt_media_pvc_name: "{{ bootwright_kubevirt_root_dv_name }}"
      when: >-
        bootwright_kubevirt_pvc_probe.results
        | selectattr('item', 'equalto', bootwright_kubevirt_root_dv_name)
        | selectattr('rc', 'defined')
        | selectattr('rc', 'equalto', 0)
        | list | length > 0

    - name: Purge the KubeVirt agent ISO PersistentVolumeClaim
      ansible.builtin.include_role:
        name: bootwright.core.container_cluster_boot_kubevirt
        tasks_from: purge_media_pvc.yml
      vars:
        bootwright_kubevirt_media_pvc_name: "{{ bootwright_kubevirt_iso_dv_name }}"
      when: >-
        bootwright_kubevirt_pvc_probe.results
        | selectattr('item', 'equalto', bootwright_kubevirt_iso_dv_name)
        | selectattr('rc', 'defined')
        | selectattr('rc', 'equalto', 0)
        | list | length > 0

    - name: Delete the shared KubeVirt agent ISO source DataVolume
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig
          - "{{ bootwright_kubevirt_kubeconfig }}"
          - -n
          - "{{ bootwright_kubevirt_namespace }}"
          - delete
          - datavolume
          - "{{ bootwright_kubevirt_iso_source_dv_name }}"
          - --ignore-not-found=true
      register: bootwright_kubevirt_iso_source_delete
      changed_when: "'deleted' in (bootwright_kubevirt_iso_source_delete.stdout | default(''))"
      when:
        - bootwright_kubevirt_cluster_scope_teardown | bool
        - >-
          bootwright_kubevirt_dv_owner.results
          | selectattr('item', 'equalto', bootwright_kubevirt_iso_source_dv_name)
          | selectattr('rc', 'defined')
          | selectattr('rc', 'equalto', 0)
          | list | length > 0

    - name: Purge the shared KubeVirt agent ISO source PersistentVolumeClaim
      ansible.builtin.include_role:
        name: bootwright.core.container_cluster_boot_kubevirt
        tasks_from: purge_media_pvc.yml
      vars:
        bootwright_kubevirt_media_pvc_name: "{{ bootwright_kubevirt_iso_source_dv_name }}"
      when:
        - bootwright_kubevirt_cluster_scope_teardown | bool
        - >-
          bootwright_kubevirt_pvc_probe.results
          | selectattr('item', 'equalto', bootwright_kubevirt_iso_source_dv_name)
          | selectattr('rc', 'defined')
          | selectattr('rc', 'equalto', 0)
          | list | length > 0

- name: Remove KubeVirt machine ownership record
  ansible.builtin.include_role:
    name: bootwright.core.ownership_record
    tasks_from: remove_resource.yml
  vars:
    bootwright_ownership_kind: kubevirt-machine
    bootwright_ownership_name: "{{ bootwright_current_cluster.name }}-{{ bootwright_component.name }}"
