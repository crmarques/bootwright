---
- name: Resolve KubeVirt node binding
  ansible.builtin.set_fact:
    bootwright_kubevirt_node: >-
      {{
        (
          bootwright_current_cluster.nodes
          | dict2items
          | selectattr('value.machineRef.name', 'defined')
          | selectattr('value.machineRef.name', 'equalto', bootwright_component.name)
          | list
          | first
        ) | default({})
      }}
  changed_when: false

- name: Resolve KubeVirt substrate release scope
  ansible.builtin.set_fact:
    bootwright_kubevirt_machine_released: >-
      {{
        (
          bootwright_current_cluster.name in (
            bootwright_substrate_reset_clusters | default('')
            | split(',') | map('trim') | reject('equalto', '') | list
          )
        )
        and (
          (
            bootwright_substrate_reset_machines | default('')
            | split(',') | map('trim') | reject('equalto', '') | list
            | map('split', '/') | map('first')
            | select('equalto', bootwright_current_cluster.name) | list | length == 0
          )
          or (
            (bootwright_current_cluster.name ~ '/' ~ bootwright_component.name)
            in (
              bootwright_substrate_reset_machines | default('')
              | split(',') | map('trim') | reject('equalto', '') | list
            )
          )
        )
      }}
  changed_when: false

- name: Resolve KubeVirt substrate inputs
  ansible.builtin.set_fact:
    bootwright_kubevirt_kubeconfig: "{{ bootwright_component.kubevirt.kubeconfig | default('') }}"
    bootwright_kubevirt_namespace: "{{ bootwright_component.kubevirt.namespace | default('') }}"
    bootwright_kubevirt_storage_class: "{{ bootwright_component.kubevirt.storageClassRef | default('') }}"
    bootwright_kubevirt_vm_name: "{{ bootwright_current_cluster.name }}-{{ bootwright_component.name }}"
    bootwright_kubevirt_root_dv_name: "{{ bootwright_current_cluster.name }}-{{ bootwright_component.name }}-root"
    bootwright_kubevirt_context_name: "{{ bootwright_clusters_dir | dirname | basename }}"
    bootwright_kubevirt_rebuild_authorized: >-
      {{
        (bootwright_kubevirt_machine_released | bool)
        or bootwright_current_cluster.name
        in (bootwright_ocp_rebuild_authorized_clusters | default('') | split(',') | map('trim') | reject('equalto', '') | list)
      }}
  changed_when: false

- name: Validate KubeVirt substrate inputs
  ansible.builtin.assert:
    that:
      - bootwright_kubevirt_node is mapping
      - bootwright_kubevirt_node.key | default('') | length > 0
      - bootwright_kubevirt_kubeconfig | length > 0
      - bootwright_kubevirt_namespace | length > 0
      - bootwright_component.interfaces | default([]) | length > 0
      - >-
        (
          bootwright_component.interfaces
          | default([])
          | map(attribute='networkAttachment.kubevirt.nad', default='')
          | select('string')
          | reject('equalto', '')
          | list
          | length
        )
        == (
          bootwright_component.interfaces | default([]) | length
        )
    fail_msg: >-
      KubeVirt machine {{ bootwright_current_cluster.name }}/{{ bootwright_component.name }}
      is missing a node binding, kubeconfig, namespace, rendered interface, or per-interface NAD.

- name: Probe configured KubeVirt storage class
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ bootwright_kubevirt_kubeconfig }}"
      - get
      - storageclass
      - "{{ bootwright_kubevirt_storage_class }}"
      - -o
      - name
  register: bootwright_kubevirt_storage_class_probe
  changed_when: false
  failed_when: false
  when: bootwright_kubevirt_storage_class | length > 0

- name: Require configured KubeVirt storage class
  ansible.builtin.assert:
    that:
      - (bootwright_kubevirt_storage_class_probe.rc | default(1)) == 0
    fail_msg: >-
      InfraProvider/{{ bootwright_component.providerName }} selects KubeVirt storageClassRef
      {{ bootwright_kubevirt_storage_class }}, but that StorageClass does not exist on
      {{
        ('host cluster ' ~ bootwright_component.kubevirt.hostClusterRef)
        if (bootwright_component.kubevirt.hostClusterRef | default('') | length > 0)
        else 'the external KubeVirt host cluster'
      }}. Correct storageClassRef to a class returned by
      {{
        ('`bootwright container-cluster oc --name ' ~ bootwright_component.kubevirt.hostClusterRef
         ~ ' get storageclass`')
        if (bootwright_component.kubevirt.hostClusterRef | default('') | length > 0)
        else '`kubectl --kubeconfig <host-kubeconfig> get storageclass`'
      }}
      before provisioning {{ bootwright_component.name }}.
  when: bootwright_kubevirt_storage_class | length > 0

- name: Read existing KubeVirt VirtualMachine identity
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ bootwright_kubevirt_kubeconfig }}"
      - -n
      - "{{ bootwright_kubevirt_namespace }}"
      - get
      - virtualmachine
      - "{{ bootwright_kubevirt_vm_name }}"
      - -o
      - json
  register: bootwright_kubevirt_vm_probe
  changed_when: false
  failed_when: false

- name: Classify existing KubeVirt VirtualMachine probe payload
  ansible.builtin.set_fact:
    bootwright_kubevirt_vm_payload: >-
      {{ bootwright_kubevirt_vm_probe.stdout | default('') | bootwright.core.bootwright_kubernetes_object_probe }}
  changed_when: false

- name: Require a conclusive KubeVirt VirtualMachine probe
  ansible.builtin.assert:
    that:
      - >-
        (
          bootwright_kubevirt_vm_probe.rc is defined
          and (bootwright_kubevirt_vm_probe.rc | int) == 0
          and bootwright_kubevirt_vm_payload.valid | bool
          and bootwright_kubevirt_vm_payload.value.get('apiVersion', '') == 'kubevirt.io/v1'
          and bootwright_kubevirt_vm_payload.value.get('kind', '') == 'VirtualMachine'
          and bootwright_kubevirt_vm_payload.value.get('metadata', {}).get('name', '') == bootwright_kubevirt_vm_name
          and bootwright_kubevirt_vm_payload.value.get('metadata', {}).get('namespace', '') == bootwright_kubevirt_namespace
        )
        or (
          bootwright_kubevirt_vm_probe.rc is defined
          and (bootwright_kubevirt_vm_probe.rc | int) != 0
          and 'NotFound' in (bootwright_kubevirt_vm_probe.stderr | default(''))
        )
    fail_msg: >-
      Could not determine whether VirtualMachine {{ bootwright_kubevirt_vm_name }}
      exists in namespace {{ bootwright_kubevirt_namespace }}:
      {{
        (
          bootwright_kubevirt_vm_payload.reason
          | default('kubectl returned a JSON object for a different resource identity', true)
        )
        if (
          bootwright_kubevirt_vm_probe.rc is defined
          and (bootwright_kubevirt_vm_probe.rc | int) == 0
        )
        else (
          bootwright_kubevirt_vm_probe.stderr
          | default('kubectl get failed with no detail', true)
        )
      }}.
      Refusing to apply because ownership cannot be proven. Fix host-cluster access, then
      re-run `{{ bootwright_mutating_invocation | default('the same bootwright apply invocation') }}`.

- name: Read existing KubeVirt root DataVolume identity
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ bootwright_kubevirt_kubeconfig }}"
      - -n
      - "{{ bootwright_kubevirt_namespace }}"
      - get
      - datavolume
      - "{{ bootwright_kubevirt_root_dv_name }}"
      - -o
      - json
  register: bootwright_kubevirt_root_dv_probe
  changed_when: false
  failed_when: false

- name: Classify existing KubeVirt root DataVolume probe payload
  ansible.builtin.set_fact:
    bootwright_kubevirt_root_dv_payload: >-
      {{ bootwright_kubevirt_root_dv_probe.stdout | default('') | bootwright.core.bootwright_kubernetes_object_probe }}
  changed_when: false

- name: Require a conclusive KubeVirt root DataVolume probe
  ansible.builtin.assert:
    that:
      - >-
        (
          bootwright_kubevirt_root_dv_probe.rc is defined
          and (bootwright_kubevirt_root_dv_probe.rc | int) == 0
          and bootwright_kubevirt_root_dv_payload.valid | bool
          and bootwright_kubevirt_root_dv_payload.value.get('apiVersion', '') == 'cdi.kubevirt.io/v1beta1'
          and bootwright_kubevirt_root_dv_payload.value.get('kind', '') == 'DataVolume'
          and bootwright_kubevirt_root_dv_payload.value.get('metadata', {}).get('name', '') == bootwright_kubevirt_root_dv_name
          and bootwright_kubevirt_root_dv_payload.value.get('metadata', {}).get('namespace', '') == bootwright_kubevirt_namespace
        )
        or (
          bootwright_kubevirt_root_dv_probe.rc is defined
          and (bootwright_kubevirt_root_dv_probe.rc | int) != 0
          and 'NotFound' in (bootwright_kubevirt_root_dv_probe.stderr | default(''))
        )
    fail_msg: >-
      Could not determine whether DataVolume {{ bootwright_kubevirt_root_dv_name }}
      exists in namespace {{ bootwright_kubevirt_namespace }}:
      {{
        (
          bootwright_kubevirt_root_dv_payload.reason
          | default('kubectl returned a JSON object for a different resource identity', true)
        )
        if (
          bootwright_kubevirt_root_dv_probe.rc is defined
          and (bootwright_kubevirt_root_dv_probe.rc | int) == 0
        )
        else (
          bootwright_kubevirt_root_dv_probe.stderr
          | default('kubectl get failed with no detail', true)
        )
      }}.
      Refusing to apply because ownership cannot be proven. Fix host-cluster access, then
      re-run `{{ bootwright_mutating_invocation | default('the same bootwright apply invocation') }}`.

- name: Resolve KubeVirt live resource documents
  ansible.builtin.set_fact:
    bootwright_kubevirt_vm_live: >-
      {{
        bootwright_kubevirt_vm_payload.value
        if (
          bootwright_kubevirt_vm_probe.rc is defined
          and (bootwright_kubevirt_vm_probe.rc | int) == 0
        )
        else {}
      }}
    bootwright_kubevirt_root_dv_live: >-
      {{
        bootwright_kubevirt_root_dv_payload.value
        if (
          bootwright_kubevirt_root_dv_probe.rc is defined
          and (bootwright_kubevirt_root_dv_probe.rc | int) == 0
        )
        else {}
      }}
  changed_when: false

- name: Resolve KubeVirt live resource ownership
  ansible.builtin.set_fact:
    bootwright_kubevirt_vm_exists: >-
      {{ bootwright_kubevirt_vm_probe.rc is defined and (bootwright_kubevirt_vm_probe.rc | int) == 0 }}
    bootwright_kubevirt_root_dv_exists: >-
      {{ bootwright_kubevirt_root_dv_probe.rc is defined and (bootwright_kubevirt_root_dv_probe.rc | int) == 0 }}
    bootwright_kubevirt_vm_owned: >-
      {{
        (bootwright_kubevirt_vm_probe.rc | default(1)) != 0
        or (
          bootwright_kubevirt_vm_live.get('metadata', {}).get('labels', {}).get('bootwright.io/managed-by', '') == 'bootwright'
          and bootwright_kubevirt_vm_live.get('metadata', {}).get('labels', {}).get('bootwright.io/context', '') == bootwright_kubevirt_context_name
          and bootwright_kubevirt_vm_live.get('metadata', {}).get('labels', {}).get('bootwright.io/cluster', '') == bootwright_current_cluster.name
          and bootwright_kubevirt_vm_live.get('metadata', {}).get('labels', {}).get('bootwright.io/node', '') == bootwright_component.name
        )
      }}
    bootwright_kubevirt_root_dv_owned: >-
      {{
        (bootwright_kubevirt_root_dv_probe.rc | default(1)) != 0
        or (
          bootwright_kubevirt_root_dv_live.get('metadata', {}).get('labels', {}).get('bootwright.io/managed-by', '') == 'bootwright'
          and bootwright_kubevirt_root_dv_live.get('metadata', {}).get('labels', {}).get('bootwright.io/context', '') == bootwright_kubevirt_context_name
          and bootwright_kubevirt_root_dv_live.get('metadata', {}).get('labels', {}).get('bootwright.io/cluster', '') == bootwright_current_cluster.name
          and bootwright_kubevirt_root_dv_live.get('metadata', {}).get('labels', {}).get('bootwright.io/node', '') == bootwright_component.name
        )
      }}
  changed_when: false

- name: Enforce KubeVirt VirtualMachine apply mode
  ansible.builtin.include_role:
    name: bootwright.core.ownership_record
    tasks_from: apply_mode_gate.yml
  vars:
    bootwright_gate_object: >-
      KubeVirt VirtualMachine {{ bootwright_kubevirt_namespace }}/{{ bootwright_kubevirt_vm_name }}
    bootwright_gate_exists: "{{ bootwright_kubevirt_vm_exists }}"
    bootwright_gate_owned: "{{ bootwright_kubevirt_vm_owned }}"

- name: Enforce KubeVirt root DataVolume apply mode
  ansible.builtin.include_role:
    name: bootwright.core.ownership_record
    tasks_from: apply_mode_gate.yml
  vars:
    bootwright_gate_object: >-
      KubeVirt DataVolume {{ bootwright_kubevirt_namespace }}/{{ bootwright_kubevirt_root_dv_name }}
    bootwright_gate_exists: "{{ bootwright_kubevirt_root_dv_exists }}"
    bootwright_gate_owned: "{{ bootwright_kubevirt_root_dv_owned }}"

- name: Read reused KubeVirt root claim volume mode
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ bootwright_kubevirt_kubeconfig }}"
      - -n
      - "{{ bootwright_kubevirt_namespace }}"
      - get
      - persistentvolumeclaim
      - "{{ bootwright_kubevirt_root_dv_name }}"
      - -o
      - jsonpath={.spec.volumeMode}
  register: bootwright_kubevirt_root_claim_mode_probe
  changed_when: false
  failed_when: false
  when:
    - bootwright_kubevirt_root_dv_exists | bool
    - not (bootwright_kubevirt_rebuild_authorized | bool)
    - bootwright_kubevirt_storage_class | length > 0

- name: Read KubeVirt storage profile volume mode
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ bootwright_kubevirt_kubeconfig }}"
      - get
      - storageprofile
      - "{{ bootwright_kubevirt_storage_class }}"
      - -o
      - jsonpath={.status.claimPropertySets[0].volumeMode}
  register: bootwright_kubevirt_storage_profile_mode_probe
  changed_when: false
  failed_when: false
  when:
    - bootwright_kubevirt_root_dv_exists | bool
    - not (bootwright_kubevirt_rebuild_authorized | bool)
    - bootwright_kubevirt_storage_class | length > 0

- name: Require a conclusive reused KubeVirt root claim volume mode probe
  ansible.builtin.assert:
    that:
      - (bootwright_kubevirt_root_claim_mode_probe.rc | default(1)) == 0
      - (bootwright_kubevirt_root_claim_mode_probe.stdout | default('') | trim) | length > 0
      - (bootwright_kubevirt_root_claim_mode_probe.stdout | default('') | trim) in ['Block', 'Filesystem']
    fail_msg: >-
      Cannot safely reuse KubeVirt root claim
      {{ bootwright_kubevirt_namespace }}/{{ bootwright_kubevirt_root_dv_name }} because its
      live volumeMode could not be read conclusively:
      {{
        (bootwright_kubevirt_root_claim_mode_probe.stderr | default('') | trim)
        | default(
            'the probe returned unsupported volumeMode '
            ~ (
              (bootwright_kubevirt_root_claim_mode_probe.stdout | default('') | trim)
              | default('<empty>', true)
            ),
            true
          )
      }}.
      Refusing to apply a VirtualMachine against storage whose immutable shape is unknown.
      Restore a readable matching claim, then re-run
      `{{ bootwright_mutating_invocation | default('the same bootwright apply invocation') }}`.
  when:
    - bootwright_kubevirt_root_dv_exists | bool
    - not (bootwright_kubevirt_rebuild_authorized | bool)
    - bootwright_kubevirt_storage_class | length > 0

- name: Require a conclusive KubeVirt storage profile volume mode probe
  ansible.builtin.assert:
    that:
      - (bootwright_kubevirt_storage_profile_mode_probe.rc | default(1)) == 0
      - (bootwright_kubevirt_storage_profile_mode_probe.stdout | default('') | trim) | length > 0
      - (bootwright_kubevirt_storage_profile_mode_probe.stdout | default('') | trim) in ['Block', 'Filesystem']
    fail_msg: >-
      Cannot safely reuse KubeVirt root claim
      {{ bootwright_kubevirt_namespace }}/{{ bootwright_kubevirt_root_dv_name }} because
      StorageProfile {{ bootwright_kubevirt_storage_class }} did not return a conclusive
      volumeMode:
      {{
        (bootwright_kubevirt_storage_profile_mode_probe.stderr | default('') | trim)
        | default(
            'the probe returned unsupported volumeMode '
            ~ (
              (bootwright_kubevirt_storage_profile_mode_probe.stdout | default('') | trim)
              | default('<empty>', true)
            ),
            true
          )
      }}.
      Refusing to apply a VirtualMachine until the existing claim can be compared with its
      current storage profile. Restore the StorageProfile, then re-run
      `{{ bootwright_mutating_invocation | default('the same bootwright apply invocation') }}`.
  when:
    - bootwright_kubevirt_root_dv_exists | bool
    - not (bootwright_kubevirt_rebuild_authorized | bool)
    - bootwright_kubevirt_storage_class | length > 0

- name: Resolve reused KubeVirt root claim volume mode
  ansible.builtin.set_fact:
    bootwright_kubevirt_root_claim_mode: >-
      {{ (bootwright_kubevirt_root_claim_mode_probe.stdout | default('')) | trim }}
    bootwright_kubevirt_storage_profile_mode: >-
      {{ (bootwright_kubevirt_storage_profile_mode_probe.stdout | default('')) | trim }}
  changed_when: false

- name: Refuse a reused KubeVirt root claim whose volume mode drifted from its storage profile
  ansible.builtin.assert:
    that:
      - bootwright_kubevirt_root_claim_mode == bootwright_kubevirt_storage_profile_mode
    fail_msg: >-
      KubeVirt root claim {{ bootwright_kubevirt_namespace }}/{{ bootwright_kubevirt_root_dv_name }}
      is volumeMode {{ bootwright_kubevirt_root_claim_mode }}, but StorageClass
      {{ bootwright_kubevirt_storage_class }} provisions
      {{ bootwright_kubevirt_storage_profile_mode }}. volumeMode is immutable once bound, so
      this claim predates the current disk shape and Bootwright reuses it as-is rather than
      re-sending a spec CDI's webhook would refuse. A Filesystem claim on a Block class backs
      the guest's virtio root disk with a disk.img file on a filesystem inside the RBD image,
      which slows the agent installer enough that it fails the node with "Writing image to
      disk did not sufficiently progress in the last 30m0s" and the cluster then times out
      waiting for bootstrap. Re-run
      `{{ bootwright_apply_rebuild_invocation | default('the same bootwright apply invocation in rebuild mode with data-loss authorization') }}` to
      destroy and recreate this disk — its contents are wiped — narrowing with `--machines`
      to leave the cluster's other disks alone.
  when:
    - bootwright_kubevirt_root_dv_exists | bool
    - not (bootwright_kubevirt_rebuild_authorized | bool)
    - bootwright_kubevirt_storage_class | length > 0

- name: Stop KubeVirt VirtualMachine for authorized rebuild
  ansible.builtin.command:
    argv:
      - virtctl
      - --kubeconfig
      - "{{ bootwright_kubevirt_kubeconfig }}"
      - stop
      - "{{ bootwright_kubevirt_vm_name }}"
      - --namespace
      - "{{ bootwright_kubevirt_namespace }}"
      - --force
      - --grace-period
      - "0"
  register: bootwright_kubevirt_rebuild_stop
  changed_when: bootwright_kubevirt_rebuild_stop.rc == 0
  failed_when:
    - bootwright_kubevirt_rebuild_stop.rc != 0
    - "'not running' not in ((bootwright_kubevirt_rebuild_stop.stderr | default('')) | lower)"
    - "'not found' not in ((bootwright_kubevirt_rebuild_stop.stderr | default('')) | lower)"
  when:
    - bootwright_kubevirt_rebuild_authorized | bool
    - bootwright_kubevirt_vm_exists | bool

- name: Delete KubeVirt VirtualMachine for authorized rebuild
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ bootwright_kubevirt_kubeconfig }}"
      - -n
      - "{{ bootwright_kubevirt_namespace }}"
      - delete
      - virtualmachine
      - "{{ bootwright_kubevirt_vm_name }}"
      - --wait=true
  register: bootwright_kubevirt_rebuild_vm_delete
  changed_when: "'deleted' in (bootwright_kubevirt_rebuild_vm_delete.stdout | default(''))"
  when:
    - bootwright_kubevirt_rebuild_authorized | bool
    - bootwright_kubevirt_vm_exists | bool

- name: Delete KubeVirt root DataVolume for authorized rebuild
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ bootwright_kubevirt_kubeconfig }}"
      - -n
      - "{{ bootwright_kubevirt_namespace }}"
      - delete
      - datavolume
      - "{{ bootwright_kubevirt_root_dv_name }}"
      - --wait=true
  register: bootwright_kubevirt_rebuild_root_delete
  changed_when: "'deleted' in (bootwright_kubevirt_rebuild_root_delete.stdout | default(''))"
  when:
    - bootwright_kubevirt_rebuild_authorized | bool
    - bootwright_kubevirt_root_dv_exists | bool

- name: Purge the KubeVirt root disk PersistentVolumeClaim for authorized rebuild
  ansible.builtin.include_role:
    name: bootwright.core.container_cluster_boot_kubevirt
    tasks_from: purge_media_pvc.yml
  vars:
    bootwright_kubevirt_media_pvc_name: "{{ bootwright_kubevirt_root_dv_name }}"
  when:
    - bootwright_kubevirt_rebuild_authorized | bool
    - bootwright_kubevirt_root_dv_exists | bool

- name: Ensure KubeVirt namespace exists
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ bootwright_kubevirt_kubeconfig }}"
      - create
      - namespace
      - "{{ bootwright_kubevirt_namespace }}"
  register: bootwright_kubevirt_namespace_create
  changed_when: bootwright_kubevirt_namespace_create.rc == 0
  failed_when:
    - bootwright_kubevirt_namespace_create.rc != 0
    - "'AlreadyExists' not in (bootwright_kubevirt_namespace_create.stderr | default(''))"

- name: Apply KubeVirt root disk DataVolume
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ bootwright_kubevirt_kubeconfig }}"
      - apply
      - -f
      - "-"
    stdin: "{{ lookup('ansible.builtin.template', 'datavolume-root.yaml.j2') }}"
  register: bootwright_kubevirt_root_apply
  changed_when: "'unchanged' not in (bootwright_kubevirt_root_apply.stdout | default(''))"
  when: >-
    not (bootwright_kubevirt_root_dv_exists | bool)
    or (bootwright_kubevirt_rebuild_authorized | bool)

- name: Apply KubeVirt VirtualMachine
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ bootwright_kubevirt_kubeconfig }}"
      - apply
      - -f
      - "-"
    stdin: "{{ lookup('ansible.builtin.template', 'virtualmachine.yaml.j2') }}"
  register: bootwright_kubevirt_vm_apply
  changed_when: "'unchanged' not in (bootwright_kubevirt_vm_apply.stdout | default(''))"

- name: Wait for KubeVirt root disk DataVolume
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ bootwright_kubevirt_kubeconfig }}"
      - -n
      - "{{ bootwright_kubevirt_namespace }}"
      - wait
      - "datavolume/{{ bootwright_kubevirt_root_dv_name }}"
      - --for=condition=Ready
      - "--timeout={{ bootwright_kubevirt_root_dv_ready_timeout }}"
  register: bootwright_kubevirt_root_dv_wait
  changed_when: false
  failed_when: false

- name: Collect KubeVirt root disk provisioning state when the DataVolume did not become ready
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ bootwright_kubevirt_kubeconfig }}"
      - -n
      - "{{ bootwright_kubevirt_namespace }}"
      - get
      - "datavolume/{{ bootwright_kubevirt_root_dv_name }}"
      - "persistentvolumeclaim/{{ bootwright_kubevirt_root_dv_name }}"
      - -o
      - >-
        jsonpath={range .items[*]}{.kind}/{.metadata.name} phase={.status.phase}
        progress={.status.progress} storageClass={.spec.storageClassName}
        volumeMode={.spec.volumeMode}{"\n"}{end}
  register: bootwright_kubevirt_root_dv_diagnosis
  changed_when: false
  failed_when: false
  when: (bootwright_kubevirt_root_dv_wait.rc | default(1) | int) != 0

- name: Require the KubeVirt root disk DataVolume to be ready
  ansible.builtin.assert:
    that:
      - (bootwright_kubevirt_root_dv_wait.rc | default(1) | int) == 0
    fail_msg: >-
      KubeVirt root disk DataVolume
      {{ bootwright_kubevirt_namespace }}/{{ bootwright_kubevirt_root_dv_name }} for machine
      {{ bootwright_component.name }} of cluster {{ bootwright_current_cluster.name }} did not
      reach condition=Ready within {{ bootwright_kubevirt_root_dv_ready_timeout }}.
      The disk is provisioned by CDI through the storage class this machine's provider
      declares, so a DataVolume stuck at ImportScheduled or Pending is a storage condition on
      the host cluster, not a KubeVirt one: the class has no provisioner answering, the
      backing storage is out of capacity, or — when the class is served by an external Ceph
      cluster through Data Foundation — its CSI driver cannot reach that cluster. Read the
      claim's events with
      `kubectl -n {{ bootwright_kubevirt_namespace }} describe pvc {{ bootwright_kubevirt_root_dv_name }}`
      before re-applying. Raise bootwright_kubevirt_root_dv_ready_timeout when the storage is
      merely slow rather than stuck.
      Observed: {{ (bootwright_kubevirt_root_dv_diagnosis.stdout | default('') | trim)
                   or '(kubectl reported no DataVolume or claim state)' }}
      kubectl wait reported: {{ (bootwright_kubevirt_root_dv_wait.stderr | default('') | trim)
                                or (bootwright_kubevirt_root_dv_wait.stdout | default('') | trim)
                                or '(no output)' }}
    quiet: true

- name: Record KubeVirt machine ownership
  ansible.builtin.include_role:
    name: bootwright.core.ownership_record
    tasks_from: resource.yml
  vars:
    bootwright_ownership_kind: kubevirt-machine
    bootwright_ownership_name: "{{ bootwright_current_cluster.name }}-{{ bootwright_component.name }}"
    bootwright_ownership_fields:
      provider: "{{ bootwright_component.providerName }}"
      cluster: "{{ bootwright_current_cluster.name }}"
      machine: "{{ bootwright_component.name }}"
      attributes:
        namespace: "{{ bootwright_kubevirt_namespace }}"
        virtualMachine: "{{ bootwright_kubevirt_vm_name }}"
        rootDataVolume: "{{ bootwright_kubevirt_root_dv_name }}"
