---
bootwright_kubevirt_boot_iso_timeout: 1800
bootwright_kubevirt_boot_vmi_timeout: 600
bootwright_kubevirt_virtctl_insecure_upload: false
bootwright_kubevirt_agent_iso_size: 4Gi
bootwright_kubevirt_iso_source_wait_delay: 5
bootwright_kubevirt_iso_source_wait_retries: >-
  {{
    (((bootwright_kubevirt_boot_iso_timeout | int) + 60)
     / (bootwright_kubevirt_iso_source_wait_delay | int))
    | round(0, 'ceil') | int
  }}
bootwright_kubevirt_iso_source_appear_retries: 12
bootwright_kubevirt_iso_clone_retries: 120
bootwright_kubevirt_iso_clone_delay: 5
bootwright_kubevirt_media_pvc_settle_retries: 60
bootwright_kubevirt_media_pvc_settle_delay: 5
bootwright_kubevirt_node_ready_probe_port: 22
bootwright_kubevirt_node_ready_timeout_seconds: 1800
bootwright_kubevirt_node_ready_ssh_connect_timeout_seconds: 10
bootwright_kubevirt_node_ready_ssh_auth_retries: 60
bootwright_kubevirt_node_ready_ssh_auth_delay_seconds: 10
