---
- name: Resolve KubeVirt boot inputs
  ansible.builtin.set_fact:
    bootwright_kubevirt_kubeconfig: "{{ bootwright_component.kubevirt.kubeconfig | default('') }}"
    bootwright_kubevirt_host_cluster_ref: "{{ bootwright_component.kubevirt.hostClusterRef | default('') }}"
    bootwright_kubevirt_namespace: "{{ bootwright_component.kubevirt.namespace | default('') }}"
    bootwright_kubevirt_storage_class: "{{ bootwright_component.kubevirt.storageClassRef | default('') }}"
    bootwright_kubevirt_vm_name: "{{ bootwright_current_cluster.name }}-{{ bootwright_component.name }}"
    bootwright_kubevirt_iso_dv_name: "{{ bootwright_current_cluster.name }}-{{ bootwright_component.name }}-agent-iso"
    bootwright_kubevirt_iso_source_dv_name: "{{ bootwright_current_cluster.name }}-agent-iso-source"
    bootwright_kubevirt_context_name: "{{ bootwright_clusters_dir | dirname | basename }}"
    bootwright_kubevirt_machine_record_path: >-
      {{ bootwright_ownership_dir }}/resources/kubevirt-machine/{{
        bootwright_current_cluster.name }}-{{ bootwright_component.name }}.json
  changed_when: false

- name: Read generated agent ISO path
  ansible.builtin.slurp:
    src: "{{ bootwright_install_local_work_dir }}/agent-iso.path"
  register: bootwright_kubevirt_agent_iso_path_file
  delegate_to: localhost
  become: false
  no_log: "{{ bootwright_no_log | default(true) | bool }}"

- name: Set generated agent ISO path
  ansible.builtin.set_fact:
    bootwright_kubevirt_agent_iso_path: "{{ bootwright_kubevirt_agent_iso_path_file.content | b64decode | trim }}"
  changed_when: false
  no_log: "{{ bootwright_no_log | default(true) | bool }}"

- name: Read agent ISO generation token
  ansible.builtin.slurp:
    src: "{{ bootwright_install_local_work_dir }}/agent-iso-publish-token"
  register: bootwright_kubevirt_agent_iso_token_file
  delegate_to: localhost
  become: false
  no_log: "{{ bootwright_no_log | default(true) | bool }}"

- name: Set KubeVirt agent ISO generation
  ansible.builtin.set_fact:
    bootwright_kubevirt_iso_generation: >-
      {{ ((bootwright_kubevirt_agent_iso_token_file.content | b64decode | trim) | hash('sha256'))[:32] }}
  changed_when: false
  no_log: "{{ bootwright_no_log | default(true) | bool }}"

- name: Validate KubeVirt boot inputs
  ansible.builtin.assert:
    that:
      - bootwright_kubevirt_kubeconfig | length > 0
      - bootwright_kubevirt_namespace | length > 0
      - bootwright_kubevirt_agent_iso_path | length > 0
      - bootwright_kubevirt_iso_generation | length == 32
    fail_msg: >-
      KubeVirt boot for {{ bootwright_current_cluster.name }}/{{ bootwright_component.name }}
      is missing kubeconfig, namespace, generated agent ISO path, or agent ISO generation.

- name: Resolve KubeVirt agent ISO sharing group
  ansible.builtin.set_fact:
    bootwright_kubevirt_iso_source_machines: >-
      {{
        bootwright_current_cluster.components
        | selectattr('kind', 'equalto', 'machines')
        | selectattr('bootApplyRole', 'defined')
        | selectattr('bootApplyRole', 'equalto', bootwright_component.bootApplyRole)
        | selectattr('kubevirt', 'defined')
        | selectattr('kubevirt.kubeconfig', 'defined')
        | selectattr('kubevirt.kubeconfig', 'equalto', bootwright_kubevirt_kubeconfig)
        | selectattr('kubevirt.namespace', 'defined')
        | selectattr('kubevirt.namespace', 'equalto', bootwright_kubevirt_namespace)
        | map(attribute='name')
        | sort
        | list
      }}
  changed_when: false

- name: Resolve KubeVirt agent ISO source election
  ansible.builtin.set_fact:
    bootwright_kubevirt_iso_source_shared: "{{ (bootwright_kubevirt_iso_source_machines | length) > 1 }}"
    bootwright_kubevirt_iso_source_actor: >-
      {{
        (bootwright_kubevirt_iso_source_machines | length) > 1
        and (bootwright_kubevirt_iso_source_machines | first) == bootwright_component.name
      }}
    bootwright_kubevirt_iso_source_signature: "bootwright|{{ bootwright_kubevirt_context_name }}|{{ bootwright_current_cluster.name }}||agent-iso-source|{{ bootwright_kubevirt_iso_generation }}|Succeeded"
  changed_when: false

- name: Read KubeVirt boot VirtualMachine identity
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ bootwright_kubevirt_kubeconfig }}"
      - -n
      - "{{ bootwright_kubevirt_namespace }}"
      - get
      - virtualmachine
      - "{{ bootwright_kubevirt_vm_name }}"
      - -o
      - json
  register: bootwright_kubevirt_boot_vm_probe
  changed_when: false
  failed_when: false

- name: Require a conclusive KubeVirt boot VirtualMachine probe
  ansible.builtin.assert:
    that:
      - >-
        (bootwright_kubevirt_boot_vm_probe.rc | default(1)) == 0
        or 'NotFound' in (bootwright_kubevirt_boot_vm_probe.stderr | default(''))
    fail_msg: >-
      Could not determine whether VirtualMachine {{ bootwright_kubevirt_vm_name }}
      exists in namespace {{ bootwright_kubevirt_namespace }}:
      {{ bootwright_kubevirt_boot_vm_probe.stderr | default('kubectl get failed with no detail') }}.
      Refusing to boot because ownership cannot be proven.

- name: Resolve KubeVirt boot VirtualMachine identity
  ansible.builtin.set_fact:
    bootwright_kubevirt_boot_vm_live: >-
      {{
        (bootwright_kubevirt_boot_vm_probe.stdout | from_json)
        if (bootwright_kubevirt_boot_vm_probe.rc | default(1)) == 0
        else {}
      }}
  changed_when: false

- name: Resolve KubeVirt boot VirtualMachine ownership
  ansible.builtin.set_fact:
    bootwright_kubevirt_boot_vm_exists: "{{ (bootwright_kubevirt_boot_vm_probe.rc | default(1)) == 0 }}"
    bootwright_kubevirt_boot_vm_owned: >-
      {{
        (bootwright_kubevirt_boot_vm_probe.rc | default(1)) == 0
        and bootwright_kubevirt_boot_vm_live.get('metadata', {}).get('labels', {}).get('bootwright.io/managed-by', '') == 'bootwright'
        and bootwright_kubevirt_boot_vm_live.get('metadata', {}).get('labels', {}).get('bootwright.io/context', '') == bootwright_kubevirt_context_name
        and bootwright_kubevirt_boot_vm_live.get('metadata', {}).get('labels', {}).get('bootwright.io/cluster', '') == bootwright_current_cluster.name
        and bootwright_kubevirt_boot_vm_live.get('metadata', {}).get('labels', {}).get('bootwright.io/node', '') == bootwright_component.name
      }}
  changed_when: false

- name: Require an owned KubeVirt boot VirtualMachine
  ansible.builtin.assert:
    that:
      - bootwright_kubevirt_boot_vm_exists | bool
      - bootwright_kubevirt_boot_vm_owned | bool
    fail_msg: >-
      Refusing to boot VirtualMachine {{ bootwright_kubevirt_namespace }}/{{ bootwright_kubevirt_vm_name }}:
      it is absent or its bootwright.io managed-by/context/cluster/node identity
      does not match this context and machine.

- name: Read existing KubeVirt agent ISO DataVolume identity
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ bootwright_kubevirt_kubeconfig }}"
      - -n
      - "{{ bootwright_kubevirt_namespace }}"
      - get
      - datavolume
      - "{{ bootwright_kubevirt_iso_dv_name }}"
      - -o
      - json
  register: bootwright_kubevirt_boot_iso_probe
  changed_when: false
  failed_when: false

- name: Require a conclusive KubeVirt agent ISO DataVolume probe
  ansible.builtin.assert:
    that:
      - >-
        (bootwright_kubevirt_boot_iso_probe.rc | default(1)) == 0
        or 'NotFound' in (bootwright_kubevirt_boot_iso_probe.stderr | default(''))
    fail_msg: >-
      Could not determine whether DataVolume {{ bootwright_kubevirt_iso_dv_name }}
      exists in namespace {{ bootwright_kubevirt_namespace }}:
      {{ bootwright_kubevirt_boot_iso_probe.stderr | default('kubectl get failed with no detail') }}.
      Refusing to replace it because ownership cannot be proven.

- name: Resolve KubeVirt agent ISO DataVolume identity
  ansible.builtin.set_fact:
    bootwright_kubevirt_boot_iso_live: >-
      {{
        (bootwright_kubevirt_boot_iso_probe.stdout | from_json)
        if (bootwright_kubevirt_boot_iso_probe.rc | default(1)) == 0
        else {}
      }}
  changed_when: false

- name: Resolve legacy KubeVirt agent ISO DataVolume candidate
  ansible.builtin.set_fact:
    bootwright_kubevirt_boot_iso_legacy_candidate: >-
      {{
        (bootwright_kubevirt_boot_iso_probe.rc | default(1)) == 0
        and bootwright_kubevirt_boot_vm_owned | bool
        and bootwright_kubevirt_boot_iso_live.get('metadata', {}).get('labels', {}).get('bootwright.io/managed-by', '') == 'bootwright'
        and bootwright_kubevirt_boot_iso_live.get('metadata', {}).get('labels', {}).get('bootwright.io/cluster', '') == bootwright_current_cluster.name
        and bootwright_kubevirt_boot_iso_live.get('metadata', {}).get('labels', {}).get('bootwright.io/role', '') == 'agent-iso'
        and 'bootwright.io/context' not in bootwright_kubevirt_boot_iso_live.get('metadata', {}).get('labels', {})
        and 'bootwright.io/node' not in bootwright_kubevirt_boot_iso_live.get('metadata', {}).get('labels', {})
      }}
    bootwright_kubevirt_machine_recorded: false
  changed_when: false

- name: Read KubeVirt machine ownership record
  ansible.builtin.slurp:
    src: "{{ bootwright_kubevirt_machine_record_path }}"
  register: bootwright_kubevirt_machine_record_slurp
  changed_when: false
  failed_when: false
  delegate_to: localhost
  when: bootwright_kubevirt_boot_iso_legacy_candidate | bool

- name: Resolve KubeVirt machine ownership record
  ansible.builtin.set_fact:
    bootwright_kubevirt_machine_record: >-
      {{
        (bootwright_kubevirt_machine_record_slurp.content | b64decode | from_json)
        if bootwright_kubevirt_machine_record_slurp.content is defined
        else {}
      }}
  changed_when: false
  when: bootwright_kubevirt_boot_iso_legacy_candidate | bool

- name: Verify KubeVirt machine ownership record
  ansible.builtin.set_fact:
    bootwright_kubevirt_machine_recorded: >-
      {{
        bootwright_kubevirt_machine_record.get('apiVersion', '') == 'bootwright.io/ownership/v1alpha1'
        and bootwright_kubevirt_machine_record.get('kind', '') == 'kubevirt-machine'
        and bootwright_kubevirt_machine_record.get('name', '') == bootwright_kubevirt_vm_name
        and bootwright_kubevirt_machine_record.get('owner', '') == 'bootwright'
        and bootwright_kubevirt_machine_record.get('context', '') == bootwright_kubevirt_context_name
        and bootwright_kubevirt_machine_record.get('cluster', '') == bootwright_current_cluster.name
        and bootwright_kubevirt_machine_record.get('machine', '') == bootwright_component.name
      }}
  changed_when: false
  when: bootwright_kubevirt_boot_iso_legacy_candidate | bool

- name: Resolve legacy KubeVirt agent ISO DataVolume ownership
  ansible.builtin.set_fact:
    bootwright_kubevirt_boot_iso_legacy_owned: >-
      {{
        bootwright_kubevirt_boot_iso_legacy_candidate | bool
        and bootwright_kubevirt_machine_recorded | bool
      }}
  changed_when: false

- name: Resolve KubeVirt agent ISO DataVolume ownership
  ansible.builtin.set_fact:
    bootwright_kubevirt_boot_iso_exists: "{{ (bootwright_kubevirt_boot_iso_probe.rc | default(1)) == 0 }}"
    bootwright_kubevirt_boot_iso_owned: >-
      {{
        (bootwright_kubevirt_boot_iso_probe.rc | default(1)) != 0
        or (
          bootwright_kubevirt_boot_iso_live.get('metadata', {}).get('labels', {}).get('bootwright.io/managed-by', '') == 'bootwright'
          and bootwright_kubevirt_boot_iso_live.get('metadata', {}).get('labels', {}).get('bootwright.io/context', '') == bootwright_kubevirt_context_name
          and bootwright_kubevirt_boot_iso_live.get('metadata', {}).get('labels', {}).get('bootwright.io/cluster', '') == bootwright_current_cluster.name
          and bootwright_kubevirt_boot_iso_live.get('metadata', {}).get('labels', {}).get('bootwright.io/node', '') == bootwright_component.name
          and bootwright_kubevirt_boot_iso_live.get('metadata', {}).get('labels', {}).get('bootwright.io/role', '') == 'agent-iso'
        )
        or bootwright_kubevirt_boot_iso_legacy_owned | bool
      }}
  changed_when: false

- name: Enforce KubeVirt agent ISO DataVolume apply mode
  ansible.builtin.include_role:
    name: bootwright.core.ownership_record
    tasks_from: apply_mode_gate.yml
  vars:
    bootwright_gate_object: >-
      KubeVirt DataVolume {{ bootwright_kubevirt_namespace }}/{{ bootwright_kubevirt_iso_dv_name }}
    bootwright_gate_exists: "{{ bootwright_kubevirt_boot_iso_exists }}"
    bootwright_gate_owned: "{{ bootwright_kubevirt_boot_iso_owned }}"

- name: Upgrade legacy KubeVirt agent ISO DataVolume ownership labels
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ bootwright_kubevirt_kubeconfig }}"
      - -n
      - "{{ bootwright_kubevirt_namespace }}"
      - label
      - datavolume
      - "{{ bootwright_kubevirt_iso_dv_name }}"
      - "bootwright.io/context={{ bootwright_kubevirt_context_name }}"
      - "bootwright.io/node={{ bootwright_component.name }}"
      - --overwrite
  register: bootwright_kubevirt_iso_legacy_label
  changed_when: bootwright_kubevirt_iso_legacy_label.rc == 0
  when: bootwright_kubevirt_boot_iso_legacy_owned | bool

- name: Read managed KubeVirt host cluster ingress CA bundle
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ bootwright_kubevirt_kubeconfig }}"
      - get
      - configmap
      - default-ingress-cert
      - -n
      - openshift-config-managed
      - -o
      - 'jsonpath={.data.ca-bundle\.crt}'
  register: bootwright_kubevirt_ingress_ca
  changed_when: false
  when: bootwright_kubevirt_host_cluster_ref | length > 0

- name: Validate managed KubeVirt host cluster ingress CA bundle
  ansible.builtin.assert:
    that:
      - (bootwright_kubevirt_ingress_ca.stdout | default('') | trim | length) > 0
    fail_msg: >-
      Could not read the ingress CA (configmap default-ingress-cert in
      openshift-config-managed) from managed KubeVirt host cluster
      {{ bootwright_kubevirt_host_cluster_ref }}; cannot verify the CDI upload proxy.
  when: bootwright_kubevirt_host_cluster_ref | length > 0

- name: Write managed KubeVirt host cluster ingress CA bundle
  ansible.builtin.copy:
    content: "{{ bootwright_kubevirt_ingress_ca.stdout }}"
    dest: "{{ bootwright_kubevirt_kubeconfig | dirname }}/host-ingress-ca.crt"
    mode: "0600"
  when: bootwright_kubevirt_host_cluster_ref | length > 0

- name: Read existing KubeVirt agent ISO source DataVolume identity
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ bootwright_kubevirt_kubeconfig }}"
      - -n
      - "{{ bootwright_kubevirt_namespace }}"
      - get
      - datavolume
      - "{{ bootwright_kubevirt_iso_source_dv_name }}"
      - -o
      - json
  register: bootwright_kubevirt_iso_source_probe
  changed_when: false
  failed_when: false
  when: bootwright_kubevirt_iso_source_shared | bool

- name: Require a conclusive KubeVirt agent ISO source DataVolume probe
  ansible.builtin.assert:
    that:
      - >-
        (bootwright_kubevirt_iso_source_probe.rc | default(1)) == 0
        or 'NotFound' in (bootwright_kubevirt_iso_source_probe.stderr | default(''))
    fail_msg: >-
      Could not determine whether DataVolume {{ bootwright_kubevirt_iso_source_dv_name }}
      exists in namespace {{ bootwright_kubevirt_namespace }}:
      {{ bootwright_kubevirt_iso_source_probe.stderr | default('kubectl get failed with no detail') }}.
      Refusing to replace the shared agent ISO media because ownership cannot be proven.
  when: bootwright_kubevirt_iso_source_shared | bool

- name: Resolve KubeVirt agent ISO source DataVolume identity
  ansible.builtin.set_fact:
    bootwright_kubevirt_iso_source_live: >-
      {{
        (bootwright_kubevirt_iso_source_probe.stdout | from_json)
        if (bootwright_kubevirt_iso_source_probe.rc | default(1)) == 0
        else {}
      }}
  changed_when: false
  when: bootwright_kubevirt_iso_source_shared | bool

- name: Resolve KubeVirt agent ISO source DataVolume ownership
  ansible.builtin.set_fact:
    bootwright_kubevirt_iso_source_exists: "{{ (bootwright_kubevirt_iso_source_probe.rc | default(1)) == 0 }}"
    bootwright_kubevirt_iso_source_owned: >-
      {{
        (bootwright_kubevirt_iso_source_probe.rc | default(1)) != 0
        or (
          bootwright_kubevirt_iso_source_live.get('metadata', {}).get('labels', {}).get('bootwright.io/managed-by', '') == 'bootwright'
          and bootwright_kubevirt_iso_source_live.get('metadata', {}).get('labels', {}).get('bootwright.io/context', '') == bootwright_kubevirt_context_name
          and bootwright_kubevirt_iso_source_live.get('metadata', {}).get('labels', {}).get('bootwright.io/cluster', '') == bootwright_current_cluster.name
          and bootwright_kubevirt_iso_source_live.get('metadata', {}).get('labels', {}).get('bootwright.io/role', '') == 'agent-iso-source'
          and 'bootwright.io/node' not in bootwright_kubevirt_iso_source_live.get('metadata', {}).get('labels', {})
        )
      }}
  changed_when: false
  when: bootwright_kubevirt_iso_source_shared | bool

- name: Resolve KubeVirt agent ISO source DataVolume currency
  ansible.builtin.set_fact:
    bootwright_kubevirt_iso_source_current: >-
      {{
        (bootwright_kubevirt_iso_source_probe.rc | default(1)) == 0
        and bootwright_kubevirt_iso_source_owned | bool
        and bootwright_kubevirt_iso_source_live.get('metadata', {}).get('labels', {}).get('bootwright.io/agent-iso-generation', '') == bootwright_kubevirt_iso_generation
        and bootwright_kubevirt_iso_source_live.get('status', {}).get('phase', '') == 'Succeeded'
      }}
  changed_when: false
  when: bootwright_kubevirt_iso_source_shared | bool

- name: Enforce KubeVirt agent ISO source DataVolume apply mode
  ansible.builtin.include_role:
    name: bootwright.core.ownership_record
    tasks_from: apply_mode_gate.yml
  vars:
    bootwright_gate_object: >-
      KubeVirt DataVolume {{ bootwright_kubevirt_namespace }}/{{ bootwright_kubevirt_iso_source_dv_name }}
    bootwright_gate_exists: "{{ bootwright_kubevirt_iso_source_exists | default(false) }}"
    bootwright_gate_owned: "{{ bootwright_kubevirt_iso_source_owned | default(false) }}"
  when: bootwright_kubevirt_iso_source_actor | default(false) | bool

- name: Remove stale KubeVirt agent ISO source DataVolume
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ bootwright_kubevirt_kubeconfig }}"
      - -n
      - "{{ bootwright_kubevirt_namespace }}"
      - delete
      - datavolume
      - "{{ bootwright_kubevirt_iso_source_dv_name }}"
      - --ignore-not-found=true
  register: bootwright_kubevirt_iso_source_delete
  changed_when: "'deleted' in (bootwright_kubevirt_iso_source_delete.stdout | default(''))"
  when:
    - bootwright_kubevirt_iso_source_actor | default(false) | bool
    - not (bootwright_kubevirt_iso_source_current | default(false) | bool)

- name: Build KubeVirt agent ISO source upload command
  ansible.builtin.set_fact:
    bootwright_kubevirt_source_upload_argv: >-
      {{
        [
          'virtctl',
          '--kubeconfig', bootwright_kubevirt_kubeconfig,
          'image-upload',
          'dv', bootwright_kubevirt_iso_source_dv_name,
          '--namespace', bootwright_kubevirt_namespace,
          '--image-path', bootwright_kubevirt_agent_iso_path,
          '--size', bootwright_kubevirt_agent_iso_size | string,
          '--force-bind',
          '--wait-secs', bootwright_kubevirt_boot_iso_timeout | string
        ]
        + (
          ['--storage-class', bootwright_kubevirt_storage_class]
          if (bootwright_kubevirt_storage_class | length) > 0
          else []
        )
        + (
          ['--insecure']
          if (bootwright_kubevirt_virtctl_insecure_upload | bool)
          else []
        )
      }}
  changed_when: false
  no_log: "{{ bootwright_no_log | default(true) | bool }}"
  when:
    - bootwright_kubevirt_iso_source_actor | default(false) | bool
    - not (bootwright_kubevirt_iso_source_current | default(false) | bool)

- name: Upload KubeVirt agent ISO source DataVolume
  ansible.builtin.command:
    argv: "{{ bootwright_kubevirt_source_upload_argv }}"
  register: bootwright_kubevirt_iso_source_upload
  changed_when: bootwright_kubevirt_iso_source_upload.rc == 0
  no_log: "{{ bootwright_no_log | default(true) | bool }}"
  environment: >-
    {{
      (bootwright_proxy_env | default({}))
      | combine({'SSL_CERT_FILE': (bootwright_kubevirt_kubeconfig | dirname) ~ '/host-ingress-ca.crt'})
      if (bootwright_kubevirt_host_cluster_ref | length) > 0
      else (bootwright_proxy_env | default({}))
    }}
  when:
    - bootwright_kubevirt_iso_source_actor | default(false) | bool
    - not (bootwright_kubevirt_iso_source_current | default(false) | bool)

- name: Label KubeVirt agent ISO source DataVolume as Bootwright-managed
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ bootwright_kubevirt_kubeconfig }}"
      - -n
      - "{{ bootwright_kubevirt_namespace }}"
      - label
      - datavolume
      - "{{ bootwright_kubevirt_iso_source_dv_name }}"
      - bootwright.io/managed-by=bootwright
      - "bootwright.io/context={{ bootwright_kubevirt_context_name }}"
      - "bootwright.io/cluster={{ bootwright_current_cluster.name }}"
      - bootwright.io/role=agent-iso-source
      - "bootwright.io/agent-iso-generation={{ bootwright_kubevirt_iso_generation }}"
      - --overwrite
  register: bootwright_kubevirt_iso_source_label
  changed_when: bootwright_kubevirt_iso_source_label.rc == 0
  when:
    - bootwright_kubevirt_iso_source_actor | default(false) | bool
    - not (bootwright_kubevirt_iso_source_current | default(false) | bool)
    - (bootwright_kubevirt_iso_source_upload.rc | default(1)) == 0

- name: Wait for the shared KubeVirt agent ISO source DataVolume
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ bootwright_kubevirt_kubeconfig }}"
      - -n
      - "{{ bootwright_kubevirt_namespace }}"
      - get
      - datavolume
      - "{{ bootwright_kubevirt_iso_source_dv_name }}"
      - -o
      - >-
        jsonpath={.metadata.labels.bootwright\.io/managed-by}|{.metadata.labels.bootwright\.io/context}|{.metadata.labels.bootwright\.io/cluster}|{.metadata.labels.bootwright\.io/node}|{.metadata.labels.bootwright\.io/role}|{.metadata.labels.bootwright\.io/agent-iso-generation}|{.status.phase}
  register: bootwright_kubevirt_iso_source_wait
  changed_when: false
  failed_when: false
  until: >-
    (bootwright_kubevirt_iso_source_wait.rc | default(1)) == 0
    and (bootwright_kubevirt_iso_source_wait.stdout | default('') | trim) == bootwright_kubevirt_iso_source_signature
  retries: "{{ bootwright_kubevirt_iso_source_wait_retries }}"
  delay: "{{ bootwright_kubevirt_iso_source_wait_delay }}"
  when:
    - bootwright_kubevirt_iso_source_shared | bool
    - not (bootwright_kubevirt_iso_source_actor | default(false) | bool)
    - not (bootwright_kubevirt_iso_source_current | default(false) | bool)

- name: Resolve KubeVirt agent ISO source DataVolume readiness
  ansible.builtin.set_fact:
    bootwright_kubevirt_iso_source_ready: >-
      {{
        (bootwright_kubevirt_iso_source_shared | bool)
        and (
          (bootwright_kubevirt_iso_source_current | default(false) | bool)
          or ((bootwright_kubevirt_iso_source_upload | default({})).rc | default(1)) == 0
          or (
            ((bootwright_kubevirt_iso_source_wait | default({})).rc | default(1)) == 0
            and ((bootwright_kubevirt_iso_source_wait | default({})).stdout | default('') | trim) == bootwright_kubevirt_iso_source_signature
          )
        )
      }}
  changed_when: false

- name: Report unavailable shared KubeVirt agent ISO media
  ansible.builtin.debug:
    msg: >-
      {{ bootwright_current_cluster.name }}/{{ bootwright_component.name }}: shared agent ISO
      DataVolume {{ bootwright_kubevirt_iso_source_dv_name }} did not reach the current
      generation on this run; falling back to a direct virtctl image-upload for this machine.
  when:
    - bootwright_kubevirt_iso_source_shared | bool
    - not (bootwright_kubevirt_iso_source_ready | bool)

- name: Query KubeVirt VirtualMachineInstance before installer boot
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ bootwright_kubevirt_kubeconfig }}"
      - -n
      - "{{ bootwright_kubevirt_namespace }}"
      - get
      - vmi
      - "{{ bootwright_kubevirt_vm_name }}"
      - -o
      - jsonpath={.status.phase}
  register: bootwright_kubevirt_power_gate
  changed_when: false
  failed_when: false
  when: bootwright_component.osManaged | default(true) | bool

- name: Resolve KubeVirt machine power gate verdict
  ansible.builtin.set_fact:
    bootwright_kubevirt_power_gate_off: >-
      {{
        ((bootwright_kubevirt_power_gate.rc | default(1) | int) != 0)
        and ('not found' in ((bootwright_kubevirt_power_gate.stderr | default('')) | lower))
      }}
  changed_when: false
  when: bootwright_component.osManaged | default(true) | bool

- name: Refuse to boot install media on a machine that is not powered off
  ansible.builtin.assert:
    that:
      - bootwright_kubevirt_power_gate_off | bool
    fail_msg: >-
      refusing to boot install media on machine
      {{ bootwright_component.name | default(inventory_hostname) }} for cluster
      {{ bootwright_current_cluster.name | default('<unknown>') }}:
      VirtualMachineInstance {{ bootwright_kubevirt_vm_name }} in namespace
      {{ bootwright_kubevirt_namespace }}
      {{
        ('reports phase ' ~ (bootwright_kubevirt_power_gate.stdout | default('') | trim | default('<unknown>', true)))
        if ((bootwright_kubevirt_power_gate.rc | default(1) | int) == 0)
        else ('could not be proven absent: ' ~ (bootwright_kubevirt_power_gate.stderr | default('no probe result') | trim))
      }},
      and booting the installer disk-wipes whatever the machine is running now.
      Bootwright installs a managed-OS machine only when its VirtualMachine is
      stopped: stopping it is the operator's own confirmation that nothing on
      the machine is still needed, no --authorize token stands in for it, and an
      unprovable power state fails closed the same way. Stop the VM
      (`virtctl stop {{ bootwright_kubevirt_vm_name }} --namespace {{ bootwright_kubevirt_namespace }}`)
      and re-run `bootwright apply`. If a previous bootwright run was
      interrupted while installing this machine, stopping it is safe — the
      install restarts from media and loses nothing.
    quiet: true
  when: bootwright_component.osManaged | default(true) | bool

- name: Stop KubeVirt VirtualMachine before replacing the agent ISO
  ansible.builtin.command:
    argv:
      - virtctl
      - --kubeconfig
      - "{{ bootwright_kubevirt_kubeconfig }}"
      - stop
      - "{{ bootwright_kubevirt_vm_name }}"
      - --namespace
      - "{{ bootwright_kubevirt_namespace }}"
      - --force
      - --grace-period
      - "0"
  register: bootwright_kubevirt_vm_stop
  changed_when: bootwright_kubevirt_vm_stop.rc == 0
  failed_when:
    - bootwright_kubevirt_vm_stop.rc != 0
    - "'not running' not in ((bootwright_kubevirt_vm_stop.stderr | default('')) | lower)"
    - "'not found' not in ((bootwright_kubevirt_vm_stop.stderr | default('')) | lower)"

- name: Remove previous KubeVirt agent ISO DataVolume
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ bootwright_kubevirt_kubeconfig }}"
      - -n
      - "{{ bootwright_kubevirt_namespace }}"
      - delete
      - datavolume
      - "{{ bootwright_kubevirt_iso_dv_name }}"
      - --ignore-not-found=true
  register: bootwright_kubevirt_iso_delete
  changed_when: "'deleted' in (bootwright_kubevirt_iso_delete.stdout | default(''))"

- name: Clone KubeVirt agent ISO DataVolume from the shared source
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ bootwright_kubevirt_kubeconfig }}"
      - apply
      - -f
      - "-"
    stdin: "{{ lookup('ansible.builtin.template', 'datavolume-agent-iso.yaml.j2') }}"
  register: bootwright_kubevirt_iso_clone_apply
  changed_when: "'unchanged' not in (bootwright_kubevirt_iso_clone_apply.stdout | default(''))"
  when: bootwright_kubevirt_iso_source_ready | bool

- name: Wait for the KubeVirt agent ISO DataVolume clone
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ bootwright_kubevirt_kubeconfig }}"
      - -n
      - "{{ bootwright_kubevirt_namespace }}"
      - get
      - datavolume
      - "{{ bootwright_kubevirt_iso_dv_name }}"
      - -o
      - 'jsonpath={.status.phase}'
  register: bootwright_kubevirt_iso_clone_phase
  changed_when: false
  failed_when: false
  until: >-
    (bootwright_kubevirt_iso_clone_phase.rc | default(1)) != 0
    or (bootwright_kubevirt_iso_clone_phase.stdout | default('') | trim) in ['Succeeded', 'Failed']
  retries: "{{ bootwright_kubevirt_iso_clone_retries }}"
  delay: "{{ bootwright_kubevirt_iso_clone_delay }}"
  when: bootwright_kubevirt_iso_source_ready | bool

- name: Resolve KubeVirt agent ISO DataVolume clone outcome
  ansible.builtin.set_fact:
    bootwright_kubevirt_iso_cloned: >-
      {{
        (bootwright_kubevirt_iso_source_ready | bool)
        and ((bootwright_kubevirt_iso_clone_phase | default({})).rc | default(1)) == 0
        and ((bootwright_kubevirt_iso_clone_phase | default({})).stdout | default('') | trim) == 'Succeeded'
      }}
  changed_when: false

- name: Report KubeVirt agent ISO clone fallback to direct upload
  ansible.builtin.debug:
    msg: >-
      {{ bootwright_current_cluster.name }}/{{ bootwright_component.name }}: cloning the agent ISO
      from shared DataVolume {{ bootwright_kubevirt_iso_source_dv_name }} did not reach Succeeded
      (phase {{ (bootwright_kubevirt_iso_clone_phase | default({})).stdout | default('<unavailable>') | trim }});
      falling back to a direct virtctl image-upload for this machine.
  when:
    - bootwright_kubevirt_iso_source_ready | bool
    - not (bootwright_kubevirt_iso_cloned | bool)

- name: Remove the failed KubeVirt agent ISO DataVolume clone
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ bootwright_kubevirt_kubeconfig }}"
      - -n
      - "{{ bootwright_kubevirt_namespace }}"
      - delete
      - datavolume
      - "{{ bootwright_kubevirt_iso_dv_name }}"
      - --ignore-not-found=true
  register: bootwright_kubevirt_iso_clone_delete
  changed_when: "'deleted' in (bootwright_kubevirt_iso_clone_delete.stdout | default(''))"
  when:
    - bootwright_kubevirt_iso_source_ready | bool
    - not (bootwright_kubevirt_iso_cloned | bool)

- name: Build virtctl image-upload command
  ansible.builtin.set_fact:
    bootwright_kubevirt_upload_argv: >-
      {{
        [
          'virtctl',
          '--kubeconfig', bootwright_kubevirt_kubeconfig,
          'image-upload',
          'dv', bootwright_kubevirt_iso_dv_name,
          '--namespace', bootwright_kubevirt_namespace,
          '--image-path', bootwright_kubevirt_agent_iso_path,
          '--size', bootwright_kubevirt_agent_iso_size | string,
          '--force-bind',
          '--wait-secs', bootwright_kubevirt_boot_iso_timeout | string
        ]
        + (
          ['--storage-class', bootwright_kubevirt_storage_class]
          if (bootwright_kubevirt_storage_class | length) > 0
          else []
        )
        + (
          ['--insecure']
          if (bootwright_kubevirt_virtctl_insecure_upload | bool)
          else []
        )
      }}
  changed_when: false
  no_log: "{{ bootwright_no_log | default(true) | bool }}"
  when: not (bootwright_kubevirt_iso_cloned | bool)

- name: Upload KubeVirt agent ISO DataVolume
  ansible.builtin.command:
    argv: "{{ bootwright_kubevirt_upload_argv }}"
  register: bootwright_kubevirt_iso_upload
  changed_when: bootwright_kubevirt_iso_upload.rc == 0
  no_log: "{{ bootwright_no_log | default(true) | bool }}"
  environment: >-
    {{
      (bootwright_proxy_env | default({}))
      | combine({'SSL_CERT_FILE': (bootwright_kubevirt_kubeconfig | dirname) ~ '/host-ingress-ca.crt'})
      if (bootwright_kubevirt_host_cluster_ref | length) > 0
      else (bootwright_proxy_env | default({}))
    }}
  when: not (bootwright_kubevirt_iso_cloned | bool)

- name: Label KubeVirt agent ISO DataVolume as Bootwright-managed
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ bootwright_kubevirt_kubeconfig }}"
      - -n
      - "{{ bootwright_kubevirt_namespace }}"
      - label
      - datavolume
      - "{{ bootwright_kubevirt_iso_dv_name }}"
      - bootwright.io/managed-by=bootwright
      - "bootwright.io/context={{ bootwright_kubevirt_context_name }}"
      - "bootwright.io/cluster={{ bootwright_current_cluster.name }}"
      - "bootwright.io/node={{ bootwright_component.name }}"
      - bootwright.io/role=agent-iso
      - --overwrite
  register: bootwright_kubevirt_iso_label
  changed_when: bootwright_kubevirt_iso_label.rc == 0

- name: Start KubeVirt VirtualMachine
  ansible.builtin.command:
    argv:
      - virtctl
      - --kubeconfig
      - "{{ bootwright_kubevirt_kubeconfig }}"
      - start
      - "{{ bootwright_kubevirt_vm_name }}"
      - --namespace
      - "{{ bootwright_kubevirt_namespace }}"
  register: bootwright_kubevirt_vm_start
  changed_when: bootwright_kubevirt_vm_start.rc == 0
  failed_when:
    - bootwright_kubevirt_vm_start.rc != 0
    - "'already' not in ((bootwright_kubevirt_vm_start.stderr | default('')) | lower)"

- name: Wait for the KubeVirt VirtualMachineInstance to be created
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ bootwright_kubevirt_kubeconfig }}"
      - -n
      - "{{ bootwright_kubevirt_namespace }}"
      - get
      - "vmi/{{ bootwright_kubevirt_vm_name }}"
      - -o
      - name
  register: bootwright_kubevirt_vmi_present
  changed_when: false
  failed_when: false
  until: bootwright_kubevirt_vmi_present.rc == 0
  retries: 30
  delay: 2

- name: Wait for KubeVirt VirtualMachineInstance readiness
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ bootwright_kubevirt_kubeconfig }}"
      - -n
      - "{{ bootwright_kubevirt_namespace }}"
      - wait
      - "vmi/{{ bootwright_kubevirt_vm_name }}"
      - --for=condition=Ready
      - "--timeout={{ bootwright_kubevirt_boot_vmi_timeout }}s"
  changed_when: false
