user default root;
worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format fetch '$remote_addr [$time_iso8601] $ssl_protocol $ssl_cipher $request_method $status $body_bytes_sent';
    access_log /dev/stdout fetch;
    server_tokens off;
    sendfile on;
    keepalive_timeout 30;

    server {
        listen 192.0.2.1:8080;

        root /var/lib/bootwright-services/lab-rhel/artifact-server/media/public;
        autoindex off;

        location / {
            try_files $uri =404;
        }
    }

    server {
        listen 192.0.2.1:8443 ssl;

        ssl_certificate /var/lib/bootwright-services/lab-rhel/artifact-server/media/tls/server.crt;
        ssl_certificate_key /var/lib/bootwright-services/lab-rhel/artifact-server/media/tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_timeout 10m;
        root /var/lib/bootwright-services/lab-rhel/artifact-server/media/public;
        autoindex off;

        location / {
            try_files $uri =404;
        }
    }

}
