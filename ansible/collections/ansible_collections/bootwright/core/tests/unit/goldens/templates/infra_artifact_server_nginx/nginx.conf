user default root;
worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format fetch '$remote_addr [$time_iso8601] $ssl_protocol $ssl_cipher $request_method $status $body_bytes_sent';
    access_log /dev/stdout fetch;
    server_tokens off;
    sendfile on;
    keepalive_timeout 30;

    server {
        listen 192.0.2.1:8080;

        # Request parsing errors must not log a private callback route.
        error_log /dev/null crit;
        location /_bootwright/ { return 404; }
        root /var/lib/bootwright-hosted/lab-rhel/services/artifact-server/media/public;
        autoindex off;

        location / {
            try_files $uri =404;
        }
    }

    server {
        listen 192.0.2.1:8443 ssl;

        ssl_certificate /var/lib/bootwright-hosted/lab-rhel/services/artifact-server/media/tls/server.crt;
        ssl_certificate_key /var/lib/bootwright-hosted/lab-rhel/services/artifact-server/media/tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_timeout 10m;
        # Request parsing errors must not log a private callback route.
        error_log /dev/null crit;
        location ~ "^/_bootwright/inventory/(?<receipt_id>[0-9a-f]{32})$" {
            access_log off;
            if ($request_method != POST) { return 405; }
            if ($http_transfer_encoding != "") { return 400; }
            if ($http_content_length = "") { return 411; }
            client_max_body_size 48k;
            client_body_buffer_size 64k;
            client_body_in_single_buffer on;
            client_body_timeout 10s;
            proxy_request_buffering on;
            proxy_buffering off;
            proxy_connect_timeout 2s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
            proxy_pass_request_headers off;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Content-Length $http_content_length;
            proxy_pass http://unix:/run/bootwright-receipts/aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa/$receipt_id:/report;
        }
        location /_bootwright/ { return 404; }
        root /var/lib/bootwright-hosted/lab-rhel/services/artifact-server/media/public;
        autoindex off;

        location / {
            try_files $uri =404;
        }
    }

}
