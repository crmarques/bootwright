---
- name: Run one physical offline erase operation
  hosts: bootwright_target
  gather_facts: false
  any_errors_fatal: true
  serial: 1
  strategy: ansible.builtin.linear
  tasks:
    - name: Execute the physical erase capability
      ansible.builtin.import_role:
        name: bootwright.core.physical_erase
        tasks_from: destroy
