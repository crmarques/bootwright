---
- name: Probe managed Ceph OSD health
  hosts: bootwright_storage_hosts
  gather_facts: false
  become: true
  environment: "{{ bootwright_proxy_env | default({}) }}"
  vars:
    bootwright_ceph_probe_timeout_seconds: 120
    bootwright_ceph_timeout_kill_after_seconds: 15
  tasks:
    - name: Require a finite Ceph health probe timeout
      ansible.builtin.assert:
        that:
          - bootwright_ceph_probe_timeout_seconds | int > 0
          - bootwright_ceph_timeout_kill_after_seconds | int > 0
          - bootwright_ceph_timeout_kill_after_seconds | int <= 60
        fail_msg: >-
          The Ceph health check resolved an invalid command timeout. Restore its
          built-in positive probe timeout and 1-to-60-second kill escalation,
          then repeat the original check. No state-changing command is inferred
          from this read-only refusal.
        quiet: true

    - name: End non-seed storage hosts
      ansible.builtin.meta: end_host
      when: bootwright_storage_seed_host_name | default('') != inventory_hostname

    - name: Probe Ceph OSD stat
      ansible.builtin.command:
        argv:
          - timeout
          - "--kill-after={{ bootwright_ceph_timeout_kill_after_seconds }}"
          - "{{ bootwright_ceph_probe_timeout_seconds }}"
          - cephadm
          - shell
          - --
          - ceph
          - osd
          - stat
          - --format
          - json
      register: bootwright_ceph_health_osd_stat
      changed_when: false
      failed_when: bootwright_ceph_health_osd_stat.rc | default(0) | int in [124, 137]

    - name: Probe Ceph cluster health
      ansible.builtin.command:
        argv:
          - timeout
          - "--kill-after={{ bootwright_ceph_timeout_kill_after_seconds }}"
          - "{{ bootwright_ceph_probe_timeout_seconds }}"
          - cephadm
          - shell
          - --
          - ceph
          - health
          - --format
          - json
      register: bootwright_ceph_health_status
      changed_when: false
      failed_when: bootwright_ceph_health_status.rc | default(0) | int in [124, 137]

    - name: Ensure controller-side health result directory
      ansible.builtin.file:
        path: "{{ bootwright_storage_health_dir }}"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false

    - name: Write Ceph health probe result
      ansible.builtin.copy:
        dest: "{{ bootwright_storage_health_dir }}/{{ bootwright_storage_cluster_name }}.json"
        content: >-
          {{
            {
              'cluster': bootwright_storage_cluster_name,
              'probed': (bootwright_ceph_health_osd_stat.rc | default(1)) == 0,
              'numInOSDs': ((bootwright_ceph_health_osd_stat.stdout | default('{}') | from_json).num_in_osds
                            | default(0) | int) if (bootwright_ceph_health_osd_stat.rc | default(1)) == 0 else 0,
              'numUpOSDs': ((bootwright_ceph_health_osd_stat.stdout | default('{}') | from_json).num_up_osds
                            | default(0) | int) if (bootwright_ceph_health_osd_stat.rc | default(1)) == 0 else 0,
              'health': (bootwright_ceph_health_status.stdout | default('{}') | from_json).status | default('UNKNOWN')
            } | to_nice_json
          }}
        mode: "0600"
      delegate_to: localhost
      become: false
