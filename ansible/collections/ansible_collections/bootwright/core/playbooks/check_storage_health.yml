---
- name: Probe managed Ceph OSD health
  hosts: bootwright_storage_hosts
  gather_facts: false
  become: true
  environment: "{{ bootwright_proxy_env | default({}) }}"
  tasks:
    - name: End non-seed storage hosts
      ansible.builtin.meta: end_host
      when: bootwright_storage_seed_host_name | default('') != inventory_hostname

    - name: Probe Ceph OSD stat
      ansible.builtin.command:
        argv:
          - cephadm
          - shell
          - --
          - ceph
          - osd
          - stat
          - --format
          - json
      register: bootwright_ceph_health_osd_stat
      changed_when: false
      failed_when: false

    - name: Probe Ceph cluster health
      ansible.builtin.command:
        argv:
          - cephadm
          - shell
          - --
          - ceph
          - health
          - --format
          - json
      register: bootwright_ceph_health_status
      changed_when: false
      failed_when: false

    - name: Ensure controller-side health result directory
      ansible.builtin.file:
        path: "{{ bootwright_storage_health_dir }}"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false

    - name: Write Ceph health probe result
      ansible.builtin.copy:
        dest: "{{ bootwright_storage_health_dir }}/{{ bootwright_storage_cluster_name }}.json"
        content: >-
          {{
            {
              'cluster': bootwright_storage_cluster_name,
              'probed': (bootwright_ceph_health_osd_stat.rc | default(1)) == 0,
              'numInOSDs': ((bootwright_ceph_health_osd_stat.stdout | default('{}') | from_json).num_in_osds
                            | default(0) | int) if (bootwright_ceph_health_osd_stat.rc | default(1)) == 0 else 0,
              'numUpOSDs': ((bootwright_ceph_health_osd_stat.stdout | default('{}') | from_json).num_up_osds
                            | default(0) | int) if (bootwright_ceph_health_osd_stat.rc | default(1)) == 0 else 0,
              'health': (bootwright_ceph_health_status.stdout | default('{}') | from_json).status | default('UNKNOWN')
            } | to_nice_json
          }}
        mode: "0600"
      delegate_to: localhost
      become: false
