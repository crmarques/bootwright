---
- name: Realize one physical machine
  hosts: bootwright_target
  gather_facts: false
  any_errors_fatal: true
  serial: 1
  strategy: ansible.builtin.linear

  tasks:
    - name: Execute the physical machine observe capability
      ansible.builtin.import_role:
        name: bootwright.core.substrate_baremetal_machine
        tasks_from: observe.yml
