---
- name: Remove one KubeVirt VirtualMachine
  hosts: bootwright_target
  gather_facts: false
  any_errors_fatal: true
  serial: 1
  strategy: ansible.builtin.linear

  tasks:
    - name: Execute the KubeVirt machine destroy capability
      ansible.builtin.import_role:
        name: bootwright.core.substrate_kubevirt_machine
        tasks_from: destroy
