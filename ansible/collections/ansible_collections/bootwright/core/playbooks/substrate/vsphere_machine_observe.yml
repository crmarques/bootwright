---
- name: Observe one vSphere VirtualMachine
  hosts: bootwright_target
  gather_facts: false
  any_errors_fatal: true
  serial: 1
  strategy: ansible.builtin.linear

  tasks:
    - name: Execute the vSphere machine observe capability
      ansible.builtin.import_role:
        name: bootwright.core.substrate_vsphere_machine
        tasks_from: observe
