---
- name: Prove one KubeVirt provider's host cluster
  hosts: bootwright_target
  gather_facts: false
  any_errors_fatal: true
  serial: 1
  strategy: ansible.builtin.linear

  tasks:
    - name: Execute the KubeVirt provider apply capability
      ansible.builtin.import_role:
        name: bootwright.core.substrate_kubevirt_host
        tasks_from: apply
