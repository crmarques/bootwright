---
- name: Release one KubeVirt provider's proof
  hosts: bootwright_target
  gather_facts: false
  any_errors_fatal: true
  serial: 1
  strategy: ansible.builtin.linear

  tasks:
    - name: Execute the KubeVirt provider destroy capability
      ansible.builtin.import_role:
        name: bootwright.core.substrate_kubevirt_host
        tasks_from: destroy
