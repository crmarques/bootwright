---
- name: Remove one libvirt provider host
  hosts: bootwright_target
  gather_facts: false
  any_errors_fatal: true
  serial: 1
  strategy: ansible.builtin.linear

  tasks:
    - name: Execute the libvirt provider host destroy capability
      ansible.builtin.import_role:
        name: bootwright.core.substrate_libvirt_host
        tasks_from: destroy.yml
