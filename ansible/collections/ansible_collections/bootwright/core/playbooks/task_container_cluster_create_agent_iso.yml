---
- name: Create OpenShift agent ISO
  hosts: bootwright_ocp_hosts
  gather_subset:
    - "!all"
    - min
  become: true
  environment: "{{ (bootwright_proxy_env | default({})) | combine({'XDG_CACHE_HOME': bootwright_agent_iso_cache_dir}) }}"

  vars:
    bootwright_agent_iso_cache_dir: "{{ bootwright_clusters_dir }}/{{ bootwright_task_cluster_name }}/runtime/installer-cache"

  pre_tasks:
    - name: Resolve proxy environment
      ansible.builtin.import_role:
        name: bootwright.core.machine_proxy
        tasks_from: facts

    - name: Create per-cluster installer image cache directory
      ansible.builtin.file:
        path: "{{ bootwright_agent_iso_cache_dir }}"
        state: directory
        mode: "0700"

  tasks:
    - name: Create agent ISO for selected cluster
      ansible.builtin.include_role:
        name: bootwright.core.container_cluster_agent_install
      vars:
        bootwright_install_agent_action: create_iso
      loop: "{{ bootwright_clusters | default([]) }}"
      loop_control:
        loop_var: bootwright_current_cluster
        label: "{{ bootwright_current_cluster.name }}"
      when:
        - bootwright_current_cluster.installMethod == 'agent'
        - bootwright_current_cluster.name == bootwright_task_cluster_name
