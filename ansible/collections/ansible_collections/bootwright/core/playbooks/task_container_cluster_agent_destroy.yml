---
- name: Remove OpenShift cluster records from the controller
  hosts: bootwright_ocp_hosts
  gather_facts: true
  gather_subset:
    - "!all"
    - min
  become: true
  ignore_unreachable: "{{ bootwright_destroy_skip_unreachable | default(false) | bool }}"
  environment: "{{ bootwright_proxy_env | default({}) }}"

  pre_tasks:
    - name: Resolve proxy environment
      ansible.builtin.import_role:
        name: bootwright.core.machine_proxy
        tasks_from: facts

  tasks:
    - name: Remove records per cluster
      ansible.builtin.include_role:
        name: bootwright.core.container_cluster_agent_install
        tasks_from: destroy_records.yml
      loop: "{{ bootwright_clusters | default([]) }}"
      loop_control:
        loop_var: bootwright_current_cluster
        label: "{{ bootwright_current_cluster.name }}"
      when: >-
        bootwright_destroy_container_cluster is not defined
        or bootwright_current_cluster.name == bootwright_destroy_container_cluster
