---
- name: Destroy OpenShift agent install state
  hosts: bootwright_ocp_hosts
  # Fact-gathering is deferred to an explicit task after reachability is
  # classified, so an unreachable node (e.g. a never-provisioned cluster) is
  # classified and reported with guidance instead of failing at the implicit
  # connect with a raw SSH error. There is no irreversible device wipe here.
  gather_facts: false
  become: true
  # Play-level default for connecting tasks; the reachability probe overrides it
  # per-task so classification runs even by default. With gather_facts: false
  # there is no implicit gather to abort, so this only shapes post-classification
  # tasks (off by default, on under --skip-unreachable).
  ignore_unreachable: "{{ bootwright_destroy_skip_unreachable | default(false) | bool }}"
  environment: "{{ bootwright_proxy_env | default({}) }}"

  # Proxy facts resolve in pre_tasks, but every task is controller-side (set_fact
  # and a delegate_to: localhost credential slurp — nothing connects to the managed
  # host), so with gather_facts: false this runs without contacting an unreachable
  # node, before the reachability probe and the teardown below.
  pre_tasks:
    - name: Resolve proxy environment
      ansible.builtin.import_role:
        name: bootwright.core.machine_proxy
        tasks_from: facts

  tasks:
    # Probe every node first; ignore_unreachable keeps an unreachable node in the
    # play (recorded as unreachable) so the gates below decide what to do with it.
    - name: Probe OCP host reachability before teardown
      ansible.builtin.ping:
      register: bootwright_ocp_reachable_probe
      ignore_unreachable: true
      failed_when: false

    # Fail by default with actionable guidance (not a raw SSH error) when a node
    # is unreachable; --skip-unreachable opts out and skips it instead.
    - name: Require OCP hosts reachable unless --skip-unreachable
      ansible.builtin.assert:
        that:
          - not (bootwright_ocp_reachable_probe.unreachable | default(false) | bool)
        fail_msg: >-
          OpenShift node {{ inventory_hostname }} is unreachable. If the cluster was
          never provisioned there is nothing to clean — re-run with --skip-unreachable
          to treat it as already-absent. Otherwise power the node(s) on and retry.
      when: not (bootwright_destroy_skip_unreachable | default(false) | bool)

    - name: Stop tearing down unreachable OCP hosts
      ansible.builtin.meta: end_host
      when:
        - bootwright_destroy_skip_unreachable | default(false) | bool
        - bootwright_ocp_reachable_probe.unreachable | default(false) | bool

    # Gather facts on the reachable, in-scope nodes the play deferred; when every
    # node was unreachable and skipped, none remain and the teardown is a no-op.
    - name: Gather facts on reachable OCP hosts
      ansible.builtin.setup:
        gather_subset:
          - "!all"
          - min
      ignore_unreachable: "{{ bootwright_destroy_skip_unreachable | default(false) | bool }}"

    - name: Destroy per cluster
      ansible.builtin.include_role:
        name: bootwright.core.container_cluster_agent_destroy
      loop: "{{ bootwright_clusters | default([]) }}"
      loop_control:
        loop_var: bootwright_current_cluster
        label: "{{ bootwright_current_cluster.name }}"

    - name: Warn about OCP hosts skipped as unreachable
      vars:
        bootwright_ocp_skipped_hosts: >-
          {{
            ansible_play_hosts_all
            | map('extract', hostvars)
            | selectattr('bootwright_ocp_reachable_probe', 'defined')
            | selectattr('bootwright_ocp_reachable_probe.unreachable', 'defined')
            | selectattr('bootwright_ocp_reachable_probe.unreachable')
            | map(attribute='inventory_hostname')
            | list
          }}
      ansible.builtin.debug:
        msg: >-
          Skipped unreachable OpenShift node(s): {{ bootwright_ocp_skipped_hosts | join(', ') }}.
          Their agent install state was not cleaned; re-run destroy once they are
          back up, or clean them manually, before reusing the hardware.
      run_once: true
      when:
        - bootwright_destroy_skip_unreachable | default(false) | bool
        - bootwright_ocp_skipped_hosts | length > 0
