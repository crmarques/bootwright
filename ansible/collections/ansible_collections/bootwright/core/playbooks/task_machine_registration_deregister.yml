---
- name: Deregister cluster machines from RHSM
  hosts: bootwright_storage_hosts
  gather_facts: false
  become: true
  ignore_unreachable: true
  environment: "{{ bootwright_proxy_env | default({}) }}"
  vars:
    bootwright_selected_storage_cluster: >-
      {{
        bootwright_storage_clusters
        | default([])
        | selectattr('name', 'equalto', bootwright_storage_cluster_name | default(''))
        | list
        | first
        | default({})
      }}
  pre_tasks:
    - name: End hosts that are not managed storage nodes
      ansible.builtin.meta: end_host
      when: bootwright_storage_cluster_name | default('') | length == 0

    - name: End provided-OS hosts
      ansible.builtin.meta: end_host
      when: bootwright_os_provided | default(false) | bool

    - name: End hosts outside the selected storage clusters
      ansible.builtin.meta: end_host
      when:
        - bootwright_destroy_storage_scope is defined
        - bootwright_storage_cluster_name | default('') not in (bootwright_destroy_storage_scope | split(','))

    - name: End hosts outside the selected machines
      ansible.builtin.meta: end_host
      when:
        - bootwright_destroy_machine_scope is defined
        - bootwright_storage_node_name | default('') not in (bootwright_destroy_machine_scope | split(','))

    - name: End hosts whose storage cluster does not manage RHSM
      ansible.builtin.meta: end_host
      when: bootwright_selected_storage_cluster.provider.rhsmManagement | default('') != 'managed'

    - name: Resolve proxy environment
      block:
        - name: Import proxy egress facts
          ansible.builtin.include_role:
            name: bootwright.core.machine_proxy
            tasks_from: facts
      rescue:
        - name: Continue best-effort without a resolved proxy environment
          ansible.builtin.set_fact:
            bootwright_proxy_env: {}
  tasks:
    - name: Select storage node teardown connection
      ansible.builtin.include_role:
        name: bootwright.core.storage_node_access
        tasks_from: select_connection.yml
      when: bootwright_node_access is defined

    - name: Probe node reachability and escalation before deregistration
      when:
        - >-
          bootwright_node_access is not defined
          or (bootwright_node_access_connection_available | default(false) | bool)
      block:
        - name: Probe node reachability before deregistration
          ansible.builtin.ping:
          register: bootwright_registration_reachable_probe
          ignore_unreachable: true
          failed_when: false
      rescue:
        - name: Record an unusable node before deregistration
          ansible.builtin.set_fact:
            bootwright_registration_reachable_probe:
              unreachable: true

    - name: Record an unreachable node when no storage identity answers
      ansible.builtin.set_fact:
        bootwright_registration_reachable_probe:
          unreachable: true
      when:
        - bootwright_node_access is defined
        - not (bootwright_node_access_connection_available | default(false) | bool)

    - name: Classify how a node refused its deregistration connection
      ansible.builtin.include_role:
        name: bootwright.core.storage_node_access
        tasks_from: classify_absence.yml
      vars:
        bootwright_node_access_absence_diagnostic: >-
          {{ bootwright_registration_reachable_probe.msg | default('') }}
      when:
        - bootwright_registration_reachable_probe.unreachable | default(false) | bool
        - >-
          bootwright_node_access is not defined
          or (bootwright_node_access_connection_available | default(false) | bool)

    - name: End nodes this deregistration proved absent
      ansible.builtin.meta: end_host
      when:
        - bootwright_registration_reachable_probe.unreachable | default(false) | bool
        - bootwright_node_access_node_absent | default(false) | bool

    - name: Warn that a node Bootwright could not reach keeps its RHSM registration
      vars:
        bootwright_registration_refusal: >-
          {{ bootwright_node_access_node_refusal | default('') | trim
             if ((bootwright_node_access is defined)
                 and not (bootwright_node_access_connection_available | default(false) | bool))
             else (bootwright_registration_reachable_probe.msg | default('') | trim) }}
      ansible.builtin.debug:
        msg: >-
          Machine {{ bootwright_storage_node_name | default(inventory_hostname) }} was skipped by
          RHSM deregistration and this run could not prove the node absent:
          {{ bootwright_registration_refusal | default('no connection diagnostic was recorded', true) }}.
          Its RHSM registration was NOT released, so the subscription stays consumed against this
          hardware's DMI system UUID and the stale consumer will reject the next install of the
          same machine. Fix the identity named above (re-authorize the key, restore the NOPASSWD
          grant of {{ bootwright_node_access.user | default('the orchestration account') }}, or
          pass --ssh-ask-sudo-password) and re-run destroy, or delete the stale content host on the
          subscription service by hand.
      when: bootwright_registration_reachable_probe.unreachable | default(false) | bool

    - name: End nodes Bootwright cannot reach or escalate on
      ansible.builtin.meta: end_host
      when: bootwright_registration_reachable_probe.unreachable | default(false) | bool

    - name: Deregister machine from RHSM
      ansible.builtin.include_role:
        name: bootwright.core.machine_registration_rhsm
        tasks_from: deregister.yml
