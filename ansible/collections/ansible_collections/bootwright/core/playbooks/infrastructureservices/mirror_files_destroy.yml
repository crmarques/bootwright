---
- name: Withdraw one managed artifact mirror's files
  hosts: bootwright_target
  gather_facts: false
  any_errors_fatal: true
  serial: 1
  strategy: ansible.builtin.linear

  tasks:
    - name: Execute the artifact mirror files destroy capability
      ansible.builtin.import_role:
        name: bootwright.core.infrastructureservices_mirror_fill
        tasks_from: destroy
