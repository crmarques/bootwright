---
- name: Apply one managed artifact server
  hosts: bootwright_target
  gather_facts: false
  any_errors_fatal: true
  serial: 1
  strategy: ansible.builtin.linear

  tasks:
    - name: Execute the artifact-server apply capability
      ansible.builtin.import_role:
        name: bootwright.core.infra_managed_service
        tasks_from: artifact_server_apply
