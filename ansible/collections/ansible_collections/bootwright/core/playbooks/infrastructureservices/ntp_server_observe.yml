---
- name: Observe one managed time service
  hosts: bootwright_target
  gather_facts: false
  any_errors_fatal: true
  serial: 1
  strategy: ansible.builtin.linear

  tasks:
    - name: Execute the time service observe capability
      ansible.builtin.import_role:
        name: bootwright.core.infra_ntp_server_chrony
        tasks_from: observe.yml
