---
- name: Destroy one managed artifact server
  hosts: bootwright_target
  gather_facts: false
  any_errors_fatal: true
  serial: 1
  strategy: ansible.builtin.linear

  tasks:
    - name: Execute the artifact-server destroy capability
      ansible.builtin.import_role:
        name: bootwright.core.infra_artifact_server_nginx
        tasks_from: destroy.yml
