---
- name: Release one managed image mirror fill
  hosts: bootwright_target
  gather_facts: false
  any_errors_fatal: true
  serial: 1
  strategy: ansible.builtin.linear

  tasks:
    - name: Execute the image mirror destroy capability
      ansible.builtin.import_role:
        name: bootwright.core.infrastructureservices_mirror_images
        tasks_from: destroy
