---
- name: Observe one managed image mirror
  hosts: bootwright_target
  gather_facts: false
  any_errors_fatal: true
  serial: 1
  strategy: ansible.builtin.linear

  tasks:
    - name: Execute the image mirror observe capability
      ansible.builtin.import_role:
        name: bootwright.core.infrastructureservices_mirror_images
        tasks_from: observe
