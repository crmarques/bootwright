---
- name: Copy one cluster's release into the managed image mirror
  hosts: bootwright_target
  gather_facts: false
  any_errors_fatal: true
  serial: 1
  strategy: ansible.builtin.linear

  tasks:
    - name: Execute the release copy apply capability
      ansible.builtin.import_role:
        name: bootwright.core.infrastructureservices_mirror_release
        tasks_from: apply
