---
- name: Destroy one managed time service
  hosts: bootwright_target
  gather_facts: false
  any_errors_fatal: true
  serial: 1
  strategy: ansible.builtin.linear

  tasks:
    - name: Execute the time service destroy capability
      ansible.builtin.import_role:
        name: bootwright.core.infra_managed_service
        tasks_from: destroy
