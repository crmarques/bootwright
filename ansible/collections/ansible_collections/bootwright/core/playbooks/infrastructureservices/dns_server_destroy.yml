---
- name: Destroy one managed name resolver
  hosts: bootwright_target
  gather_facts: false
  any_errors_fatal: true
  serial: 1
  strategy: ansible.builtin.linear

  tasks:
    - name: Execute the name resolver destroy capability
      ansible.builtin.import_role:
        name: bootwright.core.infra_dns_server_dnsmasq
        tasks_from: destroy
