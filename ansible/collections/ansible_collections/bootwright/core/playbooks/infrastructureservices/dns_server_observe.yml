---
- name: Observe one managed name resolver
  hosts: bootwright_service_host
  gather_facts: false
  any_errors_fatal: true
  serial: 1
  strategy: ansible.builtin.linear

  tasks:
    - name: Execute the name resolver observe capability
      ansible.builtin.import_role:
        name: bootwright.core.infra_dns_server_dnsmasq
        tasks_from: observe.yml
