---
- name: Destroy cluster infrastructure
  hosts: bootwright_provider_hosts:bootwright_infra_hosts
  gather_subset:
    - "!all"
    - min
  become: true

  vars:
    bootwright_host_libvirt_providers: >-
      {{
        bootwright_providers | default([])
        | selectattr('capabilities.type', 'equalto', 'libvirt')
        | selectattr('capabilities.libvirt.machineRef', 'defined')
        | selectattr('capabilities.libvirt.machineRef', 'equalto', bootwright_host_name)
        | list
      }}
    bootwright_host_machine_components: >-
      {{
        bootwright_clusters | default([])
        | map(attribute='components') | flatten
        | selectattr('kind', 'equalto', 'machines')
        | selectattr('machineRef', 'defined')
        | selectattr('machineRef', 'equalto', bootwright_host_name)
        | list
      }}
    bootwright_host_clusters: >-
      {{
        bootwright_host_machine_components
        | map(attribute='clusterName')
        | unique | list
      }}
    bootwright_host_infra_ownership_records: >-
      {{
        bootwright_ownership_records | default([])
        | selectattr('host', 'equalto', bootwright_host_name | default(inventory_hostname))
        | list
      }}

  tasks:
    - name: Destroy substrate per cluster on this host
      ansible.builtin.include_tasks: tasks/machine_infra_destroy_cluster.yml
      loop: "{{ bootwright_host_clusters }}"
      loop_control:
        loop_var: bootwright_cluster_name
      when: bootwright_host_clusters | length > 0

    # Managed-OS machines live in the managed OS install groups, not in
    # bootwright_clusters; substrates whose teardown needs live API calls
    # (vsphere) are unreachable through the recorded-resource sweep below,
    # so dispatch their substrate destroy role per machine here. The role
    # destroys are idempotent, so substrates also covered by recorded
    # resources (libvirt) tolerate the double pass.
    - name: Resolve managed OS machine components on this host
      ansible.builtin.set_fact:
        bootwright_host_managed_os_components: >-
          {{
            bootwright_managed_os_install_groups | default([])
            | map(attribute='components') | flatten
            | selectattr('kind', 'equalto', 'machines')
            | selectattr('machineRef', 'defined')
            | selectattr('machineRef', 'equalto', bootwright_host_name)
            | list
          }}
      changed_when: false

    - name: Destroy managed OS substrate per machine
      ansible.builtin.include_role:
        name: "{{ bootwright_managed_os_component.substrateDestroyRole }}"
        tasks_from: destroy.yml
      vars:
        bootwright_component: "{{ bootwright_managed_os_component }}"
        bootwright_current_cluster:
          name: "{{ bootwright_managed_os_component.clusterName }}"
      loop: "{{ bootwright_host_managed_os_components }}"
      loop_control:
        loop_var: bootwright_managed_os_component
        label: "{{ bootwright_managed_os_component.clusterName }}/{{ bootwright_managed_os_component.name }}"
      when: >-
        bootwright_destroy_cluster_scope is not defined
        or bootwright_managed_os_component.clusterName | default('') in bootwright_destroy_cluster_scope.split(',')

    - name: Destroy recorded machine infrastructure resources
      ansible.builtin.include_role:
        name: bootwright.core.ownership_record
        tasks_from: destroy_resource.yml
      vars:
        bootwright_ownership_record: "{{ item }}"
      loop: "{{ bootwright_host_infra_ownership_records }}"
      loop_control:
        label: "{{ item.kind }}/{{ item.name }}"
      when:
        - item.kind in ['libvirt-domain', 'libvirt-network', 'managed-os-install']
        # A scoped destroy (--clusters) must only clean records owned by the
        # selected roots; an unscoped destroy leaves the var undefined and cleans
        # every context-owned record (including orphans). Without this gate a
        # scoped destroy tore down co-located clusters' VMs/disks on a shared host.
        - >-
          bootwright_destroy_cluster_scope is not defined
          or item.cluster | default('') in bootwright_destroy_cluster_scope.split(',')

    - name: Sweep current-context libvirt domains
      ansible.builtin.include_tasks: tasks/machine_infra_destroy_libvirt_context.yml
      loop: "{{ bootwright_host_libvirt_providers }}"
      loop_control:
        loop_var: bootwright_libvirt_provider
        label: "{{ bootwright_libvirt_provider.name }}"
      when:
        - bootwright_infra_destroy_context_sweep | default(false) | bool
        - bootwright_host_libvirt_providers | length > 0
