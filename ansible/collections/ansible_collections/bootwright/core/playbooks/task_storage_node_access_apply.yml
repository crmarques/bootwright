---
- name: Apply managed Ceph storage node access
  hosts: bootwright_storage_hosts
  gather_facts: false
  become: false
  strategy: linear
  any_errors_fatal: true
  environment: "{{ bootwright_proxy_env | default({}) }}"
  vars:
    bootwright_selected_storage_cluster: >-
      {{
        bootwright_storage_clusters
        | default([])
        | selectattr('name', 'equalto', bootwright_task_storage_cluster_name | default(''))
        | list
        | first
        | default({})
      }}
  pre_tasks:
    - name: Resolve proxy environment
      ansible.builtin.import_role:
        name: bootwright.core.machine_proxy
        tasks_from: facts
  tasks:
    - name: End hosts outside selected storage cluster
      ansible.builtin.meta: end_host
      when: bootwright_storage_cluster_name | default('') != bootwright_task_storage_cluster_name | default('')

    - name: Validate selected storage cluster context
      ansible.builtin.assert:
        that:
          - bootwright_task_storage_cluster_name | default('') | length > 0
          - bootwright_selected_storage_cluster.name | default('') == bootwright_task_storage_cluster_name
        fail_msg: >-
          Storage node access task did not receive a rendered context for
          {{ bootwright_task_storage_cluster_name | default('<unset>') }}.

    - name: Apply Ceph storage node access
      ansible.builtin.include_role:
        name: bootwright.core.storage_node_access
