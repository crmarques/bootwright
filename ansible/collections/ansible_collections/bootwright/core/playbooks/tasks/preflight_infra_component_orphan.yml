---
- name: Resolve recorded infra-component preflight identity
  ansible.builtin.set_fact:
    bootwright_ownership_kind: infra-component
    bootwright_ownership_name: "{{ bootwright_infra_component_orphan_record.name }}"
    bootwright_ownership_role: owner
  changed_when: false

- name: Revalidate recorded infra-component before orphan dispatch
  ansible.builtin.include_role:
    name: bootwright.core.ownership_record
    tasks_from: validate_resource.yml
  vars:
    bootwright_ownership_expected_record: "{{ bootwright_infra_component_orphan_record }}"

- name: Require live recorded infra-component orphan evidence
  ansible.builtin.assert:
    quiet: true
    that:
      - bootwright_ownership_validated_stat.stat.exists | bool
      - bootwright_ownership_validated_record == bootwright_infra_component_orphan_record
    fail_msg: >-
      Refusing recorded infra-component teardown because the controller snapshot
      no longer exactly matches a live current-context ownership record for
      {{ bootwright_infra_component_orphan_record.name }}. No orphan component
      was changed. Re-read the current host evidence and re-run
      `{{ bootwright_mutating_invocation }}`.

- name: Classify exact recorded infra-component composite
  ansible.builtin.set_fact:
    bootwright_infra_component_orphan_composite: >-
      {{ bootwright_ownership_validated_record
         | bootwright.core.bootwright_infra_component_record_composite(
             bootwright_managed_services_dir) }}
  changed_when: false

- name: Require one closed recorded infra-component composite
  ansible.builtin.assert:
    quiet: true
    that:
      - bootwright_infra_component_orphan_composite is mapping
      - bootwright_infra_component_orphan_composite | length > 0
    fail_msg: >-
      Refusing recorded infra-component teardown because ownership record
      {{ bootwright_infra_component_orphan_record.name }} is not one exact
      supported artifact-server, HAProxy, dnsmasq, chrony, Squid, or mirror
      registry composite. No container, service, firewall endpoint, shared host
      setting, path, state marker, or ownership record was changed. Restore the
      exact record from trusted evidence and re-run
      `{{ bootwright_mutating_invocation }}`; generic cleanup cannot interpret
      an incomplete or future record shape.

- name: Retain preflighted recorded infra-component composite
  ansible.builtin.set_fact:
    bootwright_infra_component_orphan_composites: >-
      {{ bootwright_infra_component_orphan_composites
         + [bootwright_infra_component_orphan_composite
            | combine({'selectionRecord': bootwright_ownership_validated_record})] }}
  changed_when: false
