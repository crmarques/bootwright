---
# Per-cluster substrate teardown. Mirrors `per_cluster.yml`.

- name: Resolve current cluster
  ansible.builtin.set_fact:
    bootwright_current_cluster: >-
      {{
        bootwright_clusters
        | selectattr('name', 'equalto', bootwright_cluster_name)
        | first
      }}
  changed_when: false

- name: Pick machine components on this (cluster, host)
  ansible.builtin.set_fact:
    bootwright_current_machines: >-
      {{
        bootwright_current_cluster.components
        | selectattr('kind', 'equalto', 'machines')
        | selectattr('hostRef', 'defined')
        | selectattr('hostRef', 'equalto', bootwright_host_name)
        | list
      }}
  changed_when: false

- name: Detach managed load balancer VIPs
  ansible.builtin.import_role:
    name: bootwright.core.cluster_network_load_balancer_vips
    tasks_from: destroy.yml
  when:
    - bootwright_current_cluster.components | selectattr('kind', 'equalto', 'loadBalancer') | selectattr('hostRef', 'equalto', bootwright_host_name) | list | length > 0

- name: Destroy substrate per machine
  ansible.builtin.include_role:
    name: "{{ bootwright_component.substrateDestroyRole }}"
    tasks_from: destroy.yml
  loop: "{{ bootwright_current_machines }}"
  loop_control:
    loop_var: bootwright_component
    label: "{{ bootwright_component.clusterName }}/{{ bootwright_component.name }}"
