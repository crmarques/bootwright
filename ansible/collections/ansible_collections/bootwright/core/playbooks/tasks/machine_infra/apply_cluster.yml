---
# Inner per-cluster substrate dispatch. Called once per
# `bootwright_cluster_name` from the surrounding layer playbook with
# the host already scoped.

- name: Resolve current cluster
  ansible.builtin.set_fact:
    bootwright_current_cluster: >-
      {{
        bootwright_clusters
        | selectattr('name', 'equalto', bootwright_cluster_name)
        | first
      }}
  changed_when: false

- name: Pick machine components on this (cluster, host)
  ansible.builtin.set_fact:
    bootwright_current_machines: >-
      {{
        bootwright_current_cluster.components
        | selectattr('kind', 'equalto', 'machines')
        | selectattr('machineRef', 'defined')
        | selectattr('machineRef', 'equalto', bootwright_host_name)
        | list
      }}
  changed_when: false

- name: Dispatch substrate per machine
  ansible.builtin.include_role:
    name: "{{ bootwright_component.substrateApplyRole }}"
  loop: "{{ bootwright_current_machines }}"
  loop_control:
    loop_var: bootwright_component
    label: "{{ bootwright_component.clusterName }}/{{ bootwright_component.name }}"

- name: Attach managed load balancer VIPs
  ansible.builtin.import_role:
    name: bootwright.core.cluster_network_load_balancer_vips
  when:
    - bootwright_current_cluster.components | selectattr('kind', 'equalto', 'loadBalancer') | list | length > 0
    - bootwright_current_cluster.components | selectattr('kind', 'equalto', 'loadBalancer') | selectattr('machineRef', 'equalto', bootwright_host_name) | list | length > 0

- name: Report external endpoint DNS diagnostics
  ansible.builtin.import_role:
    name: bootwright.core.diagnostic_cluster_endpoint_dns
  when: >-
    bootwright_current_cluster.endpoints
    | selectattr('source', 'defined')
    | selectattr('source.type', 'equalto', 'external')
    | list
    | length > 0
