---
- name: Apply machine infrastructure
  hosts: bootwright_machine_task_hosts
  strategy: free
  gather_subset:
    - "!all"
    - min
  become: true
  environment: "{{ bootwright_proxy_env | default({}) }}"

  pre_tasks:
    - name: Resolve proxy environment
      ansible.builtin.import_role:
        name: bootwright.core.machine_proxy
        tasks_from: facts

  tasks:
    - name: Resolve selected cluster
      ansible.builtin.set_fact:
        bootwright_current_cluster: "{{ (bootwright_clusters | default([]) | selectattr('name', 'equalto', bootwright_machine_task_cluster_name) | list | first) | default({}) }}"
      changed_when: false

    - name: Validate selected cluster
      ansible.builtin.assert:
        that:
          - bootwright_current_cluster is mapping
          - bootwright_current_cluster.name | default('') == bootwright_machine_task_cluster_name
          - bootwright_task_cluster_name | default('') == bootwright_machine_task_cluster_name
        fail_msg: >-
          Could not resolve cluster {{ bootwright_machine_task_cluster_name | default('<unset>') }}
          for machine task host {{ inventory_hostname }}.

    - name: Pick selected machine component
      ansible.builtin.set_fact:
        bootwright_selected_machine_components: >-
          {{
            bootwright_current_cluster.components
            | selectattr('kind', 'equalto', 'machines')
            | selectattr('name', 'equalto', bootwright_machine_task_machine_name)
            | selectattr('machineRef', 'defined')
            | selectattr('machineRef', 'equalto', bootwright_machine_task_provider_host_name)
            | list
          }}
      changed_when: false

    - name: Validate selected machine component
      ansible.builtin.assert:
        that:
          - bootwright_selected_machine_components | length == 1
          - bootwright_machine_task_machine_name in (bootwright_task_machine_names | default('')).split(',')
        fail_msg: >-
          Could not resolve machine {{ bootwright_machine_task_machine_name | default('<unset>') }}
          for cluster {{ bootwright_machine_task_cluster_name | default('<unset>') }}.

    - name: Set selected machine component
      ansible.builtin.set_fact:
        bootwright_component: "{{ bootwright_selected_machine_components | first }}"
      changed_when: false

    - name: Dispatch selected machine substrate role
      ansible.builtin.include_role:
        name: "{{ bootwright_component.substrateApplyRole }}"
        tasks_from: "{{ bootwright_component.substrateApplyFrom | default('main', true) }}"
