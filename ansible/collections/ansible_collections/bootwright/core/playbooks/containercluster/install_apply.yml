    containercluster_install_agent_node: '{{ bootwright_cluster_install_request.nodes[bootwright_node_index | int] }}'
    containercluster_install_agent_user: "{{ bootwright_cluster_install_material['controllerUserNode' ~ bootwright_node_index] }}"
    containercluster_install_agent_password: >-
      {{ '' if bootwright_cluster_install_request.nodes[bootwright_node_index | int].portPinned | default(false)
         else bootwright_cluster_install_material['controllerPasswordNode' ~ bootwright_node_index] }}
    containercluster_install_agent_ca: "{{ bootwright_cluster_install_material['controllerCANode' ~ bootwright_node_index] | default('') }}"
    containercluster_install_agent_before: '{{ hostvars[bootwright_controller_host].containercluster_install_agent_before }}'
    containercluster_install_agent_state: '{{ hostvars[bootwright_controller_host].containercluster_install_agent_state }}'
    containercluster_install_agent_settled: '{{ hostvars[bootwright_controller_host].containercluster_install_agent_settled | default(false) }}'
    containercluster_install_agent_boot_deadline: '{{ hostvars[bootwright_controller_host].containercluster_install_agent_boot_deadline | default(0) }}'
    containercluster_install_agent_controllers: '{{ hostvars[bootwright_controller_host].containercluster_install_agent_controllers | default({}) }}'
    containercluster_install_agent_url: '{{ containercluster_install_agent_before.observation.url | default("") }}'

  tasks:
    - name: Execute release node rounds
      ansible.builtin.import_role:
        name: bootwright.core.containercluster_install_agent
        tasks_from: node_release

  post_tasks:
    - name: Stop after the failed round once every sibling finished
      ansible.builtin.import_role:
        name: bootwright.core.containercluster_install_agent
        tasks_from: phase_failures
      vars:
