---
- name: Remove one cluster's boot media
  hosts: bootwright_target
  gather_facts: false
  any_errors_fatal: true
  serial: 1
  strategy: ansible.builtin.linear

  tasks:
    - name: Execute the boot-media destroy capability
      ansible.builtin.import_role:
        name: bootwright.core.containercluster_media_agent
        tasks_from: destroy.yml
