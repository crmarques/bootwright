---
- name: Observe one OS-ready Machine's hardware
  hosts: bootwright_target
  gather_facts: false
  any_errors_fatal: true
  serial: 1
  strategy: ansible.builtin.linear

  tasks:
    - name: Execute the machine hardware observe capability
      ansible.builtin.import_role:
        name: bootwright.core.machine_hardware
        tasks_from: observe
