---
- name: Destroy managed Ceph storage
  hosts: bootwright_storage_hosts
  strategy: linear
  gather_facts: false
  become: true
  ignore_unreachable: "{{ bootwright_destroy_skip_unreachable | default(false) | bool }}"
  any_errors_fatal: true
  environment: "{{ bootwright_proxy_env | default({}) }}"
  vars:
    bootwright_selected_storage_cluster: >-
      {{
        bootwright_storage_clusters
        | default([])
        | selectattr('name', 'equalto', bootwright_storage_cluster_name | default(''))
        | list
        | first
        | default({})
      }}
  pre_tasks:
    - name: Resolve proxy environment
      ansible.builtin.import_role:
        name: bootwright.core.machine_proxy
        tasks_from: facts
  tasks:
    - name: End hosts outside managed storage clusters
      ansible.builtin.meta: end_host
      when: bootwright_storage_cluster_name | default('') | length == 0

    - name: End hosts outside the selected storage clusters
      ansible.builtin.meta: end_host
      when:
        - bootwright_destroy_storage_scope is defined
        - bootwright_storage_cluster_name | default('') not in (bootwright_destroy_storage_scope | split(','))

    - name: Select storage node teardown connection
      ansible.builtin.include_role:
        name: bootwright.core.storage_node_access
        tasks_from: select_connection.yml
      when: bootwright_node_access is defined

    - name: Probe storage host reachability before teardown
      ansible.builtin.ping:
      register: bootwright_storage_reachable_probe
      ignore_unreachable: true
      failed_when: false
      when:
        - >-
          bootwright_node_access is not defined
          or (bootwright_node_access_connection_available | default(false) | bool)

    - name: Record storage host unreachable when no node identity answers
      ansible.builtin.set_fact:
        bootwright_storage_reachable_probe:
          unreachable: true
      when:
        - bootwright_node_access is defined
        - not (bootwright_node_access_connection_available | default(false) | bool)

    - name: Classify how a storage host refused its teardown connection
      ansible.builtin.include_role:
        name: bootwright.core.storage_node_access
        tasks_from: classify_absence.yml
      vars:
        bootwright_node_access_absence_diagnostic: >-
          {{ bootwright_storage_reachable_probe.msg | default('') }}
      when:
        - bootwright_storage_reachable_probe.unreachable | default(false) | bool
        - >-
          bootwright_node_access is not defined
          or (bootwright_node_access_connection_available | default(false) | bool)

    - name: Record how a storage host refused its teardown connection
      vars:
        bootwright_storage_identity_refused: >-
          {{ (bootwright_node_access is defined)
             and not (bootwright_node_access_connection_available | default(false) | bool) }}
      ansible.builtin.set_fact:
        bootwright_storage_node_absent: >-
          {{ bootwright_node_access_node_absent | default(false) | bool }}
        bootwright_storage_node_refusal: >-
          {{ bootwright_node_access_node_refusal | default('') | trim
             if (bootwright_storage_identity_refused | bool)
             else (bootwright_storage_reachable_probe.msg | default('') | trim) }}
      changed_when: false
      when: bootwright_storage_reachable_probe.unreachable | default(false) | bool

    - name: Refuse a storage host this teardown cannot prove absent
      ansible.builtin.assert:
        that:
          - bootwright_storage_node_absent | default(false) | bool
        fail_msg: >-
          Storage node {{ bootwright_storage_node_name | default(inventory_hostname) }}
          for storage cluster {{ bootwright_storage_cluster_name }} refused every teardown
          identity, and the refusal is not proof that the node is gone:
          {{ bootwright_storage_node_refusal | default('no connection diagnostic was recorded') }}.
          --authorize unreachable-nodes skips a node that could not be contacted at all — no
          route, an unreachable network, a connection that timed out or was refused. It does
          not skip a node that answered and rejected an identity (an unauthorized key, an
          untrusted host key, a refused sudo escalation), and it does not skip a refusal
          Bootwright cannot read as absence at all — an address that does not resolve, an
          empty diagnostic, or an error that names neither. None of those prove the node is
          absent, and skipping a node that is in fact running leaves its Ceph daemons up and
          its OSD devices holding cluster data while this run reports the cluster destroyed.
          Read the diagnostic above: fix the identity it names (re-authorize the key, restore
          the NOPASSWD grant of
          {{ bootwright_node_access.user | default('the orchestration account') }}, or pass
          --ssh-ask-sudo-password), or correct the address it could not reach, then re-run
          destroy. If the node really is decommissioned, power it off so the teardown can
          prove it absent.
      when: bootwright_storage_reachable_probe.unreachable | default(false) | bool

    - name: Require storage hosts reachable unless --authorize unreachable-nodes
      ansible.builtin.assert:
        that:
          - not (bootwright_storage_reachable_probe.unreachable | default(false) | bool)
        fail_msg: >-
          Storage node {{ bootwright_storage_node_name | default(inventory_hostname) }}
          for storage cluster {{ bootwright_storage_cluster_name }} did not answer:
          {{ bootwright_storage_node_refusal | default('no connection diagnostic was recorded') }}.
          Power it on, confirm the route and that sshd is running, and retry; or re-run with
          --authorize unreachable-nodes to tear it down as already-absent. A node that
          answers and refuses its identity is never skipped by that token.
      when: not (bootwright_destroy_skip_unreachable | default(false) | bool)

    - name: Prepare the storage destroy attestation before teardown
      vars:
        bootwright_storage_attestation_entries: >-
          {{
            ansible_play_hosts_all
            | map('extract', hostvars)
            | selectattr('bootwright_storage_reachable_probe', 'defined')
            | list
          }}
        bootwright_storage_preliminary_result: >-
          {{
            bootwright_storage_attestation_entries
            | bootwright.core.bootwright_storage_destroy_attestation(
                false,
                bootwright_destroy_skip_unreachable | default(false) | bool)
          }}
        bootwright_storage_skipped_entries: >-
          {{
            bootwright_storage_attestation_entries
            | selectattr('bootwright_storage_reachable_probe.unreachable', 'defined')
            | selectattr('bootwright_storage_reachable_probe.unreachable')
            | list
          }}
        bootwright_storage_skipped_reasons: >-
          {{
            bootwright_storage_skipped_entries
            | map(attribute='bootwright_storage_node_name')
            | zip(bootwright_storage_skipped_entries
                  | map(attribute='bootwright_storage_node_refusal', default='no connection diagnostic was recorded'))
            | map('join', ': ') | list
          }}
      block:
        - name: Warn about storage hosts skipped as unreachable
          ansible.builtin.debug:
            msg: >-
              Skipped storage node(s) this teardown proved absent:
              {{ bootwright_storage_skipped_reasons | join('; ') }}.
              Their OSD devices were NOT wiped, their Ceph daemons were not stopped and
              local Ceph state remains; storage cluster(s)
              {{ bootwright_storage_skipped_entries | map(attribute='bootwright_storage_cluster_name') | unique | list | join(', ') }}
              are only partially destroyed. Re-run destroy once the nodes are back
              up, or wipe them manually, before reusing the hardware.
          when: bootwright_storage_skipped_entries | length > 0

        - name: Create storage destroy artifact directory
          ansible.builtin.file:
            path: "{{ bootwright_ansible_artifacts_dir }}"
            state: directory
            mode: "0700"
          delegate_to: localhost
          become: false

        - name: Record the preliminary Ceph teardown state for the controller
          ansible.builtin.copy:
            dest: "{{ bootwright_ansible_artifacts_dir }}/storage-destroy-result.json"
            content: >-
              {{ bootwright_storage_preliminary_result | to_nice_json }}
            mode: "0600"
          delegate_to: localhost
          become: false
      run_once: true

    - name: Stop tearing down unreachable storage hosts
      ansible.builtin.meta: end_host
      when:
        - bootwright_destroy_skip_unreachable | default(false) | bool
        - bootwright_storage_reachable_probe.unreachable | default(false) | bool

    - name: Gather facts on reachable storage hosts
      ansible.builtin.setup:
        gather_subset:
          - "!all"
          - min
      ignore_unreachable: "{{ bootwright_destroy_skip_unreachable | default(false) | bool }}"

    - name: Validate selected storage cluster context
      ansible.builtin.assert:
        that:
          - bootwright_selected_storage_cluster.name | default('') == bootwright_storage_cluster_name | default('')
        fail_msg: >-
          Storage destroy did not receive a rendered context for
          {{ bootwright_storage_cluster_name | default('<unset>') }}.

    - name: Resolve reachable Ceph ownership evidence hosts
      ansible.builtin.set_fact:
        bootwright_ceph_destroy_seed_reachable: >-
          {{ bootwright_storage_seed_host_name in ansible_play_hosts }}
        bootwright_ceph_destroy_reachable_mon_hosts: >-
          {{ bootwright_selected_storage_cluster.monInventoryHosts | default([])
             | select('in', ansible_play_hosts) | list }}
        bootwright_ceph_destroy_authority_host: >-
          {{ bootwright_storage_seed_host_name
             if bootwright_storage_seed_host_name in ansible_play_hosts else '' }}
      changed_when: false

    - name: Require a reachable declared mon when the Ceph seed is absent
      ansible.builtin.assert:
        that:
          - bootwright_ceph_destroy_seed_reachable | bool
            or (bootwright_ceph_destroy_reachable_mon_hosts | length > 0)
        fail_msg: >-
          Refusing to tear down storage cluster {{ bootwright_storage_cluster_name }} before any
          device wipe: declared seed {{ bootwright_storage_seed_host_name }} did not answer, and
          no other declared mon is reachable to supply the host-side ownership evidence. A
          controller record alone never authorizes Ceph teardown. Power on the declared seed or
          one declared mon with its intact /etc/ceph/ceph.conf and
          /etc/ceph/.bootwright-owned marker, fix the route or SSH identity if the diagnostic
          named one, then re-run the same destroy invocation:
          `{{ bootwright_mutating_invocation | default('the same bootwright destroy invocation') }}`.
          Keep --authorize unreachable-nodes
          only for hosts the run proves absent; it skips those hosts but cannot replace ownership
          proof. There is no record-only destructive escape.

    - name: Destroy Ceph storage cluster
      ansible.builtin.include_role:
        name: bootwright.core.storage_cluster_cephadm
        tasks_from: destroy.yml

    - name: Classify this storage node terminal completion proof
      vars:
        bootwright_storage_node_terminal_attestation: >-
          {{
            [hostvars[inventory_hostname]]
            | bootwright.core.bootwright_storage_destroy_attestation(
                true,
                bootwright_destroy_skip_unreachable | default(false) | bool)
          }}
        bootwright_storage_node_terminal_nodes: >-
          {{
            bootwright_storage_node_terminal_attestation.clusters
            | map(attribute='nodes') | flatten | list
          }}
      ansible.builtin.set_fact:
        bootwright_storage_node_terminal_completed: >-
          {{
            (bootwright_storage_node_terminal_nodes | length == 1)
            and (bootwright_storage_node_terminal_nodes
                 | selectattr('outcome', 'equalto', 'completed') | list | length == 1)
          }}
      changed_when: false

    - name: Record the terminal storage destroy attestation
      vars:
        bootwright_storage_attestation_entries: >-
          {{
            ansible_play_hosts_all
            | map('extract', hostvars)
            | selectattr('bootwright_storage_reachable_probe', 'defined')
            | list
          }}
        bootwright_storage_destroy_result: >-
          {{
            bootwright_storage_attestation_entries
            | bootwright.core.bootwright_storage_destroy_attestation(
                true,
                bootwright_destroy_skip_unreachable | default(false) | bool)
          }}
        bootwright_storage_terminal_nodes: >-
          {{
            bootwright_storage_destroy_result.clusters
            | map(attribute='nodes') | flatten | list
          }}
        bootwright_storage_incomplete_nodes: >-
          {{
            bootwright_storage_terminal_nodes
            | rejectattr('outcome', 'in', ['completed', 'skipped'])
            | map(attribute='name') | list
          }}
        bootwright_storage_skipped_reasons: >-
          {{
            bootwright_storage_terminal_nodes
            | selectattr('outcome', 'equalto', 'skipped')
            | map(attribute='reason') | list
          }}
      block:
        - name: Refuse a terminal storage result with unaccounted nodes
          ansible.builtin.assert:
            that:
              - bootwright_storage_incomplete_nodes | length == 0
            fail_msg: >-
              Storage node(s) {{ bootwright_storage_incomplete_nodes | join(', ') }} reached
              neither the final Ceph LVM proof and remote witness nor an authorized,
              positively classified unreachable outcome. The controller will reject the
              preliminary result and retain every storage recovery record. Fix the failed
              node or connection and re-run the same destroy invocation.

        - name: Warn about storage nodes skipped or lost during teardown
          ansible.builtin.debug:
            msg: >-
              Storage node(s) left outside the completed teardown proof:
              {{ bootwright_storage_skipped_reasons | join('; ') }}. Their OSD devices may
              NOT be wiped, their Ceph daemons may still be running and local Ceph state may
              remain. The controller will keep the affected cluster ownership and history;
              re-run destroy once the nodes answer again, or wipe them manually, before
              reusing the hardware.
          when: bootwright_storage_skipped_reasons | length > 0

        - name: Record the final Ceph teardown state for the controller
          ansible.builtin.copy:
            dest: "{{ bootwright_ansible_artifacts_dir }}/storage-destroy-result.json"
            content: >-
              {{ bootwright_storage_destroy_result | to_nice_json }}
            mode: "0600"
          delegate_to: localhost
          become: false
      run_once: true

    - name: Release host ownership evidence after recording the terminal attestation
      ansible.builtin.include_role:
        name: bootwright.core.storage_cluster_cephadm
        tasks_from: destroy_release.yml
        apply:
          ignore_unreachable: false
      when: bootwright_storage_node_terminal_completed | default(false) | bool
