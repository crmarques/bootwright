---
- name: Destroy managed Ceph storage
  hosts: bootwright_storage_hosts
  gather_facts: false
  become: true
  ignore_unreachable: "{{ bootwright_destroy_skip_unreachable | default(false) | bool }}"
  any_errors_fatal: true
  environment: "{{ bootwright_proxy_env | default({}) }}"
  vars:
    bootwright_selected_storage_cluster: >-
      {{
        bootwright_storage_clusters
        | default([])
        | selectattr('name', 'equalto', bootwright_storage_cluster_name | default(''))
        | list
        | first
        | default({})
      }}
  pre_tasks:
    - name: Resolve proxy environment
      ansible.builtin.import_role:
        name: bootwright.core.machine_proxy
        tasks_from: facts
  tasks:
    - name: End hosts outside managed storage clusters
      ansible.builtin.meta: end_host
      when: bootwright_storage_cluster_name | default('') | length == 0

    - name: End hosts outside the selected storage clusters
      ansible.builtin.meta: end_host
      when:
        - bootwright_destroy_storage_scope is defined
        - bootwright_storage_cluster_name | default('') not in (bootwright_destroy_storage_scope | split(','))

    - name: Select storage node teardown connection
      ansible.builtin.include_role:
        name: bootwright.core.storage_node_access
        tasks_from: select_connection.yml
      when: bootwright_node_access is defined

    - name: Probe storage host reachability before teardown
      ansible.builtin.ping:
      register: bootwright_storage_reachable_probe
      ignore_unreachable: true
      failed_when: false
      when:
        - >-
          bootwright_node_access is not defined
          or (bootwright_node_access_connection_available | default(false) | bool)

    - name: Record storage host unreachable when no node identity answers
      ansible.builtin.set_fact:
        bootwright_storage_reachable_probe:
          unreachable: true
      when:
        - bootwright_node_access is defined
        - not (bootwright_node_access_connection_available | default(false) | bool)

    - name: Require storage hosts reachable unless --authorize unreachable-nodes
      ansible.builtin.assert:
        that:
          - not (bootwright_storage_reachable_probe.unreachable | default(false) | bool)
        fail_msg: >-
          Storage node {{ bootwright_storage_node_name | default(inventory_hostname) }}
          for storage cluster {{ bootwright_storage_cluster_name }} is unreachable:
          power it on and retry, or re-run with --authorize unreachable-nodes to tear it
          down as already-absent.
      when: not (bootwright_destroy_skip_unreachable | default(false) | bool)

    - name: Summarize storage hosts skipped as unreachable
      vars:
        bootwright_storage_skipped_entries: >-
          {{
            ansible_play_hosts_all
            | map('extract', hostvars)
            | selectattr('bootwright_storage_reachable_probe', 'defined')
            | selectattr('bootwright_storage_reachable_probe.unreachable', 'defined')
            | selectattr('bootwright_storage_reachable_probe.unreachable')
            | list
          }}
      block:
        - name: Warn about storage hosts skipped as unreachable
          ansible.builtin.debug:
            msg: >-
              Skipped unreachable storage node(s):
              {{ bootwright_storage_skipped_entries | map(attribute='bootwright_storage_node_name') | list | join(', ') }}.
              Their OSD devices were NOT wiped and local Ceph state remains; storage
              cluster(s)
              {{ bootwright_storage_skipped_entries | map(attribute='bootwright_storage_cluster_name') | unique | list | join(', ') }}
              are only partially destroyed. Re-run destroy once the nodes are back
              up, or wipe them manually, before reusing the hardware.
          when: bootwright_storage_skipped_entries | length > 0

        - name: Create storage destroy artifact directory
          ansible.builtin.file:
            path: "{{ bootwright_ansible_artifacts_dir }}"
            state: directory
            mode: "0700"
          delegate_to: localhost
          become: false

        - name: Record skipped-node Ceph teardown state for the controller
          ansible.builtin.copy:
            dest: "{{ bootwright_ansible_artifacts_dir }}/storage-destroy-result.json"
            content: >-
              {{
                {
                  'partialClusters': (bootwright_storage_skipped_entries | map(attribute='bootwright_storage_cluster_name') | unique | list),
                  'skippedNodes': (bootwright_storage_skipped_entries | map(attribute='bootwright_storage_node_name') | list),
                  'skippedHosts': (bootwright_storage_skipped_entries | map(attribute='inventory_hostname') | list)
                } | to_nice_json
              }}
            mode: "0600"
          delegate_to: localhost
          become: false
      run_once: true
      when:
        - bootwright_destroy_skip_unreachable | default(false) | bool

    - name: Stop tearing down unreachable storage hosts
      ansible.builtin.meta: end_host
      when:
        - bootwright_destroy_skip_unreachable | default(false) | bool
        - bootwright_storage_reachable_probe.unreachable | default(false) | bool

    - name: Gather facts on reachable storage hosts
      ansible.builtin.setup:
        gather_subset:
          - "!all"
          - min
      ignore_unreachable: "{{ bootwright_destroy_skip_unreachable | default(false) | bool }}"

    - name: Require the Ceph seed host to be reachable before any device wipe
      ansible.builtin.assert:
        that:
          - not (hostvars[bootwright_storage_seed_host_name].bootwright_storage_reachable_probe.unreachable | default(false) | bool)
        fail_msg: >-
          Ceph seed host {{ bootwright_storage_seed_host_name }} for storage cluster
          {{ bootwright_storage_cluster_name }} is unreachable: power it on and retry.
          --authorize unreachable-nodes cannot skip the seed — it proves cluster ownership before
          any node wipes its OSD devices.
      when: bootwright_destroy_skip_unreachable | default(false) | bool

    - name: Flag storage clusters left partial by unreachable nodes
      ansible.builtin.set_fact:
        bootwright_storage_cluster_partial: >-
          {{
            ansible_play_hosts_all
            | map('extract', hostvars)
            | selectattr('bootwright_storage_cluster_name', 'defined')
            | selectattr('bootwright_storage_cluster_name', 'equalto', bootwright_storage_cluster_name)
            | selectattr('bootwright_storage_reachable_probe', 'defined')
            | selectattr('bootwright_storage_reachable_probe.unreachable', 'defined')
            | selectattr('bootwright_storage_reachable_probe.unreachable')
            | list | length > 0
          }}
      changed_when: false
      when: bootwright_destroy_skip_unreachable | default(false) | bool

    - name: Validate selected storage cluster context
      ansible.builtin.assert:
        that:
          - bootwright_selected_storage_cluster.name | default('') == bootwright_storage_cluster_name | default('')
        fail_msg: >-
          Storage destroy did not receive a rendered context for
          {{ bootwright_storage_cluster_name | default('<unset>') }}.

    - name: Destroy Ceph storage cluster
      ansible.builtin.include_role:
        name: bootwright.core.storage_cluster_cephadm
        tasks_from: destroy.yml
