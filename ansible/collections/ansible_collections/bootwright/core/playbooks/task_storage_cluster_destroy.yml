---
- name: Destroy managed Ceph storage
  hosts: bootwright_storage_hosts
  gather_subset:
    - "!all"
    - min
  become: true
  # --skip-unreachable opts into tolerating powered-off nodes: an unreachable
  # host no longer counts as fatal, so the teardown proceeds on the hosts it can
  # reach. Default (var unset) keeps the historical behaviour where an
  # unreachable host is fatal at fact-gather.
  ignore_unreachable: "{{ bootwright_destroy_skip_unreachable | default(false) | bool }}"
  # A seed-host ownership refusal (a foreign or unverifiable Ceph cluster) must
  # abort the whole destroy before any node wipes its OSD devices. Kept literally
  # true even with ignore_unreachable: a genuine task failure (the seed ownership
  # assert, or the seed-reachability gate below) still aborts every host, while an
  # unreachable host is merely skipped.
  any_errors_fatal: true
  # Teardown package/podman work reaches the egress proxy through the task
  # environment; bootwright no longer writes a proxy= line into dnf.conf/yum.conf,
  # so resolve the proxy facts here and apply them play-wide.
  environment: "{{ bootwright_proxy_env | default({}) }}"
  vars:
    bootwright_selected_storage_cluster: >-
      {{
        bootwright_storage_clusters
        | default([])
        | selectattr('name', 'equalto', bootwright_storage_cluster_name | default(''))
        | list
        | first
        | default({})
      }}
  pre_tasks:
    - name: Resolve proxy environment
      ansible.builtin.import_role:
        name: bootwright.core.machine_proxy
        tasks_from: facts
  tasks:
    - name: End hosts outside managed storage clusters
      ansible.builtin.meta: end_host
      when: bootwright_storage_cluster_name | default('') | length == 0

    # A scoped --clusters destroy narrows the storage teardown to the
    # directly-selected storage roots (bootwright_destroy_storage_scope). A
    # render-reference StorageCluster pulled into the render-inclusive state for
    # a container cluster's data-foundation attachment is rendered into this
    # group but not selected, so end its hosts before any OSD wipe. The var is
    # defined whenever a --clusters narrowing is in force and holds the exact
    # allowlist: an empty value tears down no storage at all (a container-only
    # scope). Undefined means no narrowing (tear down every rendered managed
    # storage host).
    - name: End hosts outside the selected storage clusters
      ansible.builtin.meta: end_host
      when:
        - bootwright_destroy_storage_scope is defined
        - bootwright_storage_cluster_name | default('') not in (bootwright_destroy_storage_scope | split(','))

    # --- Skip-unreachable handling (opt-in) -------------------------------
    # Only runs under --skip-unreachable; without it an unreachable host has
    # already aborted at fact-gather, so these guards are inert by default.

    - name: Probe storage host reachability before teardown
      ansible.builtin.ping:
      register: bootwright_storage_reachable_probe
      when: bootwright_destroy_skip_unreachable | default(false) | bool

    - name: Stop tearing down unreachable storage hosts
      ansible.builtin.meta: end_host
      when:
        - bootwright_destroy_skip_unreachable | default(false) | bool
        - bootwright_storage_reachable_probe.unreachable | default(false) | bool

    # Ownership is proven only on the seed host (cluster_gate). If the seed is the
    # node that is down, no ownership check runs yet the reachable nodes would
    # still reach the device wipe (the wipe tasks are not individually
    # ownership-gated). Fail closed: require the seed to be reachable before any
    # wipe. Runs on every reachable in-scope host; any_errors_fatal turns a single
    # failure into a whole-play abort, so no node wipes when a seed is unreachable.
    - name: Require the Ceph seed host to be reachable before any device wipe
      ansible.builtin.assert:
        that:
          - not (hostvars[bootwright_storage_seed_host_name].bootwright_storage_reachable_probe.unreachable | default(false) | bool)
        fail_msg: >-
          Ceph seed host {{ bootwright_storage_seed_host_name }} for storage
          cluster {{ bootwright_storage_cluster_name }} is unreachable. The seed
          proves cluster ownership before any node wipes its OSD devices, so the
          destroy fails closed. Power the seed host on and retry, or remove the
          cluster manually after verifying it is safe to destroy.
      when: bootwright_destroy_skip_unreachable | default(false) | bool

    # Flag this cluster as partially destroyed when any of its nodes was skipped
    # as unreachable: the per-node ownership-record removal in wipe_and_cleanup is
    # gated on this so a partially-destroyed cluster keeps its controller-side
    # ownership record (it is not treated as fully gone).
    - name: Flag storage clusters left partial by unreachable nodes
      ansible.builtin.set_fact:
        bootwright_storage_cluster_partial: >-
          {{
            ansible_play_hosts_all
            | map('extract', hostvars)
            | selectattr('bootwright_storage_cluster_name', 'defined')
            | selectattr('bootwright_storage_cluster_name', 'equalto', bootwright_storage_cluster_name)
            | selectattr('bootwright_storage_reachable_probe', 'defined')
            | selectattr('bootwright_storage_reachable_probe.unreachable', 'defined')
            | selectattr('bootwright_storage_reachable_probe.unreachable')
            | list | length > 0
          }}
      changed_when: false
      when: bootwright_destroy_skip_unreachable | default(false) | bool

    - name: Validate selected storage cluster context
      ansible.builtin.assert:
        that:
          - bootwright_selected_storage_cluster.name | default('') == bootwright_storage_cluster_name | default('')
        fail_msg: >-
          Storage destroy did not receive a rendered context for
          {{ bootwright_storage_cluster_name | default('<unset>') }}.

    - name: Destroy Ceph storage cluster
      ansible.builtin.include_role:
        name: bootwright.core.storage_cluster_cephadm
        tasks_from: destroy.yml

    # Summarize a partial teardown (nodes skipped as unreachable) for the operator
    # and for the controller. The result file round-trips on the controller
    # (delegate_to: localhost), mirroring the apply-side storage-result.json, and
    # bootwright reads it to mark the affected storage clusters partially
    # destroyed so they are not treated as fully gone.
    - name: Summarize storage hosts skipped as unreachable
      vars:
        bootwright_storage_skipped_entries: >-
          {{
            ansible_play_hosts_all
            | map('extract', hostvars)
            | selectattr('bootwright_storage_reachable_probe', 'defined')
            | selectattr('bootwright_storage_reachable_probe.unreachable', 'defined')
            | selectattr('bootwright_storage_reachable_probe.unreachable')
            | list
          }}
      block:
        - name: Warn about storage hosts skipped as unreachable
          ansible.builtin.debug:
            msg: >-
              Skipped unreachable storage node(s):
              {{ bootwright_storage_skipped_entries | map(attribute='bootwright_storage_node_name') | list | join(', ') }}.
              Their OSD devices were NOT wiped and local Ceph state remains; storage
              cluster(s)
              {{ bootwright_storage_skipped_entries | map(attribute='bootwright_storage_cluster_name') | unique | list | join(', ') }}
              are only partially destroyed. Re-run destroy once the nodes are back
              up, or wipe them manually, before reusing the hardware.

        - name: Create storage destroy artifact directory
          ansible.builtin.file:
            path: "{{ bootwright_ansible_artifacts_dir }}"
            state: directory
            mode: "0700"
          delegate_to: localhost
          become: false

        - name: Record partial Ceph teardown for the controller
          ansible.builtin.copy:
            dest: "{{ bootwright_ansible_artifacts_dir }}/storage-destroy-result.json"
            content: >-
              {{
                {
                  'partialClusters': (bootwright_storage_skipped_entries | map(attribute='bootwright_storage_cluster_name') | unique | list),
                  'skippedNodes': (bootwright_storage_skipped_entries | map(attribute='bootwright_storage_node_name') | list),
                  'skippedHosts': (bootwright_storage_skipped_entries | map(attribute='inventory_hostname') | list)
                } | to_nice_json
              }}
            mode: "0600"
          delegate_to: localhost
          become: false
      run_once: true
      when:
        - bootwright_destroy_skip_unreachable | default(false) | bool
        - bootwright_storage_skipped_entries | length > 0
