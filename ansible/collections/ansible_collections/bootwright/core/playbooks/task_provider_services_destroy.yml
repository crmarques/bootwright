---
- name: Destroy provider services
  hosts: bootwright_provider_hosts
  strategy: linear
  gather_subset:
    - "!all"
    - min
  become: true
  ignore_unreachable: "{{ bootwright_destroy_skip_unreachable | default(false) | bool }}"

  vars:
    bootwright_machine_provider_services_all: >-
      {{
        bootwright_provider_services | default([])
        | selectattr('machineRef', 'defined')
        | selectattr('machineRef', 'equalto', bootwright_host_name)
        | list
      }}
    bootwright_machine_provider_services: "{{ bootwright_machine_provider_services_all }}"
    bootwright_machine_provider_ownership_records: >-
      {{
        bootwright_ownership_records | default([])
        | selectattr('host', 'equalto', bootwright_host_name | default(inventory_hostname))
        | list
      }}
    bootwright_machine_provider_record_names: >-
      {{
        bootwright_machine_provider_services
        | map(attribute='providerName')
        | list
      }}
    bootwright_machine_shared_provider_selected: >-
      {{ (bootwright_machine_provider_services
          | selectattr('kind', 'equalto', 'bmc') | list | length > 0)
         or (bootwright_machine_provider_ownership_records
             | selectattr('kind', 'equalto', 'bmc-emulator') | list | length > 0) }}

  tasks:
    - name: Acquire command-wide host operation before shared provider teardown
      ansible.builtin.include_role:
        name: bootwright.core.ownership_record
        tasks_from: acquire_host_shared_service_operation.yml
      when: bootwright_machine_shared_provider_selected | bool

    - name: Destroy provider service roles
      ansible.builtin.include_role:
        name: "{{ bootwright_component.destroyRole }}"
        tasks_from: destroy.yml
      loop: "{{ bootwright_machine_provider_services | reverse | list }}"
      loop_control:
        loop_var: bootwright_component
        label: "{{ bootwright_component.providerName }}/{{ bootwright_component.kind }}/{{ bootwright_component.name }} via {{ bootwright_component.destroyRole }}"

    - name: Destroy recorded provider resources
      ansible.builtin.include_role:
        name: bootwright.core.ownership_record
        tasks_from: destroy_resource.yml
      vars:
        bootwright_bmc_record_only_destroy: true
      loop: "{{ bootwright_machine_provider_ownership_records | reverse | list }}"
      loop_control:
        loop_var: bootwright_ownership_record
        label: "{{ bootwright_ownership_record.kind }}/{{ bootwright_ownership_record.name }}"
      when:
        - bootwright_ownership_record.kind == 'bmc-emulator'
        - bootwright_destroy_cluster_scope is not defined
        - bootwright_ownership_record.name not in bootwright_machine_provider_record_names

    - name: Finalize provider service destroy proof
      ansible.builtin.include_tasks: tasks/destroy_completion.yml
