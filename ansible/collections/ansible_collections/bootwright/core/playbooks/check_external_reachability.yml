---
# Bastion-side reachability validation. Runs against bootwright_ocp_hosts so a
# workspace with no on-host provider/infra work (e.g. test 002: bare-metal
# cluster, every service external) still has something meaningful happen during
# `apply --stage infra` / `check infra`. The role probes only components Bootwright must
# reach before apply can make progress.

- name: Validate external infrastructure dependencies
  hosts: bootwright_ocp_hosts
  gather_facts: false

  tasks:
    - name: Apply external validation role
      ansible.builtin.import_role:
        name: bootwright.core.check_external_reachability
