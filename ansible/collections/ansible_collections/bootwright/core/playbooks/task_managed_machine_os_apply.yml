---
- name: Apply managed machine operating systems
  hosts: bootwright_infra_hosts
  strategy: free
  gather_subset:
    - "!all"
    - min
  become: true
  environment: "{{ bootwright_proxy_env | default({}) }}"

  pre_tasks:
    - name: Resolve proxy environment
      ansible.builtin.import_role:
        name: bootwright.core.machine_proxy
        tasks_from: facts

  tasks:
    - name: Apply base host packages
      ansible.builtin.import_role:
        name: bootwright.core.machine_base

    - name: Dispatch managed OS install groups on this host
      ansible.builtin.include_tasks: tasks/managed_machine_os_apply_group.yml
      loop: "{{ bootwright_managed_os_install_groups | default([]) }}"
      loop_control:
        loop_var: bootwright_os_group
        label: "{{ bootwright_os_group.name }}"
      when:
        - (bootwright_task_managed_os_group_name | default('') | length) == 0 or bootwright_os_group.name == bootwright_task_managed_os_group_name
        - >-
          bootwright_os_group.components
          | selectattr('machineRef', 'defined')
          | selectattr('machineRef', 'equalto', bootwright_host_name)
          | list
          | length > 0
