---
- name: Run one add-on instance
  hosts: bootwright_target
  gather_facts: false
  any_errors_fatal: true
  serial: 1
  strategy: ansible.builtin.linear

  tasks:
    - name: Execute the add-on instance capability
      ansible.builtin.import_role:
        name: bootwright.core.addons_instance
        tasks_from: observe
