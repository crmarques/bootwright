---

- name: Install clusters via openshift-install agent
  hosts: bootwright_ocp_hosts
  gather_subset:
    - "!all"
    - min
  become: true
  environment: "{{ bootwright_proxy_env | default({}) }}"

  pre_tasks:
    - name: Resolve proxy environment
      ansible.builtin.import_role:
        name: bootwright.core.machine_proxy
        tasks_from: facts

  tasks:
    - name: Install agent per cluster
      ansible.builtin.include_role:
        name: bootwright.core.container_cluster_agent_install
      loop: "{{ bootwright_clusters | default([]) }}"
      loop_control:
        loop_var: bootwright_current_cluster
        label: "{{ bootwright_current_cluster.name }}"
      when:
        - bootwright_current_cluster.installMethod == 'agent'
