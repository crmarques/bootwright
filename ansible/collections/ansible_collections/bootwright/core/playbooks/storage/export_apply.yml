---
- name: Apply one frozen Ceph export resource
  hosts: bootwright_target
  gather_facts: false
  any_errors_fatal: true
  serial: 1
  strategy: ansible.builtin.linear

  tasks:
    - name: Execute the Ceph export apply capability
      ansible.builtin.import_role:
        name: bootwright.core.storage_ceph_export
        tasks_from: apply
