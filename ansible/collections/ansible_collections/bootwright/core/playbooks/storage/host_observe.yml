---
- name: Observe one Ceph host preparation
  hosts: bootwright_target
  gather_facts: false
  any_errors_fatal: true
  serial: 1
  strategy: ansible.builtin.linear

  tasks:
    - name: Execute the Ceph host observe capability
      ansible.builtin.import_role:
        name: bootwright.core.storage_ceph_host
        tasks_from: observe
