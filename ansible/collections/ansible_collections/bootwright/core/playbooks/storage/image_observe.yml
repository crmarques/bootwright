---
- name: Run the pinned Ceph image observe operation
  hosts: bootwright_target
  gather_facts: false
  any_errors_fatal: true
  serial: 1
  strategy: ansible.builtin.linear

  tasks:
    - name: Execute the Ceph image observe capability
      ansible.builtin.import_role:
        name: bootwright.core.storage_ceph_image
        tasks_from: observe
