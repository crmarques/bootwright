---
- name: Prepare the suspension of one frozen Ceph sign-on
  hosts: bootwright_target
  gather_facts: false
  any_errors_fatal: true
  serial: 1
  strategy: ansible.builtin.linear

  tasks:
    - name: Execute the Ceph sign-on suspension preparation
      ansible.builtin.import_role:
        name: bootwright.core.storage_ceph_core
        tasks_from: signon_suspend_prepare
