---
- name: Manage the owned dashboard administrator credential
  hosts: bootwright_target
  gather_facts: false
  any_errors_fatal: true
  serial: 1
  strategy: ansible.builtin.linear

  tasks:
    - name: Execute the administrator credential operation
      ansible.builtin.import_role:
        name: bootwright.core.storage_ceph_admin_credentials
        tasks_from: prepare
