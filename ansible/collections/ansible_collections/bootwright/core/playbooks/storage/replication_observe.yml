---
- name: Observe one frozen Ceph replication resource
  hosts: bootwright_target
  gather_facts: false
  any_errors_fatal: true
  serial: 1
  strategy: ansible.builtin.linear

  tasks:
    - name: Execute the Ceph replication observe capability
      ansible.builtin.import_role:
        name: bootwright.core.storage_ceph_replication
        tasks_from: observe
