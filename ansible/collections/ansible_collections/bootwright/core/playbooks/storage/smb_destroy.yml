---
- name: Destroy one frozen Ceph SMB resource
  hosts: bootwright_target
  gather_facts: false
  any_errors_fatal: true
  serial: 1
  strategy: ansible.builtin.linear

  tasks:
    - name: Execute the Ceph SMB destroy capability
      ansible.builtin.import_role:
        name: bootwright.core.storage_ceph_smb
        tasks_from: destroy
