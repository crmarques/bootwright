---
- name: Boot OpenShift agent machines
  hosts: bootwright_agent_node_hosts
  strategy: linear
  gather_subset:
    - "!all"
    - min
  become: true
  environment: "{{ bootwright_proxy_env | default({}) }}"

  pre_tasks:
    - name: Resolve proxy environment
      ansible.builtin.import_role:
        name: bootwright.core.machine_proxy
        tasks_from: facts

  tasks:
    - name: Resolve selected cluster
      ansible.builtin.set_fact:
        bootwright_current_cluster: "{{ (bootwright_clusters | default([]) | selectattr('name', 'equalto', bootwright_agent_node_cluster_name) | list | first) | default({}) }}"
      changed_when: false

    - name: Validate selected cluster
      ansible.builtin.assert:
        that:
          - bootwright_current_cluster is mapping
          - bootwright_current_cluster.name | default('') == bootwright_agent_node_cluster_name
        fail_msg: >-
          Could not resolve cluster {{ bootwright_agent_node_cluster_name | default('<unset>') }}
          for agent node host {{ inventory_hostname }}.

    - name: Boot selected agent machine
      ansible.builtin.include_role:
        name: bootwright.core.container_cluster_agent_install
      vars:
        bootwright_install_agent_action: boot_machine
      when:
        - bootwright_current_cluster.installMethod == 'agent'
        - bootwright_current_cluster.name == bootwright_task_cluster_name
