---
- name: Create BMC state directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ bootwright_bmc_root }}"
    - "{{ bootwright_bmc_root }}/state"
    - "{{ bootwright_bmc_root }}/vmedia"

- name: Load BMC package list
  ansible.builtin.include_vars: "{{ ansible_facts['os_family'] }}.yml"

- name: Install BMC packages
  ansible.builtin.package:
    name: "{{ bootwright_bmc_packages }}"
    state: present

- name: Create sushy-tools virtualenv
  ansible.builtin.command:
    argv:
      - python3
      - -m
      - venv
      - --system-site-packages
      - "{{ bootwright_bmc_root }}/venv"
    creates: "{{ bootwright_bmc_root }}/venv/bin/python"

- name: Install sushy-tools into virtualenv
  ansible.builtin.command:
    argv:
      - "{{ bootwright_bmc_root }}/venv/bin/pip"
      - install
      - --no-deps
      - "sushy-tools=={{ bootwright_sushy_tools_version }}"
  args:
    creates: "{{ bootwright_bmc_root }}/venv/bin/sushy-emulator"

- name: Ensure SELinux file context labels venv binaries as bin_t
  community.general.sefcontext:
    target: "{{ bootwright_bmc_root }}/venv/bin(/.*)?"
    setype: bin_t
    state: present
  register: bootwright_bmc_sushy_sefcontext
  when: ansible_selinux.status | default('disabled') == 'enabled'

- name: Apply SELinux labels to venv binaries
  ansible.builtin.command:
    argv:
      - restorecon
      - -RFv
      - "{{ bootwright_bmc_root }}/venv/bin"
  register: bootwright_bmc_sushy_restorecon
  changed_when: bootwright_bmc_sushy_restorecon.stdout | length > 0
  when: ansible_selinux.status | default('disabled') == 'enabled'
