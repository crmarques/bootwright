---
- name: Resolve BMC credentials file path
  ansible.builtin.set_fact:
    bootwright_bmc_cred_path: >-
      {{ (bootwright_secrets_dir ~ '/' ~ bootwright_bmc_cred_ref) if (bootwright_bmc_cred_ref | length) > 0 else '' }}
  changed_when: false

- name: Load BMC credentials
  ansible.builtin.include_role:
    name: credentials
    tasks_from: load
  vars:
    bootwright_creds_path: "{{ bootwright_bmc_cred_path }}"
    bootwright_creds_var: bootwright_bmc_credentials
    bootwright_creds_label: "provider BMC credentialRef {{ bootwright_bmc_cred_path }}"
  when: (bootwright_bmc_cred_path | length) > 0

- name: Stat existing BMC htpasswd
  ansible.builtin.stat:
    path: "{{ bootwright_bmc_root }}/htpasswd"
  register: bootwright_bmc_htpasswd_stat
  when: (bootwright_bmc_cred_path | length) > 0

- name: Verify existing BMC htpasswd matches current credentials
  ansible.builtin.command:
    argv:
      - htpasswd
      - -vi
      - "{{ bootwright_bmc_root }}/htpasswd"
      - "{{ bootwright_bmc_credentials.username }}"
    stdin: "{{ bootwright_bmc_credentials.password }}"
  register: bootwright_bmc_htpasswd_verify
  no_log: true
  changed_when: false
  failed_when: false
  when:
    - (bootwright_bmc_cred_path | length) > 0
    - bootwright_bmc_htpasswd_stat.stat.exists | default(false)

- name: Decide whether to rewrite BMC htpasswd
  ansible.builtin.set_fact:
    bootwright_bmc_htpasswd_needs_write: >-
      {{
        not (bootwright_bmc_htpasswd_stat.stat.exists | default(false))
        or (bootwright_bmc_htpasswd_verify.rc | default(1)) != 0
      }}
  no_log: true
  changed_when: false
  when: (bootwright_bmc_cred_path | length) > 0

- name: Write BMC htpasswd
  ansible.builtin.command:
    argv:
      - htpasswd
      - -iBc
      - "{{ bootwright_bmc_root }}/htpasswd"
      - "{{ bootwright_bmc_credentials.username }}"
    stdin: "{{ bootwright_bmc_credentials.password }}"
  no_log: true
  register: bootwright_bmc_htpasswd
  changed_when: bootwright_bmc_htpasswd.rc == 0
  when:
    - (bootwright_bmc_cred_path | length) > 0
    - bootwright_bmc_htpasswd_needs_write | default(false) | bool

- name: Enforce BMC htpasswd permissions
  ansible.builtin.file:
    path: "{{ bootwright_bmc_root }}/htpasswd"
    owner: root
    group: root
    mode: "0600"
  when: (bootwright_bmc_cred_path | length) > 0
