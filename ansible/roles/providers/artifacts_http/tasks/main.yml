---
# Converges one artifacts HTTPS server on this provider host. The
# renderer projects `bootwright_component` with:
#   { kind, providerName, name, hostRef, hostAddress, port, bindAddress,
#     realisation: 'http', url, tls }

- name: Validate boot artifact HTTPS settings
  ansible.builtin.assert:
    that:
      - bootwright_component.port | int > 0
      - (bootwright_component.bindAddress | default('')) | length > 0
      - (bootwright_component.tls.commonName | default('')) | length > 0
    fail_msg: "artifacts_http requires component.{port,bindAddress,tls.commonName}"

- name: Resolve boot artifact paths
  ansible.builtin.set_fact:
    bootwright_artifacts_state_dir: "{{ bootwright_host_state_dir }}/artifacts-server"
    bootwright_artifacts_tls_dir: "{{ bootwright_host_state_dir }}/artifacts-server/tls"
    bootwright_artifacts_tls_cert_path: "{{ bootwright_host_state_dir }}/artifacts-server/tls/server.crt"
    bootwright_artifacts_tls_key_path: "{{ bootwright_host_state_dir }}/artifacts-server/tls/server.key"
  changed_when: false

- name: Install boot artifact TLS tooling
  ansible.builtin.package:
    name: openssl
    state: present

- name: Create boot artifact helper directory
  ansible.builtin.file:
    path: /usr/local/libexec/bootwright
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install boot artifact HTTP server
  ansible.builtin.copy:
    src: artifacts_http_server.py
    dest: /usr/local/libexec/bootwright/artifacts-http-server.py
    owner: root
    group: root
    mode: "0755"
  register: bootwright_artifacts_helper

- name: Create boot artifact state directory
  ansible.builtin.file:
    path: "{{ bootwright_artifacts_state_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create boot artifact TLS directory
  ansible.builtin.file:
    path: "{{ bootwright_artifacts_tls_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Stat boot artifact TLS certificate
  ansible.builtin.stat:
    path: "{{ bootwright_artifacts_tls_cert_path }}"
  register: bootwright_artifacts_tls_cert
  changed_when: false

- name: Stat boot artifact TLS key
  ansible.builtin.stat:
    path: "{{ bootwright_artifacts_tls_key_path }}"
  register: bootwright_artifacts_tls_key
  changed_when: false

- name: Detect existing boot artifact TLS material
  ansible.builtin.set_fact:
    bootwright_artifacts_tls_material_present: >-
      {{
        (bootwright_artifacts_tls_cert.stat.exists | bool)
        and (bootwright_artifacts_tls_key.stat.exists | bool)
      }}
  changed_when: false

- name: Render boot artifact TLS OpenSSL config
  ansible.builtin.template:
    src: artifacts-openssl.cnf.j2
    dest: "{{ bootwright_artifacts_tls_dir }}/openssl.cnf"
    owner: root
    group: root
    mode: "0644"
  when: not (bootwright_artifacts_tls_material_present | bool)

- name: Generate boot artifact TLS certificate
  ansible.builtin.command:
    argv:
      - openssl
      - req
      - -x509
      - -nodes
      - -newkey
      - rsa:2048
      - -sha256
      - -days
      - "3650"
      - -keyout
      - "{{ bootwright_artifacts_tls_key_path }}"
      - -out
      - "{{ bootwright_artifacts_tls_cert_path }}"
      - -config
      - "{{ bootwright_artifacts_tls_dir }}/openssl.cnf"
      - -extensions
      - v3_req
  register: bootwright_artifacts_tls_generated
  when: not (bootwright_artifacts_tls_material_present | bool)

- name: Restrict boot artifact TLS key
  ansible.builtin.file:
    path: "{{ bootwright_artifacts_tls_key_path }}"
    owner: root
    group: root
    mode: "0600"

- name: Set boot artifact TLS certificate mode
  ansible.builtin.file:
    path: "{{ bootwright_artifacts_tls_cert_path }}"
    owner: root
    group: root
    mode: "0644"

- name: Install boot artifact HTTP unit
  ansible.builtin.template:
    src: artifacts-http.service.j2
    dest: "/etc/systemd/system/bootwright-artifacts-{{ bootwright_component.providerName }}-{{ bootwright_component.name }}.service"
    owner: root
    group: root
    mode: "0644"
  register: bootwright_artifacts_unit

- name: Reload systemd manager when unit changed
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: bootwright_artifacts_unit.changed

- name: Ensure boot artifact HTTP service is running
  ansible.builtin.systemd_service:
    name: "bootwright-artifacts-{{ bootwright_component.providerName }}-{{ bootwright_component.name }}.service"
    state: "{{ 'restarted' if (bootwright_artifacts_unit.changed or bootwright_artifacts_helper.changed or (bootwright_artifacts_tls_generated.changed | default(false))) else 'started' }}"
    enabled: true

- name: Open boot artifact port on host firewall (firewalld)
  ansible.posix.firewalld:
    port: "{{ bootwright_component.port | int }}/tcp"
    state: enabled
    permanent: true
    immediate: true
  when: bootwright_firewalld_available | default(false)

- name: Wait for boot artifact HTTPS endpoint
  ansible.builtin.uri:
    url: "https://127.0.0.1:{{ bootwright_component.port | int }}/"
    method: GET
    status_code: 404
    validate_certs: false
    return_content: false
  register: bootwright_artifacts_ready
  retries: 30
  delay: 1
  until: bootwright_artifacts_ready.status == 404
