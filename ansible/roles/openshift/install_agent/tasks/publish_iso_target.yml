---
- name: Resolve agent ISO publish target
  ansible.builtin.set_fact:
    bootwright_agent_iso_stage_path: "{{ bootwright_agent_iso_publish_target.stagePath | replace(bootwright_agent_iso_publish_token_placeholder, bootwright_agent_iso_publish_token) }}"
    bootwright_agent_iso_fetch_url: "{{ bootwright_agent_iso_publish_target.fetchUrl | replace(bootwright_agent_iso_publish_token_placeholder, bootwright_agent_iso_publish_token) }}"
  changed_when: false

- name: Validate agent ISO publish target
  ansible.builtin.assert:
    that:
      - (bootwright_agent_iso_path | default('') | length) > 0
      - (bootwright_agent_iso_publish_target.stageHost | default('') | length) > 0
      - (bootwright_agent_iso_stage_path | default('') | length) > 0
      - (bootwright_agent_iso_fetch_url | default('') | length) > 0
      - >-
        (bootwright_agent_iso_publish_target.stageHost == (bootwright_host_name | default(inventory_hostname)))
        or
        ((bootwright_agent_iso_local_path | default('') | length) > 0)
      - >-
        (not (bootwright_agent_iso_publish_target.requiresHTTPS | default(false) | bool))
        or
        ((bootwright_agent_iso_fetch_url | ansible.builtin.urlsplit('scheme') | lower) == 'https')
    fail_msg: >-
      Invalid agent ISO publish target for {{ bootwright_current_cluster.name }}:
      stagePath={{ bootwright_agent_iso_stage_path }},
      fetchUrl={{ bootwright_agent_iso_fetch_url }}.

- name: Resolve agent ISO staging directory
  ansible.builtin.set_fact:
    bootwright_agent_iso_stage_dir: "{{ bootwright_agent_iso_stage_path | dirname }}"
  changed_when: false

- name: Determine agent ISO publish locality
  ansible.builtin.set_fact:
    bootwright_agent_iso_stage_local_to_install_host: "{{ bootwright_agent_iso_publish_target.stageHost == (bootwright_host_name | default(inventory_hostname)) }}"
  changed_when: false

- name: Create agent ISO staging directory
  ansible.builtin.file:
    path: "{{ bootwright_agent_iso_stage_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  delegate_to: "{{ bootwright_agent_iso_publish_target.stageHost }}"
  become: true

- name: Link agent ISO at the BMC fetch location
  ansible.builtin.command:
    argv:
      - ln
      - "{{ bootwright_agent_iso_path }}"
      - "{{ bootwright_agent_iso_stage_path }}"
  register: bootwright_agent_iso_stage_link
  failed_when: false
  changed_when: bootwright_agent_iso_stage_link.rc == 0
  delegate_to: "{{ bootwright_agent_iso_publish_target.stageHost }}"
  become: true
  when: bootwright_agent_iso_stage_local_to_install_host | bool

- name: Copy agent ISO within the BMC fetch host
  ansible.builtin.command:
    argv:
      - install
      - -m
      - "0600"
      - -o
      - root
      - -g
      - root
      - "{{ bootwright_agent_iso_path }}"
      - "{{ bootwright_agent_iso_stage_path }}"
  changed_when: true
  delegate_to: "{{ bootwright_agent_iso_publish_target.stageHost }}"
  become: true
  when:
    - bootwright_agent_iso_stage_local_to_install_host | bool
    - bootwright_agent_iso_stage_link.rc | default(1) != 0

- name: Copy agent ISO to the BMC fetch host
  ansible.builtin.copy:
    src: "{{ bootwright_agent_iso_local_path }}"
    dest: "{{ bootwright_agent_iso_stage_path }}"
    owner: root
    group: root
    mode: "0600"
  delegate_to: "{{ bootwright_agent_iso_publish_target.stageHost }}"
  become: true
  when: not (bootwright_agent_iso_stage_local_to_install_host | bool)

- name: Restrict staged agent ISO permissions
  ansible.builtin.file:
    path: "{{ bootwright_agent_iso_stage_path }}"
    owner: root
    group: root
    mode: "0600"
  delegate_to: "{{ bootwright_agent_iso_publish_target.stageHost }}"
  become: true

- name: Probe staged agent ISO fetch URL
  ansible.builtin.uri:
    url: "{{ bootwright_agent_iso_fetch_url }}"
    method: HEAD
    status_code: [200, 206]
    validate_certs: false
    return_content: false
    timeout: "{{ bootwright_install_publish_probe_timeout }}"
  register: bootwright_agent_iso_fetch_probe
  delegate_to: "{{ bootwright_agent_iso_publish_target.stageHost }}"
  become: false
  failed_when: false
  changed_when: false

- name: Probe staged agent ISO byte-range fetch
  ansible.builtin.uri:
    url: "{{ bootwright_agent_iso_fetch_url }}"
    method: GET
    headers:
      Range: bytes=0-0
    status_code: [206]
    validate_certs: false
    return_content: false
    timeout: "{{ bootwright_install_publish_probe_timeout }}"
  register: bootwright_agent_iso_range_probe
  delegate_to: "{{ bootwright_agent_iso_publish_target.stageHost }}"
  become: false
  failed_when: false
  changed_when: false
  when: bootwright_agent_iso_publish_target.requiresByteRange | default(false) | bool

- name: Confirm staged agent ISO fetch URL is reachable
  ansible.builtin.assert:
    that:
      - (bootwright_agent_iso_fetch_probe.status | default(0) | int) in [200, 206]
      - >-
        (not (bootwright_agent_iso_publish_target.requiresByteRange | default(false) | bool))
        or
        ((bootwright_agent_iso_range_probe.status | default(0) | int) == 206)
    fail_msg: >-
      The staged agent ISO URL is not reachable from
      {{ bootwright_agent_iso_publish_target.stageHost }}:
      {{ bootwright_agent_iso_fetch_url }} returned HEAD status
      {{ bootwright_agent_iso_fetch_probe.status | default('unknown') }} and
      byte-range status
      {{ bootwright_agent_iso_range_probe.status | default('not attempted') }}.
