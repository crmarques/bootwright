---
- name: Build node-side DNS preflight probes
  ansible.builtin.set_fact:
    bootwright_node_dns_targets: >-
      {%- set probes = [] -%}
      {%- set seen = [] -%}
      {%- for net in bootwright_current_cluster.networks | default([]) -%}
      {%- for server in net.dnsServers | default([]) -%}
      {%- for target in bootwright_endpoint_dns_targets -%}
      {%- set key = server ~ '|' ~ target.hostname -%}
      {%- if key not in seen -%}
      {%- set _ = seen.append(key) -%}
      {%- set _ = probes.append({
            'dnsServer': server,
            'hostname': target.hostname,
            'address': target.address,
            'endpoint': target.endpoint,
            'kind': 'positive',
          }) -%}
      {%- endif -%}
      {%- endfor -%}
      {%- set wildcard_host = 'validateNoWildcardDNS.' ~ bootwright_current_cluster.name ~ '.' ~ bootwright_environment.baseDomain -%}
      {%- set wkey = server ~ '|' ~ wildcard_host -%}
      {%- if (bootwright_endpoint_dns_targets | length) > 0 and wkey not in seen -%}
      {%- set _ = seen.append(wkey) -%}
      {%- set _ = probes.append({
            'dnsServer': server,
            'hostname': wildcard_host,
            'address': '',
            'endpoint': 'wildcard-canary',
            'kind': 'negative',
          }) -%}
      {%- endif -%}
      {%- endfor -%}
      {%- endfor -%}
      {{ probes }}
  changed_when: false

- name: Probe cluster DNS servers for every cluster endpoint
  ansible.builtin.command:
    argv:
      - python3
      - "{{ role_path }}/files/dns_probe.py"
      - "{{ item.dnsServer }}"
      - "{{ item.hostname }}"
  loop: "{{ bootwright_node_dns_targets }}"
  loop_control:
    label: "{{ item.hostname }} @{{ item.dnsServer }} ({{ item.kind }})"
  register: bootwright_node_dns_probes
  changed_when: false
  failed_when: false
  check_mode: false
  when: bootwright_node_dns_targets | length > 0

- name: Collect node-side DNS failures
  ansible.builtin.set_fact:
    bootwright_node_dns_failures: >-
      {%- set failures = [] -%}
      {%- for r in bootwright_node_dns_probes.results | default([]) -%}
      {%- set answers = (r.stdout | default('')).split() | select('match', '^[0-9.]+$') | list -%}
      {%- if r.item.kind == 'positive' -%}
      {%- if r.rc != 0 or r.item.address not in answers -%}
      {%- set _ = failures.append({
            'dnsServer': r.item.dnsServer,
            'hostname': r.item.hostname,
            'expected': r.item.address,
            'got': (answers | join(', ')) or '<no answer>',
            'kind': 'missing-or-wrong',
          }) -%}
      {%- endif -%}
      {%- elif r.item.kind == 'negative' -%}
      {%- if r.rc == 0 and answers | length > 0 -%}
      {%- set _ = failures.append({
            'dnsServer': r.item.dnsServer,
            'hostname': r.item.hostname,
            'expected': '<no answer>',
            'got': answers | join(', '),
            'kind': 'wildcard-too-broad',
          }) -%}
      {%- endif -%}
      {%- endif -%}
      {%- endfor -%}
      {{ failures }}
  changed_when: false
  when: bootwright_node_dns_targets | length > 0

- name: Fail when node-side DNS is not ready for any cluster endpoint
  ansible.builtin.fail:
    msg: |-
      Node-side DNS preflight failed for cluster
      {{ bootwright_current_cluster.name }}. The cluster's machines will
      use the resolvers rendered from NetworkConfig; they MUST
      answer every endpoint hostname before nodes boot. Otherwise the
      node cannot resolve its own API VIP, bootkube never converges,
      and openshift-install loops on "Bootstrap Kube API never
      initialized" for the full timeout.

      Failures (server / hostname / expected -> got):
      {% for f in bootwright_node_dns_failures %}
        - dig @{{ f.dnsServer }} {{ f.hostname }} [{{ f.kind }}]: {{ f.expected }} -> {{ f.got }}
      {% endfor %}

      Expected records for this cluster:
      {% for t in bootwright_endpoint_dns_targets %}
        {{ t.hostname }} -> {{ t.address }}
      {% endfor %}
        validateNoWildcardDNS.{{ bootwright_current_cluster.name }}.{{ bootwright_environment.baseDomain }} -> (must NOT resolve)

      Fix DNS on every resolver listed above, then re-run
      `bootwright apply cluster`. If the resolver is a Bootwright-managed
      dnsmasq, re-run `bootwright apply infra` or `bootwright apply all`
      so Bootwright renders the endpoint records into the managed DNS
      service. For operator-owned DNS, pin `api`/`api-int` to specific
      names and anchor the apps subtree with
      `address=/apps.<cluster>.<base>/<ingress-vip>` so the wildcard
      does NOT catch `validateNoWildcardDNS`.
  when:
    - bootwright_node_dns_targets | length > 0
    - bootwright_node_dns_failures | length > 0
