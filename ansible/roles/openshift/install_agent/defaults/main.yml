---
bootwright_install_local_work_dir: "{{ bootwright_runtime_dir }}/installer/{{ bootwright_current_cluster.name }}"
bootwright_install_work_dir: "{{ bootwright_runtime_dir }}/installer/{{ bootwright_current_cluster.name }}"
bootwright_openshift_install: openshift-install
bootwright_install_timeout_seconds: 5400
bootwright_install_wait_poll_seconds: 15
bootwright_install_publish_probe_timeout: 60
bootwright_agent_iso_publish_token_placeholder: "__BOOTWRIGHT_AGENT_ISO_PUBLISH_TOKEN__"
