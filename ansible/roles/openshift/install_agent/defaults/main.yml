---
bootwright_secrets_dir: "{{ bootwright_host_state_dir }}/secrets"
bootwright_runtime_dir: "{{ bootwright_host_state_dir }}"
bootwright_install_local_work_dir: "{{ bootwright_runtime_dir }}/runtime/{{ bootwright_current_cluster.name }}/installer"
bootwright_install_work_dir: "{{ bootwright_host_state_dir }}/runtime/{{ bootwright_current_cluster.name }}/installer"
bootwright_openshift_install: openshift-install
bootwright_install_timeout_seconds: 5400
bootwright_install_publish_probe_timeout: 60
bootwright_agent_iso_publish_token_placeholder: "__BOOTWRIGHT_AGENT_ISO_PUBLISH_TOKEN__"
