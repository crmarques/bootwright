---
- name: Validate boot_redfish inputs
  ansible.builtin.assert:
    that:
      - (bootwright_component.boot.redfish.baseUrl | default('') | length) > 0
      - (bootwright_component.boot.agentIso.fetchUrl | default('') | length) > 0
    fail_msg: >-
      boot_redfish needs the renderer to project
      bootwright_component.boot.{redfish.baseUrl,agentIso.fetchUrl}. An empty
      agentIso.fetchUrl means the cluster has no reachable artifact server;
      declare an InfraComponent.spec.artifactServer endpoint and bind
      Environment.spec.infraComponents.artifactServers[].routes.redfishVirtualMedia.endpoint to
      the endpoint the BMC must use.
