---
- name: Resolve Redfish credential path on the controller
  ansible.builtin.set_fact:
    bootwright_redfish_cred_path: >-
      {{
        (bootwright_secrets_dir ~ '/' ~ bootwright_component.boot.redfish.credentialRef)
        if (bootwright_component.boot.redfish.credentialRef | default('') | length) > 0
        else ''
      }}
  changed_when: false

- name: Load Redfish credentials
  ansible.builtin.include_role:
    name: credentials
    tasks_from: load
  vars:
    bootwright_creds_path: "{{ bootwright_redfish_cred_path }}"
    bootwright_creds_var: bootwright_redfish_credentials
    bootwright_creds_label: "Redfish credentialRef {{ bootwright_redfish_cred_path }}"
  when: (bootwright_redfish_cred_path | length) > 0
