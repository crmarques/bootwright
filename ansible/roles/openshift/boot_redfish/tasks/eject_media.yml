---
- name: Eject virtual media
  ansible.builtin.uri:
    url: "{{ bootwright_redfish_vmedia_eject_url }}"
    method: POST
    body_format: json
    body: "{{ bootwright_redfish_vmedia_eject_body }}"
    status_code: [200, 202, 204, 400, 404, 409, 500]
    validate_certs: "{{ bootwright_component.boot.redfish.validateCerts }}"
    force_basic_auth: "{{ (bootwright_redfish_cred_path | length) > 0 }}"
    url_username: "{{ bootwright_redfish_credentials.username | default(omit) }}"
    url_password: "{{ bootwright_redfish_credentials.password | default(omit) }}"
    timeout: "{{ bootwright_redfish_request_timeout }}"
  register: bootwright_redfish_vmedia_eject
  failed_when: false
  changed_when: (bootwright_redfish_vmedia_eject.status | default(0) | int) in [200, 202, 204]
  no_log: "{{ (bootwright_redfish_cred_path | length) > 0 }}"

- name: Wait for virtual media to report ejected
  ansible.builtin.uri:
    url: "{{ bootwright_component.boot.redfish.baseUrl }}{{ bootwright_redfish_vmedia_member }}"
    method: GET
    return_content: true
    status_code: [200, 404]
    validate_certs: "{{ bootwright_component.boot.redfish.validateCerts }}"
    force_basic_auth: "{{ (bootwright_redfish_cred_path | length) > 0 }}"
    url_username: "{{ bootwright_redfish_credentials.username | default(omit) }}"
    url_password: "{{ bootwright_redfish_credentials.password | default(omit) }}"
    timeout: "{{ bootwright_redfish_request_timeout }}"
  register: bootwright_redfish_vmedia_eject_probe
  until:
    - (bootwright_redfish_vmedia_eject_probe.status | default(0) | int) in [200, 404]
    - not (bootwright_redfish_vmedia_eject_probe.json.Inserted | default(false) | bool)
  retries: "{{ bootwright_redfish_vmedia_eject_retries }}"
  delay: "{{ bootwright_redfish_vmedia_eject_delay_seconds }}"
  failed_when: false
  changed_when: false
  no_log: "{{ (bootwright_redfish_cred_path | length) > 0 }}"

- name: Confirm virtual media is ejected
  ansible.builtin.assert:
    that:
      - (bootwright_redfish_vmedia_eject_probe.status | default(0) | int) in [200, 404]
      - not (bootwright_redfish_vmedia_eject_probe.json.Inserted | default(false) | bool)
    fail_msg: >-
      Redfish BMC did not eject virtual media for
      {{ bootwright_redfish_vmedia_member }}.
      Eject HTTP status={{ bootwright_redfish_vmedia_eject.status | default('unknown') }};
      observed HTTP status={{ bootwright_redfish_vmedia_eject_probe.status | default('unknown') }},
      Inserted={{ bootwright_redfish_vmedia_eject_probe.json.Inserted | default('<not reported>', true) }},
      Image={{ bootwright_redfish_vmedia_eject_probe.json.Image | default('<not reported>', true) }},
      ImageName={{ bootwright_redfish_vmedia_eject_probe.json.ImageName | default('<not reported>', true) }},
      ConnectedVia={{ bootwright_redfish_vmedia_eject_probe.json.ConnectedVia | default('<not reported>', true) }},
      TransferProtocolType={{ bootwright_redfish_vmedia_eject_probe.json.TransferProtocolType | default('<not reported>', true) }}.
    success_msg: >-
      Redfish virtual media ejected for {{ bootwright_redfish_vmedia_member }}.
