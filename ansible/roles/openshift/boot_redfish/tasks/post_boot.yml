---
- name: Resolve node readiness probe address
  ansible.builtin.set_fact:
    bootwright_node_probe_address: "{{ bootwright_component.primaryIPAddress | default('') }}"
  changed_when: false

- name: Wait for node SSH to confirm live ISO boot complete
  ansible.builtin.wait_for:
    host: "{{ bootwright_node_probe_address }}"
    port: "{{ bootwright_node_ready_probe_port | int }}"
    timeout: "{{ bootwright_node_ready_timeout_seconds | int }}"
  when: (bootwright_node_probe_address | length) > 0

- name: Resolve node SSH auth probe key path
  ansible.builtin.set_fact:
    bootwright_node_ready_ssh_key_path: "{{ bootwright_current_cluster.adminSSHPrivateKeyPath | default('') }}"
  changed_when: false

- name: Resolve node SSH auth probe key execution user
  ansible.builtin.set_fact:
    bootwright_node_ready_ssh_key_become_user: >-
      {{
        ('#' ~ lookup('env', 'SUDO_UID'))
        if ((lookup('env', 'BOOTWRIGHT_INTERNAL_LOCAL_ROOT') | default('', true)) == '1'
            and ((lookup('env', 'SUDO_UID') | default('', true)) | length) > 0)
        else ''
      }}
  changed_when: false

- name: Check node SSH auth probe key
  ansible.builtin.stat:
    path: "{{ bootwright_node_ready_ssh_key_path }}"
  register: bootwright_node_ready_ssh_key_stat
  become: "{{ (bootwright_node_ready_ssh_key_become_user | length) > 0 }}"
  become_user: "{{ bootwright_node_ready_ssh_key_become_user | default('root', true) }}"
  when:
    - (bootwright_node_probe_address | length) > 0
    - (bootwright_node_ready_ssh_key_path | length) > 0

- name: Wait for node SSH to accept cluster admin key
  ansible.builtin.command:
    argv:
      - ssh
      - -i
      - "{{ bootwright_node_ready_ssh_key_path }}"
      - -o
      - BatchMode=yes
      - -o
      - StrictHostKeyChecking=no
      - -o
      - UserKnownHostsFile=/dev/null
      - -o
      - "ConnectTimeout={{ bootwright_node_ready_ssh_connect_timeout_seconds | int }}"
      - -o
      - ConnectionAttempts=1
      - "core@{{ bootwright_node_probe_address }}"
      - "true"
  register: bootwright_node_ready_ssh_auth
  become: "{{ (bootwright_node_ready_ssh_key_become_user | length) > 0 }}"
  become_user: "{{ bootwright_node_ready_ssh_key_become_user | default('root', true) }}"
  changed_when: false
  failed_when: false
  until: (bootwright_node_ready_ssh_auth.rc | default(1) | int) == 0
  retries: "{{ bootwright_node_ready_ssh_auth_retries | int }}"
  delay: "{{ bootwright_node_ready_ssh_auth_delay_seconds | int }}"
  when:
    - (bootwright_node_probe_address | length) > 0
    - bootwright_node_ready_ssh_key_stat.stat.exists | default(false)

- name: Confirm node SSH accepted cluster admin key
  ansible.builtin.assert:
    that:
      - (bootwright_node_ready_ssh_auth.rc | default(1) | int) == 0
    fail_msg: >-
      Node {{ bootwright_component.name }} at {{ bootwright_node_probe_address }}
      answered TCP/{{ bootwright_node_ready_probe_port | int }} but rejected the
      cluster admin SSH key {{ bootwright_node_ready_ssh_key_path }}.
      This usually means the IP is an old or wrong boot, the BMC booted disk
      instead of the generated agent ISO, or the declared MAC/IP mapping points
      at another host. Check Redfish virtual media, boot order, and
      InfraProvider baremetal.interfaces for {{ bootwright_component.name }}.
  when:
    - (bootwright_node_probe_address | length) > 0
    - bootwright_node_ready_ssh_key_stat.stat.exists | default(false)

- name: Refresh Redfish system metadata before disk boot override
  ansible.builtin.uri:
    url: "{{ bootwright_component.boot.redfish.baseUrl }}/redfish/v1/Systems/{{ bootwright_redfish_system_id }}"
    method: GET
    return_content: true
    status_code: [200, 404]
    validate_certs: "{{ bootwright_component.boot.redfish.validateCerts }}"
    force_basic_auth: "{{ (bootwright_redfish_cred_path | length) > 0 }}"
    url_username: "{{ bootwright_redfish_credentials.username | default(omit) }}"
    url_password: "{{ bootwright_redfish_credentials.password | default(omit) }}"
    timeout: "{{ bootwright_redfish_request_timeout }}"
  register: bootwright_redfish_system_boot_probe
  failed_when: false
  changed_when: false
  no_log: "{{ (bootwright_redfish_cred_path | length) > 0 }}"

- name: Resolve Redfish system PATCH precondition
  ansible.builtin.set_fact:
    bootwright_redfish_system_if_match: >-
      {{
        (bootwright_redfish_system_boot_probe.json | default({})).get('@odata.etag', '')
        | default((bootwright_redfish_system_boot_probe.headers | default({})).ETag | default('', true), true)
        | default((bootwright_redfish_system_boot_probe.headers | default({})).etag | default('', true), true)
        | default('*', true)
      }}
  changed_when: false

- name: Set subsequent boots to disk after live ISO boot
  ansible.builtin.uri:
    url: "{{ bootwright_component.boot.redfish.baseUrl }}/redfish/v1/Systems/{{ bootwright_redfish_system_id }}"
    method: PATCH
    headers:
      If-Match: "{{ bootwright_redfish_system_if_match }}"
    body_format: json
    body:
      Boot:
        BootSourceOverrideEnabled: Continuous
        BootSourceOverrideTarget: Hdd
    status_code: [200, 202, 204, 400, 405, 501]
    validate_certs: "{{ bootwright_component.boot.redfish.validateCerts }}"
    force_basic_auth: "{{ (bootwright_redfish_cred_path | length) > 0 }}"
    url_username: "{{ bootwright_redfish_credentials.username | default(omit) }}"
    url_password: "{{ bootwright_redfish_credentials.password | default(omit) }}"
    timeout: "{{ bootwright_redfish_request_timeout }}"
  register: bootwright_redfish_disk_boot_patch
  failed_when: false
  changed_when: (bootwright_redfish_disk_boot_patch.status | default(0) | int) in [200, 202, 204]
  no_log: "{{ (bootwright_redfish_cred_path | length) > 0 }}"

- name: Refresh virtual media metadata before restoring fetch certificate verification
  ansible.builtin.uri:
    url: "{{ bootwright_component.boot.redfish.baseUrl }}{{ bootwright_redfish_vmedia_member }}"
    method: GET
    return_content: true
    status_code: [200, 404]
    validate_certs: "{{ bootwright_component.boot.redfish.validateCerts }}"
    force_basic_auth: "{{ (bootwright_redfish_cred_path | length) > 0 }}"
    url_username: "{{ bootwright_redfish_credentials.username | default(omit) }}"
    url_password: "{{ bootwright_redfish_credentials.password | default(omit) }}"
    timeout: "{{ bootwright_redfish_request_timeout }}"
  register: bootwright_redfish_vmedia_restore_probe
  failed_when: false
  changed_when: false
  no_log: "{{ (bootwright_redfish_cred_path | length) > 0 }}"
  when:
    - bootwright_redfish_vmedia_transfer_protocol == 'HTTPS'
    - bootwright_redfish_vmedia_verify_certificate_supported | default(false) | bool
    - bootwright_redfish_vmedia_verify_certificate_original | default(false) | bool
    - bootwright_redfish_vmedia_verify_certificate_patch is defined
    - (bootwright_redfish_vmedia_verify_certificate_patch.status | default(0) | int) in [200, 202, 204]

- name: Resolve virtual media restore PATCH precondition
  ansible.builtin.set_fact:
    bootwright_redfish_vmedia_restore_if_match: >-
      {{
        (bootwright_redfish_vmedia_restore_probe.json | default({})).get('@odata.etag', '')
        | default((bootwright_redfish_vmedia_restore_probe.headers | default({})).ETag | default('', true), true)
        | default((bootwright_redfish_vmedia_restore_probe.headers | default({})).etag | default('', true), true)
        | default('*', true)
      }}
  changed_when: false
  when:
    - bootwright_redfish_vmedia_restore_probe is defined
    - (bootwright_redfish_vmedia_restore_probe.status | default(0) | int) == 200

- name: Restore virtual media fetch certificate verification
  ansible.builtin.uri:
    url: "{{ bootwright_component.boot.redfish.baseUrl }}{{ bootwright_redfish_vmedia_member }}"
    method: PATCH
    headers:
      If-Match: "{{ bootwright_redfish_vmedia_restore_if_match }}"
    body_format: json
    body:
      VerifyCertificate: true
    status_code: [200, 202, 204, 400, 405, 501]
    validate_certs: "{{ bootwright_component.boot.redfish.validateCerts }}"
    force_basic_auth: "{{ (bootwright_redfish_cred_path | length) > 0 }}"
    url_username: "{{ bootwright_redfish_credentials.username | default(omit) }}"
    url_password: "{{ bootwright_redfish_credentials.password | default(omit) }}"
    timeout: "{{ bootwright_redfish_request_timeout }}"
  register: bootwright_redfish_vmedia_verify_certificate_restore
  failed_when: false
  changed_when: (bootwright_redfish_vmedia_verify_certificate_restore.status | default(0) | int) in [200, 202, 204]
  no_log: "{{ (bootwright_redfish_cred_path | length) > 0 }}"
  when:
    - bootwright_redfish_vmedia_restore_if_match is defined

- name: Refresh Redfish manager SecurityService before restoring HTTPS transfer certificate verification
  ansible.builtin.uri:
    url: "{{ bootwright_component.boot.redfish.baseUrl }}{{ bootwright_redfish_security_service_member }}"
    method: GET
    return_content: true
    status_code: [200, 404]
    validate_certs: "{{ bootwright_component.boot.redfish.validateCerts }}"
    force_basic_auth: "{{ (bootwright_redfish_cred_path | length) > 0 }}"
    url_username: "{{ bootwright_redfish_credentials.username | default(omit) }}"
    url_password: "{{ bootwright_redfish_credentials.password | default(omit) }}"
    timeout: "{{ bootwright_redfish_request_timeout }}"
  register: bootwright_redfish_security_service_restore_probe
  failed_when: false
  changed_when: false
  no_log: "{{ (bootwright_redfish_cred_path | length) > 0 }}"
  when:
    - bootwright_redfish_vmedia_transfer_protocol == 'HTTPS'
    - (bootwright_redfish_security_service_member | default('') | length) > 0
    - bootwright_redfish_security_service_https_transfer_supported | default(false) | bool
    - bootwright_redfish_security_service_https_transfer_enabled | default(false) | bool
    - bootwright_redfish_security_service_https_transfer_patch is defined
    - (bootwright_redfish_security_service_https_transfer_patch.status | default(0) | int) in [200, 202, 204]

- name: Resolve Redfish manager SecurityService restore PATCH precondition
  ansible.builtin.set_fact:
    bootwright_redfish_security_service_restore_if_match: >-
      {{
        (bootwright_redfish_security_service_restore_probe.json | default({})).get('@odata.etag', '')
        | default((bootwright_redfish_security_service_restore_probe.headers | default({})).ETag | default('', true), true)
        | default((bootwright_redfish_security_service_restore_probe.headers | default({})).etag | default('', true), true)
        | default('*', true)
      }}
  changed_when: false
  when:
    - bootwright_redfish_security_service_restore_probe is defined
    - (bootwright_redfish_security_service_restore_probe.status | default(0) | int) == 200

- name: Restore Redfish HTTPS transfer certificate verification
  ansible.builtin.uri:
    url: "{{ bootwright_component.boot.redfish.baseUrl }}{{ bootwright_redfish_security_service_member }}"
    method: PATCH
    headers:
      If-Match: "{{ bootwright_redfish_security_service_restore_if_match }}"
    body_format: json
    body:
      HttpsTransferCertVerification: true
    status_code: [200, 202, 204, 400, 405, 501]
    validate_certs: "{{ bootwright_component.boot.redfish.validateCerts }}"
    force_basic_auth: "{{ (bootwright_redfish_cred_path | length) > 0 }}"
    url_username: "{{ bootwright_redfish_credentials.username | default(omit) }}"
    url_password: "{{ bootwright_redfish_credentials.password | default(omit) }}"
    timeout: "{{ bootwright_redfish_request_timeout }}"
  register: bootwright_redfish_security_service_https_transfer_restore
  failed_when: false
  changed_when: (bootwright_redfish_security_service_https_transfer_restore.status | default(0) | int) in [200, 202, 204]
  no_log: "{{ (bootwright_redfish_cred_path | length) > 0 }}"
  when:
    - bootwright_redfish_security_service_restore_if_match is defined

- name: Confirm subsequent disk boot override was accepted
  ansible.builtin.assert:
    that:
      - (bootwright_redfish_disk_boot_patch.status | default(0) | int) in [200, 202, 204]
    fail_msg: >-
      Redfish BMC rejected subsequent disk boot override for system
      {{ bootwright_redfish_system_id }} with HTTP status
      {{ bootwright_redfish_disk_boot_patch.status | default('unknown') }}.
      The node booted from the live ISO, but future reboots may keep using
      the virtual media boot path instead of disk.
    success_msg: >-
      Redfish subsequent disk boot override accepted for system
      {{ bootwright_redfish_system_id }}.
