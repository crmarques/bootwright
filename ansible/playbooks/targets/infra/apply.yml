---
- import_playbook: ../../checks/become.yml
  vars:
    bootwright_become_check_hosts: bootwright_provider_hosts:bootwright_infra_hosts

# Controller-side reachability validation runs first so an unreachable
# BMC / external proxy failures abort the apply before any on-host
# convergence touches state.
- import_playbook: ../../layers/cluster_infra/controller_validate.yml
- import_playbook: ../../layers/providers/apply.yml
- import_playbook: ../../layers/cluster_infra/apply.yml
