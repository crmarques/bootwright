[defaults]
collections_path = ./collections
retry_files_enabled = False
interpreter_python = auto_silent
deprecation_warnings = False
local_tmp = /var/tmp
remote_tmp = /var/tmp
# Bound the connection attempt so a dead or banner-stalled host (e.g. mid-reboot)
# fails its fork in a fixed time instead of hanging the play indefinitely.
timeout = 30

[privilege_escalation]
become_flags = -H -S -n --preserve-env=HTTP_PROXY,HTTPS_PROXY,NO_PROXY,http_proxy,https_proxy,no_proxy

[ssh_connection]
pipelining = False
# ConnectTimeout bounds the TCP/auth handshake; ServerAlive* detects a peer that
# completes the handshake then stalls (half-dead box, slow banner) and tears the
# connection down after ~45s instead of blocking the fork indefinitely.
ssh_common_args = -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3
