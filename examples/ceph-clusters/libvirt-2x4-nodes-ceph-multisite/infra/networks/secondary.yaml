apiVersion: bootwright.io/v1alpha1
kind: Network
metadata:
  name: secondary

spec:
  provided: false
  description: The secondary cluster network lab-libvirt defines on its host.

  ipv4:
    cidr: 192.0.2.0/24
    gateway: 192.0.2.1

  libvirt:
    providerRef: lab-libvirt
    bridge: virbr-secondary
