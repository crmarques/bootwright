apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: primary-04

spec:
  substrate:
    providerRef: lab-libvirt
    libvirt:
      profileRef: mirror

  hardware:
    rootDevice:
      deviceName: /dev/vda

  os:
    provided: false
    installProfileRef: rhel-9-8

    install:
      ntp:
        - serverRef: lab-ntp
          endpointRef: ip

  network:
    configRef: primary
    attachmentRef: primary
    installAddressRef: ip

    addresses:
      - name: fqdn
        address: primary-04.lab.example.test

      - name: ip
        address: 198.51.100.14/24
        interface: enp1s0
