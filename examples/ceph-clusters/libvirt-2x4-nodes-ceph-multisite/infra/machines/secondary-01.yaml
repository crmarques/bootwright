apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: secondary-01

spec:
  substrate:
    providerRef: lab-libvirt
    libvirt:
      profileRef: core

  hardware:
    rootDevice:
      deviceName: /dev/vda

  os:
    provided: false
    installProfileRef: rhel-9-8

    install:
      ntp:
        - serverRef: lab-ntp
          endpointRef: ip

  network:
    configRef: secondary
    attachmentRef: secondary
    installAddressRef: ip

    addresses:
      - name: fqdn
        address: secondary-01.lab.example.test

      - name: ip
        address: 192.0.2.11/24
        interface: enp1s0
