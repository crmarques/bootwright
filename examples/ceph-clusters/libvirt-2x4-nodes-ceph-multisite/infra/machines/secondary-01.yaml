apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: secondary-01

spec:
  hardware:
    providerRef: lab-libvirt
    profileRef: core

    nics:
      - name: enp1s0
        segmentRef: secondary

  os:
    install:
      profileRef: rhel-9-8

      ntp:
        - serverRef: lab-ntp
          endpointRef: ip

  network:
    configRef: secondary
    installAddressRef: ip

    addresses:
      - name: fqdn
        address: secondary-01.lab.example.test

      - name: ip
        address: 192.0.2.11
        interface: enp1s0
