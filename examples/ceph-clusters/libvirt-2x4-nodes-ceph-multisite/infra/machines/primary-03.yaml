apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: primary-03

spec:
  substrate:
    providerRef: lab-libvirt
    libvirt:
      profileRef: gateway

      nics:
        - nicRef: enp1s0
          segmentRef: primary

  hardware:
    nics:
      - name: enp1s0

    rootDevice:
      deviceName: /dev/vda

  os:
    provided: false
    installProfileRef: rhel-9-8

    install:
      ntp:
        - serverRef: lab-ntp
          endpointRef: ip

  network:
    configRef: primary
    installAddressRef: ip

    addresses:
      - name: fqdn
        address: primary-03.lab.example.test

      - name: ip
        address: 198.51.100.13/24
        interface: enp1s0
