apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: primary-02

spec:
  hardware:
    providerRef: lab-libvirt
    profileRef: core

    nics:
      - name: enp1s0
        segmentRef: primary

  os:
    install:
      profileRef: rhel-9-8

      ntp:
        - serverRef: lab-ntp
          endpointRef: ip

  network:
    configRef: primary
    installAddressRef: ip

    addresses:
      - name: fqdn
        address: primary-02.lab.example.test

      - name: ip
        address: 198.51.100.12
        interface: enp1s0
