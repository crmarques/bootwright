apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: metal-02

spec:
  hardware:
    providerRef: lab-metal

    bmc:
      address: https://bmc-02.metal.example.test/redfish/v1/Systems/1

    nics:
      - name: eno1
        macAddress: 52:54:00:9a:1b:02

    rootDisk:
      wwn: '0x6000000000000002'
      serialNumber: SYNTHETIC-ROOT-02
      sizeBytes: 53687091200
      onRemoval: logicalOverwrite

    # Each installation proves the OSD disk and then clears its metadata
    # regions, so a disk a destroyed or abandoned cluster left reads as empty.
    dataDisks:
      - wwn: '0x5000000000000002'
        serialNumber: SYNTHETIC-CEPH-02
        sizeBytes: 107374182400
        onInstall: metadataClear
        onRemoval: metadataClear

  os:
    install:
      profileRef: rhel-9-8

      # The key this machine's installation delivers, so completion is proved
      # against a key known before the machine is ever contacted.
      hostKeyRef: metal-02-host-key

      ntp:
        - serverRef: lab-ntp
          endpointRef: ip

  network:
    configRef: lab-metal
    installAddressRef: ip

    addresses:
      - name: fqdn
        address: metal-02.metal.example.test

      - name: ip
        address: 198.51.100.12
        interface: eno1
