apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: metal-01

spec:
  substrate:
    providerRef: lab-metal

    baremetal:
      rootDevice:
        wwn: '0x6000000000000001'

      bmc:
        address: https://bmc-01.metal.example.test/redfish/v1/Systems/1

      nics:
        - nicRef: eno1
          macAddress: 52:54:00:9a:1b:01

  os:
    provided: false
    installProfileRef: rhel-9-8

    install:
      # The key this machine's installation delivers, so completion is proved
      # against a key known before the machine is ever contacted.
      hostKeyRef: metal-01-host-key

      ntp:
        - serverRef: lab-ntp
          endpointRef: ip

  hardware:
    eraseOnRemoval:
      method: logicalOverwrite

      targets:
        - deviceName: /dev/disk/by-id/wwn-0x6000000000000001
          wwn: '0x6000000000000001'
          serialNumber: SYNTHETIC-ROOT-01
          sizeBytes: 53687091200

        - deviceName: /dev/disk/by-id/wwn-0x5000000000000001
          wwn: '0x5000000000000001'
          serialNumber: SYNTHETIC-CEPH-01
          sizeBytes: 107374182400
          method: metadataClear

    # Each installation proves the OSD disk and then clears its metadata
    # regions, so a disk a destroyed or abandoned cluster left reads as empty.
    clearOnInstall:
      targets:
        - deviceName: /dev/disk/by-id/wwn-0x5000000000000001
          wwn: '0x5000000000000001'
          serialNumber: SYNTHETIC-CEPH-01
          sizeBytes: 107374182400

    nics:
      - name: eno1

  network:
    configRef: lab-metal
    installAddressRef: ip

    addresses:
      - name: fqdn
        address: metal-01.metal.example.test

      - name: ip
        address: 198.51.100.11
        interface: eno1
