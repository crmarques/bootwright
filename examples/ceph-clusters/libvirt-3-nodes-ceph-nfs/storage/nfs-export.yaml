apiVersion: bootwright.io/v1alpha1
kind: CephNFSExport
metadata:
  name: docs

spec:
  clusterRef: ceph-lab
  serviceID: shares
  subvolumeRef: docs

  native:
    pseudo: /docs
    access_type: NONE
    squash: root_squash

    protocols:
      - 4

    fsal:
      name: CEPH

    clients:
      - access_type: NONE
        squash: root_squash

        addresses:
          - 198.51.100.13

      - access_type: RW
        squash: root_squash

        addresses:
          - 198.51.100.0/24
