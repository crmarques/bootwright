apiVersion: bootwright.io/v1alpha1
kind: CephPlacementPolicy
metadata:
  name: ssd-hosts

# No pool in this scenario selects ssd-hosts with placementPolicyRef, so this
# policy only creates the CRUSH rule on the cluster.
spec:
  clusterRef: ceph-lab
  ruleName: ssd-hosts
  crushDeviceClass: ssd

  replicated:
    size: 2
    minSize: 2
