apiVersion: bootwright.io/v1alpha1
kind: InfraProvider
metadata:
  name: lab-libvirt

spec:
  libvirt:
    machineRef: controller

    capacityReserve:
      cpu: 1
      memoryMiB: 4096
      diskGiB: 10

    bmcEmulation:
      bindAddress: 127.0.0.1
      port: 8000
      certificateRef: lab-bmc-tls

      auth:
        credentialsRef: lab-bmc-credentials

    machineProfiles:
      - name: rhel-01
        cpu: 4
        memoryMiB: 16384
        diskGiB: 60
        tpm: {}

        dataDisks:
          - name: ceph-data
            sizeGiB: 80
            media: ssd

      - name: rhel-02
        cpu: 4
        memoryMiB: 16384
        diskGiB: 60
        tpm: {}

        dataDisks:
          - name: ceph-data
            sizeGiB: 80
            media: ssd

      - name: rhel-03
        cpu: 4
        memoryMiB: 10240
        diskGiB: 60
        tpm: {}

        dataDisks:
          - name: ceph-data
            sizeGiB: 80
            media: ssd

      - name: rhel-04
        cpu: 4
        memoryMiB: 20480
        diskGiB: 80
        tpm: {}

        dataDisks:
          - name: ceph-data
            sizeGiB: 80
            media: ssd

  networkAttachments:
    - name: lab-guests
      libvirt:
        bridge: virbr-lab
        management: managed
        address: 198.51.100.1/24
        forward: nat
