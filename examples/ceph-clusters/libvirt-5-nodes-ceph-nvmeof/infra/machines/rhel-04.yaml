apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: rhel-04

spec:
  substrate:
    providerRef: lab-libvirt
    libvirt:
      profileRef: gateway

  hardware:
    rootDevice:
      deviceName: /dev/vda

  os:
    provided: false
    installProfileRef: rhel-9-8

    install:
      ntp:
        - serverRef: lab-ntp
          endpointRef: ip

  network:
    configRef: lab-guests
    attachmentRef: lab-guests
    installAddressRef: ip

    addresses:
      - name: fqdn
        address: rhel-04.lab.example.test

      - name: ip
        address: 198.51.100.14/24
        interface: enp1s0
