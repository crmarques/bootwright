apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: initiator

spec:
  substrate:
    providerRef: lab-libvirt
    libvirt:
      profileRef: initiator

  hardware:
    nics:
      - name: enp1s0

    rootDevice:
      deviceName: /dev/vda

  os:
    provided: false
    installProfileRef: rhel-9-8

    install:
      ntp:
        - serverRef: lab-ntp
          endpointRef: ip

  network:
    configRef: lab-guests
    installAddressRef: ip

    addresses:
      - name: fqdn
        address: initiator.lab.example.test

      - name: ip
        address: 198.51.100.20/24
        interface: enp1s0
