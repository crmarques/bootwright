apiVersion: bootwright.io/v1alpha1
kind: Network
metadata:
  name: lab-guests

spec:
  provided: false
  description: The isolated guest network lab-libvirt defines on its host, without forwarding or a gateway.

  ipv4:
    cidr: 198.51.100.0/24

  libvirt:
    providerRef: lab-libvirt
    bridge: virbr-lab
    forward: none
    hostAddress: 198.51.100.1
