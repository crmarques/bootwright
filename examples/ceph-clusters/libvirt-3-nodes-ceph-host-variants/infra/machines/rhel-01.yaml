apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: rhel-01

spec:
  substrate:
    providerRef: lab-libvirt
    libvirt:
      profileRef: rhel-01

  hardware:
    rootDevice:
      deviceName: /dev/vda

  os:
    provided: false
    installProfileRef: rhel-9-8

    install:
      ntp:
        - serverRef: lab-ntp
          endpointRef: ip

  network:
    configRef: lab-guests
    attachmentRef: lab-guests
    installAddressRef: ip

    addresses:
      - name: fqdn
        address: rhel-01.lab.example.test

      - name: ip
        address: 198.51.100.11/24
        interface: bond0

      - name: cluster
        address: 203.0.113.11/24
        interface: bond0.140
