# Example authored IBM Storage Ceph 9.9.2.0 at its build tag; apply resolves this tag through the Entitlement and freezes its digest.
apiVersion: bootwright.io/v1alpha1
kind: CephCluster
metadata:
  name: ceph-lab

spec:
  management: managed

  distribution:
    ibm:
      callHome: enabled

      packages:
        source: vendor

  release: 9.9.2.0
  packageVersion: 20.2.2-349.el9cp

  image:
    base: cp.icr.io/cp/ibm-ceph/ceph-9-rhel10
    version: v9.9.2-26947

  entitlementRef: ibm-ceph

  cephadm:
    addressRef: ip

    ansible:
      packageVersion: 5.0.3-1.el9cp

    clusterSSH:
      user: bootwright
      keyRef: ceph-cluster-key
      transport: verifiedTunnel

    bootstrap:
      nodeRef: rhel-01
      addressRef: ip

  networks:
    publicCIDRs:
      - 198.51.100.0/24

    clusterCIDRs:
      - 203.0.113.0/24

  config:
    osd:
      osd_memory_target_autotune: 'false'
      osd_memory_target: '4294967296'

  services:
    - service_type: mon
      placement:
        count: 5
        label: ceph-mon
    - service_type: mgr
      placement:
        hosts: [rhel-01.lab.example.test, rhel-02.lab.example.test]
    - service_type: osd
      service_id: ssd
      placement:
        label: ceph-storage
      spec:
        data_devices:
          paths: [/dev/sda]
        encrypted: true
    - service_type: osd
      service_id: hdd
      placement:
        label: ceph-storage
      spec:
        data_devices:
          paths: [/dev/sdb]
        db_devices:
          paths: [/dev/sdc]
        encrypted: true
        tpm2: true

  topology:
    # Each fqdn overrides the composed <node>.<cluster>.<storage domain> name
    # to match the Machine hostname.
    nodes:
      - name: rhel-01
        fqdn: rhel-01.lab.example.test
        machineRef: rhel-01
        labels: [ceph-storage, ceph-mon]
      - name: rhel-02
        fqdn: rhel-02.lab.example.test
        machineRef: rhel-02
        labels: [ceph-storage, ceph-mon]
      - name: rhel-03
        fqdn: rhel-03.lab.example.test
        machineRef: rhel-03
        labels: [ceph-storage, ceph-mon]
      - name: rhel-04
        fqdn: rhel-04.lab.example.test
        machineRef: rhel-04
        labels: [ceph-storage, ceph-mon]
      - name: rhel-05
        fqdn: rhel-05.lab.example.test
        machineRef: rhel-05
        labels: [ceph-storage, ceph-mon]
      - name: rhel-06
        fqdn: rhel-06.lab.example.test
        machineRef: rhel-06
        labels: [ceph-storage]
