apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: rhel-06

spec:
  hardware:
    providerRef: lab-libvirt
    profileRef: osd

    nics:
      - name: nic0
      - name: nic1

  os:
    install:
      profileRef: rhel-9-8

      ntp:
        - serverRef: lab-ntp
          endpointRef: ip

  network:
    configRef: lab-guests
    installAddressRef: ip

    addresses:
      - name: fqdn
        address: rhel-06.lab.example.test

      - name: ip
        address: 198.51.100.16
        interface: nic0

      - name: cluster-ip
        address: 203.0.113.16
        interface: nic1.140
