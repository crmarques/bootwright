apiVersion: bootwright.io/v1alpha1
kind: InfraProvider
metadata:
  name: lab-libvirt

spec:
  libvirt:
    machineRef: controller

    capacityReserve:
      cpu: 1
      memoryMiB: 4096
      diskGiB: 10

    bmcEmulation:
      bindAddress: 127.0.0.1
      port: 8000
      certificateRef: lab-bmc-tls

      auth:
        credentialsRef: lab-bmc-credentials

    machineProfiles:
      - name: h1
        cpu: 4
        memoryMiB: 16384
        diskGiB: 60
        tpm: {}

        dataDisks:
          - name: ceph-data
            sizeGiB: 60
            media: ssd

      - name: h2
        cpu: 4
        memoryMiB: 16384
        diskGiB: 60
        tpm: {}

        dataDisks:
          - name: ceph-data
            sizeGiB: 60
            media: ssd

      - name: h3
        cpu: 4
        memoryMiB: 11264
        diskGiB: 60
        tpm: {}

        dataDisks:
          - name: ceph-data
            sizeGiB: 60
            media: ssd

      - name: h4
        cpu: 4
        memoryMiB: 12288
        diskGiB: 60
        tpm: {}

        dataDisks:
          - name: ceph-data
            sizeGiB: 60
            media: ssd

      - name: h5
        cpu: 4
        memoryMiB: 12288
        diskGiB: 60
        tpm: {}

        dataDisks:
          - name: ceph-data
            sizeGiB: 60
            media: ssd

      - name: h6
        cpu: 4
        memoryMiB: 12288
        diskGiB: 60
        tpm: {}

        dataDisks:
          - name: ceph-data
            sizeGiB: 60
            media: ssd

      - name: client
        cpu: 2
        memoryMiB: 4096
        diskGiB: 40
        tpm: {}

  networkAttachments:
    - name: lab-guests

      libvirt:
        bridge: virbr-lab
        management: managed
        address: 198.51.100.1/24
        forward: nat
