apiVersion: bootwright.io/v1alpha1
kind: CephNFSExport
metadata:
  name: objects

spec:
  clusterRef: ceph-lab
  serviceID: shares

  native:
    pseudo: /objects
    access_type: NONE
    squash: root_squash

    protocols:
      - 4

    fsal:
      name: RGW

    clients:
      - access_type: NONE
        squash: root_squash

        addresses:
          - 198.51.100.13

      - access_type: RW
        squash: root_squash

        addresses:
          - 198.51.100.20

  objectUserRef: services-canary
