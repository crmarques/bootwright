apiVersion: bootwright.io/v1alpha1
kind: StorageCluster
metadata:
  name: ceph-external
spec:
  type: ceph

  ceph:
    distribution: redhat
    release: "9.0"
    image:
      base: registry.redhat.io/rhceph/rhceph-9-rhel9
    entitlementRef: rhcs
    cephadm:
      clusterSSH:
        keyRef: ceph-cluster-ssh
      bootstrap:
        node: node-01
    topology:
      nodes:
        - name: node-01
          machineRef: ceph-0
          roles:
            - mon
