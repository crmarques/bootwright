apiVersion: bootwright.io/v1alpha1
kind: StorageCluster
metadata:
  name: ceph-external
spec:
  type: ceph

  ceph:
    distribution: redhat
    release: "9.0"
    entitlementRef: rhcs
    cephadm:
      bootstrap:
        host: node01
    topology:
      hosts:
        - machineRef: ceph-0
          roles:
            - mon
