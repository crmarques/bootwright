apiVersion: bootwright.io/v1alpha1
kind: StorageCluster
metadata:
  name: ceph-oss
spec:
  type: ceph

  ceph:
    distribution: oss
    community:
      # Optional. Bootwright configures the upstream community Ceph repo with
      # cephadm; release defaults to the latest stable when omitted. Set
      # community.mirror to a download.ceph.com mirror for disconnected sites.
      release: squid
    cephadm:
      bootstrap:
        seedNode: ceph-0
        monIP:
          nodeRef:
            name: ceph-0
    topology:
      nodes:
        - name: ceph-0
          site: lab
          roles:
            - mon
          machineRef:
            name: ceph-0
