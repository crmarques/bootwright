apiVersion: bootwright.io/v1alpha1
kind: StorageCluster
metadata:
  name: ceph-oss
spec:
  type: ceph

  ceph:
    distribution: oss
    cephadm:
      bootstrap:
        seedNode: ceph-0
        monIP:
          nodeRef:
            name: ceph-0
    topology:
      nodes:
        - name: ceph-0
          site: lab
          roles:
            - mon
          machineRef:
            name: ceph-0
