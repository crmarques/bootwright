apiVersion: bootwright.io/v1alpha1
kind: InfraProvider
metadata:
  name: lab-libvirt-provider
spec:
  machineProfiles:
    - name: compact-control-plane
      cpu: 8
      memoryMiB: 22528
      diskGiB: 120
      libvirt:
        hostRef:
          name: services-host
        uri: qemu:///system
        bmcEmulationDefaults:
          enabled: true
          protocol: redfish
          auth:
            credentialRef:
              name: bmc-credentials

  loadBalancers:
    - name: default
      haProxy:
        hostRef:
          name: services-host

