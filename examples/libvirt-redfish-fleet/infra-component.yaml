apiVersion: bootwright.io/v1alpha1
kind: InfraComponent
metadata:
  name: load-balancer
spec:
  loadBalancer:
    type: haProxy
    hostRef:
      name: services-host
    bindAddresses:
      - name: control-plane
        ip: 192.168.133.10
      - name: apps
        ip: 192.168.133.11
---
apiVersion: bootwright.io/v1alpha1
kind: InfraComponent
metadata:
  name: artifact-server
spec:
  artifactServer:
    hostRef:
      name: services-host
    listeners:
      - name: https
        protocol: https
        port: 8443
    endpoints:
      - name: bmc
        listener: https
        addressName: lab-lan
      - name: cluster
        listener: https
        addressName: lab-lan
