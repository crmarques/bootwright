apiVersion: bootwright.io/v1alpha1
kind: ClusterInfra
metadata:
  name: sno-libvirt
spec:
  platform:
    # Installer platform render mode; substrate inventory stays in InfraProvider.
    type: baremetal
    baremetal:
      provisioningNetwork: disabled

  endpoints:
    api:
      address: 192.168.132.10
      source:
        type: external
    api-int:
      address: 192.168.132.10
      source:
        type: external
    apps:
      address: 192.168.132.11
      source:
        type: external

  networkBindings:
    - networkConfigRef:
        name: sno-bridge
      providerRef:
        name: lab-libvirt-provider
      attachmentRef:
        name: sno-bridge

  components:
    nodes:
      - name: master-0
        source:
          providerRef:
            name: lab-libvirt-provider
          profileRef:
            name: sno
        network:
          networkConfigRef:
            name: sno-bridge
          overrides:
            interfaces:
              - name: primary
                ipv4:
                  address:
                    - ip: 192.168.132.20
                      prefix-length: 24
        rootDeviceHints:
          deviceName: /dev/vda
