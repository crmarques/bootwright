apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: lab-host
spec:
  capabilities:
    - libvirt
    - container-runtime

  os:
    provided: true

  addresses:
    - name: ssh
      address: localhost
    - name: cluster-lan
      address: 192.168.132.1

  access:
    ssh:
      keyRef:
        name: provider-host-ssh
      addressRef:
        name: ssh
