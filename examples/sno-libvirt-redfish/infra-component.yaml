apiVersion: bootwright.io/v1alpha1
kind: InfraComponent
metadata:
  name: name-resolution
spec:
  type: nameResolution

  nameResolution:
    implementation: dnsmasq
    bindAddress: 192.168.132.1
    # The node's only resolver is this dnsmasq (the node selects it via
    # networkconfig.yaml's nameResolutionRefs), and dnsmasq runs `no-resolv`, so
    # it must forward non-lab names upstream for the node to reach the release
    # registry. The controller is wired to this resolver automatically during
    # apply (see README "Controller DNS Is Wired Automatically"). The cluster's
    # api/*.apps records are rendered from the ContainerCluster endpoints, so no
    # additionalIngressHosts entries are needed here.
    forwarders:
      - 1.1.1.1
      - 9.9.9.9
    machineRef: bastion
