apiVersion: bootwright.io/v1alpha1
kind: ContainerCluster
metadata:
  name: sno-libvirt
spec:
  distribution:
    release:
      version: 4.21.15

  install:
    nodeSSH:
      keyPairRef: sno-libvirt-cluster-admin-ssh-key
    endpoints:
      api:
        source:
          type: node
      ingress:
        source:
          type: node

  nodes:

  - name: master-0
    role: master
    machineRef: sno-libvirt-master-0
