apiVersion: bootwright.io/v1alpha1
kind: Environment
metadata:
  name: sno-libvirt-redfish
spec:
  baseDomain: bootwright.test

  secrets:
    - openshift-pull-secret
    - sno-libvirt-cluster-admin-ssh-key:
        generated:
          sshKeyPair:
            comment: bootwright-sno-libvirt-cluster-admin
    - bastion-host-ssh:
        file: ~/.ssh/bootwright-ssh-key
    - bmc-credentials

  infraComponents:
    nameResolution:
      - name: default
        management: managed
        componentRef: name-resolution
