apiVersion: bootwright.io/v1alpha1
kind: Environment
metadata:
  name: sno-libvirt-redfish
spec:
  baseDomain: bootwright.test

  secrets:
    openshift-pull-secret:
    cluster-admin-ssh-key:
      generated:
        sshKeyPair:
          comment: bootwright-cluster-admin
    provider-host-ssh:
      file: ~/.ssh/bootwright-ssh-key
    bmc-credentials:

  infraComponents:
    nameResolution:
      - name: default
        default: true
        type: managed
        componentRef:
          name: name-resolution
