apiVersion: bootwright.io/v1alpha1
kind: Environment
metadata:
  name: sno-libvirt
spec:
  baseDomain: example.test

  resources:
    - hosts.yaml
    - networks.yaml
    - provider.yaml
    - infra-component.yaml
    - cluster-infra.yaml
    - container-cluster.yaml

  secrets:
    openshift-pull-secret: null
    cluster-admin-ssh-key:
      generated:
        sshKeyPair:
          type: ed25519
          comment: bootwright-cluster-admin
    provider-host-ssh:
      file: ~/.ssh/bootwright-ssh-key
    bmc-credentials:
      generated:
        credentials:
          username: admin

  infraComponents:
    nameResolution:
      - name: default
        default: true
        type: managed
        componentRef:
          name: name-resolution
