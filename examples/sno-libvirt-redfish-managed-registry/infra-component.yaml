apiVersion: bootwright.io/v1alpha1
kind: InfraComponent
metadata:
  name: artifact-server
spec:
  artifactServer:
    hostRef:
      name: lab-host
    listeners:
      - name: https
        protocol: https
        port: 8443
    endpoints:
      - name: cluster
        listener: https
        addressName: cluster-lan
---
apiVersion: bootwright.io/v1alpha1
kind: InfraComponent
metadata:
  name: load-balancer
spec:
  loadBalancer:
    type: haProxy
    hostRef:
      name: lab-host
    bindAddresses:
      - name: control-plane
        ip: 192.168.132.10
      - name: apps
        ip: 192.168.132.11
---
apiVersion: bootwright.io/v1alpha1
kind: InfraComponent
metadata:
  name: name-resolution
spec:
  nameResolution:
    type: dnsmasq
    hostRef:
      name: lab-host
    bindAddress: 192.168.132.1
    port: null
    additionalIngressHosts:
      - console-openshift-console.apps.sno-libvirt.example.test
      - oauth-openshift.apps.sno-libvirt.example.test
---
apiVersion: bootwright.io/v1alpha1
kind: InfraComponent
metadata:
  name: registry
spec:
  registry:
    type: mirrorRegistry
    hostRef:
      name: lab-host
    bindAddress: 0.0.0.0
    port: 5000
