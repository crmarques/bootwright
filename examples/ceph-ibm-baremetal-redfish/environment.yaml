apiVersion: bootwright.io/v1alpha1
kind: Environment
metadata:
  name: ceph-ibm-baremetal-redfish
spec:
  domains:
    base: example.com

  machineAccess:
    keyRef: bootwright-machine-key

  safety:
    destroyProtection: requiredOverride

  infraComponents:
    artifactServers:
      - name: default
        management: managed
        componentRef: artifact-server

    proxies:
      - name: default
        management: external
        connection:
          httpProxy: http://proxy.example.com:3128
          httpsProxy: http://proxy.example.com:3128
          noProxy:
            - .example.com
            - 10.20.30.0/24
            - 10.20.40.0/24
          auth:
            proxyAuthRef: proxy-credentials

    nameResolution:
      - name: dns-1
        management: external
        address: 10.20.30.2
      - name: dns-2
        management: external
        address: 10.20.30.3

    ntp:
      - name: ntp-1
        management: external
        address: ntp1.example.com
      - name: ntp-2
        management: external
        address: ntp2.example.com

  proxyFor:
    bootwright: default
