# Bare-metal Ceph node (monitor-only tie-breaker). Bootwright installs RHEL 9.7
# via anaconda + Redfish virtual media; cephadm runs only a monitor here so the
# cluster keeps mon quorum (3 mons) if one full node is lost. No OSD devices.
# Role (../cluster.yaml): mon.
apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: ceph-3
spec:
  capabilities:
    - ceph-node

  substrate:
    providerRef: baremetal

  os:
    provided: false
    installProfileRef: rhel-9-ceph-node
    install:
      rootDeviceHints:
        deviceName: /dev/sda

  network:
    config:
      networkConfigRef: ceph-net
      attachmentRef: ceph-net
      interfaceAddresses:
        - interface: primary
          addressRef: ssh
          prefixLength: 24
    interfaceBinding:
      - nicRef: primary
        interfaceName: primary

  hardware:
    nics:
      - name: primary
        macAddress: 52:54:00:ca:fe:03
    boot:
      nicRef: primary
    management:
      bmc:
        address: redfish-virtualmedia+https://ceph-3-bmc.example.com/redfish/v1/Systems/1
        credentialsRef: bmc-credentials
        tls:
          verify: false

  addresses:
    - name: ssh
      address: 10.20.30.23

  access:
    ssh:
      user: root
      keyRef: ceph-node-ssh
      addressRef: ssh
