apiVersion: bootwright.io/v1alpha1
kind: StorageObjectGateway
metadata:
  name: rgw
spec:
  storageClusterRef: ceph-ibm

  public:
    dnsName: rgw.ceph-ibm.example.com
    scheme: http
    port: 80

  ceph:
    serviceID: ceph-ibm
    realm: ceph-ibm
    zoneGroup: ceph-ibm
    zone: ceph-ibm-1
    placement:
      hosts:
        - node-01
        - node-02
      countPerHost: 1
    frontendPort: 8080
    ingresses:
      - name: rgw
        address: 10.20.30.80
        prefixLength: 24
        virtualInterfaceNetworks:
          - 10.20.30.0/24
        placement:
          hosts:
            - node-01
            - node-02
