apiVersion: bootwright.io/v1alpha1
kind: StorageNFSExport
metadata:
  name: nfs
spec:
  storageClusterRef: ceph-ibm

  ceph:
    serviceID: ceph-ibm
    placement:
      hosts:
        - ceph-1
        - ceph-2
    ingresses:
      - name: nfs
        address: 10.20.30.82
        prefixLength: 24
        virtualInterfaceNetworks:
          - 10.20.30.0/24
        placement:
          hosts:
            - ceph-1
            - ceph-2

  exports:
    - pseudo: /shared
      filesystemRef: cephfs
      path: /
      accessType: RW
      squash: no_root_squash
      clients:
        - 10.20.30.0/24
