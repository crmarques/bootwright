apiVersion: bootwright.io/v1alpha1
kind: StorageCluster
metadata:
  name: ceph-ibm
spec:
  type: ceph

  management: managed

  ceph:
    distribution: ibm

    release: "9.9.1"

    entitlementRef: ibm-storage-ceph

    cephadm:
      addressRef: ssh
      bootstrap:
        host: ceph-1

    networks:
      publicCIDRs:
        - 10.20.30.0/24
      clusterCIDRs:
        - 10.20.30.0/24

    management:
      dnsName: dashboard.ceph-ibm.example.com
      ingress:
        name: mgmt
        address: 10.20.30.81
        prefixLength: 24
        virtualInterfaceNetworks:
          - 10.20.30.0/24
        placement:
          hosts:
            - ceph-1
            - ceph-2

    topology:
      hosts:
        - machineRef: ceph-1
          site: dc1
          roles:
            - mon
            - mgr
            - osd
            - mds
            - rgw
            - ingress
          devices:
            - /dev/sdb
            - /dev/sdc
            - /dev/sdd
        - machineRef: ceph-2
          site: dc1
          roles:
            - mon
            - mgr
            - osd
            - mds
            - rgw
            - ingress
          devices:
            - /dev/sdb
            - /dev/sdc
            - /dev/sdd
        - machineRef: ceph-3
          site: dc1
          roles:
            - mon
