apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: bastion
spec:
  capabilities:
    - container-runtime

  os:
    provided: true

  addresses:
    - name: ssh
      address: bastion.example.com
    - name: lan
      address: 10.20.30.10

  access:
    ssh:
      addressRef: ssh
      auth:
        privateKeyRef: bastion-host-ssh
