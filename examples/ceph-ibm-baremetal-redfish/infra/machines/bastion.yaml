apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: bastion
spec:
  # An existing host (provided OS) that runs the artifact server which serves the
  # RHEL install ISO to the BMCs over Redfish virtual media. It needs a container
  # runtime (podman) and HTTPS reachability from the BMCs.
  capabilities:
    - container-runtime

  os:
    provided: true

  addresses:
    # How Bootwright reaches the bastion over SSH (operator workstation -> bastion).
    - name: ssh
      address: bastion.example.com
    # The bastion's address on the machine network; the BMCs fetch install media
    # from here (the artifact-server `bmc` endpoint binds to it).
    - name: lan
      address: 10.20.30.10

  access:
    ssh:
      addressRef: ssh
      keyRef: bastion-host-ssh
