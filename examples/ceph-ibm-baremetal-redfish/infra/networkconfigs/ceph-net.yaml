apiVersion: bootwright.io/v1alpha1
kind: NetworkConfig
metadata:
  name: ceph-net
spec:
  machineNetwork:
    - cidr: 10.20.30.0/24

  nameResolutionRefs:
    - dns-1
    - dns-2

  template:
    networkConfig:
      interfaces:
        - name: primary
          type: ethernet
          state: up
          ipv4:
            enabled: true
            dhcp: false
          ipv6:
            enabled: false
      dns-resolver:
        config:
          search:
            - example.com
      routes:
        config:
          - destination: 0.0.0.0/0
            next-hop-address: 10.20.30.1
            next-hop-interface: primary
            table-id: 254
