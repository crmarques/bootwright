apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: compact-03

spec:
  capabilities:
    - openshift-node

  substrate:
    providerRef: lab-libvirt
    profileRef: compact

  os:
    provided: false

    install:
      rootDeviceHints:
        deviceName: /dev/vda

  network:
    configRef: lab-guests
    attachmentRef: lab-guests
    installAddressRef: ip

    addresses:
      - name: fqdn
        address: compact-03.lab.example.test

      - name: ip
        address: 198.51.100.23/24
        interface: enp1s0
