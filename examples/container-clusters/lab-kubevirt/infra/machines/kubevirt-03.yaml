apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: kubevirt-03

spec:
  capabilities:
    - openshift-node

  substrate:
    providerRef: lab-kubevirt
    profileRef: kubevirt

  os:
    provided: false

    install:
      rootDeviceHints:
        deviceName: /dev/vda

  network:
    configRef: lab-guests
    attachmentRef: lab-guests
    installAddressRef: ip

    interfaceBinding:
      - nicRef: eth0
        interfaceName: eth0

    addresses:
      - name: fqdn
        address: kubevirt-03.lab.example.test

      - name: ip
        address: 198.51.100.23/24
        interface: eth0

  hardware:
    nics:
      - name: eth0
        macAddress: 02:00:00:00:10:03
