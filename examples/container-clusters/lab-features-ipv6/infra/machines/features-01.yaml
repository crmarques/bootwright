apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: features-01

spec:
  capabilities:
    - openshift-node

  substrate:
    providerRef: lab-libvirt
    profileRef: master

  os:
    provided: false

    install:
      rootDeviceHints:
        deviceName: /dev/vda

  network:
    configRef: lab-guests
    attachmentRef: lab-guests
    installAddressRef: ip

    addresses:
      - name: fqdn
        address: features-01.lab.example.test

      - name: ip
        address: 2001:db8:2::21/64
        interface: enp1s0
