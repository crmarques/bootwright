apiVersion: bootwright.io/v1alpha1
kind: InfraProvider
metadata:
  name: lab-libvirt

spec:
  libvirt:
    capacityReserve:
      cpu: 4
      memoryMiB: 8192
      diskGiB: 40

    machineRef: controller
    uri: qemu:///system

    bmcEmulationDefaults:
      enabled: true
      protocol: redfish
      emulator: sushy-tools
      bindAddress: 127.0.0.1
      port: 8000
      certificateRef: lab-bmc-tls

      auth:
        credentialsRef: lab-bmc-credentials

    machineProfiles:
      - name: master
        cpu: 8
        memoryMiB: 16384
        diskGiB: 120
        tpm: {}

  networkAttachments:
    - name: lab-guests

      libvirt:
        bridge: virbr-lab
        management: managed
        address: 2001:db8:2::1/64
        forward: none
