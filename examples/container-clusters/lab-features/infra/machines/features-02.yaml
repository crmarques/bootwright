apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: features-02

spec:
  capabilities:
    - openshift-node

  substrate:
    providerRef: lab-libvirt
    profileRef: master

  os:
    provided: false

    install:
      rootDeviceHints:
        deviceName: /dev/vda

  network:
    configRef: lab-guests
    attachmentRef: lab-guests
    installAddressRef: ip

    addresses:
      - name: fqdn
        address: features-02.lab.example.test

      - name: ip
        address: 198.51.100.22/24
        interface: enp1s0
