apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: anysize-07

spec:
  capabilities:
    - openshift-node

  substrate:
    providerRef: lab-libvirt
    profileRef: compute

  os:
    provided: false

    install:
      rootDeviceHints:
        deviceName: /dev/vda

  network:
    configRef: lab-guests
    installAddressRef: ip

    addresses:
      - name: fqdn
        address: anysize-07.lab.example.test

      - name: ip
        address: 198.51.100.27/24
        interface: bond0

    interfaceAttachments:
      - interface: enp1s0
        attachmentRef: lab-guests

      - interface: enp2s0
        attachmentRef: lab-guests

      - interface: enp3s0
        attachmentRef: lab-secondary
