apiVersion: bootwright.io/v1alpha1
kind: ContainerCluster
metadata:
  name: anysize

spec:
  distribution:
    type: openshift

    release:
      version: 4.21.15

  install:
    method: agent
    mode: connected

    endpoints:
      api:
        address: 198.51.100.10

        source:
          type: openshift

      ingress:
        address: 198.51.100.11

        source:
          type: openshift

    agent:
      redfishVirtualMedia:
        artifactServerEndpoint:
          serverRef: lab-artifacts
          endpointRef: ip-https

    pullSecretRef: openshift-pull-secret

    nodeSSH:
      keyPairRef: anysize-cluster-admin-ssh-key

    ntp:
      - serverRef: lab-ntp
        endpointRef: ip

  nodes:
    - name: master-0
      role: master
      machineRef: anysize-01

    - name: master-1
      role: master
      machineRef: anysize-02

    - name: master-2
      role: master
      machineRef: anysize-03

    - name: worker-0
      role: worker
      machineRef: anysize-04

    - name: worker-1
      role: worker
      machineRef: anysize-05

    - name: worker-2
      role: worker
      machineRef: anysize-06

    - name: worker-3
      role: worker
      machineRef: anysize-07

    - name: worker-4
      role: worker
      machineRef: anysize-08

    - name: worker-5
      role: worker
      machineRef: anysize-09

    - name: infra-0
      role: infra
      machineRef: anysize-10
