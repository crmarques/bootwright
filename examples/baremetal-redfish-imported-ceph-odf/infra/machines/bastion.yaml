apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: bastion
spec:
  capabilities:
  - container-runtime

  os:
    mode: external
    addresses:
    - name: ssh
      address: bastion.bootwright.test
    - name: lab-lan
      address: 192.168.160.5
    ssh:
      addressName: ssh
      keyRef:
        name: provider-host-ssh
