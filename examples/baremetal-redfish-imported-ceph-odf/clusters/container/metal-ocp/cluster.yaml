apiVersion: bootwright.io/v1alpha1
kind: ContainerCluster
metadata:
  name: metal-ocp
spec:
  distribution:
    release:
      version: 4.21.15

  install:
    nodeSSH:
      keyPairRef: metal-ocp-cluster-admin-ssh-key
    endpoints:
      api:
        address: 192.168.160.20
        source:
          type: external
      ingress:
        address: 192.168.160.20
        source:
          type: external
    agent:
      redfishVirtualMedia:
        artifactServerEndpoint:
          endpointRef: bmc

  nodes:

  - name: master-0
    role: master
    machineRef: metal-master-0
