apiVersion: bootwright.io/v1alpha1
kind: ClusterInfra
metadata:
  name: metal-ocp
spec:
  platform:
    type: baremetal
    baremetal:
      provisioningNetwork: disabled

  endpoints:
    api:
      address: 192.168.160.10
      source:
        type: external
    api-int:
      address: 192.168.160.10
      source:
        type: external
    apps:
      address: 192.168.160.11
      source:
        type: external

  components:
    machines:
      - name: master-0
        from:
          provider: baremetal-provider
          name: metal-master-0
        networkConfig:
          ref:
            name: metal-net
          overrides:
            interfaces:
              - name: primary
                ipv4:
                  address:
                    - ip: 192.168.160.20
                      prefix-length: 24
