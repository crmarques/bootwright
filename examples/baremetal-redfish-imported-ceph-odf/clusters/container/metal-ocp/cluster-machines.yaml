apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: metal-master-0
spec:
  capabilities:
    - openshift-node

  substrate:
    providerRef: baremetal-provider

  os:
    install:
      rootDeviceHints:
        deviceName: /dev/sda
    provided: false

  network:
    config:
      networkConfigRef: metal-net
      attachmentRef: metal-net
      interfaceAddresses:
        - interface: primary
          addressRef: ip
          prefixLength: 24
    interfaceBinding:
      - nicRef: primary
        interfaceName: primary

  hardware:
    nics:
      - name: primary
        macAddress: 52:54:00:60:10:10
    management:
      bmc:
        address: redfish-virtualmedia+https://bmc-metal-master-0.bootwright.test/redfish/v1/Systems/1
        credentialsRef: bmc-credentials
        disableCertificateVerification: true
    boot:
      nicRef: primary

  addresses:
    - name: ip
      address: 192.168.160.20
