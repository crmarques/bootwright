apiVersion: bootwright.io/v1alpha1
kind: ClusterAddon
metadata:
  name: openshift-data-foundation
spec:
  type: olm

  provides:
    - dataFoundation

  accepts:
    inputs:
      - name: external-storage
        required: true
        schema:
          type: object
          required:
            - exportRef
          properties:
            exportRef:
              refKind: StorageExport
        effects:
          - type: storageExportAttachment
            provider: dataFoundation

  olm:
    namespace:
      name: openshift-storage
      create: true
      labels:
        openshift.io/cluster-monitoring: "true"
    operatorGroup:
      name: openshift-storage
      targetNamespaces:
        - openshift-storage
    subscription:
      name: odf-operator
      package: odf-operator
      channel: stable-4.21
      source: redhat-operators

  hooks:
    - name: attach-external-storage
      lifecycle: postOperatorReady
      manifests:
        - path: manifests/rook-ceph-external-cluster-details.yaml
          reclaimRendered: true
        - path: manifests/ocs-external-storagecluster.yaml

  readiness:
    timeout: 45m
    checks:
      - type: csvSucceeded
        namespace: openshift-storage
        subscription: odf-operator
      - type: condition
        apiVersion: ocs.openshift.io/v1
        kind: StorageCluster
        namespace: openshift-storage
        name: ocs-external-storagecluster
        condition:
          type: Available
          status: "True"
