apiVersion: bootwright.io/v1alpha1
kind: Environment
metadata:
  name: baremetal-redfish-imported-ceph-odf
spec:
  baseDomain: bootwright.test

  resources:
    - infra
    - clusters
    - add-ons

  secrets:
    openshift-pull-secret:
    cluster-admin-ssh-key:
      generated:
        sshKeyPair:
          comment: bootwright-cluster-admin
    provider-host-ssh:
      file: ~/.ssh/bootwright-ssh-key
    bmc-credentials:
    imported-ceph-odf-details:
      file: ./secrets/imported-ceph-odf-details.json

  infraComponents:
    artifactServers:
      - name: default
        type: managed
        default: true
        componentRef:
          name: artifact-server
        routes:
          redfishVirtualMedia:
            endpoint: bmc
          containerClusterInstall:
            endpoint: cluster
