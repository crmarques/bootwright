apiVersion: bootwright.io/v1alpha1
kind: Environment
metadata:
  name: baremetal-redfish-imported-ceph-odf
spec:
  baseDomain: bootwright.test

  defaults:
    artifactAccess:
      serverRef: default
      redfishVirtualMedia:
        endpointRef: bmc

  resources:
    - infra
    - clusters
    - add-ons

  secrets:
    - openshift-pull-secret
    - metal-ocp-cluster-admin-ssh-key:
        generated:
          sshKeyPair:
            comment: bootwright-metal-ocp-cluster-admin
    - bastion-host-ssh:
        file: ~/.ssh/bootwright-ssh-key
    - bmc-credentials
    - imported-ceph-odf-details:
        file: ./secrets/imported-ceph-odf-details.json

  infraComponents:
    artifactServers:
      - name: default
        management: managed
        componentRef: artifact-server
