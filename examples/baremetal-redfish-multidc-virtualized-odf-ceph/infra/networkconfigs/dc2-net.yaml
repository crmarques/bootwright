apiVersion: bootwright.io/v1alpha1
kind: NetworkConfig
metadata:
  name: dc2-net
spec:
  machineNetwork:
    - cidr: 192.168.142.0/24

  template:
    networkConfig:
      interfaces:
        - name: primary
          type: ethernet
          state: up
          mtu: 9000
          ipv4:
            enabled: true
            dhcp: false
          ipv6:
            enabled: false
      dns-resolver:
        config:
          server:
            - 192.168.142.1
      routes:
        config:
          - destination: 0.0.0.0/0
            next-hop-address: 192.168.142.1
            next-hop-interface: primary
            table-id: 254
          - destination: 192.168.141.0/24
            next-hop-address: 192.168.142.1
            next-hop-interface: primary
            table-id: 254
          - destination: 192.168.143.0/24
            next-hop-address: 192.168.142.1
            next-hop-interface: primary
            table-id: 254
          - destination: 192.168.171.0/24
            next-hop-address: 192.168.142.1
            next-hop-interface: primary
            table-id: 254
          - destination: 192.168.172.0/24
            next-hop-address: 192.168.142.1
            next-hop-interface: primary
            table-id: 254
