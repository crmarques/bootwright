apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: ceph-dc1-2
spec:
  capabilities:
    - ceph-node

  placement:
    site: dc1

  os:
    provided: true

  addresses:
    - name: ssh
      address: 192.168.141.32

  access:
    ssh:
      user: root
      auth:
        privateKeyRef: ceph-storage-cluster-admin-ssh-key
      addressRef: ssh
