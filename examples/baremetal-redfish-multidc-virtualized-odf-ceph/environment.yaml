apiVersion: bootwright.io/v1alpha1
kind: Environment
metadata:
  name: baremetal-redfish-multidc-virtualized-odf-ceph
spec:
  baseDomain: bootwright.test

  defaults:
    artifactAccess:
      serverRef: default
      redfishVirtualMedia:
        endpointRef: bmc

  resources:
    - infra
    - clusters
    - add-ons

  secrets:
    - openshift-pull-secret
    - dc1-metal-ocp-cluster-admin-ssh-key:
        generated:
          sshKeyPair:
            comment: bootwright-dc1-metal-ocp-cluster-admin
    - dc2-metal-ocp-cluster-admin-ssh-key:
        generated:
          sshKeyPair:
            comment: bootwright-dc2-metal-ocp-cluster-admin
    - dc1-child-ocp-cluster-admin-ssh-key:
        generated:
          sshKeyPair:
            comment: bootwright-dc1-child-ocp-cluster-admin
    - dc2-child-ocp-cluster-admin-ssh-key:
        generated:
          sshKeyPair:
            comment: bootwright-dc2-child-ocp-cluster-admin
    - bastion-host-ssh:
        file: ~/.ssh/bootwright-ssh-key
    - bmc-credentials
    - ceph-storage-cluster-admin-ssh-key:
        generated:
          sshKeyPair:
            comment: bootwright-ceph-storage-cluster-admin
    - ceph-registry-credentials
    - redhat-org
    - redhat-activation-key

  entitlements:
    - name: rhcs
      provider: redhat
      product: ceph
      rhsm:
        organizationRef: redhat-org
        activationKeyRef: redhat-activation-key
      registry:
        credentialsRef: ceph-registry-credentials

  infraComponents:
    artifactServers:
      - name: default
        type: managed
        componentRef: artifact-server
