apiVersion: bootwright.io/v1alpha1
kind: Environment
metadata:
  name: baremetal-redfish-multidc-virtualized-odf-ceph
spec:
  baseDomain: bootwright.test

  resources:
    - infra
    - clusters
    - add-ons

  defaults:
    install:
      pullSecretRef:
        name: openshift-pull-secret # default
      nodeSSH:
        keyPairRef:
          name: cluster-admin-ssh-key # default

  secrets:
    openshift-pull-secret: null
    cluster-admin-ssh-key:
      generated:
        sshKeyPair:
          type: ed25519 # default
          comment: bootwright-cluster-admin
    provider-host-ssh:
      file: ~/.ssh/bootwright-ssh-key
    bmc-credentials:
      generated:
        credentials:
          username: admin # default
    ceph-node-ssh:
      generated:
        sshKeyPair:
          type: ed25519 # default
          comment: bootwright-ceph-node
    cephadm-cluster-ssh:
      generated:
        sshKeyPair:
          type: ed25519 # default
          comment: bootwright-cephadm

  infraComponents:
    artifactServers:
      - name: default
        type: managed
        default: true
        componentRef:
          name: artifact-server
        routes:
          redfishVirtualMedia:
            endpoint: bmc
          containerClusterInstall:
            endpoint: cluster

