apiVersion: bootwright.io/v1alpha1
kind: Environment
metadata:
  name: baremetal-redfish-multidc-virtualized-odf-ceph
spec:
  baseDomain: bootwright.test

  resources:
    - infra
    - clusters
    - add-ons

  secrets:
    - openshift-pull-secret
    - cluster-admin-ssh-key:
        generated:
          sshKeyPair:
            comment: bootwright-cluster-admin
    - provider-host-ssh:
        file: ~/.ssh/bootwright-ssh-key
    - bmc-credentials
    - ceph-node-ssh:
        generated:
          sshKeyPair:
            comment: bootwright-ceph-node
    - cephadm-cluster-ssh:
        generated:
          sshKeyPair:
            comment: bootwright-cephadm

  infraComponents:
    artifactServers:
      - name: default
        type: managed
        componentRef:
          name: artifact-server
        routes:
          redfishVirtualMedia:
            endpoint: bmc
          containerClusterInstall:
            endpoint: cluster
