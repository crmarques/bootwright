apiVersion: bootwright.io/v1alpha1
kind: Environment
metadata:
  name: baremetal-redfish-multidc-virtualized-odf-ceph
spec:
  baseDomain: bootwright.test

  defaults:
    artifactServerRef: default

  resources:
    - secrets.yaml
    - infra
    - clusters
    - add-ons

  # Secrets and entitlements are first-class objects (secrets.yaml, infra/entitlements/).

  infraComponents:
    artifactServers:
      - name: default
        management: managed
        componentRef: artifact-server
