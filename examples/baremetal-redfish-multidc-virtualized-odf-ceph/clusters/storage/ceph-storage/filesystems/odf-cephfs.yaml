apiVersion: bootwright.io/v1alpha1
kind: StorageFilesystem
metadata:
  name: odf-cephfs
spec:
  storageClusterRef: ceph-storage

  cephfs:
    metadataPoolRef: odf-cephfs-metadata
    dataPoolRefs:
      - name: odf-cephfs-data
    mds:
      activeCount: 2
      placement:
        hosts:
          - ceph-dc1-0
          - ceph-dc1-1
          - ceph-dc1-2
          - ceph-dc2-0
          - ceph-dc2-1
          - ceph-dc2-2
