apiVersion: bootwright.io/v1alpha1
kind: StorageExport
metadata:
  name: odf-external-ceph
spec:
  type: data-foundation # default when dataFoundation exists

  storageClusterRef:
    name: ceph-storage

  dataFoundation:
    rbdPoolRef:
      name: odf-rbd
    cephFSRef:
      name: odf-cephfs
    objectGatewayRef:
      name: odf-rgw
