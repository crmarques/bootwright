apiVersion: bootwright.io/v1alpha1
kind: ClusterInfra
metadata:
  name: ceph-storage-infra
spec:
  endpoints:
    rgw-public:
      dnsName: rgw-ceph.bootwright.test
      scheme: https
      port: 443
    rgw-dc1:
      address: 192.168.141.80
      prefixLength: 24
      interfaceNetworks:
        - 192.168.141.0/24
    rgw-dc2:
      address: 192.168.142.80
      prefixLength: 24
      interfaceNetworks:
        - 192.168.142.0/24

  components:
    nodes:
      - name: ceph-dc1-0
        source:
          hostRef:
            name: ceph-dc1-0
      - name: ceph-dc1-1
        source:
          hostRef:
            name: ceph-dc1-1
      - name: ceph-dc1-2
        source:
          hostRef:
            name: ceph-dc1-2
      - name: ceph-dc2-0
        source:
          hostRef:
            name: ceph-dc2-0
      - name: ceph-dc2-1
        source:
          hostRef:
            name: ceph-dc2-1
      - name: ceph-dc2-2
        source:
          hostRef:
            name: ceph-dc2-2
      - name: ceph-arbiter
        source:
          hostRef:
            name: ceph-arbiter
