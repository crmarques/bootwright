apiVersion: bootwright.io/v1alpha1
kind: StorageObjectGateway
metadata:
  name: odf-rgw
spec:
  storageClusterRef: ceph-storage

  public:
    dnsName: rgw-ceph.bootwright.test
    scheme: https
    port: 443

  ceph:
    serviceID: odf
    placement:
      hosts:
        - ceph-dc1-0
        - ceph-dc1-1
        - ceph-dc1-2
        - ceph-dc2-0
        - ceph-dc2-1
        - ceph-dc2-2
      countPerHost: 1
    ingresses:
      - name: dc1
        address: 192.168.141.80
        prefixLength: 24
        interfaceNetworks:
          - 192.168.141.0/24
        placement:
          hosts:
            - ceph-dc1-0
            - ceph-dc1-1
            - ceph-dc1-2
      - name: dc2
        address: 192.168.142.80
        prefixLength: 24
        interfaceNetworks:
          - 192.168.142.0/24
        placement:
          hosts:
            - ceph-dc2-0
            - ceph-dc2-1
            - ceph-dc2-2
