apiVersion: bootwright.io/v1alpha1
kind: ContainerCluster
metadata:
  name: dc1-child-ocp
spec:
  distribution:
    release:
      version: 4.21.15

  install:
    endpointRefs:
      api:
        name: api
      apiInt:
        name: api-int
      ingress:
        name: apps
    nodeSSH:
      keyPairRef:
        name: dc1-child-ocp-cluster-admin-ssh-key

  networking:
    networkType: OVNKubernetes
    clusterNetwork:
      - cidr: 10.136.0.0/14
        hostPrefix: 23
    serviceNetwork:
      - 172.32.0.0/16

  nodes:
    - hostname: master-0
      role: master
      machineRef:
        clusterInfra: dc1-child-ocp-infra
        name: master-0
    - hostname: master-1
      role: master
      machineRef:
        clusterInfra: dc1-child-ocp-infra
        name: master-1
    - hostname: master-2
      role: master
      machineRef:
        clusterInfra: dc1-child-ocp-infra
        name: master-2
    - hostname: worker-0
      role: worker
      machineRef:
        clusterInfra: dc1-child-ocp-infra
        name: worker-0
    - hostname: worker-1
      role: worker
      machineRef:
        clusterInfra: dc1-child-ocp-infra
        name: worker-1
    - hostname: worker-2
      role: worker
      machineRef:
        clusterInfra: dc1-child-ocp-infra
        name: worker-2
