apiVersion: bootwright.io/v1alpha1
kind: ClusterInfra
metadata:
  name: dc1-child-ocp-infra
spec:
  platform:
    # Installer platform render mode; substrate inventory stays in InfraProvider.
    type: none

  endpoints:
    api:
      address: 192.168.151.20
      source:
        type: external
    api-int:
      address: 192.168.151.20
      source:
        type: external
    apps:
      address: 192.168.151.21
      source:
        type: external

  networkBindings:
    - networkConfigRef:
        name: dc1-child-net
      providerRef:
        name: kubevirt-provider
      attachmentRef:
        name: dc1-child-net

  components:
    nodes:
      - name: master-0
        source:
          providerRef:
            name: kubevirt-provider
          profileRef:
            name: dc1-child-master
        network:
          networkConfigRef:
            name: dc1-child-net
          overrides:
            interfaces:
              - name: primary
                ipv4:
                  address:
                    - ip: 192.168.151.30
                      prefix-length: 24
      - name: master-1
        source:
          providerRef:
            name: kubevirt-provider
          profileRef:
            name: dc1-child-master
        network:
          networkConfigRef:
            name: dc1-child-net
          overrides:
            interfaces:
              - name: primary
                ipv4:
                  address:
                    - ip: 192.168.151.31
                      prefix-length: 24
      - name: master-2
        source:
          providerRef:
            name: kubevirt-provider
          profileRef:
            name: dc1-child-master
        network:
          networkConfigRef:
            name: dc1-child-net
          overrides:
            interfaces:
              - name: primary
                ipv4:
                  address:
                    - ip: 192.168.151.32
                      prefix-length: 24
      - name: worker-0
        source:
          providerRef:
            name: kubevirt-provider
          profileRef:
            name: dc1-child-worker
        network:
          networkConfigRef:
            name: dc1-child-net
          overrides:
            interfaces:
              - name: primary
                ipv4:
                  address:
                    - ip: 192.168.151.40
                      prefix-length: 24
      - name: worker-1
        source:
          providerRef:
            name: kubevirt-provider
          profileRef:
            name: dc1-child-worker
        network:
          networkConfigRef:
            name: dc1-child-net
          overrides:
            interfaces:
              - name: primary
                ipv4:
                  address:
                    - ip: 192.168.151.41
                      prefix-length: 24
      - name: worker-2
        source:
          providerRef:
            name: kubevirt-provider
          profileRef:
            name: dc1-child-worker
        network:
          networkConfigRef:
            name: dc1-child-net
          overrides:
            interfaces:
              - name: primary
                ipv4:
                  address:
                    - ip: 192.168.151.42
                      prefix-length: 24
