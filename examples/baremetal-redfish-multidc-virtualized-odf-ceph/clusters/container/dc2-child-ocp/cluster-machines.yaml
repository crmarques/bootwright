apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: dc2-child-ocp-infra-master-0
spec:
  capabilities:
  - openshift-node

  substrate:
    providerRef:
      name: kubevirt-provider-dc2
    kubevirt:
      profileRef:
        name: dc2-child-master
      vmName: dc2-child-ocp-infra-master-0

  os:
    mode: raw
    install:
      network:
        networkConfigRef:
          name: dc2-child-net
        overrides:
          interfaces:
          - name: primary
            ipv4:
              address:
              - ip: 192.168.152.30
                prefix-length: 24
        attachmentRef:
          name: dc2-child-net
---
