apiVersion: bootwright.io/v1alpha1
kind: ContainerCluster
metadata:
  name: dc2-child-ocp
spec:
  distribution:
    release:
      version: 4.21.15

  install:
    nodeSSH:
      keyPairRef: dc2-child-ocp-cluster-admin-ssh-key
    endpoints:
      api:
        address: 192.168.152.20
        source:
          type: external
      ingress:
        address: 192.168.152.21
        source:
          type: external

  networking:
    networkType: OVNKubernetes
    clusterNetwork:
    - cidr: 10.140.0.0/14
      hostPrefix: 23
    serviceNetwork:
    - 172.33.0.0/16

  nodes:

  - name: master-0
    role: master
    machineRef: dc2-child-ocp-infra-master-0

  - name: master-1
    role: master
    machineRef: dc2-child-ocp-infra-master-1

  - name: master-2
    role: master
    machineRef: dc2-child-ocp-infra-master-2

  - name: worker-0
    role: worker
    machineRef: dc2-child-ocp-infra-worker-0

  - name: worker-1
    role: worker
    machineRef: dc2-child-ocp-infra-worker-1

  - name: worker-2
    role: worker
    machineRef: dc2-child-ocp-infra-worker-2
