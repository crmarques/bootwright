apiVersion: bootwright.io/v1alpha1
kind: ClusterInfra
metadata:
  name: dc1-metal-ocp-infra
spec:
  platform:
    # Installer platform render mode; substrate inventory stays in InfraProvider.
    type: baremetal
    baremetal:
      provisioningNetwork: disabled

  endpoints:
    api:
      address: 192.168.141.20
      source:
        type: external
    api-int:
      address: 192.168.141.20
      source:
        type: external
    apps:
      address: 192.168.141.21
      source:
        type: external

  artifactAccess:
    serverRef:
      name: default
    redfishVirtualMedia:
      endpointRef:
        name: bmc

  components:
    nodes:
      - name: master-0
        source:
          providerRef:
            name: baremetal-provider
          machineRef:
            name: dc1-metal-master-0
        network:
          networkConfigRef:
            name: dc1-net
          overrides:
            interfaces:
              - name: primary
                ipv4:
                  address:
                    - ip: 192.168.141.10
                      prefix-length: 24
      - name: master-1
        source:
          providerRef:
            name: baremetal-provider
          machineRef:
            name: dc1-metal-master-1
        network:
          networkConfigRef:
            name: dc1-net
          overrides:
            interfaces:
              - name: primary
                ipv4:
                  address:
                    - ip: 192.168.141.11
                      prefix-length: 24
      - name: master-2
        source:
          providerRef:
            name: baremetal-provider
          machineRef:
            name: dc1-metal-master-2
        network:
          networkConfigRef:
            name: dc1-net
          overrides:
            interfaces:
              - name: primary
                ipv4:
                  address:
                    - ip: 192.168.141.12
                      prefix-length: 24
