apiVersion: bootwright.io/v1alpha1
kind: ContainerCluster
metadata:
  name: dc1-metal-ocp
spec:
  distribution:
    release:
      version: 4.21.15

  install:
    nodeSSH:
      keyPairRef: dc1-metal-ocp-cluster-admin-ssh-key
    endpoints:
      api:
        address: 192.168.141.20
        source:
          type: external
      ingress:
        address: 192.168.141.21
        source:
          type: external
    agent:
      redfishVirtualMedia:
        artifactServerEndpoint:
          endpointRef: bmc

  networking:
    networkType: OVNKubernetes

  hosts:

  - hostname: master-0
    role: master
    machineRef: dc1-metal-master-0

  - hostname: master-1
    role: master
    machineRef: dc1-metal-master-1

  - hostname: master-2
    role: master
    machineRef: dc1-metal-master-2
