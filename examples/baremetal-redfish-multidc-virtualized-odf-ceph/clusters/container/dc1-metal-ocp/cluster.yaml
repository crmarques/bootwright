apiVersion: bootwright.io/v1alpha1
kind: ContainerCluster
metadata:
  name: dc1-metal-ocp
spec:
  distribution:
    release:
      version: 4.21.15

  install:
    endpointRefs:
      api:
        name: api
      apiInt:
        name: api-int
      ingress:
        name: apps

  networking:
    networkType: OVNKubernetes
    clusterNetwork:
      - cidr: 10.128.0.0/14
        hostPrefix: 23
    serviceNetwork:
      - 172.30.0.0/16

  nodes:
    - hostname: master-0
      role: master
      machineRef:
        clusterInfra: dc1-metal-ocp-infra
        name: master-0
    - hostname: master-1
      role: master
      machineRef:
        clusterInfra: dc1-metal-ocp-infra
        name: master-1
    - hostname: master-2
      role: master
      machineRef:
        clusterInfra: dc1-metal-ocp-infra
        name: master-2
