apiVersion: bootwright.io/v1alpha1
kind: ContainerCluster
metadata:
  name: dc2-metal-ocp
spec:
  distribution:
    release:
      version: 4.21.15

  install:
    nodeSSH:
      keyPairRef:
        name: dc2-metal-ocp-cluster-admin-ssh-key
    platform:
      type: bareMetal
      baremetal:
        provisioningNetwork: disabled
    endpoints:
      api:
        address: 192.168.142.20
        source:
          type: external
      api-int:
        address: 192.168.142.20
        source:
          type: external
      ingress:
        address: 192.168.142.21
        source:
          type: external

  networking:
    networkType: OVNKubernetes
    clusterNetwork:
    - cidr: 10.132.0.0/14
      hostPrefix: 23
    serviceNetwork:
    - 172.31.0.0/16

  nodes:

  - hostname: master-0
    role: master
    machineRef:
      name: dc2-metal-master-0

  - hostname: master-1
    role: master
    machineRef:
      name: dc2-metal-master-1

  - hostname: master-2
    role: master
    machineRef:
      name: dc2-metal-master-2
