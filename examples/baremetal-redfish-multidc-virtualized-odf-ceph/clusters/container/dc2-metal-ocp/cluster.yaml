apiVersion: bootwright.io/v1alpha1
kind: ContainerCluster
metadata:
  name: dc2-metal-ocp
spec:
  distribution:
    release:
      version: 4.21.15

  install:
    nodeSSH:
      keyPairRef: dc2-metal-ocp-cluster-admin-ssh-key
    endpoints:
      api:
        address: 192.168.142.20
        source:
          type: external
      ingress:
        address: 192.168.142.21
        source:
          type: external
    agent:
      redfishVirtualMedia:
        artifactServerEndpoint:
          endpointRef: bmc

  networking:
    networkType: OVNKubernetes
    clusterNetwork:
    - cidr: 10.132.0.0/14
      hostPrefix: 23
    serviceNetwork:
    - 172.31.0.0/16

  nodes:

  - name: master-0
    role: master
    machineRef: dc2-metal-master-0

  - name: master-1
    role: master
    machineRef: dc2-metal-master-1

  - name: master-2
    role: master
    machineRef: dc2-metal-master-2
