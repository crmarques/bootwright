apiVersion: k8s.ovn.org/v1
kind: ClusterUserDefinedNetwork
metadata:
  name: dc1-ceph-public
spec:
  namespaceSelector:
    matchLabels:
      bootwright.io/ceph-public-cudn: dc1-ceph-public
  network:
    topology: Localnet
    localnet:
      role: Secondary
      ipam:
        mode: Disabled
      physicalNetworkName: dc1-ceph-public
      mtu: 9000
