apiVersion: nmstate.io/v1
kind: NodeNetworkConfigurationPolicy
metadata:
  name: dc1-child-localnet
spec:
  nodeSelector:
    node-role.kubernetes.io/worker: ""
  desiredState:
    interfaces:
      - name: primary.151
        type: vlan
        state: up
        vlan:
          base-iface: primary
          id: 151
      - name: br-dc1-child
        type: ovs-bridge
        state: up
        bridge:
          options:
            stp: false
          port:
            - name: primary.151
    ovn:
      bridge-mappings:
        - localnet: dc1-child
          bridge: br-dc1-child
          state: present
