apiVersion: k8s.ovn.org/v1
kind: ClusterUserDefinedNetwork
metadata:
  name: dc2-child-net
spec:
  namespaceSelector:
    matchLabels:
      bootwright.io/cudn: dc2-child-net
  network:
    topology: Localnet
    localnet:
      role: Secondary
      ipam:
        mode: Disabled
      physicalNetworkName: dc2-child
      mtu: 1500
