apiVersion: bootwright.io/v1alpha1
kind: ClusterAddon
metadata:
  name: child-network-dc1
spec:
  type: manifestSet

  manifestSet:
    manifests:
      - path: manifests/dc1-child-namespace.yaml
      - path: manifests/dc1-child-nncp.yaml
      - path: manifests/dc1-child-cudn.yaml

  readiness:
    timeout: 5m
    checks:
      - type: resourceExists
        apiVersion: k8s.ovn.org/v1
        kind: ClusterUserDefinedNetwork
        name: dc1-child-net
      # The OVN-derived NetworkAttachmentDefinition is what the child VMs consume.
      - type: resourceExists
        apiVersion: k8s.cni.cncf.io/v1
        kind: NetworkAttachmentDefinition
        name: dc1-child-net
        namespace: bootwright-dc1-child-ocp
