apiVersion: bootwright.io/v1alpha1
kind: ContainerCluster
metadata:
  name: demo-ocp-a
spec:
  distribution:
    type: openshift
    release:
      version: 4.21.15

  install:
    method: agent
    mode: connected
    pullSecretRef:
      name: openshift-pull-secret
    clusterAdminSSH:
      keyPairRef:
        name: cluster-admin-ssh-key

  controlPlane:
    name: master
    replicas: 3

  compute:
    - name: worker
      replicas: 0

  networking:
    clusterNetwork:
      - cidr: 10.128.0.0/14
        hostPrefix: 23
    serviceNetwork:
      - 172.30.0.0/16

  nodes:
    - hostname: master-0
      role: master
      machineRef:
        clusterInfra: demo-ocp-a-infra
        name: master-0
    - hostname: master-1
      role: master
      machineRef:
        clusterInfra: demo-ocp-a-infra
        name: master-1
    - hostname: master-2
      role: master
      machineRef:
        clusterInfra: demo-ocp-a-infra
        name: master-2
