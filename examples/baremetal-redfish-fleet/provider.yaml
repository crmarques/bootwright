apiVersion: bootwright.io/v1alpha1
kind: InfraProvider
metadata:
  name: rack1-baremetal-provider
spec:
  machines:
    - name: rack1-srv1
      baremetal:
        bootMACAddress: 52:54:00:33:11:10
        interfaces:
          - name: primary
            macAddress: 52:54:00:33:11:10
        rootDeviceHints:
          deviceName: /dev/sda
        bmc:
          address: redfish-virtualmedia+https://bmc-rack1-srv1.example.test/redfish/v1/Systems/1
          protocol: redfish
          credentialsRef:
            name: bmc-credentials
          disableCertificateVerification: true
    - name: rack1-srv2
      baremetal:
        bootMACAddress: 52:54:00:33:11:11
        interfaces:
          - name: primary
            macAddress: 52:54:00:33:11:11
        rootDeviceHints:
          deviceName: /dev/sda
        bmc:
          address: redfish-virtualmedia+https://bmc-rack1-srv2.example.test/redfish/v1/Systems/1
          protocol: redfish
          credentialsRef:
            name: bmc-credentials
          disableCertificateVerification: true
    - name: rack1-srv3
      baremetal:
        bootMACAddress: 52:54:00:33:11:12
        interfaces:
          - name: primary
            macAddress: 52:54:00:33:11:12
        rootDeviceHints:
          deviceName: /dev/sda
        bmc:
          address: redfish-virtualmedia+https://bmc-rack1-srv3.example.test/redfish/v1/Systems/1
          protocol: redfish
          credentialsRef:
            name: bmc-credentials
          disableCertificateVerification: true

  artifactPublishers:
    - name: default
      http:
        hostRef:
          name: services-host
        routes:
          redfishVirtualMedia:
            addressName: lab-lan
          clusterInstall:
            addressName: lab-lan
