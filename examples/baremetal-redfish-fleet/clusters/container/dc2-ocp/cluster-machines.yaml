apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: dc2-master-0
spec:
  capabilities:
    - openshift-node

  substrate:
    providerRef:
      name: baremetal-provider

  os:
    install:
      rootDeviceHints:
        deviceName: /dev/sda
    provided: false

  network:
    config:
      networkConfigRef:
        name: dc2-net
      interfaceAddresses:
        - interface: primary
          addressRef:
            name: ip
          prefixLength: 24
    interfaceBinding:
      - nicRef:
          name: primary
        interfaceName: primary

  hardware:
    nics:
      - name: primary
        macAddress: 52:54:00:42:10:10
    management:
      bmc:
        address: redfish-virtualmedia+https://bmc-dc2-master-0.bootwright.test/redfish/v1/Systems/1
        credentialsRef:
          name: bmc-credentials
        disableCertificateVerification: true
    boot:
      nicRef:
        name: primary

  addresses:
    - name: ip
      address: 192.168.142.20
---
