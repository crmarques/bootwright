apiVersion: bootwright.io/v1alpha1
kind: ContainerCluster
metadata:
  name: dc2-ocp
spec:
  distribution:
    release:
      version: 4.21.15

  install:
    nodeSSH:
      keyPairRef: dc2-ocp-cluster-admin-ssh-key
    endpoints:
      api:
        address: 192.168.142.10
      ingress:
        address: 192.168.142.11
    agent:
      redfishVirtualMedia:
        artifactServerEndpoint:
          endpointRef: bmc

  networking:
    clusterNetwork:
    - cidr: 10.132.0.0/14
      hostPrefix: 23
    serviceNetwork:
    - 172.31.0.0/16

  hosts:

  - hostname: master-0
    role: master
    machineRef: dc2-master-0

  - hostname: master-1
    role: master
    machineRef: dc2-master-1

  - hostname: master-2
    role: master
    machineRef: dc2-master-2
