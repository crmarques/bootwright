apiVersion: bootwright.io/v1alpha1
kind: ContainerCluster
metadata:
  name: dc2-ocp
spec:
  distribution:
    release:
      version: 4.21.15

  install:
    endpointRefs:
      api:
        name: api
      apiInt:
        name: api-int
      ingress:
        name: apps
    nodeSSH:
      keyPairRef:
        name: dc2-ocp-cluster-admin-ssh-key

  networking:
    clusterNetwork:
      - cidr: 10.132.0.0/14
        hostPrefix: 23
    serviceNetwork:
      - 172.31.0.0/16

  nodes:
    - hostname: master-0
      role: master
      machineRef:
        clusterInfra: dc2-ocp
        name: master-0
    - hostname: master-1
      role: master
      machineRef:
        clusterInfra: dc2-ocp
        name: master-1
    - hostname: master-2
      role: master
      machineRef:
        clusterInfra: dc2-ocp
        name: master-2
