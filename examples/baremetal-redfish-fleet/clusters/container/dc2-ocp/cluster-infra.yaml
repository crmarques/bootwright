apiVersion: bootwright.io/v1alpha1
kind: ClusterInfra
metadata:
  name: dc2-ocp
spec:
  platform:
    type: baremetal
    baremetal:
      provisioningNetwork: disabled

  endpoints:
    api:
      vip: 192.168.142.10
    apiInt:
      vip: 192.168.142.10
    ingress:
      vip: 192.168.142.11

  components:
    machines:
      - name: master-0
        from:
          provider: baremetal-provider
          name: dc2-master-0
        networkConfig:
          ref:
            name: dc2-net
          addresses:
            - interface: primary
              ipv4:
                - ip: 192.168.142.20
                  prefix-length: 24
      - name: master-1
        from:
          provider: baremetal-provider
          name: dc2-master-1
        networkConfig:
          ref:
            name: dc2-net
          addresses:
            - interface: primary
              ipv4:
                - ip: 192.168.142.21
                  prefix-length: 24
      - name: master-2
        from:
          provider: baremetal-provider
          name: dc2-master-2
        networkConfig:
          ref:
            name: dc2-net
          addresses:
            - interface: primary
              ipv4:
                - ip: 192.168.142.22
                  prefix-length: 24

