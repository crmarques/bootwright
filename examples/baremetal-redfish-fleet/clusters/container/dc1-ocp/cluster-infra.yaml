apiVersion: bootwright.io/v1alpha1
kind: ClusterInfra
metadata:
  name: dc1-ocp
spec:
  platform:
    type: baremetal
    baremetal:
      provisioningNetwork: disabled

  endpoints:
    api:
      address: 192.168.141.10
    api-int:
      address: 192.168.141.10
    apps:
      address: 192.168.141.11

  artifactAccess:
    serverRef:
      name: default
    redfishVirtualMedia:
      endpointRef:
        name: bmc

  components:
    machines:
      - name: master-0
        from:
          provider: baremetal-provider
          name: dc1-master-0
        networkConfig:
          ref:
            name: dc1-net
          overrides:
            interfaces:
              - name: primary
                ipv4:
                  address:
                    - ip: 192.168.141.20
                      prefix-length: 24
      - name: master-1
        from:
          provider: baremetal-provider
          name: dc1-master-1
        networkConfig:
          ref:
            name: dc1-net
          overrides:
            interfaces:
              - name: primary
                ipv4:
                  address:
                    - ip: 192.168.141.21
                      prefix-length: 24
      - name: master-2
        from:
          provider: baremetal-provider
          name: dc1-master-2
        networkConfig:
          ref:
            name: dc1-net
          overrides:
            interfaces:
              - name: primary
                ipv4:
                  address:
                    - ip: 192.168.141.22
                      prefix-length: 24
