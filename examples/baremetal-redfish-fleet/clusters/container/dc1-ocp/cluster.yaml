apiVersion: bootwright.io/v1alpha1
kind: ContainerCluster
metadata:
  name: dc1-ocp
spec:
  distribution:
    release:
      version: 4.21.15

  install:
    nodeSSH:
      keyPairRef: dc1-ocp-cluster-admin-ssh-key
    endpoints:
      api:
        address: 192.168.141.10
      ingress:
        address: 192.168.141.11

  hosts:

  - hostname: master-0
    role: master
    machineRef: dc1-master-0

  - hostname: master-1
    role: master
    machineRef: dc1-master-1

  - hostname: master-2
    role: master
    machineRef: dc1-master-2
