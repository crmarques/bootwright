apiVersion: bootwright.io/v1alpha1
kind: ContainerCluster
metadata:
  name: dc1-ocp
spec:
  distribution:
    release:
      version: 4.21.15

  install:
    nodeSSH:
      keyPairRef:
        name: dc1-ocp-cluster-admin-ssh-key
    platform:
      type: bareMetal
      baremetal:
        provisioningNetwork: disabled
    endpoints:
      api:
        address: 192.168.141.10
      api-int:
        address: 192.168.141.10
      ingress:
        address: 192.168.141.11
    artifactAccess:
      serverRef:
        name: default
      redfishVirtualMedia:
        endpointRef:
          name: bmc

  networking:
    clusterNetwork:
    - cidr: 10.128.0.0/14
      hostPrefix: 23
    serviceNetwork:
    - 172.30.0.0/16

  nodes:

  - hostname: master-0
    role: master
    machineRef:
      name: dc1-master-0

  - hostname: master-1
    role: master
    machineRef:
      name: dc1-master-1

  - hostname: master-2
    role: master
    machineRef:
      name: dc1-master-2
