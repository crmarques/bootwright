apiVersion: bootwright.io/v1alpha1
kind: Environment
metadata:
  name: baremetal-redfish-virtualized-child
spec:
  baseDomain: example.test

  resources:
    - hosts.yaml
    - infra-component.yaml
    - parent/provider.yaml
    - parent/networks.yaml
    - parent/cluster-infra.yaml
    - parent/container-cluster.yaml
    - extensions/cluster-extension-virtualization.yaml
    - extensions/cluster-extension-child-network.yaml
    - extensions/cluster-extension-set.yaml
    - extensions/cluster-extension-binding.yaml
    - child/provider.yaml
    - child/networks.yaml
    - child/cluster-infra.yaml
    - child/container-cluster.yaml

  secrets:
    openshift-pull-secret: null
    cluster-admin-ssh-key:
      generated:
        sshKeyPair:
          type: ed25519
          comment: bootwright-cluster-admin
    provider-host-ssh:
      file: ~/.ssh/bootwright-ssh-key
    bmc-credentials:
      generated:
        credentials:
          username: admin

  infraComponents:
    artifactServers:
      - name: default
        type: managed
        default: true
        componentRef:
          name: artifact-server
        routes:
          redfishVirtualMedia:
            endpoint: bmc
          clusterInstall:
            endpoint: cluster
