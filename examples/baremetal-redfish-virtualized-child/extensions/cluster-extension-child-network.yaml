apiVersion: bootwright.io/v1alpha1
kind: ClusterExtension
metadata:
  name: child-ocp-network
spec:
  type: manifest-set

  manifestSet:
    manifests:
      - path: manifests/child-ocp-nad.yaml

  readiness:
    timeout: 5m
    checks:
      - type: resourceExists
        apiVersion: k8s.cni.cncf.io/v1
        kind: NetworkAttachmentDefinition
        name: child-ocp-net
        namespace: bootwright-child-ocp
