apiVersion: bootwright.io/v1alpha1
kind: InfraProvider
metadata:
  name: lab-metal

spec:
  baremetal:
    boot:
      method: redfishVirtualMedia

    defaults:
      bmc:
        credentialsRef: lab-bmc-credentials
        tls:
          # The lab controllers present certificates their own authority
          # issued. This context does not carry that authority yet, so the
          # opt-out is declared here and reaches exactly these endpoints;
          # carried as a caBundle Secret named by tls.trustBundleRef, it would
          # verify them instead.
          verify: false

  networkAttachments:
    - name: lab-metal
      baremetal: {}
