apiVersion: bootwright.io/v1alpha1
kind: InfraProvider
metadata:
  name: lab-metal

spec:
  baremetal:
    boot:
      method: redfishVirtualMedia

    defaults:
      bmc:
        credentialsRef: lab-bmc-credentials
        tls:
          # The lab controllers present certificates their own authority
          # issued. That authority is carried as a caBundle Secret, so every
          # controller leg is verified against it: an installation that
          # delivers private material hands its controller a private URL and
          # refuses an unverified leg.
          trustBundleRef: lab-bmc-ca

  networkAttachments:
    - name: lab-metal
      baremetal: {}
