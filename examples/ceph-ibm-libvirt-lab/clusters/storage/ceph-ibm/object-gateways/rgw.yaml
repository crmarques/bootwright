apiVersion: bootwright.io/v1alpha1
kind: StorageObjectGateway
metadata:
  name: rgw
spec:
  storageClusterRef: ceph-ibm

  public:
    dnsName: rgw.ceph.bootwright.test
    scheme: http
    port: 80

  ceph:
    serviceID: lab
    placement:
      hosts:
        - ceph-1
        - ceph-2
      countPerHost: 1
    frontendPort: 8080
    ingresses:
      - name: lab
        address: 192.168.140.80
        prefixLength: 24
        virtualInterfaceNetworks:
          - 192.168.140.0/24
        placement:
          hosts:
            - ceph-1
            - ceph-2
