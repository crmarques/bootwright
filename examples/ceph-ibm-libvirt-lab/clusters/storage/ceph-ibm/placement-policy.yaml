apiVersion: bootwright.io/v1alpha1
kind: StoragePlacementPolicy
metadata:
  name: replicated-host
spec:
  storageClusterRef: ceph-ibm

  ceph:
    # Only two OSD hosts exist, so replicate across hosts with size 2.
    # minSize 2 keeps both copies required for writes (no silent single-copy
    # writes). With one OSD host down, I/O pauses but mon quorum (3 mons)
    # survives — this is a lab/tie-breaker layout, not data-HA across a site.
    failureDomain: host
    ruleName: replicated-host
    replicated:
      size: 2
      minSize: 2
