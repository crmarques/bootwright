# Monitor-only tie-breaker (profile ceph-mon, no OSDs): mon only. A libvirt VM
# installed with RHEL 9.7 as Bootwright-managed OS. Shares the ceph-node-ssh key
# and root user with its peers — one SSH identity per StorageCluster.
apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: ceph-3
spec:
  capabilities:
    - ceph-node

  substrate:
    providerRef: lab-libvirt-provider
    # Monitor-only profile: no OSD data disks.
    profileRef: ceph-mon

  os:
    provided: false
    installProfileRef: rhel-9-ceph-node
    install:
      rootDeviceHints:
        deviceName: /dev/vda

  network:
    config:
      networkConfigRef: ceph-bridge
      attachmentRef: ceph-bridge
      interfaceAddresses:
        - interface: primary
          addressRef: ssh
          prefixLength: 24

  addresses:
    - name: ssh
      address: 192.168.140.23

  access:
    ssh:
      user: root
      keyRef: ceph-node-ssh
      addressRef: ssh
