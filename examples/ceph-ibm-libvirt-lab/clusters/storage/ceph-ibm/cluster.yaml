apiVersion: bootwright.io/v1alpha1
kind: StorageCluster
metadata:
  name: ceph-ibm
spec:
  type: ceph

  management: managed

  ceph:
    distribution: ibm

    release: "9.9.0.3"
    packageVersion: "20.1.0-221.el9cp"

    image:
      version: "v9.0-20201"

    ibm:
      callHome: disabled

    entitlementRef: ibm-storage-ceph

    security:
      fips:
        enabled: true

    cephadm:
      addressRef: ssh
      clusterSSH:
        keyRef: ceph-cluster-ssh
      bootstrap:
        node: node-01

    networks:
      publicCIDRs:
        - 192.168.140.0/24
      clusterCIDRs:
        - 192.168.140.0/24

    mgmtGateway:
      dnsLabel: dashboard
      exposure: http
      ingress:
        name: lab
        address: 192.168.140.81
        prefixLength: 24
        virtualInterfaceNetworks:
          - 192.168.140.0/24
        placement:
          hosts:
            - node-01
            - node-02

    topology:
      nodes:
        - name: node-01
          machineRef: ceph-1
          roles:
            - mon
            - mgr
            - osd
            - mds
            - rgw
            - ingress
          devices:
            - /dev/vdb
            - /dev/vdc
            - /dev/vdd
        - name: node-02
          machineRef: ceph-2
          roles:
            - mon
            - mgr
            - osd
            - mds
            - rgw
            - ingress
          devices:
            - /dev/vdb
            - /dev/vdc
            - /dev/vdd
        - name: node-03
          machineRef: ceph-3
          roles:
            - mon
