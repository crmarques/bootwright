apiVersion: bootwright.io/v1alpha1
kind: Secret
metadata:
  name: bastion-host-ssh
spec:
  type: sshKeyPair

  source:
    file:
      privateKey: ~/.ssh/bootwright-ssh-key
---
apiVersion: bootwright.io/v1alpha1
kind: Secret
metadata:
  name: ceph-node-ssh
spec:
  type: sshKeyPair

  source:
    generated:
      keyType: ed25519
      comment: bootwright-ceph-ibm-libvirt
---
apiVersion: bootwright.io/v1alpha1
kind: Secret
metadata:
  name: bmc-credentials
spec:
  type: usernamePassword

  source:
    generated:
      username: admin
---
apiVersion: bootwright.io/v1alpha1
kind: Secret
metadata:
  name: rhel-org
spec:
  type: opaque
---
apiVersion: bootwright.io/v1alpha1
kind: Secret
metadata:
  name: rhel-activation-key
spec:
  type: opaque
---
apiVersion: bootwright.io/v1alpha1
kind: Secret
metadata:
  name: ibm-ceph-registry
spec:
  type: usernamePassword
