apiVersion: bootwright.io/v1alpha1
kind: Environment
metadata:
  name: ceph-ibm-libvirt-lab
spec:
  domains:
    base: bootwright.test

  machineAccess:
    keyRef: bootwright-machine-key

  safety:
    destroyProtection: protected

  storageClusters:
    - ceph-ibm

  infraComponents:
    nameResolution:
      - name: lab-dns
        management: managed
        componentRef: lab-dns
