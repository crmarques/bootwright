apiVersion: bootwright.io/v1alpha1
kind: MachineImage
metadata:
  name: rhel-9-x86-64-dvd
spec:
  # Resolves to the managed media store. Stage the RHEL 9.7 DVD first:
  #   bootwright media add rhel-9.7-x86_64-dvd.iso --from-file ./rhel-9.7-x86_64-dvd.iso
  # A full DVD carries its packages, so no packageSource is needed.
  bootMedia: local-media:rhel-9.7-x86_64-dvd.iso
