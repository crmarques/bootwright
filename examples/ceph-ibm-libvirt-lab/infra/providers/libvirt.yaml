apiVersion: bootwright.io/v1alpha1
kind: InfraProvider
metadata:
  name: lab-libvirt-provider
spec:
  type: libvirt

  libvirt:
    machineRef: bastion
    uri: qemu:///system

    bmcEmulationDefaults:
      enabled: true
      protocol: redfish
      auth:
        credentialsRef: bmc-credentials

    machineProfiles:
      - name: ceph-full
        cpu: 2
        memoryMiB: 4096
        diskGiB: 20
        dataDisks:
          - name: osd0
            sizeGiB: 8
          - name: osd1
            sizeGiB: 8
          - name: osd2
            sizeGiB: 8

      - name: ceph-mon
        cpu: 1
        memoryMiB: 2048
        diskGiB: 40

  networkAttachments:
    - name: ceph-bridge
      libvirt:
        bridge: vbr-ceph-ibm
