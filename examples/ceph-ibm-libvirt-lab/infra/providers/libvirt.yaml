apiVersion: bootwright.io/v1alpha1
kind: InfraProvider
metadata:
  name: lab-libvirt-provider
spec:
  type: libvirt

  libvirt:
    # Drive libvirt on this host via the bastion Machine (localhost).
    machineRef: bastion
    uri: qemu:///system

    # Bootwright emulates a Redfish BMC per VM so the same boot/power flow as
    # bare metal works on libvirt. Credentials come from bmc-credentials.
    bmcEmulationDefaults:
      enabled: true
      protocol: redfish
      auth:
        credentialsRef: bmc-credentials

    machineProfiles:
      # Full Ceph node — kept as lean as possible to test provisioning on a
      # laptop: 2 vCPU, 4 GiB RAM, a 20 GiB root, and three 8 GiB OSD disks.
      # /dev/vda = root, /dev/vdb..vdd = the OSD devices (one OSD per disk).
      # Bump memoryMiB if the co-located mon/mgr/osd/mds/rgw daemons OOM.
      - name: ceph-full
        cpu: 2
        memoryMiB: 4096
        diskGiB: 20
        dataDisks:
          - name: osd0
            sizeGiB: 8
          - name: osd1
            sizeGiB: 8
          - name: osd2
            sizeGiB: 8

      # Tie-breaker node: monitor only, no OSD disk — the leanest footprint.
      - name: ceph-mon
        cpu: 1
        memoryMiB: 2048
        diskGiB: 16

  networkAttachments:
    - name: ceph-bridge
      libvirt:
        bridge: vbr-ceph-ibm
