# Three libvirt VMs installed with RHEL 9.7 as Bootwright-managed OS.
#   ceph-1, ceph-2 -> full nodes (profile ceph-full, 3 OSD disks)
#   ceph-3         -> tie-breaker (profile ceph-mon, monitor only, no OSDs)
# All share the ceph-node-ssh key and root user (required: one SSH identity per
# StorageCluster).
---
apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: ceph-1
spec:
  capabilities:
    - ceph-node

  substrate:
    providerRef: lab-libvirt-provider
    profileRef: ceph-full

  os:
    provided: false
    installProfileRef: rhel-9-ceph-node
    install:
      rootDeviceHints:
        deviceName: /dev/vda

  network:
    config:
      networkConfigRef: ceph-bridge
      attachmentRef: ceph-bridge
      interfaceAddresses:
        - interface: primary
          addressRef: ssh
          prefixLength: 24

  addresses:
    - name: ssh
      address: 192.168.140.21

  access:
    ssh:
      user: root
      keyRef: ceph-node-ssh
      addressRef: ssh
---
apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: ceph-2
spec:
  capabilities:
    - ceph-node

  substrate:
    providerRef: lab-libvirt-provider
    profileRef: ceph-full

  os:
    provided: false
    installProfileRef: rhel-9-ceph-node
    install:
      rootDeviceHints:
        deviceName: /dev/vda

  network:
    config:
      networkConfigRef: ceph-bridge
      attachmentRef: ceph-bridge
      interfaceAddresses:
        - interface: primary
          addressRef: ssh
          prefixLength: 24

  addresses:
    - name: ssh
      address: 192.168.140.22

  access:
    ssh:
      user: root
      keyRef: ceph-node-ssh
      addressRef: ssh
---
apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: ceph-3
spec:
  capabilities:
    - ceph-node

  substrate:
    providerRef: lab-libvirt-provider
    # Monitor-only profile: no OSD data disks.
    profileRef: ceph-mon

  os:
    provided: false
    installProfileRef: rhel-9-ceph-node
    install:
      rootDeviceHints:
        deviceName: /dev/vda

  network:
    config:
      networkConfigRef: ceph-bridge
      attachmentRef: ceph-bridge
      interfaceAddresses:
        - interface: primary
          addressRef: ssh
          prefixLength: 24

  addresses:
    - name: ssh
      address: 192.168.140.23

  access:
    ssh:
      user: root
      keyRef: ceph-node-ssh
      addressRef: ssh
