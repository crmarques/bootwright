apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: bastion
spec:
  # This machine IS the local workstation/libvirt host. It runs libvirt, the
  # emulated Redfish BMCs, and the dnsmasq resolver.
  capabilities:
    - container-runtime
    - libvirt
    - name-resolution

  os:
    provided: true

  addresses:
    - name: ssh
      address: localhost
    - name: cluster-lan
      address: 192.168.140.1

  access:
    ssh:
      keyRef: bastion-host-ssh
      addressRef: ssh
