apiVersion: bootwright.io/v1alpha1
kind: ClusterInfra
metadata:
  name: dc1-ocp-infra
spec:
  platform:
    type: baremetal
    baremetal:
      provisioningNetwork: disabled

  endpoints:
    api:
      externalVip: 192.168.141.10
    apiInt:
      externalVip: 192.168.141.10
    ingress:
      externalVip: 192.168.141.11

  components:
    machines:
      - name: master-0
        from:
          provider: stretched-baremetal-provider
          name: dc1-ocp-master-0
        networkConfig:
          ref:
            name: stretched-lab-dc1-net
          addresses:
            - interface: primary
              ipv4:
                - ip: 192.168.141.20
                  prefix-length: 24
      - name: master-1
        from:
          provider: stretched-baremetal-provider
          name: dc1-ocp-master-1
        networkConfig:
          ref:
            name: stretched-lab-dc1-net
          addresses:
            - interface: primary
              ipv4:
                - ip: 192.168.141.21
                  prefix-length: 24
      - name: master-2
        from:
          provider: stretched-baremetal-provider
          name: dc1-ocp-master-2
        networkConfig:
          ref:
            name: stretched-lab-dc1-net
          addresses:
            - interface: primary
              ipv4:
                - ip: 192.168.141.22
                  prefix-length: 24
