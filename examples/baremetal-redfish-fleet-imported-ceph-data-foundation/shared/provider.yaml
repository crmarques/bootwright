apiVersion: bootwright.io/v1alpha1
kind: InfraProvider
metadata:
  name: stretched-baremetal-provider
spec:
  machines:
    - name: dc1-ocp-master-0
      baremetal:
        bootMACAddress: 52:54:00:41:10:10
        interfaces:
          - name: primary
            macAddress: 52:54:00:41:10:10
        rootDeviceHints:
          deviceName: /dev/sda
        bmc:
          address: redfish-virtualmedia+https://bmc-dc1-ocp-master-0.example.test/redfish/v1/Systems/1
          protocol: redfish
          credentialsRef:
            name: bmc-credentials
          disableCertificateVerification: true
