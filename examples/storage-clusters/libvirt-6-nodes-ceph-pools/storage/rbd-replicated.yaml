apiVersion: bootwright.io/v1alpha1
kind: StoragePool
metadata:
  name: rbd-replicated

spec:
  clusterRef: ceph-lab
  type: replicated
  role: rbd
  placementPolicyRef: ssd-hosts
  autoscale:
    mode: 'on'
    pgNumMin: 8
    pgNumMax: 64
  quota:
    maxBytes: 10737418240
    maxObjects: 100000
  compression:
    mode: passive
    algorithm: zstd
    requiredRatio: 0.8
    minBlobSize: 8192
    maxBlobSize: 131072
