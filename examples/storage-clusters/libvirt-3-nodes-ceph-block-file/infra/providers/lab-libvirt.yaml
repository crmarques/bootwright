apiVersion: bootwright.io/v1alpha1
kind: InfraProvider
metadata:
  name: lab-libvirt

spec:
  libvirt:
    machineRef: controller
    uri: qemu:///system

    # Example host headroom; choose reserves for your own allocation budget.
    capacityReserve:
      cpu: 1
      memoryMiB: 2048
      diskGiB: 10

    bmcEmulationDefaults:
      enabled: true
      protocol: redfish
      emulator: sushy-tools
      bindAddress: 127.0.0.1
      port: 8000
      certificateRef: lab-bmc-tls

      auth:
        credentialsRef: lab-bmc-credentials

    machineProfiles:
      - name: rhel
        cpu: 4
        memoryMiB: 10240
        diskGiB: 60
        tpm: {}

        dataDisks:
          - name: ceph-data
            sizeGiB: 80
            media: ssd

  networkAttachments:
    - name: lab-guests

      libvirt:
        bridge: virbr-lab
        management: managed
        address: 198.51.100.1/24
        forward: nat
