# Synthetic mirror digests: replace every image with the verified linux/amd64 digest in your operator-owned mirror.
apiVersion: bootwright.io/v1alpha1
kind: StorageCluster
metadata:
  name: ceph-lab

spec:
  type: ceph
  management: managed

  ceph:
    distribution: ibm
    release: 9.9.2.0
    packageVersion: 20.2.2-349.el9cp
    packageRepository: https://mirror.lab.example.test/packages/ceph/9/rhel9/x86_64
    packageRepositoryKey: https://mirror.lab.example.test/keys/RPM-GPG-KEY-IBM-CEPH
    packageRepositoryTrustBundleRef: mirror-ca

    image:
      base: mirror.lab.example.test/ceph/core
      version: sha256:1111111111111111111111111111111111111111111111111111111111111111

    images:
      alertmanager:
        base: mirror.lab.example.test/ceph/alertmanager
        version: sha256:2222222222222222222222222222222222222222222222222222222222222222

      grafana:
        base: mirror.lab.example.test/ceph/grafana
        version: sha256:3333333333333333333333333333333333333333333333333333333333333333

      haproxy:
        base: mirror.lab.example.test/ceph/haproxy
        version: sha256:4444444444444444444444444444444444444444444444444444444444444444

      keepalived:
        base: mirror.lab.example.test/ceph/keepalived
        version: sha256:5555555555555555555555555555555555555555555555555555555555555555

      node_exporter:
        base: mirror.lab.example.test/ceph/node_exporter
        version: sha256:6666666666666666666666666666666666666666666666666666666666666666

      prometheus:
        base: mirror.lab.example.test/ceph/prometheus
        version: sha256:7777777777777777777777777777777777777777777777777777777777777777

    ibm:
      callHome: enabled

      packages:
        source: vendor

    entitlementRef: ibm-ceph

    cephadm:
      addressRef: ip

      ansible:
        packageVersion: 5.0.3-1.el9cp

      clusterSSH:
        user: bootwright
        keyRef: ceph-cluster-key
        transport: verified-tunnel

      bootstrap:
        node: rhel-01
        addressRef: ip

    networks:
      publicCIDRs:
        - 198.51.100.0/24

    config:
      global:
        osd_pool_default_size: '2'
        osd_pool_default_min_size: '2'

      osd:
        osd_memory_target_autotune: 'false'
        osd_memory_target: '5368709120'

    services:
      - service_type: mon

        placement:
          count: 3
          label: ceph-core

      - service_type: mgr

        placement:
          count: 2
          label: ceph-core

      - service_type: osd
        service_id: data

        placement:
          label: ceph-core

        spec:
          data_devices:
            paths:
              - /dev/sda

      - service_type: prometheus

        placement:
          hosts:
            - rhel-01.lab.example.test

      - service_type: alertmanager

        placement:
          hosts:
            - rhel-02.lab.example.test

      - service_type: grafana

        placement:
          hosts:
            - rhel-03.lab.example.test

      - service_type: node-exporter

        placement:
          count: 3
          label: ceph-core

      - service_type: rgw
        service_id: objects

        placement:
          hosts:
            - rhel-01.lab.example.test
            - rhel-02.lab.example.test

        spec:
          rgw_frontend_port: 8081

      - service_type: ingress
        service_id: rgw.objects

        placement:
          hosts:
            - rhel-01.lab.example.test
            - rhel-02.lab.example.test

        spec:
          backend_service: rgw.objects
          virtual_ip: 198.51.100.51/24
          frontend_port: 8082
          monitor_port: 9049

    topology:
      nodes:
        - name: rhel-01
          fqdn: rhel-01.lab.example.test
          machineRef: rhel-01

          labels:
            - ceph-core

        - name: rhel-02
          fqdn: rhel-02.lab.example.test
          machineRef: rhel-02

          labels:
            - ceph-core

        - name: rhel-03
          fqdn: rhel-03.lab.example.test
          machineRef: rhel-03

          labels:
            - ceph-core
