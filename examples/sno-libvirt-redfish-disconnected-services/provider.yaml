apiVersion: bootwright.io/v1alpha1
kind: InfraProvider
metadata:
  name: lab-libvirt-provider
spec:
  type: libvirt

  networkAttachments:

  - name: sno-bridge
    libvirt:
      bridge: vbr-cb-sno-disc

  libvirt:
    uri: qemu:///system
    bmcEmulationDefaults:
      enabled: true
      auth:
        credentialRef:
          name: bmc-credentials
    machineRef:
      name: lab-host
    machineProfiles:
    - name: sno
      cpu: 8
      memoryMiB: 16384
      diskGiB: 120
