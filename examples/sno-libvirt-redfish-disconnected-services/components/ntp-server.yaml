apiVersion: bootwright.io/v1alpha1
kind: InfraComponent
metadata:
  name: ntp-server
spec:
  ntp:
    type: chrony
    bindAddress: 192.168.132.1
    endpoints:
    - name: cluster
      machineAddress: cluster-lan
    upstreamSources:
    - time.bootwright.test
    machineRef:
      name: lab-host
