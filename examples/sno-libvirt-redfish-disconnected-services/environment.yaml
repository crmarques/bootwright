apiVersion: bootwright.io/v1alpha1
kind: Environment
metadata:
  name: sno-libvirt-redfish-disconnected-services
spec:
  baseDomain: bootwright.test

  secrets:
    - openshift-pull-secret
    - cluster-admin-ssh-key:
        generated:
          sshKeyPair:
            comment: bootwright-cluster-admin
    - provider-host-ssh:
        file: ~/.ssh/bootwright-ssh-key
    - bmc-credentials
    - proxy-credentials:
        generated:
          credentials:
            username: proxy
    - mirror-registry-credentials:
        generated:
          credentials:
            username: mirror
    - mirror-registry-ca:
        generated:
          selfSignedCertificate:
            commonName: mirror.bootwright.test
            dnsNames:
              - mirror.bootwright.test

  installTrust:
    caBundleRefs:
      - name: mirror-registry-ca

  registries:
    mirror:
      credentialsRef:
        name: mirror-registry-credentials
      trustBundleRef:
        name: mirror-registry-ca

  infraComponents:
    ntpSources:
      - name: default
        type: managed
        componentRef:
          name: ntp-server
        endpoint: cluster
    artifactServers:
      - name: default
        type: managed
        componentRef:
          name: artifact-server
    proxies:
      - name: default
        type: external
        connection:
          httpProxy: http://proxy.bootwright.test:3128
          httpsProxy: http://proxy.bootwright.test:3128
          noProxy:
            - .bootwright.test
            - 192.168.132.0/24
          auth:
            proxyAuthRef:
              name: proxy-credentials
    nameResolution:
      - name: default
        type: external
        ip: 192.168.132.1
        additionalIngressHosts:
          - console-openshift-console.apps.sno-disconnected.bootwright.test
          - oauth-openshift.apps.sno-disconnected.bootwright.test
    registries:
      - name: default
        type: managed
        componentRef:
          name: mirror-registry

  proxyFor:
    bootwright: default
    containerClusterInstall: default
