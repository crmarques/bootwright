apiVersion: bootwright.io/v1alpha1
kind: Environment
metadata:
  name: sno-libvirt-redfish-disconnected-services
spec:
  domains:
    base: bootwright.test

  installTrust:
    caBundleRefs:
      - mirror-registry-ca

  registries:
    mirror:
      credentialsRef: mirror-registry-credentials
      trustBundleRef: mirror-registry-ca

  infraComponents:
    ntp:
      - name: default
        management: managed
        componentRef: ntp-server
        endpointRef: cluster
    artifactServers:
      - name: default
        management: managed
        componentRef: artifact-server
    proxies:
      - name: default
        default: true
        management: external
        connection:
          httpProxy: http://proxy.bootwright.test:3128
          httpsProxy: http://proxy.bootwright.test:3128
          noProxy:
            - .bootwright.test
            - 192.168.132.0/24
          auth:
            proxyAuthRef: proxy-credentials
    nameResolution:
      - name: default
        management: external
        address: 192.168.132.1
    registries:
      - name: default
        management: managed
        componentRef: mirror-registry
