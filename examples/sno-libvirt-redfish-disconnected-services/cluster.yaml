apiVersion: bootwright.io/v1alpha1
kind: ContainerCluster
metadata:
  name: sno-disconnected
spec:
  distribution:
    release:
      version: 4.21.15

  install:
    mode: disconnected
    nodeSSH:
      keyPairRef: sno-disconnected-cluster-admin-ssh-key
    endpoints:
      # Single-node OpenShift has no load balancer or VIP: the API and ingress
      # are served on the node's own IP (Machine spec.addresses ip), so both
      # endpoints resolve there.
      api:
        address: 192.168.132.40
        source:
          type: external
      ingress:
        address: 192.168.132.40
        source:
          type: external

  hosts:

  - hostname: master-0
    role: master
    machineRef: sno-disconnected-master-0
