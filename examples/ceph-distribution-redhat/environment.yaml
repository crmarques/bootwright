apiVersion: bootwright.io/v1alpha1
kind: Environment
metadata:
  name: ceph-distribution-redhat
spec:
  baseDomain: bootwright.test

  secrets:
    - ceph-node-ssh:
        generated:
          sshKeyPair:
            comment: bootwright-ceph-node
    - redhat-org
    - redhat-activation-key
    - redhat-registry-credentials
