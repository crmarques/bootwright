apiVersion: bootwright.io/v1alpha1
kind: StorageCluster
metadata:
  name: ceph-redhat
spec:
  type: ceph

  ceph:
    distribution: redhat
    entitlementRef: rhcs
    cephadm:
      bootstrap:
        host: ceph-0
    topology:
      hosts:
        - machineRef: ceph-0
          roles:
            - mon
