apiVersion: bootwright.io/v1alpha1
kind: StorageCluster
metadata:
  name: ceph-redhat
spec:
  type: ceph

  ceph:
    distribution: redhat
    # Optional. release selects the Red Hat Ceph Storage product stream (e.g. 9,
    # the default), choosing the rhceph-<N>-tools subscription repository. RHCS
    # registry tags are not x.y.z, so pin a reproducible run with spec.ceph.image.
    # release: "9"
    # image: registry.redhat.io/rhceph/rhceph-9-rhel9@sha256:<digest>
    entitlementRef: rhcs
    cephadm:
      bootstrap:
        host: ceph-0
    topology:
      hosts:
        - hostname: ceph-0
          site: lab
          roles:
            - mon
          machineRef: ceph-0
