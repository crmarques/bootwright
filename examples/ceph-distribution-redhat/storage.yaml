apiVersion: bootwright.io/v1alpha1
kind: StorageCluster
metadata:
  name: ceph-redhat
spec:
  type: ceph

  ceph:
    distribution: redhat
    release: "9.1"
    packageVersion: "19.2.1-245.el9cp"
    image:
      base: registry.redhat.io/rhceph/rhceph-9-rhel9
      version: "9-1234"
    entitlementRef: rhcs
    cephadm:
      clusterSSH:
        keyRef: ceph-cluster-ssh
      bootstrap:
        node: node-01
    topology:
      nodes:
        - name: node-01
          machineRef: ceph-0
          roles:
            - mon
