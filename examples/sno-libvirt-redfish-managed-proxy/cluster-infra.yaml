apiVersion: bootwright.io/v1alpha1
kind: ClusterInfra
metadata:
  name: sno-libvirt-infra
spec:
  platform:
    type: baremetal
    baremetal:
      provisioningNetwork: disabled

  endpoints:
    api:
      providedBy:
        loadBalancer: default
        address: control-plane
    apiInt:
      providedBy:
        loadBalancer: default
        address: control-plane
    ingress:
      providedBy:
        loadBalancer: default
        address: apps

  components:
    machines:
      - name: master-0
        from:
          provider: lab-libvirt-provider
          profile: sno
        networkConfig:
          ref:
            name: sno-machine-net
          addresses:
            - interface: primary
              ipv4:
                - ip: 192.168.132.20
                  prefix-length: 24
        rootDeviceHints:
          deviceName: /dev/vda

    loadBalancers:
      - name: default
        from:
          provider: lab-libvirt-provider
          name: default
        bindAddresses:
          - name: control-plane
            ip: 192.168.132.10
          - name: apps
            ip: 192.168.132.11

    proxy:
      from:
        provider: lab-libvirt-provider
        name: default
      port: 3128
      bindAddress: 0.0.0.0

    nameResolution:
      from:
        provider: lab-libvirt-provider
        name: default
      bindAddress: 192.168.132.1
      additionalIngressHosts:
        - console-openshift-console.apps.sno-libvirt.example.test
        - oauth-openshift.apps.sno-libvirt.example.test
