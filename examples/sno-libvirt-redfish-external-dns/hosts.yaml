apiVersion: bootwright.io/v1alpha1
kind: Host
metadata:
  name: lab-host
spec:
  addresses:
    - name: ssh
      address: 192.168.132.1
    - name: cluster-lan
      address: 192.168.132.1

  ssh:
    addressName: ssh
    keyRef:
      name: provider-host-ssh

  capabilities:
    - libvirt
    - container-runtime
