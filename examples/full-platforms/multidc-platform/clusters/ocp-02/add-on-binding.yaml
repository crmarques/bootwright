apiVersion: bootwright.io/v1alpha1
kind: ClusterAddonBinding
metadata:
  name: ocp-multidc-02-addons

spec:
  clusterRef: ocp-multidc-02

  profileRefs:
    - physical-cluster-addons

  addonRefs: []

  # Illustrative channels and CSVs: replace them with the pairs your catalog serves.
  packages:
    nmstate:
      subscription:
        channel: example-channel
        startingCSV: kubernetes-nmstate-operator.v0.0.0

    kubevirt:
      subscription:
        channel: example-channel
        startingCSV: kubevirt-hyperconverged-operator.v0.0.0

    fdf:
      cephConsumerRef: ceph-multidc-01-odf-ocp-multidc-02

      subscription:
        channel: stable-4.20
        startingCSV: odf-operator.v4.20.0
        source: isf-data-foundation-catalog

        catalogSource:
          name: isf-data-foundation-catalog
          image: icr.io/cpopen/isf-data-foundation-catalog@sha256:2222222222222222222222222222222222222222222222222222222222222222
          priority: 100
          securityContextConfig: restricted
