apiVersion: bootwright.io/v1alpha1
kind: CephCluster
metadata:
  name: ceph-multidc-01

spec:
  management: managed

  distribution:
    ibm:
      callHome: disabled

      packages:
        source: vendor

  release: 9.0.0.0
  packageVersion: 20.1.0-1.el9cp

  image:
    base: cp.icr.io/cp/ibm-ceph/ceph-9-rhel9
    version: sha256:1111111111111111111111111111111111111111111111111111111111111111

  entitlementRef: ceph-entitlement

  cephadm:
    ansible:
      packageVersion: 5.0.0-1.el9cp

    addressRef: ssh

    clusterSSH:
      user: cephadm
      keyRef: ceph-multidc-01-cephadm-ssh-key

    bootstrap:
      nodeRef: node-01
      addressRef: ssh
      singleHostDefaults: false

  networks:
    publicCIDRs:
      - 198.51.100.0/25
      - 198.51.100.128/25

    clusterCIDRs:
      - 203.0.113.0/24

  security:
    fips:
      enabled: true

    cephx:
      keyType: aes

  config:
    global:
      mon_osd_down_out_subtree_limit: host
      osd_pool_default_pg_autoscale_mode: 'on'

    mgr:
      mgr/balancer/mode: upmap

  mgrModules:
    - balancer
    - pg_autoscaler
    - devicehealth

  topology:
    stretch:
      failureDomain: datacenter

      dataSites:
        - site-a
        - site-b

      tiebreaker:
        node: node-07
        site: site-c

      ruleName: stretch-rule

    nodes:
      - name: node-01
        fqdn: node-01.ceph-multidc-01.clusters.example.com
        machineRef: storage-a-01
        site: site-a

        labels:
          - _admin
          - mon
          - mgr
          - osd
          - mds
          - rgw
          - ingress
          - prometheus
          - grafana
          - alertmanager

        location:
          datacenter: site-a

      - name: node-02
        fqdn: node-02.ceph-multidc-01.clusters.example.com
        machineRef: storage-a-02
        site: site-a

        labels:
          - _admin
          - mon
          - mgr
          - osd
          - mds
          - rgw
          - ingress
          - prometheus
          - grafana
          - alertmanager

        location:
          datacenter: site-a

      - name: node-03
        fqdn: node-03.ceph-multidc-01.clusters.example.com
        machineRef: storage-a-03
        site: site-a

        labels:
          - osd
          - mds
          - rgw
          - ingress

        location:
          datacenter: site-a

      - name: node-04
        fqdn: node-04.ceph-multidc-01.clusters.example.com
        machineRef: storage-b-01
        site: site-b

        labels:
          - _admin
          - mon
          - mgr
          - osd
          - mds
          - rgw
          - ingress
          - prometheus
          - grafana
          - alertmanager

        location:
          datacenter: site-b

      - name: node-05
        fqdn: node-05.ceph-multidc-01.clusters.example.com
        machineRef: storage-b-02
        site: site-b

        labels:
          - _admin
          - mon
          - mgr
          - osd
          - mds
          - rgw
          - ingress
          - prometheus
          - grafana
          - alertmanager

        location:
          datacenter: site-b

      - name: node-06
        fqdn: node-06.ceph-multidc-01.clusters.example.com
        machineRef: storage-b-03
        site: site-b

        labels:
          - osd
          - mds
          - rgw
          - ingress

        location:
          datacenter: site-b

      - name: node-07
        fqdn: node-07.ceph-multidc-01.clusters.example.com
        machineRef: storage-witness-01
        site: site-c

        labels:
          - mon

        location:
          datacenter: site-c

  services:
    - service_type: mon

      placement:
        hosts:
          - node-01.ceph-multidc-01.clusters.example.com
          - node-02.ceph-multidc-01.clusters.example.com
          - node-04.ceph-multidc-01.clusters.example.com
          - node-05.ceph-multidc-01.clusters.example.com
          - node-07.ceph-multidc-01.clusters.example.com

        count: 5

    - service_type: mgr

      placement:
        hosts:
          - node-01.ceph-multidc-01.clusters.example.com
          - node-02.ceph-multidc-01.clusters.example.com
          - node-04.ceph-multidc-01.clusters.example.com
          - node-05.ceph-multidc-01.clusters.example.com

        count: 2

    - service_type: osd
      service_id: data

      placement:
        hosts:
          - node-01.ceph-multidc-01.clusters.example.com
          - node-02.ceph-multidc-01.clusters.example.com
          - node-03.ceph-multidc-01.clusters.example.com
          - node-04.ceph-multidc-01.clusters.example.com
          - node-05.ceph-multidc-01.clusters.example.com
          - node-06.ceph-multidc-01.clusters.example.com

      spec:
        data_devices:
          paths:
            - /dev/disk/by-id/nvme-example-data-01
            - /dev/disk/by-id/nvme-example-data-02
            - /dev/disk/by-id/nvme-example-data-03
            - /dev/disk/by-id/nvme-example-data-04
            - /dev/disk/by-id/nvme-example-data-05

        encrypted: true
        filter_logic: AND
        data_allocate_fraction: 1
        tpm2: true

    - service_type: prometheus

      placement:
        hosts:
          - node-01.ceph-multidc-01.clusters.example.com
          - node-02.ceph-multidc-01.clusters.example.com
          - node-04.ceph-multidc-01.clusters.example.com
          - node-05.ceph-multidc-01.clusters.example.com

      spec:
        retention_time: 14d
        retention_size: 5GB

    - service_type: grafana

      placement:
        hosts:
          - node-01.ceph-multidc-01.clusters.example.com
          - node-02.ceph-multidc-01.clusters.example.com
          - node-04.ceph-multidc-01.clusters.example.com
          - node-05.ceph-multidc-01.clusters.example.com

    - service_type: alertmanager

      placement:
        hosts:
          - node-01.ceph-multidc-01.clusters.example.com
          - node-02.ceph-multidc-01.clusters.example.com
          - node-04.ceph-multidc-01.clusters.example.com
          - node-05.ceph-multidc-01.clusters.example.com

    - service_type: mds
      service_id: odf-cephfs

      placement:
        hosts:
          - node-01.ceph-multidc-01.clusters.example.com
          - node-02.ceph-multidc-01.clusters.example.com
          - node-03.ceph-multidc-01.clusters.example.com
          - node-04.ceph-multidc-01.clusters.example.com
          - node-05.ceph-multidc-01.clusters.example.com
          - node-06.ceph-multidc-01.clusters.example.com

    - service_type: rgw
      service_id: odf-all

      placement:
        label: rgw

      spec:
        rgw_frontend_port: 8080

    - service_type: ingress
      service_id: rgw.odf-all

      placement:
        label: ingress

      spec:
        backend_service: rgw.odf-all
        virtual_ip: 198.51.100.59/25
        frontend_port: 443
        monitor_port: 1967
        first_virtual_router_id: 43
        ssl: true

        virtual_interface_networks:
          - 198.51.100.0/25

  serviceBindings:
    - serviceRef: grafana

      secrets:
        - path: /spec/initial_admin_password
          secretRef: ceph-multidc-01-grafana-admin

    - serviceRef: ingress.rgw.odf-all

      secrets:
        - path: /spec/ssl_cert
          secretRef: ceph-multidc-01-rgw-all-tls

        - path: /spec/ssl_key
          secretRef: ceph-multidc-01-rgw-all-tls
