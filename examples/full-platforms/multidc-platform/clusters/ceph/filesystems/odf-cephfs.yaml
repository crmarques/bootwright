apiVersion: bootwright.io/v1alpha1
kind: CephFilesystem
metadata:
  name: odf-cephfs

spec:
  clusterRef: ceph-multidc-01
  metadataPoolRef: odf-cephfs-metadata

  dataPoolRefs:
    - name: odf-cephfs-data
      default: true

  mds:
    activeCount: 2
    standbyReplay: false

  subvolumeGroups:
    - name: csi
