apiVersion: bootwright.io/v1alpha1
kind: InfraProvider
metadata:
  name: bare-metal

spec:
  baremetal:

    defaults:
      bmc:
        credentialsRef: ocp-bmc-credentials

        tls:
          verify: true

        virtualMedia:
          tls:
            trust: established

  segments:
    - name: ocp-bare-metal-network

      taggedNetworkRefs:
        - machine
        - ceph-public

      baremetal: {}

    - name: ceph-network

      taggedNetworkRefs:
        - ceph-public
        - ceph-cluster

      baremetal: {}
