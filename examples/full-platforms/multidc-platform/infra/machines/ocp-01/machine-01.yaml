apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: edge-a-01

  labels:
    datacenter: site-a

spec:
  placement:
    site: site-a

  substrate:
    providerRef: bare-metal

    baremetal:
      bmc:
        address: https://bmc-edge-a-01.example.com/redfish/v1/Systems/1
        protocol: redfish
        credentialsRef: ocp-bmc-credentials

        tls:
          verify: true

        virtualMedia:
          tls:
            trust: established

      nics:
        - nicRef: eth0
          macAddress: 02:00:00:00:00:18

        - nicRef: eth2
          macAddress: 02:00:00:00:00:19

  os:
    provided: false

  network:
    configRef: ocp-bare-metal-network
    attachmentRef: ocp-bare-metal-network
    installAddressRef: ip

    addresses:
      - name: fqdn
        address: edge-a-01.example.com

      - name: ip
        address: 192.0.2.3/24
        interface: bond0.100

      - name: ceph-public
        address: 198.51.100.21/25
        interface: ceph-public

    interfaceBinding:
      - nicRef: eth0
        interfaceName: eth0

      - nicRef: eth2
        interfaceName: eth2

    overrides: {}

  hardware:
    nics:
      - name: eth0
      - name: eth2

    rootDevice:
      deviceName: /dev/sda
