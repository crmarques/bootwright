apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: edge-a-03

  labels:
    datacenter: site-a

spec:
  site: site-a

  hardware:
    providerRef: bare-metal

    bmc:
      address: https://bmc-edge-a-03.example.com/redfish/v1/Systems/1
      credentialsRef: ocp-bmc-credentials

      virtualMedia:
        tls:
          trust: established

    nics:
      - name: eth0
        macAddress: 02:00:00:00:00:1c
        segmentRef: ocp-bare-metal-network

      - name: eth2
        macAddress: 02:00:00:00:00:1d
        segmentRef: ocp-bare-metal-network

    rootDisk:
      wwn: "0x500000000000f103"

  os:
    clusterInstalled: {}

  network:
    configRef: ocp-bare-metal-network
    installAddressRef: ip

    addresses:
      - name: fqdn
        address: edge-a-03.example.com

      - name: ip
        address: 192.0.2.5
        interface: bond0.100

      - name: ceph-public
        address: 198.51.100.23
        interface: bond0.200

    overrides: {}
