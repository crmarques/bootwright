apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: storage-b-02

spec:
  capabilities:
    - ceph-node

  placement:
    site: site-b

  substrate:
    providerRef: bare-metal

  os:
    provided: false
    installProfileRef: rhel-ceph-node

    install:
      hostKeyRef: storage-b-02-host-key

      rootDeviceHints:
        deviceName: /dev/sda

  network:
    configRef: ceph-network
    attachmentRef: ceph-network
    installAddressRef: ssh

    addresses:
      - name: fqdn
        address: storage-b-02.example.com

      - name: ssh
        address: 198.51.100.65/25
        interface: bond0.200

      - name: cluster
        address: 203.0.113.5/24
        interface: bond0.300

    interfaceBinding:
      - nicRef: nic0
        interfaceName: nic0

      - nicRef: nic1
        interfaceName: nic1

      - nicRef: nic2
        interfaceName: nic2

      - nicRef: nic3
        interfaceName: nic3

    overrides: {}

  hardware:
    nics:
      - name: nic0
        macAddress: 02:00:00:00:00:10

      - name: nic1
        macAddress: 02:00:00:00:00:11

      - name: nic2
        macAddress: 02:00:00:00:00:12

      - name: nic3
        macAddress: 02:00:00:00:00:13

    management:
      bmc:
        address: https://bmc-storage-b-02.example.com/redfish/v1/Systems/1
        protocol: redfish
        credentialsRef: ceph-bmc-credentials

        tls:
          verify: true

        virtualMedia:
          tls:
            trust: established
