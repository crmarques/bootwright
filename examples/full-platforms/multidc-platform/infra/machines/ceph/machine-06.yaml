apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: storage-b-03

spec:
  site: site-b

  hardware:
    providerRef: bare-metal

    bmc:
      address: https://bmc-storage-b-03.example.com/redfish/v1/Systems/1
      credentialsRef: ceph-bmc-credentials

      virtualMedia:
        tls:
          trust: established

    nics:
      - name: nic0
        macAddress: 02:00:00:00:00:14
        segmentRef: ceph-network

      - name: nic1
        macAddress: 02:00:00:00:00:15
        segmentRef: ceph-network

      - name: nic2
        macAddress: 02:00:00:00:00:16
        segmentRef: ceph-network

      - name: nic3
        macAddress: 02:00:00:00:00:17
        segmentRef: ceph-network

    rootDisk:
      wwn: '0x5000c500a1b2c316'

  os:
    install:
      profileRef: rhel-ceph-node
      hostKeyRef: storage-b-03-host-key

  network:
    configRef: ceph-network
    installAddressRef: ssh

    addresses:
      - name: fqdn
        address: storage-b-03.example.com

      - name: ssh
        address: 198.51.100.66
        interface: bond0.200

      - name: cluster
        address: 203.0.113.6
        interface: bond0.300

    overrides: {}
