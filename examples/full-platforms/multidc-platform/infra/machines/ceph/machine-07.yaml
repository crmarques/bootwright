apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: storage-witness-01

spec:
  placement:
    site: site-c

  os:
    provided: true

  network:
    addresses:
      - name: fqdn
        address: storage-witness-01.example.com

      - name: ssh
        address: 198.51.100.133

  access:
    ssh:
      addressRef: ssh
      port: 22
      user: cephadm
      knownHostsRef: ceph-known-hosts

      auth:
        operatorIdentity: {}

    rootLogin: keep
