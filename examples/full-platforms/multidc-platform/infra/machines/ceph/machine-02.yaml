apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: storage-a-02

spec:
  placement:
    site: site-a

  substrate:
    providerRef: bare-metal

    baremetal:
      bmc:
        address: https://bmc-storage-a-02.example.com/redfish/v1/Systems/1
        protocol: redfish
        credentialsRef: ceph-bmc-credentials

        tls:
          verify: true

        virtualMedia:
          tls:
            trust: established

      nics:
        - nicRef: nic0
          macAddress: 02:00:00:00:00:04

        - nicRef: nic1
          macAddress: 02:00:00:00:00:05

        - nicRef: nic2
          macAddress: 02:00:00:00:00:06

        - nicRef: nic3
          macAddress: 02:00:00:00:00:07

  os:
    provided: false
    installProfileRef: rhel-ceph-node

    install:
      hostKeyRef: storage-a-02-host-key

  network:
    configRef: ceph-network
    attachmentRef: ceph-network
    installAddressRef: ssh

    addresses:
      - name: fqdn
        address: storage-a-02.example.com

      - name: ssh
        address: 198.51.100.2/25
        interface: bond0.200

      - name: cluster
        address: 203.0.113.2/24
        interface: bond0.300

    interfaceBinding:
      - nicRef: nic0
        interfaceName: nic0

      - nicRef: nic1
        interfaceName: nic1

      - nicRef: nic2
        interfaceName: nic2

      - nicRef: nic3
        interfaceName: nic3

    overrides: {}

  hardware:
    nics:
      - name: nic0
      - name: nic1
      - name: nic2
      - name: nic3

    rootDevice:
      deviceName: /dev/disk/by-id/wwn-0x5000c500a1b2c312
