apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: storage-a-03

spec:
  site: site-a

  hardware:
    providerRef: bare-metal

    bmc:
      address: https://bmc-storage-a-03.example.com/redfish/v1/Systems/1
      credentialsRef: ceph-bmc-credentials

      virtualMedia:
        tls:
          trust: established

    nics:
      - name: nic0
        macAddress: 02:00:00:00:00:08
        segmentRef: ceph-network

      - name: nic1
        macAddress: 02:00:00:00:00:09
        segmentRef: ceph-network

      - name: nic2
        macAddress: 02:00:00:00:00:0a
        segmentRef: ceph-network

      - name: nic3
        macAddress: 02:00:00:00:00:0b
        segmentRef: ceph-network

    rootDisk:
      wwn: '0x5000c500a1b2c313'

  os:
    install:
      profileRef: rhel-ceph-node
      hostKeyRef: storage-a-03-host-key

  network:
    configRef: ceph-network
    installAddressRef: ssh

    addresses:
      - name: fqdn
        address: storage-a-03.example.com

      - name: ssh
        address: 198.51.100.3
        interface: bond0.200

      - name: cluster
        address: 203.0.113.3
        interface: bond0.300

    overrides: {}
