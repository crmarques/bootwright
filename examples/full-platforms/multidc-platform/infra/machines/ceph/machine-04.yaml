apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: storage-b-01

spec:
  placement:
    site: site-b

  substrate:
    providerRef: bare-metal

    baremetal:
      rootDevice:
        wwn: '0x5000c500a1b2c314'

      bmc:
        address: https://bmc-storage-b-01.example.com/redfish/v1/Systems/1
        protocol: redfish
        credentialsRef: ceph-bmc-credentials

        tls:
          verify: true

        virtualMedia:
          tls:
            trust: established

      nics:
        - nicRef: nic0
          macAddress: 02:00:00:00:00:0c
          segmentRef: ceph-network

        - nicRef: nic1
          macAddress: 02:00:00:00:00:0d
          segmentRef: ceph-network

        - nicRef: nic2
          macAddress: 02:00:00:00:00:0e
          segmentRef: ceph-network

        - nicRef: nic3
          macAddress: 02:00:00:00:00:0f
          segmentRef: ceph-network

  os:
    provided: false
    installProfileRef: rhel-ceph-node

    install:
      hostKeyRef: storage-b-01-host-key

  network:
    configRef: ceph-network
    installAddressRef: ssh

    addresses:
      - name: fqdn
        address: storage-b-01.example.com

      - name: ssh
        address: 198.51.100.64
        interface: bond0.200

      - name: cluster
        address: 203.0.113.4
        interface: bond0.300

    overrides: {}

  hardware:
    nics:
      - name: nic0
      - name: nic1
      - name: nic2
      - name: nic3
