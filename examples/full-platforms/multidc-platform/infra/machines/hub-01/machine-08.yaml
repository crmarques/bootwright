apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: hub-multidc-01-worker-02

spec:
  site: site-a

  hardware:
    providerRef: kubevirt-ocp-multidc-01
    profileRef: general

    nics:
      - name: primary
        segmentRef: hub-vm-machine

      - name: ceph-public
        segmentRef: hub-vm-ceph-public

  os:
    clusterInstalled: {}

  network:
    configRef: hub-vm-network
    installAddressRef: ip

    addresses:
      - name: fqdn
        address: hub-multidc-01-worker-02.example.com

      - name: ip
        address: 192.0.2.17
        interface: primary

      - name: ceph-public
        address: 198.51.100.35
        interface: ceph-public

    overrides: {}
