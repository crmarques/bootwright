apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: edge-b-02

  labels:
    datacenter: site-b

spec:
  site: site-b

  hardware:
    providerRef: bare-metal

    bmc:
      address: https://bmc-edge-b-02.example.com/redfish/v1/Systems/1
      credentialsRef: ocp-bmc-credentials

      virtualMedia:
        tls:
          trust: established

    nics:
      - name: eth0
        macAddress: 02:00:00:00:00:20
        segmentRef: ocp-bare-metal-network

      - name: eth2
        macAddress: 02:00:00:00:00:21
        segmentRef: ocp-bare-metal-network

    rootDisk:
      wwn: "0x500000000000f105"

  os:
    clusterInstalled: {}

  network:
    configRef: ocp-bare-metal-network
    installAddressRef: ip

    addresses:
      - name: fqdn
        address: edge-b-02.example.com

      - name: ip
        address: 192.0.2.134
        interface: bond0.100

      - name: ceph-public
        address: 198.51.100.25
        interface: bond0.200

    overrides: {}
