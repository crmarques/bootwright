apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: edge-b-03

  labels:
    datacenter: site-b

spec:
  placement:
    site: site-b

  substrate:
    providerRef: bare-metal

    baremetal:
      rootDevice:
        wwn: "0x500000000000f106"

      bmc:
        address: https://bmc-edge-b-03.example.com/redfish/v1/Systems/1
        protocol: redfish
        credentialsRef: ocp-bmc-credentials

        tls:
          verify: true

        virtualMedia:
          tls:
            trust: established

      nics:
        - nicRef: eth0
          macAddress: 02:00:00:00:00:22
          segmentRef: ocp-bare-metal-network

        - nicRef: eth2
          macAddress: 02:00:00:00:00:23
          segmentRef: ocp-bare-metal-network

  os:
    provided: false

  network:
    configRef: ocp-bare-metal-network
    installAddressRef: ip

    addresses:
      - name: fqdn
        address: edge-b-03.example.com

      - name: ip
        address: 192.0.2.135/24
        interface: bond0.100

      - name: ceph-public
        address: 198.51.100.26/25
        interface: bond0.200

    overrides: {}

  hardware:
    nics:
      - name: eth0
      - name: eth2
