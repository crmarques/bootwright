apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: hub-multidc-02-master-02

spec:
  placement:
    site: site-b

  substrate:
    providerRef: kubevirt-ocp-multidc-02

    kubevirt:
      profileRef: general

      nics:
        - nicRef: primary
          segmentRef: hub-vm-machine

        - nicRef: ceph-public
          segmentRef: hub-vm-ceph-public

  hardware:
    nics:
      - name: primary
      - name: ceph-public

  os:
    provided: false

  network:
    configRef: hub-vm-network
    installAddressRef: ip

    addresses:
      - name: fqdn
        address: hub-multidc-02-master-02.example.com

      - name: ip
        address: 192.0.2.144/24
        interface: primary

      - name: ceph-public
        address: 198.51.100.42/25
        interface: ceph-public

    overrides: {}
