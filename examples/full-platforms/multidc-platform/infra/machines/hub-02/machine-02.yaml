apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: hub-multidc-02-infra-02

spec:
  site: site-b

  hardware:
    providerRef: kubevirt-ocp-multidc-02
    profileRef: large

    nics:
      - name: primary
        segmentRef: hub-vm-machine

      - name: ceph-public
        segmentRef: hub-vm-ceph-public

  os:
    clusterInstalled: {}

  network:
    configRef: hub-vm-network
    installAddressRef: ip

    addresses:
      - name: fqdn
        address: hub-multidc-02-infra-02.example.com

      - name: ip
        address: 192.0.2.150
        interface: primary

      - name: ceph-public
        address: 198.51.100.48
        interface: ceph-public

    overrides: {}
