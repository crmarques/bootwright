# An authored add-on targeting the custom-package lifecycle of B90
# (specs/milestones/m4.md#b90): it validates, but a binding that selects it
# refuses until B90 lands, and its subscription defaults are not the package
# Subscription rules.
apiVersion: bootwright.io/v1alpha1
kind: ClusterAddon
metadata:
  name: nmstate

spec:
  provides:
    - nmstate

  requires: []
  inputs: []

  olm:
    namespace:
      name: openshift-nmstate
      management: managed
      labels: {}

    operatorGroup:
      name: openshift-nmstate

      targetNamespaces:
        - openshift-nmstate

    subscription:
      name: kubernetes-nmstate-operator
      package: kubernetes-nmstate-operator
      channel: stable
      source: redhat-operators
      sourceNamespace: openshift-marketplace
      installPlanApproval: Automatic

    customResources:
      - apiVersion: nmstate.io/v1
        kind: NMState
        metadata:
          name: nmstate

  readiness:
    timeout: 30m

    checks:
      - csvSucceeded:
          namespace: openshift-nmstate
          subscription: kubernetes-nmstate-operator

      - resourceExists:
          apiVersion: nmstate.io/v1
          kind: NMState
          name: nmstate

      - condition:
          apiVersion: apps/v1
          kind: Deployment
          namespace: openshift-nmstate
          name: nmstate-webhook

          condition:
            type: Available
            status: "True"

  steps: []
