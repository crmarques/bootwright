apiVersion: bootwright.io/v1alpha1
kind: ClusterAddon
metadata:
  name: openshift-gitops
spec:
  type: olm

  olm:
    namespace:
      name: openshift-gitops-operator
      create: true
    operatorGroup:
      name: openshift-gitops-operator
    subscription:
      name: openshift-gitops-operator
      package: openshift-gitops-operator
      channel: latest
      source: redhat-operators

