apiVersion: bootwright.io/v1alpha1
kind: InfraProvider
metadata:
  name: baremetal-provider
spec:
  type: baremetal

  bareMetal:
    boot:
      method: external

  networkAttachments:

  - name: metal-net
    bareMetal:
      vlan: 0

  - name: dc1-net
    bareMetal:
      vlan: 0

  - name: dc2-net
    bareMetal:
      vlan: 0
