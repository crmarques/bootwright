apiVersion: bootwright.io/v1alpha1
kind: ContainerCluster
metadata:
  name: metal-ocp
spec:
  distribution:
    release:
      version: 4.21.15

  install:
    endpoints:
      api:
        address: 192.168.150.10
        source:
          type: external
      ingress:
        address: 192.168.150.11
        source:
          type: external
    artifactAccess:
      serverRef:
        name: default
      redfishVirtualMedia:
        endpointRef:
          name: bmc
    nodeSSH:
      keyPairRef:
        name: metal-ocp-cluster-admin-ssh-key

  nodes:

  - hostname: master-0
    role: master
    machineRef:
      name: metal-master-0
