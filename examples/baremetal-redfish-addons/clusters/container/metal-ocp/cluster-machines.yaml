apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: metal-master-0
spec:
  capabilities:
    - openshift-node

  substrate:
    providerRef:
      name: baremetal-provider

  os:
    install:
      rootDeviceHints:
        deviceName: /dev/sda
    provided: false

  network:
    config:
      networkConfigRef:
        name: metal-net
      attachmentRef:
        name: metal-net
      overrides:
        interfaces:
          - name: primary
            ipv4:
              address:
                - ip: 192.168.150.20
                  prefix-length: 24
    interfaceBinding:
      - nicRef:
          name: primary
        interfaceName: primary

  hardware:
    nics:
      - name: primary
        macAddress: 52:54:00:50:10:10
    management:
      bmc:
        address: redfish-virtualmedia+https://bmc-metal-master-0.bootwright.test/redfish/v1/Systems/1
        credentialsRef:
          name: bmc-credentials
        disableCertificateVerification: true # lab-only; use trusted BMC TLS in production
    boot:
      nicRef:
        name: primary

  addresses:
    - name: ip
      address: 192.168.150.20
