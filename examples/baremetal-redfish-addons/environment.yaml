apiVersion: bootwright.io/v1alpha1
kind: Environment
metadata:
  name: baremetal-redfish-addons
spec:
  baseDomain: bootwright.test

  defaults:
    artifactServerRef: default

  resources:
    - secrets.yaml
    - infra
    - clusters
    - add-ons

  infraComponents:
    artifactServers:
      - name: default
        management: managed
        componentRef: artifact-server
