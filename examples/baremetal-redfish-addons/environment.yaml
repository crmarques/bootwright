apiVersion: bootwright.io/v1alpha1
kind: Environment
metadata:
  name: baremetal-redfish-addons
spec:
  baseDomain: bootwright.test

  resources:
    - infra
    - clusters
    - add-ons

  secrets:
    - openshift-pull-secret
    - metal-ocp-cluster-admin-ssh-key:
        generated:
          sshKeyPair:
            comment: bootwright-metal-ocp-cluster-admin
    - provider-host-ssh:
        file: ~/.ssh/bootwright-ssh-key
    - provider-host-known-hosts
    - bmc-credentials

  infraComponents:
    artifactServers:
      - name: default
        type: managed
        componentRef:
          name: artifact-server
