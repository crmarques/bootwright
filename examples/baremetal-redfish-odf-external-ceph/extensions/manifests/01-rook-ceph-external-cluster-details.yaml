apiVersion: v1
kind: Secret
metadata:
  name: rook-ceph-external-cluster-details
  namespace: openshift-storage
  annotations:
    bootwright.io/example-data: fake-external-ceph-details
type: Opaque
stringData:
  # Replace the placeholder values in this JSON with values from the external
  # Ceph cluster. The surrounding Secret shape is the supported
  # Data Foundation external-mode handoff to the operator.
  external_cluster_details: |
    [
      {
        "name": "rook-ceph-mon-endpoints",
        "kind": "ConfigMap",
        "data": {
          "data": "ceph-mon-a=REPLACE_WITH_MON_A_IP:6789,ceph-mon-b=REPLACE_WITH_MON_B_IP:6789,ceph-mon-c=REPLACE_WITH_MON_C_IP:6789",
          "maxMonId": "2",
          "mapping": "{}"
        }
      },
      {
        "name": "rook-ceph-mon",
        "kind": "Secret",
        "data": {
          "admin-secret": "REPLACE_WITH_ADMIN_SECRET",
          "fsid": "REPLACE_WITH_CEPH_FSID",
          "mon-secret": "REPLACE_WITH_MON_SECRET"
        }
      },
      {
        "name": "rook-ceph-operator-creds",
        "kind": "Secret",
        "data": {
          "userID": "REPLACE_WITH_HEALTHCHECK_USER",
          "userKey": "REPLACE_WITH_HEALTHCHECK_KEY"
        }
      },
      {
        "name": "rook-csi-rbd-node",
        "kind": "Secret",
        "data": {
          "userID": "csi-rbd-node",
          "userKey": "REPLACE_WITH_RBD_NODE_KEY"
        }
      },
      {
        "name": "ceph-rbd",
        "kind": "StorageClass",
        "data": {
          "pool": "REPLACE_WITH_RBD_DATA_POOL"
        }
      },
      {
        "name": "monitoring-endpoint",
        "kind": "CephCluster",
        "data": {
          "MonitoringEndpoint": "REPLACE_WITH_MGR_PROMETHEUS_IP",
          "MonitoringPort": "REPLACE_WITH_MGR_PROMETHEUS_PORT"
        }
      },
      {
        "name": "rook-ceph-dashboard-link",
        "kind": "Secret",
        "data": {
          "userID": "ceph-dashboard-link",
          "userKey": "REPLACE_WITH_DASHBOARD_LINK_KEY"
        }
      },
      {
        "name": "rook-csi-rbd-provisioner",
        "kind": "Secret",
        "data": {
          "userID": "csi-rbd-provisioner",
          "userKey": "REPLACE_WITH_RBD_PROVISIONER_KEY"
        }
      },
      {
        "name": "rook-csi-cephfs-provisioner",
        "kind": "Secret",
        "data": {
          "adminID": "csi-cephfs-provisioner",
          "adminKey": "REPLACE_WITH_CEPHFS_PROVISIONER_KEY"
        }
      },
      {
        "name": "rook-csi-cephfs-node",
        "kind": "Secret",
        "data": {
          "adminID": "csi-cephfs-node",
          "adminKey": "REPLACE_WITH_CEPHFS_NODE_KEY"
        }
      },
      {
        "name": "cephfs",
        "kind": "StorageClass",
        "data": {
          "fsName": "REPLACE_WITH_CEPHFS_FILESYSTEM",
          "pool": "REPLACE_WITH_CEPHFS_DATA_POOL"
        }
      },
      {
        "name": "ceph-rgw",
        "kind": "StorageClass",
        "data": {
          "endpoint": "REPLACE_WITH_RGW_HOST_OR_IP:REPLACE_WITH_RGW_PORT",
          "poolPrefix": "REPLACE_WITH_RGW_POOL_PREFIX"
        }
      },
      {
        "name": "rgw-admin-ops-user",
        "kind": "Secret",
        "data": {
          "accessKey": "REPLACE_WITH_RGW_ACCESS_KEY",
          "secretKey": "REPLACE_WITH_RGW_SECRET_KEY"
        }
      }
    ]
