apiVersion: bootwright.io/v1alpha1
kind: StorageClusterBinding
metadata:
  name: ceph-stretch-data-foundation
spec:
  storageExportRef:
    name: odf-external-ceph

  clusterSelector:
    names:
      - dc1-ocp
      - dc2-ocp

  dataFoundation:
    product: ibm-fusion-data-foundation
    namespace: openshift-storage
    storageClusterName: ocs-external-storagecluster
    storageSystemName: ocs-external-storagecluster-storagesystem
