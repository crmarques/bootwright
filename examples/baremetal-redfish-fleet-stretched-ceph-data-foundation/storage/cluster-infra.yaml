apiVersion: bootwright.io/v1alpha1
kind: ClusterInfra
metadata:
  name: ceph-stretch-infra
spec:
  platform:
    type: baremetal
    baremetal:
      provisioningNetwork: disabled

  components:
    machines:
      - name: ceph-dc1-0
        from:
          provider: stretched-baremetal-provider
          name: ceph-dc1-0
        networkConfig:
          ref:
            name: stretched-lab-dc1-net
          addresses:
            - interface: primary
              ipv4:
                - ip: 192.168.141.30
                  prefix-length: 24
      - name: ceph-dc1-1
        from:
          provider: stretched-baremetal-provider
          name: ceph-dc1-1
        networkConfig:
          ref:
            name: stretched-lab-dc1-net
          addresses:
            - interface: primary
              ipv4:
                - ip: 192.168.141.31
                  prefix-length: 24
      - name: ceph-dc1-2
        from:
          provider: stretched-baremetal-provider
          name: ceph-dc1-2
        networkConfig:
          ref:
            name: stretched-lab-dc1-net
          addresses:
            - interface: primary
              ipv4:
                - ip: 192.168.141.32
                  prefix-length: 24
      - name: ceph-dc2-0
        from:
          provider: stretched-baremetal-provider
          name: ceph-dc2-0
        networkConfig:
          ref:
            name: stretched-lab-dc2-net
          addresses:
            - interface: primary
              ipv4:
                - ip: 192.168.142.30
                  prefix-length: 24
      - name: ceph-dc2-1
        from:
          provider: stretched-baremetal-provider
          name: ceph-dc2-1
        networkConfig:
          ref:
            name: stretched-lab-dc2-net
          addresses:
            - interface: primary
              ipv4:
                - ip: 192.168.142.31
                  prefix-length: 24
      - name: ceph-dc2-2
        from:
          provider: stretched-baremetal-provider
          name: ceph-dc2-2
        networkConfig:
          ref:
            name: stretched-lab-dc2-net
          addresses:
            - interface: primary
              ipv4:
                - ip: 192.168.142.32
                  prefix-length: 24
      - name: ceph-arbiter
        from:
          provider: stretched-baremetal-provider
          name: ceph-arbiter
        networkConfig:
          ref:
            name: stretched-lab-dc3-net
          addresses:
            - interface: primary
              ipv4:
                - ip: 192.168.143.30
                  prefix-length: 24
