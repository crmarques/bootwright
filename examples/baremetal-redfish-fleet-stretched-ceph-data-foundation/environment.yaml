apiVersion: bootwright.io/v1alpha1
kind: Environment
metadata:
  name: stretched-ceph-data-foundation
spec:
  baseDomain: example.test

  resources:
    - shared/hosts.yaml
    - shared/networks.yaml
    - shared/provider.yaml
    - shared/infra-component.yaml
    - storage/cluster-infra.yaml
    - storage/storage-cluster.yaml
    - storage/storage-placement-policy.yaml
    - storage/storage-pools.yaml
    - storage/storage-filesystem.yaml
    - storage/storage-object-gateway.yaml
    - storage/storage-export.yaml
    - storage/storage-cluster-binding.yaml
    - clusters/dc1-ocp/cluster-infra.yaml
    - clusters/dc1-ocp/container-cluster.yaml
    - clusters/dc2-ocp/cluster-infra.yaml
    - clusters/dc2-ocp/container-cluster.yaml
    - extensions/cluster-extension-binding.yaml
    - extensions/cluster-extension-fusion-data-foundation-catalog.yaml
    - extensions/cluster-extension-fusion-data-foundation-operator.yaml
    - extensions/cluster-extension-set.yaml

  secrets:
    openshift-pull-secret: null
    cluster-admin-ssh-key:
      generated:
        sshKeyPair:
          type: ed25519
          comment: bootwright-cluster-admin
    provider-host-ssh:
      file: ~/.ssh/bootwright-ssh-key
    bmc-credentials:
      generated:
        credentials:
          username: admin
    ceph-node-ssh:
      file: ~/.ssh/bootwright-ceph-node
    cephadm-cluster-ssh:
      generated:
        sshKeyPair:
          type: ed25519
          comment: bootwright-cephadm

  infraComponents:
    artifactServers:
      - name: default
        type: managed
        default: true
        componentRef:
          name: artifact-server
        routes:
          redfishVirtualMedia:
            endpoint: bmc
          clusterInstall:
            endpoint: cluster
