apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: compact-02

spec:
  hardware:
    providerRef: lab-libvirt
    profileRef: compact

    nics:
      - name: enp1s0

  os:
    clusterInstalled: {}

  network:
    configRef: lab-guests
    installAddressRef: ip

    addresses:
      - name: fqdn
        address: compact-02.lab.example.test

      - name: ip
        address: 198.51.100.22
        interface: enp1s0
