apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: compact-03

spec:
  substrate:
    providerRef: lab-libvirt
    libvirt:
      profileRef: compact

  hardware:
    nics:
      - name: enp1s0

    rootDevice:
      deviceName: /dev/vda

  os:
    provided: false

  network:
    configRef: lab-guests
    installAddressRef: ip

    addresses:
      - name: fqdn
        address: compact-03.lab.example.test

      - name: ip
        address: 198.51.100.23
        interface: enp1s0
