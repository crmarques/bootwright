apiVersion: bootwright.io/v1alpha1
kind: ClusterAddon
metadata:
  name: widgets

spec:
  olm:
    namespace:
      name: example-operator

    operatorGroup: {}

    # Illustrative catalog: replace the image with the digest-pinned catalog
    # that serves your operator.
    catalogSource:
      name: example-catalog
      image: registry.example.test/example-operator/catalog@sha256:1111111111111111111111111111111111111111111111111111111111111111
      priority: -200

    # Illustrative channel and CSV: replace them with the pair your catalog serves.
    subscription:
      package: example-operator
      channel: example-channel
      startingCSV: example-operator.v0.0.0

    customResources:
      - gate:
          - resourceExists:
              apiVersion: apiextensions.k8s.io/v1
              kind: CustomResourceDefinition
              name: widgets.example.test
        resource:
          apiVersion: example.test/v1
          kind: Widget
          metadata:
            name: example
            namespace: example-operator
          spec:
            size: 1
