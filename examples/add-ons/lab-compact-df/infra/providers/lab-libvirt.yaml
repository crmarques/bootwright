apiVersion: bootwright.io/v1alpha1
kind: InfraProvider
metadata:
  name: lab-libvirt

spec:
  libvirt:
    capacityReserve:
      cpu: 4
      memoryMiB: 8192
      diskGiB: 40

    machineRef: controller

    bmcEmulation:
      bindAddress: 127.0.0.1
      port: 8000
      certificateRef: lab-bmc-tls

      auth:
        credentialsRef: lab-bmc-credentials

    machineProfiles:
      - name: compact
        cpu: 6
        memoryMiB: 16384
        diskGiB: 120
        tpm: {}

      - name: rhel
        cpu: 4
        memoryMiB: 13312
        diskGiB: 60
        tpm: {}

        dataDisks:
          - name: ceph-data
            sizeGiB: 80
            media: ssd

  networkAttachments:
    - name: lab-guests

      libvirt:
        bridge: virbr-lab
        management: managed
        address: 198.51.100.1/24
        forward: nat
