apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: nv-vlan

spec:
  hardware:
    providerRef: lab-libvirt
    profileRef: rhel

    nics:
      - name: nic0
        segmentRef: nv-trunk

  os:
    install:
      profileRef: rhel-9-8

      ntp:
        - serverRef: lab-ntp
          endpointRef: ip

  network:
    configRef: nv-vlan
    installAddressRef: ip

    addresses:
      - name: fqdn
        address: nv-vlan.lab.example.test

      - name: ip
        address: 198.51.100.71
        interface: nic0.120

      - name: guest
        address: 203.0.113.12
        interface: nic0.140

    overrides:
      interfaces:
        - name: nic0.140
          mtu: 1400
