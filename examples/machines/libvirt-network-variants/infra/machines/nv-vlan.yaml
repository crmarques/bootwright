apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: nv-vlan

spec:
  substrate:
    providerRef: lab-libvirt
    profileRef: rhel

  os:
    provided: false
    installProfileRef: rhel-9-8

    install:
      rootDeviceHints:
        deviceName: /dev/vda

      ntp:
        - serverRef: lab-ntp
          endpointRef: ip

  network:
    configRef: nv-vlan
    attachmentRef: nv-trunk
    installAddressRef: ip

    addresses:
      - name: fqdn
        address: nv-vlan.lab.example.test

      - name: ip
        address: 198.51.100.71/26
        interface: nic0.120

      - name: guest
        address: 203.0.113.12/24
        interface: nic0.140

    overrides:
      interfaces:
        - name: nic0.140
          mtu: 1400
