apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: nv-bond

spec:
  substrate:
    providerRef: lab-libvirt
    libvirt:
      profileRef: rhel

  hardware:
    rootDevice:
      deviceName: /dev/vda

  os:
    provided: false
    installProfileRef: rhel-9-8

    install:
      ntp:
        - serverRef: lab-ntp
          endpointRef: ip

  network:
    configRef: nv-bond
    attachmentRef: nv-lab
    installAddressRef: ip

    addresses:
      - name: fqdn
        address: nv-bond.lab.example.test

      - name: ip
        address: 198.51.100.11/26
        interface: bond0

      - name: guest
        address: 203.0.113.11/24
        interface: bond0.140

    overrides:
      interfaces:
        - name: bond0.140
          mtu: 1400
