apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: nv-bond

spec:
  hardware:
    providerRef: lab-libvirt
    profileRef: rhel

    nics:
      - name: nic0
        segmentRef: nv-lab

      - name: nic1
        segmentRef: nv-lab

  os:
    install:
      profileRef: rhel-9-8

      ntp:
        - serverRef: lab-ntp
          endpointRef: ip

  network:
    configRef: nv-bond
    installAddressRef: ip

    addresses:
      - name: fqdn
        address: nv-bond.lab.example.test

      - name: ip
        address: 198.51.100.11
        interface: bond0

      - name: guest
        address: 203.0.113.11
        interface: bond0.140

    overrides:
      interfaces:
        - name: bond0.140
          mtu: 1400
