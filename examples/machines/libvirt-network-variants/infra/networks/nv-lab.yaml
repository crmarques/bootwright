apiVersion: bootwright.io/v1alpha1
kind: Network
metadata:
  name: nv-lab

spec:
  provided: false
  description: The untagged network lab-libvirt defines on its host.

  ipv4:
    cidr: 198.51.100.0/26
    gateway: 198.51.100.1

  libvirt:
    providerRef: lab-libvirt
    bridge: virbr-nv

    taggedNetworkRefs:
      - nv-guest
