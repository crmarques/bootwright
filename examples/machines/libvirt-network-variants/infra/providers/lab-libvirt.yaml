apiVersion: bootwright.io/v1alpha1
kind: InfraProvider
metadata:
  name: lab-libvirt

spec:
  libvirt:
    machineRef: controller
    uri: qemu:///system

    bmcEmulationDefaults:
      enabled: true
      protocol: redfish
      emulator: sushy-tools
      bindAddress: 127.0.0.1
      port: 8000
      certificateRef: lab-bmc-tls

      auth:
        credentialsRef: lab-bmc-credentials

    machineProfiles:
      - name: rhel
        cpu: 4
        memoryMiB: 8192
        diskGiB: 60
        tpm: {}

  networkAttachments:
    - name: nv-lab

      libvirt:
        bridge: virbr-nv
        management: managed
        address: 198.51.100.1/26
        forward: nat

    - name: nv-trunk

      libvirt:
        bridge: br-nv
        management: external
