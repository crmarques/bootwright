apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: rhel-02

spec:
  hardware:
    providerRef: lab-libvirt
    profileRef: rhel

    nics:
      - name: enp1s0

  os:
    install:
      profileRef: rhel-9-8

      ntp:
        - serverRef: lab-ntp
          endpointRef: ip

  network:
    configRef: lab-guests
    installAddressRef: ip

    addresses:
      - name: fqdn
        address: rhel-02.lab.example.test

      - name: ip
        address: 198.51.100.12
        interface: enp1s0
