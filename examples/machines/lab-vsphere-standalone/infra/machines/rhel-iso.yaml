apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: rhel-iso

spec:
  hardware:
    providerRef: vcenter
    profileRef: iso

    nics:
      - name: ens192
        segmentRef: guests

  os:
    install:
      profileRef: rhel-iso-profile
      hostKeyRef: rhel-iso-host-key

  network:
    configRef: lab-guests
    installAddressRef: ip

    addresses:
      - name: ip
        address: 198.51.100.11
        interface: ens192
