apiVersion: bootwright.io/v1alpha1
kind: NetworkConfig
metadata:
  name: lab-guests

spec:
  nmstate:
    interfaces:
      - name: ens192
        type: ethernet
        state: up
        mtu: 1500

        ipv4:
          enabled: true
          dhcp: false

        ipv6:
          enabled: false

    dns-resolver:
      config:
        search:
          - lab.example.test

    routes:
      config:
        - destination: 0.0.0.0/0
          next-hop-address: 198.51.100.1
          next-hop-interface: ens192
          table-id: 254
          metric: 100
