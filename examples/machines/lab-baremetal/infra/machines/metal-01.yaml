apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: metal-01

spec:
  substrate:
    providerRef: lab-metal

    baremetal:
      bmc:
        address: https://bmc-01.metal.example.test/redfish/v1/Systems/1

      nics:
        - nicRef: eno1
          macAddress: 52:54:00:9a:1b:01

      # Proved before media is inserted: the installation refuses a machine
      # whose BMC does not report these, and never changes them.
      firmware:
        mode: prove
        secureBoot: true
        bootMode: UEFI

  os:
    provided: false
    installProfileRef: rhel-9-8

    install:
      # The key this machine's installation delivers, so completion is proved
      # against a key known before the machine is ever contacted.
      hostKeyRef: metal-01-host-key

  hardware:
    nics:
      - name: eno1

    rootDevice:
      deviceName: /dev/disk/by-id/wwn-0x5000c500a1b2c301

  network:
    configRef: lab-metal
    installAddressRef: ip

    addresses:
      - name: ip
        address: 198.51.100.11/24
        interface: eno1
