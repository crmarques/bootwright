apiVersion: bootwright.io/v1alpha1
kind: Environment
metadata:
  name: lab-rhel-external-services

spec:
  domains:
    base: lab.example.test

  controller:
    machineRef: controller

  remoteMachinesAccessKey:
    keyRef: bootwright-machine-key

  defaults:
    MachineInstallProfile:
      proxy:
        proxyRef: lab-proxy

        noProxy:
          - localhost
          - 127.0.0.1
          - .lab.example.test
          - 192.0.2.0/24
          - 198.51.100.0/24

      ntp:
        - serverRef: lab-ntp

    NetworkConfig:
      dns:
        - serverRef: lab-dns
