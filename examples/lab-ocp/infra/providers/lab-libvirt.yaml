apiVersion: bootwright.io/v1alpha1
kind: InfraProvider
metadata:
  name: lab-libvirt

spec:
  libvirt:
    machineRef: controller
    uri: qemu:///system

    bmcEmulationDefaults:
      enabled: true
      protocol: redfish
      emulator: sushy-tools
      bindAddress: 192.0.2.1
      port: 8000
      vMediaPort: 8001
      auth:
        credentialsRef: lab-bmc-credentials

    machineProfiles:
      - name: sno
        cpu: 8
        memoryMiB: 16384
        diskGiB: 120
        tpm: {}

  networkAttachments:
    - name: lab-network
      libvirt:
        bridge: virbr-lab
