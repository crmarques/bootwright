apiVersion: bootwright.io/v1alpha1
kind: NetworkConfig
metadata:
  name: lab-network

spec:
  machineNetwork:
    - cidr: 192.0.2.0/24

  dns:
    - serverRef: lab-dns
      endpointRef: ip

  nmstate:
    interfaces:
      - name: enp1s0
        type: ethernet
        state: up
        mtu: 1500
        ipv4:
          enabled: true
          dhcp: false
        ipv6:
          enabled: false
    dns-resolver:
      config:
        search:
          - lab.example.test
    routes:
      config:
        - destination: 0.0.0.0/0
          next-hop-address: 192.0.2.1
          next-hop-interface: enp1s0
          table-id: 254
          metric: 100
