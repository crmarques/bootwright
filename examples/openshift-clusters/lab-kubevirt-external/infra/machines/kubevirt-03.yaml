apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: kubevirt-03

spec:
  hardware:
    providerRef: lab-kubevirt
    profileRef: kubevirt

    nics:
      - name: eth0

  os:
    clusterInstalled: {}

  network:
    configRef: lab-guests
    installAddressRef: ip

    addresses:
      - name: fqdn
        address: kubevirt-03.lab.example.test

      - name: ip
        address: 198.51.100.23
        interface: eth0
