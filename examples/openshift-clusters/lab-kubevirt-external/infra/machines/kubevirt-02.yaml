apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: kubevirt-02

spec:
  substrate:
    providerRef: lab-kubevirt
    kubevirt:
      profileRef: kubevirt

  hardware:
    nics:
      - name: eth0

    rootDevice:
      deviceName: /dev/vda

  os:
    provided: false

  network:
    configRef: lab-guests
    installAddressRef: ip

    addresses:
      - name: fqdn
        address: kubevirt-02.lab.example.test

      - name: ip
        address: 198.51.100.22
        interface: eth0
