apiVersion: bootwright.io/v1alpha1
kind: InfraProvider
metadata:
  name: lab-metal

spec:
  baremetal:

    defaults:
      bmc:
        credentialsRef: lab-bmc-credentials

        tls:
          trustBundleRef: lab-bmc-ca

  segments:
    - name: lab-metal
      untaggedNetworkRef: lab-metal
      baremetal: {}
