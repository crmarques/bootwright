apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: physical-01

spec:
  hardware:
    providerRef: lab-metal

    bmc:
      address: https://bmc-01.example.test/redfish/v1/Systems/1

      tls:
        trustBundleRef: physical-01-bmc-trust
        verification: certificate

    nics:
      - name: eno1
        macAddress: 52:54:00:9a:1b:01

    rootDisk:
      serialNumber: "EXAMPLE-PHYSICAL-01-ROOT"
      sizeBytes: 480103981056

  os:
    clusterInstalled: {}

  network:
    configRef: lab-metal
    installAddressRef: ip

    addresses:
      - name: fqdn
        address: physical-01.lab.example.test

      - name: ip
        address: 198.51.100.21
        interface: eno1
