apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: physical-02

spec:
  hardware:
    providerRef: lab-metal

    bmc:
      address: https://bmc-02.example.test/redfish/v1/Systems/1

    nics:
      - name: eno1
        macAddress: 52:54:00:9a:1b:02

    rootDisk:
      wwn: "0x500000000000f002"

  os:
    clusterInstalled: {}

  network:
    configRef: lab-metal
    installAddressRef: ip

    addresses:
      - name: fqdn
        address: physical-02.lab.example.test

      - name: ip
        address: 198.51.100.22
        interface: eno1
