apiVersion: bootwright.io/v1alpha1
kind: OpenShiftCluster
metadata:
  name: physical

spec:
  distribution:
    type: openshift

    release:
      version: 4.21.15

  install:
    mode: connected

    endpoints:
      api:
        address: 198.51.100.10

        source:
          type: installer

      ingress:
        address: 198.51.100.11

        source:
          type: installer

    agent:
      redfishVirtualMedia:
        artifactServerEndpoint:
          serverRef: lab-artifacts
          endpointRef: ip-https

    # pullSecretRef and nodeSSH take their conventional values, the Secrets
    # openshift-pull-secret and physical-cluster-admin-ssh-key.

    ntp:
      - serverRef: lab-ntp
        endpointRef: ip

  nodes:
    - name: master-0
      role: controlPlane
      machineRef: physical-01

    - name: master-1
      role: controlPlane
      machineRef: physical-02

    - name: master-2
      role: controlPlane
      machineRef: physical-03

    - name: worker-0
      role: worker
      machineRef: physical-04

    - name: worker-1
      role: worker
      machineRef: physical-05
