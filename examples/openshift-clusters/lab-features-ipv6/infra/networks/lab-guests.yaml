apiVersion: bootwright.io/v1alpha1
kind: Network
metadata:
  name: lab-guests

spec:
  provided: false
  description: The IPv6-only guest network lab-libvirt defines on its host.

  ipv6:
    cidr: 2001:db8:2::/64
    gateway: 2001:db8:2::1

  libvirt:
    providerRef: lab-libvirt
    bridge: virbr-lab
    forward: none
