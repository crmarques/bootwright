apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: features-03

spec:
  hardware:
    providerRef: lab-libvirt
    profileRef: master

    nics:
      - name: enp1s0

  os:
    clusterInstalled: {}

  network:
    configRef: lab-guests
    installAddressRef: ip

    addresses:
      - name: fqdn
        address: features-03.lab.example.test

      - name: ip
        address: 2001:db8:2::23
        interface: enp1s0
