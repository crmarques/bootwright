apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: anysize-01

spec:
  hardware:
    providerRef: lab-libvirt
    profileRef: master

    nics:
      - name: enp1s0
        segmentRef: lab-guests

      - name: enp2s0
        segmentRef: lab-guests

      - name: enp3s0
        segmentRef: lab-secondary

  os:
    clusterInstalled: {}

  network:
    configRef: lab-guests
    installAddressRef: ip

    addresses:
      - name: fqdn
        address: anysize-01.lab.example.test

      - name: ip
        address: 198.51.100.21
        interface: bond0
