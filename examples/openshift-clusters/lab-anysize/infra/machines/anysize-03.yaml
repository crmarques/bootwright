apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: anysize-03

spec:
  substrate:
    providerRef: lab-libvirt

    libvirt:
      profileRef: master

      nics:
        - nicRef: enp1s0
          segmentRef: lab-guests

        - nicRef: enp2s0
          segmentRef: lab-guests

        - nicRef: enp3s0
          segmentRef: lab-secondary

  hardware:
    nics:
      - name: enp1s0
      - name: enp2s0
      - name: enp3s0

    rootDevice:
      deviceName: /dev/vda

  os:
    provided: false

  network:
    configRef: lab-guests
    installAddressRef: ip

    addresses:
      - name: fqdn
        address: anysize-03.lab.example.test

      - name: ip
        address: 198.51.100.23/24
        interface: bond0
