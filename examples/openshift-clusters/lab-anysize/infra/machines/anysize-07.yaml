apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: anysize-07

spec:
  hardware:
    providerRef: lab-libvirt
    profileRef: compute

    nics:
      - name: enp1s0
        segmentRef: lab-guests

      - name: enp2s0
        segmentRef: lab-guests

      - name: enp3s0
        segmentRef: lab-secondary

  os:
    clusterInstalled: {}

  network:
    configRef: lab-guests
    installAddressRef: ip

    addresses:
      - name: fqdn
        address: anysize-07.lab.example.test

      - name: ip
        address: 198.51.100.27
        interface: bond0
