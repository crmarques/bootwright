apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: anysize-09

spec:
  substrate:
    providerRef: lab-libvirt

    libvirt:
      profileRef: compute

      interfaceAttachments:
        - interface: enp1s0
          attachmentRef: lab-guests

        - interface: enp2s0
          attachmentRef: lab-guests

        - interface: enp3s0
          attachmentRef: lab-secondary

  hardware:
    rootDevice:
      deviceName: /dev/vda

  os:
    provided: false

  network:
    configRef: lab-guests
    installAddressRef: ip

    addresses:
      - name: fqdn
        address: anysize-09.lab.example.test

      - name: ip
        address: 198.51.100.29/24
        interface: bond0
