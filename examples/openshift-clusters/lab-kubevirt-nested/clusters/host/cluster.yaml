apiVersion: bootwright.io/v1alpha1
kind: OpenShiftCluster
metadata:
  name: host

spec:
  distribution:
    type: openshift

    release:
      version: 4.21.15

  install:
    mode: connected

    endpoints:
      api:
        address: 198.51.100.10

        source:
          type: installer

      ingress:
        address: 198.51.100.11

        source:
          type: installer

    agent:
      redfishVirtualMedia:
        artifactServerEndpoint:
          serverRef: lab-artifacts
          endpointRef: ip-https

    # pullSecretRef and nodeSSH take their conventional values, the Secrets
    # openshift-pull-secret and host-cluster-admin-ssh-key.

    ntp:
      - serverRef: lab-ntp
        endpointRef: ip

  nodes:
    - name: master-0
      role: controlPlane
      machineRef: host-01

    - name: master-1
      role: controlPlane
      machineRef: host-02

    - name: master-2
      role: controlPlane
      machineRef: host-03

  networking:
    # The nested cluster's nodes attach to this network, so the kubevirt
    # instance labels their namespace with its selector.
    secondaryNetworks:
      - name: nested-guests
        topology: Localnet

        uplink:
          bridge: br-nested
          interface: enp2s0

        ipam:
          mode: Disabled

        namespaceSelector:
          matchLabels:
            network.example.test/nested-guests: enabled
