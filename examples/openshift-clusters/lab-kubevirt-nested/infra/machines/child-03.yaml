apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: child-03

spec:
  substrate:
    providerRef: lab-kubevirt-nested
    kubevirt:
      profileRef: kubevirt

  hardware:
    nics:
      - name: eth0

    rootDevice:
      deviceName: /dev/vda

  os:
    provided: false

  network:
    configRef: nested-guests
    installAddressRef: ip

    addresses:
      - name: fqdn
        address: child-03.lab.example.test

      - name: ip
        address: 203.0.113.23/24
        interface: eth0
