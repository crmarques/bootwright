apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: child-03

spec:
  hardware:
    providerRef: lab-kubevirt-nested
    profileRef: kubevirt

    nics:
      - name: eth0

  os:
    clusterInstalled: {}

  network:
    configRef: nested-guests
    installAddressRef: ip

    addresses:
      - name: fqdn
        address: child-03.lab.example.test

      - name: ip
        address: 203.0.113.23
        interface: eth0
