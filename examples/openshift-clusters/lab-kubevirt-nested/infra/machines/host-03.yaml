apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: host-03

spec:
  hardware:
    providerRef: lab-libvirt
    profileRef: master

    nics:
      - name: enp1s0
        segmentRef: lab-guests

      - name: enp2s0
        segmentRef: lab-secondary

      - name: enp3s0
        segmentRef: lab-routed

  os:
    clusterInstalled: {}

  network:
    configRef: lab-guests
    installAddressRef: ip

    addresses:
      - name: fqdn
        address: host-03.lab.example.test

      - name: ip
        address: 198.51.100.23
        interface: enp1s0

      - name: routed
        address: 192.0.2.143
        interface: enp3s0
