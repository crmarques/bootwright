apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: host-02

spec:
  substrate:
    providerRef: lab-libvirt

    libvirt:
      profileRef: master

      nics:
        - nicRef: enp1s0
          segmentRef: lab-guests

        - nicRef: enp2s0
          segmentRef: lab-secondary

        - nicRef: enp3s0
          segmentRef: lab-routed

  hardware:
    nics:
      - name: enp1s0
      - name: enp2s0
      - name: enp3s0

    rootDevice:
      deviceName: /dev/vda

  os:
    provided: false

  network:
    configRef: lab-guests
    installAddressRef: ip

    addresses:
      - name: fqdn
        address: host-02.lab.example.test

      - name: ip
        address: 198.51.100.22/24
        interface: enp1s0

      - name: routed
        address: 192.0.2.142/25
        interface: enp3s0
