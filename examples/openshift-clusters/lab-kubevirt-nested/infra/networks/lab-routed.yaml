apiVersion: bootwright.io/v1alpha1
kind: Network
metadata:
  name: lab-routed

spec:
  provided: false
  description: The routed network lab-libvirt defines on its host.

  ipv4:
    cidr: 192.0.2.128/25

  libvirt:
    providerRef: lab-libvirt
    bridge: virbr-routed
    forward: none
    hostAddress: 192.0.2.129
