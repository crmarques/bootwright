apiVersion: bootwright.io/v1alpha1
kind: InfraProvider
metadata:
  name: lab-libvirt

spec:
  libvirt:
    capacityReserve:
      cpu: 1
      memoryMiB: 2048
      diskGiB: 10

    machineRef: controller

    bmcEmulation:
      bindAddress: 127.0.0.1
      port: 8000
      certificateRef: lab-bmc-tls

      auth:
        credentialsRef: lab-bmc-credentials

    machineProfiles:
      - name: mirror
        cpu: 2
        memoryMiB: 4096
        diskGiB: 40
        tpm: {}

      - name: sno
        cpu: 8
        memoryMiB: 16384
        diskGiB: 120
        tpm: {}
