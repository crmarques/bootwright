apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: mirror

spec:
  hardware:
    providerRef: lab-libvirt
    profileRef: mirror

    nics:
      - name: enp1s0

  os:
    install:
      profileRef: rhel-9-8-mirror

  proxy:
    direct: {}

  network:
    configRef: lab-guests
    installAddressRef: ip

    addresses:
      - name: fqdn
        address: mirror.lab.example.test

      - name: ip
        address: 198.51.100.20
        interface: enp1s0
