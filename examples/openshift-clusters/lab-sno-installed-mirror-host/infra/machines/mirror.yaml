apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: mirror

spec:
  substrate:
    providerRef: lab-libvirt
    libvirt:
      profileRef: mirror

  hardware:
    nics:
      - name: enp1s0

    rootDevice:
      deviceName: /dev/vda

  os:
    provided: false
    installProfileRef: rhel-9-8-mirror

  proxy:
    direct: {}

  network:
    configRef: lab-guests
    installAddressRef: ip

    addresses:
      - name: fqdn
        address: mirror.lab.example.test

      - name: ip
        address: 198.51.100.20
        interface: enp1s0
