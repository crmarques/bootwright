apiVersion: bootwright.io/v1alpha1
kind: ContainerCluster
metadata:
  name: hub-multidc-02

spec:
  distribution:
    type: openshift

    release:
      version: 4.99.0
      channel: stable-4.99

  security:
    fips:
      enabled: true
    diskEncryption:
      unlock:
        tpm2: {}
      roles:
        - master
        - worker
        - infra

  install:
    method: agent
    mode: connected

    platform:
      type: none

    endpoints:
      api:
        address: 192.0.2.141
        source:
          type: external
        interfaceNetworks: []
      api-int:
        address: 192.0.2.141
        source:
          type: external
        interfaceNetworks: []
      ingress:
        address: 192.0.2.142
        source:
          type: external
        interfaceNetworks: []

    pullSecretRef: openshift-pull-secret

    nodeSSH:
      keyPairRef: hub-multidc-02-cluster-admin-ssh-key

    additionalTrustBundleRefs:
      - custom-ca-bundle

  networking:
    clusterNetwork:
      - cidr: 10.132.0.0/14
        hostPrefix: 23
    serviceNetwork:
      - 10.97.0.0/16

  nodes:
    - name: master-01
      role: master
      machineRef: hub-multidc-02-master-01
      fqdn: master-01.hub-multidc-02.clusters.example.com

    - name: master-02
      role: master
      machineRef: hub-multidc-02-master-02
      fqdn: master-02.hub-multidc-02.clusters.example.com

    - name: master-03
      role: master
      machineRef: hub-multidc-02-master-03
      fqdn: master-03.hub-multidc-02.clusters.example.com

    - name: worker-01
      role: worker
      machineRef: hub-multidc-02-worker-01
      fqdn: worker-01.hub-multidc-02.clusters.example.com

    - name: worker-02
      role: worker
      machineRef: hub-multidc-02-worker-02
      fqdn: worker-02.hub-multidc-02.clusters.example.com

    - name: worker-03
      role: worker
      machineRef: hub-multidc-02-worker-03
      fqdn: worker-03.hub-multidc-02.clusters.example.com

    - name: infra-01
      role: infra
      machineRef: hub-multidc-02-infra-01
      fqdn: infra-01.hub-multidc-02.clusters.example.com

    - name: infra-02
      role: infra
      machineRef: hub-multidc-02-infra-02
      fqdn: infra-02.hub-multidc-02.clusters.example.com

    - name: infra-03
      role: infra
      machineRef: hub-multidc-02-infra-03
      fqdn: infra-03.hub-multidc-02.clusters.example.com
