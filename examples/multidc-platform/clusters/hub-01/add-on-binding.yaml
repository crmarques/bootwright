spec:
  clusterRef: hub-multidc-01

  profileRefs:
    - hub-cluster-addons

  addonConfigs:
    - addonRef: fusion-data-foundation
      inputs:
        - name: external-storage
          value: ceph-multidc-01-odf-hub-multidc-01
