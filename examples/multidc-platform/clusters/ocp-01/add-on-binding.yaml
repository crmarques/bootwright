apiVersion: bootwright.io/v1alpha1
kind: ClusterAddonBinding
metadata:
  name: ocp-multidc-01-addons

spec:
  clusterRef: ocp-multidc-01

  profileRefs:
    - physical-cluster-addons

  addonRefs: []

  addonConfigs:
    - addonRef: fusion-data-foundation
      inputs:
        - name: external-storage
          value: ceph-multidc-01-odf-ocp-multidc-01

        - name: ibm-entitlement
          value: ibm-entitlement-key
