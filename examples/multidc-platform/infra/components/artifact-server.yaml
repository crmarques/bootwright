apiVersion: bootwright.io/v1alpha1
kind: InfraComponent
metadata:
  name: artifact-server
spec:
  type: artifactServer

  artifactServer:
    machineRef: bastion

    listeners:
      - name: https
        protocol: https
        port: 9443
      - name: http
        protocol: http
        port: 9080

    endpoints:
      - name: ip-https
        listenerRef: https
        addressRef: ip

      - name: ip-http
        listenerRef: http
        addressRef: ip

      - name: server-name-https
        listenerRef: https
        addressRef: dns-alias

      - name: server-name-http
        listenerRef: http
        addressRef: dns-alias
