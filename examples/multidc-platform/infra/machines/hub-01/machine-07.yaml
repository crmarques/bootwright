apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: hub-multidc-01-worker-01
spec:
  capabilities:
    - openshift-node

  placement:
    site: site-a

  substrate:
    providerRef: kubevirt-ocp-multidc-01
    profileRef: hub-multidc-01-worker

  os:
    provided: false

  addresses:
    - name: ip
      address: 192.0.2.16
    - name: ceph-public
      address: 198.51.100.34

  network:
    config:
      networkConfigRef: hub-vm-network
      interfaceAttachments:
        - interface: primary
          attachmentRef: hub-vm-machine
        - interface: ceph-public
          attachmentRef: hub-vm-ceph-public
      interfaceAddresses:
        - interface: primary
          addressRef: ip
          prefixLength: 24
      overrides:
        interfaces:
          - name: ceph-public
            ipv4:
              address:
                - ip: 198.51.100.34
                  prefix-length: 25
