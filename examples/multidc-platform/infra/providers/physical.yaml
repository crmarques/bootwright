apiVersion: bootwright.io/v1alpha1
kind: InfraProvider
metadata:
  name: bare-metal

spec:
  baremetal:
    boot:
      method: redfishVirtualMedia
    defaults:
      bmc:
        credentialsRef: ocp-bmc-credentials
        tls:
          verify: true
        virtualMedia:
          tls:
            trust: established

  networkAttachments:
    - name: ocp-bare-metal-network
      baremetal: {}

    - name: ceph-network
      baremetal: {}
