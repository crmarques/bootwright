apiVersion: bootwright.io/v1alpha1
kind: InfraProvider
metadata:
  name: kubevirt-ocp-multidc-02
spec:
  type: kubevirt

  kubevirt:
    hostClusterRef: ocp-multidc-02
    namespace: bootwright-multidc-virtual-clusters
    storageClassRef: ocs-external-storagecluster-ceph-rbd

    machineProfiles:
      - name: hub-multidc-02-master
        cpu: 4
        memoryMiB: 16384
        diskGiB: 100
        tpm: {}
      - name: hub-multidc-02-worker
        cpu: 4
        memoryMiB: 16384
        diskGiB: 100
        tpm: {}
      - name: hub-multidc-02-infra
        cpu: 8
        memoryMiB: 32768
        diskGiB: 160
        tpm: {}

  networkAttachments:
    - name: hub-vm-machine
      kubevirt:
        networkRef:
          apiGroup: k8s.ovn.org
          kind: ClusterUserDefinedNetwork
          name: multidc-virtual-cluster-machine
          namespace: bootwright-multidc-virtual-clusters
    - name: hub-vm-ceph-public
      kubevirt:
        networkRef:
          apiGroup: k8s.ovn.org
          kind: ClusterUserDefinedNetwork
          name: multidc-virtual-cluster-ceph-public
          namespace: bootwright-multidc-virtual-clusters
