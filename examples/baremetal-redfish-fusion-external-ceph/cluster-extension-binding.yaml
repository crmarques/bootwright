apiVersion: bootwright.io/v1alpha1
kind: ClusterExtensionBinding
metadata:
  name: demo-ocp-storage-virtualization
spec:
  clusterSelector:
    names:
      - demo-ocp

  applyAfter:
    phase: clusterInstalled

  extensionSets:
    - name: storage-virtualization-platform

  policy:
    prune: false
    serverSideApply: true
    fieldManager: bootwright
    continueOnError: false
