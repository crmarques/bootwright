apiVersion: bootwright.io/v1alpha1
kind: ClusterExtension
metadata:
  name: ibm-fusion-data-foundation-catalog
spec:
  type: manifest-set

  manifestSet:
    manifests:
      - path: manifests/00-isf-data-foundation-catalog.yaml

  readiness:
    timeout: 15m
    checks:
      - type: resourceExists
        apiVersion: operators.coreos.com/v1alpha1
        kind: CatalogSource
        name: isf-data-foundation-catalog
        namespace: openshift-marketplace

      - type: resourceExists
        apiVersion: packages.operators.coreos.com/v1
        kind: PackageManifest
        name: odf-operator
        namespace: openshift-marketplace
