apiVersion: bootwright.io/v1alpha1
kind: ClusterExtension
metadata:
  name: ibm-fusion-data-foundation-external-ceph
spec:
  type: manifest-set

  manifestSet:
    manifests:
      - path: manifests/01-rook-ceph-external-cluster-details.yaml
      - path: manifests/02-ocs-external-storagecluster.yaml
      - path: manifests/03-ocs-external-storagesystem.yaml

  readiness:
    timeout: 60m
    checks:
      - type: resourceExists
        apiVersion: v1
        kind: Secret
        name: rook-ceph-external-cluster-details
        namespace: openshift-storage

      - type: resourceExists
        apiVersion: ocs.openshift.io/v1
        kind: StorageCluster
        name: ocs-external-storagecluster
        namespace: openshift-storage

      - type: resourceExists
        apiVersion: odf.openshift.io/v1alpha1
        kind: StorageSystem
        name: ocs-external-storagecluster-storagesystem
        namespace: openshift-storage

      - type: resourceExists
        apiVersion: storage.k8s.io/v1
        kind: StorageClass
        name: ocs-external-storagecluster-ceph-rbd

      - type: resourceExists
        apiVersion: storage.k8s.io/v1
        kind: StorageClass
        name: ocs-external-storagecluster-cephfs

      - type: resourceExists
        apiVersion: storage.k8s.io/v1
        kind: StorageClass
        name: ocs-external-storagecluster-ceph-rgw

      - type: resourceExists
        apiVersion: storage.k8s.io/v1
        kind: StorageClass
        name: openshift-storage.noobaa.io
