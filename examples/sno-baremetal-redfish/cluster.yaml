apiVersion: bootwright.io/v1alpha1
kind: ContainerCluster
metadata:
  name: sno-baremetal
spec:
  distribution:
    release:
      version: 4.21.15

  install:
    nodeSSH:
      keyPairRef:
        name: sno-baremetal-cluster-admin-ssh-key
    platform:
      type: bareMetal
      baremetal:
        provisioningNetwork: disabled
    endpoints:
      api:
        address: 192.168.140.10
        source:
          type: external
      api-int:
        address: 192.168.140.10
        source:
          type: external
      ingress:
        address: 192.168.140.11
        source:
          type: external
    artifactAccess:
      serverRef:
        name: default
      redfishVirtualMedia:
        endpointRef:
          name: bmc

  networking:
    clusterNetwork:
    - cidr: 10.128.0.0/14
      hostPrefix: 23
    serviceNetwork:
    - 172.30.0.0/16

  nodes:

  - hostname: master-0
    role: master
    machineRef:
      name: rack1-srv1
