apiVersion: bootwright.io/v1alpha1
kind: ContainerCluster
metadata:
  name: sno-baremetal
spec:
  distribution:
    release:
      version: 4.21.15

  networking:
    clusterNetwork:
      - cidr: 10.128.0.0/14
        hostPrefix: 23
    serviceNetwork:
      - 172.30.0.0/16

  nodes:
    - hostname: master-0
      role: master
      machineRef:
        clusterInfra: sno-baremetal
        name: master-0

