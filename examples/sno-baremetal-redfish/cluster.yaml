apiVersion: bootwright.io/v1alpha1
kind: ContainerCluster
metadata:
  name: sno-baremetal
spec:
  distribution:
    release:
      version: 4.21.15

  install:
    nodeSSH:
      keyPairRef: sno-baremetal-cluster-admin-ssh-key
    endpoints:
      # Single-node OpenShift has no load balancer or VIP: the API and ingress
      # are served on the node's own IP (Machine spec.addresses ip), so both
      # endpoints resolve there.
      api:
        address: 192.168.140.20
        source:
          type: external
      ingress:
        address: 192.168.140.20
        source:
          type: external
    agent:
      redfishVirtualMedia:
        artifactServerEndpoint:
          endpointRef: bmc

  hosts:

  - hostname: master-0
    role: master
    machineRef: rack1-srv1
