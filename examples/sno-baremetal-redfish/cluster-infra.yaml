apiVersion: bootwright.io/v1alpha1
kind: ClusterInfra
metadata:
  name: sno-baremetal
spec:
  platform:
    # Installer platform render mode; substrate inventory stays in InfraProvider.
    type: baremetal
    baremetal:
      provisioningNetwork: disabled

  endpoints:
    api:
      address: 192.168.140.10
      source:
        type: external
    api-int:
      address: 192.168.140.10
      source:
        type: external
    apps:
      address: 192.168.140.11
      source:
        type: external

  artifactAccess:
    serverRef:
      name: default
    redfishVirtualMedia:
      endpointRef:
        name: bmc

  components:
    nodes:
      - name: master-0
        source:
          providerRef:
            name: rack1-baremetal-provider
          machineRef:
            name: rack1-srv1
        network:
          networkConfigRef:
            name: rack1-vlan140-machine
          overrides:
            interfaces:
              - name: eno1
                ipv4:
                  address:
                    - ip: 192.168.140.20
                      prefix-length: 24
