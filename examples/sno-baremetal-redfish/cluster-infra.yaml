apiVersion: bootwright.io/v1alpha1
kind: ClusterInfra
metadata:
  name: sno-baremetal
spec:
  platform:
    type: baremetal
    baremetal:
      provisioningNetwork: disabled

  endpoints:
    api:
      address: 192.168.140.10
      source:
        type: external
    api-int:
      address: 192.168.140.10
      source:
        type: external
    apps:
      address: 192.168.140.11
      source:
        type: external

  components:
    machines:
      - name: master-0
        from:
          provider: rack1-baremetal-provider
          name: rack1-srv1
        networkConfig:
          ref:
            name: rack1-vlan140-machine
          addresses:
            - interface: eno1
              ipv4:
                - ip: 192.168.140.20
                  prefix-length: 24
