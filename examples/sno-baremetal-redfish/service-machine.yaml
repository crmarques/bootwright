apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: bastion
spec:
  capabilities:
    - container-runtime

  os:
    provided: true

  addresses:
    - name: ssh
      address: bastion.bootwright.test
    - name: lab-lan
      address: 192.168.140.5

  access:
    ssh:
      addressRef:
        name: ssh
      keyRef:
        name: provider-host-ssh
