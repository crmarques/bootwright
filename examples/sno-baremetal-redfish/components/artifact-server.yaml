apiVersion: bootwright.io/v1alpha1
kind: InfraComponent
metadata:
  name: artifact-server
spec:
  type: artifactServer

  artifactServer:
    retention: install-only
    endpoints:
    - name: bmc
      listenerRef: https
      addressRef: lab-lan
    - name: cluster
      listenerRef: https
      addressRef: lab-lan
    machineRef: bastion
