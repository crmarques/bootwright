apiVersion: bootwright.io/v1alpha1
kind: Environment
metadata:
  name: sno-baremetal-redfish
spec:
  baseDomain: bootwright.test

  defaults:
    artifactAccess:
      serverRef: default
      redfishVirtualMedia:
        endpointRef: bmc

  secrets:
    - openshift-pull-secret
    - sno-baremetal-cluster-admin-ssh-key:
        generated:
          sshKeyPair:
            comment: bootwright-sno-baremetal-cluster-admin
    - bastion-host-ssh:
        file: ~/.ssh/bootwright-ssh-key
    - bmc-credentials:
        generated:
          credentials:
            username: admin

  infraComponents:
    artifactServers:
      - name: default
        management: managed
        componentRef: artifact-server
