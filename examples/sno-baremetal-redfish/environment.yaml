apiVersion: bootwright.io/v1alpha1
kind: Environment
metadata:
  name: sno-baremetal-redfish
spec:
  baseDomain: bootwright.test

  secrets:
    - openshift-pull-secret
    - sno-baremetal-cluster-admin-ssh-key:
        generated:
          sshKeyPair:
            comment: bootwright-sno-baremetal-cluster-admin
    - bastion-host-ssh:
        file: ~/.ssh/bootwright-ssh-key
    - bmc-credentials

  infraComponents:
    artifactServers:
      - name: default
        type: managed
        componentRef:
          name: artifact-server
