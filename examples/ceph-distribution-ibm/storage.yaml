apiVersion: bootwright.io/v1alpha1
kind: StorageCluster
metadata:
  name: ceph-ibm
spec:
  type: ceph

  ceph:
    distribution: ibm
    # Optional. release selects the IBM Storage Ceph product stream (e.g. 9, the
    # default), choosing the ibm-storage-ceph-<N> vendor repository. IBM registry
    # tags are not x.y.z, so pin a reproducible run with spec.ceph.image.
    # release: "9"
    # image: cp.icr.io/cp/ibm-ceph/ceph-9-rhel9@sha256:<digest>
    entitlementRef: ibm-storage-ceph
    cephadm:
      bootstrap:
        seedNode: ceph-0
        monIP:
          nodeRef: ceph-0
    topology:
      nodes:
        - name: ceph-0
          site: lab
          roles:
            - mon
          machineRef: ceph-0
