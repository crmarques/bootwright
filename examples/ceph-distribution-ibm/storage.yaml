apiVersion: bootwright.io/v1alpha1
kind: StorageCluster
metadata:
  name: ceph-ibm
spec:
  type: ceph

  ceph:
    distribution: ibm
    release: "9.9.1.0"
    packageVersion: "19.2.1-245.el9cp"
    image:
      version: "9.9.1.0-123"
    ibm:
      callHome: disabled
    entitlementRef: ibm-storage-ceph
    osSubscriptionRef: rhel
    cephadm:
      clusterSSH:
        keyRef: ceph-cluster-ssh
      bootstrap:
        node: node-01
    topology:
      nodes:
        - name: node-01
          machineRef: ceph-0
          roles:
            - mon
