apiVersion: bootwright.io/v1alpha1
kind: StorageCluster
metadata:
  name: ceph-ibm
spec:
  type: ceph

  ceph:
    distribution: ibm
    entitlementRef:
      name: ibm-storage-ceph
    cephadm:
      bootstrap:
        seedNode: ceph-0
        monIP:
          nodeRef:
            name: ceph-0
    topology:
      nodes:
        - name: ceph-0
          site: lab
          roles:
            - mon
          machineRef:
            name: ceph-0
