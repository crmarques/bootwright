apiVersion: bootwright.io/v1alpha1
kind: StorageCluster
metadata:
  name: ceph-ibm
spec:
  type: ceph

  ceph:
    distribution: ibm
    release: "9.9.1"
    entitlementRef: ibm-storage-ceph
    cephadm:
      bootstrap:
        host: ceph-0
    topology:
      hosts:
        - machineRef: ceph-0
          roles:
            - mon
