apiVersion: bootwright.io/v1alpha1
kind: StorageCluster
metadata:
  name: ceph-ibm
spec:
  type: ceph

  ceph:
    distribution: ibm
    release: "9.9.1"
    ibm:
      callHome: disabled
    entitlementRef: ibm-storage-ceph
    osSubscriptionRef: rhel
    cephadm:
      bootstrap:
        node: node-01
    topology:
      nodes:
        - name: node-01
          machineRef: ceph-0
          roles:
            - mon
