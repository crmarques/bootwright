apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: services-host
spec:
  capabilities:
    - container-runtime
    - artifact-server

  os:
    mode: external
    addresses:
      - name: ssh
        address: localhost
      - name: bmc-lan
        address: 192.168.133.1
    ssh:
      addressName: ssh
      keyRef:
        name: provider-host-ssh
