apiVersion: bootwright.io/v1alpha1
kind: ClusterInfra
metadata:
  name: 3-nodes-ocp-emul-baremetal
spec:
  platform:
    type: baremetal
    baremetal:
      provisioningNetwork: disabled

  endpoints:
    api:
      address: 192.168.133.10
      source:
        type: external
    api-int:
      address: 192.168.133.10
      source:
        type: external
    apps:
      address: 192.168.133.11
      source:
        type: external

  artifactAccess:
    serverRef:
      name: default
    redfishVirtualMedia:
      endpointRef:
        name: bmc

  networkBindings:
    - networkConfigRef:
        name: rack1-vlan
      providerRef:
        name: rack1-baremetal-provider
      attachmentRef:
        name: rack1-vlan

  components:
    nodes:
      - name: master-0
        source:
          providerRef:
            name: rack1-baremetal-provider
          machineRef:
            name: rack1-srv1
        network:
          networkConfigRef:
            name: rack1-vlan
          overrides:
            interfaces:
              - name: primary
                ipv4:
                  address:
                    - ip: 192.168.133.20
                      prefix-length: 24
      - name: master-1
        source:
          providerRef:
            name: rack1-baremetal-provider
          machineRef:
            name: rack1-srv2
        network:
          networkConfigRef:
            name: rack1-vlan
          overrides:
            interfaces:
              - name: primary
                ipv4:
                  address:
                    - ip: 192.168.133.21
                      prefix-length: 24
      - name: master-2
        source:
          providerRef:
            name: rack1-baremetal-provider
          machineRef:
            name: rack1-srv3
        network:
          networkConfigRef:
            name: rack1-vlan
          overrides:
            interfaces:
              - name: primary
                ipv4:
                  address:
                    - ip: 192.168.133.22
                      prefix-length: 24
---
apiVersion: bootwright.io/v1alpha1
kind: ContainerCluster
metadata:
  name: 3-nodes-ocp-emul-baremetal
spec:
  distribution:
    type: openshift
    release:
      version: 4.21.15

  install:
    endpointRefs:
      api:
        name: api
      apiInt:
        name: api-int
      ingress:
        name: apps
    method: agent
    mode: connected
    nodeSSH:
      keyPairRef:
        name: 3-nodes-ocp-emul-baremetal-cluster-admin-ssh-key

  controlPlane:
    name: master
    replicas: 3

  compute:
    - name: worker
      replicas: 0

  networking:
    clusterNetwork:
      - cidr: 10.128.0.0/14
        hostPrefix: 23
    serviceNetwork:
      - 172.30.0.0/16

  nodes:
    - hostname: master-0
      role: master
      infraNodeRef:
        clusterInfra: 3-nodes-ocp-emul-baremetal
        name: master-0
    - hostname: master-1
      role: master
      infraNodeRef:
        clusterInfra: 3-nodes-ocp-emul-baremetal
        name: master-1
    - hostname: master-2
      role: master
      infraNodeRef:
        clusterInfra: 3-nodes-ocp-emul-baremetal
        name: master-2
