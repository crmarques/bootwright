apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: bastion
spec:
  capabilities:
    - container-runtime
    - load-balancer
    - proxy
    - name-resolution
    - ntp

  os:
    provided: true

  addresses:
    - name: ssh
      address: localhost
    - name: cluster-lan
      address: 192.168.140.1

  access:
    ssh:
      auth:
        privateKeyRef: bastion-host-ssh
      addressRef: ssh
