apiVersion: bootwright.io/v1alpha1
kind: Secret
metadata:
  name: openshift-pull-secret
spec:
  type: dockerConfigJson
---
apiVersion: bootwright.io/v1alpha1
kind: Secret
metadata:
  name: sno-vsphere-cluster-admin-ssh-key
spec:
  type: sshKeyPair

  source:
    generated:
      keyType: ed25519
      comment: bootwright-sno-vsphere-cluster-admin
---
apiVersion: bootwright.io/v1alpha1
kind: Secret
metadata:
  name: bastion-host-ssh
spec:
  type: sshKeyPair

  source:
    file:
      privateKey: ~/.ssh/bootwright-ssh-key
---
apiVersion: bootwright.io/v1alpha1
kind: Secret
metadata:
  name: vcenter-credentials
spec:
  type: usernamePassword

  source:
    generated:
      username: administrator@vsphere.local
---
apiVersion: bootwright.io/v1alpha1
kind: Secret
metadata:
  name: proxy-credentials
spec:
  type: usernamePassword

  source:
    generated:
      username: proxy
