apiVersion: bootwright.io/v1alpha1
kind: ClusterInfra
metadata:
  name: sno-emul-baremetal
spec:
  platform:
    type: baremetal
    baremetal:
      provisioningNetwork: disabled

  endpoints:
    api:
      address: 192.168.132.10
      source:
        type: external
    api-int:
      address: 192.168.132.10
      source:
        type: external
    apps:
      address: 192.168.132.11
      source:
        type: external

  networkBindings:
    - networkConfigRef:
        name: sno-vlan
      providerRef:
        name: rack1-baremetal-provider
      attachmentRef:
        name: sno-vlan

  components:
    machines:
      - name: master-0
        from:
          provider: rack1-baremetal-provider
          name: rack1-srv1
        networkConfig:
          ref:
            name: sno-vlan
          overrides:
            interfaces:
              - name: primary
                ipv4:
                  address:
                    - ip: 192.168.132.20
                      prefix-length: 24
        rootDeviceHints:
          deviceName: /dev/vda
---
apiVersion: bootwright.io/v1alpha1
kind: ContainerCluster
metadata:
  name: sno-emul-baremetal
spec:
  distribution:
    type: openshift
    release:
      version: 4.21.15

  install:
    endpointRefs:
      api:
        name: api
      apiInt:
        name: api-int
      ingress:
        name: apps
    method: agent
    mode: connected

  controlPlane:
    name: master
    replicas: 1

  compute:
    - name: worker
      replicas: 0

  networking:
    clusterNetwork:
      - cidr: 10.128.0.0/14
        hostPrefix: 23
    serviceNetwork:
      - 172.30.0.0/16

  nodes:
    - hostname: master-0
      role: master
      machineRef:
        clusterInfra: sno-emul-baremetal
        name: master-0
