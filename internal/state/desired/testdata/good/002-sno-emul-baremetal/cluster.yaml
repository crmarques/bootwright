apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: rack1-srv1
spec:
  capabilities:
    - openshift-node

  substrate:
    providerRef:
      name: rack1-baremetal-provider

  os:
    install:
      rootDeviceHints:
        deviceName: /dev/vda
    provided: false

  network:
    config:
      networkConfigRef:
        name: sno-vlan
      attachmentRef:
        name: sno-vlan
      interfaceAddresses:
        - interface: primary
          addressRef:
            name: ip
          prefixLength: 24
    interfaceBinding:
      - nicRef:
          name: primary
        interfaceName: primary

  hardware:
    nics:
      - name: primary
        macAddress: 52:54:00:32:11:10
    management:
      bmc:
        address: REPLACE_WITH_REAL_BMC_URL_FOR_master-0
        protocol: redfish
        credentialsRef:
          name: bmc-credentials
        disableCertificateVerification: true
    boot:
      nicRef:
        name: primary

  addresses:
    - name: ip
      address: 192.168.132.20
---
apiVersion: bootwright.io/v1alpha1
kind: ContainerCluster
metadata:
  name: sno-emul-baremetal
spec:
  distribution:
    type: openshift
    release:
      version: 4.21.15

  install:
    platform:
      type: bareMetal
      baremetal:
        provisioningNetwork: disabled
    endpoints:
      api:
        address: 192.168.132.10
        source:
          type: external
      api-int:
        address: 192.168.132.10
        source:
          type: external
      ingress:
        address: 192.168.132.11
        source:
          type: external
    artifactAccess:
      serverRef:
        name: default
      redfishVirtualMedia:
        endpointRef:
          name: bmc
    method: agent
    mode: connected
    nodeSSH:
      keyPairRef:
        name: sno-emul-baremetal-cluster-admin-ssh-key

  controlPlane:
    name: master
    replicas: 1

  compute:
    - name: worker
      replicas: 0

  networking:
    clusterNetwork:
      - cidr: 10.128.0.0/14
        hostPrefix: 23
    serviceNetwork:
      - 172.30.0.0/16

  nodes:
    - hostname: master-0
      role: master
      machineRef:
        name: rack1-srv1
