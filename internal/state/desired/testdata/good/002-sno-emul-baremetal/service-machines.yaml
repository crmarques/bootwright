apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: services-host
spec:
  capabilities:
    - container-runtime
    - artifact-server

  os:
    provided: true

  addresses:
    - name: ssh
      address: localhost
    - name: bmc-lan
      address: 192.168.132.1

  access:
    ssh:
      keyRef:
        name: bastion-host-ssh
      addressRef:
        name: ssh
