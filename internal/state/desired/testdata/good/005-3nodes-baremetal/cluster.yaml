apiVersion: bootwright.io/v1alpha1
kind: ContainerCluster
metadata:
  name: 3-nodes-ocp-baremetal
spec:
  distribution:
    type: openshift
    release:
      version: 4.21.15

  install:
    platform:
      type: baremetal
      baremetal:
        provisioningNetwork: disabled
    endpoints:
      api:
        address: 192.168.140.10
        source:
          type: external
      api-int:
        address: 192.168.140.10
        source:
          type: external
      ingress:
        address: 192.168.140.11
        source:
          type: external
    artifactAccess:
      serverRef: default
      redfishVirtualMedia:
        endpointRef: bmc
    method: agent
    mode: connected
    nodeSSH:
      keyPairRef: 3-nodes-ocp-baremetal-cluster-admin-ssh-key

  controlPlane:
    replicas: 3

  compute:
    - replicas: 0

  networking:
    clusterNetwork:
      - cidr: 10.128.0.0/14
        hostPrefix: 23
    serviceNetwork:
      - 172.30.0.0/16

  hosts:
    - hostname: master-0
      role: master
      machineRef: rack1-srv1
    - hostname: master-1
      role: master
      machineRef: rack1-srv2
    - hostname: master-2
      role: master
      machineRef: rack1-srv3
