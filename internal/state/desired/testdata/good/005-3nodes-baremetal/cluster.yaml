apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: rack1-srv1
spec:
  capabilities:
    - openshift-node

  substrate:
    providerRef: rack1-baremetal-provider

  os:
    install:
      rootDeviceHints:
        deviceName: /dev/sda
    provided: false

  network:
    config:
      networkConfigRef: rack1-bond140-machine
      attachmentRef: rack1-bond140-machine
      interfaceAddresses:
        - interface: bond0.140
          addressRef: ip
          prefixLength: 24
    interfaceBinding:
      - nicRef: eno1
        interfaceName: eno1
      - nicRef: eno2
        interfaceName: eno2

  hardware:
    nics:
      - name: eno1
        macAddress: 00:25:90:5a:10:01
      - name: eno2
        macAddress: 00:25:90:5a:10:02
    management:
      bmc:
        address: redfish-virtualmedia+https://bmc-rack1-srv1.bootwright.test/redfish/v1/Systems/1
        protocol: redfish
        credentialsRef: bmc-credentials
        tls:
          verify: false
    boot:
      nicRef: eno1

  addresses:
    - name: ip
      address: 192.168.140.20
---
