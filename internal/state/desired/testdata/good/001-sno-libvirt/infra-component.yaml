apiVersion: bootwright.io/v1alpha1
kind: InfraComponent
metadata:
  name: load-balancer
spec:
  loadBalancer:
    type: haProxy
    machineRef:
      name: bastion
    bindAddresses:
      - name: control-plane
        ip: 192.168.132.10
      - name: apps
        ip: 192.168.132.11
---
apiVersion: bootwright.io/v1alpha1
kind: InfraComponent
metadata:
  name: proxy
spec:
  proxy:
    type: squid
    machineRef:
      name: bastion
    bindAddress: 0.0.0.0
    port: 3128
---
apiVersion: bootwright.io/v1alpha1
kind: InfraComponent
metadata:
  name: name-resolution
spec:
  nameResolution:
    type: dnsmasq
    machineRef:
      name: bastion
    bindAddress: 192.168.132.1
    port: 53
    additionalIngressHosts:
      - console-openshift-console.apps.sno-libvirt.bootwright.test
      - oauth-openshift.apps.sno-libvirt.bootwright.test
---
apiVersion: bootwright.io/v1alpha1
kind: InfraComponent
metadata:
  name: ntp-server
spec:
  ntp:
    type: chrony
    machineRef:
      name: bastion
    bindAddress: 192.168.132.1
    port: 123
    endpoints:
      - name: cluster
        machineAddress: cluster-lan
    upstreamSources:
      - time.bootwright.test
