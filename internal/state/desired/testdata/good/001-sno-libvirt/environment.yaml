apiVersion: bootwright.io/v1alpha1
kind: Environment
metadata:
  name: sno-libvirt
spec:
  baseDomain: bootwright.test

  secrets:
    - openshift-pull-secret
    - sno-libvirt-cluster-admin-ssh-key:
        generated:
          sshKeyPair:
            type: ed25519
            comment: bootwright-sno-libvirt-cluster-admin
    - bastion-host-ssh:
        file: ~/.ssh/bootwright-ssh-key
    - bmc-credentials:
        generated:
          credentials:
            username: admin
    - proxy-credentials:
        generated:
          credentials:
            username: proxy

  infraComponents:
    proxies:
      - name: default
        type: managed
        componentRef: proxy
    nameResolution:
      - name: default
        type: managed
        componentRef: name-resolution
    ntpSources:
      - name: default
        type: managed
        componentRef: ntp-server
        endpoint: cluster

  proxyFor:
    bootwright: default
    containerClusterInstall: default
