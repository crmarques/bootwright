apiVersion: bootwright.io/v1alpha1
kind: Environment
metadata:
  name: sno-libvirt
spec:
  domains:
    base: bootwright.test

  infraComponents:
    proxies:
      - name: default
        management: managed
        componentRef: proxy
    nameResolution:
      - name: default
        management: managed
        componentRef: name-resolution
    ntp:
      - name: default
        management: managed
        componentRef: ntp-server
        endpointRef: cluster

  proxyFor:
    bootwright: default
    containerClusterInstall: default
    machineOSInstall: none
