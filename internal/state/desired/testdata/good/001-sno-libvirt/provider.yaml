apiVersion: bootwright.io/v1alpha1
kind: InfraProvider
metadata:
  name: lab-libvirt-provider
spec:
  type: libvirt

  libvirt:
    machineRef:
      name: bastion
    uri: qemu:///system
    bmcEmulationDefaults:
      enabled: true
      protocol: redfish
      auth:
        credentialRef:
          name: bmc-credentials
    machineProfiles:
      - name: sno
        cpu: 8
        memoryMiB: 16384
        diskGiB: 120

  networkAttachments:
    - name: sno-bridge
      libvirt:
        bridge: vbr-cb-sno
