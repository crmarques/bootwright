apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: master-0
spec:
  capabilities:
    - openshift-node

  substrate:
    providerRef:
      name: lab-libvirt-provider
    libvirt:
      profileRef:
        name: sno

  os:
    mode: raw
    install:
      network:
        networkConfigRef:
          name: sno-bridge
        attachmentRef:
          name: sno-bridge
        overrides:
          interfaces:
            - name: primary
              ipv4:
                address:
                  - ip: 192.168.132.20
                    prefix-length: 24
      rootDeviceHints:
        deviceName: /dev/vda
---
apiVersion: bootwright.io/v1alpha1
kind: ContainerCluster
metadata:
  name: sno-libvirt
spec:
  distribution:
    type: openshift
    release:
      version: 4.21.15

  install:
    platform:
      type: bareMetal
      baremetal:
        provisioningNetwork: disabled
    endpoints:
      api:
        source:
          type: infraComponent
          componentRef:
            name: load-balancer
          bindAddress: control-plane
      api-int:
        source:
          type: infraComponent
          componentRef:
            name: load-balancer
          bindAddress: control-plane
      ingress:
        source:
          type: infraComponent
          componentRef:
            name: load-balancer
          bindAddress: apps
    method: agent
    mode: connected
    nodeSSH:
      keyPairRef:
        name: sno-libvirt-cluster-admin-ssh-key

  controlPlane:
    name: master
    replicas: 1

  compute:
    - name: worker
      replicas: 0

  networking:
    clusterNetwork:
      - cidr: 10.128.0.0/14
        hostPrefix: 23
    serviceNetwork:
      - 172.30.0.0/16

  nodes:
    - hostname: master-0
      role: master
      machineRef:
        name: master-0
