apiVersion: bootwright.io/v1alpha1
kind: ClusterInfra
metadata:
  name: sno-libvirt
spec:
  platform:
    type: baremetal
    baremetal:
      provisioningNetwork: disabled

  endpoints:
    api:
      source:
        type: infraComponent
        componentRef:
          name: load-balancer
        bindAddress: control-plane
    api-int:
      source:
        type: infraComponent
        componentRef:
          name: load-balancer
        bindAddress: control-plane
    apps:
      source:
        type: infraComponent
        componentRef:
          name: load-balancer
        bindAddress: apps

  networkBindings:
    - networkConfigRef:
        name: sno-bridge
      providerRef:
        name: lab-libvirt-provider
      attachmentRef:
        name: sno-bridge

  components:
    nodes:
      - name: master-0
        source:
          providerRef:
            name: lab-libvirt-provider
          profileRef:
            name: sno
        network:
          networkConfigRef:
            name: sno-bridge
          overrides:
            interfaces:
              - name: primary
                ipv4:
                  address:
                    - ip: 192.168.132.20
                      prefix-length: 24
        rootDeviceHints:
          deviceName: /dev/vda
---
apiVersion: bootwright.io/v1alpha1
kind: ContainerCluster
metadata:
  name: sno-libvirt
spec:
  distribution:
    type: openshift
    release:
      version: 4.21.15

  install:
    endpointRefs:
      api:
        name: api
      apiInt:
        name: api-int
      ingress:
        name: apps
    method: agent
    mode: connected
    nodeSSH:
      keyPairRef:
        name: sno-libvirt-cluster-admin-ssh-key

  controlPlane:
    name: master
    replicas: 1

  compute:
    - name: worker
      replicas: 0

  networking:
    clusterNetwork:
      - cidr: 10.128.0.0/14
        hostPrefix: 23
    serviceNetwork:
      - 172.30.0.0/16

  nodes:
    - hostname: master-0
      role: master
      infraNodeRef:
        clusterInfra: sno-libvirt
        name: master-0
