---
apiVersion: bootwright.io/v1alpha1
kind: ContainerCluster
metadata:
  name: 3-nodes-ocp-libvirt
spec:
  distribution:
    type: openshift
    release:
      version: 4.21.15

  install:
    platform:
      type: baremetal
      baremetal:
        provisioningNetwork: disabled
    endpoints:
      api:
        source:
          type: infraComponent
          componentRef: load-balancer
          bindAddressRef: control-plane
      api-int:
        source:
          type: infraComponent
          componentRef: load-balancer
          bindAddressRef: control-plane
      ingress:
        source:
          type: infraComponent
          componentRef: load-balancer
          bindAddressRef: apps
    method: agent
    mode: connected
    nodeSSH:
      keyPairRef: 3-nodes-ocp-libvirt-cluster-admin-ssh-key

  controlPlane:
    replicas: 3

  compute:
    - replicas: 0

  networking:
    clusterNetwork:
      - cidr: 10.128.0.0/14
        hostPrefix: 23
    serviceNetwork:
      - 172.30.0.0/16

  hosts:
    - hostname: master-0
      role: master
      machineRef: master-0
    - hostname: master-1
      role: master
      machineRef: master-1
    - hostname: master-2
      role: master
      machineRef: master-2
