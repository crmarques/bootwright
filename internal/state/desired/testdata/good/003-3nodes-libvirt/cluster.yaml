apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: master-0
spec:
  capabilities:
    - openshift-node

  substrate:
    providerRef: lab-libvirt-provider
    profileRef: compact-control-plane

  os:
    install:
      rootDeviceHints:
        deviceName: /dev/vda
    provided: false

  network:
    config:
      networkConfigRef: cluster-3n-bridge
      attachmentRef: cluster-3n-bridge
      interfaceAddresses:
        - interface: primary
          addressRef: ip
          prefixLength: 24

  addresses:
    - name: ip
      address: 192.168.133.20
---
