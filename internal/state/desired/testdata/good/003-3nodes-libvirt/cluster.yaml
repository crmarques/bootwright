apiVersion: bootwright.io/v1alpha1
kind: ClusterInfra
metadata:
  name: 3-nodes-ocp-libvirt
spec:
  platform:
    type: baremetal
    baremetal:
      provisioningNetwork: disabled

  endpoints:
    api:
      source:
        type: infraComponent
        componentRef:
          name: load-balancer
        bindAddress: control-plane
    api-int:
      source:
        type: infraComponent
        componentRef:
          name: load-balancer
        bindAddress: control-plane
    apps:
      source:
        type: infraComponent
        componentRef:
          name: load-balancer
        bindAddress: apps

  networkBindings:
    - networkConfigRef:
        name: cluster-3n-bridge
      providerRef:
        name: lab-libvirt-provider
      attachmentRef:
        name: cluster-3n-bridge

  components:
    machines:
      - name: master-0
        from:
          provider: lab-libvirt-provider
          profile: compact-control-plane
        networkConfig:
          ref:
            name: cluster-3n-bridge
          addresses:
            - interface: primary
              ipv4:
                - ip: 192.168.133.20
                  prefix-length: 24
        rootDeviceHints:
          deviceName: /dev/vda
      - name: master-1
        from:
          provider: lab-libvirt-provider
          profile: compact-control-plane
        networkConfig:
          ref:
            name: cluster-3n-bridge
          addresses:
            - interface: primary
              ipv4:
                - ip: 192.168.133.21
                  prefix-length: 24
        rootDeviceHints:
          deviceName: /dev/vda
      - name: master-2
        from:
          provider: lab-libvirt-provider
          profile: compact-control-plane
        networkConfig:
          ref:
            name: cluster-3n-bridge
          addresses:
            - interface: primary
              ipv4:
                - ip: 192.168.133.22
                  prefix-length: 24
        rootDeviceHints:
          deviceName: /dev/vda
---
apiVersion: bootwright.io/v1alpha1
kind: ContainerCluster
metadata:
  name: 3-nodes-ocp-libvirt
spec:
  distribution:
    type: openshift
    release:
      version: 4.21.15

  install:
    endpointRefs:
      api:
        name: api
      apiInt:
        name: api-int
      ingress:
        name: apps
    method: agent
    mode: connected

  controlPlane:
    name: master
    replicas: 3

  compute:
    - name: worker
      replicas: 0

  networking:
    clusterNetwork:
      - cidr: 10.128.0.0/14
        hostPrefix: 23
    serviceNetwork:
      - 172.30.0.0/16

  nodes:
    - hostname: master-0
      role: master
      machineRef:
        clusterInfra: 3-nodes-ocp-libvirt
        name: master-0
    - hostname: master-1
      role: master
      machineRef:
        clusterInfra: 3-nodes-ocp-libvirt
        name: master-1
    - hostname: master-2
      role: master
      machineRef:
        clusterInfra: 3-nodes-ocp-libvirt
        name: master-2
