apiVersion: bootwright.io/v1alpha1
kind: InfraProvider
metadata:
  name: lab-libvirt-provider
spec:
  machineProfiles:
    - name: compact-control-plane
      cpu: 4
      memoryMiB: 16384
      diskGiB: 120
      libvirt:
        hostRef:
          name: lab-host
        uri: qemu:///system
        bmcEmulationDefaults:
          enabled: true
          protocol: redfish
          auth:
            credentialRef:
              name: bmc-credentials

  networkAttachments:
    - name: cluster-3n-bridge
      libvirt:
        bridge: vbr-cb-3n
