            - 192.168.10.53
          gateway: 192.168.140.1
          machineNetwork:
            - cidr: 192.168.140.0/24
          name: rack1-bond140-machine
          template:
            dns-resolver:
                config:
                    server:
                        - 192.168.10.53
            interfaces:
                - ipv4:
                    enabled: false
                  ipv6:
                    enabled: false
                  name: eno1
                  state: up
                  type: ethernet
                - ipv4:
                    enabled: false
                  ipv6:
                    enabled: false
                  name: eno2
                  state: up
                  type: ethernet
                - ipv4:
                    enabled: false
                  ipv6:
                    enabled: false
                  link-aggregation:
