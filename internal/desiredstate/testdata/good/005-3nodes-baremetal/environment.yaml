apiVersion: bootwright.io/v1alpha1
kind: Environment
metadata:
  name: 3-nodes-ocp-baremetal
spec:
  baseDomain: bootwright.test

  bastion:
    hostRef: bastion

  artifactServer:
    componentRef:
      name: artifact-server
    routes:
      redfishVirtualMedia:
        endpoint: bmc
      clusterInstall:
        endpoint: cluster

  secrets:
    openshift-pull-secret:
    cluster-admin-pub-key:
      file: ~/.ssh/bootwright-ssh-key.pub
    provider-host-ssh:
      file: ~/.ssh/bootwright-ssh-key
    bmc-credentials:
      generated:
        credentials:
          username: admin
    proxy-credentials:
      generated:
        credentials:
          username: proxy

  proxy:
    httpProxy: http://proxy.bootwright.test:3128
    httpsProxy: http://proxy.bootwright.test:3128
    noProxy:
      - .bootwright.test
      - 192.168.140.0/24
    auth:
      proxyAuthRef:
        name: proxy-credentials
    useFor:
      bootwright: true
      clusterInstall: true
