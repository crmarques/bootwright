apiVersion: bootwright.io/v1alpha1
kind: Environment
metadata:
  name: 3-nodes-ocp-baremetal
spec:
  baseDomain: bootwright.test

  secrets:
    openshift-pull-secret: null
    cluster-admin-pub-key:
      file: ~/.ssh/bootwright-ssh-key.pub
    provider-host-ssh:
      file: ~/.ssh/bootwright-ssh-key
    bmc-credentials:
      generated:
        credentials:
          username: admin
    proxy-credentials:
      generated:
        credentials:
          username: proxy

  infraComponents:
    artifactServers:
      - name: default
        type: managed
        default: true
        componentRef:
          name: artifact-server
        routes:
          redfishVirtualMedia:
            endpoint: bmc
          clusterInstall:
            endpoint: cluster
    proxies:
      - name: default
        default: true
        type: external
        spec:
          httpProxy: http://proxy.bootwright.test:3128
          httpsProxy: http://proxy.bootwright.test:3128
          noProxy:
            - .bootwright.test
            - 192.168.140.0/24
          auth:
            proxyAuthRef:
              name: proxy-credentials

  proxyFor:
    bootwright: default
    clusterInstall: default
