apiVersion: bootwright.io/v1alpha1
kind: ClusterInfra
metadata:
  name: sno-libvirt
spec:
  platform:
    type: baremetal
    baremetal:
      provisioningNetwork: disabled

  endpoints:
    api:
      providedBy:
        address: control-plane
        componentRef:
          name: load-balancer
    apiInt:
      providedBy:
        address: control-plane
        componentRef:
          name: load-balancer
    ingress:
      providedBy:
        address: apps
        componentRef:
          name: load-balancer

  components:
    machines:
      - name: master-0
        from:
          provider: lab-libvirt-provider
          profile: sno
        networkConfig:
          ref:
            name: sno-bridge
          addresses:
            - interface: primary
              ipv4:
                - ip: 192.168.132.20
                  prefix-length: 24
        rootDeviceHints:
          deviceName: /dev/vda
---
apiVersion: bootwright.io/v1alpha1
kind: ContainerCluster
metadata:
  name: sno-libvirt
spec:
  distribution:
    type: openshift
    release:
      version: 4.21.15

  install:
    method: agent
    mode: connected

  controlPlane:
    name: master
    replicas: 1

  compute:
    - name: worker
      replicas: 0

  networking:
    clusterNetwork:
      - cidr: 10.128.0.0/14
        hostPrefix: 23
    serviceNetwork:
      - 172.30.0.0/16

  nodes:
    - hostname: master-0
      role: master
      machineRef:
        clusterInfra: sno-libvirt
        name: master-0
