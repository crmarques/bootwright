apiVersion: bootwright.io/v1alpha1
kind: ClusterInfra
metadata:
  name: 3-nodes-ocp-emul-baremetal
spec:
  platform:
    type: baremetal
    baremetal:
      provisioningNetwork: disabled

  endpoints:
    api:
      externalVip: 192.168.133.10
    apiInt:
      externalVip: 192.168.133.10
    ingress:
      externalVip: 192.168.133.11

  components:
    machines:
      - name: master-0
        from:
          provider: rack1-baremetal-provider
          name: rack1-srv1
        networkConfig:
          ref:
            name: rack1-vlan
          addresses:
            - interface: primary
              ipv4:
                - ip: 192.168.133.20
                  prefix-length: 24
      - name: master-1
        from:
          provider: rack1-baremetal-provider
          name: rack1-srv2
        networkConfig:
          ref:
            name: rack1-vlan
          addresses:
            - interface: primary
              ipv4:
                - ip: 192.168.133.21
                  prefix-length: 24
      - name: master-2
        from:
          provider: rack1-baremetal-provider
          name: rack1-srv3
        networkConfig:
          ref:
            name: rack1-vlan
          addresses:
            - interface: primary
              ipv4:
                - ip: 192.168.133.22
                  prefix-length: 24
---
apiVersion: bootwright.io/v1alpha1
kind: ContainerCluster
metadata:
  name: 3-nodes-ocp-emul-baremetal
spec:
  distribution:
    type: openshift
    release:
      version: 4.21.15

  install:
    method: agent
    mode: connected

  controlPlane:
    name: master
    replicas: 3

  compute:
    - name: worker
      replicas: 0

  networking:
    clusterNetwork:
      - cidr: 10.128.0.0/14
        hostPrefix: 23
    serviceNetwork:
      - 172.30.0.0/16

  nodes:
    - hostname: master-0
      role: master
      machineRef:
        clusterInfra: 3-nodes-ocp-emul-baremetal
        name: master-0
    - hostname: master-1
      role: master
      machineRef:
        clusterInfra: 3-nodes-ocp-emul-baremetal
        name: master-1
    - hostname: master-2
      role: master
      machineRef:
        clusterInfra: 3-nodes-ocp-emul-baremetal
        name: master-2
