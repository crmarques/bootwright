apiVersion: bootwright.io/v1alpha1
kind: Environment
metadata:
  name: sno-emul-baremetal
spec:
  baseDomain: bootwright.test

  secrets:
    openshift-pull-secret: null
    cluster-admin-pub-key:
      file: ~/.ssh/bootwright-ssh-key.pub
    provider-host-ssh:
      file: ~/.ssh/bootwright-ssh-key
    bmc-credentials:
      generated:
        credentials:
          username: admin
    proxy-credentials:
      generated:
        credentials:
          username: proxy

  infraComponents:
    artifactServers:
      - name: default
        type: managed
        default: true
        componentRef:
          name: artifact-server
        routes:
          redfishVirtualMedia:
            endpoint: bmc
    proxies:
      - name: default
        default: true
        type: external
        connection:
          httpProxy: http://192.168.132.1:3128
          httpsProxy: http://192.168.132.1:3128
          noProxy:
            - 192.168.132.0/24
          auth:
            proxyAuthRef:
              name: proxy-credentials

  proxyFor:
    bootwright: default
    clusterInstall: default
