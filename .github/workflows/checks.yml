name: Checks

on:
  pull_request:
  push:
    branches: [main]
    # Also run the full suite on release tags so a v* tag on an unmerged or
    # unvetted commit still passes staticcheck, race, lint, and the guardrails
    # before release.yml (which only runs `go test ./...`) ships binaries.
    tags: ["v*"]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.13"

      - name: Install Ansible
        run: >-
          python3 -m pip install --disable-pip-version-check
          ansible-core==2.21.0 ansible-lint==26.6.0 yamllint==1.38.0

      - name: Sync ansible bundle
        run: make sync-bundle

      - name: Go format
        run: make check-gofmt

      - name: Go vet
        run: go vet ./...

      - name: Go mod tidy
        run: make go-mod-tidy-check

      - name: Go test
        run: go test ./...

      - name: Go race test
        # Match the Makefile's GO_TEST_RACE_FLAGS headroom: internal/cli runs
        # ~12min under -race on slower runners, past Go's 600s/package default.
        run: go test -race -timeout 1800s ./...

      - name: Go clean-checkout test
        run: make go-test-clean-checkout

      - name: Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          make staticcheck STATICCHECK="$(go env GOPATH)/bin/staticcheck"

      - name: Python filter tests
        run: make python-test

      - name: Ansible syntax check
        run: make ansible-syntax-check

      - name: Ansible lint
        run: make ansible-lint-check

      - name: Shellcheck
        run: |
          sudo apt-get install -y shellcheck
          make shellcheck-check

      - name: Workflow YAML lint
        run: make workflow-yaml-check

      - name: Repository guardrails
        run: |
          make stale-term-check
          make cli-file-size-check
          make check-go-source-visibility
          make containerfile-pin-check

      - name: Docs strict build
        # Strict-build the docs on every PR so mkdocs --strict breakage fails
        # here, not silently at pages.yml publish time (which only runs on
        # docs-touching or docs:-subject pushes).
        run: |
          pip install --disable-pip-version-check -r docs/requirements.txt
          mkdocs build --strict
