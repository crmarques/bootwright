name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.13"

      - name: Install Ansible
        run: >-
          python3 -m pip install --disable-pip-version-check
          ansible-core==2.21.0 ansible-lint==26.6.0 yamllint==1.38.0

      - name: Sync ansible bundle
        run: make sync-bundle

      - name: Go format
        run: make check-gofmt

      - name: Go vet
        run: go vet ./...

      - name: Go mod tidy
        run: make go-mod-tidy-check

      - name: Go test
        run: go test ./...

      - name: Go race test
        run: go test -race ./...

      - name: Go clean-checkout test
        run: make go-test-clean-checkout

      - name: Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          make staticcheck STATICCHECK="$(go env GOPATH)/bin/staticcheck"

      - name: Python filter tests
        run: make python-test

      - name: Ansible syntax check
        run: make ansible-syntax-check

      - name: Ansible lint
        run: make ansible-lint-check

      - name: Shellcheck
        run: |
          sudo apt-get install -y shellcheck
          make shellcheck-check

      - name: Repository guardrails
        run: |
          make stale-term-check
          make cli-file-size-check
          make check-go-source-visibility
          make containerfile-pin-check
