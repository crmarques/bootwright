name: Release CLI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      TAG_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.13"

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          pattern='^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'
          if [[ ! "$TAG_NAME" =~ $pattern ]]; then
            echo "release tags must look like v0.1.0 or v0.1.0-rc.1"
            exit 1
          fi

      - name: Install Ansible
        run: >-
          python3 -m pip install --disable-pip-version-check
          ansible-core==2.21.0

      - name: Go test
        run: go test ./...

      - name: Build Linux amd64 CLI
        shell: bash
        run: |
          set -euo pipefail
          commit="$(git rev-parse --short=12 HEAD)"
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 make build \
            BINARY=bootwright-linux-amd64 \
            VERSION="$TAG_NAME" \
            GIT_COMMIT="$commit"

      - name: Smoke test
        run: ./bin/bootwright-linux-amd64 version

      - name: Package CLI
        shell: bash
        run: |
          set -euo pipefail
          artifact="bootwright_${TAG_NAME}_linux_amd64"
          mkdir -p "dist/$artifact"
          install -m 0755 bin/bootwright-linux-amd64 "dist/$artifact/bootwright"
          tar -C dist -czf "dist/$artifact.tar.gz" "$artifact"
          rm -rf "dist/$artifact"
          (cd dist && sha256sum "$artifact.tar.gz" > "$artifact.tar.gz.sha256")

      - name: Publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" dist/*.tar.gz dist/*.sha256 --clobber
          else
            gh release create "$TAG_NAME" dist/*.tar.gz dist/*.sha256 \
              --title "$TAG_NAME" \
              --generate-notes
          fi
