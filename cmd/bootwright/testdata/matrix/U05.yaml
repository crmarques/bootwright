row: U05
base: libvirt-3-nodes-ceph
phase: admission
add:
- path: storage/metadata-ec.yaml
  document: |
    apiVersion: bootwright.io/v1alpha1
    kind: StoragePool
    metadata:
      name: metadata-ec
    spec:
      clusterRef: ceph-lab
      type: erasure
      role: cephfs-metadata
      erasure:
        dataChunks: 2
        codingChunks: 1
expect:
- code: api.invariant
  kind: StoragePool
  name: metadata-ec
  field: $.spec.role
  message: pool role does not permit erasure protection
  remediation: "use role rbd, cephfs-data or rgw for an erasure-coded pool, or set type: replicated"
- code: api.invariant
  kind: StoragePool
  name: metadata-ec
  field: $.spec.type
  message: CephFS metadata pools require replicated protection
  remediation: "set type: replicated for this cephfs-metadata pool"
- code: api.invariant
  kind: StoragePool
  name: metadata-ec
  field: $.spec.erasure
  message: erasure profile 2+1 is not one of the erasure-coding profiles Bootwright supports
  remediation: use 2+2, 4+2, 5+2, 6+2, 8+3 or 8+4
