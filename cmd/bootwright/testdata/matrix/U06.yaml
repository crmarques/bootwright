row: U06
base: libvirt-3-nodes-ceph
phase: admission
add:
- path: storage/metadata-ec.yaml
  document: |
    apiVersion: bootwright.io/v1alpha1
    kind: CephPool
    metadata:
      name: metadata-ec
    spec:
      clusterRef: ceph-lab
      role: cephfsMetadata
      erasure:
        dataChunks: 2
        codingChunks: 1
expect:
- code: api.invariant
  kind: CephPool
  name: metadata-ec
  field: $.spec.role
  message: pool role does not permit erasure protection
  remediation: "use role rbd, cephfsData or rgw for an erasure-coded pool, or replace spec.erasure with spec.replicated"
- code: api.invariant
  kind: CephPool
  name: metadata-ec
  field: $.spec.erasure
  message: CephFS metadata pools require replicated protection
  remediation: remove spec.erasure and declare spec.replicated for this cephfsMetadata pool
