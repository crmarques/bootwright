apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: rehearsal-01

spec:
  hardware:
    providerRef: lab-libvirt
    profileRef: rhel

    nics:
      - name: enp1s0

  os:
    clusterInstalled: {}

  network:
    inline:
      nmstate:
        interfaces:
          - name: enp1s0
            type: ethernet
            state: up
