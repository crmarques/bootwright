apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: rehearsal-01
spec:
  substrate:
    providerRef: lab-libvirt
    libvirt:
      profileRef: rhel
  hardware:
    nics:
      - name: enp1s0
  os:
    provided: false
  network:
    inline:
      machineNetwork:
        - cidr: 198.51.100.0/24
      nmstate:
        interfaces:
          - name: enp1s0
            type: ethernet
            state: up
