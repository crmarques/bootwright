apiVersion: bootwright.io/v1alpha1
kind: CustomPlaybook
metadata:
  name: acceptance-playbook

spec:
  follows: base
  playbook: playbooks/does-not-exist.yaml

  target:
    clusters:
      - ceph-multidc-01

  enabled: false

  extraVars:
    literal: 'true'
    enabled: false
    count: 3
    fraction: 1.25

---
apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: acceptance-hypervisor

spec:
  capabilities:
    - container-runtime
    - libvirt

  os:
    provided: true

  access:
    ssh:
      auth:
        operatorIdentity: {}

---
apiVersion: bootwright.io/v1alpha1
kind: Secret
metadata:
  name: acceptance-provider-credentials

spec:
  type: usernamePassword

---
apiVersion: bootwright.io/v1alpha1
kind: InfraProvider
metadata:
  name: acceptance-libvirt

spec:
  libvirt:
    machineRef: acceptance-hypervisor
    uri: qemu:///system

    bmcEmulationDefaults:
      bindAddress: 192.0.2.60
      certificateRef: acceptance-bmc-tls
      auth:
        credentialsRef: acceptance-provider-credentials

---
apiVersion: bootwright.io/v1alpha1
kind: InfraProvider
metadata:
  name: acceptance-vsphere

spec:
  vsphere:
    vcenters:
      - server: vcenter.example.test
        datacenters:
          - example-dc
        credentialsRef: acceptance-provider-credentials

    failureDomains:
      - name: example-zone
        server: vcenter.example.test
        region: example-region
        zone: example-zone
        topology:
          datacenter: example-dc
          computeCluster: example-compute
          datastore: example-store
          networks:
            - example-network

    machineProfiles:
      - name: clone
        cpu: 4
        memoryMiB: 8192
        diskGiB: 80
        template: Templates/example-rhel

---
apiVersion: bootwright.io/v1alpha1
kind: MachineInstallProfile
metadata:
  name: acceptance-clone

spec:
  os:
    family: RHEL
    version: '9.99'
    architecture: x86_64

  installer:
    templateClone:
      seed:
        cloudInit: {}

---
apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: acceptance-clone-node

spec:
  substrate:
    providerRef: acceptance-vsphere
    profileRef: clone

  os:
    provided: false
    installProfileRef: acceptance-clone

---
apiVersion: bootwright.io/v1alpha1
kind: LoadBalancer
metadata:
  name: acceptance-load-balancer

spec:
  management: managed

  implementation: haproxy
  machineRef: acceptance-hypervisor
  bindAddresses:
    - address: 192.0.2.200

---
apiVersion: bootwright.io/v1alpha1
kind: Proxy
metadata:
  name: acceptance-proxy

spec:
  management: managed

  implementation: squid
  machineRef: acceptance-hypervisor
  bindAddress: 192.0.2.201

---
apiVersion: bootwright.io/v1alpha1
kind: DNSServer
metadata:
  name: acceptance-dns

spec:
  management: managed

  implementation: dnsmasq
  machineRef: acceptance-hypervisor
  bindAddress: 192.0.2.201

---
apiVersion: bootwright.io/v1alpha1
kind: NTPServer
metadata:
  name: acceptance-ntp

spec:
  management: managed

  implementation: chrony
  machineRef: acceptance-hypervisor
  bindAddress: 192.0.2.201

---
apiVersion: bootwright.io/v1alpha1
kind: Registry
metadata:
  name: acceptance-registry

spec:
  management: managed

  implementation: mirror-registry
  machineRef: acceptance-hypervisor
  bindAddress: 192.0.2.201

---
apiVersion: bootwright.io/v1alpha1
kind: Entitlement
metadata:
  name: acceptance-redhat-ceph

spec:
  type: redhat-ceph

  rhsm:
    management: external

  registry:
    credentialsRef: acceptance-provider-credentials

---
apiVersion: bootwright.io/v1alpha1
kind: StorageCluster
metadata:
  name: acceptance-external-storage

spec:
  type: ceph
  management: external

---
apiVersion: bootwright.io/v1alpha1
kind: StorageExport
metadata:
  name: acceptance-external-export

spec:
  type: dataFoundation
  clusterRef: acceptance-external-storage

  externalDetails:
    fromSecretRef: acceptance-external-details

---
apiVersion: bootwright.io/v1alpha1
kind: Secret
metadata:
  name: acceptance-external-details

spec:
  type: opaque

---
apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: acceptance-sno-node

spec:
  capabilities:
    - openshift-node

  substrate:
    providerRef: kubevirt-ocp-multidc-01
    profileRef: general

  os:
    provided: false

  network:
    configRef: hub-vm-network

    interfaceAttachments:
      - interface: primary
        attachmentRef: hub-vm-machine

      - interface: ceph-public
        attachmentRef: hub-vm-ceph-public

    addresses:
      - name: primary
        address: 192.0.2.220/24
        interface: primary

      - name: storage
        address: 198.51.100.120/25
        interface: ceph-public

---
apiVersion: bootwright.io/v1alpha1
kind: ContainerCluster
metadata:
  name: acceptance-sno

spec:
  distribution:
    type: okd
    release:
      image: quay.io/example/okd:4.99.1

  install:
    endpoints:
      api:
        source:
          type: node

      ingress:
        source:
          type: node

  nodes:
    - name: master
      role: master
      machineRef: acceptance-sno-node

---
apiVersion: bootwright.io/v1alpha1
kind: Secret
metadata:
  name: acceptance-sno-cluster-admin-ssh-key

spec:
  type: sshKeyPair

---
apiVersion: bootwright.io/v1alpha1
kind: Secret
metadata:
  name: acceptance-bmc-tls

spec:
  type: tlsCertificate

  source:
    generated:
      commonName: acceptance-bmc.example.test
      ipAddresses:
        - 192.0.2.60

---
apiVersion: bootwright.io/v1alpha1
kind: StorageClient
metadata:
  name: acceptance-rbd-client

spec:
  clusterRef: ceph-multidc-01
  poolRef: odf-hub-multidc-01-rbd
  access: read-only

---
apiVersion: bootwright.io/v1alpha1
kind: StorageRBDImage
metadata:
  name: acceptance-rbd-image

spec:
  clusterRef: ceph-multidc-01
  poolRef: odf-hub-multidc-01-rbd
  sizeBytes: 10737418240
  features:
    - layering
    - exclusive-lock

---
apiVersion: bootwright.io/v1alpha1
kind: StorageNVMeoFSubsystem
metadata:
  name: acceptance-nvmeof

spec:
  clusterRef: ceph-multidc-01
  serviceRef: nvmeof.block
  nqn: nqn.2016-06.io.example:acceptance

  listeners:
    - host: node-01
    - host: node-02

  hosts:
    - nqn.2014-08.org.nvmexpress:uuid:00000000-0000-4000-8000-000000000001

  namespaces:
    - nsid: 1
      imageRef: acceptance-rbd-image

---
apiVersion: bootwright.io/v1alpha1
kind: StorageSubvolume
metadata:
  name: acceptance-subvolume

spec:
  clusterRef: ceph-multidc-01
  filesystemRef: odf-cephfs
  sizeBytes: 10737418240

---
apiVersion: bootwright.io/v1alpha1
kind: Secret
metadata:
  name: acceptance-smb-user

spec:
  type: opaque

---
apiVersion: bootwright.io/v1alpha1
kind: StorageSMBResource
metadata:
  name: acceptance-smb-users

spec:
  clusterRef: ceph-multidc-01

  native:
    resource_type: ceph.smb.usersgroups
    users_groups_id: acceptance
    values:
      users:
        - name: smbuser
      groups: []

  secrets:
    - path: /values/users/0/password
      secretRef: acceptance-smb-user

---
apiVersion: bootwright.io/v1alpha1
kind: StorageSMBResource
metadata:
  name: acceptance-smb

spec:
  clusterRef: ceph-multidc-01
  resourceRefs:
    - acceptance-smb-users

  native:
    resource_type: ceph.smb.cluster
    cluster_id: acceptance
    auth_mode: user
    user_group_settings:
      - source_type: resource
        ref: acceptance
    placement:
      hosts:
        - node-03.ceph-multidc-01.clusters.example.com
      count: 1
