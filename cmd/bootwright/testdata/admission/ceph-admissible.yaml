apiVersion: bootwright.io/v1alpha1
kind: CephCluster
metadata:
  name: ceph-multidc-01

spec:
  management: managed

  distribution:
    ibm:
      callHome: disabled
      packages:
        source: vendor

  release: 9.9.1.2
  packageVersion: 20.2.1-405.el9cp
  packageRepository: https://packages.example.test/ibm-ceph/9/rhel9/x86_64
  packageRepositoryKey: https://packages.example.test/keys/ibm.asc
  packageRepositoryTrustBundleRef: custom-ca-bundle

  image:
    base: cp.icr.io/cp/ibm-ceph/ceph-9-rhel9
    version: sha256:1111111111111111111111111111111111111111111111111111111111111111

  entitlementRef: ceph-entitlement

  cephadm:
    ansible:
      packageVersion: 5.0.3-1
    addressRef: ssh
    clusterSSH:
      user: cephadm
      keyRef: ceph-multidc-01-cephadm-ssh-key
    bootstrap:
      nodeRef: node-01
      addressRef: ssh
      singleHostDefaults: false

  networks:
    publicCIDRs:
      - 198.51.100.0/25
    clusterCIDRs:
      - 203.0.113.0/24

  security:
    fips:
      enabled: true
    cephx:
      keyType: aes

  config:
    global:
      osd_pool_default_size: '2'
      osd_pool_default_min_size: '2'

  topology:
    nodes:
      - name: node-01
        fqdn: node-01.ceph-multidc-01.clusters.example.com
        machineRef: storage-a-01
        site: site-a
        labels:
          - ceph-core

      - name: node-02
        fqdn: node-02.ceph-multidc-01.clusters.example.com
        machineRef: storage-a-02
        site: site-a
        labels:
          - ceph-core

      - name: node-03
        fqdn: node-03.ceph-multidc-01.clusters.example.com
        machineRef: storage-a-03
        site: site-a
        labels:
          - ceph-core

  services:
    - service_type: mon
      placement:
        count: 3
        label: ceph-core

    - service_type: mgr
      placement:
        count: 2
        label: ceph-core

    - service_type: osd
      service_id: data
      placement:
        label: ceph-core
      spec:
        data_devices:
          paths:
            - /dev/sdb

    - service_type: mds
      service_id: odf-cephfs
      placement:
        count: 2
        label: ceph-core

    - service_type: rgw
      service_id: objects
      placement:
        count: 2
        label: ceph-core
      spec:
        rgw_realm: objects
        rgw_zonegroup: objects
        rgw_zone: objects
        rgw_frontend_port: 8080

    - service_type: nfs
      service_id: acceptance-nfs
      placement:
        count: 1
        label: ceph-core

    - service_type: nvmeof
      service_id: block
      placement:
        hosts:
          - node-01.ceph-multidc-01.clusters.example.com
          - node-02.ceph-multidc-01.clusters.example.com
      spec:
        pool: odf-hub-multidc-01-rbd
        group: block

---
apiVersion: bootwright.io/v1alpha1
kind: CephPlacementPolicy
metadata:
  name: host-spread

spec:
  clusterRef: ceph-multidc-01
  failureDomain: host
  ruleName: host-rule

  replicated:
    size: 2
    minSize: 2

---
apiVersion: bootwright.io/v1alpha1
kind: CephPool
metadata:
  name: odf-hub-multidc-01-rbd

spec:
  clusterRef: ceph-multidc-01
  placementPolicyRef: host-spread
  role: rbd
  application: rbd

---
apiVersion: bootwright.io/v1alpha1
kind: CephPool
metadata:
  name: odf-cephfs-metadata

spec:
  clusterRef: ceph-multidc-01
  placementPolicyRef: host-spread
  role: cephfsMetadata
  application: cephfs

---
apiVersion: bootwright.io/v1alpha1
kind: CephPool
metadata:
  name: odf-cephfs-data

spec:
  clusterRef: ceph-multidc-01
  placementPolicyRef: host-spread
  role: cephfsData
  application: cephfs

---
apiVersion: bootwright.io/v1alpha1
kind: CephFilesystem
metadata:
  name: odf-cephfs

spec:
  clusterRef: ceph-multidc-01
  mdsServiceRef: mds.odf-cephfs
  metadataPoolRef: odf-cephfs-metadata

  dataPoolRefs:
    - odf-cephfs-data

  mds:
    activeCount: 1
    standbyCountWanted: 1

  subvolumeGroups:
    - name: csi
      mode: '755'

---
apiVersion: bootwright.io/v1alpha1
kind: CephPool
metadata:
  name: objects-data

spec:
  clusterRef: ceph-multidc-01
  placementPolicyRef: host-spread
  role: rgw

---
apiVersion: bootwright.io/v1alpha1
kind: CephObjectGateway
metadata:
  name: objects

spec:
  clusterRef: ceph-multidc-01
  serviceRef: rgw.objects
  realm: objects
  zoneGroup: objects
  zone: objects
  endpoint: {}

  pools:
    dataPoolRef: objects-data

---
apiVersion: bootwright.io/v1alpha1
kind: CephObjectUser
metadata:
  name: app-writer

spec:
  clusterRef: ceph-multidc-01
  objectGatewayRef: objects
  displayName: App writer

---
apiVersion: bootwright.io/v1alpha1
kind: CephObjectBucket
metadata:
  name: app-data

spec:
  clusterRef: ceph-multidc-01
  objectGatewayRef: objects
  ownerRef: app-writer

  policy:
    Version: "2012-10-17"

    Statement:
      - Sid: ReadOnlyForReader
        Effect: Allow
        Action:
          - s3:GetObject
        Principal:
          AWS:
            - arn:aws:iam:::user/app-reader
        Resource:
          - arn:aws:s3:::app-data/*

---
apiVersion: bootwright.io/v1alpha1
kind: CephNFSExport
metadata:
  name: acceptance-nfs

spec:
  clusterRef: ceph-multidc-01
  serviceID: acceptance-nfs
  filesystemRef: odf-cephfs

  native:
    pseudo: /acceptance
    protocols: [4]
    fsal:
      name: CEPH
    clients:
      - addresses: [192.0.2.123/24]
        access_type: RW
        squash: root_squash
