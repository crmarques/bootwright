apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: rhel-fw

spec:
  hardware:
    providerRef: lab-libvirt
    profileRef: rhel

    nics:
      - name: enp1s0

  os:
    install:
      profileRef: rhel-9-8-firewall

  network:
    configRef: lab-guests
    installAddressRef: ip

    addresses:
      - name: ip
        address: 198.51.100.21
        interface: enp1s0
