apiVersion: bootwright.io/v1alpha1
kind: CephObjectBucket
metadata:
  name: app-data

spec:
  clusterRef: ceph-lab
  objectGatewayRef: objects
  ownerRef: app-writer

  policy:
    Version: "2012-10-17"

    Statement:
      - Sid: ReadOnlyForReader
        Effect: Allow
        Action:
          - s3:GetObject
        Principal:
          AWS:
            - arn:aws:iam:::user/app-reader
        Resource:
          - arn:aws:s3:::app-data/*
