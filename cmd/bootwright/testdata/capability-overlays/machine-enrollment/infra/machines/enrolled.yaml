apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: enrolled

spec:
  os:
    provided: {}

  network:
    addresses:
      - name: ssh
        address: 192.0.2.222

  access:
    ssh:
      knownHostsRef: enrolled-host-key

      auth:
        operatorIdentity: {}

    lifecycle:
      user: bootwright
      privateKeyRef: enrolled-admin
      knownHostsRef: enrolled-host-key
      privilege: sudo

      bootstrap:
        auth:
          askPassword: {}

        privilege:
          sudo:
            askPassword: {}
