apiVersion: bootwright.io/v1alpha1
kind: ClusterAddon
metadata:
  name: fusion-data-foundation
spec:
  type: olm

  provides:
    - dataFoundation

  accepts:
    inputs:
      - name: external-storage
        schema:
          type: object
          required:
            - exportRef
          properties:
            exportRef:
              refKind: StorageExport
        effects:
          - type: storageExportAttachment
            provider: dataFoundation
      # Optional: name a secret holding your IBM entitlement key and
      # Bootwright merges it into the cluster's global pull secret before the
      # operator installs (FDF operand images pull from cp.icr.io). Omit the
      # input when the entitlement is already in the cluster pull secret.
      - name: ibm-entitlement
        schema:
          type: object
          required:
            - entitlementKeyRef
          properties:
            entitlementKeyRef:
              secret: true
        effects:
          - type: globalPullSecretMerge
            registry: cp.icr.io
            username: cp

  olm:
    namespace:
      name: openshift-storage
      create: true
      labels:
        openshift.io/cluster-monitoring: "true"
    operatorGroup:
      name: openshift-storage
      targetNamespaces:
        - openshift-storage
    catalogSource:
      name: isf-data-foundation-catalog
      displayName: IBM Fusion Data Foundation Catalog
      publisher: IBM
      image: icr.io/cpopen/isf-data-foundation-catalog:v4.18
      pollInterval: 45m
    subscription:
      name: odf-operator
      package: odf-operator
      channel: stable-4.18

  hooks:
    # The FDF <-> Ceph integration ships with the add-on: after the operator's
    # CSV succeeds, the hook runs Rook's external-cluster-details exporter on
    # a Ceph node of the referenced StorageExport's cluster (creating the CSI
    # clients), captures the JSON payload, and applies the external-mode
    # consumer manifests. run: always keeps rotated mon endpoints/keys
    # converging on every apply.
    - name: attach-external-storage
      lifecycle: postOperatorReady
      playbook: playbooks/export-external-details.yaml
      target:
        fromInput:
          input: external-storage
          property: exportRef
      run: always
      outputs:
        - name: externalDetails
          file: external-cluster-details.json
          secret: true
          format: json
      manifests:
        - path: manifests/rook-ceph-external-cluster-details.yaml
          reclaimRendered: true
        - path: manifests/ocs-external-storagecluster.yaml
        - path: manifests/ocs-external-storagesystem.yaml

  readiness:
    timeout: 45m
    checks:
      - type: csvSucceeded
        namespace: openshift-storage
        subscription: odf-operator
      - type: condition
        apiVersion: ocs.openshift.io/v1
        kind: StorageCluster
        namespace: openshift-storage
        name: ocs-external-storagecluster
        condition:
          type: Available
          status: "True"
