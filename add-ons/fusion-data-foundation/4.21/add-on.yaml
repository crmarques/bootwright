apiVersion: bootwright.io/v1alpha1
kind: ClusterAddon
metadata:
  name: fusion-data-foundation
spec:
  type: olm

  provides:
    - dataFoundation

  accepts:
    inputs:
      - name: external-storage
        required: true
        resourceRef:
          kind: StorageExport
        effects:
          - storageExportAttachment: {}
      - name: ibm-entitlement
        secretRef: {}
        effects:
          - globalPullSecretMerge:
              registry: cp.icr.io
              username: cp

  olm:
    namespace:
      name: openshift-storage
      create: true
      labels:
        openshift.io/cluster-monitoring: "true"
    operatorGroup:
      name: openshift-storage
      targetNamespaces:
        - openshift-storage
    catalogSource:
      name: isf-data-foundation-catalog
      displayName: IBM Fusion Data Foundation Catalog
      publisher: IBM
      image: icr.io/cpopen/isf-data-foundation-catalog:v4.21
      pollInterval: 45m
      grpcPodConfig:
        securityContextConfig: restricted
    subscription:
      name: odf-operator
      package: odf-operator
      channel: stable-4.21

  steps:
    - name: attach-external-storage
      follows: operatorReady
      playbook: playbooks/export-external-details.yaml
      target:
        fromInput:
          input: external-storage
      run: always
      timeout: 20m
      outputs:
        - name: externalDetails
          file: external-cluster-details.json
          secret: true
          format: json
      manifests:
        - path: manifests/rook-ceph-external-cluster-details.yaml
          reclaimRendered: true
        - path: manifests/ocs-external-storagecluster.yaml

  readiness:
    timeout: 45m
    checks:
      - csvSucceeded:
          namespace: openshift-storage
          subscription: odf-operator
      - condition:
          apiVersion: ocs.openshift.io/v1
          kind: StorageCluster
          namespace: openshift-storage
          name: ocs-external-storagecluster
          condition:
            type: Available
            status: "True"
