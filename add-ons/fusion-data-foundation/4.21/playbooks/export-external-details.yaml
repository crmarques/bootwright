- name: Export Data Foundation external cluster details
  hosts: all
  gather_facts: false
  become: true
  vars:
    bootwright_exporter_script: ""
    bootwright_exporter_configmap: rook-ceph-external-cluster-script-config
    bootwright_exporter_namespace: openshift-storage
    bootwright_exporter_use_cephadm_shell: true
    bootwright_exporter_staged_path: /tmp/bootwright-ceph-external-cluster-details-exporter.py
    bootwright_df: "{{ bootwright_hook_refs.exportRef.spec.dataFoundation }}"
    bootwright_gateway: "{{ bootwright_hook_refs.exportRef.objectGateway | default(None) }}"
    bootwright_exporter_args:
      - --format
      - json
      - --rbd-data-pool-name
      - "{{ bootwright_df.rbdPoolRef }}"
      - --cephfs-filesystem-name
      - "{{ bootwright_df.filesystemRef }}"
      - --k8s-cluster-name
      - "{{ bootwright_bound_cluster }}"
  tasks:
    - name: Extend the exporter args with the declared RGW endpoint
      when: bootwright_gateway
      ansible.builtin.set_fact:
        bootwright_exporter_args: >-
          {{ bootwright_exporter_args + ['--rgw-endpoint', bootwright_gateway.spec.public.dnsName ~ ':' ~ (bootwright_gateway.spec.public.port | default(443))] }}

    - name: Read the exporter script the operator publishes
      when: bootwright_exporter_script | length == 0
      delegate_to: localhost
      become: false
      ansible.builtin.command:
        argv:
          - oc
          - --kubeconfig
          - "{{ bootwright_kubeconfig }}"
          - --namespace
          - "{{ bootwright_exporter_namespace }}"
          - get
          - configmap
          - "{{ bootwright_exporter_configmap }}"
          - --output
          - jsonpath={.data.script}
      register: bootwright_exporter_configmap_read
      changed_when: false
      failed_when: false
      retries: 30
      delay: 10
      until:
        - bootwright_exporter_configmap_read.rc == 0
        - bootwright_exporter_configmap_read.stdout | length > 0

    - name: Assert the operator published the exporter script
      when: bootwright_exporter_script | length == 0
      delegate_to: localhost
      become: false
      ansible.builtin.assert:
        that:
          - bootwright_exporter_configmap_read.stdout | length > 0
        fail_msg: >-
          ConfigMap {{ bootwright_exporter_namespace }}/{{ bootwright_exporter_configmap }}
          has no data.script; the Data Foundation operator publishes the
          external-cluster exporter there once its CSV succeeds. Pre-place the
          script on a Ceph node and set bootwright_exporter_script to its path
          to skip the retrieval.

    - name: Stage the exporter script on the Ceph node
      when: bootwright_exporter_script | length == 0
      ansible.builtin.copy:
        content: "{{ bootwright_exporter_configmap_read.stdout | b64decode }}"
        dest: "{{ bootwright_exporter_staged_path }}"
        mode: "0600"

    - name: Resolve the exporter script path
      ansible.builtin.set_fact:
        bootwright_exporter_path: "{{ bootwright_exporter_script if bootwright_exporter_script | length > 0 else bootwright_exporter_staged_path }}"

    - name: Resolve the exporter command
      ansible.builtin.set_fact:
        bootwright_exporter_argv: "{{ ['python3', bootwright_exporter_path] + bootwright_exporter_args }}"

    - name: Wrap the exporter in cephadm shell
      when: bootwright_exporter_use_cephadm_shell | bool
      ansible.builtin.set_fact:
        bootwright_exporter_argv: "{{ ['cephadm', 'shell', '--mount', bootwright_exporter_path ~ ':' ~ bootwright_exporter_path, '--'] + bootwright_exporter_argv }}"

    - name: Run the Rook external cluster details exporter
      ansible.builtin.command:
        argv: "{{ bootwright_exporter_argv }}"
      register: bootwright_external_details
      changed_when: true
      no_log: true

    - name: Remove the staged exporter script
      when: bootwright_exporter_script | length == 0
      ansible.builtin.file:
        path: "{{ bootwright_exporter_staged_path }}"
        state: absent

    - name: Capture the declared externalDetails output
      ansible.builtin.copy:
        content: "{{ bootwright_external_details.stdout }}"
        dest: "{{ bootwright_hook_outputs_dir }}/external-cluster-details.json"
        mode: "0600"
      delegate_to: localhost
      become: false
      no_log: true
