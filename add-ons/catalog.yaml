entries:
  - name: openshift-data-foundation
    description: Red Hat OpenShift Data Foundation in external mode, attaching a Bootwright StorageExport
    defaultVersion: "4.21"
    versions:
      - version: "4.21"
        channel: stable-4.21
        notes: Subscribes to the cluster's redhat-operators catalog.
  - name: fusion-data-foundation
    description: IBM Fusion Data Foundation in external mode, attaching a Bootwright StorageExport
    defaultVersion: "4.21"
    versions:
      - version: "4.21"
        channel: stable-4.21
        notes: Ships the IBM catalog with its restricted pod security context; operand images need the IBM entitlement key in the cluster pull secret (the ibm-entitlement input merges it).
