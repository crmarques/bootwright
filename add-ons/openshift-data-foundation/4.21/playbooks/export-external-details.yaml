- name: Export Data Foundation external cluster details
  hosts: all
  gather_facts: false
  become: true
  vars:
    bootwright_exporter_script: ""
    bootwright_exporter_configmap: rook-ceph-external-cluster-script-config
    bootwright_exporter_namespace: openshift-storage
    bootwright_exporter_use_cephadm_shell: true
    bootwright_exporter_workdir: "/tmp/bootwright-df-exporter-{{ bootwright_bound_cluster }}"
    bootwright_exporter_staged_path: "{{ bootwright_exporter_workdir }}/exporter.py"
    bootwright_exporter_ca_path: "{{ bootwright_exporter_workdir }}/trust-bundle.crt"
    bootwright_exporter_gateway_cert_path: "{{ bootwright_exporter_workdir }}/object-gateway.crt"
    bootwright_exporter_system_ca_path: /etc/pki/tls/certs/ca-bundle.crt
    bootwright_df: "{{ bootwright_step_refs['external-storage'].spec.dataFoundation }}"
    bootwright_gateway: "{{ bootwright_step_refs['external-storage'].objectGateway | default(None) }}"
    bootwright_gateway_cert_paths: "{{ (bootwright_gateway | default({}, true)).certificatePaths | default([]) }}"
    bootwright_exporter_key_type: "{{ bootwright_step_refs['external-storage'].cephxKeyType | default('') }}"
    bootwright_exporter_key_prefixes:
      aes: AQ
      aes256k: Ag
    bootwright_exporter_client_users: 'healthchecker|csi-'
    bootwright_exporter_args:
      - --format
      - json
      - --rbd-data-pool-name
      - "{{ bootwright_df.rbdPoolRef }}"
      - --cephfs-filesystem-name
      - "{{ bootwright_df.filesystemRef }}"
      - --k8s-cluster-name
      - "{{ bootwright_bound_cluster }}"
  tasks:
    - name: Probe the cephadm admin credentials on this node
      when: bootwright_exporter_use_cephadm_shell | bool
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/ceph/ceph.conf
        - /etc/ceph/ceph.client.admin.keyring
      register: bootwright_exporter_admin_files

    - name: Refuse to run the exporter without cephadm admin credentials
      when: bootwright_exporter_use_cephadm_shell | bool
      ansible.builtin.assert:
        that:
          - bootwright_exporter_admin_files.results | selectattr('stat.exists', 'equalto', false) | list | length == 0
        fail_msg: >-
          This node is missing
          {{ bootwright_exporter_admin_files.results | selectattr('stat.exists', 'equalto', false) | map(attribute='item') | join(' and ') }},
          so the exporter's RADOS connect would fail with a misleading
          permission-denied error. cephadm maintains these files only on hosts
          carrying the _admin label (the bootstrap host, unless the applied
          host spec dropped the label). Re-apply the storage cluster so the
          declared host spec restores the _admin label on the bootstrap node,
          then rerun this step.
        success_msg: >-
          cephadm admin credentials are present; the exporter can connect.

    - name: Extend the exporter args with the declared RGW endpoint
      when: bootwright_gateway is not none
      ansible.builtin.set_fact:
        bootwright_exporter_args: >-
          {{ bootwright_exporter_args + ['--rgw-endpoint', bootwright_gateway.publicFQDN ~ ':' ~ (bootwright_gateway.spec.public.port | default(443))] }}

    - name: Read the endpoint the Ceph managers publish for Prometheus
      ansible.builtin.command:
        argv: >-
          {{ (['cephadm', 'shell', '--'] if bootwright_exporter_use_cephadm_shell | bool else [])
             + ['ceph', 'mgr', 'services', '--format', 'json'] }}
      register: bootwright_exporter_mgr_services
      changed_when: false
      failed_when: false

    - name: Record the scheme the manager Prometheus endpoint serves
      ansible.builtin.set_fact:
        bootwright_exporter_monitoring_url: >-
          {{ (bootwright_exporter_mgr_services.stdout | default('') | trim | default('{}', true) | from_json).prometheus | default('') }}

    - name: Create the exporter working directory
      ansible.builtin.file:
        path: "{{ bootwright_exporter_workdir }}"
        state: directory
        mode: "0700"

    - name: Read the exporter script the operator publishes
      when: bootwright_exporter_script | length == 0
      delegate_to: localhost
      become: false
      ansible.builtin.command:
        argv:
          - oc
          - --kubeconfig
          - "{{ bootwright_kubeconfig }}"
          - --namespace
          - "{{ bootwright_exporter_namespace }}"
          - get
          - configmap
          - "{{ bootwright_exporter_configmap }}"
          - --output
          - jsonpath={.data.script}
      register: bootwright_exporter_configmap_read
      changed_when: false
      failed_when: false
      retries: 30
      delay: 10
      until:
        - bootwright_exporter_configmap_read.rc == 0
        - bootwright_exporter_configmap_read.stdout | length > 0

    - name: Assert the operator published the exporter script
      when: bootwright_exporter_script | length == 0
      delegate_to: localhost
      become: false
      ansible.builtin.assert:
        that:
          - bootwright_exporter_configmap_read.stdout | length > 0
        fail_msg: >-
          ConfigMap {{ bootwright_exporter_namespace }}/{{ bootwright_exporter_configmap }}
          has no data.script; the Data Foundation operator publishes the
          external-cluster exporter there once its CSV succeeds. Pre-place the
          script on a Ceph node and set bootwright_exporter_script to its path
          to skip the retrieval.

    - name: Stage the exporter script the operator published
      when: bootwright_exporter_script | length == 0
      ansible.builtin.copy:
        content: "{{ bootwright_exporter_configmap_read.stdout | b64decode }}"
        dest: "{{ bootwright_exporter_staged_path }}"
        mode: "0600"

    - name: Stage a pre-placed exporter script beside the trust bundle
      when: bootwright_exporter_script | length > 0
      ansible.builtin.copy:
        src: "{{ bootwright_exporter_script }}"
        dest: "{{ bootwright_exporter_staged_path }}"
        remote_src: true
        mode: "0600"

    - name: Resolve the exporter script path
      ansible.builtin.set_fact:
        bootwright_exporter_path: "{{ bootwright_exporter_staged_path }}"

    - name: Calculate the staged exporter script SHA-256
      ansible.builtin.stat:
        path: "{{ bootwright_exporter_path }}"
        checksum_algorithm: sha256
        get_checksum: true
      register: bootwright_exporter_script_stat

    - name: Confirm the staged exporter script has a SHA-256
      ansible.builtin.assert:
        that:
          - bootwright_exporter_script_stat.stat.isreg | default(false)
          - bootwright_exporter_script_stat.stat.checksum | default('') is match('^[0-9a-f]{64}$')
        fail_msg: >-
          The staged Data Foundation exporter is not a regular file with a
          valid SHA-256, so Bootwright refuses to execute code it cannot
          identify in the add-on step record.

    - name: Record the staged exporter script SHA-256
      delegate_to: localhost
      become: false
      ansible.builtin.copy:
        content: "sha256:{{ bootwright_exporter_script_stat.stat.checksum }}\n"
        dest: "{{ bootwright_step_outputs_dir }}/exporter-script.sha256"
        mode: "0600"

    - name: Read the certificate authority that signed the manager Prometheus endpoint
      when: bootwright_exporter_monitoring_url is match('https://')
      ansible.builtin.command:
        argv: "{{ (['cephadm', 'shell', '--'] if bootwright_exporter_use_cephadm_shell | bool else []) + item }}"
      loop:
        - [ceph, orch, certmgr, cert, get, cephadm_root_ca_cert]
        - [ceph, orch, sd, dump, cert]
        - [ceph, config-key, get, mgr/cephadm/cert_store.cert.cephadm_root_ca_cert]
      register: bootwright_exporter_ca_probe
      changed_when: false
      failed_when: false

    - name: Record the certificate authority the probes returned
      when: bootwright_exporter_monitoring_url is match('https://')
      ansible.builtin.set_fact:
        bootwright_exporter_ca_pem: >-
          {{ bootwright_exporter_ca_probe.results | default([])
             | selectattr('stdout', 'defined')
             | selectattr('stdout', 'search', 'BEGIN CERTIFICATE')
             | map(attribute='stdout') | list | first | default('') }}

    - name: Refuse to export against a manager endpoint whose issuer stays unknown
      when: bootwright_exporter_monitoring_url is match('https://')
      ansible.builtin.assert:
        that:
          - bootwright_exporter_ca_pem | length > 0
        fail_msg: >-
          The Ceph managers publish {{ bootwright_exporter_monitoring_url }}, so the
          exporter must verify a certificate this cluster's own cephadm root CA
          signed, and none of the three retrieval paths returned one:
          `ceph orch certmgr cert get cephadm_root_ca_cert`, `ceph orch sd dump
          cert`, or the `mgr/cephadm/cert_store.cert.cephadm_root_ca_cert`
          config-key. Without it the exporter validates against the system trust
          store, exits 1 on CERTIFICATE_VERIFY_FAILED, and Data Foundation cannot
          reconcile — its StorageCluster refuses to come up without the
          monitoring-endpoint resource. Run those commands on the seed to see
          which one this build offers.
        success_msg: >-
          The cephadm root CA is available; the exporter can verify the manager
          Prometheus endpoint instead of failing on it.

    - name: Seed the exporter trust bundle from the node trust store
      ansible.builtin.copy:
        src: "{{ bootwright_exporter_system_ca_path }}"
        dest: "{{ bootwright_exporter_ca_path }}"
        remote_src: true
        mode: "0600"

    - name: Add the cephadm root CA to the exporter trust bundle
      when: bootwright_exporter_monitoring_url is match('https://')
      ansible.builtin.blockinfile:
        path: "{{ bootwright_exporter_ca_path }}"
        block: "{{ bootwright_exporter_ca_pem }}"
        marker: "# {mark} BOOTWRIGHT CEPHADM ROOT CA"
        mode: "0600"

    - name: Refuse a gateway whose ingresses serve more than one certificate
      when: bootwright_gateway_cert_paths | length > 0
      ansible.builtin.assert:
        that:
          - bootwright_gateway_cert_paths | length <= 1
        fail_msg: >-
          Object gateway {{ bootwright_gateway.metadata.name }} declares
          {{ bootwright_gateway_cert_paths | length }} different ingress
          certificates, but its ingresses all answer the single public name
          {{ bootwright_gateway.publicFQDN }} and the exporter accepts one
          --rgw-tls-cert-path. Whichever certificate the export carried would be
          the only one Data Foundation trusts, so the S3 endpoint would work
          from some ingress hosts and fail from others. Point every ingress
          tls.certificateRef at the same certificate.
        success_msg: >-
          The declared object gateway serves one certificate.

    - name: Read the certificate the declared object gateway serves
      when: bootwright_gateway_cert_paths | length > 0
      ansible.builtin.set_fact:
        bootwright_gateway_certificate: "{{ lookup('ansible.builtin.file', bootwright_gateway_cert_paths | first) | trim }}"

    - name: Stage the certificate the declared object gateway serves
      when: bootwright_gateway_cert_paths | length > 0
      ansible.builtin.copy:
        content: "{{ bootwright_gateway_certificate }}\n"
        dest: "{{ bootwright_exporter_gateway_cert_path }}"
        mode: "0600"

    - name: Point the exporter at the certificate the object gateway serves
      when: bootwright_gateway_cert_paths | length > 0
      ansible.builtin.set_fact:
        bootwright_exporter_args: >-
          {{ bootwright_exporter_args + ['--rgw-tls-cert-path', bootwright_exporter_gateway_cert_path] }}

    - name: Read the cephx entities this export's clients authenticate with
      when: bootwright_exporter_key_type | length > 0
      ansible.builtin.command:
        argv: >-
          {{ (['cephadm', 'shell', '--'] if bootwright_exporter_use_cephadm_shell | bool else [])
             + ['ceph', 'auth', 'ls', '--format', 'json'] }}
      register: bootwright_exporter_auth_ls
      changed_when: false

    - name: Record the cephx entities minted at another key type
      when: bootwright_exporter_key_type | length > 0
      ansible.builtin.set_fact:
        bootwright_exporter_stale_entities: >-
          {{ (bootwright_exporter_auth_ls.stdout | default('') | trim | default('{}', true) | from_json).auth_dump | default([])
             | selectattr('entity', 'defined')
             | selectattr('entity', 'match', '^client\.(' ~ bootwright_exporter_client_users ~ ')')
             | selectattr('key', 'defined')
             | rejectattr('key', 'match', '^' ~ bootwright_exporter_key_prefixes[bootwright_exporter_key_type])
             | map(attribute='entity') | list }}

    - name: Remove the cephx entities minted at another key type so the exporter remints them
      when:
        - bootwright_exporter_key_type | length > 0
        - bootwright_exporter_stale_entities | default([]) | length > 0
      ansible.builtin.command:
        argv: >-
          {{ (['cephadm', 'shell', '--'] if bootwright_exporter_use_cephadm_shell | bool else [])
             + ['ceph', 'auth', 'rm', item] }}
      loop: "{{ bootwright_exporter_stale_entities }}"
      changed_when: true

    - name: Resolve the exporter command
      ansible.builtin.set_fact:
        bootwright_exporter_argv: "{{ ['python3', bootwright_exporter_path] + bootwright_exporter_args }}"

    - name: Point the exporter at the node trust store
      ansible.builtin.set_fact:
        bootwright_exporter_argv: "{{ ['env', 'REQUESTS_CA_BUNDLE=' ~ bootwright_exporter_ca_path] + bootwright_exporter_argv }}"

    - name: Wrap the exporter in cephadm shell
      when: bootwright_exporter_use_cephadm_shell | bool
      ansible.builtin.set_fact:
        bootwright_exporter_argv: "{{ ['cephadm', 'shell', '--mount', bootwright_exporter_workdir ~ ':' ~ bootwright_exporter_workdir, '--'] + bootwright_exporter_argv }}"

    - name: Run the Rook external cluster details exporter
      ansible.builtin.command:
        argv: "{{ bootwright_exporter_argv }}"
      register: bootwright_external_details
      changed_when: true
      failed_when: false
      no_log: true

    - name: Confirm the external cluster details exporter succeeded
      ansible.builtin.assert:
        that:
          - bootwright_external_details.rc == 0
          - bootwright_external_details.stdout | default('') | length > 0
        fail_msg: >-
          The Data Foundation external-cluster exporter exited
          {{ bootwright_external_details.rc | default('unknown') }} on
          {{ bootwright_bound_cluster }}. Its stdout is withheld (it carries
          cluster credentials); stderr was:
          {{ bootwright_external_details.stderr | default('') | trim }}.
          Verify the Ceph cluster is reachable and that rbd pool
          {{ bootwright_df.rbdPoolRef }} and CephFS {{ bootwright_df.filesystemRef }}
          exist.

    - name: Remove the exporter working directory
      ansible.builtin.file:
        path: "{{ bootwright_exporter_workdir }}"
        state: absent

    - name: Refuse an export that dropped the declared object gateway
      when: bootwright_gateway is not none
      ansible.builtin.assert:
        that:
          - (bootwright_external_details.stdout | default('') | trim | default('[]', true) | from_json)
            | selectattr('name', 'defined') | selectattr('name', 'equalto', 'ceph-rgw')
            | list | length > 0
        fail_msg: >-
          StorageExport {{ bootwright_step_refs['external-storage'].metadata.name }}
          declares objectGatewayRef
          {{ bootwright_step_refs['external-storage'].spec.dataFoundation.objectGatewayRef }},
          so the exporter was given --rgw-endpoint
          {{ bootwright_gateway.publicFQDN }}:{{ bootwright_gateway.spec.public.port | default(443) }},
          but the export carries no ceph-rgw entry. The exporter validates that
          endpoint by dialling it and comparing the cluster id its admin-ops API
          returns against the Ceph cluster fsid; on a dial or fsid failure it
          drops the endpoint and still exits 0. Data Foundation then installs
          with no object storage at all and NooBaa quietly falls back to a
          pv-pool backing store on RBD, so the S3 this export declares never
          exists. The exporter said: {{ bootwright_external_details.stderr | default('') | trim | default('<nothing>', true) }}.
          From a Ceph node, check that {{ bootwright_gateway.publicFQDN }}
          resolves and that its ingress VIP answers on port
          {{ bootwright_gateway.spec.public.port | default(443) }}. On TLS: this
          run staged {{ bootwright_gateway_cert_paths | length }} certificate(s)
          from {{ bootwright_gateway.metadata.name }}. With one staged, the
          exporter verifies against exactly that certificate, so an endpoint
          serving anything else — an ingress still holding a previous
          certificate, or a load balancer terminating TLS ahead of it — fails
          here; with none staged it verifies against
          {{ bootwright_exporter_system_ca_path }} instead, and a certificate
          whose issuer the node does not trust fails silently.
        success_msg: >-
          The export carries the declared object gateway, so Data Foundation
          gets its S3 endpoint.

    - name: Read the trust bundle this cluster injects into its operands
      when: bootwright_gateway_cert_paths | length > 0
      delegate_to: localhost
      become: false
      ansible.builtin.command:
        argv:
          - oc
          - --kubeconfig
          - "{{ bootwright_kubeconfig }}"
          - get
          - proxy.config.openshift.io/cluster
          - --output
          - jsonpath={.spec.trustedCA.name}
      register: bootwright_cluster_trust_ref
      changed_when: false

    - name: Resolve the config map holding the cluster trust bundle
      when: bootwright_gateway_cert_paths | length > 0
      ansible.builtin.set_fact:
        bootwright_trust_configmap: "{{ bootwright_cluster_trust_ref.stdout | default('') | trim | default('user-ca-bundle', true) }}"

    - name: Read the certificates that trust bundle already carries
      when: bootwright_gateway_cert_paths | length > 0
      delegate_to: localhost
      become: false
      ansible.builtin.command:
        argv:
          - oc
          - --kubeconfig
          - "{{ bootwright_kubeconfig }}"
          - --namespace
          - openshift-config
          - get
          - configmap
          - "{{ bootwright_trust_configmap }}"
          - --output
          - jsonpath={.data.ca-bundle\.crt}
      register: bootwright_trust_bundle_read
      changed_when: false
      failed_when: false

    - name: Record the trust bundle the object gateway certificate must join
      when: bootwright_gateway_cert_paths | length > 0
      ansible.builtin.set_fact:
        bootwright_trust_bundle_pem: "{{ bootwright_trust_bundle_read.stdout | default('') | trim }}"

    - name: Merge the object gateway certificate into that trust bundle
      when: bootwright_gateway_cert_paths | length > 0
      ansible.builtin.set_fact:
        bootwright_trust_bundle_merged: "{{ [bootwright_trust_bundle_pem, bootwright_gateway_certificate] | reject('equalto', '') | join('\n\n') }}"

    - name: Publish the object gateway certificate into the cluster trust bundle
      when:
        - bootwright_gateway_cert_paths | length > 0
        - bootwright_gateway_certificate | default('') not in bootwright_trust_bundle_pem | default('')
      delegate_to: localhost
      become: false
      ansible.builtin.command:
        argv:
          - oc
          - --kubeconfig
          - "{{ bootwright_kubeconfig }}"
          - apply
          - --server-side
          - --field-manager
          - bootwright
          - --force-conflicts
          - --filename
          - "-"
        stdin: "{{ bootwright_trust_manifest | to_nice_yaml(indent=2) }}"
      vars:
        bootwright_trust_manifest:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: "{{ bootwright_trust_configmap }}"
            namespace: openshift-config
          data:
            ca-bundle.crt: "{{ bootwright_trust_bundle_merged }}"
      changed_when: true

    - name: Point the cluster trust at the bundle the object gateway certificate joined
      when:
        - bootwright_gateway_cert_paths | length > 0
        - bootwright_cluster_trust_ref.stdout | default('') | trim | length == 0
      delegate_to: localhost
      become: false
      ansible.builtin.command:
        argv:
          - oc
          - --kubeconfig
          - "{{ bootwright_kubeconfig }}"
          - patch
          - proxy.config.openshift.io/cluster
          - --type
          - merge
          - --patch
          - '{"spec":{"trustedCA":{"name":"{{ bootwright_trust_configmap }}"}}}'
      changed_when: true

    - name: Record the exported entries whose cephx key type this build cannot parse
      ansible.builtin.set_fact:
        bootwright_exporter_unreadable_keys: >-
          {{ (bootwright_external_details.stdout | default('') | trim | default('[]', true) | from_json)
             | selectattr('data.userID', 'defined')
             | selectattr('data.userID', 'match', '^(' ~ bootwright_exporter_client_users ~ ')')
             | selectattr('data.userKey', 'defined')
             | rejectattr('data.userKey', 'match', '^AQ')
             | map(attribute='name', default='<unnamed>') | list }}

    - name: Refuse to attach cephx keys this Data Foundation build cannot parse
      ansible.builtin.assert:
        that:
          - bootwright_exporter_unreadable_keys | length == 0
        fail_msg: >-
          The Ceph cluster minted the cephx keys behind
          {{ bootwright_exporter_unreadable_keys | join(', ') }} in a format
          this Data Foundation build cannot read: the exported blobs begin
          "Ag" (AES256KRB5, a 32-byte secret) rather than "AQ" (AES, a 16-byte
          secret). IBM Storage Ceph mints AES256KRB5 by default from build
          20.2.1-297 onwards, while Data Foundation 4.21 bundles a Ceph 20.2.0
          client whose keyring parser rejects that type outright. Attaching
          them anyway leaves the StorageCluster reporting
          ExternalClusterConnecting=False with reason ExternalClusterStateError
          until the readiness budget expires, while rook logs "error setting
          modifier ... Malformed input" against
          client.healthchecker.keyring throughout. Rerunning this step alone
          cannot repair it: the exporter adopts an existing cephx entity
          verbatim. Declare spec.ceph.security.cephx.keyType: aes on
          StorageCluster/{{ bootwright_step_refs['external-storage'].spec.storageClusterRef }}
          and apply the storage cluster: Bootwright then widens the mon map's
          allowed ciphers, makes aes the minted default, and removes these
          entities on the next export so they are reminted at a type this
          client can read. That weakens cephx for every client of that Ceph
          cluster, so the alternative is to pair it with a Data Foundation
          build whose client parses AES256KRB5. Check the vendor support matrix
          for this pairing before choosing.
        success_msg: >-
          The exported cephx keys use the AES key type this Data Foundation
          build can read.

    - name: Re-read the cephx entities now that the exporter has minted them
      when: bootwright_exporter_key_type | length > 0
      ansible.builtin.command:
        argv: >-
          {{ (['cephadm', 'shell', '--'] if bootwright_exporter_use_cephadm_shell | bool else [])
             + ['ceph', 'auth', 'ls', '--format', 'json'] }}
      register: bootwright_exporter_auth_recheck
      changed_when: false

    - name: Record the cephx keys Ceph holds for this export's clients
      when: bootwright_exporter_key_type | length > 0
      ansible.builtin.set_fact:
        bootwright_exporter_live_keys: >-
          {{ (bootwright_exporter_auth_recheck.stdout | default('') | trim | default('{}', true) | from_json).auth_dump | default([])
             | selectattr('entity', 'defined')
             | selectattr('entity', 'match', '^client\.(' ~ bootwright_exporter_client_users ~ ')')
             | selectattr('key', 'defined')
             | map(attribute='key') | list }}

    - name: Record the exported entries whose cephx key Ceph no longer holds
      when: bootwright_exporter_key_type | length > 0
      ansible.builtin.set_fact:
        bootwright_exporter_superseded_keys: >-
          {{ (bootwright_external_details.stdout | default('') | trim | default('[]', true) | from_json)
             | selectattr('data.userID', 'defined')
             | selectattr('data.userID', 'match', '^(' ~ bootwright_exporter_client_users ~ ')')
             | selectattr('data.userKey', 'defined')
             | rejectattr('data.userKey', 'in', bootwright_exporter_live_keys)
             | map(attribute='name', default='<unnamed>') | list }}

    - name: Refuse an export whose cephx keys another cluster re-minted mid-run
      when: bootwright_exporter_key_type | length > 0
      ansible.builtin.assert:
        that:
          - bootwright_exporter_superseded_keys | default([]) | length == 0
        fail_msg: >-
          Ceph no longer holds the cephx keys behind
          {{ bootwright_exporter_superseded_keys | join(', ') }}, so attaching
          this export would give
          {{ bootwright_bound_cluster }} credentials that cannot authenticate.
          Declaring spec.ceph.security.cephx.keyType makes this step delete the
          mistyped client.healthchecker and client.csi-* entities so the
          exporter remints them, and Bootwright passes no
          --restricted-auth-permission, so every OpenShift cluster attached to
          {{ bootwright_step_refs['external-storage'].spec.storageClusterRef }}
          shares those five entities. Two clusters exporting in the same apply
          therefore race: this run minted its keys, then another run deleted
          and reminted them. Rerun the apply. The entities now carry the
          declared key type, so neither run deletes them again and both adopt
          the same keys.
        success_msg: >-
          Ceph still holds every cephx key this export carries.

    - name: Capture the declared externalDetails output
      ansible.builtin.copy:
        content: "{{ bootwright_external_details.stdout }}"
        dest: "{{ bootwright_step_outputs_dir }}/external-cluster-details.json"
        mode: "0600"
      delegate_to: localhost
      become: false
      no_log: true
