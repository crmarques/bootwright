- name: Export Data Foundation external cluster details
  hosts: all
  gather_facts: false
  become: true
  vars:
    bootwright_exporter_script: ""
    bootwright_exporter_configmap: rook-ceph-external-cluster-script-config
    bootwright_exporter_namespace: openshift-storage
    bootwright_exporter_use_cephadm_shell: true
    bootwright_exporter_workdir: "/tmp/bootwright-df-exporter-{{ bootwright_bound_cluster }}"
    bootwright_exporter_staged_path: "{{ bootwright_exporter_workdir }}/exporter.py"
    bootwright_exporter_ca_path: "{{ bootwright_exporter_workdir }}/trust-bundle.crt"
    bootwright_exporter_system_ca_path: /etc/pki/tls/certs/ca-bundle.crt
    bootwright_df: "{{ bootwright_step_refs['external-storage'].spec.dataFoundation }}"
    bootwright_gateway: "{{ bootwright_step_refs['external-storage'].objectGateway | default(None) }}"
    bootwright_exporter_args:
      - --format
      - json
      - --rbd-data-pool-name
      - "{{ bootwright_df.rbdPoolRef }}"
      - --cephfs-filesystem-name
      - "{{ bootwright_df.filesystemRef }}"
      - --k8s-cluster-name
      - "{{ bootwright_bound_cluster }}"
  tasks:
    - name: Probe the cephadm admin credentials on this node
      when: bootwright_exporter_use_cephadm_shell | bool
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/ceph/ceph.conf
        - /etc/ceph/ceph.client.admin.keyring
      register: bootwright_exporter_admin_files

    - name: Refuse to run the exporter without cephadm admin credentials
      when: bootwright_exporter_use_cephadm_shell | bool
      ansible.builtin.assert:
        that:
          - bootwright_exporter_admin_files.results | selectattr('stat.exists', 'equalto', false) | list | length == 0
        fail_msg: >-
          This node is missing
          {{ bootwright_exporter_admin_files.results | selectattr('stat.exists', 'equalto', false) | map(attribute='item') | join(' and ') }},
          so the exporter's RADOS connect would fail with a misleading
          permission-denied error. cephadm maintains these files only on hosts
          carrying the _admin label (the bootstrap host, unless the applied
          host spec dropped the label). Re-apply the storage cluster so the
          declared host spec restores the _admin label on the bootstrap node,
          then rerun this step.
        success_msg: >-
          cephadm admin credentials are present; the exporter can connect.

    - name: Extend the exporter args with the declared RGW endpoint
      when: bootwright_gateway is not none
      ansible.builtin.set_fact:
        bootwright_exporter_args: >-
          {{ bootwright_exporter_args + ['--rgw-endpoint', bootwright_gateway.publicFQDN ~ ':' ~ (bootwright_gateway.spec.public.port | default(443))] }}

    - name: Read the endpoint the Ceph managers publish for Prometheus
      ansible.builtin.command:
        argv: >-
          {{ (['cephadm', 'shell', '--'] if bootwright_exporter_use_cephadm_shell | bool else [])
             + ['ceph', 'mgr', 'services', '--format', 'json'] }}
      register: bootwright_exporter_mgr_services
      changed_when: false
      failed_when: false

    - name: Record the scheme the manager Prometheus endpoint serves
      ansible.builtin.set_fact:
        bootwright_exporter_monitoring_url: >-
          {{ (bootwright_exporter_mgr_services.stdout | default('') | trim | default('{}', true) | from_json).prometheus | default('') }}

    - name: Create the exporter working directory
      ansible.builtin.file:
        path: "{{ bootwright_exporter_workdir }}"
        state: directory
        mode: "0700"

    - name: Read the exporter script the operator publishes
      when: bootwright_exporter_script | length == 0
      delegate_to: localhost
      become: false
      ansible.builtin.command:
        argv:
          - oc
          - --kubeconfig
          - "{{ bootwright_kubeconfig }}"
          - --namespace
          - "{{ bootwright_exporter_namespace }}"
          - get
          - configmap
          - "{{ bootwright_exporter_configmap }}"
          - --output
          - jsonpath={.data.script}
      register: bootwright_exporter_configmap_read
      changed_when: false
      failed_when: false
      retries: 30
      delay: 10
      until:
        - bootwright_exporter_configmap_read.rc == 0
        - bootwright_exporter_configmap_read.stdout | length > 0

    - name: Assert the operator published the exporter script
      when: bootwright_exporter_script | length == 0
      delegate_to: localhost
      become: false
      ansible.builtin.assert:
        that:
          - bootwright_exporter_configmap_read.stdout | length > 0
        fail_msg: >-
          ConfigMap {{ bootwright_exporter_namespace }}/{{ bootwright_exporter_configmap }}
          has no data.script; the Data Foundation operator publishes the
          external-cluster exporter there once its CSV succeeds. Pre-place the
          script on a Ceph node and set bootwright_exporter_script to its path
          to skip the retrieval.

    - name: Stage the exporter script the operator published
      when: bootwright_exporter_script | length == 0
      ansible.builtin.copy:
        content: "{{ bootwright_exporter_configmap_read.stdout | b64decode }}"
        dest: "{{ bootwright_exporter_staged_path }}"
        mode: "0600"

    - name: Stage a pre-placed exporter script beside the trust bundle
      when: bootwright_exporter_script | length > 0
      ansible.builtin.copy:
        src: "{{ bootwright_exporter_script }}"
        dest: "{{ bootwright_exporter_staged_path }}"
        remote_src: true
        mode: "0600"

    - name: Resolve the exporter script path
      ansible.builtin.set_fact:
        bootwright_exporter_path: "{{ bootwright_exporter_staged_path }}"

    - name: Read the certificate authority that signed the manager Prometheus endpoint
      when: bootwright_exporter_monitoring_url is match('https://')
      ansible.builtin.command:
        argv: "{{ (['cephadm', 'shell', '--'] if bootwright_exporter_use_cephadm_shell | bool else []) + item }}"
      loop:
        - [ceph, orch, certmgr, cert, get, cephadm_root_ca_cert]
        - [ceph, orch, sd, dump, cert]
        - [ceph, config-key, get, mgr/cephadm/cert_store.cert.cephadm_root_ca_cert]
      register: bootwright_exporter_ca_probe
      changed_when: false
      failed_when: false

    - name: Record the certificate authority the probes returned
      when: bootwright_exporter_monitoring_url is match('https://')
      ansible.builtin.set_fact:
        bootwright_exporter_ca_pem: >-
          {{ bootwright_exporter_ca_probe.results | default([])
             | selectattr('stdout', 'defined')
             | selectattr('stdout', 'search', 'BEGIN CERTIFICATE')
             | map(attribute='stdout') | list | first | default('') }}

    - name: Refuse to export against a manager endpoint whose issuer stays unknown
      when: bootwright_exporter_monitoring_url is match('https://')
      ansible.builtin.assert:
        that:
          - bootwright_exporter_ca_pem | length > 0
        fail_msg: >-
          The Ceph managers publish {{ bootwright_exporter_monitoring_url }}, so the
          exporter must verify a certificate this cluster's own cephadm root CA
          signed, and none of the three retrieval paths returned one:
          `ceph orch certmgr cert get cephadm_root_ca_cert`, `ceph orch sd dump
          cert`, or the `mgr/cephadm/cert_store.cert.cephadm_root_ca_cert`
          config-key. Without it the exporter validates against the system trust
          store, exits 1 on CERTIFICATE_VERIFY_FAILED, and Data Foundation cannot
          reconcile — its StorageCluster refuses to come up without the
          monitoring-endpoint resource. Run those commands on the seed to see
          which one this build offers.
        success_msg: >-
          The cephadm root CA is available; the exporter can verify the manager
          Prometheus endpoint instead of failing on it.

    - name: Seed the exporter trust bundle from the node trust store
      when: bootwright_exporter_monitoring_url is match('https://')
      ansible.builtin.copy:
        src: "{{ bootwright_exporter_system_ca_path }}"
        dest: "{{ bootwright_exporter_ca_path }}"
        remote_src: true
        mode: "0600"

    - name: Add the cephadm root CA to the exporter trust bundle
      when: bootwright_exporter_monitoring_url is match('https://')
      ansible.builtin.blockinfile:
        path: "{{ bootwright_exporter_ca_path }}"
        block: "{{ bootwright_exporter_ca_pem }}"
        marker: "# {mark} BOOTWRIGHT CEPHADM ROOT CA"
        mode: "0600"

    - name: Resolve the exporter command
      ansible.builtin.set_fact:
        bootwright_exporter_argv: "{{ ['python3', bootwright_exporter_path] + bootwright_exporter_args }}"

    - name: Point the exporter at the trust bundle carrying the cephadm root CA
      when: bootwright_exporter_monitoring_url is match('https://')
      ansible.builtin.set_fact:
        bootwright_exporter_argv: "{{ ['env', 'REQUESTS_CA_BUNDLE=' ~ bootwright_exporter_ca_path] + bootwright_exporter_argv }}"

    - name: Wrap the exporter in cephadm shell
      when: bootwright_exporter_use_cephadm_shell | bool
      ansible.builtin.set_fact:
        bootwright_exporter_argv: "{{ ['cephadm', 'shell', '--mount', bootwright_exporter_workdir ~ ':' ~ bootwright_exporter_workdir, '--'] + bootwright_exporter_argv }}"

    - name: Run the Rook external cluster details exporter
      ansible.builtin.command:
        argv: "{{ bootwright_exporter_argv }}"
      register: bootwright_external_details
      changed_when: true
      failed_when: false
      no_log: true

    - name: Confirm the external cluster details exporter succeeded
      ansible.builtin.assert:
        that:
          - bootwright_external_details.rc == 0
          - bootwright_external_details.stdout | default('') | length > 0
        fail_msg: >-
          The Data Foundation external-cluster exporter exited
          {{ bootwright_external_details.rc | default('unknown') }} on
          {{ bootwright_bound_cluster }}. Its stdout is withheld (it carries
          cluster credentials); stderr was:
          {{ bootwright_external_details.stderr | default('') | trim }}.
          Verify the Ceph cluster is reachable and that rbd pool
          {{ bootwright_df.rbdPoolRef }} and CephFS {{ bootwright_df.filesystemRef }}
          exist.

    - name: Remove the exporter working directory
      ansible.builtin.file:
        path: "{{ bootwright_exporter_workdir }}"
        state: absent

    - name: Capture the declared externalDetails output
      ansible.builtin.copy:
        content: "{{ bootwright_external_details.stdout }}"
        dest: "{{ bootwright_step_outputs_dir }}/external-cluster-details.json"
        mode: "0600"
      delegate_to: localhost
      become: false
      no_log: true
