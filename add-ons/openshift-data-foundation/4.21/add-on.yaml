apiVersion: bootwright.io/v1alpha1
kind: ClusterAddon
metadata:
  name: openshift-data-foundation
spec:
  type: olm

  provides:
    - dataFoundation

  accepts:
    inputs:
      - name: external-storage
        required: true
        resourceRef:
          kind: StorageExport
        effects:
          - storageExportAttachment: {}

  olm:
    namespace:
      name: openshift-storage
      create: true
      labels:
        openshift.io/cluster-monitoring: "true"
    operatorGroup:
      name: openshift-storage
      targetNamespaces:
        - openshift-storage
    subscription:
      name: odf-operator
      package: odf-operator
      channel: stable-4.21
      source: redhat-operators

  steps:
    - name: attach-external-storage
      follows: operatorReady
      requires:
        - condition:
            apiVersion: apiextensions.k8s.io/v1
            kind: CustomResourceDefinition
            name: storageclusters.ocs.openshift.io
            condition:
              type: Established
              status: "True"
      playbook: playbooks/export-external-details.yaml
      target:
        fromInput:
          input: external-storage
      run: always
      timeout: 20m
      outputs:
        - name: externalDetails
          file: external-cluster-details.json
          secret: true
          format: json
      manifests:
        - path: manifests/rook-ceph-external-cluster-details.yaml
          reclaimRendered: true
        - path: manifests/ocs-external-storagecluster.yaml

  readiness:
    timeout: 45m
    checks:
      - csvSucceeded:
          namespace: openshift-storage
          subscription: odf-operator
      - condition:
          apiVersion: ocs.openshift.io/v1
          kind: StorageCluster
          namespace: openshift-storage
          name: ocs-external-storagecluster
          condition:
            type: Available
            status: "True"
