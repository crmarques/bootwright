apiVersion: bootwright.io/v1alpha1
kind: InfraComponent
metadata:
  name: artifact-server
spec:
  type: artifactServer

  artifactServer:
    machineRef: bastion
    listeners:
      - name: https
        protocol: https
        port: 8443
    endpoints:
      - name: bmc
        listenerRef: https
        addressRef: cluster-lan
