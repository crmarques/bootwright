apiVersion: bootwright.io/v1alpha1
kind: Environment
metadata:
  name: ceph-3nodes-baremetal-managed-os
spec:
  baseDomain: bootwright.test

  infraComponents:
    nameResolution:
      - name: lab-dns
        management: managed
        componentRef: lab-dns
    artifactServers:
      - name: default
        management: managed
        componentRef: artifact-server

  defaults:
    artifactAccess:
      serverRef: default
      redfishVirtualMedia:
        endpointRef: bmc
