apiVersion: bootwright.io/v1alpha1
kind: Environment
metadata:
  name: ceph-3nodes-baremetal-managed-os
spec:
  baseDomain: bootwright.test

  infraComponents:
    nameResolution:
      - name: lab-dns
        management: managed
        componentRef: lab-dns

  secrets:
    - bastion-host-ssh:
        file: ~/.ssh/bootwright-ssh-key
    - bmc-credentials:
        generated:
          credentials:
            username: admin
    - ceph-node-ssh:
        generated:
          sshKeyPair:
            type: ed25519
            comment: bootwright-ceph-baremetal
