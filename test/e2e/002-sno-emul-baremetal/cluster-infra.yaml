apiVersion: bootwright.io/v1alpha1
kind: ClusterInfra
metadata:
  name: sno-emul-baremetal
spec:
  platform:
    type: baremetal
    baremetal:
      provisioningNetwork: disabled

  endpoints:
    api:
      address: 192.168.132.10
      source:
        type: external
    api-int:
      address: 192.168.132.10
      source:
        type: external
    apps:
      address: 192.168.132.11
      source:
        type: external

  networkBindings:
    - networkConfigRef:
        name: sno-vlan
      providerRef:
        name: rack1-baremetal-provider
      attachmentRef:
        name: sno-vlan

  components:
    machines:
      - name: master-0
        from:
          provider: rack1-baremetal-provider
          name: rack1-srv1
        networkConfig:
          ref:
            name: sno-vlan
          addresses:
            - interface: primary
              ipv4:
                - ip: 192.168.132.20
                  prefix-length: 24
        rootDeviceHints:
          deviceName: /dev/vda
