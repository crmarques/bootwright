apiVersion: bootwright.io/v1alpha1
kind: ClusterInfra
metadata:
  name: sno-emul-baremetal
spec:
  platform:
    type: baremetal
    baremetal:
      provisioningNetwork: disabled

  endpoints:
    api:
      address: 192.168.132.10
      source:
        type: external
    api-int:
      address: 192.168.132.10
      source:
        type: external
    apps:
      address: 192.168.132.11
      source:
        type: external

  artifactAccess:
    serverRef:
      name: default
    redfishVirtualMedia:
      endpointRef:
        name: bmc

  networkBindings:
    - networkConfigRef:
        name: sno-vlan
      providerRef:
        name: rack1-baremetal-provider
      attachmentRef:
        name: sno-vlan

  components:
    nodes:
      - name: master-0
        source:
          providerRef:
            name: rack1-baremetal-provider
          machineRef:
            name: rack1-srv1
        network:
          networkConfigRef:
            name: sno-vlan
          overrides:
            interfaces:
              - name: primary
                ipv4:
                  address:
                    - ip: 192.168.132.20
                      prefix-length: 24
        rootDeviceHints:
          deviceName: /dev/vda
