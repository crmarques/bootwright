apiVersion: bootwright.io/v1alpha1
kind: InfraProvider
metadata:
  name: rack1-baremetal-provider
spec:
  machines:
    - name: rack1-srv1
      baremetal:
        bootMACAddress: '52:54:00:32:11:10'
        interfaces:
          - name: primary
            macAddress: '52:54:00:32:11:10'
        rootDeviceHints:
          deviceName: /dev/vda
        bmc:
          address: REPLACE_WITH_REAL_BMC_URL_FOR_master-0
          protocol: redfish
          credentialsRef:
            name: bmc-credentials
          disableCertificateVerification: true

  networkAttachments:
    - name: sno-vlan
      baremetal:
        vlan: 0
---
apiVersion: bootwright.io/v1alpha1
kind: InfraProvider
metadata:
  name: host-services
spec: null
