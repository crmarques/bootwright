apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: rack1-srv1
spec:
  capabilities:
    - openshift-node

  substrate:
    providerRef: rack1-baremetal-provider

  os:
    install:
      rootDeviceHints:
        deviceName: /dev/vda
    provided: false

  network:
    config:
      networkConfigRef: sno-vlan
      interfaceAddresses:
        - interface: primary
          addressRef: ip
          prefixLength: 24
    interfaceBinding:
      - nicRef: primary
        interfaceName: primary

  hardware:
    nics:
      - name: primary
        macAddress: 52:54:00:32:11:10
    management:
      bmc:
        address: REPLACE_WITH_REAL_BMC_URL_FOR_master-0
        protocol: redfish
        credentialsRef: bmc-credentials
        tls:
          verify: false
    boot:
      nicRef: primary

  addresses:
    - name: ip
      address: 192.168.132.20
