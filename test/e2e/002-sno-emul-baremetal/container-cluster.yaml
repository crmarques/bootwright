apiVersion: bootwright.io/v1alpha1
kind: ContainerCluster
metadata:
  name: sno-emul-baremetal
spec:
  distribution:
    release:
      version: 4.21.15

  install:
    endpoints:
      api:
        address: 192.168.132.10
        source:
          type: external
      ingress:
        address: 192.168.132.11
        source:
          type: external
    artifactAccess:
      serverRef: default
      redfishVirtualMedia:
        endpointRef: bmc
    method: agent
    mode: connected
    nodeSSH:
      keyPairRef: sno-emul-baremetal-cluster-admin-ssh-key

  controlPlane:
    name: master
    replicas: 1

  compute:
    - name: worker
      replicas: 0

  nodes:
    - hostname: master-0
      role: master
      machineRef: rack1-srv1
