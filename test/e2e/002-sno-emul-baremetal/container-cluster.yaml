apiVersion: bootwright.io/v1alpha1
kind: ContainerCluster
metadata:
  name: sno-emul-baremetal
spec:
  distribution:
    release:
      version: 4.21.15

  install:
    endpoints:
      api:
        address: 192.168.132.10
        source:
          type: external
      ingress:
        address: 192.168.132.11
        source:
          type: external
    agent:
      redfishVirtualMedia:
        artifactServerEndpoint:
          endpointRef: bmc
    method: agent
    mode: connected
    nodeSSH:
      keyPairRef: sno-emul-baremetal-cluster-admin-ssh-key

  controlPlane:
    replicas: 1

  compute:
    - replicas: 0

  hosts:
    - hostname: master-0
      role: master
      machineRef: rack1-srv1
