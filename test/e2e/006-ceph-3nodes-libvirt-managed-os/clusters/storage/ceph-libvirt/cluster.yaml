apiVersion: bootwright.io/v1alpha1
kind: StorageCluster
metadata:
  name: ceph-libvirt
spec:
  type: ceph

  management: managed

  ceph:
    distribution: oss
    community:
      # Bootwright configures the upstream community Ceph repo on each node with
      # cephadm. Pin the release here; omit for the latest stable default. Set
      # community.mirror to point at an internal mirror of download.ceph.com.
      # cephadm's add-repo also enables EPEL, so on these unregistered managed
      # RHEL nodes Bootwright pre-installs epel-release from dl.fedoraproject.org.
      release: squid
    cephadm:
      addressRef:
        name: ssh
      bootstrap:
        seedNode: ceph-0
        monIP:
          nodeRef:
            name: ceph-0
    networks:
      publicCIDRs:
        - 192.168.134.0/24
      clusterCIDRs:
        - 192.168.134.0/24
    topology:
      nodes:
        - name: ceph-0
          site: lab
          roles:
            - mon
            - mgr
            - osd
            - mds
            - rgw
            - ingress
          devices:
            - /dev/vdb
            - /dev/vdc
          machineRef:
            name: ceph-0
        - name: ceph-1
          site: lab
          roles:
            - mon
            - mgr
            - osd
            - mds
            - rgw
            - ingress
          devices:
            - /dev/vdb
            - /dev/vdc
          machineRef:
            name: ceph-1
        - name: ceph-2
          site: lab
          roles:
            - mon
            - mgr
            - osd
            - mds
            - rgw
            - ingress
          devices:
            - /dev/vdb
            - /dev/vdc
          machineRef:
            name: ceph-2
