apiVersion: bootwright.io/v1alpha1
kind: StorageCluster
metadata:
  name: ceph-libvirt
spec:
  type: ceph

  management: managed

  ceph:
    distribution: oss
    release: squid
    cephadm:
      clusterSSH:
        keyRef: ceph-node-ssh
      bootstrap:
        node: node01
    networks:
      publicCIDRs:
        - 192.168.134.0/24
      clusterCIDRs:
        - 192.168.134.0/24
    topology:
      nodes:
        - name: node01
          machineRef: ceph-0
          roles:
            - mon
            - mgr
            - osd
            - mds
            - rgw
            - ingress
          devices:
            - /dev/vdb
            - /dev/vdc
        - name: node02
          machineRef: ceph-1
          roles:
            - mon
            - mgr
            - osd
            - mds
            - rgw
            - ingress
          devices:
            - /dev/vdb
            - /dev/vdc
        - name: node03
          machineRef: ceph-2
          roles:
            - mon
            - mgr
            - osd
            - mds
            - rgw
            - ingress
          devices:
            - /dev/vdb
            - /dev/vdc
