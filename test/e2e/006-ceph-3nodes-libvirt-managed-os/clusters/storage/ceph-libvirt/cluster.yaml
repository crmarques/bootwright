apiVersion: bootwright.io/v1alpha1
kind: StorageCluster
metadata:
  name: ceph-libvirt
spec:
  type: ceph

  management: managed

  ceph:
    distribution: oss
    # Pin the Ceph release here; a name (squid) tracks the latest stable, while a
    # full x.y.z (e.g. 19.2.1) makes the run reproducible and derives the matching
    # quay.io/ceph/ceph image. Set spec.ceph.image to pin an exact tag or digest.
    # Bootwright configures the upstream community Ceph repo on each node with
    # cephadm; cephadm's add-repo also enables EPEL, so on these unregistered
    # managed RHEL nodes Bootwright pre-installs epel-release from
    # dl.fedoraproject.org. Set community.mirror to an internal download.ceph.com
    # mirror for disconnected sites.
    release: squid
    cephadm:
      addressRef: ssh
      bootstrap:
        seedNode: ceph-0
        monIP:
          nodeRef: ceph-0
    networks:
      publicCIDRs:
        - 192.168.134.0/24
      clusterCIDRs:
        - 192.168.134.0/24
    topology:
      nodes:
        - name: ceph-0
          site: lab
          roles:
            - mon
            - mgr
            - osd
            - mds
            - rgw
            - ingress
          devices:
            - /dev/vdb
            - /dev/vdc
          machineRef: ceph-0
        - name: ceph-1
          site: lab
          roles:
            - mon
            - mgr
            - osd
            - mds
            - rgw
            - ingress
          devices:
            - /dev/vdb
            - /dev/vdc
          machineRef: ceph-1
        - name: ceph-2
          site: lab
          roles:
            - mon
            - mgr
            - osd
            - mds
            - rgw
            - ingress
          devices:
            - /dev/vdb
            - /dev/vdc
          machineRef: ceph-2
