apiVersion: bootwright.io/v1alpha1
kind: StorageFilesystem
metadata:
  name: cephfs
spec:
  storageClusterRef: ceph-libvirt

  cephfs:
    metadataPoolRef: cephfs-meta
    dataPoolRefs:
      - name: cephfs-data
        default: true
    mds:
      activeCount: 2
      placement:
        hosts:
          - node01
          - node02
          - node03
        countPerHost: 1
