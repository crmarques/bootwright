apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: lab-host
spec:
  capabilities:
    - container-runtime
    - libvirt

  os:
    provided: true

  addresses:
    - name: ssh
      address: localhost
    - name: cluster-lan
      address: 192.168.134.1

  access:
    ssh:
      keyRef:
        name: bastion-host-ssh
      addressRef:
        name: ssh
