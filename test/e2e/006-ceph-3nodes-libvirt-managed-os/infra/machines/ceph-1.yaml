apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: ceph-1
spec:
  capabilities:
    - ceph-node

  substrate:
    providerRef:
      name: lab-libvirt-provider
    profileRef:
      name: ceph-node

  os:
    install:
      rootDeviceHints:
        deviceName: /dev/vda
    provided: false
    installProfileRef:
      name: rhel-9-ceph-node

  network:
    config:
      networkConfigRef:
        name: ceph-bridge
      attachmentRef:
        name: ceph-bridge
      interfaceAddresses:
        - interface: primary
          addressRef:
            name: ssh
          prefixLength: 24

  addresses:
    - name: ssh
      address: 192.168.134.21

  access:
    ssh:
      user: root
      keyRef:
        name: ceph-node-ssh
      addressRef:
        name: ssh
