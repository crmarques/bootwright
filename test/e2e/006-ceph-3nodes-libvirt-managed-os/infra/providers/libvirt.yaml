apiVersion: bootwright.io/v1alpha1
kind: InfraProvider
metadata:
  name: lab-libvirt-provider
spec:
  type: libvirt

  libvirt:
    machineRef:
      name: lab-host
    uri: qemu:///system
    bmcEmulationDefaults:
      enabled: true
      protocol: redfish
      auth:
        credentialRef:
          name: bmc-credentials
    machineProfiles:
      - name: ceph-node
        cpu: 2
        memoryMiB: 6144
        diskGiB: 40
        dataDisks:
          - name: osd0
            sizeGiB: 40
          - name: osd1
            sizeGiB: 40

  networkAttachments:
    - name: ceph-bridge
      libvirt:
        bridge: vbr-cb-ceph
