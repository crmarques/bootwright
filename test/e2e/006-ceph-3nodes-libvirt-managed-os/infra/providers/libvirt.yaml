apiVersion: bootwright.io/v1alpha1
kind: InfraProvider
metadata:
  name: lab-libvirt-provider
spec:
  type: libvirt

  libvirt:
    machineRef:
      name: bastion
    uri: qemu:///system
    bmcEmulationDefaults:
      enabled: true
      protocol: redfish
      auth:
        credentialRef:
          name: bmc-credentials
    machineProfiles:
      - name: ceph-node
        cpu: 1
        memoryMiB: 2048
        diskGiB: 16
        dataDisks:
          - name: osd0
            sizeGiB: 1
          - name: osd1
            sizeGiB: 1

  networkAttachments:
    - name: ceph-bridge
      libvirt:
        bridge: vbr-cb-ceph
