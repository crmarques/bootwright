apiVersion: bootwright.io/v1alpha1
kind: MachineInstallProfile
metadata:
  name: rhel-9-ceph-node
spec:
  os:
    family: rhel
    version: "9"
    architecture: x86_64

  installer:
    type: anaconda
    anaconda:
      imageRef:
        name: rhel-9-x86-64-dvd

  customizations:
    hostname:
      source: machineName
    ssh:
      authorizeMachineSSHKey: true
      passwordAuthentication: false
    storage:
      rootDevice:
        source: machineRootDeviceHints
      wipe: true
    packages:
      - chrony
      - firewalld
      - lvm2
      - podman
    services:
      enabled:
        - chronyd
        - sshd
