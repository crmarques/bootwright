apiVersion: bootwright.io/v1alpha1
kind: MachineInstallProfile
metadata:
  name: rhel-9-ceph-node
spec:
  os:
    family: rhel
    version: "9"
    architecture: x86_64

  installer:
    anaconda:
      imageRef: rhel-9-x86-64-dvd

  customizations:
    localization:
      formats: pt_BR.UTF-8
      keyboard: br-abnt2
      timezone: America/Sao_Paulo
    ssh:
      authorizeMachineSSHKey: true
      passwordAuthentication: false
    storage:
      rootDevice:
        source: machineRootDeviceHints
    packages:
      environment: minimal
      installWeakDeps: false
      excludeDocs: true
      install:
        - podman
        - lvm2
        - chrony
        - firewalld
    services:
      enabled:
        - sshd
        - chronyd
        - firewalld
      disabled:
        - avahi-daemon
        - cockpit.socket
        - cups
        - kdump
        - postfix
    security:
      selinux:
        mode: enforcing
      firewall:
        enabled: true
