apiVersion: bootwright.io/v1alpha1
kind: Secret
metadata:
  name: bastion-host-ssh
spec:
  type: sshKeyPair

  source:
    file:
      privateKey: ~/.ssh/bootwright-ssh-key
---
apiVersion: bootwright.io/v1alpha1
kind: Secret
metadata:
  name: vcenter-credentials
spec:
  type: usernamePassword

  source:
    generated:
      username: administrator@vsphere.local
---
apiVersion: bootwright.io/v1alpha1
kind: Secret
metadata:
  name: ceph-node-ssh
spec:
  type: sshKeyPair

  source:
    generated:
      keyType: ed25519
      comment: bootwright-ceph-vsphere
