apiVersion: bootwright.io/v1alpha1
kind: StorageCluster
metadata:
  name: ceph-vsphere
spec:
  type: ceph

  management: managed

  ceph:
    distribution: oss
    release: squid
    cephadm:
      bootstrap:
        host: node01
    networks:
      publicCIDRs:
        - 192.168.142.0/24
      clusterCIDRs:
        - 192.168.142.0/24
    topology:
      hosts:
        - machineRef: ceph-0
          site: lab
          roles:
            - mon
            - mgr
            - osd
            - mds
            - rgw
            - ingress
          devices:
            - /dev/sdb
            - /dev/sdc
        - machineRef: ceph-1
          site: lab
          roles:
            - mon
            - mgr
            - osd
            - mds
            - rgw
            - ingress
          devices:
            - /dev/sdb
            - /dev/sdc
        - machineRef: ceph-2
          site: lab
          roles:
            - mon
            - mgr
            - osd
            - mds
            - rgw
            - ingress
          devices:
            - /dev/sdb
            - /dev/sdc
