apiVersion: bootwright.io/v1alpha1
kind: NetworkConfig
metadata:
  name: machine-net
spec:
  machineNetwork:
    - cidr: 192.168.140.0/24

  nameResolutionRefs:
    - default

  template:
    networkConfig:
      interfaces:
        - name: primary
          type: ethernet
          state: up
          ipv4:
            enabled: true
            dhcp: false
          ipv6:
            enabled: false
      routes:
        config:
          - destination: 0.0.0.0/0
            next-hop-address: 192.168.140.1
            next-hop-interface: primary
            table-id: 254
