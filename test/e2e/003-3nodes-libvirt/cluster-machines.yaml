apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: master-0
spec:
  capabilities:
    - openshift-node

  substrate:
    providerRef:
      name: lab-libvirt-provider
    libvirt:
      profileRef:
        name: compact-control-plane

  os:
    mode: raw
    install:
      network:
        networkConfigRef:
          name: cluster-3n-bridge
        attachmentRef:
          name: cluster-3n-bridge
        overrides:
          interfaces:
            - name: primary
              ipv4:
                address:
                  - ip: 192.168.133.20
                    prefix-length: 24
      rootDeviceHints:
        deviceName: /dev/vda
---
