apiVersion: bootwright.io/v1alpha1
kind: ClusterInfra
metadata:
  name: 3-nodes-ocp-libvirt
spec:
  platform:
    type: baremetal
    baremetal:
      provisioningNetwork: disabled

  endpoints:
    api:
      source:
        type: infraComponent
        componentRef:
          name: load-balancer
        bindAddress: control-plane
    api-int:
      source:
        type: infraComponent
        componentRef:
          name: load-balancer
        bindAddress: control-plane
    apps:
      source:
        type: infraComponent
        componentRef:
          name: load-balancer
        bindAddress: apps

  networkBindings:
    - networkConfigRef:
        name: cluster-3n-bridge
      providerRef:
        name: lab-libvirt-provider
      attachmentRef:
        name: cluster-3n-bridge

  components:
    machines:
      - name: master-0
        from:
          provider: lab-libvirt-provider
          profile: compact-control-plane
        networkConfig:
          ref:
            name: cluster-3n-bridge
          overrides:
            interfaces:
              - name: primary
                ipv4:
                  address:
                    - ip: 192.168.133.20
                      prefix-length: 24
        rootDeviceHints:
          deviceName: /dev/vda
      - name: master-1
        from:
          provider: lab-libvirt-provider
          profile: compact-control-plane
        networkConfig:
          ref:
            name: cluster-3n-bridge
          overrides:
            interfaces:
              - name: primary
                ipv4:
                  address:
                    - ip: 192.168.133.21
                      prefix-length: 24
        rootDeviceHints:
          deviceName: /dev/vda
      - name: master-2
        from:
          provider: lab-libvirt-provider
          profile: compact-control-plane
        networkConfig:
          ref:
            name: cluster-3n-bridge
          overrides:
            interfaces:
              - name: primary
                ipv4:
                  address:
                    - ip: 192.168.133.22
                      prefix-length: 24
        rootDeviceHints:
          deviceName: /dev/vda
