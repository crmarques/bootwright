apiVersion: bootwright.io/v1alpha1
kind: Environment
metadata:
  name: 3-nodes-ocp-libvirt
spec:
  baseDomain: bootwright.test

  secrets:
    - openshift-pull-secret
    - 3-nodes-ocp-libvirt-cluster-admin-ssh-key:
        generated:
          sshKeyPair:
            type: ed25519
            comment: bootwright-3-nodes-ocp-libvirt-cluster-admin
    - provider-host-ssh:
        file: ~/.ssh/bootwright-ssh-key
    - provider-host-known-hosts
    - bmc-credentials:
        generated:
          credentials:
            username: admin
    - proxy-credentials:
        generated:
          credentials:
            username: proxy

  infraComponents:
    proxies:
      - name: default
        type: managed
        componentRef:
          name: proxy
    nameResolution:
      - name: default
        type: managed
        componentRef:
          name: name-resolution

  proxyFor:
    bootwright: default
    containerClusterInstall: default
