apiVersion: bootwright.io/v1alpha1
kind: InfraProvider
metadata:
  name: lab-libvirt-provider
spec:
  type: libvirt

  libvirt:
    machineRef:
      name: lab-host
    uri: qemu:///system
    bmcEmulationDefaults:
      enabled: true
      protocol: redfish
      auth:
        credentialRef:
          name: bmc-credentials
    machineProfiles:
      - name: compact-control-plane
        cpu: 4
        memoryMiB: 16384
        diskGiB: 120

  networkAttachments:
    - name: cluster-3n-bridge
      libvirt:
        bridge: vbr-cb-3n
