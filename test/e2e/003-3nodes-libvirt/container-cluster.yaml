apiVersion: bootwright.io/v1alpha1
kind: ContainerCluster
metadata:
  name: 3-nodes-ocp-libvirt
spec:
  distribution:
    release:
      version: 4.21.15

  install:
    endpoints:
      api:
        source:
          type: infraComponent
          componentRef: load-balancer
          bindAddressRef: control-plane
      ingress:
        source:
          type: infraComponent
          componentRef: load-balancer
          bindAddressRef: apps
    method: agent
    mode: connected
    nodeSSH:
      keyPairRef: 3-nodes-ocp-libvirt-cluster-admin-ssh-key

  controlPlane:
    name: master
    replicas: 3

  compute:
    - name: worker
      replicas: 0

  hosts:
    - hostname: master-0
      role: master
      machineRef: master-0
    - hostname: master-1
      role: master
      machineRef: master-1
    - hostname: master-2
      role: master
      machineRef: master-2
