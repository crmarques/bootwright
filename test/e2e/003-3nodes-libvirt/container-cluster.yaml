apiVersion: bootwright.io/v1alpha1
kind: ContainerCluster
metadata:
  name: 3-nodes-ocp-libvirt
spec:
  distribution:
    release:
      version: 4.21.15

  install:
    endpoints:
      api:
        source:
          type: infraComponent
          componentRef:
            name: load-balancer
          bindAddress: control-plane
      ingress:
        source:
          type: infraComponent
          componentRef:
            name: load-balancer
          bindAddress: apps
    method: agent
    mode: connected
    nodeSSH:
      keyPairRef:
        name: 3-nodes-ocp-libvirt-cluster-admin-ssh-key

  controlPlane:
    name: master
    replicas: 3

  compute:
    - name: worker
      replicas: 0

  nodes:
    - hostname: master-0
      role: master
      machineRef:
        name: master-0
    - hostname: master-1
      role: master
      machineRef:
        name: master-1
    - hostname: master-2
      role: master
      machineRef:
        name: master-2
