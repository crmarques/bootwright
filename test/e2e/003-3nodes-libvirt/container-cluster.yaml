apiVersion: bootwright.io/v1alpha1
kind: ContainerCluster
metadata:
  name: 3-nodes-ocp-libvirt
spec:
  distribution:
    type: openshift
    release:
      version: 4.21.15

  install:
    endpointRefs:
      api:
        name: api
      apiInt:
        name: api-int
      ingress:
        name: apps
    method: agent
    mode: connected
    nodeSSH:
      keyPairRef:
        name: 3-nodes-ocp-libvirt-cluster-admin-ssh-key

  controlPlane:
    name: master
    replicas: 3

  compute:
    - name: worker
      replicas: 0

  networking:
    clusterNetwork:
      - cidr: 10.128.0.0/14
        hostPrefix: 23
    serviceNetwork:
      - 172.30.0.0/16

  nodes:
    - hostname: master-0
      role: master
      machineRef:
        clusterInfra: 3-nodes-ocp-libvirt
        name: master-0
    - hostname: master-1
      role: master
      machineRef:
        clusterInfra: 3-nodes-ocp-libvirt
        name: master-1
    - hostname: master-2
      role: master
      machineRef:
        clusterInfra: 3-nodes-ocp-libvirt
        name: master-2
