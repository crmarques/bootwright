apiVersion: bootwright.io/v1alpha1
kind: Host
metadata:
  name: lab-host
spec:
  addresses:
    - name: ssh
      address: localhost
    - name: cluster-lan
      address: 192.168.133.1

  ssh:
    addressName: ssh
    keyRef:
      name: provider-host-ssh
    knownHostsRef:
      name: provider-host-known-hosts

  capabilities:
    - libvirt
    - container-runtime
