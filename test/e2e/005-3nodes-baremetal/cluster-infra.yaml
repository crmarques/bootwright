apiVersion: bootwright.io/v1alpha1
kind: ClusterInfra
metadata:
  name: 3-nodes-ocp-baremetal
spec:
  platform:
    type: baremetal
    baremetal:
      provisioningNetwork: disabled

  endpoints:
    api:
      address: 192.168.140.10
    api-int:
      address: 192.168.140.10
    apps:
      address: 192.168.140.11

  artifactAccess:
    serverRef:
      name: default
    redfishVirtualMedia:
      endpointRef:
        name: bmc

  networkBindings:
    - networkConfigRef:
        name: rack1-bond140-machine
      providerRef:
        name: rack1-baremetal-provider
      attachmentRef:
        name: rack1-bond140-machine

  components:
    nodes:
      - name: master-0
        source:
          providerRef:
            name: rack1-baremetal-provider
          machineRef:
            name: rack1-srv1
        network:
          networkConfigRef:
            name: rack1-bond140-machine
          overrides:
            interfaces:
              - name: bond0.140
                ipv4:
                  address:
                    - ip: 192.168.140.20
                      prefix-length: 24
      - name: master-1
        source:
          providerRef:
            name: rack1-baremetal-provider
          machineRef:
            name: rack1-srv2
        network:
          networkConfigRef:
            name: rack1-bond140-machine
          overrides:
            interfaces:
              - name: bond0.140
                ipv4:
                  address:
                    - ip: 192.168.140.21
                      prefix-length: 24
      - name: master-2
        source:
          providerRef:
            name: rack1-baremetal-provider
          machineRef:
            name: rack1-srv3
        network:
          networkConfigRef:
            name: rack1-bond140-machine
          overrides:
            interfaces:
              - name: bond0.140
                ipv4:
                  address:
                    - ip: 192.168.140.22
                      prefix-length: 24
