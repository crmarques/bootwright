apiVersion: bootwright.io/v1alpha1
kind: ClusterInfra
metadata:
  name: 3-nodes-ocp-baremetal
spec:
  platform:
    type: baremetal
    baremetal:
      provisioningNetwork: disabled

  endpoints:
    api:
      address: 192.168.140.10
    api-int:
      address: 192.168.140.10
    apps:
      address: 192.168.140.11

  networkBindings:
    - networkConfigRef:
        name: rack1-bond140-machine
      providerRef:
        name: rack1-baremetal-provider
      attachmentRef:
        name: rack1-bond140-machine

  components:
    machines:
      - name: master-0
        from:
          provider: rack1-baremetal-provider
          name: rack1-srv1
        networkConfig:
          ref:
            name: rack1-bond140-machine
          addresses:
            - interface: bond0.140
              ipv4:
                - ip: 192.168.140.20
                  prefix-length: 24
      - name: master-1
        from:
          provider: rack1-baremetal-provider
          name: rack1-srv2
        networkConfig:
          ref:
            name: rack1-bond140-machine
          addresses:
            - interface: bond0.140
              ipv4:
                - ip: 192.168.140.21
                  prefix-length: 24
      - name: master-2
        from:
          provider: rack1-baremetal-provider
          name: rack1-srv3
        networkConfig:
          ref:
            name: rack1-bond140-machine
          addresses:
            - interface: bond0.140
              ipv4:
                - ip: 192.168.140.22
                  prefix-length: 24
