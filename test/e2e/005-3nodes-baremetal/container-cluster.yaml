apiVersion: bootwright.io/v1alpha1
kind: ContainerCluster
metadata:
  name: 3-nodes-ocp-baremetal
spec:
  distribution:
    release:
      version: 4.21.15

  install:
    endpoints:
      api:
        address: 192.168.140.10
        source:
          type: external
      ingress:
        address: 192.168.140.11
        source:
          type: external
    agent:
      redfishVirtualMedia:
        artifactServerEndpoint:
          endpointRef: bmc
    method: agent
    mode: connected
    nodeSSH:
      keyPairRef: 3-nodes-ocp-baremetal-cluster-admin-ssh-key

  controlPlane:
    replicas: 3

  compute:
    - replicas: 0

  hosts:
    - hostname: master-0
      role: master
      machineRef: rack1-srv1
    - hostname: master-1
      role: master
      machineRef: rack1-srv2
    - hostname: master-2
      role: master
      machineRef: rack1-srv3
