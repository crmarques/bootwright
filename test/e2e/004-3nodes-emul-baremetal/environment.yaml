apiVersion: bootwright.io/v1alpha1
kind: Environment
metadata:
  name: 3-nodes-ocp-emul-baremetal
spec:
  baseDomain: bootwright.test

  secrets:
    - openshift-pull-secret
    - cluster-admin-ssh-key:
        generated:
          sshKeyPair:
            type: ed25519
            comment: bootwright-cluster-admin
    - provider-host-ssh:
        file: ~/.ssh/bootwright-ssh-key
    - bmc-credentials:
        generated:
          credentials:
            username: admin
    - proxy-credentials:
        generated:
          credentials:
            username: proxy

  infraComponents:
    artifactServers:
      - name: default
        type: managed
        componentRef:
          name: artifact-server
        routes:
          redfishVirtualMedia:
            endpoint: bmc
    proxies:
      - name: default
        type: external
        connection:
          httpProxy: http://192.168.133.1:3128
          httpsProxy: http://192.168.133.1:3128
          noProxy:
            - 192.168.133.0/24
          auth:
            proxyAuthRef:
              name: proxy-credentials

  proxyFor:
    bootwright: default
    containerClusterInstall: default
