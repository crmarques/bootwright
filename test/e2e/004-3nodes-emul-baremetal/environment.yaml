apiVersion: bootwright.io/v1alpha1
kind: Environment
metadata:
  name: 3-nodes-ocp-emul-baremetal
spec:
  baseDomain: bootwright.test

  defaults:
    artifactServerRef: default

  infraComponents:
    artifactServers:
      - name: default
        management: managed
        componentRef: artifact-server
    proxies:
      - name: default
        management: external
        connection:
          httpProxy: http://192.168.133.1:3128
          httpsProxy: http://192.168.133.1:3128
          noProxy:
            - 192.168.133.0/24
          auth:
            proxyAuthRef: proxy-credentials

  proxyFor:
    bootwright: default
    containerClusterInstall: default
