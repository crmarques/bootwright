apiVersion: bootwright.io/v1alpha1
kind: ClusterInfra
metadata:
  name: 3-nodes-ocp-emul-baremetal
spec:
  platform:
    type: baremetal
    baremetal:
      provisioningNetwork: disabled

  endpoints:
    api:
      address: 192.168.133.10
      source:
        type: external
    api-int:
      address: 192.168.133.10
      source:
        type: external
    apps:
      address: 192.168.133.11
      source:
        type: external

  networkBindings:
    - networkConfigRef:
        name: rack1-vlan
      providerRef:
        name: rack1-baremetal-provider
      attachmentRef:
        name: rack1-vlan

  components:
    machines:
      - name: master-0
        from:
          provider: rack1-baremetal-provider
          name: rack1-srv1
        networkConfig:
          ref:
            name: rack1-vlan
          overrides:
            interfaces:
              - name: primary
                ipv4:
                  address:
                    - ip: 192.168.133.20
                      prefix-length: 24
      - name: master-1
        from:
          provider: rack1-baremetal-provider
          name: rack1-srv2
        networkConfig:
          ref:
            name: rack1-vlan
          overrides:
            interfaces:
              - name: primary
                ipv4:
                  address:
                    - ip: 192.168.133.21
                      prefix-length: 24
      - name: master-2
        from:
          provider: rack1-baremetal-provider
          name: rack1-srv3
        networkConfig:
          ref:
            name: rack1-vlan
          overrides:
            interfaces:
              - name: primary
                ipv4:
                  address:
                    - ip: 192.168.133.22
                      prefix-length: 24
