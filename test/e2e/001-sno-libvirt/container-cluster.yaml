apiVersion: bootwright.io/v1alpha1
kind: ContainerCluster
metadata:
  name: sno-libvirt
spec:
  distribution:
    release:
      version: 4.21.15

  install:
    endpoints:
      api:
        source:
          type: infraComponent
          componentRef: load-balancer
          bindAddressRef: control-plane
      ingress:
        source:
          type: infraComponent
          componentRef: load-balancer
          bindAddressRef: apps
    method: agent
    mode: connected
    nodeSSH:
      keyPairRef: sno-libvirt-cluster-admin-ssh-key

  controlPlane:
    replicas: 1

  compute:
    - replicas: 0

  nodes:
    - name: master-0
      role: master
      machineRef: master-0
