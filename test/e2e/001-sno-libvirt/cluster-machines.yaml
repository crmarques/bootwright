apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: master-0
spec:
  capabilities:
    - openshift-node

  substrate:
    providerRef:
      name: lab-libvirt-provider
    profileRef:
      name: sno

  os:
    install:
      rootDeviceHints:
        deviceName: /dev/vda
    provided: false

  network:
    config:
      networkConfigRef:
        name: sno-bridge
      attachmentRef:
        name: sno-bridge
      interfaceAddresses:
        - interface: primary
          addressRef:
            name: ip
          prefixLength: 24

  addresses:
    - name: ip
      address: 192.168.132.20
