apiVersion: bootwright.io/v1alpha1
kind: Machine
metadata:
  name: master-0
spec:
  capabilities:
    - openshift-node

  substrate:
    providerRef:
      name: lab-libvirt-provider
    profileRef:
      name: sno

  os:
    install:
      rootDeviceHints:
        deviceName: /dev/vda
    provided: false

  network:
    config:
      networkConfigRef:
        name: sno-bridge
      attachmentRef:
        name: sno-bridge
      overrides:
        interfaces:
          - name: primary
            ipv4:
              address:
                - ip: 192.168.132.20
                  prefix-length: 24

  addresses:
    - name: ip
      address: 192.168.132.20
