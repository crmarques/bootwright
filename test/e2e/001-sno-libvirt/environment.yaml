apiVersion: bootwright.io/v1alpha1
kind: Environment
metadata:
  name: sno-libvirt
spec:
  baseDomain: bootwright.test

  secrets:
    openshift-pull-secret: null
    cluster-admin-pub-key:
      file: ~/.ssh/bootwright-ssh-key.pub
    provider-host-ssh:
      file: ~/.ssh/bootwright-ssh-key
    bmc-credentials:
      generated:
        credentials:
          username: admin
    proxy-credentials:
      generated:
        credentials:
          username: proxy

  infraComponents:
    nameResolution:
      - name: default
        default: true
        type: managed
        componentRef:
          name: name-resolution
