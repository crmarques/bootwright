apiVersion: bootwright.io/v1alpha1
kind: InfraComponent
metadata:
  name: load-balancer
spec:
  type: loadBalancer

  loadBalancer:
    implementation: haproxy
    machineRef: bastion
    bindAddresses:
      - name: control-plane
        address: 192.168.132.10
      - name: apps
        address: 192.168.132.11
---
apiVersion: bootwright.io/v1alpha1
kind: InfraComponent
metadata:
  name: proxy
spec:
  type: proxy

  proxy:
    implementation: squid
    machineRef: bastion
    bindAddress: 0.0.0.0
    port: 3128
---
apiVersion: bootwright.io/v1alpha1
kind: InfraComponent
metadata:
  name: name-resolution
spec:
  type: nameResolution

  nameResolution:
    implementation: dnsmasq
    machineRef: bastion
    bindAddress: 192.168.132.1
    port: 53
    # The node's only resolver is this dnsmasq (networks.yaml points DNS at
    # 192.168.132.1), and dnsmasq runs `no-resolv`, so it must forward non-lab
    # names upstream for the node to reach the release registry (quay.io).
    forwarders:
      - 1.1.1.1
      - 9.9.9.9
    additionalIngressHosts:
      - console-openshift-console.apps.sno-libvirt.bootwright.test
      - oauth-openshift.apps.sno-libvirt.bootwright.test
---
apiVersion: bootwright.io/v1alpha1
kind: InfraComponent
metadata:
  name: ntp-server
spec:
  type: ntp

  ntp:
    implementation: chrony
    machineRef: bastion
    bindAddress: 192.168.132.1
    port: 123
    endpoints:
      - name: cluster
        addressRef: cluster-lan
    upstreamSources:
      - time.bootwright.test
