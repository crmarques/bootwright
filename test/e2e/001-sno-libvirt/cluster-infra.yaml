apiVersion: bootwright.io/v1alpha1
kind: ClusterInfra
metadata:
  name: sno-libvirt
spec:
  platform:
    type: baremetal
    baremetal:
      provisioningNetwork: disabled

  endpoints:
    api:
      source:
        type: infraComponent
        componentRef:
          name: load-balancer
        bindAddress: control-plane
    api-int:
      source:
        type: infraComponent
        componentRef:
          name: load-balancer
        bindAddress: control-plane
    apps:
      source:
        type: infraComponent
        componentRef:
          name: load-balancer
        bindAddress: apps

  networkBindings:
    - networkConfigRef:
        name: sno-bridge
      providerRef:
        name: lab-libvirt-provider
      attachmentRef:
        name: sno-bridge

  components:
    machines:
      - name: master-0
        from:
          provider: lab-libvirt-provider
          profile: sno
        networkConfig:
          ref:
            name: sno-bridge
          overrides:
            interfaces:
              - name: primary
                ipv4:
                  address:
                    - ip: 192.168.132.20
                      prefix-length: 24
        rootDeviceHints:
          deviceName: /dev/vda
