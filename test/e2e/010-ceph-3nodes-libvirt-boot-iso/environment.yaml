apiVersion: bootwright.io/v1alpha1
kind: Environment
metadata:
  name: ceph-3nodes-libvirt-managed-os
spec:
  domains:
    base: bootwright.test

  machineAccess:
    keyRef: bootwright-machine-key

  storageClusters:
    - ceph-libvirt

  infraComponents:
    nameResolution:
      - name: lab-dns
        management: managed
        componentRef: lab-dns
